  md: "# Chapter 4: Namespaces\n\nNamespace declaration is done through attributes\
    \ with the prefix xmlns followed by the prefix. In Listing 4.6, two prefixes are\
    \ declared: qa and pa. The attribute xmlns declares the default namespace—that\
    \ is, the namespace for those elements that have no attributes.\n\nIn summary,\
    \ XML namespaces is a mechanism to unambiguously identify who has developed which\
    \ element. It's not much but it is an essential service.\n\n# The Namespace Name\n\
    \nThe namespace name is the URI, not the prefix. When an XML application compares\
    \ two elements, it uses the URI, not the prefix, to recognize them namespaces.\n\
    \nTherefore, in Listing 4.7 rff:name and ref:name are considered identical even\
    \ though they have a different prefix. Both are in the namespace http://catwoman.applesoft.com/ref/1.5.\n\
    \n+   Listing 4.7: One Namespace, Two Prefixes\n\n```\n<?xml version=\"1.0\" standalone=\"\
    yes\"?>\n<references>\n xmlns:rff=\"http://catwoman.applesoft.com/ref/1.5\">\n\
    \ MacMillan</<ref:name>\n <link href=\"http://www.mcp.com/\"/>\n</ref:name>\n\
    \ xmlns:ref=\"http://catwoman.applesoft.com/ref/1.5\">\n Applesoft Link</ref:name>\n\
    \ <link href=\"http://www.applesoft.com/newsletter*\"/>\n</references>\n```\n\n\
    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_131_0.png)\n\n# URIs\n\nThe namespace\
    \ declaration associates a global naming system (the URIs) to the name of the\
    \ elements.\n\nThe URI is only used to ensure uniqueness of names. It (might but\
    \ not need) point to a description of the name. For example, there might be a\
    \ document at http://penguin.xli.com/review/1.0 that describes the rating or there\
    \ be nothing.\n\nHowever, it is important that URIs are unique. The easiest solution\
    \ is to create URLs based on your own domain name."
  merge: -1
  pgno: 131
- img_proc: true
  md: '# CAUTION


    For namespaces, two URIs are identical only if they are identical character-by-character.

    According to this definition, the following two URLs are not identical, even though
    they point to the same document:


    ```

    http://www.mcp.com

    http://www.MCP.com

    ```


    # What''s in a Name?


    URLs are of the form:


    ```

    http://www.mcp.com

    http://www.pineapplesoft.com/newsletter

    ftp://ftp.mcp.com

    news://news.psol.com/comp.xml

    mailto:bmarchal@pineapplesoft.com

    ```


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_132_0.png)


    The domain name is just a part of: "mcp.com" and "pineapplesoft.com" in the examples.


    The domain name is registered with a global authority to ensure there is no duplicate.
    Because of the global registration, one cannot do what one wants with domain names.
    For example, it is not possible to register names that are already in use.


    Conversely, organizations control the URLs based on their domains. One is free
    to create any syntactically correct URL based on one''s own domain name. For example,
    Pineapples, my company, owns the pineapplesoft.com domain and it can create any
    URL derived from it.


    The very last part of the domain name (".com" in this case) is known as the Top-Level
    Domain (TLD in short). The TLD identifies the authority that assigned the domain
    name.


    InterNIC (www.internic.net) is the authority for most-generic TLDs: ".com" (commercial),
    ".net" (ISPs), ".org" (nonprofit). They are generic because they operate to organizations
    (or individuals) worldwide.


    There are also country-specific TLDs. Belgian organizations can register in the
    ".be" TLD, American ones in the "us" TLD, Canadian ones in ".ca", Japanese ones
    in ".jp", and so on. Of course, Belgian, American, Canadian, and Japanese organizations
    also can register in the generic TLDs.


    URLs provide a good balance of flexibility and control for namespaces. The control
    is derived from the domain names, which are guaranteed to be unique. The flexibility
    comes because organizations rule in their own domains.'
