  md: '# Chapter 2: The XML Syntax


    At first sight, processing instruction is at odds with the XML concept that processing
    is always derived from the structure. As we saw in the first chapter, with SGML
    and XML, processing is derived from the structure of the document. There should
    be no need to insert specific instructions in a document. This is one of the major
    improvements of SGML when compared to earlier markup languages.


    That''s theory. In practice, there are cases where it is easier to insert processing
    instructions rather than define complex structure. Processing instructions are
    a concession to reality from the XML standard developers.


    You are already familiar with processing instructions because the XML declaration
    is:


    ```

    <?xml version="1.0" encoding="ISO-8859-1"?>

    ```


    +   - XTransformation, you will see how to use processing instructions to attach
    style sheets (page 125).

    - <?xml-stylesheet href="simple.xsl" type="text/xml"?>


    Finally, processing instructions are used by specific applications. For example,
    XMetal (an XML editor) uses them to create templates. This process-ing instruction
    is specific to XMetal.


    ```

    <?xml-replace_text (Click here to type the name)?>

    ```


    The processing instruction is enclosed in < and ?. The first name is the target.
    It identifies the application or the device to which the instructions are directed.
    The rest of the processing instructions are in a formats specific to the target.
    It does not have to be XML.


    # CDATA Sections


    As you have seen, markup characters (left angle bracket and ampersand) that appear
    in the content of an element must be escaped with an entity.


    For some applications, it is difficult to escape markup characters, if only because
    there are too many of them. Mathematical equations can use left angle brackets.
    It is difficult to include a scripting language in a doc-ment to escape the angle
    brackets and ampersands. Also, it is difficult to include an XML document in an
    XML document.


    CDATA sections are intended for these cases. CDATA sections are delimited by "<![CDATA[`
    and \]". The XML processor ignores all markup except for]] (which means it is
    not possible to include a CDATA section in another CDATA section).


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_71_0.png)'
  merge: -1
