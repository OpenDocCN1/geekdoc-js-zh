    # *** Styling ***


    Style sheets are inherited from SGML, an ancestor, in publishing and document
    management applications. XSL is XML''s standard style-sheet, see [http://www.w3.org/Style].


    # *** How XSL Works


    An XSL style sheet is a set of rules where each rule specifies how to format certain
    elements in the document. To continue the example from the previous section, the
    style sheets have rules for title, paragraphs and keywords.


    With XSL, rules are powerful enough not only to format the document but also to
    reorganize it, e.g. by moving the title to the front page or extracting the list
    of keywords. This can lead to exciting applications of XSL outside of traditional
    publishing. For example, XSL can be used to convert documents between the company-specific
    markup and a standard one.


    # *** The Flexibility of Style Sheets ***


    Style sheets are separated from documents. Therefore one document can have more
    than one style sheet and, conversely, one style sheet can be shared among documents.


    This means that a document can be rendered differently depending on the media
    or the audience. For example, a ''managerial'' style sheet may present a summary
    view of a document that highlights key elements or a ''clerical'' style sheet
    may display more detailed information.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_160_0.png)'
  merge: -1
