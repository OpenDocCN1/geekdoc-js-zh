  md: '# SAX Interfaces and Objects


    Parser defines the following methods:


    +   parse() starts parsing an XML document. There are two versions of parse()—one
    accepts a filename or a URL, the other InputSource object (see section "InputSource").


    +   setDocumentHandler(), setDTDHandler(), setEntityResolver(), and setErrorHandler()
    allow the application to register event handlers.


    +   setLocale() requests error messages in a specific Locale.


    # ParserFactory


    ParserFactory creates the parser object. It takes the class name for the parser.
    For XML for Java, it is com.xml.parsers.SAXParser. To switch another parser, you
    can change one name and recompile:


    ```

    protected String PARSER_NAME = "com.xml.parsers.SAXParser";

    // ...

    Parser parser = ParserFactory.makeParser(PARSER_NAME);

    ```


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_260_0.png)


    For more flexibility, the application can read the class name from the command
    line or from a configuration file. In this case, it is even possible to change
    the parser without recompiling.


    # InputSource


    InputSource controls how the parser reads files, including XML documents and entities.


    In most cases, documents are loaded from the local file system or from a URL.
    The default implementation of InputSource knows how to load them. However, if
    an application has special needs, such as loading documents from a database, it
    can override InputSource.


    The parse() method is available in two versions—one takes a string, the other
    an InputSource. The string version uses the default InputSource to load the document
    from a file or a URL.


    # DocumentHandler


    Listing 8.2 is simple because it needs to handle only the startElement message.
    As the name implies, the message is sent when the parser sees the opening tag
    of an element.


    The event is defined by the DocumentHandler interface. The application creates
    a new class, Cheapest, which overrides the startElement() method. The application
    registers Cheapest as an event handler with the parser.


    ```

    // creates the event handler

    ```


