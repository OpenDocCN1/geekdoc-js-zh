  md: '# Chapter 5: XSL Transformation


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_155_0.png)


    Figure 5.6: Walking down the input tree


    # Following the Processor


    Let''s follow the XSL processor for the first few templates in the style sheet.
    After loading the style sheet and the source document the processor positions
    itself at the root of the source document. It looks for a template that matches
    the root node and it immediately finds


    ```

    <xsl:template match="/*">\n<HTML>

    <HEAD>

    <TITLE>Pineapples Link</TITLE>

    </HEAD>

    <body>

    <xsl:apply-templates/>

    </body>

    </HTML>

    </xsl:template>

    ```


    The root sits sits before the top-level element, it is ideal to create the top-level
    element of the resulting tree. For HTML, it is the HTML element with HEAD and
    BODY elements.


    When it encounters xsl:apply-templates, the processor moves to the first child
    of the current node. The first child of the root is the top-level element or the
    article element.


    The style sheet defines no templates for the article but can match template against
    a built-in template. Built-in templates are not defined in the style sheet. They
    are predefined by the processor.'
  merge: -1
