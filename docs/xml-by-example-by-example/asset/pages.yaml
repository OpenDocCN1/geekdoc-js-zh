  md: '# N-Tiered Architecture and XML


    You are now familiar with every aspect of XML. This chapter and the next demonstrate
    how to put these techniques to use in a medium-sized example. There are no new
    techniques introduced in these chapters, but they illustrate how to apply what
    you have learned to a real-world application. In particular, you learn


    +   - how to use XML for interapplication communication

    - how to use XML for electronic commerce

    - how to take advantage of XML tools


    Throughout these two chapters, you''ll develop a multicharchant Web shop or a
    Web mall, dubbed eCommerce (XML Commerce), as an example.


    This chapter must be read in conjunction with the next chapter. This chapter introduces
    many of the ideas underlying the XCommerce application. It includes many code
    snippets and partial listings that are used to illustrate a point. The complete
    source code is in the next chapter. The concept of an electronic mall is increasingly
    popular; the largest sites such as Yahoo! and AOL are running to offer such services.
    The idea is to group several merchants on one Web site. The mall offers additional
    services, such as a single shopping cart, joint promotion, and, hopefully, more
    traffic.


    However, a mall implementation needs to balance the need for common features among
    the various merchants, such as a shopping cart, with the need for the merchants
    to differentiate themselves and their products. XML helps in this respect.


    # What Is an N-Tiered Application?


    Most medium- and large-scale XML applications are distributed applications, meaning
    that they involve several computers linked over a network (typically the Internet
    or a LAN).'
