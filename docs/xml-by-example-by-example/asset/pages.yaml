    \ environment; therefore, you might be able to control which browser is being\
    \ used. Moreover, you can tailor your documents to the appropriate browsers.\n\
    \nif, the intranet is large, stick to server-side conversion of XML. In a large\
    \ intranet, it is difficult to upgrade all the users simultaneously. If application\
    \ depends on Internet Explorer 5.0 and 500 users out there are still using Internet\
    \ Explorer 4.0, it might not be possible to upgrade them.\n\n# Server-Side Programming\
    \ Language\n\nXCommerce relies extensively on XSL. From a certain point of view,\
    \ XSL is used as a scripting language for XML documents.\n\nHowever, there are\
    \ features that are not possible with XSL. For example, there is no standard mechanism\
    \ to split a document. This would be useful for separating the list of products\
    \ in a number of product documents."
