  md: "# PRIORITY\n\nThere are rules to prioritize templates. Without going into too\
    \ many details, templates with more specific paths take precedence over less specific\
    \ templates. In the following example, the first template has a higher priority\
    \ than the second template because it matches an element with a specific attribute.\n\
    \n```\n<xsl:template match=\"url='mailto'\">\n<A>\n  <xsl:attribute name=\"HREF\"\
    >mailto:<xsl:apply-templates/></n  </xsl:attribute>\n  <xsl:apply-templates/>\n\
    </A>\n</xsl:template>\n```\n\n```\n<xsl:template match=\"url\">\n<A TARGET=\"\
    _blank\">\n  <xsl:attribute name=\"HREF\">\n    <xsl:apply-templates/>\n  </xsl:attribute>\n\
    \  <xsl:apply-templates/>\n</A>\n</xsl:template>\n```\n\nIf there is a conflict\
    \ between two templates of equivalent priority, the XSL processor can either report\
    \ an error or choose the template that appears last in the style sheet.\n\n# Supporting\
    \ a Different Medium\n\nRecall that my original problem is to provide both an\
    \ HTML and a text version of the document. We have seen how to automatically create\
    \ an HTML version document, now it's time to look at the text version.\n\n# Text\
    \ Conversion\n\nCAUTION\n\nText conversion stretches the concept of XML to XML\
    \ conversion; therefore, you have to be careful in writing the style sheet.\n\n\
    Listing 5.4 is the style sheet. It is very similar to the previous style sheet\
    \ that it inserts only text nodes, no XML elements, in the resulting tree."
