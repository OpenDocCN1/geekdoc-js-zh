    ```


    # CAUTION


    Before you attempt to run the application, make sure that your classpath contains
    all the libraries you need. These libraries include the servlet classes, the database
    driver, LotusXSL, IBM XML for Java, and the class to the XCommerce servlets themselves.


    Also be sure you have created the database. This requires creating the Data Source
    in ODBC and entering product information with the console servlet.


    # URLs


    Here are the URLs for the application. You may have to substitute the name of
    your computer in place of localhost:


    +   - localhost/shop is the entry point for the shop.

    - localhost/editor?merchant=xmli for the product editor.

    - localhost/viewer?merchant=xmli for the order viewer.

    - localhost:81/console for the console for Emailaholic data server.


    # Database


    Emailaholic needs a database. Any JDBC-compliant database will do. The easiest
    solution, when running Windows, is probably to use an ODBC-compliant database.
    First, you need to create a blank database. The exact procedure depends on the
    database you use.


    Next, you must create a Data Source with ODBC. In the Control Panel, double-click
    the ODBC icon. Select either User DSN or System DSN and click the Add button.
    Enter the XCommerce as Data Source name and the parameters to connect to the blank
    database you have just created. See Figure 12.1.'
