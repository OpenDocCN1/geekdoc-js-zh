    ## 关于作者


    Robin Wieruch 是一位德国软件和 Web 工程师，致力于学习和教授 JavaScript 编程。在从大学获得计算机科学硕士学位后，他从未停止每天的自学。他在初创企业世界的经历——在工作和闲余时间里大量使用
    JavaScript——让他获得了了向他人教授这些主题的机会。


    在几年时间里，Robin 在一家名为 Small Improvements 的公司与优秀的工程师团队紧密合作，开发了一个大型应用程序。该公司构建了一款 SaaS
    产品，帮助客户在公司内部建立反馈文化。在底层，该应用程序前端使用 JavaScript，后端使用 Java。在前端，第一个版本是使用 Java、Wicket
    框架和 jQuery 编写的。当第一代 SPA（单页应用）流行时，公司将前端应用迁移到了 Angular 1.x。在在使用 Angular 超过 2 年后，很明显，在当时，Angular
    并不是处理状态密集型应用的最佳解决方案。这就是为什么公司最终转向了 React 和 Redux，这使其能够成功地进行大规模运营。


    在公司工作期间，Robin 经常在他的个人网站上撰写关于网页开发的文章。他注意到人们对他的文章给出了极佳的反馈，这让他改进了自己的写作和教学风格。一篇文章又一篇文章，Robin
    教授他人的能力日益增长。第一篇文章包含了过多的内容，让学生感到有些无所从心，但随着时间的推移，文章通过专注于和只教授一个主题得到了改进。


    如今，Robin 自由职业教授他人。他发现，通过提供清晰的目标和简短的反馈循环，看到学生的蓬勃成长是一项非常有成就感的活动。这是你在反馈公司中学到的东西，不是吗？但如果不亲自写代码，他就无法教授这些东西。这就是为什么他把剩余的时间投入到编程中。你可以在他的网站上找到更多关于
    Robin 的信息以及支持和他合作的方法¹。


    ¹https://www.robinwieruch.de/about


    ## 评价


    这本书有很多评价²、评分³和评论⁴^，足以证明它的质量。我对此感到非常自豪，因为我从未想过会有如此热烈的反馈。如果你也喜欢这本书，我也能在某个地方看到你的评分/评论。这有助于我向推荐这本书。以下是这些美誉声音的简短节选：


    - **Muhammad Kashif**⁵：《React 学习之路》是一本独特的书，我向任何对学习 React 基础到高级水平感兴趣的学生或专业人士推荐。它充满了在其他地方难以发现的深刻见解和技巧，在运用示例和参考样例问题方面表现得异常详尽。我有
    17 年的网页和桌面应用开发经验，在读此书之前，我在学习 React 方面一直很困难，但这本书像魔法一样解决了了问题。”

    - **Andre Vargas**⁶：“Robin Wieruch 编写的《React 学习之路》真是一本太棒的书了！我关于 React 甚至 ES6 的大部分知识都是通过这本书学会！”

    - **Nicholas Hunt-Walker，西雅图某编码学校 Python 教师**⁷：“这是我接触过的写得最好且信息丰富的编程书籍之一。一个非常扎实的
    React 和 ES6 介绍。”

    - **Austin Green**⁸：“感谢，非常喜欢这本书。是学习 React、ES6 和高阶编程概念的完美结合。”

    - **Nicole Ferguson**⁹：“我这周末在学 Robin 的《React 学习之路》课程，我几乎因为玩得太开心而感到点愧疚。”

    - **Karan**¹⁰：“刚读完你的《React 学习之路》。这是 React 和 JS 世界中初学者最好的书。对 ES 的引入非常优雅。赞赞！ :)”

    - **Eric Priou**¹¹：“Robin Wieruch 写的《React 学习之路》是必读之作。对于 React 和 JavaScript 来说简洁明了。”

    - **一名新手开发者**：“作为一名新手开发者，我刚看完这本书，感谢你编写它。它很容易上手，我有信心在未来的几天里从零开始一个新应用。这本书比我之前尝试过的官方
    React 教程好得多（之前因为细节不足没能完成）。每个章节末的练习非常有收获。”


    ²https://roadtoreact.com/

