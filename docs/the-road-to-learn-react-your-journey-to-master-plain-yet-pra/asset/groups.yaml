    \ can be used.\n\nThird, you don’t want to override the old hits. You can merge\
    \ old and new hits from the recent API request. The merge of both lists can be\
    \ done with the JavaScript ES6 array spread operator.\n\nFourth, you set the merged\
    \ hits and page in the local component state.\n\nYou can make one last adjustment.\
    \ When you try the “More” button it only fetches a few list items. The API URL\
    \ can be extended to fetch more list items with each request. Again, you can add\
    \ more composable path constants.\n\n**src/App.js**\n\n```javascript\nconst DEFAULT_QUERY\
    \ = 'redux';\nconst DEFAULT_HPP = '100';\nconst PATH_BASE = 'https://hn.algolia.com/api/v1';\n\
    const PATH_SEARCH = '/search';\nconst PARAM_SEARCH = 'query=';\nconst PARAM_PAGE\
