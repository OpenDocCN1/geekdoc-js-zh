    Let’s recap what happens during the component lifecycle. Your component gets initialized
    by the


    constructor. After that, it renders for the first time. But you prevent it from
    displaying anything,


    because the result in the local state is null. It is allowed to return null for
    a component in order


    to display nothing. Then the componentDidMount() lifecycle method runs. In that
    method you


    fetch the data from the Hacker News API asynchronously. Once the data arrives,
    it changes your


    internal component state in setSearchTopStories(). Afterward, the update lifecycle
    comes into


    play because the local state was updated. The component runs the render() method
    again, but this


    time with populated result in your internal component state. The component and
    thus the Table


    component with its content will be rendered.


    You used the native fetch API that is supported by most browsers to perform an
    asynchronous


    request to an API. The* create-react-app* configuration makes sure that it is
    supported in every


    browser. There are third-party node packages that you can use to substitute the
    native fetch API:


    superagent^(90)^ and axios^(91).


    Keep in mind that the book builds up on the JavaScript’s shorthand notation for
    truthfulness checks.


    In the previous example, if (!result) was used in favor of if (result === null).
    The same


    applies for other cases throughout the book too. For instance, if (!list.length)
    is used in favor of


    if (list.length === 0) or if (someString) is used in favor of if (someString !==
    ''''). Read


    up about the topic if you are not too familiar with it.


    Back to your application: The list of hits should be visible now. However, there
    are two regression


    bugs in the application now. First, the “Dismiss” button is broken. It doesn’t
    know about the complex


    result object and still operates on the plain list from the local state when dismissing
    an item. Second,


    when the list is displayed but you try to search for something else, the list
    gets filtered on the client-


    side even though the initial search was made by searching for stories on the server-side.
    The perfect


    behavior would be to fetch another result object from the API when using the Search
    component.


    Both regression bugs will be fixed in the following chapters.


    **Exercises:**


    • read more about ES6 template strings^(92)


    • read more about the native fetch API^(93)


    • read more about data fetching in React^(94)


    90https://github.com/visionmedia/superagent


    91https://github.com/mzabriskie/axios


    92https://developer.mozilla.org/en/docs/Web/JavaScript/Reference/Template\_literals


    93https://developer.mozilla.org/en/docs/Web/API/Fetch\_API


    94https://www.robinwieruch.de/react-fetching-data/'
- md: "\nGetting Real with an API\n\n90\n\n## ES6 Spread Operators\n\nThe “Dismiss”\
    \ button doesn’t work because the onDismiss() method is not aware of the complex\
    \ result object. It only knows about a plain list in the local state. But it isn’t\
    \ a plain list anymore. Let’s change it to operate on the result object instead\
    \ of the list itself.\n\n**src/App.js**\n\n```javascript\nonDismiss(id) {\n  const\
    \ isNotId = item => item.objectID !== id;\n  const updatedHits = this.state.result.hits.filter(isNotId);\n\
    \  this.setState({\n    ...\n  });\n}\n```\n\nBut what happens in setState() now?\
    \ Unfortunately the result is a complex object. The list of hits is only one of\
    \ multiple properties in the object. However, only the list gets updated, when\
    \ an item gets removed in the result object, while the other properties stay the\
    \ same.\n\nOne approach could be to mutate the hits in the result object. I will\
    \ demonstrate it, but we won’t do it that way.\n\n**Code Playground**\n\n```javascript\n\
    // don’t do this\nthis.state.result.hits = updatedHits;\n```\n\nReact embraces\
    \ immutable data structures. Thus you shouldn’t mutate an object (or mutate the\
    \ state directly). A better approach is to generate a new object based on the\
    \ information you have. Thereby none of the objects get altered. You will keep\
    \ the immutable data structures. You will always return a new object and never\
    \ alter an object.\n\nTherefore you can use JavaScript ES6 Object.assign(). It\
    \ takes as first argument a target object. All following arguments are source\
    \ objects. These objects are merged into the target object. The target object\
    \ can be an empty object. It embraces immutability, because no source object gets\
    \ mutated. It would look similar to the following:\n\n**Code Playground**\n\n\
    ```javascript\nconst updatedHits = { hits: updatedHits };\nconst updatedResult\
    \ = Object.assign({}, this.state.result, updatedHits);\n```\n\nLatter objects\
    \ will override former merged objects when they share the same property names.\
    \ Now let’s do it in the onDismiss() method:\n\nGetting Real with an API\n\n91\n\
    \n**src/App.js**\n\n```javascript\nonDismiss(id) {\n  const isNotId = item =>\
    \ item.objectID !== id;\n  const updatedHits = this.state.result.hits.filter(isNotId);\n\
    \  this.setState({\n    result: Object.assign({}, this.state.result, { hits: updatedHits\
    \ })\n  });\n}\n```\n\nThat would already be the solution. But there is a simpler\
    \ way in JavaScript ES6 and future JavaScript releases. May I introduce the spread\
    \ operator to you? It only consists of three dots: ... When it is used, every\
    \ value from an array or object gets copied to another array or object.\n\nLet’s\
    \ examine the ES6 array spread operator even though you don’t need it yet.\n\n\
    **Code Playground**\n\n```javascript\nconst userList = ['Robin', 'Andrew', 'Dan'];\n\
    const additionalUser = 'Jordan';\nconst allUsers = [...userList, additionalUser];\n\
    console.log(allUsers);\n// output: ['Robin', 'Andrew', 'Dan', 'Jordan']\n```\n\
    \nThe allUsers variable is a completely new array. The other variables userList\
    \ and additionalUser stay the same. You can even merge two arrays that way into\
    \ a new array.\n\n**Code Playground**\n\n```javascript\nconst oldUsers = ['Robin',\
    \ 'Andrew'];\nconst newUsers = ['Dan', 'Jordan'];\nconst allUsers = [...oldUsers,\
    \ ...newUsers];\nconsole.log(allUsers);\n// output: ['Robin', 'Andrew', 'Dan',\
    \ 'Jordan']\n```\n\nNow let’s have a look at the object spread operator. It is\
    \ not JavaScript ES6. It is a proposal for a next JavaScript version^(95) yet\
    \ already used by the React community. That’s why create-react-app incorporated\
    \ the feature in the configuration.\n\nBasically it is the same as the JavaScript\
    \ ES6 array spread operator but with objects. It copies each key value pair into\
    \ a new object.\n\n95https://github.com/sebmarkbage/ecmascript-rest-spread\n\n\
    Getting Real with an API\n\n92\n\n**Code Playground**\n\n```javascript\nconst\
    \ userNames = { firstname: 'Robin', lastname: 'Wieruch' };\nconst age = 28;\n\
    const user = { ...userNames, age };\nconsole.log(user);\n// output: { firstname:\
    \ 'Robin', lastname: 'Wieruch', age: 28 }\n```\n\nMultiple objects can be spread\
    \ like in the array spread example.\n\n**Code Playground**\n\n```javascript\n\
    const userNames = { firstname: 'Robin', lastname: 'Wieruch' };\nconst userAge\
    \ = { age: 28 };\nconst user = { ...userNames, ...userAge };\nconsole.log(user);\n\
    // output: { firstname: 'Robin', lastname: 'Wieruch', age: 28 }\n```\n\nAfter\
    \ all, it can be used to replace Object.assign().\n\n**src/App.js**\n\n```javascript\n\
    onDismiss(id) {\n  const isNotId = item => item.objectID !== id;\n  const updatedHits\
    \ = this.state.result.hits.filter(isNotId);\n  this.setState({\n    result: {\
    \ ...this.state.result, hits: updatedHits }\n  });\n}\n```\n\nNow the “Dismiss”\
    \ button should work again, because the onDismiss() method is aware of the complex\
    \ result object and how to update it after dismissing an item from the list.\n\
    \n**Exercises:**\n\n- read more about the ES6 Object.assign()^(96)\n- read more\
    \ about the ES6 array spread operator^(97)\n- the object spread operator is briefly\
    \ mentioned\n\n96https://developer.mozilla.org/en/docs/Web/JavaScript/Reference/Global_Objects/Object/assign\n\
    97https://developer.mozilla.org/en/docs/Web/JavaScript/Reference/Operators/Spread_operator\n\
    \nGetting Real with an API\n\n93\n\n## Conditional Rendering\n\nConditional rendering\
    \ is introduced pretty early in React applications. But not in the case of the\
    \ book, because there wasn’t such an use case yet. The conditional rendering happens\
    \ when you want to make a decision to render either one or another element. Sometimes\
    \ it means to render an element or nothing. After all, a conditional rendering\
    \ simpelest usage can be expressed by an if-else statement in JSX.\n\nThe result\
    \ object in the internal component state is null in the beginning. So far, the\
    \ App component returned no elements when the result hasn’t arrived from the API.\
    \ That’s already a conditional rendering, because you return earlier from the\
    \ render() lifecycle method for a certain condition. The App component either\
    \ renders nothing or its elements.\n\nBut let’s go one step further. It makes\
    \ more sense to wrap the Table component, which is the only component that depends\
    \ on the result, in an independent conditional rendering. Everything else should\
    \ be displayed, even though there is no result yet. You can simply use a ternary\
    \ operator in your JSX.\n\n**src/App.js**\n\n```javascript\nclass App extends\
    \ Component {\n  ...\n  render() {\n    const { searchTerm, result } = this.state;\n\
    \    return (\n      <div className=\"page\">\n        <div className=\"interactions\"\
    >\n          <Search\n            value={searchTerm}\n            onChange={this.onSearchChange}\n\
    \          >\n            Search\n          </Search>\n        </div>\n      \
    \  { result\n          ? <Table\n            list={result.hits}\n            pattern={searchTerm}\n\
    \            onDismiss={this.onDismiss}\n          />\n          : null\n    \
    \    }\n      </div>\n    );\n  }\n}\n```\n\nGetting Real with an API\n\n94\n\n\
    That’s your second option to express a conditional rendering. A third option is\
    \ the logical && operator. In JavaScript a true && 'Hello World' always evaluates\
    \ to ‘Hello World’. A false && 'World' always evaluates to false.\n\n**Code Playground**\n\
    \n```javascript\nconst result = true && 'Hello World';\nconsole.log(result);\n\
    // output: Hello World\n\nconst result = false && 'Hello World';\nconsole.log(result);\n\
    // output: false\n```\n\nIn React you can make use of that behavior. If the condition\
    \ is true, the expression after the logical && operator will be the output. If\
    \ the condition is false, React ignores and skips the expression. It is applicable\
    \ in the Table conditional rendering case, because it should return a Table or\
    \ nothing.\n\n**src/App.js**\n\n```javascript\n{ result &&\n<Table\n  list={result.hits}\n\
    \  pattern={searchTerm}\n  onDismiss={this.onDismiss}\n/>\n}\n```These were a\
    \ few approaches to use conditional rendering in React. You can read about more\
    \ alternatives in an exhaustive list of conditional rendering approaches^(98).\
    \ Moreover you will get to know their different use cases and when to apply them.\n\
    \nAfter all, you should be able to see the fetched data in your application. Everything\
    \ except the Table is displayed when the data fetching is pending. Once the request\
    \ resolves the result and stores it into the local state, the Table is displayed\
    \ because the render() method runs again and the condition in the conditional\
    \ rendering resolves in favor of displaying the Table component.\n\n98https://www.robinwieruch.de/conditional-rendering-react/\n"
  mdcn: "\n深入上手 API\n\n90\n\n## ES6 展开运算符\n\n“关闭（Dismiss）”按钮不起作用，是因为 `onDismiss()`\
    \ 方法没有考虑到复杂的结果对象。它只知道本地状态中的一个普通列表。但它现在不再是一个普通列表了。让我们让它操作结果对象，而不是操作列表本身。\n\n**src/App.js**\n\
    \n```javascript\nonDismiss(id) {\n  const isNotId = item => item.objectID !==\
    \ id;\n  const updatedHits = this.state.result.hits.filter(isNotId);\n  this.setState({\n\
    \    ...\n  });\n}\n```\n\n但现在 `setState()` 中发生了什么？遗憾的是，结果是一个复杂对象。`hits` 列表只是该对象中多个属性之一。然而，当结果对象中的一个项目被移除时，只有列表被更新，而其他属性保持不变。\n\
    \n一种方法是可以修改结果对象中的 `hits`。我会演示一下，但我们不会采用那种方式。\n\n**代码演练场**\n\n```javascript\n//\
    \ 不要这样做\nthis.state.result.hits = updatedHits;\n```\n\nReact 拥抱不可变数据结构。因此，你不应该修改一个对象（或直接修改状态）。更好的方法是根据你拥的信息生成一个新对象。这样，没有任何对象被更改了。你将保持不可变的数据结构。你始终返回一个新对象，而永远不修改对象。\n\
    \n因此，你可以使用 JavaScript ES6 的 `Object.assign()`。它接受第一个参数作为目标对象。后续的所有参数都是源对象。这些对象会被合并到目标对象中。目标可以为空对象。它体现了不可变性，因为没有源对象被修改。它看起来类似于下面：\n\
    \n**代码演练场**\n\n```javascript\nconst updatedHits = { hits: updatedHits };\nconst\
    \ updatedResult = Object.assign({}, this.state.result, updatedHits);\n```\n\n\
    当后来的对象共享相同的属性名时，它们将覆盖先前的合并的对象。现在让我们在 `onDismiss()` 方法中实现：\n\n深入上手 API\n\n91\n\n\
    **src/App.js**\n\n```javascript\nonDismiss(id) {\n  const isNotId = item => item.objectID\
    \ !== id;\n  const updatedHits = this.state.result.hits.filter(isNotId);\n  this.setState({\n\
    \    result: Object.assign({}, this.state.result, { hits: updatedHits })\n  });\n\
    }\n```\n\n这已经是解决方案了。但在 JavaScript ES6 以及未来的 JavaScript 版本中，有一种更简单的方法。我可以向你介绍展开运算符（spread\
    \ operator）吗？它只由三个点组成：`...`。当使用它时，数组或对象中的每个值都会复制到另一个数组或对象中。\n\n让我们来看看 ES6 数组展开运算符，尽管你还没有需要。\n\
    \n**代码演练场**\n\n```javascript\nconst userList = ['Robin', 'Andrew', 'Dan'];\nconst\
    \ additionalUser = 'Jordan';\nconst allUsers = [...userList, additionalUser];\n\
    console.log(allUsers);\n// 输出: ['Robin', 'Andrew', 'Dan', 'Jordan']\n```\n\n`allUsers`\
    \ 变量是一个全新的数组。其他变量 `userList` 和 `additionalUser` 保持不变。你甚至这种方式将两个数组合并为一个新数组。\n\n\
    **代码演练场**\n\n```javascript\nconst oldUsers = ['Robin', 'Andrew'];\nconst newUsers\
    \ = ['Dan', 'Jordan'];\nconst allUsers = [...oldUsers, ...newUsers];\nconsole.log(allUsers);\n\
    // 输出: ['Robin', 'Andrew', 'Dan', 'Jordan']\n```\n\n现在让我们看看对象展开运算符。它不是 JavaScript\
    \ ES6。它是下一个 JavaScript 版本的提议^(95)，但已经被 React 社区所使用。这就是为什么 `create-react-app` 在配置中整合了该功能。\n\
    \n基本上，它与 JavaScript ES6 数组展开运算符相同，但针对的是对象。它将每个键值对复制到一个新对象中。\n\n95https://github.com/sebmarkbage/ecmascript-rest-spread\n\
    \n深入上手 API\n\n92\n\n**代码演练场**\n\n```javascript\nconst userNames = { firstname:\
    \ 'Robin', lastname: 'Wieruch' };\nconst age = 28;\nconst user = { ...userNames,\
    \ age };\nconsole.log(user);\n// 输出: { firstname: 'Robin', lastname: 'Wieruch',\
    \ age: 28 }\n```\n\n多个对象可以像数组展开示例那样展开。\n\n**代码演练场**\n\n```javascript\nconst userNames\
    \ = { firstname: 'Robin', lastname: 'Wieruch' };\nconst userAge = { age: 28 };\n\
    const user = { ...userNames, ...userAge };\nconsole.log(user);\n// 输出: { firstname:\
    \ 'Robin', lastname: 'Wieruch', age: 28 }\n```\n\n毕竟，它可以被用来替换 `Object.assign()`。\n\
    \n**src/App.js**\n\n```javascript\nonDismiss(id) {\n  const isNotId = item =>\
    \ item.objectID !== id;\n  const updatedHits = this.state.result.hits.filter(isNotId);\n\
    \  this.setState({\n    result: { ...this.state.result, hits: updatedHits }\n\
    \  });\n}\n```\n\n现在“关闭”按钮应该可以再次工作了，因为 `onDismiss()` 方法感知到了复杂的结果对象，并知道在列表中移除一个项目后如何更新它。\n\
    \n**练习题：**\n\n- 了解更多关于 ES6 `Object.assign()`^(96)\n- 了解更多关于 ES6 数组展开运算符^(97)\n\
    - 简要提到了对象展开运算符\n\n96https://developer.mozilla.org/en/docs/Web/JavaScript/Reference/Global_Objects/Object/assign\n\
    97https://developer.mozilla.org/en/docs/Web/JavaScript/Reference/Operators/Spread_operator\n\
    \n深入上手 API\n\n93\n\n## 条件渲染\n\n条件渲染在 React 应用中很早就被引入了。但在本书中没有，因为当时还没有这样的用例。条件渲染发生在你决定渲染一个元素或另一个元素时。有时它意味着渲染一个元素或什么都不渲染。毕竟，条件渲染最简单的用法可以用\
    \ JSX 中的 `if-else` 语句来表示。\n\n内部组件状态中的结果对象初始为 `null`。到目前为止，当结果未从 API 返回时，`App`\
    \ 组件没有返回任何元素。这已经是条件渲染了，因为你根据特定条件从 `render()` 生命周期方法中提前返回。`App` 组件要么不渲染任何内容，要么渲染它的元素。\n\
    \n但让我们更进一步。将依赖于的唯一组件 `Table` 封装在一个独立的条件渲染中更有意义。其他所有内容都应该显示，即使还没有结果。你可以简单地在 JSX\
    \ 中使用三元运算符。\n\n**src/App.js**\n\n```javascript\nclass App extends Component {\n\
    \  ...\n  render() {\n    const { searchTerm, result } = this.state;\n    return\
    \ (\n      <div className=\"page\">\n        <div className=\"interactions\">\n\
    \          <Search\n            value={searchTerm}\n            onChange={this.onSearchChange}\n\
    \          >\n            Search\n          </Search>\n        </div>\n      \
    \  { result\n          ? <Table\n            list={result.hits}\n            pattern={searchTerm}\n\
    \            onDismiss={this.onDismiss}\n          />\n          : null\n    \
    \    }\n      </div>\n    );\n  }\n}\n```\n\n深入上手 API\n\n94\n\n这是你表达条件渲染的第二种选择。第三种选择是逻辑\
    \ `&&` 运算符。在 JavaScript 中，`true && 'Hello World'` 总是求结果为 `'Hello World'`。`false\
    \ && 'World'` 总是求结果为 `false`。\n\n**代码演练场**\n\n```javascript\nconst result = true\
    \ && 'Hello World';\nconsole.log(result);\n// 输出: Hello World\n\nconst result\
    \ = false && 'Hello World';\nconsole.log(result);\n// 输出: false\n```\n\n在 React\
    \ 中你可以利用这种行为。如果条件为 `true`，逻辑 `&&` 运算符后面的表达式将输出。如果条件为 `false`，React 将忽略并跳过该表达式。这适用于\
    \ Table 的条件渲染情况，因为它应该返回一个 `Table` 或什么都没有。\n\n**src/App.js**\n\n```javascript\n\
    { result &&\n<Table\n  list={result.hits}\n  pattern={searchTerm}\n  onDismiss={this.onDismiss}\n\
    />\n}\n```这些是在 React 中使用条件渲染的几种方法。你可以在详尽的条件渲染方法列表^(98) 中阅读更多方案。此外你还将了解它们不同的用例以及何时应用它们。\n\
    \n毕竟，你应该能够在你的应用程序中看到获取的数据。在等待数据获取期间，Table 以外的所有内容都将显示。一旦请求解析结果并存储到本地状态中，Table\
    \ 将显示，因为 `render()` 方法再次运行，且条件渲染中的条件有利于显示 Table 组件。\n\n98https://www.robinwieruch.de/conditional-rendering-react/\n\
    \n"
