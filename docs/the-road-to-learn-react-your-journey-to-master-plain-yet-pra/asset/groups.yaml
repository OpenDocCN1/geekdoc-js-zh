- md: "\n## Code Organization and Testing\n\n132\n\n### Snapshot Tests with Jest\n\
    \nThe book will not dive into the topic of testing, but it shouldn’t be unmentioned.\
    \ Testing your code in programming is essential and should be seen as mandatory.\
    \ You want to keep the quality of your code high and an assurance that everything\
    \ works.\n\nPerhaps you have heard about the testing pyramid. There are end-to-end\
    \ tests, integration tests and unit tests. If you are not familiar with those,\
    \ the book gives you a quick and basic overview. A unit test is used to test an\
    \ isolated and small block of code. It can be a single function that is tested\
    \ by an unit test. However, sometimes the units work well in isolation yet don’t\
    \ work in combination with other units. They need to be tested as a group as units.\
    \ That’s where integration tests can help out by covering whether units work well\
    \ together. Last but not least, an end-to-end test is the simulation of a real\
    \ user scenario. It could be an automated setup in a browser simulating the login\
    \ flow of an user in a web application. While unit tests are fast and easy to\
    \ write and to maintain, end-to-end tests are the opposite of this spectrum.\n\
    \nHow many tests do I need of each type? You want to have many unit tests to cover\
    \ your isolated functions. After that, you can have several integration tests\
    \ to cover that the most important functions work in combination as expected.\
    \ Last but not least, you might want to have only a few end-to-end tests to simulate\
    \ critical scenarios in your web application. That’s it for the general excursion\
    \ in the world of testing.\n\nSo how do you apply this knowledge in testing your\
    \ React application? The foundation for testing in React are component tests which\
    \ can be generalized as unit tests and a part of it as snapshot tests. You will\
    \ conduct unit tests for your components in the next chapter by using a library\
    \ called Enzyme. In this chapter, you will focus on another kind of tests: snapshot\
    \ tests. That’s where Jest comes into play.\n\nJest^[115](https://facebook.github.io/jest/)\
    \ is a JavaScript testing framework that is used at Facebook. In the React community,\
    \ it is used for React component tests. Fortunately, *create-react-app* already\
    \ comes with Jest, so you don’t need to worry about setting it up.\n\nLet’s start\
    \ to test your first components. Before you can do that, you have to export the\
    \ components, which you are going to test, from your *src/App.js* file. Afterward\
    \ you can test them in a different file. You have learned about this in the code\
    \ organization chapter.\n\n133\n\n**src/App.js**\n\n```javascript\n...\nclass\
    \ App extends Component {\n...\n}\n...\nexport default App;\n\nexport {\n  Button,\n\
    \  Search,\n  Table,\n};\n```\n\nIn your *App.test.js* file, you will find a first\
    \ test that came with *create-react-app*. It verifies that the App component would\
    \ render without any errors.\n\n**src/App.test.js**\n```javascript\nimport React\
    \ from 'react';\nimport ReactDOM from 'react-dom';\nimport App from './App';\n\
    \nit('renders without crashing', () => {\n  const div = document.createElement('div');\n\
    \  ReactDOM.render(<App />, div);\n  ReactDOM.unmountComponentAtNode(div);\n});\n\
    ```\n\nThe “it”-block describes one test case. It comes with a test description\
    \ and when you test it, it can either succeed or fail. Furthermore, you could\
    \ wrap it into a “describe”-block that defines your test suite. A test suite could\
    \ include a bunch of the “it”-blocks for one specific component. You will see\
    \ those “describe”-blocks later on. Both blocks are used to separate and organize\
    \ your test cases. Note that the it function is acknowledged in the JavaScript\
    \ community as the function where you run a single test. However, in Jest it is\
    \ often found as an alias test function.\n\nYou can run your test cases by using\
    \ the interactive *create-react-app* test script on the command line. You will\
    \ get the output for all test cases on your command line interface.\n\n### Command\
    \ Line\n```bash\nnpm test\n```\n\nNow Jest enables you to write snapshot tests.\
    \ These tests make a snapshot of your rendered component and run this snapshot\
    \ against future snapshots. When a future snapshot changes, you will get notified\
    \ in the test. You can either accept the snapshot change, because you changed\
    \ the component implementation on purpose, or deny the change and investigate\
    \ for the error. It complements unit tests very well, because you only test the\
    \ diffs of the rendered output. It doesn’t add big maintenance costs, because\
