    ## Introduction to React


    3


    **Exercises**


    - read about why I moved from Angular to React^(36)

    - read about React’s flexible ecosystem^(37)

    - read about how to learn a framework^(38)


    36https://www.robinwieruch.de/reasons-why-i-moved-from-angular-to-react/

    37https://www.robinwieruch.de/essential-react-libraries-framework/

    38https://www.robinwieruch.de/how-to-learn-framework/


    ## Introduction to React


    4


    **Requirements**


    If you are coming from a different SPA framework or library, you should already
    be familiar with the basics of web development. If you have just started in web
    development, you should feel comfortable with HTML, CSS and JavaScript ES5 to
    learn React. The book will smoothly transition to JavaScript ES6 and beyond. I
    encourage you to join the official Slack Group^(39) for the book to get help or
    to help others.


    **Editor and Terminal**


    What about the development environment? You will need a running editor or IDE
    and terminal (command line tool). You can follow my setup guide^(40). It is adjusted
    for MacOS users, but you can substitute most of the tools for other operating
    system. There is a ton of articles out there that will show you how to setup a
    web development environment in a more elaborated way for your OS.


    Optionally, you can use git and GitHub on your own, while conducting the exercises
    in the book, to keep your projects and the progress in repositories on GitHub.
    There exists a little guide^(41) on how to use these tools. But once again, it
    is not mandatory for the book and can be overwhelming when learning everything
    from scratch. So you can skip it if you are a newcomer in web development to focus
    on the essential parts taught in this book.


    **Node and NPM**


    Last but not least, you will need an installation of node and npm^(42). Both are
    used to manage libraries you will need along the way. In this book, you will install
    external node packages via npm (node package manager). These node packages can
    be libraries or whole frameworks.


    You can verify your versions of node and npm on the command line. If you don’t
    get any output in the terminal, you need to install node and npm first. These
    are only my versions during the time writing this book:


    **Command Line**


    ```bash

    node --version

    *v8.9.4

    npm --version

    *v5.6.0

    ```


    39https://slack-the-road-to-learn-react.wieruch.com/

    40https://www.robinwieruch.de/developer-setup/

    41https://www.robinwieruch.de/git-essential-commands/

    42https://nodejs.org/en/


    ## Introduction to React


    5


    **node and npm**


    This chapter gives you a little crash course in node and npm. It is not exhaustive,
    but you will get all the necessary tools. If you are familiar with both of them,
    you can skip the chapter.


    The **node package manager** (npm) allows you to install external **node packages**
    from the command line. These packages can be a set of utility functions, libraries
    or whole frameworks. They are the dependencies of your application. You can either
    install these packages to your global node package folder or to your local project
    folder.


    Global node packages are accessible from everywhere in the terminal and you have
    to install them only once to your global directory. You can install a global package
    by typing in your terminal:


    **Command Line**


    ```bash

    npm install -g <package>

    ```


    The -g flag tells npm to install the package globally. Local packages are used
    in your application. For instance, React as a library will be a local package
    which can be required in your application for usage. You can install it via the
    terminal by typing:


    **Command Line**


    ```bash

    npm install <package>

    ```


    In the case of React it would be:


    **Command Line**


    ```bash

    npm install react

    ```


    The installed package will automatically appear in a folder called *node_modules/*
    and will be listed in the *package.json* file next to your other dependencies.


    But how to initialize the *node_modules/* folder and the *package.json* file for
    your project in the first place? There is a npm command to initialize a npm project
    and thus a *package.json* file. Only when you have that file, you can install
    new local packages via npm.


    **Command Line**


    ```bash

    npm init -y

    ```


    ## Introduction to React


    6


    The -y flag is a shortcut to initialize all the defaults in your *package.json*.
    If you don’t use the flag, you have to decide how to configure the file. After
    initializing your npm project you are good to install new packages via npm install
    <package>.


    One more word about the *package.json*. The file enables you to share your project
    with other developers without sharing all the node packages. The file has all
    the references of node packages used in your project. These packages are called
    dependencies. Everyone can copy your project without the dependencies. The dependencies
    are references in the *package.json*. Someone who copies your project can simply
    install all packages by using npm install on the command line. The npm install
    script takes all the dependencies listed in the *package.json* file and installs
    them in the *node_modules/* folder.


    I want to cover one more npm command:


    **Command Line**


    ```bash

    npm install --save-dev <package>

    ```


    The --save-dev flag indicates that the node package is only used in the development
    environment. It will not be used in production. You will encounter more npm commands
    on your way.


    **Exercises:**


    - setup a npm project

    - create a new folder with mkdir <folder_name>

    - navigate into the folder with cd <folder_name>

    - execute npm init -y

    - install a local package like React with npm install react

    - look into the *package.json* file and *node_modules/* folder

    - find out on your own how to uninstall the *react* package

    - read more about npm^(43)


    43https://docs.npmjs.com/


    ## Introduction to React


    7


    **Installation**


    There are multiple approaches to get started with a React application. The first
    one is to use a CDN. That may sound more complicated than it is. A CDN is a content
    delivery network^(44). Several companies have CDNs that host files publicly to
    consume them. These files can be libraries like React, because after all the bundled
    library is only a *react.js* JavaScript file. It can be hosted somewhere and you
    can require it in your application. How to use a CDN to get started in React?
    You can inline the <script> tag in your HTML that points to a CDN url. To get
    started in React you need two files (libraries): *react* and *react-dom*.


    **Code Playground**


    ```html

    <script crossorigin="https://unpkg.com/react@16/umd/react.js"></script>

    <script crossorigin="https://unpkg.com/react-dom@16/umd/react-dom.development.js"></script>

    ```


    But why should you use a CDN when you have npm to install node packages such as
    React? When your application has a *package.json* file, you can install *react*
    and *react-dom* from the command line. The requirement is that the folder is initialized
    as npm project by npm init -y with a *package.json* file. You can install multiple
    node packages in one line with npm.


    **Command Line**


    ```bash

    npm install react react-dom

    ```


    That approach is often used to add React to an existing application that is managed
    with npm. Unfortunately that’s not everything. You would have to deal with Babel^(45)
    to make your application aware of JSX (the React syntax) and JavaScript ES6. Babel
    transpiles your code so that browsers can interpret JavaScript ES6 and JSX. Not
    all browsers are capable of interpreting the syntax. The setup includes a lot
    of configuration and tooling. It can be overwhelming for React newcomers to bother
    with all the configuration.


    Because of this reason, Facebook introduced *create-react-app* as a zero-configuration
    React solution. The next chapter will show you how to setup your application by
    using this bootstrapping tool.


    **Exercises:**


    - read more about React installations^(46)


    44https://en.wikipedia.org/wiki/Content_delivery_network

    45http://babeljs.io/

    46https://reactjs.org/docs/try-react.html

