    \ 事件。\n\n**src/App.js**\n```javascript\nclass App extends Component {\n...\n \
    \ onSearchChange(event) {\n    ...\n  }\n}\n```\n\n事件拥有输入字段的值。因此你可以再次使用 `this.setState()`\
