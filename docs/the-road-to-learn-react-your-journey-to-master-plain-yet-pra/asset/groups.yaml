  - '[PAGE 200]


    State Management in React and beyond


    187


    **Taming the State**


    The previous chapters have shown you that state management can be a crucial topic
    in larger


    applications. In general, not only React but a lot of SPA frameworks struggle
    with it. Applications


    got more complex in the recent years. One big challenge in web applications nowadays
    is to tame


    and control the state.


    Compared to other solutions, React already made a big step forward. The unidirectional
    data flow


    and a simple API to manage state in a component are indispensable. These concepts
    make it easier to


    reason about your state and your state changes. It makes it easier to reason about
    it on a component


    level and to a certain degree on an application level.


    In a growing application, it gets harder to reason about state changes. You can
    introduce bugs


    by operating on stale state when using an object over a function in setState().
    You have to


    lift state around to share necessary or hide unnecessary state across components.
    It can happen


    that a component needs to lift up state, because its sibling component depends
    on it. Perhaps the


    component is far away in the component tree and thus you have to share the state
    across the whole


    component tree. In conclusion components get involved to a greater extent in state
    management.


    But after all, the main responsibility of components should be representing the
    UI, shouldn’t it?


    Because of all these reasons, there exist standalone solutions to take care of
    the state management.


    These solutions are not only used in React. However, that’s what makes the React
    ecosystem such


    a powerful place. You can use different solutions to solve your problems. To address
    the problem


    of scaling state management, you might have heard of the libraries Redux^(137)^
    or MobX^(138). You can


    use either of these solutions in a React application. They come with extensions,
    react-redux^(139)^ and


    mobx-react^(140), to integrate them into the React view layer.


    Redux and MobX are outside of the scope of this book. When you have finished the
    book, you will get


    guidance on how you can continue to learn React and its ecosystem. One learning
    path could be to


    learn Redux. Before you dive into the topic of external state management, I can
    recommend to read


    this article^(141). It aims to give you a better understanding of how to learn
    external state management.


    **Exercises:**


    • read more about external state management and how to learn it^(142)


    • check out my second ebook about state management in React^(143)


    137http://redux.js.org/docs/introduction/


    138https://mobx.js.org/


    139https://github.com/reactjs/react-redux


    140https://github.com/mobxjs/mobx-react


    141https://www.robinwieruch.de/redux-mobx-confusion/


    142https://www.robinwieruch.de/redux-mobx-confusion/


    143https://roadtoreact.com/'
