    **Ref a DOM Element**


    Sometimes you need to interact with your DOM nodes in React. The ref attribute
    gives you access


    to a node in your elements. Usually that is an anti pattern in React, because
    you should use its


    declarative way of doing things and its unidirectional data flow. You have learned
    about it when


    you have introduced your first search input field. But there are certain cases
    where you need access


    to the DOM node. The official documentation mentions three use cases:


    • to use the DOM API (focus, media playback etc.)


    • to invoke imperative DOM node animations


    • to integrate with a third-party library that needs the DOM node (e.g. D3.js^(123))


    Let’s do it by example with the Search component. When the application renders
    the first time, the


    input field should be focused. That’s one use case where you would need access
    to the DOM API.


    This chapter will show you how it works, but since it is not very useful for the
    application itself, we


    will omit the changes after the chapter. You can keep it for your own application
    though.


    In general, you can use the ref attribute in both functional stateless components
    and ES6 class


    components. In the example of the focus use case, you will need a lifecycle method.
    That’s why the


    approach is first showcased by using the ref attribute with an ES6 class component.


    The initial step is to refactor the functional stateless component to an ES6 class
    component.


    **src/App.js**


    **class Search extends Component {**


    **render() {**


    **const {**


    **value,**


    **onChange,**


    **onSubmit,**


    **children**


    **} = this.props;**


    **return (**


    <form onSubmit={onSubmit}>


    <input


    type="text"


    value={value}


    onChange={onChange}


    />


    <button type="submit">


    123https://d3js.org/'
