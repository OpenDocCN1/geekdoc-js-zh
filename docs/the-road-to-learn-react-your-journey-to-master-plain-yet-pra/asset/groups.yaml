- md: "\nState Management in React and beyond\n\n}\n\n}\n\n}\n\nNow in your Table\
    \ component you can use the internal onSort() method and the internal Table\n\n\
    state.\n\n**src/App.js**\n\n```javascript\nclass Table extends Component {\n \
    \ ...\n\n  render() {\n    const {\n      list,\n      onDismiss\n    } = this.props;\n\
    \n    const {\n      sortKey,\n      isSortReverse,\n    } = this.state;\n   \
    \ const sortedList = SORTS[sortKey](list);\n\n    const reverseSortedList = isSortReverse\n\
    \      ? sortedList.reverse()\n      : sortedList;\n\n    return(\n      <div\
    \ className=\"table\">\n        <div className=\"table-header\">\n          <span\
    \ style={{ width: '40%' }}>\n            <Sort\n              sortKey={'TITLE'}\n\
    \              onSort={this.onSort}\n              activeSortKey={sortKey}\n \
    \           >\n              Title\n            </Sort>\n          </span>\n \
    \         <span style={{ width: '30%' }}>\n            <Sort\n              sortKey={'AUTHOR'}\n\
    \              onSort={this.onSort}\n              activeSortKey={sortKey}\n \
    \           >\n              Author\n            </Sort>\n          </span>\n\
    \          <span style={{ width: '10%' }}>\n            <Sort\n              sortKey={'COMMENTS'}\n\
    \              onSort={this.onSort}\n              activeSortKey={sortKey}\n \
    \           >\n              Comments\n            </Sort>\n          </span>\n\
    \          <span style={{ width: '10%' }}>\n            <Sort\n              sortKey={'POINTS'}\n\
    \              onSort={this.onSort}\n              activeSortKey={sortKey}\n \
    \           >\n              Points\n            </Sort>\n          </span>\n\
    \          <span style={{ width: '10%' }}>\n            Archive\n          </span>\n\
    \        </div>\n        { reverseSortedList.map((item) =>\n          ...\n  \
    \      )}\n      </div>\n    );\n  }\n}\n```\n\nYour application should still\
    \ work. But you made a crucial refactoring. You moved functionality and state\
    \ closer into another component. Other components got more lightweight again.\
    \ Additionally the component API of the Table got more lightweight because it\
    \ deals internally with the sort functionality.\n\nThe process of lifting state\
    \ can go the other way as well: from child to parent component. It is called as\
    \ lifting state up. Imagine you were dealing with internal state in a child component.\
    \ Now you want to fulfill a requirement to show the state in your parent component\
    \ as well. You would have to lift up the state to your parent component. But it\
    \ goes even further. Imagine you want to show the state in a sibling component\
    \ of your child component. Again you would have to lift the state up to your parent\
    \ component. The parent component deals with the internal state, but exposes it\
    \ to both child components.\n\n**Exercises:**\n\n- read more about lifting state\
    \ in React^(134)\n- read more about lifting state in learn React before using\
    \ Redux^(135)\n\n134 https://reactjs.org/docs/lifting-state-up.html\n135 https://www.robinwieruch.de/learn-react-before-using-redux/\n\
    \n**Revisited: setState()**\n\nSo far, you have used React setState() to manage\
    \ your internal component state. You can pass an object to the function where\
    \ you can update partially the internal state.\n\n**Code Playground**\n\n```javascript\n\
    this.setState({ foo: bar });\n```\n\nBut setState() doesn’t take only an object.\
    \ In its second version, you can pass a function to update the state.\n\n**Code\
    \ Playground**\n\n```javascript\nthis.setState((prevState, props) => {\n  ...\n\
    });\n```\n\nWhy should you want to do that? There is one crucial use case where\
    \ it makes sense to use a function over an object. It is when you update the state\
    \ depending on the previous state or props. If you don’t use a function, the internal\
    \ state management can cause bugs.\n\nBut why does it cause bugs to use an object\
    \ over a function when the update depends on the previous state or props? The\
    \ React setState() method is asynchronous. React batches setState() calls and\
    \ executes them eventually. It can happen that the previous state or props changed\
    \ in between when you would rely on it in your setState() call.\n\n**Code Playground**\n\
    \n```javascript\nconst { fooCount } = this.state;\nconst { barCount } = this.props;\n\
    this.setState({ count: fooCount + barCount });\n```\n\nImagine that fooCount and\
    \ barCount, thus the state or the props, change somewhere else asynchronously\
    \ when you call setState(). In a growing application, you have more than one ‘setState()’\
    \ call across your application. Since setState() executes asynchronously, you\
    \ could rely in the example on stale values.\n\nWith the function approach, the\
    \ function in setState() is a callback that operates on the state and props at\
    \ the time of executing the callback function. Even though setState() is asynchronous,\
    \ with a function it takes the state and props at the time when it is executed.\n\
    \n**Code Playground**\n\n```javascript\nthis.setState((prevState, props) => {\n\
    \  const { fooCount } = prevState;\n  const { barCount } = props;\n  return {\
    \ count: fooCount + barCount };\n});\n```\n\nNow, lets get back to your code to\
    \ fix this behavior. Together we will fix it for one place where-setState() is\
    \ used and relies on the state or props. Afterward, you are able to fix it at\
    \ other places too.\n\nThe setSearchTopStories() method relies on the previous\
    \ state and thus is a perfect example to use a function over an object in setState().\
    \ Right now, it looks like the following code snippet.\n\n**src/App.js**\n\n```javascript\n\
    setSearchTopStories(result) {\n  const { hits, page } = result;\n  const { searchKey,\
    \ results } = this.state;\n  const oldHits = results && results[searchKey]\n \
    \   ? results[searchKey].hits\n    : [];\n  const updatedHits = [\n    ...oldHits,\n\
    \    ...hits\n  ];\n  this.setState({\n    results: {\n      ...results,\n   \
    \   [searchKey]: { hits: updatedHits, page }\n    },\n    isLoading: false\n \
    \ });\n}\n```\n\nYou extract values from the state, but update the state depending\
    \ on the previous state asynch. Now you can use the functional approach to prevent\
    \ bugs because of a stale state.\n\n**src/App.js**\n\n```javascript\nsetSearchTopStories(result)\
    \ {\n  const { hits, page } = result;\n  this.setState(prevState => {\n    ...\n\
    \  });\n}\n```\n\nYou can move the whole block that you have already implemented\
    \ into the function. You only have to exchange that you operate on the prevState\
    \ rather than this.state.\n\n**src/App.js**\n\n```javascript\nsetSearchTopStories(result)\
    \ {\n  const { hits, page } = result;\n  this.setState(prevState => {\n    const\
    \ { searchKey, results } = prevState;\n    const oldHits = results && results[searchKey]\n\
    \      ? results[searchKey].hits\n      : [];\n    const updatedHits = [\n   \
    \   ...oldHits,\n      ...hits\n    ];\n    return {\n      results: {\n     \
    \   ...results,\n        [searchKey]: { hits: updatedHits, page }\n      },\n\
    \      isLoading: false\n    };\n  });\n}\n```\n\nThat will fix the issue with\
    \ a stale state. There is one more improvement. Since it is a function, you can\
    \ extract the function for an improved readability. That’s one more advantage\
    \ to use a function over an object. The function can live outside of the component.\
    \ But you have to use a higher-order function to pass the result to it. After\
    \ all, you want to update the state based on the fetched result from the API.\n\
    \n**src/App.js**\n\n```javascript\nsetSearchTopStories(result) {\n  const { hits,\
    \ page } = result;\n  this.setState(updateSearchTopStoriesState(hits, page));\n\
    }\n```\n\nThe updateSearchTopStories() function has to return a function. It is\
    \ a higher-order function. You can define this higher-order function outside of\
    \ your App component. Note how the function signature slightly now.\n\n**src/App.js**\n\
    \n```javascript\nconst updateSearchTopStoriesState = (hits, page) => (prevState)\
    \ => {\n  const { searchKey, results } = prevState;\n  const oldHits = results\
    \ && results[searchKey]\n    ? results[searchKey].hits\n    : [];\n  const updatedHits\
    \ = [\n    ...oldHits,\n    ...hits\n  ];\n  return {\n    results: {\n      ...results,\n\
    \      [searchKey]: { hits: updatedHits, page }\n    },\n    isLoading: false\n\
    \  };\n};\n```\n\nclass App extends Component {\n  ...\n}\n```\n\nThat’s it. The\
    \ function over an object approach in setState() fixes potential bugs yet increases\
    \ readability and maintainability of your code. Furthermore, it becomes testable\
    \ outside of the App component. You could export it and write a test for it as\
    \ exercise.\n"
