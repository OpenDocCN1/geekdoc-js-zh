    \ News API 提供了你所需的一切，甚至可以有效地缓存分页数据。\n\n## 错误处理\n\n你与 Hacker News API 交互的一切都已就绪。你甚至引入了一种优雅的方式来缓存来自\
    \ API 的结果，并利用其分页列表功能从 API 获取无限数量的帖子子列表。但还缺少了一部分。遗憾的是，这在如今的开发应用程序时经常被忽视：错误处理。实现“快乐路径”（happy\
    \ path）而不担心在此过程中可能发生的错误太容易了。\n\n在本章中，你将引入一种高效的解决方案，为你的应用程序添加错误处理，以防发生错误的 API 请求。你已经学习了在\
    \ React 中引入错误处理的必要构建模块：本地状态和条件渲染。基本上，错误只是 React 中的另一种状态。当发生错误时，你将其将其存储在本地状态中，并在组件中通过条件渲染显示出来。就这么了。让我们在\
    \ `App` 组件中实现它，因为它是最初用于从 Hacker News API 获取数据的组件。\n\n首先，你必须在本地状态中引入错误。它被初始化为 `null`，但在发生错误时将被设置为错误对象。\n\
    \n**src/App.js**\n```javascript\nclass App extends Component {\n  constructor(props)\
    \ {\n    super(props);\n    this.state = {\n      results: null,\n      searchKey:\
    \ '',\n      searchTerm: DEFAULT_QUERY,\n      error: null,\n    };\n  }\n  ...\n\
    }\n}\n```\n\n其次，你可以在原生 `fetch` 的 `catch` 块中使用 `setState()` 将错误对象存储在本地状态中。每当 API\
    \ 请求未成功时，`catch` 块就会被执行。\n\n**src/App.js**\n```javascript\nclass App extends Component\
    \ {\n  ...\n  fetchSearchTopStories(searchTerm, page = 0) {\n    fetch(`${PATH_BASE}${SEARCH}?${searchTerm}&page=${page}`)\n\
    \      .then(response => response.json())\n      .then(result => this.setSearchTopStories(result))\n\
    \      .catch(error => this.setState({ error }));\n  }\n  ...\n}\n```\n\n第三，你可以在\
    \ `render()` 方法中从本地状态检索错误对象，并在发生错误时使用 React 的条件渲染显示消息。\n\n**src/App.js**\n```javascript\n\
    class App extends Component {\n  ...\n  render() {\n    const { searchTerm, results,\
    \ searchKey, error } = this.state;\n    if (error) {\n      return <p>Something\
    \ went wrong.</p>;\n    }\n    return (\n      <div className=\"page\">\n    \
    \    ...\n      </div>\n    );\n  }\n}\n```\n\n就这么了。如果你想测试你的错误处理是否正常，可以将 API URL\
    \ 更改为某些不存在的内容。\n\n**src/App.js**\n```javascript\nconst PATH_BASE = 'https://foo.bar.com/api/v1';\n\
    ```\n\n之后，你应该会得到错误消息而不是你的应用程序。你想在哪里放置错误消息的条件渲染取决于你。在这种情况下，整个应用将不再显示了。这可能不是最好的体验。那么，显示\
    \ `Table` 组件或错误消息怎么样呢？即使发生错误，剩余的应用程序仍然可见。\n\n**src/App.js**\n```javascript\nclass\
    \ App extends Component {\n  ...\n  render() {\n    const { searchTerm, results,\
    \ searchKey, error } = this.state;\n    const list = results && results[searchKey]?.hits\
    \ || [];\n    return (\n      <div className=\"page\">\n        <div className=\"\
    interactions\">\n          ...\n        </div>\n        {error ?\n          <div\
    \ className=\"interactions\">\n            <p>Something went wrong.</p>\n    \
    \      </div>\n        : (\n          <>\n            <Table\n              list={list}\n\
    \              onDismiss={this.onDismiss}\n            />\n            <div className=\"\
    interactions\">\n              <Button onClick={() => this.fetchSearchTopStories(searchKey,\
    \ page + 1)}>\n                More\n              </Button>\n            </div>\n\
    \          </>\n        )}\n      </div>\n    );\n  }\n}\n```\n最后，你应该将 URL 恢复为存在的路径。\n\
    \n## Axios 替代 Fetch\n\n在之前的章节中，你引入了原生 `fetch` API 来请求 Hacker News。浏览器允许你使用这种原生\
    \ `fetch` API。然而，并不是所有浏览器（特别是旧浏览器）都支持它。此外，当你开始为运行在浏览器之外的编写测试时（此时没有浏览器，而是模拟），可能会出现\
    \ fetch API 的问题。有几种方法可以使 fetch 在旧浏览器中（通过 polyfills）和测试中（通过 isomorphic-fetch）工作，但我们不会在书中讨论这些。\n\
    \n解决此问题的另一种方法是使用稳定的库 `axios` 来替代原生 `fetch` API。Axios 是一个只解决问题的库，但它以高质量的方式解决了这个问题：执行远程\
    \ API 请求。这就是为什么我们会在书中使用它。在具体层，本章节将向你展示如何用另一个库替换库（在这种情况下是浏览器的原生 API）。在抽象层，它应该展示如何始终为\
    \ Web 开发中的特殊情况（例如旧浏览器、无头测试）寻找解决方案。因此，遇到困难时不要停止寻找解决方案。\n\n让我们看看如何用 axios 替代原生 fetch\
    \ API。实际上，之前说的一切听起来比实际上要困难。首先，你需要在命令行安装 axios：\n\n**命令行**\n```bash\nnpm install\
    \ axios\n```\n\n其次，你可以在 App 组件文件中引入 axios：\n\n**src/App.js**\n```javascript\n\
    import React, { Component } from 'react';\nimport axios from 'axios';\nimport\
    \ './App.css';\n...\n```\n\n最后，你可以用它代替 `fetch()`。它的用法与原生 `fetch` API 几乎相同。它接受\
    \ URL 作为参数并返回一个 promise。你不再需要将返回的响应转换为 JSON。Axios 会为你完成转换并将结果封装在 JavaScript 的\
    \ data 对象中。因此，请确保你的代码适应返回的数据结构。\n"
