    \n```javascript\nfetchSearchTopStories(searchTerm, page = 0) {\n  fetch(`${PATH_BASE}${PATH_SEARCH}?${PARAM_SEARCH}${searchTerm}&${PARAM_PAGE}${page}&${PARAM_HPP}${DEFAULT_HPP}`)\n\
    \    .then(response => response.json())\n    .then(result => this.setSearchTopStories(result))\n\
    \    .catch(error => error);\n}\n```\n\n之后，对 Hacker News API 的请求单次请求获取的列表项比之前更多。如你所见，像\
    \ Hacker News API 这样强大的 API 提供了许多方法来实验真实世界的数据。你应该利用它让你在学习新事物时的努力变得更加有趣。这就是我学习学习新的编程语言或库时，了解到\
    \ API 所提供的助力。\n\n104 https://www.robinwieruch.de/what-is-an-api-javascript/\n\n\
    ## 深入上手 API\n\n104\n\n**练习：**\n\n- 了解更多关于 ES6 默认参数 (105)\n- 测试 Hacker News API\
    \ 参数 (106)\n\n105 https://developer.mozilla.org/en/docs/Web/JavaScript/Reference/Functions/Default_parameters\n\
    106 https://hn.algolia.com/api\n\n## 深入上手 API\n\n106\n\n### 客户端缓存\n\n每次提交搜索都会向\
    \ Hacker News API 发送请求。你可能会搜索“redux”，然后是“react”，最后又搜索了“redux”。总共发送了 3 次请求。但你搜索了两次“redux”，且两次都花费了整个异步往返来获取数据。在客户端缓存中，你会存储每个结果。当向\
    \ API 发起请求时，它会检查结果是否已经存在。如果存在，则使用缓存。否则，将发起 API 请求获取数据。\n\n为了让每个结果拥有客户端缓存，你需要在内部组件状态中存储多个结果而不是单个结果。`results`\
    \ 对象将是一个 map，以搜索词为键，以结果为值。来自 API 的每个结果将通过搜索词（键）保存。\n\n目前，你本地状态中的 `result` 看起来如下：\n\
    \n**代码沙场**\n\n```javascript\nresult: {\n  hits: [ ... ],\n  page: 2,\n}\n```\n\
    \n假设你已经进行了两次 API 请求。一个针对搜索词“redux”，另一个针对“react”。`results` 对象应该如下所示：\n\n**代码沙场**\n\
    \n```javascript\nresults: {\n  redux: {\n    hits: [ ... ],\n    page: 2,\n  },\n\
    \  react: {\n    hits: [ ... ],\n    page: 1,\n  },\n  ...\n}\n```\n\n让我们用 React\
    \ 的 `setState()` 实现客户端缓存。首先，在初始组件状态中将 `result` 对象重命名为 `results`。其次，定义 `searchKey`\
    \ 来存储每个结果。\n\n**深入上手 API**\n\n107\n\n**src/App.js**\n\n```javascript\nclass App\
    \ extends Component {\n  constructor(props) {\n    super(props);\n    this.state\
    \ = {\n      results: null,\n      searchKey: '',\n      searchTerm: DEFAULT_QUERY,\n\
    \    };\n  }\n  ...\n}\n```\n\n`searchKey` 必须在每次请求之前设置。你可能会问：为什么不使用 `searchTerm`？因为\
    \ `searchTerm` 是一个变动变量，在你每次输入时都会改变。然而，使用 `searchKey` 可以获取当前结果，从而在 `render()` 方法中显示当前结果。\n\
    \n**src/App.js**\n\n```javascript\nclass App extends Component {\n  componentDidMount()\
    \ {\n    const { searchTerm } = this.state;\n    this.setState({ searchKey: searchTerm\
    \ });\n  }\n  ...\n  onSearchSubmit(event) {\n    const { searchTerm } = this.state;\n\
    \    this.setState({ searchKey: searchTerm });\n    fetchSearchTopStories(searchTerm);\n\
    \    event.preventDefault();\n  }\n}\n```\n\n**深入上手 API**\n\n121\n\n108\n\n现在你必须调整\
    \ `results` 存储在状态中的功能。`searchKey` 将作为键。\n\n**src/App.js**\n\n```javascript\nclass\
    \ App extends Component {\n  ...\n  setSearchTopStories(result) {\n    const {\
    \ hits, page } = result;\n    const { searchKey, results } = this.state;\n   \
    \ const oldHits = page !== 0\n      ? results[searchKey].hits\n      : [];\n \
    \   const updatedHits = [\n      ...oldHits,\n      ...hits\n    ];\n    this.setState({\n\
    \      results: {\n        ...results,\n        [searchKey]: { hits: updatedHits,\
    \ page }\n      }\n    });\n  }\n  ...\n}\n```\n\n首先，你从状态中获取 `searchKey`。其次，旧的\
    \ `hits` 必须与新的 `hits` 合并。第三，在状态的 results map 中设置新结果。让我们检查 `setState()` 中的 `results`\
