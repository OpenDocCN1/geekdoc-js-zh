  - '[PAGE 37]


    Introduction to React


    24


    **ES6 Arrow Functions**


    JavaScript ES6 introduced arrow functions. An arrow function expression is shorter
    than a function


    expression.


    **Code Playground**


    *// function expression*


    **function** () { ... }


    *// arrow function expression*


    () => { ... }


    But you have to be aware of its functionalities. One of them is a different behavior
    with the this


    object. A function expression always defines its own this object. Arrow function
    expressions still


    have the this object of the enclosing context. Don’t get confused when using this
    in an arrow


    function.


    There is another valuable fact about arrow functions regarding the parentheses.
    You can remove the


    parentheses when the function gets only one argument, but have to keep them when
    it gets multiple


    arguments.


    **Code Playground**


    *// allowed*


    item => { ... }


    *// allowed*


    (item) => { ... }


    *// not allowed*


    item, key => { ... }


    *// allowed*


    (item, key) => { ... }


    However, let’s have a look at the map function. You can write it more concisely
    with an ES6 arrow


    function.'
