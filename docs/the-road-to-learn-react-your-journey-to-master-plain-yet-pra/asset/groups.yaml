    \ 1px solid #e3e3e3;\n}\n\n.table-header > span {\n  overflow: hidden;\n  text-overflow:\
    \ ellipsis;\n  padding: 0 5px;\n}\n\n.table-row > span {\n  overflow: hidden;\n\
