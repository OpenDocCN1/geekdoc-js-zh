    **ES6 Object Initializer**


    In JavaScript ES6, you can use a shorthand property syntax to initialize your
    objects more concisely.


    Imagine the following object initialization:


    **Code Playground**


    **const** name = ''Robin'';


    **const** user = {


    name: name,


    };


    When the property name in your object is the same as your variable name, you can
    do the following:


    **Code Playground**


    **const** name = ''Robin'';


    **const** user = {


    name,


    };


    In your application, you can do the same. The list variable name and the state
    property name share


    the same name.


    **Code Playground**


    *// ES5*


    **this**.state = {


    list: list,


    };


    *// ES6*


    **this**.state = {


    list,


    };


    Another neat helper are shorthand method names. In JavaScript ES6, you can initialize
    methods in


    an object more concisely.'
