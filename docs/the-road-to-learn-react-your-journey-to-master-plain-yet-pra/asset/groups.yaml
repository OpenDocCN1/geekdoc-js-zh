    redux: {


    hits: \[ ... \],


    page: 2,


    },


    react: {


    hits: \[ ... \],


    page: 1,


    },


    ...


    }


    Let’s implement a client-side cache with React setState(). First, rename the result
    object to


    results in the initial component state. Second, define a temporary searchKey which
    is used to


    store each result.'
