    \ ES6 destructuring (70)\n\n70 https://developer.mozilla.org/en/docs/Web/Reference/Operators/Destructuring_assignment\n\
    \n60\n\nBasics in React\n\n## Controlled Components\n\nYou already learned about\
    \ the unidirectional data flow in React. The same law applies for the input field,\
    \ which updates the local state with the searchTerm in order to filter the list.\
    \ When the state changes, the render() method runs again and uses the recent searchTerm\
    \ from the local state to apply the filter condition.\n\nBut didn’t we forget\
    \ something in the input element? A input tag comes with a value attribute. The\
    \ value attribute usually has the value that is shown in the input field. In this\
    \ case it would be the searchTerm property. However, it seems like we don’t need\
    \ that in React. That’s wrong. Form elements such as <input>, <textarea> and <select>\
    \ hold their own state in plain HTML. They modify the value internally once someone\
    \ changes it from the outside. In React that’s called an uncontrolled component,\
    \ because it handles its own state. In React, you should make sure to make those\
    \ elements controlled components.\n\nHow should you do that? You only have to\
