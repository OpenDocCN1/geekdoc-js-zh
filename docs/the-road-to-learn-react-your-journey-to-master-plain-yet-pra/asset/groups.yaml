    Code Organization and Testing


    132


    **Snapshot Tests with Jest**


    The book will not dive deeply into the topic of testing, but it shouldn’t be unmentioned.
    Testing your


    code in programming is essential and should be seen as mandatory. You want to
    keep the quality of


    your code high and an assurance that everything works.


    Perhaps you have heard about the testing pyramid. There are end-to-end tests,
    integration tests and


    unit tests. If you are not familiar with those, the book gives you a quick and
    basic overview. A unit


    test is used to test an isolated and small block of code. It can be a single function
    that is tested by an


    unit test. However, sometimes the units work well in isolation yet don’t work
    in combination with


    other units. They need to be tested as a group as units. That’s where integration
    tests can help out by


    covering whether units work well together. Last but not least, an end-to-end test
    is the simulation


    of a real user scenario. It could be an automated setup in a browser simulating
    the login flow of an


    user in a web application. While unit tests are fast and easy to write and to
    maintain, end-to-end


    tests are the opposite of this spectrum.


    How many tests do I need of each type? You want to have many unit tests to cover
    your isolated


    functions. After that, you can have several integration tests to cover that the
    most important


    functions work in combination as expected. Last but not least, you might want
    to have only a few


    end-to-end tests to simulate critical scenarios in your web application. That’s
    it for the general


    excursion in the world of testing.


    So how do you apply this knowledge in testing your React application? The foundation
    for testing


    in React are component tests which can be generalized as unit tests and a part
    of it as snapshot


    tests. You will conduct unit tests for your components in the next chapter by
    using a library called


    Enzyme. In this chapter, you will focus on another kind of tests: snapshot tests.
    That’s were Jest


    comes into play.


    Jest^(115)^ is a JavaScript testing framework that is used at Facebook. In the
    React community, it is used


    for React component tests. Fortunately* create-react-app* already comes with Jest,
    so you don’t need


    to worry about setting it up.


    Let’s start to test your first components. Before you can do that, you have to
    export the components,


    which you are going to test, from your* src/App.js* file. Afterward you can test
    them in a different


    file. You have learned about this in the code organization chapter.


    115https://facebook.github.io/jest/'
