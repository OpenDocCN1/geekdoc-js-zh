- md: '

    ## Outline


    193


    tooling around it. It enables you to setup your own project without *create-react-app*.
    I can recommend to follow a minimal setup with Webpack and Babel(158). Afterward,
    you can apply more tooling on your own. For instance, you could use ESLint(159)
    to follow a unified code style in your application.


    - **React Component Syntax:** The possibilities and best practices to implement
    React components evolve over time. You will find many ways to write your React
    components, especially React class components, in other learning resources. You
    can checkout this GitHub repository(160) to find out about an alternative way
    to write React class components. By using the class field declarations, you can
    write them even more concise in the future.


    - **Other Projects:** After learning plain React, it is always good to apply the
    learnings first in your own projects before learning something new. You could
    write your own tic-tac-toe game or a simple calculator in React. There are plenty
    of tutorials out there that use only React to build something exciting. Check
    out mine about building a paginated and infinite scrolling list(161), showcasing
    tweets on a Twitter wall(162) or connecting your React application to Stripe for
    charging money(163). Experiment with these mini applications to get comfortable
    in React.


    - **UI Components:** You shouldn’t make the mistake to introduce too early a UI
    component library in your project. First, you should learn how to implement and
    use a dropdown, checkbox or dialog in React with standard HTML elements from scratch.
    The major part of these components will manage their own local state. A checkbox
    has to know whether it is checked or not checked. Thus you should implement them
    as controlled components. After you went through all the foundational implementations,
    you can introduce a UI component library which gives you checkboxes and dialogs
    as React components.


    - **Code Organization:** On your way reading the book, you came across one chapter
    about code organization. You could apply these changes now, if you haven’t done
    it yet. It will organize your components in structured files and folders (modules).
    In addition, it helps you to understand and learn the principles of code splitting,
    reusability, maintainability and module API design. Eventually your application
    will grow in size and you will need to structure it in modules. So it’s better
    you get started now.


    - **Testing:** The book only scratched the surface of testing. If you are not
    familiar with the general topic, you could dive deeper into the concepts of unit
    testing and integration testing, especially in context of React applications.
    On an implementation level, I would recommend to stick to Enzyme and Jest in order
    to refine your approach of testing with unit tests and snapshot tests in React.


    - **Routing:** You can implement routing for your application with react-router(164).
    So far, you only have one page in your application. React Router helps you to
    have multiple pages across multiple URLs. When you introduce routing to your application,
    you don’t make any requests to your web server to request the next page. The router
    will do everything for you on the client-side. So get your hands dirty and introduce
    routing in your application.


    - **Type Checking:** In one chapter, you have used React PropTypes to define component
    interfaces. It is a general good practice to prevent bugs. But the PropTypes are
    only checked on runtime. You can go one step further to introduce static type
    checking on compile time. TypeScript(165) is one popular approach. But in the
    React ecosystem, people often use Flow(166). I can recommend to give Flow a shot,
    if you are interested to make your application more robust.


    - **React Native:** React Native(167) brings your application on mobile devices.
    You can apply your learnings from React to ship iOS and Android applications.
    The learning curve, once you have learned React, shouldn’t be steep in React Native.
    Both share the same principles. You will only encounter different layout components
    on mobile than you are used to in web applications.


    In general, I invite you to visit my website(168) to find more interesting topics
    about web development and software engineering. You can subscribe to my Newsletter(169)
    to get updates about articles, books, and courses. Furthermore, the course platform
    Road to React(170) offers more advanced courses to learn about the React ecosystem.
    You should check it out!


    Last but not least, I hope to find more Patrons(171) who are able to support my
    content. There are many students out there who cannot afford to pay for educational
    content. That’s why I put lots of my content out there for free. By supporting
    me in my doings as being my Patron, I can sustain these efforts to educate others
    for free.


    Once again, if you liked the book, I want you to take a moment to think about
    a person who would be a good match to learn React. Reach out to that person and
    share the book. It would mean a lot to me. The book is intended to be given to
    others. It will improve over time when more people read it and share their feedback
    with me. I hope to see your feedback, review or rating as well!


    Thank you a lot for reading the Road to learn React.


    Robin


    158 https://www.robinwieruch.de/minimal-react-webpack-babel-setup/

    159 https://www.robinwieruch.de/react-eslint-webpack-babel/

    160 https://github.com/the-road-to-learn-react/react-alternative-class-component-syntax

    161 https://www.robinwieruch.de/react-paginated-list/

    162 https://www.robinwieruch.de/react-svg-patterns/

    163 https://www.robinwieruch.de/react-express-stripe-payment/

    164 https://github.com/ReactTraining/react-router

    165 https://www.typescriptlang.org/

    166 https://flowtype.org/

    167 https://facebook.github.io/react-native/

    168 https://www.robinwieruch.de

    169 https://www.getrevue.co/profile/rwieruch

    170 https://roadtoreact.com

    171 https://www.patreon.com/rwieruch

