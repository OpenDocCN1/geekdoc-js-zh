    **ReactDOM**


    Before you continue with the App component, you might want to see where it is
    used. It is located


    in your entry point to the React world: the* src/index.js* file.


    **src/index.js**


    **import** React from ''react'';


    **import** ReactDOM from ''react-dom'';


    **import** App from ''./App'';


    **import** ''./index.css'';


    ReactDOM.render(


    <App />,


    document.getElementById(''root'')


    );


    Basically ReactDOM.render() uses a DOM node in your HTML to replace it with your
    JSX.


    That’s how you can easily integrate React in every foreign application. It is
    not forbidden to use


    ReactDOM.render() multiple times across your application. You can use it at multiple
    places to


    bootstrap simple JSX syntax, a React component, multiple React components or a
    whole application.


    But in plain React application you will only use it once to bootstrap your whole
    component tree.


    ReactDOM.render() expects two arguments. The first argument is JSX that gets rendered.
    The second


    argument specifies the place where the React application hooks into your HTML.
    It expects an


    element with an id=''root''. You can open your* public/index.html* file to find
    the id attribute.


    In the implementation ReactDOM.render() already takes your App component. However,
    it would


    be fine to pass simpler JSX as long as it is JSX. It doesn’t have to be an instantiation
    of a component.


    **Code Playground**


    ReactDOM.render(


    <h1\>Hello React World</h1>,


    document.getElementById(''root'')


    );


    **Exercises:**


    • open the* public/index.html* to see where the React applications hooks into
    your HTML


    • read more about rendering elements in React^(57)


    57https://reactjs.org/docs/rendering-elements.html'
  - '[PAGE 31]


    Introduction to React


    18


    **Hot Module Replacement**


    There is one thing that you can do in the* src/index.js* file to improve your
    development experience as


    a developer. But it is optional and shouldn’t overwhelm you in the beginning when
    learning React.


    In* create-react-app* it is already an advantage that the browser automatically
    refreshes the page


    when you change your source code. Try it by changing the helloWorld variable in
    your* src/App.js*


    file. The browser should refresh the page. But there is a better way of doing
    it.


    Hot Module Replacement (HMR) is a tool to reload your application in the browser.
    The browser


    doesn’t perform a page refresh. You can easily activate it in* create-react-app*.
    In your* src/index.js*,


    your entry point to React, you have to add one little configuration.


    **src/index.js**


    import React from ''react'';


    import ReactDOM from ''react-dom'';


    import App from ''./App'';


    import ''./index.css'';


    ReactDOM.render(


    <App />,


    document.getElementById(''root'')


    );


    **if (module.hot) {**


    **module.hot.accept();**


    **}**


    That’s it. Try again to change the helloWorld variable in your* src/App.js* file.
    The browser shouldn’t


    perform a page refresh, but the application reloads and shows the correct output.
    HMR comes with


    multiple advantages:


    Imagine you are debugging your code with console.log() statements. These statements
    will stay


    in your developer console, even though you change your code, because the browser
    doesn’t refresh


    the page anymore. That can be convenient for debugging purposes.


    In a growing application a page refresh delays your productivity. You have to
    wait until the


    page loads. A page reload can take several seconds in a large application. HMR
    takes away this


    disadvantage.


    The biggest benefit is that you can keep the application state with HMR. Imagine
    you have a dialog


    in your application with multiple steps and you are at step 3. Basically it is
    a wizard. Without HMR


    you would change the source code and your browser refreshes the page. You would
    have to open


    the dialog again and would have to navigate from step 1 to step 3. With HMR your
    dialog stays open'
