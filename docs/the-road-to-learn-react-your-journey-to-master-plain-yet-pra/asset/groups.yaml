    State Management in React and beyond


    187


    **Taming the State**


    The previous chapters have shown you that state management can be a crucial topic
    in larger applications. In general, not only React but a lot of SPA frameworks
    struggle with it. Applications have got more complex in the recent years. One
    big challenge in web applications nowadays is to tame and control the state.


    Compared to other solutions, React already made a big step forward. The unidirectional
    data flow and a simple API to manage state in a component are indispensable. These
    concepts make it easier to reason about your state and your state changes. It
    makes it easier to reason about it on a component level and to a certain degree
    on an application level.


    In a growing application, it gets harder to reason about state changes. You can
    introduce bugs by operating on stale state when using an object over a function
    in setState(). You have to lift state around to share necessary or hide unnecessary
    state across components. It can happen that a component needs to lift up state
    because its sibling component depends on it. Perhaps the component is far away
    in the component tree and thus you have to share the state across the whole tree.
    In conclusion, components get involved to a greater extent in state management.
    But after all, the main responsibility of components should be representing the
    UI, shouldn’t it?


    Because of all these reasons, there exist standalone solutions to take care of
    the state management in your applications. These solutions are not only used in
    React. However, that’s what makes the React ecosystem such a powerful place. You
    can use different solutions to solve your problems. To address the problem of
    scaling state management, you might have heard of the libraries Redux (137) or
    MobX (138). You can use either of these solutions in a React application. They
    come with extensions, react-redux (139) and mobx-react (140), to integrate them
    into the React layer. Redux and MobX are outside of the scope of this book. When
    you have finished the book, you will get guidance on how you can continue to learn
    React and its ecosystem. One learning path could be to learn Redux. Before you
    dive into the topic of external state management, I can recommend reading this
    article (141). It aims to give you a better understanding of how to learn state
    management.


    **Exercises:**


    - read more about external state management and how to learn it (142)

    - check out my second ebook about state management in React (143)


    137http://redux.js/docs/introduction/

    138https://mobx.js/

    139https://github.com/reactjs/react-redux

    140https://github.com/mobxjs/mobx-react

    141https://www.robinwieruch.de/redux-mobx-confusion/

    142https://www.robinwieruch.de/redux-mobx-confusion/

    143https://roadtoreact.com/


    State Management in React and beyond


    188


    You have learned advanced state management in React! Let’s recap the last chapters:


    - React lift state management up and down to suitable components

    - setState can use a function to prevent stale state bugs

    - existing external solutions that help you tame the state


    You can find the source code in the official repository (144).


    144https://github.com/the-road-to-learn-react/hackernews-client/tree/master


    Final Steps to Production


    The last chapters will show you how to deploy your application to production.
    You will use free hosting service Heroku. On the way to deploy your application,
    you will learn more about create-react-app.


    Final Steps to Production


    190


    **Eject**


    The following step and knowledge is not necessary to deploy your application to
    production. Still, I want to explain it to you. create-react-app comes with one
    feature to keep it extendable but also to prevent vendor lock-in. A vendor lock-in
    usually happens when you buy into a technology but there is no escape hatch of
    using it in the future. Fortunately in create-react-app you have such an escape
    hatch with “eject”.


    In your package.json you will find the scripts to start, test and build your application.
    The last script is eject. You could try it, but there is no way back. It is a
    one-way operation. Once you eject, you can’t go back! If you just started to learn
    React, it makes no sense to leave the convenient environment of create-react-app.


    If you would run npm eject, the command would copy all the configuration and dependencies
    to your package.json and a new config folder. You would convert the whole project
    into a custom setup with tooling that includes Babel and Webpack. After all, you
    would have full control over all these tools.


    The official documentation says that create-react-app is suitable for small to
    mid size projects. You shouldn’t feel obligated to use the “eject” command.


    **Exercises:**


    - read more about eject (145)


    145https://github.com/facebookincubator/create-react-app#converting-to-a-custom-setup


    Final Steps to Production


    191


    **Deploy your App**


    In the end, no application should stay on localhost. You want to go live. Heroku
    is a platform as a service where you can host your application. They offer a seamless
    integration with React. To be more specific: It’s possible to deploy a create-react-app
    in minutes. It is a zero-configuration deployment which follows the philosophy
    of create-react-app.


    You need to fulfill two requirements before you can deploy your application to
    Heroku:


    - install the Heroku CLI (146)

    - create a free Heroku account (147)


    If you have installed Homebrew, you can install the Heroku CLI from command line:


    **Command Line**


    brew update

    brew install heroku-toolbelt


    Now you can use git and Heroku CLI to deploy your application.


    **Command Line**


    git init

    heroku create -b https://github.com/mars/create-react-app-buildpack.git

    git add .

    git commit -m "react-create-app on Heroku"

    git push heroku master

    heroku open


    That’s it. I hope your application is up and running. If you run into problems
    you can check the following resources:


    - Git and GitHub (148)

    - Deploying React with Zero Configuration (149)

    - Heroku Buildpack for create-react-app (150)


    146https://dev.heroku.com//147https://dev.heroku.com/

    148https://www.robinwieruch.de/git-commands/

    149https://www.heroku.com/deploying-react/150https://github.com/mars/create-react-app


    205


    **Outline**


    That was the last chapter of the book. I hope you enjoyed reading it and that
    it helped you. If you liked the book, share it with your friends. In addition,
    it would mean a lot to me if you could take 5 minutes to write a review on Amazon
    (151) or Goodreads (152).


    **So, where can you go after reading this book?** You can either extend your own
    project or give your own project a shot. I am curious what you will build after
    the book.


    - **State Management:** You have used this.setState() and this to manage local
    component state. That’s a perfect start. However, in a larger application you
    will experience the limits of React’s local state (154). Therefore you can use
    a third-party state management library such as Redux or MobX (155). On the course
    Road to React (156), you will find the course “Taming the State in React” that
    teaches advanced local state in React, Redux and MobX. The course comes with an
    ebook as well, but I recommend everyone to dive into the source code and screencasts
    too.


    - **Connecting to a Database and/or Authentication:** In a growing React application,
    you may want to persist data eventually. The data should be stored in a database
    so that it can survive after a browser session and be shared across different
    users using your application. The simplest way to introduce a database is using
    Firebase. In this comprehensive tutorial (157), you will find a step by step guide
    on how to use Firebase authentication (sign up, sign in, sign out) in React. Beyond
    that, you will use Firebase’s realtime database to store user entities. After
    that, it’s up to you to store more data in the database which is needed by your
    application.


    - **Tooling with Webpack and Babel:** In the book you have used create-react-app
    to set up your application. At some point, when you have learned React, you might
    want to learn the tools behind it.

