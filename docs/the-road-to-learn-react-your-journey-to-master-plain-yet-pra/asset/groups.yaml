    \ {\n  ...\n\n  render() {\n    const {\n      list,\n      onDismiss\n    } =\
    \ this.props;\n\n    const {\n      sortKey,\n      isSortReverse,\n    } = this.state;\n\
    \    const sortedList = SORTS[sortKey](list);\n\n    const reverseSortedList =\
    \ isSortReverse\n      ? sortedList.reverse()\n      : sortedList;\n\n    return(\n\
    \      <div className=\"table\">\n        <div className=\"table-header\">\n \
    \         <span style={{ width: '40%' }}>\n            <Sort\n              sortKey={'TITLE'}\n\
    \              onSort={this.onSort}\n              activeSortKey={sortKey}\n \
    \           >\n              Title\n            </Sort>\n          </span>\n \
    \         <span style={{ width: '30%' }}>\n            <Sort\n              sortKey={'AUTHOR'}\n\
    \              onSort={this.onSort}\n              activeSortKey={sortKey}\n \
    \           >\n              Author\n            </Sort>\n          </span>\n\
    \          <span style={{ width: '10%' }}>\n            <Sort\n              sortKey={'COMMENTS'}\n\
    \              onSort={this.onSort}\n              activeSortKey={sortKey}\n \
    \           >\n              Comments\n            </Sort>\n          </span>\n\
    \          <span style={{ width: '10%' }}>\n            <Sort\n              sortKey={'POINTS'}\n\
    \              onSort={this.onSort}\n              activeSortKey={sortKey}\n \
    \           >\n              Points\n            </Sort>\n          </span>\n\
    \          <span style={{ width: '10%' }}>\n            Archive\n          </span>\n\
    \        </div>\n        { reverseSortedList.map((item) =>\n          ...\n  \
    \      )}\n      </div>\n    );\n  }\n}\n```\n\n你的应用程序仍然可以正常工作。但你进行了一次关键的重构。你将功能和状态移动到了另一个组件中。其他组件再次变得更加轻量化。此外，`Table`\
    \ 组件的 API 变得变得更简单，因为它在内部处理了排序功能。\n\n状态提升（Lifting state）的过程也可以反向进行：从子组件到父组件。这被称为“状态提升”。想象你正在处理子组件中的内部状态，现在你想满足一个在父组件中也显示该状态的需求。你必须将状态提升到父组件。但情况远不止如此。想象你想在子组件的兄弟组件中显示该状态。你仍然需要将状态提升到父组件。父组件处理该内部状态，并将其暴露给两个子组件。\n\
    \n**练习题：**\n\n- [阅读并了解更多关于 React 中状态提升的内容](https://reactjs.org/docs/lifting-state-up.html)\
    \ (134)\n- [在在使用 Redux 之前学习 React 并了解更多关于状态提升](https://www.robinwieruch.de/learn-react-before-using-redux/)\
    \ (135)\n\n134 https://reactjs.org/docs/lifting-state-up.html\n135 https://www.robinwieruch.de/learn-react-before-using-redux/\n\
    \n**复习：setState()**\n\n到目前为止，你一直在使用 React 的 `setState()` 来管理组件内部状态。你可以向函数传递一个对象，并在其中部分更新内部状态。\n\
    \n**代码沙场**\n\n```javascript\nthis.setState({ foo: bar });\n```\n\n但 `setState()`\
    \ 不仅接收一个对象。在它的第二个版本中，你可以传递一个函数来更新状态。\n\n**代码沙场**\n\n```javascript\nthis.setState((prevState,\
    \ props) => {\n  ...\n});\n```\n\n你为什么要这样做？有一个关键的用例使得这种做法非常有意义：当新状态依赖于旧状态时，使用函数比使用对象更可靠。因为\
    \ `setState()` 是异步的，如果你连续调用它，使用对象可能会导致状态过时。在更新状态时会出问题，而使用函数可以确保你基于最新的状态进行操作。\n\
    \n"
