  - '[PAGE 45]


    Basics in React


    32


    The list is part of the component now. It resides in the internal component state.
    You could add


    items, change items or remove items in and from your list. Every time you change
    your component


    state, the render() method of your component will run again. That’s how you can
    simply change


    your internal component state and be sure that the component re-renders and displays
    the correct


    data that comes from the local state.


    But be careful. Don’t mutate the state directly. You have to use a method called
    setState() to modify


    your state. You will get to know it in a following chapter.


    **Exercises:**


    • experiment with the local state


    **–** define more initial state in the constructor


    **–** use and access the state in your render() method


    • read more about the ES6 class constructor^(65)


    65https://developer.mozilla.org/en/docs/Web/JavaScript/Reference/Classes#Constructor'
  - '[PAGE 46]


