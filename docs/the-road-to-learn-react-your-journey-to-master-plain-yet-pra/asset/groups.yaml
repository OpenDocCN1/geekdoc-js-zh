  - '[PAGE 130]


    Getting Real with an API


    117


    **Axios instead of Fetch**


    In one of the previous chapters, you have introduced the native fetch API to perform
    a request to


    the Hacker News platform. The browser enables you to use this native fetch API.
    However, not all


    browsers, especially older browsers, support it. In addition, once you start to
    test your application


    in a headless browser environment (there is no browser, instead it is only mocked),
    there can be


    issues regarding the fetch API. Such a headless browser environment can happen
    when writing and


    executing tests for your application which don’t run in a real browser. There
    are a couple of ways


    to make fetch work in older browsers (polyfills) and in tests (isomorphic-fetch^(108)),
    but we won’t go


    down this rabbit hole in this book.


    An alternative way to solve it would be to substitute the native fetch API with
    a stable library


    such as axios^(109). Axios is a library that solves only one problem, but it solves
    it with a high quality:


    performing asynchronous requests to remote APIs. That’s why you will use it in
    this book. On a


    concrete level, the chapter should show you how you can substitute a library (which
    is a native


    API of the browser in this case) with another library. On an abstract level, it
    should show you how


    you can always find a solution for the quirks (e.g. old browsers, headless browser
    tests) in web


    development. So never stop to look for solutions if anything gets in your way.


    Let’s see how the native fetch API can be substituted with axios. Actually everything
    said before


    sounds more difficult than it is. First, you have to install axios on the command
    line:


    **Command Line**


    npm install axios


    Second, you can import axios in your App component’s file:


    **src/App.js**


    import React, { Component } from ''react'';


    **import axios from ''axios'';**


    import ''./App.css'';


    ...


    And last but not least, you can use it instead of fetch(). Its usage looks almost
    identical to the


    native fetch API. It takes the URL as argument and returns a promise. You don’t
    have to transform


    the returned response to JSON anymore. Axios is doing it for you and wraps the
    result into a data


    object in JavaScript. Thus make sure to adapt your code to the returned data structure.


    108https://github.com/matthew-andrews/isomorphic-fetch


    109https://github.com/axios/axios'
- md: "\n## Getting Real with an API\n\n118\n\n**src/App.js**\n\n```javascript\nclass\
    \ App extends Component {\n  ...\n\n  fetchSearchTopStories(searchTerm, page =\
    \ 0) {\n    axios(`${PATH_BASE}${PATH_SEARCH}?${PARAM_SEARCH}${searchTerm}&${PARAM_PAGE}${page}&${PARAM_HPP}${DEFAULT_HPP}`)\n\
    \      .then(result => this.setSearchTopStories(result.data))\n      .catch(error\
    \ => this.setState({ error }));\n  }\n\n  ...\n}\n```\n\nThat’s it for replacing\
    \ fetch with axios in this chapter. In your code, you are calling axios() which\
    \ uses by default a HTTP GET request. You can make the GET request explicit by\
    \ calling axios.get(). Also you can use another HTTP method such as HTTP POST\
    \ with axios.post() instead. There you can already see how axios is a powerful\
    \ library to perform requests to remote APIs. I often recommend to use it over\
    \ the native fetch API when your API requests become complex or you have to deal\
    \ with web development quirks with promises. In addition, in a later chapter,\
    \ you will introduce testing in your application. Then you don’t need to worry\
    \ anymore about a browser or headless browser environment.\n\nI want to introduce\
    \ another improvement for the Hacker News request in the App component. Imagine\
    \ your component mounts when the page is rendered for the first time in the browser.\
    \ In componentDidMount() the component starts to make the request, but then, because\
    \ your application introduced some kind of navigation, you navigate away from\
    \ this page to another page. Your App component unmounts, but there is still a\
    \ pending request from your componentDidMount() lifecycle method. It will attempt\
    \ to use this.setState() eventually in the then() or catch() block of the promise.\
    \ Perhaps then it’s the first time you will see the following warning on your\
    \ command line or in your browser’s developer output:\n\n**Command Line**\n\n\
    Warning: Can only update a mounted or mounting component. This usually means you\
    \ called setState, replaceState, or forceUpdate on an unmounted component. This\
    \ is a no-op.\n\nYou can deal with this issue by aborting the request when your\
    \ component unmounts or preventing to call this.setState() on an unmounted component.\
    \ It’s a best practice in React, even though it’s not followed by many developers,\
    \ to preserve a clean application without any annoying warnings.\n\nHowever, the\
    \ current promise API doesn’t implement aborting a request. Thus you need to help\
    \ yourself on this issue. This might also be the case why not many developers\
    \ are following this best practice. The following implementation seems more like\
    \ a workaround than a sustainable implementation. Because of that, you can decide\
    \ on your own if you want to implement it to work around the warning because of\
    \ an unmounted component. Nevertheless, keep the warning in mind in case it comes\
    \ up in a later chapter of this book or in your own application one day. Then\
    \ you know how to deal with it.\n\nLet’s start to work around it. You can introduce\
    \ a class field which holds the lifecycle state of your component. It can be initialized\
    \ as false when the component initializes, changed to true when the component\
    \ mounted, but then again set to false when the component unmounted. This way,\
    \ you can keep track of your component’s lifecycle state. It has nothing to do\
    \ with the local state stored and modified with this.state and this.setState(),\
    \ because you should be able to access it directly on the component instance without\
    \ relying on React’s local state management. Moreover, it doesn’t lead to any\
    \ re-rendering of the component when the class field is changed this way.\n\n\
    **src/App.js**\n\n```javascript\nclass App extends Component {\n  _isMounted =\
    \ false;\n\n  constructor(props) {\n    ...\n  }\n\n  ...\n\n  componentDidMount()\
    \ {\n    this._isMounted = true;\n    const { searchTerm } = this.state;\n   \
    \ this.setState({ searchKey: searchTerm });\n    this.fetchSearchTopStories(searchTerm);\n\
    \  }\n\n  componentWillUnmount() {\n    this._isMounted = false;\n  }\n\n  ...\n\
    }\n```\n\nFinally, you can use this knowledge not to abort the request itself\
    \ but to avoid calling this.setState() on your component instance even though\
    \ the component already unmounted. It will prevent the mentioned warning.\n\n\
    **src/App.js**\n\n```javascript\nclass App extends Component {\n  ...\n\n  fetchSearchTopStories(searchTerm,\
    \ page = 0) {\n    axios(`${PATH_BASE}${PATH_SEARCH}?${PARAM_SEARCH}${searchTerm}&${PARAM_PAGE}${page}&${PARAM_HPP}${DEFAULT_HPP}`)\n\
    \      .then(result => this._isMounted && this.setSearchTopStories(result.data))\n\
    \      .catch(error => this._isMounted && this.setState({ error }));\n  }\n\n\
    \  ...\n}\n```\n\nOverall the chapter has shown you how you can replace one library\
    \ with another library in React. If you run into any issues, you can use the vast\
    \ library ecosystem in JavaScript to help yourself. In addition, you have seen\
    \ a way how you can avoid calling this.setState() in React on an unmounted component.\
    \ If you dig deeper into the axios library, you will find a way to prevent the\
    \ cancel request in the first place too. It’s up to you to read up more about\
    \ this topic.\n\n**Exercises:**\n\n- read more about why frameworks matter^(110)\n\
    - learn more about an alternative React component syntax^(111)\n\n110 https://www.robinwieruch.de/why-frameworks-matter/\n\
    111 https://github.com/the-road-to-learn-react/react-alternative-class-component-syntax\n\
    \nYou have learned to interact with an API in React! Let’s recap the last chapters:\n\
    \n- React\n    - ES6 class component lifecycle methods for different use cases\n\
    \    - componentDidMount() for API interactions\n    - conditional renderings\n\
    \    - synthetic events on forms\n    - error handling\n    - aborting a remote\
    \ API request\n- ES6 and beyond\n    - template strings to compose strings\n \
    \   - spread operator for immutable data structures\n    - computed property names\n\
    \    - class fields\n- General\n    - Hacker News API interaction\n    - native\
    \ fetch browser API\n    - client- and server-side search\n    - pagination of\
    \ data\n    - client-side caching\n    - axios as an alternative for the native\
    \ fetch API\n\nAgain it makes sense to take a break. Internalize the learnings\
    \ and apply them on your own. You can experiment with the source code you have\
    \ so far. You can find the source code in^(112).\n\n112 https://github.com/the-road-to-learn-react/hackernews-client/tree/5.3.1\n\
    \n## Code Organization and Testing\n\nThe chapter will focus on important topics\
    \ to keep your code maintainable. You will learn about organization when structuring\
    \ folders and files. Another aspect you will learn is testing, which is important\
    \ to keep your code robust. The whole chapter will take a step back from the practical\
    \ application and explain a couple of these topics for you.\n\n## ES6 Modules:\
    \ Import and Export\n\nIn JavaScript ES6 you can import and export functionalities\
    \ from modules. These functionalities can be functions, classes, components, constants\
    \ and others. Basically everything you can assign to a variable. The modules can\
    \ be single files or whole folders with index file as entry point. In the beginning\
    \ of the book, after you have bootstrapped your application with create-react-app,\
    \ you already had several import and export statements across your initial files.\
    \ Now it is the appropriate time to explain these.\n\nThe import and export statements\
    \ help you to share code across multiple files. Before there were several solutions\
    \ for this in the JavaScript environment. It was a mess, because you would want\
    \ to follow one standardized way rather than having several approaches for the\
    \ same thing. Now it is native behavior since JavaScript ES6.\n\nAdditionally\
    \ these statements embrace code splitting. You distribute your code across multiple\
    \ files to keep it reusable and maintainable. The former is true because you can\
    \ import the piece of code in multiple files. The latter is true because you have\
    \ one single source where you maintain the piece of code.\n\nLast but not least,\
    \ it helps you to think about code encapsulation. Not every functionality needs\
    \ to get exported from a file. Some of these functionalities should only be used\
    \ in the file where they have been defined. The exports of a file are basically\
    \ the public API to the file. Only the exported functionalities are available\
    \ to be reused somewhere else.\n\nBut let’s get practical. How do these import\
    \ and export statements work? The following examples showcase the statements by\
    \ sharing one or multiple variables across two files. In the end, the approach\
    \ can scale to multiple files and could share more than simple variables.\n\n\
    You can export one or multiple variables. It is called a named export.\n\n**Code\
    \ Playground: file1.js**\n\n```javascript\nconst firstname = 'robin';\nconst lastname\
    \ = 'wieruch';\n\nexport { firstname, lastname };\n```\n\nAnd import them in another\
    \ file with a relative path to the first file.\n"
  mdcn: "\n\n## 深入实战 API\n\n118\n\n**src/App.js**\n\n```javascript\nclass App extends\
    \ Component {\n  ...\n\n  fetchSearchTopStories(searchTerm, page = 0) {\n    axios(`${PATH_BASE}${PATH_SEARCH}?${PARAM_SEARCH}${searchTerm}&${PARAM_PAGE}${page}&${PARAM_HPP}${DEFAULT_HPP}`)\n\
    \      .then(result => this.setSearchTopStories(result.data))\n      .catch(error\
    \ => this.setState({ error }));\n  }\n\n  ...\n}\n```\n\n本章关于用 axios 替换 fetch\
    \ 的就到此了。在你的代码中，你调用 `axios()`，它默认使用 HTTP GET 请求。你可以通过调用 `axios.get()` 让 GET 请求变得显式。此外，你也可以使用其他\
    \ HTTP 方法，例如通过 `axios.post()` 使用 HTTP POST。在这里，你已经可以看到 axios 是一个用于向远程 API 请求的强大库了。当你的\
    \ API 请求变得复杂或者你必须处理 Web 开发中 Promise 的特殊问题时，我经常建议使用它而不是原生的 fetch API。此外，在稍后的章节中，你将为应用程序引入测试。到时候你就不再需要担心浏览器或无头浏览器环境了。\n\
    \n我想为 App 组件中的 Hacker News 请求引入另一个改进。假设你的组件在浏览器首次渲染页面时挂载（mount）。在 `componentDidMount()`\
    \ 中，组件开始发送请求，但由于你的应用程序引入了某种导航，你离开了此页面并到了另一个页面。你的 App 组件卸载（unmount）了，但来自 `componentDidMount()`\
    \ 生命周期方法的请求仍然处于挂起状态。它最终会尝试在 promise 的 `then()` 或 `catch()` 块中使用这个 `this.setState()`。也许这时你将第一次在命令行或浏览器开发者工具输出中看到以下警告：\n\
    \n**命令行**\n\nWarning: Can only update a mounted or mounting component. This usually\
    \ means you called setState, replaceState, or forceUpdate on an unmounted component.\
    \ This is a no-op.\n\n你可以通过在组件卸载时中止请求，或者防止在已卸载的组件上调用 `this.setState()` 来解决这个问题。这在\
    \ React 中是一种最佳实践，尽管许多开发者并没有遵循，但它可以保持应用程序的整洁，避免任何烦人的警告。\n\n然而，目前的 promise API 并没有实现中止请求。因此，你需要自己来解决这个问题。这可能也是为什么没有多少开发者遵循这一最佳实践的原因。下面的实现看起来更像是一个通宜之而不是一个可持续的实现。因此，你可以决定是否要实现它来绕过由于已卸载组件导致的警告。尽管如此，请记住这个警告，以防它在本书的后后章节或你以后自己的应用程序中出现。到时候你就知道如何处理它了。\n\
    \n让我们开始规避这个问题。你可以引入一个类字段（class field）来持有组件的生命周期状态。它可以在组件初始化时初始化为 `false`，在组件挂载时更改为\
    \ `true`，然后在组件卸载时再次设为 `false`。这样，你就可以跟踪组件的生命周期状态。这与通过 `this.state` 和 `this.setState()`\
    \ 存储和修改的本地状态无关，因为你应该直接在组件实例上访问它，而不依赖 React 的本地状态管理。此外，当以这种方式更改类字段时，不会导致组件的重新渲染。\n\
    \n**src/App.js**\n\n```javascript\nclass App extends Component {\n  _isMounted\
    \ = false;\n\n  constructor(props) {\n    ...\n  }\n\n  ...\n\n  componentDidMount()\
    \ {\n    this._isMounted = true;\n    const { searchTerm } = this.state;\n   \
    \ this.setState({ searchKey: searchTerm });\n    this.fetchSearchTopStories(searchTerm);\n\
    \  }\n\n  componentWillUnmount() {\n    this._isMounted = false;\n  }\n\n  ...\n\
    }\n```\n\n最后，你可以利用这个知识不是去中止请求本身，而是为了在组件已经卸载的情况下在组件实例上调用 `this.setState()`。它将防止上述警告。\n\
    \n**src/App.js**\n\n```javascript\nclass App extends Component {\n  ...\n\n  fetchSearchTopStories(searchTerm,\
    \ page = 0) {\n    axios(`${PATH_BASE}${PATH_SEARCH}?${PARAM_SEARCH}${searchTerm}&${PARAM_PAGE}${page}&${PARAM_HPP}${DEFAULT_HPP}`)\n\
    \      .then(result => this._isMounted && this.setSearchTopStories(result.data))\n\
    \      .catch(error => this._isMounted && this.setState({ error }));\n  }\n\n\
    \  ...\n}\n```\n\n总来说，本章向你展示了如何在 React 中用一个库替换另一个库。如果你遇到任何问题，可以使用 JavaScript 庞大的库生态系统来帮助自己。此外，你还看到了一种在\
    \ React 中避免在已卸载组件上调用 `this.setState()` 的方法。如果你深入研究 axios 库，你也会发现一种从根上防止取消请求的方法。这取决于你是否进一步阅读这个主题。\n\
    \n**练习：**\n\n- 了解更多关于为什么框架很重要^(110)\n- 学习更多关于替代的 React 组件语法^(111)\n\n110 https://www.robinwieruch.de/why-frameworks-matter/\n\
    111 https://github.com/the-road-to-learn-react/react-alternative-class-component-syntax\n\
    \n你已经学会了如何在 React 中与 API 交互！让我们回顾一下最后几章：\n\n- React\n    - 针对不同用例的 ES6 类组件生命周期方法\n\
    \    - 用于 API 交互的 `componentDidMount()`\n    - 条件渲染\n    - 表单上的合成事件\n    - 错误处理\n\
    \    - 中止远程 API 请求\n- ES6 及以后\n    - 使用模板字符串组合字符串\n    - 用于不可变数据结构的展开运算符\n   \
    \ - 计算属性名\n    - 类字段\n- 一般\n    - Hacker News API 交互\n    - 原生 fetch 浏览器 API\n\
    \    - 客户端和服务器端搜索\n    - 数据分页\n    - 客户端缓存\n    - axios 作为原生 fetch API 的替代方案\n\
    \n再次，休息一下是有意义的。内化所学知识并将它们应用于你自己。你可以对目前已有的源代码进行实验。你可以在^(112)找到源代码。\n\n112 https://github.com/the-road-to-learn-react/hackernews-client/tree/5.3.1\n\
    \n## 代码组织与测试\n\n本章将重点关注保持代码可维护性的重要主题。你将在构建文件夹和文件时学习组织工作。你将学习的另一个方面是测试，这对于保持代码的健壮至关重要。整个章节将跳回应用，解释这些主题。\n\
    \n## ES6 模块：导入与导出\n\n在 JavaScript ES6 中，你可以从模块导入和导出功能。这些功能可以是函数、类、组件、常量等。基本上是可以赋值给变量的一切。模块可以是单个文件，也可以是以索引文件为入口点的整个文件夹。在书的开头，当你用\
    \ `create-react-app` 引导应用程序后，你已经在初始文件中使用了多个导入导出语句。现在是解释这些内容的时机了。\n\n导入和导出语句帮助你在多个文件之间共享代码。在此之前，JavaScript\
    \ 环境对此有多种解决方案。这是一团糟，因为你希望遵循一种标准方法，而不是对同一件事有多种方法。现在自 JavaScript ES6 起它是原生行为。\n\n\
    此外，这些语句拥抱代码拆分。你将代码分布在多个文件中以保持其可复用可维护性。前者是真的，因为你可以在多个文件中导入这段代码。后者也是真的，因为你有一个单一的源来维护这段代码。文件的导出基本上是该文件的公共\
    \ API。只有导出的功能才能在其他地方被复用。\n\n但让我们实际操作一下。这些导入和导出语句是如何工作的？下面的示例通过在两个文件之间共享一个或多个变量展示了这些语句。最后，这种方法可以扩展到多个文件并共享比简单变量更多的内容。\n\
    \n你可以导出一个或多个变量。这被称为命名导出。\n\n**代码沙场：file1.js**\n\n```javascript\nconst firstname\
    \ = 'robin';\nconst lastname = 'wieruch';\n\nexport { firstname, lastname };\n\
    ```\n\n"
