    ```\n\n有人可能会争论哪个函数更具可读性。我个人更倾向于第二种。React 生态使用了大量的函数式编程概念。在 ES6 中，你可以通过箭头函数更简洁地表达这些。最后，你使用\
    \ `filter` 函数从本地状态中获取 `searchTerm`。它根据条件过滤你的列表并显示每个项。\n\n57\n\nReact 基础 \n\n**受控组件**\n\
    \n**src/App.js**\n\n```javascript\nclass\n\n extends Component\n\n\n\n\n\n\n\n\
