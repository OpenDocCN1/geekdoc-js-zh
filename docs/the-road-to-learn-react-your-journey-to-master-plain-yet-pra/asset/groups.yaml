- md: "\nBasics in React\n\n37\n\n**src/App.js**\n\n```javascript\nclass App extends\
    \ Component {\n  constructor(props) {\n    super(props);\n    this.state = {\n\
    \      list,\n    };\n    this.onDismiss = this.onDismiss.bind(this);\n  }\n\n\
    \  onDismiss(id) {\n    // ...\n  }\n\n  render() {\n    ...\n  }\n}\n```\n\n\
    Now you are able to define what happens inside of the class method. Basically\
    \ you want to remove the item identified by the id from the list and store an\
    \ updated list to your local state. Afterward, the updated list will be used in\
    \ the re-running render() method to display it. The removed item shouldn’t appear\
    \ anymore.\n\nYou can remove an item from a list by using the JavaScript built-in\
    \ filter functionality. The filter function takes a function as input. The function\
    \ has access to each value in the list, because it iterates over the list. That\
    \ way, you can evaluate each item in the list based on a filter condition. If\
    \ the evaluation for an item is true, the item stays in the list. Otherwise it\
    \ will be filtered from the list. Additionally, it is good to know that the function\
    \ returns a new list and doesn’t mutate the old list. It supports the convention\
    \ in React of having immutable data structures.\n\n38\n\n**src/App.js**\n\n```javascript\n\
    onDismiss(id) {\n  const updatedList = this.state.list.filter(function isNotId(item)\
    \ {\n    return item.objectID !== id;\n  });\n}\n```\n\nIn the next step, you\
    \ can extract the function and pass it to the filter function.\n\n**src/App.js**\n\
    \n```javascript\nonDismiss(id) {\n  function isNotId(item) {\n    return item.objectID\
    \ !== id;\n  }\n  const updatedList = this.state.list.filter(isNotId);\n}\n```\n\
    \nIn addition, you can do it more concisely by using a JavaScript ES6 arrow function\
    \ function.\n\n**src/App.js**\n\n```javascript\nonDismiss(id) {\n  const isNotId\
    \ = item => item.objectID !== id;\n  const updatedList = this.state.list.filter(isNotId);\n\
    }\n```\n\nYou could even inline it again, like you did in the onClick handler\
    \ of the button, but it might get less readable.\n\n**src/App.js**\n\n```javascript\n\
    onDismiss(id) {\n  const updatedList = this.state.list.filter(item => item.objectID\
    \ !== id);\n}\n```\n\nThe list removes the clicked item now. However the state’t\
    \ updated yet. Therefore you can finally use setState() class method to update\
    \ the list in internal component state.\n\n39\n\n**src/App.js**\n\n```javascript\n\
    onDismiss(id) {\n  const isNotId = item => item.objectID !== id;\n  const updatedList\
    \ = this.state.list.filter(isNotId);\n  this.setState({ list: updatedList });\n\
    }\n```\n\nNow run again your application and try the “Dismiss” button. It should\
    \ work. What you experience now is unidirectional data flow in React. You trigger\
    \ an action in your view and the render() method runs again to update the view.\n\
    \n**Exercises:**\n- read more about state and lifecycle in React: https://reactjs.org/docs/state-and-lifecycle.html\n\
    \n40\n\n**Bindings**\n\nIt is important to learn about bindings in JavaScript\
    \ when using ES6 class components. In the previous chapter, you bound your class\
    \ method onDismiss() in the constructor.\n\n**src/App.js**\n\n```javascript\n\
    class App extends Component {\n  constructor(props) {\n    super(props);\n   \
    \ this.state = {\n      list,\n    };\n    this.onDismiss = this.onDismiss.bind(this);\n\
    \  }\n  ...\n}\n```\n\nWhy would you do that in the first place? The binding step\
    \ is necessary because class methods don’t automatically bind to the class instance.\
    \ Let’s demonstrate it with the help of the following ES6 component.\n\n**Code\
    \ Playground**\n\n```javascript\nclass ExplainBindings extends Component {\n \
    \ onClickMe() {\n    console.log(this);\n  }\n  render() {\n    return (\n   \
    \   <button onClick={this.onClickMe} type=\"button\">\n        Click Me\n    \
    \  </button>\n    );\n  }\n}\n```\n\nThe component renders just fine, but when\
    \ you click the button, you will get undefined in your console log. That’s main\
    \ source of bugs when using React because if you want to access this.state in\
    \ your class method, it cannot be retrieved because this is undefined. So in order\
    \ to make this accessible in your class methods, you have to bind the class methods\
    \ to this. In the following component the class method is properly bound in the\
    \ class constructor.\n\n**Code Playground**\n\n```javascript\nclass ExplainBindings\
    \ extends Component {\n  constructor() {\n    super();\n    this.onClickMe = this.onClickMe.bind(this);\n\
    \  }\n  onClickMe() {\n    console.log(this);\n  }\n  render() {\n    return (\n\
    \      <button onClick={this.onClickMe} type=\"button\">\n        Click Me\n \
    \     </button>\n    );\n  }\n}\n```\n\nWhen trying the button again, the this\
    \ object, to be specific the class instance, should be defined and you would be\
    \ able to access this.state, or as you will later learn this.props now. The class\
    \ method binding can happen somewhere too. For instance, it can happen in the\
    \ render() class method.\n\n42\n\n**Code Playground**\n\n```javascript\nclass\
    \ ExplainBindings extends Component {\n  onClickMe() {\n    console.log(this);\n\
    \  }\n  render() {\n    return (\n      <button onClick={this.onClickMe.bind(this)}\
    \ type=\"button\">\n        Click Me\n      </button>\n    );\n  }\n}\n```\n\n\
    But you should avoid it, because it would bind the class method every time the\
    \ render() method runs. Basically it runs every time your component updates which\
    \ leads to performance implications. When binding the class method in the constructor,\
    \ you bind it only once in the beginning when the component is instantiated. That’s\
    \ a better approach to do it. Another thing people sometimes come up with is defining\
    \ the business logic of their class methods in the constructor.\n\n**Code Playground**\n\
    \n```javascript\nclass ExplainBindings extends Component {\n  constructor() {\n\
    \    super();\n    this.onClickMe = () => {\n      console.log(this);\n    }\n\
    \  }\n  render() {\n    return (\n      <button onClick={this.onClickMe} type=\"\
    button\">\n        Click Me\n      </button>\n    );\n  }\n}\n```\n\n43\n\nYou\
    \ should avoid it too, because it will clutter your constructor over time. The\
    \ constructor is only there to instantiate your class with all its properties.\
    \ That’s why the business logic of class methods should be defined outside of\
    \ the constructor.\n\n**Code Playground**\n\n```javascript\nclass ExplainBindings\
    \ extends Component {\n  constructor() {\n    super();\n    this.doSomething =\
    \ this.doSomething.bind(this);\n    this.doSomethingElse = this.doSomethingElse.bind(this);\n\
    \  }\n  doSomething() {\n    // do something*\n  }\n  doSomethingElse() {\n  \
    \  // do something else*\n  }\n  ...\n}\n```\n\nLast but not least, it is worth\
    \ to mention that class methods can be autobound automatically without binding\
    \ them explicitly by using JavaScript ES6 arrow functions.\n\n44\n\n**Code Playground**\n\
    \n```javascript\nclass ExplainBindings extends Component {\n  onClickMe = () =>\
    \ {\n    console.log(this);\n  }\n  render() {\n    return (\n      <button onClick={this.onClickMe}\
    \ type=\"button\">\n        Click Me\n      </button>\n    );\n  }\n}\n```\n\n\
    If the repetitive binding in the constructor annoys you, you can go ahead with\
    \ this approach instead. The official React documentation sticks to the class\
    \ method in the constructor. That’s why the book will stick to those as well.\n\
    \n**Exercises:**\n- try the different approaches of bindings and console log the\
    \ this object\n\n45\n\n## Event Handler\n\nThe chapter should give you a deeper\
    \ understanding of event handlers in elements. In your application, you are using\
    \ the following button to dismiss an item from the list.\n\n**src/App.js**\n\n\
    ```javascript\n...\n<button onClick={() => this.onDismiss(item.objectID)} type=\"\
    button\">\n  Dismiss\n</button>\n...\n```\n\nThat’s already a complex use case,\
    \ because you have to pass a value to the class method and thus you have to wrap\
    \ it into another (arrow) function. So basically, it has to be a function that\
    \ is passed to the event handler. The following code wouldn’t work, because the\
    \ class method would be executed immediately when you open the application in\
    \ the browser.\n\n**src/App.js**\n\n```javascript\n...\n<button onClick={this.onDismiss(item.objectID)}\
    \ type=\"button\">\n  Dismiss\n</button>\n...\n```\n\nWhen using onClick={doSomething()},\
    \ the doSomething() function would execute immediately when you open the application\
    \ in your browser. The expression in the handler is evaluated. Since the returned\
    \ value of the function isn’t a function anymore, nothing would happen when you\
    \ click the button. But when using onClick={doSomething} whereas doSomething is\
    \ a function, it would be executed when clicking the button. The same rules apply\
    \ for the onDismiss() class method that is used in your application.\n"
