- md: "\nAdvanced React Components\n\n160\n\n- experiment with the HOC you have created\n\
    - think about a use case where another HOC would make sense\n- implement the HOC,\
    \ if there is a use case\n\nAdvanced React Components\n\n161\n\n## Advanced Sorting\n\
    \nYou have already implemented a client- and server-side search interaction. Since\
    \ you have a Table\ncomponent, it would make sense to enhance the Table with advanced\
    \ interactions. What about\nintroducing a sort functionality for each column by\
    \ using the column headers of the Table?\n\nIt would be possible to write your\
    \ own sort function, but personally I prefer to use a utility library\nfor such\
    \ cases. Lodash(130) is one of these utility libraries, but you can use whatever\
    \ library suits you.\nLet’s install Lodash and use it for the sort functionality.\n\
    \n**Command Line**\n\n`npm install lodash`\n\nNow you can import the sort functionality\
    \ of Lodash in your *src/App.js* file.\n\n**src/App.js**\n\n```javascript\nimport\
    \ React, { Component } from 'react';\nimport axios from 'axios';\nimport { sortBy\
    \ } from 'lodash';\nimport './App.css';\n```\n\nYou have several columns in your\
    \ Table. There are title, author, comments and points columns. You\ncan define\
    \ sort functions whereas each function takes a list and returns a list of items\
    \ sorted by a\nspecific property. Additionally, you will need one default sort\
    \ function which doesn’t sort but only\nreturns the unsorted list. That will be\
    \ your initial state.\n\n**src/App.js**\n\n```javascript\n...\nconst SORTS = {\n\
    \  NONE: list => list,\n  TITLE: list => sortBy(list, 'title'),\n  AUTHOR: list\
    \ => sortBy(list, 'author'),\n  COMMENTS: list => sortBy(list, 'num_comments').reverse(),\n\
    \  POINTS: list => sortBy(list, 'points').reverse(),\n};\n\nclass App extends\
    \ Component {\n...\n}\n```\n\n130 https://lodash.com/\n\nAdvanced React Components\n\
    \n162\n\nYou can see that two of the sort functions return a reversed list. That’s\
