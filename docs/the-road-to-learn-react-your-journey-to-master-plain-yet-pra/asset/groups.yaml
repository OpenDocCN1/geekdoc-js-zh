  - '[PAGE 17]


    Introduction to React


    4


    **Requirements**


    If you are coming from a different SPA framework or library, you should already
    be familiar with the


    basics of web development. If you have just started in web development, you should
    feel comfortable


    with HTML, CSS and JavaScript ES5 to learn React. The book will smoothly transition
    to JavaScript


    ES6 and beyond. I encourage you to join the official Slack Group^(39)^ for the
    book to get help or to help


    others.


    **Editor and Terminal**


    What about the development environment? You will need a running editor or IDE
    and terminal


    (command line tool). You can follow my setup guide^(40). It is adjusted for MacOS
    users, but you can


    substitute most of the tools for other operating system. There is a ton of articles
    out there that will


    show you how to setup a web development environment in a more elaborated way for
    your OS.


    Optionally, you can use git and GitHub on your own, while conducting the exercises
    in the book, to


    keep your projects and the progress in repositories on GitHub. There exists a
    little guide^(41)^ on how


    to use these tools. But once again, it is not mandatory for the book and can be
    overwhelming when


    learning everything from scratch. So you can skip it if you are a newcomer in
    web development to


    focus on the essential parts taught in this book.


    **Node and NPM**


    Last but not least, you will need an installation of node and npm^(42). Both are
    used to manage libraries


    you will need along the way. In this book, you will install external node packages
    via npm (node


    package manager). These node packages can be libraries or whole frameworks.


    You can verify your versions of node and npm on the command line. If you don’t
    get any output in


    the terminal, you need to install node and npm first. These are only my versions
    during the time


    writing this book:


    **Command Line**


    node --version


    \*v8.9.4


    npm --version


    \*v5.6.0


    39https://slack-the-road-to-learn-react.wieruch.com/


    40https://www.robinwieruch.de/developer-setup/


    41https://www.robinwieruch.de/git-essential-commands/


    42https://nodejs.org/en/'
  - '[PAGE 18]


    Introduction to React


    5


    **node and npm**


    This chapter gives you a little crash course in node and npm. It is not exhaustive,
    but you will get


    all the necessary tools. If you are familiar with both of them, you can skip the
    chapter.


    The** node package manager** (npm) allows you to install external** node packages**
    from the command


    line. These packages can be a set of utility functions, libraries or whole frameworks.
    They are the


    dependencies of your application. You can either install these packages to your
    global node package


    folder or to your local project folder.


    Global node packages are accessible from everywhere in the terminal and you have
    to install them


    only once to your global directory. You can install a global package by typing
    in your terminal:


    **Command Line**


    npm install -g <package>


    The -g flag tells npm to install the package globally. Local packages are used
    in your application.


    For instance, React as a library will be a local package which can be required
    in your application for


    usage. You can install it via the terminal by typing:


    **Command Line**


    npm install <package>


    In the case of React it would be:


    **Command Line**


    npm install react


    The installed package will automatically appear in a folder called* node\_modules/*
    and will be listed


    in the* package.json* file next to your other dependencies.


    But how to initialize the* node\_modules/* folder and the* package.json* file
    for your project in the first


    place? There is a npm command to initialize a npm project and thus a* package.json*
    file. Only when


    you have that file, you can install new local packages via npm.


    **Command Line**


    npm init -y'
  - '[PAGE 19]


    Introduction to React


    6


    The -y flag is a shortcut to initialize all the defaults in your* package.json*.
    If you don’t use the flag,


    you have to decide how to configure the file. After initializing your npm project
    you are good to


    install new packages via npm install <package>.


    One more word about the* package.json*. The file enables you to share your project
    with other


    developers without sharing all the node packages. The file has all the references
    of node packages


    used in your project. These packages are called dependencies. Everyone can copy
    your project


    without the dependencies. The dependencies are references in the* package.json*.
    Someone who copies


    your project can simply install all packages by using npm install on the command
    line. The npm


    install script takes all the dependencies listed in the* package.json* file and
    installs them in the


    *node\_modules/* folder.


    I want to cover one more npm command:


    **Command Line**


    npm install --save-dev <package>


    The --save-dev flag indicates that the node package is only used in the development
    environment.


    It will not be used in production when you deploy your application on a server.
    What kind of node


    package could that be? Imagine you want to test your application with the help
    of a node package.


    You need to install that package via npm, but want to exclude it from your production
    environment.


    Testing should only happen during the development process but not when your application
    is already


    running in production. There you don’t want to test your application anymore.
    It should be tested


    already and work out of the box for your users. That’s only one use case where
    you would want to


    use the --save-dev flag.


    You will encounter more npm commands on your way. But these will be sufficient
    for now.


    **Exercises:**


    • setup a throw away npm project


    **–** create a new folder with mkdir <folder\_name>


    **–** navigate into the folder with cd <folder\_name>


    **–** execute npm init -y or npm init


    **–** install a local package like React with npm install react


    **–** have a look into the* package.json* file and the* node\_modules/* folder


    **–** find out on your own how to uninstall the* react* node package again


    • read more about npm^(43)


    43https://docs.npmjs.com/'
  - '[PAGE 20]


    Introduction to React


    7


    **Installation**


    There are multiple approaches to get started with a React application.


    The first one is to use a CDN. That may sound more complicated than it is. A CDN
    is a content


    delivery network^(44). Several companies have CDNs that host files publicly for
    people to consume


    them. These files can be libraries like React, because after all the bundled React
    library is only a


    *react.js* JavaScript file. It can be hosted somewhere and you can require it
    in your application.


    How to use a CDN to get started in React? You can inline the <script> tag in your
    HTML that points


    to a CDN url. To get started in React you need two files (libraries):* react*
    and* react-dom*.


    **Code Playground**


    <script crossorigin src\="https://unpkg.com/react@16/umd/react.development.js"\></\\


    script\>


    <script crossorigin src\="https://unpkg.com/react-dom@16/umd/react-dom.developmen\\


    t.js"\></script>


    But why should you use a CDN when you have npm to install node packages such as
    React?


    When your application has a* package.json* file, you can install* react* and*
    react-dom* from the


    command line. The requirement is that the folder is initialized as npm project
    by using npm init


    \-y with a* package.json* file. You can install multiple node packages in one
    line with npm.


    **Command Line**


    npm install react react-dom


    That approach is often used to add React to an existing application that is managed
    with npm.


    Unfortunately that’s not everything. You would have to deal with Babel^(45)^ to
    make your application


    aware of JSX (the React syntax) and JavaScript ES6. Babel transpiles your code
    so that browsers can


    interpret JavaScript ES6 and JSX. Not all browsers are capable of interpreting
    the syntax. The setup


    includes a lot of configuration and tooling. It can be overwhelming for React
    newcomers to bother


    with all the configuration.


    Because of this reason, Facebook introduced* create-react-app* as a zero-configuration
    React solution.


    The next chapter will show you how to setup your application by using this bootstrapping
    tool.


    **Exercises:**


    • read more about React installations^(46)


    44https://en.wikipedia.org/wiki/Content\_delivery\_network


    45http://babeljs.io/


    46https://reactjs.org/docs/try-react.html'
- md: "\n## Introduction to React\n\n8\n\n### Zero-Configuration Setup\n\nIn the Road\
    \ to learn React, you will use create-react-app^(47) to bootstrap your application.\
    \ It’s an opinionated yet zero-configuration starter kit for React introduced\
    \ by Facebook in 2016. People would recommend it to beginners by 96%^(48). In\
    \ *create-react-app* the tooling and configuration evolve in the background while\
    \ the focus is on the application implementation.\n\nTo get started, you will\
    \ have to install the package to your global node packages. After that, you always\
    \ have it available on the command line to bootstrap new React applications.\n\
    \n**Command Line**\n```bash\nnpm install -g create-react-app\n```\n\nYou can check\
    \ the version of *create-react-app* to verify a successful installation on your\
    \ command line:\n\n**Command Line**\n```bash\ncreate-react-app --version\n```\n\
    *v1.5.1\n\nNow you can bootstrap your first React application. We call it *hackernews*,\
    \ but you can choose a different name. The bootstrapping takes a couple of seconds.\
    \ Afterward, simply navigate into the folder:\n\n**Command Line**\n```bash\ncreate-react-app\
    \ hackernews\ncd hackernews\n```\n\nNow you can open the application in your editor.\
    \ The following folder structure, or a variation of it depending on the *create-react-app*\
    \ version, should be presented to you:\n\n(47) https://github.com/facebookincubator/create-react-app\n\
    (48) https://twitter.com/dan_abramov/status/806985854099062785\n\n### Folder Structure\n\
    \n```text\nhackernews/\n├── README.md\n├── node_modules/\n├── package.json\n├──\
    \ .gitignore\n├── public/\n│   ├── favicon.ico\n│   ├── index.html\n│   └── manifest.json\n\
    └── src/\n    ├── App.css\n    ├── App.js\n    ├── App.test.js\n    ├── index.css\n\
    \    ├── index.js\n    ├── logo.svg\n    └── registerServiceWorker.js\n```\n\n\
    A short break down of the folder and files. It is fine if you don’t understand\
    \ all of them in the beginning.\n\n- **README.md:** The .md extension indicates\
    \ that the file is a markdown file. Markdown is used as a lightweight markup language\
    \ with plain text formatting syntax. Many source code projects come with a *README.md*\
    \ file to give you initial instructions about the project. When pushing your project\
    \ to a platform such as GitHub eventually, the *README.md* file will show its\
    \ content prominently when you access the repository. Because you have used *create-react-app*,\
    \ your *README.md* should be the same as shown in the official create-react-app\
    \ GitHub repository^(49).\n- **node_modules/:** The folder has all the node packages\
    \ that were and are installed via npm. Since you have used *create-react-app*,\
    \ there should be already a couple of node modules installed for you. Usually\
    \ you will never touch this folder, but only install and uninstall node packages\
    \ with npm from the command line.\n- **package.json:** The file shows you a list\
    \ of node package dependencies and other project configuration.\n- **.gitignore:**\
    \ The file indicates all files and folders that shouldn’t be added to your remote\
    \ git repository when using git. They should only live in your local project.\
    \ The *node_modules/* folder is such a use case. It is sufficient to share the\
    \ *package.json* file with your peers to enable them to install all dependencies\
    \ on their own without sharing the whole dependency folder.\n\n(49) https://github.com/facebookincubator/create-react-app\n\
    \n- **public/:** The folder holds all your files when building your project for\
    \ production. Eventually all your written code in the *src/* folder will be bundled\
    \ into a couple of files when building your project and placed in the public folder.\n\
    - **manifest.json** and **registerServiceWorker.js:** don’t worry about what these\
    \ files do at this stage, we won’t be needing them in this project.\n\nAfter all,\
    \ you don’t need to touch the mentioned files and folders. In the beginning everything\
    \ you need is located in the *src/* folder. The main focus lies on the *src/App.js*\
    \ file to implement React components. It will be used to implement your application,\
    \ but later you might want to split up your components into multiple files whereas\
    \ each file maintains one or a few components on its own.\n\nAdditionally, you\
    \ will find a *src/App.test.js* file for your tests and a *src/index.js* as entry\
    \ point to the React world. You will get to know both files in a later chapter.\
    \ In addition, there is a *src/index.css* and a *src/App.css* file to style your\
    \ general application and your components. They all come with default style when\
    \ you open them.\n\nThe *create-react-app* application is a npm project. You can\
    \ use npm to install and uninstall node packages to your project. Additionally\
    \ it comes with the following npm scripts for your command line:\n\n**Command\
    \ Line**\n```bash\n// Runs the application in http://localhost:3000\nnpm start\n\
    \n// Runs the tests\nnpm test\n\n// Builds the application for production\nnpm\
    \ run build\n```\n\nThe scripts are defined in your *package.json*. Your boilerplate\
    \ React application is bootstrapped now. The exciting part comes in the exercises\
    \ to finally run your bootstrapped application in the browser.\n\n**Exercises:**\n\
    \n- npm start your application and visit the application in your browser (you\
    \ can exit the command by pressing Control + C )\n- run the interactive npm test\n\
    - build the application for production\n\n(50) https://www.digitalocean.com/community\n\
    (51) https://github.com/facebookincubator/create-react-app\n"
  mdcn: "\n\n## React 简介\n\n8\n\n### 零配置设置\n\n在学习 React 的过程中，你将使用 `create-react-app`^(47)\
    \ 来引导你的应用程序。这是由 Facebook 在 2016 年引入的一个带有主见且零配置的 React 启动器。96%^(48) 的人都会向学者推荐它。在\
    \ *create-react-app* 中，工具和配置会在后台演进，而重点放在应用程序的实现上。\n\n要开始，你必须将该包安装到全局 node 包中。之后，你始终可以在命令行中使用它来引导新的\
    \ React 应用。\n\n**命令行**\n```bash\nnpm install -g create-react-app\n```\n\n你可以通过检查\
    \ *create-react-app* 的版本来验证是否在命令行中成功安装：\n\n**命令行**\n```bash\ncreate-react-app\
    \ --version\n```\n*v1.5.1*\n\n现在你可以引导你的第一个 React 应用了。我们将其命名为 *hackernews*，但你可以选择不同的名称。引导需要几秒钟。之后，只需进入该文件夹：\n\
    \n**命令行**\n```bash\ncreate-react-app hackernews\ncd hackernews\n```\n\n现在你可以在编辑器中打开该应用程序。你应该会看到以下文件夹结构，或根据\
    \ *create-react-app* 的版本有所变体：\n\n(47) https://github.com/facebookincubator/create-react-app\n\
    (48) https://twitter.com/dan_abramov/status/806985854099062785\n\n### 文件夹结构\n\n\
    ```text\nhackernews/\n├── README.md\n├── node_modules/\n├── package.json\n├──\
    \ .gitignore\n├── public/\n│   ├── favicon.ico\n│   ├── index.html\n│   └── manifest.json\n\
    └── src/\n    ├── App.css\n    ├── App.js\n    ├── App.test.js\n    ├── index.css\n\
    \    ├── index.js\n    ├── logo.svg\n    └── registerServiceWorker.js\n```\n\n\
    是对文件夹和文件的简要说明。刚开始时不理解所有的内容也没关系。\n\n- **README.md:** .md 扩展名表示该文件是一个 markdown 文件。Markdown\
    \ 被用作带有纯文本格式语法的轻量标记语言。许多源代码项目都带有一个 *README.md* 文件，为你提供关于项目的初始说明。当你最终将项目推送到 GitHub\
    \ 等平台时，当你访问仓库，*README.md* 文件会突出显示其内容。由于你使用了 *create-react-app*，你的 *README.md*\
    \ 应该与官方 create-react-app GitHub 仓库^(49)中显示的相同。\n- **node_modules/:** 该文件夹包含了过去和现在通过\
    \ npm 安装的所有 node 包。由于你使用了 *create-react-app*，应该已经为你安装了几个 node模块。通常你永远不会触碰这个文件夹，只需通过命令行使用\
    \ npm 安装和卸载 node 包。\n- **package.json:** 该文件向你展示了 node 包依赖列表和其他项目配置。\n- **.gitignore:**\
    \ 该文件指在使用 git 时不应被添加到远程 git 仓库的所有文件和文件夹。它们应该只存在于你的本地项目中。*node_modules/* 文件夹就是此类用例。只需与同事共享\
    \ *package.json* 文件，让他们能够自己安装所有依赖项，而无需共享整个依赖文件夹。\n\n(49) https://github.com/facebookincubator/create-react-app\n\
    \n- **public/:** 文件夹包含你在构建生产环境项目时所有的文件。最终，当你构建项目时，你在 *src/* 文件夹中编写的所有代码将被打包成几个文件并放在\
    \ public 文件夹中。\n- **manifest.json** 和 **registerServiceWorker.js:** 阶段不用担心这些文件的作用，我们在这个项目中不需要它们。\n\
    \n毕竟，你不需要接触上述的文件和文件夹。在开始，你需要的一切都位于 *src/* 文件夹中。重点在于 *src/App.js* 文件，用于实现 React\
    \ 组件。它将用于实现你的应用程序，但以后你可能想将组件拆分为多个文件，每个文件独立维护一个或几个组件。\n\n此外，你还会发现一个用于测试的 *src/App.test.js*\
    \ 文件和一个作为 React 世界入口的 *src/index.js*。你将在后面的章节中了解这两个文件。此外，还有一个 *src/index.css*\
    \ 和 *src/App.css* 文件用于为你的通用应用程序和组件设置样式。它们在打开时都带有默认样式。\n\n*create-react-app* 应用程序是一个\
    \ npm 项目。你可以使用 npm 为你的项目安装和卸载 node 包。此外，它还带有以下用于命令行的 npm 脚本：\n\n**命令行**\n```bash\n\
    // 在 http://localhost:3000 运行应用程序\nnpm start\n\n// 运行测试\nnpm test\n\n// 构建生产环境的应用程序\n\
    npm run build\n```\n\n脚本定义在你的 *package.json* 中。你的样板 React 应用现在已经引导完成。激动的部分在于练习，即最终在浏览器中运行你引导的应用程序。\n\
    \n**练习：**\n\n- npm start 你的应用程序并在浏览器中访问（你可以按 Control + C 退出命令）\n- 运行交互式 npm test\n\
    - 构建生产环境的应用程序\n\n(50) https://www.digitalocean.com/community\n(51) https://github.com/facebookincubator/create-react-app\n\
    \n"
