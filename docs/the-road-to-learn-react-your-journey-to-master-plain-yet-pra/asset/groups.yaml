    \ specified when using the Button component, the\n\nvalue will be an empty string\
    \ instead of undefined.\n\nBasics in React\n\n71\n\n## Component Declarations\n\
    \nBy now you have four ES6 class components. But you can do better. Let me introduce\
    \ functional\n\nstateless components as alternative for ES6 class components.\
    \ Before you will refactor your\n\ncomponents, let’s introduce the different types\
    \ of components in React.\n\n- **Functional Stateless Components:** These components\
    \ are functions which get an input and return an output. The input are the props.\
    \ The output is a component instance thus plain JSX. So far it is quite similar\
    \ to an ES6 class component. However, functional stateless components are functions\
    \ (functional) and they have no local state (stateless). You cannot access or\
    \ update the state with this.state or this.setState() because there is no this\
    \ object. Additionally, they have no lifecycle methods. You didn’t learn about\
    \ lifecycle methods yet, but you already used two: constructor() and render().\
    \ Whereas the constructor runs only once in the lifetime of a component, the render()\
    \ class method runs once in the beginning and every time the component updates.\
    \ Keep in mind that functional stateless components have no lifecycle methods,\
    \ when you arrive at the lifecycle methods chapter later on.\n\n- **ES6 Class\
    \ Components:** You already used this type of component declaration in your four\
    \ components. In the class definition, they extend from the React component. The\
    \ extend hooks all the lifecycle methods, available in the React component API,\
    \ to the component. That way you were able to use the render() class method. Additionally,\
    \ you can store and manipulate state in ES6 class components by using this.state\
    \ and this.setState().\n\n- **React.createClass:** The component declaration was\
    \ used in older versions of React and still in JavaScript ES5 React applications.\
    \ But Facebook declared it as deprecated^(74) in favor of JavaScript ES6. They\
    \ even added a deprecation warning in version 15.5^(75). You will not use it in\
    \ the book.\n\nSo basically there are only two component declarations left. But\
    \ when to use functional stateless components over ES6 class components? A rule\
    \ of thumb is to use functional stateless components when you don’t need local\
    \ state or component lifecycle methods. Usually you start to implement your components\
    \ as functional stateless components. Once you need access to the state or lifecycle\
    \ methods, you have to refactor it to an ES6 class component. In our application,\
    \ we started the other way around for the sake of learning React.\n\nLet’s get\
    \ back to your application. The App component uses internal state. That’s why\
    \ it has to stay as an ES6 class component. But the other three of your ES6 class\
    \ components are stateless. They don’t need access to this.state or this.setState().\
    \ Even more, they have no lifecycle methods. Let’s refactor together the Search\
    \ component to a stateless functional component. The Table and Button component\
    \ refactoring will remain as your exercise.\n\n74 https://facebook.github.io/react/blog/2015/03/10/react-v0.13.html\n\
    75 https://facebook.github.io/react/blog/2017/04/07/react-v15.5.0.html\n\nBasics\
    \ in React\n\n72\n\n**src/App.js**\n\n```javascript\nfunction Search(props) {\n\
    \  const { value, onChange, children } = props;\n  return (\n    <form>\n    \
    \  {children} <input\n        type=\"text\"\n        value={value}\n        onChange={onChange}\n\
    \      />\n    </form>\n  );\n}\n```\n\nThat’s basically it. The props are accessible\
    \ in the function signature and the return value is JSX. But you can do more code\
    \ wise in a functional stateless component. You already know the ES6 destructuring.\
    \ The best practice is to use it in the function signature to destructure the\
    \ props.\n\n**src/App.js**\n\n```javascript\nfunction Search({ value, onChange,\
    \ children }) {\n  return (\n    <form>\n      {children} <input\n        type=\"\
    text\"\n        value={value}\n        onChange={onChange}\n      />\n    </form>\n\
    \  );\n}\n```\n\nBut it can get better. You know already that ES6 arrow functions\
    \ allow you to keep your functions concise. You can remove the block body of the\
    \ function. In a concise body an implicit return is attached thus you can remove\
    \ the return statement. Since your functional stateless component is a function,\
    \ you can keep it concise as well.\n\nBasics in React\n\n73\n\n**src/App.js**\n\
    \n```javascript\nconst Search = ({ value, onChange, children }) =>\n  <form>\n\
    \    {children} <input\n      type=\"text\"\n      value={value}\n      onChange={onChange}\n\
    \    />\n  </form>\n```\n\nThe last step was especially useful to enforce only\
    \ to have props as input and JSX as output. Nothing in between. Still, you could*\
    \ do something* in between by using a block body in your ES6 arrow function.\n\
    \n**Code Playground**\n\n```javascript\nconst Search = ({ value, onChange, children\
    \ }) => {\n  // do something\n  return (\n    <form>\n      {children} <input\n\
    \        type=\"text\"\n        value={value}\n        onChange={onChange}\n \
    \     />\n    </form>\n  );\n}\n```\n\nBut you don’t need it for now. That’s why\
    \ you can keep the previous version without the block body. When using block bodies,\
    \ people often tend to do too many things in the function. By leaving the block\
    \ body out, you can focus on the input and output of your function. \n\nNow you\
    \ have one lightweight functional stateless component. Once you would need access\
    \ to its internal component state or lifecycle methods, you would refactor it\
    \ to an ES6 class component. In addition you saw how JavaScript ES6 can be used\
    \ in React components to make them more concise and elegant.\n\nBasics in React\n\
    \n74\n\n**Exercises:**\n\n- refactor the Table and Button component to stateless\
    \ functional components\n- read more about ES6 class components and functional\
    \ stateless components^(76)\n\n76 https://reactjs.org/docs/components-and-props\n\
    \nBasics in React\n\n75\n\n**Styling Components**\n\nLet’s add some basic styling\
    \ to the application. You can reuse src/App and index.css files. These files should\
    \ be imported in your project feel free to use your own style.\n\nFirst, styling\
    \ for overall application.\n\n**src/App.css**\n\n```css\nbody {\n  color: #222;\n\
    \  background: #f4f4f4;\n  font: 400 14px Arial, sans-serif;\n}\n\na {\n  color:\
    \ #222;\n}\n\na:hover {\n  text-decoration: underline;\n}\n\nul, li {\n  list-style:\
    \ none;\n  padding: 0;\n  margin: 0;\n}\n\ninput {\n  padding: 10px;\n  border-radius:\
    \ 5px;\n  outline: none;\n}\n\nbutton {\n  padding: 10px;\n  border-radius: 5px;\n\
    \  border: 1px solid #dddddd;\n}\n```\n\nBasics in React\n\n76\n\nSecond, styling\
    \ for components in the App file.\n\n**src/index.css**\n\n```css\npage {\n  margin:\
