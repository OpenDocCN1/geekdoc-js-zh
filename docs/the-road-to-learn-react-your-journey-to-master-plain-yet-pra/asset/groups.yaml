    **Conditional Rendering**


    Conditional rendering is introduced pretty early in React applications. But not
    in the case of the


    book, because there wasn’t such an use case yet. The conditional rendering happens
    when you want


    to make a decision to render either one or another element. Sometimes it means
    to render an element


    or nothing. After all, a conditional rendering simplest usage can be expressed
    by an if-else statement


    in JSX.


    The result object in the internal component state is null in the beginning. So
    far, the App


    component returned no elements when the result hasn’t arrived from the API. That’s
    already a


    conditional rendering, because you return earlier from the render() lifecycle
    method for a certain


    condition. The App component either renders nothing or its elements.


    But let’s go one step further. It makes more sense to wrap the Table component,
    which is the only


    component that depends on the result, in an independent conditional rendering.
    Everything else


    should be displayed, even though there is no result yet. You can simply use a
    ternary operator in


    your JSX.


    **src/App.js**


    class App extends Component {


    ...


    render() {


    **const { searchTerm, result } = this.state;**


    return (


    <div className="page">


    <div className="interactions">


    <Search


    value={searchTerm}


    onChange={this.onSearchChange}


    \>


    Search


    </Search>


    </div>


    **{ result**


    **? <Table**


    **list={result.hits}**


    **pattern={searchTerm}**


    **onDismiss={this.onDismiss}**


    **/>**


    **: null**


    **}**'
