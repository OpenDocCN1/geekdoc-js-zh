    functionality.


    The process of lifting state can go the other way as well: from child to parent
    component. It is called


    as lifting state up. Imagine you were dealing with internal state in a child component.
    Now you


    want to fulfill a requirement to show the state in your parent component as well.
    You would have to


    lift up the state to your parent component. But it goes even further. Imagine
    you want to show the


    state in a sibling component of your child component. Again you would have to
    lift the state up to


    your parent component. The parent component deals with the internal state, but
    exposes it to both


