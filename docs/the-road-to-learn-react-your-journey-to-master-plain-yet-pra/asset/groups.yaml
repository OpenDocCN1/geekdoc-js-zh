- md: "\nGetting Real with an API\n\nreturn (\n  <div className=\"page\">\n    <div\
    \ className=\"interactions\">\n      ...\n    </div>\n    <Table\n      list={list}\n\
    \      onDismiss={this.onDismiss}\n    />\n    <div className=\"interactions\"\
    >\n      <Button onClick={() => this.fetchSearchTopStories(searchKey, page + 1)}>\n\
    \        More\n      </Button>\n    </div>\n  </div>\n);\n}\n\n\nSince you default\
    \ to an empty list when there is no result by searchKey, you can spare the conditional\
    \ rendering for the Table component now. Additionally you will need to pass the\
    \ searchKey rather than the searchTerm to the “More” button. Otherwise your paginated\
    \ fetch depends on the searchTerm value which is fluctuant. Moreover make sure\
    \ to keep the fluctuant searchTerm property for the input field in the “Search”\
    \ component.\n\nThe search functionality should work again. It stores all results\
    \ from the Hacker News API. Additionally the onDismiss() method needs to get improved.\
    \ It still deals with the result object. Now it has to deal with multiple results.\n\
    \n**src/App.js**\n```javascript\nonDismiss(id) {\n  const { searchKey, results\
