  - '[PAGE 39]


    Introduction to React


    26


    **ES6 Classes**


    JavaScript ES6 introduced classes. A class is commonly used in object-oriented
    programming


    languages. JavaScript was and is very flexible in its programming paradigms. You
    can do functional


    programming and object-oriented programming side by side for their particular
    use cases.


    Even though React embraces functional programming, for instance with immutable
    data structures,


    classes are used to declare components. They are called ES6 class components.
    React mixes the good


    parts of both programming paradigms.


    Let’s consider the following Developer class to examine a JavaScript ES6 class
    without thinking


    about a component.


    **Code Playground**


    **class** Developer {


    constructor(firstname, lastname) {


    **this**.firstname = firstname;


    **this**.lastname = lastname;


    }


    getName() {


    **return this**.firstname + '' '' +** this**.lastname;


    }


    }


    A class has a constructor to make it instantiable. The constructor can take arguments
    to assign it to


    the class instance. Additionally a class can define functions. Because the function
    is associated with


    a class, it is called a method. Often it is referenced as a class method.


    The Developer class is only the class declaration. You can create multiple instances
    of the class by


    invoking it. It is similar to the ES6 class component, that has a declaration,
    but you have to use it


    somewhere else to instantiate it.


    Let’s see how you can instantiate the class and how you can use its methods.


    **Code Playground**


    **const** robin =** new** Developer(''Robin'', ''Wieruch'');


    console.log(robin.getName());


    *// output: Robin Wieruch*


    React uses JavaScript ES6 classes for ES6 class components. You already used one
    ES6 class


    component.'
  - '[PAGE 40]


    Introduction to React


    27


    **src/App.js**


    **import** React, { Component } from ''react'';


    ...


    **class** App** extends** Component {


    render() {


    ...


    }


    }


    The App class extends from Component. Basically you declare the App component,
    but it extends


    from another component. What does extend mean? In object-oriented programming
    you have the


    principle of inheritance. It is used to pass over functionalities from one class
    to another class.


    The App class extends functionality from the Component class. To be more specific,
    it inherits


    functionalities from the Component class. The Component class is used to extend
    a basic ES6 class


    to a ES6 component class. It has all the functionalities that a component in React
    needs to have. The


    render method is one of these functionalities that you have already used. You
    will learn about other


    component class methods later on.


    The Component class encapsulates all the implementation details of a React component.
    It enables


    developers to use classes as components in React.


    The methods a React Component exposes is the public interface. One of these methods
    has to be


    overridden, the others don’t need to be overridden. You will learn about the latter
    ones when the


    book arrives at lifecycle methods in a later chapter. The render() method has
    to be overridden,


    because it defines the output of a React Component. It has to be defined.


    Now you know the basics around JavaScript ES6 classes and how they are used in
    React to extend


    them to components. You will learn more about the Component methods when the book
    describes


    React lifecycle methods.


    **Exercises:**


    • read more about ES6 classes^(63)


    63https://developer.mozilla.org/en/docs/Web/JavaScript/Reference/Classes'
- md: "\n## Introduction to React\n\n28\n\nYou have learned to bootstrap your own\
    \ React application! Let’s recap the last chapters:\n\n- React\n- create-react-app\
    \ bootstraps a React application\n- JSX mixes up HTML and JavaScript to define\
    \ the output of React components in their render methods\n- components, instances\
    \ and elements are different things in React\n- ReactDOM.render() is an entry\
    \ point for a React application to hook React into the DOM\n- built-in JavaScript\
    \ functionalities can be used in JSX\n- map can be used to render a list of items\
    \ as HTML elements\n- ES6\n- variable declarations with const and let can be used\
    \ for specific use cases\n- use const over let in React applications\n- arrow\
    \ functions can be used to keep your functions concise\n- classes are used to\
    \ define components in React by extending them\n\nIt makes sense to take a break\
    \ at this point. Internalize the learnings and apply them on your own.\n\nYou\
    \ can experiment with the source code you have written so far. You can find the\
    \ source code in the official repository(64).\n\n64 https://github.com/the-road-to-learn-react/hackernews-client/tree/5.1\n\
    \n## Basics in React\n\nThe chapter will guide you through the basics of React.\
    \ It covers state and interactions in components, because static components are\
    \ a bit dull, aren’t they? Additionally, you will learn about the different ways\
    \ to declare a component and how to keep components composable and reusable. Be\
    \ prepared to breathe life into your components.\n\n## Basics in React\n\n30\n\
    \n### Internal Component State\n\nInternal component state, also known as local\
    \ state, allows you to save, modify and delete properties that are stored in your\
    \ component. The ES6 class component can use a constructor to initialize internal\
    \ component state later on. The constructor is called only once when the component\
    \ initializes.\n\nLet’s introduce a class constructor.\n\n**src/App.js**\n\n```javascript\n\
    class App extends Component {\n  constructor(props) {\n    super(props);\n  }\n\
    \  ...\n}\n```\n\nWhen having a constructor in your ES6 class component, it is\
    \ mandatory to call super(); because the App component is a subclass of Component.\
    \ Hence the extends Component in your App component declaration. You will learn\
    \ more about ES6 class components later on.\n\nYou can call super(props); as well.\
    \ It sets this.props in your constructor in case you want to access them in the\
    \ constructor. Otherwise, when accessing this.props in the constructor, they would\
    \ be undefined. You will learn more about the props of a React component later\
    \ on.\n\nNow, in your case, the initial state in your component should be the\
    \ sample list of items.\n\n**src/App.js**\n\n```javascript\nconst list = [\n \
    \ {\n    title: 'React',\n    url: 'https://facebook.github.io/react/',\n    author:\
    \ 'Jordan Walke',\n    num_comments: 3,\n    points: 4,\n    objectID: 0,\n  },\n\
    \  ...\n];\n```\n\n## Basics in React\n\n31\n\n```javascript\nclass App extends\
    \ Component {\n  constructor(props) {\n    super(props);\n    this.state = {\n\
    \      list: list,\n    };\n  }\n  ...\n}\n```\n\nThe state is bound to the class\
    \ by using the this object. Thus you can access the local state in your whole\
    \ component. For instance, it can be used in the render() method. Previously you\
    \ have mapped a static list of items in your render() method that was defined\
    \ outside of your component. Now you are about to use the list from your local\
    \ state in your component.\n\n**src/App.js**\n\n```javascript\nclass App extends\
    \ Component {\n  ...\n  render() {\n    return (\n      <div className=\"App\"\
    >\n        {this.state.list.map(item =>\n          <div key={item.objectID}>\n\
    \            <span>\n              <a href={item.url}>{item.title}</a>\n     \
    \       </span>\n            <span>{item.author}</span>\n            <span>{item.num_comments}</span>\n\
    \            <span>{item.points}</span>\n          </div>\n        )}\n      </div>\n\
    \    );\n  }\n}\n```\n\n## Basics in React\n\n32\n\nThe list is part of the component\
    \ now. It resides in the internal component state. You could add items, change\
    \ items or remove items in and from your list. Every time you change your component\
    \ state, the render() method of your component will run again. That’s how you\
    \ can simply change your internal component state and be sure that the component\
    \ re-renders and displays the correct data that comes from the local state.\n\n\
    But be careful. Don’t mutate the state directly. You have to use a method called\
    \ setState() to modify your state. You will get to know it in a following chapter.\n\
    \n**Exercises:**\n- experiment with the local state\n- define more initial state\
    \ in the constructor\n- use and access the state in your render() method\n- read\
    \ more about the ES6 class constructor(65)\n\n65 https://developer.mozilla.org/en/docs/Web/JavaScript/Reference/Classes#Constructor\n\
    \n## Basics in React\n\n33\n\n### ES6 Object Initializer\n\nIn JavaScript ES6,\
    \ you can use a shorthand property syntax to initialize your objects more concisely.\
    \ Imagine the following object initialization:\n\n**Code Playground**\n\n```javascript\n\
    const name = 'Robin';\nconst user = {\n  name: name,\n};\n```\n\nWhen the property\
    \ name in your object is the same as the variable, you can do the following:\n\
    \n**Code Playground**\n\n```javascript\nconst name = 'Robin';\nconst user = {\n\
    \  name,\n};\n```\n\nIn your application, you can do the same. Note that elements\
    \ with multiple attributes get messy as one line at some point. That’s why the\
    \ button element is used with multilines and indentations to keep it readable.\
    \ But it is not mandatory. It is only a code style recommendation that I highly\
    \ recommend.\n\n## Basics in React\n\n34\n\n### ES6 Object Initializer\n\nIn JavaScript\
    \ ES6, you can use a shorthand property syntax to initialize your objects more\
    \ concisely. Imagine the following object initialization:\n\n**Code Playground**\n\
    \n```javascript\nconst name = 'Robin';\nconst user = {\n  name: name,\n};\n```\n\
    \nWait, let me re-examine the OCR flow.\nActually, the OCR is a bit jumbled in\
    \ the middle. Let me reconstruct the logic based on the provided text:\n\nWhen\
    \ the property name in your object is the same as the variable, you can do the\
    \ following:\n\n**Code Playground**\n\n```javascript\nconst name = 'Robin';\n\
    const user = {\n  name,\n};\n```\n\nIn your application, you can do the same.\
    \ Note that elements with multiple attributes get messy as one line at some point.\
    \ That’s why the button element is used with multilines and indentations to keep\
    \ it readable. But it is not mandatory. It is only a code style recommendation\
    \ that I highly recommend.\n\n## Basics in React\n\n35\n\n### Unidirectional Data\
    \ Flow\n\nNow you have some internal state in your component. However, you have\
    \ not manipulated the state yet. Let’s add a button for each item in the displayed\
    \ list. The button says “Dismiss” and is going to remove the item from list.\n\
    \n**src/App.js**\n\n```javascript\nclass App extends Component {\n  ...\n  render()\
    \ {\n    return (\n      <div className=\"App\">\n        {this.state.list.map(item\
    \ =>\n          <div key={item.objectID}>\n            <span>\n              <a\
    \ href={item.url}>{item.title}</a>\n            </span>\n            <span>{item.author}</span>\n\
    \            <span>{item.num_comments}</span>\n            <span>{item.points}</span>\n\
    \            <button\n              onClick={() => this.onDismiss(item.objectID)}\n\
    \              type=\"button\"\n            >\n              Dismiss\n       \
    \     </button>\n          </div>\n        )}\n      </div>\n    );\n  }\n}\n\
    ```\n\nThe onDismiss() class method is not defined yet. We will do it in a moment,\
    \ but for now the focus should be on the onClick handler of the button.\n\n##\
    \ Basics in React\n\n36\n\n### Unidirectional Data Flow\n\nThe onClick handler\
    \ is enclosed by another function. It is an arrow function. That way, you can\
    \ sneak in the objectID property of the item to identify the item will be dismissed.\
    \ Now you have to implement the onDismiss() functionality. It takes an id to identify\
    \ the item to dismiss. The function is bound to the class and thus becomes a class\
    \ method. That’s why you access it with this.onDismiss() and not onDismiss().\
    \ The this object is your class instance. In order to define the onDismiss() as\
    \ class method, you have to bind it in the constructor. Bindings will be explained\
    \ in another chapter later.\n\n**src/App.js**\n\n```javascript\nclass App extends\
    \ Component {\n  constructor(props) {\n    super(props);\n    this.state = {\n\
    \      list,\n    };\n    this.onDismiss = this.onDismiss.bind(this);\n  }\n \
    \ render() {\n    ...\n  }\n}\n```\n\nIn the next step, you have to define its\
    \ functionality, the business logic, in your class. Class methods can be defined\
    \ the following way.\n\n"
  mdcn: "\n\n## React 简介\n\n28\n\n你已经学会了如何构建自己的 React 应用程序！让我们回顾一下最后几章：\n\n- React\n\
    - create-react-app 构建 React 应用程序\n- JSX 将 HTML 和 JavaScript 混合，以定义 React 组件在渲染方法中的输出\n\
    - React 中的组件（components）、实例（instances）和元素（elements）是不同的\n- ReactDOM.render() 是\
    \ React 应用将 React 挂载到 DOM 的入口\n- 内置的 JavaScript 功能可以在 JSX 中使用\n- map 可以将项目列表渲染为\
    \ HTML 元素\n- ES6\n- 使用 `const` 和 `let` 进行变量声明可以用于特定场景\n- 在 React 应用中，优先使用 `const`\
    \ 而非 `let`\n- 箭头函数可以保持函数简洁\n- React 中通过扩展类（classes）来定义组件\n\n在这个阶段休息一下是合理的。内化所学的知识并将它们应用到实践中。\n\
    \n你可以尝试你目前编写的源代码。你可以在官方仓库(64)中找到源代码。\n\n64 https://github.com/the-road-to-learn-react/hackernews-client/tree/5.1\n\
    \n## React 基础\n\n本章将引导你学习 React 的基础。它涵盖了组件中的状态和交互，因为静态组件有点无聊，不是吗？此外，你将学习声明组件的不同方法，以及如何保持组件的可组合性和复用性。准备好为你的组件注入灵魂吧。\n\
    \n## React 基础\n\n30\n\n### 组件内部状态\n\n组件内部状态（称为本地状态）允许你保存、修改和删除存储在组件中的属性。ES6 类组件可以使用构造函数来初始化组件内部状态。构造函数在组件初始化时仅会被调用一次。\n\
    \n让我们引入类构造函数。\n\n**src/App.js**\n\n```javascript\nclass App extends Component\
    \ {\n  constructor(props) {\n    super(props);\n  }\n  ...\n}\n```\n\n在 ES6 类组件中使用构造函数时，必须调用\
    \ `super()`，因为 `App` 组件是 `Component` 的子类。因此在你的 `App` 组件声明中使用了 `extends Component`。稍后你会学习更多关于\
    \ ES6 类组件的知识。\n\n你可以调用 `super(props)`。它会在构造函数中设置 `this.props`，以防你想在构造函数中访问它们。否则，在构造函数中访问\
    \ `this.props` 时它们将是 `undefined`。稍后你会学习更多关于 React 组件 props 的知识。\n\n现在，在你的情况下，组件中的初始状态应该是示例项目列表。\n\
    \n**src/App.js**\n\n```javascript\nconst list = [\n  {\n    title: 'React',\n\
    \    url: 'https://facebook.github.io/react/',\n    author: 'Jordan Walke',\n\
    \    num_comments: 3,\n    points: 4,\n    objectID: 0,\n  },\n  ...\n];\n```\n\
    \n## React 基础 \n\n31\n\n```javascript\nclass App extends Component {\n  constructor(props)\
    \ {\n    super(props);\n    this.state = {\n      list: list,\n    };\n  }\n \
    \ ...\n}\n```\n\n状态通过 `this` 对象绑定到类上。因此，你可以在整个组件中访问本地状态。例如，它可以在 `render()` 方法中使用。之前你在\
    \ `render()` 方法中映射了一个定义在组件外部的静态项目列表。现在，你正准备在组件中使用本地状态中的列表。\n\n**src/App.js**\n\
    \n```javascript\nclass App extends Component {\n  ...\n  render() {\n    return\
    \ (\n      <div className=\"App\">\n        {this.state.list.map(item =>\n   \
    \       <div key={item.objectID}>\n            <span>\n              <a href={item.url}>{item.title}</a>\n\
    \            </span>\n            <span>{item.author}</span>\n            <span>{item.num_comments}</span>\n\
    \            <span>{item.points}</span>\n          </div>\n        )}\n      </div>\n\
    \    );\n  }\n}\n```\n\n## React 基础 \n\n32\n\n列表现在是组件的一部分了。它存在于组件内部状态中。你可以对列表进行添加、更改或删除项目。每当你更改组件状态时，组件的\
    \ `render()` 方法就会再次运行。这就是你如何能够简单地更改内部内部状态，并确保组件重新渲染并显示来自本地状态的正确数据。\n\n但要小心。不要直接变异（mutate）状态。你必须使用一个名为\
    \ `setState()` 的方法来修改你的状态。你将在接下来的章节中了解它。\n\n**练习：**\n- 尝试本地状态\n- 在构造函数中定义更多初始状态\n\
    - 在 `render()` 方法中使用并访问状态\n- 阅读更多关于 ES6 类构造函数的知识(65)\n\n65 https://developer.mozilla.org/en/docs/Web/JavaScript/Reference/Classes#Constructor\n\
    \n## React 基础 \n\n33\n\n### ES6 对象初始化器\n\n在 JavaScript ES6 中，你可以使用简写属性语法来更简洁地初始化对象。想象一下以下对象初始化：\n\
    \n**代码沙场**\n\n```javascript\nconst name = 'Robin';\nconst user = {\n  name: name,\n\
    };\n```\n\n当对象中的属性名与变量名相同时，你可以执行以下操作：\n\n**代码沙场**\n\n```javascript\nconst name\
    \ = 'Robin';\nconst user = {\n  name,\n};\n```\n\n在你的应用程序中，你可以同样这样做。注意，具有多个属性的元素在某处会变成杂乱的一行。这就是为什么\
    \ `button` 使用了多行和缩进来保持其可读性。但这并非强制。这只是一个我非常推荐的代码风格建议。\n\n## React 基础 \n\n34\n\n\
    ### ES6 对象初始化器\n\n在 JavaScript ES6 中，你可以使用简写属性语法来更简洁地初始化对象。想象一下以下对象初始化：\n\n**代码沙场**\n\
    \n```javascript\nconst name = 'Robin';\nconst user = {\n  name: name,\n};\n```\n\
    \n等一下，让我重新检查 OCR 流程。\n实际上，OCR 在中间部分有点乱。让我根据提供的文本重构逻辑：\n\n当对象中的属性名与变量名相同时，你可以执行以下操作：\n\
    \n**代码沙场**\n\n```javascript\nconst name = 'Robin';\nconst user = {\n  name,\n\
    };\n```\n\n在你的应用程序中，你可以同样这样做。注意，具有多个属性的元素在某处会变成杂乱的一行。这就是为什么 `button` 元素使用了多行和缩进来保持其可读性。但这并非强制。这只是一个我非常推荐的代码风格建议。\n\
    \n## React 基础 \n\n35\n\n### 单向数据流\n\n现在你的组件中有了一些内部状态。然而，你还没有操纵过这些状态。让我们为显示列表中的每个项目添加一个按钮。按钮显示“Dismiss”（忽略），并将从列表中移除该项目。\n\
    \n**src/App.js**\n\n```javascript\nclass App extends Component {\n  ...\n  render()\
    \ {\n    return (\n      <div className=\"App\">\n        {this.state.list.map(item\
    \ =>\n          <div key={item.objectID}>\n            <span>\n              <a\
    \ href={item.url}>{item.title}</a>\n            </span>\n            <span>{item.author}</span>\n\
    \            <span>{item.num_comments}</span>\n            <span>{item.points}</span>\n\
    \            <button\n              onClick={() => this.onDismiss(item.objectID)}\n\
    \              type=\"button\"\n            >\n              Dismiss\n       \
    \     </button>\n          </div>\n        )}\n      </div>\n    );\n  }\n}\n\
    ```\n\n`onDismiss()` 类方法还没有定义。我们稍后会实现它，但现在的重点应该是按钮的 `onClick` 处理程序。\n\n## React\
