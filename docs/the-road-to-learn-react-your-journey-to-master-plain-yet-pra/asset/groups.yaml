    \ yet. It caches the results, but it doesn’t make use of them. The last step would\
    \ be to prevent the API request when a result is available in the cache.\n\n**src/App.js**\n\
    ```javascript\nclass App extends Component {\n  constructor(props) {\n    ...\n\
    \    this.needsToSearchTopStories = this.needsToSearchTopStories.bind(this);\n\
    \    this.setSearchTopStories = this.setSearchTopStories.bind(this);\n    this.fetchSearchTopStories\
    \ = this.fetchSearchTopStories.bind(this);\n    this.onSearchChange = this.onSearchChange.bind(this);\n\
    \    this.onSearchSubmit = this.onSearchSubmit.bind(this);\n    this.onDismiss\
    \ = this.onDismiss.bind(this);\n  }\n\n  needsToSearchTopStories(searchTerm) {\n\
    \    return !this.state.results[searchTerm];\n  }\n  ...\n\n  onSearchSubmit(event)\
    \ {\n    const { searchTerm } = this.state;\n    this.setState({ searchKey: searchTerm\
    \ });\n    if (this.needsToSearchTopStories(searchTerm)) {\n      this.fetchSearchTopStories(searchTerm);\n\
    \    }\n    event.preventDefault();\n  }\n  ...\n}\n```\n\nNow your client makes\
    \ a request to the API only once although you search for a search term twice.\
    \ Even paginated data with several pages gets cached that way, because you always\
    \ save the last page for each result in the results map. Isn’t that a powerful\
    \ approach to introduce caching to your application? The Hacker News API provides\
    \ you with everything you need to even cache paginated data effectively.\n\n##\
    \ Error Handling\n\nEverything is in place for your interactions with the Hacker\
    \ News API. You even have introduced an elegant way to cache your results from\
    \ the API and make use of its paginated list functionality to fetch an endless\
    \ list of sublists of stories from the API. But there is one piece missing. Unfortunately\
    \ it is often missed when developing applications nowadays: error handling. It\
    \ is too easy to implement the happy path without worrying about the errors that\
    \ can happen along the way.\n\nIn this chapter, you will introduce an efficient\
    \ solution to add error handling for your application in case of an erroneous\
    \ API request. You have already learned about the necessary building blocks in\
    \ React to introduce error handling: local state and conditional rendering. Basically,\
    \ the error is only another state in React. When an error occurs, you will store\
    \ it in the local state and display it with a conditional rendering in your component.\
    \ That’s it. Let’s implement it in the App component, because it’s the component\
    \ that is used to fetch the data from the Hacker News API in the first place.\n\
    \nFirst, you have to introduce the error in the local state. It is initialized\
    \ as null, but will be set to the error object in case of an error.\n\n**src/App.js**\n\
    ```javascript\nclass App extends Component {\n  constructor(props) {\n    super(props);\n\
    \    this.state = {\n      results: null,\n      searchKey: '',\n      searchTerm:\
    \ DEFAULT_QUERY,\n      error: null,\n    };\n  }\n  ...\n}\n}\n```\n\nSecond,\
    \ you can use the catch block in your native fetch to store the error object in\
    \ the local state by using setState(). Every time the API request isn’t successful,\
    \ the catch block would be executed.\n\n**src/App.js**\n```javascript\nclass App\
    \ extends Component {\n  ...\n  fetchSearchTopStories(searchTerm, page = 0) {\n\
    \    fetch(`${PATH_BASE}${SEARCH}?${searchTerm}&page=${page}`)\n      .then(response\
    \ => response.json())\n      .then(result => this.setSearchTopStories(result))\n\
    \      .catch(error => this.setState({ error }));\n  }\n  ...\n}\n```\n\nThird,\
    \ you can retrieve the error object from your local state in the render() method\
    \ and display a message in case of an error using React’s conditional rendering.\n\
    \n**src/App.js**\n```javascript\nclass App extends Component {\n  ...\n  render()\
    \ {\n    const { searchTerm, results, searchKey, error } = this.state;\n    if\
    \ (error) {\n      return <p>Something went wrong.</p>;\n    }\n    return (\n\
    \      <div className=\"page\">\n        ...\n      </div>\n    );\n  }\n}\n```\n\
    \nThat’s it. If you want to test that your error handling is working, you can\
    \ change the API URL to something that is non existent.\n\n**src/App.js**\n```javascript\n\
    const PATH_BASE = 'https://foo.bar.com/api/v1';\n```\n\nAfterward, you should\
    \ get the error message instead of your application. It is up to you where you\
    \ want to place the conditional rendering for the error message. In this case\
    \ the whole app isn’t displayed anymore. That wouldn’t be the best experience.\
    \ So what about displaying either Table component or the error message? The remaining\
    \ application would still be visible in case of an error.\n\n**src/App.js**\n\
    ```javascript\nclass App extends Component {\n  ...\n  render() {\n    const {\
    \ searchTerm, results, searchKey, error } = this.state;\n    const page = (results\
    \ && searchKey && results[searchKey].page) || 0;\n    const list = (results &&\
    \ searchKey && results[searchKey].hits) || [];\n    return (\n      <div className=\"\
    page\">\n        <div className=\"interactions\">\n          ...\n        </div>\n\
    \        {error\n          ? <div className=\"interactions\">\n              <p>Something\
    \ went wrong.</p>\n            </div>\n          : <Table\n              list={list}\n\
    \              onDismiss={this.onDismiss}\n            />\n        }\n       \
    \ ...\n      </div>\n    );\n  }\n}\n```\n\nIn the end, don’t forget to revert\
    \ the URL for the API to the existent one.\n\n**src/App.js**\n```javascript\n\
    const PATH_BASE = 'https://hn.algolia.com/api/v1';\n```\n\nYour application should\
    \ still work, but this time with error handling in case the API request fails.\n\
    \n**Exercises:**\n- read more about React’s Error Handling for Components (107)\n\
    107 https://reactjs.org/blog/2017/07/26/error-handling-in-react.html\n\n## Axios\
    \ instead of Fetch\n\nIn one of the previous chapters, you have introduced the\
    \ native fetch API to perform a request to the Hacker News platform. The browser\
    \ enables you to use this native fetch API. However, not all browsers, especially\
    \ older browsers, support it. In addition, once you start to test your application\
    \ in a headless browser environment (there is no browser, instead it is only mocked),\
    \ there can be issues regarding the fetch API. Such a headless browser environment\
    \ can happen when writing and executing tests for your application which don’t\
    \ run in a real browser. There are a couple of ways to make fetch work in older\
    \ browsers (polyfills) and in tests (isomorphic-fetch (108)), but we won’t go\
    \ this rabbit hole in this book.\n\nAn alternative way to solve it would be to\
    \ substitute the native fetch API with a stable library such as axios (109). Axios\
    \ is a library that solves only one problem, but it solves it with a high quality:\
    \ performing asynchronous requests to remote APIs. That’s why you will use it\
    \ in this book. On a concrete level, the chapter should show you how you can substitute\
    \ a library (which is a native API of the browser in this case) with another library.\
    \ On an abstract level, it should show how you can always find a solution for\
    \ the quirks (e.g. old browsers, headless browser tests) in web development. So\
    \ never stop to look for solutions if anything gets in your way.\n\nLet’s see\
    \ how the native fetch API can be substituted with axios. Actually everything\
    \ said before sounds more difficult than it is. First, you have to install axios\
    \ on the command line:\n\n**Command Line**\n```bash\nnpm install axios\n```\n\n\
    Second, you can import axios in your App component’s file:\n\n**src/App.js**\n\
    ```javascript\nimport React, { Component } from 'react';\nimport axios from 'axios';\n\
    import './App.css';\n...\n```\n\nAnd last but not least, you can use it instead\
    \ of fetch(). Its usage looks almost identical to the native fetch API. It takes\
    \ the URL as argument and returns a promise. You don’t have to transform the returned\
    \ response to JSON anymore. Axios is doing it for you and wraps the result into\
    \ a data object in JavaScript. Thus make sure to adapt your code to the returned\
    \ data structure.\n\n108 https://github.com/matthew-andrews/isomorphic-fetch\n\
    109 https://github.com/axios/axios\n"
