    ## FAQ


    vii


    **Can I help to improve it?** Yes. You can have a direct impact with your thoughts
    and contributions on GitHub^(19). I don’t claim to be an expert nor to write in
    native English. I would appreciate your help very much.


    **Can I support the project?** Yes. Feel free to reach out. I invest a lot of
    my time into open source tutorials and learning resources. You can have a look
    at my about me^(20) page. I would love to have you as my Patron on Patreon^(21).


    **Is there a call to action?** Yes. I want you to take a moment to think about
    a person who would be a good match to learn React. The person could have shown
    the interest already, could be in the middle of learning React or might not yet
    be aware about wanting to learn React. Reach out to that person and share the
    book. It would mean a lot to me. The book is intended to be given to others.


    19 https://github.com/rwieruch/the-road-to-learn-react

    20 https://www.robinwieruch.de/about/

