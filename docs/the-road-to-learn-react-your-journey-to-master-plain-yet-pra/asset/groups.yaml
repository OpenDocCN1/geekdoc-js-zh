    \n\nonChange={this.onSearchChange}\n\n/>\n\n</form>\n\n**{this...list.filter(...).map(item\
    \ =>**\n\n...\n\n)}\n\n</div\n\n);\n\n}\n}\n```\n\n你已经学习了 React 中的单向数据流。同样的规则适用于输入框，它通过更新本地状态来过滤列表。当状态更改时，`render()`\
    \ 方法再次运行，并使用本地状态中的最新 `searchTerm` 来应用过滤条件。\n\n但我们在输入元素中不是漏掉了什么吗？input 标签带有 `value`\
