    **src/App.js**


    **const withLoading = (Component) => (props) =>**


    **props.isLoading**


    **? <Loading />**


    **: <Component { ...props } />**


    Based on the loading property you can apply a conditional rendering. The function
    will return the


    Loading component or the input component.


    In general it can be very efficient to spread an object, like the props object
    in the previous example,


    as input for a component. See the difference in the following code snippet.


    **Code Playground**


    *// before you would have to destructure the props before passing them*


    **const** { foo, bar } = props;


    <SomeComponent foo\={foo} bar\={bar} />


    *// but you can use the object spread operator to pass all object properties*


    <SomeComponent { ...props } />


    There is one little thing that you should avoid. You pass all the props including
    the isLoading


    property, by spreading the object, into the input component. However, the input
    component may


    not care about the isLoading property. You can use the ES6 rest destructuring
    to avoid it.


    **src/App.js**


    **const withLoading = (Component) => ({ isLoading, ...rest }) =>**


    **isLoading**


    **? <Loading />**


    **: <Component { ...rest } />**


    It takes one property out of the object, but keeps the remaining object. It works
    with multiple


    properties as well. You might have already read about it in the destructuring
    assignment^(127).


    Now you can use the HOC in your JSX. An use case in the application could be to
    show either


    the “More” button or the Loading component. The Loading component is already encapsulated


    in the HOC, but an input component is missing. In the use case of showing a Button
    component


    or a Loading component, the Button is the input component of the HOC. The enhanced
    output


    component is a ButtonWithLoading component.


