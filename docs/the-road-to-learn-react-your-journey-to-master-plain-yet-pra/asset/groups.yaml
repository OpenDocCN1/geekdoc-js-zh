- md: "\n## Basics in React\n\n54\n\n**src/App.js**\n\n```javascript\nclass App extends\
    \ Component {\n\n...\n\nrender() {\n\nreturn (\n\n<div className=\"App\">\n\n\
    <form>\n\n<input\n\ntype=\"text\"\n\nonChange={this.onSearchChange}\n\n/>\n\n\
    </form>\n\n**{this.state.list.filter(...).map(item =>**\n\n...\n\n)}\n\n</div\n\
    \n);\n\n}\n\n}\n```\n\nLet’s approach the filter function in a different way this\
    \ time. We want to define the filter argument, the function that is passed to\
    \ the filter function, outside of the ES6 class component. There we don’t don’t\
    \ have access to the state of the component and thus we have no access to the\
    \ searchTerm property to evaluate the filter condition. We have to pass the searchTerm\
    \ to the filter function and have to return a new function to evaluate the condition.\
    \ That’s called a higher-order function.\n\nNormally I wouldn’t mention higher-order\
    \ functions, but in a React book it makes total sense. It makes sense to know\
    \ about higher-order functions, because React deals with a concept called higher-order\
    \ components. You will get to know the concept later in the book. Now again, let’s\
    \ focus on the filter functionality.\n\nFirst, you have to define the higher-order\
    \ function outside of your App component.\n\n55\n\nBasics in React\n\n**src/App.js**\n\
    \n```javascript\n**function isSearched(searchTerm) {**\n**return function(item)\
    \ {**\n**// some condition which returns true or false**\n}**\n}\n\nclass App\
    \ extends Component {\n\n...\n\n}\n```\n\nThe function takes the searchTerm and\
    \ returns another function, because after all the filter function takes a function\
    \ as its input. The returned function has access to the item object because it\
    \ is the function that is passed to the filter function. In addition, the returned\
    \ function will be used to filter the list based on the condition defined in the\
    \ function. Let’s define the condition.\n\n**src/App.js**\n\n```javascript\nfunction\
    \ isSearched(searchTerm) {\n\nreturn function(item) {\n\n**return item.title.toLowerCase().includes(searchTerm.toLowerCase());**\n\
    \n}\n\n}\n\nclass App extends Component {\n\n...\n\n}\n```\n\nThe condition says\
    \ that you match the incoming searchTerm pattern with the title property of the\
    \ item from your list. You can do that with the built-in includes JavaScript functionality.\
    \ Only when the pattern matches, you return true and the item stays in the list.\
    \ When the pattern doesn’t match the item is removed from the list. But be careful\
    \ with pattern matching: You shouldn’t forget to lower case both strings. Otherwise\
    \ there will be mismatches between a search term ‘redux’ and an item title ‘Redux’.\
    \ Since we are working on a immutable list and return a new list by using the\
    \ filter function, the original list in the local state isn’t modified at all.\n\
    \nOne thing is left to mention: We cheated a bit by using the built-in includes\
    \ JavaScript functionality. It is already an ES6 feature. How would that look\
    \ like in JavaScript ES5? You would use the indexOf() function to get the index\
    \ of the item in the list. When the item is in the list, indexOf() will return\
    \ its index in the array.\n\n56\n\nBasics in React\n\n**Code Playground**\n\n\
    *// ES5*\n`string.indexOf(pattern) !== -1`\n\n*// ES6*\n`string.includes(pattern)`\n\
    \nAnother neat refactoring can be done with an ES6 arrow function again. It makes\
    \ the function more concise:\n\n**Code Playground**\n\n*// ES5*\n```javascript\n\
    **function** isSearched(searchTerm) {\n\n**return function**(item) {\n\n**return**\
    \ item.title.toLowerCase().indexOf(searchTerm.toLowerCase()) !== -1;\n\n}\n\n\
    }\n```\n\n*// ES6*\n```javascript\n**const** isSearched = searchTerm => item =>\n\
    \nitem.title.toLowerCase().includes(searchTerm.toLowerCase());\n```\n\nOne could\
    \ argue which function is more readable. Personally I prefer the second one. The\
    \ React ecosystem uses a lot of functional programming concepts. It happens often\
    \ that you will use a function which returns a function (higher-order functions).\
    \ In JavaScript ES6, you can express these more concisely with arrow functions.\n\
    \nLast but not least, you have to use the defined isSearched() function to filter\
    \ your list. You pass it the searchTerm property from your local state, it returns\
    \ the filter input function, and filters your list based on the filter condition.\
    \ Afterward it maps over the filtered list to display an element for each list\
    \ item.\n\n57\n\nBasics in React\n\n**src/App.js**\n\n```javascript\nclass App\
    \ extends Component {\n\n...\n\nrender() {\n\nreturn (\n\n<div className=\"App\"\
    >\n\n<form>\n\n<input\n\ntype=\"text\"\n\nonChange={this.onSearchChange}\n\n/>\n\
    \n</form>\n\n**{this.state.list.filter(isSearched(this.state.searchTerm)).map(item\
    \ =>**\n\n...\n\n)}\n\n</div\n\n);\n\n}\n\n}\n```\n\nThe search functionality\
    \ should work now. Try it yourself in the browser.\n\n**Exercises:**\n\n- read\
    \ more about React events (68)\n- read more about higher-order functions (69)\n\
    \n68 https://reactjs.org/docs/handling-events.html\n69 https://en.wikipedia.org/wiki/Higher-order_function\n\
    \n58\n\nBasics in React\n\n## ES6 Destructuring\n\nThere is a way in JavaScript\
    \ ES6 for an easier access to properties in objects and arrays. It’s called destructuring.\
    \ Compare the following snippet in JavaScript ES5 and ES6.\n\n**Code Playground**\n\
    \n```javascript\n**const** user = {\n\nfirstname: 'Robin',\n\nlastname: 'Wieruch',\n\
    };\n\n*// ES5*\n**var** firstname = user.firstname;\n\n**var** lastname = user.lastname;\n\
    \nconsole.log(firstname + ' ' + lastname);\n\n*// output: Robin Wieruch*\n\n*//\
    \ ES6*\n**const** { firstname, lastname } = user;\n\nconsole.log(firstname + '\
    \ ' + lastname);\n\n*// output: Robin Wieruch*\n```\n\nWhile you have to add an\
    \ extra line each time you want to access an object property in JavaScript ES5,\
    \ you can do it in one line in JavaScript ES6. A best practice for readability\
    \ is to use multilines when you destructure an object into multiple properties.\n\
    \n**Code Playground**\n\n```javascript\n**const** {\n\nfirstname,\n\nlastname\n\
    \n} = user;\n```\n\nThe same goes for arrays. You can destructure them too. Again,\
    \ multilines will keep your code scannable and readable.\n\n59\n\nBasics in React\n\
    \n**Code Playground**\n\n```javascript\n**const** users = ['Robin', 'Andrew',\
    \ 'Dan'];\n\n**const** [userOne, userTwo, userThree] = users;\n\nconsole.log(userOne,\
    \ userTwo, userThree);\n```\n\nPerhaps you have noticed that the local state in\
    \ the App component can get destructured same way.\n\n**src/App.js**\n\n```javascript\n\
    class App extends Component {\n\n...\n\nrender() {\n\nconst { searchTerm, list\
    \ } = this.state;\n\nreturn (\n\n<div className=\"App\">\n\n...\n\n**{list.filter(isSearched(searchTerm)).map(item\
    \ =>**\n\n...\n\n)}\n\n</div\n\n);\n\n}\n\n}\n```\n\nYou can do it the ES5 or\
