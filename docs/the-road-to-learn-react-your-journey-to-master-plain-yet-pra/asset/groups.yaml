    \ React 中，这被称为不受控组件（uncontrolled component），因为它们处理自己的状态。在 React 中，你应该确保让这些元素成为受控组件。\n\
    \n你应该如何做？你只需要设置输入框的 `value` 属性即可。值已经保存在 `searchTerm` 状态属性中了。那么为什么不从那里获取呢？\n\n\
    **src/App.js**\n\n```javascript\nclass App extends Component {\n\n...\n\nrender()\
