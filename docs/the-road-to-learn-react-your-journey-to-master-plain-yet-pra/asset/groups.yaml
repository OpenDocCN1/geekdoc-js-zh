    \    .then(response => response.json())\n    .then(result => this.setSearchTopStories(result))\n\
    \    .catch(error => error);\n}\n```\n\nAfterward, the request to the Hacker News\
    \ API fetches more list items in one request than before. As you can see, a powerful\
    \ API such as the Hacker News API gives you plenty of ways to experiment with\
    \ real world data. You should make use of it to make your endeavours when learning\
    \ something new more exciting. That’s how I learned about the empowerment that\
    \ APIs provide when learning a new programming language or library.\n\n104 https://www.robinwieruch.de/what-is-an-api-javascript/\n\
    \n## Getting Real with an API\n\n104\n\n**Exercises:**\n\n- read more about ES6\
    \ default parameters (105)\n- experiment with the Hacker News API parameters (106)\n\
    \n105 https://developer.mozilla.org/en/docs/Web/JavaScript/Reference/Functions/Default_parameters\n\
    106 https://hn.algolia.com/api\n\n## Getting Real with an API\n\n106\n\n### Client\
    \ Cache\n\nEach search submit makes a request to the Hacker News API. You might\
    \ search for “redux”, followed by “react” and eventually “redux” again. In total\
    \ it makes 3 requests. But you searched for “redux” twice and both times it took\
    \ a whole asynchronous roundtrip to fetch the data. In a client-sided cache you\
    \ would store each result. When a request to the API is made, it checks if a result\
    \ is already there. If it is there, the cache is used. Otherwise an API request\
    \ is made to fetch the data.\n\nIn order to have a client cache for each result,\
    \ you have to store multiple results rather than one result in your internal component\
    \ state. The results object will be a map with the search term as key and the\
    \ result as value. Each result from the API will be saved by search term (key).\n\
    \nAt the moment, your result in the local state looks similar to the following:\n\
    \n**Code Playground**\n\n```javascript\nresult: {\n  hits: [ ... ],\n  page: 2,\n\
    }\n```\n\nImagine you have made two API requests. One for the search term “redux”\
    \ and another one for “react”. The results object should look like the following:\n\
    \n**Code Playground**\n\n```javascript\nresults: {\n  redux: {\n    hits: [ ...\
    \ ],\n    page: 2,\n  },\n  react: {\n    hits: [ ... ],\n    page: 1,\n  },\n\
    \  ...\n}\n```\n\nLet’s implement a client-side cache with React setState(). First,\
    \ rename the result object to results in the initial component state. Second,\
    \ define a temporary searchKey which is used to store each result.\n\n## Getting\
    \ Real with an API\n\n107\n\n**src/App.js**\n\n```javascript\nclass App extends\
    \ Component {\n  constructor(props) {\n    super(props);\n    this.state = {\n\
    \      results: null,\n      searchKey: '',\n      searchTerm: DEFAULT_QUERY,\n\
    \    };\n  }\n  ...\n}\n```\n\nThe searchKey has to be set before each request.\
    \ You might wonder: Why don’t we use the searchTerm in the first place? The searchTerm\
    \ is a fluctuant variable because it changes every time you type into the Search\
    \ field. However, the searchKey is a non fluctuant variable to retrieve the current\
    \ result from your map and thus can be used to display the current result in your\
    \ render() method.\n\n**src/App.js**\n\n```javascript\ncomponentDidMount() {\n\
    \  const { searchTerm } = this.state;\n  this.setState({ searchKey: searchTerm\
    \ });\n  fetchSearchTopStories(searchTerm);\n}\n\nonSearchSubmit(event) {\n  const\
    \ { searchTerm } = this.state;\n  this.setState({ searchKey: searchTerm });\n\
    \  fetchSearchTopStories(searchTerm);\n  event.preventDefault();\n}\n```\n\n##\
    \ Getting Real with an API\n\n121\n\n108\n\nNow you have to adjust the functionality\
    \ where the result is stored in the state. The searchKey will be used as key.\n\
    \n**src/App.js**\n\n```javascript\nclass App extends Component {\n  ...\n  setSearchTopStories(result)\
    \ {\n    const { hits, page } = result;\n    const { searchKey, results } = this.state;\n\
    \    const oldHits = page !== 0\n      ? results[searchKey].hits\n      : [];\n\
    \    const updatedHits = [\n      ...oldHits,\n      ...hits\n    ];\n    this.setState({\n\
    \      results: {\n        ...results,\n        [searchKey]: { hits: updatedHits,\
    \ page }\n      }\n    });\n  }\n  ...\n}\n```\n\nFirst, you retrieve the searchKey\
    \ from the state. Second, the old hits have to be merged with the new hits. But\
    \ this time the old hits get retrieved from the results map with searchKey. Third,\
    \ a new result can be set in the results map in the state. Let’s examine the results\
    \ object in setState().\n\n```javascript\nresults: {\n  ...results,\n  [searchKey]:\
    \ { hits: updatedHits, page }\n}\n```\n\nThe bottom part makes sure to store the\
    \ updated result by searchKey in the map. The value is an object with a hits and\
    \ page property. The searchKey is the search term. You already learned the [searchKey]:\
    \ ... syntax. It is an ES6 computed property name. It helps you to allocate values\
    \ dynamically in an object. The upper part needs to spread all other results by\
    \ searchKey in the state by using the object operator. Otherwise you would lose\
    \ all results that you have stored before.\n\nNow you store all results by search\
    \ term. That’s the first step to enable your cache. In the next step, you can\
    \ retrieve the result depending on the non fluctuant searchKey from your map of\
    \ results. That’s why you had to introduce the searchKey in the first place as\
    \ non fluctuant variable. Otherwise the retrieval would be broken when you would\
    \ use the fluctuant searchTerm to retrieve the current result.\n\n**src/App.js**\n\
    \n```javascript\nclass App extends Component {\n  ...\n  render() {\n    const\
    \ {\n      searchTerm,\n      results,\n      searchKey\n    } = this.state;\n\
    \    const page = (\n      results &&\n      results[searchKey] &&\n      results[searchKey].page\n\
    \    ) || 0;\n    const list = (\n      results &&\n      results[searchKey] &&\n\
    \      results[searchKey].hits\n    ) || [];\n    ...\n  }\n}\n```\n"
