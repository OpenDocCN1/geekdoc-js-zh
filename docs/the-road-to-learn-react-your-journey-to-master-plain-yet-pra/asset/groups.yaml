    Do you know the Hacker News (81) platform? It’s a great news aggregator about\
    \ tech topics. In this book, you will use the Hacker News API to fetch stories\
    \ from the platform. There is basic (82) and search (83) API to get data from\
    \ the platform. The latter one makes sense in the case of this application in\
    \ order to search stories and understand the data structure.\n\n80 https://www.robinuch.de/what-is-an-api\n\
    81 https://news.ycombinator.com/\n82 https://github.com/HackerNews\n83 https://hn.algolia.com/api\n\
    \n### Lifecycle Methods\n\nYou will need to know about React lifecycle methods\
    \ before you can start to fetch data in your components. These methods can be\
    \ used in ES6 class components, but not in functional components. Do you remember\
    \ when the previous chapter taught you about ES6 classes and how they are used\
    \ in React? Apart from the render() method, there are several methods that are\
    \ used in ES6 class component: constructor() and render().\n\nThe constructor\
    \ is only called when an instance of the component is created and inserted in\
    \ the DOM. The component gets instantiated. The render() method is called during\
    \ the mount process, but also when the component updates. Now you know more about\
    \ the lifecycle methods and when they are called. But there are more of them.\n\
    \nThe mounting of a component has two lifecycle methods: componentWillMount()\
    \ and componentDidMount(). The constructor is called first, componentWillMount()\
    \ gets called before the render() method and componentDidMount() is called after\
    \ the render() method. Overall the mounting process has 4 lifecycle methods. They\
    \ are invoked in the following order:\n- constructor()\n- componentWillMount()\n\
    - render()\n- componentDidMount()\n\nBut what about the update lifecycle of a\
    \ component that happens when the state or the props change? Overall it has 5\
    \ lifecycle methods in the following order:\n- componentWillReceiveProps()\n-\
    \ shouldComponentUpdate()\n- componentWillUpdate()\n- render()\n- componentDidUpdate()\n\
    \nLast but not least is the unmounting lifecycle. It has only one lifecycle method:\
    \ componentWillUnmount().\n\nAfter all, you don’t need to know all of these methods\
    \ from the beginning. Even in a larger React application you will only use a few\
    \ of them apart from the constructor() and the render() method. Still it is good\
    \ to know that each lifecycle method can be used for specific use cases:\n\n-\
    \ constructor(props) - it is called when the component gets initialized. You can\
    \ set initial component state and bind class methods during that lifecycle method.\n\
    - componentWillMount() - it is called before the render() method. That’s why it\
    \ could be used to set internal component state because it will trigger a second\
    \ rendering of the component. Generally it is recommended to use the constructor()\
    \ to set the initial state.\n- render() - This lifecycle method is mandatory and\
    \ returns the elements as an output of the component. The method should be pure\
    \ and therefore shouldn’t modify the component state. It gets an input as props\
    \ and state and returns an element.\n- componentDidMount() - it is called only\
    \ once when the component mounted. That’s the perfect time to do an asynchronous\
    \ request to fetch data from an API. The fetched data would get stored in the\
    \ internal component state to display it in the render() lifecycle method.\n-\
    \ componentWillReceiveProps(nextProps) - the lifecycle method is called during\
    \ an update lifecycle. As input you get the next props. You can diff the next\
    \ props with the previous props by using this.props to apply a different behavior\
    \ based on the diff. Additionally, you can set state based on the next props.\n\
    - shouldComponentUpdate(nextProps, nextState) - it is always called when the component\
    \ updates due to state or props changes. You will use it in mature React applications\
    \ for performance optimizations. Depending on a boolean that you return from this\
    \ lifecycle method, the component and all its children will render or will not\
    \ render on an update lifecycle. You can prevent the render lifecycle method of\
    \ a component.\n- componentWillUpdate(nextProps, nextState) - the lifecycle method\
    \ is immediately invoked before the render() method. You already have the next\
    \ props and next state at your disposal. You can use the method as last opportunity\
    \ to perform preparations before the render method gets executed. Note that you\
    \ cannot trigger setState() anymore. If you want to compute state based on the\
    \ next props, you have to use componentWillReceiveProps().\n- componentDidUpdate(prevProps,\
    \ prevState) - the lifecycle method is immediately invoked after the render()\
    \ method. You can use it as opportunity to perform DOM operations or to perform\
    \ further asynchronous requests.\n- componentWillUnmount() - it is called before\
    \ you destroy your component. You can use the lifecycle method to perform any\
    \ clean up tasks.\n\nThe constructor() and render() lifecycle methods are already\
    \ used by you. These are the commonly used lifecycle methods for ES6 class components.\
    \ Actually the render() method is required, otherwise you wouldn’t return a component\
    \ instance.\n"
