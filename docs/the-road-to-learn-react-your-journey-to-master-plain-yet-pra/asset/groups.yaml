  - '[PAGE 203]


    Final Steps to Production


    190


    **Eject**


    The following step and knowledge is** not necessary** to deploy your application
    to production. Still,


    I want to explain it to you.* create-react-app* comes with one feature to keep
    it extendable but also


    to prevent a vendor lock-in. A vendor lock-in usually happens when you buy into
    a technology but


    there is no escape hatch of using it in the future. Fortunately in* create-react-app*
    you have such an


    escape hatch with “eject”.


    In your* package.json* you will find the scripts to* start*,* test* and* build*
    your application. The last script


    is* eject*. You could try it, but there is no way back.** It is a one-way operation.
    Once you eject,**


    **you can’t go back!** If you just started to learn React, it makes no sense to
    leave the convenient


    environment of* create-react-app*.


    If you would run npm run eject, the command would copy all the configuration and
    dependencies


    to your* package.json* and a new* config/* folder. You would convert the whole
    project into a custom


    setup with tooling that includes Babel and Webpack. After all, you would have
    full control over all


    these tools.


    The official documentation says that* create-react-app* is suitable for small
    to mid size projects. You


    shouldn’t feel obligated to use the “eject” command.


    **Exercises:**


    • read more about eject^(145)


    145https://github.com/facebookincubator/create-react-app#converting-to-a-custom-setup'
  - '[PAGE 204]


    Final Steps to Production


    191


    **Deploy your App**


    In the end, no application should stay on localhost. You want to go live. Heroku
    is a platform as


    a service where you can host your application. They offer a seamless integration
    with React. To


    be more specific: It’s possible to deploy a* create-react-app* in minutes. It
    is a zero-configuration


    deployment which follows the philosophy of* create-react-app*.


    You need to fulfill two requirements before you can deploy your application to
    Heroku:


    • install the Heroku CLI^(146)


    • create a free Heroku account^(147)


    If you have installed Homebrew, you can install the Heroku CLI from command line:


    **Command Line**


    brew update


    brew install heroku-toolbelt


    Now you can use git and Heroku CLI to deploy your application.


    **Command Line**


    git init


    heroku create -b https://github.com/mars/create-react-app-buildpack.git


    git add .


    git commit -m "react-create-app on Heroku"


    git push heroku master


    heroku open


    That’s it. I hope your application is up and running now. If you run into problems
    you can check


    the following resources:


    • Git and GitHub Essentials^(148)


    • Deploying React with Zero Configuration^(149)


    • Heroku Buildpack for create-react-app^(150)


    146https://devcenter.heroku.com/articles/heroku-command-line


    147https://www.heroku.com/


    148https://www.robinwieruch.de/git-essential-commands/


    149https://blog.heroku.com/deploying-react-with-zero-configuration


    150https://github.com/mars/create-react-app-buildpack'
