    **Event Handler**


    The chapter should give you a deeper understanding of event handlers in elements.
    In your


    application, you are using the following button element to dismiss an item from
    the list.


    **src/App.js**


    ...


    <button


    onClick\={() =>** this**.onDismiss(item.objectID)}


    type\="button"


    \>


    Dismiss


    </button>


    ...


    That’s already a complex use case, because you have to pass a value to the class
    method and thus you


    have to wrap it into another (arrow) function. So basically, it has to be a function
    that is passed to


    the event handler. The following code wouldn’t work, because the class method
    would be executed


    immediately when you open the application in the browser.


    **src/App.js**


    ...


    <button


    onClick\={**this**.onDismiss(item.objectID)}


    type\="button"


    \>


    Dismiss


    </button>


    ...


    When using onClick={doSomething()}, the doSomething() function would execute immediately


    when you open the application in your browser. The expression in the handler is
    evaluated. Since


    the returned value of the function isn’t a function anymore, nothing would happen
    when you click


    the button. But when using onClick={doSomething} whereas doSomething is a function,
    it would


    be executed when clicking the button. The same rules apply for the onDismiss()
    class method that


    is used in your application.'
- md: "\nBasics in React\n\n46\n\nHowever, using onClick={this.onDismiss} wouldn’t\
    \ suffice, because somehow the item.objectID\n\nproperty needs to be passed to\
    \ the class method to identify the item that is going to be dismissed.\n\nThat’s\
    \ why it can be wrapped into another function to sneak in the property. The concept\
    \ is called\n\nhigher-order functions in JavaScript and will be explained briefly\
    \ later on.\n\n**src/App.js**\n\n...\n\n<button\n  onClick={() => this.onDismiss(item.objectID)}\n\
    \  type=\"button\"\n>\n  Dismiss\n</button>\n\n...\n\nA workaround would be to\
    \ define the wrapping function somewhere outside and only pass the\n\ndefined\
    \ function to the handler. Since it needs access to the individual item, it has\
    \ to live in the\ninside of the map function block.\n\n**src/App.js**\n```javascript\n\
    class App extends Component {\n...\n  render() {\n    return (\n      <div className=\"\
    App\">\n        {this.state.list.map(item => {\n          const onHandleDismiss\
    \ = () =>\n            this.onDismiss(item.objectID);\n\n          return (\n\
    \            <div key={item.objectID}>\n              <span>\n               \
    \ <a href={item.url}>{item.title}</a>\n              </span>\n              <span>{item.author}</span>\n\
    \              <span>{item.num_comments}</span>\n              <span>{item.points}</span>\n\
    \              <span>\n                <button\n                  onClick={onHandleDismiss}\n\
    \                  type=\"button\"\n                >\n                  Dismiss\n\
    \                </button>\n              </span>\n            </div>\n      \
    \    );\n        })}\n      </div>\n    );\n  }\n}\n```\n\nAfter all, it has to\
    \ be a function that is passed to the element’s handler. As an example, try this\
    \ code\n\ninstead:\n\n**src/App.js**\n```javascript\nclass App extends Component\
    \ {\n...\n  render() {\n    return (\n      <div className=\"App\">\n        {this.state.list.map(item\
    \ =>\n          ...\n            <span>\n              <button\n             \
    \   onClick={console.log(item.objectID)}\n                type=\"button\"\n  \
    \            >\n                Dismiss\n              </button>\n           \
    \ </span>\n          </div>\n        )}\n      </div>\n    );\n  }\n}\n```\n\n\
    Basics in React\n\n48\n\nIt will run when you open the application in the browser\
    \ but not when you click the button. Whereas\n\nthe following code would only\
    \ run when you click the button. It is a function that is executed when\n\nyou\
    \ trigger the handler.\n\n**src/App.js**\n...\n<button\n  onClick={function ()\
    \ {\n    console.log(item.objectID)\n  }}\n  type=\"button\"\n>\n  Dismiss\n</button>\n\
    \n...\n\nIn order to keep it concise, you can transform it into a JavaScript ES6\
    \ arrow function again. That’s\n\nwhat we did with the onDismiss() class method\
    \ too.\n\n**src/App.js**\n...\n<button\n  onClick={() => console.log(item.objectID)}\n\
    \  type=\"button\"\n>\n  Dismiss\n</button>\n\n...\n\nOften newcomers to React\
    \ have difficulties with the topic of using functions in event handlers.\n\nThat’s\
    \ why I tried to explain it in more detail here. In the end, you should end up\
    \ with the following\n\ncode in your button to have a concisely inlined JavaScript\
    \ ES6 arrow function that has access to the\n\nobjectID property of the item object.\n\
    \nBasics in React\n\n49\n\n**src/App.js**\n```javascript\nclass App extends Component\
    \ {\n...\n  render() {\n    return (\n      <div className=\"App\">\n        {this.state.list.map(item\
    \ =>\n          <div key={item.objectID}>\n            ...\n            <span>\n\
    \              <button\n                onClick={() => this.onDismiss(item.objectID)}\n\
    \                type=\"button\"\n              >\n                Dismiss\n \
    \             </button>\n            </span>\n          </div>\n        )}\n \
    \     </div>\n    );\n  }\n}\n```\n\nAnother performance relevant topic, that\
    \ is often mentioned, are the implications of using arrow\n\nfunctions in event\
    \ handlers. For instance, the onClick handler for the onDismiss() method is\n\n\
    wrapping the method in another arrow function to be able to pass the item identifier.\
    \ So every\n\ntime the render() method runs, the handler instantiates the higher-order\
    \ arrow function. It *can*\n\nhave an impact on your application performance,\
    \ but in most cases you will not notice it. Imagine\n\nyou have a huge table of\
    \ data with 1000 items and each row or column has such an arrow function\n\nin\
    \ an event handler. Then it is worth to think about the performance implications\
    \ and therefore you\n\ncould implement a dedicated Button component to bind the\
    \ method in the constructor. But before\n\nthat happens it is premature optimization.\
    \ It is more valuable to focus on learning React itself.\n\n**Exercises:**\n\n\
    - try the different approaches of using functions in the onClick handler of your\
    \ button\n\nBasics in React\n\n50\n\n## **Interactions with Forms and Events**\n\
    \nLet’s add another interaction for the application to experience forms and events\
    \ in React. The\n\ninteraction is a search functionality. The input of the search\
    \ field should be used to temporarily\n\nfilter your list based on the title property\
    \ of an item.\n\nIn the first step, you are going to define a form with an input\
    \ field in your JSX.\n\n**src/App.js**\n```javascript\nclass App extends Component\
    \ {\n...\n  render() {\n    return (\n      <div className=\"App\">\n        <form>\n\
    \          <input type=\"text\" />\n        </form>\n        {this.state.list.map(item\
    \ =>\n          ...\n        )}\n      </div>\n    );\n  }\n}\n```\n\nIn the following\
    \ scenario you will type into the input field and filter the list temporarily\
    \ by the\n\nsearch term that is used in the input field. To be able to filter\
    \ the list based on the value of the\ninput field, you need to store the value\
    \ of the input field in your local state. But how do you access the\n\nvalue?\
    \ You can use **synthetic events** in React to access the event payload.\n\nLet’s\
    \ define a onChange handler for the input field.\n\n**src/App.js**\n```javascript\n\
    class App extends Component {\n...\n  render() {\n    return (\n      <div className=\"\
    App\">\n        <form>\n          <input\n            type=\"text\"\n        \
    \    onChange={this.onSearchChange}\n          />\n        </form>\n        ...\n\
    \      </div>\n    );\n  }\n}\n```\n\nThe function is bound to the component and\
    \ thus a class method again. You have to bind and define\n\nthe method.\n\n**src/App.js**\n\
    ```javascript\nclass App extends Component {\n  constructor(props) {\n    super(props);\n\
    \    this.state = {\n      list,\n    };\n    this.onSearchChange = this.onSearchChange.bind(this);\n\
    \    this.onDismiss = this.onDismiss.bind(this);\n  }\n\n  onSearchChange() {\n\
    \    ...\n  }\n...\n}\n```\n\nBasics in React\n\n52\n\nWhen using a handler in\
    \ your element, you get access to the synthetic React event in your callback\n\
    \nfunction’s signature.\n\n**src/App.js**\n```javascript\nclass App extends Component\
    \ {\n...\n  onSearchChange(event) {\n    ...\n  }\n...\n}\n```\n\nThe event has\
    \ the value of the input field in its target object. Hence you are able to update\
    \ the local\n\nstate with the search term by using this.setState() again.\n\n\
    **src/App.js**\n```javascript\nclass App extends Component {\n...\n  onSearchChange(event)\
    \ {\n    this.setState({ searchTerm: event.target.value });\n  }\n...\n}\n```\n\
    \nAdditionally, you shouldn’t forget to define the initial state for the searchTerm\
    \ property in the\nconstructor. The input field should be empty in the beginning\
    \ and thus the value should be an\n\nstring.\n\nBasics in React\n\n53\n\n**src/App.js**\n\
    ```javascript\nclass App extends Component {\n  constructor(props) {\n    super(props);\n\
    \    this.state = {\n      list,\n      searchTerm: '',\n    };\n    this.onSearchChange\
    \ = this.onSearchChange.bind(this);\n    this.onDismiss = this.onDismiss.bind(this);\n\
    \  }\n...\n}\n```\n\nNow you store the input value to your internal component\
    \ state every time the value in the input\n\nfield changes.\n\nA brief note about\
    \ updating the local state in a React component. It would be fair to assume that\
    \ when\n\nupdating the searchTerm with this.setState() the list needs to be passed\
    \ as well to preserve it. But\n\nthat isn’t the case. React’s this.setState()\
    \ is a shallow merge. It preserves the sibling properties\n\nin the state object\
    \ when updating one sole property. Thus the list state, even though you have\n\
    \nalready dismissed an item from it, would stay the same updating the searchTerm\
    \ property.\n\nLet’s get back to your application. The list isn’t filtered yet\
    \ based on the input field value that is\n\nstored in the local state. Basically\
    \ you have to filter the list temporarily based on the searchTerm.\n\nYou have\
    \ everything you need to filter it. So how to filter it temporarily now? In your\
    \ render()\n\nmethod, before you map over the list, you can apply a filter on\
    \ it. The filter would only evaluate\n\nif the searchTerm matches title property\
    \ of the item. You have already used the built-in JavaScript\n\nfilter functionality,\
    \ so let’s do it again. You can sneak in the filter function before the map function,\n\
    \nbecause the filter function returns a new array and thus the map function can\
    \ be used on it in such\n\na convenient way.\n"
  mdcn: "\nReact 基础\n\n46\n\n然而，使用 `onClick={this.onDismiss}` 是不够的，因为某种程度上需要将 `item.objectID`\n\
    \n属性传递给类方法，以识别将要移除的项。\n\n这就是为什么可以将其封装在另一个函数中来巧妙传入该属性。这个概念在\n\nJavaScript 中被称为高阶函数，稍后会简要解释。\n\
