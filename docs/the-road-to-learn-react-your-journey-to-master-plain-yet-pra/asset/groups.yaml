    \    );\n  }\n}\n```\n\n在接下来的场景中，你将在输入框中输入，并根据输入框中使用的搜索词临时过滤列表。为了根据输入字段的值过滤列表，你需要将输入字段的值存储在本地状态中。但你如何访问这个值呢？你可以使用\
