    \nAdvanced React Components\n\n156\n\n**Higher-Order Components**\n\nHigher-order\
    \ components (HOC) are an advanced concept in React. HOCs are an equivalent to\
    \ higher-order functions. They take any input - most of the time a component,\
    \ but also optional arguments - and return a component as output. The returned\
    \ component is an enhanced version of the input component and can be used in your\
    \ JSX.\n\nHOCs are used for different use cases. They can prepare properties,\
    \ manage state or alter the representation of a component. One use case could\
    \ be to use a HOC as a helper for a conditional rendering. Imagine you have a\
    \ List component that renders a list of items or nothing, because the list is\
    \ empty or null. The HOC could shield away that the list would render nothing\
    \ when there is no list. On the other hand, the plain List component doesn’t need\
    \ to bother anymore about an non existent list. It only cares about rendering\
    \ the list.\n\nLet’s do a simple HOC which takes a component as input and returns\
    \ a component. You can place it in your *src/App.js* file.\n\n**src/App.js**\n\
    \n```javascript\nfunction withFoo(Component) {\n  return function(props) {\n \
    \   return <Component { ...props } />;\n  }\n}\n```\n\nOne neat convention is\
    \ to prefix the naming of a HOC with with. Since you are using JavaScript ES6,\
    \ you can express the HOC more concisely with an ES6 arrow function.\n\n**src/App.js**\n\
    \n```javascript\nconst withFoo = (Component) => (props) =>\n  <Component { ...props\
    \ } />\n```\n\nIn the example, the input component would stay the same as the\
    \ output component. Nothing happens. It renders the same component instance and\
    \ passes all of the props to the output component. But that’s useless. Let’s enhance\
    \ the output component. The output component should show the Loading component,\
    \ when the loading state is true.\n\nAdvanced React Components\n\n170\n\n157\n\
    \n**src/App.js**\n\n```javascript\nconst withFoo = (Component) => (props) =>\n\
    \  isLoading\n    ? <Loading />\n    : <Component { ...props } />\n```\n\nConditional\
    \ rendering is a great use case for HOC.\n\nIn the example, the input component\
    \ would stay the same as the output component. Nothing happens. It renders the\
    \ same component instance and passes all of the props to the output component.\
    \ But that’s useless. Let’s enhance the output component. The output component\
    \ should show the Loading component, when the loading state is true.\n\nOne neat\
    \ convention is to prefix the naming of a HOC with with. Since you are using JavaScript\
    \ ES6, you can express the HOC more concisely with an ES6 arrow function.\n\n\
    Based on the loading state, it should show the Loading component or the Button\
    \ component. The latter one is your button to fetch more data.\n\nOne use case\
    \ could be to use a HOC as a helper for a conditional rendering. Imagine you have\
    \ a List component that renders a list of items or nothing, because the list is\
    \ empty or null. The HOC could shield away that the list would render nothing\
    \ when there is no list. On the other hand, the plain List component doesn’t need\
    \ to bother anymore about an non existent list. It only cares about rendering\
    \ the list.\n\nLet’s do a simple HOC which takes a component as input and returns\
    \ a component. You can place it in your *src/App.js* file.\n\nIn general, you\
    \ can apply the HOC to the component.\n\n```javascript\nfunction withFoo(Component)\
    \ {\n  return function(props) {\n    return <Component { ...props } />;\n  }\n\
    }\n```\n\nIf you use destructuring, you can extract the props from the object.\n\
    \n```javascript\nconst withFoo = (Component) => (props) =>\n  <Component { ...props\
    \ } />\n```\n\nIn the example, the input component would stay the same as the\
    \ output component. Nothing happens. It renders the same component instance and\
    \ passes all of the props to the output component. But that’s useless. Let’s enhance\
    \ the output component. The output component should show the Loading component,\
    \ when the loading state is true.\n\nAdvanced React Components\n\n158\n\n**src/App.js**\n\
    \n```javascript\nconst Button = ({ onClick, className = '', children }) => (\n\
    \  <button onClick={onClick} className={className} type=\"button\">\n    {children}\n\
    \  </button>\n);\n\nconst Loading = () => (\n  <div>Loading ...</div>\n);\n\n\
    const withLoading = (Component) => ({ isLoading, ...props }) =>\n  isLoading\n\
    \    ? <Loading />\n    : <Component { ...props } />;\n);\n\nconst ButtonWithLoading\
    \ = withLoading(Button);\n```\n\nThe output component should show the Loading\
    \ component, when the loading state is true, otherwise it should show the Button\
    \ component.\n\n127https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Operators/Destructuring_assignment\n\
    \nAdvanced React Components\n\n159\n\n**src/App.js**\n\n```javascript\nclass App\
    \ extends Component {\n  ...\n\n  render() {\n    const {\n      searchTerm,\n\
    \      results,\n      searchKey,\n      error,\n      isLoading\n    } = this.state;\n\
    \    ...\n\n    return (\n      <div className=\"page\">\n        ...\n      \
    \  <div className=\"interactions\">\n          <ButtonWithLoading\n          \
    \  isLoading={isLoading}\n            onClick={() => this.fetchSearchTopStories(searchKey,\
    \ page + 1)}>\n            More\n          </ButtonWithLoading>\n        </div>\n\
    \      </div>\n    );\n  }\n}\n```\n\nInitially the Loading component will show\
    \ up when you start your application, because you make a request on componentDidMount().\
    \ There is no Table component, because the list is empty. When the response returns\
    \ from the Hacker News API, the result is shown, the loading state is set to false\
    \ and the Loading component disappears. Instead, the “More” button to fetch more\
    \ data appears. Once you fetch more data, the button will disappear again and\
    \ the Loading component will show up.\n"
