    ## How to read it?


    The book is my attempt to teach React while you will write an application. It
    is a practical guide to learn React and not a reference work about React. You
    will write a Hacker News application that interacts with a real world API. Among
    several interesting topics, it covers state management in React, caching and interactions
    (sorting and searching). On the way you will learn best practices and patterns
    in React.


    In addition, the book gives you a transition from JavaScript ES5 to JavaScript
    ES6. React embraces a lot of JavaScript ES6 features and I want to show you how
    you can use them.


    In general, each chapter of the book will build up on the previous chapter. Each
    chapter will teach you something new. Don’t rush through the book. You should
    internalize each step. You could apply your own implementations and read more
    about the topic. After each chapter I give you some reading material and exercises.
    If you really want to learn React, I highly recommend to read the extra material
    and do some hands on exercises. After you have read a chapter, make yourself comfortable
    with the learnings before you continue.


    In the end, you will have a complete React application in production. I am very
    keen to see your results, so please text me when you have finished the book. The
    final chapter of the book will give you a handful of options to continue your
    React journey. In general you will find a lot of React related topics on my personal
    website^(28).


    Since you are reading the book, I guess you are new to React. That’s perfect.
    In the end, I hope to get your feedback to improve the material to enable everyone
    to learn React. You can have a direct impact on GitHub^(29) or text me on Twitter^(30).


    28 https://www.robinwieruch.de/

    29 https://github.com/rwieruch/the-road-to-learn-react

    30 https://twitter.com/rwieruch


    ## Introduction to React


    The chapter gives you an introduction to React. You may ask yourself: Why should
    I learn React in the first place? The chapter might give you the answer to that
    question. Afterward, you will dive into the ecosystem by bootstrapping your first
    React application from scratch with zero-configuration. Along the way, you will
    get an introduction to JSX and ReactDOM. So be prepared for your first React components.


    2


    ### Hi, my name is React.


    **Why should you bother to learn React?** In recent years single page applications
    (SPA^(31)) have become popular. Frameworks like Angular, Ember and Backbone helped
    JavaScript developers to build modern web applications beyond the usage of vanilla
    JavaScript and jQuery. The list of these popular solutions is not exhaustive.
    There exists a wide range of SPA frameworks. When you consider the release dates,
    most of them are among the first generation of SPAs: Angular 2010, Backbone 2010
    and Ember 2011.


    The initial React release was 2013 by Facebook. React is not an SPA framework
    but a view library. It is the V in the MVC^(32) (model view controller). It only
    enables you to render components as viewable elements in a browser. Yet the whole
    ecosystem around React makes it possible to build single page applications.


    But why should you consider using React over the first generation of SPA frameworks?
    While the first generation of frameworks tried to solve a lot of things at once,
    React only helps you to build your view layer. It’s a library and not a framework.
    The idea behind it: Your view is a hierarchy of composable components.


    In React you can keep the focus on your view layer before you introduce more aspects
    to your application. Every other aspect is another building block for your SPA.
    These building blocks are essential to build a mature application. They come with
    two advantages.


    First, you can learn the building blocks step by step. You don’t have to worry
    about understanding them altogether. It is different from a framework that gives
    you every building block from the start. This book focuses on React as the first
    building block. More building blocks follow eventually.


    Second, all building blocks are interchangeable. It makes the ecosystem around
    React such an innovative place. Multiple solutions are competing with each other.
    You can pick the most appealing solution for you and your use case.


    The first generation of SPA frameworks arrived at an enterprise level. They are
    more rigid. React stays innovative and gets adopted by multiple tech leader companies
    like Airbnb, Netflix and of course Facebook^(33). All of them invest in the future
    of React and are content with React and the ecosystem itself.


    React is probably one of the best choices for building modern web applications
    nowadays. It only delivers the view layer, but the React ecosystem is a whole
    flexible and interchangeable framework^(34). React has a slim API, an amazing
    ecosystem and a great community. You can read about my experiences why I moved
    from Angular to React^(35). I highly recommend to have an understanding why you
    would choose React over another framework or library. After all, everyone is keen
    to experience where React will lead us in the next years.


