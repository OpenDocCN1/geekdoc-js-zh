    \ extends Component {\n  onClickMe() {\n    console.log(this);\n  }\n  render()\
    \ {\n    return (\n      <button onClick={this.onClickMe} type=\"button\">\n \
    \       Click Me\n      </button>\n    );\n  }\n}\n```\n\n组件渲染正常，但当你点击按钮时，你会在控制台日志中得到\
    \ `undefined`。这是使用 React 时产生的主要来源，因为如果你想在类方法中访问 `this.state`，将无法获取，因为 `this` 是\
    \ `undefined`。所以为了在类方法中能够访问它，你必须将类方法绑定到 `this`。在下面的组件中，类方法在类构造函数中被正确绑定了。\n\n**代码沙场\
    \ (Code Playground)**\n\n```javascript\nclass ExplainBindings extends Component\
    \ {\n  constructor() {\n    super();\n    this.onClickMe = this.onClickMe.bind(this);\n\
    \  }\n  onClickMe() {\n    console.log(this);\n  }\n  render() {\n    return (\n\
    \      <button onClick={this.onClickMe} type=\"button\">\n        Click Me\n \
    \     </button>\n    );\n  }\n}\n```\n\n再次尝试按钮时，`this` 对象（具体来说是类实例）应该是定义的，你将能够访问\
    \ `this.state`，或者正如你稍后学到的，访问 `this.props`。类方法的绑定也可以发生在其他地方。例如，它可以发生在 `render()`\
    \ 类方法中。\n\n42\n\n**代码沙场 (Code Playground)**\n\n```javascript\nclass ExplainBindings\
    \ extends Component {\n  onClickMe() {\n    console.log(this);\n  }\n  render()\
    \ {\n    return (\n      <button onClick={this.onClickMe.bind(this)} type=\"button\"\
    >\n        Click Me\n      </button>\n    );\n  }\n}\n```\n\n但你应该避免这样做，因为每当 `render()`\
    \ 方法运行时它都会绑定一次类方法。基本上，它在组件每次更新时都会运行，这会导致性能影响。在构造函数中绑定类方法时，你只在组件实例化之初绑定一次。这是一个更好的方法。人们有时会想到的另外一点是在构造函数中定义类方法的业务逻辑。\n\
    \n**代码沙场 (Code Playground)**\n\n```javascript\nclass ExplainBindings extends Component\
    \ {\n  constructor() {\n    super();\n    this.onClickMe = () => {\n      console.log(this);\n\
    \    }\n  }\n  render() {\n    return (\n      <button onClick={this.onClickMe}\
    \ type=\"button\">\n        Click Me\n      </button>\n    );\n  }\n}\n```\n\n\
    43\n\n你也应该避免这样做，因为随着时间的推移它会让你的构造函数变得混乱。构造函数只是为了实例化类及其属性。这就是为什么类方法的业务逻辑应该定义在构造函数之外。\n\
    \n**代码沙场 (Code Playground)**\n\n```javascript\nclass ExplainBindings extends Component\
    \ {\n  constructor() {\n    super();\n    this.doSomething = this.doSomething.bind(this);\n\
    \    this.doSomethingElse = this.doSomethingElse.bind(this);\n  }\n  doSomething()\
    \ {\n    // do something\n  }\n  doSomethingElse() {\n    // do something else\n\
    \  }\n  ...\n}\n```\n\n最后，值得提到，通过使用 JavaScript ES6 箭头函数可以自动绑定类方法而无需显式绑定。\n\n44\n\
    \n**代码沙场 (Code Playground)**\n\n```javascript\nclass ExplainBindings extends Component\
    \ {\n  onClickMe = () => {\n    console.log(this);\n  }\n  render() {\n    return\
    \ (\n      <button onClick={this.onClickMe} type=\"button\">\n        Click Me\n\
    \      </button>\n    );\n  }\n}\n```\n\n如果构造函数中的重复绑定让你困扰，你可以采用这种方法。React 官方文档坚持使用构造函数中的类方法。这就是为什么本书也会坚持这些方法。\n\
    \n**练习：**\n- 尝试不同的绑定方法并打印 `this` 对象\n\n45\n\n**事件处理器 (Event Handler)**\n\n本章应该让你对元素中的事件处理器有更深入的理解。在你的应用程序中，你正在使用下面的按钮从列表中移除项。\n\
    \n**src/App.js**\n\n```javascript\n...\n<button onClick={() => this.onDismiss(item.objectID)}\
    \ type=\"button\">\n  Dismiss\n</button>\n...\n```\n\n这已经是一个复杂的用例了，因为你需要向类方法传递一个值，因此你需要将其封装在另一个（箭头）函数中。基本上，它必须是一个传递给事件处理器的函数。下面的代码将无法工作，因为当浏览器中打开应用程序时，类方法会立即执行。\n\
    \n**src/App.js**\n\n```javascript\n...\n<button onClick={this.onDismiss(item.objectID)}\
    \ type=\"button\">\n  Dismiss\n</button>\n...\n```\n\n当使用 `onClick={doSomething()}`\
    \ 时，`doSomething()` 函数会在浏览器中打开应用程序时立即执行。处理器中的表达式会被求值。由于函数的返回值不再是一个函数，当你点击按钮时什么都不会发生。但当使用\
    \ `onClick={doSomething}` 且 `doSomething` 是一个函数时，在点击按钮时它会被执行。相同的规则适用于应用程序中使用的\
    \ `onDismiss()` 类方法。\n\n"
