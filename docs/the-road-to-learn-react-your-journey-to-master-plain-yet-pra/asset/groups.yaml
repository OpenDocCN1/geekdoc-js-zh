  - '[PAGE 96]


    Getting Real with an API


    83


    **Lifecycle Methods**


    You will need to know about React lifecycle methods before you can start to fetch
    data in your


    components by using an API. These methods are a hook into the lifecycle of a React
    component.


    They can be used in ES6 class components, but not in functional stateless components.


    Do you remember when a previous chapter taught you about JavaScript ES6 classes
    and how they are


    used in React? Apart from the render() method, there are several methods that
    can be overridden


    in a React ES6 class component. All of these are the lifecycle methods. Let’s
    dive into them:


    You already know two lifecycle methods that can be used in an ES6 class component:
    constructor()


    and render().


    The constructor is only called when an instance of the component is created and
    inserted in the


    DOM. The component gets instantiated. That process is called mounting of the component.


    The render() method is called during the mount process too, but also when the
    component updates.


    Each time when the state or the props of a component change, the render() method
    of the


    component is called.


    Now you know more about the two lifecycle methods and when they are called. You
    already used


    them as well. But there are more of them.


    The mounting of a component has two more lifecycle methods: componentWillMount()
    and


    componentDidMount(). The constructor is called first, componentWillMount() gets
    called before the


    render() method and componentDidMount() is called after the render() method.


    Overall the mounting process has 4 lifecycle methods. They are invoked in the
    following order:


    • constructor()


    • componentWillMount()


    • render()


    • componentDidMount()


    But what about the update lifecycle of a component that happens when the state
    or the props change?


    Overall it has 5 lifecycle methods in the following order:


    • componentWillReceiveProps()


    • shouldComponentUpdate()


    • componentWillUpdate()


    • render()


    • componentDidUpdate()'
  - '[PAGE 97]


    Getting Real with an API


    84


    Last but not least there is the unmounting lifecycle. It has only one lifecycle
    method: componen-


    tWillUnmount().


    After all, you don’t need to know all of these lifecycle methods from the beginning.
    It can be


    intimidating yet you will not use all of them. Even in a larger React application
    you will only use a


    few of them apart from the constructor() and the render() method. Still, it is
    good to know that


    each lifecycle method can be used for specific use cases:


    •** constructor(props)** - It is called when the component gets initialized. You
    can set an initial


    component state and bind class methods during that lifecycle method.


    •** componentWillMount()** - It is called before the render() lifecycle method.
    That’s why it


    could be used to set internal component state, because it will not trigger a second
    rendering


    of the component. Generally it is recommended to use the constructor() to set
    the initial


    state.


    •** render()** - This lifecycle method is mandatory and returns the elements as
    an output of the


    component. The method should be pure and therefore shouldn’t modify the component
    state.


    It gets an input as props and state and returns an element.


    •** componentDidMount()** - It is called only once when the component mounted.
    That’s the


    perfect time to do an asynchronous request to fetch data from an API. The fetched
    data would


    get stored in the internal component state to display it in the render() lifecycle
    method.


    •** componentWillReceiveProps(nextProps)** - The lifecycle method is called during
    an update


    lifecycle. As input you get the next props. You can diff the next props with the
    previous props,


    by using this.props, to apply a different behavior based on the diff. Additionally,
    you can


    set state based on the next props.


    •** shouldComponentUpdate(nextProps, nextState)** - It is always called when the
    component


    updates due to state or props changes. You will use it in mature React applications
    for


    performance optimizations. Depending on a boolean that you return from this lifecycle


    method, the component and all its children will render or will not render on an
    update


    lifecycle. You can prevent the render lifecycle method of a component.


    •** componentWillUpdate(nextProps, nextState)** - The lifecycle method is immediately
    in-


    voked before the render() method. You already have the next props and next state
    at your


    disposal. You can use the method as last opportunity to perform preparations before
    the render


    method gets executed. Note that you cannot trigger setState() anymore. If you
    want to


    compute state based on the next props, you have to use componentWillReceiveProps().


    •** componentDidUpdate(prevProps, prevState)** - The lifecycle method is immediately
    invoked


    after the render() method. You can use it as opportunity to perform DOM operations
    or to


    perform further asynchronous requests.


    •** componentWillUnmount()** - It is called before you destroy your component.
    You can use the


    lifecycle method to perform any clean up tasks.


    The constructor() and render() lifecycle methods are already used by you. These
    are the


    commonly used lifecycle methods for ES6 class components. Actually the render()
    method is


    required, otherwise you wouldn’t return a component instance.'
- md: "\nGetting Real with an API\n\n85\n\nThere is one more lifecycle method: componentDidCatch(error,\
    \ info). It was introduced in React 16 and is used to catch errors in components.\
    \ For instance, displaying the sample list in your application works just fine.\
    \ But there could be a case when the list in the local state is set to null by\
    \ accident (e.g. when fetching the list from an external API, but the request\
    \ failed and you set the local state of the list to null). Afterward, it wouldn’t\
    \ be possible to filter and map the list anymore, because it is null and not an\
    \ empty list. The component would be broken and the whole application would fail.\
    \ Now, by using componentDidCatch(), you can catch the error, store it in your\
    \ local state, and show an optional message to your application user that an error\
    \ has happened.\n\n**Exercises:**\n\n- read more about lifecycle methods in React\
    \ (85)\n- read more about the state related to lifecycle methods in React (86)\n\
    - read more about error handling in components (87)\n\n84https://www.robinwieruch.de/what-is-new-in-react-16/\n\
    85https://reactjs.org/docs/react-component.html\n86https://reactjs.org/docs/state-and-lifecycle.html\n\
    87https://reactjs.org/blog/2017/07/26/error-handling-in-react-16.html\n\nGetting\
    \ Real with an API\n\n86\n\n**Fetching Data**\n\nNow you are prepared to fetch\
    \ data from the Hacker News API. There was one lifecycle method mentioned that\
    \ can be used to fetch data: componentDidMount(). You will use the native fetch\
    \ API in JavaScript to perform the request.\n\nBefore we can use it, let’s set\
    \ up the URL constants and default parameters to breakup the API request into\
    \ chunks.\n\n**src/App.js**\n\n```javascript\nimport React, { Component } from\
    \ 'react';\nimport './App.css';\n\nconst DEFAULT_QUERY = 'redux';\nconst PATH_BASE\
    \ = 'https://hn.algolia.com/api/v1';\nconst PATH_SEARCH = '/search';\nconst PARAM_SEARCH\
    \ = 'query=';\n...\n```\n\nIn JavaScript ES6, you can use template strings (88)\
    \ to concatenate strings. You will use it to concatenate your URL for the API\
    \ endpoint.\n\n**Code Playground**\n\n```javascript\n// ES6\nconst url = `${PATH_BASE}${PATH_SEARCH}?${PARAM_SEARCH}${DEFAULT_QUERY}`;\n\
    \n// ES5\nvar url = PATH_BASE + PATH_SEARCH + '?' + PARAM_SEARCH + DEFAULT_QUERY;\n\
    console.log(url);\n// output: https://hn.algolia.com/api/v1/search?query=redux\n\
    ```\n\nThat will keep your URL composition flexible in the future.\n\nBut let’s\
    \ get to the API request where you will use the url. The whole data fetch process\
    \ will be presented at once, but each step will be explained afterward.\n\n88https://developer.mozilla.org/en/docs/Web/JavaScript/Reference/Template_literals\n\
    \nGetting Real with an API\n\n87\n\n**src/App.js**\n\n```javascript\n...\nclass\
