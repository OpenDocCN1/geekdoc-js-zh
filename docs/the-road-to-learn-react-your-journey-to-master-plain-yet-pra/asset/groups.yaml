    182


    **Revisited: setState()**


    So far, you have used React setState() to manage your internal component state.
    You can pass an


    object to the function where you can update partially the internal state.


    **Code Playground**


    **this**.setState({ foo: bar });


    But setState() doesn’t take only an object. In its second version, you can pass
    a function to update


    the state.


    **Code Playground**


    **this**.setState((prevState, props) => {


    ...


    });


    Why should you want to do that? There is one crucial use case where it makes sense
    to use a function


    over an object. It is when you update the state depending on the previous state
    or props. If you don’t


    use a function, the internal state management can cause bugs.


    But why does it cause bugs to use an object over a function when the update depends
    on the previous


    state or props? The React setState() method is asynchronous. React batches setState()
    calls and


    executes them eventually. It can happen that the previous state or props changed
    in between when


    you would rely on it in your setState() call.


    **Code Playground**


    **const** { fooCount } =** this**.state;


    **const** { barCount } =** this**.props;


    **this**.setState({ count: fooCount + barCount });


    Imagine that fooCount and barCount, thus the state or the props, change somewhere
    else asyn-


    chronously when you call setState(). In a growing application, you have more than
    one ‘setState()’


    call across your application. Since setState() executes asynchronously, you could
    rely in the


    example on stale values.


    With the function approach, the function in setState() is a callback that operates
    on the state and


    props at the time of executing the callback function. Even though setState() is
    asynchronous, with


    a function it takes the state and props at the time when it is executed.'
