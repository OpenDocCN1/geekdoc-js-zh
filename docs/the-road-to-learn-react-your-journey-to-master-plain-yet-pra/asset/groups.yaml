    **Command Line**


    npm test


    Now Jest enables you to write snapshot tests. These tests make a snapshot of your
    rendered


    component and run this snapshot against future snapshots. When a future snapshot
    changes, you


    will get notified in the test. You can either accept the snapshot change, because
    you changed


    the component implementation on purpose, or deny the change and investigate for
    the error. It


    complements unit tests very well, because you only test the diffs of the rendered
    output. It doesn’t


    add big maintenance costs, because you can simply accept changed snapshots when
    you changed


    something on purpose for the rendered output in your component.


    Jest stores the snapshots in a folder. Only that way it can validate the diff
    against a future snapshot.


    Additionally, the snapshots can be shared across teams by having them in one folder.


