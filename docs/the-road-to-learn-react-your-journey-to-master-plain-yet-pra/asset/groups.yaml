    **FAQ**


    **How do I get updates?** You can subscribe^(14)^ to the Newsletter or follow
    me on Twitter^(15)^ for updates.


    Once you have a copy of the book, it will stay updated when a new edition gets
    released. But you


    have to grab the copy again when an update is announced.


    **Does it use the recent React version?** The book always receives an update when
    the React version


    got updated. Usually books are outdated pretty soon after their release. Since
    this book is self-


    published, I can update it whenever I want.


    **Does it cover Redux?** It doesn’t. Therefore I have written a second book. The
    Road to learn React


    should give you a solid foundation before you dive into advanced topics. The implementation
    of


    the sample application in the book will show that you don’t need Redux to build
    an application in


    React. After you have read the book, you should be able to implement a solid application
    without


    Redux. Then you can read my second book to learn Redux^(16).


    **Does it use JavaScript ES6?** Yes. But don’t worry. You will be fine if you
    are familiar with JavaScript


    ES5. All JavaScript ES6 features, that I describe on the journey to learn React,
    will transition from


    ES5 to ES6 in the book. Every feature along the way will be explained. The book
    does not only teach


    React, but also all useful JavaScript ES6 features for React.


    **Will you add more chapters in the future?** You can have a look at the Change
    Log chapter for


    major updates that already happened. There will be unannounced improvements in
    between too.


    In general, it depends on the community whether I continue to work on the book.
    If there is an


    acceptance for the book, I will deliver more chapters and improve the old material.
    I will keep the


    content up to date with recent best practices, concepts and patterns.


    **How can I get help while reading the book?** The book has a Slack Group^(17)^
    for people who are


    reading the book. You can join the channel to get help or to help others. After
    all, helping others can


    improve your learnings too.


    **Is there any troubleshoot area?** If you run into problems, please join the
    Slack Group. In addition,


    you could have a look into the open issues on GitHub^(18)^ for the book. Perhaps
    your problem was


    already mentioned and you can find the solution for it. If your problem wasn’t
    mentioned, don’t


    hesitate to open a new issue where you can explain your problem, maybe provide
    a screenshot, and


    some more details (e.g. book page, node version). After all, I try to ship all
    fixes in next editions of


    the book.


