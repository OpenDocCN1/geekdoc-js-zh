    **src/App.js**


    **{list.map(item => {**


    return (


    <div key={item.objectID}>


    <span>


    <a href={item.url}>{item.title}</a>


    </span>


    <span>{item.author}</span>


    <span>{item.num\_comments}</span>


    <span>{item.points}</span>


    </div>


    );


    })}


    Additionally, you can remove the* block body*, meaning the curly braces, of the
    ES6 arrow function.


    In a* concise body* an implicit return is attached. Thus you can remove the return
    statement. That


    will happen more often in the book, so be sure to understand the difference between
    a block body


    and a concise body when using arrow functions.


    **src/App.js**


    **{list.map(item =>**


    <div key={item.objectID}>


    <span>


    <a href={item.url}>{item.title}</a>


    </span>


    <span>{item.author}</span>


    <span>{item.num\_comments}</span>


    <span>{item.points}</span>


    </div>


    **)}**


    Your JSX looks more concise and readable now. It omits the function statement,
    the curly braces and


    the return statement. Instead a developer can focus on the implementation details.


    **Exercises:**


    • read more about ES6 arrow functions^(62)


