    该函数被绑定到组件上，因此再次是一个类方法。你需要绑定并定义方法。\n\n**src/App.js**\n```javascript\nclass App\
    \ extends Component {\n  constructor(props) {\n    super(props);\n    this.state\
    \ = {\n      list,\n    };\n    this.onSearchChange = this.onSearchChange.bind(this);\n\
    \    this.onDismiss = this.onDismiss.bind(this);\n  }\n\n  onSearchChange() {\n\
