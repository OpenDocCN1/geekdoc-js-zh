    **Complex JavaScript in JSX**


    Let’s get back to your App component. So far you rendered some primitive variables
    in your JSX.


    Now you will start to render a list of items. The list will be sample data in
    the beginning, but later


    you will fetch the data from an external API^(59). That will be far more exciting.


    First you have to define the list of items.


    **src/App.js**


    import React, { Component } from ''react'';


    import ''./App.css'';


    **const list = \[**


    **{**


    **title: ''React'',**


    **url: ''https://facebook.github.io/react/'',**


    **author: ''Jordan Walke'',**


    **num\_comments: 3,**


    **points: 4,**


    **objectID: 0,**


    **},**


    **{**


    **title: ''Redux'',**


    **url: ''https://github.com/reactjs/redux'',**


    **author: ''Dan Abramov, Andrew Clark'',**


    **num\_comments: 2,**


    **points: 5,**


    **objectID: 1,**


    **},**


    **\];**


    class App extends Component {


    ...


    }


    The sample data will reflect the data we will fetch later on from the API. An
    item in the list has


    a title, an url and an author. Additionally it comes with an identifier, points
    (which indicate how


    popular an article is) and a count of comments.


    Now you can use the built-in JavaScript map functionality in your JSX. It enables
    you to iterate over


    your list of items to display them. Again you will use curly braces to encapsulate
    the JavaScript


    expression in your JSX.


