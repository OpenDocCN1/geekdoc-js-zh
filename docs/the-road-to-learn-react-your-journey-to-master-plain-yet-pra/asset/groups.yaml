    **所以，读完这本书后你可以去哪里？** 你可以扩展自己的项目，也可以尝试开发自己的项目。我很好奇你读书后会构建什么。


    - **状态管理：**你已经使用了 `setState()` 来管理本地组件状态。这是一个完美的开始。然而，在较大的应用程序中，你会遇到 React 本地状态的局限性
    (154)。因此你可以使用第三方状态管理库，如 Redux 或 MobX (155)。在 Road to React (156) 课程中，你会找到“React状态管理”课程，它教授了
    React 高级状态、Redux 和 MobX。课程还附带电子书，但我建议大家深入研究源码和视频。


    - **连接数据库身份验证：** 在不断增长的 React 应用程序中，你最终可能需要持久化数据。数据应该存储在数据库中，以便在浏览器会话结束后并在不同的使用应用程序的用户之间共享。引入数据库简单的方法是使用
    Firebase。在这个综合教程 (157) 中，你将找到关于如何在 React 中使用 Firebase 身份验证（注册、登录、注销）的逐步指南。此外，你将使用
    Firebase 实时数据库存储用户实体。之后，取决于你如何在数据库中存储应用程序所需的更多数据。


    - **使用 Webpack 和 Babel 的工具：** 在书中你使用了 `create-react-app` 来设置你的应用程序。在某个时刻，当你学习了
    React 之后，你可能想学习它背后的工具。

