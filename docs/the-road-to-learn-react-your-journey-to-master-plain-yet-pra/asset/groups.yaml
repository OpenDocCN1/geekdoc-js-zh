    components


    are functions (functional) and they have no local state (stateless). You cannot
    access or update


    the state with this.state or this.setState() because there is no this object.
    Additionally,


    they have no lifecycle methods. You didn’t learn about lifecycle methods yet,
    but you already


    used two: constructor() and render(). Whereas the constructor runs only once in
    the


    lifetime of a component, the render() class method runs once in the beginning
    and every time


    the component updates. Keep in mind that functional stateless components have
    no lifecycle


    methods, when you arrive at the lifecycle methods chapter later on.


    •** ES6 Class Components:** You already used this type of component declaration
    in your four


    components. In the class definition, they extend from the React component. The
    extend hooks


    all the lifecycle methods, available in the React component API, to the component.
    That way


    you were able to use the render() class method. Additionally, you can store and
    manipulate


    state in ES6 class components by using this.state and this.setState().


    •** React.createClass:** The component declaration was used in older versions
    of React and still


    in JavaScript ES5 React applications. But Facebook declared it as deprecated^(74)^
    in favor of


