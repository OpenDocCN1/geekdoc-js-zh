- md: "\nGetting Real with an API\n\n95\n\n**Exercises:**\n\n- read more about different\
    \ ways for conditional renderings(99)\n- read more about React conditional rendering(100)\n\
    \n99 https://www.robinwieruch.de/conditional-rendering-react/\n100 https://reactjs.org/docs/conditional-rendering.html\n\
    \nGetting Real with an API\n\n96\n\n## Client- or Server-side Search\n\nWhen you\
    \ use the Search component with its input field now, you will filter the list.\
    \ That’s happening on the client-side though. Now you are going to use the Hacker\
    \ News API to search on the server-side. Otherwise you would deal only with the\
    \ first API response which you got on componentDidMount() with the default search\
    \ term parameter.\n\nYou can define an onSearchSubmit() method in your App component\
    \ which fetches results from the Hacker News API when executing a search in the\
    \ Search component.\n\n**src/App.js**\n\n```javascript\nclass App extends Component\
    \ {\n  constructor(props) {\n    super(props);\n    this.state = {\n      result:\
    \ null,\n      searchTerm: DEFAULT_QUERY,\n    };\n    this.setSearchTopStories\
    \ = this.setSearchTopStories.bind(this);\n    this.onSearchChange = this.onSearchChange.bind(this);\n\
    \    this.onSearchSubmit = this.onSearchSubmit.bind(this);\n    this.onDismiss\
    \ = this.onDismiss.bind(this);\n  }\n  ...\n  onSearchSubmit() {\n    const {\
    \ searchTerm } = this.state;\n  }\n  ...\n}\n```\n\nThe onSearchSubmit() method\
    \ should use the same functionality as the componentDidMount() lifecycle method,\
    \ but this time with a modified search term from the local state and not with\
    \ the initial default search term. Thus you can extract the functionality as a\
    \ reusable class method.\n\nGetting Real with an API\n\n97\n\n**src/App.js**\n\
    \n```javascript\nclass App extends Component {\n  constructor(props) {\n    super(props);\n\
    \    this.state = {\n      result: null,\n      searchTerm: DEFAULT_QUERY,\n \
    \   };\n    this.setSearchTopStories = this.setSearchTopStories.bind(this);\n\
    \    this.fetchSearchTopStories = this.fetchSearchTopStories.bind(this);\n   \
    \ this.onSearchChange = this.onSearchChange.bind(this);\n    this.onSearchSubmit\
    \ = this.onSearchSubmit.bind(this);\n    this.onDismiss = this.onDismiss.bind(this);\n\
    \  }\n  ...\n  fetchSearchTopStories(searchTerm) {\n    fetch(`${PATH_BASE}${PATH_SEARCH}?${PARAM_SEARCH}${searchTerm}`)\n\
    \      .then(response => response.json())\n      .then(result => this.setSearchTopStories(result))\n\
    \      .catch(error => error);\n  }\n  componentDidMount() {\n    const { searchTerm\
    \ } = this.state;\n    this.fetchSearchTopStories(searchTerm);\n  }\n  ...\n \
    \ onSearchSubmit() {\n    const { searchTerm } = this.state;\n    this.fetchSearchTopStories(searchTerm);\n\
    \  }\n  ...\n}\n```\n\nNow the Search component has to add an additional button.\
    \ The button has to explicitly trigger the search request. Otherwise you would\
    \ fetch data from the Hacker News API every time when your input field changes.\
    \ But you want to do it explicitly in a onClick() handler.\n\nAs alternative you\
    \ could debounce (delay) the onChange() function and spare the button, but it\
    \ would add more complexity at this time and maybe wouldn’t be the desired effect.\
    \ Let’s keep it simple without a debounce for now.\n\nFirst, pass the onSearchSubmit()\
    \ method to your Search component.\n\n**src/App.js**\n\n```javascript\nclass App\
    \ extends Component {\n  ...\n  render() {\n    const { searchTerm, result } =\
    \ this.state;\n    return (\n      <div className=\"page\">\n        <div className=\"\
    interactions\">\n          <Search\n            value={searchTerm}\n         \
    \   onChange={this.onSearchChange}\n            onSubmit={this.onSearchSubmit}\n\
    \          >\n            Search\n          </Search>\n        </div>\n      \
    \  { result &&\n          <Table\n            list={result.hits}\n           \
    \ pattern={searchTerm}\n            onDismiss={this.onDismiss}\n          />\n\
    \        }\n      </div>\n    );\n  }\n}\n```\n\nSecond, introduce a button in\
    \ your Search component. The button has the type=\"submit\" and the form uses\
    \ its onSubmit() attribute to pass the onSubmit() method. You can reuse the children\
    \ property, but this time it will be used as the content of the button.\n\nGetting\
    \ Real with an API\n\n99\n\n**src/App.js**\n\n```javascript\nconst Search = ({\n\
    \  value,\n  onChange,\n  onSubmit,\n  children\n}) => (\n  <form onSubmit={onSubmit}>\n\
    \    <input\n      type=\"text\"\n      value={value}\n      onChange={onChange}\n\
    \    />\n    <button type=\"submit\">\n      {children}\n    </button>\n  </form>\n\
    )\n```\n\nIn the Table, you can remove the filter functionality, because there\
    \ will be no client-side filter (search) anymore. Don’t forget to remove the isSearched()\
    \ function as well. It will not be used anymore.\n\nThe result comes directly\
    \ from the Hacker News API now after you have clicked the “Search” button.\n\n\
    **src/App.js**\n\n```javascript\nclass App extends Component {\n  ...\n  render()\
    \ {\n    const { searchTerm, result } = this.state;\n    return (\n      <div\
    \ className=\"page\">\n        ...\n        { result &&\n          <Table\n  \
    \          list={result.hits}\n            onDismiss={this.onDismiss}\n      \
    \    />\n        }\n      </div>\n    );\n  }\n}\n}\n...\nconst Table = ({ list,\
    \ onDismiss }) => (\n  <div className=\"table\">\n    {list.map(item => (\n  \
    \    ...\n    ))}\n  </div>\n)\n```\n\nWhen you try to search now, you will notice\
    \ that the browser reloads. That’s a native browser behavior for a submit callback\
    \ in a HTML form. In React you will often come across the preventDefault() event\
    \ method to suppress the native browser behavior.\n\n**src/App.js**\n\n```javascript\n\
    onSearchSubmit(event) {\n  const { searchTerm } = this.state;\n  this.fetchSearchTopStories(searchTerm);\n\
    \  event.preventDefault();\n}\n```\n\nNow you should be able to search different\
    \ Hacker News stories. Perfect, you interact with a real world API. There should\
    \ be no client-side search anymore.\n\n**Exercises:**\n\n- read more about synthetic\
    \ events in React(101)\n- experiment with the Hacker News API(102)\n\n101 https://reactjs.org/docs/events.html\n\
    102 https://hn.algolia.com\n\nGetting Real with an API\n\n100\n\n## Paginated\
    \ Fetch\n\nDid you have a closer look at the returned data yet? The Hacker News\
    \ API returns a list of hits. The page property, which is 0 in the first response,\
    \ can be used to fetch more paginated lists. Let’s extend the API constants so\
    \ it can deal with paginated data.\n\n**src/App.js**\n\n```javascript\nconst DEFAULT_QUERY\
    \ = 'redux';\nconst PATH_BASE = 'https://hn.algolia.com/v1';\nconst PATH_SEARCH\
    \ = '/search';\nconst PARAM_SEARCH = 'query=';\nconst PARAM_PAGE = 'page=';\n\
    ```\n\nNow you can use the new constant to add the page parameter to your API\
    \ request.\n\n**Code Playground**\n\n```javascript\nconst url = `${PATH_BASE}${PATH_SEARCH}?${PARAM_SEARCH}${searchTerm}&${PARAM_PAGE}${page}`;\n\
    console.log(url);\n// output: https://hn.algolia.com/v1/search?query=redux&page=0\n\
    ```\n\nThe fetchSearchTopStories() method will take the page as second argument.\
    \ If you don’t provide the second argument, it will fallback to page 0 for the\
    \ initial request. Thus the componentDidMount() and onSearchSubmit() methods fetch\
    \ the first page on the first request. Every additional fetch should fetch the\
    \ next page by providing the second argument.\n\nGetting Real with an API\n\n\
    102\n\n**src/App.js**\n\n```javascript\nclass App extends Component {\n  ...\n\
    \  fetchSearchTopStories(searchTerm, page = 0) {\n    fetch(`${PATH_BASE}${PATH_SEARCH}?${PARAM_SEARCH}${searchTerm}&${PARAM_PAGE}${page}`)\n\
    \      .then(response => response.json())\n      .then(result => this.setSearchTopStories(result))\n\
    \      .catch(error => error);\n  }\n  ...\n}\n```\n\nThe page argument uses the\
    \ JavaScript ES6 default parameter to introduce the fallback to page 0 in case\
    \ no defined page argument is provided for the function.\n\nNow you can use the\
    \ current page from the API response in fetchSearchTopStories(). You can use this\
    \ method in a button to fetch more stories on a onClick button. Let’s use the\
    \ Button to fetch more paginated data from the Hacker News API. You only need\
    \ to define the onClick() handler which takes the current search term and the\
    \ next page (current page + 1).\n\n**src/App.js**\n\n```javascript\nclass App\
    \ extends Component {\n  ...\n  render() {\n    const { searchTerm, result } =\
    \ this.state;\n    const page = (result && result.page) || 0;\n    return (\n\
    \      <div className=\"page\">\n        <div className=\"interactions\">\n  \
    \        ...\n        { result &&\n          <Table\n            list={result.hits}\n\
    \            onDismiss={this.onDismiss}\n          />\n        }\n      </div>\n\
    \    );\n  }\n}\n```\n"
  mdcn: "\n深入实战 API 应用\n\n95\n\n**练习：**\n\n-   [阅读更多关于条件渲染的不同方式](#99) (99)\n-   [阅读更多关于\
    \ React 条件渲染](#100) (100)\n\n99 https://www.robinwieruch.de/conditional-rendering-react/\n\
    100 https://reactjs.org/docs/conditional-rendering.html\n\n深入实战 API 应用\n\n96\n\
    \n## 客户端或服务器搜索\n\n当你使用带有输入字段的 `Search` 组件时，你将过滤列表。不过，这是发生在客户端的。现在，你将使用 Hacker\
    \ News API 在服务器端进行搜索。否则，你将只能处理在 `componentDidMount()` 中通过默认搜索参数获取的第一个 API 响应。\n\
    \n你可以在 `App` 组件中定义一个 `onSearchSubmit()` 方法，当在 `Search` 组件中执行搜索时，该方法从 Hacker News\
    \ API 获取结果。\n\n**src/App.js**\n\n```javascript\nclass App extends Component {\n\
    \  constructor(props) {\n    super(props);\n    this.state = {\n      result:\
    \ null,\n      searchTerm: DEFAULT_QUERY,\n    };\n    this.setSearchTopStories\
    \ = this.setSearchTopStories.bind(this);\n    this.onSearchChange = this.onSearchChange.bind(this);\n\
    \    this.onSearchSubmit = this.onSearchSubmit.bind(this);\n    this.onDismiss\
    \ = this.onDismiss.bind(this);\n  }\n  ...\n  onSearchSubmit() {\n    const {\
    \ searchTerm } = this.state;\n  }\n  ...\n}\n```\n\n`onSearchSubmit()` 方法应该使用与\
    \ `componentDidMount()` 生命周期方法相同的功能，但这次使用的是来自本地状态的修改后的搜索词，而不是初始的默认搜索术。因此，你可以将功能提取为可重用的类方法。\n\
    \n深入实战 API 应用\n\n97\n\n**src/App.js**\n\n```javascript\nclass App extends Component\
    \ {\n  constructor(props) {\n    super(props);\n    this.state = {\n      result:\
    \ null,\n      searchTerm: DEFAULT_QUERY,\n    };\n    this.setSearchTopStories\
    \ = this.setSearchTopStories.bind(this);\n    this.fetchSearchTopStories = this.fetchSearchTopStories.bind(this);\n\
    \    this.onSearchChange = this.onSearchChange.bind(this);\n    this.onSearchSubmit\
    \ = this.onSearchSubmit.bind(this);\n    this.onDismiss = this.onDismiss.bind(this);\n\
    \  }\n  ...\n  fetchSearchTopStories(searchTerm) {\n    fetch(`${PATH_BASE}${PATH_SEARCH}?${PARAM_SEARCH}${searchTerm}`)\n\
    \      .then(response => response.json())\n      .then(result => this.setSearchTopStories(result))\n\
    \      .catch(error => error);\n  }\n  componentDidMount() {\n    const { searchTerm\
    \ } = this.state;\n    this.fetchSearchTopStories(searchTerm);\n  }\n  ...\n \
    \ onSearchSubmit() {\n    const { searchTerm } = this.state;\n    this.fetchSearchTopStories(searchTerm);\n\
    \  }\n  ...\n}\n```\n\n现在 `Search` 组件必须添加一个额外的按钮。该按钮必须显式地触发搜索请求。否则，你每当输入字段变化时，都会从\
    \ Hacker News API 获取数据。但你希望在 `onClick()` 处理程序中显式地这样做。\n\n作为替代方案，你可以对 `onChange()`\
    \ 函数进行防抖（延迟）并省去按钮，但这会在此时增加更多复杂性，并且可能不是你想要的效果。让我们先保持简单，不使用防抖。\n\n首先，将 `onSearchSubmit()`\
    \ 方法传递给你的 `Search` 组件。\n\n**src/App.js**\n\n```javascript\nclass App extends Component\
    \ {\n  ...\n  render() {\n    const { searchTerm, result } = this.state;\n   \
    \ return (\n      <div className=\"page\">\n        <div className=\"interactions\"\
    >\n          <Search\n            value={searchTerm}\n            onChange={this.onSearchChange}\n\
    \            onSubmit={this.onSearchSubmit}\n          >\n            Search\n\
    \          </Search>\n        </div>\n        { result &&\n          <Table\n\
    \            list={result.hits}\n            pattern={searchTerm}\n          \
    \  onDismiss={this.onDismiss}\n          />\n        }\n      </div>\n    );\n\
    \  }\n}\n```\n\n其次，在你的 `Search` 组件中引入一个按钮。该按钮类型为 `type=\"submit\"`，且表单使用其 `onSubmit()`\
    \ 属性来传递 `onSubmit()` 方法。你可以重用 `children` 属性，但这次它将被用作按钮的内容。\n\n深入实战 API 应用\n\n\
    99\n\n**src/App.js**\n\n```javascript\nconst Search = ({\n  value,\n  onChange,\n\
    \  onSubmit,\n  children\n}) => (\n  <form onSubmit={onSubmit}>\n    <input\n\
    \      type=\"text\"\n      value={value}\n      onChange={onChange}\n    />\n\
    \    <button type=\"submit\">{children}</button>\n  </form>\n)\n```\n\n在 `Table`\
    \ 中，你可以移除 `pattern` 属性，因为现在不再需要它了。`searchTerm` 将直接从 Hacker News API 获取。\n\n现在当你点击搜索按钮时，`searchTerm`\
    \ 将来自 API 响应结果。\n\n**src/App.js**\n\n```javascript\nclass App extends Component\
    \ {\n  ...\n  render() {\n    const { searchTerm, result } = this.state;\n   \
    \ return (\n      <div className=\"page\">\n        <div className=\"interactions\"\
    >\n          <Search\n            value={searchTerm}\n            onChange={this.onSearchChange}\n\
    \            onSubmit={this.onSearchSubmit}\n          >\n            Search\n\
    \          </Search>\n        </div>\n        { result &&\n          <Table\n\
    \            list={result.hits}\n            pattern={searchTerm}\n          \
    \  onDismiss={this.onDismiss}\n          />\n        }\n      </div>\n    );\n\
    \  }\n}\n```\n\n当你尝试搜索时，你会发现浏览器刷新了。在 React 中，你需要使用 `preventDefault()` 来阻止这种行为。\n\
    \n**src/App.js**\n\n```javascript\nonSearchSubmit(event) {\n  const { searchTerm\
    \ } = this.state;\n  this.fetchSearchTopStories(searchTerm);\n  event.preventDefault();\n\
    }\n```\n\n这样你就可以处理 API 搜索了。\n\n**练习：**\n\n-   [阅读更多关于 React 中的事件](#101) (101)\n\
    -   [阅读更多关于分页 API](#102) (102)\n\n101 https://reactjs.org/docs/events\n102 https://hn.algolia.com\n\
    \n深入实战 API 应用\n\n100\n\n## 分页获取\n\n你是否仔细查看了返回的数据？Hacker News API 返回了一个 `page`\
    \ 属性，在首次请求时为 0。让我们扩展这些常量以便能够处理分页数据。\n\n**src/App.js**\n\n```javascript\nconst\
    \ DEFAULT_QUERY = 'redux';\nconst PATH_BASE = 'https://hn.algolia.com/v1';\nconst\
    \ PATH_SEARCH = '/search';\nconst PARAM_SEARCH = 'query=';\nconst PARAM_PAGE =\
    \ 'page=';\n```\n\n现在你可以使用新的常量为 API 请求添加页面参数。\n\n**Code Playground**\n\n```javascript\n\
    const url = `${PATH_BASE}${PATH_SEARCH}?${PARAM_SEARCH}${searchTerm}&${PARAM_PAGE}${page}`;\n\
    console.log(url);\n// 输出: https://hn.algolia.com/v1/search?query=redux&page=0\n\
    ```\n\n`fetchSearchTopStories` 方法将接收第二个作为参数。如果不提供第二个参数，它将回退到 0。因此 `componentDidMount()`\
    \ 和 `onSearchSubmit()` 方法获取的是第一页。后续获取应通过提供第二个参数来获取下一页。\n\n深入实战 API 应用\n\n102\n\
    \n**src/App.js**\n\n```javascript\nclass App extends Component {\n  ...\n  fetchSearchTopStories(searchTerm,\
    \ page = 0) {\n    fetch(`${PATH_BASE}${PATH_SEARCH}?${PARAM_SEARCH}${searchTerm}&${PARAM_PAGE}${page}`)\n\
    \      .then(response => response.json())\n      .then(result => this.setSearchTopStories(result))\n\
    \      .catch(error => error);\n  }\n  ...\n}\n```\n\n`page` 参数使用了 JavaScript\
    \ ES6 默认参数，在未定义页面参数时回退到 0。\n\n现在你可以使用 API 响应中的当前页码在 `fetchSearchTopStories()`\
    \ 中。你可以将此方法用于按钮，通过 `onClick` 获取更多故事。我们只需要定义 `onClick()` 处理程序，它接收当前的搜索词和下一页（当前页码\
    \ + 1）。\n\n**src/App.js**\n\n```javascript\nclass App extends Component {\n  ...\n\
    \  render() {\n    const { searchTerm, result } = this.state;\n    const page\
    \ = (result && result.page) || 0;\n    return (\n      <div className=\"page\"\
    >\n        <div className=\"interactions\">\n          <Search\n            value={searchTerm}\n\
    \            onChange={this.onSearchChange}\n            onSubmit={this.onSearchSubmit}\n\
    \          >\n            Search\n          </Search>\n        </div>\n      \
    \  { result &&\n          <Table\n            list={result.hits}\n           \
    \ onDismiss={this.onDismiss}\n          />\n        }\n        <button onClick={()\
    \ => this.fetchSearchTopStories(searchTerm, page + 1)}>\n          Load More\n\
    \        </button>\n      </div>\n    );\n  }\n}\n```\n"
