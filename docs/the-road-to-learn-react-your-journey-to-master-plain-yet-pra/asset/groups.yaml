    **ES6 Modules: Import and Export**


    In JavaScript ES6 you can import and export functionalities from modules. These
    functionalities can


    be functions, classes, components, constants and others. Basically everything
    that you can assign to


    a variable. The modules can be single files or whole folders with one index file
    as entry point.


    In the beginning of the book, after you have bootstrapped your application with*
    create-react-*


    *app*, you already had several import and export statements across your initial
    files. Now it is the


    appropriate time to explain these.


    The import and export statements help you to share code across multiple files.
    Before there were


    already several solutions for this in the JavaScript environment. It was a mess,
    because you would


    want to follow one standardized way rather than having several approaches for
    the same thing. Now


    it is a native behavior since JavaScript ES6.


    Additionally these statements embrace code splitting. You distribute your code
    across multiple files


    to keep it reusable and maintainable. The former is true because you can import
    the piece of code in


    multiple files. The latter is true because you have one single source where you
    maintain the piece


    of code.


    Last but not least, it helps you to think about code encapsulation. Not every
    functionality needs


    to get exported from a file. Some of these functionalities should only be used
    in the file where


    they have been defined. The exports of a file are basically the public API to
    the file. Only the


    exported functionalities are available to be reused somewhere else. It follows
    the best practice of


    encapsulation.


    But let’s get practical. How do these import and export statements work? The following
    examples


    showcase the statements by sharing one or multiple variables across two files.
    In the end, the


    approach can scale to multiple files and could share more than simple variables.


    You can export one or multiple variables. It is called a named export.


    **Code Playground: file1.js**


    **const** firstname = ''robin'';


    **const** lastname = ''wieruch'';


    **export** { firstname, lastname };


    And import them in another file with a relative path to the first file.'
- md: "\n## Code Organization and Testing\n\n**Code Playground: file2.js**\n\n```javascript\n\
    import { firstname, lastname } from './file1.js';\n\nconsole.log(firstname);\n\
    \n// output: robin\n```\n\nYou can also import all exported variables from another\
    \ file as one object.\n\n**Code Playground: file2.js**\n\n```javascript\nimport\
    \ * as person from './file1.js';\n\nconsole.log(person.firstname);\n\n// output:\
    \ robin\n```\n\nImports can have an alias. It can happen that you import functionalities\
    \ from multiple files that have the same named export. That’s why you can use\
    \ an alias.\n\n**Code Playground: file2.js**\n\n```javascript\nimport { firstname\
    \ as foo } from './file1.js';\n\nconsole.log(foo);\n\n// output: robin\n```\n\n\
    Last but not least there exists the default statement. It can be used for a few\
    \ use cases:\n\n- to export and import a single functionality\n- to highlight\
    \ the main functionality of the exported API of a module\n- to have a fallback\
    \ import functionality\n\n**Code Playground: file1.js**\n\n```javascript\nconst\
    \ robin = {\n  firstname: 'robin',\n  lastname: 'wieruch',\n};\n\nexport default\
    \ robin;\n```\n\nYou can leave out the curly braces for the import to import the\
    \ default export.\n\n**Code Playground: file2.js**\n\n```javascript\nimport developer\
    \ from './file1.js';\n\nconsole.log(developer);\n\n// output: { firstname: 'robin',\
    \ lastname: 'wieruch' }\n```\n\nFurthermore, the import name can differ from the\
    \ exported default name. You can also use it in conjunction with the named export\
    \ and import statements.\n\n**Code Playground: file1.js**\n\n```javascript\nconst\
    \ firstname = 'robin';\nconst lastname = 'wieruch';\nconst person = {\n  firstname,\n\
    \  lastname,\n};\n\nexport {\n  firstname,\n  lastname,\n};\n\nexport default\
    \ person;\n```\n\n**Code Playground: file2.js**\n\n```javascript\nimport developer,\
    \ { firstname, lastname } from './file1.js';\n\nconsole.log(developer);\n\n//\
    \ output: { firstname: 'robin', lastname: 'wieruch' }\nconsole.log(firstname,\
    \ lastname);\n\n// output: robin wieruch\n```\n\nIn named exports you can spare\
    \ additional lines and export the variables directly.\n\n**Code Playground: file1.js**\n\
    \n```javascript\nexport const firstname = 'robin';\nexport const lastname = 'wieruch';\n\
    ```\n\nThese are the main functionalities for ES6 modules. They help you to organize\
    \ your code, to maintain your code and to design reusable module APIs. You can\
    \ also export and import functionalities to test them. You will do that in one\
    \ of the following chapters.\n\n**Exercises:**\n\n- read more about ES6 import\
    \ (113)\n- read more about ES6 export (114)\n\n113 https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/import\n\
    114 https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/export\n\
    \n## Code Organization with ES6 Modules\n\nYou might wonder: Why didn’t we follow\
    \ the best practices of code splitting for the *src/App.js* file? In the file\
    \ we already have multiple components which could be defined in their own files/folders\
    \ (modules). For the sake of learning React, it is practical to keep these things\
    \ at one place. But once your React application grows, you should consider to\
    \ split up these components into multiple modules. Only that way your application\
    \ scales.\n\nIn the following, I will propose several module structures you could\
    \ apply. I would recommend to apply them as an exercise at the end of the book.\
    \ To keep the book itself simple, I will not perform the code splitting and will\
    \ continue the following chapters with the *src/App.js* file.\n\nOne possible\
    \ module structure could be:\n\n**Folder Structure**\n\n| src/ |\n| :--- |\n|\
    \ index.js |\n| index.css |\n| App.js |\n| App.test.js |\n| App.css |\n| Button.js\
    \ |\n| Button.test.js |\n| Button.css |\n| Table.js |\n| Table.test.js |\n| Table.css\
    \ |\n| Search.js |\n| Search.test.js |\n| Search.css |\n\nIt separates the components\
    \ into their own files, but it doesn’t look too promising. You can see a lot of\
    \ naming duplications and only the file extension differs. Another module structure\
    \ could be:\n\n**Folder Structure**\n\n| src/ |\n| :--- |\n| index.js |\n| index.css\
    \ |\n| App/ |\n| index.js |\n| test.js |\n| index.css |\n| Button/ |\n| index.js\
    \ |\n| test.js |\n| index.css |\n| Table/ |\n| index.js |\n| test.js |\n| index.css\
    \ |\n| Search/ |\n| index.js |\n| test.js |\n| index.css |\n\nIt looks cleaner\
    \ than before. The index naming of a file describes it as an entry point file\
    \ to the folder. It is just a common naming convention, but you can use your own\
    \ naming as well. In this module structure, a component is defined by its component\
    \ declaration in the JavaScript file, but also by its style and tests.\n\nAnother\
    \ step could be extracting the constant variables from the App component. These\
    \ constants were used to compose the Hacker News API URL.\n\n**Folder Structure**\n\
    \n| src/ |\n| :--- |\n| index.js |\n| index.css |\n| **constants//** |\n| **index.js**\
    \ |\n| **components//** |\n| App/ |\n| index.js |\n| test.js |\n| index.css |\n\
    | Button/ |\n| index.js |\n| test.js |\n| index.css |\n| ... |\n\nNaturally the\
    \ modules would split up into *src/constants/* and *src/components/*. Now the\
    \ *src/constants/index.js* file could look like the following:\n\n**Code Playground:\
    \ src/constants/index.js**\n\n```javascript\nexport const DEFAULT_QUERY = 'redux';\n\
    export const DEFAULT_HPP = '100';\nexport const PATH_BASE = 'https://hn.algolia.com/api/v1';\n\
    export const PATH_SEARCH = '/search';\nexport const PARAM_SEARCH = 'query=';\n\
    export const PARAM_PAGE = 'page=';\nexport const PARAM_HPP = 'hitsPerPage=';\n\
    ```\n\nThe *App/index.js* file could import these variables in order to use them.\n\
    \n**Code Playground: src/components/App/index.js**\n\n```javascript\nimport {\n\
    \  DEFAULT_QUERY,\n  DEFAULT_HPP,\n  PATH_BASE,\n  PATH_SEARCH,\n  PARAM_SEARCH,\n\
    \  PARAM_PAGE,\n  PARAM_HPP,\n} from '../constants/index.js';\n...\n```\n\nWhen\
    \ you use the *index.js* naming convention, you can omit the filename from the\
    \ relative path.\n\n**Code Playground: src/components/App/index.js**\n\n```javascript\n\
    import {\n  DEFAULT_QUERY,\n  DEFAULT_HPP,\n  PATH_BASE,\n  PATH_SEARCH,\n  PARAM_SEARCH,\n\
    \  PARAM_PAGE,\n  PARAM_HPP,\n} from '../constants';\n...\n```\n\nBut what’s behind\
    \ the *index.js* file naming? The convention was introduced in the node.js world.\
    \ The index file is the entry point to a module. It describes the public API to\
    \ the module. External modules are only allowed to use the *index.js* file to\
    \ import shared code from the module. Consider the following made up module structure\
    \ to demonstrate it:\n\n**Folder Structure**\n\n| src/ |\n| :--- |\n| index.js\
    \ |\n| App/ |\n| index.js |\n| Buttons/ |\n| index.js |\n| SubmitButton.js |\n\
    | SaveButton.js |\n| CancelButton.js |\n\nThe *Buttons/* folder has multiple button\
    \ components defined in its distinct files. Each file can export default specific\
    \ component making it available to *Buttons/index.js*. The *Buttons/index.js*\
    \ file imports all different button representations and exports them as public\
    \ module API.\n\n**Code Playground: src/Buttons/index.js**\n\n```javascript\n\
    import SubmitButton from './SubmitButton';\nimport SaveButton from './SaveButton';\n\
    import CancelButton from './CancelButton';\n\nexport {\n  SubmitButton,\n  SaveButton,\n\
    \  CancelButton,\n};\n```\n\nNow the *src/App/index.js* can import the buttons\
    \ from the public module API located in the *index.js* file.\n\n**Code Playground:\
    \ src/components/App/index.js**\n\n```javascript\nimport {\n  SubmitButton,\n\
    \  SaveButton,\n  CancelButton\n} from '../Buttons';\n```\n\nBy going with this\
    \ constraint, it would be a bad practice to reach into other files than the *index.js*\
    \ in the module. It would break the rules of encapsulation.\n\n**Code Playground:\
    \ src/components/App/index.js**\n\n```javascript\n// bad practice, don't do it\n\
    import SubmitButton from '../Buttons/SubmitButton';\n```\n"
  mdcn: "\n\n## 代码组织与测试\n\n**代码沙场：file2.js**\n\n```javascript\nimport { firstname,\
    \ lastname } from './file1.js';\n\nconsole.log(firstname);\n\n// output: robin\n\
    ```\n\n你也可以作为一个对象的形式从另一个文件中导入所有导出变量。\n\n**代码沙场：file2.js**\n\n```javascript\nimport\
    \ * as person from './file1.js';\n\nconsole.log(person.firstname);\n\n// output:\
    \ robin\n```\n\n导入可以有别名。可能会出现你从多个文件中导入具有同名导出的功能的情况。这就是为什么你可以使用别名。\n\n**代码沙场：file2.js**\n\
    \n```javascript\nimport { firstname as foo } from './file1.js';\n\nconsole.log(foo);\n\
    \n// output: robin\n```\n\n最后但同样重要的是，还存在默认 `default` 语句。它可以用于以下几种用例：\n\n- 导出和导入单个功能\n\
    - 突出模块导出 API 的主要功能\n- 拥有一个回退导入功能\n\n**代码沙场：file1.js**\n\n```javascript\nconst\
    \ robin = {\n  firstname: 'robin',\n  lastname: 'wieruch',\n};\n\nexport default\
    \ robin;\n```\n\n在导入时可以省略大括号来导入默认导出。\n\n**代码沙场：file2.js**\n\n```javascript\nimport\
    \ developer from './file1.js';\n\nconsole.log(developer);\n\n// output: { firstname:\
    \ 'robin', lastname: 'wieruch' }\n```\n\n此外，导入的名称可以与导出的默认名称不同。你也可以将其与具名导出和导入语句结合使用。\n\
    \n**代码沙场：file1.js**\n\n```javascript\nconst firstname = 'robin';\nconst lastname\
    \ = 'wieruch';\nconst person = {\n  firstname,\n  lastname,\n};\n\nexport {\n\
    \  firstname,\n  lastname,\n};\n\nexport default person;\n```\n\n**代码沙场：file2.js**\n\
    \n```javascript\nimport developer, { firstname, lastname } from './file1.js';\n\
    \nconsole.log(developer);\n\n// output: { firstname: 'robin', lastname: 'wieruch'\
    \ }\nconsole.log(firstname, lastname);\n\n// output: robin wieruch\n```\n\n在具名导出中，你可以节省额外的行并直接导出变量。\n\
    \n**代码沙场：file1.js**\n\n```javascript\nexport const firstname = 'robin';\nexport\
    \ const lastname = 'wieruch';\n```\n\n这些是 ES6 模块的主要功能。它们帮助你组织代码、维护代码并设计可重用的模块\
    \ API。你也可以导出和导入功能以测试它们。你将在接下来的章节中操作。\n\n**练习：**\n\n- 更多关于 ES6 导入 (113)\n- 更多关于\
    \ ES6 导出 (114)\n\n113 https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/import\n\
    114 https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/export\n\
    \n## 使用 ES6 模块进行代码组织\n\n你可能会想：为什么我们没有对 *src/App.js* 文件遵循代码分割的最佳实践？在文件中我们已经有了多个组件，这些组件可以定义在自己的文件/文件夹（模块）中。为了学习\
    \ React，将这些内容放在一个地方是切实际的。但一旦你的 React 应用程序增长，你就应该考虑将这些组件拆分成多个模块。只有这样，你的应用程序才能扩展。\n\
    \n在接下来，我将提出几种你可以运用的模块结构。我建议在书的末尾作为一个练习应用它们。为了保持书本身的简单，我将不会执行代码分割，并在后续章节中继续使用 *src/App.js*\
    \ 文件。\n\n一种可能的模块结构可能是：\n\n**目录结构**\n\n| src/ |\n| :--- |\n| index.js |\n| index.css\
    \ |\n| App.js |\n| App.test.js |\n| App.css |\n| Button.js |\n| Button.test.js\
    \ |\n| Button.css |\n| Table.js |\n| Table.test.js |\n| Table.css |\n| Search.js\
    \ |\n| Search.test.js |\n| Search.css |\n\n它将组件分到了它们自己的文件中，但看起来并不太乐观。你可以看到很多命名重复，仅仅是文件扩展名不同。另一种模块结构可能是：\n\
    \n**目录结构**\n\n| src/ |\n| :--- |\n| index.js |\n| index.css |\n| App/ |\n| index.js\
    \ |\n| test.js |\n| index.css |\n| Button/ |\n| index.js |\n| test.js |\n| index.css\
    \ |\n| Table/ |\n| index.js |\n| test.js |\n| index.css |\n| Search/ |\n| index.js\
    \ |\n| test.js |\n| index.css |\n\n它看起来比以前更整洁。文件的 `index` 命名将其描述为该文件夹的入口文件。这是一种常见的命名约定，但你也可以使用自己的命名。在这个模块结构中，组件通过其\
    \ JavaScript 文件中的组件声明定义，同时也通过其样式和测试定义。\n\n另一个步骤可能是从 App 组件中提取常量变量。这些常量被用于组合 Hacker\
    \ News API URL。\n\n**目录结构**\n\n| src/ |\n| :--- |\n| index.js |\n| index.css |\n\
    | **constants//** |\n| **index.js** |\n| **components//** |\n| App/ |\n| index.js\
    \ |\n| test.js |\n| index.css |\n| Button/ |\n| index.js |\n| test.js |\n| index.css\
    \ |\n\n自然情况下，模块将拆分到 *constants/* 和 *components/*。现在 *constants/index.js* 文件可能像这样：\n\
    \n**代码沙场：constants/index.js**\n\n```javascript\nexport const DEFAULT_QUERY = 'redux';\n\
    export const DEFAULT_HPP = '100';\nexport const PATH_BASE = 'https://hn.algolia.com/api/v1';\n\
    export const PATH_SEARCH = '/search';\nexport const PARAM_SEARCH = 'query=';\n\
    export const PARAM_PAGE = 'page=';\nexport const PARAM_HPP = 'hitsPerPage=';\n\
    ```\n\n*App/index.js* 文件可以导入这些变量以使用它们。\n\n**代码沙场：components/App/index.js**\n\n\
    ```javascript\nimport {\n  DEFAULT_QUERY,\n  DEFAULT_HPP,\n  PATH_BASE,\n  PATH_SEARCH,\n\
    \  PARAM_SEARCH,\n  PARAM_PAGE,\n  PARAM_HPP\n} from '../constants/index.js';\n\
    ```\n\n当你使用 `index.js` 命名约定时，可以从相对路径中省略文件名。\n\n**代码沙场：components/App/index.js**\n\
    \n```javascript\nimport {\n  DEFAULT_QUERY,\n  DEFAULT_HPP,\n  PATH_BASE,\n  PATH_SEARCH,\n\
    \  PARAM_SEARCH,\n  PARAM_PAGE,\n  PARAM_HPP\n} from '../constants';\n```\n\n\
    但 `index.js` 文件命名的背后是什么？这个约定是在 node.js 世界引入的。index 文件是模块的入口点。它描述了模块的公共 API。外部模块仅允许\
    \ `index.js` 文件来导入模块的共享代码。考虑以下假设模块结构来演示：\n\n**目录结构**\n\n| src/ |\n| :--- |\n|\
    \ index.js |\n| App/ |\n| index.js |\n| Buttons/ |\n| index.js |\n| SubmitButton.js\
    \ |\n| SaveButton.js |\n| CancelButton.js |\n\n*Buttons/* 文件夹在其不同的不同的文件中定义了多个按钮组件。每个文件都可以导出特定的组件以供\
    \ *Buttons/index.js* 使用。*Buttons/index.js* 文件导入所有不同的按钮表示并将它们导出为公共模块 API。\n\n**代码沙场：Buttons/index.js**\n\
    \n```javascript\nimport SubmitButton from './SubmitButton';\nimport SaveButton\
    \ from './SaveButton';\nimport CancelButton from './CancelButton';\n\nexport {\n\
    \  SubmitButton,\n  SaveButton,\n  CancelButton,\n};\n```\n\n现在 *src/App/index.js*\
    \ 可以从位于 *index.js* 文件的公共 API 导入按钮。\n\n**代码沙场：components/App/index.js**\n\n```javascript\n\
    import {\n  SubmitButton,\n  SaveButton,\n  CancelButton\n} from '../Buttons';\n\
    ```\n\n通过这种约束，进入模块中除 *index.js* 以外的文件将是坏习惯。它会破坏封装的规则。\n\n**代码沙场：components/App/index.js**\n\
    \n```javascript\n// 坏习惯，不要这样做\nimport SubmitButton from '../Buttons/SubmitButton';\n\
    ```\n\n"
