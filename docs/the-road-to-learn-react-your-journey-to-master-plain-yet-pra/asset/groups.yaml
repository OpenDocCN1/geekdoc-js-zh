    \n你可能听说过测试金字塔。它包括端到端测试、集成测试和单元测试。如果你不熟悉这些，本书将为你提供快速且基础的概述。单元测试用于测试隔离的较小代码块。一个单元测试可以对一个单一的函数进行测试。然而，有时单元在孤立状态下运行良好，但与其他单元结合时无法正常工作。它们需要作为一个整体进行组合测试。这就是集成测试大显身场，它可以涵盖单元之间是否协作良好。最后，端到端测试是对真实用户场景的模拟。它可以是浏览器中的自动化设置，模拟用户在\
    \ Web 应用程序中的登录流程。虽然单元测试快速且易编写和维护，但端到端测试处于光谱的另一端。\n\n每种类型需要多少个测试？你需要许多单元测试来覆盖孤立函数。之后，你可以有几个集成测试来确保最重要的函数按预期组合工作。最后，你可能只需要少量的端到端测试来模拟\
    \ Web 应用程序中的关键场景。这就是对测试世界的通用漫览。\n\n那么，你如何将这些知识应用于 React 应用程序的测试中？React 测试的基础是组件测试，它可以被泛括为单元测试，且其一部分是快照测试。在下一章中，你将使用一个名为\
    \ Enzyme 的库对组件进行单元测试。在这一章中，你将关注另一种测试：快照测试。这就是 Jest 发挥用场的地方。\n\nJest^[115](https://facebook.github.io/jest/)\
