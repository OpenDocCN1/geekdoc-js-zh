  - '[PAGE 43]


    Basics in React


    30


    **Internal Component State**


    Internal component state, also known as local state, allows you to save, modify
    and delete properties


    that are stored in your component. The ES6 class component can use a constructor
    to initialize


    internal component state later on. The constructor is called only once when the
    component


    initializes.


    Let’s introduce a class constructor.


    **src/App.js**


    class App extends Component {


    **constructor(props) {**


    **super(props);**


    **}**


    ...


    }


    When having a constructor in your ES6 class component, it is mandatory to call
    super(); because


    the App component is a subclass of Component. Hence the extends Component in your
    App


    component declaration. You will learn more about ES6 class components later on.


    You can call super(props); as well. It sets this.props in your constructor in
    case you want to


    access them in the constructor. Otherwise, when accessing this.props in your constructor,
    they


    would be undefined. You will learn more about the props of a React component later
    on.


    Now, in your case, the initial state in your component should be the sample list
    of items.


    **src/App.js**


    const list = \[


    {


    title: ''React'',


    url: ''https://facebook.github.io/react/'',


    author: ''Jordan Walke'',


    num\_comments: 3,


    points: 4,


    objectID: 0,


    },


    ...


    \];'
