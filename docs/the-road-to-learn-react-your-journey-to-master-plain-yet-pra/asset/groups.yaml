- md: "\n## Code Organization and Testing\n\n143\n\n**src/App.js**\n\n```javascript\n\
    Button.propTypes = {\n  onClick: PropTypes.func.isRequired,\n  className: PropTypes.string,\n\
    \  children: PropTypes.node.isRequired,\n};\n```\n\nThe className is not required,\
    \ because it can default to an empty string. Next you will define a\n\nPropType\
    \ interface for the Table component:\n\n**src/App.js**\n\n```javascript\nTable.propTypes\
    \ = {\n  list: PropTypes.array.isRequired,\n  onDismiss: PropTypes.func.isRequired,\n\
    };\n```\n\nYou can define the content of an array PropType more explicitly:\n\n\
    **src/App.js**\n\n```javascript\nTable.propTypes = {\n  list: PropTypes.arrayOf(\n\
    \    PropTypes.shape({\n      objectID: PropTypes.string.isRequired,\n      author:\
    \ PropTypes.string,\n      url: PropTypes.string,\n      num_comments: PropTypes.number,\n\
    \      points: PropTypes.number,\n    })\n  ).isRequired,\n  onDismiss: PropTypes.func.isRequired,\n\
    };\n```\n\nOnly the objectID is required, because you know that some of your code\
    \ depends on it. The other\n\nproperties are only displayed, thus they are not\
    \ necessarily required. Moreover you cannot be sure\n\nthat the Hacker News API\
    \ has always a defined property for each object in the array.\n\nThat’s it for\
    \ PropTypes. But there is one more aspect. You can define default props in your\n\
    \ncomponent. Let’s take again the Button component. The className property has\
    \ an ES6 default\n\nparameter in the component signature.\n\n144\n\n**src/App.js**\n\
    \n```javascript\nconst Button = ({\n  onClick,\n  className = '',\n  children\n\
    }) =>\n\n...\n```\n\nYou could replace it with the internal React default prop:\n\
    \n**src/App.js**\n\n```javascript\nconst Button = ({\n  onClick,\n  className,\n\
    \  children\n}) => (\n  <button\n    onClick={onClick}\n    className={className}\n\
    \    type=\"button\"\n  >\n    {children}\n  </button>\n);\n\nButton.defaultProps\
    \ = {\n  className: '',\n};\n```\n\nSame as the ES6 default parameter, the default\
    \ prop ensures that the property is set to a default value\n\nwhen the parent\
    \ component didn’t specify it. The PropType type check happens after the default\n\
    \nprop is evaluated.\n\nIf you run your tests again, you might see PropType errors\
    \ for your components on your command\n\nline. It can happen because you didn’t\
    \ define all props for your components in the tests that are\n\ndefined as required\
    \ in your PropType definition. The tests themselves all pass correctly though.\
    \ You\n\ncan pass all required props to the components in your tests to avoid\
    \ these errors.\n\n**Exercises:**\n\n- define the PropType interface for the Search\
    \ component\n- add and update the PropType interfaces when you add and update\
    \ components in the next\n\nchapters\n- read more about React PropTypes^(121)\n\
    \n121https://reactjs.org/docs/typechecking-with-proptypes.html\n\n146\n\nYou have\
    \ learned how to organize your code and how to test it! Let’s recap the last chapters:\n\
    \n- React\n  - PropTypes let you define type checks for components\n  - Jest allows\
    \ you to write snapshot tests for your components\n  - Enzyme allows you to write\
    \ unit tests for your components\n- ES6\n  - import and export statements help\
    \ you to organize your code\n- General\n  - code organization allows you to scale\
    \ your application with best practices\n\nYou can find the source code in the\
    \ official repository^(122).\n\n122https://github.com/the-road-to-learn-react/hackernews-client/tree/5.4\n\
    \n## Advanced React Components\n\nThe chapter will focus on the implementation\
    \ of advanced React components. You will learn about\n\nhigher-order components\
    \ and how to implement them. In addition, you will dive into more advanced\n\n\
    topics in React and implement complex interactions with it.\n\n148\n\n### Ref\
    \ a DOM Element\n\nSometimes you need to interact with your DOM nodes in React.\
