    \  this.setState({ list: updatedList });\n}\n```\n\n现在再次运行你的应用程序并尝试“Dismiss”按钮。它应该可以工作。你现在的是\
    \ React 中的单向数据流。你在视图中触发了一个动作，`render()` 方法再次运行以更新视图。\n\n**练习：**\n- 了解更多关于 React\
    \ 中的状态和生命周期：https://reactjs.org/docs/state-and-lifecycle.html\n\n40\n\n**绑定 (Bindings)**\n\
