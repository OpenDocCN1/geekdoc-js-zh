    **驯服状态**


    之前的章节已经向你展示了状态管理在大型应用程序中是一个至关重要的课题。通常情况下，不仅是 React，许多 SPA（单页应用）框架在这方面都面临挑战。近年来，应用程序变得越来越复杂。如今
    Web 应用面临的一个大挑战之一就是驯服和控制状态。


    与其他解决方案相比，React 已经迈出了一大步。单向数据流和用于组件内管理状态的简单 API 是不可或缺的。这些概念使得对状态及其状态变化的推理变得更容易。它使得你在组件层面以及在某种程度上在应用层面更容易进行推理。


    在一个不断增长的应用程序中，推理状态变化变得越来越困难。在 `setState()` 中使用对象而不是函数时，可能会因为操作旧状态而引入 bug。你必须通过提升状态（lift
    state）来在组件之间共享必要的状态或隐藏不必要的状态。可能会出现某个组件需要提升状态，因为它的兄弟组件依赖于它。也许该组件在组件树中很远，因此你必须跨越整个树共享状态。结论是，组件参与状态管理的程度越来越大。但到底，组件的主要职责应该是表示
    UI，不是吗？


    由于这些原因，存在独立的解决方案来处理应用程序中的状态管理。这些解决方案不仅用于 React。但这正是 React 生态系统的强大之处。你可以使用不同的解决方案来解决问题。为了扩展状态管理的问题，你可能听过
