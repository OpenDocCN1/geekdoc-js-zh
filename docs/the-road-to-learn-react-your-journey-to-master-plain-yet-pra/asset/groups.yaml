    \n55\n\nReact 基础\n\n**src/App.js**\n\n```javascript\n**function isSearched(searchTerm)\
    \ {**\n**return function(item) {**\n**// 返回 true 或 false 的某些条件**\n}**\n}\n\nclass\
    \ App extends Component {\n\n...\n\n}\n```\n\n该函数接收 `searchTerm` 并返回另一个函数，因为毕竟\
    \ `filter` 函数接收一个函数作为它的输入。返回的函数可以访问 `item` 对象，因为它就是传递给 `filter` 函数的那个函数。此外，返回的函数将用于根据函数中定义的条件来过滤列表。让我们定义这个条件。\n\
    \n**src/App.js**\n\n```javascript\nfunction isSearched(searchTerm) {\n\nreturn\
    \ function(item) {\n\n**return item.title.toLowerCase().includes(searchTerm.toLowerCase());**\n\
    \n}\n\n}\n\nclass App extends Component {\n\n...\n\n}\n```\n\n该条件表示，将传入的 `searchTerm`\
    \ 模式与列表中 `item` 的 `title` 属性进行匹配。你可以使用 JavaScript 内置的 `includes` 功能来实现。只有当模式匹配时，你才返回\
    \ `true`，该项保留在列表中。当模式不匹配时，该项将从列表中移除。但要小心模式匹配：你不应该忘记将两个字符串都转换为小写。否则，搜索词 ‘redux’\
    \ 和项目标题 ‘Redux’ 之间会出现不匹配。由于我们处理的是不可变列表，并通过使用 `filter` 函数返回一个新列表，本地状态中的原始列表完全没有被修改。\n\
    \n还有一点需要提：我们利用 JavaScript 内置的 `includes` 功能稍微耍了小聪明。它已经是 ES6 的特性了。在 JavaScript\
    \ ES5 中它看起来应该是什么样？你将使用 `indexOf()` 函数来获取项在列表中的索引。当项在列表中时，`indexOf()` 将返回它在数组中的索引。\n\
    \n56\n\nReact 基础 \n\n**代码沙场**\n\n*// ES5*\n`string.indexOf(pattern) !== -1`\n\n\
    *// ES6*\n`string.includes(pattern)`\n\n再次使用 ES6 箭头函数可以完成另一个简洁的重构。它让函数更加简洁：\n\n\
