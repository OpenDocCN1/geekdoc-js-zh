    \n```javascript\nonDismiss(id) {\n  function isNotId(item) {\n    return item.objectID\
    \ !== id;\n  }\n  const updatedList = this.state.list.filter(isNotId);\n}\n```\n\
    \n此外，你可以使用 JavaScript ES6 箭头函数更加简洁地。\n\n**src/App.js**\n\n```javascript\nonDismiss(id)\
