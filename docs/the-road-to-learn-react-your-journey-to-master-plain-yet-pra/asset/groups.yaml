  mdcn: '


    ## 提纲


    193


    围绕它的工具链。它让你能够在不使用 *create-react-app* 的情况下搭建自己的项目。我建议遵循 Webpack 和 Babel(158) 的最小化设置。之后，你可以自行应用更多工具。例如，你可以使用
    ESLint(159) 来在应用程序中遵循统一的代码风格。


    - **React 组件语法：** 实现 React 组件的可能性和最佳实践随时间演变。你会在其他学习资源中发现许多编写 React 组件（尤其是 React
    类组件）的方法。你可以查看这个 [GitHub 仓库(160)](https://github.com/the-road-to-learn-react/react-alternative-class-component-syntax)
    来了解编写 React 类组件的另一种方法。通过使用类字段声明，未来你可以将其写得更加简洁。


    - **其他项目：** 在学习了原生 React 后，在学习新东西之前，先将所学知识应用到自己的项目中总是好的。你可以用 React 编写你自己的井棋游戏或一个简单的计算器。那里有很多教程只使用
    React 来构建有趣的内容。可以查看我关于构建分页和无限滚动列表(161)的教程、在 Twitter 墙上展示推文(162)或将你的 React 应用程序连接
    Stripe 进行收费(163)。通过尝试这些微型应用程序来熟悉 React。


    - **UI 组件：** 你不应该犯在项目中过早引入 UI 组件库的错误。首先，你应该学习如何使用标准的 HTML 元素从零实现并使用下拉列表、复选框或对话框。这些组件的大部分将管理它们自己的本地状态。复选框必须知道自己是否被选中。因此你应该将它们实现为受控组件。在你完成所有基础实现后，可以引入
    UI 组件库，它可以提供作为 React 组件的复选框和对话框。


    - **代码组织：** 在读书过程中，你会遇到一个关于代码组织的章节。如果你还没有这样做，现在就可以应用这些更改。它会将你的组件组织在结构化的文件和文件夹（模块）中。此外，它帮助你理解和学习代码分割、重用、可维护性和模块
    API 设计的原则。最终你的应用程序规模会扩大，你需要对其进行模块化结构化。所以现在开始会更好。


    - **测试：** 这本书对测试仅浅触皮毛。如果你不熟悉这个通用话题，可以深入研究单元测试和集成测试的概念，特别是在 React 应用程序的背景下。在实现层面，我建议坚持使用
    Enzyme 和 Jest，以完善你在 React 中通过单元测试和快照测试进行测试的方法。


    - **路由：** 你可以使用 [react-router(164)](https://github.com/ReactTraining/react-router)
    为你的应用程序实现路由。到目前为止，你的应用程序只有一个页面。React Router 帮助你在多个 URL 上拥有多个页面。当你向应用程序引入路由时，你不需要向
    Web 服务器发送请求来获取下一页。路由器将在客户端为你完成一切。所以动手起来，在你的应用程序中引入路由吧。


    - **类型检查：** 在其中一个章节中，你使用了 React PropTypes 来定义组件接口。这是一个防止 Bug 的良好做法。但 PropTypes
    仅在运行时检查。你可以更进一步，在编译时引入静态类型检查。[TypeScript(165)](https://www.typescriptlang.org/)
    是一种流行的方法。但在 React 生态系统中，人们经常使用 [Flow(166)](https://flowtype.org/)。如果你感兴趣让你的应用程序更健壮，我建议尝试一下
    Flow。


    - **React Native：** [React Native(167)](https://facebook.github.io/react-native/)
    将你的应用程序带到移动设备。你可以将从 React 学到的知识应用于发布 iOS 和 Android 应用。一旦学习了 React，React Native
    的学习曲线不应该是陡峭的。两者共享相同的原理。你只会在移动端遇到与你在 Web 应用程序中不同的布局组件。


    总来说，我邀请你访问我的[网站(168)](https://www.robinwieruch.de) 来寻找更多关于 Web 开发和软件工程的有趣话题。你可以订阅我的[Newsletter(169)](https://www.getrevue.co/profile/rwieruch)
    以获取文章、书籍和课程的更新。此外，课程平台 Road to React(170)](https://roadtoreact.com) 提供了更高级的课程来学习
    React 生态系统。你应该看看！


    最后但同样重要的是，我希望找到更多能够支持我内容的[赞助(171)](https://www.patreon.com/rwieruch)。有很多学生负担不起教育内容的费用。这就是为什么我免费发布了大量内容。通过作为我的赞助者支持我的工作，我可以维持这些免费教导他人的努力。


    再次，如果你喜欢这本书，我希望你花点时间思考一个适合学习 React 的人。联系那个人并分享这本书。这对我意义重大。这本书的意图是送给别人的。随着更多人阅读并向我提供反馈，它会随着时间的推移而改进。我也希望看到你的反馈、评论或评分！


    非常感谢阅读学习 React 之路。


    Robin


