    React will do all the work for you and display each item. But you should add one
    helper for React


    to embrace its full potential and improve its performance. You have to assign
    a key attribute to each


    list element. That way React is able to identify added, changed and removed items
    when the list


    changes. The sample list items come with an identifier already.


    **src/App.js**


    {list.map(function(item) {


    return (


    **<div key={item.objectID}>**


    <span>


    <a href={item.url}>{item.title}</a>


    </span>


    <span>{item.author}</span>


    <span>{item.num\_comments}</span>


    <span>{item.points}</span>


    </div>


    );


    })}


    You should make sure that the key attribute is a stable identifier. Don’t make
    the mistake of using


    index of the item in the array. The array index isn’t stable at all. For instance,
    when the list changes


    its order, React will have a hard time identifying the items properly.


    **src/App.js**


    *// don''t do this*


    {list.map(**function**(item, key) {


    **return** (


    <div key\={key}\>


    ...


    </div>


    );


    })}


    You are displaying both list items now. You can start your app, open your browser
    and see both


    items of the list displayed.'
