- md: "\nBasics in React\n\n61\n\nThe whole internal state management and unidirectional\
    \ data flow might be new to you. But once you are used to it, it will be your\
    \ natural flow to implement things in React. In general, React brought a novel\
    \ pattern with the unidirectional data flow to the world of single page applications.\
    \ It is adopted by several frameworks and libraries by now.\n\n**Exercises:**\n\
    \n- read more about React forms^(71)\n- learn more about different controlled\
    \ components^(72)\n\n71https://reactjs.org/docs/forms.html\n72https://github.com/the-road-to-learn-react/react-controlled-components-examples\n\
    \nBasics in React\n\n62\n\n## Split Up Components\n\nYou have one large App component\
    \ now. It keeps growing and can become confusing eventually. You can start to\
    \ split it up into chunks of smaller components.\n\nLet’s start to use a component\
    \ for the search input and a component for the list of items.\n\n**src/App.js**\n\
    \n```javascript\nclass App extends Component {\n  ...\n\n  render() {\n    const\
    \ { searchTerm, list } = this.state;\n    return (\n      <div className=\"App\"\
    >\n        <Search />\n        <Table />\n      </div>\n    );\n  }\n}\n```\n\n\
    You can pass those components properties which they can use themselves. In the\
    \ case of the App component it needs to pass the properties managed in the local\
    \ state and its class methods.\n\n**src/App.js**\n\n```javascript\nclass App extends\
    \ Component {\n  ...\n\n  render() {\n    const { searchTerm, list } = this.state;\n\
    \    return (\n      <div className=\"App\">\n        <Search\n          value={searchTerm}\n\
    \          onChange={this.onSearchChange}\n        />\n        <Table\n      \
    \    list={list}\n          pattern={searchTerm}\n          onDismiss={this.onDismiss}\n\
    \        />\n      </div>\n    );\n  }\n}\n```\n\nBasics in React\n\n63\n\nNow\
    \ you can define the components next to your App component. Those components will\
    \ be ES6 class components as well. They render the same elements like before.\
    \ The first one is the Search component.\n\n**src/App.js**\n\n```javascript\n\
    class App extends Component {\n  ...\n}\n\nclass Search extends Component {\n\
    \  render() {\n    const { value, onChange } = this.props;\n    return (\n   \
    \   <form>\n        <input\n          type=\"text\"\n          value={value}\n\
    \          onChange={onChange}\n        />\n      </form>\n    );\n  }\n}\n```\n\
    \nThe second one is the Table component.\n\nBasics in React\n\n64\n\n**src/App.js**\n\
    \n```javascript\n...\nclass Table extends Component {\n  render() {\n    const\
    \ { list, pattern, onDismiss } = this.props;\n    return (\n      <div>\n    \
    \    {list.filter(isSearched(pattern)).map(item =>\n          <div key={item.objectID}>\n\
    \            <span>\n              <a href={item.url}>{item.title}</a>\n     \
    \       </span>\n            <span>{item.author}</span>\n            <span>{item.num_comments}</span>\n\
    \            <span>{item.points}</span>\n            <span>\n              <button\n\
    \                onClick={() => onDismiss(item.objectID)}\n                type=\"\
    button\"\n              >\n                Dismiss\n              </button>\n\
    \            </span>\n          </div>\n        )}\n      </div>\n    );\n  }\n\
    }\n```\n\nNow you have three ES6 class components. Perhaps you have noticed the\
    \ props object that is accessible via the class instance by using this.props.\
    \ The props, short form for properties, have all the values you have passed to\
    \ the components when you used them in your App component. That way, components\
    \ can pass properties down the component tree.\n\nBy extracting those components\
    \ from the App component, you would be able to reuse them somewhere else. Since\
    \ components get their values by using the props object, you can pass every time\
    \ different props to your components when you use them somewhere else. These components\
    \ became reusable.\n\nBasics in React\n\n65\n\n**Exercises:**\n\n- figure out\
