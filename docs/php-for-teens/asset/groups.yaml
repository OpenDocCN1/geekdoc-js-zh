    # Note


    Even though we made the text area 2 × 40, the user can still type more. When the
    allowed number of characters is typed, the area displays a scrolling bar on its
    side, just like your web browser lets you scroll down a page.


    ```

    <form action="" method="post">

    Name: <input type="text" name="fullname" />

    Address: <input type="text" name="address" /> <br /> <br />

    Comments: <textarea name="comments" cols="40" rows="2"></textarea>


    </form>

    ```


    # Submit Button


    So far, the user can enter plenty of information. However, you can''t do anything
    with it! The server uses the HTML form to pass data to another program, such as
    one written in PHP, that will handle and deal with the information. It might email


    # A Sample Form


