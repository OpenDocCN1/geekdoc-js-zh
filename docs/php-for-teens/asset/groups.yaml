    \ because the variable is registered. This is the problem we were experiencing,\
    \ and we need to figure out how to fix it.\n\nFortunately, the fix is simple:\
    \ When dealing with sessions, each session has a session name. Any script that\
    \ uses session_start() gets a default session name, and the script uses this session\
    \ name to carry variables from page to page. However, if we want to differentiate\
    \ two pages, we can create a new session name for the scripts, causing the variables\
    \ not to carry through."
