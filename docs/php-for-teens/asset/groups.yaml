    # Developing a Log-In Page


    Let''s develop a web page that lets the user log in and log out. You have probably
    seen pages like this: when you shop, post in forums, or bank online. Username
    and password forms are ubiquitous and very important, so is a good thing to learn.
    In this section you learn the basics: a simple user/pass combination with different
    text strings for each user. You develop the user/pass script without any record-keeping
    abilities. (Remember that a password box is the same as a text box, except it
    disguises the entry with asterisks.)


    The best way to create a user/pass section is to use a database. You can create
    new users by adding information into the database. To read databases, I recommend
    A Guide to SQL by Philip J. Pratt and Mary Z. Last or A Guide to MySQL by Pratt
    (Course).


    We are going to add two user accounts directly into our web page. The first user
    account will have the username test and the password test. The second user will
    have the username manesh and the password test. First, we develop an HTML document
    that allows the visitor to log in. The following code is taken from phpftl13-05.html
    and its results are in Figure 13:14:


