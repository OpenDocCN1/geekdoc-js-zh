    ## HTML 表单


    现在你已经看到了 HTML 模板，让我们来创建一个表单。使用 `<form>` 标签包裹所有的输入项，如文本框和提交按钮。![](img/fb76427b4bed9367f4a8810f090a7a37_54_0.png)


