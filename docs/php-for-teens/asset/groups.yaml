    # Why give form fields a name value?


    The option to give a field name to the textbox is incredibly important: Never,
    ever forget to set it. Whenever PHP tries to run any commands upon the form fields,
    it needs to have a way to reference them. In this case, it uses the field''s name.
    When you need to talk to a friend, and he is in a crowd of other people, typically,
    you will call out his name; that is exactly what the code is doing. Giving the
    field name allows the PHP program to call the form and use its data. I will go
    over this further on in the book.


    Now add the second field. Do exactly same: Write the text on the screen (Address:),
    then create a textbox with the name value set to address. So far, good? The result
    should look a lot like Figure 3.9.'
