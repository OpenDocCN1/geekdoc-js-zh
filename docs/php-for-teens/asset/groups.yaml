    # CHAPTER 8


    # # STRINGS


    Strings are a data type, like integers or floating-point values, except they do
    not deal with numbers. Instead, they deal with characters and words. An example
    of a very basic string is a. A more complex string might be Hello, World, while
    a very complex string might have symbols in it that aren''t even letters. They
    also can contain numbers. You might want to create a string that looks something
    like this: My house has 2 stories and 5 bedrooms.. Strings allow you to store
    numbers as characters inside your strings, but strings with numbers inside them
    are not the same as integers. Combining two strings gives you a result that is
    not the same as adding two numbers, so "10*+14" does not equal 24, 10+14 will.
    Be aware of the quotation marks around strings.


    PHP, unlike other languages, has no length limit on strings. You can make them
    as long or as short as you like. This is great for when you want to turn an entire
    web page''s source or a very long piece of text into a string.


    # ## Making Strings


    There are few methods of creating a string, and these methods are known as different
    methods of syntax:


    +   - Single quoted

    - Double quoted

    - Heredoc'
