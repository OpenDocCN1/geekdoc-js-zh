    我们遍历了循环 9 次: September\n我们遍历了循环 10 次: October\n我们遍历了循环 11 次: November\n我们遍历了循环\
    \ 12 次: December\n```\n\n图 10.7\n在 phpppt10-05.php 中使用 foreach 循环。\n\n很酷吧？我们开发了相同的项目并使用了一个变量来实际计算循环的次数。每次循环发生时计数器增加。这比使用基本的\
    \ for 循环容易得多吧？让我们看看用于定义 foreach 循环的另一种结构：\n\n```php\nforeach ($array as $keyname\
    \ => $valname)\n{\n    //执行语句\n}\n```\n\n有点不同。这里的主要区别是我们添加了 $keyname，现在我们可以确定键以及值。这种结构非常适合表单。让我们看看示例。我们可以开发一个包含多个项目的表单。它可以显示键和值以帮助理解用户留空了哪些字段。创建一个示例表单。以下代码来自\
