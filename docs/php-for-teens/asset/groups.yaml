    Now that I''ve gone over some basic variables, let me show you some other special
    types.


    ## Predefined Variables and Arrays


    PHP includes some predefined variables—those it designates. Some of these variables
    are created by the web server or sent by GET or POST forms (which I went over
    in Chapter 3). You can use these variables within your program for a lot of things.
    Before we move on, let''s talk a little about the difference between GET and POST.


    ## GET Versus POST


    In all of forms, you have the option of using GET or POST. Both are useful in
    different cases, so you should know the difference between the two. When using
    a GET form, all of the variable data are passed along in the URL''s address bar.
    This means you can look at the URL and see all the variables and their values.
    On the other hand, POST hides all the variables from the address bar—instead,
    it is transparently passed to the PHP program.


    For example, you say you had a page at .something.com/page.php, which uses a GET
    form, and that the form passes the data to itself. After inputting the variables
    and pressing submit, the address bar might look like the following:


    ```

    http://www.something.com/page.php?first=value1&second=value2

    ```


    In this case, there are two fields on the form: The first field has the name set
    to first, and the user entered in value in the textbox. The second field is called
    second and the value is value2. As you can see, all the data is passed along the
    address bar. This means the user can manually change the values without even going
    through the form. POST, on the other hand, does not show the data in the URL address.
    After submitting the form, the address will look like this:


    ```

    http://www.something.com/page.php

    ```


    So would you use one or the other? In some cases, it is important to secure data
    by not passing it in the address bar. For example, if the form is a log in, you
    don''t want the password to be displayed in the address bar; you use POST. Alternatively,
    if you want the user to be able to bookmark a page through a form, using GET allows
    that.


    ## Arrays


    To access the predefined variables, we have to use an array. Arrays are sets of
    variables that all have the same name, but are referenced by a specific number.
    Arrays look exactly like a normal variable except it has a number attached to
    the end of the name. For example, while a normal variable might be called $name,
    an array of three would look like: $name[0], $name[1], $name[2]. In addition,
    arrays can use words rather than digits—example, $name["first"] or $name["second"].


    You can create your own arrays in a few ways. The easiest way is to simply define
    each item from the array. For example, to create a few variables of $name, we
    could do this:


    ```php

    $name[0] = "Mesh";

    $name[1] = "John";

    $name[2] = "Smith";

    ```


    There are some quicker ways. You can add values to the array at the same time
    you create it. This is done as follows:


    ```php

    $name = array(key => value);

    ```


    As you can see, you can designate any number of items in the array at the same
    time by using different values and keys. We could do this with our $name as:


    ```php

    $name = array(1=>"Mesh", 2=>"John", 3=>"Smith");

    ```


    We now have an array that contains these names. To print out Mesh, for the value
    of $name[1], we would write:


    ```php

    echo $name[1];

    ```


    ## Predefined Variables


    A lot of the predefined variables that PHP deal with forms, like the ones we created
    in Chapter 3. When you use a form, submit it with method post or get. There are
    a few differences on these two, which we will go over in the next chapter, but
    when we use a form that submits, it transfers its data (such as a name) through
    a method of either post or get.


    When the page finishes submitting, it passes the data to the following page inside
    a predefined variable. It will use either $_GET or $_POST, depending on the method
    you used. To access the actual item, make the array''s key same as the name field
    of the form you want. This may sound a little complex, but it will make sense
    if I show you an example. Let''s create two pages: a page that asks for a name
    and a page that displays the name. Because the first page is only a form, it can
    be named form.html, while the second requires PHP and therefore needs the extension
    .php. We will make it php04-04.php. (By the way, I go into much depth on programs
    of this nature in the next chapter. This is simple to show how to access predefined
    array).


