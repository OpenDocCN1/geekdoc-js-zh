    \ method=\"get\">\n        Enter your first number: <input type=\"text\" name=\"\
    firstnumber\">\n        <br />Enter your second number: <input type=\"text\" name=\"\
    secondnumber\">\n        <br /> /><br /> /><input type=\"submit\">\n    </form>\n\
    </body>\n</html>\n```\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_115_0.png)\n\
