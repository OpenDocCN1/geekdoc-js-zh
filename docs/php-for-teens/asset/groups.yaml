    \ it by creating a cookie with the same name that expires in the past (time()-1).\
    \ The cookie is automatically deleted by the web browser.\n\nThe last step is\
    \ to create the cookie:\n\n```php\n//Whether or not the cookie was set earlier,\
    \ set this cookie.\nsetcookie(\"name\", $cookievalue, time() + 60 * 60 * 24 *\
    \ 12);\n```\n\n```php\necho \"Cookie has been set, please visit\n<a href=\\\"\
    phpft12-01result.php\\\">phpft12-01result.php</a> to see the result.\";\n?>\n\
    ```\n\n## Putting a Cookie in Your Site\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_199_0.png)\n\
    \nWarning: Not modify header information - headers already sent by (output started\
    \ at /home/manosh/public_html/PHP for teens/Chap12/Source/phpft12-01.php:12) in\
    \ /home/maneesesh/public_html/PHP for teens/Chap12/Source/phpft12-01.php on line\
    \ 30\nCookie has been set, please visit phpft12-result.php to see the result.\n\
    \n**Figure 12.2**\nAn error with the phpft12-02.php file.\n\nWe set the cookie\
    \ to last 12 days by giving it an extra time of time() + 60 * 60 * 24 * 12, and\
    \ we set the value to the name that was submitted on the form. Remember that you\
    \ are creating stored bits of data that existed for a set amount of time, the\
    \ amount of time we use for the cookies is the cookie will exist.\n\nNow, we put\
    \ this in the web document after the `<body>` tag, and the script should execute\
    \ flawlessly, right? Check out what happens when we do this by looking at Figure\
    \ 12.2.\n\nUh oh. We got an error! What happened? When creating cookies, you have\
    \ to put the cookie before any HTML tag. Cookies are part of a special part of\
    \ the document which is dealt with before the `<html>` tag. You need to set them\
    \ before even the opening `<html>` tag. If you have any `<!DOCTYPE>` or `<meta>`\
    \ tags, the cookie must go before these, also. This means that you cannot create\
    \ a cookie after any executed `echo` statement in your program.\n\nBy rearranging\
    \ the document so it looks like the following, we can get a better result:\n\n\
    ```php\n<?php\n$cookievalue = $_POST['name'];\n// if cookievalue is blank, end\
    \ the page\nif ($cookievalue == '') {\n    echo \"You did not submit a cookie\
    \ value. Please go back to\n<a href=\\\"phpft12-01.html\\\">phpft12-01.html</a>\
    \ and correct this error.\";\n    exit;\n}\n//If the cookie has been set recently\n\
    if (isset($_COOKIE['name'])) {\n    unset($_COOKIE['name']);\n}\n\n// Whether\
    \ or not the cookie was set earlier, set this cookie.\nsetcookie(\"name\", $cookievalue,\
    \ time() + 60 * 60 * 24 * 12);\n\necho \"Cookie has been set, please visit <a\
    \ href=\\\"phpft12-01result.php\\\">phpft12-01result.php</a> to see the result.\"\
    ;\n?>\n```\n\n```html\n<html>\n<head>\n<title>Creating the cookie</title>\n</head>\n\
    \n<body>\n\n</body>\n</html>\n```\n\nWe moved the PHP code above the <html> section.\
    \ Notice that the body is empty. This doesn't matter: The cookie will still set\
    \ and everything will work. Figure 12.3 shows the result.\n\nNow all we have to\
