    ## 构建你的第一个 PHP 程序：设置 HTML


    PHP 在带有表单的网站上非常常见。你见过带有表单的网站。它们是网页中看起来像图 3.1 的部分。在本章中，我将向你展示设计表单的基础知识。在 PHP 编程中，你会经常使用表单，因此尽可能多了解它们是非常重要的。


    这些家伙是互联网业务的基础组件：一种用户向网站发送回信息的简单方法。而且它们不仅限于接受文字。很多时候，网站允许你参加测验或需要你从复选框（checkbox）和单选按钮（radio
    buttons）中选择，某些网站甚至允许你上传文件。所有这些都是通过表单完成的。


    让我们看看 PHP 能做什么。只需要一行 PHP 代码，我就可以让网页从图 3.1 变成图 3.2。很酷，对吧？使用 PHP，我可以让网页反映出用户输入的内容。


    那么我是怎么做到的？我设计了一个基础网页。我将在本章的剩余部分中向你快速回顾如何构建页面。如果你想学习更多关于网页设计的知识，请查看我的另一本书《青少年网页设计》（Web
    Design For Teens）。


