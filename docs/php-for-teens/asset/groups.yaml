    \n如你所见，名称最终会变成其所在数组的键（key）。\n\n### $value\n\n函数的第二个参数是 `$value`。如果你想让 cookie 有任何实际用途，你需要给它一个值。你以后可以引用\
    \ cookie，获取该值，并使用该值来影响你的网站。在章节开头的示例中，我们讨论过创建一个值为访问者名字的 cookie。我们将使用 `$value` 参数来存储该值。然后我们以后可以取回这个值，并用它在整个网站中引用访问者的名字。\n\
    \n### $expire\n\n`$expire` 是第一个复杂参数，因为它不是基本名称-值实体的一部分。相反，它指的是 cookie 保留在服务器上的时间（以秒为单位）。默认情况下，如果你留空\
    \ `$expire` 参数，cookie 将在访问者关闭浏览器时立即消失。通过设置 `$expire`，你可以让 cookie 持久更久。\n\n让 cookie\
    \ 以默认时间运行（直到浏览器关闭）在实践中很少用处。如果你正在设计一个记住用户名字的页面，让它只记住一个会话（session）的名字将是愚蠢的。使用 `$expire`\
    \ 属性允许 cookie 持续一段意义的时间。然而，在那些只想让 cookie 在当前浏览器使用期间持续的页面中，你可以不带 `$expire` 属性使用\
    \ cookie。\n\n要设置它，我们需要一个新的函数：`time()`。对于对技术感兴趣的人来说，此函数返回自纪元（epoch）以来的秒数（这是一个任意的时间点；大多数计算机使用\
    \ 1970 年 1 月 1 日作为纪元），但你只需要认为它返回的是当前时间。你将 `$expire` 设置为 `time()` 的值加上你希望函数过期的秒数。\n\
    \n让我们看看如何定义时间。我们需要函数在指定的几天或几周后过期。我们可以使用以下 `$expire` 代码：\n\n```php\n$expire = time()\
