    **Figure 9.5** phpft09-03.php.


    That we called the function with variables $first and $second, and the function
    used variables of the same name. This is not required. We can pass whatever parameters
    we want into the function, and the values that we pass are copied into the variable
    names of the function declaration. We could have chosen to simply pass $_GET[''first'']
    and $_GET[''second''] rather than ever turning them into the scalar variables
    $first and $second. We converted the $_GET variables because they a lot easier
    to handle without the bracketed array syntax and their names are more intuitive.


    The real strength of using functions comes from their portability. Because a function
    can be written so that it does not rely on any variables of the program, you can
    simply lift that function out of this script and use it on another. If you ever
    write another program that requires a counter, you can use this same function
    without modification. In fact, a lot of programmers take all of their commonly
    used functions and build a library file with them. Then,'
  - '[PAGE 156]


    # Chapter 9 = Functions


    whenever they need to perform a task, they simply load up the library file and
    call the already written function.


    Of course, not all functions are portable because of something called variable
    scope. When using variables, the program can only access a subset of the variables
    that are created. For example, if you have a $test_var in function DoA(), another
    function DoB() cannot access that $test_var unless the variable is passed as a
    parameter to DoB(). Some arrays that are defined by the language, such as $_GET
    and $_POST, are global to all functions. However, for functions you develop on
    your own, be careful to make sure you only access and use variables in scope.


    # For the mathematically minded


    If you look at the program we created, you can see its pretty ugly way to get
    a sum of all the numbers between arbitrary endpoints. We use a mechanism that
    actually loops through each value and adds it to a running counter. A few mathematical
    functions will produce the correct result without the ugly loops. But for very
    large sums, this program could take a while.


    To get the sum from this series, there is a cool mathematical formula: sum is
    how it appears: S(n) = n/2 * (a(1) + a(n)), where n is the total of numbers you
    want to add together, a(1) is the first number in the series, and a(n) is the
    final number in the series. If you want to find the sum of the first four members
    of the series we wrote, you would get this: S(4) = 4/2 * (1 + 7) = 16. If you
    use this formula in your running calculation, the answer will be achieved much
    more quickly.


    So what is the point? Just because a solution works doesn''t mean it is the fastest
    or best to do something. Sometimes things go much faster if you find a better
    algorithm.


    # Calling a Function Depending on a Condition


    Sometimes you need to call a function depending on a condition. In a program you
    don''t need to call all of them in every run, but we may need to call a few depending
    on the situation.


    One of the best examples is when you need to convert Celsius to Fahrenheit or
    vice versa: a degree-conversion calculator. The first thing to do is design the
    HTML page. This is going to be complex because it gives the user lots of options
