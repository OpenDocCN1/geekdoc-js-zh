    type, and it tells the PHP server that the form is going to send something else
    than regular text and field data. Instead, it sends a data file called form-data.


    # input


    Another weird is the first input inside the form, with type being set to hidden.
    This input parameter defines the file''s maximum size. Right now, it is set to
    30,000 bytes. You can adjust this to any value you like by altering the value
    parameter. Just make sure the name of this input field is MAX_FILE_SIZE.


    It is important you use MAX_FILE_SIZE. It prevents any uploaded file from being
    over the specified size. Someone can try to upload gigantic files that can use
    up your file space or bandwidth. If someone has malicious intent, he can use file-uploading
    forms in what is called a denial-of-service (DoS) attack.


