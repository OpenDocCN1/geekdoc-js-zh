    \n- if... then 决策\n- 循环，允许重复执行某些代码\n- 函数，将专门的代码放在单独的区域中\n\n当你运行程序时，你期望它从开始运行到结束。通常，程序会显示代码中的所有内容，一个接一个显示每个部分。当你编写\
    \ HTML 页面时，页面的每个部分显示顺序与其源代码定义的顺序相同。然而，你可能需要改变这种流程。由于某些特殊事件的发生，你可能需要执行不同的操作。PHP\
    \ 提供了一种通过分支结构来实现这种操作的方法。\n\n### if\n\n最简单的方法是使用 if 分支结构。基本骨架如下：\n\n```\nif (condition\
    \ is true)\n{\n    //execute statements\n}\n```\n\n你显然需要将比较替换为 `< condition` 测试。比较测试是使用比较运算符完成的，例如\
    \ <, >, != 等。请参阅第 5 章以了解比较方法。\n\n我们将创建一个页面，允许用户输入两个数字，并使用 PHP 比较这两个数字并说明哪一个更大。首先，让我们看看实现此表单。我们将使用\
    \ GET 提交方法。\n\n```html\n<html>\n<head>\n    <title>比较两个数字</title>\n</head>\n<body>\n\
    \    <form name=\"compare\" action=\"php07-01.php\" method=\"get\">\n        输入你的第一个数字：<input\
    \ type=\"text\" name=\"firstnumber\">\n        <br />输入你的第二个数字：<input type=\"\
    text\" name=\"secondnumber\">\n        <br /> /><br /> /><input type=\"submit\"\
    >\n    </form>\n</body>\n</html>\n```\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_115_0.png)\n\
    \n**图 7.1** php07-01.html 表单文件。\n\n该页面最终看起来就像图 7.1。我在打开页面后在文本框中输入了数字。\n\n现在来看这个\
    \ PHP 页面：\n\n```html\n<html>\n<head>\n    <title>两个数字的比较</title>\n</head>\n<body>\n\
    <?php\n$a = $_GET['firstnumber'];\n$b = $_GET['secondnumber'];\n\necho \"Your\
    \ first number was $a.\";\necho \"<br>Your second number was $b.\";\n```\n\n```php\n\
    echo \"<p>\";\nif ($a > $b)\n    echo \"Your first number ($a) is greater than\
    \ your second number ($b).\";\n\nif ($a < $b)\n    echo \"Your second number ($b)\
    \ is greater than your first number ($a).\";\n?>\n</body>\n</html>\n```\n\n你看到这个页面是如何运作的了吗？图\
    \ 7.2 显示了它的样子![](img/fb76427b4bed9367f4a8810f090a7a37_116_0.png)\n\n### 图 7.2\
    \ php07-01.php 结果文件。\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_117_0.png)\n\n\
    **图 7.3** 数值相等的表单。\n\n两个 if 语句共同工作，以确定第一个数字是否大于第二个数字或反之。如果第一个大，则输出它；如果第二个大于第一个，则输出正确的结果。然而，如果数字相等会发生什么？请查看图\
    \ 7.3 所示。如果数字相等，什么都不会发生！我们没有设置程序在发生这种情况时执行任何操作。我们显然需要修复此问题。\n\n### else\n\n让我向你展示一种与你已经熟悉的结构配合工作的新控制结构：else。当你将\
    \ if 结构与 else 结构结合起来时，这两个语句中的其中一个将被执行。如果比较测试为真，则执行 if 语句；如果测试为假，则执行 else 语句。\n\
    \n看看一个通用的 else 结构：\n\n```\nif (comparison is true)\n{\n    //execute statements\n\
