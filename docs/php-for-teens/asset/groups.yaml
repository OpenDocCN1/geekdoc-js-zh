    ```

    <head>

    <title>A Sample Form</title>

    </head>


    <body>

    <h1>A Sample Form</h1>


    <form action="" method="post">

    <p>Name:<input type="text" name="fullname" />

    Address:<input type="text" name="address" /></p>

    <p>Comments:<textarea name="comments" cols="40" rows="2"></textarea></p>

    <p><input type="submit" name="submitbutton" />

    <input type="reset" name="resetbutton" />

    </form>

    </body>

    </html>

    ```


    # Chapter 3 = Building Your First PHP Program: Setting Up the HTML


    How does the form know to page to send the data? It is defined in the action attribute
    of the <form> tag. Look at our <form> tag as it stands:


    ```

    <form name="sampleform" method="post">

    ...

    </form>

    ```


    We need to use an action attribute inside the <form> tag to tell the web where
    to send the data. Assigning the action attribute to be blank makes the page send
    its data to itself, so the page itself can operate on it. However, this is not
    useful unless the page is a PHP document. You do this in the next chapter.


