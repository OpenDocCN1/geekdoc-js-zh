    # 附录 A


    # 函数列表


    本附录列出了书中所有函数的描述和声明。声明描述如下：


    ```

    return FunctionName(varType variable1, varType variable2, . . .)

    ```


    所有函数都遵循此模式。如果函数不返回任何内容，则返回类型为 void。如果参数是可选的，则在参数周围加上括号。


    | 表格 A.1 函数 | | | |

    | --- | --- | --- | --- |

    | basename() | 返回文件名字符串的路径部分。 | string basename(string $fullname) |

    | copy() | 将一个文件的内容复制到另一个文件中。 | bool copy(string $source_filename, string $destination_filename)
    |

    | define() | 接收一个常量名和一个常量值并在程序中定义该常量。 | void define(string $constantName, int
    currentValue); |


    # 附录 A 续


    表格 A.1 续

    | 名称 | 描述 | 代码 |

    | :--- | :--- | :--- |

    | echo | 虽然这不是一个函数（它是一个语言结构），但它的作用类似于函数。向页面输出指定的文本或变量。 | void echo (string $1,
    . . .) |

    | exit | 虽然这不是一个函数（它是一个语言结构），但它的作用类似于函数。导致 PHP 页面立即停止脚本执行。页面上不再执行后续的 PHP 命令。 |
    void exit (string/int $status); |

    | fclose() | 关闭文件。 | void fclose(resource $handle); |

    | filesize() | 返回以字节为单位的文件大小。 | int filesize(string $filename); |

    | fopen() | 打开文件并返回其句柄。 | resource fopen(string $filename, string $mode) |

    | fread() | 返回包含所选文件所有内容的字符串。 | string fread(resource $handle, int $sizeInBytes);
    |

    | fwrite() | 将字符串写入已打开的文件。 | bool fwrite(resource $handle, string $text); |

    | gettype() | 返回输入变量的类型。 | string gettype(anytype $variable); |

    | header() | 允许你修改文档的头部。使用 Location: 属性更改网页 URL。 | void header(string $new); |

    | isset() | 确认变量是否已创建。如果存在则返回 true，否则返回 false。 | bool isset(anytype $variable);
    |

    | mail() | 让你的 Web 服务器发送消息。 | bool mail(string $to, string $subject, string [$additionalheaders],
    string [$additionalparameters]) |

    | move_uploaded_file() | 将文件从临时位置移动到服务器上的最终位置。 | bool move_uploaded_file(string
    $source, string $destination); |

    | nl2br() | 接收一个字符串作为参数并将换行符转换为 <br /> 标签。允许在浏览器中正确显示字符串。 | string nl2br(string
    $text); |

    | rename() | 重命名文件。 | bool rename(string $old_filename, string $new_filename);
    |


    # 表格 A.1 结束


    | 名称 | 描述 | 代码 |

    | :--- | :--- | :--- |

    | session_name() | 允许你为会话分配一个名称。包含一个更改名称的字符串参数。如果留空参数，则返回当前会话名称。 | string session_name
    ([string $name]); |

    | session_start() | 启动或继续会话。此函数必须放置在任何输出的 HTML 或文本之前。 | void session_start(void);
    |

    | setcookie() | 在 Web 服务器上设置 cookie，允许你存储用户数据。 | bool setcookie(string, $name,
    [string $value, int $expire, string $path, string $domain, bool $secure); |

    | stripslashes() | 返回一个删除所有反斜斜的字符串。 | string stripslashes(string $originalString);
    |

    | strval() | 接收一个非字符串作为参数并将输入作为字符串值返回。 | string strval(int $non); |

    | time() | 返回自 Unix 时间（当前时间）以来的秒数。 | int time(void); |

    | unlink() | 删除文件。 | bool unlink(string $filename) |

    | unset() | 根据你传递的变量，删除数组的某个元素或整个数组。 | void unset(anytype $elementOrArray); |


    # 附录 B


    # 在线资源


    读完这本书后，可以查看其他网站以学习更多 PHP 知识。以下是一些建议：


