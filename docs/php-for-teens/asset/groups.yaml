- md: "\nThis page initially tests to see if the second number is larger than the\
    \ first. If this is true, it creates a for loop that counts through all of the\
    \ numbers and displays them, one after another. If this is false, it simply echoes\
    \ out an error statement. Figure 7.10 shows what this page looks like with the\
    \ first value being 4 and the second being 16.\n\n# do . .while\n\nThe do .while\
    \ loop is almost identical to the regular while loop except for one thing: This\
    \ while loop always executes at least once—even if the condition is false. Let's\
    \ look at the structure:\n\n```\ndo\n{\n//execute statements\n} while (condition\
    \ is true);\n```\n\nFor example, if we were using while, what would happen if\
    \ we wrote the following code?\n\n```php\n$x = 10;\nwhile($x < 10)\n{\n  echo\
    \ $x;\n}\n```\n\nThis will obviously do nothing, because $x starts off at 10.\
    \ The while condition is never true and the echo statements never execute. What\
    \ if we use a do...while loop, however?\n\n```php\n$x = 10;\ndo\n{\n  echo $x;\n\
    } while ($x < 10);\n```\n\nThis code would simply display a counter from 1 to\
    \ 10.\n\n> foreach is a specialized type of loop that only works with arrays,\
    \ so I go over it in Chapter 10.\n\n# break and continue\n\nThere are two rare\
    \ commands that deal with loops: break and continue. You might remember break\
    \ from the switch statement: When using it, the switch command finished and exited.\
    \ The same thing happens within loops. break causes a loop to break out of the\
    \ loop immediately. continue, on the other hand, immediately forces the loop to\
    \ go back to the top and execute from the beginning, skipping the rest of the\
    \ loop for that individual iteration.\n\n# CHAPTER 8\n\n# STRINGS\n\nStrings are\
    \ a data type, like integers or floating-point values, except they do not deal\
    \ with numbers. Instead, they deal with characters and words. An example of a\
    \ very basic string is a. A more complex string might be Hello, World, while a\
    \ very complex string might have symbols in it that aren't even letters. They\
    \ also can contain numbers. You might want to create a string that looks something\
    \ like this: My house has 2 stories and 5 bedrooms.. Strings allow you to store\
    \ numbers as characters inside your strings, but strings with numbers inside them\
    \ are not the same as integers. Combining two strings gives you a result that\
    \ is not the same as adding two numbers, so \"10++14\" does not equal 24, 10+14\
    \ will. Be aware of the quotation marks around strings.\n\nPHP, unlike other languages,\
    \ has no length limit on strings. You can make them as long or as short as you\
    \ like. This is great for when you want to turn an entire web page's source or\
    \ a very long piece of text into a string.\n\n## Making Strings\n\nThere are few\
    \ methods of creating a string, and these methods are known as different methods\
    \ of syntax:\n\n- Single quoted\n- Double quoted\n- Heredoc\n\nIf you want to\
    \ display a variable, you use the $ symbol. If you want to display a string, you\
    \ use quotation marks. However, there are two forms of quotation marks: single\
    \ and double. Both do different things, so let's go over one at a time.\n\n# Note\n\
    \n> I skip heredoc syntax because it is rather difficult to use. If you are interested\
    \ in it, go to www.php.net or www.maneeshsethi.com.\n\n# Single-Quoted Syntax\n\
    \nSingle quotation marks look like one apostrophe that appears before the string\
    \ and another at the end. For example, your string might look like this:\n\n'Hello,\
    \ I am a string!'\n\nAs you can see, these quotation marks designate the endpoints\
    \ of a string. You can also create a variable that holds the string:\n\n$stringvar\
    \ = 'Hello, I am a string!'\n\nDisplaying a string is just as easy as: simply\
    \ use the echo function:\n\n```php\necho 'Hello, I am a string!';\n```\n\nOr,\
    \ if you already created it as a variable, you can do this:\n\n```php\necho $stringvar;\n\
    ```\n\nOne of the cool things you can do with single-quoted strings is embed new\
    \ lines directly into the string. The new lines appear directly as you want them\
    \ to.\n\n```php\necho 'Hello, I am a string.\nYou can see several new lines within\
    \ me.\nAren't you cool';\n```\n\nAs you can see here, we are echoing these new\
    \ lines within the middle of the string. We can set it up to deal with variables,\
    \ also:\n\n```php\n$stringvar = 'Hello, I am a string.\nYou can see several new\
    \ lines within me.\nAren't they cool?';\n\necho $stringvar;\n```\n\nPretty cool,\
    \ huh? See what this looks like on the web page in Figure 8.1. Uh oh! I removed\
    \ them all and simply wrote a statement. Why is the web page not displaying the\
    \ new lines correctly? Let's check out the source in Figure 8.2 to see what it\
    \ looks like. Well looks better, huh? All of the new lines are there as planned,\
    \ but for some reason, the web page comes out with all of the new lines gone.\
    \ This occurs because HTML does not deal with white space; instead, the source\
    \ automatically removes it all. There are a couple ways to fix this problem. The\
    \ first way is to use <br> tags and manually put them into the code. Check out\
    \ how that would look:\n\n```php\n$stringvar = 'Hello, I am a string.\nYou can\
    \ see several new lines within me.\nAren't they cool?';\n```\n\n```php\necho $stringvar;\n\
    ```\n\nSure, this works, but it is a little tough to use. It's annoying to have\
    \ to enter <br> every single time you need a new line! Unfortunately, PHP offers\
    \ another way to get around this problem: a function called nl2br(). Look at the\
    \ function name and see if you can figure out what it means—that is right, it\
    \ converts new lines to <br> tags.\n\n# Making Strings\n\nWhat does this mean?\
    \ You can echo directly out your string and it will display the new lines as intended!\
    \ For example, doing something like the following displays text exactly how we\
    \ want it:\n\n```php\necho 'Hello\nlines.';\n```\n\nLet's try adding this to our\
    \ web page:\n\n```php\n$stringvar = 'Hello, I am a string.\nYou can see several\
    \ new lines within me.\nAren't they cool?';\n```\n\n```php\necho nl2br($stringvar);\n\
    ```\n\nFigure 8.3 shows what this ends up looking like the web page—working just\
    \ as we wanted to, with all the new lines showing perfectly. Let's even take a\
    \ look at source in Figure 8.4.\n\nNot bad at all, eh? Now look closely at the\
    \ document we just created. Sure, it has new lines working fine, but there is\
    \ one small error. This is one of the lines:\n\n```php\nlines within me. Aren't\
    \ they\n```\n\nThis is what it should be instead:\n\n```php\nlines within me.\
    \ Aren't they\n```\n\nUh oh! Why did that question mark appear? I copied and pasted\
    \ the word aren't from a word processor. A lot of word processors make text pretty\
    \ by curving the apostrophes, so instead of making a single quote straight ('),\
    \ you get one that is curved (’). This is a great effect when writing documents,\
    \ but in PHP, both the straight and the curved single quotes (also called apostrophes)\
    \ are recognized as different characters. This error can occur whenever you have\
    \ quotes anywhere in your page. Make sure don't copy from a word processor!\n\n\
    In fact, the curved quote mark is not recognized as a valid character in PHP.\
    \ When the PHP document gets to this quotation mark, it displays a question. So\
    \ what would have happened if I had not used a curved quotation mark, but rather\
    \ a straight one? It would have been worse. PHP would have seen this mark and\
    \ assumed it was designating the end of the string. Then, it would have seen the\
    \ words after the string and unsuccessfully tried to interpret it. So, instead,\
    \ it would have given the following error:\n\nParse error: syntax error, unexpected\
    \ T_STRING in file.php on line 5\n\nThis is obviously much worse. There must be\
    \ a way to display apostrophes within a PHP document, right? Of course there is.\
    \ PHP offers an escape sequence. Most sequences are used in double-quote syntax,\
    \ but the apostrophe escape sequence is used in single-quote syntax. An escape\
    \ sequence is a single character that tells PHP that the following character is\
    \ to be displayed in a special way. In this case, the escape character is the\
    \ backslash \\. When you want to use apostrophes in your document, use \\'. Let's\
    \ add to what we have created. This is our final page, and you can find it on\
    \ the CD as phpht08-01.php.\n"
  mdcn: "\n[content]\n此页面首先测试第二个数字是否大于第一个数字。如果是真的，它将创建一个 `for` 循环，遍历所有数字并一个接一个显示它们。如果为假，它将简单地输出一条错误语句。图\
    \ 7.10 显示了当第一个值为 4，第二个值为 16 时页面的外观。\n\n# do .while\n\n`do .while` 循环与普通的 `while`\
    \ 循环几乎相同，唯一的区别在于：这个 `while` 循环至少会执行一次——即使条件为假也是如此。让我们来看结构：\n\n```\ndo\n{\n//execute\
    \ statements\n} while (condition is true);\n```\n\n例如，如果我们使用 `while`，如果写了以下代码会发生什么？\n\
    \n```php\n$x = 10;\nwhile($x < 10)\n{\n  echo $x;\n}\n```\n\n这显然什么都不会做，因为 $x 的初始值是\
    \ 10。`while` 条件永远为真，`echo` 语句永远不会执行。但是，如果我们使用 `do...while` 循环呢？\n\n```php\n$x\
    \ = 10;\ndo\n{\n  echo $x;\n} while ($x < 10);\n```\n\n这段代码将简单地显示从 1 到 10 的计数器。\n\
    \n> foreach 是一种特殊的循环类型，仅适用于数组，因此我将在第 10 章中介绍它。\n\n# break and continue\n\n有两个处理循环的罕用命令：`break`\
    \ 和 `continue`。你可能还记得 `switch` 语句中的 `break`：当使用它时，`switch` 命令就会完成并退出。循环内部也会发生相同的情况。`break`\
    \ 会导致循环立即跳出循环。另一方面，`continue` 会立即强制循环回到顶部并从开始执行，跳过该次迭代的循环剩余部分。\n\n# 第 8 章\n\n\
    # 字符串 (STRINGS)\n\n字符串是一种数据类型，类似于整数或浮点值，不同之处在于它们不处理数字。相反，它们处理的是字符和单词。一个非常基本的字符串示例是\
    \ `a`。更复杂的字符串可能是 `Hello, World`，而非常复杂的字符串可能包含不是字母的符号。它们也可以包含数字。你可能想创建一个类似这样的字符串：`My\
    \ house has 2 stories and 5 bedrooms.`。字符串允许你将数字作为字符存储在字符串内部，但包含数字的字符串与整数并不相同。合并两个字符串得到的结果与两个数字相加的结果，因此\
    \ `\"10++14\"` 不等于 24，而 `10+14` 会。请注意字符串周围的引号。\n\nPHP 与其他语言不同，对字符串没有长度限制。你可以根据喜意让它们变得很长或很短。当你想要将整个网页的源代码或一段非常长的文本转换为字符串时，这非常有用。\n\
    \n## 创建字符串\n\n创建字符串的方法很少，这些方法被称为不同的语法方法：\n\n-   单引号\n-   双引号\n-   Heredoc（在此文档字符串）\n\
    \n如果你想显示一个变量，使用 `$` 符号。如果你想显示一个字符串，则使用引号。然而，引号有两种形式：单引号和双引号。两者的作用不同，所以让我们一个一个来看吧。\n\
    \n# 注意事项\n\n> 我跳过了 `heredoc` 语法，因为它相当难用。如果你对此感兴趣，请访问 www.php.net 或 www.maneeshsethi.com。\n\
    \n# 单引号语法\n\n单引号看起来像出现在字符串前面的一个撇号和一个结尾处的另一个撇号。例如，你的字符串可能像这样：\n\n'Hello, I am a\
    \ string!'\n\n如你所见，这些引号指定了字符串的端点。你也可以创建一个持有字符串的变量：\n\n$stringvar = 'Hello, I am\
    \ a string!'\n\n显示字符串也是一样的：\n\necho 'Hello, I am a string!'\n\n单，显示显示字符串字符串\n\n\
    \n\n：\n\n```string\n = 'Hello, I am a string!'\n```\n\n显示你string，，，，，字符串，，，创建一个字符串的字符串的变量，这样做：\n\
    \n```php\n$stringvar = 'Hello, I am a string!'\n```\n\n正如你所，，，显示这样做：\n\n```php\n\
    echo 'Hello, I am a string!'\n```\n\n或者，如果你已经使用了变量，可以这样做：\n\n```php\necho $stringvar;\n\
