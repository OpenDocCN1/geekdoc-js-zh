    ## CHAPTER 11


    ## ADVANCED FORMS


    We''ve been using forms in almost every chapter so far in this book, and now it
    is time to learn more about what they can do. We have only been using basic forms
    so far, as those with textboxes and a submit button or a selection box. In this
    chapter we take a closer look at web forms and see how PHP can make them strong.
    I start by discussing some more-advanced HTML form elements, and then discuss
    the ways to use the forms in PHP to make your pages more robust.


    ## Advanced Elements


    Get ready—I go over a lot of different form elements in this chapter.


    ### Radio Buttons


    Radio buttons are organized into groups: Only one in a group of radio buttons
    can be selected. Use the `<input>` tag with the type set to radio (the same way
    that you do with a checkbox). However, you need to add one more parameter in addition
    to type and name: value. This parameter becomes the value of the `$_GET` or `$_POST`
    that you access through PHP. For items of the same group, all of their name parameters
    are identical. This becomes the key of the GET or POST array.


    It''s important to note that a key/value pair is only sent if at least one of
    the radio buttons is selected. For this reason, if you decide to not make one
    of the radio buttons checked by default, make sure that the array key is set.
    If you don''t test this, the user can simply skip the radio button section, creating
    an error when you try to access the radio button. You can ensure that at least
    one button is checked by using the $isset()` function.


    ![](img/fb76427b4bed9367f4a8810f090a7a37_178_0.png)


    Figure 11.1

    A sample set of radio buttons.


    You might want to create a page that asks the user where he lives. This can be
    done with a simple set of checkboxes, like the ones that are in Figure 11.1.


    As you can see in the figure, only one item is selected: the West (because I''m
    from California). If you click another, the West radio button clears and the other
    is selected. Let''s look at the HTML code that makes this page possible:


    ```html

    <body>


    Please enter your location


    <form action="something.php" method="post">

    <br /><input type="radio" name="location" value="west">The West

    <br /><input type="radio" name="location" value="northwest">The Northwest

    <br /><input type="radio" name="location" value="southwest">The Southwest

    <br /><input type="radio" name="location" value="south">The South

    <br /> <input type="radio" name="location" value="northeast">The Northeast<br
    /> <input type="radio" name="location" value="east">The East<br /> <input type="radio"
    name="location" value="midwest">The Midwest<br /> <input type="radio" name="location"
    value="south">The South


    <p><input type="submit"></p>

    </form>

    </body>

    ```


    Notice how all the buttons have the same name? That is because name defines which
    group they are. If you had changed half of them to have a different name, you
    could select two items, one from each group. Figure 11.2 shows how this would
    happen if I had changed this into two groups. As you can see, two buttons have
    been selected. That is because the items have a different value for name. In Figure
    11.2, all I did was change the name of the second group.


    ![](img/fb76427b4bed9367f4a8810f090a7a37_179_0.png)


    **Figure 11.2**

    Splitting the radio buttons into two groups.


    ### Password Fields


    A password field is very simple. It looks identical to a textbox, except that
    the characters are coded, or hidden, from view. They look like asterisks or dots,
    depending on your browser. A password box is most commonly used when you want
    the user to be able to log into your site and is often used in conjunction with
    a username field. When typing in a password box, you get a result that looks like
    Figure 11.3. The code for this page follows.


    ```html

    <body>


    Please enter in your username and password to log in.

    <form action="something.php" method="post">

    <p>Username:<input type="text" name="username"></p>

    <p>Password:<input type="password" name="password"></p>

    <p><input type="submit"></p>

    </form>

    </body>

    ```


    ![](img/fb76427b4bed9367f4a8810f090a7a37_180_0.png)


    **Figure 11.3**

    A password field.


    ### Hidden Fields


    A hidden field is a type of input that is not visible to the user. It is used
    to send data to the server that the user does not need to see or edit, such as
    session IDs or security tokens. To create a hidden field, use the `type="hidden"`
    attribute.


    ```html

    <input type="hidden" name="user_id" value="123">

    ```

    '
