    ## .htm or .html Extension


    By default, some of the pure HTML documents have the extension .htm or .html.
    However, this is not always the case. Some .php, .xml, .shtml, .cgi, or others.
    The web server (in our case, Apache, which you installed in Chapter 1) chooses
    what actions to take based upon the file extension. Remember when you added the
    following lines to the httpd.conf file during installation of PHP:


    ```

    LoadModule php5_module "c:/php/php5apache2.dll"

    AddType application/x-httpd-php .php

    ```


    ```

    # configure the path to php.ini

    PHPIniDir "C:/php/"

    ```


    The first line (LoadModule) tells Apache to load the instructions to deal with
    any .php file, and the second line tells Apache to use PHP to handle any files
    with the .php extension. Figure 2.1 shows what these lines look like within httpd.conf.


    ![](img/fb76427b4bed9367f4a8810f090a7a37_34_0.png)


    Figure 2.1 The httpd.conf file.


    ## ASCII Format


    If you can open the file in a text editor and you see text, rather than gibberish,
    then you have an ASCII file. ASCII files are made up only of letters, numbers,
    and punctuation, rather than the binary bits used for executable files. When you
    create an HTML file in a pure text editor such as Notepad, the file is always
    in ASCII format. However, if you use a word processor such as Microsoft Word,
    the program introduces some weird, non-ASCII information. For this reason, never
    use any word processor to create HTML files.


    ## Common Tags


    Tags are a major part of creating and designing an HTML document. Every file has
    tags necessary for the page to be viewed in the web browser. Let’s look at the
    structure of a blank document for the purposes of seeing the HTML structure:


    ### What is DOYPE?


    All browsers interpret code a little differently. To help programmers write code
    that displays consistently in all browsers, and to create a standard way of writing
    code, the World Web Consortium was created.


    To identify your code as conforming to these standards, you use a very scary-looking
    but being DOYPE declaration. It has only a few variations, and they are readily
    available to cut and paste into your code—especially since you only use it once
    per document. Let’s look at a sample declaration:


    ```

    <!DOCTYPE html PUBLIC "-//W3//DTD XHTML 1.0 Strict//EN"

    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">

    ```


    This lets the browser know part: This lets the browser know that the code conforms
    to XHTML 1.0 Strict standards: PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN". (There
    are many versions. This version makes your page the most consistent across all
    browsers.)


    The next part tells the browser where to find these standards: "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd".


    If you don’t declare a DOYPE, you are putting your code at the mercy of whatever
    conventions a browser decides it should use. Write one! There is no need to free
    it from memory, either. To see a full list, go to the W3C web site:


    ```

    http://www.w3.org/QA/2002/04/valid-dtd-list.html#DTD

    ```


    ```

    <html>

    <head>

    <title> </title>

    </head>

    <body>

    <p> </p>

    </body>

    </html>

    ```


    Figure 2.2 shows what this page looks like in a browser. As of right now, it''s
    completely blank. However, if you view the source shown in Figure 2.3, you see
    that the document has some substance. This file is phpft02-01.html and it is on
    the CD.


    ## Tag


    The first tag in the file is `<html>`, which tells the computer that the following
    text is HTML code and should be displayed as any HTML document would be.


    ![](img/fb76427b4bed9367f4a8810f090a7a37_36_0.png)


    **Figure 2.2** The phpft02-01.html file in a browser.


    ## Common Tags


    ![](img/fb76427b4bed9367f4a8810f090a7a37_37_0.png)


    Figure 2.3 Viewing the source.


    HTML tags follow a strict set of conventions. Each tag is surrounded by less-than
    and greater-than brackets: `<` and `>`. Some tags have a beginning (opening) and
    ending (closing); the opening tag is surrounded by brackets and the closing tag
    is surrounded by brackets and preceded by a forward slash (/).


    [Note: OCR text continuing...]


    The tags need to be properly nested, which results in the first tag opened being
    the last tag closed. In other words, when you open one tag, and then you open
    another tag within that first tag, the second tag you opened needs to be closed
    before closing the first tag. Let''s look at an example:


    ```

    <html>

    <head>

    </head>

    </html>

    ```


    Notice that the first tag opened, `<html>`, is the last tag closed.

