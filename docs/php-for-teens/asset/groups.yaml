    # Writing to Files


    Writing to files is almost as simple as loading and closing files. All you need
    another function: fwrite(). This naming scheme is getting pretty easy to figure
    out, huh? Take a look at the fwrite() declaration:


    ```

    fwrite($handle, $string)

    ```


    With this function, you can write whatever string you want to a file. Note that
    we are writing an ASCII file, which means that anything you write to the file
    is a string, which will be interpreted as a string when data is later read from
    the document. fwrite() only works if the $handle was opened for write or append,
    as discussed earlier in this chapter.


    So let''s create a web page that lets the user append text to the bottom of a
    file and close it. Let''s start off with the HTML form we need to create:


    ```

    <!DOCTYPE html "-//W3C//DTD HTML 1.0 Strict//EN"

    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">


    <html>

    <head>

    <title>Append Form</title>

    </head>


    <body>

    <form action="phpft14-02.php" method="POST" >


    <p>Enter text to append: <textarea name="appendedtext"></textarea>


    <br><input type="submit">

    </form>

    </body>


    </html>

    ```


    The text that you enter will be appended to the file phpft14-02.txt.'
- md: "\nCheck out how this looks in Figure 14.6.\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_244_0.png)\n\
    \n**Figure 14.6**\nThe phpft14-02.html appending form.\n\nNow for the appending\
    \ script, which, if working correctly, looks like Figure 14.7:\n\n```php\n<?\n\
    \n$text = $_POST['appendedtext'];\n$filename=\"phpft14-02.txt\";\n\n$handle =\
    \ fopen($filename, 'a');\n\n//if there is a problem with opening file, echo out\
    \ error\nif (!$handle)\n{\n    exit(\"Could not open file!\");\n}\n```\n\n# Writing\
    \ to Files\n\n```php\n//If there is an error with writing, echo out an error\n\
    if (!fwrite($handle,stripslashes($text)))\n{\n    exit(\"Could not write data!\"\
    );\n}\n\necho \"Congratulations! Data appended\";\n\nclose($handle);\n\n?>\n```\n\
    \n![](img/fb76427b4bed9367f4a8810f090a7a37_245_0.png)\n\n**Figure 14.7** phpht14-02.php\
    \ appending script.\n\nCheck out what happens to the text file. In this example,\
    \ my original document was C:\\test.txt. Originally, before running the script,\
    \ the file looked like the one in Figure 14.8. After running the script, look\
    \ at test.txt now, in Figure 14.9!\n\n# Chapter 14 ■ Working with Files\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_246_0.png)\n\
    \n**Figure 14.8** The original test.txt file.\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_246_1.png)\n\
    \n**Figure 14.9** The new and appended test.txt file.\n\n# Writing to Files\n\n\
    Cool, huh? But what's up with that slash in Let's Characters that require escape\
    \ sequences, such as the apostrophe, have a backslash before the character. Fortunately,\
    \ there is an easy way to fix this. PHP includes a cool function: stripslashes().\n\
    \n```php\nstripslashes($string)\n```\n\nThis function removes all the backslashes\
    \ from a string and returns the new string. If we wanted to add this to our document,\
    \ we would only need to change one line. We would change our fwrite() line from\
    \ this\n\n```php\nif (!fwrite($handle,$text))\n```\n\nto this\n\n```php\nif (!fwrite($handle,stripslashes($text)))\n\
    ```\n\nAfter doing so, you can see what the new test.txt file would look like\
    \ in Figure 14.10. Small changes make big differences, huh?\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_247_0.png)\n\
    \nFigure 14.10\nUsing stripslashes().\n\n# Reading in Files\n\nReading in files\
    \ is almost the same as writing to files—just the opposite. When we were writing\
    \ to files earlier, we passed a string as a parameter that contained the data\
    \ in the file. When we read files, the reading function returns a string that\
    \ we can manipulate for our purposes.\n\n## fread()\n\nSo what is the reading\
    \ function, then? If you've been paying attention you can probably guess the name:\
    \ fread(). Take a look at the function declaration:\n\n```php\nfread($handle,\
    \ $lengthInBytes)\n```\n\nBoth of these parameters are required. The first parameter\
    \ is the handle to the file we retrieved by using fopen(). The second parameter\
    \ is the number of bytes you wish to retrieve. fread() only works for pages.\n\
    \nThis sounds all well and good if you know the amount of data you need to retrieve,\
    \ but if you don't? What if you want to retrieve the entire file? Unfortunately,\
    \ PHP gives you a way to do this. PHP's filesize() function returns a file's size\
    \ in bytes. Look at the declaration:\n\n```php\nfilesize($filename)\n```\n\nPretty\
    \ cool, huh? If you want to read an entire file, you can do it as follows:\n\n\
    ```php\n$contents = fread($handle, filesize($filename));\n```\n\nThere are a couple\
    \ other functions you should know about. One is fgets(), which reads the file\
    \ until the carriage return, returning the current line. You can call this inside\
    \ a loop and display or act upon the entire contents of a file.\n\n## file()\n\
    \nAnother cool function is file(), which takes the entire file into an array requiring\
    \ an fopen() command! All you have to do is pass file() to the filename, and follows:\n\
    \n```php\n$entireFile = file(\"yourfile.txt\");\n```\n\nThis creates an array\
    \ of each line of the file. As an alternative, you can use a foreach loop and\
    \ act upon each line of the file.\n\nAfter running the line of code, the $contents\
    \ variable contains the entire contents of the $handle file. The contents are\
    \ in string format. You can do all of your operations upon the strings, as I explain\
    \ in Chapter 8.\n\nSo let's use all of this in a script. You know now how to make\
    \ the HTML document, but feel free to take a look at phpft14-03.html to see how\
    \ it looks. The page looks like the one in Figure 14.11.\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_249_0.png)\n\
    \n**Figure 14.11** The phpft14-03.html reading form.\n\nNow look at the PHP code\
    \ that makes the reading happen:\n\n```php\n<?\n$filename = \"test.txt\";\n\n\
    $handle = fopen($filename, 'r');\n\n//if there is a problem with opening file,\
    \ echo out error\nif (!$handle)\n{\n    exit(\"Could not open file!\");\n}\n\n\
    $contents = fread($handle, filesize($filename));\n\n//If there is an error with\
    \ writing, echo out an error\nif (!$contents) {\n  exit(\"Could not read data!\"\
    );\n}\n\necho $contents;\n\nfclose($handle);\n\n?>\n```\n\nWait, the main thing\
    \ is the fread() line:\n\n```php\n$contents = fread($handle, filesize($filename));\n\
    ```\n\nHere, we pass the $handle and the filesize of the file to the fread() function.\
    \ We put the result into the $contents variable. After this we check to see if\
    \ $contents is valid by running the following:\n\n```php\nif (!$contents) {\n\
    \  exit(\"Could not read data!\");\n}\n\n$contents is invalid if it is blank,\
    \ so we can check to see if it is valid by doing the above test. If the file is\
    \ blank, the program exits. Cool, huh? You can do whatever with the file, maybe\
    \ remove all of lines, search for specific substrings, or whatever you feel like!\n\
    \n# Renaming, Copying, and Deleting Files\n\nThere are only a few more functions\
    \ I want to go over before finishing this chapter. These three functions are commonly\
    \ used in situations, both on a computer and on web sites. They are simple to\
    \ use, and all return a Boolean value. If the function is successful, the function\
    \ returns true; if it is false, the function returns false.\n\n# Renaming, Copying,\
    \ and Deleting Files\n\nLet's look at them.\n\n## copy\n\nThe first function copies:\n\
    \n```php\ncopy($source_filename, $destination_filename)\n```\n\nWhen using the\
    \ copy function, the program knows that the source file needs to be opened for\
    \ reading and the destination file needs to be opened for writing. Because of\
    \ this, the function does not require that you pass in a handle of a file, just\
    \ the filename. The function actually saves you some work.\n\n## rename\n\nThe\
    \ second function renames:\n\n```php\nrename($old_filename, $new_filename);\n\
    ```\n\nOne cool thing to know about rename is that you can use it to move a file\
    \ across directories, as well. By renaming the file to have a different path,\
    \ you can move the file. For example, if the old filename is C:\\test.txt and\
    \ the new filename is D:\\test.txt, you move the file from the C:\\ directory\
    \ to D:\\test. Pretty nifty, huh?\n\n## unlink\n\nThe last function deletes files.\
    \ I bet you know what the function name is.\n\n```php\nunlink($filename)\n```\n\
    \nWeird, huh? PHP sometimes gives functions annoying names so even though most\
    \ people would expect this function to be delete(), it is entitled unlink(). These\
    \ functions are all simple to use, and all return a Boolean value. If the function\
    \ is successful, the function returns true, and if it is false, the function returns\
    \ false.\n\n# Summary\n\nThat's it. We are done. Nothing left to teach. Well,\
    \ except for the rest of PHP. But this book gave you a great introduction into\
    \ the topic. You can now design your own web site. You can have it interact with\
    \ files, interact with strings—whatever you want to do.\n\nYou started with a\
    \ quick primer on HTML to help refresh your memory. You then learned how to make\
    \ forms and how to use the variables within those forms. You then learned about\
    \ constants, operators, and expressions, which you used throughout the book. You\
    \ took a brief respite to learn about the style that is necessary to develop when\
    \ programming. After that, in Part II you learned about control structures and\
    \ loops. You even learned about dealing with strings, functions, and the hated\
    \ arrays. In Part III you learned about advanced forms, cookies, sessions, and\
    \ how to work with files. After all this learning, you can now design your dynamic\
    \ web site and make it whatever you want!\n\nPHP is the future of web sites. It\
    \ interfaces with databases, which enables you to store data in accessible formats.\
    \ A great next step is to learn how to use databases (MySQL is my favorite) and\
    \ see how to interface them with PHP. Everyone loves a well-designed database.\n\
    \nOther than that, I've exhausted what this book can teach. If you have any questions,\
    \ you can always email me at manesh@maneeshethi.com. You can visit my web site\
    \ at www.maneeshethi.com. You can visit my blog at www.lazymotion.com. You can\
    \ even visit my forums and talk to other people who have questions and answers\
    \ about PHP at www.maneeshethi.com/forum.\n\nPlease email me. I love to hear from\
    \ readers, and I take all comments to heart. If you are interested in my other\
    \ works check out my blog, and see Game Programming for Teens, Second Edition;\
    \ Web Design for Teens; and my soon-to-published *How to Succeed as a Lazy Student*.\
    \ You can find information about all these books at www.maneeshethi.com.\n\nThank\
    \ you so much for paying attention throughout this entire book. Good luck with\
    \ your web sites! Send me updates of your web pages, and if they are really good,\
    \ I might display them directly on www.maneeshethi.com!\n\nThe greatest trick\
    \ the devil ever pulled was convincing the world he didn't exist. And like that\
    \ . . . he's gone.” Manesh, signing out.\n"
