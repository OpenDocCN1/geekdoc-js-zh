    # FUNCTION LIST


    This appendix lists all of the descriptions and declarations of the functions
    in the book. The declaration is described as follows:


    ```

    return FunctionName(varType variable1, varType variable2, . . .)

    ```


    All of the functions follow this pattern. If the function returns nothing, the
    return type is void. If the parameter is optional, brackets are placed around
    the parameter.


    | Table A.1 Functions | | |

    | --- | --- | --- |

    | basename() | Returns the filename component of a filename string. | string basename(string
    $fullname) |

    | copy() | Copies the contents of one file to another. | bool copy(string $source_filename,
    string $destination_filename) |

    | define() | Takes in a constant name and a constant value and defines the constant
    in the program. | void define(string $constantName, int currentValue); |'
