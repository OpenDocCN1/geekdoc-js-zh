    # Chapter 13 = Sessions


    The tests begin by checking if the visitor entered test as both the username and
    the password (&& means and). If so, it begins by creating a new session variable
    name. We pass it as a session variable and then must write a function that changes
    the user''s location to a new page to deal with the information and the new variables.


    To change the user''s URL, we use header(). This function changes some sections
    of a document''s header. In our case, we want the user to visit a new page if
    he has logged in correctly. Therefore, we changed the header''s Location attribute.
    You might have noticed how complex the header variable is. In fact, if we want
    to send the user to an absolute web site, such as www.cnn.com, the header location
    makes a lot more sense. This is how we would send a user to cnn.com:


    ```

    header("Location: http://www.cnn.com");

    ```


    However, header() only works with absolute web sites—you cannot send the user
    to a relative path as webpage.html. You would have to send the user to http://localhost/new.html.
    Because you don''t always have an absolute location of a web page location, using
    an absolute header can be a real pain. Fortunately, several variables can create
    an absolute header out of a relative one.


    Take a look at the preceding code. We take http:// and append the variable $_SERVER[''HTTP_HOST'']
    to it. This variable is the beginning part of your domain, as seen in maneshthi.com
    or localhost. We then append a pretty complex section to rtrim(dirname($_SERVER[''PHP_SELF'']),
    ''\/''). We have seen the $_SERVER[''PHP_SELF''] variable before, which is the
    file''s identical location. The two functions that act upon it, rtrim() and dirname(),
    delete the location and return to the previous folder. For example, if we were
    passing http://localhost/~/user/php.html, using rtrim() and dirname() would result
    in ~user/php. We append ~user/php to the earlier section and get http://localhost/~user/php.
    The last step is to add the document we want the user to go to. Do this this by
    adding a / and the filename.


    All right! We redirected you to a new location. Our last step is to echo some
    text telling the user that we are redirecting his location:


    ```

    echo "Thank you for logging in test. You are being redirected to your account.";

    ```


    The header() function is very quick, and in most cases the user won''t even notice
    this text. However, if he has a particularly Internet connection, he may see this
    page. Figure 13.16 shows what this page looks like.'
