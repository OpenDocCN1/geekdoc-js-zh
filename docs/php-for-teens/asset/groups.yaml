    Add one last, optional, optional, thing to this form: a reset button. It allows
    the user to clear everything he has typed or selected. Creating a reset button
    is just as easy as creating a submit button. Use <input />> with the type set
    to reset. Give it a name, such as resetbutton, and click OK. You have created
    a form that looks like Figure 3.13.


    ```

    <input type="reset" name="resetbutton" />

    ```


    # Adding PHP


    We have created a full form. Only one problem—if you open this web browser and
    press Submit Query, nothing happens! This is where PHP comes in. Before adding
