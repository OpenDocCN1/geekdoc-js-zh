    ## Chapter 2 A Quick HTML Primer


    ![](img/fb76427b4bed9367f4a8810f090a7a37_46_0.png)


    **Figure 2.12**

    Comparing font sizes.


    Say you want to change font size. Well, you need to use the `<span></span>` tag
    with the `font-size` attribute. It would end up looking something like this:

    <span style="font-size: 18px">I am a line of text that is font size 18!</span>


    This changes the font to point size 18. Figure 2.12 compares two different font
    sizes.

    The code would look something like the following:


    ```

    <body>

    <p>I am regular text!</p>

    <p><span style="font-size: 18px;">I am am text with a size attribute of 18!</span></p>

    </body>

    ```


    You can change the font color by using `<span style="color;"></</span>`. The color
    can be RGB (Red, Green, and Blue) using the proper hexadecimal code or you can
    use any basic named color, such as white, red, green, blue, black, or orange.


    ## Common Tags


    ## Note


    For a list of many common hex codes, go to http://webmonkey.wired.com/webmonkey/reference/color_codes.


    ## I need to change the page background color.


    You can do this using the background-color: color style attribute within the <body
    style=""> If you want the background to be black, you can just use `<body style="background-color:
    black; color: white">. Keep in mind that setting the background color to black
    will cause your black text to essentially disappear. Make sure you change the
    font color of your text to "color: white" or something easily visible on black.


    To change the font face, you need to use the font-face style attribute. You can
    change the font-face face you wish to use within quotes in the font-face attribute.
    For example, writing the following would put text in Courier, assuming that the
    style is available on the user''s machine:


    ```

    <span style="font-face:courier">I am in courier!</span>

    ```


    ## Miscellaneous Useful Tags


    You will probably need to go to a new line of text without actually using a new
    paragraph. The <br /> will do this. The forward slash at the end of the tag lets
    the web browser know there is no closing tag.


    If you want to insert an image, you can use the <img> function. This function,
    when it uses the src attribute, will allow you to insert an image into your page.
    To add image.jpg, which is located in the same directory of the HTML file, you
    would do something like this:


    ```

    <img src="image.jpg" />

    ```


    Also, if you use the alt attribute, you can make the image bring up text whenever
    the user puts his mouse over the image. The alt tag refers to alternate, which
    can appear when the user turns off images in a browser. Make sure the alt text
    describes the image. You might do something like this:


    ```

    <img src="tree.jpg" alt="A picture of a tree" />

    ```


    This tag does not require a closing tag. Keep in mind the only types of images
    you can safely display are .bmp, .jpg, .gif, or .png.


    That type of HTML you will commonly use as links, which can help you navigate
    from one page or site to another. This is done with the <a href="...">


    <a>, where the href attribute refers to the referenced item’s location. This needs
    to be preceded with http:// if you are referencing an external site. This will
    look something like the following:


    ```

    <a href="http://www.somethinganexternalsite.com">Click here to view a page on
    an external site</a>

    ```


    Or you may want to link to a different page on your own site:


    ```

    <a href="page2.html">Click here to visit page 2</a>

    ```


    In the next chapter you learn about HTML forms, which are an important part of
    PHP. After that, you are actually going to start doing some real PHP.


    ## Note


    I did not go over every programming construct in this chapter. For example, I
    skipped tables. Tables are very important in HTML, but not so much in PHP. Because
    of this, I only teach tables if you absolutely need to use them later on in some
    examples in this book.


    ## CHAPTER 3


    ## BUILDING YOUR FIRST PHP PROGRAM: SETTING UP THE HTML


    PHP is very common on sites that have forms. You''ve seen web sites that have
    forms. They''re the parts of web pages that look like Figure 3.1. In this chapter
    I show you the basics of designing a form. You will be using forms a lot in PHP
    programming, so it''s important to know as much as you can about them.


    These guys are basic staples of Internet business: an easy way for the user to
    send information back to the web site. And they aren''t limited to just accepting
    words, either. A lot of times, a site allows you to take a quiz or something that
    requires you to select from checkboxes and radio buttons, and some sites even
    let you upload a file. All of these things are done through forms.


    Let''s take a look at what PHP can do. With just one line of PHP, I can make the
    web page turn from Figure 3.1 to Figure 3.2. Pretty cool, huh? Using PHP, I can
    make it so the web page reflects back what the user typed.


    So how did I do this? I designed a basic web page. I''m going to spend the rest
    of this chapter giving you a quick refresher on how to build pages. If you want
    to learn more about web design, check out my other book, Web Design For Teens.


    You can develop a web page couple of ways: through a basic text editor (such as
    Notepad) or through an HTML editor. Most HTML editors are known as


    ## Chapter 3 Building First PHP Program: Setting Up the HTML


    ![](img/fb76427b4bed9367f4a8810f090a7a37_50_0.png)


    Figure 3.1 A sample web form.


    WYSIWYG (pronounced wizwig), which stands for What You See What You Get. The editors
    try to show you the page how it will look on the web site. A non-WYSIWYG text
    editor, however, shows only the code behind the page—not what it looks on the
    screen.


    ## WYSIWYG


    You can get a WYSIWYG text editor from this book''s CD or from www.website.com.
    However, in this book you use a basic text editor.


    ## HTML Template


    The first thing you need to do is open a text editor. In Windows, choose Start,
    which is shown in Figure 3.3. Notepad opens in a new window that looks like Figure
    3.4. On a Mac, find any text editor you installed (such as TextEdit) and open
    it.


    ## Sample Form


    Hi there. You are from a cool book!


    ![](img/fb76427b4bed9367f4a8810f090a7a37_51_0.png)


    **Figure 3.2**

    A sample web form after adding PHP.


    ![](img/fb76427b4bed9367f4a8810f090a7a37_51_1.png)


    **Figure 3.3**

    Opening up Notepad through the Start menu.


    ## Chapter 3 Building Your First PHP Program: Setting Up the HTML


    ![](img/fb76427b4bed9367f4a8810f090a7a37_52_0.png)


    As you learned in Chapter 2, HTML is made up of tags. The complete template for
    a page looks like the following. Figure 3.5 shows what it looks after typing it
    into Notepad.


    ```

    <html>

    <head>

    <title>Insert title here</title>

    </head>

    <body>

    Insert body here

    </body>

    </html>

    ```


    The page title appears at the top of the browser, and the body appears in the
    actual page space. Figure 3.6 shows the page as typed in the web browser.


    ## HTML Form


    Now that you have seen the HTML template, let''s build an HTML form. Forms communicate
    data to PHP. Use the <form></form> tag to create a form. (Crazy, huh?) This tag
    surrounds all of the inputs, such as textboxes and submit buttons.


    ![](img/fb76427b4bed9367f4a8810f090a7a37_53_0.png)


    **Figure 3.5**

    Inputting the web page template into Notepad.


    ![](img/fb76427b4bed9367f4a8810f090a7a37_53_1.png)


    **Figure 3.6**

    Inputting the web-page template.


    ## Chapter 3 Building Your First PHP Program: Setting Up the HTML


    The actual <form> tag itself has several attributes, which are tag describers.
    Put attributes into an HTML tag like the following:


    ```

    <tagname attribute1="value" attribute2="value2">

    ```


    The important <form></form> attributes follow:


    - method explains the ways the data is transferred. I talk more about these methods
    in the next chapter.

    - action explains where the data is being sent. Generally, the data is sent to
    a separate PHP file, which operates on the data.


    Let’s define a form, leaving the action blank and setting the method to post.


    ```

    <html>

    <head>

    <title>A Sample Form</title>

    </head>

    <body>

    <h1>A Sample Form</h1>

    <br />

    <form action="" method="post">

    </form>

    </body>

    </html>

    ```


    You added some big text that says A Sample Form, which now looks like Figure 3.7.
    Now it’s time to add some form elements. How about two textboxes and a text area?


    ## What are textboxes and text areas?


    Textboxes and text areas are common HTML elements. They allow the user to type
    text directly into the form. However, both of these elements are very similar;
    for example, take a look at Figure 3.1: The elements after Name and Address are
    textboxes, and the element after Comments is a text area. What is the difference
    between these two? Textboxes allow only one line of text, which is not enough
    space to write something substantial. Generally, it is used for writing small
    bits of information such as names, passwords, or addresses. On the other hand,
    text areas can be scaled to any size, even as big as the browser itself! They
    are great for comments or stories.

