    # CHAPTER 13


    # SESSIONS


    As you learned in Chapter 12, cookies allow you to save a small file, on the user’s
    computer, that recorded some data in a variable. However, there are a few problems
    with saving data inside cookies for use in all your site’s pages:


    +   - Cookies are stored on the user’s computer. This means that the user can
    go into the cookie file and edit the text to change the results of a page.


    +   - Cookies are not super reliable. They can be turned off, deleted, and edited
    by hand, so you have to worry about what a knowledgeable user can do with cookies
    you create.


    +   - A lot of Internet viewers don’t like cookies, because they can track down
    visitors’ locations and use them for advertising purposes. In fact, a lot of people
    on the Internet have cookies for this reason, and they do not allow them altogether.


    Because of all these reasons, PHP created a completely new interface whenever
    you want to remember user data. This new interface is called a session. Sessions
    are very similar to cookies because they are another method of storing variables
    for use on a web site. However, there are several important differences between
    the two:


    +   - Sessions store the variables on the server. This means that the user cannot
    edit any of the data that his computer uses because he cannot access it. In other
    words, sessions are a lot safer than cookies overall.'
- md: '

    # Using Sessions


    - Sessions cannot have an expiration time: They always expire as soon as the browser
    closes. Because no file is saved to the user''s computer, the session variables
    simply lose their point of reference when the browser closes, and cannot be used
    anymore. Of course, you can find ways to get around this, but, in most cases ending
    the session immediately is better for both the server and the user.


    Sessions are a great way for implementing a username/password system on your website,
    and this chapter will discuss how to do that. We will also go over some other
    sample programs for which sessions are issued. Let''s get started now.


    To start a session, you only need to use one function: session_start(). It automatically
    checks to see if a session is already running on your browser and, if not, assigns
    a new session ID. If a session is already running, it joins that session and uses
    it on the current page. A session ID is simply a sequence of numbers assigned
    to your computer when you start a session. Each computer gets a different session
    ID; it helps the web server keep track of what is doing on the web site and inside
    the session.


    session_start() must be placed before any other echoed HTML or test. This is exactly
    the same thing that happened with setcookie() in Chapter 12. Because sessions
    deal with the document header, the function pertaining to them must be placed
    right at the beginning. Figure 13 shows what happens if session_start() is placed
    after some text is echo''d to the screen.


    The code that produced this error is very short:


    ```php

    session_start();

    ?>

    ```


    There will be an error below the screen. However, because we wrote anything on
    the screen, we got the following error:


    session_start(): Cannot send session cookie - headers already sent


    Why did we get this error? Sessions have to start in the header of a document,
    before anything at all is written on the screen. After the first piece of text
    or the first HTML tag (including `<html>`) is written, the server header section
    is over, and session_start can no longer begin.


    ![](img/fb76427b4bed9367f4a8810f090a7a37_207_0.png)


    Figure 13.1

    Producing an error with session_start().


    # Starting a Session


    Let’s try changing the code a little bit. The result is shown in Figure 13.2.


    ```php

    <?php

    session_start();

    ?>

    ```


    Will there be an error below?


    There is no error at all. Make sure that session_start() appears before any other
    text or HTML tags.


    header("Cache-control: private");


    ![](img/fb76427b4bed9367f4a8810f090a7a37_208_0.png)


    **Figure 13.2** session_start().

    Fixing the error with session_start().


    We have started our session, what’s next? Let’s try making a page similar to the
    one we made in Chapter 12, where the user can enter her name and have the page
    display the name onscreen. We will use sessions rather than cookies to achieve
    this, however.


    # Designing a Form Page


    First of all, we need to design a form page. We are going to use a form identical
    to the one we made last chapter, which looks like Figure 13.3. Check out Chapter
    12''s code listing on the CD as phpft13-01.html or download the source from www.maneeshsethi.com.


    # Developing a Basic PHP Page


    Now that we have a form set up, it’s time to actually put our session to work!
    Let’s start off by developing a basic PHP page that saves the user’s name to a
    variable that crosses different pages.


    ![](img/fb76427b4bed9367f4a8810f090a7a37_209_0.png)


    Figure 13.3

    The phpft13-01.html file.


    Our new page starts with the introductory section:


    ```php

    <?php

    session_start();

    header("Cache-control:private");

    ```


    Note that the form passed the name of the user using the POST method.


    Now we need to assign a session variable to contain the value of the name that
    it passes. In other chapters you have seen the $_POST array, the $_GET array,
    and the $_COOKIE array. All of these valid arrays apply to their type of data.
    Take a guess what the session array is. You guessed it: $_SESSION.


    We actually get to define the elements of the $_SESSION array ourselves. The $_POST
    and $_GET array, the web server or previous forms sends the data to us, through
    the arrays. With $_SESSION, there is no data to download; instead, we create the
    array ourselves.


    We are going to add an element to the array that lets us transfer some data across
    the session. We are going to create an element which stores the user''s name.
    The following code fragment shows you how:


    ```php

    $_SESSION[''name''] = $_POST[''name''];

    ```


    Not bad at all, eh? All we did was create a new element of the $_SESSION array
    and assign it to the form posted by the $_POST array. By doing this, we have created
    a variable that persists throughout the session. While we are at it, let''s update
    the phpft13-01.php file.


    ```php

    <?php

    session_start();

    header("Cache-control:private");


    echo "Thanks for visiting " . $_SESSION[''name''];

    ?>

    ```


