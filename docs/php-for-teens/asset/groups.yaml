    # APPENDIX A


    # FUNCTION LIST


    This appendix lists all of the descriptions and declarations of the functions
    in the book. The declaration is described as follows:


    ```

    return FunctionName(varType variable1, varType variable2, . . .)

    ```


    All of the functions follow this pattern. If the function returns nothing, the
    return type is void. If the parameter is optional, brackets are placed around
    the parameter.


    | Table A.1 Functions | | | |

    | --- | --- | --- |

    | basename() | Returns the filename component of a filename string. | string basename(string
    $fullname) |

    | copy() | Copies the contents of one file to another. | bool copy(string $source_filename,
    string $destination_filename) |

    | define() | Takes in a constant name and a constant value and defines the constant
    in the program. | void define(string $constantName, int currentValue); |


    # Appendix A continued


    Table A.1 continued

    | Name | Description | Code |

    | :--- | :--- | :--- |

    | echo | Although this is not a function (it is a language construct), it acts
    as one. Outputs the specified text or variable to the page. | void echo (string
    $1, . . .) |

    | exit | Although this is not a function (it is a language construct), it acts
    as one. Causes the PHP page to immediately halt script execution. No following
    PHP commands are executed on the page. | void exit (string/int $status); |

    | fclose() | Closes a file. | void fclose(resource $handle); |

    | filesize() | Returns the size of a file in bytes. | int filesize(string $filename);
    |

    | fopen() | Opens a file and returns a handle to it. | resource fopen(string $filename,
    string $mode) |

    | fread() | Returns a string that contains all the contents of the chosen file.
    | string fread(resource $handle, int $sizeInBytes); |

    | fwrite() | Writes a string to an already opened file. | bool fwrite(resource
    $handle, string $text); |

    | gettype() | Returns the type of input variable. | string gettype(anytype $variable);
    |

    | header() | Allows you to modify section of the document. Using the Location:
    attribute changes the web URL. | void header(string $new); |

    | isset() | Confirms a variable has been created. Returns true if it exists and
    false if not. | bool isset(anytype $variable); |

    | mail() | Lets your web server send an message. | bool mail(string $to, string
    $subject, string [$additionalheaders], string [$additionalparameters]) |

