    # Writing to Files


    Cool, huh? But what''s up with that slash in Let\''s Characters that require escape
    sequences, such as the apostrophe, have a backslash before the character. Fortunately,
    there is an easy way to fix this. PHP includes a cool function: stripsplashes().


    ```

    stripslashes($string)

    ```


    This function removes all the backslashes from a string and returns the new string.
    If we wanted to add this to our document, we would only need to change one line.
    We would change our fwrite() line from this


    ```

    if (!fwrite($handle,$text))

    ```


    to this


    ```

    if (!fwrite($handle,stripslashes($text)))

    ```


    After doing so, you can see what the new test.txt file would look like in Figure
    14.10. Small changes make big differences, huh?


    ![](img/fb76427b4bed9367f4a8810f090a7a37_247_0.png)


