    # Using PHP and Forms


    # Caution


    A password box does not secure or encrypt the data in any way, so it is possible
    the information could be stolen.


    Remember to use the POST method on your form. GET sends the data through the address
    bar, and it is very easy to steal the data just by looking at the URL. POST hides
    this data from the link. If you send data through POST, make sure you use the
    $_POST array to access data.


    # Note


    I go over file selectors, another important HTML element, in Chapter 14.


    # Hidden Fields


    Another type you might want to learn about the hidden field. No user can see it,
    but a hidden field can pass data through forms. You can use the hidden field to
    keep necessary data live through all of your pages in a simple manner. You can
    make a hidden field like follows:


    ```

    <input name="hiddenfield" type="hidden" value="whateverValueYouWant" />

    ```


    # Using PHP and Forms


    So far we have looked at the basics of entering items on a form and submitting
    it to another page that utilizes PHP and deals with the inputs. However, you may
    not want to submit the information to another page. In the same page that loads
    in the data and uses it for calculations. This can be useful when you want the
    user''s input to change the page onscreen.


    I used this myself when developing a web site. On one page, the user was allowed
    to enter data to a code to make the item cheaper. I didn''t want to submit the
    code to another page, because that would require multiple pages with almost entirely
    identical content. Instead, I developed only one page that dealt with the data
    if the code was submitted, but did the PHP if the code was skipped.


    The first thing I needed to do was develop a form. In most cases, the form submits
    the data to another page using the action attribute, but in this case we did not
    have the benefit of having another page to submit the information. Fortunately,
    there is a predefined variable that contains the address of the page'
  - '[PAGE 182]


    # Chapter 11 Advanced Forms


    from where it is called. This is part of the predefined array $_SERVER and the
    complete variable name $_SERVER[''PHP_SELF'']. By setting the action attribute
    of the <form> tag to this location, the form sent the data to the same page and
    interacted upon it. The form declaration looked like this:


    ```

    <form name="couponcode" action="<?php $_SERVER[''PHP_SELF'']?> method="get">

    //rest of form here

    </form>

    ```


    # Note


    There is an easier way to do this, if you remember from earlier chapters. By leaving
    out the action attribute altogether, the form will call itself automatically.
    However, I wanted to demonstrate some cool interpolation and array variables,
    so we will continue with $_SERVER[''PHP_SELF''] for this example.


    Check out the action attribute. This wants to use the PHP_SERVER variable, but
    the problem is that HTML itself does not know what the variable means! Only PHP
    uses this predefined variable, so we need to escape into PHP before using the
    array variable. This is done using <?php and ?>.


    Now that we have created the basic level of the form, we need to add a textbox
    that allows the user to enter a coupon code. The textbox is very simple and allows
    regular letters and numbers.


    Please enter in your coupon code <input type="text" name="couponcode" /> <input
    type="submit">


    This creates the basic coupon outline in which the user can type the code and
    press the submit button. If we wrote the form correctly, the page should simply
    refresh. We have created a form whose action is itself, but has no data to pass
    on and no way to interact with that data.


    We need to write some actual PHP to handle anything that might come up. To do
    this, we are going to add the code before the form. The code we need to write
    might something like the following:


    ```

    <?php

    $code = $_GET[''couponcode''];


    echo "You entered the coupon code " . $code;

    ?>

    ```'
- md: "\n## Using PHP and Forms\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_183_0.png)\n\
    \n**Figure 11.4**\nBeginning to use a coupon code.\n\nLet’s put this code together.\
    \ The result is shown in Figure 11.4. You can find this file on the CD as phpft11-01.php.\
    \ This looks pretty normal, right? As soon as you submit the data, the coupon\
    \ code appears. However, what happens if you don't submit something? What happens\
    \ if you just load the page? Check out Figure 11.5.\n\nUh oh. In this case, it\
    \ just left the document blank. That is because the PHP code will always display\
    \ the text \"You entered the coupon code\", whether or not there is a code to\
    \ show. We fix this problem. We need to add some data to make the text show only\
    \ when a code has actually been submitted. Our page will probably end up looking\
    \ like the following, the way it does in *phpft11-02.php*:\n\n```html\n<!DOCTYPE\
    \ html PUBLIC \"//W3C//DTD XHTML 1.0 Strict//EN\"\n   \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\"\
    >\n\n<html>\n<body>\n```\n\n## Chapter 11 ■ Advanced Forms\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_184_0.png)\n\
    \n```php\n<?php\n$code = $_GET['couponcode'];\n```\n\n```php\nif (empty($code)){\n\
    ?>\n  <form name=\"couponcode\" action=\"<?php $_SERVER['PHP_SELF'] ?>\" method=\"\
    get\">\n  Please enter in your coupon code\n```\n\n```html\nPlease enter in your\
    \ coupon code: <input type=\"text\" name=\"couponcode\" /> <input type=\"submit\"\
    >\n```\n\n```php\n<?php\n} else\n{\n  echo \"You entered the coupon code $code\"\
    ;\n}\n?>\n```\n\n```html\n</form>\n</body>\n</html>\n```\n\nNow check out what\
    \ happens when you load the page. See Figure 11.6.\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_185_0.png)\n\
    \n**Figure 11.6**\nThe coupon code in phpft11-02.php without data.\n\nAll right!\
    \ If you want to have a form submit data to the same page, so that any input is\
    \ reflected on itself, this is how you do it!\n\nWe used kind of a cool trick.\
    \ When using conditional statements in PHP, anything between the condition is\
    \ executed only if the condition is true. That means that after the test if, the\
    \ HTML form is only shown if the empty condition is true. Even though we exited\
    \ PHP using the ?> symbol, if the statement still stands: Anything inside is only\
    \ executed if the statement is true. Also, we used a new function: empty(). This\
    \ function is true if the variable is blank, and has no data inside of it.\n\n\
    By the way, in most cases with items like this, you only want the code to change\
    \ the page if it is identical to a predefined number. Most codes are useless if\
    \ they just write themselves on the same page.\n\nTo do a comparison, just compare\
    \ the code to a predefined number. If they match, change the page as you like.\
    \ Look at php11-03.php, which is on the CD:\n\n```html\n<body>\n<form name=\"\
    code\" action=\"<?php echo $_SERVER['PHP_SELF']; ?>\" method=\"get\">\n<p>For\
    \ the purposes of this page, the code is 31413. Try entering in this number and\
    \ other numbers.</p>\n<p>Please enter in your coupon code: <input type=\"text\"\
    \ name=\"couponcode\" />\n<p>\n\n<?php\n$code = $_GET['couponcode'];\n\nif ($code\
    \ == '31413') {\necho \"<font color=red>Congratulations, you have the code!</font><p>\"\
    ;\n}\n<input type=\"submit\">\n</form>\n</body>\n```\n\nFor this page, we moved\
    \ the PHP section down near the end, after the input button. We set the variable\
    \ so that if $code equals the specific constant we are looking for, a special\
    \ text value is echoed to the screen. If the value is incorrect, the statement\
    \ is never echoed. Check out what the page looks like in Figure 11.7.\n\n## Basic\
    \ Email Commands\n\nIf you wish to send email through an HTML form, a very simple\
    \ method is to use the mail() function built into PHP. mail() gives the ability\
    \ to send out a very basic email with a to address filled in. In addition, you\
    \ can have a subject and a message inside the email. Let’s look at a basic email\
    \ declaration.\n\n## Basic Email Commands\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_187_0.png)\n\
    \nFor the purposes of this page, the code is 31413. Try entering in this number\
    \ and other numbers.\n\nPlease enter your coupon code: 31413\n\nCongratulations,\
    \ you have the code!\n\nFigure 11.7\nChanging the code in phpft11-03.php.\n\n\
    Notice that it seems like you cannot choose to change the message-it is from.\
    \ Actually, you can. Just choose one of these methods:\n\n- Define it manually\
    \ within the $additionalheaders variable.\n- Go into your php.ini file from your\
    \ PHP installation and configure the from address in the file.\n\nBecause the\
    \ web server is handling part of the sending, the from option on the email will\
    \ be from the web server.\n\n## Note\n\nThe web server is not actually sending\
    \ the email. PHP uses an external program to send mail. In most cases, this function\
    \ won't work after installing on Windows, unless you do some extra configuration.\
    \ You can find out more about how to configure your server for sending email on\
    \ www.php.net or www.maneeshsethi.com.\n\n## Chapter 11 ■ Advanced Forms\n\nWe\
    \ are going to create one basic form that lets you enter a message, a subject,\
    \ a from to address. We will put that into a PHP mailer and let the file email\
    \ something to whoever the user chooses. Let's start off by designing the form\
    \ document. This file is located in phpft11-04.html on the CD.\n\n```html\n<!DOCTYPE\
    \ html PUBLIC \"-//W3C//DTD XHTML 1.0 Strict//EN\"\n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\"\
    >\n\n<html>\n<head>\n<title>PHP Email</title>\n</head>\n\n<body>\n<form name=\"\
    email\" action=\"phpft11-04.php\" method=\"post\">\n\n<p>Please fill out the form\
    \ to send an email.</p>\n<p>Enter your email address: <input type=\"text\" name=\"\
    from\"> Enter recipient's email address: <input type=\"text\" name=\"to\"></p>\n\
    <p>Enter subject: <input type=\"text\" name=\"subject\"></p>\n<p>Enter your message:<br><textarea\
    \ name=\"message\" rows=\"10\" cols=\"40\"></textarea></p>\n\n<p><input type=\"\
    submit\"> <input type=\"reset\"></p>\n</form>\n\n</body>\n</html>\n```\n\nThis\
    \ is a pretty simple page, right? You can see what it looks like in Figure 11.8.\n\
    If you thought this was simple, look at the PHP code in phpft11-04.php:\n\n```php\n\
    <?php\n$to = $_POST['to'];\n$subject = $_POST['subject'];\n$message = $_POST['message'];\n\
    $headers = 'From: ' . $_POST['from'] . \"\\r\\n\";\n\nmail($to, $subject, $message,\
    \ $headers);\n?>\n```\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_189_0.png)\n\
    \n**Figure 11.8**\nThe mail form in phpft11-04.html.\n\nThis page takes in all\
    \ the necessary for sending out email. Look closely at the $headers section: Be\
    \ careful with that. The $from variable has to be formulated in a special way:\
    \ 'From: emailaddress.'. The extra \\r\\n allows you to later add headers, as\
    \ Reply-To. By doing this, we have now sent out email to whoever is in the textbox!\
    \ Pretty cool, huh?\n\nI have a very similar script set up on my site, which allows\
    \ users to subscribe to my forum by way of email. You can probably think of many\
    \ more uses for email.\n\n## CHAPTER 12\n\n# COOKIES\n\nPHP has many functions\
    \ and abilities for web sites. One of these capabilities is to create and use\
    \ cookies. You may have heard of cookies while using your web browser. A cookie\
    \ is a text file stored on the user’s machine. This text file has a data value,\
    \ which stores some amount of data. You just load this text file as a variable\
    \ on pages that use the cookie, and that is your stored data! The text file is\
    \ stored, in a hidden spot, by your web browser.\n\nBasically, a cookie is a way\
    \ for a site to save some data on your computer. This can be good and bad. For\
    \ example, a lot of spyware sites uses cookies to keep track of where you visit\
    \ and use this data to sell ads to you. Also, make sure you don't overdo it: A\
    \ lot of people don't like a lot of cookies because it seem like you storing data\
    \ about them. On the other hand, using cookies allows you to choose and have those\
    \ choices reflected on the site every time you use it.\n\nThis might seem vague,\
    \ so let me give an example. Say you have a site where the user enters her name.\
    \ This name might be reflected in many parts of the site, such as on the top of\
    \ every page and in printable sections and documents. It is a little annoying\
    \ to have to reenter her name every time the user enters the site, so adding cookies\
    \ is a great way to make things a little easier.\n"
  mdcn: "\n\n## 使用 PHP 和表单\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_183_0.png)\n\
    \n**图 11.4**\n开始使用优惠码。\n\n让我们把这些代码组合在一起。结果如图 11.4 所示。你可以在 CD 上找到名为 `phpft11-01.php`\
    \ 的文件。这看起来很正常，对吧？只要你提交数据，优惠码就会出现。然而，如果你不提交任何内容会怎样呢？如果你只是加载页面会怎样？看图 11.5。\n\n噢。在这种情况下，它只留了一个空白文档。这是因为\
    \ PHP 代码始终显示“You entered the coupon code”（您输入了优惠码），无论是否有代码要显示。我们修复这个问题。我们需要添加一些数据，使得文本仅在实际提交了代码时才显示。我们的页面最终看起来可能如下，就像在\
    \ *phpft11-02.php* 中的那样：\n\n```html\n<!DOCTYPE html PUBLIC \"//W3C//DTD XHTML\
    \ 1.0 Strict//EN\"\n   \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\">\n\
    \n<html>\n<body>\n```\n\n## 第 11 章 ■ 高级表单\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_184_0.png)\n\
    \n```php\n<?php\n$code = $_GET['couponcode'];\n```\n\n```php\nif (empty($code)){\n\
    ?>\n  <form name=\"couponcode\" action=\"<?php $_SERVER['PHP_SELF'] ?>\" method=\"\
    get\">\n  Please enter in your coupon code\n```\n\n```html\nPlease enter in your\
    \ coupon code: <input type=\"text\" name=\"couponcode\" /> <input type=\"submit\"\
    >\n```\n\n```php\n<?php\n} else\n{\n  echo \"You entered the coupon code $code\"\
    ;\n}\n?>\n```\n\n```html\n</form>\n</body>\n</html>\n```\n\n现在查看一下加载页面时会发生什么。见图\
    \ 11.6。\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_185_0.png)\n\n**图 11.6**\n\
    phpft11-02.php 中没有数据的优惠码。\n\n好了！如果你想让表单将数据提交到同一个页面，以便任何输入都能反映在页面上，这就是操作方法！\n\n\
    我们使用了一种很酷的技巧。在 PHP 中使用条件语句时，条件之间的内容只有在条件为真时才会执行。这意味着在测试 `if` 之后，只有当 `empty` 条件为真时才会显示\
    \ HTML 表单。即使我们使用 `?>` 符号退出了 PHP，只要语句仍然成立：里面的内容只有在语句为真时执行。此外，我们还使用了一个新函数：`empty()`。如果变量为空且内部没有数据，该函数为真。\n\
    \n顺便说一下，在大多数此类项目中，你只希望在代码与预定义的数字相同时才更改页面。如果代码只是自己写在同一个页面上，它们大多数是没用的。\n\n要要进行比较，只需将代码与预定义的数字进行比较。如果它们匹配，就按你的意愿更改页面。查看\
    \ CD 上的 `php11-03.php`：\n\n```html\n<body>\n<form name=\"code\" action=\"<?php\
    \ echo $_SERVER['PHP_SELF']; ?>\" method=\"get\">\n<p>出于本页面的目的，代码是 31413。尝试输入这个数字和其他数字。</p>\n\
    <p>Please enter in your coupon code: <input type=\"text\" name=\"couponcode\"\
    \ />\n<p>\n\n<?php\n$code = $_GET['couponcode'];\n\nif ($code == '31413') {\n\
    echo \"<font color=red>Congratulations, you have the code!</font><p>\";\n}\n<input\
    \ type=\"submit\">\n</form>\n\n\n对于这个页面，我们将 PHP 部分移动到了输入按钮之后。我们设置了变量，如果 `$code`\
    \ 等于特定的常量，就会输出特殊值。如果值错误，语句将不会输出。查看图 11.7 中的页面。\n\n如果你想通过 HTML 表单发送电子邮件，一种简单的方法是使用\
    \ PHP 内置的 `mail()` 函数。`mail()` 提供了带有收件人地址发送基本电子邮件的能力。此外，你可以在邮件中包含主题和消息。让我们看看基本电子邮件声明。\n\
    \n## 基础电子邮件命令\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_187_0.png)\n\n出于页面的目的，代码是\
    \ 31413。尝试输入这个数字和其他数字。\n\nPlease enter in your coupon code: 31413\n\nCongratulations,\
    \ you have the code!\n\n图 11.7\nphpft11-03.php 中的代码。\n\n注意，似乎无法选择更改消息——实际上，你可以选择以下方法之一：\n\
    \n- 在 `$headers` 变量中手动定义它。\n- 进入你的 PHP php.ini 文件并配置发件人地址。\n\n由于 Web 服务器处理发送部分，邮件中的发件人将来自\
    \ Web 服务器。\n\n## 注意\n\nWeb 服务器并没有实际上发送电子邮件。PHP 使用外部程序发送邮件。在大多数情况下，除非你在 Windows\
    \ 上进行了一些额外配置，否则该函数将无法工作。你可以在 php.net 上找到更多关于配置服务器发送电子邮件的信息。\n\n## 第 11 章 ■ 高级表单\n\
    \n我们将创建一个基本表单，让你输入消息、主题和发件人地址。我们将这些放入 PHP 邮件器并发送给用户选择的任何人。让我们从设计表单文档开始。该文件位于 CD\
    \  `phpft11-04.html`。\n\n```html\n<!DOCTYPE html PUBLIC \"//W3C//DTD XHTML 1.0\
    \ Strict//EN\"\n   \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\">\n\n\
    <html>\n<head>\n<title>PHP Email</title>\n</head>\n\n<body>\n<form name=\"email\"\
    \ action=\"phpft11-04.php\" method=\"post\">\n\n<p>Please fill out the form to\
    \ send an email.</p>\n<p>Enter your email address: <input type=\"text\" name=\"\
    from\"> Enter recipient's email address: <input type=\"text\" name=\"to\"></p>\n\
    <p>Enter subject: <input type=\"text\" name=\"subject\"></p>\n<p>Enter your message:<br><textarea\
    \ name=\"message\" rows=\"10\" cols=\"40\"></textarea></p>\n\n<p><input type=\"\
    submit\"> <input type=\"reset\"></p>\n</form>\n\n</body>\n</html>\n```\n\n这是一个非常简单的页面，对吧？你可以在图\
    \ 11.8 中看到它的样子。如果你认为这很简单，请看 `phpft11-04.php` 中的 PHP 代码：\n\n```php\n<?php\n$to\
    \ = $_POST['to'];\n$subject = $_POST['subject'];\n$message = $_POST['message'];\n\
    $headers = 'From: ' . $_POST['from'] . \"\\r\\n\";\n\nmail($to, $subject, $message,\
    \ $headers);\n?>\n```\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_189_0.png)\n\
    \n**图 11.8**\nphpft11-04.html 中的邮件表单。\n\n此页面获取了发送电子邮件的所有要素。仔细查看 `$headers` 部分：注意该部分。`$from`\
    \ 变量必须以特殊方式格式：'From: emailaddress.'。额外的 `\\r\\n` 允许你以后添加回复头（Reply-To）。通过这种方式，我们现在已经向文本框中的任何人发送了电子邮件！很酷，对吧？\n\
    \n我在我的网站上设置了一个非常类似的脚本，允许用户通过电子邮件订阅我的论坛。你可能还会考虑到电子邮件的更多用途。\n\n## 第 12 章\n\n# COOKIES\n\
    \nPHP 为网站提供了许多功能和能力。其中一种能力就是创建和使用 Cookie。在使用浏览器浏览器时可能听过 Cookie。Cookie 是存储在用户机器上的文本文件。这个文本文件有一个数据值，存储了一部分数据。你只需要在使用\
    \ Cookie 的页面上将此文本文件加载为变量，这就是你的存储数据！该文本文件由你的网络浏览器存储在一个隐藏的地方。\n\n基本上，Cookie 是网站在你的计算机上保存某些数据的方式。这有良有坏之。例如，许多间谍软件网站使用\
    \ Cookie 来跟踪你的访问情况，并利用这些数据向你推销广告。此外，确保不要过度使用：很多人不喜欢很多 Cookie，因为这看起来你正在存储关于他们的数据。另一方面，使用\
    \ Cookie 允许你做出选择，并在每次使用网站时让这些选择反映在网站上。\n\n这可能看起来模糊，所以我举个例子。假设你有一个网站，用户输入她的名字。这个名字可能会反映在网站的许多部分，例如每个页面顶部以及可打印的部分和文档中。用户每次进入网站时都要重新输入名字有点烦人，所以添加\
    \ Cookie 是让事情变得更容易的好方法。\n\n"
