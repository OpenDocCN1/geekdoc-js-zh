    \ might need to perform a different action because some special event occurs.\
    \ PHP offers a way to do this with branching structures.\n\n### if\n\nThe easiest\
    \ way is to use the if branching structure. A basic backbone looks like the following:\n\
    \n```\nif (condition is true)\n{\n    //execute statements\n}\n```\n\nYou obviously\
