    $domain refers to the domain for which the cookie is valid. In many cases, you
    want it to be valid for your entire web site. This is common when you have a site
    people might visit at website.com and at www.website.com. Because www.website.com
    is considered a subdomain, make sure that the cookie is valid for both options.'
  - '[PAGE 195]


    To make the cookie valid to all subdomains, make the cookie set to .website.com,
    with a period before the name. This causes all subdomains to recognize the cookie.
    If you want only www.website.com to accept the cookie, use www.website.com as
    your $domain.


    # $secure


    The $secure parameter indicates that the cookie should only work over a secure
    HTTPS connection. We have not gone over HTTPS for this book, it will not work
    if you set this Boolean parameter to true. However, if you ever learn how to use
    HTTPS on your own, this is how you would enable it for your cookies.


    # Common Problems


    Many people have some difficulty defining a cookie. Let’s look at some of these
    problems.


    +   The web script in the PHP document does not recognize the cookie. Cookies
    are not usable until the web page has been refreshed, if you try to use a cookie
    on the same page where you created the cookie, the cookie will not work. In cases
    like these, simply use the value you assigned to the cookie to the areas where
    the value was going to be.


    +   The web browser accessing the document has disallowed cookies on the page.
    This causes a problem creating a cookie and throws out any you create. Double-check
    that your page will work well without cookies if a user wants to use the page
    without them.


    +   Sometimes, developers try to create a cookie that has no value. That is fine,
    make sure you set the value to " (no value), not false. Using the Boolean false
    creates a cookie that automatically deletes itself. Use a regular cookie and leave
    the value blank. A cookie with no value could let your PHP script know that the
    user has visited there, sort of as a place mark.


    +   Cookies change the HTTP header, you cannot put the setCookie function that
    defines and deletes cookies after any HTML code. Make sure your cookie code goes
    before the HTML header.


    If you double-check, your pages should be fine.'
  - "[PAGE 196]\n\n# Putting a Cookie in Your Site\n\nNow it is time to put your knowledge\
    \ into action. We are going to develop a couple pages with cookies, starting off\
    \ with the one described earlier, which allows the user to enter a name on the\
    \ form, which the web page remembers for a long period of time. The first thing\
    \ we need to develop an HTML document. This HTML form allows the user to enter\
    \ his name. From there, we will develop a couple of PHP forms that display the\
    \ user’s name.\n\n```\n<!DOCTYPE html PUBLIC \"//W3C//DTD XHTML 1.0 Strict//EN\"\
    \n  \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\">\n<html>\n<head>\n<title>Developing\
    \ a page with cookies</title>\n</head>\n\n<body>\nPlease enter your name into\
    \ the following text box and hit submit. Note that if you have entered a name\
    \ in the past few weeks, that name will be deleted with the new one.\n<p>\n<form\
    \ name=\"cookie\" action=\"phpft12-01.php\" method=\"post\">\nEnter your name\
    \ here:\n<input type=\"text\" name=\"name\" />\n<p>\n<input type=\"submit\" />\n\
    </form>\n</body>\n</html>\n```\n\nThis is a very simple page, with just an input\
    \ textbox. The page ends up looking like Figure 12.1. You can see this file on\
    \ the CD as phpft12-01.html.\n\nLet’s enter a name in that box. You press submit,\
    \ and what do you get? Nothing yet, because we still need to design the PHP page.\
    \ Let’s do that now. We want this PHP acceptor to do a couple of things:\n\n+\
    \   It should confirm whether a cookie has been created recently. If it has, then\
    \ we need to delete that cookie and reset it with the new value. If not, it simply\
    \ needs to create the new cookie."
