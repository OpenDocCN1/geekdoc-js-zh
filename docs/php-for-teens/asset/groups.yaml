  - '[PAGE 251]


    # Renaming, Copying, and Deleting Files 24


    # copy


    The first function copies:


    ```

    copy($source_filename, $destination_filename)

    ```


    When using the copy function, the program knows already that the source file needs
    to be opened for reading and the destination file needs to be open for writing.
    Because of this, the function does not require that you pass in a handle of a
    file, but just the filename. The function actually sends the copy and rename commands
    to the operating system, delegating the work from the PHP program—saves you some
    work.


    # rename


    The second function renames:


    ```

    rename($old_filename, $new_filename);

    ```


    One cool thing to know about rename is that you can use it to move a file across
    directories, as well. By renaming the file to have a different path, you can move
    the file. For example, if the old filename is C:\test.txt and the new filename
    is D:\text.test.txt, you move the file from the C:\ directory to D:\text. Pretty
    nifty, huh?


    # unlink


    The last function deletes files. I bet you think you know what the function name
    is.


    ```

    unlink($filename)

    ```


    Weird, huh? PHP sometimes gives functions annoying names, so even though most
    people would expect this function to be delete(), it is instead entitled unlink().


    These functions are all simple to use, and all return a Boolean value. If the
    function is successful, the function returns true, and if it is false, the function
    returns false.'
