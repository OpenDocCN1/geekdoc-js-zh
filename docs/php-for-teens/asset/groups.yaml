- md: "\n## Chapter 5 | Constants, Expressions, and Operators\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_92_0.png)\n\
    \nFigure 5.3\nThe phppft05-03.php ternary operator file.\n\n```php\n<body>\n<?php\n\
    \n$x = 7;\n$y = 10;\n\n//If x is greater than y, $ans = \"greater\", otherwise\
    \ it equals \"less\"\n$ans = ($x > $y) ? \"greater\" : \"less\";\n\n//Print out\
    \ the result\necho \"<p>After the test, we have determined that $x is $ans than\
    \ $y</p>\";\n\n?>\n</body>\n</html>\n```\n\nIn this case, we gave variable values\
    \ to $x and $y. We then used the ternary operator to give a value to the variable\
    \ $ans, which could have the result of greater or less, depending on whether $x\
    \ is greater than or less $y. Let's take an in-depth look.\n\n`$ans = ($x > $y)\
    \ ? \"greater\" : \"less\";`\n\nFirst, $ans is created and is left to the side\
    \ to be assigned to the operation results. Next, the operator tests the expression\
    \ ($x > $y). If this is true, the first result is returned: greater. If the test\
    \ is false, the second result is returned: less. Because $ans is assigned to the\
    \ result, it can only be greater or less. In this example, $x was not greater\
    \ than $y, so the result was false and $ans was less. We then plugged this value\
    \ into an echo statement:\n\n`echo \"After the test, we have determined that $x\
    \ is $ans than $y\";`\n\nThis statement echoes the results. First, it writes out\
    \ \"After the test, we have determined that $.\". Then it writes out $x, followed\
    \ by, displays the $ans value, and shows $y. Because $ans can only be greater\
    \ or less, it will make a valid sentence sense. By the way, if $x$ and $y$ are\
    \ both equal to the same number, the program is blank. In a real program, you\
    \ need to handle that event.\n\nYou might have noticed I used a different scheme\
    \ to write out the echo statement. Earlier, we used single quotes to echo out\
    \ text; here I used double quotes. Check out the sidebar to find out why.\n\n\
    ## Why can I echo with double quotes or single quotes?\n\nWhen using an echo command\
    \ (or any command that requires quotation marks), consider whether you want to\
    \ use single or double quotes. When writing out text, there is no difference.\
    \ For example, `echo 'Hello, World!'` is identical to `echo \"Hello, World!\"\
    `. When you use variables or constants within an echo statement, double quotes\
    \ and single quotes are very different. Double quotes allow you to place a variable\
    \ directly into the string, referenced by a $ symbol; PHP substitutes the variable's\
    \ value. However, with single quotes, the value is not substituted; instead, the\
    \ page displays the quote name. To use variables within single-quoted statements,\
    \ you need to use the dot operator (.), ending the string with a single quote\
    \ and using the dot operator to join a variable and the string.\n\n## Arithmetic\
    \ Operators\n\nArithmetic operators are the most common. Most are basically the\
    \ same ones you know your entire life: addition, subtraction, multiplication,\
    \ and division. Arithmetic operators act just like you would expect them to when\
    \ you do something like what you see in Table 5.1.\n\n| Table 5.1 Arithmetic Operators\
    \ |\n| Task | Symbol | Example |\n|---|---|---|\n| Add two numbers | Addition\
    \ (+) | $sum = a + b$ |\n| Subtract two numbers | Subtraction (-) | $difference\
    \ = a - b$ |\n| Multiply two numbers | Asterisk (*) | $product = a * b$ |\n| Divide\
    \ two numbers | Forward slash (/) | $quotient = a / b$ |\n| Retrieve a negative\
    \ number | Subtraction (-) | $negative = -a$ |\n| Retrieve a division remainder\
    \ | Percentage (%) | $remainder = a % b$ |\n\nThe last two might be new to you.\
    \ The negative operator returns the number's negative value. For example, using\
    \ the negative operator on 7 would return -7. This is a unary operator, meaning\
    \ it only works on one input. The last arithmetic operator is called the modulus\
    \ operator. It works in the same way as any of binary operators. For instance,\
    \ 7%7 would return 0 because there is no remainder in 7/7 division problem. In\
    \ 9%7, the answer is 2, because there is a remainder. Modulus is awesome for checking\
    \ some specific things, such as if a number is even or odd. 6%2 is 0, meaning\
    \ the number (6) is even, and 5%2 is odd (and it is equal to 1), meaning 5 is\
    \ odd. If you are checking remainders, modulus is excellent for that purpose.\n\
    \nLet's put all these arithmetic operators into a program. We will use a basic\
    \ calculator form. Here is the form that we created to do this job. You can find\
    \ it on the CD as phpft05-04.html:\n\n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
    \ XHTML 1.0 Strict//EN\"\n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\"\
    >\n\n<html>\n\n<head>\n<title>A Basic Arithmetic Calculator</title>\n</head>\n\
    \n<body>\n<form name=\"calculator\" method=\"get\" action=\"phpft05-04.php\">\n\
    <p>Enter first value:\n<input type=\"text\" name=\"first\" />\n\n<p>Choose an\
    \ operation:\n<select name=\"operation\">\n<option value=\"+\">+</option>\n<option\
    \ value=\"-=\"-</option>\n<option value=\"\">*</option>\n<option value=\"/\"></option>\n\
    <option value=\"%\">%</option>\n</select>\n\n<p>Enter second value:\n<input type=\"\
    text\" name=\"second\" />\n\n<input type=\"submit\" value=\"Calculate\" />\n</form>\n\
    </body>\n</html>\n```\n*(Note: The OCR text for the form code was fragmented in\
    \ the source; I have reconstructed the logical structure based on the context\
    \ of a PHP calculator form provided in the snippets.)*\n\nWait, looking back at\
