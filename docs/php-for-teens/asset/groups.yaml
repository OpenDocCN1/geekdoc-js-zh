  mdcn: "\n\n## 第 1 章 = 欢迎 PHP\n\n页面。如果不是，请使用 127.0.0.1 代替 localhost。如果仍然不起，请尝试重新安装。\n\
    如果你的屏幕看起来是，你就可以准备好下一步了——安装 PHP。\n\n## 安装 PHP\n\n按照以下步骤安装 PHP：\n\n- 1. 下载你能找到的最新版本的\
    \ PHP。\n   检查 CD 光盘（里面有 PHP 5.0.4）、www.maneeshsethi.com；或者（更好的）www.php.net。\n\
    - 2. 点击“Downloads”（下载）部分。\n   你会看到一个类似于图 1.7 所示的页面。确保你的 PHP 版本是 5.1.1；旧版本设置起来会稍微困难一些。\n\
    - 3. 选择 Windows PHP zip 程序包进行下载。\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_18_0.png)\n\
    \n## 在 Windows 上安装 PHP\n\n- 4. 点击链接并下载文件。\n   文件是压缩过的。如果你使用的是 Windows XP，可以默认打开此文件。\n\
    \   如果没有，你可能需要下载 WinZip。\n\n- 5. 将所有文件提取到你的电脑上。\n   在本章的剩余部分中，我假设你已将文件提取到 C:\\\
    php。提取后导航到此目录，它看起来会像图 1.8 所示。下一节稍有不同，因为你需要编辑一些文本文件，使 Apache（Web 服务器）与 PHP 良好配合。\n\
    \n- 6. 导航到你的 Apache 安装目录，打开 /conf/ 目录并找到 httpd.conf。\n   C:\\Program Files\\Apache\
    \ Group\\Apache2 是默认位置。进入这里并 conf 目录。\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_19_0.png)\n\
    \n图 1.8\nC:\\php 目录。\n\n## 第 1 章 = 欢迎 PHP\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_20_0.png)\n\
    \n基于 Rob McCool 最初的 MCSA 服务器配置文件。\n这是主要的 Apache 服务器配置文件。它包含了给服务器提供指令的配置指令。\n请访问\
    \ http://http.apache.org/docs-2.0/ 获取有关指令的详细信息。\n\n**不要**在不理解它们作用的情况下直接阅读这里的指令。它们在这里仅作为提示或提醒。如果你不确定，请查阅在线文档。\n\
    \n- 配置指令分为三个基本部分：\n- 1. 控制 Apache 服务器进程运行的指令，该进程作为一个响应请求的服务器进行工作。\n- 2. 定义“主”或“默认”服务器参数的指令，该服务器响应未由虚拟主机处理的请求。这些指令还定义了所有虚拟主机设置的值。\n\
    - 3. 虚拟主机的设置，允许 Web 请求发送到不同的 IP 地址或主机名，并由同一个服务器进程处理。\n\n配置和主机名：如果你为许多服务器控制文件指定的文件名以\
    \ \"/\" 或 win32 的 \"drive:\" 开头，服务器将使用显式路径。如果文件名没有以值开头，它们将附加到 \"foo.log\" 中，当\
    \ serverroot 设置为 \"C:/Program Files/Apache2/\" 时，会被服务器解释为 \"C:/Program Files/Apache\
    \ Group/Apache2/logs/foo.log\"。\n\n> 注意：在指定文件名的地方，必须使用正斜线 /\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_20_1.png)\n\
    \n图 1.9\nhttpd.conf 文件。\n\n## 7. 打开并编辑 httpd.conf\n\n你需要向文档中添加几行内容。图 1.9 显示了文档的样子。\n\
    \n### 注意事项\n\n小心！conf 目录中的两个文件非常相似：httpd.conf 和 httpd.default.conf。\n确保你选择了 httpd.conf。\n\
