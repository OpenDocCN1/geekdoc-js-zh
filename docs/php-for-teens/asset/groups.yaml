    # Chapter 7 = Program Flow: Control Structures


    ![](img/fb76427b4bed9367f4a8810f090a7a37_124_0.png)


    Figure 7.7

    The phpft07-04.php file.


    # Loops


    Sometimes, while designing a program, you need to execute a set of statements
    repeatedly. You might need to display an entire set of data with hundreds of elements
    or list all numbers from 1 to 100. Fortunately, PHP offers loops, which allow
    you to execute a set of statements as many times as needed. There are several
    different types of loops. Each type has strengths and weaknesses. You most often
    find loops with arrays, which I go over in Chapter 10.


    # while


    Let’s start off with the most common loop: while. Using the while loop, you execute
    the statements as long as a certain condition is true. Remember the three stages
    of the while loop:


    +   - Initialization outside the loop, which ensures the loop executes at least
    once


    +   - Condition inside the while statement


    +   - Code inside the loop, which causes it to end'
  - "[PAGE 125]\n\n# Let’s look at the structure:\n\n```\nwhile (condition is true)\n\
    {\n    //execute repeated statements\n} //end of loop\n```\n\nYou can enter whatever\
    \ statements you want executed.\n\n# Caution\n\nBe careful—don’t want to accidentally\
    \ create a loop that is always true. If the statement inside the condition test\
    \ is never false, the loop will execute forever. This could occur if you write\
    \ something like while (1=1) or even while(1), because any non-zero number is\
    \ always true. A common error is to check some condition that never occurs, while\
    \ ($x!=7), when the variable x never becomes 7. If you do this, the loop continues\
    \ forever and the page never loads correctly.\n\nLet’s create a simple program:\
    \ a counter that counts from 1 to 10 and displays the digits on the screen. This\
