    \ $_GET['first'] 和 $_GET['second']，而不是将它们转换为标量变量 $first 和 $second。我们转换 $_GET 变量是因为它们在不带括号数组语法的情况下处理起来容易得多，而且它们的名称更直观。\n\
    \n使用函数的真正威力在于它们的**可移植性**。因为函数可以写得不依赖于程序的任何变量，你可以简单地将该函数提取出来并在另一个程序中使用。如果你编写了另一个需要计数器的程序，你可以直接使用这个函数而无需修改。事实上，许多程序员会将他们常用的函数收集成一个库文件。然后每当他们需要执行任务时，只需加载库文件并调用已编写的函数。\n\
    \n当然，并不是所有函数都是可移植的，因为涉及到变量作用域。在使用变量时，程序只能访问创建它的变量的一部分。例如，如果你在函数 DoA() 中有一个 $test_var，另一个函数\
    \ DoB() 无法访问该变量。语言定义的某些数组（如 $_GET 和 $_POST）是全局的。然而，对于你自己开发的函数，注意只访问和使用作用域内的变量。\n\
    \n## 数学思维\n\n如果你查看我们创建的程序，你可以看到获取任意端点之间总和的巧妙方法。我们使用了一种实际上遍历每个值并将其加到运行计数器的机制。几个数学函数不需要循环的情况下产生正确的结果。但对于非常大的总和，这个程序可能需要一段时间。从这个序列中获取总和有一个酷的公式：S(n)\
    \ = n/2 * (a(1) + a(n))，其中 n 是你想相加的数字，$a(1) 是第一个数字。如果你找到前四个数字的总和，你会得到：S(4) = 4/2\
    \ * (1 + 4) = 16。如果你在计算中使用这个公式，答案会更快得到。\n\n那么意义何在？解决方案有效并不意味着它是最快的。找到一个更好的算法会让事情进展快得多。\n\
    \n## 根据条件调用函数\n\n有时你需要根据条件调用函数。在程序中，你不需要每次都调用它们，但可能需要根据情况调用几个。最好的例子之一是需要将摄氏度转换为华氏度或反之：温度转换器。第一件事是设计\
    \ HTML 页面。你可以在 phpft09-04.html 找到它。\n\n```html\n<!DOCTYPE html PUBLIC \"//W3C//DTD\
