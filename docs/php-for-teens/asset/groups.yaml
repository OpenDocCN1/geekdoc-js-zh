    # 使用会话 (Sessions)


    - 会话没有过期时间：它们会在浏览器关闭时立即失效。由于没有文件保存到用户的计算机上，会话变量在浏览器关闭时会丢失其引用，并且无法再次使用。当然，你可以找到方法来绕过这一点，但在大多数情况下，立即结束会话对服务器和用户都是更好的。


    会话是在你的网站上实现用户名/密码系统的极佳方法，本章将讨论如何实现它。我们还将介绍一些其他使用会话的示例程序。让我们现在开始吧。


    要启动会话，你只需要使用一个函数：`session_start()`。它会自动检查你的浏览器是否已经运行了一个会话，如果没有，它会分配一个新的会话 ID。如果会话已经在运行，它将加入该会话并在当前页面使用。会话
    ID 只是在你启动会话时分配给计算机的数字序列。每台计算机都会获得不同的会话 ID；它可以帮助 Web 服务器跟踪网站以及会话内部的操作。


    `session_start()` 必须放置在任何其他 `echo` 的 HTML 或文本之前。这与第 12 章中 `setcookie()` 发生的情况完全相同。因为会话处理文档头（header），与它们相关的函数必须放在最开始。图
    13 显示了如果在向屏幕 echo 某些文本后放置 `session_start()`，会发生什么。


    产生此错误的代码非常短：


    ```php

    session_start();

    ?>

    ```


    屏幕下方将出现一个错误。然而，由于我们在屏幕上写了内容，我们得到了以下错误：


    session_start(): Cannot send session cookie - headers already sent


    我们为什么得到这个错误？会话必须在文档的头中启动，在任何内容写入屏幕之前之前。一旦写入了第一段文本或第一个 HTML 标签（包括 `<html>`），服务器头部分就结束了，`session_start`
    无法再开始。


    ![](img/fb76427b4bed9367f4a8810f090a7a37_207_0.png)


    图 13.1

    使用 `session_start()` 产生错误。


    # 启动会话


