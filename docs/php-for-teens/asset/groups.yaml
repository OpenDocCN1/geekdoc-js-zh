    # CHAPTER 9


    # FUNCTIONS


    A function is essentially a section of code that you can call over and over again.
    This function can do repetitive tasks very easily and safely, and because it is
    encapsulated in a function name, that makes the main program look a lot neater.


    We have been using a lot of predefined functions, written by PHP, such as strval()
    and nl2br(). Notice how both functions have parentheses after the name? That is
    a function''s defining attribute. In Chapter 6 I explain that I format my-word
    functions using underscore. This is an example of one of my functions:


    ```

    execute_func();

    ```


    # Designing Your Own Functions


    You might be wondering why you would ever want to design a function. Functions
    allow your program to become a lot more robust and capable. Functions make your
    program modular, meaning that you can use parts of your program in other programs
    without worrying about problems. This means less work for you overall. Let''s
    take an example. Let''s say I had a program that added the numbers 1 through 10.
    This is how a sample program would look if I wrote it without functions:


    ```

    <?php

    echo "The following counter will add up the numbers 1 through 10";

    echo "<br>Please wait, your numbers are being tabulated below.";

    ```'
- md: "\n# Chapter 9 = Functions\n\n```php\n<?php\n$runningcounter=0;\nfor ($x=1;\
    \ $x <= 10; $x++)\n{\n  $runningcounter = $runningcounter + $x;\n}\necho \"<p>Your\
    \ result is ' . $runningcounter;\necho \"<br>Thanks for using our program!\";\n\
    ?>\n```\n\nThe majority of this program is taken up by the code for the running\
    \ counter. The counter also does not seem to mix well with the rest of the program\
    \ that consists solely of echo statements. The program would look like the one\
    \ in Figure 9.1.\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_146_0.png)\n\nThe\
    \ following counter will add up the numbers 1 through 10. Please wait, your numbers\
    \ are being tabulated.\n\nYour result is 55\nThanks for using our program!\n\n\
    Figure 9.1 A running counter program without using a function in phpft09-01.php.\n\
    \n## Designing Your Functions\n\nAs you can see, the display looks fine. Underneath,\
    \ as you saw before, the code isn't as nice as it could be. Look at how we could\
    \ make this program look a heck of a lot better by turning the counter into a\
    \ function:\n\n```php\n<?php\necho \"The following counter will add up the numbers\
    \ 1 through 10\";\necho \"<br>Please wait, your numbers are being tabulated below.\"\
    ;\necho '<p>Your result is ' . counter_1_10();\necho \"<br>Thanks for using our\
    \ program!\";\n?>\n```\n\nThis might look a little strange. The only change is\
    \ removing the code for the loop from the earlier program and replacing it with\
    \ a function call. The call is in the echo statement:\n\necho '<p>Your result\
    \ is ' . counter_1_10();\n\nYou can see here we changed the variable $x to counter_1_10().\
    \ Of course, this function by name itself doesn't do anything—we need to make\
    \ it actually mean something! I show you, very soon, how to make your functions\
    \ work, before I do, look at another example of using functions.\n\nIf you are\
    \ writing a song, you could do something like this:\n\n```php\n<?php\nverse1();\n\
    chorus();\nverse2();\nchorus();\nverse3();\nchorus();\nchorus();\n?>\n```\n\n\
    This is a pretty common setup for a song, but notice how you are allowed to call\
    \ the same function chorus() multiple times, and in any order? Functions allow\
    \ you to do cool things like this.\n\nBefore you learn how to create this program,\
    \ look at the basic structure of defining a function. The parts you can change\
    \ to suit your individual function are in italics.\n\n```php\n<?php\nfunction\
    \ function_name(parameter1,parameter2,...)\n{\n    function code\n}\n?>\n```\n\
    \nDoesn’t seem too difficult, does it? Function definitions are just the structure\
    \ and code of the function.\n\n## Dissecting a Function\n\nFunctions have three\
    \ parts that we need to go over:\n\n- Function code\n- Parameter list\n- Return\
    \ value\n\nOnly the code section is required; both the parameter list and the\
    \ return value are optional. However, in most functions, you will be using all\
    \ three.\n\n## Function Code\n\nThe function code section is the main section\
    \ located between the curly braces: { }. This section deals with the function's\
    \ actual work. You can add statements and expressions in this section as you would\
    \ in a normal section of the code. Often, this section of the code interacts with\
    \ the parameter list in the function declaration.\n\n## Parameter List\n\nParameters\
    \ are variables and values that you can pass to a function when calling it. Remember\
    \ when we used the nl2br() function? This function converted new lines in your\
    \ code to <br> tags, taking the string that has new lines in it as a parameter.\
    \ You pass parameters inside the parentheses when you call the function, and then\
    \ the function can use the parameters to act upon it.\n\nUsing the nl2br() function,\
    \ you might create a string and send it to the function like this:\n\n```php\n\
