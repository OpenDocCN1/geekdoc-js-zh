    \ is unregistered as a session variable!\";\n}\n?\n```\n\n# The Fix\n\nThis is\
    \ a little different from what you have seen before, huh? We created an if..else\
    \ section that tests to see whether the variable $address exists. The first test\
    \ checks to make sure that $address is not blank. If it is not blank, then there\
    \ is an error—the variable carried through. If it is blank, then the session variable\
    \ has not carried through and it works correctly.\n\nLet's see what happens when\
    \ you go to this page through your browser after creating a session variable from\
