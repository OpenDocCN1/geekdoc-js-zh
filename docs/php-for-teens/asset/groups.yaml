    ## Chapter 1 Welcome to PHP


    Fact, even if you have never developed a web site of any kind before, you will
    pick everything you need to know as we go along.


    In this chapter, we are going to go ahead and install PHP. Installing PHP takes
    two steps. First, you need to install a web server and second, you need to install
    PHP as a part of the web server. Fortunately, both of these parts are free and
    on the CD included in the back of this book. The specific installation steps are
    different depending on whether you are installing on a Mac or a PC. Because most
    readers will be using a PC, I will explain in depth how to install it on Windows
    machines. Then I''ll give a few hints on how to install it for Macs.


    ## Installing PHP on Windows


    Installing PHP by itself will allow you to execute PHP files. At this point you
    can view them in a command-line prompt. This is rather annoying and ugly, so we
    are going to take an extra step to install a web server, which lets us view PHP
    files in a browser. We need to install the web server first. Let''s go over that
    before we work with PHP.


    Installing the web server is a pretty easy process on Windows, because the web
    server comes in one package and just need to open and install the files. The web
    server we are going to use is called Apache; it is free, common, and secure.


    ## What''s a web server?


    > The web server is an important part of using PHP. A web server (also called
    an HTTP server) is a process that runs on your computer and sends out web pages
    when a browser tries to access. Whenever you go to a site (such as www.maneeshethi.com),
    a web server is running on the domain and it returns the actual page that your
    browser sees. In effect, you are turning your machine into a web site by installing
    a web server.


    ## Installing the Web Server


    Follow these steps to install the web server:


    - Find the installation file.

    The CD contains one of the files, but you can also go to www.apache.org to find
    the most current version of the file. Figure 1.1 shows you what the site looks
    like. As you can see, it''s a pretty big site. Apache does a lot of things for
    the computer.


