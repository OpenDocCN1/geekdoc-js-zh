    \n`switch` 非常适合将一个变量与多个可能的值进行比较。`switch` 只在检查输入是否与某个值完全相同时才有效；你不能对其运行比较测试。它是比较变量与多个不同的已知值以查看是否发生某种情况的好方法。例如，你可以检查\
