    \ depending on input.\n\n## Branching Structures\n\nControl structures include\
    \ branching structures, which allow your program to make all these things:\n\n\
    - if... then decisions\n- Loops, which let execute some code repeatedly\n- Functions\
    \ that put specialized code into their own separate section\n\nWhen you run a\
