    实际的 `<form>` 标签本身有几个属性，这些是标签描述符。如下所示将属性放入 HTML 标签：


    ```

    <tagname attribute1="value" attribute2="value">

    ```


    `<form>` 属性如下：


    - method 解释数据传输的方式。我将在下一章中详细介绍这些方法。

    - action 解释数据被发送到哪里。通常，数据被发送到一个独立的 PHP 文件，由该文件处理数据。


    让我们定义一个表单，将 action 留空并将 method 设置 post。


    ```

    <html>

    <head>

    <title>示例表单</title>

    </head>

    <body>

    <h1>示例表单</h1>

    <br />

    <form action="" method="post">

    </form>

    </body>

    </html>

    ```


    你添加了一些写着“示例表单”的大号文本，它现在看起来像图 3.7。现在是时候添加一些表单元素了。两个文本框和一个文本区域怎么样？


    ## 什么是文本框和文本区域？


    文本框和文本区域是常见的 HTML 元素。它们允许用户直接在表单中输入文本。然而，这两个元素非常相似；例如，看看图 3.1：Name 和 Address 之后的元素是文本框，而
    Comments 之后的元素是文本区域。这两个之间的区别是什么？文本框只允许一行文本，空间不足以写实质性内容。通常，它用于编写如姓名、密码或地址等小信息。另一方面，文本区域可以缩放到任何大小，甚至和浏览器一样大！它们非常适合评论或故事。


