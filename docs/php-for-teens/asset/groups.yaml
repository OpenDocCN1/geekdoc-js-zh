    using a textbox, the type is text. The second attribute is a name, which is the
    variable that stores the textbox contents you use PHP. Let’s create the textbox
    now. Look at Figure 3.8 to see what it looks like to the user. (Remember that
    if a tag has a /> ending, it has no ending tag.)


