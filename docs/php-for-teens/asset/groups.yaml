    # What''s with the semicolon?


    If you have been looking closely at the PHP sections of code, you might have noticed
    that a semicolon appears after each statement. Why? Well, PHP is broken down into
    several statements, all of which do a different thing. You might write one statement
    that creates a variable, followed by another statement that deletes it, followed
    by another statement that reassigns the variable.'
