    # 引言

    嘿，欢迎来到《少年的 PHP》。我很高兴你拿起了这本书，我想告诉你你将开启一段奇妙的旅程。PHP 虽然易于学习，但它也是一种极其强大且实用的语言，这本书将教你制作动态网站所需的所有知识。


    那么 PHP 到底是什么意思？PHP 本身代表的是超文本处理器（Hypertext Processor）——真的听起来有点疯狂，因为这个名字本身就是缩写的一部分，就像没完没了一样！PHP
    也是经常用于现代网站和开发应用的编程语言。PHP 是可扩展的、强大的，并且与许多外部工具协同工作。PHP 也非常容易学习。


    那么你实际上用 PHP 能做什么？你可以通过创建人们可以填写和提交的表单让互联网变成一种交互体验，然后以你喜欢的方式处理数据。例如，访问者可以向网站管理员发送邮件，或者在网站发布评论，或者加入论坛。PHP
    真的让互联网变得更加可用。


    使用这本书，你只需要设计网站的基本知识。你不需要编程背景，但如果你以前做过编程，你会更快地理解这种语言。如果你对这本书有任何问题，可以随时发邮件给 manesh@example.com。

