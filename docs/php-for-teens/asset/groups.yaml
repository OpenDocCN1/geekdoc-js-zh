    我们已经启动了会话，接下来要做什么？尝试创建一个与第 12 章制作的页面，用户可以输入姓名并让页面在屏幕上显示该姓名。然而，我们将使用会话而不是 cookie
    来来实现。


    # 设计表单页面


    首先，我们需要设计一个表单页面。我们将使用一个与上章制作的相同的表单，看起来如图 13.3 所示。请查看 CD 盘上的 `phpft13-01.html`
    代码列表，或从 www.maneeshsethi.com 下载源码。


    # 开发基础 PHP 页面


    现在我们已经设置好了表单，是时候让我们的会话派上用场了！让我们从开发一个基础 PHP 页面开始，将用户的姓名保存到一个跨越不同页面的变量中。


    ![](img/fb76427b4bed9367f4a8810f090a7a37_209_0.png)


    图 13.3

    phpft13-01.html 文件。


    我们的新页面从介绍部分开始：


    ```php

    <?php

    session_start();

    header("Cache-control:private");

    ```


    注意，表单使用 POST 方法传递了用户名。


    现在我们需要分配一个会话变量来包含它传递的名字值。在其他章节中，你见过 `$_POST` 数组、`$_GET` 数组和 `$_COOKIE` 数组。所有这些数组都适用于它们类型的数据。猜猜会话数组是什么。你猜对了：`$_SESSION`。


    我们实际上自己定义 `$_SESSION` 数组的元素。`$_POST` 和 `$_GET` 数组是由 Web 服务器或之前的表单通过数组向我们发送数据的。而对于
    `$_SESSION`，没有数据需要下载；相反，由我们自己创建数组。


    我们将向数组添加一个元素，允许我们跨会话传输一些数据。我们将创建一个存储用户姓名的元素。下面的代码片段显示了如何操作：


    ```php

    $_SESSION[''name''] = $_POST[''name''];

    ```


    很不错吧？我们只是创建了 `$_SESSION` 数组的一个新元素，并将其赋值给 `$_POST` 数组提交的表单。通过这样做，我们创建了一个在整个会话期间持续的变量。既然如此，让我们更新一下
    `phpft13-01.php` 文件吧。


