    # # CHAPTER 14


    # ## WORKING WITH FILES


    This is the last chapter of the book, and we are going to be going out with a
    bang. In this chapter, I''m going to teach you how to deal with files in PHP.
    We will now be able to accept uploads, write to files, save information, and do
    other cool stuff.


    You might be thinking that this is exactly the same as cookies. Yeah, with cookies
    you can save some information about a user. However, you could only save a specific
    type of data; with file handling, you can save whatever information you like to
    the server. You can also let the user upload files directly to the server. File
    handling allows uploads and enables you to write to files on the user''s computer.


    # ### Allowing File Uploads


    You want a way for readers to communicate with you through your web site. This
    is commonly done through email, but sometimes the visitor may want to send something—a
    picture or a music file, perhaps. PHP allows you to upload a file through a form
    and send it to the web server. Let''s take a look at how to do this.


    Remember that when using forms you can choose either GET or POST. PHP file uploading
    works best with POST.'
