  - "[PAGE 167]\n\n```\necho $newarray[7] . '<br /> ';\necho $newarray[8] . '<br />\
    \ ';\necho $newarray[9] . '<br /> ';\necho $newarray[10] . '<br /> ';\necho $newarray[11]\
    \ . '<br /> ';\n?\n```\n\nNote that in this case, the months started with 0 and\
    \ ended with 12. Many times in programs it is easier to think of calendar months\
    \ 1–12, rather than 0–11. If you do this, you should probably create a blank month\
    \ at month 0 and start January off at array element 1.\n\nNumeric indices for\
    \ your array are really useful when you are going to loop through all of the data\
    \ and manipulate them. For example, in the golf example at the beginning of the\
    \ chapter, we stored the hole number as the key and the score on that hole as\
    \ a value. If we loop through all the holes from 1–18, we would get the final\
    \ full score! String indices are better for describing what is stored in the array,\
    \ such with $_GET[] arrays. You have string descriptors, so it is easier to see\
    \ what is stored in each example.\n\n# Use a Loop\n\nNow there is one more trick\
    \ involved with basic array creation and display. Notice how hard it is to type\
    \ out all those echo statements? Wouldn't it be easier if you could loop through\
    \ the array and display them all?\n\nThere is a special type of loop that does\
    \ this, but it is more powerful and we will be going over it later in this chapter.\
    \ For now, let’s use a basic for loop to make this program a lot easier to write.\
    \ The following code is from phppt10-04. Check out Figure 10.4, which shows what\
    \ this array looks like on the screen.\n\n```\n<?php\n$newarray = array(\"January\"\
    , \"February\", \"March\", \"April\", \"May\", \"June\",\n\"July\",\n\"August\"\
    , \"September\", \"October\", \"December\");\n\nfor ($i = 0; $i <= 11; $i++) {\n\
    \    echo $newarray[$i] . '<br />';\n}\n?\n```"
- md: "\n## Chapter 10 = Arrays\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_168_0.png)\n\
    \n**Figure 10.4**\nCreating array elements with a for loop phpft10-04.php.\n\n\
    See how this program works? A for loop goes through all the indices and elements\
    \ of an array, and displays them on the screen. It’s a lot easier than actually\
    \ writing out each element manually.\n\n## Working with Arrays\n\nThe following\
    \ functions let you use arrays in various ways throughout your program. When you\
    \ are done working with array values, sometimes it is nice to get rid of them\
    \ altogether. You might need to use them again later in the program, and want\
    \ to reuse the keys without worrying about overwriting data. PHP offers the\n\n\
    ## unset( ) Function\n\n### Working with Arrays\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_169_0.png)\n\
    \nFigure 10.5\nBefore using unset().\n\nunset() function to get rid of old array\
    \ values (or, for that matter, old arrays). The function unset() works by only\
    \ setting exactly the parameter you pass to it. Setting an array is useful for\
    \ memory management.\n\nIf you want to create an array with five values, you could\
    \ write something like the following, which ends up looking like Figure 10.5:\n\
    \n```php\n<?php\n\n$newarray[]=0;\n$newarray[]=1;\n$newarray[]=2;\n$newarray[]=3;\n\
    $newarray[]=4;\n\necho $newarray[0];\necho $newarray[1];\n```\n\n```php\necho\
    \ $newarray[2];\necho $newarray[3];\necho $newarray[4];\n```\n\nNow, let's use\
    \ unset() on this program:\n\n```php\n<?php\n\n$newarray[]=0;\n$newarray[]=1;\n\
    $newarray[]=2;\n$newarray[]=3;\n$newarray[]=4;\n\nunset($newarray[2]);\nunset($newarray[3]);\n\
    \necho $newarray[0];\necho $newarray[1];\necho $newarray[2];\necho $newarray[3];\n\
    echo $newarray[4];\n```\n\nAll we did here was add a couple of lines on unsetting\
    \ some array items. The result is in Figure 10.6.\n\nIf this program gives you\
    \ an error, that means that your server has its restrictions very high. This error\
    \ arises when you try to echo unset variables. However, this means it is working\
    \ correctly—an error should occur if your server has strict settings.\n\nThis\
    \ page can be found in phpft10-05.php on the CD. As you see, simply the unsetting\
    \ of variables made trying to echo them impossible, because they did not exist.\
    \ You could've gone one step further, however, and eliminated the entire array\
    \ by doing this:\n\n```php\nunset($newarray);\n```\n\n### Working with Arrays\n\
    \n![](img/fb76427b4bed9367f4a8810f090a7a37_171_0.png)\n\nFigure 10.6\nAfter using\
    \ unset() in phpppt10-05.php.\n\n## foreach Loop\n\nThe foreach loop is designed\
    \ distinctly for working with arrays, and if you know how to use it, you can do\
    \ many more things with arrays. foreach lets you choose any array that you have\
    \ designed and independently loop through every single item in the array. This\
    \ is great if you have developed an array of an unknown amount of items and simply\
    \ want to display the array’s contents as soon as possible.\n\nThe foreach loop\
    \ has two separate structures, both of which you can use at any time. The first\
    \ structure looks like this:\n\n```php\nforeach ($array as $value)\n{\n    //perform\
    \ statements\n}\n```\n\n## Chapter 10 = Arrays\n\nTake a look at that! I just\
    \ created a new loop that goes through every single one of the loop's elements\
    \ and allows me to access each one. The value $arrayname is the name of the array,\
    \ and $valuename is an arbitrary variable that is assigned to each individual\
    \ value of the loop in iteration.\n\nLet's see how we might use this. Let's go\
    \ back to the web page we made earlier, phpppt10-03.php. In this script, we developed\
    \ a page that would display each month of the year. We used a dozen echo commands\
    \ to display each one. However, using the foreach loop, could we do this much\
    \ quicker—more quickly, in fact, as a basic for loop like the one we developed\
    \ in phpppt10-04.php. Check out Figure 10.7 and look at the code that would do\
    \ this. This page is phpppt10-05.php on the CD.\n\n```html\n<!DOCTYPE html \"\
    -//W3C//DTD HTML 1.0 Strict//EN\"\n\"http://www.w3.org/TR/DTD/xhtml1-strict.dtd\"\
    >\n\n<html>\n<head>\n<title>Using a foreach loop</title>\n</head>\n\n<body>\n\n\
    <?php\n$newarray = array(\"January\", \"February\", \"March\", \"April\", \"May\"\
    , \"June\",\n\"July\", \"August\", \"September\", \"October\", \"November\", \"\
    December\");\n\n$variablecounter = 1;\nforeach ($newarray as $month) {\n    echo\
    \ \"We have iterated through the loop $variablecounter times \";\n    echo $month\
    \ . \"<br />\";\n    $variablecounter++;\n}\n\n?>\n\n</body>\n</html>\n```\n\n\
    ### Working with Arrays\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_173_0.png)\n\
    \n```\nWe have iterated through the loop 1 times: January\nWe have iterated through\
    \ the loop 2 times: February\nWe have iterated through the loop 3 times: March\n\
    We have iterated through the loop 4 times: April\nWe have iterated through the\
    \ loop 5 times: May\nWe have iterated through the loop 6 times: June\nWe have\
    \ iterated through the loop 7 times: July\nWe have iterated through the loop 8\
    \ times: August\nWe have iterated through the loop 9 times: September\nWe have\
    \ iterated through the loop 10 times: October\nWe have iterated through the loop\
    \ 11 times: November\nWe have iterated through the loop 12 times: December\n```\n\
    \nFigure 10.7\nUsing the foreach loop in phpppt10-05.php.\n\nPretty cool, huh?\
    \ We developed the same item and used a variable to actually count the number\
    \ of times we looped through the loop. The counter increments each time the loop\
    \ occurs. This is a lot easier than using the basic for loop, huh? Let's take\
    \ a look at the other structure you can use for defining foreach loops in your\
    \ programs:\n\n```php\nforeach ($array as $keyname => $valname)\n{\n    //perform\
    \ statements\n}\n```\n\nA little different declaration. The only major difference\
    \ here is that we added $keyname now we can figure out the keys as well as the\
    \ values. This structure is great for using forms. Let's see a sample. We could\
    \ develop a form that has several items. It can then display the keys and values\
    \ to help understand which fields the user decided to leave blank. Create a sample\
    \ form. The following code comes from phpppt10-06.html:\n\n```html\n<!DOCTYPE\
    \ html \"-//W3C//DTD HTML 1.0 Strict//EN\"\n\"http://www.w3.org/TR/DTD/xhtml1-strict.dtd\"\
    >\n\n<html>\n<head>\n<title>Using a form with foreach</title>\n</head>\n\n<body>\n\
    <form name=\"sampleform\" action=\"#phpppt10-06.php\" method=\"get\">\n<h2>Please\
    \ enter in the following information. All fields are optional.</h2>\nName: <input\
    \ type=\"text\" name=\"name\">\n<br>Address: <input type=\"text\" name=\"address\"\
    >\n<p>Phone number:\n<br><input type=\"text\" name=\"phone\">\n<br>I <input type=\"\
    radio\" name=\"prefer\" value=\"cheese\">Cheese\n<br>b <input type=\"radio\" name=\"\
    prefer\" value=\"bread\">Bread\n<br>c <input type=\"radio\" name=\"prefer\" value=\"\
    meat\">Meat\n<input type=\"submit\">\n</form>\n\n</body>\n</html>\n```\n\nThis\
    \ page creates a nice-looking form with radio buttons. Check out what this looks\
    \ like in Figure 10.8. Let’s look at the PHP section of phpppt10-06.php, which\
    \ displays the results using PHP:\n\n```html\n<!DOCTYPE html \"-//W3C//DTD HTML\
    \ 1.0 Strict//EN\"\n\"http://www.w3.org/TR/DTD/xhtml1-strict.dtd\">\n\n<html>\n\
    <head>\n<title>Using a foreach loop with forms</title>\n</head>\n\n<body>\n```\n\
    \n<body>\n\n### Working with Arrays\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_175_0.png)\n\
    \nPlease enter in the following information. All fields are optional.\n\nName:\
    \ Maneesh Sethi\nAddress: manesh@maneshsc\nPhone number:\n\n- I prefer\n- a) Cheese\n\
    - b) Bread\n- c) Moat\n\nFigure 10.8\nCreating a form for phpppt10-06.html.\n\n\
    ```php\n<?php\n$counter = 1;\nforeach($_GET as $keyvalue => $realvalue) {\n  \
    \  echo \"Loop has iterated $counter times: \";\n    echo \"Key: $keyvalue has\
    \ value: $realvalue\" . '<p>';\n    $counter++;\n}\n?>\n</body>\n</html>\n```\n\
    \n## Chapter 10 = Arrays\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_176_0.png)\n\
    \nLoop has iterated 1 times: Key: name has value: Maneesh Selhi\nLoop has iterated\
    \ 2 times: Key: address has value: manesh@maneshsheti\nLoop has iterated 3 times:\
    \ Key: phone has value:\nLoop has iterated 4 times: Key: prefer has value: cheese\n\
    \nFigure 10.9 phpft10-06.php.\nDisplaying results in\n\nThis ends up looking like\
    \ Figure 10.9.\n\nWhooa, look at that. The page displays the proper results by\
    \ showing the key value and the real value of each element in the $_GET array.\
    \ Remember that the $_GET array actually is a predefined container that holds\
    \ all of the elements submitted through the GET method on a form. When we used\
    \ the form on the last page, we sent all information through GET to the new page.\
    \ This page then took that data and looped through each element of the array,\
    \ displaying the key value and the real value on the screen. With that, we got\
    \ the results we wanted!\n"
  mdcn: "\n\n## 第 10 章 数组\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_168_0.png)\n\
    \n**图 10.4**\n使用 for 循环创建数组元素 phpft10-04.php。\n\n看看这个程序是如何运行的？一个 for 循环会遍历数组的所有索引和元素，并将它们显示在屏幕上。这比实际上手动写出每个元素要简单得多。\n\
    \n## 数组操作\n\n以下函数允许你在程序中以各种方式使用数组。当你完成对数组值的操作后，有时将它们完全丢掉会很好。你可能在程序的稍后部分再次使用它们，并希望在不担心覆盖数据的情况下重用键。PHP\
    \ 提供了\n\n## unset( ) 函数\n\n### 数组操作\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_169_0.png)\n\
    \n图 10.5\n在使用 unset() 之前。\n\n使用 unset() 函数来移除旧的数组值（或者，旧的数组）。unset() 函数通过仅设置你传递给它的精确参数来工作。设置数组对于内存管理很有用。\n\
    \n如果你想创建一个五个值的数组，可以编写类似下面的代码，它最终看起来就像图 10.5：\n\n```php\n<?php\n\n$newarray[]=0;\n\
    $newarray[]=1;\n$newarray[]=2;\n$newarray[]=3;\n$newarray[]=4;\n\necho $newarray[0];\n\
    echo $newarray[1];\n```\n\n```php\necho $newarray[2];\necho $newarray[3];\necho\
    \ $newarray[4];\n```\n\n现在，让我们在这个程序上使用 unset()：\n\n```php\n<?php\n\n$newarray[]=0;\n\
    $newarray[]=1;\n$newarray[]=2;\n$newarray[]=3;\n$newarray[]=4;\n\nunset($newarray[2]);\n\
    unset($newarray[3]);\n\necho $newarray[0];\necho $newarray[1];\necho $newarray[2];\n\
    echo $newarray[3];\necho $newarray[4];\n```\n\n我们在这里所做的只是增加了几行取消某些数组项的代码。结果在图\
    \ 10.6 中。\n\n如果这个程序给你一个错误，这意味着你的服务器限制非常高。当你尝试 echo 未设置的变量时会出现此错误。然而，这意味着它运行正常——如果你的服务器设置了严格设置，应该发生错误。\n\
    \n此页面可以在光上的 phpft10-05.php 中找到。如你所见，仅仅取消变量就让尝试 echo 它们变得不再可能，因为它们不存在了。不过，你可以更进一步，通过这样做消除整个数组：\n\
    \n```php\nunset($newarray);\n```\n\n### 数组操作\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_171_0.png)\n\
    \n图 10.6\n在 phpppt10-05.php 中使用 unset() 之后。\n\n## foreach 循环\n\nforeach 循环专门设计用于处理数组，如果你知道如何使用它，你就可以对数组做更多事情。foreach\
    \ 允许你选择你设计的任何数组，并独立地遍历数组中的每一个项目。如果你开发了一个未知数量项目的数组，并且只想尽快显示数组的内容，那么这就太棒了。\n\nforeach\
    \ 循环有两个独立的结构，你都可以随时使用其中任何一个。第一种结构看起来如下：\n\n```php\nforeach ($array as $value)\n\
    {\n    //执行语句\n}\n```\n\n## 第 10 章 数组\n\n看这里！我刚刚创建了一个新循环，它会遍历循环的每一个元素，并允许我访问每一个元素。$arrayname\
    \ 是数组的名称，而 $valuename 是任意变量，在每次迭代中被赋值给循环的每个单独值。\n\n让我们看看可能如何使用它。回到我们之前制作的网页 phpppt10-03.php。在这个脚本中，我们开发了一个显示一年中每个月的页面。我们使用了十几个\
    \ echo 命令来显示每一个月份。然而，使用 foreach 循环，我们是否可以快得多地完成此任务——事实上，这比我们在 phpppt10-04.php\
    \ 中开发的基本 for 循环还要快。查看图 10.7 并查看实现此操作的代码。该页面是光上的 phpppt10-05.php。\n\n```html\n\
    <!DOCTYPE html \"-//W3C//DTD HTML 1.0 Strict//EN\"\n\"http://www.w3.org/TR/DTD/xhtml1-strict.dtd\"\
    >\n\n<html>\n<head>\n<title>Using a foreach loop</title>\n</head>\n\n<body>\n\n\
    <?php\n$newarray = array(\"January\", \"February\", \"March\", \"April\", \"May\"\
    , \"June\",\n\"July\", \"August\", \"September\", \"October\", \"November\", \"\
    December\");\n\n$variablecounter = 1;\nforeach ($newarray as $month) {\n    echo\
    \ \"We have iterated through the loop $variablecounter times \";\n    echo $month\
    \ . \"<br />\";\n    $variablecounter++;\n}\n\n?>\n\n</body>\n</html>\n```\n\n\
