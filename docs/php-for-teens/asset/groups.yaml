- md: "\n## Chapter 4 = Writing the PHP in Your First Program\n\n```html\n<input type=\"\
    reset\" name=\"resetbutton\" /></p>\n</form>\n```\n\n```html\n<body>\n</html>\n\
    ```\n\nIf you want to make the page pass the data directly back to itself, you\
    \ can generally make it follow this template:\n\n```html\n<form name=\"sampleform\"\
    \ method=\"post\">\n...\n</form>\n```\n\nWe remove the action attribute, and the\
    \ data from this web page is passed to itself! What does this mean? All the data\
    \ typed into the form are stored in specific variables. Some pages might just\
    \ display the user typed, other pages might add two numbers, and so on. The most\
    \ important thing to remember is that any PHP page must have the extension .php,\
    \ not .html. Rename the page from Chapter 3 firstphpprogram.php.\n\nIf you want\
    \ to send its data to a program called something.php, modify the action attribute\
    \ so it looks like this:\n\n```html\n<form name = \"sampleForm\"\nmethod = \"\
    post\"\naction = \"something.php\"\n```\n\nUnfortunately, the page doesn't do\
    \ anything with the data yet because we haven't put in any code that handles it!\
    \ No PHP in this case is kind like throwing a football over a wall and hoping\
    \ someone is to get it. Without PHP, there is no one to retrieve or use the ball\
    \ because we haven't created him. With PHP, we can design someone to be on the\
    \ other side of the wall and tell them what to do with the ball.\n\nHow do you\
    \ code PHP? Well, because this is your first experience, and because I go over\
    \ all of this depth later in this chapter, I give just a very quick layout here.\
    \ When you insert <?php ?> tags around it, the web server immediately recognizes\
    \ that it is PHP info and starts running the PHP program. After the code has run,\
    \ the web server puts together the PHP and the HTML into one document that becomes\
    \ the final web site that the user sees. So let’s add these brackets.\n\n## Writing\
    \ the PHP in Your First Program\n\nAdd these PHP tags in directly after the <h1>\
    \ section that says Sample Form. Now our page looks like this:\n\n```html\n<body>\n\
    <h1>A Sample Form</h1>\n<?php ?>\n<br />\n<form action=\"\" method=\"post\">\n\
    Name: <input type=\"text\" name=\"fullname\" />\nAddress: <input type=\"text\"\
    \ name=\"address\" /><br <br />\nComments: <textarea name=\"comments\" cols=\"\
    40\" rows=\"2\"></textarea><br /><br />\n<input type=\"submit\" name=\"submitbutton\"\
    \ />\n<input type=\"reset\" name=\"resetbutton\" />\n\n</form>\n</body>\n```\n\
    \nNote that <?php ?> tags are not symmetrical like normal HTML tags. The web browser\
