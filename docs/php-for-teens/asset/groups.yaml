- md: "\n## Dissecting a Function\n\n```html\n<!DOCTYPE html PUBLIC \"//W3C//DTD HTML\
    \ 1.0 Strict//EN\"\n  \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\">\n\
    <html>\n<head>\n  <title>Using parameters on a running number counter</title>\n\
    </head>\n<body>\n\n<form name=\"together\" action=\"phpft09-03.php\" method=\"\
    get\">\n  Enter your first number: <input type=\"text\" name=\"firstop\">\n  <p>Enter\
    \ your second number: <input type=\"text\" name=\"secondop\">\n  <p><input type=\"\
    submit\">\n</form>\n</body>\n</html>\n```\n\nNow display the result of the two\
    \ numbers in the following PHP document:\n\n```php\n<!DOCTYPE html PUBLIC \"//W3C//DTD\
    \ HTML 1.0 Strict//EN\"\n  \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\"\
    >\n<html>\n<head>\n  <title>Using a running counter with functions</title>\n</head>\n\
    <body>\n```\n\nThis page is designed to add up all the numbers between the numbers\
    \ you provided.<br>Please wait, your numbers are being tabulated below.\n\n```php\n\
    <?php\n\n  $first = $_GET['firstop'];\n  $second = $_GET['secondop'];\n\nif ($second\
    \ > $first) //if the second number is larger than the first, execute\n  the program\
    \ as it should run\n{\n  echo '<p>Your result is ' . running_counter($first,$second);\n\
    \  echo \"<br>Thanks for using our program!\";\n}\nelse //the second number is\
    \ not larger than the first, error\n{\n  echo \"<p><font color=\\\"red\\\"> Your\
    \ second number is not larger than the first number, please fix and try again.</font>\"\
    ;\n}\n\nfunction running_counter($first,$second)\n{\n  $runningcounter=0;\n  for\
    \ ($x=$first; $x <= $second; $x++) {\n    $runningcounter = $runningcounter +\
    \ $x;\n  }\n  return $runningcounter;\n}\n\n?>\n</body>\n</html>\n```\n\nPretty\
    \ tricky, huh? This function lets you find the sum of any two arbitrary numbers\
    \ using a simple for loop. Check out Figure 9.5. The figure shows the result using\
    \ the numbers 13 and 314. The result, as shown, is the sum of every number between\
    \ 13 and 314. Doing this by hand would take forever!\n\nThe program has a basic\
    \ body, utilizing the main section to access the variables and echo calls takes\
    \ two parameters, $first and $second results, and uses these parameters to return\
    \ a sum. This function could be used in any program that needs the sum of all\
    \ digits between two numbers.\n\n## Dissecting a Function\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_155_0.png)\n\
    \nThis script will convert your first number to another.\n\nEnter your first number:\n\
    \n| | Celsius | Fahrenheit |\n|---|---|---|\n| | | |\n\nChoose what you would\
    \ like the degree to be converted to:\n\nDone\n\n**Figure 9.5** phpft09-03.php.\n\
    \nThat we called the function with variables $first and $second, and the function\
    \ used variables of the same name. This is not required. We can pass whatever\
    \ parameters we want into the function, and the values that we pass are copied\
    \ into the variable names of the function declaration. We could have chosen to\
    \ simply pass $_GET['first'] and $_GET['second'] rather than ever turning them\
    \ into the scalar variables $first and $second. We converted the $_GET variables\
    \ because they a lot easier to handle without the bracketed array syntax and their\
    \ names are more intuitive.\n\nThe real strength of using functions comes from\
    \ their portability. Because a function can be written so that it does not rely\
    \ on any variables of the program, you can simply lift that function out of this\
    \ script and use it on another. If you ever write another program that requires\
    \ a counter, you can use this same function without modification. In fact, a lot\
    \ of programmers take all of their commonly used functions and build a library\
    \ file with them. Then, whenever they need to perform a task, they simply load\
    \ up the library file and call the already written function.\n\nOf course, not\
    \ all functions are portable because of something called variable scope. When\
    \ using variables, the program can only access a subset of the variables that\
    \ are created. For example, if you have a $test_var in function DoA(), another\
    \ function DoB() cannot access that $test_var unless the variable is passed as\
    \ a parameter to DoB(). Some arrays that are defined by the language, such as\
    \ $_GET and $_POST, are global to all functions. However, for functions you develop\
    \ on your own, be careful to make sure you only access and use variables in scope.\n\
    \n## For the mathematically minded\n\nIf you look at the program we created, you\
    \ can see its pretty ugly way to get a sum of all the numbers between arbitrary\
    \ endpoints. We use a mechanism that actually loops through each value and adds\
    \ it to a running counter. A few mathematical functions will produce the correct\
    \ result without the ugly loops. But for very large sums, this program could take\
    \ a while. To get the sum from this series, there is a cool mathematical formula\
    \ sum how it appears: S(n) = n/2 * (a(1) + a(n)), where n is the total of numbers\
    \ you want to add, a(1) is the first number, and a(n) is the final number. If\
    \ you want to find the sum of the first four of the series we wrote, you would\
    \ get this: S(4) = 4/2 * (1 + 4) = 16. If you use this formula in your calculation,\
    \ the answer will be achieved more quickly.\n\nSo what is the point? Just because\
    \ a solution works doesn't mean it is the fastest or best to do something. Things\
    \ go much faster if you find a better algorithm.\n\n## Calling Function Depending\
    \ on a Condition\n\nSometimes you need to call a function depending on a condition.\
    \ In a program you don't need to call all of them every run but we may need to\
    \ call a few depending on the situation. One of the best examples is when you\
    \ need to convert Celsius to Fahrenheit or vice versa: degree calculator. The\
    \ first thing to do is design the HTML page. You can find this on phpft09-04.html.\n\
    \n```html\n<!DOCTYPE html PUBLIC \"//W3C//DTD HTML 1.0 Strict//EN\"\n  \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\"\
    >\n<html>\n<head>\n  <title>Degree Calculator</title>\n</head>\n<body>\n<form\
    \ name=\"together\" action=\"phpft09-04.php\" method=\"get\">\n  <p>This script\
    \ will convert one degree measurement to another.</p>\n  <p>Enter your first number:\
    \ <input type=\"text\" name=\"firstdeg\"></p>\n\n<select name=\"firsttype\">\n\
    \  <option value=\"celsius\">Celsius</option>\n  <option value=\"fahrenheit\"\
    >Fahrenheit</option>\n</select>\n\n<p>Choose what you would like the degree to\
    \ be converted to:</p>\n\n<select name=\"secondtype\">\n  <option value=\"celsius\"\
    >Celsius</option>\n  <option value=\"fahrenheit\">Fahrenheit</option>\n</select>\n\
    \n<p><input type=\"submit\"></p>\n</form>\n</body>\n</html>\n```\n\nThis page\
    \ looks like Figure 9.6. You might be wondering why we allow the input to choose\
    \ what the degree measurement to. Why not automatically choose to Fahrenheit if\
    \ she selects? This allows for expandability. If you want to let the user convert\
    \ to a different degree measurement, such as Kelvin, you can easily add this without\
    \ changing the HTML page very much. The PHP for this page is complex and involves\
    \ a lot of functions. Let’s go through the major parts one at time. The first\
    \ section involves setting up the HTML and synchronizing the variables.\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_158_0.png)\n\
    \nFigure 9.6\nConversion form in phpft09-04.html.\n\n```php\n<!DOCTYPE html PUBLIC\
    \ \"-//W3C//DTD HTML 1.0 Strict//EN\"\n  \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\"\
    >\n<html>\n<head>\n  <title>Conversions of degrees</title>\n</head>\n<body>\n\n\
    We are going to convert your value as you requested. Please wait.<p>\n\n<?php\n\
    \n$a = $_GET['firstdeg'];\n$firstdeg = $_GET['firsttype'];\n$seconddeg = $_GET['secondtype'];\n\
    ```\n\n## Calling Function Depending on a Condition\n\nThis section creates the\
    \ page and sets up basic variables for the remainder of the program. We use the\
