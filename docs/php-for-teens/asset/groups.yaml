    >\n<html>\n<head>\n<title>开发带 cookie 的页面</title>\n</head>\n\n<body>\n请在下面的文本框中输入你的名字并提交。注意，如果你在过去的几周内输入过名字，那个名字将被新名字删除。\n\
    <p>\n<form name=\"cookie\" action=\"phpft12-01.php\" method=\"post\">\n在这里输入你的名字：\n\
    <input type=\"text\" name=\"name\" />\n<p>\n<input type=\"submit\" />\n</form>\n\
