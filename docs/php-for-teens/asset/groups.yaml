    # CHAPTER 5


    # CONSTANTS, EXPRESSIONS, AND OPERATORS


    In this chapter, we are going to go over some of the language basics. You use
    constants, expressions, and operators in a lot of programs and web pages, so it
    is very important to learn all about them. Let''s move forward and work with them.
    Ready?


    ## Constants


    Constants are an important concept to learn because they can make your programs
    lot safer. Imagine a program that converts hours into days. You might have a hourDay
    constant that always equals 24. You can define constants, but once they are defined
    they can never be redefined or undefined. Unlike variables, constants never change
    throughout the entire program. Use constants whenever, for instance, you have
    a value you want to multiply all inputs by or a known natural constant as pi.
    Because the program cannot change the constant''s value, it is guaranteed to work
    correctly.


    You define constants differently than you do variables. With variables, you simply
    do something like this:


    ```

    $variable = value;

    ```


    You can change the value again just by doing something like this:


    ```

    $variable = newvalue;

    ```


    # Chapter 5 = Constants, Expressions, and Operators


    Makes sense, right? Well, with constants, it is a little different. Defining a
    constant requires the use of a function called define(). You need to pass two
    parameters to the define() function for it to. The first parameter is the name
    of the constant, and the second is the constant''s value. The function is defined
    like this:


    ```

    define("CONSTANTNAME", constantvalue);

    ```


    Here are a few defined sample constants:


    ```

    define("BOOLEANCONSTANT", TRUE);

    define("INTEGERCONSTANT", 768);

    define("FLOATCONSTANT", 469.12);

    define("STRINGCONSTANT", "I am a string!");

    ```


    Pretty cool, huh? I only defined these four types of constants (Boolean, integer,
    float, and string) because they are the only valid types of constants. Constants
    can be defined anywhere in your program and are accessible without regard to scope.


    Another difference between constants and variables: When using a variable, you
    can use a $sign. For example, to print out a variable on the screen, you might
    do this:


    ```

    echo $variab;

    ```


    However, constants are referred to simply by name; they do not need a symbol.
    To display a constant on the screen, you would probably do something like this:


    ```

    echo CONSTANTNAME;

    ```


    Constants are like variables in that they are case sensitive. Make sure you pay
    attention to their capitalization. You can capitalize all the letters (as I have
    been doing, simply for stylistic purposes) or you can choose lowercase letters.
    whenever you reference your constants in the program, make sure that you use the
    correct capitalization scheme. For example, say you write a program that defines
    NAME as Smith, and the program echoes it on the screen. You need to echo it with
    the correct capitalization. What happens when we echo incorrectly?


    ```

    <?php

    define("NAME".Smith");

    echo name;

    ?>

    ```


    There is an apparent error in this page. We created the constant to be named NAME.
    However, we displayed the variable name, which has not been created yet. Figure
    5.1 shows you the results.


    ![](img/fb76427b4bed9367f4a8810f090a7a37_89_0.png)


    ### ### Figure 5.1 phpft05-01.php incorrect constant file.


    We see how it displays name rather than the correct value? PHP assumes that if
    we have not created a constant for the value echo, it should echo it as a string.
    Therefore, we rewrite it so that it uses the correct capitalization and check
    out the results in Figure 5.2.


    ```

    <?php

    define("NAME", "Smith");

    echo NAME;

    ?>

    ```


    ## Operators


    An operator is a helper in PHP that deals with one or more values. This may seem
    vague, but operators are everywhere. Think about math. There are three classes
    of operators.


    > Note


    Even though functions act upon data, we generally don''t think of functions as
    operators. We consider functions to be their own type of construction, and just
    deal with PHP default operators.


    ## Unary


    A unary operator acts only upon input. For example, the ++ operator increments
    a variable by 1. For example, assume you type the following:


    ```

    $x = 10

    $x++;

    $echo $x;

    ```


    You get the result 11.


    ## Binary


    Binary operators act upon two pieces of data. Think about the addition problem.
    There were two pieces of data: 5 and 7. Both of these, along with the operator
    +, achieve a new result. Binary operators include arithmetic operators such as
    multiplication and division, and well as testing operators as greater than or
    less.


    ## Ternary


    There is only ternary operator. This is a little weird if you have never seen
    it before, and it is used a lot less than the binary operators, but it can be
    powerful when used correctly. The operator is called the ?: operator because it
    works with three sets of data. The first set comes before the question mark, and
    it is a test; for example, x>$y determines whether $x is greater than $y.


    *   If the test is true, the result is after the question mark (but before the
    colon).

    *   If the test is false, the result is after the colon.


    Before going into the rest of the operators, look at an example using the ternary
    operator. If you want to do the same test to check if $x is larger than $y, you
    might want to echo out the results. Take a look at the following PHP document,
    then check out Figure 5.3 to see the result:


    ```

    <!DOCTYPE html ////W3//DTD HTML 1.0 Strict//EN">

    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">

    <html

    <head>

    <meta http-equiv="content-type" content="text/html; charset=utf-8" />

    <title>Using the ternary operator</title>

    </head>

    </html>

    ```


    ## Chapter 5 = Constants, Expressions, and Operators


    ![](img/fb76427b4bed9367f4a8810f090a7a37_90_0.png)


    ### Figure 5.2 phppt05-02.php correct constant file.


    taking in two values (7 and 5, for example), adding them together (12). In this
    case, the plus sign is the operator. Think about the gettype() function that we
    went over in 4. This function takes in a variable and returns its type. This function
    is an operator because it takes in a value (the variable) and results in something
    different (a type). Sure, these two pieces of data may be different, but the function
    acts upon it!

