    GET 和 POST 的区别。


    ## GET 与 POST


    在所有表单中，你都有使用 GET 或 POST 的选项。两种情况下都有用，所以你应该知道它们之间的区别。使用 GET 表单时，所有变量数据通过 URL 地址栏传递。这意味着你可以通过
    URL 查看变量及其值。相反，POST 会从地址栏隐藏所有变量——它们被透明地传递给 PHP 程序。


    例如，假设你在 .something.com/page.php 使用 GET 表单，在输入变量并提交后，地址栏可能如下：


    ```

    http://www.something.com/page.php?first=value1&second=value2

    ```


    在这种情况下，表单上有两个字段：第一个字段设置为 first，用户在文本框中输入 value。第二个字段是 second，值为 value2。正如你看到的，所有数据都在地址栏中传递。


    所以你会用哪一个？在某些情况下，不通过地址栏传递数据是为了确保安全的。例如，如果你不想让密码显示在地址栏中，请使用 POST。或者，如果你想让用户能够书签页面，使用
    GET。


    ## 数组


    为了访问预定义变量，我们必须使用数组。数组是具有相同名称的变量，但通过特定的数字引用。数组看起来和普通变量一样，只是在名称末尾附加了数字。例如，普通变量可能被称为
    $name，而三个数组看起来像：$name[0], $name[1], $name[2]。此外，数组可以使用单词而不是数字——例如，$name["first"]
    或 $name["second"]。


    你可以通过几种方式创建自己的数组。最简单的方法是定义数组的每个项。例如，创建几个 $name 变量，我们可以这样做：


    ```php

    $name[0] = "Mesh";

    $name[1] = "John";

    $name[2] = "Smith";

    ```


    还有更快的方法。你可以在创建数组的同时向它添加值。做法如下：


    ```php

    $name = array(key => value);

    ```


