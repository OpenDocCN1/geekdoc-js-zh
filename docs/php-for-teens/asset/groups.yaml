    # ACKNOWLEDGMENTS


    There are a lot of people to thank for this work. Really


    First of all, I want to thank my parents, Neelam and Prab Sethi. My brother was
    a big help to me with surviving this year; thanks Ramit. My sisters Nagina and
    Rachi are awesome, and I love you both so much.


    Thanks to Emi Smith, my acquisitions editor, Tonya Cupp, my copy editor, and Andy
    Harris and Christopher McCullough, my team editors. Everyone else at Course PTR—you
    are great.


    Lastly, my friends: A lot you guys. I want to give special thanks to my classmates
    during the writing of this book, Nate Foorman and Arthur Kaneko (The Polan too,
    sort of). Also, many thanks to David Weekly for his help programming and all sorts
    of computer stuff.


    To everyone else, and Lauren Choi: Thanks so much for your help! Keep in touch!


    # ABOUT THE AUTHOR


    Maneesh Sethi is a student at Stanford University in Palo Alto, California. As
    a high-school student, he founded Standard Design, a website design company, and
    Cold Vector Games, a game development team. Maneesh has authored the international
    best-seller Game Programming for Teens and Web Design for Teens, and his new book
    How to Succeed as a Lazy Student is in the works.


    Additionally, Maneesh lectures on game programming and design at various conferences
    around the country. You can learn more at www.maneeshsethi.com or visit his blog
    at www.lazymot.com.'
