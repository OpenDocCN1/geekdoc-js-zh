    ## 我需要更改页面背景颜色。


    你可以使用 `<body style="">` 内的 `background-color: color` 样式属性来实现。如果你想让背景变为黑色，可以使用
    `<body style="background-color: black; color: white">`。请记住，将背景颜色设置为黑色会导致你的黑色文本几乎消失。请确保你将文本的字体颜色更改为
    "color: white" 或在黑色上易可见的颜色。


    要更改字体，你需要使用 `font-face` 样式属性。你可以在 `font-face` 属性的引号内更改想要使用的 `font-face` 。例如，编写以下内容会将文本设置为
    Courier 字体，前提是用户机器上可用该样式：


    ```

    <span style="font-face:courier">我是 Courier 字体！</span>

    ```


    ## 杂项实用标签


    你可能需要在不实际使用新段落的情况下换文本的新行。`<br />` 可以实现此点。标签末尾的正斜杠让网络浏览器知道没有结束标签。


    如果你想插入图像，可以使用 `<img>` 函数。当该函数使用 `src` 属性时，它允许你将图像插入到页面中。要添加位于 HTML 文件相同目录下的 `image.jpg`，你可以像这样做：


    ```

    <img src="image.jpg" />

    ```


    此外，如果你使用 `alt` 属性，可以使图像在用户将鼠标悬在图像上时显示文本。`alt` 标签指的是“备用（alternate）”，当用户在浏览器中关闭图像时可能会出现。请确保
    `alt` 文本描述了图像。你可以像这样做：


    ```

    <img src="tree.jpg" alt="一棵树的照片" />

    ```


    此标签不需要结束标签。请记住，你能够安全显示的图像类型只有 .bmp、.jpg、.gif 或 .png。


    那种类型的 HTML 经常被用作链接，可以帮助你从一个页面或网站导航到另一个。这是通过 `<a href="...">` 实现的。


    `<a>` 标签，其中 `href` 属性指向被引用项目的位置。如果你引用的是外部网站，需要在前面加上 http://。它看起来像如下：


    ```

    <a href="http://www.somethinganexternalsite.com">点击此处查看外部网站上的页面</a>

    ```


    或者你可能想链接到你自己网站上的另一个页面：


    ```

    <a href="page2.html">点击此处访问第 2 页面</a>

    ```


    在下一章中，你将学习 HTML 表单，这是 PHP 的重要部分。之后，你实际上将开始编写一些真正的 PHP 代码。


    ## 注意


    我没有在本章中介绍每一个编程结构。例如，我跳过了表格。表格在 HTML 中非常重要，但在 PHP 中并不那么重要。正因如此，只有当你之后在本书的的某些示例中绝对需要使用表格时，我才会教你。


