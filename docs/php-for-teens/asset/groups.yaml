    Now add the second field. Do exactly same: Write the text on the screen (Address:),
    then create a textbox with the name value set to address. So far, good? The result
    should look a lot like Figure 3.9.


    # A Sample Form


    ![](img/fb76427b4bed9367f4a8810f090a7a37_57_0.png)


    ## Figure 3.9


    Adding the second textbox.


    We have just created the beginning of a web page that allows the reader to add
    some data. So, she can enter her name and address, but we still need to create
    a text area so she can put in some comments about the site. Let''s do that with
    a text area. Text areas are not much more difficult than textboxes. However, they
    have a few more options: You can specify their width and height. Before creating
