    $destinationdirectory = ''C:\PHP\uploads\''; //Can be any directory on the server

    $ = $updirectory. basename($FILES[''file''][''name'']);

    ```


    This makes sense, right? We just created a string, $myfile, as the final $destination.
    You might have noticed this function, $basename(). This function removes any directory
    structure from a filename and returns the actual filename. So, if you were to
    input basename(''C:\windows\desktop\index.html''), the function would return index.html
    as a string.


    # Note


    This program only works if you have your directory set to read/write by anyone.
    If you are using a UNIX server, you must chmod the final directory to 777. Otherwise,
    make sure anyone has read/write privileges on the directory.


    Now that we have this string created, we can use the move_uploaded_file() function!
    Two cool things to note:


    +   - If you use this function and it returns an error (for whatever reason),
