    # INTRODUCTION

    If you are holding this in your hand, you probably have some knowledge about the
    web—either someone asked you to buy this book for them. Whatever the case, you
    have found a gold mine! From this book you learn the secrets of dynamic web sites
    with PHP.


    What is dynamic content? Making site based on given information (hence the word
    dynamic). Perhaps you want to make a site where you can store all their favorite
    links. Well, with PHP, you can offer different links to each user, PHP gives you
    total control.


    # Who This Book Is For

    You probably know better than I do who this book is for, but let me tell you what
    I think: You are a beginning programmer, with little or no background in PHP.
    You are willing to take the time to learn PHP by following this book closely and
    trying to make programs of your own. Your experience obviously has to fit exactly.
    What is the minimum knowledge you need to succeed here? You should be able to
    operate a computer well. If you can use your PC or Mac without any major difficulties,
    you will probably do fine in this book. This book is paced for a beginner, but
    you can find Linux instructions on www.php.net. If you ever have any problems
    with any of this, feel free to email me at manesh@example.com.


    # How This Book Is Organized

    The first few chapters introduce design and give a brief overview of the PHP language.
    You get a fast review of HTML and some PHP form design. You learn about variables,
    constants, and operators. Then I begin talking about advanced PHP. You learn about
    controlling program flow through loops and control statements, organizing with
    functions, and enhancing web scripts with strings and arrays. Starting with the
    chapter on cookies, you get into some advanced topics. You are introduced to sessions
    and file handling. Finally, you get to the appendices, which list all the functions
    throughout the book, as well as external resources and what is on the CD.


    All the source in this book is available on the CD. You just need to install your
    server (which I show you how to do in Chapter 1) before using any of it. Additionally,
    some of the figures were taken using different themes on a web browser. Don’t
    worry about the different themes—all of the source files should work as shown.


    # CHAPTER 1

    # WELCOME TO PHP

    Hey, welcome to PHP For Teens. I''m really glad you picked up this book, and I
    want to let you know that you are in for a great ride. PHP, while easy to learn,
    is also an incredibly powerful and useful language, and this book will teach you
    everything you need to know to make dynamic web sites.


    So what does PHP actually mean? PHP itself stands for Hypertext Processor—seriously.
    Seems kind of crazy, because the name itself is part of the acronym, like it keeps
    going forever! PHP is also a programming language that is often used on modern
    web sites and development applications. PHP is extensible, strong, and works with
    many external utilities. PHP is also pretty simple to learn. It is called a high-level
    language, which means it is between human language (English) and machine code
    (0s and 1s). Because of this, you can easily understand it and write it like normal
    writing, but it is also strong enough to do some complex things.


    So what can you actually do with PHP? You can make the Internet an interactive
    experience by creating forms that people can fill out and submit and then deal
    with the data however you like. For example, a visitor can email comments to a
    webmaster, or post comments on a site, or join a forum. PHP really makes the Internet
    more usable.


    To use this book, you only need a rudimentary knowledge of how to design a web
    site. You need no programming background, but if you have done any programming
    before, you will understand the language much more quickly.

