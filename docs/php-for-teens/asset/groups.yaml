    PHP needs to know where each statement stops and starts, and it uses semicolons
    at the end of each statement to judge the ending point. You can use multiple statements
    per line, as long as you have a semicolon after each major part. For example,
    the following code snippets equivalent to each other:


    ```

    <?php

    $example=25;

    echo "$example";

    $example = 75;

    echo "$example";

    ?>

    ```


    ```

