    \ 是文件的路径，$mode 是你想要打开文件的方式（读、写、追加等）。\n\n# fopen() 模式\n\n| 模式 | 描述 |\n| --- | ---\
    \ |\n| r | 仅读打开。如果文件不存在则失败。 |\n| r+ | 读写打开。如果文件不存在则失败。 |\n| w | 仅写打开。如果文件不存在则创建。如果文件存在则将其清空。\
    \ |\n| w+ | 读写打开。如果文件不存在则创建。如果文件存在则将其清空。 |\n| a | 仅写打开。如果文件不存在则创建。指针位于文件末尾。 |\n\
    | a+ | 读写打开。如果文件不存在则创建。 |\n\n# 关闭文件\n\n当你完成文件操作后，请关闭它。如果一直开启，脚本会占用空间并减慢系统。使用 `fclose()`\
    \ 函数关闭文件。该函数的声明为：\n\n```\nfclose($handle);\n```\n\n只需将从 `fopen()` 获取的变量传递给 `fclose()`\
    \ 来关闭文件，文件就会消失。加载和关闭文件可以这样做：\n\n```php\n<?php\n$handle = fopen('file.txt', 'w');\n\
    // 执行某些操作\nfclose($handle);\n?>\n```\n\n# 写入文件\n\n写入文件几乎和加载关闭文件一样简单。你只需要另一个函数：`fwrite()`。这种命名方案很容易理解，对吧？看看\
    \ `fwrite()` 的声明：\n\n```\nfwrite($handle, $string)\n```\n\n通过此函数，你可以向文件写入任何字符串。注意我们正在写入一个\
    \ ASCII 文件，这意味着写入文件的任何内容都是字符串，当以后从文档读取数据时，会被解释为字符串。`fwrite()` 仅在 $handle 以写入或追加模式打开时才有效，正如我们在本章前面讨论过的。\n\
    \n所以让我们创建一个网页，允许用户将文本追加到文件末尾并关闭它。让我们先从需要的 HTML 表单开始：\n\n```html\n<!DOCTYPE html\
    \ \"-//W3C//DTD HTML 1.0 Strict//EN\"\n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\"\
    >\n\n<html>\n<head>\n<title>追加表单</title>\n</head>\n\n<body>\n<form action=\"phpft14-02.php\"\
    \ method=\"POST\" >\n\n<p>要追加的文本：<textarea name=\"appendedtext\"></textarea></p>\n\
    \n<br><input type=\"submit\">\n</form>\n</body>\n\n</html>\n```\n\n你输入的文本将追加到\
    \ `phpft14-02.txt` 文件中。\n\n"
