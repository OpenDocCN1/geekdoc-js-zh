    \ Check out the following source from phpft12-01result.php:\n\n## Putting a Cookie\
    \ in Your Site\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_201_0.png)\n\n### Figure\
    \ 12.3\nFinally setting a cookie in phpft12-01.php.\n\n```php\n<!DOCTYPE html\
    \ PUBLIC \"-//W3C//DTD XHTML 1.0//EN\" \"http://www.w3.org/TR/xhtml/strict.dtd\"\
    >\n<html>\n<head>\n<title>Displaying the cookie</title>\n</head>\n<body>\n<?php\n\
    $cookievalue = $_COOKIE['name'];\n//if the cookie is blank or does not exist,\
    \ echo an error\nif ($cookievalue == \"\") {\n    echo \"You have not created\
    \ the cookie yet? Go to\n<a href=\\\"phpft12-01.html\\\">phpft12-01.html</a> to\
    \ set a cookie.\";\n    exit;\n} else {\n  echo \"Welcome back to the page. $cookievalue.\
    \ Feel free to change the cookie by visiting <a href=\\\"phpft12-01.html\\\">phpft12-01.html</a>\"\
    ;\n}\n?>\n</body>\n</html>\n```\n\nThis page simply echoes an error if the cookie\
    \ does not exist and displays the person's name if it does.\n\nLet's see the three\
    \ pages in succession. Figure 12.4 shows how a person can enter his name, Figure\
    \ 12.5 shows the result of entering a name, and Figure 12.6 shows the final results.\n\
    \n![](img/fb76427b4bed9367f4a8810f090a7a37_202_0.png)\n\nPlease enter your name\
    \ into the following text box and submit. Note that if you entered a name in the\
    \ past few weeks, that name will be deleted with the new one.\n\nEnter your name:\
    \ Maneesh Sethi\n\nFigure 12.4\nStep one: entering your name.\n\n## Putting a\
    \ Cookie in Your Site\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_203_0.png)\n\
    \nFigure 12.5\nStep two: creating the cookie.\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_203_1.png)\n\
    \nFigure 12.6\nStep three: the results.\n\nCheck that out! Three steps to set\
    \ a complete cookie and display it on one page.\n\nI have an exercise for you:\
    \ Rewrite these PHP pages so that it does all of these steps on one page. Make\
    \ one page display a form, set the cookie, and echo the result out if it exists.\
    \ This is a pretty tough job, but I bet you are up to it!\n\n# CHAPTER 13\n\n\
    # SESSIONS\n\nAs you learned in Chapter 12, cookies allow you to save a small\
    \ file, on the user’s computer, that recorded some data in a variable. However,\
    \ there are a few problems with saving data inside cookies for use in all your\
    \ site’s pages:\n\n- Cookies are stored on the user’s computer. This means that\
    \ the user can go into the cookie file and edit the text to change the results\
    \ of a page.\n- Cookies are not super reliable. They can be turned off, deleted,\
    \ and edited by hand, so you have to worry about what a knowledgeable user can\
    \ do with cookies you create.\n- A lot of Internet viewers don’t like cookies,\
    \ because they can track down visitors’ locations and use them for advertising\
    \ purposes. In fact, a lot of people on the Internet have cookies for this reason,\
    \ and they do not allow them altogether.\n\nBecause of all these reasons, PHP\
    \ created a completely new interface whenever you want to remember user data.\
    \ This new interface is called a session. Sessions are very similar to cookies\
    \ because they are another method of storing variables for use on a web site.\
    \ However, there are several important differences between the two:\n\n- Sessions\
    \ store the variables on the server. This means that the user cannot edit any\
    \ of the data that his computer uses because he cannot access it. In other words,\
    \ sessions are a lot safer than cookies overall.\n"
