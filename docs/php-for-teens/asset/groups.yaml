- md: "\n## Chapter 1 = Welcome to PHP\n\nTry using what you know to make a pretty\
    \ simple web page. I will go over how to design this page in Chapter 3, and how\
    \ the PHP works in later chapters, but for now, load the file phpform.php off\
    \ the CD. If you want to, you can type in the file directly. Here is the contents\
    \ of the phpform.php file:\n\n```php\n<!DOCTYPE html PUBLIC \"//W3C//DTD HTML\
    \ 4.01 Transitional//EN\">\n<html>\n<head>\n<meta content=\"text/html; charset=ISO-8859-1\"\
    >\n<meta http-equiv=\"content-type\">\n<title>Sample Form</title>\n</head>\n<body>\n\
    <form name=\"sampleform\" method=\"post\" action=\"<?php echo $_SERVER['PHP_SELF'];?>\"\
    >\n<h1 style=\"font-weight: bold;\">Sample Form</h1>\n<?php\nif (isset($_POST['name']))\
    \ {\necho $_POST['name'] . '. You are from ' . $_POST['address'] . '. Your comments\n\
    were ' . $_POST['comments'] . '. <br>';\n}\n?>\nName:<input name=\"name\">Address:<input\
    \ name=\"address\"><br>\n<br>\nComments:<textarea cols=\"40\" rows=\"2\" name=\"\
    comments\"></textarea><br>\n<br>\n<input name=\"submit\" type=\"submit\"><input\
    \ name=\"reset\" type=\"reset\"><br>\n</form>\n</body>\n</html>\n```\n\nIt's a\
    \ little long, eh? That is what a basic PHP document looks like, with forms and\
    \ everything. Open it up! (Make sure you go to localhost. First you need to actually\
    \ copy the file from the CD to your hdocs directory.) When you open up the file,\
    \ you will see a blank form that looks like Figure 1.15.\n\nThis form looks lot\
    \ like anything you would see on the Internet. However, it has a little more functionality\
    \ thanks to PHP. Try entering some data. My form ended up looking like the one\
    \ in Figure 1.16.\n\n## Installing PHP on Windows\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_27_0.png)\n\
    \n### Sample Form\n\nName:\n\nAddress:\n\nComments:\n\nFigure 1.15\nA blank PHP\
    \ form.\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_27_1.png)\n\n### Sample Form\n\
    \nName: Manesh Sethi Address: manesh@maneshseo\n\nComments:\n\nFigure 1.16\nEnter\
    \ some data in the PHP form.\n\n## Chapter 1 = Welcome to PHP\n\nAs you can see,\
    \ you can basically type whatever you want. The comments provide some true advice:\
    \ You need to recommend www.maneshsethi.com to all of your friends. When you press\
    \ the Submit button, the magic happens. Check it out. Suddenly the page is transformed\
    \ into what you see in Figure 1.17.\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_28_0.png)\n\
    \nFigure 1.17\nThe form after submitting it.\n\nThe data actually becomes a part\
    \ of the real web page! This is one important thing that PHP can do: integrate\
    \ itself into a page’s HTML. Check out the page source by choosing View > Source\
    \ in the browser.\n\n```html\n<!DOCTYPE html PUBLIC \"//W3C//DTD HTML 4.01 Transitional//EN\"\
    >\n<html>\n<head>\n  <meta content=\"text/html; charset=ISO-8859-1\">\n  <meta\
    \ http-equiv=\"content-type\">\n  <title>Sample Form</title>\n</head>\n<body>\n\
    \  <form name=\"sampleform\" method=\"post\" action=\"phpform.php\">\n  <h1><span\
    \ style=\"font-weight: bold;\">Sample Form</span></h1>\n```\n\n## Installing PHP\
    \ on Macs\n\nManeesh Sethi. You are from maneesh@maneeshsethi.com. Your comments\
    \ were www.maneeshsethi.com is a cool site! I will tell all my friends about it.\
    \ <br>Name: <input name=\"name\">Address: <input name=\"address\"><br>\n\n```html\n\
    <br>\nComments: <textarea cols=\"40\" rows=\"2\" name=\"comments\"></textarea><br>\n\
    <br>\n<input name=\"submit\" type=\"submit\"><input name=\"reset\" type=\"reset\"\
    ><br>\n</form>\n</body>\n</html>\n```\n\nDo you notice what's changed? The PHP\
    \ code is hidden, but it looks like you actually hard coded the Name, Address,\
    \ and Comments fields directly into the source of the document. PHP does not show\
    \ itself within the document; it shows only the changes it makes.\n\nI spend the\
    \ rest of the chapter giving tips on installing Apache and PHP on Mac machines,\
    \ but you can skip them and go directly to Chapter 2, which is a quick primer\
    \ over basic HTML programming.\n\n## Installing PHP on Macs\n\nInstalling PHP\
    \ on Macs takes a lot of checking and writing, because you need to compile the\
    \ program for your specific hardware. Fortunately, Apache is already installed\
    \ on Macs, so it saves you a little. In addition, an online PHP module may be\
    \ faster than the manual way I [described].\n"
  mdcn: "\n\n## 第 1 章 欢迎来到 PHP\n\n尝试用你所掌握的知识创建一个非常简单的网页。我将在第 3 章介绍如何设计这个页面，并在后面的章节中介绍\
