    All right, so we know how to differentiate between sessions. This is a great way
    to allow different types of scripts on your pages without confusing the variables
    and getting them all mixed up.


    # Creating a Web Page Counter


    Okay, let''s try something new. Now that you know about basic session variables,
    let''s create a web page counter. This counter will recognize how many times a
    visitor has visited your page and display the number on the screen. The counter
    starts at 0 when the page is closed.


    Developing a counter requires a little PHP. We will open a session and reference
    the counter (which creates the variable if it doesn''t exist, and increments it
    if it exists). The following code fragment is taken from phpft13-04.php:


    ```

    <php

    session_name("counter");

    session_start();

    header("Cache-control:private");


    $_SESSION[''counter'']++;

    ```


    echo "Hey, welcome to this web page. While you are here, feel free to browse some
