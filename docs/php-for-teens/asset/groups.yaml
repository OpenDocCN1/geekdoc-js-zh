    # # A Sample Form


    ![](img/fb76427b4bed9367f4a8810f090a7a37_57_0.png)


    # ## Figure 3.9


    Adding the second textbox.


    We have just created the beginning of a web page that allows the reader to add
    some data. So, she can enter her name and address, but we still need to create
    a text area so she can put in some comments about the site. Let''s do that with
    a text area. Text areas are not much more difficult than textboxes. However, they
    have a few more options: You can specify their width and height. Before creating
    the text area, use text to tell the user what the area is for, just like with
    the Name and Address textboxes. To do this, just type **Comments:** on the next
    line (using a <br />).


    To create a text area, use the `<textarea></textarea>` tag. Anything you type
    between the opening and closing tags is default. Pretty simple, eh? Let''s add
    the options. Let''s give this text area 2 rows and 40 columns. (Each column is
    one character.) Use the attributes `cols` for columns and `rows` for rows. Make
    sure you name the text area, such as “comments”. The code will create what you
    see in Figure 3.10.'
