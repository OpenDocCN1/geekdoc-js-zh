    \ to set a cookie.\";\n    exit;\n} else {\n  echo \"Welcome back to the page.\
    \ $cookievalue. Feel free to change the cookie by visiting <a href=\\\"phpft12-01.html\\\
    \">phpft12-01.html</a>\";\n}\n?>\n</body>\n</html>\n```\n\n如果 cookie 不存在，这个页面只需输出一个错误；如果存在，则显示姓名。\n\
    \n让我们连续看这三个页面。图 12.4 显示用户如何输入名字，图 12.5 显示了输入名字的结果，图 12.6 显示了最终结果。\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_202_0.png)\n\
    \n请在下面的文本框中输入你的名字并提交。注意，如果你在过去的几周输入过名字，那个名字会被新名字删除。\n\n输入你的名字：Maneesh Sethi\n\n\
    图 12.4\n第一步：输入你的名字。\n\n## 在你的网站中放置 Cookie\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_203_0.png)\n\
    \n图 12.5\n第二步：创建 cookie。\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_203_1.png)\n\
    \n图 12.6\n第三步：结果。\n\n看这个！用三个步骤设置一个完整的 cookie 并在页面上显示它。\n\n我给你留了一个练习题：重写这些 PHP\
    \ 页面，让它们在一个页面上完成所有步骤。让一个页面显示表单、设置 cookie 并在存在时输出结果。这是一项相当艰巨的任务，但我打赌你没问题！\n\n#\
    \ 第 13 章\n\n# 会话 (SESSIONS)\n\n正如你在第 12 章中学到的，cookie 允许你在用户的计算机上保存一个小文件，记录变量中的某些数据。然而，将数据保存在\
    \ cookie 中供你网站的所有页面使用存在几个问题：\n\n- Cookie 存储在用户的计算机上。这意味着用户可以进入 cookie 文件并编辑文本来更改页面的结果。\n\
    - Cookie 并不可靠。它们可以被手动关闭、删除和编辑，所以你必须担心熟悉技术的用户会对你创建的 cookie 做些什么。\n- 很多互联网用户不喜欢\
    \ cookie，因为它们可以追踪访问者的位置并将其用于广告目的。事实上，许多人因为这个原因禁用了 cookie，他们完全不允许使用。\n\n由于所有这些原因，每当你记住用户数据时，PHP\
    \ 都会创建一个全新的接口。这个新接口被称为会话（session）。session 与 cookie 非常相似，因为它们都是在网站上存储变量的另一种方法。然而，它们之间有几个重要的区别：\n\
    \n- Session 将变量存储在服务器上。这意味着用户无法修改其计算机使用的任何数据，因为他无法访问它。换句话说，总体而言，session 比 cookie\
    \ 安全得多。\n"
