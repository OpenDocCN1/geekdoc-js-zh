    session_start();

    header("Cache-control:private");


    echo "Thanks for visiting " . $_SESSION[''name''];

    ?>

    ```


    # 用于会话数据的 PHP 函数


    会话是在网站上传递变量的极佳工具，但存在可能的问题。如果两个脚本使用了相同的名称，你可能会遇到麻烦。当程序员 A 开发他的网页时，他创建了一个表单，用户可以在其中输入信息以便商品。他将此变量命名为
    `$name`。程序员 B 是一个业余开发者，决定创建一个页面，其中 `$name` 用于跟踪用户的姓名。那么，如果访问者去了程序员 A 开发的页面，然后又去了程序员
    B 开发的第二个页面，`$name` 变量会被跟踪并且可能保持不变。这可能是一个问题，因为我们不希望在不让用户知道发生混乱的情况下产生混乱。


