    | Table 4.2 Predefined Variable Arrays | |

    | Array | Description |

    | --- | --- |

    | $GLOBALS | References every global variable available; rarely used. |

    | $_SERVER | Variables set by the server, such as the name of the file being used.
    |

    | $_GET | Variables from a form that use the GET method. |

    | $_POST | Variables from a form that use the POST method. |

    | $_REQUEST | A combination of variables from $_GET, $_POST, and $_COOKIE. |

    | $_COOKIE | Variables that are provided as cookies, which can be set. |

    | $_FILES | Files that are uploaded via HTTP post. |

    | $_ENV | PHP environment variables. |

    | $_SESSION | Variables that are currently registered to script''s session. |


    The echo line displays the text within the single quotation marks ('''') and attaches
    that line to the variable $_POST[''name''] using the dot operator (.), which joins
    a string to a variable. What is this crazy text that follows the //? Well actually,
    that is a comment. If you enter a // anything that follows it on the same line
    is hidden from the program. This helps you remember what the program does when
    you look at it later. Comments are very important, so use them whenever you can!
    This page shows how you can use this predefined variable array to use forms. The
    page ends up looking like Figure 4.12.


    You know all about how to use these arrays now; find out some more of the arrays
