    # array() Language Construct


    Use the array()language construct, which is very similar to a function. You call
    array() and the return value is equal to the new array. Therefore, whatever variable
    you set as equal to the result of array()becomes an array. For example, take a
    look at the following:


    ```

    $newarray = array();

    ```


    Your new array will be stored in the variable $newarray. Of course, the problem
    we have now is that array is blank! We have to create items in the array. Before
    we do this, let me show you how to reference items in an array.


    # Reference Items


    Array items have two parts: a key and a value. A key is basically the location
    of the variable, and the value is what is stored at that location. Think of a
    golf course. In this case, the hole you are on is the key (1–18), and your score
    on the hole is the value. You can then look for a specific hole and see what your
    score was. Similarly, if you make a reference to a variable in your array with
    a valid key, a value at that location is returned. The key in this type of problem
    is stored within brackets attached to the variable’s name. Here is a simple structure:


    ```

    $newarray[''key''] = value;

    ```


    If you substitute your wanted values, you create an array element.


    Let’s look at a simple program, whose results are shown in Figure 10.1. This is
    phpft10-01.php. This program simply creates five array values and echoes them
    on the screen.


    ```

    <?php


    $newarray = array();


    $newarray[1] = "First item";

    $newarray[2] = "Second item";

    $newarray[3] = "Third item";

    $newarray[4] = "Fourth item";

    $newarray[5] = "Fifth item";


    echo $newarray[1];

    echo $newarray[2];

    echo $newarray[3];

    ```'
