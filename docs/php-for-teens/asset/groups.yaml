    ## 为什么我可以用双引号或单引号进行 echo？


    使用 echo 命令（或任何需要引号的命令）时，请考虑你想使用单引号还是双引号。在输出文本时，没有区别。例如，`echo ''Hello, World!''`
    与 `echo "Hello, World!"` 是完全相同的。当你在 echo 语句中使用变量或常量时，双引号和单引号有很大区别。双引号允许你通过 $ 符号将变量直接放入字符串中；PHP
    会替换变量的值。然而，使用单引号时，值不会被替换；相反，页面会显示变量名。要在单引号语句句中使用变量，你需要使用点运算符（.），用单引号结束字符串，并使用点运算符连接变量和字符串。


    ## 算术运算符


    算术运算符是最常见的。大多数与你一辈子都知道的运算符基本相同：加、减、乘、除。算术运算符的作用与你在执行表 5.1 所示的操作时预期的一样。


