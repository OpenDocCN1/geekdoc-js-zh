    Apache；它是免费、通用且安全的。


    ## 什么是 Web 服务器？


    > Web 服务器是使用 PHP 的重要部分。Web 服务器（也称为 HTTP 服务器）是运行在你计算机上的进程，当浏览器尝试访问时它会发送网页。每当你访问一个站点（例如
    www.maneeshethi.com）时，域名上都会运行一个 Web 服务器，并返回你的浏览器看到的实际页面。实际上，通过安装 Web 服务器，你正在将你的机器变成网站。


