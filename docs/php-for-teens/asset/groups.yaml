    # CHAPTER 10\n\n# ARRAYS\n\nYou already learned a little about arrays, those pesky\
    \ little sets of variables, and in this chapter, we are going to review what we\
    \ already know and learn a lot more about them. Arrays are very useful in PHP\
    \ programming, and you will find them in probably every advanced program you see.\
    \ When using a form to submit a value, the variables are stored in an array, which\
    \ is passed along to the new page. This array is used for calculations and data\
    \ recall.\n\nPHP documentation explains an array as an ordered map that has a\
    \ set of keys that each has a value. You create the keys in the array; keys are\
    \ names that reference the individual items in an array. Sometimes a set of consecutive\
    \ numbers is used, and other times a set of strings is used. Because all elements\
    \ of an array have the same name, you may need some name to keep them separate.\
    \ For example, when using the `$_GET['fullname']` array, the key was whatever\
    \ was in the brackets. For example, the `$_GET['fullname']` key was fullname.\
    \ Often, the key is a number, so you can have a set of arrays from 0 to 10 looking\
    \ like `$array[10]`.\n\nArrays are particularly strong if you use integers with\
    \ them and want to initialize a large number of values. For `for` loops can do\
    \ this very easily, using a `for` loop to set each individual element of an array.\
    \ Arrays and loops are natural companions.\n\n## Creating an Array\n\nTo create\
    \ an array, you need several elements.\n\n## array() Language Construct\n\nUse\
    \ the array() language construct, which is very similar to a function. You call\
    \ array() and the return value is equal to the new array. Therefore, whatever\
    \ variable you set as equal to the result of array() becomes an array. For example,\
    \ take a look at the following:\n\n```php\n$newarray = array();\n```\n\nYour new\
    \ array will be stored in the variable $newarray. Of course, the problem we have\
    \ now is that array is blank! We have to create items in the array. Before we\
    \ do this, let me show you how to reference items in an array.\n\n## Reference\
    \ Items\n\nArray items have two parts: a key and a value. A key is basically the\
    \ location of the variable, and the value is what is stored at that location.\
    \ Think of a golf course. In this case, the hole you are on is the key (1–18),\
    \ and your score on the hole is the value. You can then look for a specific hole\
    \ and see what your score was. Similarly, if you make a reference to a variable\
    \ in your array with a valid key, a value at that location is returned. The key\
    \ in this type of problem is stored within brackets attached to the variable’s\
    \ name. Here is a simple structure:\n\n```php\n$newarray['key'] = value;\n```\n\
    \nIf you substitute your wanted values, you create an array element.\n\nLet’s\
    \ look at a simple program, whose results are shown in Figure 10.1. This is phpft10-01.php.\
    \ This program simply creates five array values and echoes them on the screen.\n\
    \n```php\n<?php\n\n$newarray = array();\n\n$newarray[1] = \"First item\";\n$newarray[2]\
    \ = \"Second item\";\n$newarray[3] = \"Third item\";\n$newarray[4] = \"Fourth\
