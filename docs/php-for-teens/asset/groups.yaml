    \n该程序的大部分被运行计数器的代码占据了。这个计数器似乎与程序的其余部分融合得不好，其余部分完全由 `echo` 语句组成。程序的内容将像图 9.1 所示。\n\
    \n![](img/fb76427b4bed9367f4a8810f090a7a37_146_0.png)\n\n接下来的计数器将把 1 到 10 的数字相加。请稍候，您的数字正在计算。\n\
    \n您的结果是 55\n感谢使用我们的程序！\n\n图 9.1 一个不使用函数的 PHP 运行计数程序 (phpft09-01.php)。\n\n## 设计你的函数\n\
    \n如你所见，显示效果看起来很好。但在底层，正如你之前看到的，代码并没那么理想。看看我们如何通过将计数器转换为函数来让这个程序看起来好得多：\n\n```php\n\
    <?php\necho \"The following counter will add up the numbers 1 through 10\";\n\
    echo \"<br>Please wait, your numbers are being tabulated below.\";\necho '<p>Your\
    \ result is ' . counter_1_10();\necho \"<br>Thanks for using our program!\";\n\
    ?>\n```\n\n这看起来可能有点奇怪。唯一的改变是删除了之前程序中的循环代码，并用函数调用替换了它。该调用位于 `echo` 语句中：\n\necho\
    \ '<p>Your result is ' . counter_1_10();\n\n你可以看到我们把变量 `$x` 改为了 `counter_1_10()`。当然，这个函数本身通过名字并没有做任何事情——我们需要让它产生实际意义！我很快就会向你展示如何让你的函数工作，在此之前，请先看另一个使用函数的示例。\n\
    \n如果你在写一首歌，你可以这样做：\n\n```php\n<?php\nverse1();\nchorus();\nverse2();\nchorus();\n\
    verse3();\nchorus();\nchorus();\n?>\n```\n\n这是一首歌非常常见的设置，但注意，你被允许多次调用同一个函数 `chorus()`，并且顺序可以是任意的。函数允许你执行这类酷炫的事情。\n\
    \n在学习如何创建这个程序之前，先看看定义函数的基本结构。你可以根据个人函数需要进行更改的部分是*斜体*的。\n\n```php\n<?php\nfunction\
    \ function_name(parameter1,parameter2,...)\n{\n    function code\n}\n?>\n```\n\
    \n看起来并不太难，对吧？函数定义只是函数的结构和代码。\n\n## 剖析函数\n\n函数有三个部分我们需要过的：\n\n- 函数代码\n- 参数列表\n\
    - 返回值\n\n只需要代码部分是必须；参数列表和返回值都是可选的。然而，在大多数函数中，你将使用这三者。\n\n## 函数代码\n\n函数代码部分是位于大括号\
    \ `{ }` 之间的主要部分。该部分处理函数的实际工作。你可以像在普通代码部分一样在这一部分添加语句和表达式。通常，这部分代码会与函数声明中的参数列表进行交互。\n\
    \n## 参数列表\n\n参数是你在调用函数时可以传递给它的变量和值。还记得我们使用 `nl2br()` 函数吗？这个函数将你代码中的换行符转换为 `<br>`\
    \ 标签，并将带有换行的字符串作为参数传递。当你调用函数时，在括号内部传递参数。\n\n"
