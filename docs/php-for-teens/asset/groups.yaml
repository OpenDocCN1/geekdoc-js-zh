    CD 中。具体的安装步骤取决于你是在 Mac 还是 PC 上安装。由于大多数读者将使用 PC，我将详细说明如何在 Windows 机器上安装。然后，我将提供一些关于如何在
    Mac 上安装的提示。


    ## 在 Windows 上安装 PHP


    仅安装 PHP 将允许你执行 PHP 文件。此时，你可以在命令行提示符中查看它们。这相当相当烦人且不好看，因此我们将额外花一个步骤来安装 Web 服务器，以便我们能够在浏览器中查看
    PHP 文件。我们需要先安装 Web 服务器。在处理 PHP 之前，我们先来看这一部分。


