    # Chapter 5 = Constants, Expressions, and Operators


    The value of each number increases by 1 when using the ++ operator and decreases
    by 1 when using the - operator. For example, look at the following:


    ```

    $a = 10;

    $a++;

    echo $a;

    $a--;

    echo $a;

    ```


    The variable $a is given a starting value of 10. It is then incremented, and the
    first echo statement shows the variable as having a value of 11. The second echo
    statement shows $a as having the value of 10, because the -- operation decrements
    it.


    # Note


    You might be wondering why both operators can be attached to either the beginning
    or the end of the variable name. Attaching it to the front versus the back has
    similar results, but there is one important difference: When attaching the operator
    to the front, the variable is incremented by 1, and then the new value is returned.
    When the operator is attached to the back, the old value is returned, and then
    the variable is incremented by 1. For example, look at the following code:


    ```

    $a=10;

    $a++;

    $a=10;

    $a++$a;

    ```


    The first echo statement will show the variable as being equal to 10, but immediately
    after the echo, the variable becomes 11. On the second echo statement, the variable
    becomes 11 and then the variable is echoed.


    # String Dot Operator and Dot Assignment


    The string dot operator attaches parts of strings together to form one big string.
    Take a look at the following code:


    ```

    $firstpart = "Welcome to ";

    $secondpart="my web site. ";

    $fullstring = $firstpart . $secondpart;

    ```


    $fullstring now contains the value "Welcome to my web site." The dot operator
    joins the two parts of the string.'
