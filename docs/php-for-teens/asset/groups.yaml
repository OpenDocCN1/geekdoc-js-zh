    \ 13.8 中的结果。\n\n```php\n<?php\nsession_start();\nheader(\"Cache-control:private\"\
    );\n\n$_SESSION['address'] = $_GET['address'];\n\necho \"Thanks for visiting the\
    \ page with the email address \" . $_SESSION['address'] . \". Your name has been\
    \ added to the session variable list!\nNow, if everything is working correctly,\
    \ this session variable should NOT work on <a href=\"phpft13-02other.php\">phpft13-02other.php</a>\"\
    ;\n?>\n```\n\n![](()![](img/fb76427b4bed9367f4a8810f090a7a37_214_0.png)\n\n感谢访问电子邮件为\
    \ maneesh@maneessethi.com 的页面。您的名字已添加到会话变量列表中！现在，如果一切运行正常，此会话变量在 phpft13-02other.php\
    \ 上不应该生效。\n\n图 13.8\nphpft13-02other.php 文件。\n\n好的，我们得到了预期的结果。到目前为止非常好。现在问题在于：我们想创建一个新页面，使用来自另一个表单的\
    \ $address 变量。假设表单已经创建，用户绕过了表单直接打开了 PHP 文档。在这种情况下，$address 变量应该是空的，对吧？因为我们创建了一个带有变量的会话，$address\
    \ 会被传递下去。让我们来看看这个充满错误的文档。它在光盘上，文件名为 phpft13-02other.php。\n\n```php\nsession_start();\n\
    header(\"Cache-control:private\");\n\n$address = $_SESSION['address'];\n\nif ($address\
    \ != '')\n{\n    echo \"Uh oh, there is an error. $address is registered.\";\n\
    }\nelse\n{\n    echo \"Great! $address is unregistered as a session variable!\"\
    ;\n}\n?>\n```\n\n## 修复\n\n这与你之前看到的有点不同，对吧？我们创建了一个 if..else 部分来测试变量 $address 是否存在。第一个测试确保\
    \ $address 不是空的。如果它不是空的，说明存在错误——变量被传递了。如果它是空的，说明会话变量没有传递成功，程序运行正常。\n\n让我们看看当你从之前的文件创建了会话变量后，通过浏览器访问此页面会发生什么。查看图\
    \ 13.9 中的结果。噢噢！我得到了一个错误，因为变量被注册了。这就是我们正在经历的问题，我们需要找出如何修复它。\n\n幸运的是，修复方法很简单：在处理会话时，每个会话都有一个会话名称。任何使用\
    \ session_start() 的脚本都会获得一个默认会话名称，脚本使用此会话名称在页面之间传递变量。然而，如果我们想区分两个页面，可以为脚本创建一个新的会话名称，导致变量不会传递。\n\
    \n## 第13 章 ■ 会话 (Sessions)\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_216_0.png)\n\
    \n图 13.9\nphpft13-02other.php 文件。\n\n更改会话名称非常简单。你只需要使用 session_name() 变量。包含一个你想要赋值的名称作为参数，就完成了！一步即可创建一个新的会话名称。注意，session_name()\
    \ 函数必须放置在 session_start() 之前。你应该在文档的开头使用它，可能作为第一行。\n\n让我们重写该页面以修复问题。我们只需要更改会话名称，它就能正常工作了。\n\
    \n```php\n<?php\nsession_name(\"testname\");\nsession_start();\n{\n  echo \"Uh\
    \ oh, there is an error. $address is registered.\";\n} else {\n  echo \"Great!\
    \ \\$address is unregistered as a session variable!\";\n  echo \"<p>our session\
    \ name is \" . session_name() . \"</p>\";\n}\n?>\n```\n\n该文件是光盘上的 phpft13-03.php。查看图\
    \ 13.10 中的外观。嘿，看那个！PHP 文档输出了正确的文本，因为新的会话名称导致会话变量 $address 被遗忘了。\n在这个脚本的底部，我包含了一个\
    \ echo 调用来显示当前的会话名称。如果你在不带任何参数的情况下使用 session_name() 函数，它会返回\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_217_0.png)\n\
    \n**图 13.10**\nphpft13-03.php 文件。\n\n当前的会话名称，而不是应用新的会话名称。这就是为什么这一行将正确的会话名称输出到文档中：\n\
    \necho \"<p>Our session name is \" . session_name() . \"</p>\";\n\n好了，现在我们知道如何区分会话了。这是一种让页面运行不同类型脚本的方法，而不会混淆变量并让它们全部混在一起。\n\
    \n## 创建网页计数器\n\n好的，让我们尝试一些新东西。既然你已经了解了基本的会话变量，让我们创建一个网页计数器。这个计数器将识别访问访问页面的次数，并在屏幕上显示。当页面关闭时，计数器从\
    \ 0 开始。\n\n开发计数器需要一点 PHP。我们将打开会话并引用计数器（如果它不存在则创建变量，如果存在则对其递增）。以下代码片段来自 phpft13-04.php：\n\
    \n```php\n<?php\nsession_name(\"counter\");\nsession_start();\nheader(\"Cache-control:private\"\
    );\n\n$_SESSION['counter']++;\n\necho \"Hey, welcome to this web page. While you\
    \ are here, feel free to browse some other sites. Just make sure you come back!\
    \ Hey, you might as well check <a href=\"http://www.maneshsethi.com/\">ManeshSethi.com</a>\
    \ while you are here!\";\n\necho \"<p>We will keep a record of how many times\
    \ you come back!</p>\";\n\necho \"<p><div align=\\\"center\\\">You have visited\
    \ our page \" . $_SESSION['counter'] . \" times.</div></p>\";\n\n?>\n```\n\n"
