    # Mind Your Case


    PHP is a case-sensitive language, meaning that capitalization matters in the variable
    names, statements, and other calls in your programs. $Variable is different than
    $variable. Extra careful that you don''t accidentally capitalize variables in
    your code when you don''t want them to be capitalized.'
