    </head>\n<body>\nn<?php\n//give starting value to counter\n$counter=1;\n\n//increment\
    \ counter from 1 to 10\nwhile ($counter<=10)\n{\n    echo \"$counter<br />\";\n\
    \    $counter++;\n}\n?>\n</body>\n</html>\n```"
