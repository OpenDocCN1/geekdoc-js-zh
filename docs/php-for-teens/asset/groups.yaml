    请记住，相等运算符 (`==`) 与赋值运算符 (`=`) 是不同的。赋值运算符更改左侧变量以赋予一个新值，而相等运算符测试相等性并在为真时返回 1。


    # 逻辑运算符


    当一个测试需要两个或多个比较时，就会使用逻辑运算符。例如，如果你需要确定 `$number` 大于 7 且小于 10，就会使用逻辑运算符。通过逻辑运算符，你可以实现这一点，并仅在
    `$number` 等于 8 或 9 时执行语句。表 5.3 列出了逻辑运算符。对于此表，$a` 和 `$b` 是比较操作，因此在前面的示例中，`$a` 将是
    `$number > 7`，而 `$b` 将是 `$number < 10`。


    | 表 5.3 逻辑运算符 |

    | 任务 | 符号 | 示例 |

    | --- | --- | --- |

    | 如果两个比较都为真，返回 true。 | and | $a and $b |

    | 如果其中一个比较为真或两者都为真，返回 true。 | or | $a or $b |

    | 如果其中一个比较为真但不同不同为真，返回 true。 | xor | $a xor $b |

    | 如果比较不为真，返回 true。 | ! | !$a |

    | 如果两个比较都为真，返回 true。 | && | $a && $b |

    | 如果其中一个比较为真或两者都为真，返回 true。 | || | $a || $b |


    优先级可能是逻辑运算符的一个问题。务必始终使用括号。这里有一个例子：假设你有三个不同的语句——A、B 和 C。这里有两个不同的测试：


    - (A and B) or C

    - A and (B or C)


    括号中的测试始终首先执行。


    # 其他运算符


    少数运算符并不真正属于其他类别，但你应该了解它们，因为它们很有用。


    # 赋值


    你已经认识这一个，因为你曾用它来创建变量。此运算符使用 `=` 符号，并将值分配给变量。例如，以下是一个赋值操作：


    $x = 13


    变量 `$x` 的值为 13。此赋值操作返回赋值的值，如果你将一个新变量设置为此操作的结果，它也等于 13。


    # 递增和递减


    这些运算符将整数的值加 1，意味着它们都是单元运算符。查看以下递增运算符（前两个）和递减运算符（后两个）的示例：


    ```

    $++

    $++

    $--

    $--

    ```


