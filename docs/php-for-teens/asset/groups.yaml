    ## ASCII 格式


    如果你可以使用文本编辑器打开该文件并看到文本而不是乱码，那么你拥有一个 ASCII 文件。ASCII 文件仅由字母、数字和标点符号组成，而不是用于可执行文件的二进制位。当使用记事本等纯文本编辑器创建
    HTML 文件时，该文件始终是 ASCII 格式。然而，如果你使用 Microsoft Word 等文字处理器，程序会引入一些奇怪的非 ASCII 信息。因此，永远不要使用任何文字处理器创建
    HTML 文件。


    ## 常用标签


    标签是创建和设计 HTML 文档的主要部分。每个文件都包含在浏览器中查看页面所需的标签。为了观察 HTML 结构，让我们来看空白文档的结构：


    ### 什么是 TYPE？


    所有浏览器解释代码的方式略有不同。为了帮助程序员编写在所有浏览器中显示一致的代码，并创建一种编写代码的标准，万维网联盟（World Web Consortium）应建立了。


    为了标识你的代码符合这些标准，你需要使用一个看起来非常吓人的但名为 TYPE 的声明。它只有几种变体，并且可以随时复制粘贴到你的代码中——特别是因为你每个文档只使用它一次。让我们来看示例声明：


    ```

    <!DOCTYPE html PUBLIC "-//W3//DTD XHTML 1.0 Strict//EN"

    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">

    ```


    这让浏览器知道部分：这让浏览器代码符合 XHTML 1.0 Strict 标准：PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN。（有很多版本。这个版本使你的页面在所有浏览器中的一致性最高。）


    下部分告诉浏览器哪里找到这些标准："http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd"。


    如果你不声明 TYPE，你将把代码交由浏览器决定应该使用的任何惯例处理。写一个吧！也不需要将其从内存中释放。如需查看完整列表，请访问 W3C 网站：


    ```

    http://www.w3.org/QA/2002/04/valid-dtd-list.html#DTD

    ```


    ```

    <html>

    <head>

    <title> </title>

    </head>

    <body>

    <p> </p>

    </body>

    </</html>

    ```


    图 2.2 显示了此页面在浏览器中的外观。尽管目前为止，它是完全空白的。然而，如果你查看图 2.3 所示的源代码，你会发现文档有一些内容。此文件是 phpft02-01.html，位于
    CD 上。


    ## 标签


    文件中的第一个标签是 `<html>`，它告诉计算机后续文本是 HTML 代码，并应该像任何 HTML 文档一样显示。


    ![](img/fb76427b4bed9367f4a8810f090a7a37_36_0.png)


    **图 2.2** 浏览器中的 phpft02-01.html 文件。


    ## 常用标签


    ![](img/fb76427b4bed9367f4a8810f090a7a37_37_0.png)


    图 2.3 查看源代码。


    HTML 标签遵循一套严格的惯例。每个标签都被小于号和大于号包围：`<` 和 `>`。某些标签有起始（开启）和结束（闭合）；开启标签被括号包围，而结束标签被括号包围并在前面有一个正斜杠（/）。


    [注：OCR 文本继续...]


    标签需要正确地嵌套，这导致第一个打开的标签是最后一个关闭的标签。换句话说，当你打开一个标签，然后在该第一个标签内打开另一个标签时，你需要在关闭第一个标签之前先关闭你打开的第二个标签。让我们来看一个例子：


    ```

    <html>

    <head>

    </head>

    </html>

    ```


    注意，第一个打开的标签 `<html>` 是最后一个关闭的标签。


