    \  <option value=\"celsius\">摄氏度</option>\n  <option value=\"fahrenheit\">华氏度</option>\n\
    </select>\n\n<p>选择你想要转换到的单位：</p>\n\n<select name=\"secondtype\">\n  <option value=\"\
    celsius\">摄氏度</option>\n  <option value=\"fahrenheit\">华氏度</option>\n</select>\n\
    \n<p><input type=\"submit\"></p>\n</form>\n</body>\n</html>\n```\n\n这个页面看起来像图\
    \ 9.6。你可能会奇怪为什么我们允许输入来选择温度单位。为什么不在用户选择时自动选择华氏度呢？这是为了可扩展性。如果你想让用户转换为不同的温度单位（如开尔文），你可以轻松地添加这一点，而不需要过多修改\
    \ HTML 页面。此页面的 PHP 非常复杂，涉及到很多函数。让我们逐一通过主要部分。第一部分设置 HTML 和同步变量。\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_158_0.png)\n\
