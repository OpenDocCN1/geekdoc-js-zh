    The dot assignment operator (.=) appends a new string to the end of the string.
    For example, the following code puts in "Welcome to my web site.":


    ```

    $text = "Welcome to to "

    $text .= "my web site.";

    ```


    # Expressions


    Expressions are basically the most important element of PHP. In essence, any-thing
    that you write in PHP, anything that has a value, is considered an expression.
    If you create a statement that does something, it is generally an expression.


    A simple example of an expression—creating and assigning a variable—might look
    something like this:


    ```

    $variablename = "value"

    ```


    This creates a variable called varilename that is assigned to some value. Because
    "value" is a string, the variable $variablename will also be a string. See the
    semicolon at the end? That marks the end of a statement.


    # What is the difference between a statement and an expression?


    Statements and expressions are both common and very important. All statements
    expressions, but not all expressions are statements. An expression is basically
    anything that has a value within a web page, such as a test or an assignment.
    A statement is something that forces something to be, such as calling a function
    or an assignment. As you can see, an assignment is also clearly an expression.
    You can easily differentiate statements and expressions by looking at them—generally,
    statements end with a semicolon.


    Expressions produce a value, which means that each expression returns a result.
    Let’s take a simple integer assignment:


    ```

    $intvar = 15;

    ```


    You might see two parts to this: the value 15 and the assignment to $intvar. However,
    there is also one more step—the result of the actual assignment itself. This action
    returns a value. The value returned from an assignment is simply the value of
    the newly defined variable.


    Let’s look at an example of this. What happens if we assign a new variable to
    the value of the assignment?'
