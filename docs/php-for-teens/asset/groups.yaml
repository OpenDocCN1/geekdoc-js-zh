    # break and continue\n\nThere are two rare commands that deal with loops: break\
    \ and continue. You might remember break from the switch statement: When using\
    \ it, the switch command finished and exited. The same thing happens within loops.\
    \ break causes a loop to break out of the loop immediately. continue, on the other\
    \ hand, immediately forces the loop to go back to the top and execute from the\
    \ beginning, skipping the rest of the loop for that individual iteration."
