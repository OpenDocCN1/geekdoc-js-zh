    \ `fwrite()` 行从这样：\n\n```php\nif (!fwrite($handle,$text))\n```\n\n改为：\n\n```php\n\
    if (!fwrite($handle,stripslashes($text)))\n```\n\n这样做之后，你可以在图 14.10 中看到新的 test.txt\
    \ 文件长什么样。微小的改变会带来巨大的差异，不是吧？\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_247_0.png)\n\
    \n图 14.10\n使用 stripslashes()。\n\n# 读取文件\n\n读取文件与写入文件几乎完全一样——只是相反的。当我们之前写入文件时，我们传递了一个包含文件中数据的字符串作为参数。当我们读取文件时，读取函数返回一个字符串，我们可以根据自己的目的对其进行处理。\n\
    \n## fread()\n\n那么，读取函数是什么呢？如果你一直在关注，可能可以猜出它的名字：`fread()`。看看函数的声明：\n\n```php\n\
    fread($handle, $lengthInBytes)\n```\n\n这两个参数都是必须的。第一个参数是我们通过使用 `fopen()` 获取的文件句柄。第二个参数是你想要读取的字节数。`fread()`\
    \ 仅按字节工作。\n\n如果你知道需要读取的数据量，这听起来很不错，但如果你不知道呢？想要读取整个文件怎么办？幸运的是，PHP 提供了一种方法。PHP 的\
    \ `filesize()` 函数返回文件以字节为单位的大小。看这个：\n\n```php\nfilesize($filename)\n```\n\n很酷吧？如果你想读取整个文件，可以如下操作：\n\
    \n```php\n$contents = fread($handle, filesize($filename));\n```\n\n还有几个你应该的函数。一个是\
    \ `fgets()`，它读取文件直到遇到换行符，返回当前行。你可以在循环内部调用它并对文件进行操作。\n\n## file()\n\n另一个很酷的函数是\
    \ `file()`，它将整个文件读入数组，不需要 `fopen()` 命令！你只需要将文件名传递给 `file()`：\n\n```php\n$entireFile\
    \ = file(\"your.txt\");\n```\n\n这会创建一个文件行的数组。作为替代方案，你可以使用 `foreach` 循环对文件的每一行进行操作。运行这段代码后，`$contents`\
    \ 变量包含了文件的全部内容。内容是以字符串格式存在的。\n\n让我们在脚本中使用这些吧。你可以看看 phpft14-03.html 它是如何工作的。页面看起来就像图\
    \ 14.11 所示。\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_249_0.png)\n\n**图 14.11**\
    \ phpft14-03.html 表单。\n\n现在看看实现读取的 PHP 代码：\n\n```php\n<?\n$filename = \"test.txt\"\
    ;\n\n$handle = fopen($filename, 'r');\n\n//如果打开文件出现问题，输出错误\nif (!$handle)\n{\n\
    \    exit(\"Could not open file!\");\n}\n\n$contents = fread($handle, filesize($filename));\n\
    \n//如果写入出现错误，输出错误\nif (!$contents) {\n  exit(\"Could not read data!\");\n}\n\n\
    echo $contents;\n\nfclose($handle);\n\n?>\n```\n\n等等，关键是 `fread()` 行：\n\n```php\n\
    $contents = fread($handle, filesize($filename));\n```\n\n在这里，我们将 `$handle` 和文件的\
    \ `filesize` 传递给 `fread()` 函数。我们将结果放入 `$contents` 变量中。之后我们通过运行以下代码检查 `$contents`\
    \ 是否有效：\n\n```php\nif (!$contents) {\n  exit(\"Could not read data!\");\n}\n```\n\
    \n如果 `$contents` 无效，我们可以通过上面的测试来检查。此时程序会退出。很酷吧？你可以对文件进行任何操作，也许删除所有行、搜索特定的子字符串或任何你想做的！\n\
    \n# 重命名、复制和删除文件\n\n在结束本章之前，还有几个我想介绍的函数。这三个函数在计算机和网站上都很常用。它们简单易用，返回布尔值。如果函数成功，返回\
    \ true；如果是 false，则返回 false。\n\n# 重命名、复制和删除文件\n\n让我们来看看它们。\n\n## copy\n\n第一个函数复制：\n\
    \n```php\ncopy($source_filename, $destination_filename)\n```\n\n使用 `copy` 函数时，程序知道源文件需要打开读取，目标文件需要打开写入。因为如此，该函数不需要你传递文件句柄，只需要文件名。该函数实际上为你节省了工作。\n\
    \n## rename\n\n第二个函数重命名：\n\n```php\nrename($old_filename, $new_filename);\n```\n\
    \n关于 `rename` 的一个酷酷点是，你还可以用它跨目录移动文件。通过重命名文件使其具有不同的路径，你可以移动文件。例如，如果旧文件名是 C:\\test.txt\
    \ 而新文件名是 D:\\test.txt，你就将文件从 C:\\ 目录移动到 D:\\。很巧妙吧？\n\n## unlink\n\n最后一个函数删除文件。我打赌你知道这个函数名是什么。\n\
    \n```php\nunlink($filename)\n```\n\n很奇怪吧？PHP 有时会给函数起烦人的名字，尽管大多数人认为这个函数应该是 `delete()`，但它的名称却是\
    \ `unlink()`。这些函数都简单易用，并返回布尔值。如果函数成功，返回 true，如果是 false，则返回 false。\n\n# 总结\n\n\
    就是这些。我们结束了。没有更多要教的。好吧，除了 PHP 的其余部分。但这本书已经对这个主题提供了一个很棒介绍。你现在可以设计自己的网站了。你可以让它与文件交互、与字符串交互——任何你想做的。\n\
    \n你从一个关于 HTML 的快速入门开始，帮助你恢复记忆。然后你学习了如何制作表单以及如何使用表单内的变量。接着你学习了常量、操作符和表达式，你在整本书中使用了它们。你稍作休息，学习了编程时开发所需的风格。之后，在第二部分中，你学习了控制结构和循环。\n"
