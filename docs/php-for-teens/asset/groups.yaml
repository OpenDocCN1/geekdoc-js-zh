- md: "\nThis isn’t too difficult, eh? We created a page that echoes out the user’s\
    \ logged name. Check out how it looks in Figure 13.18.\n\nAll right, we have created\
    \ a complete login script! Granted, it doesn’t do much, but we can make it a lot\
    \ better when we save files to the server (which you learn about in Chapter 14).\n\
    \n![](img/fb76427b4bed9367f4a8810f090a7a37_229_0.png)\n\nFigure 13.18\nThe phpft13-05loggedin.php\
    \ page.\n\n## Cookie Exercise\n\nBefore leaving this chapter, let’s go over the\
    \ exercise regarding using cookies and a session in conjunction with each other\
    \ to create a cookie that always updates itself, even after the session has ended\
    \ and the browser has closed. We are going to do this exercise by adding and updating\
    \ a cookie time the user visits the site. The following code answers this problem.\
    \ Take a look and see if you can understand it the way through without looking\
    \ at the explanation.\n\n```php\n<?php\nsession_name(\"counter\");\nsession_start();\n\
    header(\"Cache-control:private\");\n\n$_SESSION['counter'] = $_COOKIE['counter'];\n\
    \n$_SESSION['counter']++;\n\nsetcookie(\"counter\", time()+ 60 * 60 * 24 * 30);\n\
    echo \"Hey, welcome to this web page. While you are here, feel free to browse\
    \ some other sites. Just make sure you come back! Hey, you might as well check\
    \ out <a href=\"http://www.maneshsethi.com\">ManeeshSethi.com </a> while you are\
    \ here!\";\necho \"<p>We will keep a record of how many times you come back!\"\
    ;\necho \"<p><div align=\"center\">You have visited our page ${_SESSION['counter']}\
    \ times.</div>\";\n?>\n```\n\nThis page uses cookies and sessions in conjunction\
    \ to create a counter remembers how many times you have visited the site even\
    \ after you close the page! The page begins by setting up the session and assigning\
    \ a session variable to the cookie variable. If the cookie variable does not exist,\
    \ the session variable is assigned to 0. You might be wondering the variable knows\
    \ how to set the cookie variable to 0. If the variable does not exist, it automatically\
    \ has a value of 0. This line performs that feat:\n\n```php\n$_SESSION['counter']\
    \ = $_COOKIE['counter'];\n```\n\nThe next lines increment the $_SESSION['counter']\
    \ variable, updating the counter. Use this value for all future calculations in\
    \ the script; it has the most updated counter value.\n\nNext is the main line:\
    \ It sets the cookie that recalls the value every time we load the page. The cookie\
    \ has several important parameters, so take a look at the line code:\n\n```php\n\
    setcookie(\"counter\", $_SESSION['counter'], time()+ 60 * 60 * 24 * 30);\n```\n\
    \n![](img/fb76427b4bed9367f4a8810f090a7a37_231_0.png)\n\n### Figure 13.19\nphpft13-06.php\
    \ counter page.\n\nThe first parameter is the cookie name. We used it in one of\
    \ the earlier assigning lines of code. The second parameter is the cookie value.\
    \ Notice that the counter's `$_SESSION` value rather than the cookie value. is\
    \ because we updated the `$_SESSION` value very recently, and the `$_COOKIE` value\
    \ has not been updated. If we assigned the cookie with the same value of `$_COOKIE`,\
    \ the web page would never update itself. In other words, the cookie would remain\
    \ at 1 forever.\n\nThe last parameter refers to how long the cookie will last.\
    \ We set it for `60 * 60 * 24 * 30`, which can also be read as simply 30 days.\
    \ After that time, the cookie disappears and the counter resets. You can change\
    \ the expire time.\n\nThe last few lines of code simply `echo` out the number\
    \ of times the counter has been echoed. Check out what this page looks like in\
    \ Figure 13.19.\n\n## CHAPTER 14\n\n## WORKING WITH FILES\n\nThis is the last\
    \ chapter of the book, and we are going to be going out with a bang. In this chapter,\
    \ I'm going to teach you how to deal with files in PHP. We will now be able to\
    \ accept uploads, write to files, save information, and do other cool stuff.\n\
    \nYou might be thinking that this is exactly the same as cookies. Yeah, with cookies\
    \ you can save some information about a user. However, you could only save a specific\
    \ type of data; with file handling, you can save whatever information you like\
    \ to the server. You can also let the user upload files directly to the server.\
    \ File handling allows uploads and enables you to write to files on the user's\
    \ computer.\n\n### Allowing File Uploads\n\nYou want a way for readers to communicate\
    \ with you through your web site. This is commonly done through email, but sometimes\
    \ the visitor may want to send something—a picture or a music file, perhaps. PHP\
    \ allows you to upload a file through a form and send it to the web server. Let's\
    \ take a look at how to do this.\n\nRemember that when using forms you can choose\
    \ either GET or POST. PHP file uploading works best with POST.\n\n### HTML Program\n\
    \nI've created the form that allows for selecting a file. This allows you to select\
    \ a file from your computer. Let's take a look at how to do this. Check out the\
    \ code, then in Figure 14.1.\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_234_0.png)\n\
    \nFigure 14.1\nThe file upload form.\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD\
    \ HTML 4.01//EN\" \"http://www.w3.org/TR/html41/strict.dtd\">\n<html>\n<head>\n\
    <title>Upload Form</title>\n</head>\n<body>\n<form action=\"php14-01.php\" method=\"\
    POST\" enctype=\"multipart/form-data\">\n  Please select file to upload: <input\
    \ type=\"file\" name=\"filename\"> <br>\n  <input type=\"submit\" value=\"Upload\"\
    >\n</form>\n</body>\n</html>\n```\n\n### doctype\n\nNotice that the form has several\
    \ parts, such as method and action, but there is something special: enctype. What\
    \ is this? enctype stands for encoding type, and it tells the server that the\
    \ form is going to send something other than text. Instead, it sends multipart/form-data.\n\
    \n### input\n\nAnother weird is the first input. This parameter defines the file's\
    \ maximum size. Right now, it is set to 30000 bytes. You can adjust this to any\
    \ value you like by altering the value. It is important you use this size. It\
    \ prevents any uploaded file from being over the specified size. Someone can try\
    \ to upload gigantic files that can use up your space or bandwidth. If someone\
    \ has malicious intent, he can use file-uploading forms in what is called a denial-of-service\
    \ (DoS) attack.\n\n### Browse\n\nLastly, because it is a file-upload form, the\
    \ last has a type of file, which creates a Browse button that lets the user select\
    \ a file. A box pops up like the one in Figure 14.2 when you press the button.\n\
    \nWriting the HTML page that sends the file to the server is the easy part. Let's\
    \ make the PHP program to write permanently to the server!\n\n### PHP Program\n\
    \nTake a look at the PHP you need to deal with file uploads.\n\n### Arrays\n\n\
    When submitting a file through a form, the server creates an array that holds\
    \ the uploaded files. Remember when we used sessions and had the $_SESSION array?\n\
    \n## Chapter 14 Working with Files\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_236_0.png)\n\
    \nFigure 14.2 The file-upload dialog box on a file-upload field.\n\nIt’s a lot\
    \ like that. The $_FILES array stores five pieces of information about the uploaded\
    \ data. These data are stored in multidimensional arrays:\n\n- The first dimension\
    \ is the name of the input field from the form on the previous page. (In the preceding\
    \ example the field name was filename.)\n- The second dimension is the name of\
    \ the information field.\n\nTable 14.1 lists the five options. You won’t use all\
    \ of these, but keep in mind that you have the option to use any of them whenever\
    \ necessary.\n\n```php\nmove_uploaded_file()\n```\n\nWhen a file is uploaded to\
    \ your server, it is placed in a temporary directory. This directory is a standard\
    \ temporary directory, unless you change the upload_tmp_dir in the php.ini file.\
    \ You generally don’t need to change the\n"
  mdcn: "\n\n这并不难，对吧？我们创建了一个页面来回显用户的登录名称。看看图 13.18 中它的样子。\n\n好了，我们创建了一个完整的登录脚本！诚然，它并没有做什么，但当我们把文件保存到服务器时，我们可以让它变得好得多（你将在第\
    \ 14 章中学习到）。\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_229_0.png)\n\n图 13.18\n\
    phpft13-05loggedin.php 页面。\n\n## Cookie 练习\n\n在离开本章之前，让我们过一下关于如何使用 cookie 和 session\
    \ 配合的练习，该练习旨在创建一个即使 session 结束且浏览器关闭后也能持续更新的 cookie。我们将通过在用户访问网站时添加和更新 cookie\
    \ 来完成这个练习。以下代码解决了这个问题。看一看，看看你是否能在不看解释的情况下通彻理解它。\n\n```php\n<?php\nsession_name(\"\
    counter\");\nsession_start();\nheader(\"Cache-control:private\");\n\n$_SESSION['counter']\
    \ = $_COOKIE['counter'];\n\n$_SESSION['counter']++;\n\nsetcookie(\"counter\",\
    \ time()+ 60 * 60 * 24 * 30);\necho \"Hey, welcome to this web page. While you\
    \ are here, feel free to browse some other sites. Just make sure you come back!\
    \ Hey, you might as well check out <a href=\"http://www.maneshsethi.com\">ManeeshSethi.com\
    \ </a> while you are here!\";\necho \"<p>We will keep a record of how many times\
    \ you come back!\";\necho \"<p><div align=\"center\">You have visited our page\
    \ ${_SESSION['counter']} times.</div>\";\n?>\n```\n\n此页面结合使用了 cookie 和 session\
    \ 来创建一个计数器，即使在你关闭页面后也能记住你访问网站的次数！页面首先设置 session并将 session 变量赋值给 cookie 变量。如果 cookie\
    \ 变量不存在，则将 session 变量赋值为 0。你可能会好奇变量是如何知道如何将 cookie 变量设置为 0 的。如果变量不存在，它的值自动为 0。这一行完成了这一壮举：\n\
    \n```php\n$_SESSION['counter'] = $_COOKIE['counter'];\n```\n\n接下来的行增加了 `$_SESSION['counter']`\
    \ 变量的值，更新了计数器。在脚本后续的所有计算中使用此值；它拥有最新的计数器值。\n\n接下来是主程序行：它设置了 cookie，每次我们加载页面时都会回溯该值。cookie\
    \ 有几个重要的参数，所以看下这行代码：\n\n```php\nsetcookie(\"counter\", $_SESSION['counter'], time()+\
    \ 60 * 60 * 24 * 30);\n```\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_231_0.png)\n\
    \n### 图 13.19\nphpft13-06.php 计数器页面。\n\n第一个参数是 cookie 名称。我们在之前的某个赋值代码行中使用了它。第二个参数是\
    \ cookie 值。注意，计数器使用的是 `$_SESSION` 值而不是 cookie 值。这是因为我们最近更新了 `$_SESSION` 值，而 `$_COOKIE`\
    \ 值还没有更新。如果赋值使用与 `$_COOKIE` 相同的值来设置 cookie，网页将永远不会更新。换句话说，cookie 将永远停留在 1。\n\n\
    最后一个参数指的是 cookie 的持续时间。我们将其设置为 `60 * 60 * 24 * 30`，这也可以简单地读为 30 天。在此之后，cookie\
    \ 就会消失，计数器也会重置。你可以更改过期时间。\n\n最后几行代码简单地 `echo` 出计数器输出的次数。看看这个页面在图 13.19 中的样子。\n\
    \n## 第 14 章\n\n## 处理文件\n\n这是本书的最后一章，我们将以一个华丽的方式结束尾。在本章中，我将教你如何在 PHP 中处理文件。我们现在能够接受上传、写入文件、保存信息并进行其他酷炫的操作了。\n\
    \n你可能会认为这和 cookie 完全一样。是的，通过 cookie 你可以保存一些关于用户的信息。然而，你只能保存特定类型的数据；通过文件处理，你可以将任何喜欢的信息保存到服务器上。你还可以让用户直接将文件上传到服务器。文件处理允许上传并使你能够写入用户计算机上的文件。\n\
    \n### 允许文件上传\n\n你希望读者能够通过你的网站与你交流。这通常通过电子邮件完成，但有时访问者可能想要发送某些——可能是图片或音乐文件。PHP 允许你通过表单上传文件并将其发送到\
    \ Web 服务器。让我们来看看如何操作。\n\n记住在使用表单时，你可以选择 GET 或 POST。PHP 文件上传使用 POST 效果最好。\n\n###\
    \ HTML 程序\n\n我创建了一个允许选择文件的表单。这允许你从计算机中选择文件。让我们来看看如何操作。查看代码，然后在图 14.1 中。\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_234_0.png)\n\
    \n图 14.1\n文件上传表单。\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\
    \ \"http://www.w3.org/TR/html41/strict.dtd\">\n<html>\n<head>\n<title>表单</title>\n\
    </head>\n<body>\n<form action=\"php01.php\" method=\"POST\" enctype=\"multipart/form-data\"\
    >\n  请选择要上传的文件：<input type=\"file\" name=\"filename\"> <br>\n  <input type=\"\
    submit\" value=\"上传\">\n</form>\n</body>\n</html>\n```\n\n### doctype\n\n注意表单有几个部分，如\
    \ method 和 action，但有一个特殊的：enctype。这是什么？enctype 代表编码类型，它告诉服务器表单发送的不是文本。相反，发送的是\
    \ multipart/form-data。\n\n### input\n\n另一个是 input。这个参数定义了文件的最大大小。现在它设置为 30000\
