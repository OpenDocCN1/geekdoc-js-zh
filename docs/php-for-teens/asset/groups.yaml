    现在我们需要创建一个简单的 PHP 页面来输出 cookie。这并不难。查看来自 phpft12-01result.php 的源码：\n\n## 在你的网站中放置\
    \ Cookie\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_201_0.png)\n\n### 图 12.3\n\
