    \ 14.8 所示。运行脚本后，现在看图 14.9 中的 test.txt！\n\n# 第 14 章 ■ 处理文件\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_246_0.png)\n\
    \n**图 14.8** 原始的 test.txt 文件。\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_246_1.png)\n\
    \n**图 14.9** 新的并追加的 test.txt 文件。\n\n# 写入文件\n\n很酷，对吧？但在“需要转义序列的字符”中，那个斜杠是怎么回事呢？例如单引号，字符前面会有一个反斜杠。幸运的是，有一个简单的方法可以修复这个问题。PHP\
