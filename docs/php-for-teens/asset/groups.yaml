- md: "\n# Branching Structures\n\nelse\n{\necho \"Both your first number ($a) and\
    \ your second number ($b) are equal!\";\n}\n\nThis structure can have only three\
    \ possibilities. $a could be bigger than $b, $b could be bigger than $a, or they\
    \ could be equal. However, only one of the three else statements will be executed.\n\
    \n# Caution\n\nTake note that this page only deals with integers. If you enter\
    \ a string rather than a number, you might get some erratic results.\n\n# Note\n\
    \nOne branching structure is the ternary structure, which is very similar to if...else.\
    \ You can see some more examples with the ternary operator in Chapter 5.\n\n#\
    \ switch\n\nswitch is excellent at comparing one variable to several possible\
    \ values. switch only works when checking to see if an input is exactly the same\
    \ as a value; you cannot run comparison tests on it. It is a great way to compare\
    \ a variable against several different known values to see if something occurs.\
    \ For example, you can see if $a equals 0 or a, but you cannot use switch to see\
    \ if $a is greater than $b. The following is the generalized structure for a switch\
    \ statement:\n\n```\nswitch($variable)\n{\n  case 0:\n    //execute statements\n\
    \    break;\n  case 1:\n    //execute statements\n    break;\n  default:\n   \
    \ //execute statements only if none of the cases fit\n    break;\n}\n```\n\nLet’s\
    \ quickly recreate a program we did earlier. Remember when I introduced if control\
    \ structures while designing the calculator? Let’s go back to that and use switch\
    \ instead of if. The HTML file is the same, except the action attribute has changed;\
    \ the PHP file has changed. Check out what it now looks like. This file is phpft07-04.php\
    \ on the CD. Figure 7.6 shows you what the form page looks like.\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_122_0.png)\n\
    \n# Figure 7.6\n\nThe phpft07-04.html form file.\n\n```php\n<?php\n//Put $_GET\
    \ variables into our own variables\n$a = $_GET['first'];\n$b = $_GET['second'];\n\
    $op = $_GET['operation'];\n\necho \"The result of your expression, $a $op $b is\
    \ \";\n//Echo out the result of the chosen operation\nswitch ($op) {\n\ncase '+':\n\
    \    echo $a + $b;\n    break;\n\ncase '-':\n    echo $a - $b;\n    break;\n\n\
    case '*':\n    echo $a * $b;\n    break;\n\ncase '/':\n    echo $a/$b;\n    break;\n\
    \ncase '%':\n    echo $a%$b;\n    break;\n\ndefault:\n    echo \"Warning: Operation\
    \ Not Valid\";\n    break;\n\n}\n?>\n```\n\nThis replaces it all with switch,\
    \ including a default value just in case the user enters something that gives\
    \ a big error. One might look like Figure 7.7.\n\nYou might be wondering what\
    \ the break statements do. switch is designed so that the execution of one of\
    \ the commands will flood into another one. So, for example, if we removed the\
    \ breaks and did an addition problem on our calculator, we would get six results:\
    \ the addition, the subtraction, the multiplication, the modulus, and the default\
    \ echo.break stops this exiting out of the switch structure. As a general rule,\
    \ always use a break after each case unless there is an overbearing reason not\
    \ to do.\n\nIt's important to note that I included a default case for the switch\
    \ statement, even though it appears impossible for the operation to be anything\
    \ other than the given choices. However, you should always include a default clause\
    \ for your switch statement. What if the form is a GET form and the user changes\
    \ the operation through the URL? Other things can come up that may confuse your\
    \ program, so it is always better to be safe and simply use a default clause.\n\
    \n# Chapter 7 = Program Flow: Control Structures\n\n![](img/fb76427b4bed9367f4a8810f090a7a37_124_0.png)\n\
    \nFigure 7.7\nThe phpft07-04.php file.\n\n# Loops\n\nSometimes, while designing\
    \ a program, you need to execute a set of statements repeatedly. You might need\
    \ to display an entire set of data with hundreds of elements. PHP offers loops\
    \ which allow you to execute a set of statements many times as needed. There are\
    \ several types of loops. Each type has strengths and weaknesses.\n\n# while\n\
    \nSometimes, while designing a program, you need to execute a set of statements\
    \ repeatedly. You might need to display an entire set of data with hundreds of\
    \ elements. PHP offers loops which allow you to execute a set of statements many\
    \ times as needed. There are several types of loops. Each type has strengths and\
    \ weaknesses.\n\n- Initialization outside the loop\n- Condition inside the loop\n\
    - Code inside the loop\n\nLet’s start with the most common while:\n\n```php\n\
    while (condition)\n{\n    //execute statements\n}\n```\n\nBe careful—if the condition\
    \ is always true, the loop will run forever (infinite loop). The while loop is\
    \ used when you don't know how many times you need to execute the code. For example,\
    \ reading a file until the end is reached. \n\n```php\n$counter = 1;\nwhile ($counter\
    \ <= 10) {\n    echo $counter;\n    $counter++;\n}\n```\n\n# for\n\nThe for is\
    \ very similar to while, except that you do not need to create the variable outside\
    \ the loop. It is optimized for situations in which you know how many times you\
    \ want to execute code.\n\n```php\nfor (variable assignment; comparison test;\
    \ variable change)\n{\n    //execute statements\n}\n```\n\nLet's look at a simple\
    \ for:\n\n```php\nfor ($i = 1; $i <= 10; $i++) {\n    echo $i;\n}\n```\n"
  mdcn: "\n\n# 分支结构\n\n```php\nelse\n{\necho \"Both your first number ($a) and your\
