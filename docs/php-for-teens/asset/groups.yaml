    ## 第 11 章


    ## 高级表单


    到本书为止，我们在几乎的每一个章节中都使用了表单，现在是时候更多地学习它的功能了。目前为止，我们只使用了基础表单，例如带有文本框、提交按钮或选择框的表单。在本章中，我们将仔细观察
    Web 表单，并看看 PHP 如何让它们变得强大。我将先讨论一些高级的 HTML 表单元素，然后讨论如何在 PHP 中使用表单来使你的页面更加健壮。


    ## 高级元素


    准备好了——在本章中介绍了许多不同的表单元素。


    ### 单选按钮 (Radio Buttons)


    单选按钮是成组的：一组单选按钮中只能选择一个。使用 `<input>` 标签并将 `type` 设置为 `radio`（就像处理复选框一样）。但是，除了 `type`
    和 `name`，你还需要添加一个参数：`value`。该参数将成为你通过 PHP 访问的 `$_GET` 或 `$_POST` 的值。对于同一组的项目，所有的
    `name` 参数都是相同的。这将成为 GET 或 POST 数组的键。


    需要注意的是，只有当至少有一个单选按钮被选中时，键/值对才会被发送。因此，如果你决定不默认让其中一个单选按钮被选中，请确保设置了数组键。如果你不测试这一点，用户可以直接跳过单选按钮部分，导致在你尝试访问单选按钮时产生错误。你可以使用
    `$isset()` 函数来确保至少有一个按钮被选中。


    ![](img/fb76427b4bed9367f4a8810f090a7a37_178_0.png)


    图 11.1

    一组示例单选按钮。


    你可能想创建一个页面，询问用户住在哪里。这可以通过一组简单的复选框组来实现，就像图 11.1 中的那些一样。


    如图所示，只选中了一个项目：西部（West，因为我来自加利福尼亚州）。如果你点击另一个，西部的单选按钮就会清除，而另一个会被选中。让我们来看看实现此页面的
    HTML 代码：


    ```html

    <body>


    Please enter your location


    <form action="something.php" method="post">

    <br /><input type="radio" name="location" value="west">The West

    <br /><input type="radio" name="location" value="northwest">The Northwest

    <br /><input type="radio" name="location" value="southwest">The Southwest

    <br /><input type="radio" name="location" value="south">The South

    <br /> <input type="radio" name="location" value="northeast">The Northeast<br
    /> <input type="radio" name="location" value="east">The East<br /> <input type="radio"
    name="location" value="midwest">The Midwest<br /> <input type="radio" name="location"
    value="south">The South


    <p><input type="submit"></p>

    </form>

    </body>

    ```


    注意所有按钮是否具有相同的 `name`？这是因为 `name` 定义了它们属于哪一组。如果你将其中一半的更改为不同的 `name`，你就可以选择两个项目，每组一个。图
    11.2 显示了如果我将其改为两组会发生什么情况。如你所见，有两个按钮被选中了。这是因为项目的 `name` 值不同。在图 11.2 中，我所做的只是更改了第二组的
    `name`。


    ![](img/fb76427b4bed9367f4a8810f090a7a37_179_0.png)


    **图 11.2**

    将单选按钮分为两组。


    ### 密码字段 (Password Fields)


    密码字段非常简单。它看起来和文本框完全一样，只是字符被编码或隐藏了。取决于你的浏览器，它们看起来像星号或点。密码框最常用于你想让用户登录你的网站，并且通常与用户名字段配合使用。在密码框中输入时，你会得到类似如图
    11.3 的结果。该页面的代码如下。


    ```html

    <body>


    Please enter in your username and password to log in.

    <form action="something.php" method="post">

    <p>Username:<input type="text" name="username"></p>

    <p>Password:<input type="password" name="password"></p>

    <p><input type="submit"></p>

    </form>

    </body>

    ```


    ![](img/fb76427b4bed9367f4a8810f090a7a37_180_0.png)


    **图 11.3**

    密码字段。


    ### 隐藏字段 (Hidden Fields)


    隐藏字段是一种用户不可见的输入类型。它用于向服务器发送用户不需要查看或编辑的数据，例如会话 ID 或安全令牌。要创建隐藏字段，请使用 `type="hidden"`
    属性。


    ```html

    <input type="hidden" name="user_id" value="123">

    ```


