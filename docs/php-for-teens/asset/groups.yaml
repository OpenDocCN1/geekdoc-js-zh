    # CHAPTER 12


    # COOKIES


    PHP has many functions and abilities for web sites. One of these capabilities
    is to create and use cookies. You may have heard of cookies while using your web
    browser. A cookie is a text file stored on the user’s machine. This text file
    has a data value, which stores some small amount of data. You just load this text
    file as a variable on pages that use the cookie, and that is your stored data!
    The text file is stored, in a hidden spot, by your web browser.


    Basically, a cookie is a way for a site to save some data on your computer. This
    can be good and bad. For example, a lot of spyware sites uses cookies to keep
    track of where you visit and use this data to sell ads to you. Also, make sure
    you don''t overdo it: A lot of people don''t like a lot of cookies because it
    seem like you storing data about them. On the other hand, using cookies allows
    you to choose and have those choices reflected on the site every time you use
    it.


    This might seem vague, so let me give an example. Say you have a site where the
    user enters her name. This name might be reflected in many parts of the site,
    such as on the top of every page and in printable sections and documents. It is
    a little annoying to have to reenter her name every time the user enters the site,
    so adding cookies is a great way to make things a little easier. The Internet,
    as a whole, does not save data, so the developers of PHP came up with cookies.'
- md: "\n## Creating Cookies\n\nSet cookies using the `setcookie()` function. This\
    \ function has a lot of parameters.\n\n```php\nsetcookie($name, [$value, $expire,\
    \ $path, $domain, $secure)\n```\n\nWhat do those brackets ([]) in the function\
    \ declaration mean? Take a look at the `setcookie()` function. When a parameter\
    \ is enclosed by brackets in a declaration like this, the parameters are optional.\
    \ If you would prefer to leave them as they default, you can do that. In addition,\
    \ be careful when defining only the `$secure` parameter but not the `$path` parameter,\
    \ you will have to set `$path`. This is because you can only set the parameters\
    \ from left to right—you cannot skip any. You must set `$name` first, `$value`\
    \ second, `$expire` third, and so on. If you want to set one of the later parameters,\
    \ you can set the earlier ones to their default value.\n\n### $name\n\nThe first\
    \ parameter of `setcookie()` is `$name`. This is the name of the cookie, and you\
    \ will use this to reference it in the future. In fact, the cookie eventually\
    \ becomes part of an array called `$_COOKIE`, if you want to reference a cookie,\
    \ you would do it by calling the array like this:\n\n```php\n$_COOKIE['name']\n\
    ```\n\nAs you can see, the name eventually becomes its key for the array that\
    \ it is part of.\n\n### $value\n\nThe function's second parameter is `$value`.\
    \ If you want the cookie to be of any real use, you need to give it a value. You\
    \ can reference the cookie later, get the value back, and use this value to affect\
    \ your web site. In the example at the beginning of the chapter, we talked about\
    \ creating a cookie that had a value of the visitor's name. We would store the\
    \ value using the `$value` parameter. We could then pull this value back later,\
    \ and use it to reference the visitor's name throughout the web site.\n\n### $expire\n\
    \n`$expire` is the first complex parameter, because it isn't part of the basic\
    \ name-and-value entity. Instead, it refers to the amount of time, in seconds,\
    \ that the cookie should remain on the server. By default, if you leave the `$expire`\
    \ parameter blank, the cookie disappears as soon as the visitor closes his browser.\
    \ By setting `$expire`, you can make the cookie last a lot longer.\n\nHaving a\
    \ cookie run for the default amount of time—until the browser—is rarely useful\
    \ in practice. If you were designing the page that remembers the user’s name,\
    \ it would be ridiculous for it only to remember the name for one session. Using\
    \ the `$expire` attribute allows the cookie to last for a meaningful length of\
    \ time. However, in pages where you only want the cookie to last throughout the\
    \ current use of the browser, you can use the cookie without the `$expire` attribute.\n\
    \nTo set it, we need a new function: `time()`. For the technical minded, this\
    \ function returns the number of seconds since the epoch (which is an arbitrary\
    \ point in time; most computers use January 1, 1970 as the epoch), but you can\
    \ just think of it as returning what it is now. You set `$expire` to the value\
    \ of `time()` plus the number of seconds you want the function to expire in.\n\
    \nLet’s see how we define the time. We need the function to expire in a set of\
    \ days or weeks. We can use the following `$expire` code:\n\n```php\n$expire =\
    \ time() + 60 * 60 * 24 * 30\n```\n\nAssuming we created the variables correctly\
    \ earlier, this is identical to the following:\n\n```php\n$expire = time() + $secondsPerMinute\
    \ * $minutesPerHour * $hoursPerDay * $daysPerMonth;\n```\n\nHmn, what does this\
    \ do? Remember that `time()` returns the current time in seconds. We want to add\
    \ the number of seconds we want the cookie to endure to the current time. If we\
    \ forget to add `time()`, the cookie will have expired decades ago, making it\
    \ worthless.\n\nHere are some cool examples of time. This isn’t actual PHP code,\
    \ but it demonstrates how you can use `time()`.\n\n```\n15 seconds = time() +\
    \ 15;\n30 minutes = time() * 60 * 30\n5 hours = time() * 60 * 60 * 5\n10 days\
    \ = time() * 60 * 60 * 24 * 10\n```\n\nNow that we have added the current time,\
    \ we want to add the amount of time the cookie should last. Using multiplication\
    \ like this makes it a lot easier to. The first 60 is measured in seconds/minute,\
    \ times 60 minutes/hour, times 24 hours/day, times 30 days. This will result in\
    \ a cookie that expires after 30 days. If we wanted to change it so that the cookie\
    \ expired after two weeks, we could do something like this:\n\n```php\n$name =\
    \ \"samplecookie\"\n$value = \"samplevalue\"\n$expire = time() + 60 * 60 * 24\
    \ * 14; //expire in 2 weeks\nsetcookie($name, $value, $expire);\n```\n\nThis creates\
    \ a cookie with the key samplecookie and the value samplevalue to expire after\
    \ 14 days.\n\nThe following `setcookie()` parameters are optional. You can use\
    \ them when you want your cookies to work in specific cases or be stored in specific\
    \ locations.\n\n### $path\n\nThe `$path` variable lets you choose the path of\
    \ the web server on which the cookie will be valid. The default value is the directory\
    \ that the file is in. You can make the cookie valid for all the pages in your\
    \ web server by setting `$path`.\n\n### $domain\n\nThe `$domain` variable lets\
    \ you choose which domain the cookie will be valid for. The default is the domain\
    \ where the script was created. You can also make the cookie valid for subdomains.\n\
    \n### $secure\n\nThis parameter indicates the cookie should only be sent over\
    \ a secure connection (HTTPS). If set to true, the cookie will not be sent unless\
    \ the connection is secure.\n\n## Common Problems\n\n(Note: The OCR text for this\
    \ section was garbled in the source provided.)\n\n## Putting a Cookie in Your\
    \ Site\n\nNow it is time to put your knowledge into action. We are going to develop\
    \ couple pages with cookies, starting off with the one described earlier, which\
    \ remembers for a long period of time. The first thing we need is to develop an\
    \ HTML document. This HTML form allows the user to enter his name.\n\n```html\n\
    <!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Strict//EN\"\n  \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\"\
    >\n<html>\n<head>\n<title>Developing a page with cookies</title>\n</head>\n\n\
    <body>\nPlease enter your name into the following text box and hit submit. Note\
    \ that if you have entered a name in the past few weeks, that name will be deleted\
    \ with the new one.\n<p>\n<form name=\"cookie\" action=\"phpft12-01.php\" method=\"\
    post\">\nEnter your name here:\n<input type=\"text\" name=\"name\" />\n<p>\n<input\
    \ type=\"submit\" />\n</form>\n</body>\n</html>\n```\n\nThis is a very simple\
    \ page, with just an input textbox. The page ends up looking like Figure 12.1.\
    \ You can see this file on the CD as phpft12-01.html.\n\nLet’s enter a name in\
    \ that box. You press submit, and what do you get? Nothing yet, because we still\
    \ need to design the PHP page. Let’s do that now. We want this PHP acceptor to\
    \ do a couple of things:\n\n- It should confirm whether a cookie has been created\
    \ recently. If it has, then we need to delete that cookie and reset it with the\
    \ new value. If not, it simply needs to create the new cookie.\n"
