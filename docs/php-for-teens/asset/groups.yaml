    ```php

    $name = array(1=>"Mesh", 2=>"John", 3=>"Smith");

    ```


    我们现在有一个包含这些名字的数组。为了打印 $name[1] 的值 Mesh，我们将：


    ```php

    echo $name[1];

    ```


