    the comments to the site''s webmaster or it might display them on the site. Either
    way, you still need to create a way to actually submit that data! This is done
    with a submit button. When the user finishes entering information, she can press
    the submit button so the form sends the data to the PHP program to be processed.


    Creating a submit button is very easy. In HTML, just use the <input /> field with
    the type set to submit. In most cases, it isn’t necessary to enter a name for
    the submit button because you rarely need to process it, just to be safe, give
    it a name as submitbutton. The value attribute allows you to change the text on
    the submit button’s face, so it won’t say Submit Query. The code for the submit
    button follows. The page now looks like Figure 3.11.


    ```

    <input type="submit" name="submitbutton" />

    ```


    # Note


    If you want to, feel free to change the submit button’s value. You can make the
    button whatever whatever you want by default, such as Send Information or Leave
    a Comment. Figure 3.12 shows what it might look like.


