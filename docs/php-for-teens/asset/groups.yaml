    | 两个数字相减 | 减法 (-) | $difference = a - b$ |

    | 两个数字相乘 | 星号 (*) | $product = a * b$ |

    | 两个数字相除 | 正斜杠 (/) | $quotient = a / b$ |

    | 获取负数 | 减法 (-) | $negative = -a$ |

    | 获取除余数 | 百分号 (%) | $remainder = a % b$ |


    最后两个对你来说可能是新奇。负运算符返回数字的负值。例如，对 7 使用负运算符将返回 -7。这是一个一元运算符，意味着它只作用于一个输入。最后一个算术运算符被称为取模运算符（modulus）。它的工作方式与任何二元运算符相同。例如，7%7
    将返回 0，因为在 7/7 的除法问题中没有余数。在 9%7 中，答案是 2，因为有余数。取模运算对于检查某些特定情况非常有用，例如一个数字是偶数还是奇数。6%2
    是 0，意味着数字 (6) 是偶数，而 5%2 是奇数（且等于 1），意味着 5 是奇数。


