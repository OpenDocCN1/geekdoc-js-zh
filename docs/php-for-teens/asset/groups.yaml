    # Variable


    The same variable changes to two different values and is echoed both times. PHP
    does not care about white space, as spaces or tabs, and in almost all cases. You
    can condense the document however much you wish. Notice, though, that the first
    version of the code is a heck of lot easier to read the second one. Try to make
    your web pages simple and understandable, so in this situation, it is probably
    a good idea to use the first version of the code.


