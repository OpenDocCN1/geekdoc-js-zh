    \n<?php\n\n$a = $_GET['firstdeg'];\n$firstdeg = $_GET['firsttype'];\n$seconddeg\
    \ = $_GET['secondtype'];\n```\n\n## 根据条件调用函数\n\n此部分创建页面并为程序的剩余部分设置基础变量。我们使用 $_GET[]\
    \ 数组获取上一个页面的用户输入。接下来，我们需要处理这些变量。\n\n```php\n// 声明条件\nif ($firstdeg == 'celsius'\
