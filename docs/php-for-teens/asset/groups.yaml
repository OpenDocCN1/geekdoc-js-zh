    ```


    ```

    # configure the path to php.ini

    PHPIniDir "C:/php/"

    ```


    第一行（LoadModule）告诉 Apache 加载处理任何 .php 文件的指令，第二行告诉 Apache 使用 PHP 处理任何带有 .php 扩展名的文件。图
    2.1 显示了这些行在 httpd.conf 中的外观。


    ![](img/fb76427b4bed9367f4a8810f090a7a37_34_0.png)


