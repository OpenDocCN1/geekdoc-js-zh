    \ 函数通过创建一个具有相同名称且过期时间在过去（`time()-1`）的 cookie 来删除它。网页浏览器会自动删除该 cookie。\n\n最后一步是创建\
    \ cookie：\n\n```php\n// 无论之前是否设置过 cookie，都设置此 cookie\nsetcookie(\"name\", $cookievalue,\
