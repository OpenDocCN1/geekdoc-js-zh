    # Using Sessions


    - Sessions cannot have an expiration time: They always expire as soon as the browser
    closes. Because no file is saved to the user''s computer, the session variables
    simply lose their point of reference when the browser closes, and cannot be used
    anymore. Of course, you can find ways to get around this, but, in most cases ending
    the session immediately is better for both the server and the user.


    Sessions are a great way for implementing a username/password system on your website,
    and this chapter will discuss how to do that. We will also go over some other
    sample programs for which sessions are issued. Let''s get started now.


    To start a session, you only need to use one function: session_start(). It automatically
    checks to see if a session is already running on your browser and, if not, assigns
    a new session ID. If a session is already running, it joins that session and uses
    it on the current page. A session ID is simply a sequence of numbers assigned
    to your computer when you start a session. Each computer gets a different session
    ID; it helps the web server keep track of what is doing on the web site and inside
    the session.


    session_start() must be placed before any other echoed HTML or test. This is exactly
    the same thing that happened with setcookie() in Chapter 12. Because sessions
    deal with the document header, the function pertaining to them must be placed
    right at the beginning. Figure 13 shows what happens if session_start() is placed
    after some text is echo''d to the screen.


    The code that produced this error is very short:


    ```php

    session_start();

    ?>

    ```


    There will be an error below the screen. However, because we wrote anything on
    the screen, we got the following error:


    session_start(): Cannot send session cookie - headers already sent


    Why did we get this error? Sessions have to start in the header of a document,
    before anything at all is written on the screen. After the first piece of text
    or the first HTML tag (including `<html>`) is written, the server header section
    is over, and session_start can no longer begin.


    ![](img/fb76427b4bed9367f4a8810f090a7a37_207_0.png)


    Figure 13.1

    Producing an error with session_start().


    # Starting a Session


    Let’s try changing the code a little bit. The result is shown in Figure 13.2.


    ```php

    <?php

    session_start();

    ?>

    ```


    Will there be an error below?


    There is no error at all. Make sure that session_start() appears before any other
    text or HTML tags.


    header("Cache-control: private");


    ![](img/fb76427b4bed9367f4a8810f090a7a37_208_0.png)


    **Figure 13.2** session_start().

    Fixing the error with session_start().


