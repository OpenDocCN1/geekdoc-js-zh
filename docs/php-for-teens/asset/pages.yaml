    \ Float | Any number with a decimal point. |\n| String | A series of characters,\
    \ like a sentence or any form of text. |\n| Array | An ordered map that maps values\
    \ to keys. |\n| Object | A representative piece of a class. |\n| Resource | A\
    \ special variable that holds a reference to an external resource. |\n| NULL |\
    \ A variable that has no value. |\n\n# Types\n\nThere are numerous types of variables,\
    \ and they're listed in Table 4.1. Each type stores a different type of data.\
    \ For example, PHP draws a distinction between the number and the string. PHP\
    \ handles them different ways, so you can get weird results when you try to divide\
    \ a whole number by a fraction, instance.\n\nDifferent variables help prevent\
    \ you from doing something impossible, such as adding a number to a string, which\
    \ is a set of letters. What is 6 + Hello World? I don't know, and if I were programming\
    \ something, I wouldn't want to find out!\n\nWe aren't going to use all of these\
    \ types in this book, because some of them are rare and not necessary for basic\
    \ PHP programming. Let's go over the ones we will use.\n\n+   * Integers are very\
    \ common and encase a number, positive or negative, without a decimal point. See\
    \ these examples:\n  * 314\n  * -2141003\n  * 0\n\n+   * Boolean is used for items\
    \ that have only two states. For example, a checkbox can be either on (TRUE) or\
    \ off (FALSE). Obviously the following are the only things Boolean types will\
    \ look like:\n  * TRUE\n  * FALSE"
