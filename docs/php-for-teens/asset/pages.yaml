- img_proc: true
  md: 'Comments allow you to add text that the web server throws away; they make no
    difference on the outcome of the program. They will make a difference when you
    need to look at it only a few months later.


    You should use comments in these places:


    +   * At the beginning of every program

    * At the beginning of any large section of code

    * Just before any piece of code that other readers might not understand

    * Throughout the program to help the reader understand its purpose and goal


    There are three methods of adding comments: C, C++, and Perl. All are are named
    after the programming languages in which they were introduced.


    # C Method


    The C method allows you to comment out as much code as you want, spanning multiple
    lines. It does not account any line breaks. To use the C method, you enclose whatever
    you want commented by /* and /. For example, look at the following:


    ```

    echo "I will be printed";

    /* echo "I won''t be printed";

    Neither can I. /*

    ```


    As you can see, anything within the /* and */ marks are ignored.


    # C++ Method


    The C++ method is a little different. This comments out anything on the same line,
    starting with the // symbol and ending with the new line. Look at the following
    example:


    ```

    echo "I will be printed"; // I won''t be printed, because of comments

    echo "however, I will be printed, because this is a new line.",

    ```


    # Perl Method


    The Perl method is exactly the same as the C++ method, except it uses a # sign:


    ```

    echo "I will be printed"; # I won''t be printed, because of comments

    echo "however, I will be printed, because this is a new line.",

    ```'
