  md: '# Chapter 5 = Constants, Expressions, and Operators


    The value of each number increases by 1 when using the ++ operator and decreases
    by 1 when using the - operator. For example, look at the following:


    ```

    $a = 10;

    $a++;

    echo $a;

    $a--;

    echo $a;

    ```


    The variable $a is given a starting value of 10. It is then incremented, and the
    first echo statement shows the variable as having a value of 11. The second echo
    statement shows $a as having the value of 10, because the -- operation decrements
    it.


    # Note


    You might be wondering why both operators can be attached to either the beginning
    or the end of the variable name. Attaching it to the front versus the back has
    similar results, but there is one important difference: When attaching the operator
    to the front, the variable is incremented by 1, and then the new value is returned.
    When the operator is attached to the back, the old value is returned, and then
    the variable is incremented by 1. For example, look at the following code:


    ```

    $a=10;

    $a++;

    $a=10;

    $a++$a;

    ```


    The first echo statement will show the variable as being equal to 10, but immediately
    after the echo, the variable becomes 11. On the second echo statement, the variable
    becomes 11 and then the variable is echoed.


    # String Dot Operator and Dot Assignment


    The string dot operator attaches parts of strings together to form one big string.
    Take a look at the following code:


    ```

    $firstpart = "Welcome to ";

    $secondpart="my web site. ";

    $fullstring = $firstpart . $secondpart;

    ```


    $fullstring now contains the value "Welcome to my web site." The dot operator
    joins the two parts of the string.'
  merge: -1
  pgno: 102
- img_proc: true
  md: 'The dot assignment operator (.=) appends a new string to the end of the string.
    For example, the following code puts in "Welcome to my web site.":


    ```

    $text = "Welcome to to "

    $text .= "my web site.";

    ```


    # Expressions


    Expressions are basically the most important element of PHP. In essence, any-thing
    that you write in PHP, anything that has a value, is considered an expression.
    If you create a statement that does something, it is generally an expression.


    A simple example of an expression—creating and assigning a variable—might look
    something like this:


    ```

    $variablename = "value"

    ```


    This creates a variable called varilename that is assigned to some value. Because
    "value" is a string, the variable $variablename will also be a string. See the
    semicolon at the end? That marks the end of a statement.


    # What is the difference between a statement and an expression?


    Statements and expressions are both common and very important. All statements
    expressions, but not all expressions are statements. An expression is basically
    anything that has a value within a web page, such as a test or an assignment.
    A statement is something that forces something to be, such as calling a function
    or an assignment. As you can see, an assignment is also clearly an expression.
    You can easily differentiate statements and expressions by looking at them—generally,
    statements end with a semicolon.


    Expressions produce a value, which means that each expression returns a result.
    Let’s take a simple integer assignment:


    ```

    $intvar = 15;

    ```


    You might see two parts to this: the value 15 and the assignment to $intvar. However,
    there is also one more step—the result of the actual assignment itself. This action
    returns a value. The value returned from an assignment is simply the value of
    the newly defined variable.


    Let’s look at an example of this. What happens if we assign a new variable to
    the value of the assignment?'
  merge: -1
