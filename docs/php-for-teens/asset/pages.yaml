  md: '# Chapter 5 = Constants, Expressions, and Operators


    | Table 5.2 Comparison Operators |

    | Task | Symbol | Example |

    | --- | --- | --- |

    | Return true if values are equal. | Equal (=) | $a == $b |

    | Return true if values are equal and the same type. | Identical (==) | $a ===
    $b |

    | Return true if values are not equal. | Not equal (<>)) | $a != $b or $a <> $b
    |

    | Return true if the values are unequal or different types. | Not identical (!==)
    | $a !== $b |

    | Return true if the first value is less than the second. | Less than (<) | $a
    < $b |

    | Return true if the first value is larger than the second. | Greater than (>)
    | $a > $b |

    | Return true if the first value is less or equal to the second. | Less or equal
    (=) | $a <= $b |

    | Return true if the first value is greater or equal to the second. | Greater
    or equal (>=) | $a >= $b |


    # Comparison Operators


    Take a look at the PHP document. See how the if statements for equality using
    the == operator? That''s a comparison operator. Comparison operators allow you
    to test two values against each other, and if they relate, the test returns true.
    If the relationship specified by the test is incorrect, the return value is false.
    All comparison operators are binary, meaning they take two values in input. Take
    a look at Table 5.2 for all of them.


    These operators can be used within any type of flow-control system, such as if
    tests or, as you learn later, switch tests. They are great tools for checking
    values.


    # Note


    Keep in mind that the equality operator (==) is different than the assignment
    operator (=). The assignment operator changes the variable on the left to have
    a new value, while the equality variable tests for equality and returns a 1 if
    true.


    # Logical Operators


    Logical operators are used when two or more comparisons are needed for a test.
    For example, you would use a logical operator if you needed to determine that
    $number is greater than 7 and also less than 10. With logical operators, you can
    do this and execute a statement only if $number is equal to 8 or 9. Table 5.3
    lists the logical operators. For this table, $a and $b are comparisons, so in
    the preceding example, $a would be $number > 7 and $b would be $number < 10.'
  merge: -1
  pgno: 100
- img_proc: true
  md: '| Table 5.3 Logical Operators |

    | Task | Symbol | Example |

    | --- | --- | --- |

    | Return true if both comparisons are true. | and | $a and $b |

    | Return true if either comparison is true or both comparisons are true. | or
    | $a or $b |

    | Return true if either comparison is true, but not both. | xor | $a xor $b |

    | Return true is the comparison is not true. | ! | !$a |

    | Return true if both comparisons are true. | && | $a && $b |

    | Return true if either comparison is true or both comparisons are true. | ||
    | $a || $b |


    Precedence can be an issue with logical operators. Be careful to always use parentheses.
    Here''s an example: Pretend that you have three different statements—A, B, and
    C. Here are two different tests:


    +   * (A and B) or C

    * A and (B or C)


    The test in the parentheses is always executed first.


    # # Other Operators


    A few operators don''t really fit into the other categories, but you should know
    them because they are useful.


    # # Assignment


    You know this one already, because you used it to create a variable. This operator
    uses = symbol, and it assigns a value to a variable. For example, the following
    is an assignment operation:


    $x = 13


    The variable $x has value 13. This assignment operation returns the value of the
    assignment, if you set a new variable equal to the result of this operation, it
    is also equal to 13.


    # # Incrementing and Decrementing


    The operators add 1 to the value of an integer, meaning they are all unary. Look
    at the following samples of incrementing (the first two) and decrementing operators
    (the last two):


    ```

    $++

    $++

    $-

    $--

    ```'
  merge: -1
