  md: '![](img/fb76427b4bed9367f4a8810f090a7a37_117_0.png)


    **Figure 7.3**

    The form with equal values.


    A couple if statements work together to determine whether the first number is
    larger than the second or vice versa. If the first one is greater, that is echoed,
    and if the second is greater than the first, the correct result is echoed. However,
    what happens if the numbers are equal? Check it out in Figure 7.3.

    If the numbers are equal, nothing happens! We did not set up the program to do
    anything if this situation occurs. We obviously need to fix this.


    # else


    Let me show you a new control structure that works tightly with the one you already
    know: else. When you join an if structure to an else structure, one of the two
    statements will be executed. If the comparison test is true, the if statements
    are executed, and if the test is false, the else statements are executed.'
