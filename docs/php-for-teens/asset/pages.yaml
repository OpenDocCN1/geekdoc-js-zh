    # Predefined Variables and Arrays


    PHP includes some predefined variables—those it designates. Some of these variables
    are created by the web server or sent by GET or POST forms (which I went over
    in Chapter 3). You can use these variables within your program for a lot of things.
    Before we move on, let''s talk a little about the difference between GET and POST.


    # GET Versus POST


    In all of forms, you have the option of using GET or POST. Both are useful in
    different cases, so you should know the difference between the two. When using
    a GET form, all of the variable data are passed along in the URL''s address bar.
    This'
  merge: -1
