  md: '# Summary


    That''s it. We are done. Nothing left to teach. Well, except for the rest of PHP.
    But this book gave you a great introduction into the topic. You can now design
    your own web site. You can have it interact with files, interact with strings—whatever
    you want to do.


    You started with a quick primer on HTML to help refresh your memory. You then
    learned how to make forms and how to use the variables within those forms. You
    then learned about constants, operators, and expressions, which you used throughout
    the book. You took a brief respite to learn about the style that is necessary
    to develop when programming. After that, in Part II you learned about control
    structures and loops. You even learned about dealing with strings, functions,
    and the hated arrays. In Part III you learned about advanced forms, cookies, sessions,
    and how to work with files. After all this learning, you can now design your dynamic
    web site and make it whatever you want!


    PHP is the future of web sites. It interfaces with databases, which enables you
    to store data in easily accessible formats. A great next step is to learn how
    to use databases (MySQL is my favorite) and see how to interface them with PHP.
    Everyone loves a well-designed database.


    Other than that, I''ve exhausted what this book can teach. If you have any questions,
    you can always email me at manesh@maneeshethi.com. You can visit my web site at
    www.maneeshethi.com. You can visit my blog at www.lazymotion.com. You can even
    visit my forums and talk to other people who have questions and answers about
    PHP at www.maneeshethi.com/forum.


    Please email me. I love to hear from readers, and I take all comments to heart.
    If you are interested in my other works check out my blog, and see Game Programming
    for Teens, Second Edition; Web Design for Teens; and my soon-to-be-published *How
    to Succeed as a Lazy Student*. You can find information about all these books
    at www.maneeshethi.com.


    Thank you so much for paying attention throughout this entire book. Good luck
    with your web sites! Send me updates of your web pages, and if they are really
    good, I might display them directly on www.maneeshethi.com!


    The greatest trick the devil ever pulled was convincing the world he didn''t exist.
    And like that . . . he''s gone.” Manesh, signing out.'
