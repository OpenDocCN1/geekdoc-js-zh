- img_proc: true
  md: '# Predefined Variables and Arrays


    means you can look at the URL and see all the variables and their values. On the
    other hand, POST hides all the variables from the address bar—instead, it is transparently
    passed to the PHP program.


    For example, you say you had a page at .something.com/page.php, which uses a GET
    form, and that the form passes the data to itself. After inputting the variables
    and pressing submit, the address bar might look like the following:


    ```

    http://www.something.com/page.php?first=value1&second=value2

    ```


    In this case, there are two fields on the form: The first field has the name set
    to first, and the user entered in value in the textbox. The second field is called
    second and the value is value2. As you can see, all the data is passed along the
    address bar. This means the user can manually change the values without even going
    through the form. POST, on the other hand, does not show the data in the URL address.
    After submitting the form, the address will look like this:


    ```

    http://www.something.com/page.php

    ```


    So would you use one or the other? In some cases, it is important to secure data
    by not passing it in the address bar. For example, if the form is a log in, you
    don''t want the password to be displayed in the address bar; you use POST. Alternatively,
    if you want the user to be able to bookmark a page through a form, using GET allows
    that.


    # Arrays


    To access the predefined variables, we have to use a variable array. Arrays are
    sets of variables that all have the same name, but are referenced by a specific
    number. Arrays look exactly like a normal variable, except it has a reference
    number attached to the end of the name. For example, while a normal variable might
    be called $name, an array of three names would look like this: $name[0], $name[1],
    $name[2]. In addition, arrays can use reference words rather than digits—example,
    $name["first"] or $name["second"] The number that you use to operate the variable
    in the array (such as first or 0) is called a key. You use the operator= to send
    the value into the key.


    You can create your own arrays in a few ways. The easiest way is to simply define
    each individual item from the array. For example, to create a few variables of
    the array $name, we could do this like:


    ```

    $name[1] = "Maneesh";

    ```'
