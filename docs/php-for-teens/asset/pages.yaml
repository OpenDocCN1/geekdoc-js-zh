  md: '# CHAPTER 5


    # CONSTANTS, EXPRESSIONS, AND OPERATORS


    In this chapter, we are going to go over some of the language basics. You use
    constants, expressions, and operators in a lot of programs and web pages, so it
    is very important to learn all about them. Let''s move forward and work with them.
    Ready?


    # Constants


    Constants are an important concept to learn because they can make your programs
    lot safer. Imagine a program that converts hours into days. You might have a hourDay
    constant that always equals 24. You can define constants, but once they are defined
    they can never be redefined or undefined. Unlike variables, constants never change
    throughout the entire program. Use constants whenever, for instance, you have
    a value you want to multiply all inputs by or a known natural constant as pi.
    Because the program cannot change the constant''s value, it is guaranteed to work
    correctly.


    You define constants differently than you do variables. With variables, you simply
    do something like this:


    ```

    $variable = value;

    ```


    You can change the value again just by doing something like this:


    ```

    $variable = newvalue;

    ```'
  merge: -1
