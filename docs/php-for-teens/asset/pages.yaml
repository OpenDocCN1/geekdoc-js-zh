  md: '# INTRODUCTION


    If you are holding this in your hand, you probably have some knowledge about the
    web—either that or someone asked you to buy this book for them. Whatever the case,
    you have found a gold mine! From this book you learn the secrets of dynamic web
    sites with PHP.


    What is dynamic content? Making a site change based on given information (hence
    the word dynamic). Perhaps you want to make a site where you can have several
    members who store all their favorite links. Well, with PHP, you can make your
    site offer dynamically different links to each user, maybe based on recommendations
    or previous links. PHP gives you total control.


    # Who This Book Is For


    You probably know better than I do who this book is for, but let me tell you what
    I think: You are a beginning programmer, with little or no background in PHP.
    You may or may not have HTML experience. You are willing to take the time to learn
    PHP by following this book closely and trying to make programs of your own.


    Your experience obviously doesn''t have to fit this exactly for you to benefit
    from this book. You may or may not be a teenager; many of my book''s readers are
    over 50 or under 13. The main thing is that you have a willingness to learn.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# Introduction


    What is the minimum knowledge you need to succeed here? You should be able operate
    a computer well. If you can use your PC or Apple without any major difficulties,
    you will probably do fine in this book. This book is paced for a beginner, and
    topics work on a PC, Mac, or Linux computer. I have included information on how
    to install the software for PCs and Macs, but you can find Linux instructions
    on www.php.net.


    If you ever any problems with any of this, feel free to email me at manesh@maneshsethi.com.


    # How This Book Is Organized


    The first few chapters introduce design and give a brief overview of the PHP language.
    You get a fast review of HTML and some PHP form design discussion. You learn about
    variables, constants, expressions, and operators. Then I begin talking about-advanced
    PHP items. You learn about controlling program flow through loops and control
    statements, organizing with functions, and enhancing web scripts with strings
    and arrays. Starting with the chapter on cookies, you get into some more-advanced
    topics. You are introduced to sessions and file handling. Finally, you get to
    the appendices, which lists all the functions throughout the book, as well as
    external resources and what is on the CD.


    All the source in this book is available on the CD. You just need to install your
    server (which I show you how to do in Chapter 1) before using any of it. Additionally,
    some of the figures were taken using different themes on a web browser. Don’t
    worry about the different themes—all of the source files should work as shown.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# CHAPTER 1


    # WELCOME TO PHP


    Hey, welcome to PHP For Teens. I''m really glad you picked up this book, and I
    want to let you know that you are in for a great ride. PHP, while easy to learn,
    is also an incredibly powerful and useful language, and this book will teach you
    everything you need to know to make seriously dynamic web sites.


    So what does PHP actually mean? PHP itself stands for PHP: Hypertext processor—seriously.
    Seems kind of crazy, because the name itself is part of the acronym, like it keeps
    going and on forever! PHP is also a current programming language that is often
    used on modern web sites and development applications. PHP is extendible, strong,
    and works with many external utilities. PHP is also pretty simple to learn. It
    is called a high-level language, which means it is between human language (English)
    and machine code (0s and 1s). Because of this, you can easily understand it and
    write it like normal writing, but it is also strong enough to do some complex
    things.


    So what can you actually do with PHP? You can make the Internet an interactive
    experience by creating forms that people can fill out and submit and then deal
    with the data however you like. For example, a visitor can email comments to a
    webmaster, or post comments on site, or join a forum. PHP really makes the Internet
    more usable.


    To use this book, you only need a rudimentary knowledge of how to design a web
    site. You need no programming background, but if you have done any programming
    before, you will understand the language much more quickly.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Chapter 1 Welcome to PHP


    fact, even if you have never developed a web site of any kind before, you will
    pick everything you need to know as we go along.


    In this chapter, we are going to go ahead and install PHP. Installing PHP takes
    two steps. First, you need to install a web server and second, you need to install
    PHP as a part of the web server. Fortunately, both of these parts are free and
    on the CD included in the back of this book. The specific installation steps are
    different depending on whether you are installing on a Mac or a PC. Because most
    readers will be using a PC, I will explain in depth how to install it on Windows
    machines. Then I''ll give a few hints on how to install it for Macs.


    # Installing PHP on Windows


    Installing PHP by itself will allow you to execute PHP files. At this point you
    can view them in a command-line prompt. This is rather annoying and ugly, so we
    are going to take an extra step to install a web server, which lets us view PHP
    files in a browser. We need to install the web server first. Let''s go over that
    before we work with PHP.


    Installing the web server is a pretty easy process on Windows, because the web
    server comes in one package and just need to open and install the files. The web
    server we are going to use is called Apache; it is free, common, and secure.


    # What''s a web server?


    > The web server is an important part of using PHP. A web server (also called
    an HTTP server) is a process that runs on your computer and sends out web pages
    when a browser tries to access. Whenever you go to a site (such as www.maneessethi.com),
    a web server is running on the domain and it returns the actual page that your
    browser sees. In effect, you are turning your machine into a web site by installing
    a web server.


    # Installing the Web Server


    Follow these steps to install the web server:


    +   - Find the installation file.

    The CD contains one of the files, but you can also go to www.apache.org to find
    the most current version of the file. Figure 1.1 shows you what the site looks
    like. As you can see, it''s a pretty big site. Apache does a lot of things for
    the computer.'
  merge: -1
