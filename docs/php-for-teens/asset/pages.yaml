    looking at at the URL. This also means that you can bookmark the results, and
    they will continue to show the correct results. With the POST method, you lose
    the form results each time. Also, Figure 5.8 shows what happens when I change
    the address bar to pass / rather than * for the operator. You can see here that
    it actually changes the page results.


    Using GET is great for pages where you want a visitor to be able to return. Since
    the data is stored in the URL, the user can easily bookmark the page with the
    correctly inputted information and access the interpreted data without submitting
    the form each time. However, GET has some drawbacks:


    +   - There is a URL-length limit that prevents you from having unlimited variables
    in the page.


    +   - Information is not secure. When passing secure information, such as a password,
    it is much better to use POST so that the sensitive data is not shown in the address
    bar.'
