    # Text-Formatting Tags


    Okay, let''s do some text editing. At some point you''re going to change the font
    or text color, as well as make some words italicized, underlined, or bold. HTML
    makes this easy. Let''s first get over the following functions:


    +   - Bold is done with <b></b>.


    +   - Italicizing is done with <i>.


    +   - Underlining is done with <u></u>.


    # Caution


    It is important to note that the <b>, <i></i>, and <u></u> tags are considered
    deprecated, or not recommended, by the HTML standard. Because HTML is moving to
    something Cascading Style Sheets (CSS), it is recommended you use CSS to do bold,
    underlining, and italicizing. The syntax for underlining in CSS is like this:
    <span style="font-style: italic"></span> Bold and underlining are the same, except
    replace italic with bold or underline. It''s an ugly syntax I am not using in
    this book, but to be forearmed that you should design any page with this if you
    expect the page to be around for several years, because browsers in the future
    may stop supporting the original tags.'
