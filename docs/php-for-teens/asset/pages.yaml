- img_proc: true
  md: '# Chapter 7 = Program Flow: Control Structures


    to change that flow. You might need to perform a different action because some
    special event occurs. PHP offers a way to do this with branching structures.


    # if


    The easiest way is to use the if branching structure. A basic backbone looks like
    the following:


    ```

    if (condition is true)

    {

    //execute statements

    }

    ```


    You obviously need to replace the comparison with a < condition test. Comparison
    tests are done using the comparison operators, such as <, >, !=, and so on. Take
    a look at Chapter 5 to see the comparison methods.


    We will create a page that allows a user to enter two numbers, and we use PHP
    to compare the two numbers and say which is bigger. First, let’s take a look at
    the form that would do this. We are going to use the GET submit method.


    ```

    <html>

    <head>

    <title>Comparing two numbers</title>

    </head>

    <body>

    <form name="compare" action="php07-01.php" method="get">

    Enter your first number: <input type="text" name="firstnumber">

    <br />Enter your second number: <input type="text" name="secondnumber">

    <br /> /><br /> /><input type="submit">

    </form>

    </body>

    </html>

    ```'
