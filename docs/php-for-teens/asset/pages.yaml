  md: '# CHAPTER 9


    # FUNCTIONS


    A function is essentially a section of code that you can call over and over again.
    This function can do repetitive tasks very easily and safely, and because it is
    encapsulated in a function name, that makes the main program look a lot neater.


    We have been using a lot of predefined functions, written by PHP, such as strval()
    and nl2br(). Notice how both functions have parentheses after the name? That is
    a function''s defining attribute. In Chapter 6 I explain that I format my-word
    functions using underscore. This is an example of one of my functions:


    ```

    execute_func();

    ```


    # Designing Your Own Functions


    You might be wondering why you would ever want to design a function. Functions
    allow your program to become a lot more robust and capable. Functions make your
    program modular, meaning that you can use parts of your program in other programs
    without worrying about problems. This means less work for you overall. Let''s
    take an example. Let''s say I had a program that added the numbers 1 through 10.
    This is how a sample program would look if I wrote it without functions:


    ```

    <?php

    echo "The following counter will add up the numbers 1 through 10";

    echo "<br>Please wait, your numbers are being tabulated below.";

    ```'
