  md: '# Chapter 5 = Constants, Expressions, and Operators


    Makes sense, right? Well, with constants, it is a little different. Defining a
    constant requires the use of a function called define(). You need to pass two
    parameters to the define() function for it to. The first parameter is the name
    of the constant, and the second is the constant''s value. The function is defined
    like this:


    ```

    define("CONSTANTNAME", constantvalue);

    ```


    Here are a few defined sample constants:


    ```

    define("BOOLEANCONSTANT", TRUE);

    define("INTEGERCONSTANT", 768);

    define("FLOATCONSTANT", 469.12);

    define("STRINGCONSTANT", "I am a string!");

    ```


    Pretty cool, huh? I only defined these four types of constants (Boolean, integer,
    float, and string) because they are the only valid types of constants. Constants
    can be defined anywhere in your program and are accessible without regard to scope.


    Another difference between constants and variables: When using a variable, you
    can use a $sign. For example, to print out a variable on the screen, you might
    do this:


    ```

    echo $variab;

    ```


    However, constants are referred to simply by name; they do not need a symbol.
    To display a constant on the screen, you would probably do something like this:


    ```

    echo CONSTANTNAME;

    ```


    Constants are like variables in that they are case sensitive. Make sure you pay
    attention to their capitalization. You can capitalize all the letters (as I have
    been doing, simply for stylistic purposes) or you can choose lowercase letters.
    whenever you reference your constants in the program, make sure that you use the
    correct capitalization scheme. For example, say you write a program that defines
    NAME as Smith, and the program echoes it on the screen. You need to echo it with
    the correct capitalization. What happens when we echo incorrectly?


    ```

    <?php

    define("NAME".Smith");

    echo name;

    ?>

    ```'
