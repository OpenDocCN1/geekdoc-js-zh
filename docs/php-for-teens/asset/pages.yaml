    8. Fill in some sample values (for example, somenet.com and www.somenet.com and
    enter an email address you like (doesn''t matter which one).

    Note that you can''t create a domain just by typing it. For the domain to work,
    you must have it already registered and set up to point to your computer.


    9. Press Next and choose to run Apache as a service for all users or only for
    the current user.

    If you install it as a service, Apache will start as soon as the computer boots
    up. You might get a warning about a firewall conflict with the web server if you
    have a firewall set up. In this case, I recommend you only use your server as
