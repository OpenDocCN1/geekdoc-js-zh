  md: '# Creating Cookies


    cookie should remain on the server. By default, if you leave the $expire parameter
    blank, the cookie disappears as soon as the visitor closes his browser. By setting
    $expire, you can make the cookie last a lot longer.


    Having a cookie run for the default amount of time—until the browser—is rarely
    useful in practice. If you were designing the page that remembers the user’s name,
    it would be ridiculous for it only to remember the name for one session. Using
    the $expire attribute allows the cookie to last for a meaningful length of time.
    However, in pages where you only want the cookie to last throughout the current
    use of the browser, you can use the cookie without the $expire attribute.


    To the set, we need a new function: time(). For the technical minded, this function
    returns the number of seconds since the epoch (which is an arbitrary point in
    time; most computers use January 1, 1970 as the epoch), but you can just think
    of it as returning what it is now. You set $expire to the value of time() plus
    the number of seconds you want the function to expire in.


    Let’s see how we define the time. We need the function to expire in a set of days
    or weeks. We can use the following $expire code:


    ```

    $expire = time() + 60 * 60 * 24 * 30

    ```


    Assuming we created the variables correctly earlier, this is identical to the
    following:


    ```

    $expire = time() + $secondsPerMinute * $minutesPerHour * $hoursPerDay * $daysPerMonth;

    ```


    Hmn, what does this do? Remember that time() returns the current time in seconds.
    We want to add the number of seconds we want the cookie to endure to the current
    time. If we forget to add time(), the cookie will have expired decades ago, making
    it worthless.


    Here are some cool examples of time. This isn’t actual PHP code, but it demonstrates
    how you can use time().


    ```

    15 seconds = time() + 15;

    30 minutes = time() * 60 * 30

    5 hours = time() * 60 * 60 * 5

    10 days = time() * 60 * 60 * 24 * 10

    ```


    Now that we have added the current time, we want to add the amount of time the
    cookie should last. Using multiplication like this makes it a lot easier to'
  merge: -1
  pgno: 193
- img_proc: true
  md: 'The first 60 is measured in seconds/minute, times 60 minutes/hour, times 24
    hours/day, times 30 days. This will result in a cookie that expires after 30 days.
    If we wanted to change it so that the cookie expired after two weeks, we could
    do something like this:


    ```

    $name = "samplecookie"

    $value = "samplevalue"

    $expire = time() + 60 * 60 * 24 * 14; //expire in 2 weeks

    setcookie($name, $value, $expire);

    ```


    This creates a cookie with the key samplecookie and the value samplevalue to expire
    after 14 days.


    The following setcookie() parameters are optional. You can use them when you want
    your cookies to work in specific cases or be stored in specific locations.


    # $path


    The $path variable lets you choose the path of the web server on which the cookie
    will be valid. The default value is the directory that the file is in. You can
    make the cookie valid for all the pages in your web server by setting $path to
    /. If you set it to /somefolder/images, the cookie only works in the images folder
    of somefolder. Make sure you set the correct path so you can use your cookies
    in all the pages you your site.


    # $domain


    $domain is often used when you have a web site with several subdomains. A subdomain
    is a site that is part of the original site, but whose URL is separated by a period.
    For example, maneessethi.com is the original site. I might create a subdomain
    such as subdomain.maneessethi.com. The actual domain is maneessethi.com, and the
    subdomain is subdomain.maneessethi.com. One trick is to remember that maneessethi.com
    is considered a subdomain even when you make the site into a subdomain.


    $domain refers to the domain for which the cookie is valid. In many cases, you
    want it to be valid for your entire web site. This is common when you have a site
    people might visit at website.com and at www.website.com. Because www.website.com
    is considered a subdomain, make sure that the cookie is valid for both options.'
  merge: -1
  pgno: 194
- img_proc: true
  md: 'To make the cookie valid to all subdomains, make the cookie set to .website.com,
    with a period before the name. This causes all subdomains to recognize the cookie.
    If you want only www.website.com to accept the cookie, use www.website.com as
    your $domain.


    # $secure


    The $secure parameter indicates that the cookie should only work over a secure
    HTTPS connection. We have not gone over HTTPS for this book, it will not work
    if you set this Boolean parameter to true. However, if you ever learn how to use
    HTTPS on your own, this is how you would enable it for your cookies.


    # Common Problems


    Many people have some difficulty defining a cookie. Let’s look at some of these
    problems.


    +   The web script in the PHP document does not recognize the cookie. Cookies
    are not usable until the web page has been refreshed, if you try to use a cookie
    on the same page where you created the cookie, the cookie will not work. In cases
    like these, simply use the value you assigned to the cookie to the areas where
    the value was going to be.


    +   The web browser accessing the document has disallowed cookies on the page.
    This causes a problem creating a cookie and throws out any you create. Double-check
    that your page will work well without cookies if a user wants to use the page
    without them.


    +   Sometimes, developers try to create a cookie that has no value. That is fine,
    make sure you set the value to " (no value), not false. Using the Boolean false
    creates a cookie that automatically deletes itself. Use a regular cookie and leave
    the value blank. A cookie with no value could let your PHP script know that the
    user has visited there, sort of as a place mark.


    +   Cookies change the HTTP header, you cannot put the setCookie function that
    defines and deletes cookies after any HTML code. Make sure your cookie code goes
    before the HTML header.


    If you double-check, your pages should be fine.'
  merge: -1
