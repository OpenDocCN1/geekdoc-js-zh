  md: '# CHAPTER 7


    # PROGRAM FLOW:

    CONTROL

    STRUCTURES


    You are going to use what you learned earlier to develop some really cool pages
    PHP programs. Control structures are part of that, taking a comparison statement
    and performing a comparison. If the comparison is true, special statements are
    executed. If the comparison is false, the statements are skipped.


    In this chapter, where I go over loops and branching structures, you learn ways
    to make your programs interactive and how to get PHP to act upon data and perform
    different actions depending on input.


    # Branching Structures


    Control structures include branching structures, which allow your program to make
    all these things:


    +   - if . . then decisions

    - Loops, which let execute some code repeatedly

    - Functions that put specialized code into their own separate section


    When you run a program, you expect it to go from beginning to end. Usually, the
    program displays everything that is in the code, putting each section one after
    another. When you write an HTML page, every part of the page is displayed in the
    same order as it is defined in the source. However, you might'
  merge: -1
