    HTML tags follow a strict set of conventions. Each tag is surrounded by less-than
    and greater-than brackets: < and >. Some tags have a beginning (opening) and ending
    (closing); the opening tag is surrounded by brackets and the closing tag is surrounded
    by brackets and preceded by a forward slash (/).


    The tags need to be properly nested, which results in the first tag opened being
    the last tag closed. In other words, when you open one tag, and then you open
    another tag within that first tag, the second tag you opened needs to be closed
    before closing the first tag. Let''s look at an example:


    ```

    <html>

    <head>

    </head>

    </html>

    ```


    Notice that the first opened tag, <html>, is also the last tag to be closed; remember
    that the tags that have / before them are the closing tags. In other words, it
    goes'
