  md: "# Let’s look at the structure:\n\n```\nwhile (condition is true)\n{\n    //execute\
    \ repeated statements\n} //end of loop\n```\n\nYou can enter whatever statements\
    \ you want executed.\n\n# Caution\n\nBe careful—don’t want to accidentally create\
    \ a loop that is always true. If the statement inside the condition test is never\
    \ false, the loop will execute forever. This could occur if you write something\
    \ like while (1=1) or even while(1), because any non-zero number is always true.\
    \ A common error is to check some condition that never occurs, while ($x!=7),\
    \ when the variable x never becomes 7. If you do this, the loop continues forever\
