  md: '# CHAPTER 12


    # COOKIES


    PHP has many functions and abilities for web sites. One of these capabilities
    is to create and use cookies. You may have heard of cookies while using your web
    browser. A cookie is a text file stored on the user’s machine. This text file
    has a data value, which stores some small amount of data. You just load this text
    file as a variable on pages that use the cookie, and that is your stored data!
    The text file is stored, in a hidden spot, by your web browser.


    Basically, a cookie is a way for a site to save some data on your computer. This
    can be good and bad. For example, a lot of spyware sites uses cookies to keep
    track of where you visit and use this data to sell ads to you. Also, make sure
    you don''t overdo it: A lot of people don''t like a lot of cookies because it
    seem like you storing data about them. On the other hand, using cookies allows
    you to choose and have those choices reflected on the site every time you use
    it.


    This might seem vague, so let me give an example. Say you have a site where the
    user enters her name. This name might be reflected in many parts of the site,
    such as on the top of every page and in printable sections and documents. It is
    a little annoying to have to reenter her name every time the user enters the site,
    so adding cookies is a great way to make things a little easier. The Internet,
    as a whole, does not save data, so the developers of PHP came up with cookies.'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# Creating Cookies


    Set cookies using the `setcookie()` function. This function has a lot of parameters.


    ```

    setcookie($name, [$value, $expire, $path, $domain, $secure)

    ```


    What do those brackets ([]) in the function declaration mean? Take a look at the
    `setcookie()` function. When a parameter is enclosed by brackets in a declaration
    like this, the parameters are optional. If you would prefer to leave them as they
    are default, you can do that. In addition, be careful when defining only the `$secure`
    parameter, but not the `$path` parameter, you will have to set `$path`. This is
    because you can only set the parameters from left to right—you cannot skip any.
    You must set `$name` first, `$value` second, `$expire` third, and so on. If you
    want to set one of the later parameters, you can set the earlier ones to their
    default value.


    # $name


    The first parameter of `setcookie()` is `$name`. This is the name of the cookie,
    and you will use this to reference it in the future. In fact, the cookie eventually
    becomes part of an array called `$_COOKIE`, if you want to reference a cookie,
    you would do it by calling the array like this:


    ```

    $_COOKIE[''name'']

    ```


    As you can see, the name eventually becomes its key for the array that it is part
    of.


    # $value


    The function''s second parameter is `$value`. If you want the cookie to be of
    any real use, you need to give it a value. You can reference the cookie later,
    get the value back, and use this value to affect your web site. In the example
    at the beginning of the chapter, we talked about creating a cookie that had a
    value of the visitor''s name. We would store the value using the `$value` parameter.
    We could then pull this value back later, and use it to reference the visitor''s
    name throughout the web site.


    # $expire


    `$expire` is the first complex parameter, because it isn''t part of the basic
    name-and-value entity. Instead, it refers to the amount of time, in seconds, that
    the'
