    # Double-Quoted Syntax


    Double-quoted syntax has these differences from single-quote syntax:


    +   - Many more escape sequences.

    - The way that variables are parsed. Parsing means displaying variables, and double
    quotes in a different (and easier) fashion.

    - A different way of dealing with variables. Table 8.1 lists escape sequences
    available when using double-quote syntax. Try to memorize those you will use.


    | Table 8.1 Common Escape Sequences |

    | Sequence | Name |

    | \n | Line feed |

    | \r | Carriage return |

    | \t | Horizontal tab |

    | \ | Backslash |

    | \$ | Dollar sign |

    |\" | Double quote |


    # Note


    There are two other double-quote syntax escape sequences, but they deal with numbers
    of different base.


