  md: "For example, if we were using while, what would happen if we wrote the following\
    \ code?\n\n```\n$x = 10;\nwhile($x < 10)\n{\n  echo $x;\n}\n```\n\nThis will obviously\
    \ do nothing, because $x starts off at 10. The while condition is never true and\
    \ the echo statements never execute. What if we use a do...while loop, however?\n\
    \n```\n$x = 10;\ndo\n{\n  echo $x;\n} while ($x < 10);\n```\n\nThis code would\
    \ simply display a counter from 1 to 10.\n\n> foreach is a specialized type of\
    \ loop that only works with arrays, so I go over it in Chapter 10.\n\n# break\
    \ and continue\n\nThere are two rare commands that deal with loops: break and\
    \ continue. You might remember break from the switch statement: When using it,\
    \ the switch command finished and exited. The same thing happens within loops.\
    \ break causes a loop to break out of the loop immediately. continue, on the other\
    \ hand, immediately forces the loop to go back to the top and execute from the\
    \ beginning, skipping the rest of the loop for that individual iteration."
