  md: '# CHAPTER 6


    # THE STYLE FACTOR


    This is the last chapter of the first part! Thus far, we''ve learned a lot about
    PHP programming, including designing a web page and forms, using variables operators,
    and communicating with expressions in our web pages. All of these items are very
    important in PHP programming, but there is one part we have neglected to talk
    about far: style. I use the word style in the sense of cleanliness and orderliness
    of your code. Whenever you develop a web page, you are going to have to write
    some code. This code, whether it is in HTML or PHP, can get large and ugly, so
    it is very important that you keep some structure within.


    No matter in what language you are writing your programs, your code style can
    become a big concern. Take the time to develop a structure. It will help make
    your code easier to understand.


    # Why Style?


    You might be wondering why it matters how organized or neat your code. After all,
    you are the only one who looks at it, right? It shouldn''t matter whether your
    code is commented or easy to understand—right?


    Wrong. Absolutely wrong. Many times I have written code for a game or project,
    and when I looked it over again three months later, I had no idea how the code
    worked. Even worse, sometimes I had errors in the code that I could not fix. If
    I had spent just a few more minutes making it nearer or more organized, my efficiency
    would have been hundreds of times better. Instead, I wasted'
