  md: '# Chapter 5 = Constants, Expressions, and Operators


    | Table 5.1 Arithmetic Operators |

    | Task | Symbol | Example |

    |---|---|--|\| Add two numbers | Addition (+) | $sum = a + b$ |

    | Subtract two numbers | Subtraction (-) | $difference = a - b$ |

    | Multiply two numbers | Asterisk (*) | $product = a * b$ |

    | Divide two numbers | Forward slash (/) | $quotient = a / b$ |

    | Retrieve a negative number | Subtraction (-) | $negative = -a$ |

    | Retrieve a division remainder | Percentage (%) | $remainder = a % b$ |


    The last two might be new to you. The negative operator returns the number''s
    negative value. For example, using the negative operator on 7 would return -7.
    This is a unary operator, meaning it only works on one input. The last arithmetic
    operator is called the modulus operator. It works in the same way as any of binary
    operators. For instance, 7% would return 0 because there is no remainder in 7/7
    division problem. In 9%7, the answer is 2, because there is a remainder. Modulus
    is awesome for checking some specific things, such as if a number is even or odd.
    6%2 is 0, meaning the number (6) is even, and 5%2 is odd (and it is equal to 1),
    meaning 5 is odd. If you are checking remainders, modulus is excellent for that
    purpose.


