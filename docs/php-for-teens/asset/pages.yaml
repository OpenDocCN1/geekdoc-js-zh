  md: '# Operators 83


    greater or less, depending on whether $x is greater than or less $y. Let''s take
    an in-depth look.


    $ans = ($x $y) "greater" : "less";


    First, $ans is created and is left to the side to be assigned to the operation
    results. Next, the operator tests the expression ($x $y). If this is true, the
    first result is returned: greater. If the test is false, the second result is
    returned: less. Because $ans is assigned to the result, it can only be greater
    or less. In this example, $x was not greater than $y, so the result was false
    and $ans was less. We then plugged this value into an echo statement:


    echo "After the test, we have determined that $x is $ans than $y";


    This statement echoes the results. First, it writes out "After the test, we have
    determined that $.". Then it writes out $x, followed by, displays the $ans value,
    and shows $y. Because $ans can only be greater or less, it will make a valid sentence
    sense. By the way, if $x and $y are both equal to the same number, the program
    is blank. In a real program, you need to handle that event.


    You might have noticed I used a different scheme to write out the echo statement.
    Earlier, we used single quotes to echo out text; here I used double quotes. Check
    out the sidebar to find out why.


    # Why can I echo with double quotes or single quotes?


    When using an echo command (or any command that requires quotation marks), consider
    whether you want to use single or double quotes. When writing out text, there
    is no difference. For example, echo ''Hello, World!'' is identical to echo "Hello,
    World!". When you use variables or constants within an echo statement, double
    quotes and single quotes are very different. Double quotes allow you to place
    a variable directly into the string, referenced by a $ symbol; PHP substitutes
    the variable''s value. However, with single quotes, the value is not substituted;
    instead, the page displays the quote name. To use variables within single-quoted
    statements, you need to use the dot operator (.), ending the string with a single
    quote and using the dot operator to join a variable and the string.


    # Arithmetic Operators


    Arithmetic operators are the most common. Most are basically the same ones you
    know your entire life: addition, subtraction, multiplication, and division. Arithmetic
    operators act just like you would expect them to when you do something like what
    you see in Table 5.1.'
