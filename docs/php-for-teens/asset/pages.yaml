  md: '# Reading in Files


    Reading in files is almost the same as writing to files—just the opposite. When
    we were writing to files earlier, we passed a string as a parameter that contained
    the data in the file. When we read files, the reading function returns a string
    that we can manipulate for our purposes.


    # fread()


    So what is the reading function, then? If you''ve been paying attention you can
    probably guess the name: fread(). Take a look at the function declaration:


    ```

    fread($handle, $lengthInBytes)

    ```


    Both of these parameters are required. The first parameter is the handle to the
    file we retrieved by using fopen(). The second parameter is the number of bytes
    you wish to retrieve. fread() only works for pages that have been opened for reading
    access.


    This sounds all well and good if you know the amount of data you need to retrieve,
    but if you don''t? What if you want to retrieve the entire file? Unfortunately,
    PHP gives you a way to do this. PHP''s filesize()function returns a file''s size
    in bytes. Look at the declaration:


    ```

    filesize($filename)

    ```


    Pretty cool, huh? If you want to read an entire file, you can do it as follows:


    ```

    $contents = fread($handle, filesize($filename));

    ```


    There are a couple other functions you should know about. One is fgets(), which
    reads the file until the carriage return, returning the current line. You can
    call this inside a loop and display or act upon the entire contents of a file.


    # file()


    Another cool function is file(), which takes the entire file into an array requiring
    an fopen() command! All you have to do is pass file() to the filename, and follows:


    ```

    $entireFile = file("yourfile.txt");

    ```


    This creates an array of each line of the file. As an alternative, you can use
    a foreach loop and act upon each line of the file.'
