  md: '# Chapter 11 = Advanced Forms


    We are going to create one basic form that lets you enter a message, a subject,
    a from to address. We will put that into a PHP mailer and let the file email something
    to whoever the user chooses. Let''s start off by designing the form document.
    This file is located in phpft11-04.html on the CD.


    ```

    <!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"

