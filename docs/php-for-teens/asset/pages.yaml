  md: '# Using PHP and Forms


    # Caution


    A password box does not secure or encrypt the data in any way, so it is possible
    the information could be stolen.


    Remember to use the POST method on your form. GET sends the data through the address
    bar, and it is very easy to steal the data just by looking at the URL. POST hides
    this data from the link. If you send data through POST, make sure you use the
    $_POST array to access data.


    # Note


    I go over file selectors, another important HTML element, in Chapter 14.


    # Hidden Fields


    Another type you might want to learn about the hidden field. No user can see it,
    but a hidden field can pass data through forms. You can use the hidden field to
    keep necessary data live through all of your pages in a simple manner. You can
    make a hidden field like follows:


    ```

    <input name="hiddenfield" type="hidden" value="whateverValueYouWant" />

    ```


    # Using PHP and Forms


    So far we have looked at the basics of entering items on a form and submitting
    it to another page that utilizes PHP and deals with the inputs. However, you may
    not want to submit the information to another page. In the same page that loads
    in the data and uses it for calculations. This can be useful when you want the
    user''s input to change the page onscreen.


    I used this myself when developing a web site. On one page, the user was allowed
    to enter data to a code to make the item cheaper. I didn''t want to submit the
    code to another page, because that would require multiple pages with almost entirely
    identical content. Instead, I developed only one page that dealt with the data
    if the code was submitted, but did the PHP if the code was skipped.


    The first thing I needed to do was develop a form. In most cases, the form submits
    the data to another page using the action attribute, but in this case we did not
    have the benefit of having another page to submit the information. Fortunately,
    there is a predefined variable that contains the address of the page'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# Chapter 11 Advanced Forms


    from where it is called. This is part of the predefined array $_SERVER and the
    complete variable name $_SERVER[''PHP_SELF'']. By setting the action attribute
    of the <form> tag to this location, the form sent the data to the same page and
    interacted upon it. The form declaration looked like this:


    ```

    <form name="couponcode" action="<?php $_SERVER[''PHP_SELF'']?> method="get">

    //rest of form here

    </form>

    ```


    # Note


    There is an easier way to do this, if you remember from earlier chapters. By leaving
    out the action attribute altogether, the form will call itself automatically.
    However, I wanted to demonstrate some cool interpolation and array variables,
    so we will continue with $_SERVER[''PHP_SELF''] for this example.


    Check out the action attribute. This wants to use the PHP_SERVER variable, but
    the problem is that HTML itself does not know what the variable means! Only PHP
    uses this predefined variable, so we need to escape into PHP before using the
    array variable. This is done using <?php and ?>.


    Now that we have created the basic level of the form, we need to add a textbox
