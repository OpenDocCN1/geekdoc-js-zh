  md: "# Chapter 12 = Cookies\n\nThis section assigns the value of the form to the\
    \ variable $cookievalue. It then tests to make sure $cookievalue has a value.\
    \ If it is blank, a statement is echoed referring the user to go back to the form\
    \ page and submit the form.\n\nNote the following statement: exit. It is a language\
    \ construct exit. This construct should be used if there is an error—it halts\
    \ execution of the PHP script in the web page and causes the page to skip over\
    \ any further PHP. When you have an error such as this one, you can use exit to\
    \ tell the browser that an error has occurred.\n\nIt’s important to note that\
    \ some PHP programmers prefer that you never use exit(), because it breaks the\
    \ flow of the program. If you want the web page to completely load whether or\
    \ there is not an error, you should not use exit(). The best time to use exit()\
    \ is when the error is fatal, and you do not want the program to continue to execute\
    \ without it.\n\nAfter this section, we have another that checks to see if a cookie\
    \ has been set recently, depending on the cookie length:\n\n```\n//If the cookie\
    \ has been set recently\nif (isset($_COOKIE['name']))\n{\n    setCookie(\"name\"\
    , \"\", time()-1);\n    unset($_COOKIE['name']);\n}\n```\n\nHere we use two new\
    \ functions to see if a cookie has been created. isset() returns true if its parameter\
    \ (in this case, the name cookie) has been set. If the cookie was set, we delete\
    \ the cookie by resetting it to expire in the past, and then we use unset() function\
    \ to delete the cookie from the $_COOKIE array. Why do we reset the cookie with\
    \ the setCookie() function? We to redefine the cookie to delete it, because no\
    \ function directly deletes it. Instead, we use the setCookie() function to delete\
    \ it by creating a cookie with the same name that expires in the past (time()-1).\
    \ The cookie is automatically deleted by the web browser.\n\nThe last step is\
    \ to create the cookie:\n\n```\n//Whether or not the cookie was set earlier, set\
    \ this cookie.\nsetcookie(\"name\", $cookievalue, time() + 60 * 60 * 24 * 12);\n\
    ```\n\n```\necho \"Cookie has been set, please visit\n<a href=\"phpft12-01result.php\"\
    >phpft12-01result.php</a> to see the result.\";\n?>\n```"
