    <html>

    <head>

    <title>PHP Email</title>

    </head>


    <body>

    <form name="email" action="phpft11-04.php method="post">


    <p>Please fill out the form to send an email.\p>

    <p>Enter your email address: <input type="text" name="from"> Enter recipient''s
    email address: <input type="text" name="to">\p>

    <p>Enter subject: <input type="text" name="subject">\p>

    <p>Enter your message:<br><textarea name="message" rows="10" cols="40"></textarea></p>


    <p><input type="submit"> <input type="reset">\p>

    </form>


    </body>


    </html>

    ```


    This is a pretty simple page, right? You can see what it looks like in Figure
    11.8.

    If you thought this was simple, look at the PHP code you send it in phpft11-04.php:


    ```

    <?php

    $to = $_POST[''to''];

    $subject = $_POST[''subject''];

    $message = $_POST[''message''];

    $headers = ''From: '' . $_GET[''from''] . '' .\r\n ''


    mail($to, $subject, $message, $headers);

    ?>

    ```'
