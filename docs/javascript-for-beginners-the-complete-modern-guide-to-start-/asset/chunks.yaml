    so it is not necessary to compile the programs to execute them. In other words,
    programs written with JavaScript can be tested directly in any browser without
    the need for intermediate processes.Despite its name, JavaScript has no direct
    relationship with the Java programming language.How to include JavaScript in XHTML
    documentsThe integration of JavaScript and XHTML is very flexible since there
    are at least three ways to include JavaScript code in web pages.Include JavaScript
    in the same XHTML documentThe JavaScript code is enclosed between <script> tags
    and is included anywhere in the document. Although it is correct to include any
    block of code in any area of the page, it is recommended to define the JavaScript
    code within the header of the document (within the <head> tag).Example of JavaScript
    code in the document itself </title><script type = "text / javascript"> alert
    ("A test message") ;</script></head><body><p> A paragraph of text. </p></body></html>In
    order for the resulting XHTML page to be valid, it is necessary to add the type
    attribute to the < script>. The values included in the type attribute are standardized
    and in the case of JavaScript, the correct value is text / javascript.This method
    is used when defining a small block of code or when you want to include specific
    instructions in a specific HTML document that complete the instructions and functions
    that are included by default in all documents on the website.The main drawback
    is that if you want to make a modification to the code block, it is necessary
    to modify all the pages that include that same block of JavaScript code.Define
    JavaScript in an external fileJavaScript instructions can be included in an external
    JavaScript file that XHTML documents link using the <script> tag. You can create
    all the necessary JavaScript files and each XHTML document can link as many JavaScript
    files as you need.In addition to the type attribute, this method requires defining
    the src attribute, which indicates the URL corresponding to the JavaScript file
    to be linked. Each <script> tag can only link a single file, but on the same page
    you can include as many <script> tags as necessary.JavaScript files are normal
    text documents with the extension .js, which can be created with any text editor
    such as Notepad, Wordpad, EmEditor, UltraEdit, Vi, etc .The main advantage of
    linking an external JavaScript file is that the XHTML code of the page is simplified,
    that the same JavaScript code can be reused on all pages of the website and that
    any modification made to the JavaScript file is immediately reflected in all the
    XHTML pages that link it.Include JavaScript in XHTML elementsThis last method
    is the least used, since it consists of including JavaScript pieces within the
    XHTML code of the page:<! DOCTYPE html PUBLIC "- // W3C // DTD XHTML 1.0 Transitional
    // EN" "http://www.w3.org/TR/ xhtml1 / DTD / xhtml1-transitional.dtd"><html xmlns
    = "http://www.w3.org/1999/xhtml"><head><meta http -equiv = "Content-Type" content
    = "text / html; charset = iso-8859-1" /><title> Example of JavaScript code in
    the document itself </title></head><body><p onclick = "alert (''A test message'')">
    A paragraph of text. </p></body></html>The biggest drawback of this method is
    that it unnecessarily soils the page''s XHTML code and complicates maintenance
    of the JavaScript code. In general, this method is only used to define some events
    and in some other special cases, as will be seen later .Noscript TagSome browsers
    do not have full JavaScript support, other browsers allow you to partially block
    it and even some users completely block the use of JavaScript because they believe
    they are browsing more securely.In these cases, it is common that if the web page
    requires JavaScript for its correct operation, a warning message to the user is
    included indicating that you should activate JavaScript to fully enjoy the page.
    The following example shows a JavaScript-based web page when accessed with JavaScript
    enabled and when accessed with JavaScript completely disabled.The following code
    shows an example of using the <noscript> tag:<head> ... </head><body><noscript><p>
    Welcome to My Site </p><p> The page you are viewing requires the use of JavaScript
    for its operation.If you have intentionally disabled it, please enable it again.
    </p></noscript></body>The <noscript> tag must be included inside the <body> tag
    (usually included at the beginning of <body >). The message that shows <noscript>
    can include any XHTML element or tag.Basic GlossaryScript: each of the programs,
    applications or pieces of code created with the JavaScript programming language.
    A few lines of code form a script and a file of thousands of lines of JavaScript
    is also considered a script. Sometimes it is translated into Spanish directly
    as "escribir", although script is a more appropriate and commonly accepted word
    .Sentence: each of the instructions that form a script.Reserved words: these are
    the words (in English) that are used to construct JavaScript statements and therefore
    cannot be used freely.SyntaxThe syntax of a programming language is defined as
    the set of rules that must be followed when writing the source code of the programs
    to be considered correct for that programming language.The basic rules that define
    JavaScript syntax are as follows:▪ Blank spaces and new lines are not taken into
    account: as is the case with XHTML, the JavaScript interpreter ignores any remaining
    blank space, so the code can be properly sorted to better understand it (tabulating
    the lines, adding spaces, creating new lines, etc.)▪ The case is case sensitive:
    as is the case with the syntax of the XHTML tags and elements. However, if an
    XHTML page is used interchangeably, the page is displayed correctly, the only
    problem being the non-validation of the page. On the other hand, if JavaScript
    is exchanging upper and lower case letters, the script does not work.▪ The type
    of the variables is not defined: when creating a variable, it is not necessary
    to indicate the type of data that will be stored. In this way, the same variable
    can store different types of data during script execution.▪ It is not necessary
    to end each sentence with the semicolon character (;): in most programming languages,
    it is mandatory to finish each sentence with the character; Although JavaScript
    does not require you to do so, it is convenient to follow the tradition of ending
    each sentence with the semicolon character (;).▪ Comments can be included: comments
    are used to add information in the source code of the program. Although the content
    of the comments is not displayed on the screen, it is necessary to take precautions
    on the information included in the comments.JavaScript defines two types of comments:
    those of a single line and those that occupy several lines.Example of a single
    line comment:// below is an alert message ("test message");Single line comments
    are defined by adding two slashes (//) at the beginning of the line.Example of
    multi-line comment:/ * Multi-line comments are very useful when you need to include
    enough information in comments * / alert ("test message");Multiline comments are
    defined by enclosing the text of the comment between the symbols / * and * /.Possibilities
    And LimitationsSince its inception, JavaScript has always been used massively
    by most Internet sites. The appearance of Flash diminished its popularity since
    Flash allowed to perform some actions impossible to carry out through JavaScript.However,
    the appearance of AJAX applications programmed with JavaScript has returned an
    unparalleled popularity within web programming languages.As for the limitations,
    JavaScript was designed to run in a very limited environment that would allow
    users to rely on the execution of the scripts.In this way, JavaScript scripts
    cannot communicate with resources that do not belong to the same domain from which
    the script was downloaded. Nor can scripts close windows that have not opened
    those same scripts. The windows that are created cannot be too small or too large
    or placed outside the user''s view (although the specific details depend on each
    browser) .In addition, scripts cannot access the files of the user''s computer
    (neither in read mode nor in write mode) and cannot read or modify browser preferences.Finally,
    if the execution of a script lasts too long (for example due to a programming
    error), the browser informs the user that a script is consuming too many resources
    and gives the possibility to stop its execution.In spite of everything, there
    are alternatives to be able to skip some of the above limitations. The most used
    and known alternative is to digitally sign the script and ask the user for permission
    to perform these actions.Javascript And BrowsersThe most modern browsers currently
    available include JavaScript support up to the version corresponding to the third
    edition of the ECMA-262 standard. The biggest difference lies in the dialect used
    since while Internet Explorer uses JScript, the rest of browsers (Firefox, Opera,
    Safari, Konqueror) use JavaScript.Javascript In Other EnvironmentsThe unparalleled
    popularity of JavaScript as a web application programming language has been extended
