    ## Introduction

    There are plenty of books on this subject on the market, thanks again for choosing
    this one! Every effort was made to ensure it is full of much information as possible,
    please enjoy!


    What is JavaScript?

    JavaScript is an interpreted programming language, so it is not necessary to compile
    the programs. Despite its name, JavaScript has no direct relationship with the
    Java language.


    How to include JavaScript in XHTML documentsThe integration of JavaScript and
    XHTML is very flexible since there are at least three ways to include JavaScript
    code in web pages.


    Noscript Tag

    Some browsers do not have full JavaScript support, other browsers allow you to
    partially block it and even some users block JavaScript because they believe more
    securely. In these cases, it is common that the web page requires JavaScript for
    its correct operation, a warning message is included to the user indicating that
    you should activate JavaScript to fully enjoy the page. The following example
    shows an example of a JavaScript-based web page when accessed with JavaScript
    enabled and when accessed with JavaScript disabled:


    ```html

    <head>...</title>Example of JavaScript code in the document itself</title><script
    type="text / javascript"></script>

    ```


    <body><p> A paragraph of text. </p></body>


    In order for the resulting XHTML page to be valid, it is necessary to add the
    `type` attribute to the `<script>`. The values included in the `type` attribute
    are standardized and in the case of JavaScript, the correct value is `text / javascript`.


    ### Basic Glossary

    - **Script**: each of the programs, applications or pieces of code created with
    the JavaScript language. A few lines of code form a script and thousands of lines
    is also considered a script.

    - **Sentence**: each of the instructions that form a script.

    - **Reserved words**: these are the words (in English) that are used to construct
    JavaScript statements and therefore cannot be used freely.


    ### Syntax

    The syntax of a programming language is defined as the set of rules that must
    be followed when writing the source code of the programs to be considered correct
    for that language. The basic rules that define JavaScript syntax are as follows:

    - Blank spaces and new lines are not taken into account: as is the case with XHTML,
    the JavaScript interpreter ignores any blank space so the code can be properly
    sorted to better understand it (tabulating the lines, adding spaces, creating
    new lines, etc.)

    - The case is case sensitive: as is the case with the syntax of the XHTML tags
    and elements. However, if an XHTML page is used interchangeably, the page is displayed
    correctly, the only problem being the non-validation of the page. On the other
    hand, if JavaScript is exchanging upper and lower case, the script does not work.

    - The type of variables is not defined: when creating a variable it is not necessary
    to indicate the type of data that will be stored. In this way, the same variable
    can store different types of data during script execution.

    - It is not necessary to end each sentence with the semicolon (;): in most programming
    languages, it is mandatory to finish each sentence with the character; Although
    JavaScript does not require you to do so, it is convenient to follow the tradition
    of ending each sentence with the semicolon (;).

    - Comments can be included: comments are used to add information in the source
    code of the program. Although the content of the comments is not displayed on
    the screen, it is necessary to take precautions on the information included in
    the comments. JavaScript defines two types of comments: those of a single line
    and those that occupy several lines.


    Example of a single line comment

    ```javascript

    // below is an alert message ("test message");

    ```


    Example of multi-line comment

    ```javascript

    /* * Multi-line comments are very useful when you need to include enough information
    in comments * /

    alert ("test message");

    ```

    Multiline comments are defined by enclosing the text of the comment between the
    symbols `/*` and `*/`.


    ### Possibilities And Limitations

    Since its inception, JavaScript has always been used massively by most Internet
    sites. The appearance of Flash diminished its popularity since Flash allowed to
    perform some actions impossible to carry out through JavaScript. However, the
    appearance of AJAX applications programmed with JavaScript has returned an unparalleled
    popularity within web programming languages. As for the limitations, JavaScript
    was designed to run in a very limited environment that would allow users to rely
    on the execution of the scripts. In this way, JavaScript scripts cannot communicate
    with resources that do not belong to the same domain from which the script was
    downloaded. Nor can scripts close windows that have not opened those same scripts.
    The windows that are created cannot be too small or too large or placed outside
    the user''s view.


    ### Javascript And Browsers

    The most modern browsers available include JavaScript support up to the version
    corresponding to ECMA. The most modern browsers are Firefox, Chrome, IE, Opera,
    Safari. The biggest difference lies in the dialect used since while Internet Explorer
    uses JScript, the rest of browsers use JavaScript.


    ### Javascript In Other Environments

    The unparalleled popularity of JavaScript as a web application has been extended
    to other applications and non-web related. Tools like Adobe Acrobat allow to include
    JavaScript in PDF files. Other tools such as Flash and Flex use ActionScript.


    ## Chapter 1 – Why Javascript?


    ### Why Learn Javascript?

    Here are a few points to consider: It is the programming language of web browsers
    (all the important ones support it and have it activated by default: Firefox,
    Chrome, IE, Safari...), which make it the most popular language on the Internet.
    There are other options, but they require installation and activation through
    plugins or only work in specific browsers.


    ### Python Vs Javascript: Which One Is Better For Web Development?

    It is difficult to find a person or company that lacks a website. Many of these
    sites are programmed “to measure”, and in most cases they fulfill functions superior
    to the demonstrative and informative ones, which even less static– corporate sites
    were born.


    ### What is Python?

    Python is a minimalist language, which contains a syntax that makes it quite simple.
    It is an interpreted language, so to say, not compiled, in addition this serves
    for all types of development especially to give dynamics to objects in different
    programs and paradigms. Undoubtedly Python is one of the best options to develop
    a website, especially when you know the basic elements of language.


    ### Python Features

    - **Minimalist Code**: Yes, the code and the simple syntax are perfect for developing
    websites.

    - **Well Paid**: That''s right, if you are going to develop a Python website,
    prepare your bank account, since the benefit you receive from developing a Python
    website will be very profitable, as you can see in Medium.

    - **Multiplatform**: Python can not only run in an operating system, so you can
    take it anywhere, from free operating systems such as Linux and through the already
    known Windows or Mac, in addition to other devices that have systems based on
    the aforementioned distributions.

    - **Extensive Libraries**: An advantage that comes very well from Python is the
    amount of libraries you can find to develop. There is a wide variety of reusable
    code, from game creation to large websites.


    ### What Is Javascript?

    JavaScript is a simple language, which hardly interpreted with a browser. This
    means that it does not need to be compiled for execution. JavaScript is highly
    recommended for the realization of web pages since it allows the development of
    the user in it. How? JavaScript allows the website to be as static as possible,
    and comes hand in hand with other compulsory learning languages, such as HTML
    and CSS. What gives interactivity to the web with animations, which allows the
    user to feel more at ease, since he will not observe a flat website, all this
    is included in JavaScript. Normally with JavaScript, programs or applications
    are created and then inserted into the website to be used. Likewise, they are
    used to develop mobile applications and complex programs, from the Backend and
    Front End point of view.


    ### Characteristics of JavaScript

    - **Requested**: Most of the potential clients ask that their websites be developed
    in JavaScript, because it is simple and also economical compared to Python.

    - **Easy To Learn**: Undoubtedly, this is an advantage that JavaScript has, since
    it has been well documented in its different stages and has a large community,
    in which the novice developer can be supported to achieve a learning with solid
    bases.

    - **Fast Versatile**: Since this is executed with the browser it is very easy
    to develop and test improvements, it can also be used to give dynamism and interactivity
    to a web page and then use that code to create a mobile version of that site.

    - **Good Integration**: High level of integration with cloud platforms, such as
    Amazon Cloud and Heroku. This means that in a large number of cases we have facilities
    to upload our program with some basic steps unlike Python, which when working
    with different frameworks requires specific actions that are not always provided
    by the support, or in any case, not regularly found on platforms that use JavaScript.


    ### Advantages And Disadvantages Of Javascript

