    FrontPage / Adobe DreamweaverThe HTML code editors allow you to view the code
    of the page and thus access the JavaScript part. But they do not have functionalities
    capable of adding breakpoints and knowing the value of the variables.Chapter 2
    - Basic ProgrammingBefore starting to develop programs and utilities with JavaScript,
    it is necessary to know the basic elements with which the applications are built.
    If you already know how to program in some programming language, this chapter
    will help you to know the specific syntax of JavaScript.If you have never programmed,
    this chapter explains in detail and starting from scratch the basic knowledge
    necessary to be able to later understand the advanced programming, which is the
    one used to create the real applications.VariablesThe variables in the programming
    languages follow a logic similar to the variables used in other fields such as
    mathematics. A variable is an element that is used to store and reference another
    value. Thanks to the variables it is possible to create "generic programs", that
    is, programs that always work the same regardless of the specific values used.In
    the same way that if in Mathematics the variables did not exist the equations
    and formulas could not be defined, in programming one could not make really useful
    programs without the variables. If there were no variables, a program that adds
    two numbers could be written as: result = 3 + 1The previous program is so unhelpful
    that it only applies to the case where the first number of the sum is 3 and the
    second number is 1\. In any other case, the program obtains an incorrect result
    .However, the program can be remade as follows using variables to store and refer
    to each number:number_1 = 3 number_2 = 1result = number_1 + number_2Elements number_1
    and number_2 are variables that store the values used by the program. The result
    is always calculated based on the value stored by the variables, so this program
    works correctly for any number of indicated numbers. If the value of the variables
    number_1 and number_2 is modified, the program continues to function correctly.Variables
    in JavaScript are created using the reserved word var. In this way, the previous
    example can be done in JavaScript as follows:var number_1 = 3; var number_2 =
    1;var result = number_1 + number_2;The reserved word var should only be indicated
    when defining the variable for the first time, which is called declaring a variable.
    When the variables are used in the rest of the script instructions, it is only
    necessary to indicate their name. In other words, in the previous example it would
    be a mistake to indicate the following:var number_1 = 3; var number_2 = 1;var
    result = var number_1 + var number_2;If a value is also assigned when a variable
    is declared, it is said that the variable has been initialized. In JavaScript,
    it is not mandatory to initialize the variables since they can be declared by
    one party and assign them a value later. Therefore, the previous example can be
    remade as follows:var number_1; var number_2;number_1 = 3; number_2 = 1; var result
    = number_1 + number_2 ;One of the most surprising features of JavaScript for programmers
    accustomed to other programming languages is that it is not necessary to declare
    the variables. In other words, you can use variables that have not been previously
    defined by the reserved word var. The previous example is also correct in JavaScript
    as follows:var number_1 = 3; var number_2 = 1;result = number_1 + number_2;The
    result variable is not declared, so JavaScript creates a global variable (the
    differences between local and global variables will be seen later) and assigns
    it the corresponding value. In the same way, the following code would also be
    correct:number_1 = 3; number_2 = 1;result = number_1 + number_2;In any case, it
    is recommended to declare all the variables to be used.The name of a variable
    is also known as an identifier and must comply with the following rules:▪ It can
    only consist of letters, numbers, and the symbols $ (dollar) and _ (underscore).▪
    The first character cannot be a number.Therefore, the following variables have
    correct names:var $ number1; var _ $ letter; var $$$ otherNumber; var $ _ to $
    4;However, the following variables have incorrect identifiers:var 1number;​ //
    Start with a number var number; 1_123; // Contains a character "; "Types Of VariablesAlthough
    all JavaScript variables are created in the same way (using the reserved word
    var), the way in which they are assigned a value depends on the type of value
    to be stored (numbers, texts, etc.)NumericThey are used to store integer numerical
    values (called integer in English) or decimals (called float in English). In this
    case, the value is assigned by directly indicating the integer or decimal number.
    Decimal numbers use the character. (period) instead of, (comma) to separate the
    whole part and the decimal part:var iva = 16;​ // integer variable var total =
    234.65; // decimal type variableText StringsUsed to store characters, words and/or
    text phrases. To assign the value to the variable, the value is enclosed in double
    or single quotes, to delimit its beginning and its end:var message = "Welcome
    to our website"; var productName = ''Product ABC''; var Selected letter = ''c'';Sometimes,
    the text that is stored in the variables is not so simple. If, for example, the
    text itself contains single or double quotes, the strategy followed is to enclose
    the text with quotes (single or double) that the text does not use:/ * The content
    of text1 has single quotes, so it is enclosed with double quotes * /var text1
    = "A phrase with ''single quotes'' inside";/ * The content of text2 has double
    quotes, so it is enclosed with single quotes * /var text2 = ''A phrase with "double
    quotes" inside'';However, sometimes text strings contain both single and double-quotes.
    In addition, there are other characters that are difficult to include in a text
    variable (tab, ENTER, etc.). To solve these problems, JavaScript defines a mechanism
    to easily include special and problematic characters within a text string.The
    mechanism consists of replacing the problematic character with a simple combination
    of characters. In this way, the previous example that contained single and double
    quotes within the text can be redone as follows:var text1 = ''A phrase with \''
    single quotes \ ''inside''; var text2 = "A phrase with \" double quotes \ "inside";ArraysSometimes,
    arrays are called vectors, matrices, and even arrays. However, the term array
    is the most used and is a commonly accepted word in the programming environment.An
    array is a collection of variables, which can be all of the same type or each
    of a different type. Its utility is better understood with a simple example: if
    an application needs to handle the days of the week, seven variables of type text
    could be created:var day1 = "Monday"; var day2 = "Tuesday"; ... var day7 = "Sunday";Although
    the previous code is not incorrect, it is inefficient and complicates the programming
    excessively. If instead of the days of the week you had to save the name of the
    months of the year, the name of all the countries in the world or the daily temperature
    measurements of the last 100 years, you would have to create tens or hundreds
    of variables.In these types of cases, all related variables can be grouped into
    a collection of variables or array. The previous example can be remade as follows:
    var days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday",
    "Sunday"];Now, a single variable called days stores all related values, in this
    case, the days of the week. To define an array, the characters [and] are used
    to delimit its beginning and end and the character, ( comma) is used to separate
    its elements: var array_name = [value1, value2, ..., valueN];Once an array is
    defined, it is very easy to access each of its elements. Each element is accessed
    indicating its position within the array. The only complication, which is responsible
    for many errors when starting to program, is that the positions of the elements
    begin to be counted at 0 and not at 1:var day Selected = days [0];​ // selected
    day = "Monday" var otherDay = days [5]; // otherDay = "Saturday"In the previous
    example, the first instruction wants to get the first element of the array. To
    do this, the name of the array is indicated and in square brackets the position
    of the element within the array. As mentioned, the positions begin to be counted
    at 0, so the first element occupies the position 0 and is accessed through days
    [0].The days value [5] refers to the element that occupies the sixth position
    within the days array. As the positions begin to be counted at 0, position 5 refers
    to the sixth element, in this case, the Saturday value.BooleansBooleans or Boolean
    type variables are also known as logical type variables. Although to really understand
    its usefulness you should study the advanced programming with JavaScript in the
    following chapter, its basic operation is very simple.A variable of type boolean
    stores a special type of value that can only take two values: true (true) or false
    (false). It cannot be used to store numbers, nor can it save text strings.The
    only values that can store these variables are true and false, so the true and
    false values cannot be used. Below are a couple of Boolean variables:var Registered
    client = false; var vatIncluded = true ;OperatorsVariables alone are of little
    use. Until now, we have only seen how to create variables of different types and
    how to show their value through the alert () function. To make really useful programs,
    other tools are necessary.Operators allow you to manipulate the value of variables,
    perform mathematical operations with their values and compare different variables.
    In this way, operators allow programs to perform complex calculations and make
    logical decisions based on comparisons and other types of conditions.AssignmentThe
    assignment operator is the most used and the easiest. This operator is used to
    store a specific value in a variable. The symbol used is = (not to be confused
    with the operator == that will be seen later): var number1 = 3;To the left of
    the operator, the name of a variable must always be indicated. To the right of
    the operator, you can indicate variables, values, logical conditions, etc:var
    number1 = 3; var number2 = 4;/ * Error, the assignment is always made to a variable,
    so on the left, you cannot indicate a number * /5 = number1;// Now, variable number1
    is worth 5 number1 = 5;// Now, the variable number1 is worth 4 number1 = number2;Increase
    And DecreaseThese two operators are only valid for numerical variables and are
    used to increase or decrease the variable value by one unit.Example:var number
    = 5; ++ number ;alert (number); // number = 6The increment operator is indicated
    by the prefix ++ in the variable name. The result is that the value of that variable
    is increased by one unit. Therefore, the previous example is equivalent to:var
    number = 5; number = number + 1; alert (number); // number = 6Equivalently, the
    decrement operator (indicated as a prefix - in the name of the variable) is used
    to decrease the value of the variable:var number = 5; --number;alert (number);
    // number = 4The previous example is equivalent to:var number = 5; number = number
    - 1; alert (number); // number = 4The increment and decrement operators can not
    only be indicated as a prefix of the variable name, but it is also possible to
    use them as a suffix. In this case, their behavior is similar but very different.
    In the following example:var number = 5; number ++;alert (number); // number =
    6The result of executing the previous script is the same as when the ++ number
    operator is used, so it may seem equivalent to indicate the ++ operator in front
    of or behind the variable identifier. However, the following example shows their
    differences:var number1 = 5; var number2 = 2; number3 = number1 ++ + number2;
    // number3 = 7, number1 = 6var number1 = 5; var number2 = 2; number3 = ++ number1
    + number2;// number3 = 8, number1 = 6If the ++ operator is indicated as a prefix
    of the variable identifier, its value is increased before performing any other
    operation. If the ++ operator is indicated as a variable identifier suffix, its
    value is increased after executing the statement in which it appears.Therefore,
    in the instruction number3 = number1 ++ + number2 ;, the value of number1 is increased
    after the operation (first it is added and number3 is worth 7, then the value
    of number1 is increased and is worth 6). However, in the instruction number3 =
    ++ number1 + number2 ;, first the value of number1 is increased and then the sum
    is made (first it increases number1 and voucher 6, then the sum is made and number3
    voucher 8).LogicalLogical operators are essential for complex applications, as
    they are used to make decisions about the instructions that the program should
    execute based on certain conditions.The result of any operation that uses logical
    operators is always a logical or Boolean value.DenialOne of the most used logical
    operators is that of negation. It is used to obtain the opposite value of the
    variable:var visible = true;alert (! visible); // Show "false" and not "true"Logical
    denial is obtained by presetting the symbol! to the variable identifier. If the
    original variable is of Boolean type, it is very simple to obtain its negation.
    However, what happens when the variable is a number or a text string? To obtain
    the negation in this type of variables, it is first carried out its conversion
    to a Boolean value:▪ If the variable contains a number, it becomes false if it
    is 0 and true for any other number (positive or negative, decimal or whole) .▪
    If the variable contains a text string, it becomes false if the string is empty
    ("") and true in any other case.var quantity = 0; empty =! quantity; // empty
    = truequantity = 2; empty =! quantity; // empty = false var message = ""; empty
    message =! message; // empty= true message; message = "Welcome";empty message
    =! message; // Empty message = falseANDThe logical AND operation obtains its result
    by combining two Boolean values. The operator is indicated by the && symbol and
    its result is only true if the operands hold true.ORThe logical OR operation also
    combines two Boolean values. The operator is indicated by the symbol || and its
    result is true if either of the two operands is true.MathematicsJavaScript allows
    you to perform mathematical manipulations on the value of numerical variables.
    The operators defined are: addition (+), subtraction (-), multiplication (*) and
    division (/). Example:var number1 = 10; var number2 = 5;result = number1 / number2;
    // result = 2 result = 3 + number1;​ // result = 13 result = number 2-4;             
    // result = 1 result = number1 * number 2; // result = 50In addition to the four
    basic operators, JavaScript defines another mathematical operator that is not
    easy to understand when it is first studied, but which is very useful on some
    occasions.This is the "module" operator, which calculates the rest of the entire
    division of two numbers. If you divide 10 and 5 for example, the division is exact
    and gives a result of 2\. The rest of that division is 0, so module 10 and 5 equals
    0.However, if you divide 9 and 5, the division is not exact, the result is 1 and
    the remainder 4, so module 9 and 5 equals 4.The JavaScript module operator is
    indicated by the% symbol, which should not be confused with the percentage calculation
    :var number1 = 10; var number2 = 5; result = number1% number2; // result = 0number1
    = 9; number2 = 5;result = number1% number2; // result = 4Mathematical operators
    can also be combined with the assignment operator to abbreviate their notation:var
    number1 = 5; number1 + = 3; // number1 = number1 + 3 = 8 number1 - = 1; // number1
    = number1 - 1 = 4 number1 * = 2;              // number1 = number1 * 2 = 10 number1
    / = 5;              // number1 = number1 / 5 = 1 number1% = 4;              //
    number1 = number1% 4 = 1RelationalThe relational operators defined by JavaScript
    are identical to those that define mathematics.Operators that relate variables
    are essential for any complex application, as will be seen in the next chapter
    on advanced programming. The result of all these operators is always a Boolean
    value.Special care must be taken with the equality operator (==), as it is the
    source of most programming errors, even for users who already have some experience
    developing scripts. The == operator is used to compare the value of two variables,
    so it is very different from the = operator, which is used to assign a value to
    a variable:// The operator "=" assigns values var number1 = 5; result = number1
    = 3; // number1 = 3 and result = 3// The operator "==" compares variables var
    number1 = 5;result = number1 == 3; // number1 = 5 and result = falseRelational
    operators can also be used with variables of type text string:var text1 = "hello";
    var text2 = "hello"; var text3 = "goodbye";result = text1 == text3; // result
    = false result = text1! = text2; // result = false result = text3> = text2; //
    result = falseWhen text strings are used, the operators "greater than" (>) and
    "less than" (<) follow a non-intuitive reasoning: letter by letter is compared
    starting from the left until a difference is found Between the two text strings.
    To determine if one letter is greater or less than another, uppercase letters
    are considered lower than lower case letters and the first letters of the alphabet
    are smaller than the last ones (a is less than b, b is less than c, A is less
    than a, etc.)Flow Control StructuresPrograms that can be performed using only
    variables and operators are a simple linear sequence of basic instructions.However,
    programs that show a message cannot be carried out if the value of a variable
    is equal to a certain value and does not show the message in all other cases.
    Nor can the same instruction be repeated efficiently, such as adding a certain
    value to all the elements of an array.To carry out this type of programs, flow
    control structures are necessary, which are instructions of the type "if this
    condition is met, do it; if it is not met, do this another". There are also instructions
    such as "repeat this while this condition is met".If flow control structures are
    used, the programs cease to be a linear sequence of instructions to become intelligent
    programs that can make decisions based on the value of the variables .If StructureThe
    structure most used in JavaScript and in most programming languages is the if
    structure. It is used to make decisions based on a condition. Its formal definition
    is:if (condition) {...}If the condition is met (that is, if its value is true),
    all instructions within {...} are executed. If the condition is not met (that
    is if its value is false), no instruction contained in {...} is executed and the
    program continues executing the rest of the instructions in the script.Example:
    var show Message = true;if (show Message) {alert ("Hello World");}Here the message
    is shown to the user since the variable ShowMessage has a value of true and therefore,
    the program enters into the if instruction block.The example could also be rewritten
    as:var show Message = true;if (show Message == true) {alert ("Hello World");}In
    this case, the condition is a comparison between the value of the variable Show
    message and the value true. As the two values coincide, the equality is met and
    therefore the condition is true, its value is true and the instructions contained
    in that if block are executed .The comparison of the previous example is usually
    the origin of many programming errors, by confusing the == and = operators. Comparisons
    are always made with the operator == since the operator = only assigns values:
    var show Message = true;// The two if values are compared (show Message == false)
    {...}// Error - The value "false" is assigned to the variable if (show Message
    = false) {...}The condition that controls the if () you can combine the different
    logical and relational operators shown above:var shown = false;if (! shown) {alert
    ("This is the first time the message is displayed"); }The AND and OR operators
    allow you to chain several simple conditions to build complex conditions:var shown
    = false; var user PermitMessages = true;if (! displayed && user Allow Messages)
    {alert ("This is the first time the message is displayed"); }The previous condition
    is formed by an AND operation on two variables. In turn, the negation operator
    is applied to the first variable before performing the AND operation. Thus, since
    the value of displayed is false, the value! Displayed would be true. Since the
    variable UserPermitMessages is true, the result of! Displayed && userPermitMessages
    would be equal to true && true, so the final result of the condition of the if
    () would be true and therefore, the instructions inside the block are executed
    of if (). Exercise 5Complete the conditions of the if in the following script
    so that the messages of the alerts () are always displayed correctly :var number1
    = 5; var number2 = 8;if (...) {alert ("number1 is not greater than number2");}
    if (...) {alert ("number2 is positive");} if (...) {alert ("number1 is negative
    or nonzero");} if (...) {alert ("Increasing the value ofby 1 unit does not make
    it greater than or equal tonumber1number2");}Structure if ... elseSometimes, the
    decisions to be made are not of the type "if the condition is met, do it; if it
    is not met, do nothing." Normally the conditions are usually of the type "if this
    condition is met, do it; if it is not met, do this another".For this second type
    of decision, there is a variant of the if structure called if ... else. Its formal
    definition is as follows:if (condition) {...} else {...}If the condition is met
    (that is if its value is true), all the instructions found within the if () are
    executed. If the condition is not met (that is, if its value is false), all instructions
    contained in else {} are executed. Example:var age = 18 ;if (age> = 18) {alert
    ("You are of legal age");} else {alert ("You are still a minor");}If the value
    of the variable age is greater than or equal to the numerical value 18, the condition
    of the if () is fulfilled and therefore, its instructions are executed and the
    message "You are of age" is displayed. However, when the value of the age variable
    is not equal to or greater than 18, the condition of the if () is not met, so
    all the instructions in the else {} block are automatically executed. In this
    case, the message "You are still a minor" would be displayed.The following example
    compares variables of type text string:var name = "";if (name == "") {alert ("You
    haven''t told us your name yet");} else {alert ("We have saved your name");}The
    condition of the previous if () is constructed using the == operator, which is
    used to compare two values (not to be confused with the operator = used to assign
    values). In the previous example, if the text string stored in the variable name
    is empty (that is, it is equal to ""), the message defined in the if () is displayed.
    Otherwise, the message defined in the else {} block is displayed.The if ... else
    structure can be chained to perform several checks in a row :if (age <12) {alert
    ("You are still too small");} else if (age <19) {alert ("You are a teenager");}
    else if (age <35) {alert ("You are still young");} else {alert ("Think about taking
    care of yourself a little more"); }It is not mandatory that the combination of
    structures if ... else ends with the else statement, since it can end with an
    else type instruction if ().Structure forThe structures if and if ... else are
    not very efficient when you want to repeatedly execute an instruction. For example,
    if you want to display a message five times, you might think about using the following
    if:var times = 0;if (times <4) {alert ("Message"); times ++;}It is checked if
    the variable times is less than 4\. If it is fulfilled, it enters the if (), the
    message is displayed and the value of the variable is increased times. This should
    continue to run until the message is displayed five times as desired.However,
    the actual operation of the previous script is very different from the desired
    one, since the message is only shown once per screen. The reason is that the execution
    of the if () structure is not repeated and the condition check is only done once,
    regardless of whether the value of the variable used in the condition is modified
    within the if ().The for structure allows you to perform this type of repetitions
    (also called loops) in a very simple way. However, its formal definition is not
    as simple as that of if ():for (initialization; condition; update) {...}The idea
    of the operation of a for loop is as follows: "as long as the indicated condition
    is still fulfilled, repeats the execution of the instructions defined within the
    for. In addition, after each repetition, it updates the value of the variables
    used in the condition ".▪ "Initialization" is the area in which the initial values
    of the variables that control the repetition are established.▪ The "condition"
    is the only element that decides whether the repetition continues or stops.▪ The
    "update" is the new value that is assigned after each repetition to the variables
    that control the repetition.var message = "Hi, I''m in a loop";for (var i = 0;
    i <5; i ++) {alert (message);}The part of the loop initialization consists of:var
    i = 0;Therefore, the variable i is created first and assigned the value of 0.
    This initialization zone is only taken into account just before starting to execute
    the loop .The following repetitions do not take into account this initialization
    part.The condition zone of the loop is:i <5The loops continue to run as long as
    the conditions are met and stop executing just after verifying that the condition
    is not met. In this case, while the variable i is worth less than 5 the loop is
    executed indefinitely.Since the variable i has been initialized to a value of
    0 and the condition to exit the loop is that i is less than 5, if the value of
    i is not modified in any way, the loop would be repeated indefinitely.For this
    reason, it is essential to indicate the update zone, in which the value of the
    variables that control the loop is modified: i ++In this case, the value of the
    variable i is increased by one unit after each repetition. The update zone is
    executed after the execution of the instructions included in the for.Thus, during
    the execution of the fifth repetition the value of i will be 4\. After the fifth
    execution, the value of i is updated, which will now be worth 5\. Since the condition
    is that i is less than 5, the condition is no longer complies and for instructions
    are not executed a sixth time.Normally, the variable that controls the loops for
    is called i, since it remembers the word index and its short name saves a lot
    of time and space.The previous example that showed the days of the week contained
    in an array can be redone more easily using the structure for:var days = ["Monday",
    "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday Sunday"];for (var i =
    0; i <7; i ++) {alert (days [i]);}Structure for ... inA control structure derived
    from for is the structure for ... in. Its exact definition implies the use of
    objects, which is an advanced programming element that is not going to be studied.
    Therefore, only the for ... in structure adapted to its use in arrays will be
    presented. Its formal definition adapted to arrays is:for (index in array) {...}If
    you want to traverse all the elements that form an array, the structure for ...
    in is the most efficient way to do it, as shown in the following example:var days
    = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];for
    (i in days) {alert (days [i]);}The variable indicated as an index is the one that
    can be used within the for ... in loop to access the array elements. In this way,
    in the first repetition of the loop the variable i is worth 0 and in the last
    voucher 6.This control structure is the most suitable for traversing arrays (and
    objects) since it avoids having to indicate the initialization and conditions
    of the loop for simple and works correctly whatever the length of the array. In
    fact, it still works the same even if the number of array elements varies.Functions
    And Basic Properties Of JavascriptJavaScript incorporates a series of tools and
    utilities (called functions and properties, as will be seen later) for handling
    variables. In this way, many of the basic operations with the variables can be
    performed directly with the utilities offered by JavaScript.Useful functions for
    text stringsBelow are some of the most useful functions for handling text strings:length,
    calculates the length of a text string (the number of characters that make it
    up)var message = "Hello World" ;var numberLetters = message.length; // numberLetters
    = 10+, is used to concatenate several text stringsvar message1 = "Hello"; var
    message2 = "World";var message = message1 + message2; // message = "Hello World"In
    addition to the + operator, you can also use the concat () functionvar message1
    = "Hello";var message2 = message1.concat ("World"); // message2 = "Hello World"
    Text strings can also be joined with numerical variables:var variable1 = "Hello";
    var variable2 = 3;var message = variable1 + variable2; // message = "Hello 3"When
    several text strings are joined, it is usual to forget to add a space between
    the words:var message1 = "Hello"; var message2 = "World";var message = message1
    + message2; // message = "HelloWorld"Blank spaces can be added at the end or beginning
    of the strings and can also be explicitly indicated:var message1 = "Hello"; var
    message2 = "World" ;var message = message1 + "" + message2; // message = "Hello
    World"toUpperCase (), transforms all the characters in the string to their corresponding
    characters in uppercase:var message1 = "Hello";var message2 = message1.toUpperCase
    (); // message2 = "HELLO"toLowerCase (), transforms all the characters in the
    string to their corresponding characters in lowercase:var message1 = "HolA";var
    message2 = message1.toLowerCase (); // message2 = "hello"charAt (position), get
    the character that is in the indicated position:var message = "Hello"; var letter
    = message.charAt (0); // letter = H letter = message.charAt (2);              //
    letter = lindexOf (character), calculates the position where the indicated character
    is within the text string. If the character is included several times within the
    text string, its first position is returned starting to search from the left.
    If the string does not contain the character, the function returns the value -1:var
    message = "Hello"; var position = message.indexOf (''a''); // position = 3 position
    = message.indexOf (''b''); // position = -1 Its analogous function is lastIndexOf
    ():lastIndexOf (character), calculates the last position in which the indicated
    character is within the text string. If the string does not contain the character,
    the function returns the value -1:var message = "Hello"; var position = message.lastIndexOf
    (''a''); // position = 3 position = message.lastIndexOf (''b''); // position =
    -1The lastIndexOf () function starts its search from the end of the string to
    the beginning, although the position returned is correct starting from the beginning
    of the word. substring (start, end), extracts a portion of a text string. The
    second parameter is optional. If only the start parameter is indicated, the function
    returns the part of the corresponding original string from that position to the
    end:var message = "Hello World"; var portion = message.substring (2); // portion
    = "the World" portion = message.substring (5);              // portion = "World"
    portion = message.substring (7);              // portion = "ndo"If a negative
    start is indicated, the same original string is returned:var message = "Hello
    World";var portion = message.substring (-2); // portion = "Hello World"When the
    beginning and end are indicated, the part of the original chain between the initial
    position and the one immediately preceding the final position is returned (that
    is, the start position is included and the position final no):var message = "Hello
    World"; var portion = message.substring (1, 8); // portion = "wave Mun" portion
    = message.substring (3, 4);              // portion = "a"If an ending smaller
    than the beginning is indicated, JavaScript considers them in reverse, since it
    automatically assigns the smallest value at the beginning and the largest at the
    end:var message = "Hello World"; var portion = message.substring (5, 0); // portion
    = "Hello" portion = message.substring (0, 5);              // portion = "Hello"split
    (separator), convert a text string into an array of text strings. The function
    starts the text string by determining its chunks from the indicated separator
    character:var message = "Hello World, I am a text string!"; var words = message.split
    ("");// words = ["Hello", "World,", "I am", "a", "string", "of", "text!"]; With
    this function you can easily extract the letters that form a word :var word =
    "Hello"; var letters = word.split (""); // letters = ["H", "o", "l", "a"]Useful
    functions for numbersBelow are some of the most useful functions and properties
    for handling numbers.NaN, (from English, "Not a Number") JavaScript uses the NaN
    value to indicate an undefined numerical value (for example, division 0/0).var
    number1 = 0; var number2 = 0;alert (number1 / number2); // the value NaNisNaN
    () is shown, it allows to protect the application from possible undefined numerical
    valuesvar number1 = 0; var number2 = 0; if (isNaN (number1 / number2)) {alert
    ("The division is not defined for the indicated numbers");} else {alert ("The
    division is equal to =>" + number1 / number2); }Infinity, refers to an infinite
    and positive numerical value (there is also the –Infinity value for negative infinities)var
    number1 = 10; var number2 = 0;alert (number1 / number2); // the Infinityvalue
    is displayedtoFixed (digits), returns the original number with as many decimals
    as indicated by the digits parameter and performs the necessary rounding. It is
    a very useful function for example to show prices.var number1 = 4564.34567; number1.toFixed
    (2); // 4564.35 issue1.toFixed (6); // 4564.345670 issue1.toFixed (); // 4564Chapter
    3 - Advanced ProgrammingThe control structures, the operators and all the JavaScript
    utilities that have been seen in the previous chapters, allow creating simple
    and medium complexity scripts.However, other elements such as functions and other
    more advanced control structures are required for more complex applications, which
    are described in this chapter.FunctionsWhen developing a complex application,
    it is very common to use the same instructions over and over again. A script for
    an e-commerce store, for example, has to calculate the total price of the products
    several times, to add taxes and shipping costs.When a series of instructions are
    repeated over and over again, the source code of the application becomes too complicated,
    since:▪ The application code is much longer because many instructions are repeated.▪
    If you want to modify any of the repeated instructions, you should make as many
    modifications as you have written that instruction, which becomes very heavy work
    and very prone to mistakes.Functions are the solution to all these problems, both
    in JavaScript and in other programming languages. A function is a set of instructions
    that are grouped together to perform a specific task and that can be easily reused
    .In the following example, the instructions that add the two numbers and show
    a message with the result are repeated over and over again:var result;var number1
    = 3; var number2 = 5;// The numbers are added and the result result is shown =
    number1 + number2; alert ("The result is" + result);number1 = 10; number2 = 7;//
    The numbers are added and the result result is shown = number1 + number2; alert
    ("The result is" + result);number1 = 5; number2 = 8;// The numbers are added and
    the resultis shownresult= number1 + number2; alert ("The result is" + result);
    ...Although it is a very simple example, it seems clear that repeating the same
    instructions throughout the code is not recommended. The solution proposed by
    the functions consists in extracting the instructions that are repeated and replacing
    them with an instruction of the type "at this point, the instructions that have
    been extracted are executed":var result;var number1 = 3; var number2 = 5;/ * At
    this point, the function that adds2 numbers is called and shows the result * /number1
    = 10; number2 = 7;/ * At this point, the function that adds2 numbers is called
    and displays the result * /number1 = 5; number2 = 8;/ * At this point, the function
    that adds2 numbers is called and shows the result * / ...For the solution of the
    previous example to be valid, the common instructions must be grouped into a function
    that can be Indicate the numbers to add before displaying the message.Therefore,
    you must first create the basic function with the common instructions. Functions
    in JavaScript are defined by the reserved word function, followed by the name
    of the function. Its formal definition is as follows:function function_name ()
    {...}The function name is used to call that function when necessary. The concept
    is the same as with the variables, which are assigned a unique name to be able
    to use them within the code. After the name of the function, two parentheses are
    included whose meaning is detailed below. Finally, the symbols {and} are used
    to enclose all the instructions that belong to the function (similar to how the
    instructions are enclosed in the if or for structures).Returning to the previous
    example, a function called sum_and_sample is created as follows:function sum_and_sample
    () {result = number1 + number2;alert ("The result is" + result); }Although the
    previous function is created correctly, it does not work as it should because
    the "arguments" are missing, which are explained in the next section. Once the
    function has been created, the function can be called from any point in the code
    to execute its instruction s(in addition to "calling the function", the expression
    "invoke the function" is also used).The function call is made simply by indicating
    its name, including the end brackets and the character; to finish the instruction:function
    sum_and_sample () {result = number1 + number2; alert ("The result is" + result);}
    var result;var number1 = 3; var number2 = 5; sum_and_sample ();number1 = 10; number2
    = 7; sum_and_sample ();number1 = 5; number2 = 8;sum_and_sample (); ...The code
    in the previous example is much more efficient than the first code that was shown
    since there are no repeated instructions. The instructions that add and display
    messages have been grouped under one function, which allows them to be executed
    at any point in the program simply by indicating the name of the function.The
    only thing missing from the previous example to function correctly is to be able
    to indicate to the function the numbers to add. When data needs to be passed to
    a function, the "arguments" are used, as explained in the next section.Arguments
    And Return ValuesThe simplest functions do not need any information to produce
    their results. However, most functions of real applications must access the value
    of some variables to produce their results.The variables that functions need are
    called arguments. Before you can use them, the function must indicate how many
    arguments you need and what is the name of each argument. In addition, when invoking
    the function, the values that will be passed to the function must be included.
    The arguments are indicated within the parentheses that go after the name of the
    function and are separated by a comma (,).Following the previous example, the
    function must indicate that it needs two arguments, corresponding to the two numbers
    that it has to add: function sum_and_sample (firstNumber, secondNumber) {...}Next,
    to use the value of the arguments within the function, the same name with which
    the arguments were defined should be used:function sum_and_sample (firstNumber,
    secondNumber) {...}var result = firstNumber + secondNumber; alert ("The result
    is" + result); }Within the function, the value of the variable firstNumber will
    be equal to the first value that is passed to the function and the value of the
    variable secondNumber will be equal to the second value that is passed to it.
    To pass values to the function, they are included in the parentheses used when
    calling the function: Function//definition function sum_and_sample (firstNumber,
    secondNumber) {...}var result = firstNumber + secondNumber; alert ("The result
    is" + result);}// Declaration of the variables var number1 = 3; var number2 =
    5;// Call to the function sum_and_sample (number1, number2);In the previous code,
    it should be taken into account that:▪ Although variables are almost always used
    to pass the data to the function, the value of these variables could have been
    used directly: sum_and_sample (3, 5) ;▪ The number of arguments passed to a function
    should be the same as the number of arguments indicated by the function. However,
    JavaScript does not show any errors if more or less arguments are passed than
    necessary.▪ The order of the arguments is fundamental since the first data indicated
    in the call will be the first value expected by the function; The second value
    indicated in the call is the second value that the function expects and so on.▪
    An unlimited number of arguments can be used, although if their number is very
    large, the function call is complicated too much.▪ It is not mandatory to match
    the name of the arguments used by the function and the name of the arguments.
    Previously, the arguments passed are number1 and number2 and the arguments used
    by the function are firstNumber and secondNumber.Below is another example of a
    function that calculates the total price of a product from its basic price://
    Function definition function calculates Total Price (price) {var taxes = 1.16;
    var expenses Shipping = 10; var Total price = (price * taxes) + expenses Shipping;}//
    Call to the function calculates Total Price (23.34);The previous function takes
    as an argument a variable called price and adds taxes and shipping costs to obtain
    the total price. When calling the function, the value of the basic price is passed
    directly by number 23.34.However, the previous code is not too useful, since the
    ideal would be that the function could return the result obtained to save it in
    another variable and be able to continue working with this total price :function
    calculates Total Price (price) {var taxes = 1.16; var expenses Shipping = 10;
    var Total price = (price * taxes) + expenses Shipping;}// The value returned by
    the function is stored in a variable var Total price = calculates Total Price
    (23.34);// Continue working with the variable "Total price"Fortunately, functions
    can not only receive variables and data but can also return the values they have
    calculated. To return values within a function, the reserved word return is used.
    Although functions can return values of any type, they can only return one value
    each time they are executed.function calculates Total Price (price) {var taxes
    = 1.16; var expenses Shipping = 10; var Total price = (price * taxes) + expenses
    Shipping; return total price;} var Total price = calculates Total Price (23.34);//
    Continue working with the variable "total price"In order for the function to return
    a value, it is only necessary to write the reserved word return together with
    the name of the variable to be returned. In the previous example, the execution
    of the function arrives at the statement return total price; and at that time,
    it returns the value that contains the variable priceTotal.As the function returns
    a value, at the point where the call is made, the name of a variable in which
    the returned value is stored must be indicated: var Total price = calculates Total
    Price (23.34);If the name of any variable is not indicated, JavaScript does not
    show any errors and the value returned by the function is simply lost and therefore
    will not be used in the rest of the program. In this case, it is also not mandatory
    that the name of the variable returned by the function matches the name of the
    variable in which that value is to be stored .If the function reaches an instruction
    of type return, the indicated value is returned and the execution of the function
    ends. Therefore, all instructions that are included after a return are ignored
    and for that reason, the return statement is usually the last of most functions.To
    make the above example more complete, another argument can be added to the function
    that indicates the percentage of taxes that must be added to the price of the
    product. Obviously, the new argument must be added to both the definition of the
    function and its call:function calculates Total Price (price, percentage) {Taxesvar
    expenses Shipping = 10; var price Taxes = (1 + percentage Taxes / 100) * price;
    var Total price = price with Taxes + expenses Shipping; return total price;}var
    Total price = calculates Total Price (23.34, 16); var other Total Price = calculates
    Total Price (15.20, 4);To complete the previous exercise, the total price returned
    by the function can be rounded to two decimals:function calculates Total Price
    (price, percentage) {Taxesvar expenses Shipping = 10; var price Taxes = (1 + percentage
    Taxes / 100) * price; var Total price = price with Taxes + expenses Shipping;
    return priceTotal.toFixed (2);} var Total price = calculates Total Price (23.34,
    16);Scope Of The VariablesThe scope of a variable (called "scope" in English)
    is the area of the program in which the variable is defined. JavaScript defines
    two scopes for the variables: global and local.The following example illustrates
    the behavior of the scopes:function creates Message () {var message = “Test message”;}
    createMessage (); alert (message);The previous example first defines a function
    called createMessage that creates a variable called message. Then, the function
    is executed by the call createMessage (); and then, the value of a variable called
    message is shown by the alert () function.However, when executing the above code,
    no message is displayed on the screen. The reason is that the message variable
    has been defined within the createMessage () function and is, therefore, a local
    variable that is only defined within the function.Any instruction that is within
    the function can make use of that variable, but all instructions that are in other
    functions or outside of any function will not have the message variable defined.
    Thus, to display the message in the previous code, the alert () function must
    be called from within the createMessage ():function function createMessage ()
    {var message = "Test message"; alert (message);} createMessage ();In addition
    to local variables, there is also the concept of a global variable, which is defined
    at any point in the program (even within any function). var message = "Test message";function
    sample Message () {alert (message);}The code above is the inverse example to the
    one shown above. Within the sample message function () you want to use a variable
    called message and that has not been defined within the function itself. However,
    if the previous code is executed, the message defined by the message variable
    is shown .The reason is that in the previous JavaScript code, the message variable
    has been defined outside of any function. These types of variables are automatically
    transformed into global variables and are available at any point in the program
    (even within any function).Thus, although no variable called message has been
    defined inside the function, the previously created global variable allows the
    alert () instruction within the function to display the message correctly.If a
    variable is declared outside of any function, it is automatically transformed
    into a global variable regardless of whether it is defined using the reserved
    word var or not. However, the variables defined within a function can be global
    or local.If within a function, the variables are declared by var are considered
    local and the variables that have not been declared by var, are automatically
    transformed into global variables.Therefore, you can redo the code from the first
    example so that it displays the message correctly. To do this, simply define the
    variable within the function without the reserved word var, so that it becomes
    a global variable:function creates Message () {message = "Test message";}createMessage
    (); alert (message);What happens if a function defines a local variable with the
    same name as a global variable that already exists? In this case, the local variables
    prevail over the global ones, but only within the function:var message = "wins
    the one outside";function sample Message () {var message = "win the one inside";
    alert (message);}alert (message); Sample Message (); alert (message);The previous
    code shows the following messages on the screen:the outside one wins the inside
    one wins the outside oneWithin the function, the local variable called message
    has more priority than the global variable of the same name, but only within the
    function.What happens if a global variable is defined within a function with the
    same name as another global variable that already exists? In this other case,
    the global variable defined within the function simply modifies the value of the
    global variable defined above: variablevar message = "wins the outside"; function
    sample Message () {message = "win the inside"; alert (message);}alert (message);
    Sample Message (); alert (message);In this case, the messages shown are:the one
    from outside wins the one from inside wins the one from insideThe general recommendation
    is to define as local variables all the variables that are exclusively used to
    perform the tasks entrusted to each function. Global variables are used to share
    variables between functions easily.Break And Continue StatementsThe control structure
    for is very simple to use, but it has the disadvantage that the number of repetitions
    that can be performed can only be controlled by the variables defined in the loop
    update zone .The break and continue statements allow you to manipulate the normal
    behavior of the for loops to stop the loop or to skip some repetitions. Specifically,
    the break statement allows you to abruptly terminate a loop and the continue statement
    allows you to skip some repetitions of the loop.The following example shows the
    use of the break statement:var string = "In a spot of the Stain whose name I don''t
    want to remember ..."; var letters = string.split (""); var result = "";for (i
    in letters) {if (letters [i] == ''a'') {break; } else {result + = letters [i];}}alert
    (result); // shows "In a lug"If the program reaches a break type instruction,
    it immediately exits the loop and continues executing the rest of the instructions
    outside the for loop. In the previous example, all the letters of a text string
    are traversed and when it encounters the first letter "a", the execution of the
    for loop is stopped.The utility of break is to end the execution of the loop when
    a variable takes a certain value or when some condition is met.Sometimes, what
    is desired is to skip some repetition of the loop when some conditions occur.
    Following the previous example, it is now desired that the output text remove
    all the letters "a" from the original text:stringvar string = "In a spot of the
    Stain whose name I don''t want to remember ..."; var letters = string.split ("");
    var result = "";for (i in letters) {if (letters [i] == ''a'') {continue; } else
    {result + = letters [i];}} alert (result);// shows "In a lugr of l Mnch whose
    name I don''t want to cordr ..."In this case, when a letter "a" is found, the
    loop is not terminated, but the instructions of that repetition are not executed
    and Go directly to the next repetition of the for loop.The utility of continue
    is that it allows you to use the for loop to filter the results based on some
    conditions or when the value of a variable matches a certain value.Other Control
    StructuresThe flow control structures that have been seen (if, else, for) and
    the sentences that modify their behavior (break, continue) are not sufficient
    to perform some complex tasks and other types of repetitions. For this reason,
    JavaScript provides other flow control structures that are different and in some
    cases more efficient.While StructureThe while structure allows you to create loops
    that run no more or more times, depending on the condition indicated. Its formal
    definition is:while (condition) {...}The operation of the while loop is summarized
    in: "While the indicated condition is fulfilled, repeat the instructions included
    within the loop indefinitely".If the condition is not met even the first time,
    the loop is not executed. If the condition is met, the instructions are executed
    once and the condition is checked again. If the condition is still fulfilled,
    the loop is executed again and so it continues until the condition is not met
    .Obviously, the variables that control the condition must be modified within the
    loop itself, since otherwise, the condition would always be met and the while
    loop would be repeated indefinitely.Structure do ... whileThe loop of type do
    ... while is very similar to the while loop, except that in this case the instructions
    of the loop are always executed at least the first time. Its formal definition
    is:do {...} while (condition);In this way, as the condition is checked after each
    repetition, the loop instructions are always executed the first time. It is important
    not to forget that after the while () the character must be added; (contrary to
    what happens with the simple while loop).Using this loop you can easily calculate
    the factorial of a number:var result = 1; var number = 5;do {result * = number;
    // result = result * number number--; } while (number> 0); alert (result);In the
    previous code, the result is multiplied in each repetition by the value of the
    variable number. In addition, in each repetition, the value of this variable number
    is decremented. The condition of the do ... while loop is that the number value
    is greater than 0 since the factorial of a number multiplies all numbers less
    than or equal to itself, but up to number 1 (the factorial of 5, for example,
    is 5 x 4 x 3 x 2 x 1 = 120).As in each repetition, the value of the variable number
    is decremented and the condition is that number is greater than zero, in the repetition
    in which number is worth 0, the condition is no longer fulfilled and the program
    leaves the do loop ... while .Switch StructureThe if ... else structure can be
    used to perform multiple checks and make complex decisions. However, if all conditions
    always depend on the same variable, the resulting JavaScript code is too redundant:if
    (number == 5) {...} else if (number == 8) {...} else if ( number == 20) {...}
    else {...}In these cases, the switch structure is the most efficient, since it
    is specially designed to easily handle multiple conditions on the same variable.
    Its formal definition may seem complex, although its use is very simple.The switch
    structure is defined by the reserved keyword switch followed, in parentheses,
    by the name of the variable to be used in the comparisons. As usual, the instructions
    that are part of the switch are enclosed in quotes {and}.Within the switch, all
    the comparisons that you want to make on the value of the variable are defined.
    Each comparison is indicated by the reserved word case followed by the value with
    which the comparison is made.What happens if no value of the switch variable matches
    the values defined in the cases? In this case, the default value is used to indicate
    the instructions that are executed in the case where no case is met for the indicated
    variable.Although default is optional, switch structures usually include it to
    define at least one default value for some variable or to display a message on
    the screen.Chapter 4 - DOM – Document Object ModelThe creation of the Document
    Object Model or DOM is one of the innovations that has most influenced the development
    of dynamic web pages and the most complex web applications.DOM allows web programmers
    to access and manipulate XHTML pages as if they were XML documents. In fact, DOM
    was originally designed to easily manipulate XML documents.Despite its origins,
    DOM has become a utility available for most programming languages (Java, PHP,
    JavaScript) and whose only differences are in the way of implementing it.Node
    TreeOne of the usual tasks in programming web applications with JavaScript is
    the manipulation of web pages. In this way, it is usual to obtain the value stored
    by some elements (for example the elements of a form), create an element (paragraphs,
    <div>, etc.) dynamically and add it to the page, apply an animation to a item
    (to appear / disappear, to scroll, etc.).All these usual tasks are very simple
    to perform thanks to DOM. However, in order to use the DOM utilities, it is necessary
    to "transform" the original page. A normal HTML page is nothing more than a succession
    of characters, so it is a very difficult format to manipulate. Therefore, web
    browsers automatically transform all web pages into a more efficient structure
    to manipulate.This transformation is done by all browsers automatically and allows
    us to use the DOM tools very easily. The reason why the operation of this internal
    transformation is shown is that it determines the behavior of DOM and therefore,
    the way in which pages are manipulated.DOM transforms all XHTML documents into
    a set of elements called nodes, which are interconnected and that represent the
    contents of web pages and the relationships between them. Because of its appearance,
    the union of all nodes is called a "node tree".It becomes the next tree of nodes.
    The root of the node tree of any XHTML page is always the same: a special type
    node called "Document".From that root node, each XHTML tag is transformed into
    a node of type "Element". The conversion of tags into nodes is done hierarchically.
    In this way, only the HEAD and BODY nodes can derive from the root node. From
    this initial derivation, each XHTML tag is transformed into a node that derives
    from the node corresponding to its "parent tag".The transformation of the usual
    XHTML tags generates two nodes: the first is the "Element" type node (corresponding
    to the XHTML tag itself) and the second is a "Text" type node that contains the
    text enclosed by that XHTML tag.Thus, the following XHTML tag:<title> Simple page
    </title> Generates the following two nodes:<p> This page is <strong> very simple
    </strong> </p> It generates the following nodes:▪ Type node "Element "corresponding
    to the <p> tag.▪ Node of type "Text" with the textual content of the <p> tag.▪
    Since the content of <p> includes another XHTML tag inside it, the inner tag is
    transformed into a node of type "Element" that represents the <strong> tag and
    derived from the previous node .▪ The content of the <strong> tag generates another
    node of type "Text" that derives from the node generated by <strong>.The automatic
    transformation of the page into a node tree always follows the same rules:▪ The
    XHTML tags are transformed into two nodes: the first is the tag itself and the
    second node is the son of the first and consists of the textual content of the
    label.▪ If an XHTML tag is inside another one, the same procedure as above is
    followed, but the generated nodes will be child nodes of its parent tag.As you
    can guess, the usual XHTML pages produce trees with thousands of nodes. Even so,
    the transformation process is fast and automatic, being the functions provided
    by DOM (which will be seen later) the only ones that allow access to any node
    of the page easily and immediately.Node TypesThe full DOM specification defines
    12 types of nodes, although the usual XHTML pages can be manipulated by handling
    only four or five types of nodes:▪ Document, root node from which all other nodes
    in the tree derive.▪ Element, represents each of the XHTML tags. It is the only
    node that can contain attributes and the only one from which other nodes can derive.▪
    Attr, a node of this type is defined to represent each of the attributes of the
    XHTML tags, that is, one for each attribute = value pair.▪ Text, node that contains
    the text enclosed by an XHTML tag.▪ Comment, represents the comments included
    in the XHTML page .The other types of existing nodes that are not to be considered
    are DocumentType, CDataSection, DocumentFragment, Entity, EntityReference, ProcessingInstruction,
    and Notation.Direct Access To The NodesOnce the complete DOM node tree is built
    automatically, it is now possible to use the DOM functions to directly access
    any node in the tree. How to access a node in the tree is equivalent to accessing
    "a piece" of the page, once the tree is built, it is already possible to easily
    manipulate the page: access the value of an element, set the value of an element,
    move an element of the page, create and add new elements, etc.DOM provides two
    alternative methods to access a specific node: access through its parent nodes
    and direct access.The functions that DOM provides to access a node through its
    parent nodes consist of accessing the root node of the page and then its child
    nodes and the child nodes of those children and so on until the last node of the
    branch terminated by The searched node. However, when you want to access a specific
    node, it is much faster to directly access that node and not reach the node through
    all its parent nodes.For this reason, the functions necessary for hierarchical
    node access will not be presented and only those that allow direct access to the
    nodes are shown.Finally, it is important to remember that access to the nodes,
    their modification and their elimination are only possible when the DOM tree has
    been completely built, that is, after the XHTML page is fully loaded.Normally
    the name attribute is unique to HTML elements that define it, so it is a very
    practical method to directly access the desired node. In the case of HTML radiobutton
    elements, the name attribute is common to all radiobuttons that are related, so
    the function returns a collection of elements.Internet Explorer 6.0 does not correctly
    implement this function, since it only takes it into account for elements of type
    <input> and < img>. In addition, it also takes into consideration elements whose
    id attribute is equal to the function parameter.getElementById ()The getElementById
    () function is the most used when developing dynamic web applications. This is
    the preferred function to directly access a node and be able to read or modify
    its properties.The getElementById () function returns the XHTML element whose
    id attribute matches the parameter indicated in the function. Since the id attribute
    must be unique for each element of the same page, the function returns only the
    desired node. var header = document.getElementById ("header");<div id = "header"><a
    href="/" id="logo"> ... </a></div>The getElementById () function is so important
    and so used in all web applications, that almost all the examples and exercises
    that follow use it constantly.Internet Explorer 6.0 also incorrectly interprets
    this function, since it also returns those elements whose name attribute matches
    the parameter provided to the function.Creating And Deleting NodesAccessing the
    nodes and their properties (which will be seen later) is only part of the usual
    manipulations on the pages. The other usual operations are to create and delete
    nodes from the DOM tree, that is, create and delete "chunks" from the web page.Creating
    simple XHTML elementsAs we have seen, a simple XHTML element, such as a paragraph,
    generates two nodes: the first node is of the Element type and represents the
    <p> tag and the second node is of the Text type and represents the textual content
    of the <p> tag .For this reason, creating and adding a new simple XHTML element
    to the page consists of four different steps:1\. Creation of an Element type node
    that represents the element.2\. Creation of a node of type Text that represents
    the content of the element.3\. Add the Text node as the child node of the Element
    node.4\. Add the Element node to the page, in the form of a child node of the
    node corresponding to the place where you want to insert the element.Thus, if
    you want to add a simple paragraph at the end of an XHTML page, it is necessary
    to include the following JavaScript code:// Create node of type Element var paragraph
    = document.createElement ("p");// Create node of type Text var content = document.createTextNode
    ("Hello World!");// Add the Text node as a child of the Element node parrafo.appendChild
    (content);// Add the Element node as a child of the document.body.appendChild
    (paragraph) page;The process of creating new nodes can become tedious since it
    involves the use of three DOM functions:▪ createElement (tag): it creates a node
    of type Element that represents the XHTML element whose tag is passed as a parameter.▪
    createTextNode (content): Creates a node of type Text that stores the textual
    content of the XHTML elements.▪ parent node.appendChild (son node): add a node
    as a child of another node .Deleting NodesFortunately, removing a node from the
    DOM tree on the page is much easier than adding it. In this case, it is only necessary
    to use the removeChild () function:var paragraph = document.getElementById ("provisional");
    paragraph.parentNode.removeChild (paragraph);<p id = "provisional"> ... </p>The
    removeChild () function requires the node to be deleted as a parameter. In addition,
    this function must be invoked from the parent element of that node to be deleted.
    The safest and fastest way to access the parent node of an element is through
    the nodeHijo.parentNode property.Thus, to remove a node from an XHTML page, the
    removeChild () function is invoked from the parentNode value of the node to be
    deleted. When a node is deleted, all the child nodes it has, are automatically
    deleted, so it is not necessary to manually delete each child node.Direct Access
    To XHTML AttributesOnce a node has been accessed, the next natural step is to
    access and/or modify its attributes and properties. Through DOM, it is possible
    to easily access all XHTML attributes and all CSS properties of any element of
    the page.The XHTML attributes of the page elements are automatically transformed
    into properties of the nodes. To access its value, simply indicate the name of
    the XHTML attribute behind the name of the node.Chapter 5 - EventsSo far, all
    the applications and scripts that have been created have something in common:
    they are executed from the first instruction to the last sequentially. Thanks
    to the flow control structures (if, for, while) it is possible to slightly modify
    this behavior and repeat some pieces of the script and skip other pieces depending
    on some conditions.These types of applications are not very useful since they
    do not interact with users and cannot respond to the different events that occur
    during the execution of an application. Fortunately, web applications created
    with the JavaScript language can use the event-based programming model.In this
    type of programming, the scripts are dedicated to waiting for the user to "do
    something" (press a key, move the mouse, close the browser window). Next, the
    script responds to the user''s action by normally processing that information
    and generating a result.Events make it possible for users to transmit information
    to programs. JavaScript defines numerous events that allow a complete interaction
    between the user and the web pages/applications. Pressing a key constitutes an
    event, as well as clicking or moving the mouse, selecting an element of a form,
    resizing the browser window, etc.JavaScript allows you to assign a function to
    each of the events. In this way, when any event occurs, JavaScript executes its
    associated function. These types of functions are called "event handlers" in English
    and are usually translated as "event handlers" .Event ModelsCreating web pages
    and applications has always been much more complex than it should be due to incompatibilities
    between browsers. Although there are dozens of standards for the technologies
    used, browsers do not fully support them or even ignore them.The main incompatibilities
    occur in the XHTML language, in the support of CSS stylesheets and, above all,
    in the implementation of JavaScript. Of all of them, the most important incompatibility
    occurs precisely in the browser''s event model. Thus, there are up to three different
    models to handle events depending on the browser in which the application runs.Basic
    Event ModelThis simple event model was introduced for version 4 of the HTML standard
    and is considered part of the most basic level of DOM. Although its features are
    limited, it is the only model that is compatible in all browsers and therefore,
    the only one that allows you to create applications that work the same way in
    all browsers.Standard Event ModelThe most advanced versions of the DOM standard
    (DOM level 2) define a completely new and much more powerful event model than
    the original. All modern browsers include it, except Internet Explorer.Internet
    Explorer Event ModelInternet Explorer uses its own event model, which is similar
    but incompatible with the standard model. It was first used in Internet Explorer
    4 and Microsoft decided to continue using it in the other versions, despite the
    fact that the company had participated in the creation of the DOM standard that
    defines the standard event model .Basic Event ModelTypes Of EventsIn this model,
    each XHTML element or tag defines its own list of possible events that can be
    assigned. The same type of event (for example, clicking the left mouse button)
    can be defined for several different XHTML elements and the same XHTML element
    can have several different events associated.The name of each event is constructed
    using the prefix on, followed by the English name of the action associated with
    the event. Thus, the event of clicking an element with the mouse is called onclick
    and the event associated with the action of moving the mouse is called onmousemove.The
    most used events in traditional web applications are onload to wait for the page
    to load completely, the events onclick, onmouseover, onmouseout to control the
    mouse and onsubmit to control the submission of forms.The typical actions that
    a user performs on a web page can lead to a succession of events. Pressing for
    example on a button of type <input type = "submit"> triggers the events onmousedown,
    onclick, onmouseup and onsubmit consecutively.Event HandlersA JavaScript event
    by itself lacks utility. For events to be useful, JavaScript functions or code
    must be associated with each event. In this way, when an event occurs, the indicated
    code is executed, so the application can respond to any event that occurs during
    its execution.The functions or JavaScript code defined for each event are called
    "event handler" and since JavaScript is a very flexible language, there are several
    different ways to indicate the handlers:▪ Handlers as attributes of the XHTML
    elements.▪ Handlers as external JavaScript functions.▪ "Semantic" handlers .Event
    handlers as XHTML attributesThis is the simplest and least professional method
    of indicating the JavaScript code that should be executed when an event occurs.
    In this case, the code is included in an attribute of the XHTML element itself.
    In the following example, we want to show a message when the user clicks on a
    button:<input type = "button" value = "Click me and you will see" onclick = "alert
    (''Thanks for clicking'');" />In this method, XHTML attributes are defined with
    the same name as the events to be handled. The previous example only wants to
    control the event of clicking with the mouse, whose name is onclick. Thus, the
    XHTML element for which you want to define this event must include an attribute
    called onclick.The content of the attribute is a text string that contains all
    the JavaScript instructions that are executed when the event occurs. In this case,
    the JavaScript code is very simple (alert (''Thanks for clicking'');), since it
    is only about displaying a message.In this other example, when the user clicks
    on the <div> element a message is displayed and when the user hovers the mouse
    over the element, another message is displayed:<div onclick = "alert (''You clicked
    with the mouse'' ); " onmouseover = "alert (''You just ran over the mouse'');">You
    can click on this element or just hover over the mouse</div>This other example
    includes one of the most used instructions in older JavaScript applications :<body
    onload = "alert (''The page has been fully loaded'');"> ...</body>The previous
    message is displayed after the page has been fully loaded, that is after it has
    been loaded downloaded your HTML code, your images and any other object included
    in the page .The onload event is one of the most used since, as seen in the DOM
    chapter, the functions that allow access and manipulation of the nodes of the
    DOM tree are only available when the page has been fully loaded.Event handlers
    and ‘this’ VariableJavaScript variable defines a special variable called this
    that is created automatically and used in some advanced programming techniques.
    In events, the variable this can be used to refer to the XHTML element that caused
    the event.Event handlers as external functionsThe definition of event handlers
    in XHTML attributes is the simplest but least advisable method of dealing with
    events in JavaScript. The main drawback is that it is complicated in excess as
    soon as a few instructions are added, so it is only recommended for the simplest
    cases.If complex applications are made, such as the validation of a form, it is
    advisable to group all the JavaScript code into an external function and call
    this function from the XHTML element.Following the previous example that shows
    a message when clicking on a button:<input type = "button" value = "Click me and
    you will see" onclick = "alert (''Thanks for clicking'');" /> Using external functions
    can be transformed into:function sample Message () {alert (''Thanks for clicking'');}<input
    type = "button" value = "Click me and you will see" onclick = "sample Message
    ()" />This technique consists of extracting all JavaScript instructions and grouping
    them into an external function. Once the function is defined, the function name
    is included in the attribute of the XHTML element, to indicate that it is the
    function that is executed when the event occurs.The function call is made in the
    usual way, indicating its name followed by the parentheses and optionally, including
    all the necessary arguments and parameters.The main drawback of this method is
    that in the external functions it is not possible to continue using the variable
    this and therefore, it is necessary to pass this variable as a parameter to the
    function.In the previous example, the external function is called with the parameter
    this, which within the function is called element. The complexity of the example
    is mainly due to the way in which different browsers store the value of the borderColor
    property.While Firefox stores (in case the four edges match in color) the black
    value, Internet Explorer stores it as black black black black and Opera stores
    its hexadecimal representation # 000000.Semantic event handlersThe methods that
    have been seen to add event handlers (as XHTML attributes and as external functions)
    have a serious drawback: they "dirty" the XHTML code of the page.As is known,
    one of the basic good practices in the design of web pages and applications is
    the separation of content (XHTML) and its appearance or presentation (CSS). Whenever
    possible, it is also recommended to separate the contents (XHTML) and its behavior
    or programming (JavaScript).Mixing the JavaScript code with the XHTML elements
    only helps to complicate the source code of the page, make it difficult to modify
    and maintain the page and reduce the semantics of the final document produced.Fortunately,
    there is an alternative method to define JavaScript event handlers. This technique
    is an evolution of the method of external functions, since it is based on using
    the DOM properties of XHTML elements to assign all external functions that act
    as event handlers. So, the following example:<input id = "clickable" type = "button"
    value = "Click me and you will see" onclick = "alert (''Thanks for clicking'');"
    />It can be transformed into:// External function function sample Message () {alert
    (''Thanks for clicking'');}// Assign the external function to the document.getElementById
    ("clickable") element. Onclick = sample Message;// XHTML element<input id = "pinchable"
    type = "button" value = "Click and see" /> The technique of semantic handlers
    consists of:1\. Assign a unique identifier to the XHTML element using the id attribute.2\.
    Create a JavaScript function responsible for handling the event.3\. Assign the
    external function to the corresponding event in the desired element.The last step
    is the key to this technique. First, you get the element to which you want to
    associate the external function: document.getElementById ("clickable");Next, a
    property of the element with the same name as the event to be handled is used.
    In this case, the property is onclick: document.getElementById ("clickable").
    Onclick = ...Finally, the external function is assigned by its name without parentheses.
    The most important thing (and the most common cause of errors) is to indicate
    only the name of the function, that is, dispense with the parentheses when assigning
    the function: document.getElementById ("clickable"). Onclick = sample Message;If
    the parentheses are added after the name of the function, the function is actually
    running and saving the value returned by the function in the element onclick property.//
    Assign an external function to an event of a document.getElementById ("pinchable")
    element. Onclick = sample Message;// Execute a function and save its result in
    a property of a document.getElementById ("pinchable") element. Onclick = sampleMessage
    ();The great advantage of this method is that the resulting XHTML code is very
    "clean" since it does not mix with the JavaScript code. In addition, within the
    assigned external functions, the variable this can be used to refer to the element
    that causes the event.The only drawback of this method is that the page must be
    fully loaded before the DOM functions assigned by the handlers to the XHTML elements
    can be used. One of the easiest ways to ensure that certain code is to be executed
    after the page is fully loaded is to use the onload event:window.onload = function
    () {document.getElementById ("clickable"). Onclick = sample Message ; }The prior
    art uses the concept of anonymous functions, which is not going to be studied,
    but which allows to create a compact and very simple code. To ensure that a JavaScript
    code is to be executed after the page has been fully loaded, you only need to
    include those instructions between the {and} symbols:window.onload = function
    () {...}In the following example, you add events to elements of type input = text
    of a complex form :function highlights () {// JavaScript code}window.onload =
    function () {var form = document.getElementById ("form"); var fieldsInput = form.getElementsByTagName
    ("input");for (var i = 0; i <fieldsInput.length; i ++) {if (fieldsInput [i] .type
    == "text") {fieldsInput [i] .onclick = highlights;}}}Obtaining Event Information
    (Event Object)Normally, event handlers require additional information to process
    their tasks. If a function, for example, is responsible for processing the onclick
    event, you may need to know what position the mouse was at the time of clicking
    the button.However, the most common case in which it is necessary to know additional
    information about the event is that of the events associated with the keyboard.
    Normally, it is very important to know the key that has been pressed, for example,
    to differentiate the normal keys from the special keys (ENTER, tab, Alt, Ctrl.,
    Etc.).JavaScript allows you to obtain information about the mouse and keyboard
    using a special object called event. Unfortunately, different browsers have very
    notable differences in the treatment of information about events.The main difference
    lies in the way in which the event object is obtained. Internet Explorer considers
    that this object is part of the window object and the rest of browsers consider
    it as the only argument that the event handling functions have .Although it is
    a behavior that is very strange at first, all modern browsers except Internet
    Explorer magically and automatically create an argument that is passed to the
    managing function, so it is not necessary to include it in the call to the managing
    function. Thus, to use this "magic argument", it is only necessary to assign it
    a name, as browsers automatically create it.In summary, in Internet Explorer type
    browsers, the event object is obtained directly by: var event = window.event;On
    the other hand, in the rest of browsers, the event object is obtained magically
    from the argument that the browser automatically creates:function handlerEvents
    (theEvent) {var event = theEvent;}If you want to program an application that works
    correctly in all browsers, it is necessary to obtain the event object correctly
    according to each browser. The following code shows the correct way to obtain
    the event object in any browser:function handlerEvents (elEvento) {var event =
    elEvento || window.event; }Once the event object is obtained, all the information
    related to the event can be accessed, which depends on the type of event produced.Information
    about the eventThe type property indicates the type of event produced, which is
    useful when the same function is used to handle several events: var type = event.type;The
    type property returns the type of event produced, which is equal to the name of
    the event but without the prefix on .Using this property, the previous example
    in which a section of contents was highlighted when you hover the mouse over.Information
    about keyboard eventsOf all the events available in JavaScript, keyboard-related
    events are the most incompatible between different browsers and therefore, the
    most difficult to handle. First, there are many differences between browsers,
    keyboards, and user operating systems, mainly due to differences between languages.In
    addition, there are three different events for the keystrokes (onkeyup, onkeypress,
    and onkeydown). Finally, there are two types of keys: normal keys (such as letters,
    numbers and normal symbols) and special keys (such as ENTER, Alt, Shift, etc.)When
    a user presses a normal key, three events occur in a row and in this order: onkeydown,
    onkeypress and onkeyup. The onkeydown event corresponds to the fact of pressing
    a key and not releasing it; the onkeypress event is the key press itself and the
    onkeyup event refers to the release of a key that was pressed.The easiest way
    to obtain information about the key that has been pressed is through the onkeypress
    event. The information provided by the onkeydown and onkeyup events can be considered
    as more technical since they return the internal code of each key and not the
    character that has been pressed.Below is a list with all the different properties
    of all keyboard events in both Internet Explorer and other browsers:Keydown event:▪
    Same behavior in all browsers:▪ KeyCode property: internal code of the key▪ CharCode
    property: not definedKeypress event:Internet Explorer :▪ keyCode property: the
    character code of the key that was pressed▪ charCode property: not definedOther
    browsers:▪ keyCode property: for normal keys, not defined. For special keys, the
    internal code of the key.▪ charCode property: for normal keys, the character code
    of the key that was pressed. For special keys, 0.Keyup event:▪ Same behavior in
    all browsers:▪ KeyCode property: internal code of the key▪ charCode property:
    not definedTo convert the code of a character (not to be confused with the internal
    code) when character representing the key that was pressed, the String.fromCharCode
    () function is used.When you press the a key in the Firefox browser, the following
    sequence of events is displayed:------------- -------------------------Event type:
    keydown KeyCodeproperty: 65charCode property: 0Character pressed:?--------------------------------------Event
    type: keypressKeyCode property: 0charCode property: 97Character pressed: a--------------------------------------Event
    type: keyup KeyCodeproperty : 65charCode property: 0 Character pressed:?Pressing
    the A key (the same key, but having previously activated the capital letters)
    shows the following sequence of events in the Firefox browser:---------------------
    -----------------Event type: keydown KeyCodeproperty: 65charCode property: 0 Character
    pressed:?--------------------------------------Event type: keypressKeyCode property:
    0charCode property: 65Character pressed: A--------------------------------------Event
    type: keyup KeyCodeproperty : 65charCode property: 0 Character pressed:?In the
    keydown and keyup events, the keyCode property is still valid in both cases. The
    reason is that keyCode stores the internal code of the key, so if the same key
    is pressed, the same code is obtained, regardless of the fact that the same key
    can produce different characters (for example, upper and lower case).In the keypress
    event, the value of the charCode property varies, since character a is not the
    same as character A. In this case, the value of charCode matches the ASCII code
    of the pressed character.Following the Firefox browser, if a special key is pressed,
    such as the tab, the following information is displayed:------------------------
    --------------Event type: keydown KeyCodeproperty: 9charCode property: 0 Character
    pressed:?--------------------------------------Event type: keypressKeyCode property:
    9charCode property: 0Character pressed:?--------------------------------------Event
    type: keyup KeyCodeproperty: 9charCode property: 0 Character pressed:?The special
    keys do not have the charCode property, since only the internal code of the key
    pressed in the keyCode property is saved, in this case, code 9\. If the Enter
    key is pressed, code 13 is obtained, the key the upper arrow produces code 38,
    etc. However, depending on the keyboard used to press the keys and depending on
    the arrangement of the keys depending on the language of the keyboard, these codes
    may vary.The result of the execution of the same example above in the Internet
    Explorer browser is shown below. Pressing the a key, the following information
    is obtained:--------------------------------------Event type: keydown KeyCodeproperty:
    65charCode property: undefined Character pressed:----------------------------------
    ----Event type: keypressKeyCode property: 97charCode property: undefined Character
    pressed:------------------------------ --------Event type: keyup KeyCodeproperty:
    65charCode property: undefined Character pressed:The keyCode property in the keypress
    event contains the ASCII code of the key character, so the character can be obtained
    directly using String.fromCharCode (keyCode).If the A key is pressed, the information
    shown is identical to the previous one, except that the code that shows the keypress
    event changes to 65, which is the ASCII code of the A key:----------- ---------------------------Event
    type: keydown KeyCodeproperty: 6 5charCode property: undefined Character pressed:-------
    -------------------------------Event type: keypressKeyCode property: 65charCode
    property: undefined Character pressed:--- -----------------------------------Event
    type: keyup KeyCodeproperty: 65charCode property: undefined Character pressed
    :When you press a special key like the tab, Internet Explorer displays the following
    information:--------------------------------- -----Event type: keydown KeyCodeproperty:
    9charCode property: undefined Character pressed:The codes shown for the special
    keys match those of Firefox and other browsers but remember that they may vary
    depending on the keyboard that is used and in the function of the arrangement
    of the keys for each language.Finally, the altKey, ctrlKey and shiftKey properties
    store a Boolean value that indicates whether any of those keys were pressed when
    the keyboard event occurred. Surprisingly, these three properties work the same
    way in all browsers:if (event.altKey) {alert (''The ALT key was pressed''); }Below
    is the case in which the Shift key is pressed and without releasing it, you press
    on the key that contains the number 2 (in this case, it refers to the key that
    is at the top of the keyboard and by therefore, it does not refer to the one found
    on the numeric keypad). Both Internet Explorer and Firefox show the same sequence
    of events:--------------------------------------Event type: keydown KeyCodeproperty:
    16charCode property: 0 Character pressed:?--------------------------------------Event
    type: keydown KeyCodeproperty: 50charCode property: 0 Character pressed:?--------------------------------------Event
    type: keypressKeyCode property: 0charCode property: 34Character pressed: "--------------------------------------Event
    type: keyup KeyCodeproperty : 50charCode property: 0 Character pressed:?--------------------------------------Type
    of event: keyupProperty keyCode: 16Property charCode: 0 Character pressed: ?The
    keypress event is the only one that allows to obtain the really pressed character,
    since when pressing on key 2 having previously pressed the Shift key, the character
    is obtained ", which is precisely the one that shows the keypress event.The following
    JavaScript code allows you to correctly obtain in any browser the character corresponding
    to the key pressed:function handler (elEvento) {var event = elEvento || window.event;
    var character = event.charCode || event.keyCode; alert ("The clicked character
    is:" + String.fromCharCode (character));} document.onkeypress = handler;Information
    about mouse eventsThe most relevant information about mouse-related events is
    the coordinates of the mouse pointer position. Although the origin of the coordinates
    is always in the upper left corner, the point taken as a reference of the coordinates
    may vary.In this way, it is possible to obtain the position of the mouse with
    respect to the computer screen, with respect to the browser window and with respect
    to the HTML page itself (which is used when the user has scrolled over the page).
    The simplest coordinates are those that refer to the position of the pointer with
    respect to the browser window, which are obtained through the clientX and clientY
    properties:function showsInformation (the Event) {var event = the Event || window.event;
    var coordinateX = event.clientX; var coordinateY = event.clientY; alert ("You
    clicked on the position:" + coordinate X + "," + coordinate Y);} document.onclick
    = sampleInformation;The coordinates of the position of the mouse pointer with
    respect to the full screen of the user''s computer are obtained in the same way,
    using the screenX and screenY properties :var coordinateX = event.screenX; var
    coordinateY = event.screenY;In many cases, it is necessary to obtain another pair
    of different coordinates: those corresponding to the position of the mouse with
    respect to the origin of the page. These coordinates do not always coincide with
    the coordinates regarding the origin of the browser window since the user can
    scroll over the web page. Internet Explorer does not provide these coordinates
    directly, while other browsers do. In this way, it is necessary to detect if the
    browser is Internet Explorer type and if so, perform a simple calculation.The
    ie variable is true if the browser in which the script is run is of type Internet
    Explorer (any version) and false otherwise. For the rest of the browsers, the
    coordinates regarding the origin of the page are obtained using the pageX and
    pageY properties. In the case of Internet Explorer, they are obtained by adding
    the position with respect to the browser window (clientX, clientY) and the page
    scrolling (document.body.scrollLeft, document.body.scrollTop).Chapter 6 - FormsProgramming
    applications that contain web forms has always been one of the fundamental tasks
    of JavaScript. In fact, one of the main reasons why the JavaScript programming
    language was invented was the need to validate the form data directly in the user''s
    browser. In this way, it was avoided reloading the page when the user made mistakes
    when filling out the forms.However, the appearance of AJAX applications has relegated
    the treatment of forms as the main activity of JavaScript. Now, the main use of
    JavaScript is that of asynchronous communications with servers and that of dynamic
    manipulation of applications. In any case, the handling of the forms is still
    an essential requirement for any JavaScript programmer.Basic Properties Of Forms
    And ElementsJavaScript has numerous properties and functions that facilitate the
    programming of applications that handle forms. First, when a web page is loaded,
    the browser automatically creates an array called forms and that contains the
    reference to all forms on the page.To access the forms array, the document object
    is used, so document.forms is the array that contains all the forms on the page.
    As it is an array, access to each form is done with the same syntax of the arrays.
    The following instruction accesses the first form of the page: document.forms
    [0];In addition to the forms array, the browser automatically creates an array
    called elements for each of the forms on the page. Each array element contains
    the reference to all the elements (text boxes, buttons, drop-down lists, etc.)
    of that form. Using the syntax of the arrays, the following instruction obtains
    the first element of the first form of the page: document.forms [0] .elements
    [0];Array syntax is not always so concise. The following example shows how to
    directly obtain the last element of the first form of the page: document.forms
    [0] .elements [document.forms [0] .elements.length-1];Although this way of accessing
    the forms is quick and simple, it has a very serious inconvenience. What happens
    if the page layout changes and in the HTML code the order of the original forms
    is changed or new forms are added? The problem is that "the first form of the
    page" could now be another form different from what the application expects.In
    an environment as changing as web design, it is very difficult to trust that the
    order of forms remains stable on a web page. For this reason, access to forms
    on a page through the document.forms array should always be avoided.One way to
    avoid the problems of the previous method is to access the forms of a page through
    its name (name attribute) or through its id attribute. The document object allows
    direct access to any form through its name attribute:var formPrincipal = document.formulario;
    var Secondary form = document.otro_formulario;<form name = "form"> ...</form><form
    name = "other_form"> ...</form>Accessing the forms on the page in this way, the
    script works correctly even if the forms are reordered or new forms are added
    to the page. The elements of the forms can also be accessed directly through their
    name attribute:var formPrincipal = document.form; var first Element = document.form.element;<form
    name = "form"><input type = "text" name = "element" /></form>Obviously, you can
    also access the forms and their elements using the DOM functions of direct access
    to the nodes. The following example uses the usual document.getElementById ()
    function to directly access a form and one of its elements:var formPrincipal =
    document.getElementById ("form"); var firstElement = document.getElementById ("element");<form
    name = "form" id = "form"><input type = "text" name = "element" id = "element"
    /> </form>Regardless of the method used to obtain the reference to a form element,
    Each element has the following useful properties for application development:▪
    type: indicates the type of element being treated. For elements of type <input>
    (text, button, checkbox, etc.), it matches the value of its type attribute. For
    normal drop-down lists (<select> element) their value is select-one, which allows
    them to be differentiated from the lists that allow selecting several elements
    at once and whose type is select-multiple. Finally, in elements of type <textarea>,
    the value of type is textarea.▪ form: is a direct reference to the form to which
    the element belongs. Thus, to access the form of an element, you can use document.getElementById
    ("element_id"). Form▪ name: get the value of the name attribute of XHTML. Only
    its value can be read, so it cannot be modified .▪ value: allows you to read and
    modify the value of the value attribute of XHTML. For the text fields (<input
    type = "text"> and <textarea>) get the text that the user has written. For the
    buttons you get the text shown on the button. For the elements checkbox and radiobutton
    it is not very useful, as will be seen later.Finally, the most used events in
    the handling of the forms are the following:▪ onclick: event that occurs when
    you click with the mouse on an element. Normally it is used with any of the types
    of buttons that allow to define XHTML(<input type = "button">, <input type = "submit">,
    <input type = "image">).▪ onchange: event that occurs when the user changes the
    value of a text element (<input type = "text"> or <textarea>). It also occurs
    when the user selects an option from a drop-down list (<select>). However, the
    event only occurs if after making the change, the user moves to the next field
    of the form, which is technically known as "the other form field has lost focus."▪
    onfocus: event that occurs when the user selects an element of the form.▪ onblur:
    complementary onfocus event, since it occurs when the user has deselected an element
    by selecting another element of the form. Technically, it is said that the previous
    element "has lost focus."Basic Utilities For FormsObtain the value of form fieldsMost
    JavaScript techniques related to forms require reading and / or modifying the
    value of form fields. Therefore, below is how to get the value of the most used
    form fields .Text box and textareaThe value of the text displayed by these elements
    is obtained and set directly by the value property.RadiobuttonWhen a group of
    radiobuttons is available, one generally does not want to obtain the value of
    the value attribute of any of them, but the important thing is to know which of
    all the radiobuttons has been selected. The checked property returns true for
    the selected radiobutton and false in any other case.CheckboxCheckbox elements
    are very similar to radiobuttons, except that in this case, you should check each
    checkbox independently of the rest. The reason is that radiobutton groups are
    mutually exclusive and only one of them can be selected at a time. For their part,
    checkboxes can be selected independently from the others.If the following checkboxes
    are available:<input type = "checkbox" value = "conditions" name = "conditions"
    id = "conditions" /> I have read and accept the conditions<input type = "checkbox"
    value = "privacy" name = "privacy" id = "privacy" /> I have read the privacy policyUsing
    the checked property, it is possible to check if each checkbox has been selected:var
    element = document.getElementById ("conditions"); alert ("Element:" + element.value
    + "\ n Selected:" + element.checked);element = document.getElementById ("privacy");alert
    ("Element:" + element.value + "\ n Selected:" + element.checked) ;SelectDrop-down
    lists (<select>) are the elements in which it is more difficult to obtain their
    value. If a drop-down list such as the following is available:<select id = "options"
    name = "options"><option value = "1"> First value </option><option value = "2">
    Second value </ option><option value = "3"> Third value </option><option value
    = "4"> Fourth value </option></select>In general, what is required is to obtain
    the value of the value attribute of the option (<option>) selected by the user.
    Obtaining this value is not easy, since a series of steps must be performed. In
    addition, to obtain the selected value, the following properties must be used:▪
    options, is an array created automatically by the browser for each drop-down list
    and containing the reference to all the options in that list. In this way, the
    first option in a list can be obtained through document.getElementById ("list_id").
    Options [0].▪ selectedIndex, when the user selects an option, the browser automatically
    updates the value of this property, which saves the index of the selected option.
    The index refers to the array options automatically created by the browser for
    each list.// Get the reference to the list var list = document.getElementById
    ("options");// Get the index of the option selected var indexSelected = list.selectedIndex;//
    With the index and array "options", get the option selected var optionSelected
    = list.options [indexSelected] ;// Get the value and the text of the selected
    option varSelected text = optionSelected.text; var valueSelected = optionSelected.value;alert
    ("Selected option:" + selected text + "\ n Option value:" + selected value);As
    has been seen, to obtain the value of the value attribute corresponding to the
    option selected by the user, it is necessary to perform several steps. However,
    all necessary steps are usually abbreviated in a single instruction: var list
    = document.getElementById ("options");// Get the value of the selected option
    var Value Selected = list.options [list.selectedIndex] .value;// Get the text
    that shows the selected option var value Selected = list.options [list.selectedIndex]
    .text;The most important thing is not to confuse the value of the selectedIndex
    property with the value corresponding to the value property of the selected option.
    In the previous example, the first option has a value equal to 1\. However, if
    this option is selected, the value of selectedIndex will be 0, since it is the
    first option of the array options (and the arrays start counting the elements
    in the number 0).Set The Focus On An ElementIn programming, when an element is
    selected and you can write directly to it or you can modify any of its properties,
    it is said to have the focus of the program.If a text box of a form has the focus,
    the user can write directly on it without having to previously click with the
    mouse inside the box. Likewise, if a drop-down list has the focus, the user can
    select an option directly by going up and down with the arrow keys.By repeatedly
    pressing the TABULATOR key on a web page, the different elements (links, images,
    form fields, etc.) get the focus of the browser (the selected element each time
    usually shows a small dotted border) .If on a web page the form is the most important
    element, such as on a search page or on a page with a form to register, it is
    considered a good usability practice to automatically assign the focus to the
    first element of the form when load the pageTo assign the focus to an XHTML element,
    the focus () function is used.Error Detection And CorrectionJavaScript is an interpreted
    programming language, which means that most errors in the code cannot be detected
    until the scripts are executed. In this way, before considering a script as correct,
    it is necessary to test it in all the browsers on which it will be used.When errors
    occur during the execution of a script, browsers provide some useful information
    to discover the exact point at which the error occurred and its possible solution.
    To solve the errors of a script is called "debug the script" or "debug the script"
    (term that comes from the English word "debug", which means "to eliminate the
    errors of an application").Unfortunately, not all browsers provide the same useful
    information, which complicates the solution of errors for each type of browser.
    Below are the tools provided by each browser to detect and correct errors in JavaScript.Error
    correction with Internet ExplorerDepending on your configuration, the Internet
    Explorer browser may have JavaScript error notification disabled. For this reason,
    it may first be necessary to activate warning messages about JavaScript errors.
    To activate notifications, access the Tools> Options menu, Advanced Options tab
    and activate the option.Avoid sending a duplicate formOne of the usual problems
    with the use of web forms is the possibility of the user pressing twice in a row
    on the "Send" button. If the user''s connection is too slow or the response of
    the server is waiting, the original form is still displayed in the browser and
    for that reason, the user is tempted to click on the "Send" button again .In most
    cases, the problem is not serious and it is even possible to control it on the
    server, but it can be complicated in important application forms such as those
    involving economic transactions.For this reason, a good practice in designing
    web applications is usually to disable the send button after the first press.
    The following example shows the necessary code:<form id = "form" action = "#">
    ...<input type = "button" value = "Send" onclick = "this.disabled = true; this.value
    = '' Sending ... ''; this.form.submit () "/> </form>When you click on the form
    submit button, the onclick event occurs on the button and therefore, the JavaScript
    instructions contained in the onclick attribute:1\. First, the button is disabled
    by the instruction this.disabled = true ;. This is the only instruction necessary
    if you only want to disable a button.2\. Next, the message shown by the button
    is changed. From the original "Send" is passed to the most appropriate "Sending
    ..."3\. Finally, the form is sent using the submit () function in the following
    instruction: this.form.submit ()The button in the previous example is defined
    using a button of type <input type = "button" />, since the JavaScript code shown
    does not work correctly with a button of type <input type = "submit" />. If a
    submit type button is used, the button is disabled before submitting the form
    and therefore the form ends without being sent.Limit the character size of a textareaThe
    most important lack of form fields of type textarea is the impossibility of limiting
    the maximum number of characters that can be entered, similar to the maxlength
    attribute of normal text boxes .JavaScript allows you to add this feature very
    easily. First of all, it should be remembered that with some events (such as onkeypress,
    onclick, and onsubmit), normal behavior can be avoided if false is returned.Avoiding
    normal behavior is equivalent to completely modifying the usual behavior of the
    event. If for example the value false is returned in the onkeypress event, the
    key pressed by the user is not taken into account. If false is returned in the
    onclick event of an item as a link, the browser does not load the page indicated
    by the link.If an event returns the value true, its behavior is the usual one:<textarea
    onkeypress = "return true;"> </textarea>In the textarea of the previous example,
    the user can type any character, since the onkeypress event returns true and therefore,
    its behavior is normal and the pressed key becomes a character within the textarea.However,
    in the following example:<textarea onkeypress = "return false;"> </textarea>Since
    the value returned by the onkeypress event is equal to false, the browser does
    not execute the default behavior of the event, that is, the Pressed key is not
    transformed into any character within the textarea. No matter how many times the
    keys are pressed and the pressed key does not matter, that textarea will not allow
    you to type any character.Taking advantage of this feature, it is easy to limit
    the number of characters that can be written in a textarea type element: it is
    checked if the maximum number of characters allowed has been reached and if so,
    the usual behavior of the event is avoided and therefore, additional characters
    are not added to the textarea:function limit (maximum Characters) {var element
    = document.getElementById ("text"); if (element.value.length> = maximum Characters)
    {return false;} else {return true;}}<textarea id = "text" onkeypress = "return
    limits (100);"> </textarea>In the previous example, with each key pressed, the
    total number of characters in the textarea is compared with the maximum number
    of characters allowed. If the number of characters is equal to or greater than
    the limit, the value false is returned and therefore, the default behavior of
    onkeypress is avoided and the key is not added.Restrict allowed characters in
    a text boxSometimes, it may be useful to block certain specific characters in
    a text box. If for example, a text box expects a number to be entered, it may
    be interesting not to allow the user to enter any character that is not numeric.When
    a key is pressed, it is checked whether the character of that key is within the
    characters allowed for that <input> element.If the character is within the allowed
    characters, true is returned and therefore the onkeypress behavior is usual and
    the key is written. If the character is not within the allowed characters, false
    is returned and therefore normal onkeypress behavior is prevented and the key
    is not written to the input.In addition, the previous script always allows the
    pressing of some special keys. In particular, the BackSpace and Delete keys to
    delete characters and the Left Arrow and Right Arrow keys to move in the text
    box can always be pressed regardless of the type of characters allowed .ValidationThe
    main utility of JavaScript in the handling of forms is the validation of the data
    entered by users. Before sending a form to the server, it is recommended to validate
    the data inserted by the user through JavaScript. In this way, if the user has
    made an error when filling out the form, he can be notified instantly, without
    waiting for the response from the server.Reporting errors immediately through
    JavaScript improves user satisfaction with the application (what is technically
    known as "improving the user experience") and helps reduce the processing load
    on the server.Normally, the validation of a form consists of calling a validation
    function when the user clicks on the form submit button. In this function, it
    is checked whether the values entered by the user meet the restrictions imposed
    by the application.Although there are as many possible checks as different form
    elements, some checks are very common: that a mandatory field is filled in, that
    the value of a drop-down list is selected, that the indicated email address is
    correct, that the date entered is logical, that a number has been entered where
    required, etc.Below is the basic JavaScript code needed to incorporate validation
    into a form:<form action = "" method = "" id = "" name = "" onsubmit = "return
    validation ()"> ...</ form >And the validation function scheme () is as follows:function
    validation () {if (condition that the first field of the form must meet) {// If
    the condition is not met ... alert (''[ERROR] The field must have a value of ...
    ''); return false;}else if (condition that the second field of the form must meet)
    {// If the condition is not met ... alert (''[ERROR] The field must have a value
    of ...''); return false;} ... else if (condition that the last field of the form
    must meet) {// If the condition is not met ... alert (''[ERROR] The field must
    have a value of ...''); return false;}// If the script has reached this point,
    all conditions // have been met, so the value true return true is returned;}The
    operation of this validation technique is based on the behavior of the JavaScript
    onsubmit event. Like other events such as onclick and onkeypress, the event onsubmit
    varies its behavior depending on the value that is returned.Thus, if the onsubmit
    event returns true, the form is sent as it normally would. However, if the onsubmit
    event returns the value false, the form is not sent. The key to this technique
    is to check each and every element of the form. When an incorrect item is found,
    the value false is returned. If no error is found, the value true is returned.Therefore,
    the onsubmit event of the form is defined first as: onsubmit = "return validation
    ()"Since the JavaScript code returns the value resulting from the validation function
    (), the form will only be sent to the server if that function returns true In
    the event that the validation () function returns false, the form will remain
    unsent.Within the validation function () all conditions imposed by the application
    are checked. When a condition is not met, false is returned and therefore the
    form is not sent. If the end of the function is reached, all conditions have been
    met correctly, so true is returned and the form is sent .The notification of mistakes
    made depends on the design of each application. In the code in the previous example,
    messages are simply shown by the alert () function indicating the error produced.
    The best designed web applications show each error message next to the corresponding
    form element and also usually display a main message indicating that the form
    contains errors.Once the scheme of the validation function () is defined, the
    corresponding code must be added to this function to all the checks carried out
    on the elements of the form. Below are some of the most common validations of
    form fields.Validate a mandatory text fieldThis is to force the user to enter
    a value in a text box or text box in which it is mandatory.For a mandatory text
    field to be completed, it is checked that the value entered is valid, that the
    number of characters entered is greater than zero, and that only blank spaces
    have not been entered.The reserved word null is a special value that is used to
    indicate "no value". If the value of a variable is null, the variable does not
    contain any value of type object, array, numeric, text string or Boolean.The second
    part of the condition requires that the text entered be longer than zero characters,
    that is, that it is not an empty text.Finally, the third part of the condition
    (/^\s+$/.test(value)) requires that the value entered by the user is not only
    made up of blanks. This verification is based on the use of "regular expressions",
    a common resource in any programming language but which due to its great complexity
    will not be studied. Therefore, it is only necessary to literally copy this condition,
    taking special care not to modify any character of the expression .Validate a
    text field with numerical valuesThis involves forcing the user to enter a numerical
    value in a text box. The JavaScript condition consists of:value = document.getElementById
    ("field"). Value; if (isNaN (value)) {return false;}If the content of the value
    variable is not a valid number, the condition is not met. The advantage of using
    the internal isNaN () function is that it simplifies checks, sinceJavaScript takes
    care of taking into account decimals, signs, etc.Validate an email addressThis
    is to force the user to enter an email address with a valid format. What is checked
    is that the address seems valid, since it is not checked if it is a real and operational
    email account. The JavaScript condition consists of:value = document.getElementById
    ("field"). Value; if (! (/ \ w {1,} [@] [\ w \ -] {1,} ([.] ([\ w \ -] {1,}))
    {1,3} $ /. test (value))) {return false;}The check is done again using regular
    expressions since the valid email addresses can be very different. Although the
    condition is very complex, if it is copied literally, it can be applied to any
    case in which you need to check an email address.Validate a dateDates are usually
    the most complicated form fields to validate for the multitude of different ways
    in which they can be entered. The following code assumes that in some way the
    year, month and day entered by the user have been obtained :var year = document.getElementById
    ("year"). Value; var month = document.getElementById ("month"). value; var dia
    = document.getElementById ("dia"). value; value = new Date (year, month, day);if
    (! isNaN (value)) {return false;}The Date function (year, month, day) is an internal
    JavaScript function that allows you to build dates from the year, month and day
    of the date. It is very important to keep in mind that the month number is indicated
    from 0 to 11, with 0 being the month of January and 11 the month of December.
    The days of the month follow a different numbering since the minimum allowed is
    1 and the maximum 31.The validation consists of trying to construct a date with
    the data provided by the user. If the user data is not correct, the date cannot
    be constructed correctly and therefore the form validation will not be correct.Validate
    a DNI numberThis is to verify that the number provided by the user corresponds
    to a valid National Identity Document or DNI number. Although for each country
    or region the requirements of the identity document of the people may vary, a
    generic example easily adaptable is shown below. The validation must not only
    verify that the number consists of eight digits and one letter, but it is also
    necessary to verify that the indicated letter is correct for the entered number:value
    = document.getElementById ("field"). Value; var letters = [''T'', ''R'', ''W'',
    ''A'', ''G'', ''M'', ''Y'', ''F'', ''P'', ''D'', ''X'', ''B '','' N '','' J '',''
    Z '','' S '','' Q '','' V '','' H '','' L '','' C '','' K '','' E '','' T '']
    ;if (! (/ ^ \ d {8} [AZ] $ /. test (value))) {return false;}if (value.charAt (8)!
    = letters [(value.substring (0, 8))% 23]) {return false;}The first check ensures
    that the format of the number entered is correct, that is, that it consists of
    8 consecutive numbers and one letter. If the letter is at the beginning of the
    numbers, the check would be / ^ [AZ] \ d {8} $ /. If instead of eight numbers
    and one letter, ten numbers and two letters are required, the check would be /
    ^ \ d {10} [AZ] {2} $ / and so on.The second check applies the algorithm for calculating
    the letter of the DNI and compares it with the letter provided by the user. The
    algorithm of each identification document is different, so this part of the validation
    must be adapted accordingly.Validate a telephone numberTelephone numbers can be
    indicated in very different ways: with a national prefix, with an international
    prefix, grouped in pairs, separating numbers with dashes, etc.The following script
    considers that a telephone number consists of nine consecutive digits and without
    spaces or dashes between the figures:value = document.getElementById ("field").
    Value; if (! (/ ^ \ d {9} $ /. test (value))) {return false;}Again, the JavaScript
    condition is based on the use of regular expressions, which check if the indicated
    value is a succession of nine consecutive numbers .Validate that a checkbox has
    been selectedIf an element of type checkbox is mandatory, JavaScript allows you
    to check it very easily:element = document.getElementById ("field"); if (! element.checked)
    {return false;}Validate that a radiobutton has been selectedAlthough it is a case
    similar to that of the checkboxes, the validation of the radiobuttons presents
    an important difference: in general, the verification that is made is that the
    user has selected some radiobutton from those that form a certain group Using
    JavaScript, it is easy to determine if a radiobutton has been selected from a
    group.Clocks, Counters And Time IntervalsSometimes, some web pages display a clock
    with the current time. If the clock must be updated every second, the time cannot
    be displayed directly on the HTML page generated by the server. In this case,
    although there are alternatives made with Java and Flash, the easiest way to do
    this is to show the time of the user''s computer using JavaScript.To create and
    display a clock with JavaScript, you must use the internal Date () object to create
    dates/times and the utilities that allow you to define counters, to update the
    clock every second.The Date () object is a utility that provides JavaScript to
    create dates and times. Once a date type object has been created, it can be manipulated
    to obtain information or perform calculations with dates. To obtain the current
    date and time, it is only necessary to create a Date () object without passing
    any parameters: var dateTime = new Date () ;Using the code above, you can build
    a very basic clock that does not update its content:var dateHour = new Date ();
    document.getElementById ("clock"). innerHTML = dateTime;<div id = "clock" />When
    the page is loaded, the previous example would show a text similar to the following
    in the <div> reserved for the clock:Thu Aug 02 2007 19:35:19 GMT + 0200 (Summer
    time romance)This first built clock has many differences from the clock you want
    to build. First, it shows much more information than is necessary. In addition,
    its value is not updated every second, so it is not a very practical clock.The
    Date () object provides very useful functions for obtaining information about
    the date and time. Specifically, there are functions that directly obtain the
    hour, minutes and seconds.Using the getHours (), getMinutes () and getSeconds
    () functions of the Date object, the clock can only display time information.
    The result of the previous example would be a clock like the following:20: 9:
    21If the hour, minute or second is less than 10, JavaScript does not add 0 ahead,
    so the result is not entirely satisfactory.To complete the clock, you just need
    to update its value every second. To achieve this, you must use special JavaScript
    functions that allow you to execute certain instructions when a certain period
    of time has elapsed.The setTimeout () function allows you to execute a function
    after a specified period of time has elapsed. The definition of the function is:
    setTimeout (functionName, milliseconds) ;The function to be executed must be indicated
    by its name without parentheses and the time that must elapse until it is executed
    is indicated in milliseconds. In this way, if a function is created to show the
    time of the clock and it is called Sample Clock (), it can be indicated that it
    is executed within 1 second.However, the code simply shows the contents of the
    clock 1 second after the page loads, so it is not very useful. To execute a function
    periodically, you use a JavaScript function very similar to setTimeout () that
    is called setInterval (). Its definition is: setInterval (functionName, milliseconds);The
    definition of this function is identical to the setTimeout () function, except
    that in this case, the programmed function is executed infinitely periodically
    with a period of time between executions of as many milliseconds as they have
    been established.Thus, to build the complete clock, a periodic execution of the
    sample function Clock () is established every second.Using the Date object and
    its functions, it is possible to build "countdown", that is, clocks that show
    the time left until an event occurs. In addition, the setTimeout () and setInterval
    () functions can be very useful in other programming techniques.ConclusionThank
    you for making it through to the end of Javascript For Beginners , let’s hope
    it was informative and able to provide you with all of the tools you need to achieve
    your goals whatever they may be.The purpose of this book was to help with Java
    programming and to ensure that everyone learns to use this language to the fullest.
    This book is meant to enlighten the knowledge and ensure that there is very little
    confusion as far as Javascript is concerned. Here’s a bit of history on Javascript
    to end the book.ECMA (European Computer Manufacturers Association) created the
    TC39 committee with the objective of "standardizing a cross-platform scripting
    language and independent of any company". The first standard created by the TC39
    committee was called ECMA-262, in which the ECMAScript language was defined for
    the first time.For this reason, some programmers prefer the ECMAScript designation
    to refer to the JavaScript language. In fact, JavaScript is nothing more than
    the implementation made by the company Netscape of the ECMAScript standard.The
    international organization for standardization (ISO) adopted the ECMA-262 standard
    through its IEC commission, giving rise to the ISO / IEC-16262 standard.ECMA has
    published several standards related to ECMAScript.The fourth version of ECMA-262
    is currently under development, which could include news such as packages, namespaces,
    explicit definition of classes, etc.ECMA has also defined several standards related
    to ECMAScript, such as the ECMA-357 standard, which defines an extension known
    as E4X and allows the integration of JavaScript and XML.Finally, if you found
    this book useful in any way, a good review on Amazon is always appreciated!'
