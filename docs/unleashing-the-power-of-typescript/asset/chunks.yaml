    \ or hardware products described herein.\n\n## Trademark Notice\n\nRather than\
    \ indicating every occurrence of a trademarked name as such, this book uses the\
    \ names only in an editorial fashion and to the benefit of the trademark owner\
    \ with no intention of infringement of the trademark.\n\n![SitePoint logo](Images/sitepoint-logo-2012.png)\n\
    \nPublished by SitePoint Pty. Ltd.\n\n71 Balmain Street, Cremorne, VIC, 3121\n\
    \nAustralia\n\nWeb: www.sitepoint.com\n\nEmail: books@sitepoint.com\n\n## About\
    \ SitePoint\n\nSitePoint specializes in publishing fun, practical, and easy-to-understand\
    \ content for web professionals. Visit [http://www.sitepoint.com/](http://www.sitepoint.com/)\
    \ to access our blogs, books, newsletters, articles, and community forums. You’ll\
    \ find a stack of information on JavaScript, PHP, design, and more.\n\n## About\
    \ the Author\n\nSteve Kinney is the head of engineering for frontend and developer\
    \ tools at Temporal and an instructor with Frontend Masters. Previously, Steve\
    \ founded the front-end engineering program at the Turing School of Software and\
    \ Design and was a New York City public school teacher for the better part of\
    \ a decade.\n\n# Preface\n\n## Who Should Read This Book?\n\nThis book is for\
    \ intermediate-level JavaScript developers who want to get to grips with the powerful\
    \ features that TypeScript offers.\n\n## Conventions Used\n\n### Code Samples\n\
    \nCode in this book is displayed using a fixed-width font, like so:\n\n```\n<h1>A\
    \ Perfect Summer's Day</h1>\n<p>It was a lovely day for a walk in the park.\n\
    The birds were singing and the kids were all back at school.</p>\n```\n\nYou’ll\
    \ notice that we’ve used certain layout styles throughout this book to signify\
    \ different types of information. Look out for the following items.\n\n### Tips,\
    \ Notes, and Warnings\n\n#### Hey, You!\n\nTips provide helpful little pointers.\n\
    \n#### Ahem, Excuse Me ...\n\nNotes are useful asides that are related—but not\
    \ critical—to the topic at hand. Think of them as extra tidbits of information.\n\
    \n#### Make Sure You Always ...\n\n... pay attention to these important points.\n\
    \n#### Watch Out!\n\nWarnings highlight any gotchas that are likely to trip you\
    \ up along the way.\n\n## Supplementary Materials\n\n*   [https://www.sitepoint.com/community/](https://www.sitepoint.com/community/)\
    \ are SitePoint’s forums, for help on any tricky problems.\n*   `books@sitepoint.com`\
    \ is our email address, should you need to contact us to report a problem, or\
    \ for any other reason.\n\n# Chapter 1: Simplifying Reducers in React with TypeScript\n\
    \nMany of the example React applications we see tend to be small and easily understandable.\
    \ But in the real world, React apps tend to grow to a scale that makes it impossible\
    \ for us to keep all of the context in our head. This can often lead to unexpected\
    \ bugs when a given value isn’t what we thought it would be. That object you thought\
    \ had a certain property on it? It turns out it ended up being `undefined` somewhere\
    \ along the way. That function you passed in? Yeah, that’s `undefined` too. That\
    \ string you’re trying to match against? It looks like you misspelled it one night\
    \ when you were working after hours.\n\nUsing TypeScript in a React application\
    \ enhances code quality by providing **static type checking**, which catches errors\
    \ early in the development process. It also improves readability and maintainability\
    \ through explicit type annotations, making it easier for teams to understand\
    \ the code structure. Additionally, TypeScript features like interfaces and generics\
    \ make it easier to build robust, scalable applications.\n\nLarge applications\
    \ also tend to come with increasingly complicated state management. **[Reducers](https://react.dev/learn/extracting-state-logic-into-a-reducer)**\
    \ are a powerful pattern for managing state in client-side applications. Reducers\
    \ became popular with Redux, and are now built into React with the [`useReducer`](https://react.dev/reference/react/useReducer)\
    \ hook, but they’re framework and language agnostic. At the end of the day, a\
    \ reducer is just a function. Redux and React’s `useReducer` just add some additional\
    \ functionality to trigger updates accordingly. We can use Redux with any frontend\
    \ framework or without one all together. We could also write our own take on Redux\
    \ pretty easily, if we were so inclined.\n\nThat said, Redux (and [other implementations\
    \ of the Flux architecture that it’s based on](https://github.com/facebookarchive/flux))\
    \ often get criticized for requiring a lot of boilerplate code, and for being\
    \ a bit cumbersome to use. At the risk of making an unintentional pun, we can\
    \ leverage TypeScript not only to reduce the amount of boilerplate required, but\
    \ also to make the overall experience of using reducers more pleasant.\n\n####\
    \ Following Along with This Tutorial\n\nYou’re welcome to follow along with this\
    \ tutorial in your own environment. I’ve also created [a GitHub repository](https://github.com/stevekinney/sitepoint-reducers)\
    \ that you can clone, as well as [a CodeSandbox demo](https://codesandbox.io/p/sandbox/typescript-redux-example-sitepoint-hjkzkg?file=%2Findex.html%3A1%2C1)\
    \ that you can use to follow along.\n\n## Reducer Basics\n\nA **reducer**, at\
    \ its most fundamental level, is simply a function that takes two arguments: the\
    \ current state, and an object that represents some kind of action that has occurred.\
    \ The reducer returns the new state based on that action.\n\n![A diagram showing\
    \ how a reducer works](Images/reducer.jpg)\n\nThe following code is regular JavaScript,\
    \ but it could easily be converted to TypeScript by adding `any` types to `state`\
    \ and `action`:\n\n```\nexport const incrementAction = { type: 'Increment' };\n\
    export const decrementAction = { type: 'Decrement' };\n\nexport const counterReducer\
    \ = (state, action) => {\n  if (action.type === 'Increment') {\n    return { count:\
    \ state.count + 1 };\n  }\n\n  if (action.type === 'Decrement') {\n    return\
    \ { count: state.count - 1 };\n  }\n\n  return state;\n};\n\nlet state = { count:\
    \ 1 };\n\nstate = counterReducer(state, incrementAction);\nstate = counterReducer(state,\
    \ incrementAction);\nstate = counterReducer(state, decrementAction);\n\nconsole.log(state);\
    \ // Logs: { count: 1 }\n```\n\n#### Repo Code\n\nYou can find the code above\
    \ (`01-basic-example`) in [the GitHub repo for this tutorial](https://github.com/stevekinney/sitepoint-reducers/blob/main/src/01-basic-example.ts).\n\
    \nLet’s review what’s going on in the code sample above:\n\n*   We pass in the\
    \ current state and an action.\n*   If the action has a `type` property of `\"\
    Increment\"`, we increment the `count` property on `state`.\n*   If the action\
    \ has a `type` property of `\"Decrement\"`, we decrement the `count` property\
    \ on `state`.\n*   If neither of the above two bullet points is true, we do nothing\
    \ and return the original state."
