    ```\n\nThis gives us all the flexibility of a generic without needing to type\
    \ any additional boilerplate.\n\n## Taking It a Step Further\n\nNow that we have\
    \ `createLinkedListNode`, we can create an additional utility function called\
    \ `addNextNode`. The function should do the following:\n\n*   It should take an\
    \ existing `LinkedListNode` as the first argument.\n\n*   Based on the type of\
    \ the `value` of that `LinkedListNode`, the second argument should be a value\
    \ of the same type.\n\n*   It should create a new `LinkedListNode` based on the\
    \ second argument.\n\n*   It should set the `next` property on the first `LinkedListNode`\
    \ to the new `LinkedListNode`.\n\n*   It should return the newly created node.\n\
    \nBasically, we want to make the following two tests pass:\n\n```\nit('should\
    \ create a linked list node', () => {\n  let node = createLinkedListNode('first');\n\
    \  expect(node).toEqual({ value: 'first' });\n});\n\nit('should add a linked list\
    \ node', () => {\n  let firstNode = createLinkedListNode('first');\n  let secondNode\
    \ = addLinkedListNode(firstNode, 'second');\n\n  expect(firstNode).toEqual({ value:\
    \ 'first', next: { value: 'second' } });\n  expect(secondNode).toEqual({ value:\
    \ 'second' });\n});\n```\n\nThe key piece here is that the value of `T` should\
    \ be the same throughout. There are a few ways we could write the function, and\
    \ we won’t go over the merits of each. Here’s one possible implementation:\n\n\
    ```\nconst createLinkedListNode = <T>(value: T): LinkedListNode<T> => {\n  return\
    \ { value };\n};\n\nconst addLinkedListNode = <T>(\n  node: LinkedListNode<T>,\n\
    \  value: T,\n): LinkedListNode<T> => {\n  node.next = createLinkedListNode(value);\n\
    \  return node.next;\n};\n```\n\n#### Repo Code\n\nYou can find the code above\
