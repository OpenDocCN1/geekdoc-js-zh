    \n好的，这很有趣，但如果我们希望传递给 `ComponentProps` 的类型参数与……`as` 相同呢？\n\n我们*可以*尝试这样的方法：\n\n\
    ```typescript\nimport { ComponentProps, ElementType } from 'react';\n\ntype BoxProps<E\
