    \n# 第 2 章：TypeScript 泛型入门\n\n如果你来自具有类型系统的语言，你可能已经熟悉[泛型](https://www.typescriptlang.org/docs/handbook/2/generics.html)。但如果你像我一样，经验主要来自\
    \ JavaScript、Python 或 Ruby 等动态语言，泛型一开始可能看起来有点令人困惑。我确实有罪，只是复制粘贴示例而没有完全理解发生了什么。但别担心！一旦我们理解了泛型，它们既强大又相当简单。让我们从基础开始，逐步构建，以全面理解泛型是什么以及如何在\
    \ TypeScript 代码中使用它们。\n\n简而言之，TypeScript 中的**泛型**允许我们编写可重用的代码，这些代码可以处理多种类型。泛型充当类型的占位符，让我们能够编写在编译时适应并强制类型一致性的代码。将泛型视为变量（但仅用于我们的类型）并没有错。\n\
    \n#### 跟随本教程\n\n我们将使用的所有代码都可以在 [这个 GitHub 仓库](https://github.com/stevekinney/sitepoint-generics)\
    \ 中找到。我也鼓励你使用 [TypeScript Playground](https://www.typescriptlang.org/play) 来尝试想法并试用下面的示例。\n\
    \n## 什么是泛型？\n\nTypeScript 中的**泛型**提供了一种创建可重用代码组件的方法，这些组件可以处理多种类型（而不仅仅是一种）。正如我提到的，我们可以将它们视为变量——但用于我们的类型。泛型提供了一种创建灵活结构的方式，允许我们稍后定义类型。\n\
    \n让我们从一个简单的[链表](https://en.wikipedia.org/wiki/Linked_list)开始。一个**链表**节点包含一个值，然后是指向下一个节点的链接。我们可以从类似这样的东西开始：\n\
    \n```\ntype LinkedListNode = {\n  value: any;\n  next?: LinkedListNode;\n};\n\
    ```\n\n然而，我将添加一个额外的要求。列表中的所有节点都应该是相同的类型。例如，如果我们想要一个字符串链表，我们可以细化我们的类型以确保 value\
    \ 始终是字符串：\n\n```\ntype LinkedListNode = {\n  value: string;\n  next?: LinkedListNode;\n\
    };\n\nconst firstNode: LinkedListNode = {\n  value: 'first',\n};\n\nconst secondNode:\
    \ LinkedListNode = {\n  value: 'second',\n};\n\nfirstNode.next = secondNode;\n\
    ```\n\n#### 仓库代码\n\n你可以在[本教程的 GitHub 仓库](https://github.com/stevekinney/sitepoint-generics/blob/main/src/01-without-generics.ts)中找到上述代码（`01-without-generics.ts`）。\n\
    \n你可能已经注意到这里的问题。如果我们还想支持一个数字链表，我们就必须创建另一个类型，以此类推，对于我们要让链表支持的每一种值类型。这很繁琐，而且无法扩展。\n\
    \n这就是泛型的用武之地。它们让我们定义一个可以在类型中使用的占位符。如果我们想要一个链表节点，其中的值可以是任何类型，但确保所有后续节点也是*相同*的类型，我们可以写类似这样的代码：\n\
    ```\n"
- fmt: "```\ntype LinkedListNode<T> = {\n  value: T;\n  next?: LinkedListNode<T>;\n\
    };\n\nconst firstNode: LinkedListNode<string> = {\n  value: 'first',\n};\n\nconst\
    \ secondNode: LinkedListNode<string> = {\n  value: 'second',\n};\n\nconst thirdNode:\
    \ LinkedListNode<number> = {\n  value: 42,\n};\n\nconst fourthNode: LinkedListNode<number>\
    \ = {\n  value: 17,\n};\n\nfirstNode.next = secondNode;\nthirdNode.next = fourthNode;\n\
    ```\n\n#### Repo Code\n\nYou can find the code above (`02-with-generics`) in [the\
    \ GitHub repo for this tutorial](https://github.com/stevekinney/sitepoint-generics/blob/main/src/02-with-generics.ts).\n\
    \nWhen we set `T` to either `string` or `number`, TypeScript uses that type everywhere\
    \ that `T` is referenced.\n\n#### An Experiment\n\nIf you want to run a little\
    \ experiment, you can try to connect the `thirdNode` to `firstNode` in [this playground](https://www.typescriptlang.org/play?#code/C4TwDgpgBAMglgOwNYQCbwM7AHIHtUQA8AKgHxQC8UA3gFBRQBuAhgDYCuEAXFMQNz0oCCAA9gAfh7xkaTDnxEyAgL4DaAY1wIsUAGZwATljwEpiFOjjGFhLAcQBzclToMWHblADk+o8C8ANLSqtBpaOhgQmgioJp7SFnJxtsD2CE6UNILunDxekdGogcFq0TrAABaGsQpmMpbWBIQI7AC2AEYQBs5Zbmy5UAAsAExBIWHawHq47AaVcXWJVvJNLR1dPa5M-Z4AjADsY2q+jRAAdMJimQVaNQQCldVxF6JTVLozcxVxfEA).\
    \ You’ll see that TypeScript won’t allow it.\n\n## A Word on Naming Generics\n\
    \nYou might be wondering why I called my generic `T`. I mostly did this because\
    \ it’s convention. `T` stands for “type”. If there’s more than one generic in\
    \ a type, you might sometimes see `U` used. Why? because U is the letter after\
    \ T.\n\nGenerics don’t need to be single letters. We could have easily used a\
    \ longer name:\n\n```\ntype LinkedListNode<NodeType> = {\n  value: NodeType;\n\
    \  next?: LinkedListNode<NodeType>;\n};\n```\n\nTypically, though, we just see\
    \ single letters used. For example, [React’s types](https://github.com/DefinitelyTyped/DefinitelyTyped/blob/60ab8a805a1c5c4225027068e604ef4687cdf379/types/react/index.d.ts#L76)\
    \ will use `P` when referring to props.\n\nIf we need to use multiple generics,\
    \ we can separate them with a comma, just like we would do for arguments in a\
    \ function:\n\n```\ntype Badge<L extends string, C extends number> {\n  label:\
    \ L,\n  count: C\n}\n```\n\n## Extending Types in Generics\n\nRight now, the `T`\
    \ generic can be anything. In the example above, we used a string and a number,\
    \ but we could have just as easily used a Boolean, an array, an object, or even\
    \ a function.\n\nLet’s say we wanted to limit the value of our linked list node\
    \ to only support strings, numbers, and Booleans.\n\nIn TypeScript, constraints\
    \ are expressed using the `extends` keyword. `T extends K` means it’s safe to\
    \ presume that a value of type `T` is also of type `K`. An easy way of thinking\
    \ about this is to just imagine we’re writing something with `extends` as a variable\
    \ assignment.\n\nLet’s take `19 extends number` as an example. We could think\
    \ about it like this:\n\n```\nconst nineteen: number = 19;\n```\n\nWe can say\
    \ that `T` has to extend another type:\n\n```\ntype LinkedListNode<T extends string\
    \ | number | boolean> = {\n  value: T;\n  next?: LinkedListNode<T>;\n};\n```\n\
    \n#### Repo Code\n\nYou can find the code above (`03-extending-types`) in [the\
    \ GitHub repo for this tutorial](https://github.com/stevekinney/sitepoint-generics/blob/main/src/03-extending-types.ts).\n\
    \nNow, our generic is limited to anything that meets the criteria of being a string,\
    \ number, or Boolean. We can get a little bit silly with this. For example, we\
    \ could say a node can only support a particular string or a specific number:\n\
    \n```\nconst firstNode: LinkedListNode<string> = {\n  value: 'first',\n};\n\n\
    const secondNode: LinkedListNode<'second'> = {\n  value: 'second',\n};\n\nconst\
    \ thirdNode: LinkedListNode<number> = {\n  value: 42,\n};\n\nconst fourthNode:\
    \ LinkedListNode<17> = {\n  value: 17,\n};\n\nfirstNode.next = secondNode;\nthirdNode.next\
    \ = fourthNode;\nfourthNode.next = {\n  value: 17,\n};\n```\n\nThe type `number`\
    \ refers to any number. `17` is a literal type that only allows for that specific\
    \ value. In this case, anything connected to `secondNode` would *have* to have\
    \ a value of `\"second\"`, and anything connected to `fourthNode` would *have*\
    \ to have a value of `17`. Each technically does extend `string` and `number`\
    \ respectively. That said, I’m only doing this as a demonstration. I’m not sure\
    \ why we’d want to do this in practice.\n\nA more practical example would be if\
    \ we wanted to only support a certain subset of strings or numbers. For example,\
    \ we could limit the acceptable strings using a union, as seen [in this demo](https://www.typescriptlang.org/play?#code/C4TwDgpgBAMglgOwNYQCbwM7AHIHtUQA8AKlBAB7AQKoZQDkANrgIaqIDm9UAPgxgFcAxkIgYM3PvQgAnGbhn0AfFAC8UAN4AoKFABuLRgIgAuKMQDcOqAgrAA-GfjI0mHPiLElVgL4WgA):\n\
    \n```\ntype LinkedListNode<T extends 'loading' | 'success' | 'error'> = {\n  value:\
    \ T;\n  next?: LinkedListNode<T>;\n};\n```\n\nObviously, it’s getting a bit tedious\
    \ to constantly have to define the type for each variable.\n\n## Using Generics\
    \ in Functions\n\nIt’s a bit more common to see generics used with functions.\
    \ Let’s consider an [identity function](https://en.wikipedia.org/wiki/Identity_function)\
    \ that takes a value and returns it. I think we’re pretty clear at this point\
    \ that we don’t want to do something like this:\n\n```\nconst identity = (x: string):\
    \ string => {\n  return x;\n};\n```\n\nJust as with the linked list, I don’t have\
    \ time to create one of these for every type I come across. This sounds like a\
    \ perfect use case for a generic:\n\n```\nexport const identity = <T>(x: T): T\
    \ => {\n  return x;\n};\n\nexport const foo = identity<string>('foo');\n```\n\n\
    ### A Word on Using Generics with JSX\n\nWe might find that the syntax above won’t\
    \ work if we’re using React and/or JSX. This is because the parser has a hard\
    \ time differentiating between the syntax for a generic and a JSX component. We\
    \ can see it failing in [this playground](https://www.typescriptlang.org/play?ssl=5&ssc=37&pln=1&pc=1#code/MYewdgzgLgBAlgEwKZinKBPGBeGAeAFQD4AKADwC4YCBKKgnImAbwCgYYAnJKAV07AwyAblYBfUa1CRYAMxAgc8ZKnQY80TnDABzUgHJ5IfTWFA),\
    \ and we can see it compiling just fine with JSX turned off [here](https://www.typescriptlang.org/play?jsx=0#code/MYewdgzgLgBAlgEwKZinKBPGBeGAeAFQD4AKADwC4YCBKKgnImAbwCgYYAnJKAV07AwyAblYBfUa1CRYAMxAgc8ZKnQY80TnDABzUgHJ5IfTWFA).\n\
    \nTo get around this, we have two options. We could simply add a comma after the\
    \ generic:\n\n```\nconst identity = <T,>(x: T): T => {\n  return x;\n};\n```\n\
    \nOr, we could exclusively use function declarations:\n\n```\nfunction identity<T>(x:\
    \ T): T {\n  return x;\n}\n```\n\n## Inferring Generics\n\nTypeScript is always\
    \ trying to get out of our way. If it can figure out what a generic ought to be,\
    \ it will relieve us of the responsibility of having to tell it. Let’s take a\
    \ look at the following code:\n\n```\nexport const identity = <T>(x: T): T =>\
    \ {\n  return x;\n};\n\nexport const foo = identity<string>('foo');\nexport const\
    \ two = identity(2);\n```\n\n#### Repo Code\n\nYou can find the code above (`04-inferring-generics`)\
    \ in [the GitHub repo for this tutorial](https://github.com/stevekinney/sitepoint-generics/src/04-inferring-generics.ts).\n\
    \nIn this code, we’re able to completely omit telling TypeScript what type `T`\
    \ should be. It sees that we’re handing that function call a number, so it’s able\
    \ to figure out that `T` is a number in this case.\n\nWe can also leverage this\
    \ to simplify our linked list above:\n\n```\ntype LinkedListNode<T> = {\n  value:\
    \ T;\n  next?: LinkedListNode<T>;\n};\n\nexport const identity = <T>(x: T): T\
    \ => {\n  return x;\n};\n\nexport const foo = identity<string>('foo');\nexport\
    \ const two = identity(2);\n\nconst createLinkedListNode = <T>(value: T): LinkedListNode<T>\
    \ => {\n  return { value };\n};\n\nconst firstNode = createLinkedListNode('first');\n\
    const secondNode = createLinkedListNode('second');\n\nfirstNode.next = secondNode;\n\
    ```\n\nYou’ll notice that we no longer need to define what type of `LinkedListNode`\
    \ we’re expecting. As soon as TypeScript can narrow down the type for one reference\
    \ to `T`, it can fill in all of the rest. `firstNode` and `secondNode` have the\
    \ following types:"
