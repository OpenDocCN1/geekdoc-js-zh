    export default Box;\n```\n\n现在，一个 `Box` 组件将适应我们通过 `as` 属性传入的任何元素类型。\n\n![一个具有按钮属性的\
    \ Box](img/as-button.png)\n\n我们现在可以在任何原本可能使用 `<div>` 的地方使用我们的 `Box` 组件：\n\n```jsx\n\
    <Box as=\"section\" className=\"flex place-content-between w-full\">\n  <Button\
