    </Box>\n```\n\n### 仓库代码\n\n你可以在 [本教程的 GitHub 仓库的 `polymorphic` 分支](https://github.com/stevekinney/polymorphic/tree/polymorphic)\
    \ 上找到最终结果。\n\n## 结论\n\n我们刚刚探讨了使用 React 和 TypeScript 创建多态组件的不同策略。通过扩展 HTML 元素的属性，可以创建具有附加行为的该元素的抽象。多态组件是一个单一的、可适应的组件，可以表示不同的语义\
    \ HTML 元素，TypeScript 会自动适应这些变化。最酷的是，我们现在可以使用这个新的原语为我们的应用程序普遍添加主题和其他功能。\n\n这些方法在大多数版本的\
    \ TypeScript 中都有效。在下一章中，我们将看看 TypeScript 最新版本带来的一些具体改进，以及我们如何利用它们来进一步提高代码的可靠性和可维护性。\n\
    \n# 第 5 章：TypeScript 5.0 三大特性导览\n\nTypeScript，JavaScript 更可靠的表亲，变得越来越好。TypeScript\
    \ 5.0 及其后续的次要版本 5.1 和 5.2 充满了强大的新功能，有望使我们的代码更简洁、更强大，并且更容易使用。正如你从[发布说明](https://www.typescriptlang.org/docs/handbook/release-notes/typescript-5-0.html)中看到的，TypeScript\
    \ 5.0 带来了大量变化——无论大小。\n\n我将重点关注三个对我的日常开发影响最大的特性：\n\n*   **装饰器**。TypeScript 5.0\
    \ 支持与 ECMAScript 提案对齐的装饰器，允许以可重用的方式修改类行为。这些与之前通过 `--experimentalDecorators` 标志支持的装饰器有一些重要的区别。\n\
    \n*   **const 类型参数**。新的 `const` 类型参数增强了函数调用推断，并确保声明的常量保持不变。\n\n*   **枚举的升级和更改**。TypeScript\
    \ 5.0 增强了枚举，提高了类型安全性，使其更灵活且更用户友好。\n\n## 装饰器：下一代\n\n装饰器*几乎*从我记事起就一直是 ECMAScript\
    \ 的一部分。这些巧妙的工具让我们能够以可重用的方式修改类和成员。它们在 TypeScript 中已经存在一段时间了——尽管是在实验性标志下。尽管装饰器的第\
    \ 2 阶段迭代一直是实验性的，但装饰器已在 [MobX](https://mobx.js.org/enabling-decorators.html)、[Angular](https://angular.io/)、[Nest](https://docs.nestjs.com/custom-decorators)\
    \ 和 [TypeORM](https://typeorm.io/) 等库中被广泛使用。TypeScript 5.0 的装饰器与 [ECMAScript 提案](https://github.com/tc39/proposal-decorators)完全同步，该提案已基本准备就绪，处于第\
    \ 3 阶段。\n\n**装饰器**让我们能够编写一个函数来调整类及其方法的行为。想象一下，需要在我们的方法中偷偷加入一些调试语句。在 TypeScript\
    \ 5.0 之前，我们只能手动将调试语句复制粘贴到每个方法中。有了装饰器，我们只需做一次工作，更改就会通过装饰器附加的每个方法得到支持。\n\n假设我们想创建一个装饰器来记录某个方法已弃用：\n\
    \n```typescript\nclass Card {\n  constructor(public suit: Suit, public rank: Rank)\
    \ {\n    this.suit = suit;\n    this.rank = rank;\n  }\n\n  get name(): CardName\
    \ {\n    return `${this.rank} of ${this.suit}`;\n  }\n\n  @deprecated // \U0001F440\
    \ 这是一个装饰器！\n  getValue(): number {\n    if (this.rank === 'Ace') return 14;\n\
    \    if (this.rank === 'King') return 13;\n    if (this.rank === 'Queen') return\
    \ 12;\n    if (this.rank === 'Jack') return 11;\n    return this.rank;\n  }\n\n\
    \  // 新的方法！\n  get value(): number {\n    if (this.rank === 'Ace') return 14;\n\
    \    if (this.rank === 'King') return 13;\n    if (this.rank === 'Queen') return\
    \ 12;\n    if (this.rank === 'Jack') return 11;\n    return this.rank;\n  }\n\
    }\n\nconst card = new Card('Spades', 'Queen');\ncard.getValue();\n```\n\n我们希望每当调用\
    \ `card.getValue()` 时，控制台都会记录一条警告消息。我们可以如下实现上述装饰器：\n\n```typescript\nconst deprecated\
    \ = <This, Arguments extends any[], ReturnValue>(\n  target: (this: This, ...args:\
    \ Arguments) => ReturnValue,\n  context: ClassMethodDecoratorContext<\n    This,\n\
    \    (this: This, ...args: Arguments) => ReturnValue\n  >,\n) => {\n  const methodName\
    \ = String(context.name);\n\n  function replacementMethod(this: This, ...args:\
    \ Arguments): ReturnValue {\n    console.warn(`Warning: '${methodName}' is deprecated.`);\n\
    \    return target.call(this, ...args);\n  }\n\n  return replacementMethod;\n\
    };\n```\n\n这起初可能看起来有点令人困惑，但让我们分解一下：\n\n*   我们的装饰器函数接受两个参数：`target` 和 `context`。\n\
    \n*   `target` 是我们正在装饰的方法本身。\n\n*   `context` 是关于该方法的元数据。\n\n*   我们返回一个具有相同签名的方法。\n\
    \n*   在这种情况下，我们调用 `console.warn` 来记录弃用通知，然后调用该方法。\n\n`ClassMethodDecorator` 类型具有以下属性：\n\
    \n*   `kind`：被装饰属性的类型。在上面的例子中，这将是 `method`，因为我们正在装饰 `Card` 实例上的一个方法。\n\n*   `name`：属性的名称。在上面的例子中，这是\
    \ `getValue`。\n\n*   `static`：一个值，指示类元素是静态的（`true`）还是实例的（`false`）元素。\n"
- fmt: "\n*   `private`: a value indicating whether the class element has a private\
    \ name.\n\n*   `access`: an object that can be used to access the current value\
    \ of the class element at runtime.\n\n*   `has`: determines whether an object\
    \ has a property with the same name as the decorated element.\n\n*   `get`: invokes\
    \ the setter on the provided object.\n\n### Kick the Tires\n\nYou can kick the\
    \ tires of the code samples above in [this playground](https://www.typescriptlang.org/play?ts=5.1.3#-#OQAA3HEIGEqBRNYcTJPI3zDOApyMF0fR3L7bSfNkvyWuMjBTIyTrLOs6TeuaxyBvQFz4hCjywq8nqDJi-zlKC8IRs8iKewW6L5OA+LZyAA).\n\
    \nDecorators provide convenient syntactic sugar for adding log messages—like we\
    \ did in the example above—as well as a number of other common use cases. For\
    \ example, we could create a decorator that automatically binds the method to\
    \ the current instance or that modifies the [property descriptor](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Proxy/Proxy/getOwnPropertyDescriptor)\
    \ of the method or class.\n\n## Unleashing const Type Parameters\n\n`const` type\
    \ parameters allow us to declare values with `const`. TypeScript will now be able\
    \ to infer the type, not just the literal values.\n\nPut more simply, the `const`\
    \ type parameters allow us to spell out our intentions clearly in our code. If\
    \ a variable is supposed to be a constant that never changes, `const` type parameters\
    \ give us a safety net, making sure it stays constant, come what may.\n\nPrevious\
    \ versions of TypeScript have supported using `as const` to declare an object\
    \ or array as `readonly`. Once TypeScript knows that an object or array isn’t\
    \ going to change at runtime, it can be a lot more confident in the assumptions\
    \ it makes about the type.\n\nConsider the following two arrays:\n\n```\nconst\
    \ avengers = [\n  'Black Widow',\n  'Captain America',\n  'Hawkeye',\n  'Hulk',\n\
    \  'Iron Man',\n  'Thor',\n];\n\nconst ninjaTurtles = [\n  'Donatello',\n  'Leonardo',\n\
    \  'Michelangelo',\n  'Raphael',\n] as const;\n```\n\nIf we hover over each in\
    \ [this playground](https://www.typescriptlang.org/play?ts=4.9.5#code/MYewdgzgLgBAhgNwKZgOZIE4RgXhgbQHIBJDcGAWTjEIBoZCAhAGzmAGsYB1ASwBMQAdzoMAKgAsQGEYQDCcAA5Q4PMDACCAW0w9gcGQAk4g9kgCeSQgF0A3AChQkWGFUArOKICuGKMyTY8IgARcDgoJGZmEBkAGSRQjAEZACVFcTgImQpdcQjqdGireGxHaBsgA),\
    \ we’ll see that TypeScript has inferred two very different types:\n\n```\nconst\
    \ avengers: string[];\nconst ninjaTurtles: readonly [\n  'Donatello',\n  'Leonardo',\n\
    \  'Michelangelo',\n  'Raphael',\n];\n```\n\nThings get a little trickier when\
    \ working with `readonly` data structures with functions. Consider the following:\n\
    \n```\ntype WithNames = { names: readonly string[] };\n\nconst turtles = getNames({\n\
    \  names: ['Donatello', 'Leonardo', 'Michelangelo', 'Raphael'],\n});\n```\n\n\
    In this example, `turtles` would be `string[]`, which is not what we might expect\
    \ if we look closely at `WithNames`, which asserts that the `names` property is\
    \ `readonly`. Previously, we were able to get something closer to what we might\
    \ expect by adding `as const` to the array as we called the function:\n\n```\n\
    const turtles = getNames({\n  names: ['Donatello', 'Leonardo', 'Michelangelo',\
    \ 'Raphael'] as const,\n});\n```\n\n`turtles` would now correctly be the following\
    \ type:\n\n```\nconst turtles: readonly ['Donatello', 'Leonardo', 'Michelangelo',\
    \ 'Raphael'];\n```\n\nBut this can be cumbersome, and if we forget to add `as\
    \ const` each time we call the function, we might end up with something other\
    \ than what we expect—and that’s never good.\n\nIn TypeScript 5.0, we can add\
    \ `const` to the type of the parameter itself, and then we no longer have to worry\
    \ about adding `as const` every single time we invoke the function:\n\n```\n//\
    \                  ⬇️\nconst getNames = <const T extends WithNames>(arg: T): T['names']\
    \ => {\n  return arg.names;\n};\n\nconst turtles = getNames({\n  names: ['Donatello',\
    \ 'Leonardo', 'Michelangelo', 'Raphael'],\n});\n\nconst avengers = getNames({\n\
    \  names: [\n    'Black Widow',\n    'Captain America',\n    'Hawkeye',\n    'Hulk',\n\
    \    'Iron Man',\n    'Thor',\n  ],\n});\n```\n\nThe types are now as follows:\n\
    \n```\nconst turtles: readonly ['Donatello', 'Leonardo', 'Michelangelo', 'Raphael'];\n\
    const avengers: readonly [\n  'Black Widow',\n  'Captain America',\n  'Hawkeye',\n\
    \  'Hulk',\n  'Iron Man',\n  'Thor',\n];\n```\n\n### Have a Play\n\nYou can play\
    \ around with the code above [in this TypeScript playground](https://www.typescriptlang.org/play?ts=5.1.3#).\n\
    \nAs with anything, there are some trade-offs. Using `as const` sets the object\
    \ as read-only at the time of declaration. `const` parameters give us another\
    \ option: the ability to set the object as read-only at the time of invocation.\
    \ Having the ability to choose the behavior that best serves our use case is a\
    \ welcome addition to TypeScript.\n\n## Upgraded and Enhanced Enums\n\nEnums—which\
    \ provide a handy (if somewhat under appreciated) way of defining a set of named\
    \ constants—have received a major boost in TypeScript 5.0.\n\nIn the past, we\
    \ could have accidentally passed an incorrect number to a function expecting an\
    \ enum and gotten away with it. TypeScript 5.0 is a lot stricter. It will throw\
    \ an error if there’s a mismatch. It now treats all enums as union enums, making\
    \ them safer and easier to work with.\n\nUp until TypeScript 5.0, an enum was\
    \ really just a set of numeric constraints. Let’s say we had an enum that tracked\
    \ the state of an HTTP request:\n\n```\nenum RequestState {\n  NotStarted,\n \
    \ Loading,\n  Success,\n  Error,\n}\n```\n\nTypeScript will compile that down\
    \ to the following object:\n\n```\n{\n  \"0\": \"NotStarted\",\n  \"1\": \"Loading\"\
    ,\n  \"2\": \"Success\",\n  \"3\": \"Error\",\n  \"NotStarted\": 0,\n  \"Loading\"\
    : 1,\n  \"Success\": 2,\n  \"Error\": 3\n}\n```\n\nEnums could be treated as a\
    \ bound set of numbers. In the case of `RequestState`, this would be 0, 1, 2,\
    \ and 3\\. But in previous versions of TypeScript, we could get around the predefined\
    \ values in an enum with any number. For example, [the following is valid in TypeScript\
    \ 4.9.5](https://www.typescriptlang.org/play?ts=4.9.5#code/KYOwrgtgBASsCOZgGcAuBlVBDVwoG8AoKKAOQHsNsAnXAEwBpioAZcrOgSxAHMmT0YAMZCUyflACi1auWpMAvoUJDyINFAA25HnEQoqOPAF4oACmoIkaAFywrBzEYCUUYwD4CzVevKbgAHTaPGYA5HrWqDahDFCW+mixEY7YuADa8ZEAus4A3IQK+YTByWhOuGalhrgBbBzcPHnFOlXlwGYADE0lDmWp7QCsA01AA):\n\
    \n```\nconst logRequestState = (request: RequestState) => {\n  console.log('Request:',\
    \ request, RequestState[request]);\n};\n\nlogRequestState(RequestState.Loading);\
    \ // ✅ Logs: \"Request:\",  1,  \"Loading\"\nlogRequestState(0); // ✅ Logs: \"\
    Request:\",  0,  \"NotStarted\"\nlogRequestState(55); // ✅ Logs:  \"Request:\"\
    ,  55,  undefined \U0001F928\n```\n"
