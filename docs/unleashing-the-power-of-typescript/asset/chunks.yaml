    \n邮箱：books@sitepoint.com\n\n## 关于 SitePoint\n\nSitePoint 专注于为网络专业人士出版有趣、实用且易于理解的内容。访问[`www.sitepoint.com/`](http://www.sitepoint.com/)可获取我们的博客、书籍、通讯、文章和社区论坛。您将找到大量关于\
    \ JavaScript、PHP、设计等方面的信息。\n\n## 关于作者\n\nSteve Kinney 是 Temporal 公司前端和开发者工具的工程主管，同时也是\
    \ Frontend Masters 的讲师。此前，Steve 在图灵软件与设计学院创立了前端工程项目，并在纽约市公立学校担任了近十年的教师。\n\n# 前言\n\
    \n## 谁应该阅读本书？\n\n本书适用于中级 JavaScript 开发者，他们希望掌握 TypeScript 提供的强大功能。\n\n## 使用的约定\n\
    \n### 代码示例\n\n本书中的代码使用等宽字体显示，如下所示：\n\n```\n<h1>A Perfect Summer's Day</h1>\n<p>It\
    \ was a lovely day for a walk in the park.\nThe birds were singing and the kids\
    \ were all back at school.</p>\n```\n\n您会注意到，我们在本书中使用了某些布局样式来表示不同类型的信息。请注意以下项目。\n\
    \n### 提示、说明和警告\n\n#### 嘿，你！\n\n提示提供有用的小提示。\n\n#### 嗯，打扰一下...\n\n说明是与当前主题相关但非关键的有用旁注。可以将它们视为额外的信息片段。\n\
    \n#### 务必始终...\n\n...注意这些重要要点。\n\n#### 小心！\n\n警告突出显示了可能在过程中绊倒您的任何陷阱。\n\n## 补充材料\n\
    \n*   [`www.sitepoint.com/community/`](https://www.sitepoint.com/community/)是\
    \ SitePoint 的论坛，可获取任何棘手问题的帮助。\n*   `books@sitepoint.com`是我们的电子邮件地址，如果您需要联系我们报告问题或出于任何其他原因。\n\
    \n# 第 1 章：使用 TypeScript 简化 React 中的 Reducer\n\n我们看到的许多 React 示例应用程序往往规模较小且易于理解。但在现实世界中，React\
    \ 应用程序往往会增长到我们无法将所有上下文都记在脑中的规模。这通常会导致当给定值不是我们预期的那样时出现意外的错误。您认为具有某个属性的对象？结果发现它在某个地方变成了`undefined`。您传入的函数？是的，它也是`undefined`。您试图匹配的字符串？看起来您在某个晚上加班时拼错了。\n\
    \n在 React 应用程序中使用 TypeScript 通过提供**静态类型检查**来增强代码质量，这可以在开发过程的早期捕获错误。它还通过显式类型注解提高了可读性和可维护性，使团队更容易理解代码结构。此外，TypeScript\
    \ 的接口和泛型等功能使得构建健壮、可扩展的应用程序变得更加容易。\n\n大型应用程序也往往伴随着日益复杂的状态管理。**[Reducer](https://react.dev/learn/extracting-state-logic-into-a-reducer)**是管理客户端应用程序状态的强大模式。Reducer\
    \ 随着 Redux 而流行起来，现在已通过[`useReducer`](https://react.dev/reference/react/useReducer)钩子内置到\
    \ React 中，但它们与框架和语言无关。归根结底，Reducer 只是一个函数。Redux 和 React 的`useReducer`只是添加了一些额外的功能来相应地触发更新。我们可以将\
    \ Redux 与任何前端框架一起使用，也可以完全不使用框架。如果我们愿意，我们也可以相当容易地编写自己的 Redux 实现。\n\n话虽如此，Redux（以及[基于它的\
    \ Flux 架构的其他实现](https://github.com/facebookarchive/flux)）经常因需要大量样板代码且使用起来有点笨重而受到批评。冒着无意双关的风险，我们可以利用\
    \ TypeScript 不仅减少所需的样板代码量，还使使用 Reducer 的整体体验更加愉快。\n\n#### 跟随本教程\n\n欢迎您在自己的环境中跟随本教程。我还创建了[一个\
    \ GitHub 仓库](https://github.com/stevekinney/sitepoint-reducers)，您可以克隆它，以及[一个 CodeSandbox\
    \ 演示](https://codesandbox.io/p/sandbox/typescript-redux-example-sitepoint-hjkzkg?file=%2Findex.html%3A1%2C1)，您可以使用它来跟随。\n\
    \n## Reducer 基础\n\n**Reducer**在其最基本的层面上，只是一个接受两个参数的函数：当前状态和一个表示已发生的某种操作的对象。Reducer\
    \ 根据该操作返回新状态。\n\n![显示 Reducer 工作原理的图表](img/reducer.jpg)\n\n以下代码是普通的 JavaScript，但通过向`state`和`action`添加`any`类型，可以轻松转换为\
    \ TypeScript：\n\n```\nexport const incrementAction = { type: 'Increment' };\n\
    export const decrementAction = { type: 'Decrement' };\n\nexport const counterReducer\
    \ = (state, action) => {\n  if (action.type === 'Increment') {\n    return { count:\
    \ state.count + 1 };\n  }\n\n  if (action.type === 'Decrement') {\n    return\
    \ { count: state.count - 1 };\n  }\n\n  return state;\n};\n\nlet state = { count:\
    \ 1 };\n\nstate = counterReducer(state, incrementAction);\nstate = counterReducer(state,\
    \ incrementAction);\nstate = counterReducer(state, decrementAction);\n\nconsole.log(state);\
    \ // Logs: { count: 1 }\n```\n\n#### 仓库代码\n\n您可以在[本教程的 GitHub 仓库](https://github.com/stevekinney/sitepoint-reducers/blob/main/src/01-basic-example.ts)中找到上述代码（`01-basic-example`）。\n\
    \n让我们回顾一下上面代码示例中发生的事情：\n\n*   我们传入当前状态和一个操作。\n*   如果操作的`type`属性为`\"Increment\"\
    `，我们增加`state`上的`count`属性。\n*   如果操作的`type`属性为`\"Decrement\"`，我们减少`state`上的`count`属性。\n\
    *   如果以上两点都不成立，我们什么都不做，返回原始状态。\n"
- fmt: "Redux requires an action to be an object with a `type` property, as shown\
    \ in the example above. React isn’t as strict. An action can be anything—even\
    \ a primitive value like a number. For example, this is a valid reducer when using\
    \ `useReducer`:\n\n```javascript\nconst counterReducer = (state = 0, value = 1)\
    \ => state + value;\n```\n\nIn fact, if you’ve used `useState` in React before,\
    \ you’ve really used `useReducer`. `useState` is simply an abstraction of `useReducer`.\
    \ For our purposes, we’ll stick to a model closer to Redux, where actions are\
    \ objects with a `type` property, since that pattern will work almost universally.\n\
    \nThe `useReducer` hook of Redux and React adds some extra functionality around\
    \ emitting changes and telling React to update the state of a component accordingly—as\
    \ opposed to repeatedly setting a variable, as shown above—but the basic principles\
    \ are the same regardless of what library we’re using.\n\n## Adding Types to Our\
    \ Reducer\n\nAdding TypeScript will protect us from some of the more obvious mistakes—by\
    \ making sure that we both pass in the correct arguments and return the expected\
    \ result. Both of these situations can be a bit tricky to triage in our applications,\
    \ because they might not happen until *after* the user takes an action—like clicking\
    \ a button in the UI. Let’s quickly add some types to our reducer:\n\n```typescript\n\
    type CounterState = { count: number };\ntype CounterAction = { type: string };\n\
    \nexport const incrementAction = { type: 'Increment' };\nexport const decrementAction\
    \ = { type: 'Decrement' };\n\nexport const counterReducer = (\n  state: CounterState,\n\
    \  action: CounterAction,\n): CounterState => {\n  if (action.type === 'Increment')\
    \ {\n    return { count: state.count + 1 };\n  }\n\n  if (action.type === 'Decrement')\
    \ {\n    return { count: state.count - 1 };\n  }\n\n  return state;\n};\n```\n\
    \n### Repo Code\n\nYou can find the code above (`02-reducer-with-types`) in [the\
    \ GitHub repo for this tutorial](https://github.com/stevekinney/sitepoint-reducers/blob/main/src/02-reducer-with-types.ts).\n\
    \nLet’s say that we forget to return `state` when none of the actions match any\
    \ of our conditionals. TypeScript has analyzed our code and has been to told to\
    \ expect that `counterReducer` will always return some kind of `CounterState`.\
    \ If there’s even so much as a possibility that our code won’t behave as expected,\
    \ it will refuse to compile. In this case, TypeScript has seen that there’s a\
    \ mismatch between what we expect our code to do and what it actually does.\n\n\
    ![Missing return value](Images/missing-return-value.png)\n\nWe’ll also get the\
    \ other protections we’ve come to expect from TypeScript, such as making sure\
    \ we pass in the correct arguments and only access properties available on those\
    \ objects.\n\nBut there’s a more insidious (and arguably more common) edge case\
    \ that comes up when working with reducers. In fact, it’s one that I encountered\
    \ when I was writing tests for the initial example at the beginning of this tutorial.\
    \ What happens if we misspell the action type?\n\n```typescript\nlet state: CounterState\
    \ = { count: 0 };\n\nstate = counterReducer(state, { type: 'increment' });\nstate\
    \ = counterReducer(state, { type: 'INCREMENT' });\nstate = counterReducer(state,\
    \ { type: 'Increement' });\n\nconsole.log(state); // Logs: { count: 0 }\n```\n\
    \nThis the worst kind of bug, because it doesn’t cause an error. It just silently\
    \ doesn’t do what we expect. One common solution is to store the action type names\
    \ in constants:\n\n```typescript\nexport const INCREMENT = 'Increment';\nexport\
    \ const DECREMENT = 'Decrement';\n```\n\nThis is where the typical boilerplate\
    \ begins. Since JavaScript can’t protect us from accidentally using a string that\
    \ doesn’t match any of the conditionals in our reducer, we assign these strings\
    \ to constants. Misspelling a constant or variable name will prevent our code\
    \ from compiling and make it obvious that we have an issue.\n\nLuckily, when we’re\
    \ using TypeScript, we can avoid this kind of boilerplate altogether.\n\n## Adding\
    \ Payloads to Actions\n\nIt’s common for actions to contain additional information\
    \ about what happened. For example, a user might type a query into a search field\
    \ and click **Submit**. We would want to know what they searched for in addition\
    \ to knowing they clicked the **Submit** button.\n\nThere are no hard and fast\
    \ rules for how to structure an action—other than Redux’s insistence that we include\
    \ a `type` property. But it’s a good practice to follow some kind of standard\
    \ like [Flux Standard Action](https://github.com/redux-utilities/flux-standard-action),\
    \ which advises us put to any additional information needed in a `payload` property.\n\
    \nFollowing this convention, our `CounterAction` might look something like this:\n\
    \n```typescript\ntype CounterAction = {\n  type: string;\n  payload: {\n    amount:\
    \ number;\n  };\n};\n\nlet state = counterReducer(\n  { count: 1 },\n  { type:\
    \ 'Increment', payload: { amount: 1 } },\n);\n```\n\nThis is getting a bit complicated\
    \ to type out. A common solution is to create a set of helper functions called\
    \ *action creators*. **Action creators** are simply functions that format our\
    \ actions for us. If we wanted to expand `counterReducer` to support the ability\
    \ to increment or decrement by certain amounts, we might create the following\
    \ action creators:\n\n```typescript\nexport const increment = (amount: number\
    \ = 1): CounterAction => ({\n  type: INCREMENT,\n  payload: { amount },\n});\n\
    \nexport const decrement = (amount: number = 1): CounterAction => ({\n  type:\
    \ DECREMENT,\n  payload: { amount },\n});\n```\n\n### Repo Code\n\nYou can find\
    \ the code above (`03-action-creators`) in [the GitHub repo for this tutorial](https://github.com/stevekinney/sitepoint-reducers/blob/main/src/03-action-creators.ts).\n\
    \nWe’re also going to need to update our reducer to support this new structure\
    \ for our actions. This also feels like a good opportunity to look at the example\
    \ holistically:\n\n```typescript\nexport const INCREMENT = 'Increment';\nexport\
    \ const DECREMENT = 'Decrement';\n\ntype CounterState = { count: number };\n\n\
    type CounterAction = {\n  type: string;\n  payload: {\n    amount: number;\n \
    \ };\n};\n\ntype CounterReducer = (\n  state: CounterState,\n  action: CounterAction,\n\
    ) => CounterState;\n\nexport const increment = (amount: number = 1): CounterAction\
    \ => ({\n  type: INCREMENT,\n  payload: { amount },\n});\n\nexport const decrement\
    \ = (amount: number = 1): CounterAction => ({\n  type: DECREMENT,\n  payload:\
    \ { amount },\n});\n\nexport const counterReducer: CounterReducer = (state, action)\
    \ => {\n  const { count } = state;\n\n  if (action.type === 'Increment') {\n \
    \   return { count: count + action.payload.amount };\n  }\n\n  if (action.type\
    \ === 'Decrement') {\n    return { count: count - action.payload.amount };\n \
    \ }\n\n  return state;\n};\n\nlet state: CounterState = { count: 0 };\n```\n\n\
    ## Using Unions\n\nBut wait, there’s more! We used some of the traditional patterns\
    \ to get around the issue where our reducer ignores actions that it wasn’t explicitly\
    \ told to look for, but what if we could use TypeScript to prevent that from happening\
    \ in the first place?\n\nLet’s assume that, in addition to being able to increment\
    \ and decrement the counter, we can also reset it back to zero. This gives us\
    \ three types of actions:\n\n*   `Increment`\n\n*   `Decrement`\n\n*   `Reset`\n\
    \nWe’ll start with `Increment` and `Decrement` and address `Reset` later.\n\n\
    In the last section, we added the ability to increment or decrement by a certain\
    \ amount. Reseting the counter will be a bit unusual — in that we can only ever\
    \ reset it back to zero. (Sure, I could have just created a `Set` action that\
    \ took a value, but I’m setting myself up to make a more important point in a\
    \ bit.)\n\nLet’s start with our two known quantities: `Increment` and `Decrement`.\
    \ Instead of saying that the `type` property on an action can be any string, we\
    \ can get a bit more specific."
