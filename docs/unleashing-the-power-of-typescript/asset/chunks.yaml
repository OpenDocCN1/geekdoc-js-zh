    \ the code that we’ll be working with can be found in [this GitHub repository](https://github.com/stevekinney/sitepoint-context).\
    \ I’ll start on the `main` branch and then make additional branches at each milestone.\n\
    \n## The Fundamental Problem\n\nThe core issue that’s going to be a thorn in our\
    \ side is not necessarily a TypeScript problem. It’s a React problem:\n\n*   When\
    \ we call `React.createContext`, TypeScript will want to know what kind of value\
    \ we can expect.\n\n*   But we don’t have that value yet, because we have to wait\
    \ for the `Provider` component to mount in order to use `useState`.\n\n*   TypeScript\
    \ will take issue with the fact that we’re passing it something that isn’t what\
    \ it expects.\n\n*   If we say that it can be a color *or* `undefined`, TypeScript\
    \ will never be sure which one it’s working with.\n\nWe’ll look at a few approaches—such\
    \ as using `any` or `undefined`—which will work, but which will have some trade-offs—before\
    \ we land on a better (though more involved) solution.\n\n## A Rejected Solution:\
    \ Use `any`\n\n```\n// We don't have access to `hexColor` outside of `ColorProvider`.\n\
    // So we'll use `null` for now.\nexport const ColorContext = createContext<any>(null);\n\
    \nexport const ColorProvider = ({ children }: PropsWithChildren) => {\n  const\
    \ [hexColor, setHexColor] = useState('#e56e24');\n\n  return (\n    <ColorContext.Provider\
    \ value={{ hexColor, setHexColor }}>\n      {children}\n    </ColorContext.Provider>\n\
    \  );\n};\n```"
  trans: "\n```\nconst firstNode: LinkedListNode<string>;\nconst secondNode: LinkedListNode<string>;\n\
    ```\n\n这赋予了我们泛型的所有灵活性，而无需编写任何额外的样板代码。\n\n## 更进一步\n\n既然我们已经有了 `createLinkedListNode`，我们可以创建一个名为\
    \ `addNextNode` 的额外实用函数。该函数应执行以下操作：\n\n*   它应接受一个现有的 `LinkedListNode` 作为第一个参数。\n\
    \n*   根据该 `LinkedListNode` 的 `value` 类型，第二个参数应为相同类型的值。\n\n*   它应基于第二个参数创建一个新的\
    \ `LinkedListNode`。\n\n*   它应将第一个 `LinkedListNode` 的 `next` 属性设置为新的 `LinkedListNode`。\n\
    \n*   它应返回新创建的节点。\n\n基本上，我们希望让以下两个测试通过：\n\n```\nit('should create a linked list\
    \ node', () => {\n  let node = createLinkedListNode('first');\n  expect(node).toEqual({\
    \ value: 'first' });\n});\n\nit('should add a linked list node', () => {\n  let\
    \ firstNode = createLinkedListNode('first');\n  let secondNode = addLinkedListNode(firstNode,\
    \ 'second');\n\n  expect(firstNode).toEqual({ value: 'first', next: { value: 'second'\
    \ } });\n  expect(secondNode).toEqual({ value: 'second' });\n});\n```\n\n这里的关键点是\
    \ `T` 的值应始终保持一致。我们可以用几种方式编写这个函数，这里不讨论每种方式的优劣。以下是一种可能的实现：\n\n```\nconst createLinkedListNode\
    \ = <T>(value: T): LinkedListNode<T> => {\n  return { value };\n};\n\nconst addLinkedListNode\
    \ = <T>(\n  node: LinkedListNode<T>,\n  value: T,\n): LinkedListNode<T> => {\n\
    \  node.next = createLinkedListNode(value);\n  return node.next;\n};\n```\n\n\
    #### 仓库代码\n\n你可以在[本教程的 GitHub 仓库](https://github.com/stevekinney/sitepoint-generics/blob/main/src/05-linking-nodes.ts)中找到上述代码（`05-linking-nodes`）。\n\
    \n## 在类中使用泛型\n\n我们也可以在类中使用泛型。这种情况下一个有趣的特性是，`T` 的值可以在整个类中使用。一旦设置，它将在所有方法中强制执行我们的类型，并且类的每个单独实例都可以有自己的\
    \ `T` 值。以下是一个示例：\n\n```\nexport class LinkedListNode<T> {\n  value: T;\n  next?:\
    \ LinkedListNode<T>;\n\n  constructor(value: T) {\n    this.value = value;\n \
    \ }\n\n  add(value: T): LinkedListNode<T> {\n    this.next = new LinkedListNode(value);\n\
    \    return this.next;\n  }\n}\n```\n\n#### 仓库代码\n\n你可以在[本教程的 GitHub 仓库](https://github.com/stevekinney/sitepoint-generics/blob/main/src/06-with-classes.ts)中找到上述代码（`06-with-classes`）。\n\
    \n现在我们可以创建多个实例，其中 `T` 对于该特定实例被正确强制执行：\n\n```\nconst firstNode = new LinkedListNode('first');\n\
    const secondNode = firstNode.add('second');\nconst thirdNode = new LinkedListNode(42);\n\
    const fourthNode = thirdNode.add(17);\n```\n\n你可以在[此处](https://github.com/stevekinney/sitepoint-generics/blob/main/src/06-with-classes.test.ts)找到的单元测试中验证这一点。\n\
    \n## 结论\n\n我倾向于使用类型，但我们同样可以轻松地在接口中使用泛型：\n\n```\ninterface LinkedListNode<T> {\n\
    \  value: T;\n  next?: LinkedListNode<T>;\n}\n```\n\n泛型是 TypeScript 中一个强大的工具，它允许我们创建可重用的代码组件，这些组件可以处理多种类型，而不仅仅是一种。它们提供了一种构建灵活接口的方式，使我们能够稍后定义类型。泛型可以与对象、函数和类一起使用。它们可以扩展或限制为特定类型，TypeScript\
    \ 甚至可以在某些情况下为我们推断类型。\n\n虽然一开始可能看起来令人生畏，但一旦理解了，泛型就相当简单。稍加练习，你就能很快地使用泛型编写出更高效、更有效的代码。\n\
    \n# 第 3 章：在 TypeScript 中使用 React Context API 的风险与陷阱\n\n在任何大型 React 应用程序中使用 TypeScript，都能提供一种值得付出额外努力的安全性，这比使用\
    \ JavaScript 更好。TypeScript 能够梳理我们所有的组件，并确认我们传递了每个组件所需的所有 props，同时确保它们确实是我们假设的类型，而不是像\
    \ `undefined` 这样危险的东西。但在某些情况下，即使这种权衡也受到了质疑——特别是在使用 Context API 时。让我们看看如何应对在 TypeScript\
    \ 中使用 `createContext` 和 `useContext` 的一些挑战。\n\n我假设你熟悉 Context API，但还是快速总结一下。[React\
    \ 中的 Context API 是一个内置的状态管理工具](https://react.dev/learn/passing-data-deeply-with-context)，它允许在组件树中轻松共享数据。它使我们能够避免\
    \ **[prop drilling](https://www.sitepoint.com/replace-redux-react-hooks-context-api/)**，即通过中间组件从上到下传递数据的过程。\n\
    \n使用 Context API，我们创建一个具有两个属性的 `Context` 对象：一个 `Provider` 组件——用于包装我们应用程序中需要访问数据的组件树部分——以及一个用于读取该数据的\
    \ `Consumer` 组件。\n\n如今，我们通常不直接使用 `Consumer`，而是使用 `useContext` hook 来访问上下文的值，无论每个组件在组件层次结构中的级别如何。`useContext`\
    \ hook 比尝试在渲染属性中从 `Consumer` 访问值要干净得多。这使得组件之间的状态和函数共享更加方便和高效，尤其是在较大的应用程序中。事实上，[React\
    \ 文档](https://react.dev/reference/react/createContext#returns)甚至[提到](https://react.dev/reference/react/createContext#returns)，`Consumer`\
    \ 是“一种替代且很少使用的方式来读取上下文值”。\n\n![我们将要处理的颜色选择器应用程序的截图](img/colors-screenshot.png)\n\
    \n我们将处理一个简单的颜色选择器应用程序（如上图所示），它使用 Context API 在整个组件层次结构中共享获取和设置颜色的能力。\n\n#### 跟随本教程\n\
    \n我们将要处理的所有代码都可以在 [GitHub 仓库](https://github.com/stevekinney/sitepoint-context)中找到。我将从\
    \ `main` 分支开始，然后在每个里程碑处创建额外的分支。\n\n## 根本问题\n\n将困扰我们的核心问题不一定是 TypeScript 的问题。这是一个\
    \ React 问题：\n\n*   当我们调用 `React.createContext` 时，TypeScript 会想知道我们可以期望什么样的值。\n\
    \n*   但我们还没有那个值，因为我们必须等待 `Provider` 组件挂载才能使用 `useState`。\n\n*   TypeScript 会对我们传递给它的内容不是它所期望的这一事实提出异议。\n\
    \n*   如果我们说它可以是颜色*或* `undefined`，TypeScript 将永远无法确定它正在处理哪一个。\n\n我们将探讨几种方法——例如使用\
    \ `any` 或 `undefined`——这些方法会有效，但会有一些权衡——然后我们将采用一个更好（尽管更复杂）的解决方案。\n\n## 一个被拒绝的解决方案：使用\
    \ `any`\n\n```\n// We don't have access to `hexColor` outside of `ColorProvider`.\n\
    // So we'll use `null` for now.\nexport const ColorContext = createContext<any>(null);\n\
    \nexport const ColorProvider = ({ children }: PropsWithChildren) => {\n  const\
    \ [hexColor, setHexColor] = useState('#e56e24');\n\n  return (\n    <ColorContext.Provider\
    \ value={{ hexColor, setHexColor }}>\n      {children}\n    </ColorContext.Provider>\n\
    \  );\n};\n```\n"
- fmt: "In the code above, we get glimpse of the easier possible solution. We can\
    \ just completely opt out of TypeScript by using `any`. Not only will we lose\
    \ the type safety that comes with that, but we’ll also lose all of the benefits\
    \ of autocomplete in our code. This works, but we can do better.\n\n## A Feasible\
    \ Solution: Use a Type Assertion\n\nWe don’t have our initial hex color yet, but\
    \ we know that we will eventually, right? In this case, we *could* lie to TypeScript\
    \ and try to convince it that `null` is actually a hex color.\n\nFirst, we’ll\
    \ need to figure out what the eventual type of the `value` prop is going to be.\
    \ The easiest way to do this is to hover over `setHexColor` and look at the type.\n\
    \n![Hovering over a value will let us see the type](Images/set-hex-color.png)\n\
    \nWe know that we’re passing `ColorContext.Provider` an object with `hexColor`\
    \ and `setHexColor`. Let’s break that out into its own type:\n\n```\ntype ColorState\
    \ = {\n  hexColor: string;\n  setHexColor: Dispatch<SetStateAction<string>>;\n\
    };\n```\n\nNow we can let TypeScript know what it can eventually expect to receive,\
    \ even if we don’t have the value just yet:\n\n```\nexport const ColorContext\
    \ = createContext<ColorState>(null as any);\n```\n\nIf we hover over `ColorContext`,\
    \ we’ll see the `const ColorContext: React.Context<ColorState>`. If we visit any\
    \ of the components that use this context, we’ll see that it has the correct type\
    \ annotations, as pictured below.\n\n![setHexColor now has the correct type assertion](Images/correct-type-assertion.png)\n\
    \nIf we want to feel better about our deceit, we can at least tell it a lie that’s\
    \ exactly what it should come to expect eventually:\n\n```\nexport const ColorContext\
    \ = createContext<ColorState>(\n  null as unknown as ColorState,\n);\n```\n\n\
    If we don’t have a guilty conscience, we might also consider doing this so that\
    \ ESLint doesn’t get angry with us for explicitly using `any` in our code.\n\n\
    #### Repo Code\n\nYou can find the code above (`context.tsx`) in [the GitHub repo\
    \ for this tutorial, in the `type-assertion` branch](https://github.com/stevekinney/sitepoint-context/blob/type-assertion/src/context.tsx).\n\
    \n## A Compromised Solution: Tell the Truth\n\nAnother option is to tell the truth.\
    \ The value of the context can either be `ColorState` or `undefined`:\n\n```\n\
    export const ColorContext = createContext<ColorState | null>(null);\n```\n\nThis\
    \ feels better, but it will cause a different set of problems:\n\n```\nErrors\
    \  Files\n  1  src/components/color-change-swatch.tsx:13\n  2  src/components/color-picker/color-select.tsx:11\n\
    \  1  src/components/color-picker/color-swatch.tsx:6\n  1  src/components/color-properties/to-cmyk.tsx:8\n\
    \  1  src/components/color-properties/to-hsl.tsx:8\n  1  src/components/color-properties/to-hsv.tsx:8\n\
    \  1  src/components/color-properties/to-rgb.tsx:8\n  1  src/components/related-colors/index.tsx:11\n\
    ```\n\nThe issue is now that TypeScript isn’t sure if we’re working with `ColorState`\
    \ or `undefined`. And now we need to check every time we use it.\n\n![ColorState\
    \ can now be undefined](Images/or-undefined.png)\n\nSo it’s now on us to check\
    \ to see if it’s defined or not every time we use it. Here’s one example from\
    \ the `ColorChangeSwatch` component:\n\n```\nconst ColorChangeSwatch = ({ hexColor,\
    \ className }: ColorChangeSwatchProps) => {\n  // \U0001F440 Store the context\
    \ in a variable.\n  const context = useContext(ColorContext);\n\n  return (\n\
    \    <Button\n      className={clsx(\n        'border-2 border-slate-900 transition-shadow\
    \ duration-200 ease-in \n        hover:shadow-xl',\n        className,\n     \
    \ )}\n      style={{ backgroundColor: hexColor }}\n      onClick={() => {\n  \
    \      // \U0001F440 Conditionally use any property on it.\n        context?.setHexColor(hexColor);\n\
    \      }}\n    >\n      {hexColor}\n    </Button>\n  );\n};\n```\n\n#### Repo\
    \ Code\n\nYou can find the code above (`color-change-swatch.tsx`) in [the GitHub\
    \ repo for this tutorial](https://github.com/stevekinney/sitepoint-context/blob/main/src/components/color-change-swatch.tsx).\n\
    \nI’m not going to make you endure the chaos that this has caused in our application.\
    \ But I will invite you to look at it [here](https://github.com/stevekinney/sitepoint-context/commit/a0343931a92dd53c1672046f855dbc8e4d0da612)\
    \ if you’re interested. It involves changing ten files, and this isn’t even that\
    \ big an application. Needless to say, being honest with TypeScript probably isn’t\
    \ worth it in this case.\n\n## A Reasonable Solution: Create an Abstraction\n\n\
    Let’s say we don’t want to lie to TypeScript and we also don’t want to endure\
    \ what I just went through creating that example for you. It *is* possible for\
    \ us to have our cake and eat it too. It’s just going to take a little work.\n\
    \nInstead of checking whether or not the context is defined every single time\
    \ we use it, we *could* create our own utilities that will do this for us and\
    \ then never worry about it again. This is going to involve a little bit of upfront\
    \ work, but—unlike in the previous solution—once we have our abstractions in place,\
    \ we’ll never have to think about them again.\n\nI’m going to create a new branch\
    \ off of `main` called [create-context](https://github.com/stevekinney/sitepoint-context/tree/create-context).\n\
    \n### Creating Our Own `createContext`\n\nLet’s start by making a new file called\
    \ `src/create-context.tsx`. We’ll start with a simple function so that TypeScript\
    \ doesn’t get mad at us for having an empty file:\n\n```\nexport const createContext\
    \ = () => {};\n```\n\nNext, we’re going to use React’s `createContext` to create\
    \ a `Context` object that we’ll build on top of:\n\n```\nimport React from 'react';\n\
    \nexport const createContext = () => {\n  const Context = React.createContext(null);\n\
    };\n```\n\nI’m using `React.createContext` as opposed to `import { createContext\
    \ } from 'react';` so that we don’t have any naming collisions. The name of our\
    \ function isn’t important, but I like consistency.\n\nNow we’ll do something\
    \ similar to what we did in the previous example: we’ll acknowledge that we might\
    \ not know what the initial value is. We’ll also use a generic so that this function\
    \ is reusable for other contexts:\n\n```\nimport React from 'react';\n\nexport\
    \ const createContext = <T extends object>() => {\n  const Context = React.createContext<T\
    \ | null>(null);\n};\n```\n\nI know that we’re going to want to pass both `hexColor`\
    \ and `setHexColor`, so I’m choosing to constrain `T` to some kind of object.\
    \ If generics are bewildering to you, you can just choose to use the `ColorState`\
    \ that we created earlier. That might look something like this:\n\n```\n// \U0001F6A8\
    \ Note: We won't be using this code. It's just an alternative to code above.\n\
    export const createContext = () => {\n  const Context = React.createContext<ColorState\
    \ | null>(null);\n};\n```\n\nNext, we’re going to create our own take on the `useContext`\
    \ hook. This will have access to the `Context` that we just created in [its closure\
    \ scope](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Closures). The\
    \ new `useContext` will check to make sure that context exists and that it’s not\
    \ `null`. If it *is* `null`, an error is thrown. TypeScript is smart enough to\
    \ understand that, if our `Context` can only be either `T` or `null` and it’s\
    \ not `null`, it must be `T`. Going forward, we’ll *only* be using our custom\
    \ `useContext` hook:\n\n```\nimport React from 'react';\n\nexport const createContext\
    \ = <T extends object>() => {\n  const Context = React.createContext<T | null>(null);\n\
    \n  const useContext = () => {\n    const ctx = React.useContext(Context);\n\n\
    \    if (ctx === null) {\n      throw new Error('useContext must be inside a Provider\
    \ with a value.');\n    }\n\n    return ctx;\n  };\n\n  return [useContext, Context.Provider]\
    \ as const;\n};\n```\n\nTo review:\n\n*   We know that the value of the context\
    \ can either be `T` or `null`.\n\n*   So, pull the value out of `React.useContext`\
    \ and take a look at it.\n\n*   Throw an error up if `ctx` is `null`. This means\
    \ that we won’t return anything in the case that `ctx` is `null`."
