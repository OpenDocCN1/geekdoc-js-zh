  trans: "\nRedux 要求 action 必须是一个包含 `type` 属性的对象，如上例所示。React 则没有那么严格。action 可以是任何东西——甚至是一个原始值，比如数字。例如，在使用\
    \ `useReducer` 时，这是一个有效的 reducer：\n\n```javascript\nconst counterReducer = (state\
    \ = 0, value = 1) => state + value;\n```\n\n事实上，如果你之前在 React 中使用过 `useState`，那么你实际上已经使用了\
    \ `useReducer`。`useState` 只是 `useReducer` 的一种抽象。为了我们的目的，我们将坚持使用更接近 Redux 的模型，其中\
    \ action 是带有 `type` 属性的对象，因为这种模式几乎可以普遍适用。\n\nRedux 和 React 的 `useReducer` 钩子在触发更改并通知\
    \ React 相应更新组件状态方面增加了一些额外功能——这与上面所示的反复设置变量不同——但无论我们使用什么库，其基本原理都是相同的。\n\n## 为我们的\
    \ Reducer 添加类型\n\n添加 TypeScript 将保护我们免受一些更明显的错误——通过确保我们既传入正确的参数，又返回预期的结果。这两种情况在我们的应用程序中可能有点棘手，因为它们可能直到用户采取操作（比如点击\
    \ UI 中的按钮）*之后*才会发生。让我们快速为我们的 reducer 添加一些类型：\n\n```typescript\ntype CounterState\
    \ = { count: number };\ntype CounterAction = { type: string };\n\nexport const\
    \ incrementAction = { type: 'Increment' };\nexport const decrementAction = { type:\
    \ 'Decrement' };\n\nexport const counterReducer = (\n  state: CounterState,\n\
    \  action: CounterAction,\n): CounterState => {\n  if (action.type === 'Increment')\
    \ {\n    return { count: state.count + 1 };\n  }\n\n  if (action.type === 'Decrement')\
    \ {\n    return { count: state.count - 1 };\n  }\n\n  return state;\n};\n```\n\
    \n### 仓库代码\n\n你可以在[本教程的 GitHub 仓库](https://github.com/stevekinney/sitepoint-reducers/blob/main/src/02-reducer-with-types.ts)中找到上述代码（`02-reducer-with-types`）。\n\
    \n假设我们忘记在没有任何 action 匹配我们的条件时返回 `state`。TypeScript 已经分析了我们的代码，并被告知期望 `counterReducer`\
    \ 总是返回某种 `CounterState`。即使我们的代码有可能无法按预期运行，它也会拒绝编译。在这种情况下，TypeScript 已经看到我们期望代码执行的操作与实际执行的操作之间存在不匹配。\n\
    \n![缺少返回值](img/missing-return-value.png)\n\n我们还将获得我们期望从 TypeScript 获得的其他保护，例如确保我们传入正确的参数，并且只访问这些对象上可用的属性。\n\
    \n但在使用 reducer 时，会出现一个更隐蔽（且可以说更常见）的边缘情况。事实上，这是我在为本教程开头的初始示例编写测试时遇到的一个问题。如果我们拼错了\
    \ action 类型会怎样？\n\n```typescript\nlet state: CounterState = { count: 0 };\n\n\
    state = counterReducer(state, { type: 'increment' });\nstate = counterReducer(state,\
    \ { type: 'INCREMENT' });\nstate = counterReducer(state, { type: 'Increement'\
    \ });\n\nconsole.log(state); // 输出：{ count: 0 }\n```\n\n这是最糟糕的一种 bug，因为它不会导致错误。它只是默默地不执行我们期望的操作。一个常见的解决方案是将\
    \ action 类型名称存储在常量中：\n\n```typescript\nexport const INCREMENT = 'Increment';\n\
    export const DECREMENT = 'Decrement';\n```\n\n这就是典型样板代码的开始。由于 JavaScript 无法保护我们免于意外使用与\
    \ reducer 中任何条件都不匹配的字符串，我们将这些字符串分配给常量。拼写错误的常量或变量名将阻止我们的代码编译，并使我们明显发现问题所在。\n\n\
    幸运的是，当我们使用 TypeScript 时，我们可以完全避免这种样板代码。\n\n## 为 Action 添加负载\n\naction 通常包含有关发生了什么的附加信息。例如，用户可能在搜索字段中输入查询并点击\
    \ **Submit**。除了知道他们点击了 **Submit** 按钮外，我们还想知道他们搜索了什么。\n\n关于如何构造 action 没有硬性规定——除了\
    \ Redux 坚持我们包含一个 `type` 属性。但遵循某种标准（如 [Flux Standard Action](https://github.com/redux-utilities/flux-standard-action)）是一个好习惯，它建议我们将任何所需的附加信息放在\
    \ `payload` 属性中。\n\n遵循这个约定，我们的 `CounterAction` 可能看起来像这样：\n\n```typescript\ntype\
    \ CounterAction = {\n  type: string;\n  payload: {\n    amount: number;\n  };\n\
    };\n\nlet state = counterReducer(\n  { count: 1 },\n  { type: 'Increment', payload:\
    \ { amount: 1 } },\n);\n```\n\n这写起来有点复杂。一个常见的解决方案是创建一组称为 *action creators* 的辅助函数。**Action\
    \ creators** 只是为我们格式化 action 的函数。如果我们想扩展 `counterReducer` 以支持按特定数量递增或递减的能力，我们可能会创建以下\
    \ action creators：\n\n```typescript\nexport const increment = (amount: number\
    \ = 1): CounterAction => ({\n  type: INCREMENT,\n  payload: { amount },\n});\n\
    \nexport const decrement = (amount: number = 1): CounterAction => ({\n  type:\
    \ DECREMENT,\n  payload: { amount },\n});\n```\n\n### 仓库代码\n\n你可以在[本教程的 GitHub\
    \ 仓库](https://github.com/stevekinney/sitepoint-reducers/blob/main/src/03-action-creators.ts)中找到上述代码（`03-action-creators`）。\n\
    \n我们还需要更新我们的 reducer 以支持这种新的 action 结构。这感觉也是一个整体审视示例的好机会：\n\n```typescript\nexport\
    \ const INCREMENT = 'Increment';\nexport const DECREMENT = 'Decrement';\n\ntype\
    \ CounterState = { count: number };\n\ntype CounterAction = {\n  type: string;\n\
    \  payload: {\n    amount: number;\n  };\n};\n\ntype CounterReducer = (\n  state:\
    \ CounterState,\n  action: CounterAction,\n) => CounterState;\n\nexport const\
    \ increment = (amount: number = 1): CounterAction => ({\n  type: INCREMENT,\n\
    \  payload: { amount },\n});\n\nexport const decrement = (amount: number = 1):\
    \ CounterAction => ({\n  type: DECREMENT,\n  payload: { amount },\n});\n\nexport\
    \ const counterReducer: CounterReducer = (state, action) => {\n  const { count\
    \ } = state;\n\n  if (action.type === 'Increment') {\n    return { count: count\
    \ + action.payload.amount };\n  }\n\n  if (action.type === 'Decrement') {\n  \
    \  return { count: count - action.payload.amount };\n  }\n\n  return state;\n\
    };\n\nlet state: CounterState = { count: 0 };\n```\n\n## 使用联合类型\n\n但是等等，还有更多！我们使用了一些传统模式来解决\
    \ reducer 忽略未明确告知其查找的 action 的问题，但如果我们能使用 TypeScript 从一开始就防止这种情况发生呢？\n\n让我们假设，除了能够递增和递减计数器外，我们还可以将其重置为零。这给了我们三种类型的\
    \ action：\n\n*   `Increment`\n\n*   `Decrement`\n\n*   `Reset`\n\n我们将从 `Increment`\
    \ 和 `Decrement` 开始，稍后再处理 `Reset`。\n\n在上一节中，我们添加了按特定数量递增或递减的能力。重置计数器会有点不寻常——因为我们只能将其重置为零。（当然，我本可以创建一个接受值的\
    \ `Set` action，但我正在为稍后提出一个更重要的观点做铺垫。）\n\n让我们从我们已知的两个量开始：`Increment` 和 `Decrement`。我们不必说\
    \ action 上的 `type` 属性可以是任何字符串，我们可以更具体一些。\n"
- fmt: "In `04-unions` [in our GitHub repo](https://github.com/stevekinney/sitepoint-reducers/blob/main/src/04-unions.ts),\
    \ I use the union of `'Increment' | 'Decrement'`. We’re now telling TypeScript\
    \ that the `type` property on a `CounterAction` isn’t just *any* string, but rather\
    \ that it’s one of exactly two strings:\n\n```typescript\ntype CounterAction =\
    \ {\n  type: 'Increment' | 'Decrement';\n  payload: {\n    amount: number;\n \
    \ };\n};\n```\n\nWe get a number of benefits from this relatively simple change.\
    \ The first and most obvious is that we no longer have to worry about misspelling\
    \ or mistyping an action’s `type`.\n\n![TypeScript catches an invalid type](Images/invalid-type.png)\n\
    \nYou’ll notice that TypeScript not only detects the error, but it’s even smart\
    \ enough to provide a suggestion that can help us quickly address the issue.\n\
    \nWe also get autocomplete for free whenever TypeScript has enough information\
    \ to determine that we’re working with a `CounterAction`.\n\n![TypeScript aids\
    \ in the autocompletion of action types](Images/autocomplete.png)\n\nIf you look\
    \ carefully, you’ll notice that it’s *only* recommending `Decrement`. That’s because\
    \ we’ve already created a conditional defining what we should do in the event\
    \ that the `type` is `Increment`. TypeScript is able to deduce that, if there\
    \ are only two properties and we’ve dealt with one of them, there’s only one option\
    \ left.\n\nAs promised, we can also now get rid of these two lines of code from\
    \ [`03-action-creators`](https://github.com/stevekinney/sitepoint-reducers/blob/main/src/03-action-creators.ts):\n\
    \n```typescript\n- export const INCREMENT = 'Increment';\n- export const DECREMENT\
    \ = 'Decrement';\n```\n\nWith TypeScript’s help, we can now go back to using regular\
    \ strings and still enjoy all of the benefits of using constants. This might not\
    \ seem like much in this simple example, but if you’ve ever used this pattern\
    \ before, you know that it can get cumbersome to have to import these values in\
    \ each and every file that uses them.\n\n## Removing the Default Case in the Reducer\n\
    \nEarlier on, TypeScript tried to help us by throwing an error when we omitted\
    \ the line with `return state` at the end of the function that served as a fallback\
    \ if none of the conditions above it were hit.\n\nBut now we’ve given TypeScript\
    \ more information about what types of actions it can expect. I prefer to use\
    \ conditionals (which is why I’ve done so throughout this tutorial), but if we\
    \ use a `switch` statement instead, we’ll notice that something interesting happens.\n\
    \n![Unreachable Code](Images/unreachable-code.png)\n\nTypeScript has figured out\
    \ that, since we’re returning from each case of the `switch` statement *and* we’ve\
    \ covered all of the possible cases of `action.type`, there’s no need to return\
    \ the original state in the event that our action slips through, because TypeScript\
    \ can guarantee that will never happen.\n\nThere are a few things to take away\
    \ from this:\n\n*   TypeScript will use the information we provide it to help\
    \ us avoid common mistakes.\n\n*   TypeScript will also use this information to\
    \ enable us to write less protective code.\n\n## Dealing with Different Kinds\
    \ of Actions\n\nEarlier, I hinted that we might add a third type of action: the\
    \ ability to `Reset` the counter back to zero. This action is a lot like the actions\
    \ we saw at the very beginning. It doesn’t need a payload. However, it might be\
    \ tempting to do something like this:\n\n```typescript\ntype CounterAction = {\n\
    \  type: 'Increment' | 'Decrement' | 'Reset';\n  payload: {\n    amount: number;\n\
    \  };\n};\n```\n\nYou’ll notice that TypeScript is again upset that we risk returning\
    \ `undefined` from our reducer. We’ll handle that in a moment. But first, we should\
    \ address the fact that `Reset` doesn’t need a payload.\n\nWe don’t want to have\
    \ to write something like this:\n\n```typescript\nlet state = counterReducer({\
    \ count: 5 }, { type: 'Reset', { payload: { amount: 0 } } });\n```\n\nWe might\
    \ be tempted to make the `payload` optional:\n\n```typescript\ntype CounterAction\
    \ = {\n  type: 'Increment' | 'Decrement' | 'Reset';\n  payload?: {\n    amount:\
    \ number;\n  };\n};\n```\n\nBut now, TypeScript will never be sure if `Increment`\
    \ and `Decrement` are supposed to have a payload. This means that TypeScript will\
    \ insist that we check to see if `payload` exists before we’re allowed to access\
    \ the `amount` property on it. At the same time, TypeScript will still allow us\
    \ to needlessly put a payload on our `Reset` actions. I suppose this isn’t the\
    \ worst thing in the world, but we can do better.\n\n### Using Unions for Action\
    \ Types\n\nIt turns out that we can use a similar solution to the one we used\
    \ with the `type` property on `CounterAction`:\n\n```typescript\ntype CounterAdjustmentAction\
    \ = {\n  type: 'Increment' | 'Decrement';\n  payload: {\n    amount: number;\n\
    \  };\n};\n\ntype CounterResetAction = {\n  type: 'Reset';\n};\n\ntype CounterAction\
    \ = CounterAdjustmentAction | CounterResetAction;\n```\n\nTypeScript is smart\
    \ enough to figure out the following:\n\n*   `CounterAction` is an object.\n\n\
    *   `CounterAction` *always* has a `type` property.\n\n*   The `type` property\
    \ is one of `Increment`, `Decrement`, or `Reset`.\n\n*   If the `type` property\
    \ is `Increment` or `Decrement`, there’s a `payload` property that contains a\
    \ number as the `amount`.\n\n*   If the `type` property is `Reset`, there’s no\
    \ `payload` property.\n\nBy updating the type to include `CounterResetAction`,\
    \ TypeScript has already figured out that we’re no longer providing an exhaustive\
    \ list of cases to `counterReducer`.\n\n![TypeScript notices that we aren’t handing\
    \ Reset actions](Images/missing-reset.png)\n\nWe can update the code:\n\n```typescript\n\
    export const counterReducer: CounterReducer = (state, action) => {\n  const {\
    \ count } = state;\n\n  switch (action.type) {\n    case 'Increment':\n      return\
    \ { count: count + action.payload.amount };\n    case 'Decrement':\n      return\
    \ { count: count - action.payload.amount };\n    case 'Reset':\n      return {\
    \ count: 0 };\n  }\n};\n```\n\n#### Repo Code\n\nYou can find the code above (`05-different-payloads`)\
    \ in [the GitHub repo for this tutorial](https://github.com/stevekinney/sitepoint-reducers/blob/main/src/05-different-payloads.ts).\n\
    \nIf you’ve been following along, you might have noticed a few cool features (albeit\
    \ unsurprising at this point). First, as we added that third case, TypeScript\
    \ was able to infer that we were adding a case for `Reset` and suggested that\
    \ as the only available autocompletion. Secondly, if we tried to reference `action`\
    \ in the `return` statement, we would have noticed that it *only* let us access\
    \ the `type` property because it’s well aware that `CounterResetActions` doesn’t\
    \ have a `payload` property.\n\nOther than clearly defining the type, we didn’t\
    \ have to tell TypeScript much of anything in the code itself. It was able to\
    \ use the information at hand to figure everything out on our behalf.\n\nIf you\
    \ want to see this for yourself, you can create an action creator for resetting\
    \ the counter:\n\n```typescript\nexport const reset = (): CounterAction => ({\
    \ type: 'Reset' });\n```\n\nI chose to use the broader `CounterAction` in this\
    \ case. But you’ll notice that, even if you *try* to add a `payload` to it, TypeScript\
    \ has already figured out that it’s not an option. But if you change the `type`\
    \ to `\"Increment\"` for a moment, you’re suddenly permitted to add the property.\n\
    \nIf we update the return type on the function to `CounterResetAction`, we’ll\
    \ see that we only have one option for the type—`\"Reset\"`—and that payloads\
    \ are forbidden:\n\n```typescript\nexport const reset = (): CounterResetAction\
    \ => ({ type: 'Reset' });\n```\n\n## Using Our Reducer in a React Component\n\n\
    So far, we’ve talked a lot about the reducer pattern outside of any framework.\
    \ Let’s pull our `counterReducer` into React and see how it works. We’ll start\
    \ with this simple component:"
