    \ `ComponentProps` to be the same as … `as`?\n\nWe *could* try something like\
    \ this:\n\n```\nimport { ComponentProps, ElementType } from 'react';\n\ntype BoxProps<E\
    \ extends ElementType> = Omit<ComponentProps<E>, 'as'> & {\n  as?: E;\n};\n\n\
    const Box = <E extends ElementType = 'div'>({ as, ...props }: BoxProps<E>) =>\
    \ {\n  const TagName = as || 'div';\n  return <TagName {...props} />;\n};\n\n\
    export default Box;\n```\n\nNow, a `Box` component will adapt to whatever element\
    \ type we pass in with the `as` prop.\n\n![A Box with the props of a button](Images/as-button.png)\n\
    \nWe can now use our `Box` component wherever we might otherwise use a `<div>`:\n\
    \n```\n<Box as=\"section\" className=\"flex place-content-between w-full\">\n\
    \  <Button className=\"button\" onClick={decrement}>\n    Decrement\n  </Button>\n\
    \  <Button onClick={reset}>Reset</Button>\n  <Button onClick={increment}>Increment</Button>\n\
    </Box>\n```\n\n#### Repo Code\n\nYou can the final result on the [the `polymorphic`\
    \ branch of the GitHub repo for this tutorial](https://github.com/stevekinney/polymorphic/tree/polymorphic).\n\
    \n## Conclusion\n\nWe’ve just explored different strategies for creating polymorphic\
    \ components with React and TypeScript. By extending the properties of an HTML\
    \ element, it’s possible to create abstractions over that element with additional\
    \ behavior. A polymorphic component is a single adaptable component that can represent\
    \ different semantic HTML elements, with TypeScript automatically adjusting to\
    \ these changes. The cool thing about this is that we can now universally add\
    \ themes and other functionality to our application with this new primitive.\n\
    \nThese approaches work in most versions of TypeScript. In the next chapter, we’re\
    \ going to take a look at some of the specific improvements the latest release\
    \ of TypeScript brings to the table, and how we can use them to further improve\
    \ the reliability and maintainability of our code.\n\n# Chapter 5: A Guided Tour\
    \ of the Three Biggest Features in TypeScript 5.0\n\nTypeScript, JavaScript’s\
    \ more dependable cousin, keeps getting better and better. TypeScript 5.0 and\
    \ its subsequent minor versions, 5.1 and 5.2, are brimming with powerful new features\
    \ that promise to make our code cleaner, more powerful, and a lot easier to work\
    \ with. As you can tell from [the release notes](https://www.typescriptlang.org/docs/handbook/release-notes/typescript-5-0.html),\
    \ TypeScript 5.0 shipped with a ton of changes—both large and small.\n\nI’m going\
    \ to focus on three of the features that have had the biggest impact in my day-to-day\
    \ development:\n\n*   **Decorators**. TypeScript 5.0 supports decorators that\
    \ align with the ECMAScript proposal, allowing the modification of class behavior\
    \ in a reusable way. These have some important distinctions between the decorators\
    \ previously supported by the `--experimentalDecorators` flag.\n\n*   **const\
    \ type parameters**. The new `const` type parameters enhance function call inferences,\
    \ and ensure declared constants remain unchanged.\n\n*   **Upgrades and changes\
    \ to enums**. TypeScript 5.0 enhances enums, improving type safety and making\
    \ them more flexible and user-friendly.\n\n## Decorators: the Next Generation\n\
    \nDecorators have *almost* been part of ECMAScript for as long as I can remember.\
    \ These nifty tools let us modify classes and members in a reusable way. They’ve\
    \ been on the scene for a while in TypeScript—albeit under an experimental flag.\
    \ Although the Stage 2 iteration of decorators was always experimental, decorators\
    \ have been widely used in libraries like [MobX](https://mobx.js.org/enabling-decorators.html),\
    \ [Angular](https://angular.io/), [Nest](https://docs.nestjs.com/custom-decorators),\
    \ and [TypeORM](https://typeorm.io/). TypeScript 5.0’s decorators are fully in\
    \ sync with the [ECMAScript proposal](https://github.com/tc39/proposal-decorators),\
    \ which is pretty much ready for prime time, sitting at Stage 3.\n\n**Decorators**\
    \ let us craft a function that tweaks the behavior of a class and its methods.\
    \ Imagine needing to sneak in some debug statements into our methods. Before TypeScript\
    \ 5.0, we’d have been stuck copying and pasting the debug statements manually\
    \ in each method. With decorators, we just do the job once and the change will\
    \ be supported through each method the decorator is attached to.\n\nLet’s say\
    \ we want to create a decorator for logging that a given method is deprecated:\n\
    \n```\nclass Card {\n  constructor(public suit: Suit, public rank: Rank) {\n \
    \   this.suit = suit;\n    this.rank = rank;\n  }\n\n  get name(): CardName {\n\
    \    return `${this.rank} of ${this.suit}`;\n  }\n\n  @deprecated // \U0001F440\
    \ This is a decorator!\n  getValue(): number {\n    if (this.rank === 'Ace') return\
    \ 14;\n    if (this.rank === 'King') return 13;\n    if (this.rank === 'Queen')\
    \ return 12;\n    if (this.rank === 'Jack') return 11;\n    return this.rank;\n\
    \  }\n\n  // The new way to do it!\n  get value(): number {\n    if (this.rank\
    \ === 'Ace') return 14;\n    if (this.rank === 'King') return 13;\n    if (this.rank\
    \ === 'Queen') return 12;\n    if (this.rank === 'Jack') return 11;\n    return\
    \ this.rank;\n  }\n}\n\nconst card = new Card('Spades', 'Queen');\ncard.getValue();\n\
    ```\n\nWe want a warning message logged to the console whenever `card.getValue()`\
    \ is called. We could implement the above decorator as follows:\n\n```\nconst\
    \ deprecated = <This, Arguments extends any[], ReturnValue>(\n  target: (this:\
    \ This, ...args: Arguments) => ReturnValue,\n  context: ClassMethodDecoratorContext<\n\
    \    This,\n    (this: This, ...args: Arguments) => ReturnValue\n  >,\n) => {\n\
    \  const methodName = String(context.name);\n\n  function replacementMethod(this:\
    \ This, ...args: Arguments): ReturnValue {\n    console.warn(`Warning: '${methodName}'\
    \ is deprecated.`);\n    return target.call(this, ...args);\n  }\n\n  return replacementMethod;\n\
    };\n```\n\nThis might look a little confusing at first, but let’s break it down:\n\
    \n*   Our decorator function takes two arguments: `target` and `context`.\n\n\
    *   `target` is the method itself that we’re decorating.\n\n*   `context` is metadata\
    \ about the method.\n\n*   We return some method that has the same signature.\n\
    \n*   In this case, we’re calling `console.warn` to log a deprecation notice and\
    \ then we’re calling the method.\n\nThe `ClassMethodDecorator` type has the following\
    \ properties on it:\n\n*   `kind`: the type of the decorated property. In the\
    \ example above, this will be `method`, since we’re decorating a method on an\
    \ instance of a `Card`.\n\n*   `name`: the name of property. In the example above,\
    \ this is `getValue`.\n\n*   `static`: a value indicating whether the class element\
    \ is a static (`true`) or instance (`false`) element."
