    \ of the class element at runtime.\n\n*   `has`: determines whether an object\
    \ has a property with the same name as the decorated element.\n\n*   `get`: invokes\
    \ the setter on the provided object.\n\n#### Kick the Tires\n\nYou can kick the\
    \ tires of the code samples above in [this playground](https://www.typescriptlang.org/play?ts=5.1.3#--zlKC8IRs8iKewW6L5OA+LZyAA).\n\
    \nDecorators provide convenient syntactic sugar for adding log messages—like we\
    \ did in the example above—as well as a number of other common use cases. For\
    \ example, we could create a decorator that automatically binds the method to\
    \ the current instance or that modifies the [property descriptor](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Proxy/Proxy/getOwnPropertyDescriptor)\
    \ of the method or class.\n\n## Unleashing const Type Parameters\n\n`const` type\
    \ parameters allow us to declare values with `const`. TypeScript will now be able\
    \ to infer the type, not just the literal values.\n\nPut more simply, the `const`\
    \ type parameters allow us to spell out our intentions clearly in our code. If\
    \ a variable is supposed to be a constant that never changes, `const` type parameters\
    \ give us a safety net, making sure it stays constant, come what may.\n\nPrevious\
    \ versions of TypeScript have supported using `as const` to declare an object\
    \ or array as `readonly`. Once TypeScript knows that an object or array isn’t\
    \ going to change at runtime, it can be a lot more confident in the assumptions\
    \ it makes about the type.\n\nConsider the following two arrays:\n\n```\nconst\
    \ avengers = [\n  'Black Widow',\n  'Captain America',\n  'Hawkeye',\n  'Hulk',\n\
    \  'Iron Man',\n  'Thor',\n];\n\nconst ninjaTurtles = [\n  'Donatello',\n  'Leonardo',\n\
    \  'Michelangelo',\n  'Raphael',\n] as const;\n```\n\nIf we hover over each in\
    \ [this playground](https://www.typescriptlang.org/play?ts=4.9.5#code/MYewdgzgLgBAhgNwKZgOZIE4RgXhgbQHIBJDcGAWTjEIBoZCAhAGzmAGsYB1ASwBMQAdzoMAKgAsQGEYQDCcAA5Q4PMDACCAW0w9gcGQAk4g9kgCeSQgF0A3AChQkWGFUArOKICuGKMyTY8IgARcDgoJGZmEBkAGSRQjAEZACVFcTgImQpdcQjqdGireGxHaBsgA),\
    \ we’ll see that TypeScript has inferred two very different types:\n\n```\nconst\
    \ avengers: string[];\nconst ninjaTurtles: readonly [\n  'Donatello',\n  'Leonardo',\n\
    \  'Michelangelo',\n  'Raphael',\n];\n```\n\nThings get a little trickier when\
    \ working with `readonly` data structures with functions. Consider the following:\n\
    \n```\ntype WithNames = { names: readonly string[] };\n\nconst turtles = getNames({\n\
    \  names: ['Donatello', 'Leonardo', 'Michelangelo', 'Raphael'],\n});\n```\n\n\
    In this example, `turtles` would be `string[]`, which is not what we might expect\
    \ if we look closely at `WithNames`, which asserts that the `names` property is\
    \ `readonly`. Previously, we were able to get something closer to what we might\
    \ expect by adding `as const` to the array as we called the function:\n\n```\n\
    const turtles = getNames({\n  names: ['Donatello', 'Leonardo', 'Michelangelo',\
    \ 'Raphael'] as const,\n});\n```\n\n`turtles` would now correctly be the following\
    \ type:\n\n```\nconst turtles: readonly ['Donatello', 'Leonardo', 'Michelangelo',\
    \ 'Raphael'];\n```\n\nBut this can be cumbersome, and if we forget to add `as\
    \ const` each time we call the function, we might end up with something other\
    \ than what we expect—and that’s never good.\n\nIn TypeScript 5.0, we can add\
    \ `const` to the type of the parameter itself, and then we no longer have to worry\
    \ about adding `as const` every single time we invoke the function:\n\n```\n//\
    \                  ⬇️\nconst getNames = <const T extends WithNames>(arg: T): T['names']\
    \ => {\n  return arg.names;\n};\n\nconst turtles = getNames({\n  names: ['Donatello',\
    \ 'Leonardo', 'Michelangelo', 'Raphael'],\n});\n\nconst avengers = getNames({\n\
    \  names: [\n    'Black Widow',\n    'Captain America',\n    'Hawkeye',\n    'Hulk',\n\
    \    'Iron Man',\n    'Thor',\n  ],\n});\n```\n\nThe types are now as follows:\n\
    \n```\nconst turtles: readonly ['Donatello', 'Leonardo', 'Michelangelo', 'Raphael'];\n\
    const avengers: readonly [\n  'Black Widow',\n  'Captain America',\n  'Hawkeye',\n\
    \  'Hulk',\n  'Iron Man',\n  'Thor',\n];\n```\n\n#### Have a Play\n\nYou can play\
    \ around with the code above [in this TypeScript playground](https://www.typescriptlang.org/play?ts=5.1.3#).\n\
    \nAs with anything, there are some trade-offs. Using `as const` sets the object\
    \ as read-only at the time of declaration. `const` parameters give us another\
    \ option: the ability to set the object as read-only at the time of invocation.\
    \ Having the ability to choose the behavior that best serves our use case is a\
    \ welcome addition to TypeScript.\n\n## Upgraded and Enhanced Enums\n\nEnums—which\
    \ provide a handy (if somewhat under appreciated) way of defining a set of named\
    \ constants—have received a major boost in TypeScript 5.0.\n\nIn the past, we\
    \ could have accidentally passed an incorrect number to a function expecting an\
    \ enum and gotten away with it. TypeScript 5.0 is a lot stricter. It will throw\
    \ an error if there’s a mismatch. It now treats all enums as union enums, making\
    \ them safer and easier to work with.\n\nUp until TypeScript 5.0, an enum was\
    \ really just a set of numeric constraints. Let’s say we had an enum that tracked\
    \ the state of an HTTP request:\n\n```\nenum RequestState {\n  NotStarted,\n \
    \ Loading,\n  Success,\n  Error,\n}\n```\n\nTypeScript will compile that down\
    \ to the following object:\n\n```\n{\n  \"0\": \"NotStarted\",\n  \"1\": \"Loading\"\
    ,\n  \"2\": \"Success\",\n  \"3\": \"Error\",\n  \"NotStarted\": 0,\n  \"Loading\"\
    : 1,\n  \"Success\": 2,\n  \"Error\": 3\n}\n```\n\nEnums could be treated as a\
    \ bound set of numbers. In the case of `RequestState`, this would be 0, 1, 2,\
    \ and 3\\. But in previous versions of TypeScript, we could get around the predefined\
    \ values in an enum with any number. For example, [the following is valid in TypeScript\
    \ 4.9.5](https://www.typescriptlang.org/play?ts=4.9.5#code/KYOwrgtgBASsCOZgGcAuBlVBDVwoG8AoKKAOQHsNsAnXAEwBpioAZcrOgSxAHMmT0YAMZCUyflACi1auWpMAvoUJDyINFAA25HnEQoqOPAF4oACmoIkaAFywrBzEYCUUYwD4CzVevKbgAHTaPGYA5HrWqDahDFCW+mixEY7YuADa8ZEAus4A3IQK+YTByWhOuGalhrgBbBzcPHnFOlXlwGYADE0lDmWp7QCsA01AA):\n\
    \n```\nconst logRequestState = (request: RequestState) => {\n  console.log('Request:',\
    \ request, RequestState[request]);\n};\n\nlogRequestState(RequestState.Loading);\
    \ // ✅ Logs: \"Request:\",  1,  \"Loading\"\nlogRequestState(0); // ✅ Logs: \"\
    Request:\",  0,  \"NotStarted\"\nlogRequestState(55); // ✅ Logs:  \"Request:\"\
    ,  55,  undefined \U0001F928\n```"
  trans: "\n\n*   `private`：一个值，用于指示类元素是否具有私有名称。\n\n*   `access`：一个对象，可用于在运行时访问类元素的当前值。\n\
    \n*   `has`：确定一个对象是否具有与被装饰元素同名的属性。\n\n*   `get`：在提供的对象上调用 setter。\n\n### 试用一下\n\
    \n你可以在[这个在线演练场](https://www.typescriptlang.org/play?ts=5.1.3#-#OQAA3HEIGEqBRNYcTJPI3zDOApyMF0fR3L7bSfNkvyWuMjBTIyTrLOs6TeuaxyBvQFz4hCjywq8nqDJi-zlKC8IRs8iKewW6L5OA#LZyAA)中试用上面的代码示例。\n\
    \n装饰器为添加日志消息提供了便捷的语法糖——就像我们在上面示例中所做的那样——同时也适用于许多其他常见用例。例如，我们可以创建一个装饰器，自动将方法绑定到当前实例，或者修改方法或类的[属性描述符](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Proxy/Proxy/getOwnPropertyDescriptor)。\n\
    \n## 释放 const 类型参数\n\n`const` 类型参数允许我们使用 `const` 来声明值。TypeScript 现在能够推断类型，而不仅仅是字面值。\n\
    \n更简单地说，`const` 类型参数允许我们在代码中清晰地表达意图。如果一个变量应该是一个永不改变的常量，`const` 类型参数就为我们提供了一张安全网，确保它无论如何都保持不变。\n\
    \nTypeScript 的早期版本已经支持使用 `as const` 将对象或数组声明为 `readonly`。一旦 TypeScript 知道一个对象或数组在运行时不会改变，它就能对其类型做出更可靠的假设。\n\
    \n考虑以下两个数组：\n\n```\nconst avengers = [\n  'Black Widow',\n  'Captain America',\n\
    \  'Hawkeye',\n  'Hulk',\n  'Iron Man',\n  'Thor',\n];\n\nconst ninjaTurtles =\
    \ [\n  'Donatello',\n  'Leonardo',\n  'Michelangelo',\n  'Raphael',\n] as const;\n\
    ```\n\n如果我们在[这个演练场](https://www.typescriptlang.org/play?ts=4.9.5#code/MYewdgzgLgBAhgNwKZgOZIE4RgXhgbQHIBJDcGAWTjEIBoZCAhAGzmAGsYB1ASwBMQAdzoMAKgAsQGEYQDCcAA5Q4PMDACCAW0w9gcGQAk4g9kgCeSQgF0A3AChQkWGFUArOKICuGKMyTY8IgARcDgoJGZmEBkAGSRQjAEZACVFcTgImQpdcQjqdGireGxHaBsgA)中将鼠标悬停在每个数组上，我们会看到\
    \ TypeScript 推断出了两种非常不同的类型：\n\n```\nconst avengers: string[];\nconst ninjaTurtles:\
    \ readonly [\n  'Donatello',\n  'Leonardo',\n  'Michelangelo',\n  'Raphael',\n\
    ];\n```\n\n当处理带有函数的 `readonly` 数据结构时，事情会变得有点棘手。考虑以下情况：\n\n```\ntype WithNames\
    \ = { names: readonly string[] };\n\nconst turtles = getNames({\n  names: ['Donatello',\
    \ 'Leonardo', 'Michelangelo', 'Raphael'],\n});\n```\n\n在这个例子中，`turtles` 的类型将是\
    \ `string[]`，如果我们仔细查看 `WithNames`（它断言 `names` 属性是 `readonly`），这可能不是我们所期望的。以前，我们可以通过在调用函数时给数组添加\
    \ `as const` 来获得更接近预期的结果：\n\n```\nconst turtles = getNames({\n  names: ['Donatello',\
    \ 'Leonardo', 'Michelangelo', 'Raphael'] as const,\n});\n```\n\n现在 `turtles` 将正确地具有以下类型：\n\
    \n```\nconst turtles: readonly ['Donatello', 'Leonardo', 'Michelangelo', 'Raphael'];\n\
    ```\n\n但这可能很麻烦，而且如果我们每次调用函数时都忘记添加 `as const`，最终得到的结果可能与预期不符——这绝不是好事。\n\n在 TypeScript\
    \ 5.0 中，我们可以将 `const` 添加到参数本身的类型中，这样我们就不必每次调用函数时都担心添加 `as const`：\n\n```\n// \
    \                 ⬇️\nconst getNames = <const T extends WithNames>(arg: T): T['names']\
    \ => {\n  return arg.names;\n};\n\nconst turtles = getNames({\n  names: ['Donatello',\
    \ 'Leonardo', 'Michelangelo', 'Raphael'],\n});\n\nconst avengers = getNames({\n\
    \  names: [\n    'Black Widow',\n    'Captain America',\n    'Hawkeye',\n    'Hulk',\n\
    \    'Iron Man',\n    'Thor',\n  ],\n});\n```\n\n现在的类型如下：\n\n```\nconst turtles:\
    \ readonly ['Donatello', 'Leonardo', 'Michelangelo', 'Raphael'];\nconst avengers:\
    \ readonly [\n  'Black Widow',\n  'Captain America',\n  'Hawkeye',\n  'Hulk',\n\
    \  'Iron Man',\n  'Thor',\n];\n```\n\n### 动手试试\n\n你可以在[这个 TypeScript 演练场](https://www.typescriptlang.org/play?ts=5.1.3#)中试用上面的代码。\n\
    \n和任何事物一样，这里也有一些权衡。使用 `as const` 在声明时将对象设置为只读。`const` 参数给了我们另一个选择：在调用时将对象设置为只读的能力。能够选择最适合我们用例的行为，是\
    \ TypeScript 一个受欢迎的新增功能。\n\n## 升级和增强的枚举\n\n枚举——提供了一种方便（尽管有些未被充分认识）的方式来定义一组命名常量——在\
    \ TypeScript 5.0 中得到了重大提升。\n\n过去，我们可能意外地将一个错误的数字传递给期望枚举的函数，并且侥幸逃脱。TypeScript 5.0\
    \ 严格得多。如果存在不匹配，它将抛出错误。它现在将所有枚举视为联合枚举，使它们更安全、更易于使用。\n\n在 TypeScript 5.0 之前，枚举实际上只是一组数字约束。假设我们有一个枚举来跟踪\
    \ HTTP 请求的状态：\n\n```\nenum RequestState {\n  NotStarted,\n  Loading,\n  Success,\n\
    \  Error,\n}\n```\n\nTypeScript 会将其编译为以下对象：\n\n```\n{\n  \"0\": \"NotStarted\"\
    ,\n  \"1\": \"Loading\",\n  \"2\": \"Success\",\n  \"3\": \"Error\",\n  \"NotStarted\"\
    : 0,\n  \"Loading\": 1,\n  \"Success\": 2,\n  \"Error\": 3\n}\n```\n\n枚举可以被视为一个有界的数字集合。对于\
    \ `RequestState`，这个集合就是 0、1、2 和 3。但在 TypeScript 的早期版本中，我们可以用任何数字绕过枚举中预定义的值。例如，[以下代码在\
    \ TypeScript 4.9.5 中是有效的](https://www.typescriptlang.org/play?ts=4.9.5#code/KYOwrgtgBASsCOZgGcAuBlVBDVwoG8AoKKAOQHsNsAnXAEwBpioAZcrOgSxAHMmT0YAMZCUyflACi1auWpMAvoUJDyINFAA25HnEQoqOPAF4oACmoIkaAFywrBzEYCUUYwD4CzVevKbgAHTaPGYA5HrWqDahDFCW+mixEY7YuADa8ZEAus4A3IQK+YTByWhOuGalhrgBbBzcPHnFOlXlwGYADE0lDmWp7QCsA01AA)：\n\
    \n```\nconst logRequestState = (request: RequestState) => {\n  console.log('Request:',\
    \ request, RequestState[request]);\n};\n\nlogRequestState(RequestState.Loading);\
    \ // ✅ 输出: \"Request:\",  1,  \"Loading\"\nlogRequestState(0); // ✅ 输出: \"Request:\"\
    ,  0,  \"NotStarted\"\nlogRequestState(55); // ✅ 输出:  \"Request:\",  55,  undefined\
    \ \U0001F928\n```\n\n"
- fmt: "\n`55` should not be a valid argument for `logRequestState`. In TypeScript\
    \ 5.0, all enums are now treated as union enums, which provide better type safety.\
    \ Effectively, `RequestState` is `0 | 1 | 2 | 3`, which means `55` is no longer\
    \ a valid argument. This is closer to what we might have expected, as seen in\
    \ [this example](https://www.typescriptlang.org/play?ts=5.1.3#code/KYOwrgtgBASsCOZgGcAuBlVBDVwoG8AoKKAOQHsNsAnXAEwBpioAZcrOgSxAHMmT0YAMZCUyflACi1auWpMAvoUJDyINFAA25HnEQoqOPAF4oACmoIkaAFywrBzEYCUUYwD4CzVevKbgAHTaPGYA5HrWqDahDFCW+mixEY7YuADa8ZEAus4A3IQK+YTByWhOuGalhrgBbBzcPHnFOlXlwGYADE0lDmWp7QCsA01AA):\n\
    \n```\nlogRequestState(RequestState.Loading); // ✅ Logs: \"Request:\",  1,  \"\
    Loading\"\nlogRequestState(0); // ✅ Logs: \"Request:\",  0,  \"NotStarted\"\n\
    logRequestState(55); // ❌ Argument of type '55' is not assignable to parameter\
    \ \n➥of type 'RequestState'.\n```\n\nTypeScript is now better at enforcing types\
    \ set in enums. The following will compile in TypeScript 4.9.5, but it *won’t*\
    \ in TypeScript 5.0 and later. One word of caution: if we try to dynamically compute\
    \ the number, TypeScript is not able to be as helpful. For example, `logRequestState(3\
    \ + 2)` will *not* generate an error:\n\n```\nenum Letters {\n  A = 'Aye!',\n\
    \  B = 'Bee!',\n  C = 'Sea!',\n}\n\nenum Numbers {\n  one = 1,\n  two = 2,\n \
    \ three = Letters.C,\n}\n\nconst n: number = Numbers.three;\n```\n\nAs you can\
    \ see, `Numbers.three` is technically a letter and should be allowed to be assigned\
    \ to a number. TypeScript 5.0 makes sure this behaves as expected. That said,\
    \ it’s a breaking change and may require us to revisit our code.\n\nPreviously,\
    \ I avoided enums in favor of unions. The new behavior should work well with existing\
    \ code and also provide more safety than the previous implementations. Both enums\
    \ and unions are valid means of defining a set of values, and the choice now comes\
    \ down to our preference.\n\n## Conclusion\n\nTypeScript 5.0 is a major advancement\
    \ to the user-friendliness and flexibility of the language. It nudges us toward\
    \ better coding practices, promotes cleaner code, and catches potential errors\
    \ before they become a headache. The TypeScript team is continuing to add important\
    \ features and quality-of-life improvements to the language. It’s obviously a\
    \ smaller set of changes this time around, but [TypeScript 5.1](https://www.typescriptlang.org/docs/handbook/release-notes/typescript-5-1.html)\
    \ has added additional features such as easier implicit returns for functions\
    \ that return `undefined`.\n\nFor me, TypeScript has been critical to my confidence\
    \ in making changes to and maintaining large code bases. I often find that the\
    \ compiler catches edge cases I would otherwise have missed and that might have\
    \ caused my pager to go off at an undesirable hour. I’m personally excited to\
    \ see how the language evolves over the next few years—especially if the current\
    \ pace of updates continues.\n"
  raw: "`55` should not be a valid argument for `logRequestState`. In TypeScript 5.0,\
