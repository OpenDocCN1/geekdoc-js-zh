    \ we use it, we *could* create our own utilities that will do this for us and\
    \ then never worry about it again. This is going to involve a little bit of upfront\
    \ work, but—unlike in the previous solution—once we have our abstractions in place,\
    \ we’ll never have to think about them again.\n\nI’m going to create a new branch\
    \ off of `main` called [create-context](https://github.com/stevekinney/sitepoint-context/tree/create-context).\n\
    \n### Creating Our Own `createContext`\n\nLet’s start by making a new file called\
    \ `src/create-context.tsx`. We’ll start with a simple function so that TypeScript\
    \ doesn’t get mad at us for having an empty file:\n\n```\nexport const createContext\
    \ = () => {};\n```\n\nNext, we’re going to use React’s `createContext` to create\
    \ a `Context` object that we’ll build on top of:\n\n```\nimport React from 'react';\n\
    \nexport const createContext = () => {\n  const Context = React.createContext(null);\n\
    };\n```\n\nI’m using `React.createContext` as opposed to `import { createContext\
    \ } from 'react';` so that we don’t have any naming collisions. The name of our\
    \ function isn’t important, but I like consistency.\n\nNow we’ll do something\
    \ similar to what we did in the previous example: we’ll acknowledge that we might\
    \ not know what the initial value is. We’ll also use a generic so that this function\
    \ is reusable for other contexts:\n\n```\nimport React from 'react';\n\nexport\
    \ const createContext = <T extends object>() => {\n  const Context = React.createContext<T\
    \ | null>(null);\n};\n```\n\nI know that we’re going to want to pass both `hexColor`\
    \ and `setHexColor`, so I’m choosing to constrain `T` to some kind of object.\
    \ If generics are bewildering to you, you can just choose to use the `ColorState`\
    \ that we created earlier. That might look something like this:\n\n```\n// \U0001F6A8\
    \ Note: We won't be using this code. It's just an alternative to code above.\n\
    export const createContext = () => {\n  const Context = React.createContext<ColorState\
    \ | null>(null);\n};\n```\n\nNext, we’re going to create our own take on the `useContext`\
    \ hook. This will have access to the `Context` that we just created in [its closure\
    \ scope](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Closures). The\
    \ new `useContext` will check to make sure that context exists and that it’s not\
    \ `null`. If it *is* `null`, an error is thrown. TypeScript is smart enough to\
    \ understand that, if our `Context` can only be either `T` or `null` and it’s\
    \ not `null`, it must be `T`. Going forward, we’ll *only* be using our custom\
    \ `useContext` hook:\n\n```\nimport React from 'react';\n\nexport const createContext\
    \ = <T extends object>() => {\n  const Context = React.createContext<T | null>(null);\n\
    \n  const useContext = () => {\n    const ctx = React.useContext(Context);\n\n\
    \    if (ctx === null) {\n      throw new Error('useContext must be inside a Provider\
    \ with a value.');\n    }\n\n    return ctx;\n  };\n\n  return [useContext, Context.Provider]\
    \ as const;\n};\n```\n\nTo review:\n\n*   We know that the value of the context\
    \ can either be `T` or `null`.\n\n*   So, pull the value out of `React.useContext`\
    \ and take a look at it.\n\n*   Throw an error up if `ctx` is `null`. This means\
    \ that we won’t return anything in the case that `ctx` is `null`."
  trans: "\n在上面的代码中，我们瞥见了更简单的可能解决方案。我们可以通过使用 `any` 完全绕过 TypeScript。这不仅会让我们失去随之而来的类型安全，还会让我们失去代码中自动补全的所有好处。这能用，但我们可以做得更好。\n\
    \n## 一个可行的解决方案：使用类型断言\n\n我们还没有初始的十六进制颜色值，但我们知道最终会有的，对吧？在这种情况下，我们*可以*对 TypeScript\
    \ 撒谎，并试图让它相信 `null` 实际上是一个十六进制颜色。\n\n首先，我们需要弄清楚 `value` 属性的最终类型是什么。最简单的方法是将鼠标悬停在\
    \ `setHexColor` 上并查看其类型。\n\n![悬停在值上可以让我们看到类型](img/set-hex-color.png)\n\n我们知道我们正在向\
    \ `ColorContext.Provider` 传递一个包含 `hexColor` 和 `setHexColor` 的对象。让我们将其分解为自己的类型：\n\
    \n```\ntype ColorState = {\n  hexColor: string;\n  setHexColor: Dispatch<SetStateAction<string>>;\n\
    };\n```\n\n现在，即使我们还没有这个值，我们也可以让 TypeScript 知道它最终可以期望接收什么：\n\n```\nexport const\
    \ ColorContext = createContext<ColorState>(null as any);\n```\n\n如果我们将鼠标悬停在 `ColorContext`\
    \ 上，我们会看到 `const ColorContext: React.Context<ColorState>`。如果我们访问任何使用此上下文的组件，我们会看到它具有正确的类型注解，如下图所示。\n\
    \n![setHexColor 现在具有正确的类型断言](img/correct-type-assertion.png)\n\n如果我们想为自己的欺骗行为感到好受些，我们至少可以告诉它一个谎言，这个谎言正是它最终应该期望的：\n\
    \n```\nexport const ColorContext = createContext<ColorState>(\n  null as unknown\
    \ as ColorState,\n);\n```\n\n如果我们没有负罪感，我们可能也会考虑这样做，这样 ESLint 就不会因为我们显式地在代码中使用\
    \ `any` 而对我们生气。\n\n#### 仓库代码\n\n你可以在 [本教程的 GitHub 仓库的 `type-assertion` 分支](https://github.com/stevekinney/sitepoint-context/blob/type-assertion/src/context.tsx)\
    \ 中找到上面的代码（`context.tsx`）。\n\n## 一个折衷的解决方案：说实话\n\n另一个选择是说实话。上下文的值可以是 `ColorState`\
    \ 或 `undefined`：\n\n```\nexport const ColorContext = createContext<ColorState\
    \ | null>(null);\n```\n\n这感觉更好，但它会导致另一组问题：\n\n```\nErrors  Files\n  1  src/components/color-change-swatch.tsx:13\n\
    \  2  src/components/color-picker/color-select.tsx:11\n  1  src/components/color-picker/color-swatch.tsx:6\n\
    \  1  src/components/color-properties/to-cmyk.tsx:8\n  1  src/components/color-properties/to-hsl.tsx:8\n\
    \  1  src/components/color-properties/to-hsv.tsx:8\n  1  src/components/color-properties/to-rgb.tsx:8\n\
    \  1  src/components/related-colors/index.tsx:11\n```\n\n现在的问题是 TypeScript 不确定我们是在处理\
    \ `ColorState` 还是 `undefined`。现在我们需要每次使用它时都进行检查。\n\n![ColorState 现在可能是 undefined](img/or-undefined.png)\n\
    \n所以现在每次使用时，我们都需要检查它是否已定义。这是 `ColorChangeSwatch` 组件中的一个例子：\n\n```\nconst ColorChangeSwatch\
    \ = ({ hexColor, className }: ColorChangeSwatchProps) => {\n  // \U0001F440 将上下文存储在一个变量中。\n\
    \  const context = useContext(ColorContext);\n\n  return (\n    <Button\n    \
    \  className={clsx(\n        'border-2 border-slate-900 transition-shadow duration-200\
    \ ease-in \n        hover:shadow-xl',\n        className,\n      )}\n      style={{\
    \ backgroundColor: hexColor }}\n      onClick={() => {\n        // \U0001F440\
    \ 有条件地使用其上的任何属性。\n        context?.setHexColor(hexColor);\n      }}\n    >\n \
    \     {hexColor}\n    </Button>\n  );\n};\n```\n\n#### 仓库代码\n\n你可以在 [本教程的 GitHub\
    \ 仓库](https://github.com/stevekinney/sitepoint-context/blob/main/src/components/color-change-swatch.tsx)\
    \ 中找到上面的代码（`color-change-swatch.tsx`）。\n\n我不会让你忍受这在我们的应用程序中造成的混乱。但如果你感兴趣，我邀请你在这里查看[这里](https://github.com/stevekinney/sitepoint-context/commit/a0343931a92dd53c1672046f855dbc8e4d0da612)。它涉及更改十个文件，而这甚至不是一个很大的应用程序。不用说，在这种情况下，对\
    \ TypeScript 诚实可能不值得。\n\n## 一个合理的解决方案：创建一个抽象\n\n假设我们不想对 TypeScript 撒谎，也不想忍受我刚刚为你创建那个示例时所经历的事情。我们*可以*鱼与熊掌兼得。只是需要做一点工作。\n\
    \n我们*可以*创建自己的实用程序来为我们做这件事，而不是每次使用上下文时都检查它是否已定义，然后就再也不用担心了。这需要一些前期工作，但——与之前的解决方案不同——一旦我们的抽象就位，我们就再也不用考虑它们了。\n\
    \n我将从 `main` 创建一个名为 [create-context](https://github.com/stevekinney/sitepoint-context/tree/create-context)\
    \ 的新分支。\n\n### 创建我们自己的 `createContext`\n\n让我们从创建一个名为 `src/create-context.tsx`\
    \ 的新文件开始。我们将从一个简单的函数开始，这样 TypeScript 就不会因为我们有一个空文件而生气：\n\n```\nexport const createContext\
    \ = () => {};\n```\n\n接下来，我们将使用 React 的 `createContext` 来创建一个 `Context` 对象，我们将在此基础上进行构建：\n\
    \n```\nimport React from 'react';\n\nexport const createContext = () => {\n  const\
    \ Context = React.createContext(null);\n};\n```\n\n我使用 `React.createContext` 而不是\
    \ `import { createContext } from 'react';`，这样我们就不会有任何命名冲突。我们函数的名字并不重要，但我喜欢一致性。\n\
    \n现在我们将做一些类似于我们在上一个示例中所做的事情：我们将承认我们可能不知道初始值是什么。我们还将使用泛型，以便此函数可重用于其他上下文：\n\n```\n\
    import React from 'react';\n\nexport const createContext = <T extends object>()\
    \ => {\n  const Context = React.createContext<T | null>(null);\n};\n```\n\n我知道我们想要同时传递\
    \ `hexColor` 和 `setHexColor`，所以我选择将 `T` 约束为某种对象。如果泛型让你感到困惑，你可以选择使用我们之前创建的 `ColorState`。那可能看起来像这样：\n\
    \n```\n// \U0001F6A8 注意：我们不会使用此代码。它只是上面代码的替代方案。\nexport const createContext =\
    \ () => {\n  const Context = React.createContext<ColorState | null>(null);\n};\n\
    ```\n\n接下来，我们将创建我们自己对 `useContext` hook 的理解。这将可以访问我们刚刚在其[闭包作用域](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Closures)中创建的\
    \ `Context`。新的 `useContext` 将检查以确保上下文存在且不是 `null`。如果它*是* `null`，则会抛出一个错误。TypeScript\
    \ 足够聪明，可以理解如果我们的 `Context` 只能是 `T` 或 `null`，并且它不是 `null`，那么它一定是 `T`。今后，我们将*只*使用我们自定义的\
    \ `useContext` hook：\n\n```\nimport React from 'react';\n\nexport const createContext\
    \ = <T extends object>() => {\n  const Context = React.createContext<T | null>(null);\n\
    \n  const useContext = () => {\n    const ctx = React.useContext(Context);\n\n\
    \    if (ctx === null) {\n      throw new Error('useContext must be inside a Provider\
    \ with a value.');\n    }\n\n    return ctx;\n  };\n\n  return [useContext, Context.Provider]\
    \ as const;\n};\n```\n\n回顾一下：\n\n*   我们知道上下文的值可以是 `T` 或 `null`。\n\n*   所以，从 `React.useContext`\
    \ 中取出值并查看它。\n\n*   如果 `ctx` 是 `null`，则抛出一个错误。这意味着在 `ctx` 为 `null` 的情况下，我们不会返回任何内容。\n"
- fmt: "\n### 使用我们的新钩子\n\n我们已经创建了新的钩子。现在只需要使用它。让我们按照以下方式更新`src/context.tsx`：\n\n```\n\
    import { Dispatch, PropsWithChildren, SetStateAction, useState } from 'react';\n\
    \nimport { createContext } from './create-context';\n\ntype ColorState = {\n \
    \ hexColor: string;\n  setHexColor: Dispatch<SetStateAction<string>>;\n};\n\n\
    const [useContext, Provider] = createContext<ColorState>();\n\nexport const useColor\
    \ = useContext;\n\nexport const ColorProvider = ({ children }: PropsWithChildren)\
    \ => {\n  const [hexColor, setHexColor] = useState('#e56e24');\n\n  return <Provider\
    \ value={{ hexColor, setHexColor }}>{children}</Provider>;\n};\n```\n\n你会注意到我们自定义的`createContext`不再需要参数。我们只需要告诉它我们最终期望的类型。这将返回一个钩子和一个提供者。我们将导出那个钩子。我给了它一个有用的名字，因为它绑定到这个特定的上下文。\n\
    \n最后，我们使用从`createContext`函数返回的这个`Provider`来包装`Application`。\n\n我们仍然需要更新代码以使用新的`useColor`钩子而不是`useContext`。它将在`src/components/color-picker/color-select.tsx`中演示，你可以在完成的[`create-context`分支](https://github.com/stevekinney/sitepoint-context/tree/create-context)中查看其余部分：\n\
    \n```\nimport { useColor } from '../../context';\nimport HexColor from '../hex-color';\n\
    \ntype ColorSelectProps = {\n  label?: string;\n};\n\nconst ColorSelect = ({ label\
    \ = 'Color' }: ColorSelectProps) => {\n  // \U0001F440 我们的新 `useColor` 钩子在行动！\n\
    \  const { hexColor, setHexColor } = useColor();\n\n  return (\n    <div className=\"\
    flex flex-col gap-2\">\n      <label htmlFor=\"color-input\">{label}</label>\n\
    \      <input\n        id=\"color-input\"\n        className=\"h-80 w-full\"\n\
    \        type=\"color\"\n        value={hexColor}\n        onChange={(e) => setHexColor(e.target.value)}\n\
    \      />\n      <HexColor hexColor={hexColor} />\n    </div>\n  );\n};\n\nexport\
    \ default ColorSelect;\n```\n\n## 结论\n\n在TypeScript中使用Context API可能有点棘手，但有可用的解决方案。虽然使用`any`可以提供快速修复，但它对于维护类型安全并不理想，并且可能导致后续问题。使用类型断言在大多数情况下肯定有效。但是，围绕`createContext`创建抽象并使用自定义`useContext`钩子将为我们提供一个更可靠的解决方案。事实上，它隐藏了我们正在使用上下文的事实，并为我们留下了一个方便的钩子——在这个例子中是`useColor`。通过这种方法，我们可以确保上下文的值不是`null`，并避免在整个应用程序中进行持续的空值检查。\n\
    \n在下一期中，我们将继续通过研究扩展内置DOM类型和为组件属性创建多态类型来探索在React应用程序中使用TypeScript。\n\n# 第4章：扩展DOM元素和创建多态组件\n\
    \n在我参与的大多数大型应用程序和项目中，我经常发现自己构建了许多组件，这些组件实际上是标准HTML元素的超集或抽象。一些例子包括自定义按钮元素，它可能接受一个属性来定义该按钮应该是主要按钮还是次要按钮，或者可能指示它将调用危险操作，例如从数据库中删除或移除项目。我仍然希望我的按钮具有按钮的所有属性，除了我想添加到它的属性。\n\
    \n另一个常见的情况是我最终会创建一个组件，允许我同时定义标签和输入字段。我不想重新添加`<input />`元素接受的所有属性。我希望我的自定义组件的行为就像一个输入字段，但*也*接受一个字符串作为标签，并自动将`<label\
    \ />`上的`htmlFor`属性与`<input />`上的`id`对应起来。\n\n在JavaScript中，我可以使用`{...props}`将任何属性传递给底层HTML元素。在TypeScript中这可能有点棘手，我需要显式定义组件将接受哪些属性。虽然对我的组件接受的确切类型进行细粒度控制很好，但手动为每个属性添加类型信息可能很繁琐。\n\
    \n在某些场景中，我需要一个单一的可适应组件，比如`<div>`，它根据当前主题改变样式。例如，也许我想根据用户是否手动启用了UI的浅色或深色模式来定义应使用的样式。我不想为每个块元素（如`<section>`、`<article>`、`<aside>`等）重新定义这个组件。它应该能够表示不同的语义HTML元素，TypeScript会自动调整以适应这些变化。\n\
    \n我们可以采用几种策略：\n\n*   对于我们正在创建抽象的单一元素类型的组件，我们可以扩展该元素的属性。\n\n*   对于我们想要定义不同元素的组件，我们可以创建多态组件。**多态组件**是一种设计为渲染为不同HTML元素或组件的组件，同时保持相同的属性和行为。它允许我们指定一个属性来确定其渲染的元素类型。多态组件提供了灵活性和可重用性，而我们不必重新实现组件。具体示例，你可以查看[Radix的多态组件实现](https://www.radix-ui.com/primitives/docs/utilities/polymorphic)。\n\
    \n在本教程中，我们将研究这两种策略。\n\n#### 跟随本教程\n\n我们将使用的所有代码都可以在[这个GitHub仓库](https://github.com/stevekinney/polymorphic/)中找到，从[main分支](https://github.com/stevekinney/polymorphic/tree/main)开始。我将在此过程中推送其他分支。\n\
    \n## 镜像和扩展HTML元素的属性\n\n让我们从引言中提到的第一个例子开始。我们想要创建一个按钮，它内置了适合我们应用程序的适当样式。在JavaScript中，我们可能可以这样做：\n\
    \n```\nconst Button = (props) => {\n  return <button className=\"button\" {...props}\
    \ />;\n};\n```\n\n在TypeScript中，我们可以只添加我们知道需要的内容。例如，我们知道如果我们希望自定义按钮的行为与HTML按钮相同，我们需要`children`：\n\
    \n```\nconst Button = ({ children }: React.PropsWithChildren) => {\n  return <button\
    \ className=\"button\">{children}</button>;\n};\n```\n\n你可以想象，逐个添加属性可能会变得有点繁琐。相反，我们可以告诉TypeScript我们想要匹配它用于React中`<button>`元素的相同属性：\n\
    \n```\nconst Button = (props: React.ComponentProps<'button'>) => {\n  return <button\
    \ className=\"button\" {...props} />;\n};\n```\n"
  raw: "*   If `ctx` can only either be `null` or `T` and it’s not `null`, then it’s\
    \ `T`. This means we don’t have to keep verifying that it’s *not* `null` throughout\
    \ our application like we did before.\n\n*   Return `Context.Provider` and our\
    \ customized version of `useContext` as a tuple, like we might have seen with\
    \ `useState` and `useReducer`.\n\nThis works because we’re not using the React\
    \ hook at the top level, which isn’t allowed. Instead, we have a function that\
    \ has access to the context at any point and can check to see if it’s valid.\n\
    \nThe `as const` at the end of the last line will tell TypeScript that we don’t\
    \ expect this array to change ever, and that it can be sure the first element\
    \ will always be our `useContext` function and the second element will always\
    \ be `Context.Provider`.\n\nWe end up with the following signature:\n\n```\nconst\
    \ createContext: <T extends object>() => readonly [\n  () => T,\n  React.Provider<T\
    \ | null>,\n];\n```\n\n### Using Our New Hook\n\nWe’ve created our new hook. Now\
    \ we just need to use it. Let’s update `src/context.tsx` as follows:\n\n```\n\
    import { Dispatch, PropsWithChildren, SetStateAction, useState } from 'react';\n\
    \nimport { createContext } from './create-context';\n\ntype ColorState = {\n \
    \ hexColor: string;\n  setHexColor: Dispatch<SetStateAction<string>>;\n};\n\n\
    const [useContext, Provider] = createContext<ColorState>();\n\nexport const useColor\
    \ = useContext;\n\nexport const ColorProvider = ({ children }: PropsWithChildren)\
    \ => {\n  const [hexColor, setHexColor] = useState('#e56e24');\n\n  return <Provider\
    \ value={{ hexColor, setHexColor }}>{children}</Provider>;\n};\n```\n\nYou’ll\
    \ notice that our customized `createContext` doesn’t require an argument anymore.\
    \ We just need to tell it what type we’re eventually expecting. This will return\
    \ a hook and a provider. We’ll export that hook. I gave it a useful name because\
    \ it’s bound to this specific context.\n\nFinally, we use this `Provider` returned\
    \ from our `createContext` function to wrap the `Application`.\n\nWe still need\
    \ to update our code to use our new `useColor` hook instead of `useContext`. It\
    \ will demonstrate this in `src/components/color-picker/color-select.tsx`, and\
    \ you can check out the rest in the completed [`create-context` branch](https://github.com/stevekinney/sitepoint-context/tree/create-context):\n\
    \n```\nimport { useColor } from '../../context';\nimport HexColor from '../hex-color';\n\
    \ntype ColorSelectProps = {\n  label?: string;\n};\n\nconst ColorSelect = ({ label\
    \ = 'Color' }: ColorSelectProps) => {\n  // \U0001F440 Our new `useColor` hook\
    \ in action!\n  const { hexColor, setHexColor } = useColor();\n\n  return (\n\
    \    <div className=\"flex flex-col gap-2\">\n      <label htmlFor=\"color-input\"\
    >{label}</label>\n      <input\n        id=\"color-input\"\n        className=\"\
    h-80 w-full\"\n        type=\"color\"\n        value={hexColor}\n        onChange={(e)\
    \ => setHexColor(e.target.value)}\n      />\n      <HexColor hexColor={hexColor}\
    \ />\n    </div>\n  );\n};\n\nexport default ColorSelect;\n```\n\n## Conclusion\n\
    \nUsing the Context API with TypeScript can be a bit tricky, but there are solutions\
    \ available. While using `any` can provide a quick fix, it’s not ideal for maintaining\
    \ type safety, and it can lead to issues down the line. Using a type assertion\
    \ will definitely work in most cases. But creating an abstraction around `createContext`\
    \ and using a custom `useContext` hook will provide us with a much more solid\
    \ solution. In fact, it hides the fact that we’re using a context at all and leaves\
    \ us with a convenient hook—in this case, `useColor`. With this approach, we can\
    \ ensure that the context’s value is not `null` and avoid the need for constant\
    \ null-checking throughout our application.\n\nIn the next installment, we’ll\
    \ continue to explore the use of TypeScript in our React applications by looking\
    \ at extending built-in DOM types and creating polymorphic types for our component\
    \ props.\n\n# Chapter 4: Extending DOM Elements and Creating Polymorphic Components\n\
    \nIn most of the larger applications and projects I’ve worked on, I often find\
    \ myself building a bunch of components that are really supersets or abstractions\
    \ on top of the standard HTML elements. Some examples include custom button elements\
    \ that might take a prop defining whether or not that button should be a primary\
    \ or secondary button, or maybe one that indicates that it will invoke a dangerous\
    \ action, such as deleting or removing a item from the database. I still want\
    \ my button to have all the properties of a button in addition to the props I\
    \ want to add to it.\n\nAnother common case is that I’ll end up creating a component\
    \ that allows me to define a label and an input field at once. I don’t want to\
    \ re-add all of the properties that an `<input />` element takes. I want my custom\
    \ component to behave just like an input field, but *also* take a string for the\
    \ label and automatically wire up the `htmlFor` prop on the `<label />` to correspond\
    \ with the `id` on the `<input />`.\n\nIn JavaScript, I can just use `{...props}`\
    \ to pass through any props to an underlying HTML element. This can be a bit trickier\
    \ in TypeScript, where I need to explicitly define what props a component will\
    \ accept. While it’s nice to have fine-grained control over the exact types that\
    \ my component accepts, it can be tedious to have to add in type information for\
    \ every single prop manually.\n\nIn certain scenarios, I need a single adaptable\
    \ component, like a `<div>`, that changes styles according to the current theme.\
    \ For example, maybe I want to define what styles should be used depending on\
    \ whether or not the user has manually enabled light or dark mode for the UI.\
    \ I don’t want to redefine this component for every single block element (such\
    \ as `<section>`, `<article>`, `<aside>`, and so on). It should be capable of\
    \ representing different semantic HTML elements, with TypeScript automatically\
    \ adjusting to these changes.\n\nThere are a few strategies that we can employ:\n\
    \n*   For components where we’re creating an abstraction over just one kind of\
    \ element, we can extend the properties of that element.\n\n*   For components\
    \ where we want to define different elements, we can create polymorphic components.\
    \ A **polymorphic component** is a component designed to render as different HTML\
    \ elements or components while maintaining the same properties and behaviors.\
    \ It allows us to specify a prop to determine its rendered element type. Polymorphic\
    \ components offer flexibility and reusability without us having to reimplement\
    \ the component. For a concrete example, you can look at [Radix’s implementation\
    \ of a polymorphic component](https://www.radix-ui.com/primitives/docs/utilities/polymorphic).\n\
    \nIn this tutorial, we’ll look at both of these strategies.\n\n#### Following\
    \ Along with This Tutorial\n\nAll of the code that we’ll be working with can be\
    \ found in [this GitHub repository](https://github.com/stevekinney/polymorphic/),\
    \ starting with the [main branch](https://github.com/stevekinney/polymorphic/tree/main).\
    \ I’ll push up other branches along the way.\n\n## Mirroring and Extending the\
    \ Properties of an HTML Element\n\nLet’s start with that first example mentioned\
    \ in the introduction. We want to create a button that comes baked in with the\
    \ appropriate styling for use in our application. In JavaScript, we might be able\
    \ to do something like this:\n\n```\nconst Button = (props) => {\n  return <button\
    \ className=\"button\" {...props} />;\n};\n```\n\nIn TypeScript, we could just\
    \ add what we know we need. For example, we know that we need the `children` if\
    \ we want our custom button to behave the same way an HTML button does:\n\n```\n\
    const Button = ({ children }: React.PropsWithChildren) => {\n  return <button\
    \ className=\"button\">{children}</button>;\n};\n```\n\nYou can imagine that adding\
    \ properties one at a time could get a bit tedious. Instead, we can tell TypeScript\
    \ that we want to match the same props that it would use for a `<button>` element\
    \ in React:\n\n```\nconst Button = (props: React.ComponentProps<'button'>) =>\
    \ {\n  return <button className=\"button\" {...props} />;\n};\n```"
  trans: "\n\n### 使用我们的新钩子\n\n我们已经创建了新的钩子。现在只需要使用它。让我们按照以下方式更新`src/context.tsx`：\n\
    \n```\nimport { Dispatch, PropsWithChildren, SetStateAction, useState } from 'react';\n\
    \nimport { createContext } from './create-context';\n\ntype ColorState = {\n \
    \ hexColor: string;\n  setHexColor: Dispatch<SetStateAction<string>>;\n};\n\n\
    const [useContext, Provider] = createContext<ColorState>();\n\nexport const useColor\
    \ = useContext;\n\nexport const ColorProvider = ({ children }: PropsWithChildren)\
    \ => {\n  const [hexColor, setHexColor] = useState('#e56e24');\n\n  return <Provider\
    \ value={{ hexColor, setHexColor }}>{children}</Provider>;\n};\n```\n\n你会注意到我们自定义的`createContext`不再需要参数。我们只需要告诉它我们最终期望的类型。这将返回一个钩子和一个提供者。我们将导出那个钩子。我给了它一个有用的名字，因为它绑定到这个特定的上下文。\n\
    \n最后，我们使用从`createContext`函数返回的这个`Provider`来包装`Application`。\n\n我们仍然需要更新代码以使用新的`useColor`钩子而不是`useContext`。它将在`src/components/color-picker/color-select.tsx`中演示，你可以在完成的[`create-context`分支](https://github.com/stevekinney/sitepoint-context/tree/create-context)中查看其余部分：\n\
    \n```\nimport { useColor } from '../../context';\nimport HexColor from '../hex-color';\n\
    \ntype ColorSelectProps = {\n  label?: string;\n};\n\nconst ColorSelect = ({ label\
    \ = 'Color' }: ColorSelectProps) => {\n  // \U0001F440 我们的新 `useColor` 钩子在行动！\n\
    \  const { hexColor, setHexColor } = useColor();\n\n  return (\n    <div className=\"\
    flex flex-col gap-2\">\n      <label htmlFor=\"color-input\">{label}</label>\n\
    \      <input\n        id=\"color-input\"\n        className=\"h-80 w-full\"\n\
    \        type=\"color\"\n        value={hexColor}\n        onChange={(e) => setHexColor(e.target.value)}\n\
    \      />\n      <HexColor hexColor={hexColor} />\n    </div>\n  );\n};\n\nexport\
    \ default ColorSelect;\n```\n\n## 结论\n\n在 TypeScript 中使用 Context API 可能有点棘手，但有可用的解决方案。虽然使用`any`可以提供快速修复，但它对于维护类型安全并不理想，并且可能导致后续问题。使用类型断言在大多数情况下肯定有效。但是，围绕`createContext`创建抽象并使用自定义`useContext`钩子将为我们提供一个更可靠的解决方案。事实上，它隐藏了我们正在使用上下文的事实，并为我们留下了一个方便的钩子——在这个例子中是`useColor`。通过这种方法，我们可以确保上下文的值不是`null`，并避免在整个应用程序中进行持续的空值检查。\n\
    \n在下一期中，我们将继续通过研究扩展内置 DOM 类型和为组件属性创建多态类型来探索在 React 应用程序中使用 TypeScript。\n\n# 第\
    \ 4 章：扩展 DOM 元素和创建多态组件\n\n在我参与的大多数大型应用程序和项目中，我经常发现自己构建了许多组件，这些组件实际上是标准 HTML 元素的超集或抽象。一些例子包括自定义按钮元素，它可能接受一个属性来定义该按钮应该是主要按钮还是次要按钮，或者可能指示它将调用危险操作，例如从数据库中删除或移除项目。我仍然希望我的按钮具有按钮的所有属性，除了我想添加到它的属性。\n\
    \n另一个常见的情况是我最终会创建一个组件，允许我同时定义标签和输入字段。我不想重新添加`<input />`元素接受的所有属性。我希望我的自定义组件的行为就像一个输入字段，但*也*接受一个字符串作为标签，并自动将`<label\
    \ />`上的`htmlFor`属性与`<input />`上的`id`对应起来。\n\n在 JavaScript 中，我可以使用`{...props}`将任何属性传递给底层\
    \ HTML 元素。在 TypeScript 中这可能有点棘手，我需要显式定义组件将接受哪些属性。虽然对我的组件接受的确切类型进行细粒度控制很好，但手动为每个属性添加类型信息可能很繁琐。\n\
    \n在某些场景中，我需要一个单一的可适应组件，比如`<div>`，它根据当前主题改变样式。例如，也许我想根据用户是否手动启用了 UI 的浅色或深色模式来定义应使用的样式。我不想为每个块元素（如`<section>`、`<article>`、`<aside>`等）重新定义这个组件。它应该能够表示不同的语义\
    \ HTML 元素，TypeScript 会自动调整以适应这些变化。\n\n我们可以采用几种策略：\n\n*   对于我们正在创建抽象的单一元素类型的组件，我们可以扩展该元素的属性。\n\
    \n*   对于我们想要定义不同元素的组件，我们可以创建多态组件。**多态组件**是一种设计为渲染为不同 HTML 元素或组件的组件，同时保持相同的属性和行为。它允许我们指定一个属性来确定其渲染的元素类型。多态组件提供了灵活性和可重用性，而我们不必重新实现组件。具体示例，你可以查看[Radix\
    \ 的多态组件实现](https://www.radix-ui.com/primitives/docs/utilities/polymorphic)。\n\n\
    在本教程中，我们将研究这两种策略。\n\n#### 跟随本教程\n\n我们将使用的所有代码都可以在[这个 GitHub 仓库](https://github.com/stevekinney/polymorphic/)中找到，从[main\
    \ 分支](https://github.com/stevekinney/polymorphic/tree/main)开始。我将在此过程中推送其他分支。\n\
    \n## 镜像和扩展 HTML 元素的属性\n\n让我们从引言中提到的第一个例子开始。我们想要创建一个按钮，它内置了适合我们应用程序的适当样式。在 JavaScript\
    \ 中，我们可能可以这样做：\n\n```\nconst Button = (props) => {\n  return <button className=\"\
    button\" {...props} />;\n};\n```\n\n在 TypeScript 中，我们可以只添加我们知道需要的内容。例如，我们知道如果我们希望自定义按钮的行为与\
    \ HTML 按钮相同，我们需要`children`：\n\n```\nconst Button = ({ children }: React.PropsWithChildren)\
    \ => {\n  return <button className=\"button\">{children}</button>;\n};\n```\n\n\
    你可以想象，逐个添加属性可能会变得有点繁琐。相反，我们可以告诉 TypeScript 我们想要匹配它用于 React 中`<button>`元素的相同属性：\n\
    \n```\nconst Button = (props: React.ComponentProps<'button'>) => {\n  return <button\
    \ className=\"button\" {...props} />;\n};\n```\n\n"
- fmt: "But we have a new problem. Or, rather, we *had* a problem that *also* existed\
    \ in the JavaScript example and which we ignored. If someone using our new `Button`\
    \ component passes in a `className` prop, it will override our `className`. We\
    \ could (and we will) add some code to deal with this in a moment, but I don’t\
    \ want to pass up the opportunity to show you how to use a utility type in TypeScript\
    \ to say “I want to use *all* of the props from an HTML button *except* for one\
    \ (or more)”:\n\n```typescript\ntype ButtonProps = Omit<React.ComponentProps<'button'>,\
    \ 'className'>;\n\nconst Button = (props: ButtonProps) => {\n  return <button\
    \ className=\"button\" {...props} />;\n};\n```\n\nNow, TypeScript will stop us\
    \ or anyone else from passing a `className` property into our `Button` component.\
    \ If we just wanted to extend the class list with whatever is passed in, we could\
    \ do that in a few different ways. We could just append it to the list:\n\n```typescript\n\
    type ButtonProps = React.ComponentProps<'button'>;\n\nconst Button = (props: ButtonProps)\
    \ => {\n  const className = 'button ' + props.className;\n\n  return <button className={className.trim()}\
    \ {...props} />;\n};\n```\n\nI like to use the [clsx](https://npm.im/clsx) library\
    \ when working with classes, as it takes care of most of these kinds of things\
    \ on our behalf:\n\n```typescript\nimport React from 'react';\nimport clsx from\
    \ 'clsx';\n\ntype ButtonProps = React.ComponentProps<'button'>;\n\nconst Button\
    \ = ({ className, ...props }: ButtonProps) => {\n  return <button className={clsx('button',\
    \ className)} {...props} />;\n};\n\nexport default Button;\n```\n\nWe learned\
    \ how to limit the props that a component will accept. To extend the props, we\
    \ can use an [intersection](https://www.typescriptlang.org/docs/handbook/2/objects.html#intersection-types):\n\
    \n```typescript\ntype ButtonProps = React.ComponentProps<'button'> & {\n  variant?:\
    \ 'primary' | 'secondary';\n};\n```\n\nWe’re now saying that `Button` accepts\
    \ all of the props that a `<button>` element accepts plus one more: `variant`.\
    \ This prop will show up with all the other props we inherited from `HTMLButtonElement`.\n\
    \n![Variant shows up as a prop on our Button component](Images/variant.png)\n\n\
    We can add support to our `Button` to add this class as well:\n\n```typescript\n\
    const Button = ({ variant, className, ...props }: ButtonProps) => {\n  return\
    \ (\n    <button\n      className={clsx(\n        'button',\n        variant ===\
    \ 'primary' && 'button-primary',\n        variant === 'secondary' && 'button-secondary',\n\
    \        className,\n      )}\n      {...props}\n    />\n  );\n};\n```\n\nWe can\
    \ now update `src/application.tsx` to use our new button component:\n\n```diff\n\
    diff --git a/src/application.tsx b/src/application.tsx\nindex 978a61d..fc8a416\
    \ 100644\n--- a/src/application.tsx\n+++ b/src/application.tsx\n@@ -1,3 +1,4 @@\n\
    +import Button from './components/button';\n import useCount from './use-count';\n\
    \ \n const Counter = () => {\n@@ -8,15 +9,11 @@ const Counter = () => {\n    \
    \   <h1>Counter</h1>\n       <p className=\"text-7xl\">{count}</p>\n       <div\
    \ className=\"flex place-content-between w-full\">\n-        <button className=\"\
    button\" onClick={decrement}>\n+        <Button onClick={decrement}>\n       \
    \    Decrement\n-        </button>\n-        <button className=\"button\" onClick={reset}>\n\
    -          Reset\n-        </button>\n-        <button className=\"button\" onClick={increment}>\n\
    -          Increment\n-        </button>\n+        </Button>\n+        <Button\
    \ onClick={reset}>Reset</Button>\n+        <Button onClick={increment}>Increment</Button>\n\
    \       </div>\n       <div>\n         <form\n@@ -32,9 +29,9 @@ const Counter\
    \ = () => {\n         >\n           <label htmlFor=\"set-count\">Set Count</label>\n\
    \           <input type=\"number\" id=\"set-count\" name=\"set-count\" />\n- \
    \         <button className=\"button-primary\" type=\"submit\">\n+          <Button\
    \ variant=\"primary\" type=\"submit\">\n             Set\n-          </button>\n\
    +          </Button>\n         </form>\n       </div>\n     </main>\n```\n\n####\
    \ Repo Code\n\nYou can find the changes above in [the `button` branch of the GitHub\
    \ repo for this tutorial](https://github.com/stevekinney/polymorphic/tree/button).\n\
    \n### Creating Composite Components\n\nAnother common component that I typically\
    \ end up making for myself is a component that correctly wires up a label and\
    \ input element with the correct `for` and `id` attributes respectively. I tend\
    \ to grow weary typing this out over and over:\n\n```html\n<label htmlFor=\"set-count\"\
    >Set Count</label>\n<input type=\"number\" id=\"set-count\" name=\"set-count\"\
    \ />\n```\n\nWithout extending the props of an HTML element, I might end up slowly\
    \ adding props as needed:\n\n```typescript\ntype LabeledInputProps = {\n  id?:\
    \ string;\n  label: string;\n  value: string | number;\n  type?: string;\n  className?:\
    \ string;\n  onChange?: ChangeEventHandler<HTMLInputElement>;\n};\n```\n\nAs we\
    \ saw with the button, we can refactor it in a similar fashion:\n\n```typescript\n\
    type LabeledInputProps = React.ComponentProps<'input'> & {\n  label: string;\n\
    };\n```\n\nOther than `label`, which we’re passing to the (uhh) label that we’ll\
    \ often want grouped with our inputs, we’re manually passing props through one\
    \ by one. Do we want to add `autofocus`? Better add another prop. It would be\
    \ better to do something like this:\n\n```typescript\nimport { ComponentProps\
    \ } from 'react';\n\ntype LabeledInputProps = ComponentProps<'input'> & {\n  label:\
    \ string;\n};\n\nconst LabeledInput = ({ id, label, ...props }: LabeledInputProps)\
    \ => {\n  return (\n    <>\n      <label htmlFor={id}>{label}</label>\n      <input\
    \ {...props} id={id} readOnly={!props.onChange} />\n    </>\n  );\n};\n\nexport\
    \ default LabeledInput;\n```\n\nWe can swap in our new component in `src/application.tsx`:\n\
    \n```typescript\n<LabeledInput\n  id=\"set-count\"\n  label=\"Set Count\"\n  type=\"\
    number\"\n  onChange={(e) => setValue(e.target.valueAsNumber)}\n  value={value}\n\
    />\n```\n\nWe can pull out the things we need to work with and then just pass\
    \ everything else on through to the `<input />` component, and then just pretend\
    \ for the rest of our days that it’s a standard `HTMLInputElement`.\n\nTypeScript\
    \ doesn’t care, since `HTMLElement` is pretty flexible, as the DOM pre-dates TypeScript.\
    \ It only complains if we toss something completely egregious in there.\n\n####\
    \ Repo Code\n\nYou can see all of the changes above in [the `input` branch of\
    \ the GitHub repo for this tutorial](https://github.com/stevekinney/polymorphic/tree/input).\n\
    \n## Polymorphic Components\n\nEarlier, I told you that, over the course of building\
    \ out a large application, I tend to end up making a few wrappers around components.\
    \ `Box` is a primitive wrapper around the basic block elements in HTML (such as\
    \ `<div>`, `<aside>`, `<section>`, `<article>`, `<main>`, `<head>`, and so on).\
    \ But just as we don’t want to lose all the semantic meaning we get from these\
    \ tags, we also don’t need multiple variations of `Box` that are all basically\
    \ the same. What we’d like to is use `Box` but also be able to specify what it\
    \ ought to be under the hood.\n\nHere’s an overly simplified take on a `Box` element\
    \ inspired by [Styled Components](https://medium.com/styled-components/announcing-styled-components-v4-better-faster-stronger-3fe1aba1a112).\n\
    \nAnd here’s an example of a `Box` component from [Paste](https://paste.twilio.design/primitives/box),\
    \ [Twilio’s](https://twilio.com) design system:\n\n```jsx\n<Box as=\"article\"\
    \ backgroundColor=\"colorBackgroundBody\" padding=\"space60\">\n  Parent box on\
    \ the hill side\n  <Box\n    backgroundColor=\"colorBackgroundSuccessWeakest\"\
    \n    display=\"inline-block\"\n    padding=\"space40\"\n  >\n    nested box 1\
    \ made out of ticky tacky\n  </Box>\n</Box>\n```\n\nHere’s a simple implementation\
    \ that doesn’t have any pass through any of the props, like we did with `Button`\
    \ and `LabelledInputProps` above:\n\n```typescript\nimport { PropsWithChildren\
    \ } from 'react';\n\ntype BoxProps = PropsWithChildren<{\n  as: 'div' | 'section'\
    \ | 'article' | 'p';\n}>;\n\nconst Box = ({ as, children }: BoxProps) => {\n \
    \ const TagName = as || 'div';\n  return <TagName>{children}</TagName>;\n};\n\n\
    export default Box;\n```"
