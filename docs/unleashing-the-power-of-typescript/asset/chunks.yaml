  trans: "\n\n`55` 不应作为 `logRequestState` 的有效参数。在 TypeScript 5.0 中，所有枚举现在都被视为联合枚举，这提供了更好的类型安全性。实际上，`RequestState`\
    \ 是 `0 | 1 | 2 | 3`，这意味着 `55` 不再是一个有效参数。这更接近我们可能预期的行为，如[此示例](https://www.typescriptlang.org/play?ts=5.1.3#code/KYOwrgtgBASsCOZgGcAuBlVBDVwoG8AoKKAOQHsNsAnXAEwBpioAZcrOgSxAHMmT0YAMZCUyflACi1auWpMAvoUJDyINFAA25HnEQoqOPAF4oACmoIkaAFywrBzEYCUUYwD4CzVevKbgAHTaPGYA5HrWqDahDFCW+mixEY7YuADa8ZEAus4A3IQK+YTByWhOuGalhrgBbBzcPHnFOlXlwGYADE0lDmWp7QCsA01AA)所示：\n\
    \n```\nlogRequestState(RequestState.Loading); // ✅ Logs: \"Request:\",  1,  \"\
    Loading\"\nlogRequestState(0); // ✅ Logs: \"Request:\",  0,  \"NotStarted\"\n\
    logRequestState(55); // ❌ Argument of type '55' is not assignable to parameter\
    \ \n➥of type 'RequestState'.\n```\n\nTypeScript 现在能更好地强制执行枚举中设定的类型。以下代码在 TypeScript\
    \ 4.9.5 中可以编译，但在 TypeScript 5.0 及更高版本中*不会*。需要提醒的是：如果我们尝试动态计算数字，TypeScript 就无法提供如此有用的帮助。例如，`logRequestState(3\
    \ + 2)` *不会*生成错误：\n\n```\nenum Letters {\n  A = 'Aye!',\n  B = 'Bee!',\n  C =\
    \ 'Sea!',\n}\n\nenum Numbers {\n  one = 1,\n  two = 2,\n  three = Letters.C,\n\
    }\n\nconst n: number = Numbers.three;\n```\n\n如你所见，`Numbers.three` 从技术上讲是一个字母，应该允许被赋值给一个数字。TypeScript\
    \ 5.0 确保了这种行为符合预期。话虽如此，这是一个破坏性变更，可能需要我们重新审视我们的代码。\n\n以前，我倾向于使用联合类型而非枚举。新的行为应该能与现有代码良好协作，并且比之前的实现提供更高的安全性。枚举和联合类型都是定义一组值的有效方式，现在的选择归结为我们的偏好。\n\
    \n## 结论\n\nTypeScript 5.0 在语言的用户友好性和灵活性方面是一次重大进步。它引导我们采用更好的编码实践，促进更简洁的代码，并在潜在错误成为麻烦之前将其捕获。TypeScript\
    \ 团队持续为该语言添加重要功能和生活质量改进。显然，这次的变更范围较小，但 [TypeScript 5.1](https://www.typescriptlang.org/docs/handbook/release-notes/typescript-5-1.html)\
    \ 已添加了额外功能，例如为返回 `undefined` 的函数提供更便捷的隐式返回。\n\n对我而言，TypeScript 对于我维护和修改大型代码库的信心至关重要。我经常发现编译器能捕获我原本会遗漏的边缘情况，而这些情况可能会在不恰当的时间让我的寻呼机响起。我个人很期待看到这门语言在未来几年的演进——尤其是如果当前的更新节奏得以持续的话。\n\
    \n"
