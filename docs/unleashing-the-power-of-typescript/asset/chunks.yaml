    \n# Chapter 2: A Gentle Introduction to Generics in TypeScript\n\nIf you’ve come\
    \ from a language with a type system, you might already be familiar with [generics](https://www.typescriptlang.org/docs/handbook/2/generics.html).\
    \ But if you’re like me and your experience consists predominately of dynamic\
    \ languages like JavaScript, Python, or Ruby, generics might seem a bit bewildering\
    \ at first. I’m certainly guilty of just copying and pasting examples without\
    \ fully understanding what’s going on. But fear not! Generics are both powerful\
    \ and also fairly simple once we understand them. Let’s start at the basics and\
    \ build up from there, as we work towards a full understanding what generics are\
    \ and how we can use them in our TypeScript code.\n\nIn short, a **generic** in\
    \ TypeScript allows us to write reusable code that works with more than one type.\
    \ Generics act as placeholders for types, letting us write code that can adapt\
    \ and enforce type consistency at compile time. It’s not wrong to think of generics\
    \ as variables, but just for our types.\n\n#### Following Along with This Tutorial\n\
    \nAll of the code that we’ll be working with can be found in [this GitHub repository](https://github.com/stevekinney/sitepoint-generics).\
    \ I also encourage you to use the [TypeScript Playground](https://www.typescriptlang.org/play)\
    \ to try out ideas and play with the examples below.\n\n## What Are Generics?\n\
    \n**Generics** in TypeScript offer a means for creating reusable code components\
    \ that work with a variety of types (rather than just one). As I mentioned, we\
    \ can think of them as variables—but for our types. Generics provide a way to\
    \ create flexible structures that allow us to define the type at a later time.\n\
    \nLet’s start with a simple [linked list](https://en.wikipedia.org/wiki/Linked_list).\
    \ A **linked list** node contains a value and then a link to the next node. We\
    \ could start out with something link this:\n\n```\ntype LinkedListNode = {\n\
    \  value: any;\n  next?: LinkedListNode;\n};\n```\n\nHowever, I’m going to add\
    \ an extra requirement. All of the nodes in the list should be of the same type.\
    \ For example, if we wanted a linked list of strings, we could refine our type\
    \ to make sure that value is always a string:\n\n```\ntype LinkedListNode = {\n\
    \  value: string;\n  next?: LinkedListNode;\n};\n\nconst firstNode: LinkedListNode\
    \ = {\n  value: 'first',\n};\n\nconst secondNode: LinkedListNode = {\n  value:\
    \ 'second',\n};\n\nfirstNode.next = secondNode;\n```\n\n#### Repo Code\n\nYou\
    \ can find the code above (`01-without-generics.ts`) in [the GitHub repo for this\
    \ tutorial](https://github.com/stevekinney/sitepoint-generics/blob/main/src/01-without-generics.ts).\n\
    \nYou might have already noticed the problem here. If we wanted to also support\
    \ a linked list of numbers, we’d have to create another type, and so on for every\
    \ single type of value we wanted our linked list to support. This is tedious,\
    \ and it doesn’t scale.\n\nThis is where generics come in. They let us define\
    \ a placeholder that we can use in our types. If we wanted to have a linked list\
    \ node, where the value could be any type, but that would ensure all of the later\
    \ nodes were also of the *same* type, we could write something along these lines:\n\
    ```"
