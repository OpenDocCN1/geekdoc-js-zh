    \n## Using Generics with Classes\n\nWe can also use generics with classes. The\
    \ interesting feature in this case is that the value of `T` can be used throughout\
    \ the class. Once it’s been set, it will enforce our type throughout all of its\
    \ methods, and each individual instance of the class can have its own value for\
    \ `T`. Here’s an example:\n\n```\nexport class LinkedListNode<T> {\n  value: T;\n\
    \  next?: LinkedListNode<T>;\n\n  constructor(value: T) {\n    this.value = value;\n\
    \  }\n\n  add(value: T): LinkedListNode<T> {\n    this.next = new LinkedListNode(value);\n\
    \    return this.next;\n  }\n}\n```\n\n#### Repo Code\n\nYou can find the code\
    \ above (`06-with-classes`) in [the GitHub repo for this tutorial](https://github.com/stevekinney/sitepoint-generics/blob/main/src/06-with-classes.ts).\n\
    \nNow we can create multiple instances where `T` is correctly enforced for that\
    \ particular instance:\n\n```\nconst firstNode = new LinkedListNode('first');\n\
    const secondNode = firstNode.add('second');\nconst thirdNode = new LinkedListNode(42);\n\
    const fourthNode = thirdNode.add(17);\n```\n\nYou can verify this in the unit\
    \ tests found [here](https://github.com/stevekinney/sitepoint-generics/blob/main/src/06-with-classes.test.ts).\n\
    \n## Conclusion\n\nI prefer to use types, but we can just as easily use generics\
    \ with interfaces as well:\n\n```\ninterface LinkedListNode<T> {\n  value: T;\n\
    \  next?: LinkedListNode<T>;\n}\n```\n\nGenerics are a powerful tool in TypeScript\
    \ that allow us to create reusable code components that work with a variety of\
    \ types, rather than just one. They provide a way to build flexible interfaces\
    \ that enable us to define the type at a later time. Generics can be used with\
    \ objects, functions, and classes. They can be extended or limited to specific\
    \ types, and TypeScript can even infer the type for us in some cases.\n\nWhile\
    \ they may seem daunting at first, generics are fairly simple once you understand\
    \ them. With a little practice, you’ll be able to use generics to write more efficient\
    \ and effective code in no time flat.\n\n# Chapter 3: Navigating the Perils and\
    \ Pitfalls of Using React’s Context API with TypeScript\n\nUsing TypeScript in\
    \ any large React application provides a level of safety that’s worth the additional\
    \ effort over using JavaScript. TypeScript is able to comb through all of our\
    \ components and confirm that we’re passing in all the props each component requires,\
    \ and it makes sure sure they’re actually the types we assume they are and not\
    \ something nefarious like `undefined`. But there are some cases where even that\
    \ trade-off is thrown into question—particularly when it comes to using the Context\
    \ API. Let’s look at how to navigate some of the challenges of using `createContext`\
    \ and `useContext` with TypeScript.\n\nI’m going to assume you’re familiar with\
    \ the Context API, but let’s do a quick summary anyway. [The Context API in React\
    \ is a built-in state management tool](https://react.dev/learn/passing-data-deeply-with-context)\
    \ that allows for easy sharing of data throughout a component tree. It enables\
    \ us to avoid **[prop drilling](https://www.sitepoint.com/replace-redux-react-hooks-context-api/)**,\
    \ the process of passing data from top to bottom through intermediate components.\n\
    \nWith the Context API, we create a `Context` object that has two properties:\
    \ a `Provider` component—which is used to wrap the part of the component tree\
    \ of our application that needs access to our data—and a `Consumer` component\
    \ for reading that data.\n\nThese days, we often don’t use the `Consumer` directly,\
    \ instead using the `useContext` hook to access the context’s value, regardless\
    \ of the level of each in the component hierarchy. The `useContext` hook is a\
    \ much cleaner abstraction than trying to access the value from the `Consumer`\
    \ in a render prop. This makes state and function sharing between components way\
    \ more convenient and efficient, especially in larger applications. In fact, [the\
    \ React documentation](https://react.dev/reference/react/createContext#returns)\
    \ goes as far as to [mention](https://react.dev/reference/react/createContext#returns)\
    \ that the `Consumer` is “an alternative and rarely used way to read the context\
    \ value.”\n\n![A screenshot of the color picker application that we’ll work on](Images/colors-screenshot.png)\n\
    \nWe’re going to work on a simple color picker application (pictured above) that\
    \ uses the Context API to share the ability to get and set the color throughout\
    \ the component hierarchy.\n\n#### Following Along with This Tutorial\n\nAll of\
    \ the code that we’ll be working with can be found in [this GitHub repository](https://github.com/stevekinney/sitepoint-context).\
    \ I’ll start on the `main` branch and then make additional branches at each milestone.\n\
    \n## The Fundamental Problem\n\nThe core issue that’s going to be a thorn in our\
    \ side is not necessarily a TypeScript problem. It’s a React problem:\n\n*   When\
    \ we call `React.createContext`, TypeScript will want to know what kind of value\
    \ we can expect.\n\n*   But we don’t have that value yet, because we have to wait\
    \ for the `Provider` component to mount in order to use `useState`.\n\n*   TypeScript\
    \ will take issue with the fact that we’re passing it something that isn’t what\
    \ it expects.\n\n*   If we say that it can be a color *or* `undefined`, TypeScript\
    \ will never be sure which one it’s working with.\n\nWe’ll look at a few approaches—such\
    \ as using `any` or `undefined`—which will work, but which will have some trade-offs—before\
    \ we land on a better (though more involved) solution.\n\n## A Rejected Solution:\
    \ Use `any`\n\n```\n// We don't have access to `hexColor` outside of `ColorProvider`.\n\
    // So we'll use `null` for now.\nexport const ColorContext = createContext<any>(null);\n\
    \nexport const ColorProvider = ({ children }: PropsWithChildren) => {\n  const\
    \ [hexColor, setHexColor] = useState('#e56e24');\n\n  return (\n    <ColorContext.Provider\
    \ value={{ hexColor, setHexColor }}>\n      {children}\n    </ColorContext.Provider>\n\
    \  );\n};\n```"
