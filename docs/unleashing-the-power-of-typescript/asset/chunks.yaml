    \       </div>\n     </main>\n```\n\n#### Repo Code\n\nYou can find the changes\
    \ above in [the `button` branch of the GitHub repo for this tutorial](https://github.com/stevekinney/polymorphic/tree/button).\n\
    \n### Creating Composite Components\n\nAnother common component that I typically\
    \ end up making for myself is a component that correctly wires up a label and\
    \ input element with the correct `for` and `id` attributes respectively. I tend\
    \ to grow weary typing this out over and over:\n\n```\n<label htmlFor=\"set-count\"\
    >Set Count</label>\n<input type=\"number\" id=\"set-count\" name=\"set-count\"\
    \ />\n```\n\nWithout extending the props of an HTML element, I might end up slowly\
    \ adding props as needed:\n\n```\ntype LabeledInputProps = {\n  id?: string;\n\
    \  label: string;\n  value: string | number;\n  type?: string;\n  className?:\
    \ string;\n  onChange?: ChangeEventHandler<HTMLInputElement>;\n};\n```\n\nAs we\
    \ saw with the button, we can refactor it in a similar fashion:\n\n```\ntype LabeledInputProps\
    \ = React.ComponentProps<'input'> & {\n  label: string;\n};\n```\n\nOther than\
    \ `label`, which we’re passing to the (uhh) label that we’ll often want grouped\
    \ with our inputs, we’re manually passing props through one by one. Do we want\
    \ to add `autofocus`? Better add another prop. It would be better to do something\
    \ like this:\n\n```\nimport { ComponentProps } from 'react';\n\ntype LabeledInputProps\
    \ = ComponentProps<'input'> & {\n  label: string;\n};\n\nconst LabeledInput =\
    \ ({ id, label, ...props }: LabeledInputProps) => {\n  return (\n    <>\n    \
    \  <label htmlFor={id}>{label}</label>\n      <input {...props} id={id} readOnly={!props.onChange}\
    \ />\n    </>\n  );\n};\n\nexport default LabeledInput;\n```\n\nWe can swap in\
    \ our new component in `src/application.tsx`:\n\n```\n<LabeledInput\n  id=\"set-count\"\
    \n  label=\"Set Count\"\n  type=\"number\"\n  onChange={(e) => setValue(e.target.valueAsNumber)}\n\
    \  value={value}\n/>\n```\n\nWe can pull out the things we need to work with and\
    \ then just pass everything else on through to the `<input />` component, and\
    \ then just pretend for the rest of our days that it’s a standard `HTMLInputElement`.\n\
    \nTypeScript doesn’t care, since `HTMLElement` is pretty flexible, as the DOM\
    \ pre-dates TypeScript. It only complains if we toss something completely egregious\
    \ in there.\n\n#### Repo Code\n\nYou can see all of the changes above in [the\
    \ `input` branch of the GitHub repo for this tutorial](https://github.com/stevekinney/polymorphic/tree/input).\n\
    \n## Polymorphic Components\n\nEarlier, I told you that, over the course of building\
    \ out a large application, I tend to end up making a few wrappers around components.\
    \ `Box` is a primitive wrapper around the basic block elements in HTML (such as\
    \ `<div>`, `<aside>`, `<section>`, `<article>`, `<main>`, `<head>`, and so on).\
    \ But just as we don’t want to lose all the semantic meaning we get from these\
    \ tags, we also don’t need multiple variations of `Box` that are all basically\
    \ the same. What we’d like to is use `Box` but also be able to specify what it\
    \ ought to be under the hood.\n\nHere’s an overly simplified take on a `Box` element\
    \ inspired by [Styled Components](https://medium.com/styled-components/announcing-styled-components-v4-better-faster-stronger-3fe1aba1a112).\n\
    \nAnd here’s an example of a `Box` component from [Paste](https://paste.twilio.design/primitives/box),\
    \ [Twilio’s](https://twilio.com) design system:\n\n```\n<Box as=\"article\" backgroundColor=\"\
    colorBackgroundBody\" padding=\"space60\">\n  Parent box on the hill side\n  <Box\n\
    \    backgroundColor=\"colorBackgroundSuccessWeakest\"\n    display=\"inline-block\"\
    \n    padding=\"space40\"\n  >\n    nested box 1 made out of ticky tacky\n  </Box>\n\
    </Box>\n```\n\nHere’s a simple implementation that doesn’t have any pass through\
    \ any of the props, like we did with `Button` and `LabelledInputProps` above:\n\
    \n```\nimport { PropsWithChildren } from 'react';\n\ntype BoxProps = PropsWithChildren<{\n\
    \  as: 'div' | 'section' | 'article' | 'p';\n}>;\n\nconst Box = ({ as, children\
    \ }: BoxProps) => {\n  const TagName = as || 'div';\n  return <TagName>{children}</TagName>;\n\
    };\n\nexport default Box;\n```"
  trans: "\n但我们遇到了一个新问题。或者更准确地说，我们*之前*在 JavaScript 示例中就*也*存在一个被我们忽略的问题。如果有人使用我们新的\
    \ `Button` 组件并传入一个 `className` 属性，它会覆盖我们的 `className`。我们可以（也将会）稍后添加一些代码来处理这个问题，但我不想错过这个机会，向你展示如何在\
    \ TypeScript 中使用工具类型来表达“我想要使用一个 HTML 按钮的*所有*属性，*除了*一个（或多个）”：\n\n```typescript\n\
    type ButtonProps = Omit<React.ComponentProps<'button'>, 'className'>;\n\nconst\
    \ Button = (props: ButtonProps) => {\n  return <button className=\"button\" {...props}\
    \ />;\n};\n```\n\n现在，TypeScript 会阻止我们或其他人向我们的 `Button` 组件传入 `className` 属性。如果我们只是想将传入的类名添加到类列表中，我们可以通过几种不同的方式来实现。我们可以直接将其追加到列表中：\n\
    \n```typescript\ntype ButtonProps = React.ComponentProps<'button'>;\n\nconst Button\
    \ = (props: ButtonProps) => {\n  const className = 'button ' + props.className;\n\
    \n  return <button className={className.trim()} {...props} />;\n};\n```\n\n在处理类名时，我喜欢使用\
    \ [clsx](https://npm.im/clsx) 库，因为它能为我们处理大多数这类事情：\n\n```typescript\nimport React\
    \ from 'react';\nimport clsx from 'clsx';\n\ntype ButtonProps = React.ComponentProps<'button'>;\n\
    \nconst Button = ({ className, ...props }: ButtonProps) => {\n  return <button\
    \ className={clsx('button', className)} {...props} />;\n};\n\nexport default Button;\n\
    ```\n\n我们学习了如何限制组件将接受的属性。要扩展属性，我们可以使用[交叉类型](https://www.typescriptlang.org/docs/handbook/2/objects.html#intersection-types)：\n\
