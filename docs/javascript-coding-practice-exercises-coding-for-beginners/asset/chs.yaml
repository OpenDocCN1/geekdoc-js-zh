  ```javascript\nfunction string_reverse(str)\n{\n  return str.reverse\n```\n\n\n\n\
  \n## 计算长度为 3 的整数数组三个元素之和的 JavaScript 程序\n\n### JAVASCRIPT 代码\n```javascript\nfunction\
  \ sum_three(nums) {\n  return nums[0] + nums[1] + nums[2];\n}\nconsole.log(sum_three([10,\
  \ 32, 20])); \nconsole.log(sum_three([5, 7, 9]));\nconsole.log(sum_three([0, 8,\
  \ -11]));\n```\n\n### 输出:\n62\n21\n-3\n\n## 相加两个数字\n\n 针对一个给定的正整数\n\n### 长度为二\n\n\
  ### HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\"\
  >\n  <meta name=\"viewport\" content=\"width=device-width\">\n  <title>计算给定两位正整数两个数字之和的\
  \ JavaScript 程序。</title>\n</head>\n<body>\n</body>\n</html>\n```\n\n### JAVASCRIPT\
  \ 代码\n```javascript\nfunction add_two_digits(n) {\n  return n % 10 + Math.floor(n\
  \ / 10);\n}\nconsole.log(add_two_digits(25))\nconsole.log(add_two_digits(50))\n\
  ```\n\n### 输出:\n7\n5\n\n## 检查给定年份是否为闰年\n\n### HTML 代码\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n  <meta charset=utf-8 />\n  <title>查找闰年</title>\n</head>\n<body>\n\
  </body>\n</html>\n```\n\n### JAVASCRIPT 代码\n```javascript\nfunction leapyear(year)\
  \ {\n  return (year % 100 === 0) ? (year % 400 === 0) : (year % 4 === 0);\n}\nconsole.log(leapyear(2016));\n\
  console.log(leapyear(2000));\nconsole.log(leapyear(1700));\nconsole.log(leapyear(1800));\n\
  console.log(leapyear(100));\n```\n\n### 输出\ntrue\ntrue\nfalse\nfalse\nfalse\n\n\
  ## 检查给定的正数\n\n### 3 的倍数或 7 的倍数\n\n### HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width\"\
  >\n  <title>检查给定的正整数是否为 3 的倍数或 7 的倍数的 JavaScript 程序。</title>\n</head>\n<body>\n\
  </body>\n</html>\n```\n\n### JAVASCRIPT 代码\n```javascript\nfunction test37(x) {\n\
  \  if (x % 3 == 0 || x % 7 == 0) {\n    return true;\n  }\n  else {\n    return\
  \ false;\n  }\n}\nconsole.log(test37(12));\nconsole.log(test37(14));\nconsole.log(test37(10));\n\
  console.log(test37(11))\n```\n\n### 输出:\ntrue\ntrue\nfalse\nfalse\n\n## 检查字符串是否以\
  \ 'Java' 开头\n\n### 否则为 false\n\n### HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width\"\
  >\n  <title>检查字符串是否以 'Java' 开头否则为 false 的 JavaScript 程序。</title>\n</head>\n<body>\n\
  </body>\n</html>\n```\n\n### JAVASCRIPT 代码\n```javascript\nfunction start_spec_str(str)\
  \ {\n  if (str.length < 4) {\n    return false;\n  }\n  front = str.substring(0,\
  \ 4);\n  if (front == 'Java') {\n    return true;\n  }\n  else {\n    return false;\n\
  \  }\n}\nconsole.log(start_spec_str(\"JavaScript\"));\nconsole.log(start_spec_str(\"\
  Java\"));\nconsole.log(start_spec_str(\"Python\"))\n```\n\n### 输出:\ntrue\ntrue\n\
  false\n\n## 检查两个给定的整数\n\n 在 50..99 范围内\n\n### HTML 代码\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"\
  width=device-width\">\n  <title>检查给定的整数是否在 50..99 范围内（包含边界）。如果其中任意一个在范围内，则返回 true。</title>\n\
  </head>\n<body>\n</body>\n</html>\n```\n\n### JAVASCRIPT 代码\n```javascript\nfunction\
  \ check_numbers(x, y) {\n  if ((x >= 50 && x <= 99) || (y >= 50 && y <= 99)) {\n\
  \    return true;\n  }\n  else {\n    return false;\n  }\n}\nconsole.log(check_numbers(12,\
  \ 101));\nconsole.log(check_numbers(52, 80));\nconsole.log(check_numbers(15, 99));\n\
  ```\n\n### 输出\nfalse\ntrue\ntrue\n\n## 查找距离 100 最近的值\n\n### HTML 代码\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"\
  width=device-width\">\n  <title>从两个不同的整数中找到距离 100 最近值的 JavaScript 程序。</title>\n\
  </head>\n<body>\n</body>\n</html>\n```\n\n### JAVASCRIPT 代码\n```javascript\nfunction\
  \ near_100(x, y) {\n  if (x != y) {\n    x1 = Math.abs(x - 100);\n    y1 = Math.abs(y\
  \ - 100);\n    if (x1 < y1) {\n      return x;\n    }\n    if (y1 < x1) {\n    \
  \  return y;\n    }\n    return 0;\n  }\n  else {\n    return false;\n  }\n}\nconsole.log(near_100(90,\
  \ 89));\nconsole.log(near_100(-90, -89));\nconsole.log(near_100(90, 90));\n```\n\
  \n### 输出:\n90\n-89\nfalse\n\n"
