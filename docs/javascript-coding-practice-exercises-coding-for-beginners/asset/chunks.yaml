    \ of length 3.\n\n### JAVASCRIPT CODE\n```javascript\nfunction sum_three(nums)\
    \ {\n  return nums[0] + nums[1] + nums[2];\n}\nconsole.log(sum_three([10, 32,\
    \ 20])); \nconsole.log(sum_three([5, 7, 9]));\nconsole.log(sum_three([0, 8, -11]));\n\
    ```\n\n### Output:\n62\n21\n-3\n\n# Add two digits\n\n Of a given positive integer\n\
    \n## Of length two\n\n### HTML CODE\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width\"\
    >\n  <title>JavaScript program to add two digits of a given positive integer of\
    \ length two.</title>\n</head>\n<body>\n</body>\n</html>\n```\n\n### JAVASCRIPT\
    \ CODE\n```javascript\nfunction add_two_digits(n) {\n  return n % 10 + Math.floor(n\
    \ / 10);\n}\nconsole.log(add_two_digits(25))\nconsole.log(add_two_digits(50))\n\
    ```\n\n### Output:\n7\n5\n\n# Check whether a given year is a leap\n\n### HTML\
    \ CODE\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=utf-8 />\n \
    \ <title>Find Leap Year</title>\n</head>\n<body>\n</body>\n</html>\n```\n\n###\
    \ JAVASCRIPT CODE\n```javascript\nfunction leapyear(year) {\n  return (year %\
    \ 100 === 0) ? (year % 400 === 0) : (year % 4 === 0);\n}\nconsole.log(leapyear(2016));\n\
    console.log(leapyear(2000));\nconsole.log(leapyear(1700));\nconsole.log(leapyear(1800));\n\
    console.log(leapyear(100));\n```\n\n### OUTPUT\ntrue\ntrue\nfalse\nfalse\nfalse\n\
    \n# Check given positive number\n\n## Multiple of 3 or a multiple of 7\n\n###\
    \ HTML CODE\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\"\
    >\n  <meta name=\"viewport\" content=\"width=device-width\">\n  <title>JavaScript\
    \ program to check whether a given positive number is a multiple of 3 or a multiple\
    \ of 7\\. </title>\n</head>\n<body>\n</body>\n</html>\n```\n\n### JAVASCRIPT CODE\n\
    ```javascript\nfunction test37(x) {\n  if (x % 3 == 0 || x % 7 == 0) {\n    return\
    \ true;\n  }\n  else {\n    return false;\n  }\n}\nconsole.log(test37(12));\n\
    console.log(test37(14));\nconsole.log(test37(10));\nconsole.log(test37(11))\n\
    ```\n\n### Output:\ntrue\ntrue\nfalse\nfalse\n\n# Check a string starts with 'Java'\n\
    \n## And false otherwise\n\n### HTML CODE\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width\"\
    >\n  <title>JavaScript program to check whether a string starts with 'Java' and\
    \ false otherwise.</title>\n</head>\n<body>\n</body>\n</html>\n```\n\n### JAVASCRIPT\
    \ CODE\n```javascript\nfunction start_spec_str(str) {\n  if (str.length < 4) {\n\
    \    return false;\n  }\n  front = str.substring(0, 4);\n  if (front == 'Java')\
    \ {\n    return true;\n  }\n  else {\n    return false;\n  }\n}\nconsole.log(start_spec_str(\"\
    JavaScript\"));\nconsole.log(start_spec_str(\"Java\"));\nconsole.log(start_spec_str(\"\
    Python\"))\n```\n\n### Output:\ntrue\ntrue\nfalse\n\n# Check two given integer\
    \ values\n\n## In the range 50..99\n\n### HTML CODE\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"\
    width=device-width\">\n  <title>JavaScript program to check whether given integer\
    \ values are in the range 50..99 (inclusive). Return true if either of them are\
    \ in the said range.</title>\n</head>\n<body>\n</body>\n</html>\n```\n\n### JAVASCRIPT\
    \ CODE\n```javascript\nfunction check_numbers(x, y) {\n  if ((x >= 50 && x <=\
    \ 99) || (y >= 50 && y <= 99)) {\n    return true;\n  }\n  else {\n    return\
    \ false;\n  }\n}\nconsole.log(check_numbers(12, 101));\nconsole.log(check_numbers(52,\
    \ 80));\nconsole.log(check_numbers(15, 99));\n```\n\n### OUTPUT\nfalse\ntrue\n\
    true\n\n# Find a value which is nearest to 100\n\n### HTML CODE\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\"\
    \ content=\"width=device-width\">\n  <title>JavaScript program to find a value\
    \ which is nearest to 100 from two different integer values.</title>\n</head>\n\
    <body>\n</body>\n</html>\n```\n\n### JAVASCRIPT CODE\n```javascript\nfunction\
    \ near_100(x, y) {\n  if (x != y) {\n    x1 = Math.abs(x - 100);\n    y1 = Math.abs(y\
    \ - 100);\n    if (x1 < y1) {\n      return x;\n    }\n    if (y1 < x1) {\n  \
    \    return y;\n    }\n    return 0;\n  }\n  else {\n    return false;\n  }\n\
    }\nconsole.log(near_100(90, 89));\nconsole.log(near_100(-90, -89));\nconsole.log(near_100(90,\
    \ 90));\n```\n\n### Output:\n90\n-89\nfalse\n"
