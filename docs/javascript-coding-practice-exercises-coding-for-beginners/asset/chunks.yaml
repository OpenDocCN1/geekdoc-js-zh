- fmt: "\n![](cover.jpeg)\n\n# JAVASCRIPT: CODING PRACTICE EXERCISES\n## CODING FOR\
    \ BEGINNERS\nJJ TAM\n\n## Table of Contents\n- [JavaScript: Find the first not\
    \ repeated character]\n- [JavaScript: Find the longest word within a string]\n\
    - [JavaScript: Counts the number of vowels within a string]\n- [JavaScript: Check\
    \ a number is prime or not]\n- [JavaScript: Get the data type]\n- [JavaScript:\
    \ Find the second lowest and second greatest from an array\n- [Calculate multiplication\
