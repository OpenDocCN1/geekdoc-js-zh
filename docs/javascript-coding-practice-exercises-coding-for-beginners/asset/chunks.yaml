    \ two strings]\n- [Move last three character]\n- [Compute the sum]\n- [Add two\
    \ digits]\n- [Check whether a given year is a leap]\n- [Check given positive number]\n\
    - [Check a string starts with 'Java']\n- [Check two given integer values]\n- [Find\
    \ a value which is nearest to 100]\n\n# JavaScript functions – Exercises\n\n##\
    \ JavaScript: Find the first not repeated character\nSample arguments: `'abacddbec'`\n\
    Expected output: `'e'`\n\n### HTML CODE\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <meta charset=\"utf-8\">\n  <title>find the first not repeated character.</title>\n\
    </head>\n<body>\n</body>\n</html>\n```\n\n### JAVASCRIPT CODE\n```javascript\n\
    function find_FirstNotRepeatedChar(str) {\n  var arra1 = str.split('');\n  var\
    \ result = '';\n  var ctr = 0;\n  for (var x = 0; x < arra1.length; x++) {\n \
    \   ctr = 0;\n    for (var y = 0; y < arra1.length; y++) {\n      if (arra1[x]\
    \ === arra1[y]) {\n        ctr+= 1;\n      }\n    }\n    if (ctr < 2) {\n    \
    \  result = arra1[x];\n      break;\n    }\n  }\n  return result;\n}\nconsole.log(find_FirstNotRepeatedChar('abacddbec'));\n\
    ```\n\n### OUTPUT\n`e`\n\n### FLOWCHART\n![](OEBPS/Image00000.jpg)\n\n# JavaScript:\
    \ Find the longest word within a string\nExample string: `'Web Development Tutorial'`\n\
    Expected Output: `'Development'`\n\n### HTML CODE\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<meta charset=utf-8 />\n<title>Find the longest word within a\
    \ string</title>\n</head>\n<body>\n</body>\n</html>\n```\n\n### JAVASCRIPT CODE\n\
    ```javascript\nfunction find_longest_word(str) {\n  var array1 = str.match(/\\\
    w[a-z]{0,}/gi);\n  var result = array1[0];\n  for(var x = 1 ; x < array1.length\
    \ ; x++) {\n    if(result.length < array1[x].length) {\n      result = array1[x];\n\
    \    }\n  }\n  return result;\n}\nconsole.log(find_longest_word('Web Development\
    \ Tutorial'));\n```\n\n### OUTPUT\n`Development`\n\n### EXPLANATION\nAssume `str`\
    \ equals `'Web Development Tutorial'`. When a string is matched against a regular\
    \ expression, the `match()` method is used to obtain matches. As result of `str.match(/w[a-z]{0,}/gi)`,\
    \ `[\"Web\", \"Development\", \"Tutorial\"]` is returned. The `for` loop compares\
    \ the `length` of each array element to the previous one and returns the longest\
    \ string. The `length` property is an integer that is always greater than the\
    \ array's index.\nSyntax: `arr.length`\n\n### FLOWCHART\n![](OEBPS/Image0001.jpg)\n\
    \n# JavaScript: Counts the number of vowels within a string\nExample string: `'The\
    \ quick fox'`\nExpected Output: `5`\n\n### HTML CODE\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<meta charset=utf-8 />\n<title>Counts the number of vowels within\
    \ a string</title>\n</head>\n<body>\n</body>\n</html>\n```\n\n### JAVASCRIPT CODE\n\
    ```javascript\nfunction vowel_count(str1) {\n  var vowel_list = 'aeiouIOU';\n\
    \  var vcount = 0;\n  for(var x = 0; x < str1.length; x++) {\n    if (vowel_list.indexOf(str1[x])\
    \ !== -1) {\n      vcount += 1;\n    }\n  }\n  return vcount;\n}\nconsole.log(vowel_count(\"\
    The quick fox\"));\n```\n\n### OUTPUT\n`5`\n\n### EXPLANATION\nThe `indexOf()`\
    \ method returns the first occurrence of the defined value within the calling\
    \ String object, starting at `fromIndex`. If the value cannot be found, it returns\
    \ `-1`.\nSyntax: `str.indexOf(searchValue[, fromIndex])`\nParameters:\n- `searchValue`:\
    \ A string that represents the value to sought.\n- `fromIndex` (Optional): The\
    \ index at which the string's search should begin. Any integer can be used.\n\
    If the condition `vowel_list.indexOf(str1[x])!== -1` is met, the character(s)\
    \ of the string will be counted as vowels.\n\n### FLOWCHART\n![](OEBPS/Image0002.jpg)\n\
    \n# JavaScript: Check a number is prime or not\n![](OEBPS/Image0003.jpg)\n\n###\
    \ HTML CODE\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=utf-8 />\n\
    <title>Check a number is prime or not</title>\n</head>\n<body>\n</body>\n</html>\n\
    ```\n\n### JAVASCRIPT CODE\n```javascript\nfunction test_prime(n) {\n  if (n===1)\
    \ {\n    return false;\n  } else if(n === 2) {\n    return true;\n  }else {\n\
    \    for(var x = 2; x < n; x++) {\n      if(n % x === 0) {\n        return false;\n\
    \      }\n    }\n    return true;\n  }\n}\nconsole.log(test_prime(37));\n```\n\
    \n### OUTPUT\n`True`\n\nFLOWCHART\n![](OEBPS/Image0004.jpg)\n\n# JavaScript: Get\
    \ the data type\nWe going to Create a JavaScript function which takes an argument\
    \ and returns the type.\nNote six possible values: object, boolean, number, string,\
    \ or undefined.\n\n### HTML CODE\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta\
    \ charset=utf-8 />\n<title>Detect JavaScript Data Types</title>\n</head>\n<body>\n\
    </body>\n</html>\n```\n\n### JAVASCRIPT CODE\n```javascript\nfunction detect_data_type(value)\
    \ {\n  var dtypes = [Function, RegExp, Number, String, Boolean, Object], x, len;\n\
    \  if (typeof value === \"object\" || typeof value === \"function\") {\n    for\
    \ (x = 0, len = dtypes.length; x < len; x++) {\n      if (value instanceof dtypes[x])\
    \ {\n        return dtypes[x];\n      }\n    }\n  }\n  return typeof value;\n\
    }\nconsole.log(detect_data_type(12));\nconsole.log(detect_data_type('w3resource'));\n\
    console.log(detect_data_type(false));\n```\n\n### OUTPUT\n`number`\n`string`\n\
    `Boolean`\n\n# JavaScript: Find the second lowest and second greatest from an\
    \ array\n![](OEBPS/Image0005.jpg)\n\n### HTML CODE\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<meta charset=utf-8 />\n<title>Find the second lowest and second\
    \ greatest numbers from an array</title>\n</head>\n<body>\n</body>\n</html>\n\
    ```\n\n### JAVASCRIPT CODE\n```javascript\nfunction Second_Greatest_Lowest(arr_num)\
    \ {\n  arr_num.sort(function(x,y) {\n    return x-y;\n  });\n  var uniqa = [arr_num[0]];\n\
    \  var result = [];\n  for(var j=1; j < arr_num.length; j++) {\n    if(arr_num[j-1]\
    \ !== arr_num[j]) {\n      uniqa.push(arr_num[j]);\n    }\n  }\n  result.push(uniqa[1],uniqa[uniqa.length-2]);\n\
    \  return result.join(',');\n}\nconsole.log(Second_Greatest_Lowest([1,2,3,4,5]));\n\
    ```\n\n#### OUTPUT\n`2,4`\n"
