    >\n    body {margin: 30px;}\n  </style>\n</head>\n<body>\n<form>\n  第一个数字： <input\
    \ type=\"text\" id=\"firstNumber\" /><br>\n  第二个数字： <input type=\"text\" id=\"\
    secondNumber\" /><br>\n  <input type=\"button\" onClick=\"multiplyBy()\" Value=\"\
    乘法\" />\n  <input type=\"button\" onClick=\"divideBy()\" Value=\"除法\" />\n</form>\n\
    <p>结果为： <br>\n  <span id = \"result\"></span\n</p>\n</body>\n</html>\n```\n\n\
    ### JAVASCRIPT 代码\n```javascript\nfunction multiplyBy()\n{\n    num1 = document.getElementById(\"\
    firstNumber\").value;\n    num2 = document.getElementById(\"secondNumber\").value;\n\
    \    document.getElementById(\"result\").innerHTML = num1 * num2;\n}\nfunction\
    \ divideBy()\n{\n    num1 = document.getElementById(\"firstNumber\").value;\n\
    \    num2 = document.getElementById(\"secondNumber\").value;\n    document.getElementById(\"\
    result\").innerHTML = num1 / num2;\n}\n```\n\n### 解析\n\n`document.getElementById(id).value`:\
    \ 文本字段的 `value` 属性用于设置或返回 `value` 属性的值。\n\n`document.getElementById(\"result\"\
    ).innerHTML`: 元素的 `innerHTML` 属性用于设置或返回 HTML 内容（内部 HTML）。\n\n#### 输出\n\n![](img/Image00007.jpg)\n\
    \n# 温度转换\n\n## 在 JAVASCRIPT 中摄氏度和华氏度之间转换\n\n### HTML 代码\n```html\n<!DOCTYPE html>\n\
    <html>\n  <head>\n  <meta charset=\"utf-8\">\n  <title>编写一个 JavaScript 程序将温度在摄氏度和华氏度之间进行转换</title>\n\
    \  </head>\n  <body>\n</</body>>\n  </html>\n```\n\n### JAVASCRIPT 代码\n```javascript\n\
    function cToF(celsius)\n{\n  var cTemp = celsius;\n  var cToFahr = cTemp * 9 /\
    \ 5 + 32;\n  var message = cTemp+'\\xB0C is ' + cToFahr + ' \\xB0F.';\n    console.log(message);\n\
    }\nfunction fToC(fahrenheit)\n{\n  var fTemp = fahrenheit;\n  var fToCel = (fTemp\
    \ - 32) * 5 / 9;\n  var message = fTemp+'\\xB0F is ' + fToCel + '\\xB0C.';\n \
    \ console.log(message);\n}\ncToF(60);\nfToC(45);\n```\n\n### 输出\n60°C 是 140 °F。\n\
    45°F 是 7.22222222222222°C。\n\n### 解析\n可以使用以下公式进行精确转换（华氏度转摄氏度 / 摄氏度转华氏度）：\n华氏度转摄氏度：`(F\
    \ − 32) ÷ 1.8 = °C`\n摄氏度转华氏度：`(C × 1.8) + 32 = °F`\n以下是摄氏度与华氏度之间的粗略转换：\n将华氏度转换为摄氏度，减去\
    \ 30 并除以 2。\n将摄氏度转换为华氏度，将该数字乘以 2 并加上 30。\n\n# 找出三个给定整数中的最大值\n\n### HTML 代码\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\"\
    \ content=\"width-width\">\n  <title>找出三个整数中最大值的 JavaScript 程序。</title>\n  </head>\n\
    \  <body>\n</body>\n</html>\n```\n\n### JAVASCRIPT 代码\n```javascript\nfunction\
    \ max_of_three(x, y, z)\n{\n  max_val = 0;\n  if (x > y)\n  {\n    max_val = x;\n\
    \  } else {\n    max_val = y;\n  }\n  if (z > max_val)\n  {\n    max_val = z;\n\
    \  }\n  return max_val;\n}\nconsole.log(max_of_three(1,0,1));\nconsole.log(max_of_three(0,-10,-20));\n\
