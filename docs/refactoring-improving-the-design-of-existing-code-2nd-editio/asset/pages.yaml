- img_proc: true
  md: 'There is a real danger overusing assertions. I don''t use assertions to check
    everything that I think is true, but only to check things that *need* to be true.
    Duplication is a particular problem, as it''s common to tweak these kinds of conditions.
    So I find''s essential to remove any duplication in these conditions, usually
    by a liberal use of Extract Function (106).


    I only use assertions for things that are programmer errors. If I''m reading data
    from an external source, any value checking should be a first-class part of the
    program, not an assertion—unless I''m really confident in the external source.
    Assertions are a last resort to help track bugs—though, ironically, I only use
    them when I think they should never fail.'
