  md: '# # Chapter 3

    Bad Smells in Code


    by Kent Beck and Martin Fowler


    “If it stinks, change it.”

    — Grandma Beck, discussing child-rearing philosophy


    By now you have a good idea of how refactoring works. But just because you know
    how doesn''t mean you know when. Deciding when to start refactoring—and when to
    stop—is as important to refactoring as knowing how to operate the mechanics of
    it.


    Now comes the dilemma. It is easy to explain how to delete an instance variable
    or create a hierarchy. These are simple matters. Trying to explain *when* you
    should do these things is not so cut-and-dried. Instead of appealing to some vague
    notion of programming aesthetics (which, frankly, is what consultants usually
    do), I wanted something a bit more solid.


    When I was writing the first edition of this book, I was mulling over this issue
    as I visited Kent Beck in Zurich. Perhaps he was under the influence of the odors
    of his newborn daughter at the time, but he had come up with the notion of “when”
    of refactoring in terms of smells.


    “Smells,” you say, “what is supposed to be better than vague aesthetics?” Well,
    yes. We have looked at lots of code, written for projects that span the gamut
    from virtual to nearly dead. In doing so, we have learned to look for certain
    structures in the code that suggest—sometimes, scream for—the possibility of refactoring.
    (We are switching over to “we” in this chapter to reflect the fact that Kent and
    I wrote this chapter jointly. You can tell the difference because the funny jokes
    are mine and the others are his.)


