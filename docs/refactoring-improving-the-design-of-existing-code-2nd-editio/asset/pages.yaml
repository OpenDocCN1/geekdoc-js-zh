    \  console.log(`amount: ${$outstanding}`);\n}\n```\n\n# Motivation\n\nExtract\
    \ Function is one of the most common refactorings I do. (Here, I use the term\
    \ “function” which is the same for a method in an object-oriented language, or\
    \ any kind of procedure or subroutine.) I look at a fragment of code, understand\
    \ what it is doing, then extract it into its own function named after its purpose.\n\
    \nDuring my career, I've heard many arguments about when to enclose code in its\
    \ own function. Some of these guidelines were based on length: Functions should\
    \ be no larger than fit on a screen. Some were based on reuse: Any code more than\
    \ once should be put in its own function, but code only used once should be inline.\
    \ The argument that makes most sense to me, however, is the separation of intention\
    \ and implementation. If you spend effort looking at a fragment of code and figuring\
    \ out what it's doing, you should extract it into a function and name the function\
    \ after the “what.” Then, when you read it again, the purpose of the function\
    \ leaps right out you, and most of the time you won't need to care about how the\
    \ function fulfills its purpose (which is the body of the function)."
