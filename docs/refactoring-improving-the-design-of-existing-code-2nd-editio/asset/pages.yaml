    # REFACTORING AND THE WIDER SOFTWARE DEVELOPMENT PROCESS


    If you''ve read the earlier section on problems, one lesson you''ve probably drawn
    is that the effectiveness of refactoring is tied to other software practices that
    a team uses. Indeed, refactoring''s early adoption was part of Extreme Programming
    [mf-xp] (XP), a process which was notable for putting together a set of relatively
    unusual and interdependent practices—such as continuous integration, self-testing
    code, and refactoring (the latter two woven into test-driven development).


    Extreme Programming was one of the first agile software methods [mf-nm], and for
    several years, led to the rise of agile techniques. Enough projects now use agile
    methods that agile thinking is generally regarded as mainstream—but reality most
    “agile” projects only use the name. To really operate in an agile way, a team
    has to be capable and enthusiastic refactorers—and for, many aspects of their
    process have to align with making refactoring a regular part of their work.


    The first foundation for refactoring is self-testing code. By this, I mean that
    there is a suite of automated tests that I can run and be confident that, if I
    made an error in my programming, some test will fail. This is such an important
    foundation for refactoring that I''ll spend a chapter talking about this.


    To refactor on a team, it''s important that each member can refactor when they
    need to without interfering with others'' work. This is why I encourage Continuous
    Integration. With CI, each member''s refactoring efforts are quickly shared with
    their colleagues. No one ends up building new work on interfaces that are being
    removed, and if the refactoring is causing a problem with someone else''s work,
    we know about this quickly. Self-testing code is also a key element of Continuous
    Integration, so there is a strong synergy between the three practices of self-testing
    code, continuous integration, and refactoring.


    With this trio of practices in place, we enable the Yagni design approach that
    I talked about in the previous section. Refactoring and yagni positively reinforce
    each other: Not just refactoring (and its prerequisites) a foundation for yagni—yagni
    makes it easier to do refactoring. This is because it''s easier to change a simple
    system than one that has lots of speculative flexibility included. Balance these
    practices, and you can get'
