  md: '# The Rule of Three


    Here''s a guideline Don Roberts gave me: The first time you do something, you
    do it. The second time you do something similar, you wince at the duplication,
    you do duplicate the thing anyway. The third time you do something similar, you
    refactor.


    Or for those who like baseball: **Three strikes, then you refactor.**


    # Preparatory Refactoring—Making It Easier to Add a Feature


    The best time to refactor is just before I need to add a new feature to the code
    base. As I do this, I look at the existing code and, often, see that if it were
    a little different, my work would be much easier. Perhaps there''s that function
    that does almost all I need, but has some values that conflict with my needs.
    Without refactoring I might copy the function and change those values. But that
    leads to duplicated code—if I need to change it in the future, I''ll have to change
    both spots (and, worse, find them). And copy-paste won''t help me if I need to
    make a similar variation for a new feature in the future. So with my refactoring
    had on, I use *Parameter Function (310)*. Once I''ve done that, all I have to
    do is call the function with the parameters I need.


    > “It’s like I want to go 100 miles east instead of just traversing through the
    woods, I''m going to drive 20 miles to the highway and then I''m going to go 100
    miles east three times the speed I could have if I just went there. When people
    are pushing you to go straight there, sometimes you need to say, ‘Wait, I need
    to check the map and find the quickest route.’ The preparatory refactoring does
    that for me.”


    — Jessica Kerr,

    https://martinfowler.com/articles/preparatory-refactoring-example.html


    The same happens when fixing a bug. Once I''ve found the cause of the problem,
    I see that it would be much easier to fix should I unify the three bits of copied
    code causing the error into one. Or perhaps separating some logic from queries
    will make easier to avoid the tangling that''s causing the error. By refactoring
    to improve the situation, I also increase the chances that the bug will stay fixed,
    and reduce the chances that others will appear in the same crevice of the code.'
