    # COMMENTS ON THE STARTING PROGRAM


    What are your thoughts on the design of this program? The first thing I''d say
    is that it''s tolerable as it is—a program so short doesn''t require any depth
    structure to be comprehensible. Remember my earlier point that I have to keep
    examples small. Imagine this program on a larger scale—perhaps hundreds of lines
    long. At that size, a single inline function is hard to understand.


    Given that the program works, isn''t any statement about its structure merely
    an aesthetic judgment, a dislike of "ugly" code? After all, the compiler doesn''t
    care whether the code is ugly or clean. When I change the system, there is a human
    involved, and humans do care. A poorly designed system is hard to change—because
    it is difficult to figure out what to change and how these changes will interact
    with the existing code to get the behavior I want. And if it is hard to figure
    out what to change, there is a good chance that I will make mistakes and introduce
    bugs.


    Thus, if I''m faced with modifying a program with hundreds of lines of code, I''d
    rather it be structured into a set of functions and other program elements that
    allow me to understand more easily what the program is doing. If the program lacks
    structure, it''s usually easier for me to add structure to the program first,
    and then make the change I need.


    > When you have to add a feature to a program but the code is not structured in
    a convenient way, first refactor the program to make it easy to add the feature,
    then add the feature.


    In this case, I have a couple of changes that the users would like to make. First,
    they wanted a statement printed in HTML. Consider what this change would have.
    I''m faced with adding conditional statements around every statement that adds
    a string to'
