  md: '# # Chapter 10

    # Simplifying Logic


    Much of the power of programs comes from their ability to implement conditional
    logic—but, sadly, much of the complexity of programs lies in these conditionals.
    I often use refactoring to make conditional sections ever easier to understand.
    I regularly apply *Decompose Conditional (260)* to complicated conditionals, and
    I use *Consolidate Conditional Expression (263)* to make logical combinations
    clearer. I use *Replace Nested Conditional with Guard Clauses (266)* to clarify
    cases where I want to run some pre-checks before my main processing. If I see
    several conditions using the same switching logic, it''s a good time to pull *Replace
    Conditional with Polymorphism (272)* out of the box.


    A lot of conditionals are used to handle special cases, such as nulls; if logic
    is mostly the same, then *Introduce Special Case (289)* (often referred to as
    *Introduce Null Object (289)*) can remove a lot of duplicate code. And, although
    I like to remove conditions a lot, if I want to communicate (and check) a program’s
    state, I find *Introduce Assertion (302)* a worthwhile addition.


    # DECOMPOSE CONDITIONAL'
