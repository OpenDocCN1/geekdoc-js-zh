    time, and we find it a perfectly good way of doing business. There is a smell—we
    can''t deny it—usually it isn''t a strong smell. So, we say that if the refused
    bequest is causing confusion and problems, follow the traditional advice. However,
    you don''t have to do it all the time. Nine times out of ten this is too faint
    to be worth cleaning.


    The smell of refused bequest is much stronger if the subclass is refusing behavior
    does not want to support the interface of the superclass. We don''t mind refusing
    implementations—but refusing interface gets us on high horses. In this case, however,
    don''t fiddle with the hierarchy; you want to gut it by applying Replace Subclass
    with Delegate (381) or Replace Superclass with Delegate (399).


    # COMMENTS


    Don''t worry, we''re not saying people shouldn''t write comments. In an olfactory-atory
    sense, comments aren''t a bad smell; indeed they are a sweet smell. The reason
    we mention comments here is that comments are often used as a deodorant. It''s
    surprising how often you look at thickly commented code and notice that the comments
    are there because the code is bad.


    Comments lead us to bad code that has all the rotten whiffs we''ve discussed in
    the rest of this chapter. Our first action is to remove the bad smells by refactoring.
    When we''re'
