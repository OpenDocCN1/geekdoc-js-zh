    One of the biggest sources of problems in software is mutable data. Data changes\
    \ can often couple together parts of code in awkward ways, with changes in one\
    \ part leading to knock-on effects that are hard to spot. In many situations it's\
    \ not realistic to entirely remove mutable data—but I advocate minimizing the\
    \ scope of mutable data at as much as possible.\n\nOne way I can make a big impact\
    \ is by removing any variables that I could just easily calculate. A calculation\
    \ often makes it clearer the meaning of the data is, and it is protected from\
    \ being corrupted when you fail to update the variable as the source data changes.\n\
    \nA reasonable exception to this is when the source data for the calculation is\
    \ immutable and we can force the result to immutable too. Transformation operations\
    \ that create new data structures are thus reasonable to keep even if they could\
    \ be replaced with calculations. Indeed, there is a duality between objects that\
    \ wrap a data structure with a series of calculated properties and functions that\
    \ transform one data into another. The object route is clearly better when the\
    \ source data changes and you would have to manage the lifetime of the derived\
    \ data structures. But if the source data is immutable, or the derived data is\
    \ very transient, then both approaches are effective.\n\n# # Mechanics"
