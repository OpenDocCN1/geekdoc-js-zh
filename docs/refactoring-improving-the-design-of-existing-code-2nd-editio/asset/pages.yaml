    a system is only easy to put test if it was designed with testing in mind—in which
    case it would have the tests and I wouldn''t be worrying about it.


    There''s no simple route to dealing with this. The best advice I can give is to
    get a copy of Working Effectively with Legacy Code [Feathers] and follow its guidance.
    It won''t be worried by the age of the book—its advice is as true as over a decade
    later. To summarize, I advise you to change the system under test by finding seams
    in the program where you can insert tests. Creating these seams involves refactoring—which
    is much more dangerous since it''s without tests, but is a necessary risk to make
    progress. This is a situation where safe, automated refactorings can be a godsend.
    If all this sounds difficult, that''s because it is. Sadly, there''s no shortcut
    to getting out of a hole deep—which is why I''m a strong proponent of writing
    self-testing code from the start.


    Even when I do tests, I don''t advocate trying to refactor a complicated legacy
    system into beautiful code all at once. What I prefer to tackle it in relevant
    pieces. Each time I pass through a section of the code, I try to make it a little
    bit better—again, like leaving a camp cleaner than when I found it. If this is
    a large system, I''ll do refactoring in areas I visit frequently—which is the
    right thing to do, if I need to visit code frequently, I''ll get a bigger payoff
    by making it easier to understand.


    # Databases


    When I wrote the first edition of this book, I said that refactoring databases
    was a problem area. But, within a year of the book''s publication, that was no
    longer the case. My colleague Pramod Sadlade developed an approach to evolutionary
    database design [mf-evodb] and database refactoring [Ambler & Sadal] that is now
    widely used. The essence of the technique is to combine the structural changes
    to a database''s schema and access code with data migration scripts that can easily
    compose to handle large changes.


    Consider a simple example of renaming a field (column). As in Change Function
    Declaration (124), I need to find the original declaration of the structure and
    all the'
