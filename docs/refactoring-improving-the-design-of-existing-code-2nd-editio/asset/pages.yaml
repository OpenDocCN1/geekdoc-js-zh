    # Motivation


    If I see code that derives a couple of values from a record and then passes these
    values into a function, I like to replace those values with the whole record itself,
    letting the function derive the values it needs.


    Passing the whole record handles change better should the called function need
    more data from the whole in the future—that change would not require me to alter
    the parameter list. It also reduces the size of the parameter list, which usually
    makes the'
