- img_proc: true
  md: 'The first tool that did this was the Smalltalk Refactoring Browser, by John
    Brandt and Don Roberts. The idea took off in the Java community very rapidly at
    the beginning of the century. When JetBrains launched the IntelliJ IDEA IDE, automated
    refactoring was one of the compelling features. IBM followed shortly afterwards
    with refactoring tools in Visual Age for Java. Visual Age didn''t have a big impact,
    but much of its capabilities were reimplemented in Eclipse, including the refactoring
    support.


    Refactoring also to C#, initially via JetBrains'' Resharper, a plug-in for Visual
    Studio. Later on, the Visual Studio team added some refactoring capabilities.


    It''s now pretty common to find some kind of refactoring support in editors and
    tools, although the actual capabilities vary a bit. Some of this variation is
    due to the tool, some is caused by the limitations of what you can do with automated
    refactoring in different languages. I''m not going to analyze the capabilities
    of different tools here, but I think it is worth talking a bit about the underlying
    principles.


    A crude way to automate a refactoring is to do text manipulation, such as search/replace
    to change a name, or some simple reorganization of code for *Extract Variable
    (119)*. This is a very crude approach that certainly can''t be trusted without
    running tests. It can, however, be a handy first step. I''ll use such macros in
    Emacs to speed up my refactoring work when I don''t have more sophisticated refactorings
    available to me.


    To refactor properly, the tool has to operate on the syntax tree of the code,
    not on the text. Manipulating the syntax tree is much more reliable to preserve
    what the code is doing. This is why at the moment, most refactoring capabilities
    are part of powerful IDEs—they use the syntax tree not just for refactoring but
    also for code navigation, linting, and the like. This collaboration between text
    and syntax tree is what takes them beyond text editors.


    Refactoring isn''t just understanding and updating the syntax tree. The tool also
    needs to figure out how to rerender the code into back in the editor. All in all,
    implementing decent refactoring is a challenging programming exercise—one that
    I''m mostly unaware of as Iaily use the tools.


    Many refactorings are made safer when applied in a language with static typing.
    Consider the simple *Rename Function (124)*. I might have `addClient` methods
    on my `Salesman` class and on my `Server` class. I want to rename the one on my
    salesman, but it is different in intent from the one on my server, which I don''t
    want to rename.'
  merge: -1
  pgno: 81
- img_proc: true
  md: 'Without static typing, the tool will find it difficult to tell whether any
    call to `addClient` is intended for the salesman. In the refactoring browser,
    it would generate a list of call sites and I would manually decide which to change.
    This makes a unsafe refactoring that forces me to rerun the tests. Such a tool
