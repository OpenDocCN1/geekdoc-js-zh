  md: 'A further problem is inheritance introduces a very close relationship between
    classes. Any change I want to make to the parent can easily break children, I
    have to be careful and understand how children derive from the superclass. This
    problem is made worse when the logic of the two classes resides in different modules
    and is looked after by different teams.


    Delegation handles both of these problems. I can delegate to many classes for
    different reasons. Delegation is a regular relationship between objects—so I can
    have a clear interface to work with, which is much less coupling than subclassing.
    It is therefore common to run into the problems with subclassing and apply Replace
    Subclass with Delegate.


    There is a popular principle: “Favor object composition over class inheritance”
    (where composition is effectively the same as delegation). Many people take this
    to mean “inheritance considered harmful” and claim that we should never use inheritance.
    I use inheritance frequently, because I always know I can Replace Subclass with
    Delegate I should need to change it later. Inheritance is a valuable mechanism
    that does the most job of the time without problems. So I reach for it, and move
    on delegation when it starts to rub badly. This usage is actually consistent with
    the principle—which comes from the Gang of Four book [go] that explains inheritance
    and composition work together. The principle was a reaction to the overuse of
    inheritance.


    Those who are familiar with the Gang of Four may find it helpful to think of this
    refactoring as replacing subclasses with the State or Strategy patterns. Both
    of these patterns are structurally the same, relying on the delegating to a separate
    hierarchy. Not all cases of Replace Subclass with Delegate involve an inheritance
    hierarchy for the delegate (as the first example below illustrates), but setting
    up a hierarchy for states or strategies is often useful.


    # Mechanics


    +   * If there are many callers for the constructors, apply Replace Constructor
    with Factory Function (334).


    +   * Create an empty class for the delegate. Its constructor should take any
    subclass-specific data as well as usually, a back-reference to the superclass.


    +   * Add a field to the superclass to hold the delegate.


    +   * Modify the creation of the subclass so that it initializes the delegate
    field with an'
