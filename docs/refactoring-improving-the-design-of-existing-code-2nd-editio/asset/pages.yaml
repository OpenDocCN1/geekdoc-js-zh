  md: '# Motivation


    If subclasses are developed independently, or combined through refactoring, I
    often find that they duplicate features. In particular, certain fields can be
    duplicates. Such fields sometimes have similar names—but not always. The only
    way I can tell what is going on is looking at the fields and examining how they
    are used. If they are used in a similar way, I can pull them up into the superclass.


    By doing this, I reduce duplication in two ways. I remove the duplicate data declaration
    and I can then move behavior that uses the field from the subclasses to the superclass.


    Many dynamic languages do not define fields as part of their class definition—instead,
    fields appear when they are assigned to. In this case, pulling up a field is essentially
    a consequence of Pull Up Constructor Body (355).


    # Mechanics


    +   * Inspect all users of the candidate field to ensure they are used in the
    same way.

    * If the fields have different names, use Rename Field (244) to give them the
    same name.

    * Create a new field in the superclass.

    * The new field will need to be accessible to subclasses (protected in common
    languages).

    * Delete the subclass fields.

    * Test.


    # PULL UP CONSTRUCTOR BODY'
