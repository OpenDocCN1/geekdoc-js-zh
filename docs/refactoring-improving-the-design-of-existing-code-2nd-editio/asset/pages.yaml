    using inheritance to use the superclass''s functionality.


    As well as using all the functions of the superclass, it should also be true that
    in every

    instance of the superclass is an instance of the superclass and a valid object
    in all cases

    where we''re using the superclass. If I have a car class with things like name
    and

    engine size, I might think I could reuse these features to represent a physical
    car,

    adding functions for VIN number and manufacturing date. This is a common, and
    often

    subtle, modeling mistake which I''ve called the type-instance homonym [mf-thih].


    These are both examples of problems leading to confusion and errors—which can
    be

    easily avoided by replacing inheritance with delegation to a separate object.
    Using

    delegation makes it clear that it is a separate thing—one where only some of the

    functions carry over.


    Even in cases where the subclass is reasonable modeling, I use Replace Super-class
    with

    Delegate because the relationship between a sub and superclass is highly coupled,
    with

    the subclass easily broken by changes in the superclass. The downside is that
    I need to

    write a forwarding function for any function that is the same in the host and
    in the

    delegate—but, fortunately, even though such forwarding functions are boring to
    write,

    they are too simple to get wrong.


    As a consequence of this all, some people advise inheritance entirely—but I

    don''t agree with that. Provided the appropriate semantic conditions apply (every

    method on the supertype applies to the subtype, every instance of the subtype
    is an

    instance of the supertype), inheritance is a simple and effective mechanism. I
    can easily

    apply Replace Superclass with Delegate should the situation change and inheritance
    is

    o longer the best option. My advice is to (most) use inheritance first, and apply

    Replace Superclass with Delegate when (and if) it becomes a problem.


    # Mechanics


    +   - Create a field in the subclass that refers to the superclass object. Initialize
    it

    delegate reference to a new instance.


    +   - For each element of the superclass, create a forwarding function in the
    subclass that

    forwards to the delegate reference. Test after forwarding each consistent group.


    Most of the time you can test after each function that''s forwarded, but for example,

    get/set pairs can only be tested once both have moved.'
