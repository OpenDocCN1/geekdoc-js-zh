  md: "```\nconst names = [];\nfor (const i of input) {\n  if (i.job === \"programmer\"\
    )\n    names.push(i.name);\n}\n```\n\n```\nconst names = input\n.filter(i => i.job\
    \ === \"programmer\")\n.map(i => i.name);\n```\n\n# Motivation\n\nLike most programmers,\
    \ I was taught to use loops to iterate over a collection of objects. Increasingly,\
    \ however, language environments provide a better construct: the collection pipeline.\
    \ Collection Pipelines may allow me to describe my processing as a series of operations,\
    \ each consuming and emitting a collection. The most common of these operations\
    \ are *map*, which uses a function to transform each element of the input collection,\
    \ and *filter* which uses a function to select a subset of the input collection\
    \ for later steps in the pipeline. I find logic much easier to follow if it is\
    \ expressed as a pipeline—I can read from top to bottom to see how objects flow\
    \ through the pipeline.\n\n# Mechanics\n\n+   Create a new variable for the loop’s\
    \ collection.\n\nThis may be a simple copy of an existing variable.\n\n+   Starting\
    \ at the top, take each bit of behavior in the loop and replace it with a collection\
    \ pipeline operation in the derivation of the loop collection variable. Test after\
    \ each change.\n\n+   Once all behavior is removed from the loop, remove it."
