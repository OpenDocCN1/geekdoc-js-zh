  md: "There’s an assumption here that the discount rate is a positive number. I can\
    \ make that assumption explicit by using an assertion. But I can't easily place\
    \ an assertion into a ternary expression, so first I'll reformulate it as an if-then\
    \ statement.\n\nclass Customer...\n\n# Click here to view code image\n\n```\n\
    applyDiscount(aNumber) {\n  if (!this.discountRate) return aNumber;\n  else return\
    \ aNumber - (this.discountRate * aNumber);\n}\n```\n\nNow I can easily add the\
    \ assertion.\n\nclass Customer...\n\n# Click here to view code image\n\n```\n\
    applyDiscount(aNumber) {\n  if (!this.discountRate) return aNumber;\n  else {\n\
    \    assert(this.discountRate >= 0);\n    return aNumber - (this.discountRate\
    \ * aNumber);\n  }\n```\n\nIn this case, I’d rather put this assertion into the\
    \ setting method. If the assertion fails in applyDiscount, my first puzzle is\
    \ how it got into the field in the first place.\n\nclass Customer...\n\n# Click\
    \ here to view code image\n\n```\nset discountRate(aNumber) {\n  assert(null ===\
    \ aNumber || aNumber >= 0);\n  this.discountRate = aNumber;\n}\n```\n\nAn assertion\
    \ like this can be particularly valuable if it’s hard to spot the error source—which\
    \ may be an errant minus sign in some input data or some inversion elsewhere in\
    \ the code."
