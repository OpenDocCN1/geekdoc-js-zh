  md: 'say exactly what I want. But there are likely to be other users of my source
    code. In a few months, a human will try to read my code to make some changes.
    That user, we often forget, is actually the most important. Who cares if the computer
    takes a few cycles to compile something? Yet it does matter if it takes a programmer
    a week to make a change that would have taken only an hour with proper understanding
    of it code.


    The trouble is that I''m trying to get the program to work, I''m not thinking
    about that future developer. It takes a rhythm to make the code easier to understand.
    Refactoring helps me make my code more readable. Before refactoring, I have code
    that works but is not ideally structured. A little spent on refactoring can make
    the code better communicate its purpose—say more what I want.


    I''m not necessarily altruistic about this. Often, this future developer is myself.
    This makes refactoring even more important. I''m a very lazy programmer. One of
    my forms of laziness is that I never remember about the code I write. Indeed,
    I deliberately try not remember anything I can look up, because I''m afraid my
    brain will get full. I make a point of trying to put everything I should remember
    into the code so I don''t have to remember it. That way I''m less worried about
    Maudite [maudite] killing off my brain cells.


    # Refactoring Helps Me Find Bugs


    Help in understanding the code also means help in spotting bugs. I admit I''m
    not terribly good at finding bugs. Some people can read a lump of code and see
    bugs; I cannot. However, I find that if I refactor code, I work deeply on understanding
    what the code does, and I put that understanding right back into the code. By
    clarifying the structure of the program, I clarify certain assumptions I''ve made—to
    a point where even I can''t avoid the bugs.


    It reminds me of a statement Kent Beck makes about himself: "I''m not a great
    programmer; I''m just a good programmer with great habits." Refactoring helps
    me be much more effective at writing robust code.


    # Refactoring Helps Me Program Faster


    In the end, the earlier points come down to this: Refactoring helps me develop
