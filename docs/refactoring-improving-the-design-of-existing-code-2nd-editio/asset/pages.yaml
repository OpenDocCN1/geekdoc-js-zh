  md: 'to decide where the best place for a function is, the more difficult this choice,
    often the it letters. I find it valuable to try working with functions in one
    context, knowing I''ll learn how well they fit, and if they don''t fit I can always
    move them later.


    # Mechanics


    +   Examine all the program elements used by the chosen function in its current
    context. Consider whether they should move too.


    If I find a called function that should also move, I usually move it first. That
    way, moving a clusters of functions begins with the one that has the least dependency
    on the others in the group.


    If a high-level function is the only caller of subfunctions, then you can inline
    functions into the high-level method, move, and reract at the destination.


    +   Check if the chosen function is a polymorphic method.


    If I''m in an object-oriented language, I have to take account of super- and subclass
    declarations.


    +   Copy the function to the target context. Adjust it to fit in its new home.


    If the body uses elements in the source context, I need to either pass those elements
    as parameters or pass a reference to that source context.


    Moving a function often means I need to come up with a different name that works
    better in the new context.


    +   Perform static analysis.


    +   Figure out how to reference the target function from the source context.


    +   Turn the source function into a delegating function.


    +   Test.


    +   Consider Inline Function (115) on the source function.


    The source function can stay indefinitely as a delegating function. But if its
    callers can just as easily reach the target directly, then it''s better to remove
    the middle man.'
