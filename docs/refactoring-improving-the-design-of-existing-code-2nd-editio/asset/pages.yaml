  md: 'Once I accepted this principle, I developed a habit of writing very small functions—typically,
    only a few lines long. To me, any function with more than half-a dozen lines of
    code to smell, and it''s not unusual for me to have functions that are a single
    line of code. The fact that size wasn''t important was brought to me by an example
    that Kent Beck showed me from the original Smalltalk. Smalltalk in those days
    ran on black-and-white systems. If you wanted to highlight some text or graphics,
    highlight, whose implementation was just a call to the method reverse. The name
    of the method was longer than its implementation—but that didn''t matter there
    was a big distance between the intention of the code and its implementation.


    Some people are concerned about short functions because they worry about the performance
    cost of a function call. When I was young, that was occasionally a factor, but
    that''s very rare now. Optimizing compilers often work better with shorter functions
    which can be cached more easily. As always, follow the general guidelines on performance
    optimization.


    Small functions like this only if the names are good, so you need to pay good
    attention to naming. This takes practice—once you get good at it, this approach
    can make code remarkably self-documenting.


    Often, I see fragments of code in a large function that start with a comment to
    say what they do. The comment is often a good hint for the name of the function
    when I extract that fragment.


    # Mechanics


    +   Create a new function, and name it after the intent of the function (name
    it by what it does, not by how it does it).


    If the code I want to extract is simple, such as a single function call, I still
    extract it if the name of the new function will reveal the intent of the code
    in a better way. If I can''t come up with a more meaningful name, that''s a sign
    that I shouldn''t extract the code. However, I don''t have to come up with the
    best name right away; sometimes a good name only appears as I work with the extraction.
    It''s OK to extract a function, to work with it, realize it isn''t helping, and
    then inline it back again. As long as I''ve learned something, my time wasn''t
    wasted.


    If the language supports nested functions, nest the extracted function inside
    the source function. That will reduce the amount of out-of-scope variables to
    deal with after the next couple of steps. I can always use Move Function (198)
    later.'
