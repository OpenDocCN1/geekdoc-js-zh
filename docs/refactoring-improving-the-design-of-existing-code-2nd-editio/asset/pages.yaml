  md: 'I usually Move Field in the context of a broader set of changes. Once I''ve
    moved a field, I find that many of the users of the field are better off accessing
    that data through the original source. I then change this with later refactorings.
    Similarly, I may find that I can''t Move Field at the moment due to the way the
    data is used. I need to refactor some usage patterns, then do the move.


    In my description so far, I''m saying “record,” but all this is type of classes
    and objects too. A class is a record type with attached functions—and need to
    be kept healthy just as much as any other data. The attached functions make it
    easier to move data around, since the data is encapsulated before accessor methods.
    I can move the data, change the accessors, and clients of the accessors will still
    work. So, this is a refactoring that’s easier to do if you have classes, and my
    description below makes that assumption. If I''m using bare records that don''t
    support encapsulation, I can still make a change like this, but it is more tricky.


    # Mechanics


    +   * Ensure the source field is encapsulated.

    * Test.

    * Create a field (and accessors) in the target.

    * Run static checks.

    * Ensure there is a reference from the source object to the target object.


    An existing field or method may give you the target. If not, see if you can easily
    create a method that will do so. Failing that, you may need to create a new field
    in the source object that can store the target. This may be a permanent change,
    but you can also do it temporarily until you have done enough refactoring in the
    broader context.


    +   * Adjust accessors to use the target field.


    If the target is shared between source objects, consider first updating the setter
    to modify both target and source fields, followed by *Introduce Assertion (302)*
    to detect inconsistent updates. Once you determine all is well, finish changing
    the accessors to use the target field.


    +   * Test.'
