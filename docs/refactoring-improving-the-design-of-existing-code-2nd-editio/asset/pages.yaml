  pgno: 76
- img_proc: true
  md: 'the time, does whatever she can keep to performance high. This is a common
    approach that is intuitively attractive—but it does not work well. Changes that
    improve performance usually make the program harder to work with. This slows development.
    This would be a cost worth paying if the resulting software were quicker—but usually
    it is not. The performance improvements are spread all around the program; each
    improvement is made with a narrow perspective of the program’s behavior, and often
    with a misunderstanding of how a compiler, runtime and hardware behaves.


    # It Takes Awhile to Create Nothing


    The Chrysler Comprehensive Compensation process was running too slowly. Although
    we were still in development, it began to bother us, because it was slowing down
    the tests.


    Kent Beck, Martin Fowler, and I decided we''d fix it. While I waited for us to
