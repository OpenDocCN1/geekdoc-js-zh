    If I have some objects whose behavior varies from category to category, the natural\
    \ mechanism to express this inheritance. I put all the common data and behavior\
    \ in the superclass, and let each subclass add and override features as needed.\
    \ Object-oriented languages make this simple to implement and thus a familiar\
    \ mechanism.\n\nBut inheritance has its downsides. Most obviously, if I have more\
    \ than one reason to vary something, I can only use inheritance for a single axis\
