    # # Motivation\n\nProgramming involves writing a lot of code that implements behavior—but\
    \ the strength of a program is really founded on its data structures. If I have\
    \ a good set of data structures that match the problem, then my behavior code\
    \ is simple and straightforward. Poor data structures lead to lots of code whose\
    \ job is merely dealing with the poor data. And it's not just messier code that's\
    \ harder to understand; it also means the data structures obscure what the program\
    \ is doing.\n\nSo, data structures are important—but most aspects of programming\
    \ they are hard to get right. I make an initial analysis to figure out the best\
    \ data structures, and I found that experience and techniques like domain-driven\
    \ design have improved my ability to do that. But despite all my skill and experience,\
    \ I still find that frequently make mistakes in initial design. In the process\
    \ of programming, I learn more about the problem domain and my data structures.\
    \ A design decision that is reasonable and correct one can go wrong in another.\n\
    \nAs soon as I realize that a data structure isn't right, it's vital to change\
    \ it. If I leave my data structures with their blemishes, those blemishes will\
    \ confuse my thinking and complicate my code far into the future.\n\nI may seek\
    \ to move data because I always need to pass a field from one record whenever\
    \ I pass another record to a function. Pieces of data that are always passed to\
    \ functions are usually best put in a single record in order to clarify their\
    \ relationship. Change is also a factor; if a change in one record causes a field\
    \ to change too, that's a sign of a field in the wrong place. If I have to update\
    \ the same field in multiple structures, that's a sign that it should move to\
    \ another place where it needs to be updated once."
