    #  Motivation


    Variables have various uses. Some of these uses naturally lead to the variable
    being assigned to several times. Loop variables change for each run of a loop
    (such as the i in for (let i=0; i<10; i++)). Collecting variables store a value
    that is built up during the method.


    Many other variables are used to hold the result of a long-winding bit of code
    for easy reference later. These kinds of variables should be set only once. If
    they are set more than once, it is a sign they have more than one responsibility
    within the method. Any variable with more than one responsibility should be replaced
    with multiple variables, one for each responsibility. Using a variable for two
    different things is confusing for the reader.


    # Mechanics


    +   - Change the name of the variable at its declaration and first assignment.


    If the later assignments are of the form i = i + something, that is a collecting
    variable, so don''t split it. A collecting variable is often used for calculating
    sums, string concatenation, writing to a stream, or adding to a collection.


    +   - If possible, declare the new variable as immutable.


    +   - Change all references of the variable up to its second assignment.'
