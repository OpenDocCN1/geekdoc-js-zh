    \nFunctions—either freestanding or attached to objects as methods—are one of the\
    \ fundamental blocks of programming. But there are times when it's useful to encapsulate\
    \ a function into its own object, which I refer to as a \"command object\" or\
    \ simply a command. Such an object is mostly built around a single method, whose\
    \ request and execution is the purpose of the object.\n\nA command offers a greater\
    \ flexibility for the control and expression of a function than the plain function\
    \ mechanism. Commands can have complimentary operations, such as undo. I can provide\
    \ methods to build up their parameters to support a richer lifecycle. I can build\
    \ in customizations using inheritance and hooks. If I'm working in a language\
    \ with objects but without first-class functions, I can provide much of that capability\
    \ using commands instead. Similarly, I can use methods and fields to help break\
    \ down a complex function, even in a language that lacks nested functions, and\
    \ I can call those methods directly while testing and debugging.\n\nAll these\
    \ are good reasons to use commands, and I need to be ready to refactor"
