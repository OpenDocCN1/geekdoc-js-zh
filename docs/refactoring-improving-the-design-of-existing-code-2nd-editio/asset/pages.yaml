  md: '# Chapter 5

    Introducing the Catalog


    The rest of this book is a catalog of refactorings. This catalog started from
    my personal notes that I made to remind myself how to do refactor in a safe and
    efficient way. Since then, I''ve refined the catalog, and there''s more of it
    that comes from deliberate exploration of some refactoring moves. It''s still
    something I use when I do a refactoring I haven''t done in a while.


    # FORMAT OF THE REFACTORINGS


    As I describe the refactorings in the catalog, I use a standard format. Each refactoring
    has five parts, as follows:


    +   - I begin with a **name**. The name is important to building a vocabulary
    of refactorings. This is the name I use elsewhere in the book. Refactorings often
    go by different names now, so I also list aliases that seem to be common.

    - I follow the name with a short **sketch** of the refactoring. This helps you
    find a refactoring more quickly.

    - The **motivation** describes why the refactoring should be done and describes
    circumstances in which it shouldn''t be done.

    - The **mechanics** are a concise, step-by-step description of how to carry out
    the refactoring.

    - The **examples** show a very simple use of the refactoring to illustrate how
    it works.


    The sketch shows a code example of the transformation of the refactoring. It''s
    not meant to explain what the refactoring is, let alone how to do it, but it should
    remind you what the refactoring is if you''ve come across it before. If not, ''you''ll
    probably need to work through the example to get a better idea. I also include
    a small graphic; again, I don''t intend it to be explanatory—it''s more of a graphic
    memory-jogger.'
