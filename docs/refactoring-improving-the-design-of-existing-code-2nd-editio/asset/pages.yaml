    Tools often go further. If I rename a variable, I can be prompted for comments
    to use that name. If I use *Extract Function (106)*, the tool spots some code
    that duplicates my new function''s body and offers to replace it with a call.
    Programming with powerful refactorings like is a compelling reason to use an IDE
    rather than stick with a familiar text editor. Personally I''m a big user of Emacs,
