  md: '# Click here to view code image


    ```

    bookConcert(aCustomer, CustomerType.PREMIUM);

    ```


    or strings (or symbols in languages that use them):


    # Click here to view code image


    ```

    bookConcert(aCustomer, "premium");

    ```


    I dislike flag arguments because they complicate the process of understanding
    what function calls are available and how to call them. My first route into an
    API is usually the list of available functions, and flag arguments hide the differences
    in the function calls that are available. Once I select a function, I have to
    figure out what values are available for the flag arguments. Boolean flags are
    even worse since they don''t convey their meaning to the reader—in a function
    call, I can''t figure out `true` means. It''s clearer to provide an explicit function
    for the task I want to do.


    ```

    premiumBookConcert(aCustomer);

    ```


    Not all arguments like this flag arguments. To be a flag argument, the callers
    must be setting the boolean value to a literal value, not data''s flowing through
    the program. Also, the implementation function must be using the argument to influence
    its control flow, not as data it passes to further functions.


    Removing flag arguments doesn''t just make the code clearer—it also helps my tooling.
    Code analysis tools can now easily see the difference between calling the premium
    logic and calling regular logic.


    Flag arguments can have a place if there''s more than one of them in the function,
    since otherwise I would need explicit functions for every combination of their
    values. But that''s also a signal of a function doing too much, and I should look
    for a way to create simpler functions that I can compose for this logic.


    # Mechanics


    +   Create an explicit function for each value of the parameter.


    If the main function has a clear dispatch conditional, use *Decompose Conditional
    (260)* to create the explicit functions. Otherwise, create wrapping functions.'
