- img_proc: true
  md: 'when I have to accommodate a change in an interface.


    As I develop software, I find myself swapping hats frequently. I start trying
    to add a new capability, then I realize this would be much easier if the code
    were structured differently. So I swap hats and refactor for a while. Once the
    code is better structured, I swap hats and add the new capability. Once I get
    the new capability working, I realize I coded it in a way that''s awkward to understand,
    so I swap hats again and refactor. This might take only ten minutes, but during
    this time I''m always aware of which hat I''m wearing and the subtle difference
    that makes how to program.


    # WHY SHOULD WE REFACTOR?


    I don''t want to claim refactoring is the cure for all software ills. It is no
    "silver bullet." Yet it is a valuable tool—pair of silver pliers that helps you
    keep a good grip on your code. Refactoring is a tool that can—and—be used for
    several purposes.


    # Refactoring Improves the Design of Software


    Without refactoring, the internal design—the architecture—of software tends to
    decay. As people change code to achieve short-term goals, without a full comprehension
    of the architecture, the code loses its structure. It becomes harder for me to
    see the design by reading the code. Loss of the structure of code has a cumulative
    effect. The harder it is to see the design in the code, the harder it is for me
    to preserve it, and the more rapidly it decays. Regular refactoring helps the
    code in shape.


    Poorly designed code usually takes more code to do the same things, often because
    the code literally does the same thing in several places. This important aspect
    of improving design is to eliminate duplicated code. It''s not that the amount
    of code will make the system run faster—the effect on the footprint of the programs
    is rarely significant. Reducing the amount of code does, however, make a big difference
    in modification of the code. The more code there is, the harder it is to modify
    correctly. There''s more code for me to understand. I change this but what I expect
    because I didn''t change bit over there that does much the same thing in a slightly
    different context. By eliminating duplication, I ensure that the code says everything
    and only once, which is the essence of good design.


    # Refactoring Makes Software Easier to Understand


    Programming is in many ways a conversation with a computer. I write the computer
    what to do, and it responds by doing exactly what I tell it. In time, I close
    the gap between what I want it to do and what I tell it to do. Programming is
    all about'
