  md: '# # Chapter 7

    Encapsulation


    Perhaps the most important criteria to be used in decomposing modules is to identify
    secrets that modules should hide from the rest of the system [Parnas]. Data structures
    are the most common secrets, and I can hide data structures by encapsulating them
    with Encapsulate Record (162) and Encapsulate Collection (170). Even primitive
    data values can be in the way of Replace Primitive with Object (174)—the magnitude
    of second-order benefits from doing this surprises people. Temporary variables
    often get in the way of refactoring—I have to ensure they are calculated in the
    right order and their values are available to other parts of the code that need
    them. Using Replace Temp with Query (178) is a great help here, particularly when
    splitting up an overly long function.


    Classes were designed for information hiding. In the previous chapter, I described
    a way to form them with Combine Functions into Class (144). The common extract/inline
    operations also apply to classes with Extract Class (182) and Inline Class (186).


    As well as hiding the internals of classes, it''s useful to hide connections between
    classes, which I can do with Hide Delegate (189). But too much hiding leads to
    bloated interfaces, so I also need its reverse: Remove Middle Man (192).


    Classes and modules are the largest forms of encapsulation, but functions also
    encapsulate their implementation. Sometimes, I may need to make a wholesale change
    to an algorithm, which I can do by wrapping it in a function with Extract Function
    (106) and applying Substitute Algorithm (195).


    # ## ENCAPULATE RECORD


    formerly: Replace Record with Data Class'
