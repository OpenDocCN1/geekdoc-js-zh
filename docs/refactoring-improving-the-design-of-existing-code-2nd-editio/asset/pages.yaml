    }\n```\n\n# # Motivation\n\nWhen I have a function that gives me a value and has\
    \ no observable side effects, I have a very valuable thing. I can call this function\
    \ as often as I like. I can move the call to other places in a calling function.\
    \ It's easier to test. In short, I have a lot less to worry about.\n\nIt is a\
    \ good idea to clearly signal the difference between functions with side effects\
    \ and those. A good rule to follow is that any function that returns a value should\
    \ not have observable side effects—the command-query separation [mf-cqs]. Some\
    \ programmers treat this as an absolute. I'm not 100% pure on this (as anything),\
    \ but I try to follow it most of the time, and it has served me well.\n\nIf I\
    \ come across a method that returns a value but also has side effects, I always\
    \ try to separate the query from the modifier.\n\nNote that I use the phrase observable\
    \ side effects. A common optimization is to cache the value of a query in a field\
    \ so that repeated calls get quicker. Although this changes the state of the object\
    \ with the cache, the change is not observable. Any sequence of queries will always\
    \ return the same results for each query.\n\n# # Mechanics"
