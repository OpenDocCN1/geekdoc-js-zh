    # Mechanics


    In most of the refactorings in this book, I present only a single set of mechanics.
    This isn''t because there is only one set that will do the job but usually, one
    set of mechanics will work reasonably well for most cases. Change Function Declaration,
    however, is an exception. The simple mechanics are often effective, but there
    are plenty of cases when a more gradual migration makes more sense. So, with this
    refactoring, I look at the change and ask myself if I think I can change the declaration
    and all callers easily in one. So, I follow the simple mechanics. The migration-style
    mechanics allow me to change the callers more gradually—which is important if
    I have lots of them, they are awkward to get to, the function is a polymorphic
    method, or I have a more complicated change to the declaration.


    # Simple Mechanics


    +   - If you''re removing a parameter, ensure it isn''t referenced in the body
    of the function.

    - Change the method declaration to the desired declaration.

    - Find all references to the old method declaration, update them to the new one.

    - Test.


    It''s often best to separate changes, so if you want to both change the name and
    add a parameter, do these as separate steps. (In any case, if you run into trouble,
    revert and use the migration mechanics instead.)


    # Migration Mechanics


    +   - If necessary, refactor the body of the function to make it easy to do the
    following extraction step.'
