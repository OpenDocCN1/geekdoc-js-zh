    I had thought of anything to do with the problem. Instead, we found that the system
    was spending half its time creating instances of date. Even more interesting was
    that all the instances had the same couple of values.


    When we looked at the date-creation logic, we saw some opportunities for optimizing
    how these dates were created. They were all going through a string conversion
    though no external inputs were invoked. The code was just using string conversion
    for convenience of typing. We could optimize that.


    Then we looked at how these dates were being used. It turned out that the huge
    bulk of them were all creating instances of date range, an object with a from
    date and to a date. Looking around little more, we realized that most of these
    dates were empty!


    As we worked with date range, we used the convention that any date range that
    ended before it started was empty. It’s a good convention and fits well with how
    the class works. Soon after using this convention, we realized that creating a
    date range that starts after it wasn''t clear code, so we extracted that behavior
    into a factory method for empty date'
