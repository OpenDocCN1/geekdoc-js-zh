    \  let primaryTime = Math.min(time, scenario.delay);\n  result = 0.5 * acc * primaryTime\
    \ * primaryTime;\n  let secondaryTime = time - scenario.delay;\n  if (secondaryTime\
    \ > 0) {\n    let primaryVelocity = acc * scenario.delay;\n    acc = (scenario.primaryForce\
    \ + scenario.secondaryForce) / scenario.mass;\n    result += primaryVelocity *\
    \ secondaryTime + 0.5 * acc * secondaryTime;\n  }\n  return result;\n}\n```\n\n\
    Nice awkward little function. The interesting thing for our example is the way\
    \ the variable acc is set twice. It has two responsibilities: one to hold the\
