  md: 'polymorphism to bring out the type-specific behavior.


    Another situation is where I can think of logic as a base case with variants.
    The base case may be the most common or most straightforward. I can put this logic
    into a superclass which allows me to reason about it without having to worry about
    the variants. I put each variant case into a subclass, which I express with code
    that emphasizes its difference from the base case.


    Polymorphism is one of the key features of object-oriented programming—and, like
    any useful feature, it''s prone to overuse. I''ve come across people who argue
    that all examples of conditional logic should be replaced with polymorphism. I
    don''t agree with that view. Most of my conditional logic uses basic conditional
    statements—if/else and switch/case. But when I see complex conditional logic that
    can be improved as discussed above, I find polymorphism a powerful tool.


    # Mechanics


    +   - If classes do not exist for polymorphic behavior, create them together with
    a factory function to return the correct instance.


    +   - Use the factory function in calling code.


    +   - Move the conditional function to the superclass.


    If the conditional logic is not a self-contained function, use Extract Function
    (106) to make it.


    +   - Pick one of the subclasses. Create a subclass method that overrides the
    conditional statement method. Copy the body of that leg of the conditional statement
    into the subclass method and adjust it to fit.


    +   - Repeat for each leg of the conditional.


    +   - Leave a default case for the superclass method. Or, if superclass should
    be abstract, declare that method as abstract or throw an error to show it should
    be the responsibility of a subclass.


    # Example


    My friend has a collection of birds and wants to know how fast they can fly and
    what they have for plumage. So we have a couple of small programs to determine
    the information.'
