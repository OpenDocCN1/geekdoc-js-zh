  md: 'In fact, one of the most useful times to write tests is before I start programming.
    When I need to add a feature, I begin writing the test. This isn''t as backward
    as it sounds. By writing the test, I''m asking myself what needs to be done to
    the function. Writing the test also concentrates me on the interface rather than
    the implementation (always a good thing). It also means I have a clear point at
    which I''m done—when the test passes.


    Kent Beck backed this habit of writing the test first into a technique called
    Test-Driven Development (TDD). The Test-Driven approach to programming relies
    on short cycles of writing a (failing) test, writing the code to make that test
    work, and refactoring to ensure the result is as clean as possible. This test-code-refactor
    cycle should occur many times per hour, and can be a very productive and calming
    way to write code. I''m not going to discuss it further here, but I do use and
    warmly recommend it.


    That''s enough of the polemic. Although I believe everyone would benefit by writing-testing
    code, it is not the point of this book. This book is about refactoring. Refactoring
    requires tests. If you want to refactor, you have to write tests. This chapter
    gives you a start in doing this for JavaScript. This is not a testing book, I''m
    not going to go into much detail. I''ve found, however, that with testing a remarkably
    small amount of code can have surprisingly big benefits.


    As with everything else in this book, I describe the testing approach using examples.
    When I develop code, I write the tests as I go. But sometimes, I need to refactor
    some code without tests—then I have to make the code self-testing before I begin.


