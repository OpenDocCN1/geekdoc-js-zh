  md: '# Chapter 8

    Moving Features


    So far, the refactorings have been about creating, removing, and renaming program
    elements. Another important part of refactoring is moving elements between contexts.
    We use *Move Function (198)* to move functions between classes and other modules.
    Fields can move too, with *Move Field (207)*.


    I also move individual statements around. I use *Move Statements into Function
    (213)* and *Move Statements to Callers (217)* to move them in or out of functions,
    as well as *Slide Statements (223)* to move them within a function. Sometimes,
    I can take some statements that match an existing function and use *Replace Inline
    Code with Function Call (222)* to remove the duplication.


    Two refactorings I often do with loops are *Split Loop (227)*, to ensure a loop
    does only one thing, and *Replace Loop with Pipeline (231)* to get rid of a loop
    entirely.


    And then there''s the favorite refactoring of many a fine programmer: *Remove
    Dead Code (237)*. Nothing is as satisfying as applying the digital flamethrower
    to superfluous statements.


    # MOVE FUNCTION


    formerly: *Move Method*'
