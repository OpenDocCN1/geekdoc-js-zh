  md: 'the result. That will add a complexity to the function. Faced with, that, most
    people prefer to copy the method and change it to HTML. Making a copy may not
    seem so onerous a task, but it sets up all sorts of problems for the future. Any
    changes to the charging logic force me to update both methods—and ensure they
    are updated consistently. If I''m writing a program that will never change again,
    this kind of copy-and-paste is fine. But if it''s a long-lived program, duplication
    is a menace.


    This brings me to a second change. The players are looking to perform more kinds
    of plays: they hope to add history, pastoral, pastoral-comical, historical-pastoral,
    tragical-historical, tragical-comical-historical-pastoral, scene viable, and poem
    omitted to to their repertoire. They haven''t decided yet what they want to do
    and when. This change will affect both the way their plays are charged for and
    the volume credits are calculated. As an experienced developer I can be sure that
    whatever scheme they come with, they will change it again within six months. After
    all, when feature requests come, they come not as single spies but battalions.


    Again, that statement method is where the changes need to be made to deal with
    changes in classification and charging rules. But if I copy statement to htmlStatement,
    I''d need to ensure that any changes are consistent. Furthermore, as the rules
    grow in complexity, it''s going to be harder to figure out where to make the changes
    and harder to do them without making a mistake.


    Let me stress that it''s these changes that drive the need to perform refactoring.
    If the code works and never ever to change, it''s perfectly fine to leave it alone.
    It would be nice to improve it, but unless someone needs to understand it, it
    isn''t causing any real harm. As soon as someone needs to understand how that
    code works, and struggles to follow it, then you have to do something about it.


    # THE FIRST STEP IN REFACTORING


    Whenever I do refactoring, the first step is always the same. I need to ensure
    I have a solid set of tests for that section of code. The tests are essential
    because even though I follow refactorings structured to avoid most of the opportunities
    for introducing bugs, I''m still human and still makes mistakes. The larger the
    program, the more likely it is that my changes will cause something to break inadvertently—in
    the digital age, frailty''s name is software.


    Since the statement returns a string, what do I create is a few invoices, give
    each invoice a few performances of various kinds of plays, and generate the statement
    strings. I then do a string comparison between the new string and some reference'
