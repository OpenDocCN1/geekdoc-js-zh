    and is reliable.


    With these core practices in place, we have the foundation to take advantage of
    the other elements of the agile mindset. Continuous Delivery keeps our software
    in an always-releasable state. This is what allows many web organizations to release
    updates many times a day—even if we don''t need that, it reduces risk and allows
    us to schedule releases to satisfy business needs rather than technological constraints.

    With a firm technical foundation, we can drastically reduce the time it takes
    to get a good idea into production code, allowing us to better serve our customers.

    Furthermore, these practices increase the reliability of our software, with less
    bugs to spend time fixing.


    Stated like this, it sounds rather simple—but in practice it isn''t. Software
    development, whatever the approach, is a tricky business, with complex interactions
    between people and machines. The approach I describe here is a proven way to handle
    this complexity, but like any approach, it requires practice and skill.


    # REFACTORING AND PERFORMANCE


    A common concern with refactoring is the effect it has on the performance of a
    program. To make the software easier to understand, I often make changes that
    will cause the program to run slower. This is an important issue. I don''t belong
    to the school of thought that ignores performance in favor of design purity or
    in hopes of faster hardware. Software has been rejected for being too slow, and
    faster machines merely the goalposts. Refactoring can certainly make software
    go more slowly—but it also makes the software more amenable to performance tuning.
    The secret to fast software, in all but hard real-time contexts, is to write tunable
    software first and then tune it for sufficient speed.


    I''ve seen three general approaches to writing fast software. The most serious
    of these is time budgeting, often used in hard real-time systems. As you decompose
    the design, you give each component a budget for resources—time and footprint.
    That component must not exceed its budget, although a mechanism for exchanging
    budgeted resources is allowed. Time budgeting focuses attention on hard performance
    times. It is essential for systems, such as heart pacemakers, in which late data
    is always bad data. This technique is inappropriate for other kinds of systems,
    such as the corporate information systems with which I usually work.


    The second approach is the constant attention approach. Here, every programmer,
    all'
