    # AUTOMATED REFACTORINGS


    Perhaps the biggest change to refactoring in the last decade or so is the availability
    of tools that support automated refactoring. If I want to rename a method in Java
    and I''m using IntelliJ [intellij] or Eclipse [eclipse] (to mention just two),
    I can do it by picking an item off the menu. The tool completes the refactoring
