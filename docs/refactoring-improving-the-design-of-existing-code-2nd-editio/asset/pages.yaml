  md: 'facts as simple data items, such as numbers or strings. As development proceeds,
    those simple items aren''t so anymore. A telephone number may be represented as
    a string for a while, but later it will need special behavior for formatting,
    extracting the area code, and the like. This kind of logic can quickly end up
    duplicated around the code base, increasing the effort whenever it needs to be
    used.


    As soon as I realize want to do something other than simple printing, I like to
    create a new class for that bit of data. At first, such a class does little more
    than wrap the primitive—but once I have that class, I have a place to put behavior
    specific to its needs. These little start start humble, but once nurtured they
    grow into useful tools. They may not look like much, but I find their effects
    on a code base can be surprisingly large Indeed many experienced developers consider
    this to be one of the most valuable refactorings in the toolkit—even though it
    seems counterintuitive to a new programmer.


