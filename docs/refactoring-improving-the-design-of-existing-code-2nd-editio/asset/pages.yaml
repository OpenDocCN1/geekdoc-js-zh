  md: 'depending on the language, that might be enum, symbol, string, or number. Often,
    this type code will come from an external service that provides me with the Data
    I''m working on.


    Most of the time, such a type is all I need. But there are a couple of situations
    where I could do with something more, and that something are subclasses. There
    are two things that are particularly enticing about subclasses. First, they allow
    me to use polymorphism to handle conditional logic. I find this most helpful when
    I have several functions that invoke different behavior depending on the value
    of the type code. With subclasses, I can apply *Conditional with Polymorphism
    (272)* to these functions.


    The second case is when I have fields or methods that are only valid for particular
    values of a type code, such as a sales quota that''s only applicable to the "salesman"
    type code. I can then create the subclass and apply *Push Down Field (361)*. While
    I can include validation logic to ensure a field is only used when the type has
    the correct value, using subclasses makes the relationship more explicit.


    When using Replace Type Code with Subclasses, I need to consider whether to apply
    directly to the class I''m looking at, or to the type code itself. Do I make engineer
    a subtype of employee, or should I give the employee employee property which can
    have subtypes for engineer and manager? Using direct subclassing is simpler, but
    I can''t use it for the job type if I need it for something else. I also can''t
    use direct subclasses if the type is mutable. If I need to move the subclasses
    to an employee type property, I can do that by using *Replace Primitive with Object
    (174)* on the type code to create an employee type class and then using Replace
    Type Code with Subclasses on that new class.


    # Mechanics


    +   - Self-encapsulate the type code field.


    +   - Pick one type code value. Create a subclass for that type code. Override
    the type code getter to return the literal type code value.


    +   - Create selector logic to map from the type code parameter to the new subclass.


    With direct inheritance, use *Replace Constructor with Factory Function (334)*
    and put the selector logic in the factory. With indirect inheritance, the selector
    logic stays in the constructor.'
