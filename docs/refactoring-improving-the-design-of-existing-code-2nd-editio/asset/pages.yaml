  md: 'Having a well-factored program helps with this style of optimization in two
    ways. First, it gives me time to spend on tuning. With well-factored code, I can
    add functionality more quickly. This gives me more time to focus on performance.
    (Profiling ensures I spend time on the right place.) Second, with a well-factored
    program I have finer granularity for my performance analysis. My profiler leads
    to smaller parts of the code, which are easier to tune. With clearer code, I have
    a better understanding of my options and what kind of tuning will work.


    I found that refactoring helps me write fast software. It slows the software in
    the short term while I''m refactoring, but makes it easier to tune during optimization.
    I end up well ahead.


    # WHERE DID REFACTORING COME FROM?


    I''ve not succeeded in pinning down the birth of the term “refactoring.” Good
    programmers have always spent some time cleaning up their code. They do this because
    they have learned that clean code is easier to change than messy code, and good
    programmers know that they rarely write code the first time around.


    Refactoring goes beyond this. In this book, I''m advocating refactoring as a key
    element in the whole process of software development. Two of the first people
    to recognize the importance of refactoring were Ward Cunningham and Kent Beck,
    who worked with Smalltalk from the 1980s onward. Smalltalk is an environment that
    even then was particularly hospitable to refactoring. It is a very dynamic environment
    that allows you to quickly write highly functional software. Smalltalk had a very
    simple-link-execute cycle for its time, which made it easy to change things quickly
    at a time when overnight compile cycles were unknown. It is also object-oriented
    and provides powerful tools for minimizing the impact of change behind well-defined
    interfaces. Ward and Kent explored software development approaches towards this
    kind of environment, and their work developed into Extreme Programming. They realized
    that refactoring was important in improving their productivity and, ever since,
    been working with refactoring, applying it to serious software projects and refining
    it.


    Ward and Kent''s ideas were a strong influence on the Smalltalk community, and
    the notion of refactoring became an important element in the Smalltalk community.
    Another leading figure in the Smalltalk community is Ralph Johnson, a professor
    at the University of Illinois at Urbana-Champaign, who is famous as one of the
    authors of the “Gang of Four” [of] book on design patterns. One of Ralph’s greatest
    interests is in developing software frameworks. He explored how refactoring can
    help develop an'
  merge: -1
  pgno: 79
- img_proc: true
  md: 'efficient and flexible framework.


    Billdyke was one of Ralph''s doctoral students and was particularly interested
    in frameworks. He saw the potential value of refactoring and saw that it could
    be applied to much more than Smalltalk. His background was in telephone switch
    development, in which a great deal of complexity accrues over time and changes
    are difficult to make. Bill''s doctoral research looked at refactoring from a
    tool builder''s perspective. Bill was interested in refactorings that would be
    useful for C++ framework development; he researched the necessary semantics-preserving
    refactorings and showed how to prove they were semantics-preserving and how a
    tool could implement these ideas. Bill''s doctoral thesis [Opdyke] was the first
    substantial work on refactoring.


    I remember Bill at the OOPSLA conference in 1992. We sat in a café and he told
    me about his research. I remember thinking, "Interesting, but not that important."
    Boy, I was wrong!


    John Brent and Don Roberts took the refactoring tool ideas much further to produce
    the Refactoring Browser, the first refactoring tool, appropriately for the Smalltalk
    environment.


    And me? I''d always been inclined to clean code, but I''d never considered it
    to be important. Then, I worked on a project with Kent and saw the way he used
    refactoring. I saw the difference it made in productivity and quality. That experience
    convinced me that refactoring was a very important technique. I was frustrated,
