  md: '# SLIDE STATEMENTS


    formerly: Consolidate Duplicate Conditional Fragments


    ![](img/59d9309e6ee8107844bcfe6e4bdc6c2e_251_0.png)


    ```

    const pricingPlan = retrievePricingPlan();

    const order = retrieveOrder();

    let charge;

    const chargePerUnit = pricingPlan.unit;

    ```


    ![](img/59d9309e6ee8107844bcfe6e4bdc6c2e_251_1.png)


    ```

    const pricingPlan = retrievePricingPlan();

    const chargePerUnit = pricingPlan.unit;

    const order = retrieveOrder();

    let charge;

    ```


    # Motivation


    Code is easier to understand when things that are related to each other appear
    together. If several lines of code access the same data structure, it''s best
    for them to be together rather than intermingled with code accessing other data
    structures. At its simplest, I use Slide Statements to keep such code together.
    A very common case of this is declaring and using variables. Some people like
    to declare all their variables at the top of a function. I prefer to declare the
    variable before I use it.


    Usually, I move related code together as a preparatory step for another refactoring,
    often an Extract Function (106). Putting related code into a clearly separated
    function is a better separation than just moving a set of lines, but I can''t
    do the Extract Function (106) unless the code is together in the first place.


    # Mechanics


    +   - Identify the target position to move the fragment to. Examine statements
    between source and target to see if there is interference for the candidate fragment.
    Abandon action if there is any interference.


    A fragment cannot slide backwards earlier than any element it references is declared.


    A fragment cannot slide forwards beyond any element that references it.'
