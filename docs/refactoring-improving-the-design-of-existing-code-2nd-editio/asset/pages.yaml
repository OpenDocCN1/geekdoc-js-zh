  md: 'If I’m writing tests like before refactoring, I would probably discard this
    test. Refactoring should preserve observable behavior; an error like this is outside
    the bounds of observable, so I need not be concerned if refactoring changes the
    code’s response to this condition.


    If this error could lead to bad data running around the program, causing a failure
    that will be hard to debug, I might use Introduce Assertion (302) to fail fast.
    I don''t add tests to catch such assertion failures, as they are themselves a
    form of test.


    ![](img/59d9309e6ee8107844bcfe6e4bdc6c2e_115_0.png)


    > Don''t let the fear that testing can''t catch all bugs stop you from writing
    tests that catch most bugs.


    When do you stop? I''m sure you have heard many times that a program has no bugs
    by testing. That''s true, but it does not affect the ability of testing to speed
    up programming. I''ve seen various proposed rules to ensure you have tested every
    combination of everything. It''s worth taking a look at these—but don''t let them
    get to you. There is a law of diminishing returns in testing, and there is the
    danger that by trying to write too many tests you become discouraged and end up
    nothing. You should concentrate on where the risk is. Look at the code and see
    where it becomes complex. Look at a function and consider the likely areas of
    error. Your tests will not find every bug, but as refactor, you will understand
    the program better and thus find more bugs. Although I always start refactoring
    with a test suite, I invariably add to it as I go along.


    # MUCH MORE THAN THIS


    That''s as far as I''m going to go in this chapter—after all, this is a book on
    refactoring, not on testing. But testing is an important topic, but because it''s
    a necessary foundation for refactoring and it''s a valuable tool in its own right.
    While I''ve been happy to see the growth of refactoring as a programming practice
    since I wrote this book, I''ve even been happier to see the change in attitudes
    to testing. Previously seen as the responsibility of a secondary (and inferior)
    group, testing is now increasingly a first-class concern of any decent software
    developer. Architectures often are, rightly, judged on their testability.


    The kinds of tests I''ve shown here are unit tests, designed to operate on a small
    area of the code and run fast. They are the backbone of self-testing code; most
    tests in such a system are unit tests. There are other kind of tests too, focusing
    on integration between components, exercising multiple levels of the software
    together, looking for'
  merge: -1
  pgno: 115
- img_proc: true
  md: 'performance issues, etc. (And even more varied than the types of tests are
    the arguments people get into how to classify them.)


    Like most aspects of programming, testing is an iterative activity. Unless you
    are either very skilled or very lucky, you won''t get the tests right first time.
    I find myself constantly working on the test suite—just as I work on the main
    code. Naturally, this means adding new tests as I add new features, but it also
    involves looking at the existing tests. Are they clear enough? I need to refactor
    them so I can easily understand what they are doing? Have I got the right tests?
    An important habit to get into is to respond to a bug by writing a test that reveals
    the bug. Only after I have the test do I fix the bug. By having the test, I know
    the bug will stay dead. I also think about that bug and its test: Does it give
    me clues to other gaps in the test suite?


    > When you get a bug report, start by writing a unit test that exposes the bug.


    A common question is, “How much testing is enough?” There''s no good measurement
    for this. Some people advocate using test coverage [mf-tc] as a measure, but test
    coverage analysis is only good for identifying untested areas of the code, not
    for assessing the quality of a test suite.


    The best measure for a good enough test suite is subjective: How confident are
    you that if someone introduces a defect into the code, some test will fail? This
    isn''t something that can be objectively analyzed, and the aim of self-testing
    is to get that confidence. If I can refactor my code and be pretty sure that I''ve
    not introduced a bug because my tests come back green—then I can be happy that
    I have good tests.


    It is possible to write too many tests. One sign of that is when I spend more
    time changing the tests than the code under test—and I feel the tests are slowing
    me down. But while over-testing does happen, it''s vanishingly rare compared to
    under-testing.'
