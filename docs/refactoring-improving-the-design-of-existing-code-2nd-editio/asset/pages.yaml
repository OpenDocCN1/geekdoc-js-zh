  md: '# # Chapter 4

    Building Tests


    Refactoring is a valuable tool, but it can''t come alone. To do refactoring properly,
    I need a solid suite of tests to spot my inevitable mistakes. Even with automated
    refactoring tools, many of my refactorings will still need checking via a test
    suite.


    I don''t find this to be a disadvantage. Even without refactoring, writing good
    tests increases my effectiveness as a programmer. This was a surprise for me and
    is counterintuitive for most programmers—so it''s worth explaining why.


    # ## THE VALUE OF SELF-TESTING CODE


    If you look at how most programmers spend their time, you''ll find that writing
    code is actually quite a small fraction. Some time is spent figuring out what
    ought to be going, some time is spent designing, but most time is spent debugging.
    I''m sure every reader can remember hours of debugging—often, well into the night.
    Every programmer can tell a story of a bug that took a whole day (or more) to
    find. Fixing the bug is usually pretty quick, but finding it is a nightmare. and
    when you do a bug, there''s always a chance that another one will appear and that
    you might not even notice it much later. And you''ll spend ages finding that bug.


    The event that started me on the road to self-testing code was a talk at OOPSLA
    in 1992. (I think it was "Beddarra" Dave Thomas) said offhandedly, "Classes should
    contain their own tests." So I decided to incorporate tests into the code base
    together with the production code. As I also doing iterative development, I tried
    adding tests as I completed each iteration. The project on which I was working
    at that time was quite small, so we put iterations every week or so. Running the
    tests became fairly straightforward—although it was easy, it was still boring.
    This was because every test produced output to the console that I had to check.
    Now I''m a pretty lazy person and am prepared to work hard in order to avoid work.
    I realized that, instead of looking at the screen to see if it printed out some
    information from the model, I could get the computer to make that test. All I
    had to do was put the'
  merge: -1
  pgno: 99
- img_proc: true
  md: 'output expected in the test code and a comparison. Now I could run the tests
    and they would just print “OK” to the screen if all was well. The software was
    now self-testing.


    > Make sure all tests are fully automatic and that they check their own results.


    Now it was easy to run tests—as easy as compiling. So I started to run tests every
    time I compiled. So, I began to notice my productivity had shot upward. I realized
    that I wasn''t spending so much time debugging. If I added a bug that was caught
    by a previous test, it would show up as soon as I ran that test. The test had
    worked before, so I would know that the bug was in the work I had done since last
    test. And I ran the tests frequently—which means only a few minutes had elapsed.
    I knew that the source of my bug was the code I had just written. As was a small
    amount of code that was still fresh in my mind, the bug was easy to find. Bugs
    that would have otherwise taken an hour or more to find took a couple of minutes
    at most. Not only was my software self-testing, but by running the tests frequently
    I had a powerful bug detector.


    As I noticed this, I became more aggressive about doing the tests. Waiting for
    the end of an increment, I would add the tests immediately after writing a bit
    of function. Every day I would add a couple of new features and the tests to test
    them. I had ever spent more than a few minutes hunting for a regression bug.


    > A suite of tests is a powerful bug detector that decapitates the time it takes
    to find bugs.


    Tools for writing and organizing these tests have developed a great deal since
    my experiments. While flying from Switzerland to Atlanta for OOPSLA 1997, Kent
    Beck paired with Erich Gamma to port his testing framework from Smalltalk to Java.
    The resulting framework, called JUnit, has been enormously influential for program
    testing, inspiring a huge variety of similar tools [mf-xunit] in lots of different
    languages.


    Admittedly, it is not so easy to persuade others to follow this route. Writing
    the tests means a lot of extra code to write. Unless you actually experienced
    how it speeds programming, self-testing does not seem to make sense. This is not
    helped by the fact that many people have never learned to write tests or even
    to think about them. When tests are manual, they are gut-wrenchingly boring. But
    when they are automatic, tests can actually be fun to write.'
