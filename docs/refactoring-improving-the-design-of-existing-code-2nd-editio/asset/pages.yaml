    # LONG FUNCTION


    In our experience, the programs that live best and longest are those with short
    functions. Programmers new to such a code base often feel that no computation
    ever takes place—that the program is an endless sequence of delegation. When you
    have lived with such a program for a few years, however, you learn how valuable
    all those little functions are. All of the payoffs of indirection—explanation,
    sharing, and choosing—are supported by small functions.


    Since the early days of programming, people have realized that the longer a function
    is, the more difficult it is to understand. Older languages carried an overhead
    in subroutine calls, which deterred people from small functions. Modern languages
    have pretty much eliminated overhead for in-process calls. There is still overhead
    for the reader of the code because you have to switch context to see what the
    function does. Development environments allow you to quickly jump between a function
    call and its declaration, or to see both functions at once, help eliminate this
    step, but the real key to making it easy to understand small functions is naming.
    If you have a good name for a function, you mostly don''t need to look at its
    body.


    The effect is that you should be much more aggressive about decomposing functions.
    A heuristic we follow is that whenever we feel the need to comment something,
    we write a function instead. Such a function contains the code that we wanted
    to write but is named after the *intention* of the code rather than the way it
    works. We may do this on a group of lines or even on a single line of code. We
    do this even if the method is longer than the code it replaces—provided the method
    name explains the purpose of the code. The key here is not function length but
    the semantic distance between what the method does and how it does it.


    Ninety-nine percent of the time, all you have to do is shorten a function **Extract
    Function (106)**. Find parts of the function that seem to go nicely together and
