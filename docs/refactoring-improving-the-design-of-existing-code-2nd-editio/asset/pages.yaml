    \ The tests take only a few seconds to run, and as you will see, I run often.\n\
    \nAn important part of the tests is the way they report their results. They either\
    \ go green, meaning that all the strings are identical to the reference strings,\
    \ or red, showing a list of failures—the lines that turned out differently. The\
    \ tests are thus self-checking. It is vital to make them, or I end spending time\
    \ hand-checking values from the test against values on a desk pad, and that would\
    \ slow me down. Modern testing frameworks provide all the features needed to write\
    \ and run self-checking tests.\n\n> Before you start refactoring, make sure you\
    \ have a solid suite of tests. The tests must be self-checking.\n\nAs I do the\
    \ refactoring, I'll lean on the tests. I think of them as a bug detector to protect\
    \ my own mistakes. By writing what I want, in the code and in the test, I have\
