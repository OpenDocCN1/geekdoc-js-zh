  md: 'The example gives some insight into when using subclasses like this is useful.
    Here, I''ve moved lookup from two functions (amountFor and volumeCreditsFor) to
    a single constructor function createPerformanceCalculator. The more functions
    there depend on the same type of polymorphism, the more useful this approach becomes.


    An alternative to what I''ve done would be to have the calculator itself, instead
    of the calculator returning the intermediate data structure. One of the features
    of JavaScript''s class system is that with it, getters look like direct access.
    My choice on whether to return the instance or calculate separate output data
    depends on who is using the downstream data structure. In this case, I preferred
    to show how to use the intermediate data structure to hide the decision to use
    a polymorphic calculator.


    # FINAL THOUGHTS


    This is a simple example, but I hope it will give you a feeling for what refactoring
    is like. I''ve used several refactorings, including Extract Function (106), Inline
    Variable (123), Move Function (198), and Replace Conditional with Polymorphism
    (272).


    There were three major stages to this refactoring episode: decomposing the original
    function into a set of nested functions, using Split Phase (154) to separate the
    calculation and printing code, and finally introducing a polymorphic calculator
    for the calculation logic. Each of these added structure to the code, enabling
    me to better communicate what the code was.


    As is often the case with refactoring, the early stages were mostly driven by
    trying to understand what was going on. A common sequence is: Read the code, gain
    some insight, and use refactoring to move that insight from your head back into
    the code. The clearer code then makes it easier to understand, leading to deeper
    insights and a beneficial positive feedback loop. There are still some improvements
    I could make, but I feel Ive done enough to pass my test of leaving the code significantly
    better than how I found it.


    > The true test of good code is how easy it is to change it.


    I''m talking about improving the code—but programmers love to argue about what
    good code looks like. I know some people object to my preference for small, well-named
    functions. If we consider this to be a matter of aesthetics, where nothing is
    either good'
