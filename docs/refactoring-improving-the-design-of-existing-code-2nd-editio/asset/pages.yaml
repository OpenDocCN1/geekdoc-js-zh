  md: '# Motivation


    You''ve probably read guidelines that a class should be a crisp abstraction, only
    handle a few responsibilities, and so on. In practice, classes grow. You add some
    operations here, a bit of data there. You add a responsibility to a class feeling
    that it''s not worth a separate class—but that responsibility grows and breeds,
    the class becomes too complicated. Soon, your class is as crisp as a microwaved
    duck.


    Imagine a class with many methods and quite a lot of data. A class that is too
    big to understand easily. You need to consider where it can be split—and split
    it. A good sign is when a subset of the data and a subset of the methods seem
    to go together. Other good signs are subsets of data that usually change or are
    particularly dependent on each other. A useful test is to ask yourself what would
    happen if you remove a piece of data or a method. What other fields and methods
    would become nonsense?


    One sign that often crops up later in development is the way the class is subtyped.
    You may find that subtyping affects only a few features or that some features
    need to be subtyped one way and other features a different way.


    # Mechanics


    +   - Decide how to split the responsibilities of the class.


    +   - Create a new child class to express the split-off responsibilities.


    If the responsibilities of the original parent class no longer match its name,
    rename the parent.


    +   - Create an instance of the child class when constructing the parent and add
    a link from parent to child.


    +   - Use Move Field (207) on each field you wish to move. Test after each move.


    +   - Use Move Function (198) to move methods to the new child. Start with lower-level
