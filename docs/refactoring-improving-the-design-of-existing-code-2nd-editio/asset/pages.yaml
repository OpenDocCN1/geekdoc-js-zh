    # Encapsulating the Value


    The basic refactoring I''ve outlined here encapsulates reference to some data
    structure, allowing me to control its access and reassignment. But it doesn''t
    control changes to that structure.


    # Click here to view code image


    ```

    const owner1 = defaultOwner();

    assert.equal("Fowler", owner1.lastName, "when set");

    const owner2 = defaultOwner();

    owner2.lastName = "Parsons";

    assert.equal("Parsons", owner1.lastName, "after change owner2"); // is this

    ```


    The basic refactoring encapsulates the reference to the data item. In many cases,
    this is all I want to do for the moment. But I often want to take the encapsulation
    deeper to control just changes to the variable also to its contents.


    For this, I have a couple of options. The simplest one is to prevent any changes
    to the value. My favorite way to handle this is by modifying the getting function
    to return a copy of the data.


