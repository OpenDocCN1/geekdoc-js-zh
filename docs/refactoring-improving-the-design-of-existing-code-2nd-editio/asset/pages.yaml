  md: '+   • Copy the extracted code from the source function into the new target
    function.


    +   • Scan the extracted code for references to any variables that are local in
    scope to the source function and will not be in scope for the extracted function.
    Pass them as parameters.


    If I extract into a nested function of the source function, I don''t run into
    these problems.


    Usually, these are local variables and parameters to the function. The most general
    approach is to pass all such parameters in arguments. There are usually no difficulties
    for variables that are used but not assigned to.


    If a variable is only used inside the extracted code but is declared outside,
    move the declaration outside the extracted code.


    Any variables that are assigned to need more care if they are passed by value.
    If there''s only one of them, I try to treat the extracted code as a query and
    assign the result to the variable concerned.


    Sometimes, I find that too many local variables are being assigned by the extracted
    code. It''s better to abandon the extraction at this point. When this happens,
    I consider other refactorings such as Split Variable (240) or Replace Temp Query
    (178) to simplify variable usage and revisit the extraction later.


    +   • Compile all variables are dealt.


    Once all the variables are dealt, it can be useful to compile if the language
    environment does compile-time checks. Often, this will help find any variables
    that haven''t been dealt with properly.


    +   • Replace the extracted code in the source function with a call to the target
    function.


    +   • Test.


    +   • Look for other code that''s the same or similar to the code just extracted,
    and consider using Replace Inline Code with Function Call (222) to call the new
    function.


    Some refactoring tools support this directly. Otherwise, it can be worth doing
    quick searches to see if duplicate code exists elsewhere.'
