  md: 'Encapsulation means modules need to know less about other parts of the system.
    Then, when things change, fewer modules need to be told about the change—which
    makes the change easier to make.


    When we are first taught object orientation, we are told that encapsulation hiding
    our fields. As we become more sophisticated, we realize there is more that we
    can encapsulate.


    If I have some client code that calls a method defined on an object in a field
    of a server object, the client needs to know about this delegate object. If the
    delegate changes its interface, changes propagate to all the clients of the server
    that use the delegate. I can remove this dependency by placing a simple delegating
    method on the server that hides the delegate. Then any changes I make to the delegate
    propagate only to the server and not to the clients.


    ![](img/59d9309e6ee8107844bcfe6e4bdc6c2e_216_0.png)


    # Mechanics


    +   - For each method on the delegate, create a simple delegating method on the
    server.

    - Adjust the client to call the server. Test after each change.

    - If no client needs to access the delegate anymore, remove the server’s accessor
    for the delegate.

    - Test.


    # Example


    I start with a person and a department.


    ```

    class Person...

