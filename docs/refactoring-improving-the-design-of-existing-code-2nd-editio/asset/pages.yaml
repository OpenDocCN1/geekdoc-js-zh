- img_proc: true
  md: 'joints in our software systems. And, as with any construction, much depends
    on those joints. Good joints allow me to add new parts to the system easily, but
    bad ones are a constant source of difficulty, making it harder to figure out what
    the software does and how to modify it as my needs change. Fortunately, software,
    being soft, allows me to change these joints, providing I do it carefully.


    The most important element of such a joint is the name of the function. Good names
    allow me to understand what the function does when I see it, without seeing the
    code that defines its implementation. However, coming up with good names is hard,
    and I rarely get my names right the time. When I find a name that''s confused
    me, I''m tempted to leave it—after all, it''s only a name. This is the work of
    the evil demon Obfuscatis; for the sake of my program I must never listen to him.
    If I see a function with the wrong name, it is imperative that I change it as
    soon as I understand what a better name could be. That way, the next time I''m
    looking at this code, I don''t have to figure out *again* what''s going on. (Often,
    a good way to improve a name is to write a comment to describe the function''s
    purpose, then turn that comment into a name.)


    Similar logic applies to a function''s parameters. The parameters of a function
    dictate how a function fits in the rest of its world. Parameters set the context
    in which I can use a function. If I have a function to format a person''s telephone
    number, and that function takes a person as its argument, I can''t use it to format
    a company''s telephone number. If I replace the parameter with the telephone number
    itself, then the formatting code is more widely useful.


    Apart from increasing a function''s range of applicability, I can also remove
    some coupling, changing what modules need to connect to others. Telephone formatting
    logic may sit in a module that has no knowledge about people. Reducing how much
    modules need to know each other helps reduce how much I need to put into my brain
    when I change something—and my brain isn''t as big as it is (that doesn''t say
    anything about the size of its container, though).


    Choosing the right parameters isn''t something that adheres to simple rules. I
    may have a simple function for determining if a payment is overdue, by looking
    at if it''s older than 30 days. Should the parameter to this be the payment object,
    or the due date of the payment? But if I use the payment couples to the interface
    of the payment object, I can easily access other properties of the payment, should
    the logic evolve, without having to change every bit of code that calls this function—essentially,
    increasing the encapsulation of the function.'
