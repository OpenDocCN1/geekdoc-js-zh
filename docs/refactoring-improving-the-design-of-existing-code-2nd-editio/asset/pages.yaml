  md: "may require that at least one of a group of fields has a value in it.\n\nSuch\
    \ assumptions are often not stated but can only be deduced by looking through\
    \ an algorithm. Sometimes, the assertions are stated with a comment. A better\
    \ technique is to make the assumption explicit by writing an assertion.\n\nAn\
    \ assertion is a conditional statement that is assumed to be true. Failure of\
    \ an assertion indicates a programmer error. Assertion failures should never be\
    \ checked by other parts of the system. Assertions should be written so that the\
    \ program functions equally correctly if they are all removed; indeed, some languages\
    \ provide assertions that can be disabled by a compile-switch.\n\nI often see\
    \ people encourage using assertions in order to find errors. While this is certainly\
    \ a Good Thing, it is not the only reason to use them. I find assertions to be\
    \ a valuable form of communication—they tell the reader something about the assumed\
    \ state of the program at this point of execution. I also find them handy for\
    \ debugging, and their communication value I mean to leave them in once I have\
    \ fixed the error I'm chasing. Self-testing code reduce their value for debugging,\
    \ as steadily narrowing unit tests do the job better, but I still like assertions\
    \ for communication.\n\n# Mechanics\n\n+   - When you see that a condition is\
    \ assumed to be true, add an assertion to state it.\n\nSince assertions should\
    \ not affect the running of a system, adding one is always behavior-preserving.\n\
    \n# Example\n\nHere's a simple tale of discounts. A customer can be given a discount\
    \ rate to apply to all their purchases:\n\nclass Customer...\n\n# Click here to\
    \ view code image\n\n```\napplyDiscount(aNumber) {\n  return (this.discountRate\n\
    \    ? aNumber - (this.discountRate * aNumber)\n    : aNumber);\n}\n```"
