    \n# # Motivation\n\nWhen we put code into production, even on people’s devices,\
    \ we aren't charged by weight. A few unused lines of code don't slow down our\
    \ systems nor take up significant memory; indeed, decent compilers will instinctively\
    \ remove them. But unused code is still a significant burden when trying to understand\
    \ how the software works. It doesn't carry any warning signs telling programmers\
    \ that they can ignore this function as it’s never called any more, so they still\
    \ have to spend time understanding what it’s doing and why changing it doesn't\
    \ seem to alter the output as they expected.\n\nOnce code isn't used any more,\
    \ we should delete it. I don't worry that I may need it in the future; should\
    \ happen, I have my version control system so I can always dig it out again. If\
    \ it's something I really think I may need one day, I might put a comment into\
    \ the code that mentions the last code and which revision it was removed in—honestly,\
    \ I can't remember the last time I did that, or regretted I hadn't done it.\n\n\
    Commenting out dead code was a common habit. This was useful in the days before\
    \ version control systems were widely used, or when they were inconvenient. Now,\
    \ when I can put even the smallest code base under version control, that’s no\
    \ longer needed.\n\n# # Mechanics\n\n+   - If the dead code can be referenced\
    \ from outside, e.g., when it’s a full function, do a search to check for callers.\n\
    - Remove the dead code.\n- Test."
