  md: 'functions into commands when I need to. But we must not forget that flexibility,
    as ever, comes at a price in complexity. Given the choice between a first-class
    function and a command, I''ll pick the function 95% of the time. I only use a
    command when I specifically need a facility that simpler approaches can''t provide.


    Like many words in software development, “command” is rather overloaded. In the
    context I''m using it is an object that encapsulates a request, following the
    command pattern in Design Patterns [gof]. When I use “command” in this sense,
    I use “command object” to set the context, and “command” afterwards. The word
    “command” is also used in the command-query separation principle [mf-cqs], where
    a command is an object method that changes observable state. I''ve always tried
    to avoid using command in that sense, preferring “modifier” or “mutator.”


    # Mechanics


    +   - Create an empty class for the function. Name it based on the function.


    +   - Use Move Function (198) to move the function to the empty class.


    Keep the original function as a forwarding function until at least the end of
    the refactoring.


    Follow any convention the language has for naming commands. If there is no convention,
    choose a generic name for the command’s execute function, such as “execute” or
    “call”.


    +   - Consider making a field for each argument, and move these “command arguments
    to the constructor.


    # Example


    The JavaScript language has many faults, but one of its great decisions was to
    make functions first-class entities. This does not have to go through all the
    hoops of creating commands for common tasks that I need to do in languages without
    this facility. But there are still times when a command is the right tool for
    the job.


