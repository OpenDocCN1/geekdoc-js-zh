  md: 'The mechanics come from my own notes to remember how the refactoring when I
    haven''t done it for a while. As such, they are somewhat terse, usually without
    explanations of why the steps are done that way. I give a more expansive explanation
    in the example. This way, the mechanics are short notes you can refer to when
    you know the refactoring but to look up the steps (at least is how I use them).
    You''ll probably need to read the examples when you first do the refactoring.


    I''ve written the mechanics in such a way that each step of each refactoring is
    as small as possible. I emphasize the safe way of doing the refactoring—which
    is to take very small steps and test every one. At work, I usually take larger
    steps than some of the steps described, but if I run into a bug, I take out the
    last step and take the smaller steps. The steps thus include a number of references
    to special cases. The steps thus also function as a checklist; I often forget
    these things myself.


    Although I (with few exceptions) only list one set of mechanics, they aren''t
    the only way to carry out the refactoring. I selected the mechanics in the book
    they work well most of the time. It''s likely you''ll vary them as you get more
    practice in refactoring, and that''s fine. Just remember that the key is to take
    small steps—and the trickier the situation, the smaller of the steps.


    The examples are of the laughably simple textbook kind. My aim with the examples
    is to help explain the basic refactoring with minimal distractions, so I hope
    you''ll forgive the simplicity. (They are certainly not examples of good business
    modeling.) I''m sure you''ll be able to apply them to your more complex situations.
    Some very simple refactorings don''t have examples because I didn''t think an
    example would add.


    In particular, remember that the examples are included only to illustrate the
    one refactoring under discussion. In most cases, there are still problems with
    the code at the end—but fixing these problems requires other refactorings. In
    a few cases where refactorings often go together, I carry examples from one-refactoring
    to another. In most cases, I leave the code as it is after the single refactoring.
    I do this to make each refactoring self-contained, because the primary role of
    the catalog is to be a reference.


    I use color to highlight changed code where it may be difficult to spot among
    code that has not been changed. I do not use highlighting for all changed code,
    because too much defeats the purpose.


    # THE CHOICE OF REFACTORINGS


    This is by no means a complete catalog of refactorings. It is, I hope, a collection
    of those most useful to have them written down. "most useful" I mean those that
    are both'
