  md: "These examples illustrate that the phrase “Favor object composition over class\
    \ inheritance” might better said as “Favor a judicious mixture of composition\
    \ and inheritance over either alone”—but I fear that is not as catchy.\n\n# REPLACE\
    \ SUPERCLASS WITH DELEGATE\n\nformerly: Replace Inheritance with Delegation\n\n\
    ![](img/59d9309e6ee8107844bcfe6e4bdc6c2e_446_0.png)\n\n```\nclass List {...}\n\
    class Stack extends List {...}\n```\n\n```\nclass Stack {\n  constructor() {\n\
    \    this._storage = new List();\n  }\n}\nclass List {...}\n```\n\n# Motivation\n\
    \nIn-oriented programs, inheritance is a powerful and easily available way to\
    \ reuse existing functionality. I inherit from some existing class, then override\
    \ and add additional features. But subclassing can be done in a way that leads\
    \ to confusion and complication.\n\nOne of the classic examples of mis-inheritance\
    \ from the early days of objects was making a stack a subclass of list. The idea\
    \ that led to this reusing of list’s data storage and operations to manipulate\
    \ it. While it’s good to reuse, this inheritance had a problem: All the operations\
    \ of the list were present on the interface of the stack, most of them were not\
    \ applicable to a stack. A better approach is to make the list into a field of\
    \ the stack and delegate the necessary operations to it.\n\nThis is an example\
    \ of one reason to use Replace Superclass with Delegate—if functions"
