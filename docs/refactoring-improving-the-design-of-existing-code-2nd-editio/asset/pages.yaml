  md: "```\nclass Account {\n    get overdraftCharge() {...}\n```\n\n```\nclass AccountType\
    \ {\n    get overdraftCharge() {...}\n```\n\n# # Motivation\n\nThe heart of a\
    \ good software design is its modularity—which is my ability to make most modifications\
    \ to a program while only having to understand a small part of it. To get this\
    \ modularity, I need to ensure that related software elements are grouped together\
    \ and the links between them are easy to find and understand. But my understanding\
    \ of how to do this is not static—as I better understand what I'm doing, I learn\
    \ how to best group together software elements. To reflect growing understanding,\
    \ I need to move elements around.\n\nAll functions live in some context; it may\
    \ be global, but usually it's some form of a module. In an object-oriented program,\
    \ the core modular context is a class. Nesting a function within another creates\
    \ another common context. Different languages provide forms of modularity, each\
    \ creating a context for a function to live in.\n\nOne of the most straightforward\
    \ reasons to move a function is when it references elements in other contexts\
    \ than the one it currently resides in. Moving it with those elements often improves\
    \ encapsulation, allowing other parts of the software to be less dependent on\
    \ the details of this module.\n\nSimilarly, I may move a function because of where\
    \ its callers live, or where I need to call it from my new enhancement. A function\
    \ defined as a helper inside another function may have value on its own, so it's\
    \ worth moving it to somewhere more accessible. A method on a class may be easier\
    \ for me to use if shifted to another.\n\nDeciding to move a function is rarely\
    \ an easy decision. To help decide, I examine the current and candidate contexts\
    \ for that function. I need to look at what functions call this one, what functions\
    \ are called by the moving function, and what data that function uses. **Combine\
    \ Functions into Class (144)** or **Extract Class (182)**. Although it can be\
    \ difficult"
