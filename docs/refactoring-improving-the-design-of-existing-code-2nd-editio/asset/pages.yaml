  md: 'this is often, even usually, an unachievable goal. Repeatedly, I saw only understand
    what they really needed from software they’d had a chance to use it, and saw the
    impact it made to their work.


    One way of dealing with future changes is to put flexibility mechanisms into the
    software. As I write some function, I can see that it has a general applicability.
    To handle the different circumstances I anticipate to be used in, I can see a
    dozen parameters I could add to that function. These parameters are flexibility
    mechanisms—and, like most mechanisms, are not a free lunch. Adding all those parameters
    complicates the function for the one case it’s right now. If I miss a parameter,
    all the parameterization I have added makes it harder for me to add more. If I
    often get my flexibility mechanisms wrong—either because the changing needs didn’t
    work the way I expected or my mechanism design was faulty. Once I take all into
    account, most of the time my flexibility mechanisms actually *slow down* my ability
    to react to change.


    With refactoring, I can use a different strategy. Instead of speculating on what
    flexibility I will need in the future and what mechanisms will best enable, I
    build software that solves only the currently understood needs, but I make this
    software excellently designed for those needs. As my understanding of the users''
    changes, I use refactoring to adapt the architecture to these new demands. I can
    happily include mechanisms that don’t increase complexity (such as small, well-named
    functions) but any flexibility that complicates the software has prove itself
    before I include it. If I don''t have different values for a parameter from the
    callers, I don’t add it to the parameter list. Should the time that I need to
    add it, **Parameterize Function (310)** is an easy refactoring to apply. I often
    find it useful to estimate how it would be by refactoring later to support an
    anticipated change. Only if I can see that it would be substantially harder to
    refactor later I consider adding a flexibility mechanism now.


    This approach to design goes under various names: simple design, incremental design,
    or yagni [mf-yagni](originally an acronym for “you’re not going to need it”).
    Yagni doesn’t imply that architectural thinking disappears, although it is sometimes
