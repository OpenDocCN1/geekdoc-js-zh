  md: '# Chapter 11

    Refactoring APIs


    Modules and their functions are the building blocks of our software. APIs are
    the joints that we use to plug them together. Making these APIs easy to understand
    and use is important but also difficult: I need to refactor them as I learn how
    to improve them.


    A good API clearly separates any functions that update data from those that only
    read data. If I see them combined, I use Separate Query from Modifier (306) to
    tease them apart. I can unify functions that only vary to a value with Parameterize
    Function (310). Some parameters, however, are really just a signal of an entirely
    different behavior and are best excited with Remove Flag Argument (314).


    Data structures are often unpacked unnecessarily when passed between functions;
    I prefer to keep them together with Preserve Whole Object (319). Decisions on
    what should be passed as a parameter, and what can be resolved by the called function,
    are ones I need to revisit with Replace Parameter with Query (324) and Replace
    Query with Parameter (327).


    A class is a common form. I prefer my objects to be as immutable as possible,
    so I use Remove Setting Method (331) whenever I can. Often, when a caller asks
    for a new object, I need more flexibility than a simple constructor gives, which
    I can get by using Constructor with Factory Function (334).


    The last two refactorings address the difficulty of breaking down a particularly
    complex function that passes a lot of data around. I can turn that function into
    an object with Replace Function with Command (337), which makes it easier to use
    Extract Function (106) on the function''s body. If I later simplify the function
    and no longer need it as a command object, I turn back into a function with Replace
    Command with Function (344).


    # SEPARATE QUERY FROM MODIFIER'
