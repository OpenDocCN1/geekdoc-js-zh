  md: 'callers of structure and change them in a single change. The complication,
    however, I also have to transform any data that uses the old field to use the
    new one. I write a small hunk of code that carries out this transform and store
    it in version control, together with the code that changes any declared structure
    and access routines. Then, whenever I need to migrate between two versions of
    the database, I run all the migration scripts that exist between my current copy
    of the database and my desired version.


    With regular refactoring, the key is here that each individual change is small
    yet captures a complete change, so the system still runs after applying the migration.
    Keeping them small means they are easy to write, but I string many of them into
    a sequence that can make a significant change to the database''s structure and
    the data stored in it.


    One difference from regular refactorings is that database changes often are best
    separated over multiple releases to production. This makes it easy to reverse
    any change that causes a problem in production. So, when renaming a field, my
    first commit would add the new database field but not use. I may then set up the
    updates so they update both old and new fields at once. I can then gradually move
    the readers over the new field. Once they have moved to the new field, and I have
    given a little time for any bugs to show themselves, would I remove the non-used
    old field. This approach to database changes is an example of a general approach
    of parallel change [mf-pc] (also called expand-contract).


    # REFACTORING, ARCHITECTURE, AND YAGNI


    Refactoring has profoundly changed how people think about software architecture.
    Early in my career, I was taught that software design and architecture was something
    to be worked on, and mostly completed, before anyone started writing code. Once
    the code was written, its architecture was fixed and could only decay due to carelessness.


    Refactoring changes this perspective. It allows me to significantly alter the
    architecture of software that''s been running in production for years. Refactoring
    can improve the design of existing code, as this book''s subtitle implies. But
    as I indicated earlier, changing legacy code is often challenging, especially
    when it lacks decent tests.


    The real impact of refactoring on architecture is how it can be used to form a
    well-designed code base that responds gracefully to changing needs. The biggest
    issue with finishing architecture before coding is that such an approach assumes
    the requirements for the software can be understood early on. But experience shows
    that'
