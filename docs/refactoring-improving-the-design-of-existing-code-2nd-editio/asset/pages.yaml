  md: 'One of the neatest ways to do a split like this is to divide the behavior into
    two sequential phases. A good example of this is when you have some processing
    inputs doesn''t reflect the logic you need to carry out the logic. Before you
    begin, you can massage the input into a convenient form for your main processing.
    Or, you can take the logic you need to do and break it down into sequential steps,
    where each step is significantly different in what it does.


    The most obvious example of this is a compiler. It''s a basic task to take some
    text (code in a programming language) and turn it into some executable form (e.g.,
    object code for a specific hardware). Over time, we''ve found this can be wisely
    split into a chain of phases: tokenizing the text, parsing the tokens into a syntax
    tree, then various steps of transforming the syntax tree (e.g., for optimization),
    and finally generating the object code. Each step has a limited scope and I can
    think of one without understanding the details of others.


    Splitting phases like this is common in large software; the various phases in
    a compiler can contain many functions and classes. But I can carry out the basic
    split-phase refactoring on any fragment of code—whenever I see an opportunity
    to wisely separate the code into different phases. The best clue is when different
    stages of the fragment use different sets of data and functions. By turning them
    into separate modules I can make this difference explicit, revealing the difference
    in the code.


    # Mechanics


    +   * Extract the second phase code into its own function.

    * Test.

    * Introduce an intermediate data structure as an additional argument to the extracted
    function.

    * Test.

    * Examine each parameter of the extracted second phase. If it is used by first
    phase, move it to the intermediate data structure. Test after each move.


    Sometimes, a parameter should not be used by the second phase. In this case, extract
    the results of each use of the parameter to a field of the intermediate data structure
    and use *Move Statements to Callers (217)* on the line that populates it.'
