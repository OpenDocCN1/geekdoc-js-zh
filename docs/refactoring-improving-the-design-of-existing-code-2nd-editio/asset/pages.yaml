  md: 'function call easier to understand. If many functions are called with the parts,
    they often duplicate the logic that manipulates these parts—logic that can often
    be moved to the whole.


    The main reason I wouldn''t do this is if I don''t want the called function to
    have a dependency on the whole—which typically occurs when they are in different
    modules.


    Pulling several values from an object to do some logic on alone is a smell (Feature
    Envy (77)), and usually a signal that this logic should be moved into the itself.
    Preserve Whole Object is particularly common after I''ve done Introduce Parameter
    Object (140), as I hunt down any occurrences of the original data clump to replace
    them with the new object.


    If several bits of code only use the same subset of an object''s features, then
    that may indicate a good opportunity for Extract Class (182).


    One case that many people miss is when an object calls another object with several
    of its own data values. If I see this, I can replace those values with a self-reference
    (JavaScript).


    # Mechanics


    +   Create an empty function with the desired parameters.


    Give the function an easily searchable name so it can be replaced at the end.


    +   Fill the body of the new function with a call to the old function, mapping
    the new parameters to the old ones.


    +   Run static checks.


    +   Adjust each caller to the new function, testing after each change.


    This may mean that some code that derives the parameter isn''t needed, so can
    can fall to Remove Dead Code (237).


    +   Once all original callers have been changed, use Inline Function (115) on
    the original function.


    +   Change the name of the new function and all its callers.


    # Example'
