- img_proc: true
  md: 'A fragment cannot slide over any statement that modifies an element references.


    A fragment that modifies an element can slide over any other element that references
    the modified element.


    +   * Cut the fragment from the source and paste into the target position.


    +   * Test.


    If the test fails, try breaking down the slide into smaller steps. Either slide
    over less code or reduce the amount of code in the fragment you''re moving.


    # Example


    When sliding code fragments, there are two decisions involved: what slide I''d
    like to do and whether I can do it. The first decision is very context-specific.
    On the simplest level, I like to declare elements close to where I use them, I''ll
    often slide a declaration down to its usage. But almost always I slide some code
    because I want to do another refactoring—perhaps to get a clump of code together
    to *Extract Function (106)*.


    Once I have a sense of I''d like to move some code, the next part is deciding
    if I can do it. This involves looking at the code slide and the code sliding over:
    Do they interfere with each other in a way that would change the observable behavior
    of the program?


    Consider the following fragment of code:


    # Click here to view code image


    ```

    1 const pricingPlan = retrievePricingPlan();

    2 const order = retrieveOrder();

    3 const baseCharge = pricingPlan.base;

    4 let charge;

    5 const chargePerUnit = pricingPlan.unit;

    6 const units = order.units;

    7 let discount;

    8 charge = baseCharge + units * chargePerUnit;

    9 let discountableUnits = Math.max(units - pricingPlan.discountThreshold);

    10 discount = discountableUnits * pricingPlan.discountFactor;

    11 if (order.isRepeat) discount += 20;

    12 charge = charge - discount;

    13 chargeOrder(charge);

    ```'
