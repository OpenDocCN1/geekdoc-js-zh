  md: '# Chapter 6

    A First Set of Refactorings


    I''m starting the catalog with a set of refactorings that I consider the most
    useful to learn first.


    Probably the most common refactoring I do is extracting code into a function (Extract
    Function (106)) or a variable (Extract Variable (119)). Since refactoring is all
    about change, it''s no surprise that I frequently use the inverses of those two
    (Inline Function (115) and Inline Variable (123)).


    Extraction is all about giving names, and I often need to change the names as
    Change Function Declaration (124) changes names of functions; I also use that
    refactoring to add or remove a function''s arguments. For variables, I use Rename
    Variable (137), which relies on Encapsulate Variable (132). When changing function
    arguments, I often find it useful to combine a common clump of arguments into
    a single object with Introduce Parameter Object (140).


    Forming and naming functions are essential low-level refactorings—but, once created,
    it''s necessary to group functions into higher-level modules. I use Combine Functions
    into Class (144) to group functions, together with the data they operate on, into
    a class. Another path I take is to combine them into a transform (Combine Functions
    into Transform (149)), which is particularly handy with read-only data. At a step
    further in scale, I can form these modules into distinct processing phases using
    Split Phase (154).


    # EXTRACT FUNCTION


    formerly: Extract Method


    inverse of: Inline Function (115)'
