    # Motivation


    Expressions can become very complex and hard to read. In such situations, local
    variables may help break the expression into something more manageable. In particular,
    they give me an ability to name a part of a more complex piece of logic. This
    allows me to better understand the purpose of what''s happening.


    Such variables are also handy for debugging, since they provide an easy hook for
    a debugger or print statement to capture.


    If I''m considering Extract Variable, it means I want to add a name to an expression
    in my code. Once I''ve decided to do that, I also think about the context of that
    name. If it''s only meaningful within the function I''m working on, then Extract
    Variable is a good choice—but if it makes sense in a broader context, I''ll consider
    the name available in that broader context, usually as a function. If the name
    is available more widely, other code can use that expression without having to
    repeat the expression, leading to less duplication and a better statement of my
    intent.


    The downside of promoting the name to a broader context is extra effort. If it''s
    significantly more effort, I''m likely to leave it till later when I can use Replace
    Temp with Query (108). But if it''s easy, I will do it now so the name is immediately
    available in the code. As a good example of this, if I''m working in a class,
    then Extract Function (106) is very easy to do.


    # Mechanics


    +   - Ensure that the expression you want to extract does not have side effects.'
