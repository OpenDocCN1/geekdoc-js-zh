    ```\n\n# Motivation\n\nSubclasses are useful. They support variations in data\
    \ structure and polymorphic behavior. They are a good way to program by difference.\
    \ But as a software system evolves, subclasses can lose their value as the variations\
    \ they support are moved to other places or removed altogether. Sometimes, subclasses\
    \ are added in anticipation of features that never end being built up, or end\
    \ being built in a way that doesn't need the subclasses.\n\nA subclass that does\
    \ too little incurs a cost in understanding that is no longer worthwhile. When\
    \ that time comes, it's best to remove the subclass, replacing it with a field\
    \ on its superclass.\n\n# Mechanics\n\n+   - Replace Constructor with Factory\
    \ Function (334) on the subclass constructor.\n\nIf the clients of the constructors\
    \ use a data field to decide which subclass to create, put that decision logic\
    \ into a superclass factory method.\n\n+   - If any code tests against the subclass's\
    \ types, use Extract Function (106) on the type"
