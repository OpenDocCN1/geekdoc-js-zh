  md: '# Comprehension Refactoring: Making Code Easier to Understand


    Before I change some code, I need to understand what it does. This code may have
    been written by me or by someone else. Whenever I have to think what the code
    is doing, I ask myself if I can refactor the code to make that understanding more
    immediately apparent. I may be looking at some conditional logic that''s structured
    awkwardly. I may have wanted to use some existing functions spent several minutes
    figuring out what they did because they were named badly.


    At that point I have some understanding in my head, but head isn''t a very good
    record of such details. As Ward Cunning puts it, by refactoring I move the understanding
    from my head into the code itself. I then test that understanding by running the
    software to see if it still works. If I move my understanding into the code, it
    will be preserved and visible to my colleagues.


    That doesn''t help me in the future—it often helps me right now. Early on, I do
    comprehension refactoring on little details. I rename a couple variables now that
    I understand what they are, I chop a long function into smaller parts. Then, as
    the code gets clearer, I find I see things about the design that I could not see
    before. Had I not changed the code, I probably never would seen these things,
    because I''m just not clear enough to visualize all these changes in my head.
    Ralph Johnson describes these early refactorings as wiping off a window so you
    can see beyond. When I''m studying code, refactoring leads to higher levels of
    understanding that I would otherwise miss. Those who dismiss comprehension refactoring
    as useless fiddling with the code realize that by foregoing it never see the opportunities
    hidden behind the confusion.


    # Litter-Pickup Refactoring


    A variation of comprehension refactoring is when I understand what the code is
    doing, but realize that it''s doing badly. The logic is unnecessarily convoluted,
    or I see functions that are nearly identical and can be replaced by a single parameterized
    function. There''s a bit of a tradeoff here. I don''t want to spend a lot of time
    distracted from the task I''m currently doing, but I also don''t want to leave
    the task lying around and getting in the way of future changes. If it''s easy
    to change, I''ll do right off. If a bit more effort to fix, I might make a note
    of it and fix it when I''m done with my immediate task.


    Sometimes, of course, it''s going to take a few hours to fix, and I have more
    urgent things to do. Even then, however, it''s usually worthwhile to make it little
    bit better. As the old camping adage says, always leave the camp site cleaner
    than you found it.'
