    The lesson is: Even if you know exactly what is going on in your system


    > — Ron Jenkins


    The interesting thing about performance is that in most programs, most of their
    time is spent in a small fraction of the code. If I optimize all the code equally,
    I will end up with 90 percent of my work wasted because it''s optimizing code
    that isn''t run much. The time spent making the program fast—the time lost because
    lack of clarity—is all wasted time.


    The third approach to performance improvement takes advantage of this 90-percent
    statistic. In this approach, I build my program in a well-factored manner without
    paying attention to performance until I begin a deliberate performance optimization
    exercise. During this performance optimization, I follow a specific process to
    tune the program.


    I begin by running the program under a profiler that monitors the program and
    tells me where it is consuming time and space. This way I can find that small
    part of the program where the performance hot spots lie. I focus on those performance
    hot spots using the same optimizations I would use in the constant-attention approach.
    But since I''m focusing my attention on a hot spot, I''m getting much more effect
    with less work. Even so, I remain cautious. As for refactoring, I make the changes
    in small steps. After each step I compile, test, and rerun the profiler. If I
    haven''t improved performance, I back out the change. I continue the process of
    finding and removing hot spots until I get the performance that satisfies my users.'
