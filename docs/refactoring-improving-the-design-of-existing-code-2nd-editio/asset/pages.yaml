  md: 'base having the same reaction to a particular value, I want to bring that reaction
    into a single place.


    A good mechanism for this is the Special Case pattern where I create a special-case
    element that captures the common behavior. This allows me to replace most of the
    special-case checks with simple calls.


    A special case can manifest itself in several ways. If all I''m doing with the
    object reading data, I can supply a literal object with all the values I need
    filled in. If I need more than simple values, I can create a special object with
    methods for all the common behavior. The special-case object can be returned by
    an encapsulating class, or inserted into a data structure with a transform.


    A common value that needs special-case processing is null, which is why this pattern
    is often called the Null Object pattern. But it''s the same approach for any special
    case—I like to say that Null Object is a special case of Special Case.


    # Mechanics


    Begin with a container data structure (or class) that contains a property which
    is the subject of the refactoring. Clients of the container compare the subject
    property of the container to a special-case value. We wish to replace the special-case
    value of the subject with a special-case class or data structure.


    +   - Add a special-case check property to the subject, returning false.


    +   - Create a special-case object with only the special-case check property,
    returning true.


    +   - Apply Extract Function (106) to the special-case comparison code. Ensure
    all clients use the new function instead of directly comparing it.


    +   - Introduce the new special-case subject into the code, either by returning
    it from a function call or by applying a transform function.


    +   - Change the body of the special-case comparison function so that it uses
    the special-case check property.


    +   - Test.


    +   - Use Combine Functions into Class (144) or Combine Functions into Transform
    (149) to move all of the common special-case behavior into the new element.'
