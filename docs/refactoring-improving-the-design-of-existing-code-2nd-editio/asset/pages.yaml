    \ Mistakes are easy to make—at least, I find them to make. Testing each change\
    \ means that when I make a mistake, I only have a small change to consider in\
    \ order to spot the error, which makes it far easier to find and fix. This is\
    \ the essence of the refactoring process: small changes and testing after each\
    \ change. If I try to do too much, making a mistake will force me into a tricky\
    \ debugging process that can take a long time. Small changes, enabling a tight\
    \ feedback loop, are the key to avoiding mess.\n\nI compile here to mean whatever\
    \ is needed to make the JavaScript executable. Since JavaScript is directly executable,\
    \ may mean nothing, but in other cases it may mean moving code to an output directory\
