  md: '# Motivation


    Removing duplication is one of the best rules of thumb of healthy code. If I see
    the same code executed every time I call a particular function, I look to combine
    repeating code into the function itself. That way, any future modifications to
    the repeating code can be done in one place and used by all callers. Should the
    code vary in the function, I can easily move (or some of it) out again with Move
    Statements to Callers (217).


    I move statements into a function when I can understand these statements as part
    of the called function. If they don''t make sense as part of the called function,
    but still should be called with it, I''ll simply use Extract Function (106) on
    the statements and the called function. It''s essentially the same process as
    I describe below, but without the inline and rename steps. It''s not unusual to
    do that and then, after later reflection, carry out those final steps.


    # Mechanics


    +   - If the repetitive code isn''t adjacent to the call of the target function,
    use Slide Statements (223) to get it adjacent.


    +   - If the target function is only called by the source function, just cut the
    code from the source, paste it into the target, test, and ignore the rest of these
    mechanics.


    +   - If you have more, use Extract Function (106) on one of the call sites to
    extract both the call to the target function and the statements you wish to move
    into it. Give it a name that''s transient, but easy to grep.


    +   - Convert every call to use the new function. Test after each conversion.


    +   - When all the original calls use the new function, use Inline Function (115)
    to inline the original function completely into the new function, removing the
    original function.


    +   - Rename Function (124) to change the name of the new function to the same
    name as the original function.


    Or to a better name, if there is one.


    # Example


    I''ll start with this code to emit HTML for data about a photo:'
