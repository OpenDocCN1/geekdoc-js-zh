  md: '# Chapter 2

    Principles in Refactoring


    The example in the previous chapter should have given you a decent feel of what
    refactoring is. Now you have that,, it''s a good time to step back and talk about
    some of the broader principles in refactoring.


    # DEFINING REFACTORING


    Like many terms in software development, “refactoring” is often used very loosely
    by practitioners. I use the term more precisely, and find it useful to use it
    in more precise form. (These definitions are the same as those I gave in the first
    edition of this book.) The term “refactoring” can be used either as a noun or
    a verb. The noun’s definition is:


    **Refactoring (noun):** a change made to the internal structure of software to
    make it easier to understand and cheaper to modify without changing its observable
    behavior.


    This definition corresponds to the named refactorings I mentioned in the earlier
    examples, such as *Extract Function (106)* and *Replace Conditional with Polymorphism
    (272)*.


    The verb’s definition is:


    **Refactoring (verb):** to restructure software by applying a series of refactorings
    without changing its observable behavior.


    I might spend a couple of hours refactoring, during which I would apply a few
    dozen refactorings.


    Over the years, many people in the industry have taken to use “refactoring” to
    mean any kind of code cleanup—but the definitions above point to a particular
    approach to cleaning up code. Refactoring is all about applying small behavior-preserving
    steps and making a big change by stringing together a sequence of these behavior-preserving'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'steps. Each individual refactoring is either pretty small itself or a combination
    of small steps. As a result, when I''m refactoring, my code doesn''t spend much
    time in a broken state, allowing me to stop at any moment even if I''t finished.


    > If someone says their code was broken for a couple of days while they were refactoring,
    you can be pretty sure they were not refactoring.


    I use "restructuring" as a general term to mean any kind of reorganizing or cleaning
    up of a code base, and see refactoring as a particular kind of restructuring.
    Refactoring may seem inefficient to people who first come across it and watch
    me making lots of tiny steps, but the tiny steps allow me to go faster because
    they compose so well—and, crucially, I don''t spend any time debugging.


    In my definitions, I use the phrase "observable behavior." This is a deliberately
    loose term, indicating that the code, overall, just do the same things it did
    before it started. It doesn''t mean it will work exactly the same—example, Extract
    Function (106) will alter the call stack, so performance characteristics might
    change—but nothing should change that the user should care about. In particular,
    interfaces to as Change Function Declaration (124) and Move Function (198). Any
    bugs that I notice during refactoring should still be present after refactoring
    (though I can fix latent bugs that nobody has observed yet).


    Refactoring is very similar to performance optimization, as both involve carrying
    out code manipulations that don''t change the overall functionality of the program.
    The difference is the purpose: Refactoring is always down to make the code "easier
    to understand and cheaper to modify." This might speed things up or slows down.
    With performance optimization, I only care about speeding up the program, and
    I am prepared to end up with code that is harder to work with if I really need
    improved performance.


    # THE TWO HATS


    Kent Beck came up with a metaphor of the two hats. When I use refactoring to develop
    software, I divide my time between two distinct activities: adding functionality
    and refactoring. When I add functionality, I shouldn''t be changing code; I''m
    just adding new capabilities. I measure my progress by adding tests and getting
    the tests to work. When I refactor, I make a point of not adding functionality;
    I only restructure the code. I don''t add any tests (unless I find a case I missed
    earlier); I only change tests'
