  md: 'instead.


    It’s common to pass nested structures of lists and hashmaps which are often serialized
    into formats like JSON or XML. Such structures can be encapsulated too, which
    helps if their formats change later on or if I''m concerned about updates to the
    data that are hard to keep track of.


    # Mechanics


    +   * Use *Encapsulate Variable (132)* on the variable holding the record.


    Give the functions that encapsulate the record names that are easily searchable.


    +   * Replace the content of the variable with a simple class that wraps the record.
    Define an accessor inside this class that returns the raw record. Modify the functions
    that encapsulate the variable to use this accessor.


    +   * Test.


    +   * Provide new functions that return the object rather than the raw record.


    +   * For each user of the record, replace its use of a function that returns
    the record with a function that returns the object. Use an accessor on the object
    to get at the field data, creating that accessor if needed. Test after each change.


    If it''s a complex record, such as one with a nested structure, focus on clients
    update the data first. Consider returning a copy or read-only proxy of the data
    for clients that only read the data.


    +   * Remove the class’s raw data accessor and the easily searchable functions
    that returned the raw record.


    +   * Test.


    +   * If the fields of the record are themselves structures, consider using Encapsulate
    Record and *Encapsulate Collection (170)* recursively.


    # Example


    I’ll start with a constant that is widely used across a program.


