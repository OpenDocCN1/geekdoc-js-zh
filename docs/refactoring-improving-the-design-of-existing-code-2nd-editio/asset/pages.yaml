    and in front of communication with others. The economic benefits of refactoring
    should always be the driving factor, and the more that is understood by developers,
    managers, and customers, the more of the “good design” curve we see.


    # Code Ownership


    Many refactorings involve making changes that affect not just the internals of
    a module but its relationships with other parts of a system. If I want to rename
    a function, and I can find all the callers to a function, I simply apply *Change
    Function Declaration (124)* and change the declaration and the callers in one
    change. But sometimes this simple refactoring is not possible. Perhaps the code
    is called by a different team and I don’t have access to their repository. Perhaps
    the function is a declared API used by my customers—so I can’t even tell if it’s
    being used, let alone by whom and how much. Such functions are part of a published
    interface—an interface that is used by clients independent of who declare the
    interface.


    Code ownership boundaries get in the way of refactoring because I cannot make
    the kinds of changes I want without breaking my clients. This doesn’t prevent
    refactoring—I can still do a great deal—but it imposes limitations. When renaming
    a function, I need to use *Rename Function (124)* and to retain the old declaration
    as a pass-through to the new one. This complicates the interface—but it is the
    price I pay to avoid breaking my clients. I may be able to mark the old interface
    as deprecated and, in time, retire it, but sometimes I have to retain that interface
    forever.


    Due to these complexities, I recommend against fine-grained code ownership. Some
    organizations like any piece of code have a single programmer as an owner, and
    only allow that programmer to change it. I see a team of three people in such
    a way that each one published interfaces to the other two. This led to all sorts
    of gyrations to maintain interfaces if it would have been much easier to go into
    the code base and make the edits. My preference is to allow team ownership of
    code—so that anyone in the same team can modify the code, even if originally written
    by someone else. Programmers may have individual responsibility for areas of a
    system, but that should imply that they monitor changes to their area of responsibility,
    not block them by default.'
