    \ history);\n  if (vpf * 3 > (vr + chr * 2)) return \"A\";\n  else return \"B\"\
    ;\n}\n\nfunction voyageRisk(voyage) {\n  let result = 1;\n  if (voyage.length\
    \ > 4) result += 2;\n  if (voyage.length > 8) result += voyage.length - 8;\n \
