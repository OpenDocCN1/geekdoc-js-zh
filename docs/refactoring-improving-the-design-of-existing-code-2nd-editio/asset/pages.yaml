  md: '# Chapter 1

    Refactoring: A First Example


    How do I begin to talk about refactoring? The traditional way is by introducing
    the history of the subject, broad principles, and the like. When somebody does
    that at a conference, I get slightly sleepy. My mind starts wandering, with a
    low-priority background polling the speaker until they give an example.


    The examples wake me up because I can see what is going on. With principles, it
    is too easy to make broad generalizations—and too hard to figure out how to apply
    them. An example helps things clear.


    So I''m going to start this book with an example of refactoring. I''ll talk about
    refactoring works and will give you a sense of the refactoring process. I can
    then do the usual principles-style introduction in the next chapter.


    With any introductory example, however, I run into a problem. If I pick a large
    program, describing it and how it is refactored is too complicated for a mortal
    reader to work through. (I tried this with the original book—and ended up throwing
    two examples, which were still pretty small but took over a hundred pages each
    describe.) However, if I pick a program that is small enough to be comprehensible,
    refactoring does not look like it is worthwhile.


    I''m thus in the classic band of anyone who wants to describe techniques that
    are useful for real-world programs. Frankly, it is not worth the effort to do
    all the refactoring that I''m going through on the small program I will be using.
    But if the code I''m showing you is part of a larger system, then the refactoring
    becomes important. Just look at my example and imagine it in the context of a
    much larger system.


    # THE STARTING POINT


    In the first edition of my book, my starting program printed a bill from a video
    rental store, which may now lead many of you to ask: “What''s a video rental store?"
    Rather than answer that question, I reskinned the example to something that is
    bit older'
