    \ repeated wherever the derived data is used. I prefer to bring all of these derivations\
    \ together, so I have a consistent place to find and update them and avoid any\
    \ duplicate logic.\n\nOne way to do this is to use a data transformation that\
    \ takes the source data as input and calculates all the derivations, putting each\
    \ derived value as a field in the output data. Then, to examine the derivations,\
    \ all I need to do look at the transform function.\n\nAn alternative to Combine\
    \ Functions into Transform is Combine Functions into Class* that moves the logic\
    \ to methods on a class formed from the source data. Either of these refactorings\
    \ are helpful, and my choice will often depend on the style of programming already\
    \ in the software. But there is one important difference: Using a class is much\
    \ better if the source data gets updated within the code. Using a transform stores\
    \ derived data in the new record, or if the source data changes, I will run into\
    \ inconsistencies.\n\nOne of the reasons I like to do combine functions is to\
    \ avoid duplication of the"
