  md: '# 469) How does the event loop work in JavaScript?


    The event loop in JavaScript continuously checks for new tasks in the queue and
    executes them in the order they were added, while also allowing for new tasks
    to be added to the queue during execution.


    # 470) What is the difference between the call stack and the event loop in JavaScript?


