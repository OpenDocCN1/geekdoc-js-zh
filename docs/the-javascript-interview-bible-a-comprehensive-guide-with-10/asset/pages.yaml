  md: '# 400) How does the call stack work in JavaScript?


    When a function is called, it is added to the top of the call stack. When the
    function completes, it is removed from the stack and control is returned to the
    calling function.


    # 401) What is a stack overflow error in JavaScript?


    A stack overflow error in JavaScript occurs when the call stack exceeds its maximum
    size, typically due to an infinite loop or recursive function that does not properly
    terminate.


