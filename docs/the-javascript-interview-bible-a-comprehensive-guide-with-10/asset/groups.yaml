    \n```handlebars\n{{#if isSuccess}}\n  <p>Success!</p>\n{{else}}\n  <p>errorMessage</p>\n\
    {{/if}}\n```\n\n## 792) 如何在 EmberJS 中管理应用状态？\n\nEmberJS 提供了多种管理应用状态工具，包括服务（services）、控制器（controllers）和组件（components）。服务是单例，可以注入到应用的其他部分并用于管理共享状态。控制器用于管理特定于路由或上下文的状态，组件用于封装状态并在应用中复用。\n\
    \n## 793) 如何使用 EmberJS 服务？\n\n你可以通过使用 Service 对象并扩展它来定义其属性和方法，从而在 EmberJS 中定义一个新服务。例如，要定义一个管理购物车中物品的\
    \ CartService，你可以如下创建一个 Service 类：\n\n```javascript\nimport Service from '@ember/service';\n\
