    \nEmberJS 提供了多个修符，允许你增强 DOM 元素的行为，例如添加事件监听器或条件渲染元素。你可以通过使用 `{{modifierName}}`\
    \ 语法并传递任何参数在 EmberJS 中使用修符。例如，为按钮元素添加点击事件监听器并在点击时调用操作，你可以这样使用 `{{on}}` 饰符：\n\n\
    ```\n<button {{on \"click\" this.handleClick}}>Click me</button>\n```\n\n## 800\
    \ 如何使用 EmberJS 服务在组件和路由之间共享数据和功能？\n\nEmberJS 服务是单例，可以用于在组件和路由之间共享数据和功能。你可以通过使用\
    \ `ember generate service` 命令创建一个扩展 `Ember.Service` 类的 JavaScript 类在 EmberJS 中定义服务。例如，要创建一个存储用户购物车物品的购物车服务，你可以这样创建一个服务：\n\
    \n```javascript\nimport Service from '@ember/service';\nimport { tracked } from\
    \ '@glimmer/tracking';\n\nexport default class CartService extends Service {\n\
    \  @tracked items = [];\n\n  addItem(item) {\n    this.items.push(item);\n  }\n\
    \n  removeItem(item) {\n    const index = this.items.indexOf(item);\n    if (index\
    \ !== -1) {\n      this.items.splice(index, 1);\n    }\n  }\n}\n```\n\n然后，你可以通过\
    \ `@service` 装饰器将服务注入到组件或路由中（如 `this`），从而在应用程序中使用该服务：\n\n```javascript\nimport\
    \ Component from '@glimmer/component';\nimport { inject as service } from '@ember/service';\n\
