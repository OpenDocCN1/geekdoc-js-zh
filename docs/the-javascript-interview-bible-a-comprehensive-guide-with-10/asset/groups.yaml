    ```\n\n## 803 如何使用 EmberJS 调试工具调试你的应用程序？\n\nEmberJS 提供了多个调试工具，允许你调试应用程序，包括 Ember\
    \ Inspector 浏览器扩展、用于模拟服务器响应的 `ember-cli-mirage` 库以及用于调试模板的 `ember-debug` 插件。你可以使用这些工具检查应用程序的状态，跟踪应用程序中的数据流，并调试模板和组件中的问题。\n\
