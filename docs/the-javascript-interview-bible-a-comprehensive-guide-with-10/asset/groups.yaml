  - "[PAGE 407]\n\n# 764) What is the difference between a service and a factory in\
    \ AngularJS?\n\nIn AngularJS, a service is a constructor function that is instantiated\
    \ with the new keyword, while a factory function returns an object. The main difference\
    \ is that services can be instantiated multiple times, while factories are instantiated\
    \ only once, and their returned object is cached for subsequent use.\n\n```\n\
    // Example of a service\napp.service('UserService', function() {\n  this.getUser\
    \ = function() {\n    return { name: 'John', age: 25 };\n  }\n});\n\n// Example\
    \ of a factory\napp.factory('UserFactory', function() {\n  var user = {\n    name:\
    \ 'John', age: 25\n  };\n  return {\n    getUser: function() {\n      return user;\n\
    \    }\n  };\n});\n```"
- md: "\n## 765 What is a filter in AngularJS, and how do you create one?\n\nA filter\
    \ is a way to transform data in AngularJS. Filters can be used to format text,\
    \ sort arrays, filter arrays, or apply custom logic. You can create a filter using\
    \ the filter method.\n\n```javascript\n// Example of a custom filter\napp.filter('reverse',\
    \ function() {\n  return function (input) {\n    return input.split('').reverse().join('');\n\
    \  }\n});\n\n<!-- Example of using a custom filter -->\n<div>{{ name | reverse\
    \ }}</div>\n```\n\n## 766) What is $q in AngularJS, and how do you use it to create\
    \ a promise?\n\n$q is a built-in service in AngularJS that provides an implementation\
    \ of the Promises/A+ specification. You can use $q.defer() to create a new promise,\
    \ and use .resolve() and .reject() to resolve or reject the promise.\n\n```javascript\n\
    // Example of using $q to create a promise\napp.controller('MyController', function($q)\
    \ {\n  var deferred = $q.defer();\n  deferred.resolve('Success');\n  // or deferred.reject('Error');\n\
    \n  deferred.promise.then(function(result) {\n    // Handle successful promise\n\
    \    console.log(result);\n  }).catch(function(error) {\n    // Handle error promise\n\
    \    console.error(error);\n  });\n});\n```\n\n## 767) What is $rootScope in AngularJS,\
    \ and how does it differ from $scope?\n\n$rootScope is the top-level scope in\
    \ an AngularJS application. It is created when the application is bootstrapped\
    \ and is available to all child scopes. $rootScope is used to store global state\
    \ or functions that need to be available across the entire application. $scope,\
    \ on the other hand, is a scope that is created for each controller and directive.\
    \ It is used to store state or functions that are specific to that controller\
    \ or directive.\n\n## 768) What is $compile in AngularJS, and how do you use it\
    \ to compile a template?\n\n$compile is a built-in service in AngularJS that is\
    \ used to compile an HTML template into an AngularJS view. You can use $compile(html)(scope)\
    \ to compile a string of HTML with a specific scope.\n\n```javascript\n// Example\
    \ of using $compile to compile a template\napp.directive('myDirective', function($compile)\
    \ {\n  return {\n    link: function(scope, element, attrs) {\n      var html =\
    \ '<div>{{ name }}</div>';\n      var compiled = $compile(html)(scope);\n    \
    \  element.append(compiled);\n    }\n  };\n});\n```\n\n## 769) What is $timeout\
    \ in AngularJS, and how do you use it to delay execution of a function?\n\n$timeout\
    \ is a built-in service in AngularJS that is used to delay execution of a function\
    \ by a specified number of milliseconds. You can use $timeout(fn, delay) to delay\
    \ the execution of a function by a specific amount of time.\n\n```javascript\n\
    // Example of using $timeout to delay execution of a function\napp.controller('MyController',\
    \ function ($timeout) {\n  $timeout(function() {\n    console.log('Hello after\
    \ 1 second');\n  }, 1000);\n});\n```\n\n## 770) What is $location in AngularJS,\
    \ and how do you use it to change the URL?\n\n$location is a built-in service\
    \ in AngularJS that provides access to the URL of the current page. You can use\
    \ $location.url(url) to change the URL of the page.\n\n```javascript\n// Example\
    \ of using $location to change the URL\napp.controller('MyController', function\
    \ ($location) {\n  $location.url('/new-page');\n});\n```\n\n## 771) What is $cacheFactory\
    \ in AngularJS, and how do you use it to create a cache?\n\n$cacheFactory is a\
    \ built-in service in AngularJS that provides a way to create a cache for storing\
    \ data in memory. You can use $cacheFactory(name, options) to create a new cache\
    \ with a specific name and options.\n\n```javascript\n// Example of using $cacheFactory\
    \ to create a cache\napp.controller('MyController', function($cacheFactory) {\n\
    \  var myCache = $cacheFactory('myCache', { capacity: 10 });\n  myCache.put('key',\
    \ 'value');\n  var result = myCache.get('key');\n  console.log(result); // \"\
    value\"\n});\n```\n\n## 772) What is $filter in AngularJS, and how do you use\
    \ it to filter an array?\n\n$filter is a built-in service in AngularJS that provides\
    \ access to all of the built-in filters as well as custom filters. You can use\
    \ $filter(name)(input, params) to apply a filter to an array.\n\n```javascript\n\
    // Example of using $filter to filter an array\napp.controller('MyController',\
    \ function($filter) {\n  var data = [1, 2, 3, 4];\n  var filteredData = $filter('filter')(data,\
    \ function(item) {\n    return item % 2 === 0;\n  });\n  console.log(filteredData);\
    \ // [2, 4]\n});\n```\n\n## 773 What is $interpolate in AngularJS, and how do\
    \ you use it to interpolate a string?\n\n$interpolate is a built-in service in\
    \ AngularJS that is used to interpolate a string with values from a scope. You\
    \ can use $interpolate(string)(scope) to interpolate a string.\n\n```javascript\n\
    // Example of using $interpolate to interpolate a string\napp.controller('MyController',\
    \ function($interpolate) {\n  var str = 'Hello {{name}}!';\n  var result = $interpolate(str)({name:\
    \ 'John'});\n  console.log(result); // \"Hello John!\"\n});\n```\n"
  mdcn: "\n\n## 765 什么是 AngularJS 中的过滤器（filter）？如何创建一个？\n\n过滤器是 AngularJS 中转换数据的方式。过滤器用于格式化文本、排序数组、过滤数组或应用自定义逻辑。你可以使用\
    \ `filter` 方法创建一个过滤器。\n\n```javascript\n// 自定义过滤器的示例\napp.filter('reverse', function()\
    \ {\n  return function (input) {\n    return input.split('').reverse().join('');\n\
    \  }\n});\n\n<!-- 使用自定义过滤器的示例 -->\n<div>{{ name | reverse }}</div>\n```\n\n##\
    \ 766) AngularJS 中的 $q 是什么？你如何使用它来创建一个 promise（承诺）？\n\n$q 是 AngularJS 中的一个内置服务，提供了\
    \ Promises/A+ 规范的实现。你可以使用 `$q.defer()` 创建一个新的 promise，并使用 `.resolve()` 和 `.reject()`\
    \ 来解析或拒绝该 promise。\n\n```javascript\n// 使用 $q 创建 promise 的示例\napp.controller('MyController',\
    \ function($q) {\n  var deferred = $q.defer();\n  deferred.resolve('Success');\n\
    \  // 或者 deferred.reject('Error');\n\n  deferred.promise.then(function(result)\
    \ {\n    // 处理成功的 promise\n    console.log(result);\n  }).catch(function(error)\
    \ {\n    // 处理错误的 promise\n    console.error(error);\n  });\n});\n```\n\n## 767)\
    \ AngularJS 中的 $rootScope 是什么？它与 $scope 有什么区别？\n\n$rootScope 是 AngularJS 应用中的顶层作用域（scope）。它在应用启动（bootstrap）时创建，并对所有子作用域可用。$rootScope\
    \ 用于存储整个应用程序范围内可用的全局状态或函数。相反，$scope 是为每个控制器（controller）和指令（directive）创建的作用域，用于存储特定于该控制器或指令的状态或函数。\n\
    \n## 768) AngularJS 中的 $compile 是什么？你如何使用它来编译模板？\n\n$compile 是 AngularJS 中的一个内置服务，用于将\
    \ HTML 模板编译为 AngularJS 视图。你可以使用 `$compile(html)(scope)` 带有特定作用域的 HTML 字符串。\n\n\
    ```javascript\n// 使用 $compile 编译模板的示例\napp.directive('myDirective', function($compile)\
    \ {\n  return {\n    link: function(scope, element, attrs) {\n      var html =\
    \ '<div>{{ name }}</div>';\n      var compiled = $compile(html)(scope);\n    \
    \  element.append(compiled);\n    }\n  };\n});\n```\n\n## 769) AngularJS 中的 $timeout\
    \ 是什么？你如何使用它来延迟函数的执行？\n\n$timeout 是 AngularJS 中的一个内置服务，用于通过指定的毫秒数延迟函数的执行。你可以使用\
    \ `$timeout(fn, delay)` 来延迟执行特定时间的函数。\n\n```javascript\n// 使用 $timeout 延迟函数执行的示例\n\
    app.controller('MyController', function ($timeout) {\n  $timeout(function() {\n\
    \    console.log('Hello after 1 second');\n  }, 1000);\n});\n```\n\n## 770) AngularJS\
    \ 中的 $location 是什么？你如何使用它来更改 URL？\n\n$location 是 AngularJS 中的一个内置服务，提供访问当前页面 URL\
    \ 的功能。你可以使用 `$location.url(url)` 来更改页面 URL。\n\n```javascript\n// 使用 $location\
    \ 更改 URL 的示例\napp.controller('MyController', function ($location) {\n  $location.url('/new-page');\n\
    });\n```\n\n## 771) AngularJS 中的 $cacheFactory 是什么？你如何使用它创建一个缓存（cache）？\n\n$cacheFactory\
    \ 是 AngularJS 中的一个内置服务，提供了一种创建用于在内存中存储数据的的方法。你可以使用 `$cacheFactory(name, options)`\
    \ 创建具有特定名称和选项的新缓存。\n\n```javascript\n// 使用 $cacheFactory 创建缓存的示例\napp.controller('MyController',\
    \ function($cacheFactory) {\n  var myCache = $cacheFactory('myCache', { capacity:\
    \ 10 });\n  myCache.put('key', 'value');\n  var result = myCache.get('key');\n\
    \  console.log(result); // \"value\"\n});\n```\n\n## 772) AngularJS 中的 $filter\
    \ 是什么？你如何使用它来过滤数组？\n\n$filter 是 AngularJS 中的一个内置服务，提供了访问所有内置过滤器以及自定义过滤器的功能。你可以使用\
    \ `$filter(name)(input, params)` 对数组应用过滤器。\n\n```javascript\n// 使用 $filter 过滤数组的示例\n\
    app.controller('MyController', function($filter) {\n  var data = [1, 2, 3, 4];\n\
    \  var filteredData = $filter('filter')(data, function(item) {\n    return item\
    \ % 2 === 0;\n  });\n  console.log(filteredData); // [2, 4]\n});\n```\n\n## 773\
    \ AngularJS 中的 $interpolate 是什么？你如何使用它来插值字符串？\n\n$interpolate 是 AngularJS 中的一个内置服务，用于将作用域中的值插到字符串中。你可以使用\
    \ `$interpolate(string)(scope)` 来插值字符串。\n\n```javascript\n// 使用 $interpolate 插值字符串的示例\n\
    app.controller('MyController', function($interpolate) {\n  var str = 'Hello {{name}}!';\n\
    \  var result = $interpolate(str)({name: 'John'});\n  console.log(result); //\
    \ \"Hello John!\"\n});\n```\n\n"
