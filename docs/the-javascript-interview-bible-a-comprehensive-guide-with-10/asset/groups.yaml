    \n```javascript\nconsole.log(1 == \"1\"); // Output: true\nconsole.log(1 === \"\
    1\"); // Output: false\n```\n\n## 224) JavaScript 中 null 和 undefined 有什么区别？\n\n\
    `null` 是一个表示有意缺失任何对象的显式值，而 `undefined` 是自动分配给未赋值变量的原始值。示例：\n\n```javascript\n\
    let x;\nconsole.log(x); // Output: undefined\n\nlet y = null;\nconsole.log(y);\
