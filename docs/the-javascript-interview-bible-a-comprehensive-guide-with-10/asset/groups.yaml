    \n# 350 什么是字典树（trie），如何在 JavaScript 中实现它？\n\n字典树是一种树形数据结构，用于存储字符串集合，并提供高效的前缀搜索操作。以下是在\
    \ JavaScript 中实现字典树的示例：\n\n```javascript\nclass TrieNode {\n  constructor() {\n\
    \    this.children = {};\n    this.isEndOfWord = false;\n  }\n}\n\nclass Trie\
    \ {\n  constructor() {\n    this.root = new TrieNode();\n  }\n\n  insert(word)\
    \ {\n    let current = this.root;\n    for (let i = 0; i < word.length; i++) {\n\
    \      const char = word[i];\n      if (!current.children[char]) {\n        current.children[char]\
    \ = new TrieNode();\n      }\n      current = current.children[char];\n    }\n\
    \    current.isEndOfWord = true;\n  }\n\n  search(word) {\n    let current = this.root;\n\
    \    for (let i = 0; i < word.length; i++) {\n      const char = word[i];\n  \
    \    if (!current.children[char]) {\n        return false;\n      }\n      current\
    \ = current.children[char];\n    }\n    return current.isEndOfWord;\n  }\n}\n\n\
    const trie = new Trie();\ntrie.insert('apple');\nconsole.log(trie.search('apple'));\
    \ // true\nconsole.log(trie.search('app')); // false\n```\n\n# 351) 如何 JavaScript\
    \ 中实现归并排序（merge sort）算法？\n\n归并排序是一种分治算法，其工作原理是通过递归地将数组分为两部分，对每一部分进行排序，然后将这两个部分合并回。以下是在\
    \ JavaScript 中实现归并排序算法的示例：\n\n```javascript\nfunction mergeSort(arr) {\n  if (arr.length\
    \ <= 1) {\n    return arr;\n  }\n  const mid = Math.floor(arr.length / 2);\n \
    \ const left = arr.slice(0, mid);\n  const right = arr.slice(mid);\n  return merge(mergeSort(left),\
    \ mergeSort(right));\n}\n\nfunction merge(left, right) {\n  const result = [];\n\
    \  let i = 0;\n  let j = 0;\n  while (i < left.length && j < right.length) {\n\
    \    if (left[i] < right[j]) {\n      result.push(left[i]);\n      i++;\n    }\
    \ else {\n      result.push(right[j]);\n      j++;\n    }\n  }\n  return result.concat(left.slice(i)).concat(right.slice(j));\n\
    }\n```\n\n"
