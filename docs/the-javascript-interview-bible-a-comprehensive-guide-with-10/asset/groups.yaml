    \ 如何在 EmberJS 组件中使用操作（actions）？\n\n你可以通过创建一个带有 @action 装饰器的方法并在 EmberJS 组件中定义操作，然后在模板中通过\
    \ {{action}} 辅助符调用它。例如，要定义一个在点击按钮时弹出消息的动作，你可以在组件中创建一个 handleClick 方法并在模板中如下使用：\n\
