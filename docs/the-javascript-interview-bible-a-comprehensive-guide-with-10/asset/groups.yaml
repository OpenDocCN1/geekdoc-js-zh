    # 5) What is the difference between an arrow function and a regular function in
    JavaScript?


    > Arrow functions have a shorter syntax and automatically bind the this value
    to the enclosing context, while regular functions have a longer syntax and the
    this value is determined by how the function is called.


    # 6) What is the difference between the spread operator and rest parameter in
    JavaScript?


    > The spread operator allows you to expand an array or object into separate arguments
    or elements, while the rest parameter allows you to capture multiple arguments
    into an array.


    # 7) What is the difference between var, let, and const in JavaScript?


    > Var has function scope, while let and const have block scope. Var and let can
