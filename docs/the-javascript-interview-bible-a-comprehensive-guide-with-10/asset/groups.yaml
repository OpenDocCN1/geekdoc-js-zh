- md: "\n## 783) How does Ember.js handle data binding and change detection?\n\nEmber.js\
    \ uses a data binding system to efficiently update the UI when data changes. It\
    \ also includes a powerful template engine that supports declarative syntax and\
    \ reusable components.\n\n## 784) What is the Ember.js component system and how\
    \ is it used?\n\n> The Ember.js component system is a feature that allows developers\
    \ to create reusable UI components. It uses a simple syntax to define the HTML\
    \ structure of the component, and includes built-in support for data binding,\
    \ events, and lifecycle methods.\n\n## 785) What is EmberJS and how does it differ\
    \ from other JavaScript frameworks?\n\n> EmberJS is a JavaScript framework for\
    \ building ambitious web applications. It provides a powerful set of tools for\
    \ managing application state, routing, and data binding, and encourages convention\
    \ over configuration. Unlike some other frameworks, EmberJS includes many batteries-included\
    \ features out of the box, making it easier to get started quickly and build complex\
    \ applications with less boilerplate code.\n\n## 786) How do you define a new\
    \ route in EmberJS?\n\nYou can define a new route in EmberJS by using the Route\
    \ object and specifying a path for the route. For example, to define a new route\
    \ for the path \"/posts\", you can create a PostsRoute class like this:\n\n```javascript\n\
    import Route from '@ember/routing/route';\n\nexport default class PostsRoute extends\
    \ Route {\n  // add custom route logic here\n}\n```\n\n## 787) What is Ember Data\
    \ and how does it work with EmberJS?\n\nEmber Data is a library for managing data\
    \ in EmberJS applications. It provides a higher-level abstraction over Ajax requests\
    \ and server responses, allowing you to work with using models and relationships.\
    \ Ember Data integrates with EmberJS's routing and templating systems, making\
    \ it easy to load and display data in your application.\n\n## 788) How do you\
    \ define a new Ember Data model?\n\nYou can define a new Ember Data model by extending\
    \ the DS.Model class and defining its attributes and relationships. For example,\
    \ to define a Post model with title and body attributes, you can create a Post\
    \ class like this:\n\n```javascript\nimport DS from 'ember-data';\n\nexport default\
    \ DS.Model.extend({\n  title: DS.attr('string'),\n  body: DS.attr('string')\n\
    });\n```\n\n## 789) How do you use computed properties in EmberJS?\n\nYou can\
    \ define a computed property in EmberJS by using the computed object and specifying\
    \ its dependencies and a function that returns its value. For example, to define\
    \ a computed property that concatenates the firstName and lastName properties\
    \ of a Person object, you can create a fullName property like this:\n\n```javascript\n\
    import { computed } from '@ember/object';\n\nexport default class PersonComponent\
    \ extends Component {\n  firstName = 'John';\n  lastName = 'Doe';\n\n  fullName\
    \ = computed('firstName', 'lastName', function() {\n    return `${this.firstName}\
    \ ${this.lastName}`;\n  });\n}\n```\n\n## 790) How do you use actions in EmberJS\
    \ components?\n\nYou can define an action in an EmberJS component by creating\
    \ a method with the @action decorator and calling it from a template using the\
    \ {{action}} helper. For example, to define an action that alerts a message when\
    \ a button is clicked, you can create a handleClick method in a component and\
    \ use it in a template like this:\n\n```javascript\nimport Component from '@glimmer/component';\n\
    import { action } from '@ember/object';\n\nexport default class MyComponent extends\
    \ Component {\n  @action\n  handleClick() {\n    alert('Button clicked!');\n \
    \ }\n}\n```\n\n```handlebars\n<button {{action this.handleClick}}>Click me</button>\n\
    ```\n\n## 791) How do you use EmberJS helpers to manage conditional rendering\
    \ in templates?\n\nEmberJS provides several built-in helpers for conditional rendering\
    \ in templates, such as {{if}}, {{unless}}, and {{each}}. For example, to render\
    \ a message if isSuccess is true and an error message if isSuccess is false, you\
    \ can use the {{if}} helper like this:\n\n```handlebars\n{{#if isSuccess}}\n \
    \ <p>Success!</p>\n{{else}}\n  <p>errorMessage</p>\n{{/if}}\n```\n\n## 792) How\
    \ do you manage application state in EmberJS?\n\nEmberJS provides several tools\
    \ for managing application state, including services, controllers, and components.\
    \ Services are singletons that can be injected into other parts of your application\
    \ and used to manage shared state. Controllers are used to manage state specific\
    \ to a route or context, and Components are used to encapsulate state and can\
    \ be reused across your application.\n\n## 793) How do you use EmberJS services?\n\
    \nYou can define a new service in EmberJS by using the Service object and extending\
    \ it to define its properties and methods. For example, to define a CartService\
    \ that manages the items in a shopping cart, you can create a Service class like\
    \ this:\n\n```javascript\nimport Service from '@ember/service';\n\nexport default\
    \ class CartService extends Service {\n  items = [];\n\n  addItem(item) {\n  \
    \  this.items.push(item);\n  }\n\n  removeItem(item) {\n    const index = this.items.indexOf(item);\n\
    \    if (index !== -1) {\n      this.items.splice(index, 1);\n    }\n  }\n}\n\
    ```\n\n## 794) How do you use EmberJS controllers?\n\nYou can define a new controller\
    \ in EmberJS by using the Controller object and extending it to define its properties\
    \ and methods. For example, to define a PostsController that manages a list of\
    \ posts, you can create a Controller class like this:\n\n```javascript\nimport\
    \ Controller from '@ember/controller';\n\nexport default class PostsController\
    \ extends Controller {\n  posts = [\n    { id: 1, title: 'First post', body: 'Lorem\
    \ ipsum' },\n    { id: 2, title: 'Second post', body: 'Dolor sit amet' },\n  \
    \  { id: 3, title: 'Third post', body: 'Consectetur adipiscing elit' }\n  ];\n\
    }\n```\n\n## 795) How do you use EmberJS components to encapsulate state and behavior?\n\
    \nYou can define a new component in EmberJS by using the Component object and\
    \ extending it to define its properties and methods. For example, to define a\
    \ CounterComponent that displays a count and provides buttons to increment and\
    \ decrement the count, you can create a CounterComponent class like this:\n\n\
    ```javascript\nimport Component from '@glimmer/component';\nimport { tracked }\
    \ from '@glimmer/tracking';\nimport { action } from '@ember/object';\n\nexport\
    \ default class CounterComponent extends Component {\n  @tracked count = 0;\n\n\
    \  @action\n  increment() {\n    this.count++;\n  }\n\n  @action\n  decrement()\
    \ {\n    this.count--;\n  }\n}\n```\n\nThen, you can use the CounterComponent\
    \ in a template like <Counter count={{this.count}} />\n\n## 796) How do you use\
    \ EmberJS computed properties?\n\nComputed properties are used to derive a value\
    \ based on other properties in your application. You can define a computed property\
    \ in EmberJS by using the computed function and passing in one or more dependent\
    \ keys and a function that calculates the computed value. For example, to define\
    \ a fullName computed property that concatenates a person's first and last names,\
    \ you can create a Person class like this:\n\n```javascript\nimport { computed\
    \ } from '@ember/object';\n\nexport default class Person {\n  firstName = 'John';\n\
    \  lastName = 'Doe';\n\n  @computed('firstName', 'lastName')\n  get fullName()\
    \ {\n    return `${this.firstName}${this.lastName}`;\n  }\n}\n```\n\n## 797) How\
    \ do you use EmberJS actions to communicate between components?\n\nYou can use\
    \ actions to communicate between components in EmberJS by passing actions as arguments\
    \ and handling them in the receiving component. For example, to handle a click\
    \ event in a child component and trigger an action in the parent component, you\
    \ can define an action in the parent component and pass it down as a closure action\
    \ like this:\n\n```javascript\nimport Component from '@glimmer/component';\nimport\
    \ { action } from '@ember/object';\n\nexport default class ParentComponent extends\
    \ Component {\n  @action\n  handleChildClick() {\n    alert('Child clicked!');\n\
    \  }\n}\n```\n\nThen, in the parent components template, you can pass the handleChildClick\
    \ action down to the child like this:\n<Child onclick={{this.handleChildClick}}\
    \ />\n\nAnd in the child components template, you can use the {{on}} helper to\
    \ bind the onClick action to a click event like this:\n<button {{on \"click\"\
    \ this.onClick}}>Click me</button>\n"
  mdcn: "\n\n## 783) Ember.js 如何处理数据绑定和更改检测？\n\nEmber.js 使用数据绑定系统在数据更改时高效更新 UI。它还包含一个强大的模板引擎，支持声明式语法和可复用组件。\n\
    \n## 784) 什么是 Ember.js 组件系统？它是如何使用的？\n\n> Ember.js 组件系统是一个允许开发者创建可复用 UI 组件的特性。它使用简单的语法来定义组件的\
