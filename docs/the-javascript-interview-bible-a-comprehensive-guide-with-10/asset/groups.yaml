    \ over configuration）。与其他某些框架不同，EmberJS 内置了许多开箱即用的功能，使其能够更容易快速上手，并用更少的样板代码构建复杂的应用程序。\n\
    \n## 786) 如何在 EmberJS 中定义新路由？\n\n你可以通过使用 Route 对象并为路由指定路径来在 EmberJS 中定义新路由。例如，要为\
