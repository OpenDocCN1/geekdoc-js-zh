    # JavaScript Tricks


    List of tricks which we meet often on interviews.


    ### 504) What is the output of the following tricky code?


    true. This is because the == operator performs type coercion, and all operands
    are coerced to the same value before comparison.

    ```javascript

    console.log(2 == ["2"]);

    ```


    ### 505) What is the output of the following tricky code?


    "object". This is because null is a primitive value in JavaScript, but typeof
    returns "object" because of a historical mistake.

    ```javascript

    console.log(typeof null);

    ```


    ### 506) What is the output of the following tricky code?


    false. This is because of floating-point rounding errors.

    ```javascript

    console.log(0.1 + 0.2 === 0.3);

    ```


    ### 507) What is the output of the following tricky code?


    false. This is because NaN is not equal to any value, including itself.

    ```javascript

    console.log(NaN === NaN);

    ```


    ### 508) What is the output of the following tricky code?


    -0. This is because the unary plus (+) converts its operand to a number.

    ```javascript

    console.log(''+-0'');

    ```


    ### 509) What is the output of the following tricky code?


    true. This is because the ! operator coerces an empty array to a truthy value
    (false), which is then coerced to 0, and an empty array coerces to 0, which are
    equal.

    ```javascript

    console.log([] == ![]);

    ```


    ### 510) What is the output of the following tricky code?


    false. This is because NaN is not equal to any value.

    ```javascript

    console.log(NaN === NaN);

    ```


    ### 511) What is the output of the following tricky code?


    true. This is because the < operator has left-to-right associativity, so 1 < 2
    is true, and 1 < 3 is true.

    ```javascript

    console.log(1 < 2 < 3);

    ```


    ### 512) What is the output of the following tricky code?


    "". This is because the + operator performs string concatenation when one or both
    operands are strings, and an empty array coerces to an empty string.

    ```javascript

    console.log([] + []);

    ```


    ### 513) What is the output of the following tricky code?


    "3". This is because the + operator performs string concatenation when one or
    both operands are strings.

    ```javascript

    console.log(1 + 2 + "3");

    ```


    ### 514) What is the output of the following tricky code?


    1. This is because the - operator performs arithmetic subtraction when both operands
    are numbers.

    ```javascript

    console.log(''2'' - 1);

    ```


    ### 515) What is the output of the following tricky code?


    "string". This is because the typeof operator always returns a string, even when
    applied to another typeof expression.

    ```javascript

    console.log(typeof typeof null);

    ```


    ### 516) What is the output of the following tricky code?


    true. This is because an empty array coerces to 0, and the == operator performs
    type coercion.

    ```javascript

    console.log([]) == 0);

    ```


