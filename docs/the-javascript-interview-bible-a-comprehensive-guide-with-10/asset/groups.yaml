    # 211) What is the difference between the `var`,

    `let`, and `const` keywords in JavaScript?


    The `var`, `let`, and `const` keywords are used to declare variables in JavaScript.
    The main differences between these keywords are in their scope, hoisting, and
    ability to be reassigned or mutated.


    +   - `var`: Variables declared with `var` are function-scoped, meaning they are
    accessible within the function they are declared in, as well as any nested functions.
    `var` declarations are hoisted to the top of their scope, which can lead to unexpected
    behavior. `var` variables can be reassigned and mutated.

    - `let`: Variables declared with `let` are block-scoped, meaning they are accessible
    within the block they are declared in (e.g. within a loop or conditional statement),
    as well as any nested blocks. `let` declarations are not hoisted. `let` variables
    can be reassigned but not mutated.

    - `const`: Variables declared with `const` are also block-scoped and not hoisted.
    `const` variables cannot be reassigned or mutated once they are declared.


    Example:'
  - "[PAGE 91]\n\n```\n// var example\nfunction varExample() {\n  if (true) {\n  \
    \  var name = \"John\";\n    console.log(name); // Output: \"John\"\n  }\n}\n\
    // let example\nfunction letExample() {\n  if (true) {\n    let name = \"John\"\
    ;\n    console.log(name); // Output:\n    // Uncaught ReferenceError: name is\
    \ not defined\n  }\n}\n// const example\nfunction constExample() {\n  const name\
    \ = \"John\";\n  name = \"Jane\";\n  // Output: Uncaught TypeError\n  // Assignment\
    \ to constant variable.\n}\n```"
