    \ 1);\n    }\n  }\n}\n```\n\n## 794) 如何使用 EmberJS 控制器？\n\n你可以通过使用 Controller 对象并扩展它来定义其属性和方法，从而在\
    \ EmberJS 中定义一个新的控制器。例如，要定义一个管理文章列表的 PostsController，你可以如下创建一个 Controller 类：\n\
    \n```javascript\nimport Controller from '@ember/controller';\n\nexport default\
    \ class PostsController extends Controller {\n  posts = [\n    { id: 1, title:\
    \ 'First post', body: 'Lorem ipsum' },\n    { id: 2, title: 'Second post', body:\
    \ 'Dolor sit elit' },\n    { id: 3, title: 'Third post', body: 'Consectetur adipiscing\
    \ elit' }\n  ];\n}\n```\n\n## 795) 如何使用 EmberJS 组件封装状态和行为？\n\n你可以通过使用 Component\
    \ 对象并扩展它来定义其属性和方法，从而在 EmberJS 中定义一个新的组件。例如，要定义一个显示计数并提供增减按钮的 CounterComponent，你可以如下创建一个\
    \ CounterComponent 类：\n\n```javascript\nimport Component from '@glimmer/component';\n\
    import { tracked } from '@glimmer/tracking';\nimport { action } from '@ember/object';\n\
    \nexport default class CounterComponent extends Component {\n  @tracked count\
