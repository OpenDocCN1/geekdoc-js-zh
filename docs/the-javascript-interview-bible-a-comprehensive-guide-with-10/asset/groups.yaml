    \ => {\n  reject(\"error\");\n}).catch(function(error) {\n  console.log(error);\n\
    });\n```\n\n## 221) JavaScript 中的 finally 关键字是什么？\n\n`finally` 关键字用于定义无论是否发生错误都会执行的块块。示例：\n\
