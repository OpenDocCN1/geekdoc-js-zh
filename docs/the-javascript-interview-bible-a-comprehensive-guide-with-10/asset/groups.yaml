    ```\n\n## JavaScript 笑话\n\n一些流行的 JavaScript 笑话简列表。\n\n## 992) 为什么 JavaScript 开发者要戴眼镜？\n\
    \n> 因为他们看不懂 C#（couldn't see C#）。\n\n## 993) 为什么 JavaScript 开发者要辞职？\n\n> 因为他们搞不懂数组（didn't\
