    \ let 和 var 有什么区别？\n\n`let` 和 `var` 都用于声明变量。它们的主要区别是 `let` 是块作用域的，而 `var` 是函数作用域的。示例：\n\
    \n```javascript\nif (true) {\n  let x = 5;\n  var y = 10;\n}\nconsole.log(y);\
    \ // Output: 10\nconsole.log(x); // ReferenceError: x is not defined\n```\n\n\
    ## 219) JavaScript 中的 async 关键字是什么？\n\n`async` 关键字用于定义一个总是返回 Promise 的异步函数。示例：\n\
