    ## 68) JavaScript 中 async/await 语法的作用是什么？


    async/await 语法提供了一种更易读、更简洁的编写异步代码的方式，底层使用了 Promise 对象。


    ## 69) JavaScript 中 typeof 运算符的作用是什么？


    typeof 运算符用于确定 JavaScript 中给定值的数据类型。


