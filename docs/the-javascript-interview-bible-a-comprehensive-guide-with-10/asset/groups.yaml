    \ // Output: undefined\nvar name = \"John\";\n```\n\n## 210) 写一个 JavaScript 闭包示例\n\
    \n闭包是一个可以访问其外部作用域变量的函数，即使外部函数已经返回也是如此。当函数在另一个函数内部定义且内部函数引用了外部函数的变量时，就会创建闭包。示例：\n\
    \n```javascript\nfunction outerFunction() {\n  const name = \"John\";\n\n  function\
    \ innerFunction() {\n    console.log(name);\n  }\n\n  return innerFunction;\n\
    }\n\nconst closure = outerFunction();\nclosure(); // Output: \"John\"\n```\n\n"
