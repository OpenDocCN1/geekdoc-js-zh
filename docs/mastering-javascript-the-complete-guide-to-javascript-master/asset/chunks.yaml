  trans: "\n\n# 精通 JavaScript：JavaScript 精通全指南\nTim Robards © 2022 Tim Robards\n\n\
    ## 目录\n\n### 引言\n- 介绍 JavaScript\n- 如何在网页中添加 JavaScript\n- 如何添加内联 JavaScript\n\
