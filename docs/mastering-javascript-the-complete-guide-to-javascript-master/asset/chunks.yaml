  trans: "\n你想要在其上绘制的元素，然后调用其 `HTMLCanvasElement.getContext()` 方法：\n\n```javascript\n\
    1 let canvas = document.querySelector('canvas');\n2 let ctx = canvas.getContext('2d');\n\
    ```\n\n我们想对画布执行的任何操作，都可以通过调用上下文对象的属性和方法来实现（该对象是例如以下内容的实例）：\n\n```javascript\n\
    1 Circle.prototype.draw = function() {\n2 ctx.beginPath();\n3 ctx.fillStyle =\
    \ this.color;\n4 ctx.arc(this.x, this.y, this.size, 0, 2 * Math.PI);\n5 ctx.fill();\n\
    6 };\n```\n\n### APIs 通过事件处理状态更改\n\n在使用 `XMLHttpRequest` 对象（每个对象代表一个向服务器的 HTTP\
    \ 请求，以获取新资源）时，我们有许多可用事件，例如，当成功返回包含请求资源的响应且该资源现在可用时，会触发 `load` 事件。\n\n以下代码提供了一个关于如何使用它的示例：\n\
    \n```javascript\n1 let requestURL = 2 3 let request = new 4\n5 = 6 7 8 = { 9\n\
    \  let usernames = 10\n11\n12 }\n```\n\n前五行指定了我们想要获取的资源的位置，使用 `XMLHttpRequest()`\
    \ 构造函数创建一个请求新实例，打开一个 HTTP GET 请求来获取指定的资源，指定响应应以 JSON 格式发送，然后发送请求。\n\n`onload`\
    \ 处理程序函数接着指定了我们对响应进行的操作。我们知道在 `load` 事件触发后，响应将成功返回并可用（除非发生错误），因此我们将包含返回的 JSON\
    \ 的响应保存到 `usernames` 变量中，然后将其传递给两个不同的函数进行进一步处理。\n\n**注意：** 在下一章节中，我们将更详细地查看如何从服务器获取数据。\n\
    \n### 总结\n这就是 API 的概览！我们查看了 API 是什么、它们如何工作，比较了浏览器 API 和第三方 API，最后我们查看了许多 API 共享的一些共同特征。我希望这段介绍能让你对\
    \ API 是什么以及我们如何在项目中使用它们有更深入的理解\n\n## 从服务器获取数据\n\n在这一章中，我们将研究如何从服务器检索数据。现代网站和应用程序需要无缝地做到这一点——也就是说，在不需要重新加载整个的情况下更新\
    \ web 页面的部分。我们将查看两种使这成为可能的技术：`XMLHttpRequest` 和 `Fetch`。\n\n### 旧方法……\n使用旧方法在\
    \ Web 上加载页面非常简单——你向服务器发送一个网站的请求，如果没有出错，任何组成页面的资产都将下载并显示在你的计算机或设备上。\n\n![](img/image-llwgnqoj.png)\n\
    \n这是多年来网站的工作方式。然而，它有许多缺陷……每当你想更新页面的任何部分时，例如显示一组新产品或提交表单，整个页面都必须重新加载。这种做法非常消耗资源，并导致糟糕的用户体验（UX），特别是随着页面变大并变得越来越复杂。\n\
    \n### 解决方案：AJAX\n随着技术的出现，这个问题得到了解决，这些技术允许网页请求小块状的数据（如 HTML、XML、JSON 或纯文本）并仅在需要时显示它们。\n\
    \n这是通过使用如 `XMLHttpRequest` 或 `Fetch` API API 实现的。这些技术允许网页直接处理对服务器上可用特定资源的 HTTP\
    \ 请求，并在显示之前根据需要对结果数据进行格式化。\n\n这种技术被称为 Ajax，最初它主要使用 `XMLHttpRequest` 请求 XML 数据（因此有“and\
    \ XML”）。然而，如今你更有可能使用 `XMLHttpRequest` 或 `Fetch` 来请求 JSON ——但结果仍然相同，所以“Ajax”这个词留了下来。\n\
    \n![](img/image-ftq13hmc.jpg)\n\n从概念上说，Ajax 涉及使用 Web API 作为代理来更智能地请求数据，而不是仅仅让浏览器加载整个页面。\n\
    \n你可以在几乎每个主要网站上看到它的实际运行。例如，当你在 YouTube 上播放新视频时，你会发现导航、页眉和页脚部分没有刷新——只有包含视频的区域。\n\
    \n#### 为什么这很重要？\n- 页面更新快得多，你等待页面刷新的时间更短，因此网站感觉更快、响应更快（页面速度对于 Google 排名和 SEO 也很重要！）。\n\
    - 每次更新下载的数据较少，意味着浪费的带宽减少。虽然在桌面上不是大问题，但在没有快速互联网的发展中国家的移动设备上，这是一个大问题。\n\n### 创建\
    \ Ajax 请求\n在本节中，我们将首先使用 `XMLHttpRequest`，然后使用 `Fetch` 来执行 Ajax 请求。\n\n#### XMLHttpRequest\n\
    `XMLHttpRequest`（通常缩写为 `XHR`）现在实际上是一项相当老的技术了——它由微软在 90 年代发明，并从那时一直使用。\n\n要创建一个\
    \ XHR 请求，你首先需要使用 `XMLHttpRequest()` 构造函数创建一个新的请求对象。你可以给此对象起任何名字，在我们的演示中，我们将命名为\
    \ `xhr`。如下：\n\n```javascript\n1 let xhr = new XMLHttpRequest();\n```\n\n下一步是使用\
    \ `open()` 方法初始化它。在这里，我们指定使用哪种 HTTP 请求方法从网络请求资源，以及它所在的 URL。在这里我们将使用 `GET` 并将 URL\
    \ 设置为变量 `url`。我们在上一行下面添加：\n\n```javascript\n1 xhr.open('GET', url);\n```\n\n接下来，我们将预期的响应类型设置为\
    \ `text`。这并不是严格必要的，因为 XHR 默认返回文本——但养成这个习惯是个好主意，因为将来无疑会获取其他类型的数据！现在我们添加：\n\n```javascript\n\
    1 xhr.responseType = 'text';\n```\n\n每当我们从网络获取资源时，我们都在执行一个异步操作。这意味着你必须等待该操作完成（当资源从网络返回时）才能对该响应进行任何操作，否则将抛出错误。使用\
    \ XHR 我们可以使用 `onload` 事件处理这一点——当 `load` 事件触发时（响应返回后）。响应数据将在 XHR 对象的 `response`\
    \ 属性可用。接下来，我们创建函数来处理 `onload` 事件：\n\n```javascript\n1 let onload = function()\
    \ {\n2 };\n```\n\n最后我们需要一个 `send()` 方法来运行请求：\n\n```javascript\n1 xhr.send();\n\
    ```\n\n#### Fetch\n`Fetch` API 是一种现代替代方案，可以作为 XHR 的替换。它是为了在 JavaScript 中轻松执行异步请求而构建的。让我们看一个简单的示例：\n\
    \n```javascript\n1 // 调用 fetch 函数，将 url 作为参数\n3 fetch(url)\n4 .then(response =>\
    \ {\n5 // 处理从 API 获取的数据\n6 return response.json();\n7 })\n8 .then(data => {\n\
    9 // 这是服务器返回\n10 console.log(data);\n11 })\n```\n\n我们在这里所做的是获取 URL，默认使用 `GET`\
    \ 方法——这就是我们要！让我们看到更详细的代码：\n\n```javascript\n1 fetch(url)\n2 .then(response =>\
    \ {\n3 // 从响应中提取 JSON 体\n4 return response.json();\n5 })\n6 .then(data => {\n\
    7 // 然后打印到控制台\n8 console.log(data);\n9 });\n```\n\n在这里我们从 URL 获取一个 JSON 文件并将其打印到控制台。`fetch()`\
    \ 最简单的用法接收一个参数——所需的资源路径——并返回一个包含响应的 promise（对象形式）。\n\n#### 使用 promises\n与许多现代\
    \ API 一样，Fetch 使用 promises。虽然它们起初有点困惑，但现在不用太担心，你会习惯的！让我们看看与其相关的 promise 结构：\n\n\
    ```javascript\n1 fetch(url)\n2 .then(response => {\n3 return response.json();\n\
    4 })\n5 .then(data => {\n6 console.log(data);\n7 });\n```\n\n第一行的意思是“获取位于 URL\
    \ 的资源”，“并在当 promise 解析时运行函数”。指定的运行时是从 URL 获取资源（使用 HTTP 请求）并返回响应以便执行某些操作。有效来说，传递给\
    \ `then()` 的函数是一个立即运行的代码。相反，它将在未来响应返回的某点运行。\n\n#### 所以你应该使用哪种技术？\nXHR 已经存在很长时间了，并且具有良好的浏览器支持。另一方面，Fetch\
    \ 和 Promises 是 Web 平台较新的添加，尽管它们在 Internet Explorer 之外支持良好。如果你需要支持旧浏览器，那么 XHR 方案可能是更好的。然而，如果你在一个更先进的项目上并且不担心旧浏览器，那么\
    \ Fetch 将是一个很好的选择。\n\n### 总结\n就这样！我们查看了如何使用 XHR 和 `Fetch` 技术通过 AJAX 从服务器检索数据。我们查看了每个技术的示例示例！希望现在你已经掌握了每一个\n\
    \n## REST APIs 简介\n(REST) 是一种处理客户端-服务器关系的架构风格，目的是通过使用可重用组件追求速度和性能。REST 作为一种技术通过\
    \ Roy Fielding 的论文（https://www.ics.edu/~fielding/dissertation/top.htm）引入世界。现在通常认为优于\
    \ SOAP（简单对象访问协议），因为 REST 使用的带宽更少，对于互联网使用来说更简单灵活。\n\n### 什么是 REST API？\nREST API\
    \ 是一种易于访问 Web 服务的方法，无需额外的处理。每当调用 RESTful API 时，服务器将向客户端传输请求资源状态的表示。事实上，我们几乎每天都在使用它！如果你尝试在\
    \ YouTube 上寻找视频。你会在搜索框中输入“biking”，按回车，然后你会看到一个列表。从概念上说，REST API 的工作方式就是这样！你搜索某些内容，然后从你请求的服务返回结果列表。API\
    \ 是应用程序编程接口。它是一组允许程序相互通信的规则集。开发者在服务器上创建 API 并允许客户端与其通信。REST 决定了 API 的外观。它是开发者在创建\
    \ API 时遵循的规则。其中一个规则规定，当你链接到特定 URL 时，你应该能够获取数据数据（资源）。每个 URL 被称为请求，而返回给你的数据被称为一个\n\
    \n### RESTful 架构\n- **无状态**：意味着服务器不存储客户端数据，会话存储在客户端（通常会话存储中）。\n- **客户端<->服务器**：前端（客户端）和后端（服务器）之间存在关注分离。它们独立运行且都是可替换的。\n\
    - **缓存**：来自服务器的数据可以在客户端缓存，这可以提高性能。\n- **URL 组合**：我们使用标准的基 URL 组合。例如，`GET` 请求将产生数据库中的所有城市，而对\
    \ `/cities/seattle` 请求将渲染 ID 为 Seattle 的城市。同样，REST 利用标准方法如 `DELETE` 和 `POST` 来执行操作。\n\
    \n#### REST 的运行\n让我们更仔细地查看它是如何执行的！我们的请求通过 HTTP 以 Web URL 的形式从客户端发送到服务器。使用 `GET`、`POST`、`PUT`\
    \ 或 `DELETE`。然后从服务器返回响应，可以是任何内容如 HTML、XML、图像或 JSON。JSON 是目前最流行的格式，所以我们将使用它作为示例。\n\
    \nHTTP 有五种在 REST 架构中常用的方法：POST、`GET`、`PUT`、`PATCH` 和 `DELETE`。事实上，它们分别对应创建、读取、更新和删除\
    \ (CRUD) 操作。还应该注意，还有其他较不常用的方法，如 `OPTIONS` 和 `HEAD`。\n\n"
