    5 6 // get 7 alert(user["likes potatoes"]); // true 8 9 // delete 10 delete user["likes
    potatoes"];  Updating object members We can update the values within our objects
    by simply declaring the property you’d like to set with the new value, like so:  1
    user.age     // 32 2 user.age = 33  // 33 3 user.age     // 33  You can also create
    completely new members of your object. For example:  1 user.surname = ''Smithessson'';
    2 // user 3 {name: "Sam", age: 33, likes potatoes: true, surname: "Sm\ 4 ithessson"}  What
    is “this”? You may have noticed the use of the word ‘this’ in our earlier example.
    See the following:  1 { 2  car is a '' + + 3 }  The this keyword refers to the
    current object that the code is being written inside of— so in this case this
    is equivalent to Why not just write car instead? It’s best practice to write well-constructed
    object-orientated code, and in doing so the use of this is extremely useful. It
    will ensure the correct values are used when a member’s context changes (e.g.
    two different car object instances may have different names, but will want to
    use their own name when displaying their own information). For example:  1 var
    car1 = { 2  3  { 4   car is a '' + + 5  } 6 } 7 var car2 = { 8  9  { 10   car
    is a '' + + 11  } 12 }  In this case, car1.display() will output “This car is
    a Tesla.” And car2.display() will output “This car is a Toyota.”, even though
    the method’s code is exactly the same in both cases. As this is equal to the object
    the code is inside becomes really useful when you are dynamically generating objects
    (for example using constructors), which is outside the scope of this article! Summary And
    that’s it! You should now have a good idea of how to work with objects in JavaScript
    — including creating your own simple objects, as well as accessing and manipulating
    object properties. You‘ll also begin to see how objects are very useful as structures
    for storing related data and functionality. For instance, if you tried to keep
    track of all the properties and methods in our car object as separate variables
    and functions, it would be extremely inefficient, and we’d run the risk of clashing
    with other variables and functions that have the same names. Objects let us keep
    the information safely locked away in their own package. Using Conditionals When
    we want to introduce logic & make decisions in our programs, we use With conditionals,
    we can control the behavior of our code — by determining whether or not pieces
    of code can run. For example, when using a weather app, if the weather is sunny
    we could see a sun image, or if it’s raining we could see a rain-cloud image.
    Let’s now take a look at how we can implement conditionals in our code… if/else
    Statements The most common type of conditional statements are if and else statements.
    The syntax looks like so:  1 if { 2  run this code if the condition is true 3
    } else { 4  run this code instead 5 }  We use if followed by a set of parentheses
    that contain our The condition will make use of comparison operators to test whether
    our condition evaluates to true or and it’ll return the result. If the result
    is the code in the following set of curly braces will execute. The code in this
    section can be whatever we like. If the result is the code contained within the
    curly braces following our else statement will execute instead. Let’s take a look
    at an example:  1 if < { 2  notify = is 3 } else { 4  notify = is 5 }  In our
    above code, our notify variable will be set to “It is AM” if the hour is less
    than 12\. Otherwise hour is greater than 12 and will be set to “It is else if Of
    course, we will often have more than two choices to work with! To consider these
    additional choices we use else We put additional blocks in between our if () {}
    and else {} statements. Let’s adjust our previous example to see this in action:  1
    if < { 2  notify = is 3 } else if < 4  notify = is 5 } else { 6  notify = is 7
    }  Comparison operators To test the conditions inside our conditional statements,
    we use comparison These operators are as follows: === and !== — to test if one
    value is equal to, or not equal to, the other.< and > — to test if one value is
    less than or greater than the other.<= and >= — to test if one value is less than
    or equal to, or greater than or equal to, the other. A very common pattern when
    doing comparisons in conditional statements is to test Booleans and Any value
    that is not or an empty string will in fact return true when tested as a conditional
    statement. This means you can easily use a variable name on its own to test whether
    it is or even that it exists at all (i.e. it is not undefined.) For example:  1
    let snack = 2 3 4 if { 5  have 6 } else { 7  Cheetos this 8 }  Nesting if/else There
    will be times when you’ll want to nest an if/else statement inside of another
    one — and it’s fine to do so! Let’s see an example:  1 if === { 2  if > { 3   hunger
    level + hungerLevel + '' an\ 4 d I have So I will eat 5  } else if <= { 6   hunger
    level + hungerLevel + '' an\ 7 d even though I have not that hungry so I w\ 8
    eat them 9  } 10 }  Logical operators: AND, OR, and NOT We can also test multiple
    conditions without needing to write nested if/else statements, we do this with
    logical operators: AND: lets you chain together two or more expressions. Every
    expression must evaluate to true for the whole expression to return Let’s rewrite
    our previous example using AND:  1 if === && hungerLevel > { 2  hunger level +
    hungerLevel + '' and \ 3 I have So I will eat 4 } else if === && hungerLevel <=
    { 5  hunger level + hungerLevel + '' and \ 6 even though I have not that hungry
    so I won\ 7 eat them 8 }  The first code block will only run if snack === ''Cheetos''
    and hungerLevel < 5 return also lets you chain together two or more expressions.
    One or more of them have to evaluate to true for the whole expression to return Let’s
    see an example using OR:  1 if || carStatus === { 2  should commence 3 } else
    { 4  be an 5 }  NOT: ! - can be used to negate an expression. Let’s combine it
    with OR in the above example:  1 if || carStatus === 2  should commence 3 } else
    { 4  be an 5 }  In this example, our OR statement returns however, the NOT operator
    will negate it - so that the overall expression now returns A common mistake when
    using the logical OR operator in conditional statements is to try to state the
    variable whose value you are checking once, and then give a list of values it
    could be to return true, separated by || (OR) operators. For example:  1 if ===
    10 || 20 || 30 || { 2  // run this code 3 }  In this case, the condition inside
    if(...) will always evaluate to true since 20 (or any other non-zero value) always
    evaluates to true. This condition is actually saying “if x equals 10, or 20 is
    true — which it always is”. This is logically not what we want! To make this work
    you’ve got to specify a complete test on either side of each OR operator:  1 if
    === 10 || x === 20 || x === 30 || x === { 2  // run this code 3 }  switch statements if/else
    statements do a great job of enabling conditional code, but they are not always
    the best way to handle every scenario. They are mainly useful when you’ve got
    a couple of options, and each one requires a reasonable amount of code to be run.
    They’re also useful when the conditions are complex (e.g. multiple logical operators). For
    cases where you just want to set a variable to a certain choice of value or print
    out a particular statement depending on a condition, the syntax can be a bit inefficient,
    especially if you’ve got a large number of choices. This is when we should consider
    using a switch statement! — they take a single expression/value as an input and
    then look through a number of choices until they find one that matches that value,
    executing the corresponding code that goes along with it. Let’s see an example:  1
    switch { 2  case 0: 3   day = 4   5  case 1: 6   day = 7   8  case 2: 9   day
    = 10   11  case 3: 12   day = 13   14  case 4: 15   day = 16   17  case 5: 18   day
    = 19   20  case 6: 21   day = 22 }  We use the keyword followed by a set of parentheses
    that contains our expression. This is followed by the keyword followed by a choice
    that the expression/value could be, followed by a colon. We then include some
    code to run if the choice matches the expression. And finally a break statement. If
    the previous choice matches the expression/value, the browser stops executing
    the code block here and moves on to any code that appears below the switch statement.
    We can include as many other cases as we need! Ternary operator In this final
    section of the chapter, let’s take a look at the ternary It’s a small piece of
    syntax that tests a condition and returns one value/expression if it’s and another
    if it’s false — this can be useful in some situations and takes up a lot less
    code than an if/else block. The pseudocode looks like this:  1 ( condition ) ?
    run this code : run this code instead  So let’s look at a simple example:  1 let
    age = 25; 2 let beverage = (age >= 18) ? "Beer" : "Apple Juice"; 3 console.log(beverage);
    // "Beer"  If age is the customer can buy a beer, if not, all we have to sell
    them is apple juice. Mastering Loops In JavaScript, we use loops when we want
    an easy way to handle repetition. In this chapter, we’re going to take a look
    at all the different ways we can create loops in our code — and we’ll consider
    the pros and cons of each method. A way to think of a loop could be to think of
    giving commands to a robot. You could tell it to take 10 steps — and rather than
    issuing 10 separate commands, we can create a loop:  1 let 2 for = i < 10; i++)
    { 3  one 4 }  This is an example of a for loop. At first, this may be confusing
    — but we’ll break it all down in the next section! In this article, we’ll be reviewing
    many different kinds of loop statements, such as: labelled break continue for...in
    & It’s worth noting that despite their differences in syntax — loops all essentially
    do the same thing: repeat an action a number of times. The situation dictates
    which type of loop is best suited. the for loop As we’ve seen in the above example,
    a for loop will repeat until our condition evaluates to false. The logical structure
    is like so:  1 for 2 3  statement  We are first initializing the which usually
    initializes one or more loop counters, but the syntax even allows for more complex
    expressions such as variables. We next evaluate our if the loop statements will
    execute. If the loop terminates. Then the statement executes. When we wish to
    execute multiple statements, we use a block statement ... to group them together.
    If present, the update expression incrementExpression is executed. Control then
    returns to evaluating the Let’s now return to our previous example:  1 let 2 for
    = i < 10; i++) { 3  one 4 }  Here we can see our for statement is counting the
    number of steps taken up to 10\. The variable i will ensure we’re starting from
    the beginning by initializing to zero. Then it will check that i is less than
    the number we specify, which in our case is The i++ is the count which will increment
    i by 1 after each pass through the loop. So our loop knows when to complete! do…while
    statement A do...while statement will repeat until the condition evaluates to
    The structure is like so:  1 do 2  statement 3 while  It’s fairly self-explanatory,
    statement is always executed once prior to the condition being checked. And then
    again until the while condition returns We can execute multiple statements, using
    a block statement ... to group them. If condition is the statement executes again.
    At the end of each execution, the condition is checked. When the condition returns
    the execution stops and control passes to the statement which follows Let’s see
    an example:  1 let i = 2 do { 3  i += 4  5 } while <  Here our do loop iterates
    at least once and then reiterates until i is no longer less than 10\. while statement A
    while statement executes its statements as long as a specified condition evaluates
    to Its syntax is as follows:  1 while 2  statement  If the condition becomes the
    statement within the loop stops executing and control then passes to the statement
    following the loop. The condition test occurs before the statement in the loop
    is executed. And if the condition returns the statement is executed and the condition
    is tested again. If the condition returns execution will stop and control is passed
    to the statement following And as with we can execute multiple statements using
    a block statement to group them together. The following while loop will iterate
    as long as a is less than three:  1 let a = 2 let b = 3 while < { 4  5  6 }  Here
    with each iteration, the loop increments a and adds that value to Therefore, a
    and b take on the following values: After the first pass through the loop : a
    = 1 and b = 1And the second pass: a = 2 and b = 3And the third pass: a = 3 and
    b = 6 After completion of the third pass, the condition a < 3 is no longer so
    that’s where our loop terminates! Note: When you first start working with loops,
    you may accidentally create an infinite This is when a loop condition never evaluates
    to false. The statements in the following while loop execute forever because the
    condition is never false:  1 while { 2  3 }  CAUTION: If you run this code — please
    be aware that it’s likely to crash your browser!! So make sure you’ve backed up
    your open tabs - if you want to see what happens. labelled statement You can attach
    a label to any statement to serve as an identifier so you can refer to it elsewhere
    in your program. As an example, you could use a label to identify a loop, and
    then use break or continue statements to indicate whether a program should interrupt
    the loop, or continue its execution (we’ll take a look at these below).  1 label
    : 2  statement  The value of label may be anything you like (with the exception
    of a JavaScript reserved word). Then you provide to execute. So for example, you
    could use the label totalLoop to identify a while loop.  1 2 while == { 3  4 }  break
    statement We use the break statement to terminate a loop or or in conjunction
    with a labelled statement. When you use break without a label, it terminates the
    innermost enclosing or switch immediately and transfers control to the following
    statement.When you use break with a label, it terminates the specified labelled
    statement. A break statement looks like this:  1 break  For example, let’s loop
    through an array until we find the index of an element with the value of: foundMe  1
    for i = i < { 2  if == { 3   4  } 5 }  And let’s use break with a labelled statement:  1
    let x = 2 let z = 3 while { 4  console.log(''Outer '' + x); 5  x += 1; 6  z =
    1; 7  while (true) { 8   '' + 9   z += 10   if (z === 10 && x === 10) { 11    break
    12   } else if === { 13    14   } 15  } 16 }  continue statement We use the continue
    statement to restart a or label statement. When you use continue without a label,
    it terminates the current iteration of the innermost enclosing or for statement
    and continues execution of the loop with the next iteration. This contrasts with
    the break statement, as continue doesn’t terminate the execution of the loop entirely.
    In a while loop, it jumps back to the condition. In a for loop, it jumps to theWhen
    you use continue with a label, it applies to the looping statement identified
    with that label. A continue statement looks like so:  1 continue  For example,
    the following code block shows a while loop with a continue statement that will
    execute when the value of i is three. So n takes on the values one, three, seven,
    and twelve.  1 let i = 2 let n = 3 while < { 4  5  if == { 6   7  } 8  n += 9  10
    } 11 // 12 let i = 13 let n = 14 while < { 15  16  if == { 17   // 18  } 19  n
    += 20  21 } 22 //  for…in statement A for...in statement iterates a specified
    variable over all the enumerable properties of an For each distinct property,
    JavaScript executes the specified statements. The syntax is as follows:  1 for
    in { 2  statements 3 }  The following function takes as its argument an object
    and the object’s It then iterates over all the object’s properties and returns
    a string that lists the property names and their  1 function { 2  let result =
    3  for i in { 4   result += obj_name + ''.'' + i + '' = '' + + '''
