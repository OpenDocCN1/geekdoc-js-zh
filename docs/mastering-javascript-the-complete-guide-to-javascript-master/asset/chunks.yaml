    array is a type of a high-level, list-like object, which consists of an ordered
    collection (or list) containing zero or more data types. We use numbered indices
    starting from 0 to access specific items. Let’s cover the basics with some examples! Creating
    an Array  1 var shapes = 2 // 3  How can we access each array item?  1 var first
    = // Square 2 var second = // Circle 3 var last = — // Triangle  Looping over
    an Array You could use any looping method, but let’s go with  1 2  3 }); 4 5 //
    Square 0 6 // Circle 1 7 // Triangle 2  Adding to the end of an Array We use the
    push() method:  1 var addItem = 2 3 // [“Square”, “Circle”, “Triangle”, "Rectangle"]  Removing
    from the end of an Array We use the pop() method:  1 var removeItemEnd = 2 3 //
    [“Square”, “Circle”, “Triangle"]  Removing from the front of an Array We use the
    shift() method:  1 var removeItemFront = 2 3 // [“Circle”, "Triangle"];  Adding
    to the front of an Array We use the unshift() method:  1 var addItemFront = 2
    3 // [“Hexagon”, “Circle”, "Triangle"];  Getting the index of an Array item We
    use the indexOf() method:  1 var pos = 2 3 // 1  Removing an item by index position We
    use the splice() method:  1 var removedItem = 2 3 // [“Hexagon”, “Triangle”]  Remove
    multiple items from an index position  1 var colors = 2 3 4 5 // [“Red”, “Green”,
    “Blue”, “Yellow”] 6 7 var pos = n = 8 var removedItems = 9 10 // We use n to define
    the number of items to be removed, \ 11 from pos until n 12 13 14 // [“Red”, “Yellow”]
    15 16 17 // [“Green”, “Blue”]  Copying an Array We assign our array to a new variable
    using the slice() method:  1 var arrayCopy = 2 3 // [“Hexagon”, “Triangle”]  Checking
    if an object is an Array We use the isArray() method to test if objects are arrays:  1
    2 3 // true  Reversing the order of an Array We use the reverse() method:  1 var
    food = 2 3 4 5 // ["bread", "salad", "pasta", "pizza"]  Replacing Array elements
    with static values We use the fill() method to replace elements with a static
    value:  1 2 3 // ["yum", "yum", "yum", "yum"]  If instead, we wished to replace
    only some elements, we can set start and end points:  1 2 3 // ["bread", "yum",
    "yum", "yum"] 4 5 6 7 // ["pizza", "pasta", "yuck", "yuck"]  Sorting an Array We
    use the sort() method to sort our elements based on the first character in the
    element. Note: If our first character is identical, it will compare the second,
    then the third and so on.  1 var food = 2 3 4 5 // ["bread", "pasta", "pizza",
    "salad"]  If any of our Array items begin with an uppercase character, they would
