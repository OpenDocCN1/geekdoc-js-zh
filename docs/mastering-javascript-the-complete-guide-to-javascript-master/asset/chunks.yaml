    Arrays We use the concat() method to merge two or more arrays together:  1 var
    dogs = ''Beagle\ 2 3 4 var cats = 5 6 var animals = 7 8 9 10 // ["Labrador", "Chihuahua",
    "Greyhound", "Beagle", "Pers\ 11  Converting Array Elements into a String We use
    the join() method:  1 var dogs = ''Beagle\ 2 3 4 var joinedDogs = 5 6 7 8 // "Labrador,Chihuahua,Greyhound,Beagle"  If
    we want whitespace in our new string or any other separator for that matter, we
    add it as a parameter to our like so:  1 var joinedDogs = 2 3 4 5 // "Labrador,
    Chihuahua, Greyhound, Beagle"  map(), filter() and reduce() We use the map() method
    to apply a function to every element of an array. Say we want to add 10 to every
