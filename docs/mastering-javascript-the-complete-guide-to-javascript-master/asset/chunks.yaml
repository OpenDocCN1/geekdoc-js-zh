    of both inline event handlers and event handler properties, let’s move onto event
    listeners. Event Listeners Event listeners watch for an event on an element, instead
    of assigning the event directly to a property on the element, we’ll use the addEventListener()
    method to listen for the event. addEventListener() takes two mandatory parameters
    — the event to listen for and the listener callback function. The HTML for our
    event listener will remain the same as the previous example. And we’ll still be
