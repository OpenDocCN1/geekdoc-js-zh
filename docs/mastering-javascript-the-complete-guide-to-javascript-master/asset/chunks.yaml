  trans: "\n\n```javascript\n5 6 } 7 result += 8 return 9 }\n```\n对于一个具有 `lunch` 和\
    \ `result` 属性的对象 `food`，如下：\n1 `food.lunch = Sandwich`\n2 `food.dinner = Lasagna`\n\
    \n**注意**：考虑到 `for...in` 是为迭代对象设计的，不建议用于数组使用——因为数组的索引顺序很重要。对于数组，最好使用更传统的 `for`\
    \ 循环。\n\n### `for…of` 语句\n`for ... of` 语句创建一个遍历可迭代对象的循环，例如 `arguments` 等。语法如下：\n\
    \n```javascript\n1 for of { \n2  statement \n3 } \n```\n下面的示例展示了 `for...of` 循环和\
    \ `for … in` 循环之间的区别。`for...in` 遍历的是属性名，而 `for...of` 遍历的是属性值：\n\n```javascript\n\
    1 let arr = 2 = 3 \nfor i in { \n4  // 打印 \"0\", \"1\", \"2\", \"greet\" \n5 }\
    \ \nfor i of { \n7  // 打印 10, 20, 30 \n8 } \n```\n\n### 总结\n就是这些！我们学习了许多不同的循环语句，例如：标记的\
    \ `break`、`continue`、`for..in` 和 `And`。我们还看了一些示例，突出了每个类型循环的理想用场景。无论我们选择利用哪种语句，现在我们都有足够的工具为我们的程序添加逻辑和推理了。\n\
    \n# 掌握函数\n函数可以被看作 JavaScript 程序的内核构建块之一。函数本质是一组旨在执行特定任务的语句——每当它被调用（或“执行”）时，它就会被执行。\n\
    \n在本章中，我们将查看定义函数、函数表达式、调用函数、作用域、嵌套、闭包、`arguments` 对象、函数参数和箭头函数！\n\n## 定义函数\n函数定义（也称为函数声明或函数语句）始终以\
    \ `function` 关键字开始。紧随其后的是函数名、圆括号内的任何参数，然后是我们的 JavaScript 语句（括在 `{}` 中，当我们的函数被调用时执行）。\n\
    \n让我们来看一个例子：\n\n```javascript\n1 function() { \n2  return a * 3 \n} \n```\n我们的函数\
    \ `multiply` 接收两个参数，大括号之间包含一条语句，返回第一个参数 `a` 乘以第二个参数 `b` 的结果。\n\n### 函数表达式\n另一种定义函数的方法是函数函数表达式。这些类型的函数实际上可以是匿名的。它们不需要命名。\n\
    \n例如，我们之前的 `multiply` 函数也可以这样定义：\n\n```javascript\n1 let multiply = function()\
    \ { return a * b };\n2 let x = // x 返回 4\n```\n函数表达式的一个典型用例可能是当将函数作为参数传递给另一个函数时。\n\
    \n我们也可以根据条件来定义函数。例如，以下函数仅在 `num` 等于 1 时才定义 `addItem`：\n\n```javascript\n1 let\
    \ num = 1\n2 if (num === 1) { \n3  addItem = function() { \n4   return 5 \n5 \
    \ } \n6 } \n```\n\n### 调用函数\n当我们定义一个函数时，我们做的只是给它起了一个名字，并指定了函数执行时要做什么。所以为了实际运行该函数，我们需要在程序中调用它！\n\
    \n要调用我们之前的函数，我们可以按照如下方式调用它：\n\n```javascript\n1 multiply(2,2);\n```\n在这里我们正在调用函数，该函数被设置为接收两个参数，参数为\
    \ `2` 和 `2`。函数执行并运行其语句，返回 `2` 乘以 `2` 的结果。\n\n函数在被调用时必须在作用域内，但函数声明可以被提升（出现在代码中调用的下方），如下：\n\
    \n```javascript\n1 // 在此处调用\n2 /* ... */ \n3 function multiply(a, b) { return\
    \ a * b } \n```\n函数的作用域是声明它的函数，或者如果它是在全局级别定义的，则作用域是整个程序。\n**注意**：这只对函数声明有效。函数表达式无效！\n\
    \n### 函数作用域\n当变量定义在函数内部时，无法在该函数外部的任何地方访问，因为那超出了作用域。然而，函数能够访问其所在作用域内定义的所有变量和函数。因此，在全局作用域定义的函数可以访问全局作用域定义的所有变量。在另一个函数内部定义的函数也可以访问其父函数定义的所有变量，以及父函数可以访问的任何其他变量。\n\
    \n让我们来看一个例子……\n\n```javascript\n1 // 这些变量定义在全局\n2 let a = 10\n3 b = 20\n4 name\
    \ = \"Bruce\"\n5 // 这个函数定义在全局\n6 function multiply(a, b) { \n7  return a * b \n\
    8 } \n9 // 返回 200\n10 // 使用嵌套函数\n11 function getGreeting(name) { \n12  let a =\
    \ 5\n13  let b = 10\n14  \n15  function inner() { \n16   return name + \" received\
    \ \" + (a * b) \n17  } \n18  \n19  return inner()\n20 } \n```\n\n### 函数作用域\n当变量定义在函数内部时，它们无法在该函数外部的任何地方访问，因为那超出了作用域。然而，函数能够访问其定义所在作用域内的所有变量。因此，在全局作用域定义的函数可以访问全局作用域定义的所有变量。在另一个函数内部定义的函数也可以访问其父函数定义的所有变量，以及父函数可以访问的任何其他变量。\n\
    \n让我们来看一个例子……\n\n```javascript\n1 // 这些变量定义在全局\n2 let a = 10\n3 b = 20\n4 name\
    \ = \"Bruce\"\n5 // 这个函数定义在全局\n6 function multiply(a, b) { \n7  return a * b \n\
    8 } \n9 // 返回 200\n10 // 使用嵌套函数\n11 function getGreeting(name) { \n12  let a =\
    \ 5\n13  let b = 10\n14  \n15  function inner() { \n16   return name + \" received\
    \ \" + (a * b) \n17  } \n18  \n19  return inner()\n20 } \n```\n\n### 嵌套函数与闭包\n\
    你可以在函数内部嵌套另一个函数！嵌套函数（inner）是其包含函数（outer）的私有的。闭包是一个表达式（通常是函数），它与与其环境绑定的变量在一起。\n\
    \n由于嵌套函数是闭包，它能够“继承”包含函数的参数和变量。闭包定义如下：\n\n```javascript\n1 function outer(x) {\n\
    2  function inner(y) {\n3    return x + y\n4  }\n5  return inner;\n6 }\nlet a\
    \ = outer(5); // a 是一个函数\nlet b = a(10); // b 返回 15\n```\n\n### 闭包\n现在我们知道，我们可以嵌套函数，JavaScript\
    \ 将允许内部函数访问外部函数定义的所有变量（以及它所能访问的所有函数）。然而，外部函数无法访问内部函数定义的变量和函数。如下：\n\n```javascript\n\
    1 // 外部函数定义了 \"name\"\n2 function makeGreeting(name) { \n3  let count = 0\n4 \
    \ return function() { \n5    count++;\n6    return name + \" \" + count;\n7  };\n\
    8 }\n9 let greet = makeGreeting(\"Steve\");\n10 greet(); // 返回 \"Steve 1\"\n11\
    \ greet(); // 返回 \"Steve 2\"\n```\n\n### `arguments` 对象\n任何函数的参数都在一个数组对象中。在函数内部，你可以通过\
    \ `arguments[i]` 访问参数，其中 `i` 是从零开始的索引。你可以使用 `arguments.length` 来确定实际传递给函数的数量。\n\
    \n例如，考虑一个拼接多个字符串的函数。函数定义如下：\n\n```javascript\n1 function concat(separator) { \n\
    2  let result = \"\";\n3  for (let i = 0; i < arguments.length; i++) {\n4    result\
    \ += arguments[i] + separator;\n5  }\n6  return result; \n7 }\n```\n你可以向此函数传递任意数量的参数，它会将每个参数拼接成字符串：\n\
    \n```javascript\n1 concat(\", \", \"fred\", \"wilma\", \"betty\"); // 返回 \"fred,\
    \ wilma, bety,\"\n2 concat(\"; \", \"marge\", \"bart\", \"maggie\"); // 返回 \"\
    marge; bart; maggie;\"\n3 concat(\". \", \"jerry\", \"kramer\", \"elaine\"); //\
    \ 返回 \"jerry. kramer. elaine. george.\"\n```\n\n### 函数参数\n函数参数有两种：默认参数和剩余参数。让我们来看看……\n\
    \n#### 默认参数\n在 JavaScript 中，函数的参数默认值为 `undefined`。但在某些情况下，设置一个不同的默认值是有用的。这就是默认参数的用处。实现起来非常简单：\n\
    \n```javascript\n1 function b(a, b = 2) { \n2  return a * b\n3 } // 返回 10\n```\n\
    你只需要在函数头为 `b` 设置默认值 `2`。\n\n#### 剩余参数\n剩余参数语法允许我们将不定数量的参数表示为一个数组。在这个示例中，我们使用剩余参数收集从第二个到最后一个的所有参数，然后将它们乘以第一个参数。这个示例使用了箭头函数，我们将将介绍！\n\
    \n```javascript\n1 multiply = (multiplier, ...args) => {\n2  return args.reduce((acc,\
    \ val) => acc + val * multiplier, 0);\n } \nlet arr = [2, 4, 6];\nresult = multiply(2,\
    \ ...arr); // 返回 24\n```\n\n#### 箭头函数\n与函数表达式相比，箭头函数的语法短得多。例如，这是一个普通函数：\n\n```javascript\n\
    1 function(params) { \n2  return params + 10 \n } // 返回 12\n```\n这里是同一个函数的箭头形式表示：\n\
    \n```javascript\n1 let funcName = (params) => params + 10\n2 funcName(2); // 返回\
    \ 12\n```\n只需一行代码就实现了相同的函数！非常酷！\n\n如果我们没有参数，我们这样表示箭头函数：\n\n```javascript\n1 ()\
    \ => { statements }\n```\n当我们只有一个参数时，圆括号是可选的：\n\n```javascript\n1 parameters =>\
    \ { statements }\n```\n最后，如果你返回一个表达式，可以去掉括号：\n\n```javascript\n1 parameters =>\
    \ expression\n2 // 等同于\n3 function(parameters) {\n4  return expression;\n5 }\n\
    ```\n**注意**：与普通函数不同，箭头函数不绑定 `this`。相反，`this` 被绑定以保持其原始上下文的含义。稍我们将详细查看 `this` 关键字！\n\
    \n#### 预定义函数\n值得注意的是 JavaScript 有许多内置函数！它们可能会为你节省大量时间，特别是对于常见任务。请参：https://www.tutorialpoint.com/javascript/builtin_functions\n\
    \n# 类\n## 什么是类？\nJavaScript 类是 ECMAScript2015 引入的，它们通常被描述为 JavaScript 现有原型继承结构的语法糖。因此，虽然类没有引入新的继承模型，但它们提供了语法上的简单性。这可以帮助我们产生更少错误且更易读的代码。\n\
    \n类就像函数一样！\n类与函数非常相似。就像具有表达式和声明的函数一样，类也有两个组件：表达式和方法。\n\n### 类声明\n让我们看看如何使用 `class`\
    \ 关键字后跟类名来定义类：\n\n```javascript\n1 class Image {\n  constructor(name) {\n    this.name\
    \ = name;\n  }\n}\n```\n\n### 提升\n类与函数声明的一个重要区别是，类声明是可以提升的，而类表达式不是。如下：\n\n```javascript\n\
    1 class Image {\n  constructor(name) {\n    this.name = name;\n  }\n}\n```\n\n\
    ### 类表达式\n我们可以使用类表达式来创建类：\n\n```javascript\n1 Image = class {\n  constructor(name)\
    \ {\n    this.name = name;\n  }\n};\n```\n**注意**：变量是“类数组”，但不是数组。它有索引和 `length`\
    \ 属性。\n\n### 构造函数\n`constructor` 方法在类中被用于初始化对象：\n\n```javascript\n1 class Image\
    \ {\n  constructor(name) {\n    this.name = name;\n  }\n}\n```\n\n### 静态属性\n静态属性定义在类中：\n\
    \n```javascript\n1 class Image {\n  static staticWidth = 50;\n}\n```\n\n### 静态方法\n\
    静态方法定义在类中：\n\n```javascript\n1 class Image {\n  static staticMethod() {\n    //\
    \ 方法体\n  }\n}\n```\n\n### 继承\n我们可以使用 `extends` 关键字创建类作为另一个类的子类：\n\n```javascript\n\
    1 class Image {\n  constructor(name) {\n    this.name = name;\n  }\n}\nclass Car\
    \ extends Image {\n  constructor(name) {\n    // 调用父类构造函数并传入 name 参数\n    super(name);\n\
    \  }\n}\nlet c = new Car(\"Volkswagen\"); // 返回 Volkswagen\n```\n\n"
- fmt: "\nelement to create 2D and 3D scenes.\n\n### Audio/Video APIs\nSuch as `HTMLMediaElement`\
    \ and the `Web Audio API`. You can use these to create custom controls for playing\
    \ audio and video, display text tracks like captions and subtitles along with\
    \ your videos. For audio you can add effects to audio tracks (such as `gain`,\
    \ distortion etc).\n\n### Device APIs\nAre for manipulating and retrieving data\
    \ from device hardware to use with web apps. Such as notifying the user that an\
    \ update is available.\n\n### Third party APIs\nThird party APIs are not built\
    \ into the browser, and you’ll need to retrieve their code and information from\
    \ somewhere else. By connecting with the third party API you can access and then\
    \ work with the methods provided by the API. Some common third party APIs are:\n\
    \n- `Openweathermap.org`: allows you to query weather data. For example, you could\
    \ capture a users location and display their current temperature.\n- `Twitter\
    \ API`: you could display your latest tweets on your website.\n- `Google Maps\
    \ API`: allows you to completely customize maps to include on your web pages.\n\
    - `YouTube API`: allows you to embed YouTube videos on your site, search YouTube\
    \ and automatically generate playlists.\n- `Twilio API`: this API provides a framework\
    \ for building voice and video call functionality into your app, sending SMS/MMS\
    \ from your apps, and more.\n\n## So how do APIs work?\nDespite different APIs\
    \ working in different ways, they all share some common base factors which we’ll\
    \ take a look at now:\n\n### APIs are based on objects\nThe code you write to\
    \ interact with APIs will use one or more JavaScript objects. These objects serve\
    \ as containers for the data the API uses (contained in object properties), and\
    \ the functionality the API makes available (contained in object methods). Let’s\
    \ take a look at an example using the Web Audio API — the API consists of a number\
    \ of objects. For example, we have:\n\n- `AudioContext`: this represents an audio\
    \ graph that can be used to manipulate audio playing inside the browser, and has\
    \ a number of methods and properties available to manipulate that audio.\n- `MediaElementAudioSourceNode`:\
    \ this represents an element containing sound you want to play and manipulate\
    \ inside the audio context.\n- `AudioDestinationNode`: this represents the destination\
    \ of the audio, i.e. the device on your computer that will actually output it\
    \ — usually either your speakers or headphones.\n\n#### How do these objects interact?\n\
    Let’s look at the following HTML:\n\n```html\n<audio src=\"music.mp3\"></audio>\n\
    ```\nWe have here an element which we use to embed our MP3 into the page. We don’t\
    \ include any default browser controls. Then we’ve added a `<button>`.\n\nLet’s\
    \ see the JavaScript for this example..\nWe’ll start by creating an `AudioContext`\
    \ instance inside which to manipulate our track:\n```javascript\nconst AudioContext\
    \ = window || {};\nconst audioCtx = new AudioContext();\n```\nThen we’ll create\
    \ constants that store references to our `audioElement` and `playBtn` and `volumeSlider`\
    \ and use the `AudioContext.createMediaElementSource()` method to create a `MediaElementAudioSourceNode`\
    \ representing the source of our audio — the it will be played from:\n\n```javascript\n\
    const audioElement = document.querySelector('audio');\nconst playBtn = document.querySelector('button');\n\
    const volumeSlider = document.querySelector('input');\nconst audioSource = audioCtx.createMediaElementSource(audioElement);\n\
    ```\n\nNext we’ll include a couple of event handlers that toggle between play\
    \ and pause whenever the button is pressed, and reset the display back to the\
    \ beginning when the song has finished playing:\n\n```javascript\n// Play + Pause\
    \ audio\nplayBtn.addEventListener('click', () => {\n  // check if context is in\
    \ suspended state\n  if (audioCtx.state === 'suspended') {\n    audioCtx.resume();\n\
    \  }\n  // If track is play it\n  if (audioElement.paused) {\n    audioElement.play();\n\
    \    playBtn.textContent = 'Pause';\n  } else {\n    // If track is stop it\n\
    \    audioElement.pause();\n    playBtn.textContent = 'Play';\n  }\n});\n// If\
    \ the track ends\naudioElement.addEventListener('ended', () => {\n  audioElement.currentTime\
    \ = 0;\n  playBtn.textContent = 'Play';\n});\n```\nThe `play()` and `pause()`\
    \ methods being used are actually part of the `HTMLMediaElement` API, and not\
    \ the `Web Audio API` (though they’re closely-related!).\n\nNow we create a `GainNode`\
    \ object using the `AudioContext.createGain()` method, which can be used to adjust\
    \ the volume of audio fed through it, and create another event handler that changes\
    \ the value of the audio graph’s gain (volume) whenever the slider value is changed:\n\
    \n```javascript\nconst gainNode = audioCtx.createGain();\nvolumeSlider.addEventListener('input',\
    \ () => {\n  gainNode.gain.value = volumeSlider.value;\n});\n```\nThen finally\
    \ we connect the different nodes in the audio graph up, which is done using the\
    \ `AudioNode.connect()` method available on every node type:\n\n```javascript\n\
    audioSource.connect(gainNode);\ngainNode.connect(audioCtx.destination);\n```\n\
    The audio starts in the source, which is then connected to the gain node so the\
    \ audio’s volume can be adjusted. The gain node is then connected to the destination\
    \ node so the sound can be played on your computer (the `AudioContext.destination`\
    \ property represents whatever is the default `AudioDestinationNode` available\
    \ on your computer’s hardware, e.g. your speakers).\n\n### API’s have recognizable\
    \ entry points\nWhenever you use an API, make sure you know where the entry point\
    \ is! In the `Web Audio API` — it’s the `AudioContext` object. This needs to be\
    \ used to do any manipulation whatsoever.\n\nWhen using the Document Object Model\
    \ (DOM) API — its features tend to be found hanging off the `Document` object,\
    \ or an instance of an `HTML` element that you want to affect in some way, for\
    \ example:\n\n```javascript\n// Create a new em element\nlet em = document.createElement('em');\n\
    \n// Reference an existing p element\nlet p = document.querySelector('p');\n\n\
    // Give em some text content\nem.textContent = 'Hello, world!';\n\n// Embed em\
    \ inside\np.appendChild(em);\n```\nThe `Canvas API` also relies on getting a context\
    \ object to use to manipulate things. Its context object is created by getting\
    \ a reference to the\n"
