    ### Classes\n- What are classes?\n- Classes are just like functions!\n- Class\
    \ declarations\n- Hoisting\n- Class expressions\n- Constructors\n- Instance properties\n\
    - Field declarations\n- Child classes using `extends`\n- Species\n- The `super`\
    \ keyword\n- Mix-ins\n\n### Understanding APIs\n- APIs in JavaScript\n- So how\
    \ do APIs work?\n- Summary\n\n### Fetching data from a server\n- The old way…\n\
    - The solution: AJAX\n- Creating an Ajax request\n- `XMLHttpRequest`\n- `Fetch`\n\
    - Working with promises\n- Summary\n\n### An Introduction to REST APIs\n- What\
    \ is a REST API?\n- RESTful Architecture\n- REST in action\n- Working with REST\
    \ data\n\n### Promises\n- Why use promises?\n- Summary: `Async` & `defer`\n\n\
    ---\n\nOur `changeText()` function modifies the `textContent` of element. So now\
    \ when you click on the button, the event fires which runs our which alters the\
    \ text in our `p` tag.\n\nWhile inline event handlers clearly work — they really\
    \ shouldn’t be used in production. For the same reason that inline CSS shouldn’t\
    \ be used, it’s messy! And our code will be much more maintainable, if we handle\
    \ our JavaScript entirely in separate script files, rather then having handlers\
    \ throughout our HTML.\n\n### Event Handler Properties\nEvent handler properties\
    \ work very similarly to inline handlers, except we set the property of an element\
    \ in JavaScript, instead of on the attribute in our HTML.\n\nOur HTML is the same,\
    \ except we’re now excluding the `onclick=\"changeText()\"` we used previously:\n\
    \n```html\n<html>\n  <!-- ... content ... -->\n</html>\n```\n\nAnd our function\
    \ will remain similar as well, except now we need to access the button element\
    \ in our JavaScript. We simply access `onclick` just as we would access `style`\
    \ or `id` or any other element property, then assign the function reference.\n\
    \n```javascript\n// Function to modify the text content of the paragraph\nconst\
    \ changeText = () => {\n  const p = document.querySelector('p');\n  p.textContent\
    \ = \"I was changed with an event handler\";\n}\n\n// Add event handler as a property\
    \ of the button element\nconst button = document.querySelector('button');\nbutton.onclick\
    \ = changeText;\n```\n\nNote: Event handlers do not follow the `camelCase` convention.\
    \ Notice the code is not.\n\nNow when you click the button, it’ll fire the event\
    \ from our JavaScript property. You’ll see that when passing a function reference\
    \ to the `onclick` property, we don’t include parentheses, as we are not invoking\
    \ the function at that moment, but only passing a reference to it.\n\nThe event\
    \ handler property is more maintainable than the inline handler, but it still\
    \ isn’t the greatest way to manage events. If for example, you tried to set multiple\
    \ `onclick` properties, all but the last one would be overwritten, as demonstrated\
    \ below:\n\n```javascript\nconst p = document.querySelector('p');\nconst button\
    \ = document.querySelector('button');\n\nconst changeText = () => {\n  p.textContent\
    \ = \"Will I\";\n}\n\nconst alertText = () => {\n  alert(\"I\");\n}\n\n// Events\
    \ can be overwritten!\nbutton.onclick = changeText;\nbutton.onclick = alertText;\n\
    ```\n\nIn the above example, the button click would only display an alert, and\
    \ not change the `p` text, since `alertText` was the last one added.\n\n### Event\
    \ Listeners\nNow that we have an understanding of both inline handlers and event\
    \ handler properties, let’s move onto event listeners.\n\nEvent listeners watch\
    \ for an event on an element instead of assigning the event directly to a property.\
    \ We’ll use the `addEventListener()` method to listen for the event. `addEventListener()`\
    \ takes two mandatory parameters — the event to listen for and the listener callback.\n\
    \n```javascript\n// Function to modify the text content of the paragraph\nconst\
    \ p = document.querySelector('p');\nconst changeText = () => {\n  p.textContent\
    \ = \"I changed because of an event\";\n}\n\n// Listen for click\nconst button\
    \ = document.querySelector('button');\nbutton.addEventListener('click', changeText);\n\
    ```\n\nNote: In the first methods, a click event was referred to as `onclick`\
    \ but with event listeners, it is referred to as `click`. Event listeners appear\
    \ very similar to event handler properties, however, they have a crucial advantage.\
    \ We can set multiple listeners on the same element for example:\n\n```javascript\n\
    const p = document.querySelector('p');\nconst button = document.querySelector('button');\n\
    \nconst changeText = () => {\n  p.textContent = \"Will I\";\n}\n\nconst alertText\
    \ = () => {\n  p.textContent = \"I\";\n}\n\n// Multiple listeners can be added\
    \ to the same event\nbutton.addEventListener('click', changeText);\nbutton.addEventListener('click',\
    \ alertText);\n```\n\nIt’s more concise to use anonymous functions instead of\
    \ function references on event listeners.\n\n```javascript\n// An anonymous function\
    \ on event listener\nbutton.addEventListener('click', (event) => {\n  p.textContent\
    \ = \"Will I\";\n});\n```\n\nWe could also use `removeEventListener()` function\
    \ to remove one or all events from an element.\n\n```javascript\n// Remove alert\
    \ function from button\nbutton.removeEventListener('click', alertText);\n```\n\
    \nIt’s also useful to know that you can use `addEventListener()` on `document`\
    \ and `window` object. Event listeners are currently the most common and preferred\
    \ way to handle events in JavaScript. Next up we’ll take a brief look at some\
    \ of the more common events we’re likely to work with.\n\n### Mouse Events\n-\
    \ `click`: Fires when the mouse is pressed and released on an element.\n- `dblclick`:\
    \ Fires when an element is clicked twice.\n- `mouseenter`: Fires when a pointer\
    \ enters an element.\n- `mouseleave`: Fires when a pointer leaves an element.\n\
    - `mousemove`: Fires every time a pointer moves inside an element.\n\nA `click`\
    \ is actually a compound event that is comprised of `mousedown` and `mouseup`\
    \ events, these fire when the mouse button is pressed down or lifted, respectively.\
    \ Using `mouseenter` and `mouseleave` together recreates a hover effect that lasts\
    \ as long as a pointer is on the element.\n\n### Form Events\n- `submit`: Fires\
    \ when a form is submitted.\n- `focus`: Fires when an element (such as an input)\
    \ receives focus.\n- `blur`: Fires when an element loses focus.\n\n### Keyboard\
    \ Events\n- `keydown`: Fires once when a key is pressed.\n- `keyup`: Fires once\
    \ when a key is released.\n- `keypress`: Fires continuously while a key is pressed.\n\
    \nAlthough they look similar, `keydown` and `keypress` events do not access all\
    \ the exact same keys. While `keydown` will acknowledge every key that is pressed,\
    \ `keypress` will omit keys that do not produce a character, such as `Shift` or\
    \ `Alt`.\n\nIf a parameter, known as an event object, is passed through to the\
    \ event listener, we can access more information about the action that took place.\
    \ Three properties that pertain to keyboard objects include `keyCode`, `key`,\
    \ and `code`.\n\nFor example, if the user presses the letter `a` key on their\
    \ keyboard, the following properties pertaining to that key will surface:\n- `keyCode`:\
    \ A number pertaining to the key e.g. “65”\n- `key`: Represents the character\
    \ name e.g. “a”\n- `code`: Represents the physical key being pressed e.g. “KeyA”\n\
    \nLet’s take a closer look at this with the following code:\n\n```javascript\n\
    // Test the keyCode, key, and code properties\nwindow.addEventListener('keydown',\
    \ (event) => {\n  console.log(event.keyCode);\n  console.log(event.key);\n  console.log(event.code);\n\
    });\n```\n\n### Event Objects\nThe `Event` object consists of properties and methods\
    \ that all events can access. In addition to the generic `Event` object, each\
    \ type of event has its own extensions, such as `KeyboardEvent` and `MouseEvent`.\
    \ The `Event` object is passed through a listener as a parameter. It is typically\
    \ written as `event` or `e`.\n\n```javascript\n// Pass an event through a listener\n\
    button.addEventListener('click', (event) => {\n  console.log(event.type);\n});\n\
    ```\n\n### event.target\nIn this final section, we’ll look at one of the most\
    \ used event properties: the `target` property. `event.target` returns the element\
    \ that triggered the event.\n\n```html\n<div>\n  <button>Click me</button>\n</div>\n\
    ```\n\nUsing `event.target` within our browser’s Developer Console, we can place\
    \ one event listener on the outer element and get the most deeply nested element.\n\
    \n```javascript\nconst section = document.querySelector('div');\nsection.addEventListener('click',\
    \ (event) => {\n  console.log(event.target);\n});\n```\n\n## Mastering Arrays\n\
    An array in JavaScript can be looked at as a kind of special variable, which is\
    \ able to hold more than one value at a time. Arrays can contain any data type,\
    \ including numbers, strings, Booleans and objects. More specifically, an array\
    \ is a type of a high-level, list-like object, which consists of an ordered collection\
    \ (or list) containing zero or more data types. We use numbered indices starting\
    \ from 0 to access specific items.\n\n### Creating an Array\n```javascript\nvar\
    \ shapes = [\"Square\", \"Circle\", \"Triangle\"];\n```\n\n### How can we access\
    \ each array item?\n```javascript\nvar first = shapes[0];\nvar second = shapes[1];\n\
    var last = shapes[2];\n```\n\n### Looping over an Array\n```javascript\nshapes.forEach((item,\
    \ index) => {\n  console.log(item); // Square 0\n  console.log(item); // Circle\
    \ 1\n  console.log(item); // Triangle 2\n});\n```\n\n### Adding to the end of\
    \ an Array\n```javascript\nvar addItem = shapes.push(\"Rectangle\"); // [\"Square\"\
    , \"Circle\", \"Triangle\", \"Rectangle\"]\n```\n\n### Removing from the end of\
    \ an Array\n```javascript\nvar removeItemEnd = shapes.pop();\n// [\"Square\",\
    \ \"Circle\", \"Triangle\"]\n```\n\n### Removing from the front of an Array\n\
    ```javascript\nvar removeItemFront = shapes.shift();\n// [\"Circle\", \"Triangle\"\
    ]\n```\n\n### Adding to the front of an Array\n```javascript\nvar addItemFront\
    \ = shapes.unshift(\"Hexagon\");\n// [\"Hexagon\", \"Circle\", \"Triangle\"]\n\
    ```\n\n### Getting the index of an Array item\n```javascript\nvar pos = shapes.indexOf(\"\
    Circle\");\n```\n\n### Removing an item by index position\n```javascript\nvar\
    \ removedItem = shapes.splice(1, 1);\n```\n\n### Remove multiple items from an\
    \ index position\n```javascript\nvar colors = [\"Red\", \"Green\", \"Blue\", \"\
    Yellow\"];\nvar removedItems = colors.splice(1, 2);\n// [\"Green\", \"Blue\"]\n\
    ```\n\n### Copying an Array\n```javascript\nvar arrayCopy = [...shapes];\n```\n\
    \n### Checking if an object is an Array\n```javascript\nArray.isArray(shapes);\
    \ // true\n```\n\n### Reversing the order of an Array\n```javascript\nshapes.reverse();\n\
    ```\n\n### Replacing Array elements with static values\n```javascript\nshapes[0]\
    \ = \"Pentagon\";\n```\n\n### Sorting an Array\n```javascript\nshapes.sort();\n\
    ```\n\n### Merging Arrays\n```javascript\nvar merged = shapes.concat([\"Date\"\
    , \"Fig\"]);\n```\n\n### Converting Array Elements into a String\n```javascript\n\
    var joinedStrings = shapes.join(\", \");\n```\n\n### `map()`, `filter()`, and\
    \ `reduce()`\n```javascript\nvar numbers = [1, 2, 3, 4, 5];\nvar add10 = numbers.map((val)\
    \ => val + 10); // [11, 12, 13, 14, 15]\n\nvar values = [10, 20, 34];\nvar filtered\
    \ = values.filter((value) => value > 15); // [20, 34]\n\nvar average = numbers.reduce((total,\
    \ number, index) => {\n  return total + number;\n}, 0) / numbers.length; // 3\n\
    ```\n\n### Find the first element that satisfies a function\n```javascript\nvar\
    \ found = numbers.find((element) => element > 3); // 4\n```\n\n### Find the index\
    \ of the first element\n```javascript\nvar foundIndex = numbers.findIndex((element)\
    \ => element > 3); // 3\n```\n\n## Mastering Objects\nObjects in JavaScript are\
    \ used to store collections of data in the format of `key: value` pairs. Contained\
    \ within an object can have any number of variables and/ functions which are then\
    \ referred to as properties and methods.\n\n### Creating an Object\n```javascript\n\
    var car = {\n  name: \"Tesla\",\n  model: \"Model 3\",\n  weight: 1700,\n  extras:\
    \ [\"heated seats\", \"tinted glass\"],\n  display() {\n    console.log(\"This\
    \ car is a \" + this.model);\n  }\n};\n```\n\n```javascript\n// Function to modify\
    \ the text content of the paragraph\nconst changeText = () => {\n  const p = document.querySelector('p');\n\
    \  p.textContent = \"I was changed with an event handler\";\n}\n\n// Add event\
    \ handler as a property of the button element\nconst button = document.querySelector('button');\n\
    button.onclick = changeText;\n```\n\nNote: Event handlers do not follow the `camelCase`\
    \ convention. Notice the code is not.\n\nNow when you click the button, it’ll\
    \ fire the event from our JavaScript property. You’ll see that when passing a\
    \ function reference to the `onclick` property, we don’t include parentheses,\
    \ as we are not invoking the function at that moment, but only passing a reference\
    \ to it.\n\nThe event handler property is more maintainable than the inline handler,\
    \ but it still isn’t the greatest way to manage events. If for example, you tried\
    \ to set multiple `onclick` properties, all but the last one would be overwritten,\
    \ as demonstrated below:\n\n```javascript\nconst p = document.querySelector('p');\n\
    const button = document.querySelector('button');\n\nconst changeText = () => {\n\
    \  p.textContent = \"Will I\";\n}\n\nconst alertText = () => {\n  alert(\"I\"\
    );\n}\n\n// Events can be overwritten!\nbutton.onclick = changeText;\nbutton.onclick\
    \ = alertText;\n```\n\nIn the above example, the button click would only display\
    \ an alert, and not change the `p` text, since `alertText` was the last one added.\n\
    \n### Dot notation\nAbove, you’ve seen the object’s properties and methods accessed\
    \ using dot. The object name `car` acts as the namespace — it needs to be entered\
    \ first to access anything within the object. Then you write a dot, followed by\
    \ the item you want to access — this can be the name of a simple property, an\
    \ item of an array property, or a call to one of the object’s methods, for example:\n\
    \n```javascript\ncar.name;\ncar.extras[1];\ncar.display();\n```\n\n### Deleting\
    \ Properties\nWe can use the `delete` operator to remove properties, like so:\n\
    \n```javascript\ndelete car.model;\ncar.model; // undefined\n```\n\n### Square\
    \ Brackets\nIf for example, we had a multi-word property within our object, such\
    \ as:\n\n```javascript\nvar user = {\n  \"likes potatoes\": true\n};\n```\n\n\
    We couldn’t access the multi-word property with dot-notation:\n\n```javascript\n\
    user.likes-potatoes; // syntax error!\n```\n\nThis is because a dot requires the\
    \ key to be a valid variable identifier. That is no spaces and other limitations.\
    \ The alternative is to use square brackets, which works with any string:\n\n\
    ```javascript\nlet user = {};\n// set\nuser[\"likes potatoes\"] = true;\n// get\n\
    alert(user[\"likes potatoes\"]); // true\n// delete\ndelete user[\"likes potatoes\"\
    ];\n```\n\n### Updating object members\nWe can update the values within our objects\
    \ by simply declaring the property you’d like to set with the new value, like\
    \ so:\n\n```javascript\nuser.age;     // 32\nuser.age = 33;  // 33\nuser.age;\
    \     // 33\n```\n\nYou can also create completely new members of your object.\
    \ For example:\n\n```javascript\nuser.surname = 'Smithessson';\n// {name: \"Sam\"\
    , age: 33, likes potatoes: true, surname: \"Smithessson\"}\n```\n\n### What is\
    \ “this”?\nYou may have noticed the use of the word `this` in our earlier example.\
    \ See the following:\n\n```javascript\n{\n  car is a ' + this.model;\n}\n```\n\
    \nThe `this` keyword refers to the current object that the code is being written\
    \ inside of— so in this case `this` is equivalent to Why not just write `car`\
    \ instead? It’s best practice to write well-constructed object-orientated code,\
    \ and so the use of `this` is extremely useful. It will ensure the correct values\
    \ are used when member’s context changes (e.g. two different car instances may\
    \ have different names, but will want to use their own information). For example:\n\
    \n```javascript\nvar car1 = { model: \"Tesla\" };\nvar car2 = { model: \"Toyota\"\
    \ };\ncar1.display(); // \"This car is a Tesla\"\ncar2.display(); // \"This car\
    \ is a Toyota\"\n```\n\n## Using Conditionals\nWhen we want to introduce logic\
    \ & make decisions in our programs, we use conditionals, we can control the behavior\
    \ of our code — by determining whether or not pieces of code run. For example,\
    \ when using a weather app, if the weather is sunny we could see a sun image,\
    \ or if it’s raining we could see a rain-cloud image.\n\n### `if/else` Statements\n\
    The most common type of conditional statements are `if` and `else` statements.\
    \ The syntax looks like:\n\n```javascript\nif (condition) {\n  // run this code\
    \ if condition is true\n} else {\n  // run this code instead\n}\n```\n\nIn our\
    \ above code, our `notify` variable will be set to “It is AM” if the hour is less\
    \ than 12. Otherwise hour greater than 12 and will be set to “It is PM”.\n\n###\
    \ `else if`\nOf course, we will often have more than two choices to work with!\
    \ To consider these choices we use `else if`. We put additional blocks between\
    \ `if` and `else` statements.\n\n```javascript\nif (hour < 12) {\n  notify = \"\
    AM\";\n} else if (hour < 18) {\n  notify = \"Day\";\n} else {\n  notify = \"Night\"\
    ;\n}\n```\n\n### Comparison operators\nTo test the conditions inside our conditional\
    \ statements, we use comparison operators are as follows:\n- `===` and `!==`:\
    \ to test if one value is equal to, or not equal to, the other.\n- `<` and `>`:\
    \ to test if one value is less than or greater than the other.\n- `<=` and `>=`:\
    \ to test if one value is less than equal to, or greater than equal to, the other.\n\
    \nA very common pattern when doing comparisons in conditional statements is to\
    \ test Booleans and Any value that is not `false` or an empty string will in fact\
    \ return true when tested as a conditional statement. This means you can easily\
    \ use a variable name on its own to test whether it is or even that it exists\
    \ at all (i.e. it is not `undefined`). For example:\n\n```javascript\nlet snack\
    \ = \"Cheetos\";\nif (snack) {\n  // have\n} else {\n  // not this\n}\n```\n\n\
    ### Nesting `if/else`\nThere will be times when you’ll want to nest an `if/else`\
    \ statement inside of another one — and it’s fine to do so! Let’s see an example:\n\
    \n```javascript\nif (hasFood) {\n  if (hungerLevel > 5) {\n    // I have so I\
    \ will eat\n  } else if (hungerLevel <= 5) {\n    // even though I have not hungry\
    \ so I will not eat them\n  }\n}\n```\n\n### Logical operators: AND, OR, and NOT\n\
    We can also test multiple conditions without needing to write nested `if/else`\
    \ statements, we do this with logical operators:\n- `AND`: lets you chain together\
    \ two or more expressions. Every expression must evaluate to true for the whole\
    \ expression to return.\n- `OR`: also lets you chain together two or more expressions.\
    \ One or more of them have to evaluate to true for the whole expression return.\n\
    - `NOT`: can be used to negate an expression.\n\nLet’s rewrite our previous example\
    \ using `AND`:\n\n```javascript\nif (hasFood && hungerLevel > 5) {\n  // hungerLevel\
    \ and I have so I will eat\n} else if (hasFood && hungerLevel <= 5) {\n  // even\
    \ though I have not hungry so I will not eat them\n}\n```\n\nA common mistake\
    \ when using the logical `OR` operator in conditional statements is to try to\
    \ state the variable whose value are checking once, which is two different car\
    \ instances may have different names, but will want to use their own information.\
    \ For example:\n\n```javascript\nif (car1 === \"Tesla\" || car2 === \"Toyota\"\
    ) {\n  // run this code\n} else {\n  // be an\n}\n```\n\nThe `NOT` operator can\
    \ be used to negate an expression. Let’s combine it with `OR` in the above example:\n\
    \n```javascript\nif (!isSunny || carStatus === \"Clear\") {\n  // run this code\n\
    } else {\n  // be an\n}\n```\n\n## Mastering Loops\nIn JavaScript, we use loops\
    \ when we want an easy way to handle repetition. In this chapter, we’re going\
    \ to take a look at all the different ways we can create loops in our code — and\
    \ we’ll consider the pros and cons of each method.\n\n### Summary: Mastering Loops\n\
    - The `for` loop\n- `do…while` statement\n- `while` statement\n- Labelled statement\n\
    - `break` statement\n- `continue` statement\n- `for…in` statement\n- `for…of`\
    \ statement\n\n### the `for` loop\nAs we’ve seen in the above example, a `for`\
    \ loop will repeat until the condition evaluates to false. The structure is like\
    \ so:\n\n```javascript\nfor (let i = 0; i < 10; i++) {\n  // one\n}\n```\n\nThe\
    \ `for` loop initializes the loop counters, the update expression increment i\
    \ by 1 after each pass through the loop. The `i` is the number of steps taken.\
    \ `i < 10` is the condition. `i++` is the update expression. `let i = 0` is initializing\
    \ the loop starting from the beginning by zero.\n\n```javascript\nfor (let i =\
    \ 0; i < 10; i++) {\n  // one\n}\n```\n\n### `do…while` statement\nA `do...while`\
    \ statement will repeat at least once and then iterates until the condition evaluates\
    \ to. The statement is always once prior to the condition being checked.\n\n```javascript\n\
    let i = 0;\ndo {\n  i++;\n} while (i < 10);\n```\n\n### `while` statement\nA `while`\
    \ statement executes its statements as long as a specified condition evaluates\
    \ to. The condition test occurs before the statement in the loop is executed.\n\
    \n```javascript\nlet a = 0;\nlet b = 0;\nwhile (a < 3) {\n  a++;\n  b++;\n}\n\
    ```\n\nWith each iteration, the loop increments `a` and adds that value to `b`.\
    \ `a` and `b` take on the following values:\n- first pass: `a = 1` and `b = 1`\n\
    - second pass: `a = 2` and `b = 2`\n- third pass: `a = 3` and `b = 3`\n\nAfter\
    \ completion of the third pass, the condition `a < 3` is no longer so that’s where\
    \ our loop terminates! Note: When you first start with loops, you may accidentally\
    \ create an infinite loop. This is when a loop condition never evaluates to.\n\
    \n```javascript\nwhile (true) {\n  //\n}\n```\nCAUTION: If you run this code —\
    \ please be aware that it’s likely to crash your browser!! So sure you’ve backed\
    \ up your open tabs - if you want to see what happens.\n\n### labelled statement\n\
    You can attach a label to any statement to serve as an identifier so you can refer\
    \ it elsewhere in your program. As an example, you could use a label to identify\
    \ a loop, and then use `break` or `continue` statements to indicate whether a\
    \ program should interrupt the loop, or continue its execution.\n\n```javascript\n\
    totalLoop:\nwhile (a < 3) {\n  //\n}\n```\n\nThe value of `label` may be anything\
    \ you like (with the exception of a JavaScript reserved word). Then you provide\
    \ to execute. So for example, you could use the label `totalLoop` to identify\
    \ a `while` loop.\n\n### `break` statement\nWe use the `break` statement to terminate\
    \ a loop or in conjunction with a labelled statement. When you use `break` without\
    \ a label, it terminates the innermost enclosing `switch` immediately and transfers\
    \ control to the following statement. When you use `break` with a label, it terminates\
    \ the specified labelled statement.\n\n```javascript\nbreak;\n```\n\nFor example,\
    \ let’s loop through an array until we find the index of an element with the value\
    \ of: `foundMe`.\n\n```javascript\nfor (let i = 0; i < array.length; i++) {\n\
    \  if (array[i] === foundMe) {\n    break;\n  }\n}\n```\n\nAnd let’s use `break`\
    \ with a labelled statement:\n\n```javascript\nlet x = 0;\nlet z = 0;\nouterLoop:\n\
    while (x < 10) {\n  console.log('Outer ' + x);\n  x += 1;\n  z = 1;\n  while (true)\
    \ {\n    z++;\n    if (z === 10 && x === 10) {\n      break outerLoop;\n    }\n\
    \  }\n}\n```\n\n### `continue` statement\nWe use the `continue` statement to restart\
    \ a loop or labelled statement. When you use `continue` without a label, it terminates\
    \ the current iteration of the innermost enclosing `for` statement and continues\
    \ execution of the loop with the next iteration. This contrasts with the `break`\
    \ statement, as `continue` doesn’t terminate the execution of the loop entirely.\
    \ In a `while` loop, it jumps back to the condition. In a `for` loop, it jumps\
    \ to the update. When you use `continue` with a label, it applies to the looping\
    \ statement identified with that label.\n\n```javascript\ncontinue;\n```\n\nFor\
    \ example, the following code block shows a `while` loop with a `continue` statement\
    \ that will execute when the value of `i` is three.\n\n```javascript\nlet i =\
    \ 0;\nlet n = 0;\nwhile (i < 10) {\n  i++;\n  if (i === 3) {\n    continue;\n\
    \  }\n  n += i;\n}\n```\n\n### `for…in` statement\nA `for...in` statement iterates\
    \ a specified variable over all the enumerable properties of an object. For each\
    \ distinct property, JavaScript executes the specified statements. The syntax\
    \ is as follows:\n\n```javascript\nfor (let i in obj) {\n  // statements\n}\n\
    ```\n\nThe following function takes as its argument an object and the object’s\
    \ It then iterates over all the object’s properties and returns a string that\
    \ lists the property names and their.\n\n```javascript\nfunction getProperties(obj,\
    \ obj_name) {\n  let result = \"\";\n  for (let i in obj) {\n    result += obj_name\
    \ + '.' + i + ' = ' + obj[i] + '\\n';\n  }\n  return result;\n}\n```\n"
