    to the button, as follows:  1 // Function to modify the text content of the paragraph
    2 3 const changeText = () => { 4   const p = 5   = "I changed because of an event
    listen\ 6 7 } 8 9 // Listen for click event 10 11 const button = 12  Note: In
    the first two methods, a click event was referred to as but with event listeners,
    it is referred to as Every event listener drops the on from the word. And now
    when we click the button, our output will be: ![](image-zinrt4cs.png) Event listeners
    appear very similar to event handler properties, however, they have a crucial
    advantage. We can set multiple event listeners on the same element, for example:  1
    const p = 2 const button = 3 4 const changeText = () => { 5   = "Will I 6 } 7
