    property, then assign the function reference.  1 // Function to modify the text
    content of the paragraph 2 3 const changeText = () => { 4  const p = 5  = "I was
    changed with an event handler 6 7 } 8 9 // Add event handler as a property of
    the button element 10 11 const button = 12 =  Note: Event handlers do not follow
