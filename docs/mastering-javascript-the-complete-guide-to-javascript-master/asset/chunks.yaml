    - 物种 (Species)\n- `super` 关键字\n- 混合入 (Mix-ins)\n\n### 理解 API\n- JavaScript 中的\
    \ API\n- API 是如何工作的？\n- 总结\n\n### 从服务器获取数据\n- 旧方法……\n- 解决方案：AJAX\n- 创建 Ajax 请求\n\
    - `XMLHttpRequest`\n- `Fetch`\n- 使用 Promise (Promises)\n- 总结\n\n### REST API 简介\n\
    - 什么是 REST API？\n- RESTful 架构\n- REST 实战\n- 处理 REST 数据\n\n### Promise\n- 为什么要使用\
    \ Promise？\n- 总结：`Async` 与 `defer`\n\n---\n\n我们的 `changeText()` 函数修改了元素的 `textContent`。所以现在当你点击按钮时，会触发事件并运行我们的函数，从而更改我们\
    \ `p` 标签中的文本。\n\n虽然内联事件处理器确实有效——但它们真的不应该在生产环境中使用。与不使用内联 CSS 的原因相同，太乱了！如果我们将 JavaScript\
    \ 完全放在单独的脚本文件中，而不是在 HTML 中到处使用处理器，我们的代码将更具可维护性。\n\n### 事件处理器属性\n事件处理器属性的工作与内联处理器非常相似，不同在于我们在\
    \ JavaScript 中设置元素的属性，而不是在 HTML 属性中设置。\n\n我们的 HTML 是一样的，只是我们现在排除了之前使用的 `onclick=\"\
    changeText()\"`：\n\n```html\n<html\n  <!-- ... content ... -->\n</html>\n```\n\
    \n我们的函数也将保持相似，但现在我们需要在 JavaScript 中访问按钮元素。我们只需要访问 `onclick`，就像访问 `style` 或 `id`\
    \ 或任何其他元素属性一样，然后分配函数引用。\n\n```javascript\n// 修改段落文本内容的函数\nconst changeText = ()\
    \ => {\n  const p = document.querySelector('p');\n  p.textContent = \"我通过事件处理器更改了\"\
    ;\n}\n\n// 将事件处理器作为按钮元素的属性添加\nconst button = document.querySelector('button');\n\
    button.onclick = changeText;\n```\n\n*(注：由于原文后续部分似乎存在逻辑混乱或重复的示例描述，翻译已根据提供的文本结构进行对齐，并保持\
    \ Markdown 格式。)*\n\n"
- fmt: "\n```javascript\n5 6 } 7 result += 8 return 9 }\n```\nFor an object `food`\
    \ with properties `lunch` and `result` would be:\n1 `food.lunch = Sandwich`\n\
    2 `food.dinner = Lasagna` \n\n**Note**: Given that `for...in` is built for iterating\
    \ object it’s not recommended for use with arrays — where the index order is important.\
    \ For arrays, it’s better to use the more traditional `for` loop.\n\n### `for…of`\
    \ statement\nA `for ... of` statement creates a loop that iterates over iterable\
    \ objects, such as `arguments` and so on. The syntax is like so:\n\n```javascript\n\
    1 for of { \n2  statement \n3 } \n```\nThe below example shows the difference\
    \ between a `for...of` loop and a `for … in` loop. While `for...in` iterates over\
    \ property names, `for...of` iterates over property values:\n\n```javascript\n\
    1 let arr = 2 = 3 \nfor i in { \n4  // logs \"0\", \"1\", \"2\", \"greet\" \n\
    5 } \nfor i of { \n7  // logs 10, 20, 30 \n8 } \n```\n\n### Summary\nAnd that’s\
    \ it! We’ve learned about many of the different loop statements, such as: labeled\
    \ `break`, `continue`, `for..in` & `And`. And we’ve looked at a number of examples\
    \ highlighting ideal use cases for each type of loop. Whichever statements we\
    \ choose to utilize, we’re now well equipped to add logic and reasoning to our\
    \ programs.\n\n# Mastering Functions\nFunctions can be thought of as one of the\
    \ core building blocks of our JavaScript programs. A function is simply a set\
    \ of statements designed to perform a particular task — which is executed whenever\
    \ it is invoked (or “called”).\n\nIn this chapter we’re going to take a look at\
    \ defining functions, function expressions, calling functions, scope, nesting,\
    \ closures, the `arguments` object, function parameters & arrow functions!\n\n\
    ## Defining functions\nA function definition (otherwise known as a function declaration,\
    \ or function statement) will always begin with the `function` keyword. What follows\
    \ is the name of our function, any parameters enclosed in parenthesis, and then\
    \ our JavaScript statements (enclosed in `{}` which are executed when our function\
    \ is called).\n\nLet’s see an example:\n\n```javascript\n1 function() { \n2  return\
    \ a * 3 \n} \n```\nOur function `multiply` takes two parameters and included in-between\
    \ the curly braces is a statement that returns the result of the first parameter\
    \ `a` multiplied by the second parameter `b`.\n\n### Function expressions\nThere\
    \ is another way to define a function, known as the function expression. These\
    \ types of functions can actually be anonymous. They don’t need to be given a\
    \ name.\n\nFor example, our previous `multiply` function could’ve also been defined\
    \ like so:\n\n```javascript\n1 let multiply = function() { return a * b };\n2\
    \ let x = // x returns 4\n```\nA typical use case for function expressions might\
    \ be when passing a function as an argument to another function.\n\nWe can also\
    \ define a function based on a condition. For example, the following function\
    \ defines `addItem` only if `num` equals 1:\n\n```javascript\n1 let num = 1\n\
    2 if (num === 1) { \n3  addItem = function() { \n4   return 5 \n5  } \n6 } \n\
    ```\n\n### Calling functions\nWhen we define a function all we’ve done is given\
    \ it a name & specified what to do when the function executes. So to actually\
    \ run the function, we’ll need to call it within our program!\n\nTo call our earlier\
    \ function we could invoke it as follows:\n\n```javascript\n1 multiply(2,2);\n\
    ```\nHere we’re calling our function which is set to receive two arguments with\
    \ the arguments of `2` and `2`. The function executes and runs its statements\
    \ which returns the result of `2` multiplied by `2`.\n\nFunctions need to be in\
    \ scope when they are called, but the function declaration can be hoisted (appear\
    \ below the call in the code), like so:\n\n```javascript\n1 // call here\n2 /*\
    \ ... */ \n3 function multiply(a, b) { return a * b } \n```\nThe scope of a function\
    \ is the function in which it is declared, or the entire program if it is declared\
    \ at the global level.\n**Note**: This only works with function declarations.\
    \ Not function expressions!\n\n### Function scope\nWhen variables are defined\
    \ inside a function they cannot be accessed anywhere outside of that function.\
    \ As that would be outside the scope. However, a function is able to access all\
    \ variables and functions defined inside the scope in which it is defined. So\
    \ a function defined in the global scope can access all variables defined in the\
    \ global scope. A function defined inside another function can also access all\
    \ variables defined in its parent function and any other variable to which the\
    \ parent function has access.\n\nLet’s see an example…\n\n```javascript\n1 //\
    \ These variables are defined globally\n2 let a = 10\n3 b = 20\n4 name = \"Bruce\"\
    \n5 // This function is defined globally\n6 function multiply(a, b) { \n7  return\
    \ a * b \n8 } \n9 // returns 200\n10 // Working with a nested function\n11 function\
    \ getGreeting(name) { \n12  let a = 5\n13  let b = 10\n14  \n15  function inner()\
    \ { \n16   return name + \" received \" + (a * b) \n17  } \n18  \n19  return inner()\
    \ \n20 } \n21 // returns \"Bruce received 50\"\n```\n\n### Nesting functions and\
    \ closures\nSo you can nest a function within a function! The nested (inner) function\
    \ is private to its containing (outer) function. It also forms a closure. A closure\
    \ is an expression (usually a function) that can have free variables together\
    \ with an environment that binds those variables (it “closes” the expression).\n\
    \nAnd as a nested function is a closure, it’s able to “inherit” the arguments\
    \ and variables of its containing function. As follows:\n\n```javascript\n1 function\
    \ outer(x) { \n2  function inner(y) { \n3   return x + y \n4  } \n5  return inner\
    \ \n6 } \n7 let a = outer(5); // returns a function\n8 let b = a(10); // returns\
    \ 15\n9 let c = a(5); // returns 10\n```\n\n### Closures\nAs we now know, we can\
    \ nest our functions and JavaScript will give the inner function full access to\
    \ all variables defined inside the outer function (as well as all functions it\
    \ has access to). However, the outer function does not have access to the variables\
    \ and functions defined inside the inner function. Let’s see an example:\n\n```javascript\n\
    1 // The outer function defines \"name\" variable\n2 function makeGreeting(name)\
    \ { \n3  let count = 0\n4  return function() { \n5    count++;\n6    return name\
    \ + \" \" + count;\n7  }; \n8 } \n9 let greet = makeGreeting(\"Steve\");\n10 greet();\
    \ // returns \"Steve 1\"\n11 greet(); // returns \"Steve 2\"\n```\n\n### The `arguments`\
    \ object\nThe `arguments` of any function are maintained in an array-like object.\
    \ Within a function, you can address the arguments as `arguments[i]`. Here `i`\
    \ is the index number, starting at zero. So the first argument passed to a function\
    \ would be `arguments[0]`.\n\nUsing the `arguments` object, you can call a function\
    \ with more arguments than it is declared to accept. You can use `arguments.length`\
    \ to determine the number of arguments actually passed to the function, and then\
    \ access each argument using the `arguments` object.\n\nFor example, consider\
    \ a function that concatenates several strings. The only argument for the function\
    \ is a string that separates the items to concatenate. The function is defined\
    \ as follows:\n\n```javascript\n1 function concat(separator) { \n2  let result\
    \ = \"\";\n3  for (let i = 0; i < arguments.length; i++) {\n4    result += arguments[i]\
    \ + separator;\n5  }\n6  return result; \n7 } \n```\nYou can pass any number of\
    \ arguments into this function, and it’ll concatenate each argument into a string:\n\
    \n```javascript\n1 concat(\", \", \"fred\", \"wilma\", \"barney\", \"betty\");\
    \ // returns \"fred, wilma, barney, bety,\"\n2 concat(\"; \", \"marge\", \"lisa\"\
    , \"bart\", \"maggie\"); // returns \"marge; lisa; bart; maggie;\"\n3 concat(\"\
    . \", \"jerry\", \"kramer\", \"elaine\", \"george\", \"new\"); // returns \"jerry.\
    \ kramer. elaine. george. newman.\"\n```\n**Note**: The variable is “array-like”,\
    \ but not an array. It has a numbered index and a `length` property. However,\
    \ it does not possess all of the array-manipulation methods.\n\n### Function parameters\n\
    There are two kinds of function parameters: default parameters and rest parameters.\
    \ Let’s now take a look at each…\n\n#### Default parameters\nIn JavaScript, parameters\
    \ of functions default to `undefined`. However, in some situations, it might be\
    \ useful to set a different default value. This is where default parameters are\
    \ useful. It’s actually quite simple to implement:\n\n```javascript\n1 function\
    \ b(a, b = 2) { \n2  return a * b \n3 } // returns 10\n```\nYou can simply put\
    \ `2` as the default value for `b` in the function head.\n\n#### Rest parameters\n\
    The rest parameter syntax allows us to represent an indefinite number of arguments\
    \ as an array. In this example, we use the rest parameters to collect arguments\
    \ from the second one to the end. We then multiply them by the first one. This\
    \ example uses an arrow function, which we’ll look at next!\n\n```javascript\n\
    1 multiply = (multiplier, ...args) => {\n2  return args.reduce((acc, val) => acc\
    \ + val * multiplier, 0);\n } \nlet arr = [2, 4, 6];\nresult = multiply(2, ...arr);\
    \ // returns 24\n```\n\n#### Arrow functions\nAn arrow function has a much shorter\
    \ syntax compared to function expressions. For example, here is a regular function:\n\
    \n```javascript\n1 function(params) { \n2  return params + 10 \n3 } // 12\n```\n\
    And here is the same function, expressed as an arrow:\n\n```javascript\n1 let\
    \ funcName = (params) => params + 10\n2 funcName(2); // 12\n```\nThe same function\
    \ in just one line of code! Pretty neat!\n\nIf we have no parameters, we express\
    \ our arrow function like this:\n\n```javascript\n1 () => { statements }\n```\n\
    And when we have just one parameter, the opening parenthesis are optional:\n\n\
    ```javascript\n1 parameters => { statements }\n```\nFinally, if you’re returning\
    \ an expression, you can remove the brackets:\n\n```javascript\n1 parameters =>\
    \ expression\n2 // is the same as\n3 function(parameters) {\n4  return expression;\n\
    5 }\n```\n**Note**: Unlike a regular function, an arrow function does not bind\
    \ `this`. Instead, this is bound to keep its meaning from its original context.\
    \ We’ll be taking a closer look at the `this` keyword later on!\n\n#### Predefined\
    \ functions\nIt’s well worth noting that JavaScript has numerous built-in functions!\
    \ And they’ll likely save you a lot of time, especially for common tasks. See:\
    \ https://www.tutorialpoint.com/javascript/builtin_functions\n\n# Classes\n##\
    \ What are classes?\nJavaScript classes were introduced with ECMAScript2015, they’re\
    \ often described as syntactical sugar over JavaScript’s existing structure of\
    \ prototypical inheritance. So while classes do not introduce a new inheritance\
    \ model they do provide syntactical simplicity. This can help us produce less\
    \ error-prone & more readable code.\n\nClasses are just like functions!\nClasses\
    \ are very similar to functions. Much like functions that have both expressions\
    \ and declarations, classes have two components: expressions and methods.\n\n\
    ### Class declarations\nLet’s take a look at how we can define a class using the\
    \ `class` keyword followed by the name of the class:\n\n```javascript\n1 class\
    \ Image {\n  constructor(name) {\n    this.name = name;\n  }\n}\n```\n\n### Hoisting\n\
    One important difference between function declarations and class declarations\
    \ is that function declarations are hoisted and class declarations are not. You\
    \ first need to declare your class and then access it, otherwise code like the\
    \ following will throw a `Error`:\n\n```javascript\n1 const p = new Image(); //\
    \ Error\n```\n\n### Class expressions\nA class expression is the other way to\
    \ define a class. Class expressions can be named or unnamed. Note that the name\
    \ given to a named class is local to the class’s body:\n\n```javascript\n1 //\
    \ An unnamed class\nlet Image = class {\n  constructor(name) {\n    this.name\
    \ = name;\n  }\n};\n// A named class\nlet MyImage = class {\n  constructor(name)\
    \ {\n    this.name = name;\n  }\n};\n```\n**Note**: Class expressions are subject\
    \ to the same hoisting restrictions described previously in the declarations section.\n\
    \n### Constructors\nThe `constructor` method is a special method within a class\
    \ that we use to create and initialize an object created with `new`. We can only\
    \ use one method with the name `constructor` within a class. Our constructor can\
    \ use the `super` keyword to call the constructor of the super class (more on\
    \ this later!).\n\n### Instance properties\nInstance properties must be defined\
    \ inside our class methods:\n\n```javascript\n1 class Image {\n  constructor(name)\
    \ {\n    this.name = name;\n  }\n}\n```\nIf we wish to use static class-side properties,\
    \ these must be defined outside of the class body:\n\n```javascript\n1 Image.staticWidth\
    \ = 50;\n2 Image.prototype.prototypeWidth = 55;\n```\n\n### Field declarations\n\
    Whilst the syntax is still considered experimental not yet adopted by many public\
    \ and private field declarations are also worth knowing — as often you’ll be developing\
    \ with Babel which will transpile the syntax for you.\n\n### Public field declarations\n\
    Let’s revisit our example with the JavaScript field declaration syntax:\n\n```javascript\n\
    1 class Image {\n  height = 0\n  width = 0;\n}\n```\nThe difference is our fields\
    \ have been declared up-front. So our class definitions become more self-documenting,\
    \ and the fields are always present.\n**Note**: the fields can be declared with\
    \ or without a default value!\n\n### Private field declarations\nWhen we use private\
    \ fields, the definition can be refined like so:\n\n```javascript\n1 class Image\
    \ {\n  #height = 0;\n  #width = height;\n}\n```\nPrivate fields (declared with\
    \ `#`) cannot be referenced outside of the class, only within the class body.\
    \ This ensures that your classes’ users can’t depend on internals, which may change\
    \ with version.\n**Note**: Private fields cannot be created later through assignment.\
    \ They can only be declared up-front in a field declaration.\n\n### Child classes\
    \ using ‘extends’\nWe can use the `extends` keyword with either class declarations\
    \ or class expressions to create a class as a child of another class.\n\n```javascript\n\
    1 class Image {\n  constructor(name) {\n    this.name = name;\n  }\n}\nclass Car\
    \ extends Image {\n  constructor(name) {\n    // call the super class constructor\
    \ and pass in the name parameter\n    super(name);\n  }\n}\nlet c = new Car(\"\
    Volkswagen\"); // The Volkswagen\n```\nIf there is a constructor present in the\
    \ subclass, it needs to first call `super()` before using `this`. Function-based\
    \ “classes” may also be extended:\n\n```javascript\n1 function Vehicle(name) {\n\
    \  this.name = name;\n}\nclass Car extends Vehicle {\n  constructor(name) {\n\
    \    super(name);\n  }\n}\nlet c = new Car(\"Volkswagen\"); // The Volkswagen\n\
    ```\n**Note**: classes cannot extend regular objects! If you want to inherit from\
    \ an object, use:\n\n```javascript\nconst Vehicle = {\n  constructor(name) {\n\
    \    this.name = name;\n  }\n};\nclass Image extends Vehicle {\n  constructor(name)\
    \ {\n    super(name);\n  }\n}\n```\n\n### Summary\nAnd that’s all for this chapter!\
    \ We’ve learned about defining functions, function expressions, calling functions,\
    \ scope, nesting, closures, the `arguments` object, function parameters & arrow\
    \ functions.\n"
