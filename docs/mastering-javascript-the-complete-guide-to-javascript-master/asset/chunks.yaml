    '' + + ''kg and includes the 9 ng extras: '' + + '', '' + + 10 and '' + + 11  },
    12  { 13   car is a '' + + 14  } 15 };  Let’s access this data in our developer
    tools console:  1 car.name    // Tesla 2 car.model    // Model 3 3 car.weight   //
    1700 4 car.extras[1]  // wood decor 5 car.details()  // This Tesla is a Model
    3 it weighs 170\ 6 0kg and includes the following extras: heated seats, wo\ 7
    od decor and tinted glass. 8 car.display()  // This car is a Tesla.  As you can
    see, each name/value pair must be separated by a comma, and the name and value
    in each case are separated by a colon. The syntax will always follow this pattern:  1
    var objectName = { 2  3  4  member3Value 5 };  The value of an object member can
    be pretty much anything — in our car object, we have two strings, a number, an
    array, and two functions. The first four items are data items and are referred
    to as the object’s The last two items are functions that allow the object to do
    something with that data and are referred to as the object’s This kind of object
    is called an object literal — we’ve literally written out the object contents
    as we’ve created it. This is in comparison to objects instantiated from classes,
