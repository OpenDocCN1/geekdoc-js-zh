    — that is, update sections of a web page without needing to reload the entire
    page. We’ll be looking at two technologies that make this possible: XMLHttpRequest
    and the Fetch The old way… Page loading on the web using old methods was quite
    simple — you would send a request for a website to a server, and if nothing went
    wrong, any assets that made up the page would be downloaded and displayed on your
    computer or device. ![](image-llwgnqoj.png) This was the way websites worked for
    years. However it had a number of flaws.. whenever you wanted to update any part
    of the page, for example, to display a new set of products or submit a form, the
    entire page had to load again. This practice is very resource-heavy and results
    in a poor UX, especially as pages grow and become more complex. The solution:
    AJAX This problem was resolved as technologies were created that allowed web pages
    to request small chunks of data (such as HTML, XML, JSON, or plain text) and display
    them only when needed. This is achieved by using APIs like XMLHttpRequest or the
    Fetch API. These technologies allow web pages to directly handle making HTTP requests
    for specific resources available on a server and formatting the resulting data
    as needed before it is displayed. This technique is what is called or Originally
    it mainly used XMLHttpRequest to request XML data (hence the “and XML”). However,
    these days you’d be more likely to use XMLHttpRequest or Fetch to request JSON
    — but the result is still the same so the term “Ajax” stuck. ![](image-ftq13hmc.jpg) Conceptually,
    Ajax involves using a web API as a proxy to more intelligently request data, rather
    than just having the browser reload the entire page. You can see it in action
    in just about every major website. When you play a new video on YouTube for example,
    you’ll see the navigation, header and footer sections don’t refresh — just the
    section containing the video. Why is this important? Page updates are much faster
    & you’ll spend less time wait for the page to refresh, so the site feels faster
    and more responsive (page speed is also very important for Google rankings and
    SEO!).Less data is downloaded on each update, meaning less wasted bandwidth. Whilst
    not a huge concern on desktops, it’s a major issue on mobile devices especially
    in developing countries that don’t have fast internet. Creating an Ajax request In
    this section, we’re going to first use an XMLHttpRequest and then Fetch to perform
    an Ajax request. XMLHttpRequest An XMLHttpRequest (often abbreviated to is actually
    quite an old technology now — it was invented in the ‘90s by Microsoft, and has
    been in use ever since. To create an XHR request, you first need to create a new
    request object using the XMLHttpRequest() constructor. You can call this object
    anything you like, in our demo we’ll call it Like so:  1 let xhr = new XMLHttpRequest();  The
    next step is to initialize it using the open() method. Here we specify what HTTP
    request method to use to request the resource from the network, as well as the
    URL where it’s located. Here we’ll use the and set the URL to a url variable (which
    should store the address as a string). We add this below the previous line:  1
    xhr.open(''GET'', url);  Next, we’ll set up the type of response we are expecting
    as This isn’t strictly necessary as XHR returns text by default — but it is a
    good idea to get into this habit as you’ll no doubt be fetching other types of
    data in the future! Now we add:  1 xhr.responseType = ''text'';  Whenever we fetch
    a resource from a network we’re performing an asynchronous operation. This means
    you have to wait for that operation to complete (while the resource is returned
    from the network) before you can do anything with that response, otherwise, an
    error will be thrown. With XHR we can handle this using the onload event handler
    — this runs when the load event fires (after the response has returned). The response
    data will be available in the response property of the XHR request object. Next,
    we create our function to handle the onload event & (in this case ) display our
    xhr.response values:  1 = { 2  3 };  And finally, we need a send() method to run
    the request:  1  Fetch The Fetch API is a modern alternative that can serve as
    a replacement for XHR. It was built to make asynchronous HTTP requests easy to
    do in JavaScript. Let’s see a basic example of the syntax:  1 // Call the fetch
    function passing the url of \ 2 the API as a parameter 3 { 4   // Your code for
    handling the data you get from the A\ 5 PI 6 }) 7 { 8   // This is where you run
    code if the server returns a\ 9 ny errors 10  All we are doing here is fetching
    the URL that we want, by default fetch uses the GET method — which is what we
    want in this case! Let’s see some more fleshed out sample code:  1 2  { 3   return
    4  5  { 6   7    Here we are fetching a JSON file from the URL and then printing
    it to the console. The simplest use of fetch() takes one argument — the path to
    the resource you want to fetch — and returns a promise containing the response
    (in the form of a JavaScript object). To extract the JSON body content from the
    response, we use the Then we can transform the response object into an object
    that we can interact with. Working with promises Like many modern JavaScript APIs,
    Fetch uses promises. Though they are a bit confusing at first, don’t worry too
    much about it for now. You’ll get used to them! Let’s look at the promise structure
    as it relates to our Fetch request:  1 2  { 3   return 4  5  { 6   7  The first
    line is saying “fetch the resource located our URL” and “then run the specified
    function when the promise resolves” { ... “Resolve” means “finish performing the
    specified operation at some point in the future”. The specified operation, in
    this case, is to fetch a resource from our specified URL (using an HTTP request)
    and return the response for us to do something with. Effectively, the function
    passed into then() is a chunk of code that won’t run immediately. Instead, it’ll
    run at some point in the future when the response has been returned. So which
    technique should you use? XHR has been around for a long time now and has very
    good cross-browser support. Fetch and Promises, on the other hand, are newer additions
    to the web platform, although they’re supported well across the browser landscape,
    with the exception of Internet Explorer. If you need to support older browsers,
    then an XHR solution might be preferable. If however you are working on a more
    progressive project and aren’t as worried about older browsers, then Fetch would
    be a good choice. Summary And that’s it! We looked at how to start working with
    AJAX using techniques such as XHR and Fetch to retrieve data from a server. And
    we looked at basic examples of each! Hopefully, now you have a grasp of each &
    can start incorporating async operations into your code! An Introduction to REST
    APIs (REST) is an architectural style that handles the client-server relationship,
    with the purpose of aiming for speed and performance by using re-usable components. REST
    as a technology was introduced into the world in a 2000 doctoral dissertation
    by Roy Fielding (https://www.ics.uci.edu/~fielding/pubs/dissertation/top.htm).
    Nowadays it is generally preferred to SOAP (Simple Object Access Protocol) as
    REST uses less bandwidth and is simpler and more flexible for internet usage.
    We can use it to fetch or give some information from a web service, this is done
    via an HTTP request to the REST API. What is a REST API? A REST API is a way of
    easily accessing web services without having excess processing. Whenever a RESTful
    API is called, the server will transfer to the client a representation of the
    state of the requested resource. In fact, we use this just about every day! If
    you’re trying to find videos about biking on YouTube. You’d type “biking” into
    the YouTube search field, hit enter, and you’ll then see a list of videos about
    biking. Conceptually, a REST API works just like this! You search for something,
    and you get a list of results back from the service that you’re requesting from. An
    API is an application programming interface. It’s a set of rules that allow programs
    to communicate with each other. The developer creates the API on the server and
    allows the client to talk to it. REST is what determines how the API looks. It
    is the rules that developers follow when they create an API. One of these rules
    states that you should be able to get a piece of data (a resource) when you link
    to a specific URL. Each URL is called a request while the data sent back to you
    is called a RESTful Architecture So what are the basic features of REST? Stateless:
    Meaning the client data is not stored on the server, the session is stored client-side
    (typically in session storage).Client<->Server: There is a separation of concerns
    between the front-end (client) and the back-end (server). They operate independently
    of each other and both are replaceable.Cache: Data from the server can be cached
    on the client, which can improve performance speed.URL Composition: We use a standardized
    approach to the composition of base URLs. For example, a GET request to should
    yield all the cities in the database, whereas a GET request to /cities/seattle
    would render the city with an ID of Seattle. Similarly, REST utilizes standard
    methods like DELETE and POST to perform actions. Which we’ll take a look at in
    the next section! So we can define a RESTful API as one that is it separates concerns
    between it allows caching of data client-side and it utilizes standardized base
    URLs and methods to perform the actions required to manipulate, add or delete
    data. REST in action Let’s now take a closer look at how this is done! Our request
    is sent from the client to the server via HTTP in the form of a web URL. Using
    either GET, POST, PUT or DELETE. Then a response is sent back from the server
    in the form of a resource, which could be anything like HTML, XML, Image, or JSON.
    JSON is by far the most popular format, so we’ll be using that for our example. ![](image-t1b9wmt5.jpg) Photo
    credit: https://antmedia.io HTTP has five methods that are commonly used in a
    REST-based architecture: POST, GET, PUT, PATCH, and DELETE. In fact, they correspond
    to create, read, update, and delete (CRUD) operations respectively. It should
    also be noted that there are other methods that are less frequently used, such
    as OPTIONS and HEAD. GET: This method is used to read (or retrieve) a representation
    of a resource. If all is well, GET returns a representation in XML or JSON and
    an HTTP response code of 200 (OK). In an error case, it most often returns a 404
    (NOT FOUND) or 400 (BAD REQUEST).POST: This method is often utilized to create
    new resources. In particular, it’s used to create subordinate resources. That
    is, subordinate to some other (e.g. parent) resource. On successful creation,
    it returns HTTP status 201, returning a location header with a link to the newly-created
    resource with the 201 HTTP status.PUT: It’s used for updating capabilities and
    also to create a resource (in the case where the resource ID is chosen by the
    client instead of the server). Essentially PUT is to a URL that contains the value
    of a non-existent resource ID. A successful update returns 200 (or 204 if not
    returning any content in the body) from a PUT. If using PUT for create, it returns
    HTTP status 201 on successful creation.PATCH: It’s used for modify capabilities.
    The PATCH request only needs to contain the changes to the resource, not the complete
    resource. This is similar to PUT, however the body contains a set of instructions
    describing how a resource currently residing on the server should be modified
    to produce a new version. So the PATCH body should not just be a modified part
    of the resource but in some kind of patch language like JSON Patch or XML Patch.DELETE:
    Fairly self-explanatory, it’s used to delete a resource identified by a URL. Upon
    successful deletion, it returns HTTP status 200 (OK) along with a response body. Working
    with REST data Furthermore, it has become common practice for REST APIs to also
    return data in a standard format. As mentioned the most popular format nowadays
    is JSON (JavaScript Object Notation). The standardization of the formatting of
    the data is another step towards uniformity in the way resources are interacted
    with on the web, allowing for developers to solve problems and not spend their
    time in configuration of the basic architecture! When requesting data from an
    API you might get back something like this:  1 { 2   title: "Hi, I am JSON", 3   content:
    [ 4     chapter: "1", 5     page: "100", 6     firstParagraph: "I am JSON, this
    is what I look l\ 7 ike when I am returned from an API." 8   ], 9   author: "Bruce
    Smithesson" 10 }  This format allows for easy access to the data within JSON,
    using dot notation such as which returns “Hi, I am JSON”. Where can you find RESTful
    APIs? Everywhere!Twitter - https://dev.twitter.com/twitterkit/android/access-rest-apiGoogle
    - https://developers.google.com/drive/v2/reference/Open Weather Map - https://openweathermap.org/apiYouTube
    - https://developers.google.com/youtube/v3 Most of the popular services we use
    daily utilize a RESTful architecture for their API service. So go forth & explore
    the world of adding API functionality to your websites & apps! Summary And there
    we go! We’ve taken a look at what REST is, as well as the principles which govern
    its architecture. We’ve looked at how REST works with APIs to send and receive
    data from client to server & back again. We’ve also taken a look at the JSON format,
    which we’ll most often be working with when accessing and manipulating our data! Promises Promises
    are used in JavaScript to handle asynchronous operations. They essentially represent
    an operation that hasn’t completed yet - hence the name of ‘promise’. They simplfy
    the process of dealing with multiple asynchronous operations, and reduce the likelihood
    of “callback hell” which often leads to messy and unmanageable code. Why use promises? A
    better way to handle asynchronous operationsImproved error handlingAnd, they make
    for much cleaner code! Let’s take a look at how they work.. So a promise can be
    thought of as a placeholder for (an unknown) value that’s expected whenever a
    promise is created. They allow you to associate event handlers with an asynchronous
    action’s eventual success or failure. This means that asynchronous methods return
    values in the same manner as synchronous methods - instead of immediately returning
    a final value, they return a promise to provide the value at some point in the
    future. A promise can be in one of these states: the initial state, when the operation
    hasn’t fulfilled or rejectedthe operation has successfully completedthe operation
    has failedthe operation has either fulfilled or rejected Let’s see how to create
    a promise:  1 let completed = 2 let promise = new { 3  // perform an action 4  if
    { 5   6  } 7  else { 8   didn''t 9  } 10  We can see that promise constructor
    takes one argument, a callback with two parameters, resolve and Within the callback
    you perform your desired action (such as an ‘async’ operation), if it’s successful,
    call if not call Note that in this example we reject with an Error object. It’s
    not mandatory, but beneficial for certain debugging tools, as they capture a stack
    trace. So how do we use this promise?  1 { 2  // "It worked!" 3 { 4  // "It didn''t
    work.." 5  We can see then() takes two arguments, a callback for “success”, and
    a callback for a “failure”. Both are entirely optional, you’re free to just add
    a callback for either success or failure if you wish. Summary A promise is an
    object that returns a future value. It begins in the pending state proceeds to
    either the fulfilled state or rejected state, before being considered Async &
    defer Whenever you load JavaScript from an HTML page, it’s important to be mindful
    of the loading performance of the page. The page-load time largely depends on
    where and how you add scripts to your HTML page. In this chapter, we’re going
    to look at how we can use async and defer to control the execution order of our
    scripts & optimize our page load speed! Today, all modern browsers support the
    async and defer attributes on scripts. These attributes tell the browser it’s
    safe to continue loading the page, while the scripts are being downloaded.'
