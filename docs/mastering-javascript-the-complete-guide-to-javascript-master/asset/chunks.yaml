    from your apps, and more. So how do APIs work? Despite different APIs working
    in different ways, they all share some common base factors which we’ll take a
    look at now: APIs are based on objects The code you write to interact with APIs
    will use one or more JavaScript objects. These objects serve as containers for
    the data the API uses (contained in object properties), and the functionality
    the API makes available (contained in object methods). Let’s take a look at an
    example using the Web Audio API — the API consists of a number of objects. For
    example, we have: AudioContext this represents an audio graph that can be used
    to manipulate audio playing inside the browser, and has a number of methods and
    properties available to manipulate that audio.MediaElementAudioSourceNode this
    represents anelement containing sound you want to play and manipulate inside the
