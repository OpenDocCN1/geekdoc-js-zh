    keyword The super keyword is used to call corresponding methods of super class.
    This is one advantage over prototype-based inheritance. Let’s see an example:  1
    class Volkswagen { 2  { 3   = 4  } 5  6  { 7   makes a 8  } 9 } 10 11 class Beetle
    extends Volkswagen { 12  { 13   14   toots horn.`); 15  } 16 } 17 18 let b = new
    19 20 21 // Herbie makes a 22 // Herbie toots horn.  Mix-ins Mix-ins are templates
    for classes. An ECMAScript class can only have a single superclass, so multiple
    inheritance from tooling classes, for example, isn’t possible. The functionality
    must be provided by the superclass. A function with a superclass as input and
    a subclass extending that superclass as output can be used to implement mix-ins
    in ECMAScript:  1 let calculatorMixin = Base => class extends Base { 2  { } 3
    }; 4 5 let randomizerMixin = Base => class extends Base { 6  { } 7 };  A class
    that uses these mix-ins can then be written like this:  1 class First { } 2 class
    Second extends 3 { ...  And that’s it! We’ve taken a deep dive into JavaScript
    classes including class declarations, class expressions, constructors, instance
    properties, field declarations, extends, species, super and mix-ins. Understanding
    APIs Application (APIs) can be defined as sets of functions and procedures which
    are created by an operating system, application or other service. They can be
    utilized by developers who wish to interact with those set procedures when building
    their own applications. Essentially they’re created to take away a lot of the
    more complex code and provide an easier syntax to work with. For example, you
    might want to add a live twitter feed into your website. By working with the relevant
    methods provided by the Twitter API (via the developer documentation), you could
    query twitter & display the latest tweets by a particular user or hashtag. APIs
    in JavaScript JavaScript has numerous APIs available to it, which are typically
    defined as either Browser APIs or Third Party Let’s take a look at each.. Browser
    APIs Browser APIs are built into the browser — containing data from the browser.
    With this data we can do many useful things, from simply manipulating the window
    or to generating intricate effects using APIs such as WebGL. Some of the more
    common browser APIs that you’ll encounter are: APIs for document manipulation:
    The DOM (Document Object Model) is in fact an API! It allows you to manipulate
    HTML and CSS — creating, removing and changing HTML, dynamically applying new
    styles to your page, etc.APIs for fetching server data: Such as XMLHttpRequest
    and the Fetch API, which we often use for data exchange and partial page updates.
    This technique is often called Ajax.APIs for manipulating graphics: Here we’re
    talking about Canvas and WebGL, which allow you to programmatically update the
    pixel data contained in an HTML'
