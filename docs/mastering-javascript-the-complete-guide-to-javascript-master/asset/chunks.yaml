    to the same event and \ 13 element 14 15 16  We can see how both events have fired,
    providing the user with both an alert and modified text once clicking out of the
    alert. ![](image-1z78dq04.jpg) It’s more concise to use anonymous functions instead
    of function references on event listeners. Anonymous functions are functions that
    are not named, such as:  1 // An anonymous function on an event listener 2 3 ()
    => { 4   = "Will I 5 });  We could also use the removeEventListener() function
    to remove one or all events from an element.  1 // Remove alert function from
    button element 2 3  It’s also useful to know that you can use addEventListener()
    on the document and window object. Event listeners are currently the most common
    and preferred way to handle events in JavaScript. Next up we’ll take a brief look
    at some of the more common events that we’re likely to work with. Common Events So
    far we’ve focused on using the click event while learning about inline event handlers,
    event handler properties and event listeners. However there are many more events
    available for us to work with, so let’s take a look! Mouse Events Mouse events
    are among the most frequently used events. They refer to events that involve clicking
    the mouse button or hovering and moving the pointer. And of course, these events
    also correspond to the equivalent action on a touch device. Some examples are: click
    - Fires when the mouse is pressed and released on an element.dblclick - Fires
    when an element is clicked twice.mouseenter - Fires when a pointer enters an element.mouseleave
    - Fires when a pointer leaves an element.mousemove - Fires every time a pointer
    moves inside an element. A click is actually a compound event that is comprised
    of combined mousedown and mouseup events, these fire when the mouse button is
    pressed down or lifted, respectively. Using mouseenter and mouseleave together
    recreates a hover effect that lasts as long as a mouse pointer is on the element. Form
    Events Form events are actions that relate to forms, such as input elements and
    whether they are selected or unselected, and also form submission. submit - Fires
    when a form is submitted.focus - Fires when an element (such as an input) receives
    focus.blur - Fires when an element loses focus. Focus is achieved when an element
    is selected, for example, through a mouse click or navigating to it via the TAB
    key. JavaScript is often used to submit forms and send the values through to a
    back-end language. The advantage of using JavaScript to send forms is that it
    does not require a page reload to submit the form, and JavaScript can be used
    for form validation. Keyboard Events Keyboard events are used for handling keyboard
    actions, such as pressing a key, lifting a key, and holding down a key. keydown
    - Fires once when a key is pressed.keyup - Fires once when a key is released.keypress
    - Fires continuously while a key is pressed. Although they look similar, keydown
    and keypress events do not access all the exact same keys. While keydown will
    acknowledge every key that is pressed, keypress will omit keys that do not produce
