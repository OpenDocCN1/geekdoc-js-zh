    9   return 10  } 11 }); 12 13 14 15 // 308.25  Find the first element that satisfies
    a function We use the find() method:  1 var numbers = 2 3 var found = { 4  return
    element > 5 }); 6 7 8 9 // 40  Similarly, we can use the findIndex() method to
    return the first index position, rather than the element itself:  1 var numbers
    = 2 3 var found = { 4  return element > 5 }); 6 7 8 9 // 3  Mastering Objects Objects
    in JavaScript are used to store collections of data in the format of “key: value”
    pairs. Contained within an object we can have any number of variables and/or functions
    which are then referred to as object properties and methods. Creating an Object Let’s
    work with an example! To initialize a variable car as an we use curly braces  1
    var car = {};  We now have an empty object which can be accessed via the Developer
    Tools console, by simply typing our variable name:  1 car 2 3 // {}  An empty
