  trans: "\n用于创建 2D 和 3D 场景元素。\n\n### 音频/视频 API\n例如 `HTMLMediaElement` 和 `Web Audio\
    \ API`。你可以使用这些接口创建播放音频和视频的自定义控件，并在视频中显示说明、字幕之类的文本轨道。对于音频，你可以为音频轨道添加效果（如 `gain`、失真等）。\n\
    \n### 设备 API\n用于操作和从设备硬件检索数据，以供 Web 应用程序使用。例如通知用户有可用更新。\n\n### 第三方 API\n第三方 API\
    \ 并不是内置在浏览器中的，你需要从其他地方获取它们的代码和信息。通过与第三方 API 连接，你可以访问并使用该 API 提供的方法。一些常见的第三方 API\
    \ 包括：\n\n- `Openweathermap.org`：允许你查询天气数据。例如，你可以获取用户的位置并显示其当前温度。\n- `Twitter API`：你可以在你的网站上显示你最新的推文。\n\
    - `Google Maps API`：允许你完全自定义用于包含在你的网页中的地图。\n- `YouTube API`：允许你在你的网站上嵌入 YouTube\
    \ 视频、搜索 YouTube 并自动生成播放列表。\n- `Twilio API`：此 API 提供了一个框架，用于在应用程序中构建语音和视频通话功能、从你的应用程序发送\
    \ SMS/MMS 等。\n\n## 那么 API 是如何工作的？\n尽管不同的 API 工作方式不同，但它们都共享一些共同的基础因素，我们现在来看这些因素：\n\
    \n### API 是基于对象的\n你编写的与 API 交互的代码将使用一个或多个 JavaScript 对象。这些对象作为 API 使用的数据容器（包含在对象属性中）以及\
    \ API 提供的功能（包含在对象方法中）。让我们来看一个使用 Web Audio API 的示例——该 API 由许多对象组成。例如：\n\n- `AudioContext`：它代表一个可以操作浏览器内播放音频的音频图，并有许多可用的方法和属性来操作该音频。\n\
    - `MediaElementAudioSourceNode`：它代表一个包含你想要在音频上下文中播放和操作的声音的元素。\n- `AudioDestinationNode`：它代表音频的终点，即你计算机上实际输出音频的设备——通常是你的扬声器或耳机。\n\
    \n#### 这些对象是如何交互的？\n让我们看以下 HTML：\n\n```html\n<audio src=\"music.mp3\"></audio>\n\
    ```\n在这里我们有一个元素，用它将 MP3 嵌入页面中。我们没有包含任何默认的浏览器控件。然后我们添加了一个 `<button>`。\n\n让我们看看这个示例的\
    \ JavaScript 代码...\n我们首先内部创建一个 `AudioContext` 实例，并在其中操作我们的轨道：\n```javascript\n\
    const AudioContext = window || {};\nconst audioCtx = new AudioContext();\n```\n\
    然后我们将创建常量来存储对 `audioElement`、`playBtn` 以及 `volumeSlider` 的引用，并使用 `AudioContext.createMediaElementSource()`\
    \ 方法创建一个 `MediaElementAudioSourceNode`，代表我们音频的源——音频将从这里播放：\n\n```javascript\n\
    const audioElement = document.querySelector('audio');\nconst playBtn = document.querySelector('button');\n\
    const volumeSlider = document.querySelector('input');\nconst audioSource = audioCtx.createMediaElementSource(audioElement);\n\
    ```\n\n接下来，我们将包含几个事件处理器，每当点击按钮时在播放和暂停之间切换，并在歌曲播放结束时将显示重置开头：\n\n```javascript\n\
    // 播放 + 暂停音频\nplayBtn.addEventListener('click', () => {\n  // 检查上下文是否处于挂起状态\n\
    \  if (audioCtx.state === 'suspended') {\n    audioCtx.resume();\n  }\n  // 如果轨道正在播放则播放它\n\
    \  if (audioElement.paused) {\n    audioElement.play();\n    playBtn.textContent\
    \ = 'Pause';\n  } else {\n    // 如果轨道已停止则停止它\n    audioElement.pause();\n    playBtn.textContent\
    \ = 'Play';\n  }\n});\n// 如果轨道结束\naudioElement.addEventListener('ended', () =>\
    \ {\n  audioElement.currentTime = 0;\n  playBtn.textContent = 'Play';\n});\n```\n\
    使用的 `play()` 和 `pause()` 方法实际上是 `HTMLMediaElement` API 的，而不是 `Web Audio API`（尽管它们密切相关！）。\n\
    \n现在我们使用 `AudioContext.createGain()` 方法创建一个 `GainNode` 对象，它可以用于调整通过它的音频音量，并创建另一个事件处理器，每当滑块值改变时就改变音频图增益（音量）的值：\n\
    \n```javascript\nconst gainNode = audioCtx.createGain();\nvolumeSlider.addEventListener('input',\
    \ () => {\n  gainNode.gain.value = volumeSlider.value;\n});\n```\n最后，我们连接音频图中的不同节点，这是通过每个节点类型可用的\
    \ `AudioNode.connect()` 方法完成的：\n\n```javascript\naudioSource.connect(gainNode);\n\
    gainNode.connect(audioCtx.destination);\n```\n音频从源开始，然后连接到增益节点以便调整音频音量。随后，增益节点连接到目标节点，以便声音可以在你的计算机上播放（`AudioContext.destination`\
    \ 属性代表你计算机硬件上可用的任何默认 `AudioDestinationNode`，例如你的扬声器）。\n\n### API 有可识别的入口点\n每当你使用\
    \ API 时，请确保你知道入口在哪里！在 `Web Audio API` 中——入口是 `AudioContext` 对象。要进行任何操作都必须使用它。\n\
    \n当使用文档对象模型 (DOM) API 时——它的功能通常存在于 `Document` 对象上，或者你想要以某种方式影响的 `HTML` 元素实例上，例如：\n\
    \n```javascript\n// 创建一个新的 em 元素\nlet em = document.createElement('em');\n\n//\
    \ 引用已有的 p 元素\nlet p = document.querySelector('p');\n\n// 给 em 一些文本内容\nem.textContent\
    \ = 'Hello, world!';\n\n// 将 em 嵌入到内部\np.appendChild(em);\n```\n`Canvas API` 也依赖于获取一个上下文对象来用于操作。它的上下文对象是通过获取引用来创建的\n\
    \n"
- fmt: "\nelement you want to draw on, and then calling its `HTMLCanvasElement.getContext()`\
    \ method:\n\n```javascript\n1 let canvas = document.querySelector('canvas');\n\
    2 let ctx = canvas.getContext('2d');\n```\n\nAnything that we want to do to the\
    \ canvas is then achieved by calling properties and methods of the context object\
    \ (which is an instance of for example:\n\n```javascript\n1 Circle.prototype.draw\
    \ = function() {\n2 ctx.beginPath();\n3 ctx.fillStyle = this.color;\n4 ctx.arc(this.x,\
    \ this.y, this.size, 0, 2 * Math.PI);\n5 ctx.fill();\n6 };\n```\n\n### APIs handle\
    \ changes in state with events\n\nWhen using the `XMLHttpRequest` object (each\
    \ one represents an HTTP request to the server to retrieve a new resource) we\
    \ have a number of events available, for example the load event is fired when\
    \ a response has been successfully returned containing the requested resource,\
    \ and it is now available.\n\nThe following code provides an example of how this\
    \ could be used:\n\n```javascript\n1 let requestURL = 2 3 let request = new 4\n\
    5 = 6 7 8 = { 9\n  let usernames = 10\n11\n12 }\n```\n\nThe first five lines specify\
    \ the location of resource we want to fetch, create a new instance of a request\
    \ object using the `XMLHttpRequest()` constructor, open an HTTP GET request to\
    \ retrieve the specified resource, specify that the response should be sent in\
    \ JSON format, then send the request.\n\nThe `onload` handler function then specifies\
    \ what we do with the response. We know the response will be successfully returned\
    \ and available after the load event has required (unless an error occurs), so\
    \ we save the response containing the returned JSON in the `usernames` variable,\
    \ then pass it to two different functions for further processing.\n\n**Note:**\
    \ In the next chapter, we’re going to take a look at fetching data from a server\
    \ in more detail.\n\n### Summary\nAnd that’s API’s in a nutshell! We’ve looked\
    \ at what APIs are, how they work, we compared browser and third party APIs and\
    \ finally we looked at some of the common characteristics that many APIs share.\
    \ I hope this introduction gave you more of an understanding of what APIs are,\
    \ and how we can use them in our projects!\n\n## Fetching data from a server\n\
    \nIn this chapter, we’ll be looking at how we can go about retrieving data from\
    \ a server. Modern websites and applications need to be able to do this seamlessly\
    \ — that is, update sections of a web page without needing to reload the entire\
    \ page. We’ll be looking at two technologies that make this possible: `XMLHttpRequest`\
    \ and the `Fetch`.\n\n### The old way…\nPage loading on the web using old methods\
    \ was quite simple — you would send a request for a website to a server, and if\
    \ nothing went wrong, any assets that made up the page would be downloaded and\
    \ displayed on your computer or device.\n\n![](image-llwgnqoj.png)\n\nThis was\
    \ the way websites worked for years. However it had a number of flaws.. whenever\
    \ you wanted to update any part of the page, for example, to display a new set\
    \ of products or submit a form, the entire page had to load again. This practice\
    \ is very resource-heavy and results in a poor UX, especially as pages grow and\
    \ become more complex.\n\n### The solution: AJAX\nThis problem was resolved as\
    \ technologies were created that allowed web pages to request small chunks of\
    \ data (such as HTML, XML, JSON, or plain text) and display them only when needed.\n\
    \nThis is achieved by using APIs like `XMLHttpRequest` or the `Fetch` API. These\
    \ technologies allow web pages to directly handle making HTTP requests for specific\
    \ resources available on a server and formatting the resulting data as needed\
    \ before it is displayed.\n\nThis technique is what is called or Originally it\
    \ mainly used `XMLHttpRequest` to request XML data (hence the “and XML”). However,\
    \ these days you’d be more likely to use `XMLHttpRequest` or `Fetch` to request\
    \ JSON — but the result is still the same so the term “Ajax” stuck.\n\n![](image-ftq13hmc.jpg)\n\
    \nConceptually, Ajax involves using a web API as a proxy to more intelligently\
    \ request data, rather than just having the browser reload the entire page.\n\n\
    You can see it in action in just about every major website. When you play a new\
    \ video on YouTube for example, you’ll see the navigation, header and footer sections\
    \ don’t refresh — just the section containing the video.\n\n#### Why is this important?\n\
    - Page updates are much faster & you’ll spend less time wait for the page to refresh,\
    \ so the site feels faster and responsive (page speed is also very important for\
    \ Google rankings and SEO!).\n- Less data is downloaded on each update, meaning\
    \ less wasted bandwidth. Whilst not a huge concern on desktops, it’s a major issue\
    \ on mobile devices especially in developing countries that don’t have fast internet.\n\
    \n### Creating an Ajax request\nIn this section, we’re going to first use an `XMLHttpRequest`\
    \ and then `Fetch` to perform an Ajax request.\n\n#### XMLHttpRequest\nAn `XMLHttpRequest`\
    \ (often abbreviated to `XHR`) is actually quite an old technology now — it was\
    \ invented in the ‘90s by Microsoft, and has been in use ever since.\n\nTo create\
    \ an XHR request, you first need to create a new request object using the `XMLHttpRequest()`\
    \ constructor. You can call this object anything you like, in our demo we’ll call\
    \ it `xhr` Like so:\n\n```javascript\n1 let xhr = new XMLHttpRequest();\n```\n\
    \nThe next step is to initialize it using the `open()` method. Here we specify\
    \ what HTTP request method to use to request the resource from the network, as\
    \ well as the URL where it’s located. Here we’ll use `GET` and set the URL to\
    \ a `url` variable (which should store the address as a string).\n\nWe add this\
    \ below the previous line:\n\n```javascript\n1 xhr.open('GET', url);\n```\n\n\
    Next, we’ll set up the type of response we are expecting as `text`. This isn’t\
    \ strictly necessary as XHR returns text by default — but it is a good idea to\
    \ get into this habit as you’ll no doubt be fetching other types of data in the\
    \ future! Now we add:\n\n```javascript\n1 xhr.responseType = 'text';\n```\n\n\
    Whenever we fetch a resource from a network we’re performing an asynchronous operation.\
    \ This means you have to wait for that operation to complete (while the resource\
    \ is returned from the network) before you can do anything with that response,\
    \ otherwise, an error will be thrown. With XHR we can handle this using the `onload`\
    \ event handler — this runs when the load event fires (after the response has\
    \ returned). The response data will be available in the `response` property of\
    \ the XHR request object.\n\nNext, we create our function to handle the `onload`\
    \ event & (in this case ) display our `xhr.response` values:\n\n```javascript\n\
    1 let onload = function() {\n2\n3 };\n```\n\nAnd finally, we need a `send()` method\
    \ to run the request:\n\n```javascript\n1 xhr.send();\n```\n\n#### Fetch\nThe\
    \ `Fetch` API is a modern alternative that can serve as a replacement for XHR.\
    \ It was built to make asynchronous HTTP requests easy to do in JavaScript. Let’s\
    \ see a basic example of the:\n\n```javascript\n1 // Call the fetch function passing\
    \ the url of\n2 the API as a parameter\n3 fetch(url)\n4 .then(response => {\n\
    5 // Your code for handling the data you get from the\n6 return response.json();\n\
    7 })\n8 .then(data => {\n9 // This is where the server returns the\n10 console.log(data);\n\
    11 })\n```\n\nAll we are doing here is fetching the URL that we want, by default\
    \ fetch uses the `GET` method — which is what we want in case! Let’s see some\
    \ more fleshed out code:\n\n```javascript\n1 fetch(url)\n2 .then(response => {\n\
    3 return response.json();\n4 })\n5 .then(data => {\n6 console.log(data);\n7 });\n\
    ```\n\nHere we are fetching a JSON file from the URL and then printing it to the\
    \ console. The simplest use of `fetch()` takes one argument — the path to the\
    \ resource you want — and returns a promise containing the response (in the form\
    \ of object). To extract the JSON body from the response, we use transform the\
    \ response into object that we can interact with.\n\n#### Working with promises\n\
    Like many modern APIs, Fetch uses promises. Though they are a bit confusing at\
    \ first, don’t worry much about it for now. you’ll get used to them! Let’s look\
    \ at the promise structure as it relates to:\n\n```javascript\n1 fetch(url)\n\
    2 .then(response => {\n3 return response.json();\n4 })\n5 .then(data => {\n6 console.log(data);\n\
    7 });\n```\n\nThe first line is saying “fetch the resource located our URL” and\
    \ “then run the function when the promise resolves”. The specified operation,\
    \ in case, is to fetch a resource from our URL (using an HTTP request) and return\
    \ the response for us to do something. Effectively, the function passed into `then()`\
    \ is a chunk of code that won’t run immediately. Instead, it’ll run at some point\
    \ in the future when the response has returned.\n\n#### So technique should you\
    \ use?\nXHR has been around for long time now and has very good cross-browser\
    \ support. Fetch and Promises, on the other hand, are newer additions to the web\
    \ platform, although they’re supported well the exception of Internet Explorer.\
    \ If you need to support older browsers, then XHR solution might be preferable.\
    \ If however you are working on more progressive project and aren’t worried about\
    \ older browsers, then Fetch would be a good choice.\n\n### Summary\nAnd that’s\
    \ it! We looked at how to start with AJAX using techniques as XHR and `Fetch`\
    \ to retrieve data from a server. And we looked at basic examples of each! Hopefully,\
    \ now you have a grasp of each\n\n## Introduction to REST APIs\n(REST) is an architectural\
    \ style that handles the client-server relationship, with the purpose of aiming\
    \ for speed and performance by using re-usable components. REST as a technology\
    \ was introduced into the world in a dissertation by Roy Fielding (https://www.ics.edu/~fielding/dissertation/top.htm).\
    \ Nowadays it is generally preferred to SOAP (Simple Object Access Protocol) as\
    \ REST uses less bandwidth and is simpler and flexible for internet usage.\n\n\
    ### What is a REST API?\nA REST API is a way of easily accessing web services\
    \ without excess processing. Whenever a RESTful API is called, the server will\
    \ transfer to the client a representation of the state of the requested resource.\
    \ In fact, we use this just about every day! If you’re trying to find videos on\
    \ YouTube. You’d type “biking” into the search field, hit enter, and you’ll then\
    \ see a list of. Conceptually, a REST API works just like this! You search for\
    \ something, and you get a list of results back from the service that you’re requesting\
    \ from. An API is an application programming interface. It’s a set of rules that\
    \ allow programs to communicate with each other. The developer creates the API\
    \ on the server and allows the client to talk to it. REST is what determines how\
    \ the API looks. It is the rules that developers follow when they create an API.\
    \ One of these rules states that you should be able to get a piece of data (a\
    \ resource) when you link to specific URL. Each URL is called a request while\
    \ the data sent back to you is called a\n\n### RESTful Architecture\n- **Stateless:**\
    \ Meaning the client data is not stored on the server, the session is stored client-side\
    \ (typically in session storage).\n- **Client<->Server:** There is a separation\
    \ of concerns between the front-end (client) and the back-end (server). They operate\
    \ independently of each other and both are replaceable.\n- **Cache:** Data from\
    \ the server can be cached on the client, which can improve performance speed.\n\
    - **URL Composition:** We use a standardized approach to the composition of base\
    \ URLs. For example, a `GET` request to should yield all the cities in the database,\
    \ whereas a `GET` request to `/cities/seattle` would render the city with an ID\
    \ of Seattle. Similarly, REST utilizes standard methods like `DELETE` and `POST`\
    \ to perform actions.\n\nSo we can define a RESTful API as one that separates\
    \ concerns between allows caching of data client-side and utilizes standardized\
    \ base URLs and methods to perform the required to manipulate, add or delete data.\n\
    \n#### REST in action\nLet’s now take a closer look at how this is done! Our request\
    \ is sent from the client to the server via HTTP in the form of a web URL. Using\
    \ either `GET`, `POST`, `PUT` or `DELETE`. Then a response is sent back from the\
    \ server in the form of a resource, which could be anything like HTML, XML, Image,\
    \ or JSON. JSON is by far the most popular format, so we’ll be using that for\
    \ our example.\n\n![](image-t1b9wmt5.jpg)\nPhoto credit: https://antmedia.io\n\
    \nHTTP has five methods that are commonly used in a REST-based architecture: POST`,\
    \ `GET`, `PUT`, `PATCH`, and `DELETE`. In fact, they correspond to create, read,\
    \ update, and delete (CRUD) operations respectively. It should also be noted that\
    \ there are other methods that are less frequently used, such as `OPTIONS` and\
    \ `HEAD`.\n"
