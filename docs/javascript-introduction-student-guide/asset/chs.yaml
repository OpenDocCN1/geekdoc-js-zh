- "# JavaScript 入门指南：学生指南\n\n\n\n![image-Z6P2GTR7.jpg](img/image-Z6P2GTR7.jpg)![image-Z6P2GTR7.jpg](img/image-Z6P2GTR7.jpg)\n\
  \n\n# 简介\n\n学生指南\n\n术语表\n\n## 关于课程\n\n### 目标学生与先决条件\n本课程适用于具有良好 HTML 知识的学生。\n\n\
  ### 如何使用本书\n本书的设计旨在配合指导师的课程使用。它包含了各种课程，引导你学习课程内容。书中对主题进行了解释，包括逻辑概念的说明和示例。此外还包含了练习以巩固材料。这些练习是环环相扣。\n\
  \n书中附带了完成练习所需的文件。十二节课中的每课都包含三个文件夹：演示（Demos）、练习（Exercises）和解决方案（Solutions）。将这些文件夹放在桌面上以便访问文件。在某些情况下，演示文件与书中的代码片段并不完全相同，因为代码片段旨在让你关注核心代码，而演示文件夹中的实际\
  \ HTML 文件是一个完整的可运行的 HTML 页面。\n\n\n\n\n\n在书末，你将找到本课程所用术语的定义表。此外，还提供了一个索引，方便你快速找到所需的内容。\n\
  \n# 第 1 节：JavaScript 简介\n\n课时：75 分钟\n\n在本节中，你将学习到：\n\n1. JavaScript 版本\n2. 脚本术语\n\
  3. 语言基础\n4. 内置对象\n5. 用户输入方法\n\n## JavaScript 版本\n\n`JavaScript` 由 Brendan Eich 于\
  \ 1995 年在 Netscape Navigator 中创建。它的开发是为了与 HTML 页面进行交互。它最初被称为 Mocha，随后在更名为 `JavaScript`\
  \ 之前被称为 LiveScript。\n\n`JavaScript` 是一种解释型脚本语言，而不是编译型编程语言。\n\n`ECMAScript` 是几种类似的客户端脚本语言的标准化规范，包括\
  \ `JavaScript` 和微软的实现版本 `JScript`。1999 年，`ECMAScript` 的第 3 版增加了正则表达式和 `try/catch`\
  \ 语句。2009 年，第 5 版增加了严格模式。`ECMAScript` 第 6 版引入了重大的新语法，包括类似 Python 的特性。`ECMAScript`\
  \ 第 6 版于 2015 年 6 月发布，但浏览器尚未完全支持。本课程将重点关注第 5.1 版。\n\n由于对富媒体网络应用和 AJAX 的贡献，`JavaScript`\
  \ 近年来越来越流行。这导致了 `JavaScript` 库的增加，例如用于文档对象模型 (`DOM`) 脚本的 `jQuery`，以及 JavaScript\
  \ 视图控制器 (`MVC`) 框架如 `AngularJS` 和 `Backbone.js`。`JavaScript` 的主要用途是通过用户事件操作 `DOM`，提供即时交互并减轻服务器的负担。`JavaScript`\
  \ 也用于 HTML5 应用程序接口 (`APIs`)。\n\n每个浏览器都有自己的解释 `JavaScript` 的引擎，这有时会导致浏览器在解释 `JavaScript`\
  \ 的方式上存在差异。一些 `JavaScript` 库提供了抽象层，在后台处理浏览器差异。\n\n`JavaScript` 不仅用于 浏览器。`MongoDB`\
  \ 和 `CouchDB` 是两个使用 `JavaScript` 作为查询语言的数据库。`Node.js` 是一个允许 `JavaScript` 越浏览器的平台，甚至被用于创建动态\
  \ HTTP 服务器。\n\n### 创建你的第一个 JavaScript 页面\n\n`JavaScript` 可以以两种方式添加到 HTML 页面中。它可以添加到\
  \ HTML 页面内部的 `<script>` 标签之间，也可以放在一个只包含 `JavaScript` 的单独文件中。大多数应用程序将使用单独的 `JavaScript`\
  \ 文件。使用单独的文件允许开发者高效地重复复用和更新脚本。它还允许浏览器缓存脚本。\n\n#### 练习 1-1 为你的页面添加脚本\n\n完成下面的练习，使用标签和单独的文件为你的页面添加一个脚本。\n\
  \n1. 在编辑器中，打开 `Lesson 1/Exercises/exercise1-1.html`。\n2. 在 `<head>` 中添加一组 `<script>`\
  \ 标签。\n3. 在 `<script>` 标签内部，添加 `document.write(\"Hello!<br>\");`。\n4. 保存 `exercise1-1.html`。\n\
  5. 在浏览器中打开该文件。\n6. 在编辑器中打开 `exercise1-1.html`。\n7. 仅将 `<script>` 标签之间的 `JavaScript`\
  \ 代码移动到单独的文件。\n8. 将文件保存为 `exercise1-1.js` 并存放在 `Lesson 1/Exercises/js` 文件夹中。\n9.\
  \ 在 `exercise1-1.html` 文件中，为`<script>` 标签添加 `src` 属性，使用相对路径引用外部的 `exercise1-1.js`\
  \ 文件。\n10. 保存 `exercise1-1.html`。\n11. 在浏览器中打开。\n12. 它看起来应该和第 5 步一样。\n\n### 脚本术语\n\
  \n在我们开始之前，我们需要涵盖一些术语以辅助学习过程。\n\n#### 表达式 (Expression)\n\n在脚本或编程中，表达式产生一个值。任何以字面量编写的值（如数字或字符串）都是表达式。\n\
  \n表达式可以给变量赋值，或者仅仅拥有一个值。`JavaScript` 表达式可以求值为数字、字符字符串或真/假。\n\n下面是一个算术表达式的示例。在没有赋值的情况下，它的求值是\
  \ 3。\n\n```javascript\n1 + 2;\n```\n\n#### 变量 (Variable)\n\n变量捕并持有值。它可以被更新。\n\n\
  #### 运算符 (Operators)\n\n运算符分为一元、二元或三元，对应一个、两个或三个操作数。运算符可以是不同的类型，包括算术、字符串、逻辑、赋值和比较。大多数\
  \ `JavaScript` 运算符是二元的，要求在运算符的两侧都有一个操作数。\n\n在这个示例中，赋值运算符 `=` 是二元运算符，加法运算符 `+` 也是。\n\
  \n```javascript\nvar x = 1 + 2;\n```\n\n操作数是表达式中被运算符处理的部分。上面，数字 1 和 2 以及变量 `x` 就是操作数。\n\
  \n还有一些一元运算符，操作数位于运算符的左侧或右侧。减号 `-` 可以在二元运算中从一个数字减去另一个数字，也可以在一元运算中对一个值取反。\n\n```javascript\n\
  var x = -3; //x 是负 3\n```\n\n`JavaScript` 有一个三元运算符，在三个操作数之间有两个运算符。它是真/假测试的快捷方式，稍后将进行演示。\n\
  \n#### 语句 (Statement)\n\n语句可以由表达式、变量和运算符组成。语句是一个包含表达式的完整指令，由网络浏览器执行。语句应该用分号分隔。\n\
  \n```javascript\nvar x = 1 + 2; // 语句\nx = 3; // 语句（缺少分号）\n1 + 2; // 不是语句\n```\n\
  \n### 语言基础\n\n本节将向你介绍 `JavaScript` 语法。\n\n#### 声明变量\n\n在 `JavaScript` 中，变量是局部或全局的。局部变量用\
  \ `var` 关键字声明。未声明的变量默认是全局的。在函数内部声明的变量是局部的。`JavaScript` 通常具有关联性。\n\n下例示例声明了变量 `x`。\n\
  \n```javascript\nvar x;\n```\n\n声明的变量 `x` 稍后可以赋值。\n\n```javascript\nx = 1 + 2;\n\
  ```\n\n可以使用 `var` 关键字在一行内声明并赋值：\n\n```javascript\nvar y = 10 * 2;\n```\n\nJavaScript\
  \ 有 C 风格的快捷方式：`+=`、`-=`、`*=`、`/=` 和 `%=`。以下是赋值选项。\n\n// 将字符串 \"hello\" 赋值给变量\n```javascript\n\
  var str = \"hello\";\n```\n\n// 将 \"world\" 连接到变量\n```javascript\nstr += \"world\"\
  ;\n```\n\n// += 是快捷方式\n```javascript\nstr = \"hello\";\nstr = str + \"world\";\n\
  ```\n\n```javascript\nvar x = 5;\n```\n```javascript\nx *= 10;\n```\n\n//* *= 是快捷方式\n\
  ```javascript\nx = 5;\nx = x * 10;\n```\n\n#### 大写敏感\n\n`JavaScript` 是大小写敏感的。变量、内置对象、关键字、函数和方法必须使用正确的大小写。\n\
  \n`JavaScript` 的约定是使用驼峰法来命名标识符（变量和函数）。JavaScript 的驼峰法是将多个单词放在一起并将第一个单词以外的所有字母大写：\n\
  \n```javascript\nvar userName = \"\";\nfunction calculateTotalProfits(){}\n```\n\
  \n匈命名法也很流行，标识符的名称指示其类型和/或用途。\n\n```javascript\nvar intAge = 100; // 整数\nvar strDept\
  \ = \"IT\"; // 字符串\nvar boolFullTime = true; // 布尔值\nvar arrEmployeeList = []; //\
  \ 数组\n```\n\n注意使用驼峰法不是强制的，匈命名法并没有设置数据类型，它指示预期的数据类型。在 `JavaScript` 中，数据类型会随上下文改变；没有办法强制标识符始终是某种数据类型。\n\
  \n#### 空格和结束语句\n\n在 `JavaScript` 中，分号结束一个语句。`JavaScript` 非常灵活，因此缺少分号通常不会引起错误。\n\n\
  标记（运算符和操作数）之间的空格并不重要。如果语句在标记之间断开，可以延续到下一行，但字符串不能跨行。\n\n\n\n\n\nJavaScript 使用两种 C\
  \ 风格的注释：单行注释和多行块注释。注释可用于调试或编写代码文档。单行注释使用两个斜杠（`//`）并一直注释到行尾。多行注释位于 `/* */` 之间。最佳实践是仅将多行注释用于作者和许可信息。\
  \ \n\n### 数据类型\n\nJavaScript 有基本/原始数据类型：`number`、`string` 和 `Boolean`。它有两个特殊类型：`null`\
  \ 和 `undefined`。它还有两种复合类型：`array`（数组）和 `object`（对象），它们由原始值或其他复合值组成。还有一些特殊的对象类型，如\
  \ `functions`（函数）、`RegExp` 和 `Date()`。由于 JavaScript 具有动态类型，变量在脚本过程中可以是不同的类型。`typeof`\
  \ 运算符可以帮助确定值的数据类型。\n\n```\nvar x = 10; //x 是一个数字\nalert(typeof x);\n\nvar y = x\
  \ + 20; //30，因为类型原因相加\nalert(typeof y);\n\nvar x = \"User\"; //x 是一个字符串\nalert(typeof\
  \ x);\n\nvar y = x + 1; //User1，因为类型原因进行拼接\nalert(typeof y);\n```\n\n### 数值变量\n\n\
  在 JavaScript 中，数值可以是整数（整数字）或浮点数。大数字可以使用 `\"e\"` 后跟数字的指数来创建。\n\n```\n10e2 //10 乘以\
  \ 10 的 2 次方是 1000\n```\n\n整数计算的精确度可以达到 900 万亿（9 quadrillion）。浮点数计算并不总是精确的，因此它们应该被视为一种近似值。\n\
  \n`toPrecision()` 方法将数字格式化为指定的长度。它接受一个有效数字位数作为参数，并用于获取更符合用户习惯的数字。参数是小数点前后数字的总数。\n\
  \n`toFixed()` 接收一个数字并将其转换为小数点后指定的数字位数。\n\n### 算术运算符\n\n算术运算符包括乘法（`*`）、除法（`/`）、加法（`+`）和减法（`-`）。还有一个模运算符（`%`），用于返回余数。乘法、除法和取模的优先级高于加法和减法。和数学一样，运算符优先级可以通过括号更改。\n\
  \n```\nx % y //返回 x 除以 y 的余数\n```\n\n加号（`+`）是重载的，因此它可以用于加法也可以用于字符串拼接。如果任何操作数是字符串，加号就会起起到拼接的作用。\n\
  \n### 函数\n\n有三个函数可以将字符串转换为数字类型。它们可以用于确保执行加法而非拼接。以下是每个每个函数的简要说明。\n\n`parseInt()`\
  \ 会在字符串开头搜索整数。\n```\nparseInt(\"2\"); //返回 2\nparseInt(\"2.5\"); //返回 2\n```\n\n\
  `parseFloat()` 会在字符串开头搜索浮点数。\n```\nparseFloat(\"2.5\"); //返回 2.5\nparseFloat(\"\
  4.5%\"); //返回 4.5\n```\n\n`Number()` 尝试将值转换为数字。如果无法转换，它将返回 `NaN`（不是数字）。\n```\nNumber(\"\
  2\"); //返回 NaN\nNumber(\"\"); //返回 0\n```\n\n当 `+`（加号）出现在值之前时，它会将字符串转换为等同于 `Number()`\
  \ 函数的数字。\n```javascript\n+\"100\" //返回数字类型的 100\nx = -20;\ny = -x //y 是负 20\n```\n\
  \nJavaScript 有三个属于数字类型但行为不像数字的特殊值：`Infinity`、`-Infinity`（负无穷）和 `NaN`（“不是数字”）。在许多语言中，除以零会导致错误，但在\
  \ JavaScript 中它返回 `Infinity`、`-Infinity` 或 `NaN`。\n\n### 字符串变量\n\n字符串是文本或字符串。人的电话号码或邮政编码可能包含数字，但数据类型将是字符串。字符串必须由引号括定，但单引号还是双引号并不重要。由于\
  \ JavaScript 的灵活性，可以通过包含在引号中将值转换为字符串。可以使用反斜杠（`\\`）在字符串中直接添加换行符。换行或制表符等字符会在 `alert()`、`prompt()`\
  \ 和 `confirm()` 中显示，但不会 `console` 中显示。\n\n```javascript\nalert(\"这是第一行。\\n 这是另一行.\"\
  );\nalert(\"这些是用 \\t 分隔的\");\n```\n\n`+` 运算符拼接字符串，将两个或多个字符串合并为一个。字符串必须始终在引号内，但标识符（如变量、对象名和数组名）不能包含。字符串数据类型具有属性和若干方法，稍后将探讨。\n\
  \n### 练习 1-2 数字和字符串类型\n\n此练习将允许你探索已回顾的数据类型。你可以使用 JavaScript 的 `console` 作为命令行完成这些练习。\n\
  \n- 实验加号 `\"3\" + 3`。返回了什么？为什么？\n- 计算 `0.4 + 0.2`。答案如你预期的吗？\n- 尝试使用 `toPrecision()`\
  \ 方法计算 `0.4 + 0.2`。设置 `num = 0.4 + 0.2`，然后使用 `num.toPrecision(1)`。\n- 将 `num` 设置为\
  \ `100`。`num.toFixed(2)` 做了什么？\n- 使用模运算 `4 % 2`、`4 % 3` 和 `3 % 4`。结果如你预期的吗？你可以如何使用它？\n\
  - 查看 `Number()` 和 `parseInt()` 函数之间的区别，通过传递字符串 `\"3\"` 和空字符串 `\"\"`。\n- 设置 `var\
  \ x = 12 / 0;` 查看 `x` 返回什么。是什么数据类型？提示：使用 `typeof x`。现在对 `0 / 0` 执行同样操作。\n- 使用 `alert()`\
  \ 打印带有换行符的 \"hello world\"。提示：从 `alert(\"hello world\")`。\n\n### 布尔变量\n\n布尔类型的两个值为\
  \ `true` 和 `false`。注意引号中的 `\"true\"` 或 `\"false\"` 是字符串，不是布尔值。比较逻辑运算符的目的是返回布尔值。\n\
  \n比较运算符有大于（`>`）、小于（`<`）、大于等于（`>=`）、小于等于（`<=`）、相等（`==`）、不相等（`!=`）、严格相等（`===`）和严格不相等（`!==`）。\n\
  \n在相等（==）或不相等测试中，对值进行测试。在标识测试（`===` 或 `!==`）中，对值和类型进行测试。确保使用 `==` 或 `===` 进行比较，而不是用于赋值的等号。\n\
  \n```\n4 == \"4\"; //true，值相同\n4 === \"4\"; //false，类型不同\n```\n\nJavaScript 有三个逻辑运算符：与（`&&`）、或（`||`）和非（`!`）。它们通常与比较运算符一起使用。所有侧都为真，`&&`\
  \ 才返回真。只要有一侧为真，`||` 就返回真。使用逻辑非（`!`）运算符反转逻辑。\n\n运算符优先级决定了运算符的顺序。比较运算符在逻辑运算符之前。逻辑与（`&&`）的优先级高于逻辑或（`||`），逻辑非（`!`）的优先级高于两者。括号不是必须的，但可以让代码更易读。比较和逻辑运算符通常用于\
  \ `if` 语句。\n\n`&&` 和 `||` 可用于短路求值。\n\n```javascript\n//如果 fName 未定义则分配 \"anonymous\"\
  \n// fName 必须声明才能工作\nvar fName;\nuser = fName || \"anonymous\"\nfName && alert(\"\
  Hi \" + fName);\n```\n\n\n\n\n\n`Math` 对象用于超出基础算术的计算。属性包括 `PI` (``3.141592653589793`),\
  \ 方法包括 `round()`、`ceil()`、`floor()`、`random()`、`min()` 和 `max()`。\n\n`round()` 将数值舍入到最近的整数。如果小数部分为\
  \ `.5` 或更大，它将进位到下一个整数。\n\n`ceil()` 将数值向上取整到下一个整数。\n\n`floor()` 始终向下取整。\n\n`random()`\
  \ 不接受任何参数，返回一个 0 到 1 之间的数字（不包含 1）。\n\n`min()` 返回一组数字中的最小值。\n\n`max()` 返回一组数字中的最大值。\n\
  \n```javascript\n//demodemo1-1.html\n\n//document.write 将内容写入网页\n\ndocument.write(Math.ceil(4.2));//5\n\
  document.write(Math.floor(4.9));//4\ndocument.write(Math.round(4.5));//5\n\n// 0\
  \ – 1 之间的随机数（不包含 1）\n//刷新页面获取新的随机数\ndocument.write(Math.random());\n```\n\n## 日期\
  \ (Date)\n\nJavaScript 的 `Date()` 对象基于 Unix 戳：1970 年 1 月 1 日。\n\n`Date()` 是一个构造函数对象，必须使用\
  \ `new` 运算符创建日期。`Date()` 构造函数可以为空、接受一个字符串，或接受用逗号分隔的一到七个数字。空的 `Date()` 构造函数返回当前时间戳。要使用\
  \ `Date` 的方法之一，请先创建一个 `Date` 实例。\n\n```javascript\n//demo1-2.html\n\nvar today =\
  \ new Date();\n\ndocument.write(today);\n```\n\n如果你传递一个数字，`Date()` 构造函数将其读取为自 Unix\
  \ 戳以来的毫秒数。传递二到七个参数将变为年、月、日、小时、分钟、秒、毫秒以创建一个日期。当传递两个或多个参数时，第一个参数将变为年份，而不是自戳以来的毫秒数。\n\
  \n实用的 `Date` 方法包括 `getFullYear()`、`getDate()`、`getMonth()`、`getDay()`、`getHours()`、`getTime()`、`getMinutes()`\
  \ 和 `getSeconds()`。\n\n`getFullYear()` 返回日期的 4 位年份部分。\n\n`getDate()` 返回日期的日期部分——值从\
  \ 1 到 31。\n\n`getMonth()` 返回一个 0 – 11 的索引数字，代表月份，0 代表 1 月。\n\n`getDay()` 返回一个 0\
  \ – 6 的索引数字，代表星期几，0 代表星期日。\n\n`getTime()` 方法通过自戳以来的毫秒数显示日期。你可以使用此来计算两个或多个日期之间有多少天、几周或几个月。\n\
  \n```javascript\n//demo1-3.html\n\nvar today = new Date();\n\ndocument.write(today.getTime());\n\
  ```\n\nJavaScript 还有 `Date` 方法 `setFullYear()`、`setDate()`、`setMonth()`、`setHours()`、`setMinutes()`\
  \ 和 `setSeconds()`。`setMonth()` 接受从 0 开始的索引数字。\n\n```javascript\n//demo1-4.html\n\
  \nvar birthday = new Date();\n\nbirthday.setMonth(11);\n\ndocument.write(birthday);\n\
  //12 月的时间戳，当前日期/年份\n```\n\n`setTime()` 方法接受自戳以来的毫秒数。对于标点时间之前的日期，它接受负数。\n\n```javascript\n\
  //demo1-5.html\n\nvar prevDate = new Date();\n\nprevDate.setTime(-1000000000000)\n\
  \ndocument.write(prevDate);\n//Sun Apr 24 1938 17:13:20 GMT-0500 (CDT)\n```\n\n\
  ## 用户输入方法 (User input methods)\n\n`window` 对象有三个方法：`alert()`、`confirm()` 和 `prompt()`。后两个可以获取用户输入。因为它们是\
  \ `window` 对象的方法，所以它们不能设置样式；由浏览器决定它们的外。\n\n`alert()` 接受一个参数，因此如果有多个数据，必须在作为参数传递之前对其进行拼接。\n\
  \n`confirm()` 接受一个参数并返回 `Boolean` 布尔值数据类型。\n\n`prompt()` 接受两个参数，一个问题和一个默认答案，并返回一个字符串数据类型。\n\
  \n用户还可以通过填写表单向网页输入数据，或通过点击等用户事件与网页交互。这两个概念将在稍后详细介绍。\n\n```javascript\n//demo1-6.html\n\
  \nalert(\"你好!\");\n\nprompt(\"你多大了？\", \"\");\n\nconfirm(\"你确定吗?\");\n```\n\n###\
  \ 练习 1-3 内置的 Date() 对象\n\n通过此练习，你将确定两个日期之间的天数。\n\n使用你的编辑器，创建一个名为 `exercise1-3.js`\
  \ 的文件。\n\n将其保存到 `Lesson 1/Exercises/js` 中。\n\n使用 `new Date()` 获取当前日期。\n\n询问用户他们的下一个生日。\n\
  \n参考 `Lesson 1/Exercises/exercise1-3.js` 看看如何实现。\n\n## 第 2 ：条件 (Conditions)\n\n\
  在本节中，你将学习：\n1. `if` 结构\n2. `else` 结构\n3. `else if` 结构\n4. `switch` 结构\n5. 三元运算符\
  \ `?:`\n\n## if 结构 (The if Construct)\n\n`if` 接受一个参数，因此如果有多个数据，必须在作为参数传递之前对其进行拼接。\n\
  \n`if` 结构条件为真时执行。\n\n```javascript\nif (condition) {\n  statement\n}\n```\n\n###\
  \ else 结构 (The else Construct)\n\n当 `if` 条件为假时，执行 `else` 部分。\n\n```javascript\n\
  if (condition) {\n  statement\n} else {\n  statement\n}\n```\n\n### else if 结构 (The\
  \ else if Construct)\n\n当之前的 `if` 条件为假时，执行 `else if`。\n\n```javascript\nif (condition)\
  \ {\n  statement\n} else if (condition) {\n  statement\n}\n```\n\n### 测试多个条件 (Testing\
  \ Multiple Conditions)\n\n当需要更多选择时，可以添加任意数量的 `else if` 结构。`else if` 只有在之前的 `if`\
  \ 或 `else if` 为假时才执行。`else` 在所有之前的条件都不为真时执行。\n\n```javascript\nif (condition) {\n\
  \  statement;\n} else if (condition) {\n  statement;\n} else {\n  statement;\n}\n\
  ```\n\n### 三元运算符 (The ternary operator)\n\n三元运算符可以是 `if-else` 的简写形式。\n\n```javascript\n\
  result = condition ? expression1 : expression2;\n```\n\n### switch 结构 (The switch\
  \ Construct)\n\n当有多个可能的值需要进行比较时，可以使用 `switch`。\n\n```javascript\nswitch (expression)\
  \ {\n  case value1:\n    statement;\n    break;\n  case value2:\n    statement;\n\
  \    break;\n  default:\n    statement;\n}\n```\n\n### 练习 2-1 使用 if 结构 (Exercise\
  \ 2-1 Using the if construct)\n\n此练习将使用 `if` 结构对输入进行验证。\n\n使用你的编辑器，创建一个名为 `exercise2-1.js`\
  \ 的文件。\n\n将其保存到 `Lesson 2/Exercises/js` 中。\n\n询问用户工作时长和工资。提示：使用两次 `prompt()`。\n\n\
  假设员工工作 1-80 小时，工资在 1 到 100 美元之间，如果用户输入的数字超出范围，则说明输入误了。使用 `if` 测试用户是否输入了正确范围，如果不是则再次询问。\n\
  \n询问用户他们是否为全职员工。提示：使用 `confirm()`。它返回 `true` 或 `false`。\n\n计算他们本周赚了多少。如果他们不是全职且工作超过了\
  \ 40 小时，则加班部分支付一倍半工资。\n\n使用 `document.write(variable);` 打印到页面。\n\n将 JavaScript 文件引用到\
  \ `Lesson 2/Exercises/exercise2-1.html` 并测试。\n\n\n\n\n`switch` 结构用于在多个要执行的代码块中进行选择。与\
  \ `if/else if` 结构不同，`switch` 表达式（可以变量）只求值一次。\n\n`switch` 结构中表达式的值将与每个 `case` 的值进行比较。每个\
  \ `case` 值以冒号结尾。如果值匹配某个 `case`，则执行与该 `case` 关联的代码块。`default` 语句不是必须的，但它用于指定在没有匹配时运行的代码。它类似于\
  \ `else`。\n\n关键字 `break;` 用于跳出 `switch` 块。当找到 `case` 匹配且不再需要继续测试时，使用它。在 `switch`\
  \ 的最后一条语句中不需要 `break;`。\n\n```\nswitch (expression) {\n  case value1:\n    statement;\n\
  \    break;\n  case value2:\n    statement if previous case false;\n    break;\n\
  \  default:\n    statement if previous case false;\n    //break; not necessary at\
  \ the end\n}\n```\n\n如果没有 `break`，不同的 `case` 将发生“贯穿”并执行相同的代码。有时这可以化为有利。\n\n```\n\
  switch (expression) {\n  case value1:\n  case value2:\n    statement to run for\
  \ both cases;\n    break;\n  default:\n    statement to run if previous false;\n\
  }\n```\n\n```javascript\nvar day = \"Monday\";\nswitch (day) {\n  case \"Saturday\"\
  :\n  case \"Sunday\":\n    msg = \"It’s a weekend!\";\n    break;\n  default:\n\
  \    msg = \"It’s a weekday.\";\n}\n```\n\n### 练习 2-2 使用 switch\n\n在本次练习中，你将使用 `switch`\
  \ 结构。\n\n- 使用你的编辑器，创建一个名为 `exercise2-2.js` 的文件。\n- 将文件保存到 `Lesson 2/Exercises/js`\
  \ 中。\n- 要求用户输入一个字母表中的字母。\n- 使用 `switch` 判断该字母是辅音还是元音。\n- 使用 `document.write()` 打印它是辅音还是元音。\n\
  - 在 `Lesson 2/Exercises/exercise2-2.html` 中添加 JavaScript 文件的引用并进行测试。\n\n### 条件运算符（三元运算符）\n\
  \n条件运算符 `(?:?)` 是 JavaScript 中唯一接受三个操作数（三元）的运算符。它被用作 `if/else` 结构的快捷方式。第一个操作数必须求值为真或假。表达式的值可以是任何类型。\n\
  \n`condition ? expression1 : expression2;`\n\n如果 `condition` 为真，则三元运算符返回 `expression1`（即\
  \ `?` 之后的值）。否则，它返回 `expression2`（即 `:` 之后的值）。返回的结果可以输出、赋值给变量或打印。\n\n```javascript\n\
  var result = condition ? expression1 : expression2;\ndocument.write(condition ?\
  \ expression1 : expression2);\n```\n\n要要执行多个操作，请用逗号分隔。\n\n`condition ? operation1,\
  \ operation2 : operation3, operation4;`\n\n```javascript\nvar numOfApples = 4;\n\
  var apples = numOfApples == 1 ? //condition\n  \"There is \" + numOfApples + \"\
  \ apple \" : //op. if true\n  \"There are \" + numOfApples + \" apples \"; //op.\
  \ if false\ndocument.write(apples);\n```\n\n### 练习 2-3 使用三元运算符\n\n将三元运算符作为 `if/else`\
  \ 的快捷方式。\n\n- 使用你的编辑器，创建一个名为 `exercise2-3.js` 的文件。\n- 将文件保存到 `Lesson 2/Exercises/js`\
  \ 中。\n- 要求用户输入一个不带美元符号的价格。\n- 如果价格超过 100 美元，将应用 10% 的折扣。\n- 使用三元运算符判断是否应用了折扣。\n\
  - 使用 `document.write()` 打印总价以及是否应用折扣。\n- 在 `Lesson 2/Exercises/exercise2-3.html`\
  \ 中添加 JavaScript 文件的引用并进行测试。\n\n# 第 3 节：JavaScript 循环\n\n**单元时间：** 75 分钟\n\n在本节中，你将学习：\n\
  1. JavaScript 循环\n2. JavaScript 标签和分支语句\n\n## JavaScript 循环\n\nJavaScript 有三种 C\
  \ 风格的循环，而 `do…while` 和 `for`。此外，JavaScript 还有一个 `for…in` 循环，用于迭代遍历对象的可枚举属性。\n\n\
  循环用于根据需要多次测试特定条件，或者重复执行代码特定次数。它们经常被用于遍历数组或对象，或者验证表单元素。\n\n### while 循环\n\n`while`\
  \ 循环是一种预测试循环，在循环运行之前测试条件。`while` 循环中的代码块只要条件为真就会一直执行。当条件表达式返回假时，循环停止。\n\n```javascript\n\
  while (condition) {\n  statements to run if condition is true;\n}\n```\n\n与 `if`\
  \ 结构一样，如果只有一条语句，可以省略大括号，但最好使用它们。\n\n如果条件表达式永远不会变为假，循环将永远不会结束，导致死循环。\n\n//demo3-1.html\n\
  ```javascript\nvar x = 0;\nwhile (x < 10) {\n  document.write(x);\n  document.write(\"\
  <br>\");\n  x++; //增加 1 以在 10 结束\n}\n```\n\n当条件为假时，`while` 循环不执行。\n\n```javascript\n\
  var x = 10;\nwhile (condition) {\n  document.write(x);\n  x++;\n}\n```\n\n### 练习\
  \ 3-1 使用 while 循环\n\n在本次练习中，你将使用 `while` 循环。\n\n- 使用你的编辑器，创建一个名为 `exercise3-1.js`\
  \ 的文件。\n- 将文件保存到 `Lesson 2/Exercises/js` 中。\n- 假设有一个变量 `x = 0`。\n- 使用 `while` 循环，当\
  \ `x` 小于 10 时打印 `x` 并换行。\n- 每次将 `x` 增加 1，以便在 10 时结束。\n- 在 `Lesson 2/Exercises/exercise3-1.html`\
  \ 中添加 JavaScript 文件的引用并进行测试。\n\n### do…while 循环\n\n`do…while` 循环是一种后测试循环，在循环运行之后测试条件。`do…while`\
  \ 循环中的代码块至少执行一次。当条件返回假时，循环停止。\n\n```javascript\ndo {\n  statements to run if condition\
  \ is true;\n} while (condition);\n```\n\n与 `while` 结构一样，如果只有一条语句，可以省略大括号。\n\n如果条件表达式永远不会变为假，循环将永远不会结束，导致死循环。\n\
  \n//demo3-2.html\n```javascript\nvar x = 0;\ndo {\n  document.write(x);\n  document.write(\"\
  <br>\");\n  x++; //增加 1 以在 10 结束\n} while (x < 10);\n```\n\n即使条件一开始为假，`do…while`\
  \ 循环也会执行一次。\n\n```javascript\nvar x = 10;\ndo {\n  // statements\n} while (condition);\
  \ \n```\n\n### 练习 3-2 使用 do…while 循环\n\n在本次练习中，你将使用 `do…while` 循环。\n\n- 使用你的编辑器，创建一个名为\
  \ `exercise3-2.js` 的文件。\n- 将文件保存到 `Lesson 2/Exercises/js` 中。\n- 假设有一个变量 `x = 0`。\n\
  - 使用 `do…while` 循环，当 `x` 小于 10 时打印 `x` 并换行。\n- 每次将 `x` 增加 1，以便在 10 时结束。\n- 在 `Lesson\
  \ 2/Exercises/exercise3-2.html` 中添加 JavaScript 文件的引用并进行测试。\n\n### for 循环\n\n`for`\
  \ 循环与 `while` 循环最相似。如果条件初始为真，它将运行语句块，直到条件为假。`for` 循环在括号中有三个部分，用分号分隔。第一部分是计数变量的声明。第二部分是决定是否运行循环的条件表达式。最后一部分重置初始变量，通常是增加或减少计数器。`for`\
  \ 循环的最后部分没有分号。\n\n```javascript\nfor (initialize; condition; increment/decrement)\
  \ {\n  statements;\n}\n```\n\n如果只有一条语句，`for` 循环也可以省略大括号。\n\n与其他循环一样，忽略未修改初始变量会导致死循环。\n\
  \n//demo3-4.html\n```javascript\nfor (var x = 0; x < 10; x++) {\n  document.write(x)\n\
  }\n```\n\n### for…in 循环\n\n`for…in` 循环用于遍历数组或对象，将在“复合数据类型”课程中进行详细介绍。关键字是 `for` 和\
  \ `in`。下面，`property` 是代表对象属性的变量，`object` 是对象或数组的名称。\n\n`for…in` 循环不使用数字计数器。\n\n\
  ```javascript\nfor (property in object) {\n  document.write(property + object[property]);\n\
  }\n```\n\n与其他结构一样，如果只有一条语句，可以省略大括号。\n\n\n\n\n\n# JavaScript 标签与分支语句\n\n在 JavaScript\
  \ 中，`break;` 和 `continue;` 可以作为分支语句。它们可以带标签使用也可以不带标签使用。它们决定了程序下一步应该执行哪些代码。标签（label）是任何后面带有冒号的标识符。分支语句\
  \ `break;` 和 `continue;` 可用于循环中转移程序控制流。\n\n## 使用 `break;` 语句\n\n`break;` 语句终止循环（或\
  \ switch），跳转到循环或 switch 之外的下一个语句。\n\n```javascript\n//demo3-5.html\nfor (var x =\
  \ 1; x <= 10; x++) {\n  if (x % 5 == 0) {\n    break; //运行到能被 5 整除为止\n  }\n  document.write(x);\n\
  }\n```\n\n### 在嵌套循环中，`break;` 终止当前循环。\n\n```javascript\n//demo3-6.html\nvar i =\
  \ 0;\n//运行 3 次，在数字 4 处跳出\nwhile (i < 3){\n  for (x = 1; x <= 10; x++) {\n    if\
  \ (x % 5 == 0) {\n      break;\n    }\n    document.write(x);\n  }\n  i++;\n}\n\
  ```\n\n`break;` 可以将程序控制权传递给标签。在这个示例中，当 `for` 循环达到数字 4 时，由于开发者创建了 `outerLoop:` 标签，程序控制权传递到了外部的\
  \ `while` 循环。\n\n```javascript\n//demo3-7.html\nvar i = 0;\n//运行一次，在数字 4 处跳出\nouterLoop:\
  \ while (i < 3){\n  for (x = 1; x <= 10; x++) {\n    if (x % 5 == 0) {\n      break\
  \ outerLoop; //标签\n    }\n    document.write(x);\n  }\n  i++;\n}\n```\n\n### 使用\
  \ `continue` 语句\n\n`continue;` 语句终止当前迭代的循环执行，并继续下次迭代。一旦执行了 `continue;` 语句，其下语句将被跳过。在下方，如果数字不能被\
  \ 5 整除，则跳转到循环的下次迭代。只有被 5 整除的数字会被打印。\n\n```javascript\n//demo3-8.html\nfor (var x\
  \ = 0; x <= 10; x++) {\n  if (x % 5 != 0) {\n    continue;\n  }\n  document.write(x);\
  \ //如果被 5 整除\n}\n```\n\n也可以用 `continue;` 语句将程序控制权传递给标签。\n\n## 练习 3-3 使用分支语句\n\n\
  使用分支语句来操作程序控制流。\n\n使用你的编辑器创建一个名为 `exercise3-3.js` 的文件。\n\n将文件保存到 `Lesson 3/Exercises/js`。\n\
  \n生成一个 1 到 10 之间的随机数。提示：使用 `Math.random()`。\n\n给用户三次机会猜数字。如果他们猜中了，给他们一条“恭喜”消息，并告诉他们花了多少次猜。\n\
  \n如果用户在三次机会用完之前猜中了，你应该对循环做什么？\n\n给用户提供通过输入“Q”（不区分大小写）来退出猜游戏的机会。\n\n如果他们三次尝试都没有猜中正确数字，打印该随机数。\n\
  \n在 `Lesson 3/Exercises/exercise3-3.html` 中添加对 JavaScript 文件的引用并进行测试。\n\n# 第 4 节：基本数据类型\n\
  \n单元时间：75 分钟\n\n在本节中，你将学习：\n1. `String` 数据类型\n2. `Number` 数据类型\n\n## String 数据类型\n\
  \n字符串是由双引号或单引号界定的字符序列，用于文本的表示。字符串字面量是一种基本类型，类似于数值或布尔值。字符串上的一些常用操作包括检查其长度、连接（拼接）、搜索字符或提取子字符串。\n\
  \n```javascript\nvar str = \"hello world\";\n```\n\n在需要时，基本类型会被转换为字符串对象，因此包含字符串字面量的变量可以使用属性和方法。`String()`\
  \ 有利于将另一种数据类型转换为字符串，以便你可以使用属性和方法。`String()` 构造函数创建一个字符串对象。\n\n```javascript\nvar\
  \ x = 100;\nvar str = String(x)\n```\n\n### String 属性\n\n字符串的 `length` 属性返回字符串的长度。\n\
  \n```javascript\n//demo4-1.html\nvar email = \"username@emaildomain.com\";\nvar\
  \ len = email.length;//返回 24\n```\n\n字符串可以是空的，在这种情况下它的长度为 0。\n\n```javascript\n\
  var str = \"\";\nvar strlen = str.length; //返回 0\n```\n\n### String 方法\n\n下面是某些用于操作数据类型的字符串方法的解释。\n\
  \n`charAt()`\n`charAt()` 方法接收一个索引数字并返回该索引处的字符。索引数字是介于 0 且小于字符串长度的整数。如果提供的索引大于字符串长度，则返回一个空字符串。\n\
  \n```javascript\n//demo4-2.html\nvar email = \"username@emaildomain.com\";\nvar\
  \ character = email.charAt(0); //返回 \"u\"\ndocument.write(character)\n```\n\n`indexOf()`\n\
  `indexOf()` 方法接收要搜索的字符（字符）和一个可选的起始索引数字。它返回一个从 0 到字符串长度减 1 的索引数字。如果未找到，则返回 -1。该方法是**区分大小写**的。\n\
  \n```javascript\n//demo4-3.html\nvar email = \"username@emaildomain.com\";\nvar\
  \ index = email.indexOf(\"u\"); //返回 0\ndocument.write(index)\n```\n\n`lastIndexOf()`\n\
  `lastIndexOf()` 方法返回字符串中字符最后一次出现的索引数字。如果未找到，则返回 -1。该方法是**区分大小写**的。\n\n```javascript\n\
  //demo4-4.html\nvar email = \"username@emaildomain.com\";\nvar index = email.lastIndexOf(\"\
  e\"); //返回 12\ndocument.write(index)\n```\n\n`split()`\n`split()` 方法根据分隔符将字符串拆分为子字符串数组。\n\
  \n```javascript\n//demo4-5.html\nvar strDays = \"Mon, Tues, Fri\";\nvar arrDays\
  \ = strDays.split(\", \"); //[\"Mon\", \"Tues\", \"Fri\"]\ndocument.write(arrDays);\n\
  ```\n\n`slice()` vs. `substring()` vs. `substr()`\n`slice()` 方法提取字符串的一部分。它接收一个起始索引和一个可选的结束索引数字。如果第二个参数省略，则提取到字符串末尾。`substring()`\
  \ 方法也接收起始索引和结束索引，如果起始索引大于结束索引，它会交换这两个参数。`substr()` 方法接收一个起始索引和一个可选的要提取字符个数。如果第二个参数省略，则提取到字符串末尾。\n\
  \n```javascript\n//demo4-6.html\nvar email = \"username@emaildomain.com\";\nvar\
  \ strSlice = email.slice(9, 15); //\"domain\"\nvar strSub = email.substring(9, 15);\
  \ //\"domain\"\nvar strSubstr = email.substr(9, 6); //\"domain\"\n```\n\n`trim()`\n\
  `trim()` 方法返回删除两端空格后的字符串，而不影响原始字符串。\n\n```javascript\n//demo4-7.html\nvar user =\
  \ \"  UserName \";\nvar trimUser = user.trim(); //\"UserName\"\ndocument.write(trimUser);\n\
  ```\n\n`toLowerCase()`\n`toLowerCase()` 方法将字符串转换为小写并返回结果。\n\n```javascript\n//demo4-8.html\n\
  var user = \"UserName\";\nvar lcUser = user.toLowerCase(); //username\ndocument.write(lcUser)\n\
  ```\n\n`toUpperCase()`\n`toUpperCase()` 方法将字符串转换为大写并返回结果。\n\n```javascript\n//demo4-9.html\n\
  var user = \"UserName\";\nvar ucUser = user.toUpperCase(); //USERNAME\ndocument.write(ucUser)\n\
  ```\n\n### 练习 4-1 使用字符串方法\n\n使用字符串方法和逻辑来验证输入的数据。\n\n使用你的编辑器创建一个名为 `exercise4-1.js`\
  \ 的文件。\n\n将文件保存到 `Lesson 4/Exercises/js`。\n\n要求用户输入电子邮件地址，并使用 `if...else/if...else`\
  \ 进行测试。\n\n记住，如果你在搜索字母，它是区分大小写的，但电子邮件地址不区分大小写。如果你要将其与字符串进行测试，将其转换为小写是很有用的。\n\n通过首先使用字符串的\
  \ `trim()` 方法去除空格，确保用户的输入不是空的。\n\n对电子邮件地址进行一些数据验证。\n\n如果小于 6 个字符，则不是有效的。测试它至少有 6\
  \ 个字符。\n\n电子邮件地址应该包含：\n- 一个 `@` 符号\n- 不一个 `@` 符号\n\n\n\n\n\n`@` 符号出现在第一个或最后一个字符以外的位置\n\
  \n不包含空格\n\n为无效的电子邮件地址创建一个错误消息。\n\n如果电子邮件地址有效，使用 `document.write()` 打印该消息。提取域名名并将其与消息一起打印。\n\
  \n在 `Lesson 4/Exercises/exercise4-1.html` 中添加对 JavaScript 文件的引用，并进行 `test`。对于电子邮件验证器，使用一个无效的电子邮件地址进行测试，以确保你能获取错误信息。\n\
  \n## 数字数据类型\n\n我们在之前的课程中看到了数字数据类型的一些特性。`Number` 对象还具有更多属性和函数。\n\n### Number 属性\n\
  \n静态属性 `Number.MAX_VALUE` 代表 JavaScript 中最大的正数。任何大于此值的数字都表示为 `Infinity`。\n\n- `-Number.MAX_VALUE`（前面带有负号）是离\
  \ 0 最远的负数。任何小于此值的数字都是 `–Infinity`。\n\n最接近 0 但不是 0 的最小正数是 `Number.MIN_VALUE`。任何比此小的正数都会转换为\
  \ 0。`-Number.MIN_VALUE` 是最接近 0 的最小负数。任何比此大的负数都会转换为 0。\n\n你必须在关键字 `Number` 上使用这些属性，而不是持有数字的变量。\n\
  \n```javascript\n//demo4-10.html\n\ndocument.write(Number.MAX_VALUE); // 正确用法\n\n\
  document.write(Number.MIN_VALUE); // 正确用法\n\nx = 10;\n\nx.MAX_VALUE; // 错误用法，返回\
  \ undefined\n```\n\n### Number 方法\n\n`toPrecision()` 和 `toFixed()` 是数字对象的方法。这些在第\
  \ 1 中讨论过。\n\n### 与数字使用的全局函数\n\n如第 1 节所示，`parseInt()` 和 `parseFloat()` 是解析字符串并返回数字的全局函数。JavaScript\
  \ 拥有接受任何数据类型参数并测试其是否为数字的全局函数。\n\n全局函数 `isNaN()` 测试参数是否不是数字。\n\n```javascript\nisNaN(\"\
  abc\"): //true\nisNaN(7): //false\n```\n\n全局函数 `isFinite()` 测试参数是否为有限值，且它必须是数字才是有限的。\n\
  \n```javascript\nisFinite(\"abc\"): //false\nisFinite(7): //true\n```\n\n但 `isFinite()`\
  \ 并不是 `isNaN()` 的真正反面。\n\n```javascript\nisNaN(12/0): //false，它是一个数字\nisFinite(12/0);\
  \ //值为 Infinity，所以为 false\n```\n\n确定一个值是否为数字的唯一准确方法是反转 `isNaN()` 的逻辑。\n\n```javascript\n\
  !isNaN(7); //true\n```\n\n# 第 5 节：复合数据类型\n\n单元时间：75 分钟\n\n在本节中，你将学习到：\n1. 对象数组\n\
  2. 使用 JSON 语法存储数据\n\n## 数组\n\n数字、字符串和 `Booleans` 是原始数据类型——程序的基础构建块。数组和对象是复合或组合数据类型，由原始数据类型和/或其它复合数据类型组成。\n\
  \n数组是一个枚举列表或数据集合，可以在一个名称下保存多个值。在 JavaScript 中，数组是一种特殊的对象类型。在数组中，每条数据都有一个对应的数字索引，用于访问该值。数组有一个属性和几个操作方法。\n\
  \n## 在数组中存储数据\n\n可以使用字面量语法使用方括号 (`[]`) 创建数组。\n\n```javascript\nvar fruits = [\"\
  banana\", \"orange\", \"apple\"];\n\ntypeof fruits; //object\n```\n\n数组是动态的，因此可以添加或删除元素。\n\
  \n```javascript\nvar fruits = []; // 声明数组 fruits\nfruits[0] = \"banana\";\nfruits[1]\
  \ = \"orange\";\nfruits[2] = \"apple\";\n```\n\n## 数组属性\n\n数组的 `length` 属性计算该点的元素数量。\n\
  \n```javascript\ndocument.write(fruits.length); //3\n```\n\n`length` 属性是通过最高索引加\
  \ 1 得到的，而不是通过计算值的数量。\n\n```javascript\nvar fruits = [];\n// 具有 2 个元素的非连续数组\nfruits[0]\
  \ = \"banana\";\nfruits[2] = \"apple\";\ndocument.write(fruits.length); //3\n```\n\
  \n可以使用索引数字访问特定元素。索引数字范围从 0 到 `array length - 1`。\n\n```javascript\nfruits[0]; //\
  \ 第一个元素\nfruits[fruits.length-1]; // 最后元素\n```\n\n## 遍历数组\n\n使用索引数字可以使用 `while`、`do…while`\
  \ 或 `for` 循环遍历数组。如果数组是连续的，这些循环运行良好。在下面的示例中，如果索引 0, 1 或 2 缺失，则会在相应位置打印 `undefined`。\n\
  \n```javascript\nfor (var x = 0; x < 3; x++) {\n  document.write(fruits[x]);\n}\n\
  ```\n\n如果你不知道数组元素的数量，可以使用 `length` 属性确定数量。\n\n```javascript\nfor (var x = 0; x <\
  \ fruits.length; x++) {\n  document.write(fruits[x]);\n}\n```\n\n`length` 属性在每次被调用时都会动态计算。如果你确定数组不会改变，那么使用一次\
  \ `length` 属性比每次循环运行时都使用一次更有效。\n\n```javascript\nvar len = fruits.length;\nfor (var\
  \ x = 0; x < len; x++) {\n  document.write(fruits[x]);\n}\n```\n\n`for...in` 遍历数组中的每一个元素。如果数组是非连续的，`splice`\
  \ 方法可以修改数组。`x` 是索引。\n\n```javascript\nfor (x in fruits) {\n  // 是索引\n  document.write(fruits[x]);\n\
  }\n```\n\n## 练习 5-1\n\n使用数组持有数据。\n使用 `array-1.js` 创建一个包含几的数组。可选：创建一个包含月份的数组。Lesson\
  \ 5/Exercises/。\n\n## 数组变异方法\n\nJavaScript 有一些永久修改数组的方法。这些方法会添加、删除或更改数组的顺序。\n\n\
  ### `pop()`\n`pop()` 从数组中移除最后一个元素并返回它。它不需要任何参数。\n\n```javascript\n//demo5-1.html\n\
  var fruits = [\"banana\", \"orange\", \"apple\"];\nvar lastItem = fruits.pop();\n\
  document.write(lastItem); //apple\ndocument.write(fruits); //banana,orange\n```\n\
  \n### `push()`\n`push()` 向数组末尾添加一个或多个元素并返回数组长度。它接受一个或多个参数。\n\n```javascript\n//demo5-2.html\n\
  fruits.push(\"blueberry\");\nfruits.push(\"cherry\", \"grape\");\n```\n\n### `reverse()`\n\
  `reverse()` 反转元素的顺序。它不需要任何参数。\n\n### `shift()`\n`shift()` 从数组中移除第一个元素并返回它。它不需要任何参数。现有元素的索引值会改变。\n\
  \n```javascript\n//demo5-4.html\nvar firstItem = fruits.shift();\ndocument.write(firstItem);\
  \ //grape (- 注意：逻辑取决于之前的 push/reverse)\n```\n\n### `sort()`\n`sort()` 不需要参数即可按字母顺序排序，但当我们想要按数值排序时就会出现问题。向\
  \ `sort()` 方法传递一个函数，比较作为对的每个元素，如果它们的顺序错误则交换它们。\n\n```javascript\n//demo5-5.html\n\
  var fruits = [\"Banana\", \"Orange\", \"Apple\"];\nfruits.sort(); // Apple, Banana,\
  \ Orange\n\nvar nums = [100, 1, 15, 20, 10, 200];\nnums.sort(); //1, 10, 100, 15,\
  \ 20, 200\nnums.sort(function(a, b){return a - b});\n```\n\n### `splice()`\n`splice()`\
  \ 可以在数组中添加和删除元素。两个参数是必须的。第一个参数是开始 splice 的索引，第二个参数是要删除的元素数量。\n\n```javascript\n\
  //demo5-6.html\n//从索引 1 开始，删除接下来 2 个\nfruits = [\"banana\", \"orange\", \"apple\"\
  , \"blueberry\", \"cherry\"];\nvar rmItems = fruits.splice(1, 2);\ndocument.write(rmItems);\
  \ //orange,apple\ndocument.write(fruits); //banana,blueberry,cherry\n```\n\n\n\n\
  \n\n```javascript\n//第二个参数大于剩余元素数量\n//则移除剩余的所有元素\n\nvar fruits = [\"banana\", \"\
  orange\", \"blueberry\", \"cherry\"];\n\nfruits.sort();\n\ndocument.write(fruits\
  \ + \"<br>\");\n\nfruits.splice(1, fruits.length);\n\ndocument.write(fruits);//banana\n\
  ```\n\n第三个可选参数是一个列表，包含要插入到第一个参数索引处的数组中的一个或多个项。\n\n```javascript\n//demo5-8.html\n\
  //从索引 1 开始，添加 2 个元素，移除\n//后续 2 个元素\n\nvar fruits = [\"banana\", \"orange\", \"apple\"\
  , \"blueberry\", \"cherry\"];\n\nvar rmItems = fruits.splice(1, 2);\n\nfruits.splice(1,\
  \ 0, \"kiwi\", \"lemon\"); // 移除 0 个，添加两个\n\ndocument.write(fruits); //banana, kiwi,\
  \ lemon, blueberry, cherry\n```\n\n### `unshift()`\n\n`unshift()` 将一个或多个元素添加到数组开头，并返回数组的新长度。与\
  \ `shift()` 一样，现有元素的索引会发生变化。\n\n```javascript\n//demo5-9.html\n\nvar fruits = [\"\
  banana\", \"orange\", \"apple\"];\n\nvar addItems = fruits.unshift(\"plum\", \"\
  pear\");\n\ndocument.write(addItems);//5\n\ndocument.write(fruits); //plum, pear,\
  \ banana, orange, apple\n```\n\n### 访问器方法 (Accessor Methods)\n\n访问器方法不会修改数组。它们返回原始数组的表示。以下是用于数组的一些常用访问器方法。\n\
  \n#### `concat()`\n\n`concat()` 返回一个新数组，该数组由调用它的数组以及作为参数提供的数组或值组成。\n\n```javascript\n\
  //demo5-10.html\n\nvar fruits = [\"plum\", \"pear\", \"banana\", \"kiwi\", \"lemon\"\
  ];\n\nvar alpha = [\"a\", \"b\", \"c\"];\n\nvar nums = [2, 3];\n\nvar concatArr\
  \ = alpha.concat(fruits, nums);\n\ndocument.write(alpha);//[\"a\", \"b\", \"c\"\
  ];\n\ndocument.write(concatArr); //a,b,c,plum,pear, banana,kiwi,lemon,2,3\n```\n\
  \n#### `join()`\n\n`join()` 一个分隔符作为可选参数，并返回数组中所有元素连接成的字符串。与字符串方法 `split()` 形成对比，后者通过分隔符将字符串分割成数组。\n\
  \n```javascript\n//demo5-11.html\n\nfruits = [\"plum\", \"pear\", \"banana\", \"\
  kiwi\", \"lemon\"];\n\nvar str1 = fruits.join(\"|\"); //fruits 数组保持不变\n\ndocument.write(str1)//plum|pear|banana|kiwi|lemon\n\
  ```\n\n分隔符可以多于一个字符。\n\n```javascript\n//demo5-12.html\n\nvar fruits = [\"plum\"\
  , \"pear\", \"banana\", \"kiwi\", \"lemon\"];\n\nvar str1 = fruits.join(\"|\");\
  \ //fruits 数组保持不变\n\ndocument.write(str1);\n\nvar str2 = fruits.join(\" > \");\n\
  \ndocument.write(str2);//plum > pear > banana > kiwi > lemon\n```\n\n当省略参数时，数组用逗号连接。\n\
  \n```javascript\n//demo5-13.html\n\nvar fruits = [\"plum\", \"pear\", \"banana\"\
  , \"kiwi\", \"lemon\"];\n\nvar str1 = fruits.join(\"|\"); //fruits 数组保持不变\n\ndocument.write(str1);\n\
  \nvar str2 = fruits.join(\" > \");\n\ndocument.write(str2);\n\nvar str3 = fruits.join();//plum,banana,banana,lemon\n\
  ```\n\n如果参数为空（`\"\"`），元素之间将没有字符连接。\n\n```javascript\n//demo5-14.html\n\nvar fruits\
  \ = [\"plum\", \"pear\", \"banana\", \"kiwi\", \"lemon\"];\n\nvar str4 = fruits.join(\"\
  \");\n\ndocument.write(str4);//pearbanana\n```\n\n#### `slice()`\n\n`slice()` 正如在字符串部分所示，它返回数组的一部分作为新数组返回。不要将其与变器方法\
  \ `splice()` 混淆，后者会移除项、添加项并永久地更改原始数组。`slice()` 的第一个参数是开始的索引，提取的数组直到但不包含第二个参数。如果省略第二个参数，则提取到数组的末尾。作为字符串，`slice()`\
  \ 可以接受负数。\n\n```javascript\n//demo5-15.html\n\nvar fruits = [\"plum\", \"pear\"\
  , \"banana\", \"kiwi\", \"lemon\"];\n\nvar someFruit = fruits.slice(1,2);\n\ndocument.write(someFruit);\
  \ //pear\n\ndocument.write(fruits);//plum,pear,banana,kiwi,lemon\n```\n\n### 练习\
  \ 5-2: 遍历数组\n\n使用数组、循环、`break` 语句和字符串方法创建一个客户端搜索功能。\n\n1. 使用你的编辑器，创建一个名为 `exercise5-2.js`\
  \ 的文件。\n2. 创建一个城市名称数组。确保其中一些城市是多个单词，例如 New York City。\n3. 提示用户输入要在数组中搜索的城市名称。\n\
  4. 循环遍历城市数组，如果找到了用户输入的城市：\n   - 将变量 `found` 设置为 `true`。\n   - 使用 `break` 跳出循环。\n\
  5. 在循环外部，如果 `found` 变量为 `true`，使用 `document.write()` 打印该城市和全名。\n6. 否则，使用 `document.write()`\
  \ 打印你没有找到用户输入的城市。\n7. 注意，到目前为止，搜索期望输入城市的全名。我们希望让它接受部分单词（只要城市名以这些字母开头），例如用 \"Atl\"\
  \ 代表 \"Atlanta\"。\n8. 在 `Exercises/js/exercise5-2.js` 中，使用 `substring()` 方法测试数组中的城市是否以搜索字符串的字母开头。\n\
  \   - 提示：`if (cities[i].substring(0, searchstring.length) == searchstring)`\n9.\
  \ 在打印城市名时，你想要打印数组中的全名，因此将你要打印的搜索字符串赋值给数组中的全名。\n   - 提示：`searchstring = cities[i]`\n\
  10. 你可能已经注意到搜索是区分大小写的。我们希望使其不区分大小写。\n11. 我们可以使用 `toUpperCase()` 方法将整个单词转为大写，但如果城市是多个单词怎么办？我们可以通过空格\
  \ `split()` 城市，遍历它，对它使用 `toUpperCase()` 方法，并用空格分隔符 `join()` 重新连接为字符串。\n    - 提示：在循环之前使用\
  \ `array = searchstring.split(\" \");`，在循环之后使用 `searchstring = array.join(\" \"\
  );`。\n12. 我们不希望整个单词全大写，只需要每个单词的首字母。我们将使用字符串方法获取第一个字符并将其转换为大写，与单词的其余部分拼接，并重新赋值给 `array[i]`。单词的其余部分可以通过\
  \ `array[i].slice(1)` 获得。\n    - 提示：`array[i].charAt(0).toUpperCase()`\n13. 实际上，他们可能会输入全大写，所以我们应该将第一个字母以外的所有内容都转换为小写。\n\
  \    - 提示：使用 `array[i].slice(1).toLowerCase()` 代替简单的 `array[i].slice(1)`。\n14. 保存并在浏览器中测试。\n\
  \n#### 多维数组\n\n多维数组是数组的数组。\n\n```javascript\nvar people = [\n[\"Bob\", \"Smith\"\
  ],\n[\"John\", \"Doe\"]\n]\n```\n\n二维数组的元素通过两组方括号访问，其中第一组括号是“行”号，第二组括号是“列”号。\n\n\
  ```javascript\npeople[0][0];//\"Bob\"\npeople[1][1];//\"Doe\"\n```\n\n多维数组也可以部分创建。\n\
  \n```javascript\nvar people = [[]];\npeople[0][0] = \"Bob\";\n```\n\n## 对象 (Objects)\n\
  \n对象在了一个变量中存储多个值。数组和对象的区别在于，数组元素通过数字索引访问，而对象的元素通过字符串键访问。某些语言将此称为关联数组。\n\n### 在对象中存储数据\n\
  \n可以使用对象字面量语法创建单个对象。\n\n```javascript\nvar person = {\nfirstName: \"John\",\nlastName:\
  \ \"Doe\",\neyeColor: \"green\"\n}\n```\n\n`firstName`、`lastName` 和 `eyeColor` 是\
  \ `person` 对象的属性。对象的属性不需要引号，除非它们包含非字母数字字符。\n\n### 在对象中访问数据\n\n访问对象的元素有两种方法：点表示法（dot\
  \ notation）或括号表示法（bracket notation）。在点表示法中，属性名不需要引号，但在括号表示法中需要。\n\n```javascript\n\
  person.firstName;//John\nperson[\"lastName\"];//Doe\n```\n\n这两种表示法也可以用于设置对象元素。\n\
  \n```javascript\nperson.eyeColor = \"blue\";\nperson[\"age\"] = 21;\n```\n\n###\
  \ 遍历对象数据\n\n`for...in` 循环用于遍历对象。`while`、`do...while` 和 `for` 循环无法用于对象，因为它们没有数字索引。对象名放在关键字\
  \ `in` 的右侧，用于键的变量放在左侧。\n\n```javascript\nfor (p in person) {\ndocument.write(p +\
  \ \": \" + person[p])\n}\n```\n\n\n\n\n\n### 创建对象方法\n\n可以使用函数创建一个自定义对象方法。`this`\
  \ 关键字指向当前对象。\n\n```javascript\n//demo5-16.html\nvar person = {\n  firstName: \"\
  John\",\n  lastName: \"Doe\",\n  fullName: function(){\n    return this.firstName\
  \ + \" \" + this.lastName\n  }\n}\ndocument.write(person.fullName());  //John Doe\n\
  ```\n\n### 创建对象构造函数\n\n上一个示例创建了一个单一对象。要创建一个可以用于创建许多同类型对象的蓝图，请使用对象构造函数。惯例是构造函数的第一个字母大大写。\n\
  \n```javascript\n//demo5-17.html\nfunction Person (fName, lName) {\n  this.firstName\
  \ = fName;\n  this.lastName = lName;\n}\nvar emp1 = new Person(\"John\", \"Doe\"\
  );\nvar emp2 = new Person(\"Robert\", \"Smith\");\n//使用属性名\ndocument.write(emp1.firstName);//John\n\
  document.write(emp2[\"firstName\"]);//Robert\ndocument.write(typeof emp1);//object\n\
  ```\n\n## 对象数组\n\n除了数组数组外，你还可以创建对象数组。\n\n```javascript\n//demo5-18.html\n//对象数组\n\
  var employees = [\n  {firstName: \"John\", lastName: \"Doe\"},\n  {firstName: \"\
  Robert\", lastName: \"Smith\"}\n]\ndocument.write(employees[0][\"firstName\"]);//John\n\
  document.write(employees[0].firstName);//John\n//对象包含数组作为一个属性的值\nvar employee1 =\
  \ {\n  firstName: \"John\",\n  lastName: \"Doe\",\n  skills: [\"HTML\", \"CSS\"\
  , \"JavaScript\"]\n}\ndocument.write(employee1[\"skills\"][0]);//HTML\ndocument.write(employee1.skills[0]);//HTML\n\
  ```\n\n### 练习 5-3 处理对象\n\n创建一个对象数组并访问每个属性。\n\n1. 使用你的编辑器创建一个名为 `exercise5-3.js`\
  \ 的文件。\n2. 将文件保存到 `Lesson 5/Exercises/js` 目录下。\n3. 创建一个命名的对象数组。对象应该具有像 `firstName`、`lastName`、`email`\
  \ 和 `phone` 等属性。\n4. 遍历对象数组并访问所有值。\n5. 将脚本引用添加到 `Lesson 5/Exercises/exercise5-3.html`\
  \ 中。\n6. 在浏览器中保存并测试。\n\n## 使用 JSON 语法存储数据\n\nJSON 代表 JavaScript 对象表示法（JavaScript\
  \ Object Notation）。它由 Douglas Crockford 指定，作为 XML 存储和交换数据的替代方案。虽然 AJAX 中的 X 代表 XML，但由于其熟悉且轻量级的语法，它正越来越多被\
  \ JSON 所代。JSON 是语言无关的。\n\n虽然 JSON 使用 JavaScript 语法，但它是纯文本的。不允许使用变量，属性必须加引号。这种纯文本数据格式可以被任何编程语言读取。\n\
  \n```json\n{\n  \"employees\" : [\n    {\"firstName\": \"John\", \"lastName\": \"\
  Doe\"},\n    {\"firstName\": \"Robert\", \"lastName\": \"Smith\"}\n  ]\n}\n```\n\
  \n下面我们将解释用于解析 JSON 的两种方法。\n\n### JSON.parse()\n\n`JSON.parse()` 解析包含 JSON 语法的字符串，并将值作为\
  \ JavaScript 对象返回。\n\n```javascript\n//demo5-19.html\n//通过拼接拆分字符串\nvar str = '{\
  \ \"employees\" : [' +\n'{\"firstName\": \"John\", \"lastName\": \"Doe\"},' +\n\
  '{\"firstName\": \"Robert\", \"lastName\": \"Smith\"}' +\n']}'\n//将字符串转换为 JSON 对象\n\
  var jObj = JSON.parse(str);\ndocument.write(jObj);//JSON 对象\n//访问第二个员工的 own - Robert\n\
  document.write(jObj.employees[1].firstName);\n```\n\n### JSON.stringify()\n\n`JSON.stringify()`\
  \ 接收一个 JavaScript 对象或数组并将其转换为 JSON 字符串。\n\n```javascript\nvar obj = {\n  employees:\
  \ [\n    {\"firstName\": \"John\", \"lastName\": \"Doe\"},\n    {\"firstName\":\
  \ \"Robert\", \"lastName\": \"Smith\"}\n  ]\n};\n//将对象转换为字符串\nvar jString = JSON.stringify(obj);\n\
  document.write(jString);\n```\n\n# 第 6 节：函数\n\n在本节中，你将学习：\n1. 作用域\n2. 函数参数\n\n##\
  \ 声明和调用函数\n\n函数通过 `function` 关键字定义，参数位于圆括号内，函数体在大花括号内。\n\n另一个示例：\n\n```javascript\n\
  function sayHi() {\n  document.write(\"Hi!\");\n}\nsayHi();\n```\n\n如果函数没有参数，圆括号是空的。\n\
  \n```javascript\nfunction sayHello() {\n  document.write(\"Hello!\");\n}\nsayHello();\n\
  ```\n\n函数可以接收一个或多个参数，并在调用时被传递。\n\n```javascript\nfunction square(n) {\n  return\
  \ n * n;\n}\nsquare(10);\n```\n\n### 返回值\n\n`return` 语句使函数停止执行。这意味着每个函数只能有一个 return\
  \ 语句。`return` 语句之后的代码将不会执行。\n\n如果你必须返回多个值，请返回数组或对象。\n\n```javascript\nfunction check(a,\
  \ b) {\n  if (a > b) {\n    return \"a is greater\";\n  }\n  return \"b is greater\
  \ or equal\";\n}\n```\n\n返回一个值使函数更加灵活。结果可以被打印或赋值给变量。\n\n```javascript\nfunction\
  \ square(n) {\n  return n * n;\n}\nvar result = square(5);\ndocument.write(result);\n\
  ```\n\n### 练习 6-1 编写函数\n\n创建一个可重用的代码并调用它。\n\n1. 使用你的编辑器创建一个名为 `exercise6-1.js` 的文件。\n\
  2. 将文件保存到 `Lesson 6/Exercises/js` 目录下。\n3. 你将做一个华氏到摄氏转换器。HTML 文件中已经有两个表单字段，并有一些代码可以在一个字段改变时改变另一个。代码中还有注释说明。\n\
  4. 华氏的公式为 `c = (f - 32) * 5 / 9`。\n5. 摄氏转华氏的公式为 `f = c * 9 / 5 + 32`。\n6. 使用 `Math.round()`\
  \ 处理结果以得到整数。\n7. 使用 `document.getElementById(\"celsius\").value` 获取并设置摄氏表单字段的值（将在后续章节中解释）。\n\
  8. 使用 `document.getElementById(\"fahrenheit\").value` 获取并设置华氏表单字段的值（将在后续章节中解释）。\n\
  9. 可选：传递的字符串参数对大小写敏感。考虑通过将其转换为 `LowerCase()` 或 `toUpperCase()` 来使其不区分大小写。\n10. 在代码中注释指示的地方调用两次函数，传递\
  \ \"Celsius\" 或 \"Fahrenheit\"。\n\n在 `Lesson6/Exercises/exercise6-1.html` 中已经有 HTML\
  \ 代码和对脚本文件的引用。脚本在页面底部加载以便可以使用 DOM。我们将在后续章节学习更多关于 DOM 的知识。\n\n## 创建匿名函数表达式\n\n\n\n\
  \n匿名函数或函数表达式的语法与具名函数语句相似。某些编程语言将其称为 lambda。它包含 `function` 关键字、一个参数列表和一个代码块，但没有函数名。该表达式可以存储在变量中。由于变量存储了函数表达式，因此可以通过该变量来调用函数。\n\
  \n```javascript\nvar square = function (n) {\n  document.write(n * n);\n}\n\nsquare\
  \ (10); //100\n```\n\n调用具名函数或匿名函数看起来可能相似，但浏览器将它们加载到执行上下文的方式存在差异。具名函数声明在任何代码执行之前加载，因此调用函数的代码行可以出现在函数声明行的上方。匿名函数表达式则在\
  \ JavaScript 执行到该行代码时加载。匿名函数必须在定义它的代码行之后被调用。\n\n## 作用域 (Scope)\n\nJavaScript 函数本身有作用域，它们的变量也有作用域。\n\
  \n### 局部变量与全局变量\n\n作用域指的是你可以访问的变量和函数。JavaScript 有变量作用域，分为局部和全局。\n\n#### 局部变量\n在函数内部声明的变量是该函数的局部变量。JavaScript\
  \ 变量使用 `var` 关键字声明，因此使用 `var` 声明的变量局部于其作用域，而不使用 `var` 关键字创建的变量是全局的。函数内部声明的局部变量只能在函数内部访问。\n\
  \n```javascript\nfunction square (n) {\n  var total = n * n;\n}\n\nsquare(10);\n\
  document.write(total);//undefined\n```\n\n局部变量在函数开始时创建，函数结束时从内存中删除。由于作用域的存在，相同的变量可以在不同的作用域（例如不同的函数）中使用。这很重要，因为作用域通过确保变量不会与其他函数冲突，从而使函数可以复用。\n\
  \n```javascript\nfunction square (n) {\n  var total = n * n;\n  //局部变量仅在\n  //函数内部可用\n\
  \  document.write(total);\n}\n\nsquare(10);//100\n```\n\n#### 全局变量\n未使用 `var` 关键字设置的变量是全局变量，即使定义在函数内部也是如此。全局变量可以在函数可以使用。在函数外部创建的变量是全局，无论是否使用\
  \ `var` 声明。网页上的任何脚本或函数都可以访问全局变量。当网页关闭时，全局变量将从内存中删除。\n\n```javascript\n//定义在函数外部时为全局\n\
  var x = 10;\nfunction square (n) {\n  //全局变量与其他变量冲突\n  total = n * n;\n}\n\nsquare(x);\n\
  document.write(total);//100\n```\n\n#### 函数作用域\nJavaScript 还有函数作用域。函数可以嵌套，内部函数只能在其父函数内部调用。\n\
  \n```javascript\nfunction outer () {\n  document.write(\"outer function\");\n  function\
  \ inner () {\n    document.write(\"inner function\");\n  }\n  //父函数必须调用内部函数\n  inner();\n\
  }\n\n// 也必须调用外部函数\nouter();\n```\n\n## 函数参数 (Function Arguments)\n\n函数没有为参数或参数指定数据类型，也不检查传递的参数数量。\n\
  \n### 设置默认参数\n如果调用函数时缺少参数，它们将被设置为 `undefined`。可以对参数的存在性进行测试，并在缺失时将其设置为默认值。如果在调用函数时传递了这些参数，则默认值将被覆盖。能够将参数设置为默认值允许你创建可选参数。\n\
  \n通常，你必须将 `undefined` 作为可选参数传递设置默认值。\n\n```javascript\n//demo6-2.html\nfunction\
  \ fullName (fName, mName, lName) {\n  if (!mName) {\n    document.write(fName, \"\
  \ \", lName);\n  } else {\n    document.write(fName, \" \", mName, \" \", lName);\n\
  \  }\n}\n\nfullName(\"John\", undefined, \"Public\"); //John Public\n```\n\n如果可选参数是最后一个，则可以省略它。\n\
  \n```javascript\n//demo6-3.html\nfunction fullName (fName, lName, mName) {\n  if\
  \ (!mName) {\n    document.write(fName, \" \", lName);\n  } else {\n    document.write(fName,\
  \ \" \", mName, \" \",  lName);\n  }\n}\n\nfullName(\"John\", \"Public\");//John\
  \ Public\n//中间名是最后一个参数\nfullName(\"John\", \"Public\", \"Q\");//John Q Public\n\
  ```\n\n#### 练习 6-2 创建一个带有可选参数的函数\n为函数中的可选参数设置默认值。\n\n使用你的编辑器，创建一个名为 `exercise6-2.js`\
  \ 的文件。\n\n将文件保存到 `/Lesson 6/Exercises/js`。\n\n创建一个接受三个参数的函数：名字、中间名和姓氏。中间名是可选的，如果他们没有提供中间名，你将其显示为\
  \ \"NMN\"（意为没有中间名）。\n\n使用硬编码参数测试该函数。\n\n在 `/Lesson 6/Exercises/exercise6-2.html`\
  \ 中引用该文件并测试。\n\n### arguments 和 this 属性\n当函数被调用时，它可以访问它自己的参数、它的 `arguments` 对象以及它的\
  \ `this` 属性。`arguments` 是一个类数组对象，包含了调用函数时传递的所有参数。`this` 是指向该函数所属方法的对象的引用。在创建对象或处理事件处理程序时，它非常有用。我们将在后面的课程中看到它的用法。\n\
  \n遍历 `arguments` 对象是使参数可选的另一种方法。事实上，留空参数列表即可使参数可选。\n\n```javascript\n//demo6-4.html\n\
  // 参数列表为空\nfunction sum () {\n  var x;\n  var sum = 0;\n  // arguments 是类数组\n  var\
  \ argLen = arguments.length;\n  for (x = 0; x < argLen; x++){\n    sum += arguments[x];\n\
  \  }\n  return sum;\n}\n\ndocument.write(sum(23, 4, 100));//127\n```\n\n#### 练习\
  \ 6-3 使用 arguments 对象\n创建一个使用 `arguments` 对象计算参数平均值和最大值的函数。\n\n使用你的编辑器，创建一个名为 `exercise6-3.js`\
  \ 的文件。\n\n将文件保存到 `/Lesson 6/Exercises/js`。\n\n创建一个接受任意数量数字参数并计算平均值的函数。提示：使用 `arguments`\
  \ 属性获取总和。\n\n在 `/Lesson 6/Exercises/exercise6-3.html` 中添加引用并使用硬编码数字测试该函数。\n\n创建另一个确定最大值的函数。提示：初始将最大值变量设置为\
  \ 0，并与每个数字进行比较。如果参数中的数字大于该变量，它就是新的最大值。\n\n由于 JavaScript 中的所有数字都大于 `-Infinity`，将最大值变量的初始值更改为该值。\n\
  \n使用硬编码数字测试该函数。\n\n## 第 7 课：正则表达式 (Regular Expressions)\n单元时间：75 分钟\n\n在本节中，你将学习：\n\
  \n## 构建正则表达式\n正则表达式是用于匹配字符串中字符组合的模式。多种编程、脚本和标记语言（包括 XML 和 HTML5）都可以实现正则表达式，且语法是相同的。JavaScript\
  \ 正表达式是一个对象。在 JavaScript 中，正则表达式对于验证表单数据非常有用。\n\n可以通过两种方式构建正则表达式。正则表达式字面量是正则表达式之间的模式。字面量正则表达式在脚本加载时编译。如果正则表达式在整个脚本过程中不会更改，字面量正则表达式提供更好的性能。\n\
  \n```javascript\nvar re = /abc/\n```\n\n另一种方法是使用 `RegExp` 对象的构造函数。构造函数提供了正则表达式的运行时编译。如果正则表达式将更改，或者模式来自其他来源（例如用户输入），请使用这种。\n\
  \n```javascript\nvar re = RegExp(\"abc\");\n```\n\n### 创建模式\n模式无论是常量还是 RegExp 对象都可以简单的字面字符字符串。\n\
  \n```javascript\n//查找子字符串 the\n//匹配 the, theater, soothe\nvar re = /the/;\n```\n\
  \n\n\n\n通过组合特殊的元字符，可以使正则表达式模式更加强大。元字符是具有特殊含义的字符。\n\n`/.the/;` //`dot` 是通配符，可以匹配任何单个字符\n\
  \n//匹配 `!the`、`sthe`、或 `%the` 等\n\n模式可以接受量词，从而进一步修饰元字符。\n\n`/.+the/;` //在`the` 之前至少有一个任意字符`\n\
  \n反斜杠用于转义字符使其变为字面量，或者用于创建元字符。\n\n`/\\.html/;` //反斜杠使 `dot` 变为字面\n\n## 特殊字符\n\n特殊字符之前的反斜杠表示该字符被字面解释。在正则表达式中，通过在普通字符前加上反斜杠，还可以创建几个特殊字符。\n\
  \n`\\d` 表示数字，`\\D` 表示非数字。\n\n//匹配 `12345-1234`\n\n//匹配 `12345 1234`\n\n`/\\d\\d\\\
  d\\d\\d\\D\\d\\d\\d\\d/;`\n\n`\\s` 表示空白字符，包括空格、制表符和换行符。`\\S` 表示非空白字符。\n\n`\\w` 表示数字、字母和下划线。`\\\
  W` 表示非字母数字字符。\n\n如前所示，`dot` 是任意字符的通配符，换行符除外。\n\n## 量词\n\n量词是位于特殊字符后面的字符，表示该类型字符出现的次数。量词可以指定最小和/或最大。\n\
  \n`/\\d{5}/;` //5 位数字\n\n`/\\d{5,9}/;` //5 到 9 位数字\n\n`/\\d{5,}/;` //最少 5 位数字\n\n\
  `/\\d{,9}/;` //最多 9 位数字\n\n某些量词有快捷写形式。\n\n*   `+` 是“一个或多个”的缩写，可以写为 `{1,}`\n*   `*`\
  \ 是“零或多个”的缩写，可以写为 `{0,}`\n*   `?` 是“零或一个”的缩写，可以写为 `{0,1}`\n\n`var re = /\\d{5}-?\\\
  d{4}/;` //有 0 个或 1 个连字符\n\n## 锚点\n\n锚点用于指示短语的开始和结束。\n\n`^` 表示短语的开头。\n\n//以 \"the\"\
  \ 开头，匹配 \"theater\", \"the\"\n`/^the/;`\n\n`$` 用于短语的结尾。\n\n//以 \"the\" 结尾，匹配 \"\
  soothe\", \"the\"\n`/the$/;`\n\n`^` 和 `$` 用于匹配精确短语或限制短语字符数量。\n\n//匹配 \"the\" 且仅\"\
  the\"\n`/^the$/`\n\n短语边界有助于量词。\n\n//匹配连续的 5 位数字\n\n//可能超过 5 个字符\n`/\\d{5}/;`\n\n\
  //恰好 5 位数字，不多也不少\n`/^\\d{5}$/;`\n\n## 范围\n\n方括号 `[]` 用于创建列表或范围。字符串中必须出现其中一个字符。\n\
  \n`[]` 用于字符集或字符类。匹配括号中的任意一个字符或字符类型。\n\n`/[abc]/;` //匹配 `a`、`b` 或 `c`\n\n`/[abc]+/;`\
  \ //匹配 1 个或多个 `a`、`b` 和/或 `c`\n\n可以使用括号内的连字符来指定字符范围。\n\n`/[0-9]/;` //数字，同于 `\\d`\n\
  \n`/[a-z]/;` //区分大小写的小写字母\n\n范围也可以以任何顺序列出。\n\n`/[a-zA-Z0-9]/;` //字母和数字\n\n`/[a-zA-Z0-9_]/;`\
  \ //同于 `\\w`\n\n具有特殊含义的字符如果作为字面量，必须用反斜杠转义。\n\n//字母、数字、标点符号\n`/[a-zA-Z0-9!\\?\\.]/;`\n\
  \n括号可以接受特殊的转义字符。\n\n`/[\\w\\s!\\?\\.]/;`\n\n字符集可以通过方括号内的 `^` 进行取反，这不要与方括号外的字符串起始字符混淆。字符串中必须出现一个不在列表中的字符。\n\
  \n//匹配任意单个字符，但不是小写的 `a`、`b` 或 `c`\n`/[^abc]/;`\n\n`/[⁰-9]/;` //任意非数字，同于 `\\D`\n\n\
  `/[^a-zA-Z0-9]/;` //任意非字母数字\n\n//以非数字开头，同于 `/^\\D/`\n`/^[⁰-9]/;`\n\n## 修饰符\n\n修饰符位于正斜杠之外。`i`\
  \ 标志使列表不区分大小写，`g` 标志创建全局搜索。\n\n`/[a-z]/i;` //不区分大小写\n\n`/[a-zA-Z]/;`\n\n全局修饰符有助于搜索和替换，我们稍后会看到。\n\
  \n`/[a-zA-Z]/g;` //全局搜索\n\n`/[a-zA-Z]/;` //查找一次\n\n修饰符可以嵌套。\n\n`/[a-z]/ig;` //不区分大小写的全局搜索\n\
  \n管道符号 `|` 用于在整个匹配字符串之间表示“或”。\n\n//匹配 `bet`、`get`、`met` 或 `net`\n\n//不匹配 `let`\n\
  `/bet|get|met|net/;`\n\n`/[bgmn]et/;;` //匹配与上面相同\n\n### 使用括号匹配子字符串\n\n括号创建一个组。该组可以被量化或用于反向引用。反向引用匹配之前在捕获组中匹配的相同文本，稍后会详细解释。\n\
  \n// s 是可选的，以 http 或 https 开始\n\n// 正斜杠必须转义\n`/^https?:\\/\\//;`\n\n//字符组是可选的\n\
  `/^(https?:\\/\\/)?/;`\n\n## 应用正则表达式方法\n\n有两种正则表达式方法接受字符串作为参数进行比较。\n\n### 正则表达式方法\
  \ exec()\n\n`exec()` 是正则表达式方法，用于搜索匹配项并返回数组或 null。\n\n//demo7-1\n`var phNum = \"\
  abc123\";`\n`var re = /\\d{10}/;` //数字恰好为 10 位\nif (!re.exec(phNum)){\n\ndocument.write(\"\
  bad number\");\n\n} else {\n\ndocument.write(\"good number\");}\n\n### 正则表达式方法 test()\n\
  \n`test()` 是正则表达式方法，用于测试字符串中的匹配项并返回 true 或 false。它比 `exec()` 快。\n\n`var phNum =\
  \ \"123-456-7890\";`\n`var re = /\\d+/g;` //查找至少一个更多的数字\nif (re.test(phNum)){\n\n\
  document.write(\"good number\");\n\n//它至少有一个数字，所以它会通过\n\n}else{\n\ndocument.write(\"\
  bad number\"););}\n\n## 在字符串方法中使用正则表达式\n\n有四种字符串方法接受正则表达式作为参数进行比较。\n\n### 字符串方法\
  \ match()\n\n`match()` 是字符串方法，用于在字符串中搜索匹配。它返回数组或 null。\n\n//demo7-3\n`var phNum\
  \ = \"(123) 456 - 7890\";`\n\n//一个或多个数字，全局搜索（查找所有匹配项）\n`var re = /\\d+/g;`\nif (arrMatch\
  \ = phNum.match(re)){\n\n//每个匹配项都会被放入数组\ndocument.write(\"good phone number<br>\"\
  );\nvar phone = \"area code \" + arrMatch[0] +\n\n\", prefix \" + arrMatch[1] +\n\
  \n\", last four digits \" + arrMatch[2];\n\ndocument.write(phone, \"<br>\");\n\n\
  } else {\n\ndocument.write(\"bad phone number<br>\");\n\n}\n\n### 字符串方法 search()\n\
  \n`search()` 测试字符串中的匹配项并返回匹配项的零基索引，如果未找到匹配则返回 -1。\n\n//demo7-4\n`var phNum = \"\
  1234567890\";`\n\n//恰好为 10 位的数字\n`var re = /^\\d{10}$/;`\nif (phNum.search(re) !=\
  \ -1){\n\ndocument.write(\"good phone number\");\n\n} else {\n\ndocument.write(\"\
  bad phone number\");\n\n}\n\n### 字符串方法 replace()\n\n\n\n\n\n`replace()` 返回一个新字符串，其中所有匹配模式的内容都被替换为替换字符串。模式可以是字符串或正则表达式。\n\
  \n```javascript\n//demo7-5.html\n//查找所有非数字字符\nvar re = /\\D/g;\nvar phNum = \"(123)\
  \ 456-7890\";\n\n//将非数字替换为空格\ncleanedPhone = phNum.replace(re, \" \");\n//123 456\
  \ 7890\ndocument.write(cleanedPhone, \"<br>\");\n\n// 原始格式\ndocument.write(phNum,\
  \ \"<br>\");\n\n// 移除非数字\ncleanedPhone = phNum.replace(re, \"\");\n//1234567890\n\
  document.write(cleanedPhone, \"<br>\");\n```\n\n### 字符串方法 `split()`\n\n`split()`\
  \ 是之前见过的字符串方法，它使用字符串字面量或正则表达式将字符串拆分为子字符串数组。\n\n```javascript\n//demo7-6.html\n//不需要全局修饰符\
  \ g\n//查找非数字字符\nvar re = /\\D/;\nvar phNum = \"(123) 456-7890\";\nvar cleanedPhone\
  \ = phNum.split(re);\n\nfor (i in cleanedPhone) {\n    document.write(cleanedPhone[i],\
  \ \"<br>\");\n}\n```\n\n`split()` 一个分隔符字符作为参数，以及可选的第二个参数——要返回的拆分次数。默认行为是将字符串拆分为所有可能的子字符串。\n\
  \n```javascript\nvar cleanedPhone = phNum.split(re, 2);\n```\n\n### 练习 7-1 使用正则表达式\n\
  \n使用正则表达式通过量词（quantifiers）对数据进行校验。\n\n使用你的编辑器创建一个名为 `exercise7-1.js` 的文件。\n\n将文件保存在\
  \ `Lesson 7/Exercises/js` 中。\n\n要求用户输入美国邮政编码或加拿大邮政编码。\n\n使用一个模式：\n\n美国邮编可以是五个数字、九个数字，或者五个数字、一个连字符或空格以及额外的四个数字。它不能是带有连字符或空格但没有额外四位的位数。总长度不能超过十个字符，且不允许数字、连字符或空格以外的任何字符。\n\
  \n加拿大邮政编码的模式为字母数字字母空格数字字母数字。空格是可选的。字母不区分大小写。可选：邮编不能以大写或小写字母 `d, f, i, o, q, u, w`\
  \ 或 `z` 开头。\n\n使用正则表达式方法或字符串方法来验证邮编和邮编码。\n\n在 `Lesson7/Exercises/exercise7-1.html`\
  \ 中引用该文件并进行测试。\n\n## 反向引用 (Backreferences)\n\n反向引用可以用模式内部，也可以用于模式外部。在任何情况下，反向引用匹配正则表达式中由括号分隔的组中的子字符串。反向引用匹配找到的实际子字符串，而不是模式。\n\
  \n组通过括号创建，反向引用通过位置数字引用对应的组号。\n\n在模式内部，`\\1` 是第一个括号内组的反向引用，`\\2` 是第二个括号内组的反向引用，依此类推。\n\
  \n```javascript\n//确保分隔符是重复的\n//匹配 123-45-6789\n//匹配 123456789\n//不匹配 12345-6789\n\
  //不匹配 123-45 6789\n/^\\d{3}([\\-\\.\\s])?\\d{2}\\1\\d{4}$/;\n```\n\n模式外部的反向引用通过\
  \ `$1` 到 `$9` 创建，且只能包含九个组引用。如果需要更多引用，请使用数组索引。模式外部的反向引用通过 `RexExp.$1`, `RegExp.$2`\
  \ 访问，但 `$1`, `$$2` 可以在 `replace()` 方法中使用。\n\n```javascript\n//demo7-7.html\nvar\
  \ reSSN = /^(\\d{3})(\\d{2})(\\d{4})$/;\nvar strSSN = \"123456789\";\n//在组 1、2 和\
  \ 3 之间硬编码连字符\nvar cleanSSN = strSSN.replace(reSSN, \"$1-$2-$3\");\ndocument.write(cleanSSN);//123-45-6789\n\
  ```\n\n### 练习 7-2 使用高级正则表达式\n\n在正则表达式中使用反向引用。\n\n使用你的编辑器创建一个名为 `exercise7-2.js`\
  \ 的文件。\n\n将文件保存在 `Lesson 7/Exercises/js` 中。\n\n提示输入电话号码。\n\n使用 `replace()` 移除非数字。\n\
  \n打印输出以查看结果。\n\n使用模式外部的反向引用（`$1`, `$2` 等）和 `replace()` 格式化电话号码，使区号带有括号，区号和前三个数字之间有一个空格，并且在前三个数字和后四个数字之间有一个连字符：`(123)\
  \ 123-1234`。\n\n在 `Lesson7/Exercises/exercise7-2.html` 中引用该文件并进行测试。\n\n可选：在同一文件中创建一个\
  \ HTML 标签验证器。要求输入 HTML 标签并进行验证。请注意，浏览器将根据某些规则将任何标签解释为有效；它不必是标准标签。标签应该以左尖括号（`<`）开头并至少包含一个字母。标签内部的其他字符可以是任何字符（提示）。\n\
  \n## 第 8 ：浏览器对象模型 (BOM)\n\n浏览器对象模型是 BOM 是由 `window` 暴露的所有对象。层级结构的顶端是 `window`。\n\
  \n有用的 window 属性包括 `history`、`location`、`navigator` 和 `screen`。\n\n## history 对象\n\
  \n`window.history` 是只读的，包含了浏览器会话历史，当前加载的页面。它有自己的属性和方法可用于访问历史中的其他页面。要测试 `window.history`，你必须访问不同的\
  \ URL。\n\n后或前进，就像按下后退或前进按钮一样：\n\n`history.back()`\n`history.forward()`\n\n移动到历史中的特定点：\n\
  \n`history.go(-1);//相当于后按钮\n`history.go(-2);//后退两步\n`history.go(0);//刷新当前页面\n`history.go(1);//相当于前进按钮\n\
  \n要查看会话历史中有多少页面，请使用只读属性 `history.length`。某些浏览器从 0 开始计算历史长度，另一些则从 1 开始。`history.length`\
  \ 可以存储的最大值为 50。\n\n```javascript\nvar x = history.length;\ndocument.write(x);\n\
  ```\n\n## location 对象\n\n`window.location` 是只读的，但可以向其分配字符串 URL，从而更改 URL。\n\n`alert(location);//显示当前\
  \ URL\n\n// 使用属性重定向到新位置\n`location.href = \"http://www.mysite.com\";`\n\n// 使用方法重定向到新位置\n\
  `location.assign(\"http://www.mysite.com\");`\n\n// 快捷方式\n`location = \"http://www.mysite.com\"\
  ;`\n\nlocation 对象拥有可以将用户重定向到新页的方法。如上，`location.href` 和 `location.assign()` 都可以重定向。`location.assign()`\
  \ 与 `location.replace()` 的区别在于 `location.replace()` 会重定向并从浏览器历史中移除当前 URL，因此无法使用后退按钮返回首页。\n\
  \n```javascript\n// 重定向并替换历史中的 URL\nlocation.replace(\"http://www.othersite.com\"\
  );\n```\n\n\n\n\n\n多种字符串可以赋值给 `location` 对象的 `href` 属性、`assign()` 方法或 `location`\
  \ 快捷方式。\n\n```javascript\n//绝对 URL\nlocation.href = \"http://www.othersite.com\"\
  ;\n\n//相对 URL\nlocation.href = \"about.html\";\n\n//锚点 URL\nlocation.href = \"#top\"\
  ;\n```\n\n`location.reload()` 重新加载当前页面，就像用户点击了浏览器的“刷新”按钮。页面从缓存重新加载，但通过传递 `true`\
  \ 可以设置为从服务器重新加载。\n\n```javascript\n//从缓存重新加载页面\nlocation.reload();\n\n//从服务器重新加载页面\n\
  location.reload(true);\n```\n\n`location.hash` 可以获取和设置 URL 的哈希部分。\n\n```javascript\n\
  location = \"http://www.mysite.com\";\n\n//跳转到锚点 #top\nlocation.hash = \"top\";\n\
  \n//弹出 \"#top\"\nalert(location.hash);\n```\n\n`location.host` 获取或设置 URL 的主机名和端口号部分。它可以是一个\
  \ IP 地址。如果作为设置器（setter），它只设置 URL 的主机部分而不改变任何其他部分。\n\n```javascript\nlocation = \"\
  https://www.mysite.com/about.html#top\";\nalert(location.host);//www.mysite.com\n\
  \n//设置 URL 为\n//https://www.yoursite.com/about.html#top\nlocation.host = www.yoursite.com\n\
  ```\n\n相比之下，`location.hostname` 仅获取或设置不带端口的主机名。\n\n只读 `location.origin` 属性返回协议、域名或\
  \ IP 地址以及任何端口号。\n\n```javascript\nlocation = \"https://www.mysite.com/about.html#top\"\
  ;\n\n//弹出 https://www.mysite.com/about.html#top\nalert(location.origin);\n```\n\n\
  `location.pathname` 获取或设置 URL 的路径部分。\n\n```javascript\nalert(location.pathname);//about.html\n\
  ```\n\n`location.port` 获取或设置 URL 的端口部分，而 `location.protocol` 获取或设置协议。\n\n`location.search`\
  \ 获取或设置 URL 的查询字符串部分，包括问号（`?`）。查询字符串用于向 URL 传递参数，JavaScript 可以获取这些参数。\n\n## screen\
  \ 对象\n\n`window.screen` 具有几个只读属性。\n\n```javascript\n//demo8-1.html\n\n//用户屏幕的像素宽度\n\
  document.write(screen.width, \"<br>\");\n\n//用户屏幕的像素高度\ndocument.write(screen.height,\
  \ \"<br>\");\n\n//用户屏幕宽度减去任务栏的像素宽度\ndocument.write(screen.availWidth, \"<br>\");\n\
  \n//用户屏幕高度减去任务栏的像素高度\ndocument.write(screen.availHeight, \"<br>\");\n\n//24 - 32\
  \ 位颜色深度\ndocument.write(screen.colorDepth, \"<br>\");\n\n//现代计算机上与 colorDepth 相同\n\
  document.write(screen.pixelDepth, \"<br>\");\n```\n\n## console 对象\n\n`window.console`\
  \ 提供了访问浏览器调试控制台的。它有几个方法。我们一直在使用 `document.write()` 方法。它接受一个由逗号分隔的参数列表，或者一个拼接后的参数。\n\
  \n`document.write()` 会自动在用逗号分隔的参数之间插入空格。如果值是拼接的，则必须在字符串中构建空格。`alert()` 也是如此，因为它只接受一个参数，因此多个值必须进行拼接。\n\
  \n```javascript\nfname = \"John\";\n\n//\"Hello John\"\n//console log 在参数之间添加空格\n\
  console.log(\"Hello\", fname);\n\n//必须在字符串中手动添加空格\nalert(\"Hello\" + \" \" + fname);\n\
  ```\n\n## window 对象的 open() 和 close() 方法\n\n`window.open()` 打开一个弹出窗口——另一个浏览器窗口的实例。该方法接受四个可选参数。`close()`\
  \ 关闭弹出窗口。\n\n第一个参数是作为弹出窗口打开的 URL。如果你不指定 URL，则可以提供来自主页面的内容。\n\n```javascript\n//在新标签页中打开\
  \ help.html\nopen(\"help.html\");\n```\n\n第二个参数是弹出窗口的名称。该名称被用作目标，例如用于链接在新的弹出窗口中打开。\n\
  \n```javascript\n//如果链接中使用了 target = \"popup\"，\n//它将在此窗口中打开\nopen(\"help.html\"\
  , \"popup\");\n```\n\n第三个参数是规格列表。`height` 和 `width` 指定弹出窗口的大小，`left` 和 `top` 指定位置。\n\
  \n```javascript\n//所有四个参数都是可选的\n//宽度 200px，位于右侧 300px 处\n//规格列表位于一组引号\nopen(\"help.html\"\
  , \"\", \"width=200, left=300\");\n```\n\n第四个参数是 `true` 或 `false`（默认值），决定新窗口是否替换历史列表中的当前窗口。`open()`\
  \ 方法的返回值是对新创建窗口的引用。\n\n```javascript\n//demo8-2.html\n//不打开特定的 URL\nnewWin = open(\"\
  \", \"\", \"width = 200, height = 200, left = 300\");\n\n//使用 newWin 组合一个页面\n//这将写入弹出窗口\n\
  newWin.document.write\n```\n\n## 使用 BOM 方法执行代码\n\nJavaScript 有两个 `window` 对象的方法可以在指定时间执行代码。\n\
  \n#### setTimeout()/clearTimeout()\n\n`window.setTimeout()` 在延迟后执行代码。它接受代码片段或函数引用作为第一个参数，以及毫秒为单位的延迟。\n\
  \n```javascript\n//demo8-3.html\nfunction showAlert(){\n    alert(\"Surprise!\"\
  );\n}\n\n// 在两秒后执行\nvar id = setTimeout(showAlert, 2000);\n```\n\n`setTimeout()`\
  \ 返回超时器的数字。第一次执行时返回 1，第二次返回 2 等。该数字可以被捕获并传递给 `clearTimeout()`。\n\n```javascript\n\
  clearTimeout(id);\n```\n\n#### setInterval()/clearInterval()\n\n`window.setInterval()`\
  \ 重复执行代码。它接受代码片段或函数引用作为第一个参数，以及毫秒为单位的延迟作为第二个参数。\n\n```javascript\n//demo8-4.html\n\
  function showAlert(){\n    alert(\"Surprise!\");\n}\n\n// 每隔 50 毫秒执行一次\nvar id =\
  \ setInterval(showAlert, 50);\n```\n\n`setInterval()` 返回间隔数字。第一次执行时返回 1，第二次返回 2\
  \ 等。该数字可以被捕获并传递给 `clearInterval()`。\n\n```javascript\nclearInterval(id);\n```\n\n\
  ### 8-1 使用 window 方法创建动画\n\n使用 `setInterval()` 动态更新页面。\n\n在编辑器中，导航到 `8/Exercises`。打开\
  \ `exercise-1.html`。你会注意到文本 `<p id=\"content\"> The Quick Brown Fox Jumps Over the\
  \ Lazy Dog.</p>`。当你的程序完成后，你不应该再看到这段文本。\n\n在浏览器中，打开 `8/Solutions` 文件夹下的 `exercise-1.html`。这将让你了解练习完成后的样子。有一个打字机效果会打印字母。`setInterval()`\
  \ 让字母一个一个打印。\n\n在编辑器中，打开 `8/Exercises/js/exercise8-1.js` 文件。\n\n创建包含以下变量：\n\n1.\
  \ 你想要打印的单词。\n2. 计数器，设置为 0。\n3. 代表要打印的 HTML 元素的变量。\n4. `setInterval()` 函数，它接受你将创建的函数引用作为第一个参数，毫秒为单位的速度作为第二个参数。在解决方案文件中，函数名称是\
  \ `typewriter`，速度为 50。将 `setInterval()` 捕获为变量以便调用 `clearInterval()`。\n\n```javascript\n\
  var intervalID = setInterval(functionReference, speedNum);\n// 之后\nclearInterval(intervalID);\n\
  ```\n\n创建你的函数。内部：\n\n获取你想打印的单词变量，并对其使用字符串方法逐个获取字符。将其打印到应该显示单词的元素中。提示：`str.substr(0,\
  \ counter)`，其中 `str` 是你要打印的单词变量，而 `counter` 将函数中递增。\n\n计数器加 1。\n\n如果 `counter` 大于单词字符串的长度，则调用函数。\n\
  \n将文件保存到 `8/Exercises/exercise8-1.html` 并进行测试。\n\n\n\n\n\n文档对象模型（DOM）是用于 HTML、XML\
  \ 和 SVG 文档的应用程序编程接口（API）。DOM 将文档存储在内存中，并表示为反映节点关系的树结构。这定义了访问和遍历文档的方式，以便操作其内容、结构和样式。\n\
  \n在 DOM 中，网页上的所有内容都是一个 `node`（节点）。网页本身是一个 `document node`（文档节点）。每个 HTML 元素都是 `element\
  \ node`（元素节点）。每个 HTML 属性都是 `attribute node`（属性节点）。HTML 内部的文本是 `text node`（文本节点）。\n\
  \n节点具有属性、方法和事件处理器。DOM 不是 JavaScript 语言的一部分，但可以使用 JavaScript 以及 Java 等语言进行访问。\n\n\
  在这种情况下，文档指的是网页。一个 HTML 文档可以在浏览器窗口中渲染，也可以作为 HTML 源码存在。DOM 提供了第三种面向对象的方式，使用 JavaScript\
  \ 等编程或脚本语言来表示、存储和操作内容。\n\n## document 对象 (Object)\n\nHTML 页面以节点的形式存储在 DOM 中，而文档对象是根节点。它有几个经常使用的方法来访问网页上的元素。这是访问元素以操作结构、内容或样式的第一步。这些方法非常常用，以至于\
  \ jQuery 等 DOM 库已经为它们制作了快捷。此外还有重构元素的方法。\n\n`document.write()` 向文档写入字符串文本。`document.write()`\
  \ 可以接受多个参数。\n\n```javascript\nvar fName = \"John\";\n\n//多个参数，包括空格\ndocument.write(\"\
  Hello\", \" \", fName);\n\n//将两个字符串和一个变量拼接成一个\ndocument.write(\"Hello\" + \" \"\
  \ + fName);\n```\n\n## document 对象访问方法 (Access Methods)\n\n`document.getElementById()`\
  \ 接收唯一 ID 作为参数，并返回按 ID 标识元素的引用。ID 名称是区分大小写的字符串。与所有方法一样，`getElementById()` 方法必须使用正确的大小写。注意它不能写写为\
  \ `getByID()`。\n\n```javascript\n//大小写敏感的方法和 id 名称\nvar div1 = document.getElementById(\"\
  d1\");\n\n<div id=\"d1\"></div>\n```\n\n`document.getElementsByName()` 返回匹配名称的节点动态集合（live\
  \ collection）。`name` 是一个 HTML 属性，与 `id` 不同，它不需要是唯一的。\n\n```javascript\nvar checkboxes\
  \ = getElementsByName(\"skills\");\n\n<input type=\"checkbox\" name=\"skills\" value=\"\
  HTML\">\n<input type=\"checkbox\" name=\"skills\" value=\"DOM\">\n```\n\n`document.getElementsByTagName()`\
  \ 返回匹配标签的 HTML 元素动态集合。\n\n```javascript\n//demo9-1.html\n//返回一个集合\nvar allParas\
  \ = document.getElementsByTagName(\"p\");\n\nvar num = allParas.length;\n\nalert(num\
  \ + \" paragraphs\");\n```\n\n`document.getElementsByClassName()` 返回匹配类的 HTML 节点节点集合。\n\
  \n```javascript\n//同时具有 col 和 main 类的元素\ndocument.getElementsByClassName(\"col main\"\
  );\n```\n\n`getElementsByTagName()` 和 `getElementsByClassName()` 既可以在文档对象上调用以搜索整个文档，也可以在元素上调用以搜索该元素的后代。\n\
  \n```javascript\n//类名为 \"content\" 的元素\n// id 为 \"container\" 的元素的后代\nvar el = document.getElementById(\"\
  container\");\nel.getElementsByClassName(\"content\");\n```\n\n## 使用选择器访问元素\n\n\
  JavaScript 有两个接收选择器的方法。选择器通过标签名、类名、id 名称或属性来选择 DOM 中的元素。与 `getElementsByTagName()`\
  \ 和 `getElementsByClassName()` 类似，这些方法可以在文档对象或元素上使用。\n\n`document.querySelector()`\
  \ 接收一个 CSS 选择器并返回第一个匹配项。\n\n```javascript\n//第一个段落\ndocument.querySelector(\"p\"\
  );\n\n// p 的第一个后代 div\ndocument.querySelector(\"p div\");\n\n// p 的直接子 div\ndocument.querySelector(\"\
  p > div\");\n\n// div 或段落，取决于先找到哪个\ndocument.querySelector(\"p, div\");\n\n//第一个类\
  \ \"content\"\ndocument.querySelector(\".content\");\n\n// id \"container\"\ndocument.querySelector(\"\
  #container\");\n\n// type 为 \"text\" 的第一个表单字段\ndocument.querySelector(\"input[type\
  \ = text]\");\n```\n\n`document.querySelectorAll()` 接收一个 CSS 选择器并返回所有匹配项的 NodeList。\n\
  \n```javascript\n//段落列表\ndocument.querySelectorAll(\"p\");\n\n// p 的后代 div\ndocument.querySelectorAll(\"\
  p div\");\n\n// p 的直接子 div\ndocument.querySelectorAll(\"p > div\");\n\n//所有 div\
  \ 和段落\ndocument.querySelectorAll(\"p, div\");\n\n// 类 \"content\"\ndocument.querySelectorAll(\"\
  .content\");\n\n// id \"container\" – 应该只有一个！\ndocument.querySelectorAll(\"#container\"\
  );\n\n// type 属性为 \"text\" 的表单字段\ndocument.querySelectorAll(\"input[type=text]\"\
  );\n```\n\n## 练习 9-1 使用 DOM 和 window 方法创建动画\n\n使用 DOM 方法和 `setInterval()` 让页面动态更新。\n\
  \n在浏览器中，打开位于 `Lesson 9/Solutions` 的 `exercise9-1.html` 文件。你会注意到它显示了距离未来某个日期还有多少天、小时、分钟和秒。文件内部有显示时钟的代码和\
  \ CSS。\n\n在编辑器中，打开位于 `Lesson 9/Exercises/js` 下的 `exercise9-1.js`。你会看到一个 `getTimeRemaining()`\
  \ 函数，它计算今天与另一个日期之间的差，并将自 Unix 戳以来的毫秒数除天、小时、分钟和秒。\n\n1. 添加一个名为 `setClock()` 的函数，接收一个参数（Solutions\
  \ 后会调用它）。在内部，为 HTML 页面上持有天（`class=\"days\"`）的元素、持有小时的元素、持有分钟的元素以及持有秒的元素设置变量。\n2.\
  \ 在 `setClock()` 函数内部，创建一个名为 `changeClock()` 的无参数函数。\n3. 在 `changeClock()` 内部：\n\
  \    - 对传递给外部函数 `setClock()` 的参数运行 `getTimeRemaining()` 函数，并用变量（如 `time`）捕捉。（记得\
  \ `changeClock()` 本身没有参数。）\n    - 将天、小时、分钟和秒变量写入相应的 HTML 元素中。对于小时、分钟和秒，你可能希望使用字符串函数进行格式化，以便在个位数时补零。这会在开头添加一个零，但也要确保总共两位：`('0'\
  \ + seconds).slice(-2);`\n    - 一旦 `time` 变量（`getTimeRemaining()` 函数的结果）达到零——这意味着现在和另一个日期相同——停止计时倒计时。\n\
  \    - 关闭 `changeClock()` 函数。\n4. 在 `changeClock()` 函数外部但在 `setClock()` 函数内部：\n\
  \    - 调用一次 `changeClock()` 函数，让时钟初始显示。你只能从父函数调用内部函数。\n    - 在下方，使用 `setInterval()`\
  \ 每秒调用一次 `changeClock()` 函数。创建一个 `intervalID` 变量，传递给 `changeClock()` 函数中的 `clearInterval()`。\n\
  5. 在两个函数外部：\n    - 设置一个变量为未来的某个日期。\n    - 在该变量上调用 `setClock()`。\n    - 引用文件 `Lesson\
  \ 9/Exercises/js/exercise9-1.js`。\n    - 保存并使用过去的日期或不使用 `setInterval()` 的情况进行测试。\n\
  \n## 操作 DOM 节点\n\n节点（Node）可以是元素、属性、注释或文本类型。它具有几个属性和方法。\n\n### 使用 DOM 创建节点\n\n文档对象有几个方法可以让它创建注释、元素或文本节点。新节点必须通过\
  \ `append` 和 `insert node` 方法进行定位。\n\n`document.createComment()` 接收一个字符串并动态创建且返回一个新的注释节点。\n\
  \n```javascript\ndocument.createComment(\"this is my comment\")\n```\n\n`document.createElement()`\
  \ 接收一个字符串并动态创建且返回一个新的元素节点。HTML5Shiv 和 Modernizr 等库利用此方法以便在旧浏览器中识别 HTML5 标签。\n\n\
  ```javascript\ndocument.createElement(\"section\")\ndocument.createElement(\"article\"\
  )\ndocument.createElement(\"div\")\n```\n\n\n\n\n\n`document.createTextNode()` 接收字符串并动态创建并返回一个新的文本节点。\n\
  \n```javascript\ndocument.createTextNode(\"Hello World!\");\n```\n\n## 使用 DOM 操控\
  \ CSS\n\n在 JavaScript 中，你可以为元素设置类（class）或样式属性。`class` 是 HTML 属性，而 `className` 是\
  \ JavaScript 中等效属性，用于设置或获取类。\"class\" 一词与用于操作 DOM 的编程语言冲突。`className` 引用 CSS 中的一个类。如果\
  \ HTML 元素中已经存在 `class` 属性，它会添加另一个。\n\n```css\n//CSS\n.highlight{\n\n}\n```\n\n```javascript\n\
  divMain.className = \"highlight\";\n```\n\n```html\n//输出\n<div id = \"divMain\"\
  \ class=\"highlight\"></div>\nvar cName = divMain.className;\n```\n\n`window.getComputedStyle(element)`\
  \ 是一个只读属性，用于从外部或嵌入的 CSS 表格获取 `element` 参数的计算样式。计算样式是应用到元素上的所有 CSS 属性值。\n\n`element.style`\
  \ 获取或设置 HTML 样式属性的等效项。在 CSS 级联中，它的优先级最高，高于嵌入样式表和外部样式表。设置样式属性不会覆盖分配给元素的其他样式。使用 `element.setAttribute(\"\
  style\", \"properties\")` 则会覆盖整个样式属性。\n\nCSS 中带连字符的样式属性（如 `margin-top`）在 JavaScript\
  \ 中以驼峰命名法（`camelCase`）编写（如 `marginTop`）。\n\n```javascript\n//demo9-5.html\ndivMain.style.backgroundColor\
  \ = \"gray\";\ndivMain.style.color = \"red\";\nvar bg = divMain.style.backgroundColor;\n\
  \n//覆盖颜色和背景颜色\ndivMain.setAttribute(\"style\", \"color: navy\");\n```\n\n### 练习\
  \ 9-2：使用 DOM 操控 CSS\n\n使用 DOM 脚本动态设置 CSS 类并创建一个交互式菜单。\n\n在浏览器中，打开位于 `Lesson 9/Solutions`\
  \ 的 `exercise9-2.html` 文件。当你点击页面右侧的三条杠时，菜单栏会滑出，三条杠会变成一个 X。当你点击 X 时，菜单栏会消失。这种效果主要由\
  \ CSS 创建，因此我们将使用 JavaScript 动态设置 CSS 类。\n\n在你的编辑器中，打开位于 `Lesson 9/Exercises/js`\
  \ 的 `exercise9-2.js`。\n\n获取具有 `class=\"effects\"` 和 `class=\"bt-nav\"` 的 DOM 元素作为变量。\n\
  \n将具有 `class=\"effects\"` 的元素（你设置变量的元素）的 `className` 属性设置为样式表中名为 \"open\" 的类。\n\n\
  为你设置变量的 `class=\"bt-nav\"` 元素附加事件处理器。代码如下：`btnNav.addEventListener(\"click\", function()\
  \ { })`。点击此元素时，菜单栏将改变。将在将在节中介绍。\n\n在 `addEventListener` 代码内部，测试当前节点的父元素的 `className`\
  \ 是否为 \"open\"。如果是，设置为 \"close\"。编写一个 else if 判断如果当前节点的父元素的 `className` 为 \"close\"\
  。如果是，设置为 \"open\"。菜单将在显示和不显示之间切换。提示：这获取当前元素的父元素的 className：`this.parentNode.className`\n\
  \n在 `Lesson 9/Exercises/exercise9-2.html` 中添加文件引用并进行测试。\n\n# 第 10 节：事件处理\n\n单元时间：75\
  \ 分钟\n\n在本节中，你将学习：\n\n## 事件对象\n\n`event` 对象代表任何 DOM 事件。类别包括鼠标事件、键盘事件、剪贴板事件、窗口事件和表单事件。虽然事件在\
  \ HTML 中以 \"on-\" 开头，但在 JavaScript 中通常会去掉 \"on-\"。\n\n注册事件处理器有几种方法。这是一种旧方法，不应该使用，因为它已经过时了。\n\
  \n```html\n<form id = \"frm\" onsubmit=\"validator()\">\n```\n\n更好的方法是在 DOM 加载后在\
  \ JavaScript 中注册事件。这可以通过传统的事件注册实现（在所有浏览器中均有效），或者使用更灵活的 `addEventListener()`。我们将在接几页中详细探讨它们。\n\
  \n## 事件处理\n\n交互式网页是通过让用户通过事件运行代码（通常是函数）来创建的。\n\n### 传统事件注册\n\n我们想将函数本身分配给 `onsubmit`。我们可以通过省略括号传递函数的引用：\n\
  \n```javascript\nfunction validate(){\n//代码\n}\n\nfrm = document.getElementById(\"\
  frm\");\nfrm.onsubmit = validate;\n```\n\n或者我们可以将一个匿名函数表达式分配给事件处理器：\n\n```javascript\n\
  frm.onsubmit = function (){\n//代码\n};\n```\n\n对 `onsubmit` 的额外分配将覆盖任何现有的事件处理器。\n\
  \n### 使用 addEventListener() 注册\n\n`addEventListener()` 方法在被调用的目标上注册监听器。目标可以是元素、文档或窗口。\n\
  \n`addEventListener()` 将事件（去掉 \"on-\" 前缀）作为其第一个参数，并将回调函数作为第二个参数。回调函数是可以在事件发生时运行的函数引用。若要向回调函数传递参数，第二个参数应该是一个匿名函数表达式。\n\
  \n```html\n//demo10-1.html\n<table id=\"tbl1\">\n<table>\n<tr>\n<td id=\"td1\">表格列</td>\n\
  </tr>\n</table>\n\nvar tbl1 = document.getElementById(\"tbl1\");\nvar td1 = document.getElementById(\"\
  td1\");\n\nfunction outerMsg(){\nalert(\"你点击了表格！\");\n}\n\nfunction innerMsg(){\n\
  alert-text-alert(\"你点击了列！\");\n}\n\n//点击表格运行表格事件\ntbl1.addEventListener(\"click\"\
  , outerMsg);\n\n//点击 td 冒泡\n//运行 td 然后父元素表格事件\ntd1.addEventListener(\"click\", innerMsg);\n\
  ```\n\n此方法允许为一个事件设置多个处理器。\n\n```html\n//demo10-2.html\ntd1.addEventListener(\"click\"\
  , innerMsg);\ntd1.addEventListener(\"click\", otherMsg);\n```\n\n`addEventListener()`\
  \ 有第三个可选的布尔参数。`true` 表示用户希望事件在捕获阶段而非冒泡阶段发生。冒泡（默认值）表示如果父元素和子元素上都有事件，则先发生子事件，然后是父事件。捕获表示先发生父事件，然后是子事件。\n\
  \n```javascript\n//点击 td 捕获\n//运行表格然后子元素事件\ntbl1.addEventListener(\"click\", outerMsg,\
  \ true);\ntd1.addEventListener(\"click\", innerMsg);\n```\n\n第三个参数的默认值为 false，但有时为了兼容旧浏览器会显式传递它。\n\
  \n```javascript\ntbl1.addEventListener(\"click\", callback, false);\ntbl1.addEventListener(\"\
  click\", function(){\n//代码\n}, false);\n```\n\n在处理器内部，`this` 引用触发事件的元素。\n\n```javascript\n\
  //demo10-3.html\n//this 是调用函数的对象\nfunction changeColor(){\nthis.style.backgroundColor\
  \ = \"navy\";\n}\n\ntd1.addEventListener(\"click\", changeColor)\n\n//在匿名函数中使用 this\n\
  td1.addEventListener(\"click\", function(){\nthis.style.backgroundColor = \"navy\"\
  ;\n});\n```\n\n### 移除事件监听器\n\n你可能希望在事件发生特定次数后停止。`removeEventListener()` 将移除通过 `addEventListener()`\
  \ 附加的事件处理器。它具有相同的参数，但函数不能是匿名的。\n\n## 事件类型\n\n### 鼠标事件\n\n鼠标事件包括 `click`、`dblclick`、`mousedown`\
  \ 和 `mouseup`。`click` 事件是 `mousedown` 和 `mouseup` 事件的组合。其他鼠标事件是 `mousemove`（鼠标在元素上方移动时）和\
  \ `mouseover/mouseout`。`mouseenter/mouseleave` 与 `mouseover/mouseout` 相似，但不会冒泡。\n\
  \n```javascript\ntbl1.addEventListener(\"mouseout\", function(){\nalert(\"表格\");\n\
  });\n//鼠标移出 td 时运行两者\ntd1.addEventListener(\"mouseout\", function(){\nalert(\"列\"\
  );\n});\n\ntbl1.addEventListener(\"mouseleave\", function(){\nalert(\"表格\");\n});\n\
  //鼠标移出 td 时仅运行 td\ntd1.addEventListener(\"mouseleave\", function(){\nalert(\"列\"\
  );\n});\n```\n\n### 键盘事件\n\n键盘事件包括 `keyup`、`keypress` 和 `keydown`。`keydown` 在用户首次按下按键时发生，`keyup`\
  \ 在用户松开按键时发生。`keypress` 事件在按下产生字符值的按键时发生。\n\n\n\n\n\n在这个示例中，我们想在字符输入后捕获它。为了测试目的，我们不希望表单自动补全：\n\
  \n```html\n//demo10-4.html\n<form autocomplete=\"off\">\n  <input type=\"text\"\
  \ id=\"fName\">\n</form>\n```\n\nHello <span id=\"sp1\"></</span>Hello <span id=\"\
  sp1\"></span>\n\n```javascript\nsp1 = document.getElementById('sp1');\nfName = document.getElementById('fName');\n\
  \nfunction showChar(){\n  sp1.textContent = fName.value\n}\n\nfName.addEventListener(\"\
  keyup\", showChar);\n```\n\n`keydown` 和 `keyup` 都代表按键，而 `keypress` 只代表输入的字符。键盘事件对象还会为\
  \ `altKey`、`ctrlKey` 和 `shiftKey`返回 `Boolean` 类型值。\n\n```javascript\n//demo10-5.html\n\
  fld.addEventListener(\"keydown\", function(){\n  //如果按下 shift 键为 true\n  //如果按下其他键为\
  \ false\n  alert(event.shiftKey);\n})\n```\n\n### 剪贴板事件 (Clipboard Events)\n\n某些浏览器支持剪贴板事件\
  \ `cut`、`copy` 和 `paste`。这对于禁用某些字段的剪切、复制或粘贴非常有用，例如确认邮箱地址。\n\n```html\n//demo10-6.html\n\
  <form id=\"frm\">\n  Confirm email: <input type=\"text\" id=\"email\">\n</form>\n\
  ```\n\n```javascript\nfunction disable(){\n  alert(\"禁止剪、复制或粘贴\");\n  event.preventDefault();\n\
  }\n\nemail = document.getElementById('email');\nemail.addEventListener(\"cut\",\
  \ disable);\nemail.addEventListener(\"copy\", disable);\nemail.addEventListener(\"\
  paste\", disable);\n```\n\n### 窗口事件 (Window Events)\n\n`window` 对象拥有 `load` 和 `unload`\
  \ 事件。在处理 DOM 时，`load` 事件非常重要，因为我们希望在访问元素之前确保 DOM 已经加载。之前的示例通过将 `<script>` 标签置于我们正在访问的\
  \ HTML 内容下方解决了这个问题。\n\n```javascript\n//demo10-7.html\nwindow.addEventListener(\"\
  load\", function(){\n  //一旦我们确定它已//加载，就获取 div 元素\n  divMain = document.getElementById(\"\
  divMain\");\n});\n```\n\n### 表单事件 (Form Events)\n\n表单事件是在表单字段上发生的事件，适用于调用表单验证方法。有几个特定的表单特定事件：\n\
  \n`focus` 和 `blur` 意味着用户进入或离开字段。当 `blur` 事件发生时，可以在该字段上运行验证代码。\n\n```javascript\n\
  //没有必要使用 preventDefault\nfName.addEventListener(\"blur\", function(){\n  if(fName\
  \ == \"\"){\n    alert(\"姓名字段为空\");\n  }\n})\n```\n\n`change` 事件在字段（如下拉菜单）的值发生变化时触发。`select`\
  \ 事件在用户选择字段中的文本时发生。`reset` 在点击重置按钮时发生，而 `submit` 在表单提交时发生。当用户点击提交按钮时可以提交表单，但 `submit`\
  \ 是 `form` 对象上的事件，而不是按钮上的事件。\n\n```javascript\n//preventDefault 阻止表单提交\nfunction\
  \ validate(){\n  if(fName == \"\"){\n    alert(\"姓名字段为空\");\n    event.preventDefault();\n\
  \  }\n}\n\n//frm 是表单\nfrm.addEventListener(\"submit\", validate);\n```\n\n表单经常使用其他事件，例如用于复选框、单选按钮或其他按钮的\
  \ `click`。\n\n```javascript\n//sbm 是提交按钮\nsbm.addEventListener(\"click\", validate);\n\
  ```\n\n由于表单会获取用户输入，`cut`、`copy` 和 `paste` 事件也可能被用于表单字段。\n\n## 事件方法 (Event Methods)\n\
  \n`event` 对象具有用于停止冒泡或默认行为的方法，这在事件处理中非常有用。\n\n### stopPropagation() (停止传播)\n\nDOM\
  \ 元素通常是嵌套的，因此当 `click` 等事件发生在子元素上时，它也会同时发生在其父元素上。事件会从子标签开始冒泡，按照嵌套顺序触发其父元素。\n\n点击子元素\
  \ `tr` 或 `td` 会触发表格事件。正如你可能记得的，`td` 或 `tr` 也有一个事件处理器，它也会运行。\n\n```html\n<table id=\"\
  tbl1\">\n  table\n  <tr>\n    <td id=\"td1\">table column</td>\n  </tr>\n</table>\n\
  ```\n\n```javascript\nvar tbl1 = document.getElementById(\"tbl1\");\nvar td1 = document.getElementById(\"\
  td1\");\n\n//当表格被点击时\ntbl1.addEventListener(\"click\", function(){alert(\"table\"\
  )})\n\n//当 td 被点击时，两个事件都会发生\ntd1.addEventListener(\"click\", function(){alert(\"\
  td\")})\n```\n\n`event` 对象有一个 `stopPropagation()` 方法，用于取消冒泡阶段，这样如果用户点击了 `td` 且 `td`\
  \ 关联了事件，则只有该事件会执行。必须直接点击表格，其表格事件才会运行。如果 `td` 没有关联事件，则无论是否使用 `stopPropagation()`，表格事件都会运行。\n\
  \n```javascript\ntbl1.addEventListener(\"click\", function(){\n  //点击表格时触发事件\n \
  \ alert(\"table\");\n});\n\ntd1.addEventListener(\"click\", function(){\n  alert(\"\
