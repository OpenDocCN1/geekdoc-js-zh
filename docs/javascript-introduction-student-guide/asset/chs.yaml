  冒泡或或，，，，，，，，...。。。。。。。。。。\n\n# 第 11 节：调试与最佳实践\n\n在本节中，你将学习到：\n\n1. JavaScript 编码风格\n\
  2. JavaScript 最佳实践\n3. 自定义错误处理\n\n## JavaScript 编码风格\n\n大多数 JavaScript 代码应该存放在扩展为\
  \ `.js` 的独立文件中，以便更容易进行重用、测试和开发。所有项目都应该使用相同的编码规范，以便于阅读和维护。\n\n#### 变量和语句编码风格\n\n\
  虽然 HTML 不区分大小写，但大多数 Web 服务器（如 Apache 和 Unix）将文件名视为大小写敏感。如果文件名为 \"logo.png\"，而我们的\
  \ DOM 脚本尝试以不同的大小写访问 \"Logo.png\"，它将失败。惯例是在 HTML 中使用小写，以保持一致性和可读性。\n\n\n\n\n\n使用\
  \ `camelCase` 作为标识符名称（变量和函数）。\n\n```javascript\nvar firstName = \"John\";\nvar lastName\
  \ = \"Doe\";\nfunction calcTotal(){}\n```\n\n虽然不是强制要求的，但在操作符周围和逗号后面加上空格会提高可读性。\n\
  \n```javascript\nvar z = x + y;\nvar cities = [\"Atlanta\", \"Boston\", \"Chicago\"\
  ];\n```\n\n虽然如果新语句在下一行开始，JavaScript 不会因为缺少分号报错，但你应该始终在每个语句末尾加上分号。\n\n```javascript\n\
  var fullName = firstName + \" \" + lastName;\n```\n\n在赋值对象时，分号放在大括号的后面。这与块语句（block\
  \ statement）中的大括号不同，块语句后面不应该有分号。\n\n- 左大括号与对象名在同一行。\n- 属性名和值之间使用冒号和空格。\n- 字符串值（而非属性名）必须用引号括起来。\n\
  - 数值不应该加引号。\n- 在 `JSON` 中，属性名也必须加引号。\n- 用逗号分隔属性/值对，但最后一个对之后没有逗号。\n- 右大括号单独占一行，前面没有领先空格。\n\
  \n```javascript\nvar person = {\nfirstName: \"Jane\",\nlastName: \"Doe\"\n};\n```\n\
  \n如果为了可读性必须拆分 JavaScript 语句，应该在操作符之间拆分，尽可能在逗号处。\n\n```javascript\nvar cities = [\"\
  Atlanta\", \"Boston\",\n\"Chicago\"];\n```\n\n### 块级编码风格\n\n块语句可以将多个语句通过分号组合在一起，它有几种惯例。左大括号应该在第一行的末尾，前面有一个空格。右大括号应该单独占一行，前面没有空格。块内部的语句应该有分号，但块本身不应该有。\n\
  \n```javascript\n// 括号前有空格\n// 左大括号前有空格\nif (hour < 12) {\n  alert(\"Good Morning!\"\
  );\n}\nelse {\n  alert(\"Good Afternoon!\");\n} //这里不需要分号\n```\n\n使用四个空格缩进代码块是一种通用惯例。避免使用制表符（tabs），因为不同的编辑器对其的解释并不一致。通常情况下，括号前面不应该有空格，除非是匿名函数。\n\
  \n```javascript\nfunction calcTotal(){\n// 使用四个空格缩进\n  return (price * tax) + price;\n\
  }\n\n// 在 //匿名函数 的括号前加一个空格\nfunction () {\n  // 这样做\n}\n```\n\n## JavaScript 最佳实践\n\
  \n虽然 JavaScript 没有强制，但请始终声明变量。在函数内部声明变量会使其局部于函数；这比全局变量更好。\n\n```javascript\n// 错误，未声明的变量\n\
  x = 1;\n// 已声明的变量\nvar x = 1;\n```\n\n变量应该声明在页面顶部，以便于找到任何变量声明。\n\n```javascript\n\
  // 在一条语句中声明多个变量\nvar firstName, lastName, intAge;\n```\n\n在声明变量时初始化它们更好，并且至少提示预期的数据类型。使用\
  \ `string`、`numeric`、`array` 和 `object` 字面量来提高代码效率。注意为了可读性进行的缩进。\n\n```javascript\n\
  // 仍可以用逗号分隔\nvar firstName = \"\",\nfullPrice = 0,\nmyArr = [],\nmyObj = {};\n```\n\
  \nJavaScript 是弱类型的，所以如果你想同时进行类型比较和值比较，请使用恒等运算符 `===` 而不是比较运算符 `==`。比较运算符 `==` 会尝试将两端转换为匹配的类型。\n\
  \n```javascript\n// 类型转换使得这些为真\n0 == \"\"; //true\n1 == true; //true\n// 但它们并不等同\n\
  0 === \"\"; //false\n1 === true; //false\n```\n\n赋值运算符是单等号。一个常见的错误是使用它代替比较运算符或恒等运算符。\n\
  \n```javascript\nvar x = 1;\n// 假，符合预期\nif (x == 2) {}\n// 真，将 2 赋值给 x 并测试 x 是否为真\n\
  if (x=2) {}\n```\n\n### 优化代码性能\n\n如果某些内容预计不会改变，避免让 JavaScript 重复选择或计算。\n\n记住 `length`\
  \ 属性会告诉你数组中有多少元素，并且 JavaScript 数组是动态的。元素的数量在代码可能会可能会或减少。在这个示例中，JavaScript 在每次循环运行时都会计算数组长度。\n\
  \n```javascript\nvar arr = [];\nfor (i = 0; i < arr.length; i++) {}\n```\n\n如果你知道数组中的元素数量将保持不变，那么获取一次长度并在循环中使用该数字要高效得多。在这种情况下，我们只计算一次数组的元素数量。\n\
  \n```javascript\nvar arr = [];\nvar len = arr.length;\nfor (i = 0; i < len; i++)\
  \ {}\n```\n\n虽然 JavaScript 处理 HTML `DOM` 的能力使得网页非常有交互性，但访问 `DOM` 是一个相对缓慢且“昂贵”的操作。如果你预计在脚本中多次访问同一个\
  \ DOM 对象，请将其存储在变量中以便重用。\n\n```javascript\n// 获取一次\nvar div = document.getElementById(\"\
  divMain\");\n// 使用多次\ndiv.innerHTML = \"Hi\";\ndiv.style.color = \"blue\";\n```\n\
  \n过去，有一种习惯是将脚本放在 HTML 页面的 `head` 标签中，以避免它们阻塞渲染。浏览器代码是单线程的，因此在脚本加载之前，`body` 中的 HTML\
  \ 不会加载。在那段时间内，用户在浏览器中看不到任何内容。随着脚本变得越来越长，且使用多个库变得流行，将脚本放在页面底部更好。这样浏览器会先加载 HTML，用户可以在脚本加载期间看到页面。你应该使用\
  \ `window.onload` 事件来确保在使用任何 DOM 脚本之前页面已加载完毕。\n\n```html\n// 代替\n<head>\n<script\
  \ src=\"longScript.js\"></script>\n</head> \n<body>\n  content, images\n</body>\n\
  \n// 脚本加载时，用户可以看到页面\n```\n\n### \"use strict\" 指令\n\nJavaScript 非常灵活，通常不会为错误的语法报错。`\"\
  use strict\"` 是一个字面量表达式，旧版本的 JavaScript 会忽略它（例如 `< IE 10>`）。如果 `\"use strict\"`\
  \ 声明位于 JavaScript 文件开头，它具有全局作用域，所有代码将以严格模式执行。虽然这通常是有效的，严格模式会导致错误，因为它要求所有变量必须声明。\n\
  \n```javascript\nx = 10;\nperson = {\nfirstName: \"John\",\nlastName: \"Doe\"\n\
  };\n```\n\n以下内容强制 JavaScript 对写错误的变量抛出错误，而不是将其变为新变量。由于全局 `\"use strict\"` 要求函数内部的变量必须声明，它实际上要求变量是局部的。\n\
  \n```javascript\n//demo11-1.html\n\"use strict\";\nvar x = 10;\nvar person = {\n\
  firstName: \"John\",\nlastName: \"Doe\"\n};\nfor (var i = 0; i < 10; i++) {\n  document.write(i);\n\
  }\nfunction calcTotal(){\n  x = 20; // 因为 x 在上面已经声明了\n  y = 10; // 全局 strict 导致错误\n\
  \  var z = 20; // 有效\n}\n```\n\n如果 `\"use strict\"` 声明在函数内部，它具有局部作用域，仅适用于内部的代码。\n\
  \n```javascript\n//demo11-2.html\nx = 10; // 不是严格模式，这是有效的\nfunction calcTotal(){\n\
  \  \"use strict\"; // 在函数作用域内\n  y = 20; // 无效\n  var z = 30; // 有效\n}\n```\n\n\
  ### JavaScript debugger 语句\n\n浏览器错误控制台会显示语法错误，但逻辑错误很难发现。一种方法是向 `document.write()`\
  \ 写入。只有进入浏览器的 JavaScript 控制台时才能看到结果。\n\n```javascript\nvar x = 10;\nalert(x);\n\
  ```\n\n如果发生错误，JavaScript 将不会运行任何代码。你可能想设置断点并一次运行一部分代码。断点会强制 JavaScript 停止执行并允许检查\
  \ JavaScript 值。你可以在调试器内部重新启动脚本。\n\n\n\n\nJavaScript 有一个 `debugger;` 语句，它可以在其所在的行设置断点。当在浏览器中查看代码时，`debugger;`\
  \ 语句不起作用。当激活调试工具并运行代码时，它会设置断点并提供一个可以点击以重启代码的箭头。你可以根据需要多次在代码中使用 `debugger;` 语句来设置断点。\n\
  \n在未激活调试工具的情况下，它会提醒你。在调试模式下，它会在每个变量赋值下方停止，并等待按下箭头以重启代码。\n\n```javascript\n//demo11-3.html\n\
  var x = 10;\ndebugger;\nvar y = 20;\ndebugger;\nalert(x + y);\n```\n\n## 自定义错误处理\n\
  \nJavaScript 有 `try`、`catch`、`throw` 和 `finally` 语句允许你自定义错误处理。`try` 接收一个测试的代码块，`catch`\
  \ 允许你处理错误，`throw` 允许创建自定义错误，而 `finally` 无论 `try` 和 `catch` 的结果如何都会执行代码。这四条语句的流控制组合有：`try/catch`、`try/finally`\
  \ 或 `try/catch/finally`。重写内置错误的 `throw` 语句放在 `try` 块中。\n\n假设我们写错了一个方法名。JavaScript\
  \ 会向控制台输出错误。我们可以捕获该错误将其重定向到页面而不是控制台。内置错误对 `catch` 语句可用。传递给 `catch` 的任何变量都代表错误，在此例中为\
  \ `error`。`error` 有一个 `message` 属性。\n\n```javascript\n//demo11-4.html\ntry {\n \
  \ alerts(\"Welcome guest!\");\n}\ncatch(error) {\n  document.getElementById(\"demo\"\
  ).innerHTML = error.message;\n}\n```\n\n我们可以抛出错误或抛出异常，并创建自己的错误消息。\n\n```javascript\n\
  //demo11-5.html\nvar x = prompt(\"Enter a number\", \"\");\ntry {\n  // 根据需要在这里进行大量的测试和抛出\n\
  \  if (x == \"\") {\n    throw \"empty\";\n  }\n}\ncatch(error) {\n  alert(error);\
  \ // 现在是自定义错误了\n}\nfinally {\n  // 无论如何都会执行清理代码\n}\n```\n\n### 练习 11-1 抛出自定义错误\n\
  \n为表单字段抛出自定义错误。\n\n在浏览器中，打开 `exercise11-1.html`。测试表单字段为空、不是数字以及数字小于 5 或大于 100 时的字段。\n\
  \n在你的编辑器中，打开 `Lesson 11/Exercises/js/exercise11-1.js`。我们将为该字段抛出一组自定义错误。\n\n创建一个名为\
  \ `checkAge()` 的函数。在内部：\n- 变量 `message` 和 `age`。\n- 从页面上 `id=\"message\"` 的区域设置\
  \ `message` 变量，以便我们可以输出它。\n- 从年龄表单字段设置 `age` 变量。\n- 使用 `try` 设置一系列 `if` 测试。\n- 如果\
  \ `age` 字段为空，抛出一个指明其为空的错误。\n- 如果 `age` 字段不是数字（提示：使用 `isNaN()`），抛出一个指明该数字的错误。\n-\
  \ 如果 `age` 字段小于 5，抛出一个指明数值太低的错误。\n- 如果 `age` 字段大于 100，抛出一个指明数值太高的错误。\n- 捕获错误（提示：使用\
  \ `catch(err)` 然后打印出 `err`）。将消息写入相应的字段，并且如果发生错误则阻止表单提交。\n- 在页面加载时，获取表单元素，并在提交时调用\
  \ `checkAge()` 函数。\n- 在 `Lesson 11/Exercises/exercise11-1.html` 中添加对该文件的引用，保存并测试。\n\
  \n# 第 12 节：处理表单\n\n在本节中，你将学习到：\n1. 使用 JavaScript 验证表单数据\n2. 使用正则表达式进行数据验证\n\n##\
  \ 使用 JavaScript 验证表单数据\n\nHTML `<form>` 是获取用户输入的最常用方式。数据通常被发送到数据库进行存储，这需要服务器端脚本。HTML\
  \ `<form>` 标签引用服务器端脚本以及发送数据的方法。当用户点击“提交”按钮时，数据会被发送到该脚本。\n\n```html\n<form method=\"\
  post\" action=\"proc.php\" id=\"frm\">\n```\n\n虽然数据最终应该在服务器上进行验证，但客户端验证或数据筛选是有帮助的。它可以减轻服务器负担，并通过在出现问题时立即通知用户让页面更具响应性。\n\
  \n如果数据不符合我们的脚本要求，我们希望阻止表单提交并给用户修正的机会。表单验证通过 DOM 获取数据，使用事件调用函数，并使用字符串和正则表达式方法进行测试。\n\
  \n表单及其元素应该具有 ID，以便能够被唯一标识和访问。\n\n```javascript\nvar frm = document.getElementById(\"\
  frm\");\n```\n\n有几种方法可以将表单元素作为集合获取以便你进行循环。表单有一个 `elements` 集合：\n\n```javascript\n\
  var els = frm.elements;\n// 也可以链式\ndocument.getElementById(\"frm\").elements;\n\
  ```\n\n你可以使用 DOM 方法：\n```javascript\nvar els = document.getElementsByTagName(\"\
  input\");\n```\n\n或者使用 CSS 属性选择器：\n```javascript\nvar els = document.querySelectorAll(\"\
  input\");\n// 指定表单\nvar els = document.querySelectorAll(\"#frm input\");\n// 仅 type=\"\
  text\"\nvar els = document.querySelectorAll(\"[type=text]\");\n```\n\n验证测试包括：\n\
  - 检查必填字段是否为空\n- 确保单选按钮或下拉选项中有一个被选中\n- 检查输入是否符合正确格式\n- 比较两个字段以确保它们匹配\n- 检查准确的数值范围\n\
  \n### 表单事件\n\n表单对象具有 `onsubmit` 和 `onreset` 事件，可以处理返回值。如果它们设置为 false，则不会执行提交或重置。当然，应该动态获取\
  \ true 和 false 值！\n\n`confirm()` 在用户点击“确定”按钮时返回 true，点击“取消”按钮时返回 false。`return`\
  \ 捕获 true 或 false。如果是 false，这段代码等同于 `onreset = false`且不重置表单。如果不是 false，则自动返回 true。\n\
  \n```javascript\nfunction check(){\n  var yn = confirm(\"Do you want to clear?\"\
  );\n  if(yn == false){\n    event.preventDefault();\n  }\n}\nfrm.addEventListener(\"\
  reset\", check);\n```\n\n`onsubmit` 事件将从判断表单数据是否有效的函数获取 true 或 false。如果 `onsubmit\
  \ = false`，表单将不会提交。\n\n```javascript\nfunction validate(){\n  fName = document.getElementById(\"\
  fName\");\n  if(fName.value == \"\"){\n    alert(\"The name field is empty\");\n\
  \    event.preventDefault();\n  }\n}\nfrm.addEventListener(\"submit\", validate);\n\
  ```\n\n### 检查空字段\n\nJavaScript 可以访问表单和元素的属性。表单属性包括 `method`、`action`、`name` 和 `id`。常用的元素属性包括\
  \ `name`、`type` 和 `value`。\n\n下面，我们遍历文本元素。我们使用 `value` 访问字段内容并测试它们是否为空，使用 `id` 在错误消息中标识缺失的字段。这段代码应该放在表单提交时调用的函数中。获取值是非常重要的，因为你想测试的是字符串而不是对象。一旦我们有了字符串，就可以使用\
  \ `trim()` 等字符串方法。\n\n如果用户在姓名字段中只输入了一个空格怎么办？从技术上讲，该字段并不为空，但也没有意义内容。我们的验证函数将去掉开头和结尾的空格并分析剩余部分。\n\
  \n```javascript\nvar els = document.querySelectorAll(\"[type=text]\");\nfor (i =\
  \ 0; i < els.length; i++){\n  if(els[i].value.trim() == \"\"){\n    alert(els[i].id\
  \ + \" is required!\");\n    event.preventDefault();\n  }\n}\n```\n\n在这个示例中，我们只测试一个字段，即用户离开字段时（当\
  \ `onblur` 事件发生时）。记住表单事件包括 `onfocus` 和 `onblur`。表单元素还有 `focus()` 方法可以将光标置入字段，`blur()`\
  \ 方法可以将光标移出。我们使用关键字 `this` 来引用当前字段。如果用户在不输入任何内容的情况下离开必填字段，我们将向他们显示错误消息并将光标放回字段。\n\
  \n```javascript\nfunction validateField(){\n  if(this.value.trim() == \"\"){\n \
  \   alert(\"this field is required\");\n    this.focus();\n  }\n} \nfName.addEventListener(\"\
  blur\", validateField);\n```\n\n### 测试字符串长度\n\n字符串和数组都有 `length` 属性。\n\n\n\n\n\n\
  ```javascript\nvar user = document.getElementById(\"user\");\n\nif (user.value.length\
  \ < 5 || user.value.length > 8) {\n  alert(\"Must be 5 to 8 characters.\");\n  user.focus();\n\
  }\n```\n\n使用字符串方法，我们可以限制注释字段的长度。我们使用 `substring()` 方法获取前 100 个字符并将它们放入文本区域中：\n\n\
  ```html\n//demo12-1.html\n<form id=\"frm\">\n  <textarea id=\"txt\" rows=\"7\" cols=\"\
  35\"></textarea>\n  <input type=\"submit\">\n</form>\n```\n\n```javascript\nvar\
  \ txt = document.getElementById(\"txt\");\n\nfunction shortText(){\n  var numChars\
  \ = txt.value.length;\n  if(numChars > 100){\n    var short = txt.value.substring(0,100);\n\
  \    alert(\"Character limit exceeded.\");\n    event.preventDefault();\n    txt.value\
  \ = short;\n  }\n}\n\nfrm.addEventListener(\"submit\", shortText);\n```\n\n### 确保选择了选项\n\
  \n#### 单选按钮\n\n单选按钮是组合在一起的，如果它们具有相同的 `name`，则只能选择一个。取消选择某一个的唯一方法是选择另一个。对于表单验证，我们可以遍历单选按钮组，直到找到被选中的那一个。\n\
  \n在这个示例中，`for` 循环一旦某个单选按钮被选中就会停止运行。如果一个都没有被选中，它将“穿透”到错误消息。这样做是为了避免在每个未选中的单选按钮上都显示错误消息。\n\
  \n```html\n//demo12-2.html\n<input type=\"radio\" name=\"rdo\" value=\"UPS\">UPS\n\
  <input type=\"radio\" name=\"rdo\" value=\"FedEx\">FedEx\n```\n\n```javascript\n\
  var rdo = document.querySelectorAll(\"[type=radio]\");\n\nfunction checkRdo(){\n\
  \  for(i = 0; i < rdo.length; i++){\n    //如果单选按钮被选中\n    if(rdo[i].checked == true){\n\
  \      return;//离开函数\n    }\n  }\n  alert(\"Please choose one.\");\n  event.preventDefault();\n\
  }\n```\n\n#### 下拉菜单\n\n在 HTML 中，`<select>` 元素拥有子 `<option>` 元素。在 JavaScript 中，`select`\
  \ 有一个 `options` 集合和一个基于零的 `selectedIndex` 属性。具有五个选项的下拉菜单索引从 0 到 4。当做出新选择时，它会触发 `onchange`\
  \ 事件。在这个示例中，我们提供了一个空选择，然后测试它是否为 `selectedIndex`。\n\n```html\n//demo12-3.html\n<select\
  \ id=\"ship\">\n  <option value=\"\">Select One\n  <option value=\"UPS\">UPS\n \
  \ <option value=\"FedEx\">FedEx\n</select>   \n```\n\n```javascript\nvar sel = document.getElementById(\"\
  ship\");\n\nfunction checkSel(){\n  if(sel.selectedIndex == 0){\n    alert(\"Please\
  \ choose one.\");\n    event.preventDefault();\n  }\n}\n\nfrm.addEventListener(\"\
  submit\", checkSel);\n```\n\n### 测试用户是否勾选了框框\n\n复选框和单选按钮都有 `checked` 属性，其值为 true\
  \ 或 false。我们可以使用它来查看用户是否勾选了复选框。复选框可以开启或关闭。\n\n```html\n//demo12-4.html\n<input type=\"\
  checkbox\" id=\"chk\">\n```\n\n```javascript\nvar chk = document.getElementById(\"\
  chk\");\n\nfunction check(){\n  if (chk.checked == false) {\n    alert(\"please\
  \ read our terms!\");\n    event.preventDefault();\n  }\n}\n\nfrm.addEventListener(\"\
  submit\", check);\n```\n\n## 使用正则表达式进行数据验证\n\n联系表单上的许多字段使用常见的数据模式。一个美国电话号码应该有十个数字，并带有可选的括号、空格和连字符。\n\
  \n```html\n//demo12-5.html\nPhone: <input type=\"text\" id=\"phone\">\n```\n\n```javascript\n\
  var phone = document.getElementById(\"phone\");\n\nfunction check(){\n  rePhone=/^\\\
  (?\\d{3}\\)?-?\\s?\\d{3}-?\\s?\\d{4}$/;\n  if(!rePhone.test(phone.value)){\n   \
  \ alert(\"bad format\");\n    event.preventDefault();\n  }\n}\n\nfrm.addEventListener(\"\
  submit\", check);\n```\n\n美国邮政编码应该有 5 到 9 个数字，并带有可选的空格或连字符。使用正则表达式或字符串方法之一来实现它们。\n\
  \n```html\n//demo12-6.html\nZip: <input type=\"text\" id=\"zip\">\n```\n\n```javascript\n\
  var zip = document.getElementById(\"zip\");\n\nfunction check(){\n  reZip=/^\\d{5}$|^\\\
  d{5}-\\d{4}$/;\n  if(!reZip.test(zip.value)){\n    alert(\"bad format\");\n    event.preventDefault();\n\
  \    zip.focus()\n  }\n}\n\nfrm.addEventListener(\"submit\", check);\n```\n\n###\
  \ 练习题 12-1 验证表单\n\n使用 DOM、事件、函数、字符串测试和正则表达式来验证表单。\n\n在浏览器中，打开位于 `Lesson 12/Solutions`\
  \ 中的 `exercise12-1.html` 文件。测试在你不填写以及正确填写时会发生什么。在编辑器中查看它并查看 HTML 标签中的 ID。\n\n在你的编辑器中，打开\
  \ `Lesson 12/Exercises/js/exercise12-1.js`。我们将编写一些函数来测试不同的内容，并在表单提交时调用它们。\n\n1.\
  \  首先，在页面顶部创建两个变量，但不要给它们赋值。一个命名为 `msg`，另一个命名为 `name`。\n2.  创建一个名为 `checkRequired()`\
  \ 的函数，接收参数 `fld`。它将检查 `fld` 是否为空。如果是，它将创建一个显示 `name` 是必填的的消息。使用 `+=` 运算符以便我们可以构建错误消息。\n\
  3.  创建一个名为 `checkLength(fld, min, max)` 的函数，接收参数 `fld`、`min` 和 `max`。它将检查 `fld.value`\
  \ 的长度。如果长度小于 `min` 或大于 `max`，它将创建一个显示 `name` 必须在 `min` 和 `max` 之间的消息。使用 `+=` 运算符来构建错误消息。\n\
  4.  创建一个名为 `checkRdo(fld)` 的函数，接收参数 `fld`。它将检查组中是否有任何单选按钮被选中。如果没有，它将弹出提示。\n5.  创建一个名为\
  \ `checkLetters(fld)` 的函数，接收参数 `fld`。它将检查 `fld.value` 是否匹配字母正则表达式。如果不匹配，它将显示消息并阻止默认行为。\n\
  6.  创建一个名为 `checkZip(fld)` 的函数，接收参数 `fld`。它将检查 `fld.value` 是否匹配邮政编码正则表达式。如果不匹配，它将显示“bad\
  \ format”、阻止默认行为并聚焦 `fld`。\n7.  创建一个名为 `checkAlphaNumeric(fld)` 的函数，接收参数 `fld`。它将检查\
  \ `fld.value` 是否匹配数字正则表达式。如果不匹配，它将显示“bad format”并阻止默认行为。\n8.  创建一个名为 `checkEmail(fld)`\
  \ 的函数，接收参数 `fld`。它将检查 `fld.value` 是否匹配邮箱正则表达式。如果不匹配，它将显示“bad format”并阻止默认行为。\n9.\
  \  创建一个名为 `checkSelection(fld)` 的函数，接收参数 `fld`。它将检查 `selectedIndex` 是否为 0。如果是，它将弹出“Please\
  \ choose one.”并阻止默认行为。\n10. 创建一个名为 `validateForm(frm)` 的函数，接收参数 `frm`。\n    - 声明本地变量\
  \ `msg`。\n    - 将 `msg` 设置为空空字符串。\n    - 遍历表单元素 (`frm`)。在循环中：\n      - 设置 `fld =\
  \ frm.elements[i]`。\n      - 设置 `name = fld.name.substring(3)` 以去掉 ID 中的 \"txt\"\
  \ 或 \"ddl\" 前缀。\n      - 如果 `fld.type == \"text\"`，调用 `checkRequired(fld)`。在此 if\
  \ 语句内部：\n        - 如果 `name` 是 `FirstName`，运行 `checkLetters(fld)`。\n        - 如果\
  \ `name` 是 `UserName`，运行 `checkLength(fld, 5, 8)` 和 `checkAlphaNumeric(fld)`。\n\
  \        - 如果 `name` 是 `Zip`，运行 `checkZip(fld)`。\n        - 如果 `name` 是 `Email`，运行\
  \ `checkEmail(fld)`。\n      - 否则如果 `fld.type == \"select-one\"`，运行 `checkSelection(fld)`。\n\
  \      - 否则如果 `fld.type == \"submit\"`，跳过此字段。\n    - 循环结束后，如果 `msg` 为空，返回 `true`；如果不是，则弹出\
  \ `msg` 并阻止默认行为。\n11. 在页面加载时，通过 id 获取表单，并在表单提交时，对它运行 `validateForm(frm)`。\n\n\n\n\
