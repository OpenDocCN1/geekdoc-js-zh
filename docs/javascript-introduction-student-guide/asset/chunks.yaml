  trans: "\n\n使用 `camelCase` 作为标识符名称（变量和函数）。\n\n```javascript\nvar firstName = \"\
    John\";\nvar lastName = \"Doe\";\nfunction calcTotal(){}\n```\n\n虽然不是强制要求的，但在操作符周围和逗号后面加上空格会提高可读性。\n\
    \n```javascript\nvar z = x + y;\nvar cities = [\"Atlanta\", \"Boston\", \"Chicago\"\
    ];\n```\n\n虽然如果新语句在下一行开始，JavaScript 不会因为缺少分号报错，但你应该始终在每个语句末尾加上分号。\n\n```javascript\n\
    var fullName = firstName + \" \" + lastName;\n```\n\n在赋值对象时，分号放在大括号的后面。这与块语句（block\
    \ statement）中的大括号不同，块语句后面不应该有分号。\n\n- 左大括号与对象名在同一行。\n- 属性名和值之间使用冒号和空格。\n- 字符串值（而非属性名）必须用引号括起来。\n\
    - 数值不应该加引号。\n- 在 `JSON` 中，属性名也必须加引号。\n- 用逗号分隔属性/值对，但最后一个对之后没有逗号。\n- 右大括号单独占一行，前面没有领先空格。\n\
    \n```javascript\nvar person = {\nfirstName: \"Jane\",\nlastName: \"Doe\"\n};\n\
    ```\n\n如果为了可读性必须拆分 JavaScript 语句，应该在操作符之间拆分，尽可能在逗号处。\n\n```javascript\nvar cities\
    \ = [\"Atlanta\", \"Boston\",\n\"Chicago\"];\n```\n\n### 块级编码风格\n\n块语句可以将多个语句通过分号组合在一起，它有几种惯例。左大括号应该在第一行的末尾，前面有一个空格。右大括号应该单独占一行，前面没有空格。块内部的语句应该有分号，但块本身不应该有。\n\
    \n```javascript\n// 括号前有空格\n// 左大括号前有空格\nif (hour < 12) {\n  alert(\"Good Morning!\"\
    );\n}\nelse {\n  alert(\"Good Afternoon!\");\n} //这里不需要分号\n```\n\n使用四个空格缩进代码块是一种通用惯例。避免使用制表符（tabs），因为不同的编辑器对其的解释并不一致。通常情况下，括号前面不应该有空格，除非是匿名函数。\n\
    \n```javascript\nfunction calcTotal(){\n// 使用四个空格缩进\n  return (price * tax) +\
    \ price;\n}\n\n// 在 //匿名函数 的括号前加一个空格\nfunction () {\n  // 这样做\n}\n```\n\n## JavaScript\
    \ 最佳实践\n\n虽然 JavaScript 没有强制，但请始终声明变量。在函数内部声明变量会使其局部于函数；这比全局变量更好。\n\n```javascript\n\
    // 错误，未声明的变量\nx = 1;\n// 已声明的变量\nvar x = 1;\n```\n\n变量应该声明在页面顶部，以便于找到任何变量声明。\n\
    \n```javascript\n// 在一条语句中声明多个变量\nvar firstName, lastName, intAge;\n```\n\n在声明变量时初始化它们更好，并且至少提示预期的数据类型。使用\
    \ `string`、`numeric`、`array` 和 `object` 字面量来提高代码效率。注意为了可读性进行的缩进。\n\n```javascript\n\
    // 仍可以用逗号分隔\nvar firstName = \"\",\nfullPrice = 0,\nmyArr = [],\nmyObj = {};\n\
    ```\n\nJavaScript 是弱类型的，所以如果你想同时进行类型比较和值比较，请使用恒等运算符 `===` 而不是比较运算符 `==`。比较运算符\
    \ `==` 会尝试将两端转换为匹配的类型。\n\n```javascript\n// 类型转换使得这些为真\n0 == \"\"; //true\n1 ==\
    \ true; //true\n// 但它们并不等同\n0 === \"\"; //false\n1 === true; //false\n```\n\n\
    赋值运算符是单等号。一个常见的错误是使用它代替比较运算符或恒等运算符。\n\n```javascript\nvar x = 1;\n// 假，符合预期\n\
    if (x == 2) {}\n// 真，将 2 赋值给 x 并测试 x 是否为真\nif (x=2) {}\n```\n\n### 优化代码性能\n\n\
    如果某些内容预计不会改变，避免让 JavaScript 重复选择或计算。\n\n记住 `length` 属性会告诉你数组中有多少元素，并且 JavaScript\
    \ 数组是动态的。元素的数量在代码可能会可能会或减少。在这个示例中，JavaScript 在每次循环运行时都会计算数组长度。\n\n```javascript\n\
    var arr = [];\nfor (i = 0; i < arr.length; i++) {}\n```\n\n如果你知道数组中的元素数量将保持不变，那么获取一次长度并在循环中使用该数字要高效得多。在这种情况下，我们只计算一次数组的元素数量。\n\
    \n```javascript\nvar arr = [];\nvar len = arr.length;\nfor (i = 0; i < len; i++)\
    \ {}\n```\n\n虽然 JavaScript 处理 HTML `DOM` 的能力使得网页非常有交互性，但访问 `DOM` 是一个相对缓慢且“昂贵”的操作。如果你预计在脚本中多次访问同一个\
    \ DOM 对象，请将其存储在变量中以便重用。\n\n```javascript\n// 获取一次\nvar div = document.getElementById(\"\
    divMain\");\n// 使用多次\ndiv.innerHTML = \"Hi\";\ndiv.style.color = \"blue\";\n```\n\
    \n过去，有一种习惯是将脚本放在 HTML 页面的 `head` 标签中，以避免它们阻塞渲染。浏览器代码是单线程的，因此在脚本加载之前，`body` 中的\
    \ HTML 不会加载。在那段时间内，用户在浏览器中看不到任何内容。随着脚本变得越来越长，且使用多个库变得流行，将脚本放在页面底部更好。这样浏览器会先加载\
    \ HTML，用户可以在脚本加载期间看到页面。你应该使用 `window.onload` 事件来确保在使用任何 DOM 脚本之前页面已加载完毕。\n\n```html\n\
    // 代替\n<head>\n<script src=\"longScript.js\"></script>\n</head> \n<body>\n  content,\
    \ images\n</body>\n\n// 脚本加载时，用户可以看到页面\n```\n\n### \"use strict\" 指令\n\nJavaScript\
    \ 非常灵活，通常不会为错误的语法报错。`\"use strict\"` 是一个字面量表达式，旧版本的 JavaScript 会忽略它（例如 `< IE 10>`）。如果\
    \ `\"use strict\"` 声明位于 JavaScript 文件开头，它具有全局作用域，所有代码将以严格模式执行。虽然这通常是有效的，严格模式会导致错误，因为它要求所有变量必须声明。\n\
    \n```javascript\nx = 10;\nperson = {\nfirstName: \"John\",\nlastName: \"Doe\"\n\
    };\n```\n\n以下内容强制 JavaScript 对写错误的变量抛出错误，而不是将其变为新变量。由于全局 `\"use strict\"` 要求函数内部的变量必须声明，它实际上要求变量是局部的。\n\
    \n```javascript\n//demo11-1.html\n\"use strict\";\nvar x = 10;\nvar person = {\n\
    firstName: \"John\",\nlastName: \"Doe\"\n};\nfor (var i = 0; i < 10; i++) {\n\
    \  document.write(i);\n}\nfunction calcTotal(){\n  x = 20; // 因为 x 在上面已经声明了\n\
    \  y = 10; // 全局 strict 导致错误\n  var z = 20; // 有效\n}\n```\n\n如果 `\"use strict\"\
    ` 声明在函数内部，它具有局部作用域，仅适用于内部的代码。\n\n```javascript\n//demo11-2.html\nx = 10; // 不是严格模式，这是有效的\n\
    function calcTotal(){\n  \"use strict\"; // 在函数作用域内\n  y = 20; // 无效\n  var z\
    \ = 30; // 有效\n}\n```\n\n### JavaScript debugger 语句\n\n浏览器错误控制台会显示语法错误，但逻辑错误很难发现。一种方法是向\
    \ `document.write()` 写入。只有进入浏览器的 JavaScript 控制台时才能看到结果。\n\n```javascript\nvar\
    \ x = 10;\nalert(x);\n```\n\n如果发生错误，JavaScript 将不会运行任何代码。你可能想设置断点并一次运行一部分代码。断点会强制\
    \ JavaScript 停止执行并允许检查 JavaScript 值。你可以在调试器内部重新启动脚本。\n\n"
- fmt: "\nJavaScript has a `debugger;` statement that sets a breakpoint on the line\
    \ it is on. When the code is viewed in the browser, the `debugger;` statement\
    \ has no effect. When the code is run with the debugging tools activated, it sets\
    \ a breakpoint and provides an arrow to click on to restart code. You can use\
    \ the `debugger;` statement to set breakpoints as many times in the code as you\
    \ need.\n\nWithout debugging tools activated, this alerts you. In debugger mode,\
    \ this stops below each variable assignment and waits for an arrow to be pressed\
    \ to restart the code.\n\n```javascript\n//demo11-3.html\nvar x = 10;\ndebugger;\n\
    var y = 20;\ndebugger;\nalert(x + y);\n```\n\n## Custom Error Handling\n\nJavaScript\
    \ has `try`, `catch`, `throw` and `finally` statements that let you customize\
    \ error handling. `try` takes a block of code to test, `catch` lets you handle\
    \ the error, `throw` lets you create custom errors, and `finally` lets you execute\
    \ code regardless of the result of the `try` and `catch`. Combinations of flow\
    \ control with these four statements are: `try/catch`, `try/finally`, or `try/catch/finally`.\
    \ The `throw` statement that overwrites the built-in error goes in the `try` block.\n\
    \nLet's say we misspell a method. JavaScript will output an error to the console.\
    \ We can catch the error and redirect it to the page instead of the console. The\
    \ built-in error is available to the `catch` statement. Whatever variable is passed\
    \ to `catch` represents the error, in this case `error`. The `error` has a `message`\
    \ property.\n\n```javascript\n//demo11-4.html\ntry {\n  alerts(\"Welcome guest!\"\
    );\n}\ncatch(error) {\n  document.getElementById(\"demo\").innerHTML = error.message;\n\
    }\n```\n\nWe can raise an error or throw an exception and create our own error\
    \ message.\n\n```javascript\n//demo11-5.html\nvar x = prompt(\"Enter a number\"\
    , \"\");\ntry {\n  //as many tests and throws here as needed\n  if (x == \"\"\
    ) {\n    throw \"empty\";\n  }\n}\ncatch(error) {\n  alert(error); //now the custom\
    \ error\n}\nfinally {\n  //clean-up code happens regardless\n}\n```\n\n### Exercise\
    \ 11-1 Throwing a custom error\n\nThrow a custom error for a form field.\n\nIn\
    \ the browser, open `exercise11-1.html`. Test the form field when it is empty,\
    \ not a number, and a number under 5 or greater than 100.\n\nIn your editor, open\
    \ `Lesson 11/Exercises/js/exercise11-1.js`. We are going to throw a set of custom\
    \ errors for the field.\n\nCreate a function called `checkAge()`. Inside:\n- Declare\
    \ variables `message` and `age`.\n- Set the `message` variable from the area on\
    \ the page with `id=\"message\"` so we can output it.\n- Set the `age` variable\
    \ from the age form field.\n- Use `try` to set a series of `if` tests.\n- If the\
    \ `age` field is empty, throw an error stating that it is empty.\n- If the `age`\
    \ field is not a number (Hint: `isNaN()`), throw an error stating that.\n- If\
    \ the `age` field is below five, throw an error stating that it is too low.\n\
    - If the `age` field is over 100, throw an error stating that it is too high.\n\
    - Catch the error (Hint: use `catch(err)` and then print out `err`). Write the\
    \ message to the appropriate field, and stop the form from submitting if there\
    \ is an error.\n- On page load, get the form element, and call the `checkAge()`\
    \ function when it is submitted.\n- Add a reference to the file to `Lesson 11/Exercises/exercise11-1.html`,\
    \ save and test.\n\n## Lesson 12: Working with forms\n\nIn this lesson, you will\
    \ learn about:\n1. Validating Form Data with JavaScript\n2. Data Validation with\
    \ Regular Expressions\n\n## Validating Form Data with JavaScript\n\nAn HTML `<form>`\
    \ is the most common way to get input from the user. The data is often sent to\
    \ a database to be stored, requiring server-side scripting. The HTML `<form>`\
    \ tag will reference the server-side script and the method with which to send\
    \ data. When the user clicks a \"submit\" button, the data is sent to that script.\n\
    \n```html\n<form method=\"post\" action=\"proc.php\" id=\"frm\">\n```\n\nAlthough\
    \ the data should ultimately be validated on the server, client-side validation\
    \ or data qualification is helpful. It gives the server a break, and it makes\
    \ the page more responsive by letting the user know right away when there is a\
    \ problem.\n\nIf the data is not valid according to our script, we want to prevent\
    \ form submission and give the user a chance to correct it. Form validation gets\
    \ data with the DOM, uses events to call functions, and tests with string and\
    \ regular expression methods.\n\nThe form and its elements should have IDs so\
    \ that they can be uniquely identified and accessed.\n\n```javascript\nvar frm\
    \ = document.getElementById(\"frm\");\n```\n\nThere are several ways to get form\
    \ elements as a collection that you can loop through. The form has an `elements`\
    \ collection:\n\n```javascript\nvar els = frm.elements;\n//can also be chained\
    \ together\ndocument.getElementById(\"frm\").elements;\n```\n\nYou can use a DOM\
    \ method:\n```javascript\nvar els = document.getElementsByTagName(\"input\");\n\
    ```\n\nOr a CSS attribute selector:\n```javascript\nvar els = document.querySelectorAll(\"\
    input\");\n//specify the form\nvar els = document.querySelectorAll(\"#frm input\"\
    );\n//only input type=\"text\"\nvar els = document.querySelectorAll(\"[type=text]\"\
    );\n```\n\nValidation tests include:\n- Checking that required fields are not\
    \ empty\n- Making sure one of a set of radio buttons or pulldown options has been\
    \ selected\n- Checking that input is in the correct format\n- Compare two fields\
    \ to make sure they match\n- Checking for an accurate numeric range\n\n### Form\
    \ Events\n\nThe form object has the `onsubmit` and `onreset` events that can process\
    \ return values. If they are set to false, the submit or reset will not be performed.\
    \ The true and false values should be acquired dynamically, of course!\n\n`confirm()`\
    \ returns true if the user clicks the \"Ok\" button and false if the user clicks\
    \ the \"cancel\" button. `return` captures the true or false. If false, this code\
    \ is the equivalent of `onreset = false` and does not reset the form. `true` is\
    \ automatically returned if false is not.\n\n```javascript\nfunction check(){\n\
    \  var yn = confirm(\"Do you want to clear?\");\n  if(yn == false){\n    event.preventDefault();\n\
    \  }\n}\nfrm.addEventListener(\"reset\", check);\n```\n\nThe `onsubmit` event\
    \ will capture true or false from a function that determines if the form data\
    \ is valid. The form will not submit if `onsubmit = false`.\n\n```javascript\n\
    function validate(){\n  fName = document.getElementById(\"fName\");\n  if(fName.value\
    \ == \"\"){\n    alert(\"The name field is empty\");\n    event.preventDefault();\n\
    \  }\n}\nfrm.addEventListener(\"submit\", validate);\n```\n\n### Checking for\
    \ Empty Fields\n\nJavaScript has access to the form and elements' attributes.\
    \ Form attributes include `method`, `action`, `name`, and `id`. Useful element\
    \ attributes include `name`, `type`, and `value`.\n\nBelow, we loop through text\
    \ elements. We use `value` to access the contents of the field and test if they\
    \ are empty, and `id` to identify the missing fields in our error message. This\
    \ code should go in a function that is called when the form is submitted. It is\
    \ very important to get the value, because you want to test a string, not an object.\
    \ Once we have the string, we can use string methods like `trim()`.\n\nWhat if\
    \ the user types only a space into the firstname field? Technically, that field\
    \ is not empty, but it doesn’t have meaningful content either. Our validating\
    \ function will strip out leading and trailing spaces and analyze what is left.\n\
    \n```javascript\nvar els = document.querySelectorAll(\"[type=text]\");\nfor (i\
    \ = 0; i < els.length; i++){\n  if(els[i].value.trim() == \"\"){\n    alert(els[i].id\
    \ + \" is required!\");\n    event.preventDefault();\n  }\n}\n```\n\nIn this example,\
    \ we test only one field, when the user leaves the field (when the `onblur` event\
    \ takes place). Remember that form events include `onfocus` and `onblur`. Form\
    \ elements also have a `focus()` method that puts the cursor into a field, and\
    \ `blur()` that takes the cursor out. We use the keyword `this` to refer to the\
    \ current field. If the user leaves the required field without typing anything\
    \ in, we will show them an error message and put their cursor back in the field.\n\
    \n```javascript\nfunction validateField(){\n  if(this.value.trim() == \"\"){\n\
    \    alert(\"this field is required\");\n    this.focus();\n  }\n} \nfName.addEventListener(\"\
    blur\", validateField);\n```\n\n### Testing for String Length\n\nStrings and arrays\
    \ have a `length` property.\n"
