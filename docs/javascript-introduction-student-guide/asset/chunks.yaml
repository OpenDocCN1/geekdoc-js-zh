    for (i = 0; i < len; i++) {}


    While JavaScript''s ability to work with the HTML DOM makes web pages very interactive,
    accessing the DOM is a relatively slow and "expensive" operation. If you expect
    to access the same DOM object more than once in a script, store it in a variable
    to re-use.


    //get once


    var div = document.getElementById("divMain");


    //use multiple times


    div.innerHTML = "Hi";


    div.style.color = "blue";


    In the past, there was a convention to put scripts in the head tag of an HTML
    page to get them out of the way. Browser code is single-threaded, so HTML in the
    body won''t load until the scripts have loaded. The user won''t see anything in
    the browser during that time. As scripts have become longer and it has become
    popular to use several libraries, it is better to put scripts at the bottom of
    the page. This way the browser loads the HTML first, and the user can see the
    page while the scripts are loading. You should use the window.onload event to
    make sure the page has loaded before using any DOM scripting.


    //instead of


    <head>


    <script src="longScript.js"></script>


    </head> 


    <body>


    content, images


    </body>


    //user sees page while script is loading


    <body>


    content, images


    <script src="longScript.js"></script>


    </body>


    #### The "use strict"; Directive


    JavaScript is very flexible, and won''t generally throw errors for bad syntax.
    "use strict" is a literal expression, ignored by older versions of JavaScript
    (for example, < IE 10). If the "use strict" declaration is at the beginning of
    a JavaScript file, it has global scope, and all code executes in strict mode.
    While this is normally valid code, strict mode would cause an error, as it requires
    all variables to be declared.


    x = 10;


    person = {


    firstName: "John",


    lastName: "Doe"


    };


    The following forces JavaScript to throw an error for mistyped variables, which
    are undeclared, instead of making them into a new variable. Since a global "use
    strict" requires variables inside a function to be declared, it effectively requires
    them to be local. 


    //demo11-1.html


    "use strict";


    var x = 10;


    var person = {


    firstName: "John",


    lastName: "Doe"


    };


    for (var i = 0; i < 10; i++) {


    document.write(i);


    }


    function calcTotal(){


    x = 20; //ok because x declared above


    y = 10; //global use strict causes error


    var z = 20; //valid


    }


    If the "use strict" declaration is inside a function, it has local scope and only
    applies to the code inside.


    //demo11-2.html


    x = 10; //not in strict mode, this is valid


    function calcTotal(){


    "use strict"; //in scope of function


    y = 20; //not valid


    var z = 30; //valid


    }


    #### The JavaScript debugger; Statement


    A browser''s error console will show syntax errors, but logical errors are difficult
    to find. One approach is to write to document.write(). You can only see the result
    if you go to the browser''s JavaScript console.


    var x = 10;


    alert(x);


    If there is an error, JavaScript will not run any code. You might want to set
    breakpoints and run a little bit of code at a time. Breakpoints force JavaScript
    to stop executing and allow you to check JavaScript values. You can restart the
    script from within the debugger.'
