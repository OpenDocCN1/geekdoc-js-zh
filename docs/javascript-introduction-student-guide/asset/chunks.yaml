  trans: "\n`switch` 结构用于在多个要执行的代码块中进行选择。与 `if/else if` 结构不同，`switch` 表达式（可以变量）只求值一次。\n\
    \n`switch` 结构中表达式的值将与每个 `case` 的值进行比较。每个 `case` 值以冒号结尾。如果值匹配某个 `case`，则执行与该 `case`\
    \ 关联的代码块。`default` 语句不是必须的，但它用于指定在没有匹配时运行的代码。它类似于 `else`。\n\n关键字 `break;` 用于跳出\
    \ `switch` 块。当找到 `case` 匹配且不再需要继续测试时，使用它。在 `switch` 的最后一条语句中不需要 `break;`。\n\n\
    ```\nswitch (expression) {\n  case value1:\n    statement;\n    break;\n  case\
    \ value2:\n    statement if previous case false;\n    break;\n  default:\n   \
    \ statement if previous case false;\n    //break; not necessary at the end\n}\n\
    ```\n\n如果没有 `break`，不同的 `case` 将发生“贯穿”并执行相同的代码。有时这可以化为有利。\n\n```\nswitch (expression)\
    \ {\n  case value1:\n  case value2:\n    statement to run for both cases;\n  \
    \  break;\n  default:\n    statement to run if previous false;\n}\n```\n\n```javascript\n\
    var day = \"Monday\";\nswitch (day) {\n  case \"Saturday\":\n  case \"Sunday\"\
    :\n    msg = \"It’s a weekend!\";\n    break;\n  default:\n    msg = \"It’s a\
    \ weekday.\";\n}\n```\n\n### 练习 2-2 使用 switch\n\n在本次练习中，你将使用 `switch` 结构。\n\n\
    - 使用你的编辑器，创建一个名为 `exercise2-2.js` 的文件。\n- 将文件保存到 `Lesson 2/Exercises/js` 中。\n\
    - 要求用户输入一个字母表中的字母。\n- 使用 `switch` 判断该字母是辅音还是元音。\n- 使用 `document.write()` 打印它是辅音还是元音。\n\
    - 在 `Lesson 2/Exercises/exercise2-2.html` 中添加 JavaScript 文件的引用并进行测试。\n\n### 条件运算符（三元运算符）\n\
    \n条件运算符 `(?:?)` 是 JavaScript 中唯一接受三个操作数（三元）的运算符。它被用作 `if/else` 结构的快捷方式。第一个操作数必须求值为真或假。表达式的值可以是任何类型。\n\
    \n`condition ? expression1 : expression2;`\n\n如果 `condition` 为真，则三元运算符返回 `expression1`（即\
    \ `?` 之后的值）。否则，它返回 `expression2`（即 `:` 之后的值）。返回的结果可以输出、赋值给变量或打印。\n\n```javascript\n\
    var result = condition ? expression1 : expression2;\ndocument.write(condition\
    \ ? expression1 : expression2);\n```\n\n要要执行多个操作，请用逗号分隔。\n\n`condition ? operation1,\
    \ operation2 : operation3, operation4;`\n\n```javascript\nvar numOfApples = 4;\n\
    var apples = numOfApples == 1 ? //condition\n  \"There is \" + numOfApples + \"\
    \ apple \" : //op. if true\n  \"There are \" + numOfApples + \" apples \"; //op.\
    \ if false\ndocument.write(apples);\n```\n\n### 练习 2-3 使用三元运算符\n\n将三元运算符作为 `if/else`\
    \ 的快捷方式。\n\n- 使用你的编辑器，创建一个名为 `exercise2-3.js` 的文件。\n- 将文件保存到 `Lesson 2/Exercises/js`\
    \ 中。\n- 要求用户输入一个不带美元符号的价格。\n- 如果价格超过 100 美元，将应用 10% 的折扣。\n- 使用三元运算符判断是否应用了折扣。\n\
    - 使用 `document.write()` 打印总价以及是否应用折扣。\n- 在 `Lesson 2/Exercises/exercise2-3.html`\
    \ 中添加 JavaScript 文件的引用并进行测试。\n\n# 第 3 节：JavaScript 循环\n\n**单元时间：** 75 分钟\n\n在本节中，你将学习：\n\
    1. JavaScript 循环\n2. JavaScript 标签和分支语句\n\n## JavaScript 循环\n\nJavaScript 有三种\
    \ C 风格的循环，而 `do…while` 和 `for`。此外，JavaScript 还有一个 `for…in` 循环，用于迭代遍历对象的可枚举属性。\n\
    \n循环用于根据需要多次测试特定条件，或者重复执行代码特定次数。它们经常被用于遍历数组或对象，或者验证表单元素。\n\n### while 循环\n\n`while`\
    \ 循环是一种预测试循环，在循环运行之前测试条件。`while` 循环中的代码块只要条件为真就会一直执行。当条件表达式返回假时，循环停止。\n\n```javascript\n\
    while (condition) {\n  statements to run if condition is true;\n}\n```\n\n与 `if`\
    \ 结构一样，如果只有一条语句，可以省略大括号，但最好使用它们。\n\n如果条件表达式永远不会变为假，循环将永远不会结束，导致死循环。\n\n//demo3-1.html\n\
    ```javascript\nvar x = 0;\nwhile (x < 10) {\n  document.write(x);\n  document.write(\"\
    <br>\");\n  x++; //增加 1 以在 10 结束\n}\n```\n\n当条件为假时，`while` 循环不执行。\n\n```javascript\n\
    var x = 10;\nwhile (condition) {\n  document.write(x);\n  x++;\n}\n```\n\n###\
    \ 练习 3-1 使用 while 循环\n\n在本次练习中，你将使用 `while` 循环。\n\n- 使用你的编辑器，创建一个名为 `exercise3-1.js`\
    \ 的文件。\n- 将文件保存到 `Lesson 2/Exercises/js` 中。\n- 假设有一个变量 `x = 0`。\n- 使用 `while`\
    \ 循环，当 `x` 小于 10 时打印 `x` 并换行。\n- 每次将 `x` 增加 1，以便在 10 时结束。\n- 在 `Lesson 2/Exercises/exercise3-1.html`\
    \ 中添加 JavaScript 文件的引用并进行测试。\n\n### do…while 循环\n\n`do…while` 循环是一种后测试循环，在循环运行之后测试条件。`do…while`\
    \ 循环中的代码块至少执行一次。当条件返回假时，循环停止。\n\n```javascript\ndo {\n  statements to run if condition\
    \ is true;\n} while (condition);\n```\n\n与 `while` 结构一样，如果只有一条语句，可以省略大括号。\n\n\
    如果条件表达式永远不会变为假，循环将永远不会结束，导致死循环。\n\n//demo3-2.html\n```javascript\nvar x = 0;\n\
    do {\n  document.write(x);\n  document.write(\"<br>\");\n  x++; //增加 1 以在 10 结束\n\
    } while (x < 10);\n```\n\n即使条件一开始为假，`do…while` 循环也会执行一次。\n\n```javascript\nvar\
    \ x = 10;\ndo {\n  // statements\n} while (condition); \n```\n\n### 练习 3-2 使用\
    \ do…while 循环\n\n在本次练习中，你将使用 `do…while` 循环。\n\n- 使用你的编辑器，创建一个名为 `exercise3-2.js`\
    \ 的文件。\n- 将文件保存到 `Lesson 2/Exercises/js` 中。\n- 假设有一个变量 `x = 0`。\n- 使用 `do…while`\
    \ 循环，当 `x` 小于 10 时打印 `x` 并换行。\n- 每次将 `x` 增加 1，以便在 10 时结束。\n- 在 `Lesson 2/Exercises/exercise3-2.html`\
    \ 中添加 JavaScript 文件的引用并进行测试。\n\n### for 循环\n\n`for` 循环与 `while` 循环最相似。如果条件初始为真，它将运行语句块，直到条件为假。`for`\
    \ 循环在括号中有三个部分，用分号分隔。第一部分是计数变量的声明。第二部分是决定是否运行循环的条件表达式。最后一部分重置初始变量，通常是增加或减少计数器。`for`\
    \ 循环的最后部分没有分号。\n\n```javascript\nfor (initialize; condition; increment/decrement)\
    \ {\n  statements;\n}\n```\n\n如果只有一条语句，`for` 循环也可以省略大括号。\n\n与其他循环一样，忽略未修改初始变量会导致死循环。\n\
    \n//demo3-4.html\n```javascript\nfor (var x = 0; x < 10; x++) {\n  document.write(x)\n\
    }\n```\n\n### for…in 循环\n\n`for…in` 循环用于遍历数组或对象，将在“复合数据类型”课程中进行详细介绍。关键字是 `for`\
    \ 和 `in`。下面，`property` 是代表对象属性的变量，`object` 是对象或数组的名称。\n\n`for…in` 循环不使用数字计数器。\n\
    \n```javascript\nfor (property in object) {\n  document.write(property + object[property]);\n\
    }\n```\n\n与其他结构一样，如果只有一条语句，可以省略大括号。\n\n"
- fmt: "\n# JavaScript Labels and Branch Statements\n\nIn JavaScript, `break;` and\
    \ `continue;` can be used as branch statements. They can be used with or without\
    \ labels. They determine what code the program should execute next. A label is\
    \ any identifier with a colon after it. The branch statements `break;` and `continue;`\
    \ can be used in a loop to transfer program control.\n\n## Using a `break;` statement\n\
    \nThe `break;` statement terminates the loop (or switch), jumping to the next\
    \ statement outside of the loop or switch.\n\n```javascript\n//demo3-5.html\n\
    for (var x = 1; x <= 10; x++) {\n  if (x % 5 == 0) {\n    break; //run until divisible\
    \ by 5\n  }\n  document.write(x);\n}\n```\n\n### In a nested loop, the `break;`\
    \ terminates the current loop.\n\n```javascript\n//demo3-6.html\nvar i = 0;\n\
    //runs 3 times, breaking at number 4\nwhile (i < 3){\n  for (x = 1; x <= 10; x++)\
    \ {\n    if (x % 5 == 0) {\n      break;\n    }\n    document.write(x);\n  }\n\
    \  i++;\n}\n```\n\n`break;` can pass program control to a label. In this example,\
    \ program control is passed to the outer `while` loop when the `for` loop reaches\
    \ the number 4 because of the `outerLoop:` label created by the developer.\n\n\
    ```javascript\n//demo3-7.html\nvar i = 0;\n//runs once, breaking at number 4\n\
    outerLoop: while (i < 3){\n  for (x = 1; x <= 10; x++) {\n    if (x % 5 == 0)\
    \ {\n      break outerLoop; //label\n    }\n    document.write(x);\n  }\n  i++;\n\
    }\n```\n\n### Using the `continue` Statement\n\nThe `continue;` statement terminates\
    \ execution of the loop at the current iteration and continues the loop at the\
    \ next iteration. Once the `continue;` statement is executed, statements below\
    \ it are skipped. Below, if numbers are not evenly divisible by 5, jump to the\
    \ next iteration of the loop. Only numbers divisible by 5 are printed.\n\n```javascript\n\
    //demo3-8.html\nfor (var x = 0; x <= 10; x++) {\n  if (x % 5 != 0) {\n    continue;\n\
    \  }\n  document.write(x); //if divisible by 5\n}\n```\n\nProgram control can\
    \ also be passed to a label with the `continue;` statement.\n\n## Exercise 3-3\
    \ Using branch statements\n\nUse a branch statement to manipulate program control.\n\
    \nUsing your editor, create a file named `exercise3-3.js`.\n\nSave the file in\
    \ `Lesson 3/Exercises/js`.\n\nGenerate a random number between 1 and 10. Hint:\
    \ use `Math.random()`.\n\nGive the user three chances to guess the number. If\
    \ they guess, give them a \"congratulations\" message and tell them how many guesses\
    \ it took.\n\nWhat should you do to the loop if the user guesses before the three\
    \ chances are up?\n\nGive the user the opportunity to quit the guessing game by\
    \ typing \"Q\" (case-insensitive).\n\nIf they don’t guess the correct number in\
    \ three tries, print the random number.\n\nAdd a reference to the JavaScript file\
    \ to `Lesson 3/Exercises/exercise3-3.html` and test.\n\n# Lesson 4: Primitive\
    \ Data Types\n\nUnit time: 75 minutes\n\nIn this lesson, you will learn about:\n\
    1. The `String` Data Type\n2. The `Number` Data Type\n\n## The String Data Type\n\
    \nA string is a sequence of characters delimited by double or single quotes, used\
    \ for text representation. A string literal is a primitive type, like a numeric\
    \ or Boolean value. Some popular operations on strings include checking their\
    \ length, concatenating, searching for a character, or extracting a substring.\n\
    \n```javascript\nvar str = \"hello world\";\n```\n\nThe primitive type is converted\
    \ to a string object when necessary, so the variable containing the string literal\
    \ can use properties and methods. `String()` is useful for converting another\
    \ data type to string so that you can use properties and methods. The `String()`\
    \ constructor creates a string object.\n\n```javascript\nvar x = 100;\nvar str\
    \ = String(x)\n```\n\n### String Properties\n\nThe `length` property of a string\
    \ returns the length of the string.\n\n```javascript\n//demo4-1.html\nvar email\
    \ = \"username@emaildomain.com\";\nvar len = email.length;//returns 24\n```\n\n\
    A string can be empty, in which case it has a length of 0.\n\n```javascript\n\
    var str = \"\";\nvar strlen = str.length; //returns 0\n```\n\n### String Methods\n\
    \nBelow are explanations for some of the string methods that can be used to manipulate\
    \ data types.\n\n`charAt()`\nThe `charAt()` method takes an index number and returns\
    \ the character at that index. The index number is an integer between 0 and less\
    \ than the length of the string. If the index provided is longer than the length\
    \ of the string, an empty string is returned.\n\n```javascript\n//demo4-2.html\n\
    var email = \"username@emaildomain.com\";\nvar character = email.charAt(0); //returns\
    \ \"u\"\ndocument.write(character)\n```\n\n`indexOf()`\nThe `indexOf()` method\
    \ takes the character(s) to search for, and an optional starting index number.\
    \ It returns an index number from 0 to less than the length of the string. If\
    \ the characters are not found in the string, it returns -1. The search is case\
    \ sensitive.\n\n```javascript\n//demo4-3.html\nvar email = \"username@emaildomain.com\"\
    ;\nvar index = email.indexOf(\"a\");\ndocument.write(index); //returns 5\nindex\
    \ = email.indexOf(\"a\", 6); //11\nindex = email.indexOf(\"a\", 18); //1\nindex\
    \ = email.indexOf(\"z\"); //-1\n```\n\n`lastIndexOf()`\nThe `lastIndexOf()` method\
    \ returns the index number of the last occurrence of the character in the string.\
    \ The search begins at the end of the string. The search is case sensitive.\n\n\
    ```javascript\n//demo4-4.html\nvar lindex = email.lastIndexOf(\"a\"); //17\nlindex\
    \ = email.lastIndexOf(\"a\", 16); //11\ndocument.write(lindex)\n```\n\n`split()`\n\
    The `split()` method splits a string into an array of substrings according to\
    \ a delimiter or separator.\n\n```javascript\n//demo4-5.html\nvar strDays = \"\
    Mon, Tues, Thurs, Fri\";\n//split by comma and space\nvar arrDays = strDays.split(\"\
    , \"); //Mon, Tues, Thurs, Fri\ndocument.write(arrDays);\n```\n\n`slice()` vs.\
    \ `substring()` vs. `substr()`\nThe `slice()` method extracts part of a string\
    \ and returns it. The method takes an index number at which to begin the slice,\
    \ and an index at which to end the slice as an optional second argument. `slice()`\
    \ extracts up to not including the second argument. If the second argument is\
    \ omitted, `slice()` extracts to the end of the string. If either argument is\
    \ a negative number, it is treated as `string.length – number`. The `substring()`\
    \ method also takes an index number to begin with and one to end with. In contrast,\
    \ the `substr()` method takes an index as its first argument and a number of characters\
    \ as its second.\n\n```javascript\n//demo4-6.html\nvar email = \"username@emaildomain.com\"\
    ;\nvar strSlice = email.slice(9); //\"emaildomain.com\"\nstrSlice = email.slice(9,\
    \ 20); //\"in.com\"\nstrSlice = email.substring(9, 20); //\"emaildomain\"\nstrSlice\
    \ = email.substr(9, 11); //\"emaildomain\"\n```\n\n`trim()`\nThe `trim()` method\
    \ returns a string with whitespace removed from both ends, without affecting the\
    \ value of the original string.\n\n```javascript\n//demo4-7.html\nvar user = \"\
    \  UserName \";\nvar trimUser = user.trim();\ndocument.write(trimUser); //\"UserName\"\
    \ndocument.write(user); //\"  UserName  \"\n```\n\n`toLowerCase()`\nThere is a\
    \ string method for converting a string to lowercase and returning the result,\
    \ `toLowerCase()`.\n\n```javascript\n//demo4-8.html\nvar user = \"UserName\";\n\
    var lcUser = user.toLowerCase(); //username\ndocument.write(lcUser)\n```\n\n`toUpperCase()`\n\
    The string method `toUpperCase()` converts a string to uppercase and returns the\
    \ result.\n\n```javascript\n//demo4-9.html\nvar ucUser = user.toUpperCase(); //USERNAME\n\
    document.write(ucUser);\n```\n\n## Exercise 4-1 Using string manipulation methods\n\
    \nUse string methods and logic to validate the data being input.\n\nUsing your\
    \ editor, create a file named `exercise4-1.js`.\n\nSave the file in `Lesson 4/Exercises/js`.\n\
    \nAsk the user for their email address, and use `if…else/if…else` to test.\n\n\
    Recall that if you are searching for a letter, it is case-sensitive, but email\
    \ addresses are not case-sensitive. It is useful to convert the email address\
    \ to lowercase if you are going to test it against a string.\n\nMake sure their\
    \ entry is not blank by first using the string’s `trim()` method to strip out\
    \ whitespace.\n\nPerform some data validation on the email address.\n\nAn email\
    \ address can’t be valid if it is less than 6 characters long. Test that it is\
    \ at least 6 characters long.\n\nThe email address should have\n- An `@` sign\n\
    - No more than one `@` sign\n"
  raw: '## JavaScript Labels and Branch Statements


    In JavaScript, break; and continue; can be used as branch statements. They can
    be used with or without labels.  They determine what code the program should execute
    next. A label is any identifier with a colon after it. The branch statements break;
    and continue; can be used in a loop to transfer program control.


    ### Using a break; statement


    The break; statement terminates the loop (or switch), jumping to the next statement
    outside of the loop or switch.


    //demo3-5.html


    for (var x = 1; x <= 10; x++) {


    if (x % 5 == 0) {


    break; //run until divisible by 5


    }


    document.write(x);


    }


    ### In a nested loop, the break; terminates the current loop.


    //demo3-6.html


    var i = 0;


    //runs 3 times, breaking at number 4


    while (i < 3){


    for (x = 1; x <= 10; x++) {


    if (x % 5 == 0) {


    break;


    }


    document.write(x);


    }


    i++;


    }


    break; can pass program control to a label. In this example, program control is
    passed to the outer while loop when the for loop reaches the number 4 because
    of the outerLoop: label created by the developer. 


    //demo3-7.html


    var i = 0;


    //runs once, breaking at number 4


    outerLoop: while (i < 3){


    for (x = 1; x <= 10; x++) {


    if (x % 5 == 0) {


    break outerLoop; //label


    }


    document.write(x);


    }


    i++;


    }


    ### Using the continue Statement


    The continue; statement terminates execution of the loop at the current iteration
    and continues the loop at the next iteration. Once the continue; statement is
    executed, statements below it are skipped. Below, if numbers are not evenly divisible
    by 5, jump to the next iteration of the loop. Only numbers divisible by 5 are
    printed.


    //demo3-8.html


    for (var x = 0; x <= 10; x++) {


    if (x % 5 != 0) {


    continue;


    }


    document.write(x); //if divisible by 5


    }


    Program control can also be passed to a label with the continue; statement.


    ### Exercise 3-3 Using branch statements


    Use a branch statement to manipulate program control.


    Using your editor, create a file named exercise3-3.js.


    Save the file in Lesson 3/Exercises/js.


    Generate a random number between 1 and 10\. Hint: use Math.random().


    Give the user three chances to guess the number. If they guess, give them a "congratulations"
    message and tell them how many guesses it took.


    What should you do to the loop if the user guesses before the three chances are
    up?


    Give the user the opportunity to quit the guessing game by typing "Q" (case-insensitive).


    If they don’t guess the correct number in three tries, print the random number.


    Add a reference to the JavaScript file to Lesson 3/Exercises/exercise3-3.html
    and test.


    Lesson 4:  Primitive Data Types


    Unit time: 75 minutes


    In this lesson, you will learn about:


    1   The String Data Type


    2   The Number Data Type


    ## The String Data Type


    A string is a sequence of characters delimited by double or single quotes, used
    for text representation. A string literal is a primitive data type, like a numeric
    or Boolean value. Some popular operations on strings include checking their length,
    concatenating, searching for a character or substring, or extracting a substring.


    var str = "hello world";


    The primitive type is converted to a string object when necessary, so the variable
    containing the string literal can use string properties and methods. new String()
    is useful for converting another data type to string, so that you can use string
    properties and methods. If string properties and methods are used on another data
    type such as a number, an error is returned. 


    The new String() constructor creates a string object.


    var x = 100;


    var str = new String(x)


    #### String Properties


    The length property of a string returns the length of the string.


    //demo4-1.html


    var email = "username@emaildomain.com";


    var len = email.length;


    document.write(len);//returns 24


    A string can be empty, in which case it has a length of 0.


    var str = "";


    var strlen = str.length; //returns 0


    #### String Methods


    Below are explanations for some of the string methods that can be used to manipulate
    string data types. 


    charAt()


    The charAt() method takes an index number and returns the character at that index. 
    The index number is an integer between 0 and 1 less than the length of the string.
    If the index provided is longer than the length of the string, an empty string
    is returned.


    //demo4-2.html


    var email = "username@emaildomain.com";


    var character = email.charAt(0); //returns "u"


    document.write(character)


    indexOf()


    The indexOf() method takes the character(s) to search for, and an optional starting
    index number. It returns an index number from 0 to 1 less than the length of the
    string. If the characters are not found in the string, it returns -1.  The search
    is case sensitive.


    //demo4-3.html


    var index = email.indexOf("a");


    document.write(index); //returns 5


    index = email.indexOf("a", 6); //11


    index = email.indexOf("a", 18); //-1


    index = email.indexOf("z"); //-1


    lastIndexOf()


    The lastIndexOf() method returns the index number of the last occurrence of the
    character in the string. The search begins at the end of the string. The search
    is case sensitive.


    //demo4-4.html


    var lindex = email.lastIndexOf("a"); //17


    lindex = email.lastIndexOf("a", 16); //11


    document.write(lindex);


    split()


    The split() method splits a string into an array of substrings according to a
    delimiter or separator.


    //demo4-5.html


    var strDays = "Mon, Tues, Wed, Thurs, Fri";


    //split by comma and space


    var arrDays = strDays.split(", ");


    //Mon, Tues, Wed, Thurs, Fri


    document.write(arrDays);


    slice() vs. substring() vs. substr()


    The slice() method extracts part of a string and returns it. The method takes
    an index number at which to begin the slice, and an index at which to end the
    slice as an optional second argument. slice() extracts up to but not including
    the second argument. If the second argument is omitted, slice() extracts to the
    end of the string. If either argument is a negative number, it is treated as string.length
    – number. The substring() method also takes an index number to begin with and
    one to end with. In contrast, the substr() method takes an index as its first
    argument and a number of characters as its second.


    //demo4-6.html


    var email = "username@emaildomain.com";


    var strSlice = email.slice(9); //"emaildomain.com"


    strSlice = email.slice(9, 20); //"in.com"


    strSlice = email.substring(9, 20); //"emaildomain"


    strSlice = email.substr(9, 11); //"emaildomain"


    trim()


    The trim() method returns a string with whitespace removed from both ends, without
    affecting the value of the original string.


    //demo4-7.html


    var user = "    UserName ";


    var trimUser = user.trim();


    document.write(trimUser); //"UserName"


    document.write(user); //"    UserName    "


    toLowerCase()


    There is a string method for converting a string to lowercase and returning the
    result, toLowerCase().


    //demo4-8.html


    var user = "UserName";


    var lcUser = user.toLowerCase();


    //username


    document.write(lcUser);


    toUpperCase()


    The string method toUpperCase() converts a string to uppercase and returns the
    result.


    //demo4-9.html


    Var ucUser = user.toUpperCase();


    //USERNAME


    document.write(ucUser);


    Exercise 4-1 Using string manipulation methods


    Use string methods and logic to validate the data being input.


    Using your editor, create a file named exercise4-1.js.


    Save the file in Lesson 4/Exercises/js.


    Ask the user for their email address, and use if…else/if…else to test.


    Recall that if you are searching for a letter, it is case-sensitive, but email
    addresses are not case-sensitive. It is useful to convert the email address to
    lowercase if you are going to test it against a string.


    Make sure their entry is not blank by first using the string’s trim() method to
    strip out whitespace.


    Perform some data validation on the email address.


    An email address can’t be valid if it is less than 6 characters long. Test that
    it is at least 6 characters long.


    The email address should have


    An @ sign


    No more than one @ sign'
