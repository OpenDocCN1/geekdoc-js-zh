  trans: "\nJavaScript 有一个 `debugger;` 语句，它可以在其所在的行设置断点。当在浏览器中查看代码时，`debugger;` 语句不起作用。当激活调试工具并运行代码时，它会设置断点并提供一个可以点击以重启代码的箭头。你可以根据需要多次在代码中使用\
    \ `debugger;` 语句来设置断点。\n\n在未激活调试工具的情况下，它会提醒你。在调试模式下，它会在每个变量赋值下方停止，并等待按下箭头以重启代码。\n\
    \n```javascript\n//demo11-3.html\nvar x = 10;\ndebugger;\nvar y = 20;\ndebugger;\n\
    alert(x + y);\n```\n\n## 自定义错误处理\n\nJavaScript 有 `try`、`catch`、`throw` 和 `finally`\
    \ 语句允许你自定义错误处理。`try` 接收一个测试的代码块，`catch` 允许你处理错误，`throw` 允许创建自定义错误，而 `finally`\
    \ 无论 `try` 和 `catch` 的结果如何都会执行代码。这四条语句的流控制组合有：`try/catch`、`try/finally` 或 `try/catch/finally`。重写内置错误的\
    \ `throw` 语句放在 `try` 块中。\n\n假设我们写错了一个方法名。JavaScript 会向控制台输出错误。我们可以捕获该错误将其重定向到页面而不是控制台。内置错误对\
    \ `catch` 语句可用。传递给 `catch` 的任何变量都代表错误，在此例中为 `error`。`error` 有一个 `message` 属性。\n\
    \n```javascript\n//demo11-4.html\ntry {\n  alerts(\"Welcome guest!\");\n}\ncatch(error)\
    \ {\n  document.getElementById(\"demo\").innerHTML = error.message;\n}\n```\n\n\
    我们可以抛出错误或抛出异常，并创建自己的错误消息。\n\n```javascript\n//demo11-5.html\nvar x = prompt(\"\
    Enter a number\", \"\");\ntry {\n  // 根据需要在这里进行大量的测试和抛出\n  if (x == \"\") {\n\
    \    throw \"empty\";\n  }\n}\ncatch(error) {\n  alert(error); // 现在是自定义错误了\n\
    }\nfinally {\n  // 无论如何都会执行清理代码\n}\n```\n\n### 练习 11-1 抛出自定义错误\n\n为表单字段抛出自定义错误。\n\
    \n在浏览器中，打开 `exercise11-1.html`。测试表单字段为空、不是数字以及数字小于 5 或大于 100 时的字段。\n\n在你的编辑器中，打开\
    \ `Lesson 11/Exercises/js/exercise11-1.js`。我们将为该字段抛出一组自定义错误。\n\n创建一个名为 `checkAge()`\
    \ 的函数。在内部：\n- 变量 `message` 和 `age`。\n- 从页面上 `id=\"message\"` 的区域设置 `message` 变量，以便我们可以输出它。\n\
    - 从年龄表单字段设置 `age` 变量。\n- 使用 `try` 设置一系列 `if` 测试。\n- 如果 `age` 字段为空，抛出一个指明其为空的错误。\n\
    - 如果 `age` 字段不是数字（提示：使用 `isNaN()`），抛出一个指明该数字的错误。\n- 如果 `age` 字段小于 5，抛出一个指明数值太低的错误。\n\
    - 如果 `age` 字段大于 100，抛出一个指明数值太高的错误。\n- 捕获错误（提示：使用 `catch(err)` 然后打印出 `err`）。将消息写入相应的字段，并且如果发生错误则阻止表单提交。\n\
    - 在页面加载时，获取表单元素，并在提交时调用 `checkAge()` 函数。\n- 在 `Lesson 11/Exercises/exercise11-1.html`\
    \ 中添加对该文件的引用，保存并测试。\n\n## 第 12 节：处理表单\n\n在本节中，你将学习到：\n1. 使用 JavaScript 验证表单数据\n\
    2. 使用正则表达式进行数据验证\n\n## 使用 JavaScript 验证表单数据\n\nHTML `<form>` 是获取用户输入的最常用方式。数据通常被发送到数据库进行存储，这需要服务器端脚本。HTML\
    \ `<form>` 标签引用服务器端脚本以及发送数据的方法。当用户点击“提交”按钮时，数据会被发送到该脚本。\n\n```html\n<form method=\"\
    post\" action=\"proc.php\" id=\"frm\">\n```\n\n虽然数据最终应该在服务器上进行验证，但客户端验证或数据筛选是有帮助的。它可以减轻服务器负担，并通过在出现问题时立即通知用户让页面更具响应性。\n\
    \n如果数据不符合我们的脚本要求，我们希望阻止表单提交并给用户修正的机会。表单验证通过 DOM 获取数据，使用事件调用函数，并使用字符串和正则表达式方法进行测试。\n\
    \n表单及其元素应该具有 ID，以便能够被唯一标识和访问。\n\n```javascript\nvar frm = document.getElementById(\"\
    frm\");\n```\n\n有几种方法可以将表单元素作为集合获取以便你进行循环。表单有一个 `elements` 集合：\n\n```javascript\n\
    var els = frm.elements;\n// 也可以链式\ndocument.getElementById(\"frm\").elements;\n\
    ```\n\n你可以使用 DOM 方法：\n```javascript\nvar els = document.getElementsByTagName(\"\
    input\");\n```\n\n或者使用 CSS 属性选择器：\n```javascript\nvar els = document.querySelectorAll(\"\
    input\");\n// 指定表单\nvar els = document.querySelectorAll(\"#frm input\");\n// 仅\
    \ type=\"text\"\nvar els = document.querySelectorAll(\"[type=text]\");\n```\n\n\
    验证测试包括：\n- 检查必填字段是否为空\n- 确保单选按钮或下拉选项中有一个被选中\n- 检查输入是否符合正确格式\n- 比较两个字段以确保它们匹配\n\
    - 检查准确的数值范围\n\n### 表单事件\n\n表单对象具有 `onsubmit` 和 `onreset` 事件，可以处理返回值。如果它们设置为 false，则不会执行提交或重置。当然，应该动态获取\
    \ true 和 false 值！\n\n`confirm()` 在用户点击“确定”按钮时返回 true，点击“取消”按钮时返回 false。`return`\
    \ 捕获 true 或 false。如果是 false，这段代码等同于 `onreset = false`且不重置表单。如果不是 false，则自动返回 true。\n\
    \n```javascript\nfunction check(){\n  var yn = confirm(\"Do you want to clear?\"\
    );\n  if(yn == false){\n    event.preventDefault();\n  }\n}\nfrm.addEventListener(\"\
    reset\", check);\n```\n\n`onsubmit` 事件将从判断表单数据是否有效的函数获取 true 或 false。如果 `onsubmit\
    \ = false`，表单将不会提交。\n\n```javascript\nfunction validate(){\n  fName = document.getElementById(\"\
    fName\");\n  if(fName.value == \"\"){\n    alert(\"The name field is empty\");\n\
    \    event.preventDefault();\n  }\n}\nfrm.addEventListener(\"submit\", validate);\n\
    ```\n\n### 检查空字段\n\nJavaScript 可以访问表单和元素的属性。表单属性包括 `method`、`action`、`name` 和\
    \ `id`。常用的元素属性包括 `name`、`type` 和 `value`。\n\n下面，我们遍历文本元素。我们使用 `value` 访问字段内容并测试它们是否为空，使用\
    \ `id` 在错误消息中标识缺失的字段。这段代码应该放在表单提交时调用的函数中。获取值是非常重要的，因为你想测试的是字符串而不是对象。一旦我们有了字符串，就可以使用\
    \ `trim()` 等字符串方法。\n\n如果用户在姓名字段中只输入了一个空格怎么办？从技术上讲，该字段并不为空，但也没有意义内容。我们的验证函数将去掉开头和结尾的空格并分析剩余部分。\n\
    \n```javascript\nvar els = document.querySelectorAll(\"[type=text]\");\nfor (i\
    \ = 0; i < els.length; i++){\n  if(els[i].value.trim() == \"\"){\n    alert(els[i].id\
    \ + \" is required!\");\n    event.preventDefault();\n  }\n}\n```\n\n在这个示例中，我们只测试一个字段，即用户离开字段时（当\
    \ `onblur` 事件发生时）。记住表单事件包括 `onfocus` 和 `onblur`。表单元素还有 `focus()` 方法可以将光标置入字段，`blur()`\
    \ 方法可以将光标移出。我们使用关键字 `this` 来引用当前字段。如果用户在不输入任何内容的情况下离开必填字段，我们将向他们显示错误消息并将光标放回字段。\n\
    \n```javascript\nfunction validateField(){\n  if(this.value.trim() == \"\"){\n\
    \    alert(\"this field is required\");\n    this.focus();\n  }\n} \nfName.addEventListener(\"\
    blur\", validateField);\n```\n\n### 测试字符串长度\n\n字符串和数组都有 `length` 属性。\n\n"
- fmt: "\n```javascript\nvar user = document.getElementById(\"user\");\n\nif (user.value.length\
    \ < 5 || user.value.length > 8) {\n  alert(\"Must be 5 to 8 characters.\");\n\
    \  user.focus();\n}\n```\n\nUsing string methods, we can restrict the length of\
    \ a comments field. We use the `substring()` method to grab the first 100 characters\
    \ and put them in the textarea:\n\n```html\n//demo12-1.html\n<form id=\"frm\"\
    >\n  <textarea id=\"txt\" rows=\"7\" cols=\"35\"></textarea>\n  <input type=\"\
    submit\">\n</form>\n```\n\n```javascript\nvar txt = document.getElementById(\"\
    txt\");\n\nfunction shortText(){\n  var numChars = txt.value.length;\n  if(numChars\
    \ > 100){\n    var short = txt.value.substring(0,100);\n    alert(\"Character\
    \ limit exceeded.\");\n    event.preventDefault();\n    txt.value = short;\n \
    \ }\n}\n\nfrm.addEventListener(\"submit\", shortText);\n```\n\n### Making Sure\
    \ a Selection is Made\n\n#### Radio Buttons\n\nRadio buttons are grouped together,\
    \ and only one can be selected if they have the same `name`. The only way to unselect\
    \ one is to select another. For form validation, we can loop through the set of\
    \ radio buttons until we find the one that has been selected.\n\nIn this example,\
    \ the `for` loop stops running once a radio button is checked. If none are checked,\
    \ it \"falls through\" to the error message. This is to avoid having the error\
    \ message display for every unchecked radio button.\n\n```html\n//demo12-2.html\n\
    <input type=\"radio\" name=\"rdo\" value=\"UPS\">UPS\n<input type=\"radio\" name=\"\
    rdo\" value=\"FedEx\">FedEx\n```\n\n```javascript\nvar rdo = document.querySelectorAll(\"\
    [type=radio]\");\n\nfunction checkRdo(){\n  for(i = 0; i < rdo.length; i++){\n\
    \    //if a radio button is checked\n    if(rdo[i].checked == true){\n      return;//leave\
    \ function\n    }\n  }\n  alert(\"Please choose one.\");\n  event.preventDefault();\n\
    }\n```\n\n#### Pull Down Menu\n\nIn HTML, the `<select>` element has child `<option>`\
    \ elements. In JavaScript, `select` has an `options` collection and a `selectedIndex`\
    \ property that is zero-based. A pulldown menu with five choices has indexes from\
    \ 0 to 4. When a new selection is made, it triggers the `onchange` event. In this\
    \ example, we provide a blank selection, then test if that is the `selectedIndex`.\n\
    \n```html\n//demo12-3.html\n<select id=\"ship\">\n  <option value=\"\">Select\
    \ One\n  <option value=\"UPS\">UPS\n  <option value=\"FedEx\">FedEx\n</select>\
    \   \n```\n\n```javascript\nvar sel = document.getElementById(\"ship\");\n\nfunction\
    \ checkSel(){\n  if(sel.selectedIndex == 0){\n    alert(\"Please choose one.\"\
    );\n    event.preventDefault();\n  }\n}\n\nfrm.addEventListener(\"submit\", checkSel);\n\
    ```\n\n### Testing whether the user has checked a box\n\nCheckboxes and radio\
    \ buttons have a `checked` property that is true or false. We can use it to see\
    \ if they checked a checkbox. Checkboxes can be toggled on and off.\n\n```html\n\
    //demo12-4.html\n<input type=\"checkbox\" id=\"chk\">\n```\n\n```javascript\n\
    var chk = document.getElementById(\"chk\");\n\nfunction check(){\n  if (chk.checked\
    \ == false) {\n    alert(\"please read our terms!\");\n    event.preventDefault();\n\
    \  }\n}\n\nfrm.addEventListener(\"submit\", check);\n```\n\n## Data Validation\
    \ with Regular Expressions\n\nMany fields on a contact form use common patterns\
    \ for data. A U.S. phone number should have ten numbers with optional parentheses,\
    \ spaces and hyphens.\n\n```html\n//demo12-5.html\nPhone: <input type=\"text\"\
    \ id=\"phone\">\n```\n\n```javascript\nvar phone = document.getElementById(\"\
    phone\");\n\nfunction check(){\n  rePhone=/^\\(?\\d{3}\\)?-?\\s?\\d{3}-?\\s?\\\
    d{4}$/;\n  if(!rePhone.test(phone.value)){\n    alert(\"bad format\");\n    event.preventDefault();\n\
    \  }\n}\n\nfrm.addEventListener(\"submit\", check);\n```\n\nA U.S. zip code should\
    \ have 5 to 9 numbers with an optional space or hyphen. Use one of the regular\
    \ expression or string methods to implement them.\n\n```html\n//demo12-6.html\n\
    Zip: <input type=\"text\" id=\"zip\">\n```\n\n```javascript\nvar zip = document.getElementById(\"\
    zip\");\n\nfunction check(){\n  reZip=/^\\d{5}$|^\\d{5}-\\d{4}$/;\n  if(!reZip.test(zip.value)){\n\
    \    alert(\"bad format\");\n    event.preventDefault();\n    zip.focus()\n  }\n\
    }\n\nfrm.addEventListener(\"submit\", check);\n```\n\n### Exercise 12-1 Validating\
    \ a form\n\nValidate a form using the DOM, events, functions, string tests and\
    \ regular expressions.\n\nIn the browser, open file `exercise12-1.html` located\
    \ in `Lesson 12/Solutions`. Test what happens when you don't fill it out, and\
    \ when you fill it out correctly. Look at it in the editor and see the IDs in\
    \ the HTML tags.\n\nIn your editor, open `Lesson 12/Exercises/js/exercise12-1.js`.\
    \ We are going to write some functions testing different things, and call them\
    \ when the form is submitted.\n\n1. First, create two variables at the top of\
    \ the page, but don't set them. One should be called `msg` and one should be called\
    \ `name`.\n2. Create a function called `checkRequired()` that takes a parameter\
    \ `fld`. It will check if `fld` is empty. If so, it will create a message that\
    \ says that `name` is required. Use the `+=` operator so we can build the error\
    \ message.\n3. Create a function called `checkLength(fld, min, max)` that takes\
    \ parameters `fld`, `min`, and `max`. It will check the length of `fld.value`.\
    \ If the length is less than `min` or greater than `max`, it will create a message\
    \ that says `name` must be between `min` and `max`. Use the `+=` operator to build\
    \ the error message.\n4. Create a function called `checkRdo(fld)` that takes a\
    \ parameter `fld`. It will check if any radio button in the group is checked.\
    \ If not, it will alert \"Please choose one.\" and prevent default behavior.\n\
    5. Create a function called `checkLetters(fld)` that takes a parameter `fld`.\
    \ It will check if `fld.value` matches a regular expression for letters. If it\
    \ doesn't, it will alert a message and prevent default.\n6. Create a function\
    \ called `checkZip(fld)` that takes a parameter `fld`. It will check if `fld.value`\
    \ matches a regular expression for a zip code. If it doesn't, it will alert \"\
    bad format\", prevent default, and focus `fld`.\n7. Create a function called `checkAlphaNumeric(fld)`\
    \ that takes a parameter `fld`. It will check if `fld.value` matches a regular\
    \ expression for numbers. If it doesn't, it will alert \"bad format\" and prevent\
    \ default.\n8. Create a function called `checkEmail(fld)` that takes a parameter\
    \ `fld`. It will check if `fld.value` matches a regular expression for an email.\
    \ If it doesn't, it will alert \"bad format\" and prevent default.\n9. Create\
    \ a function called `checkSelection(fld)` that takes a parameter `fld`. It will\
    \ check if the `selectedIndex` is 0. If it is, it will alert \"Please choose one.\"\
    \ and prevent default.\n10. Create a function called `validateForm(frm)` that\
    \ takes a parameter `frm`. \n    - Declare a local variable `msg`.\n    - Set\
    \ `msg` to an empty string.\n    - Loop through the form elements (`frm`). In\
    \ the loop:\n      - Set `fld = frm.elements[i]`.\n      - Set `name = fld.name.substring(3)`\
    \ to take the \"txt\" or \"ddl\" prefix off the ID.\n      - If `fld.type == \"\
    text\"`, call `checkRequired(fld)`. Inside this if:\n        - If `name` is `FirstName`,\
    \ run `checkLetters(fld)`.\n        - If `name` is `UserName`, run `checkLength(fld,\
    \ 5, 8)` and `checkAlphaNumeric(fld)`.\n        - If `name` is `Zip`, run `checkZip(fld)`.\n\
    \        - If `name` is `Email`, run `checkEmail(fld)`.\n      - Else if `fld.type\
    \ == \"select-one\"`, run `checkSelection(fld)`.\n      - Else if `fld.type ==\
    \ \"submit\"`, skip this field.\n    - After the loop, if `msg` is empty, return\
    \ `true`; if not, alert `msg` and prevent default behavior.\n11. On page load,\
    \ get the form by id, and on form submission, run `validateForm(frm)` on it.\n"
