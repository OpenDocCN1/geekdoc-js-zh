    function statement. Some programming languages call it a lambda. It has the keyword
    function, a parameter list and a block, but no function name. The expression can
    be stored in a variable. Since the variable stores the function expression, the
    function is called with the variable.


    var square = function (n) {


    document.write(n * n);


    }


    square (10); //100


    Invoking a named or anonymous function might look similar, but there is a difference
    in how the browser loads them into the execution context. Named function declarations
    load before any code is executed, so a line of code that invokes a function can
    appear on a line above the function declaration. Anonymous function expressions
    load when the JavaScript gets to that line of code. An anonymous function must
    be invoked after the line on which it is defined. 


    ## Scope


    JavaScript functions themselves have scope, and their variables have scope.


    #### Local and Global Variables


    Scope refers to the variables and functions you have access to. JavaScript has
    variable scope, local and global.


    Local Variables


    Variables declared within a function are local to the function. JavaScript variables
    are declared with the keyword var, so variables declared with var are local to
    their scope, and variables created without the keyword var are global. Local variables
    declared inside a function can only be accessed inside the function.


    function square (n) {


    var total = n * n;


    }


    square(10);


    document.write(total);//undefined


    Local variables are created when the function starts, and deleted from memory
    when the function finishes. Because of scope, variables with the same name can
    be used in different scopes, for example different functions. This is significant
    because scope makes the function re-usable by ensuring variables don''t conflict
    with other functions.     


    function square (n) {


    var total = n * n;


    //local variable available only


    //inside function


    document.write(total);


    }


    square(10);//100


    Global Variables


    A variable set without the keyword var is global, even when defined inside a function.
    The global variable is available outside the function.  A variable created outside
    a function is global, regardless of whether it is declared with var. Any script
    or function on a web page can access a global variable. Global variables are deleted
    from memory when the web page is closed.


    //global when defined outside function


    var x = 10;


    function square (n) {


    //global variable conflicts with others


    total = n * n;


    }


    square(x);


    document.write(total);//100


    #### Function Scope


    JavaScript also has function scope. Functions can be nested, and an inner function
    can only be called within its parent function.


    function outer () {


    document.write("outer function");


    function inner () {


    document.write("inner function");


    }


    //parent must call inner function


    inner();


    }


    //outer function must be called too


    outer();


    ## Function Arguments


    Functions don''t specify data types for parameters or arguments, or check the
    number of arguments that are  passed.


    #### Setting Default Arguments


    If a function is called with missing arguments, they are set to undefined. Arguments
    can be tested for existence and set to default values if they are missing. If
    they are passed when the function is called, the default values are overwritten.
    Being able to set arguments to default values allows you to create optional parameters.


    Generally, you must pass undefined as the optional argument for the default value
    to be set.


    //demo6-2.html


    function fullName (fName, mName, lName) {


    if (!mName) {


    document.write(fName, " ", lName);


    } else {


    document.write(fName, " ", mName, " ", lName);


    }


    }


    fullName("John", undefined, "Public"); //John Public


    If the optional parameter is the last one, it can be left off.


    //demo6-3.html


    function fullName (fName, lName, mName) {


    if (!mName) {


    document.write(fName, " ", lName);


    } else {


    document.write(fName, " ", mName, " ",  lName);


    }


    }


    fullName("John", "Public");//John Public


    //middle name is the last argument


    fullName("John", "Public", "Q");//John Q Public


    #### Exercise 6-2 Creating a function with optional arguments


    Set default values for optional arguments in a function.


    Using your editor, create a file named exercise6-2.js.


    Save the file in Lesson 6/Exercises/js.


    Create a function that takes three arguments: first name, middle name and last
    name. Middle name is optional and if they do not provide a middle name, you will
    display it as "NMN" for "no middle name."


    Test the function with hard-coded arguments.


    Reference the file in Lesson 6/Exercises/exercise6-2.html and test.


    #### The arguments and this Properties


    When a function is invoked, it has access to its own arguments, its arguments
    object, and its this property. arguments is an array-like object containing all
    arguments passed when the function was invoked. this is a reference to the object
    that the function is a method of. It is very helpful when creating objects or
    working with event handlers. We will see it in use in later lessons.


    Looping through the arguments object is another way to make arguments optional.
    In fact, the parameter list in the function definition could be left blank and
    all arguments could be optional.


    //demo6-4.html


    //no parameter list specified


    function sum () {


    var x;


    var sum = 0;


    //keyword arguments is an array


    var argLen = arguments.length;


    for (x = 0; x < argLen; x++){


    sum += arguments[x];


    }


    return sum;


    }


    document.write(sum(23, 4, 100));//127


    #### Exercise 6-3 Using a function''s arguments object


    Create a function that uses the arguments object to get the average sum of arguments,
    and the highest number in the arguments.


    Using your editor, create a file named exercise6-3.js.


    Save the file in Lesson 6/Exercises/js.


    Create a function that takes any number of numeric arguments and calculates the
