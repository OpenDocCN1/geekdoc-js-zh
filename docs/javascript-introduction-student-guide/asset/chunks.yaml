  trans: "\n\nJavaScript 使用两种 C 风格的注释：单行注释和多行块注释。注释可用于调试或编写代码文档。单行注释使用两个斜杠（`//`）并一直注释到行尾。多行注释位于\
    \ `/* */` 之间。最佳实践是仅将多行注释用于作者和许可信息。 \n\n### 数据类型\n\nJavaScript 有基本/原始数据类型：`number`、`string`\
    \ 和 `Boolean`。它有两个特殊类型：`null` 和 `undefined`。它还有两种复合类型：`array`（数组）和 `object`（对象），它们由原始值或其他复合值组成。还有一些特殊的对象类型，如\
    \ `functions`（函数）、`RegExp` 和 `Date()`。由于 JavaScript 具有动态类型，变量在脚本过程中可以是不同的类型。`typeof`\
    \ 运算符可以帮助确定值的数据类型。\n\n```\nvar x = 10; //x 是一个数字\nalert(typeof x);\n\nvar y =\
    \ x + 20; //30，因为类型原因相加\nalert(typeof y);\n\nvar x = \"User\"; //x 是一个字符串\nalert(typeof\
    \ x);\n\nvar y = x + 1; //User1，因为类型原因进行拼接\nalert(typeof y);\n```\n\n### 数值变量\n\
    \n在 JavaScript 中，数值可以是整数（整数字）或浮点数。大数字可以使用 `\"e\"` 后跟数字的指数来创建。\n\n```\n10e2 //10\
    \ 乘以 10 的 2 次方是 1000\n```\n\n整数计算的精确度可以达到 900 万亿（9 quadrillion）。浮点数计算并不总是精确的，因此它们应该被视为一种近似值。\n\
    \n`toPrecision()` 方法将数字格式化为指定的长度。它接受一个有效数字位数作为参数，并用于获取更符合用户习惯的数字。参数是小数点前后数字的总数。\n\
    \n`toFixed()` 接收一个数字并将其转换为小数点后指定的数字位数。\n\n### 算术运算符\n\n算术运算符包括乘法（`*`）、除法（`/`）、加法（`+`）和减法（`-`）。还有一个模运算符（`%`），用于返回余数。乘法、除法和取模的优先级高于加法和减法。和数学一样，运算符优先级可以通过括号更改。\n\
    \n```\nx % y //返回 x 除以 y 的余数\n```\n\n加号（`+`）是重载的，因此它可以用于加法也可以用于字符串拼接。如果任何操作数是字符串，加号就会起起到拼接的作用。\n\
    \n### 函数\n\n有三个函数可以将字符串转换为数字类型。它们可以用于确保执行加法而非拼接。以下是每个每个函数的简要说明。\n\n`parseInt()`\
    \ 会在字符串开头搜索整数。\n```\nparseInt(\"2\"); //返回 2\nparseInt(\"2.5\"); //返回 2\n```\n\
    \n`parseFloat()` 会在字符串开头搜索浮点数。\n```\nparseFloat(\"2.5\"); //返回 2.5\nparseFloat(\"\
    4.5%\"); //返回 4.5\n```\n\n`Number()` 尝试将值转换为数字。如果无法转换，它将返回 `NaN`（不是数字）。\n```\n\
    Number(\"2\"); //返回 NaN\nNumber(\"\"); //返回 0\n```\n\n当 `+`（加号）出现在值之前时，它会将字符串转换为等同于\
    \ `Number()` 函数的数字。\n```javascript\n+\"100\" //返回数字类型的 100\nx = -20;\ny = -x //y\
    \ 是负 20\n```\n\nJavaScript 有三个属于数字类型但行为不像数字的特殊值：`Infinity`、`-Infinity`（负无穷）和 `NaN`（“不是数字”）。在许多语言中，除以零会导致错误，但在\
    \ JavaScript 中它返回 `Infinity`、`-Infinity` 或 `NaN`。\n\n### 字符串变量\n\n字符串是文本或字符串。人的电话号码或邮政编码可能包含数字，但数据类型将是字符串。字符串必须由引号括定，但单引号还是双引号并不重要。由于\
    \ JavaScript 的灵活性，可以通过包含在引号中将值转换为字符串。可以使用反斜杠（`\\`）在字符串中直接添加换行符。换行或制表符等字符会在 `alert()`、`prompt()`\
    \ 和 `confirm()` 中显示，但不会 `console` 中显示。\n\n```javascript\nalert(\"这是第一行。\\n 这是另一行.\"\
    );\nalert(\"这些是用 \\t 分隔的\");\n```\n\n`+` 运算符拼接字符串，将两个或多个字符串合并为一个。字符串必须始终在引号内，但标识符（如变量、对象名和数组名）不能包含。字符串数据类型具有属性和若干方法，稍后将探讨。\n\
    \n### 练习 1-2 数字和字符串类型\n\n此练习将允许你探索已回顾的数据类型。你可以使用 JavaScript 的 `console` 作为命令行完成这些练习。\n\
    \n- 实验加号 `\"3\" + 3`。返回了什么？为什么？\n- 计算 `0.4 + 0.2`。答案如你预期的吗？\n- 尝试使用 `toPrecision()`\
    \ 方法计算 `0.4 + 0.2`。设置 `num = 0.4 + 0.2`，然后使用 `num.toPrecision(1)`。\n- 将 `num`\
    \ 设置为 `100`。`num.toFixed(2)` 做了什么？\n- 使用模运算 `4 % 2`、`4 % 3` 和 `3 % 4`。结果如你预期的吗？你可以如何使用它？\n\
    - 查看 `Number()` 和 `parseInt()` 函数之间的区别，通过传递字符串 `\"3\"` 和空字符串 `\"\"`。\n- 设置 `var\
    \ x = 12 / 0;` 查看 `x` 返回什么。是什么数据类型？提示：使用 `typeof x`。现在对 `0 / 0` 执行同样操作。\n- 使用\
    \ `alert()` 打印带有换行符的 \"hello world\"。提示：从 `alert(\"hello world\")`。\n\n### 布尔变量\n\
    \n布尔类型的两个值为 `true` 和 `false`。注意引号中的 `\"true\"` 或 `\"false\"` 是字符串，不是布尔值。比较逻辑运算符的目的是返回布尔值。\n\
    \n比较运算符有大于（`>`）、小于（`<`）、大于等于（`>=`）、小于等于（`<=`）、相等（`==`）、不相等（`!=`）、严格相等（`===`）和严格不相等（`!==`）。\n\
    \n在相等（==）或不相等测试中，对值进行测试。在标识测试（`===` 或 `!==`）中，对值和类型进行测试。确保使用 `==` 或 `===` 进行比较，而不是用于赋值的等号。\n\
    \n```\n4 == \"4\"; //true，值相同\n4 === \"4\"; //false，类型不同\n```\n\nJavaScript 有三个逻辑运算符：与（`&&`）、或（`||`）和非（`!`）。它们通常与比较运算符一起使用。所有侧都为真，`&&`\
    \ 才返回真。只要有一侧为真，`||` 就返回真。使用逻辑非（`!`）运算符反转逻辑。\n\n运算符优先级决定了运算符的顺序。比较运算符在逻辑运算符之前。逻辑与（`&&`）的优先级高于逻辑或（`||`），逻辑非（`!`）的优先级高于两者。括号不是必须的，但可以让代码更易读。比较和逻辑运算符通常用于\
    \ `if` 语句。\n\n`&&` 和 `||` 可用于短路求值。\n\n```javascript\n//如果 fName 未定义则分配 \"anonymous\"\
    \n// fName 必须声明才能工作\nvar fName;\nuser = fName || \"anonymous\"\nfName && alert(\"\
    Hi \" + fName);\n```\n\n"
- fmt: "\nThe `Math` object is used for calculations that go beyond basic arithmetic.\
    \ Properties include `PI` (``3.141592653589793`), and methods include `round()`,\
    \ `ceil()`, `floor()`, `random()`, `min()` and `max()`.\n\n`round()` rounds to\
    \ the closest integer. If the fractional portion is `.5` or larger it rounds up\
    \ to the next integer.\n\n`ceil()` rounds to the next whole number.\n\n`floor()`\
    \ always rounds down.\n\n`random()` does not take any arguments, and returns a\
    \ number between 0 and 1, exclusive of 1.\n\n`min()` returns the smallest of the\
    \ numbers in a set of numbers.\n\n`max()` returns the largest of the numbers in\
    \ a set of numbers.\n\n```javascript\n//demo1-1.html\n\n//document.write writes\
    \ to the web page\n\ndocument.write(Math.ceil(4.2));//5\ndocument.write(Math.floor(4.9));//4\n\
    document.write(Math.round(4.5));//5\n\n//random number 0 – 1 exclusive\n//refresh\
    \ page for new random number\ndocument.write(Math.random());\n```\n\n## Date\n\
    \nJavaScript’s `Date()` object bases time on the Unix epoch: January 1, 1970.\n\
    \n`Date()` is a constructor object and the date must be created with the `new`\
    \ operator. The `Date()` constructor can be empty, take a string, or take one\
    \ to seven numbers separated by commas. An empty `Date()` constructor returns\
    \ the current timestamp. To use one of the `Date` methods, create a `Date` instance\
    \ first.\n\n```javascript\n//demo1-2.html\n\nvar today = new Date();\n\ndocument.write(today);\n\
    ```\n\nIf you pass one number, the `Date()` constructor reads it as milliseconds\
    \ since Unix epoch time. Passing two to seven arguments becomes year, month, date,\
    \ hours, minutes, seconds, milliseconds to create a date. When two or more arguments\
    \ are passed, the first argument becomes a year, rather than number of milliseconds\
    \ since epoch time.\n\nUseful `Date` methods include `getFullYear()`, `getDate()`,\
    \ `getMonth()`, `getDay()`, `getHours()`, `getTime()`, `getMinutes()` and `getSeconds()`.\n\
    \n`getFullYear()` returns the 4 digit year portion of the date.\n\n`getDate()`\
    \ returns the day portion of the date – value from 1 to 31.\n\n`getMonth()` returns\
    \ an index number 0 – 11 representing the month with 0 being January.\n\n`getDay()`\
    \ returns an index number 0 – 6 representing the day of the week with 0 being\
    \ Sunday.\n\n`getTime()` method displays the date by number of milliseconds since\
    \ epoch time. You can use this to find out how many days, weeks or months are\
    \ between two or more dates.\n\n```javascript\n//demo1-3.html\n\nvar today = new\
    \ Date();\n\ndocument.write(today.getTime());\n```\n\nJavaScript also has the\
    \ `Date` methods `setFullYear()`, `setDate()`, `setMonth()`, `setHours()`, `setMinutes()`\
    \ and `setSeconds()`. `setMonth()` takes a zero-based index number.\n\n```javascript\n\
    //demo1-4.html\n\nvar birthday = new Date();\n\nbirthday.setMonth(11);\n\ndocument.write(birthday);\n\
    //timestamp for December, current date/year\n```\n\nThe `setTime()` method takes\
    \ a number of milliseconds since epoch time. It takes negative numbers for dates\
    \ before epoch time.\n\n```javascript\n//demo1-5.html\n\nvar prevDate = new Date();\n\
    \nprevDate.setTime(-1000000000000)\n\ndocument.write(prevDate);\n//Sun Apr 24\
    \ 1938 17:13:20 GMT-0500 (CDT)\n```\n\n## User input methods\n\nThe `window` object\
    \ has three methods, `alert()`, `confirm()` and `prompt()`. The last two can be\
    \ used to get user input. Because they are methods of the `window` object, they\
    \ can’t be styled; the browser determines how they look.\n\n`alert()` takes one\
    \ argument, so if there are multiple pieces of data, they must be concatenated\
    \ before being passed as an argument.\n\n`confirm()` takes one argument and returns\
    \ a `Boolean` data type.\n\n`prompt()` takes two arguments, a question and default\
    \ answer, and returns a string data type.\n\nA user could also input data into\
    \ a web page by filling out a form, or interact with it through a user event such\
    \ as clicking. Both of these concepts will be covered in more detail later.\n\n\
    ```javascript\n//demo1-6.html\n\nalert(\"Hello!\");\n\nprompt(\"How old are you?\"\
    , \"\");\n\nconfirm(\"Are you sure?\");\n```\n\n### Exercise 1-3 The built-in\
    \ Date() object\n\nWith this exercise, you will determine the number of days between\
    \ two dates.\n\nUsing your editor, create a file named `exercise1-3.js`.\n\nSave\
    \ it in `Lesson 1/Exercises/js`.\n\nUse `new Date()` to get the current date.\n\
    \nAsk the user for their next birthday.\n\nFind out how many days until their\
    \ birthday. Hint: use `.getTime()` to convert both dates to a common format, then\
    \ calculate how many milliseconds in a day.\n\nReference the script in `Lesson\
    \ 1/Exercises/exercise1-3.html` and test.\n\n## Lesson 2: JavaScript Conditions\n\
    \nUnit time: 75 minutes\n\nIn this lesson, you will learn about:\n1. Conditional\
    \ Constructs\n\n## Conditional Constructs\n\nJavaScript supports two types of\
    \ C-style conditional constructs, `if/else`, and `switch`. The ternary operator,\
    \ `?:`, provides an `if/else` shortcut.\n\nAny value in JavaScript has a `Boolean`\
    \ value that is \"truthy\" or \"falsy.\" The Boolean `false`, the number `0` and\
    \ the empty string `\"\"` are falsy, and are equal to each other when compared\
    \ with the `==` equality operator but not the `===` identity operator. `null`\
    \ and `undefined` are falsy, but are only equal to themselves. `NaN` is falsy,\
    \ and not equal to anything, including itself.\n\n### The if Construct\n\nThe\
    \ `if` takes a conditional expression in parentheses and any number of statements\
    \ in a block designated by curly braces. The statements run if the condition is\
    \ true.\n\n```javascript\nif (condition) {\n  statement1;\n  statement2;\n}\n\
    ```\n\nThe condition can be any `Boolean` expression. Any number and combination\
    \ of comparison and logical operators can be used to construct the condition as\
    \ long as it evaluates to true or false. Variables used in a conditional expression\
    \ must be of string or numeric data type.\n\nIf there is only one statement to\
    \ run if the condition is true, the curly braces can be left off, but it is better\
    \ practice to use them for clarity.\n\n```javascript\nif (condition)\n  statement;\n\
    ```\n\nThe conditional construct could be on one line.\n\n```javascript\nif (condition)\
    \ { statement; }\n```\n\n#### Testing Multiple Conditions\n\nThe `if` construct\
    \ alone executes statements when the condition is true, and does nothing when\
    \ the condition is false. One `else` statement can be added to determine what\
    \ statements to execute when the `if` condition evaluates to false.\n\n```javascript\n\
    if (condition) {\n  statement if condition is true;\n} else {\n  statement if\
    \ condition is false;\n}\n```\n\nHere’s an example:\n\n```javascript\nvar age\
    \ = 20;\n\nif (age >= 18) {\n  document.write(\"You can vote\");\n} else {\n \
    \ document.write(\"You have to be at least 18 to vote\");\n}\n```\n\nWhen more\
    \ choices are needed, any number of `else if` constructs can be added. The `else\
    \ if` executes only when the previous `if` or `else if` are not true. An `else`\
    \ will execute when none of the previous conditions are true. Only one of the\
    \ following statements will run.\n\n```javascript\nif (condition) {\n  statement;\n\
    } else if (condition) {\n  statement;\n} else if (condition) {\n  statement;\n\
    } else {\n  statement;\n}\n```\n\nHere’s another example:\n\n```javascript\nvar\
    \ age = 20;\n\nif (age <= 5) {\n  document.write(\"People 5 and under are not\
    \ admitted\");\n} else if (age <= 10) {\n  document.write(\"Not admitted without\
    \ an adult\");\n} else if(age <= 15) {\n  document.write(\"Must have School ID\"\
    );\n} else {\n  document.write(\"Enter and enjoy!\");\n}\n```\n\n### Exercise\
    \ 2-1 Using the if construct\n\nThis exercise will use the `if` construct to validate\
    \ input.\n\nUsing your editor, create a file called `exercise2-1.js`.\n\nSave\
    \ it in `Lesson 2/Exercises/js`.\n\nAsk the user for their hours worked and hourly\
    \ wage. Hint: use `prompt()` twice.\n\nAssume employees work 1-80 hours, with\
    \ an hourly wage from 1 – 100 dollars and that if the user enters a number outside\
    \ of the range, it has been mistyped. Use an `if` to test that the user entered\
    \ the correct range, and ask them again if they did not.\n\nAsk the user if they\
    \ are a full-time employee. Hint: use a `confirm()`. It returns `true` or `false`.\n\
    \nCalculate how much they have earned that week. If they are not full-time and\
    \ did work over 40 hours, they get paid time and a half for overtime.\n\nUse `document.write(variable);`\
    \ to print to the page.\n\nAdd a reference to the JavaScript file to `Lesson 2/Exercises/exercise2-1.html`\
    \ and test.\n\n#### The switch Construct\n"
  raw: 'The Math object is used for calculations that go beyond basic arithmetic.
    Properties include PI (3.141592653589793), and methods include round(), ceil(),
    floor(), random(), min() and max().


    round()rounds to the closest integer.  If the fractional portion is .5 or larger
    it rounds up to the next integer. 


    ceil() rounds to the next whole number


    floor() always rounds down


    random() does not take any arguments, and returns a number between 0 and 1, exclusive
    of 1


    min()returns the smallest of the numbers in a set of numbers


    max()returns the largest of the numbers in a set of numbers


    //demo1-1.html


    //document.write writes to the web page


    document.write(Math.ceil(4.2));//5


    document.write(Math.floor(4.9));//4


    document.write(Math.round(4.5));//5


    //random number 0 – 1 exclusive


    //refresh page for new random number


    document.write(Math.random());


    #### Date


    JavaScript’s Date() object bases time on the Unix epoch: January 1, 1970.


    Date() is a constructor object and the date must be created with the new operator.
    The Date() constructor can be empty, take a string, or take one to seven numbers
    separated by commas. An empty Date() constructor returns the current timestamp.
    To use one of the Date methods, create a Date instance first.


    //demo1-2.html


    var today = new Date();


    document.write(today);


    If you pass one number, the Date() constructor reads it as milliseconds since
    Unix epoch time. Passing two to seven arguments becomes year, month, date, hours,
    minutes, seconds, milliseconds to create a date. When two or more arguments are
    passed, the first argument becomes a year, rather than number of milliseconds
    since epoch time.


    Useful Date methods include getFullYear(), getDate(), getMonth(), getDay(), getHours(),getTime(),
    getMinutes() and getSeconds().


    getFullYear()returns the 4 digit year portion of the date


    getDate()returns the day portion of the date – value from 1 to 31


    getMonth() returns an index number 0 – 11 representing the month with 0 being
    January


    getDay() returns an index number 0 – 6 representing the day of the week with 0
    being Sunday


    getTime() method displays the date by number of milliseconds since epoch time.
    You can use this to find out how many days, weeks or months are between two or
    more dates. 


    //demo1-3.html


    var today = new Date();


    document.write(today.getTime());


    JavaScript also has the Date methods setFullYear(), setDate(), setMonth(), setHours(),
    setMinutes() and setSeconds(). setMonth() takes a zero-based index number.


    //demo1-4.html


    var birthday = new Date();


    birthday.setMonth(11);


    document.write(birthday);


    //timestamp for December, current date/year


    The setTime() method takes a number of milliseconds since epoch time. It takes
    negative numbers for dates before epoch time.


    //demo1-5.html


    var prevDate = new Date();


    prevDate.setTime(-1000000000000)


    document.write(prevDate);


    //Sun Apr 24 1938 17:13:20 GMT-0500 (CDT)


    ## User input methods


    The window object has three methods, alert(), confirm() and prompt(). The last
    two can be used to get user input. Because they are methods of the window object,
    they can’t be styled; the browser determines how they look.


    alert() takes one argument, so if there are multiple pieces of data, they must
    be concatenated before being passed as an argument.


    confirm() takes one argument and returns a Boolean data type.


    prompt() takes two arguments, a question and default answer, and returns a string
    data type.


    A user could also input data into a web page by filling out a form, or interact
    with it through a user event such as clicking. Both of these concepts will be
    covered in more detail later.


    //demo1-6.html


    alert("Hello!");


    prompt("How old are you?", "");


    confirm("Are you sure?");


    ### Exercise 1-3 The built-in Date() object


    With this exercise, you will determine the number of days between two dates.


    Using your editor, create a file named exercise1-3.js.


    Save it in Lesson 1/Exercises/js.


    Use new Date() to get the current date.


    Ask the user for their next birthday.


    Find out how many days until their birthday. Hint: use .getTime() to convert both
    dates to a common format, then calculate how many milliseconds in a day.


    Reference the script in Lesson 1/Exercises/exercise1-3.html and test.


    Lesson 2:  JavaScript Conditions


    Unit time: 75 minutes


    In this lesson, you will learn about: 


    1   Conditional Constructs


    ## Conditional Constructs


    JavaScript supports two types of C-style conditional constructs, if/else, and
    switch. The ternary operator, ?:, provides an if/else shortcut. 


    Any value in JavaScript has a Boolean value that is "truthy" or "falsy." The Boolean
    false, the number 0 and the empty string "" are falsy, and are equal to each other
    when compared with the == equality operator but not the === identity operator.
    null and undefined are falsy, but are only equal to themselves. NaN is falsy,
    and not equal to anything, including itself.


    #### The if Construct


    The if takes a conditional expression in parentheses and any number of statements
    in a block designated by curly braces. The statements run if the condition is
    true.


    if (condition) {


    statement1;


    statement2;


    }


    The condition can be any Boolean expression. Any number and combination of comparison
    and logical operators can be used to construct the condition as long as it evaluates
    to true or false. Variables used in a conditional expression must be of string
    or numeric data type.


    If there is only one statement to run if the condition is true, the curly braces
    can be left off, but it is better practice to use them for clarity. 


    if (condition)


    statement;


    The conditional construct could be on one line.


    if (condition) { statement; }


    Testing Multiple Conditions


    The if construct alone executes statements when the condition is true, and does
    nothing when the condition is false. One else statement can be added to determine
    what statements to execute when the if condition evaluates to false.


    if (condition) {


    statement if condition is true;


    } else {


    statement if condition is false;


    }


    Here’s an example:


    var age = 20;


    if (age >= 18) {


    document.write("You can vote");


    } else {


    document.write("You have to be at least 18 to vote");


    }


    When more choices are needed, any number of else if constructs can be added. The
    else if executes only when the previous if or else if conditions are not true.
    An else will execute when none of the previous conditions are true. Only one of
    the following statements will run.   


    if (condition) {


    statement;


    } else if (condition) {


    statement;


    } else if (condition) {


    statement;


    } else {


    statement;


    }


    Here’s another example:


    var age = 20;


    if (age <= 5) {


    document.write("People 5 and under are not admitted");


    } else if (age <= 10) {


    document.write("Not admitted without an adult");


    } else if(age <= 15) {


    document.write("Must have School ID");


    } else {


    document.write("Enter and enjoy!");


    }


    Exercise 2-1 Using the if construct


    This exercise will use the if construct to validate input.


    Using your editor, create a file called exercise2-1.js.


    Save it in Lesson 2/Exercises/js.


    Ask the user for their hours worked and hourly wage. Hint: use prompt() twice.


    Assume employees work 1-80 hours, with an hourly wage from 1 – 100 dollars and
    that if the user enters a number outside of the range, it has been mistyped. Use
    an if to test that the user entered the correct range, and ask them again if they
    did not use the correct range.


    Ask the user if they are a full-time employee. Hint: use a confirm(). It returns
    true or false.


    Calculate how much they have earned that week. If they are not full-time and did
    work over 40 hours, they get paid time and a half for overtime.


    Use document.write(variable); to print to the page.


    Add a reference to the JavaScript file to Lesson 2/Exercises/exercise2-1.html
    and test.


