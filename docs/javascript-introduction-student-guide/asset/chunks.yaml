    between them. 


    //demo5-14.html


    var fruits = ["plum", "pear", "banana", "kiwi", "lemon"];


    var str4 = fruits.join("");


    document.write(str4);//plumpearbananakiwilemon


    slice()


    slice(), as seen in the string section, returns a portion of an array as a new
    array. Don''t confuse it with the mutator method splice(), which removes items,
    adds items, and permanently changes the original array.


