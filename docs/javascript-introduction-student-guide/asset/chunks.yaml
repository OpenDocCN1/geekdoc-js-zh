    //demo5-17.html\nfunction Person (fName, lName) {\n  this.firstName = fName;\n\
    \  this.lastName = lName;\n}\nvar emp1 = new Person(\"John\", \"Doe\");\nvar emp2\
    \ = new Person(\"Robert\", \"Smith\");\n//使用属性名\ndocument.write(emp1.firstName);//John\n\
    document.write(emp2[\"firstName\"]);//Robert\ndocument.write(typeof emp1);//object\n\
    ```\n\n## 对象数组\n\n除了数组数组外，你还可以创建对象数组。\n\n```javascript\n//demo5-18.html\n//对象数组\n\
    var employees = [\n  {firstName: \"John\", lastName: \"Doe\"},\n  {firstName:\
    \ \"Robert\", lastName: \"Smith\"}\n]\ndocument.write(employees[0][\"firstName\"\
    ]);//John\ndocument.write(employees[0].firstName);//John\n//对象包含数组作为一个属性的值\nvar\
    \ employee1 = {\n  firstName: \"John\",\n  lastName: \"Doe\",\n  skills: [\"HTML\"\
    , \"CSS\", \"JavaScript\"]\n}\ndocument.write(employee1[\"skills\"][0]);//HTML\n\
    document.write(employee1.skills[0]);//HTML\n```\n\n### 练习 5-3 处理对象\n\n创建一个对象数组并访问每个属性。\n\
    \n1. 使用你的编辑器创建一个名为 `exercise5-3.js` 的文件。\n2. 将文件保存到 `Lesson 5/Exercises/js` 目录下。\n\
    3. 创建一个命名的对象数组。对象应该具有像 `firstName`、`lastName`、`email` 和 `phone` 等属性。\n4. 遍历对象数组并访问所有值。\n\
    5. 将脚本引用添加到 `Lesson 5/Exercises/exercise5-3.html` 中。\n6. 在浏览器中保存并测试。\n\n## 使用\
    \ JSON 语法存储数据\n\nJSON 代表 JavaScript 对象表示法（JavaScript Object Notation）。它由 Douglas\
    \ Crockford 指定，作为 XML 存储和交换数据的替代方案。虽然 AJAX 中的 X 代表 XML，但由于其熟悉且轻量级的语法，它正越来越多被 JSON\
    \ 所代。JSON 是语言无关的。\n\n虽然 JSON 使用 JavaScript 语法，但它是纯文本的。不允许使用变量，属性必须加引号。这种纯文本数据格式可以被任何编程语言读取。\n\
    \n```json\n{\n  \"employees\" : [\n    {\"firstName\": \"John\", \"lastName\"\
    : \"Doe\"},\n    {\"firstName\": \"Robert\", \"lastName\": \"Smith\"}\n  ]\n}\n\
    ```\n\n下面我们将解释用于解析 JSON 的两种方法。\n\n### JSON.parse()\n\n`JSON.parse()` 解析包含 JSON\
    \ 语法的字符串，并将值作为 JavaScript 对象返回。\n\n```javascript\n//demo5-19.html\n//通过拼接拆分字符串\n\
    var str = '{ \"employees\" : [' +\n'{\"firstName\": \"John\", \"lastName\": \"\
    Doe\"},' +\n'{\"firstName\": \"Robert\", \"lastName\": \"Smith\"}' +\n']}'\n//将字符串转换为\
    \ JSON 对象\nvar jObj = JSON.parse(str);\ndocument.write(jObj);//JSON 对象\n//访问第二个员工的\
    \ own - Robert\ndocument.write(jObj.employees[1].firstName);\n```\n\n### JSON.stringify()\n\
    \n`JSON.stringify()` 接收一个 JavaScript 对象或数组并将其转换为 JSON 字符串。\n\n```javascript\n\
    var obj = {\n  employees: [\n    {\"firstName\": \"John\", \"lastName\": \"Doe\"\
    },\n    {\"firstName\": \"Robert\", \"lastName\": \"Smith\"}\n  ]\n};\n//将对象转换为字符串\n\
    var jString = JSON.stringify(obj);\ndocument.write(jString);\n```\n\n## 第 6 节：函数\n\
    \n在本节中，你将学习：\n1. 作用域\n2. 函数参数\n\n### 声明和调用函数\n\n函数通过 `function` 关键字定义，参数位于圆括号内，函数体在大花括号内。\n\
    \n另一个示例：\n\n```javascript\nfunction sayHi() {\n  document.write(\"Hi!\");\n}\n\
    sayHi();\n```\n\n如果函数没有参数，圆括号是空的。\n\n```javascript\nfunction sayHello() {\n  document.write(\"\
    Hello!\");\n}\nsayHello();\n```\n\n函数可以接收一个或多个参数，并在调用时被传递。\n\n```javascript\n\
    function square(n) {\n  return n * n;\n}\nsquare(10);\n```\n\n### 返回值\n\n`return`\
    \ 语句使函数停止执行。这意味着每个函数只能有一个 return 语句。`return` 语句之后的代码将不会执行。\n\n如果你必须返回多个值，请返回数组或对象。\n\
    \n```javascript\nfunction check(a, b) {\n  if (a > b) {\n    return \"a is greater\"\
    ;\n  }\n  return \"b is greater or equal\";\n}\n```\n\n返回一个值使函数更加灵活。结果可以被打印或赋值给变量。\n\
    \n```javascript\nfunction square(n) {\n  return n * n;\n}\nvar result = square(5);\n\
    document.write(result);\n```\n\n### 练习 6-1 编写函数\n\n创建一个可重用的代码并调用它。\n\n1. 使用你的编辑器创建一个名为\
    \ `exercise6-1.js` 的文件。\n2. 将文件保存到 `Lesson 6/Exercises/js` 目录下。\n3. 你将做一个华氏到摄氏转换器。HTML\
    \ 文件中已经有两个表单字段，并有一些代码可以在一个字段改变时改变另一个。代码中还有注释说明。\n4. 华氏的公式为 `c = (f - 32) * 5 /\
    \ 9`。\n5. 摄氏转华氏的公式为 `f = c * 9 / 5 + 32`。\n6. 使用 `Math.round()` 处理结果以得到整数。\n7.\
    \ 使用 `document.getElementById(\"celsius\").value` 获取并设置摄氏表单字段的值（将在后续章节中解释）。\n\
    8. 使用 `document.getElementById(\"fahrenheit\").value` 获取并设置华氏表单字段的值（将在后续章节中解释）。\n\
    9. 可选：传递的字符串参数对大小写敏感。考虑通过将其转换为 `LowerCase()` 或 `toUpperCase()` 来使其不区分大小写。\n10.\
    \ 在代码中注释指示的地方调用两次函数，传递 \"Celsius\" 或 \"Fahrenheit\"。\n\n在 `Lesson6/Exercises/exercise6-1.html`\
    \ 中已经有 HTML 代码和对脚本文件的引用。脚本在页面底部加载以便可以使用 DOM。我们将在后续章节学习更多关于 DOM 的知识。\n\n## 创建匿名函数表达式\n\
    \n"
- fmt: "\nAn anonymous function or function expression has similar syntax to a named\
    \ function statement. Some programming languages call it a lambda. It has the\
    \ keyword `function`, a parameter list and a block, but no function name. The\
    \ expression can be stored in a variable. Since the variable stores the function\
    \ expression, the function is called with the variable.\n\n```javascript\nvar\
    \ square = function (n) {\n  document.write(n * n);\n}\n\nsquare (10); //100\n\
    ```\n\nInvoking a named or anonymous function might look similar, but there is\
    \ a difference in how the browser loads them into the execution context. Named\
    \ function declarations load before any code is executed, so a line of code that\
    \ invokes a function can appear on a line above the function declaration. Anonymous\
    \ function expressions load when the JavaScript gets to that line of code. An\
    \ anonymous function must be invoked after the line on which it is defined. \n\
    \n## Scope\n\nJavaScript functions themselves have scope, and their variables\
    \ have scope.\n\n### Local and Global Variables\n\nScope refers to the variables\
    \ and functions you have access to. JavaScript has variable scope, local and global.\n\
    \n#### Local Variables\nVariables declared within a function are local to the\
    \ function. JavaScript variables are declared with the keyword `var`, so variables\
    \ declared with `var` are local to their scope, and variables created without\
    \ the keyword `var` are global. Local variables declared inside a function can\
    \ only be accessed inside the function.\n\n```javascript\nfunction square (n)\
    \ {\n  var total = n * n;\n}\n\nsquare(10);\ndocument.write(total);//undefined\n\
    ```\n\nLocal variables are created when the function starts, and deleted from\
    \ memory when the function finishes. Because of scope, variables with the same\
    \ name can be used in different scopes, for example different functions. This\
    \ is significant because scope makes the function re-usable by ensuring variables\
    \ don't conflict with other functions. \n\n```javascript\nfunction square (n)\
    \ {\n  var total = n * n;\n  //local variable available only\n  //inside function\n\
    \  document.write(total);\n}\n\nsquare(10);//100\n```\n\n#### Global Variables\n\
    A variable set without the keyword `var` is global, even when defined inside a\
    \ function. The global variable is available outside the function. A variable\
    \ created outside a function is global, regardless of whether it is declared with\
    \ `var`. Any script or function on a web page can access a global variable. Global\
    \ variables are deleted from memory when the web page is closed.\n\n```javascript\n\
    //global when defined outside function\nvar x = 10;\nfunction square (n) {\n \
    \ //global variable conflicts with others\n  total = n * n;\n}\n\nsquare(x);\n\
    document.write(total);//100\n```\n\n#### Function Scope\nJavaScript also has function\
    \ scope. Functions can be nested, and an inner function can only be called within\
    \ its parent function.\n\n```javascript\nfunction outer () {\n  document.write(\"\
    outer function\");\n  function inner () {\n    document.write(\"inner function\"\
    );\n  }\n  //parent must call inner function\n  inner();\n}\n\n//outer function\
    \ must be called too\nouter();\n```\n\n## Function Arguments\n\nFunctions don't\
    \ specify data types for parameters or arguments, or check the number of arguments\
    \ that is passed.\n\n### Setting Default Arguments\nIf a function is called with\
    \ missing arguments, they are set to `undefined`. Arguments can be tested for\
    \ existence and set to default values if they are missing. If they are passed\
    \ when the function is called, the default values are overwritten. Being able\
    \ to set arguments to default values allows you to create optional parameters.\n\
    \nGenerally, you must pass `undefined` as the optional argument for the default\
    \ value to be set.\n\n```javascript\n//demo6-2.html\nfunction fullName (fName,\
    \ mName, lName) {\n  if (!mName) {\n    document.write(fName, \" \", lName);\n\
    \  } else {\n    document.write(fName, \" \", mName, \" \", lName);\n  }\n}\n\n\
    fullName(\"John\", undefined, \"Public\"); //John Public\n```\n\nIf the optional\
    \ parameter is the last one, it can be left off.\n\n```javascript\n//demo6-3.html\n\
    function fullName (fName, lName, mName) {\n  if (!mName) {\n    document.write(fName,\
    \ \" \", lName);\n  } else {\n    document.write(fName, \" \", mName, \" \", \
    \ lName);\n  }\n}\n\nfullName(\"John\", \"Public\");//John Public\n//middle name\
    \ is the last argument\nfullName(\"John\", \"Public\", \"Q\");//John Q Public\n\
    ```\n\n#### Exercise 6-2 Creating a function with optional arguments\nSet default\
    \ values for optional arguments in a function.\n\nUsing your editor, create a\
    \ file named `exercise6-2.js`.\n\nSave the file in `/Lesson 6/Exercises/js`.\n\
    \nCreate a function that takes three arguments: first name, middle name and last\
    \ name. Middle name is optional and if they do not provide a middle name, you\
    \ will display it as \"NMN\" for \"no middle name.\"\n\nTest the function with\
    \ hard-coded arguments.\n\nReference the file in `/Lesson 6/Exercises/exercise6-2.html`\
    \ and test.\n\n### The arguments and this Properties\nWhen a function is invoked,\
    \ it has access to its own arguments, its arguments object, and its `this` property.\
    \ `arguments` is an array-like object containing all arguments passed when the\
    \ function was invoked. `this` is a reference to the object that the function\
    \ is a method of. It is very helpful when creating objects or working with event\
    \ handlers. We will see it in use in later lessons.\n\nLooping through the `arguments`\
    \ object is another way to make arguments optional. In fact, the parameter list\
    \ in the function definition could be left blank and all arguments could be optional.\n\
    \n```javascript\n//demo6-4.html\n//no parameter list specified\nfunction sum ()\
    \ {\n  var x;\n  var sum = 0;\n  //keyword arguments is an array\n  var argLen\
    \ = arguments.length;\n  for (x = 0; x < argLen; x++){\n    sum += arguments[x];\n\
    \  }\n  return sum;\n}\n\ndocument.write(sum(23, 4, 100));//127\n```\n\n#### Exercise\
    \ 6-3 Using a function arguments object\nCreate a function that uses the arguments\
    \ object to get the average sum of arguments, and the highest number.\n\nUsing\
    \ your editor, create a file named `exercise6-3.js`.\n\nSave the file in `/Lesson\
    \ 6/Exercises/js`.\n\nCreate a function that takes any number of numeric arguments\
    \ and calculates the average of all numbers. Hint: Use the `arguments` property,\
    \ it will get all arguments. Get the sum and use it to calculate the average.\n\
    \nAdd a reference to `/Lesson 6/Exercises/exercise6-3.html` and test the function\
    \ with hard-coded numbers.\n\nCreate another function that determines the maximum\
    \ number that was entered. Hint: Set the variable for the maximum number to 0\
    \ initially, and compare it against each number. If a number in the arguments\
    \ is higher than that variable, it is the new maximum.\n\nSince all numbers in\
    \ JavaScript must be above `-Infinity`, change the initial value of the maximum\
    \ number variable to that.\n\nTest the function with hard-coded numbers.\n\n##\
    \ Lesson 7: Regular Expressions\nUnit time: 75 minutes\n\nIn this lesson, you\
    \ will learn about:\n\n### Constructing a Regular Expression\nRegular expressions\
    \ are patterns used to match character combinations in strings. Several programming,\
    \ scripting and markup languages (including XML and HTML5) can implement regular\
    \ expressions, and the syntax is the same. A JavaScript regular expression is\
    \ an object. In JavaScript, a regular expression is very useful for validating\
    \ form data.\n\nA regular expression can be constructed one of two ways. A regular\
    \ expression literal is a pattern between forward slashes. The literal regular\
    \ expression is compiled when the script is loaded. The regular expression literal\
    \ provides better performance, if the regular expression is not going to change\
    \ throughout the script. \n\n```javascript\nvar re = /abc/\n```\n\nThe second\
    \ way is to use the constructor function of the `RegExp` object. The constructor\
    \ function provides runtime compilation of a regular expression. Use this if the\
    \ regular expression will be changing, or the pattern is coming from another source,\
    \ for example user input.\n\n```javascript\nvar re = RegExp(\"abc\");\n```\n\n\
    #### Creating a Pattern\nA pattern, whether a literal or RegExp object, can be\
    \ as simple as a string of literal characters.\n\n```javascript\n//look for the\
    \ substring the\n//matches the, theater, soothe\nvar re = /the/;\n```\n"
