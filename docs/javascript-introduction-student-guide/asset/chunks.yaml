  trans: "\n\n```javascript\nvar user = document.getElementById(\"user\");\n\nif (user.value.length\
    \ < 5 || user.value.length > 8) {\n  alert(\"Must be 5 to 8 characters.\");\n\
    \  user.focus();\n}\n```\n\n使用字符串方法，我们可以限制注释字段的长度。我们使用 `substring()` 方法获取前 100\
    \ 个字符并将它们放入文本区域中：\n\n```html\n//demo12-1.html\n<form id=\"frm\">\n  <textarea\
    \ id=\"txt\" rows=\"7\" cols=\"35\"></textarea>\n  <input type=\"submit\">\n</form>\n\
    ```\n\n```javascript\nvar txt = document.getElementById(\"txt\");\n\nfunction\
    \ shortText(){\n  var numChars = txt.value.length;\n  if(numChars > 100){\n  \
    \  var short = txt.value.substring(0,100);\n    alert(\"Character limit exceeded.\"\
    );\n    event.preventDefault();\n    txt.value = short;\n  }\n}\n\nfrm.addEventListener(\"\
    submit\", shortText);\n```\n\n### 确保选择了选项\n\n#### 单选按钮\n\n单选按钮是组合在一起的，如果它们具有相同的\
    \ `name`，则只能选择一个。取消选择某一个的唯一方法是选择另一个。对于表单验证，我们可以遍历单选按钮组，直到找到被选中的那一个。\n\n在这个示例中，`for`\
    \ 循环一旦某个单选按钮被选中就会停止运行。如果一个都没有被选中，它将“穿透”到错误消息。这样做是为了避免在每个未选中的单选按钮上都显示错误消息。\n\n\
    ```html\n//demo12-2.html\n<input type=\"radio\" name=\"rdo\" value=\"UPS\">UPS\n\
    <input type=\"radio\" name=\"rdo\" value=\"FedEx\">FedEx\n```\n\n```javascript\n\
    var rdo = document.querySelectorAll(\"[type=radio]\");\n\nfunction checkRdo(){\n\
    \  for(i = 0; i < rdo.length; i++){\n    //如果单选按钮被选中\n    if(rdo[i].checked ==\
    \ true){\n      return;//离开函数\n    }\n  }\n  alert(\"Please choose one.\");\n\
    \  event.preventDefault();\n}\n```\n\n#### 下拉菜单\n\n在 HTML 中，`<select>` 元素拥有子 `<option>`\
    \ 元素。在 JavaScript 中，`select` 有一个 `options` 集合和一个基于零的 `selectedIndex` 属性。具有五个选项的下拉菜单索引从\
    \ 0 到 4。当做出新选择时，它会触发 `onchange` 事件。在这个示例中，我们提供了一个空选择，然后测试它是否为 `selectedIndex`。\n\
    \n```html\n//demo12-3.html\n<select id=\"ship\">\n  <option value=\"\">Select\
    \ One\n  <option value=\"UPS\">UPS\n  <option value=\"FedEx\">FedEx\n</select>\
    \   \n```\n\n```javascript\nvar sel = document.getElementById(\"ship\");\n\nfunction\
    \ checkSel(){\n  if(sel.selectedIndex == 0){\n    alert(\"Please choose one.\"\
    );\n    event.preventDefault();\n  }\n}\n\nfrm.addEventListener(\"submit\", checkSel);\n\
    ```\n\n### 测试用户是否勾选了框框\n\n复选框和单选按钮都有 `checked` 属性，其值为 true 或 false。我们可以使用它来查看用户是否勾选了复选框。复选框可以开启或关闭。\n\
    \n```html\n//demo12-4.html\n<input type=\"checkbox\" id=\"chk\">\n```\n\n```javascript\n\
    var chk = document.getElementById(\"chk\");\n\nfunction check(){\n  if (chk.checked\
    \ == false) {\n    alert(\"please read our terms!\");\n    event.preventDefault();\n\
    \  }\n}\n\nfrm.addEventListener(\"submit\", check);\n```\n\n## 使用正则表达式进行数据验证\n\
    \n联系表单上的许多字段使用常见的数据模式。一个美国电话号码应该有十个数字，并带有可选的括号、空格和连字符。\n\n```html\n//demo12-5.html\n\
    Phone: <input type=\"text\" id=\"phone\">\n```\n\n```javascript\nvar phone = document.getElementById(\"\
    phone\");\n\nfunction check(){\n  rePhone=/^\\(?\\d{3}\\)?-?\\s?\\d{3}-?\\s?\\\
    d{4}$/;\n  if(!rePhone.test(phone.value)){\n    alert(\"bad format\");\n    event.preventDefault();\n\
    \  }\n}\n\nfrm.addEventListener(\"submit\", check);\n```\n\n美国邮政编码应该有 5 到 9 个数字，并带有可选的空格或连字符。使用正则表达式或字符串方法之一来实现它们。\n\
    \n```html\n//demo12-6.html\nZip: <input type=\"text\" id=\"zip\">\n```\n\n```javascript\n\
    var zip = document.getElementById(\"zip\");\n\nfunction check(){\n  reZip=/^\\\
    d{5}$|^\\d{5}-\\d{4}$/;\n  if(!reZip.test(zip.value)){\n    alert(\"bad format\"\
    );\n    event.preventDefault();\n    zip.focus()\n  }\n}\n\nfrm.addEventListener(\"\
    submit\", check);\n```\n\n### 练习题 12-1 验证表单\n\n使用 DOM、事件、函数、字符串测试和正则表达式来验证表单。\n\
    \n在浏览器中，打开位于 `Lesson 12/Solutions` 中的 `exercise12-1.html` 文件。测试在你不填写以及正确填写时会发生什么。在编辑器中查看它并查看\
    \ HTML 标签中的 ID。\n\n在你的编辑器中，打开 `Lesson 12/Exercises/js/exercise12-1.js`。我们将编写一些函数来测试不同的内容，并在表单提交时调用它们。\n\
    \n1.  首先，在页面顶部创建两个变量，但不要给它们赋值。一个命名为 `msg`，另一个命名为 `name`。\n2.  创建一个名为 `checkRequired()`\
    \ 的函数，接收参数 `fld`。它将检查 `fld` 是否为空。如果是，它将创建一个显示 `name` 是必填的的消息。使用 `+=` 运算符以便我们可以构建错误消息。\n\
    3.  创建一个名为 `checkLength(fld, min, max)` 的函数，接收参数 `fld`、`min` 和 `max`。它将检查 `fld.value`\
    \ 的长度。如果长度小于 `min` 或大于 `max`，它将创建一个显示 `name` 必须在 `min` 和 `max` 之间的消息。使用 `+=` 运算符来构建错误消息。\n\
    4.  创建一个名为 `checkRdo(fld)` 的函数，接收参数 `fld`。它将检查组中是否有任何单选按钮被选中。如果没有，它将弹出提示。\n5.\
    \  创建一个名为 `checkLetters(fld)` 的函数，接收参数 `fld`。它将检查 `fld.value` 是否匹配字母正则表达式。如果不匹配，它将显示消息并阻止默认行为。\n\
    6.  创建一个名为 `checkZip(fld)` 的函数，接收参数 `fld`。它将检查 `fld.value` 是否匹配邮政编码正则表达式。如果不匹配，它将显示“bad\
    \ format”、阻止默认行为并聚焦 `fld`。\n7.  创建一个名为 `checkAlphaNumeric(fld)` 的函数，接收参数 `fld`。它将检查\
    \ `fld.value` 是否匹配数字正则表达式。如果不匹配，它将显示“bad format”并阻止默认行为。\n8.  创建一个名为 `checkEmail(fld)`\
    \ 的函数，接收参数 `fld`。它将检查 `fld.value` 是否匹配邮箱正则表达式。如果不匹配，它将显示“bad format”并阻止默认行为。\n\
    9.  创建一个名为 `checkSelection(fld)` 的函数，接收参数 `fld`。它将检查 `selectedIndex` 是否为 0。如果是，它将弹出“Please\
    \ choose one.”并阻止默认行为。\n10. 创建一个名为 `validateForm(frm)` 的函数，接收参数 `frm`。\n    -\
    \ 声明本地变量 `msg`。\n    - 将 `msg` 设置为空空字符串。\n    - 遍历表单元素 (`frm`)。在循环中：\n      -\
    \ 设置 `fld = frm.elements[i]`。\n      - 设置 `name = fld.name.substring(3)` 以去掉 ID\
    \ 中的 \"txt\" 或 \"ddl\" 前缀。\n      - 如果 `fld.type == \"text\"`，调用 `checkRequired(fld)`。在此\
    \ if 语句内部：\n        - 如果 `name` 是 `FirstName`，运行 `checkLetters(fld)`。\n      \
    \  - 如果 `name` 是 `UserName`，运行 `checkLength(fld, 5, 8)` 和 `checkAlphaNumeric(fld)`。\n\
    \        - 如果 `name` 是 `Zip`，运行 `checkZip(fld)`。\n        - 如果 `name` 是 `Email`，运行\
    \ `checkEmail(fld)`。\n      - 否则如果 `fld.type == \"select-one\"`，运行 `checkSelection(fld)`。\n\
    \      - 否则如果 `fld.type == \"submit\"`，跳过此字段。\n    - 循环结束后，如果 `msg` 为空，返回 `true`；如果不是，则弹出\
    \ `msg` 并阻止默认行为。\n11. 在页面加载时，通过 id 获取表单，并在表单提交时，对它运行 `validateForm(frm)`。\n\n"
