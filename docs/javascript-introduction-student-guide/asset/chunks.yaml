    //doesn''t open a particular URL


    newWin = open("", "", "width = 200, height = 200, left = 300");


    //uses newWin to put together a page


    //this will write to the popup window


    newWin.document.write("hello!");


    Using BOM Methods to Execute Code


    JavaScript has two methods of the window object that can be used to execute code
    at specified times. 


    #### setTimeout()/clearTimeout()


    window.setTimeout() executes code, often a function, after a certain delay. It
    takes the code snippet or reference to a function as its first argument, and the
    delay in milliseconds as a second argument.


    //demo8-3.html


    function showAlert(){


    alert("Surprise!");


    }


    //pass a reference to the function


    //capture the timeout number


    //runs once, after two seconds


    timeoutId = setTimeout(showAlert, 2000);


    setTimeout() returns the number of the timeout. The first time the timeout runs,
    it returns 1, the second time 2, etc. The number can be captured and passed to
    clearTimeout(). 


    clearTimeout(timeoutID);


    #### setInterval()/clearInterval()


    window.setInterval()executes code repeatedly, with a delay between each call.
    It takes the code snippet or reference to a function as its first argument, and
    the delay in milliseconds as a second argument.


    //demo8-4.html


    function showAlert(){


    alert("Surprise!");


    }


    //pass a reference to the function


    //capture the interval number


    //runs repeatedly, every two seconds


    intervalId = setInterval(showAlert, 2000);


    setInterval() returns the number of the interval. The first time setInterval()
    runs, it returns 1, the second time 2, etc. The number can be captured and passed
    to clearInterval(). 


    clearInterval(intervalID);


