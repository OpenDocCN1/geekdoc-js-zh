    none are checked, it "falls through" to the error message. This is to avoid having
    the error message display for every unchecked radio button.


    //demo12-2.html


    <input type="radio" name="rdo" value="UPS">UPS


    <input type="radio" name="rdo" value="FedEx">FedEx


    var rdo = document.querySelectorAll("[type=radio]");


    function checkRdo(){


    for(i = 0; i < rdo.length; i++){


    //if a radio button is checked


    if(rdo[i].checked == true){


    return;//leave function


    }


    }


    alert("Please choose one.");


    event.preventDefault();


    }


    Pull Down Menu


    In HTML, the <select> element has child <option> elements. In JavaScript, select
    has an options collection and a selectedIndex property that is zero-based. A pulldown
    menu with five choices has indexes from 0 to 4\. When a new selection is made,
    it triggers the onchange event. In this example, we provide a blank selection,
    then test if that is the selectedIndex.


    //demo12-3.html


    <select id="ship">


    <option value="">Select One


    <option value="UPS">UPS


    <option value="FedEx">FedEx


    </select>   


    var sel = document.getElementById("ship");


    function checkSel(){


    if(sel.selectedIndex == 0){


    alert("Please choose one.");


    event.preventDefault();


    }


    }


    frm.addEventListener("submit", checkSel);


    #### Testing whether the user has checked a box


    Checkboxes and radio buttons have a checked property that is true or false. We
    can use it to see if they checked a checkbox. Checkboxes can be toggled on and
    off.


    //demo12-4.html


    <input type="checkbox" id="chk">


    var chk = document.getElementById("chk");


    function check(){


    if (chk.checked == false) {


    alert("please read our terms!");


    event.preventDefault();


    }


    }


    frm.addEventListener("submit", check);


    ## Data Validation with Regular Expressions


    Many fields on a contact form use common patterns for data. A U.S. phone number
    should have ten numbers with optional parentheses, spaces and hyphens.


    //demo12-5.html


    Phone: <input type="text" id="phone">


    var phone = document.getElementById("phone");


    function check(){


    rePhone=/^\(?\d{3}\)?-?\s?\d{3}-?\s?\d{4}$/;


    if(!rePhone.test(phone.value)){


    alert("bad format");


    event.preventDefault();


    }


    }


    frm.addEventListener("submit", check);


    A U.S. zip code should have 5 to 9 numbers with an optional space or hyphen. Use
    one of the regular expression or string methods to implement them.


    //demo12-6.html


    Zip: <input type="text" id="zip">


    var zip = document.getElementById("zip");


    function check(){


    reZip=/^\d{5}$|^\d{5}-\d{4}$/;


    if(!reZip.test(zip.value)){


    alert("bad format");


    event.preventDefault();


    zip.focus()


    }


    }


    frm.addEventListener("submit", check);


    ### Exercise 12-1 Validating a form


    Validate a form using the DOM, events, functions, string tests and regular expressions.


    In the browser, open file exercise12-1.html located in Lesson 12/Solutions. Test
    what happens when you don''t fill it out, and when you fill it out correctly.
    Look at it in the editor and see the IDs in the HTML tags.


    In your editor, open Lesson 12/Exercises/js/exercise12-1.js. We are going to write
    some functions testing different things, and call them when the form is submitted.


    First, create two variables at the top of the page, but don''t set them. One should
    be called msg and one should be called name.


    Create a function called checkRequired() that takes a parameter fld.  It will
    check if fld is empty. If so, it will create a message that says that name is
    required. Use the += operator so we can build the error message string, and add
    a newline (\n) at the end of the string, so we can display the complete set of
    error messages on different lines in an alert(). name is the global variable that
    will be populated later with the field name we run the function on. Hint:msg +=
    name + " is required\n";


    Create a function called checkLength() that takes three parameters, fld, min and
    max. Inside:


    Get the fld parametr''s value.


    Test whether the value is between min and max. 


    If not build on the msg variable with += and add a string that says name must
    be between min and max.


    Create a function called madeSelection() that takes fld as a parameter. Inside:


    Test whether fld is of type select. Hint: fld.type=="select-one"


    Also test if the selectedIndex of fld is zero. selectedIndex is a property of
    a pulldown menu, representing the index number of the selection. We made our first
    selection (index 0) say "Select One," so if that is still the selectedIndex, they
    haven’t chosen anything.  Both of these tests can be in one if.


    Add to msg that this field is required.


    Create a function called checkLetters() that takes fld as a parameter. Inside:


    Get the value of fld.


    Set a regular expression variable to check for letters only.


    If the regular expression doesn’t match the field''s value, use msg to add to
    the error message.


    Create a function called checkZip() that takes fld as a parameter and does the
    same as above, for a zipcode regular expression.


    Create a function called checkAlphaNumeric() that takes fld as a parameter and
    does the same as above, for a regular expression that allows letter and numbers
    only.


    Create a function called checkEmail() that takes fld as a parameter and does the
    same as above, for an email regular expression.


    Now, we will create another function called validateForm() This one uses frm as
    a parameter to represent the form, and calls the other functions on it.


    Declare a local variable called fld.


    Set msg to an empty string.


    Loop through the form elements (frm is the form). In the loop:


    Set fld = frm.elements[i]; (each element).


    Set name = fld.name.substring(3); This takes the "txt" or "ddl" prefix off of
    the ID of the element so it says "Interests" instead of "ddlInterests" in the
    error message.


    If the field type is text Hint: if(fld.type == "text") then call the checkRequired()
    function on fld. Inside this if:


    If name is FirstName, run the checkLetters(fld) function.


    If name is UserName, run the checkLength(fld, min, max) (supplying numbers for
    min and max) and checkAlphaNumeric(fld) functions.


    If name is Zip, run the checkZip(fld) function


    If name is Email, run the checkEmail(fld) function


    else if field type is "select-one", run madeSelection(fld).


    else if field type is "submit," don''t run any functions, use continue to skip
    this field. We are looping through all fields, but have no testing for this field.


    When that set of if/else if is finished, close it and do another test: if msg
    is empty, return true, if not, alert the msg we concatenated and prevent the default
    behavior. We are going to call the form validator on form submission, so we don''t
    want the form to submit if there are any errors.


    Finally, close the validateForm(frm) function.


    On page load, get the form by id, and on form submission, run the validateForm()
    function on it. 


    Add a reference to the file to Lesson 12/Exercises/exercise12-1.html and test.'
