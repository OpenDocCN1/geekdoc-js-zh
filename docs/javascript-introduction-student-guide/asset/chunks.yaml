    ## Event Methods


    The event object has methods to stop bubbling or default behavior, which can be
    useful in event handling. 


    #### stopPropagation();


    DOM elements are often nested, so when an event such as a click happens to a child
    element, it also happens to its parent. An event bubbles from the child tag, triggering
    its parents in nested order.


    Clicking the child tr or td would trigger the table event. As you may recall,
    the td or tr also had an event handler, that would run as well. 


    <table id="tbl1">


    table


