    ## About this Course


    ### Target Student & Prerequisites


    This course is intended for students with a good working knowledge of HTML.


    ### How to Use this Book


    This book is designed to be used as part of an instructor led course.  It contains
    various lessons that will guide you through learning the course material.  The
    topics are explained including explanations of logical concepts and examples.
    Also included are exercises that will reinforce the material discussed.  The exercises
    build on each other. 


    Included with your book are files that you will need to complete the exercises. 
    There are three folders included for each of the twelve lessons, Demos, Exercises
    and Solutions.  Place these folders on your desktop to make it easy to access
    the files. You can view them in any browser and the editor of your choice.


    In some cases, the Demos files are not exactly the same as the code snippet in
    the book, as the code snippet is intended to be the code to focus on, and the
    actual HTML file in the Demos folder is a complete working HTML page.


    If for some reason, you are not able to complete each exercise, you can find files
    in each lesson folder to use as your starting point for the exercises.  In addition,
    there are solution files provided for each exercise.  Make sure that you save
    periodically so that you do not lose your work.'
