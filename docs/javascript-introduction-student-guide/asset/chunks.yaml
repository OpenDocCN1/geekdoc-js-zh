    Lesson 12:  Working with forms


    In this lesson, you will learn about: 


    1   Validating Form Data with JavaScript


    2   Data Validation with Regular Expressions


    ## Validating Form Data with JavaScript


    An HTML form is the most common way to get input from the user. The data is often
    sent to a database to be stored, requiring server-side scripting. The HTML <form>
    tag will reference the server-side script and the method with which to send data.
    When the user clicks a "submit" button, the data is sent to that script.


    <form method="post" action="proc.php" id="frm">


    Although the data should ultimately be validated on the server, client-side validation
    or data qualification is helpful. It gives the server a break, and it makes the
    page more responsive by letting the user know right away when there is a problem.


    If the data is not valid according to our script, we want to prevent form submission
    and give the user a chance to correct it. Form validation gets data with the DOM,
    uses events to call functions, and tests with string and regular expression methods.


    The form and its elements should have IDs so that they can be uniquely identified
    and accessed.


    var frm = document.getElementById("frm");


    There are several ways to get form elements as a collection that you can loop
    through. The form has an elements collection:


    var els = frm.elements;


    //can also be chained together


    document.getElementById("frm").elements;


    You can use a DOM method:


    var els = document.getElementsByTagName("input");


    Or a CSS attribute selector:


    var els = document.querySelectorAll("input");


    //specify the form


    var els = document.querySelectorAll("#frm input");


    //only input type="text"


    var els = document.querySelectorAll("[type=text]");


    Validation tests include:


    Checking that required fields are not empty


    Making sure one of a set of radio buttons or pulldown options has been selected


    Checking that input is in the correct format


    Compare two fields to make sure they match


    Checking for an accurate numeric range


    #### Form Events


    The form object has the events onsubmit and onreset that can process return values.
    If they are set to false, the submit or reset will not be performed. The true
    and false values should be acquired dynamically, of course! 


    confirm() returns true if the user clicks the "Ok" button and false if the user
    clicks the "cancel" button. return captures the true or false. If false, this
    code is the equivalent of onreset = false and does not reset the form. true is
    automatically returned if false is not.


    function check(){


    var yn = confirm("Do you want to clear?");


    if(yn == false){


    event.preventDefault();


    }


    }


    frm.addEventListener("reset", check);


    The onsubmit event will capture true or false from a function that determines
    if the form data is valid. The form will not submit if onsubmit = false.


    function validate(){


    fName = document,getElementById("fName");


    if(fName.value == ""){


    alert("The name field is empty");


    event.preventDefault();


    }


    }


    frm.addEventListener("submit", validate);


    #### Checking for Empty Fields


    JavaScript has access to the form and elements'' attributes. Form attributes include
    method, action, name and id. Useful element attributes include name, id, type
    and value.


    Below, we loop through all text elements. We use value to access the contents
    of the field and test if they are empty, and id to identify the missing fields
    in our error message. This code should go in a function that is called when the
    form is submitted. It is very important to get the value, because you want to
    test a string, not an object. Once we have the string, we can use string methods
    like trim().


    What if the user types only a space into the firstname field? Technically, that
    field is not empty, but it doesn’t have meaningful content either. Our validating
    function will strip out leading and trailing spaces and analyze what is left. 


    var els = document.querySelectorAll("[type=text]");


    for (i = 0; i < els.length; i++){


    if(els[i].value.trim() == ""){


    alert(els[i].id + " is required!");


    event.preventDefault();


    }


    }


    In this example, we test only one field, when the user leaves the field (when
    the onblur event takes place). Remember that form events include onfocus and onblur.
    Form elements also have a focus() method that puts the cursor into a field, and
    blur() that takes the cursor out. We use the keyword this to refer to the current
    field. If the user leaves the required field without typing anything in, we will
    show them an error message and put their cursor back in the field. 


    function validateField(){


    if(this.value.trim() == ""){


    alert("this field is required");


    this.focus();


    }


    }   


    fName.addEventListener("blur", validateField);


    #### Testing for String Length


