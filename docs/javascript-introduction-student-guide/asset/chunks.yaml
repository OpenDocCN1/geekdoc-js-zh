    \n```javascript\n//demo7-6.html\n//不需要全局修饰符 g\n//查找非数字字符\nvar re = /\\D/;\nvar\
    \ phNum = \"(123) 456-7890\";\nvar cleanedPhone = phNum.split(re);\n\nfor (i in\
    \ cleanedPhone) {\n    document.write(cleanedPhone[i], \"<br>\");\n}\n```\n\n\
    `split()` 一个分隔符字符作为参数，以及可选的第二个参数——要返回的拆分次数。默认行为是将字符串拆分为所有可能的子字符串。\n\n```javascript\n\
    var cleanedPhone = phNum.split(re, 2);\n```\n\n### 练习 7-1 使用正则表达式\n\n使用正则表达式通过量词（quantifiers）对数据进行校验。\n\
    \n使用你的编辑器创建一个名为 `exercise7-1.js` 的文件。\n\n将文件保存在 `Lesson 7/Exercises/js` 中。\n\n\
    要求用户输入美国邮政编码或加拿大邮政编码。\n\n使用一个模式：\n\n美国邮编可以是五个数字、九个数字，或者五个数字、一个连字符或空格以及额外的四个数字。它不能是带有连字符或空格但没有额外四位的位数。总长度不能超过十个字符，且不允许数字、连字符或空格以外的任何字符。\n\
    \n加拿大邮政编码的模式为字母数字字母空格数字字母数字。空格是可选的。字母不区分大小写。可选：邮编不能以大写或小写字母 `d, f, i, o, q, u,\
    \ w` 或 `z` 开头。\n\n使用正则表达式方法或字符串方法来验证邮编和邮编码。\n\n在 `Lesson7/Exercises/exercise7-1.html`\
    \ 中引用该文件并进行测试。\n\n## 反向引用 (Backreferences)\n\n反向引用可以用模式内部，也可以用于模式外部。在任何情况下，反向引用匹配正则表达式中由括号分隔的组中的子字符串。反向引用匹配找到的实际子字符串，而不是模式。\n\
    \n组通过括号创建，反向引用通过位置数字引用对应的组号。\n\n在模式内部，`\\1` 是第一个括号内组的反向引用，`\\2` 是第二个括号内组的反向引用，依此类推。\n\
    \n```javascript\n//确保分隔符是重复的\n//匹配 123-45-6789\n//匹配 123456789\n//不匹配 12345-6789\n\
    //不匹配 123-45 6789\n/^\\d{3}([\\-\\.\\s])?\\d{2}\\1\\d{4}$/;\n```\n\n模式外部的反向引用通过\
    \ `$1` 到 `$9` 创建，且只能包含九个组引用。如果需要更多引用，请使用数组索引。模式外部的反向引用通过 `RexExp.$1`, `RegExp.$2`\
    \ 访问，但 `$1`, `$$2` 可以在 `replace()` 方法中使用。\n\n```javascript\n//demo7-7.html\nvar\
    \ reSSN = /^(\\d{3})(\\d{2})(\\d{4})$/;\nvar strSSN = \"123456789\";\n//在组 1、2\
    \ 和 3 之间硬编码连字符\nvar cleanSSN = strSSN.replace(reSSN, \"$1-$2-$3\");\ndocument.write(cleanSSN);//123-45-6789\n\
    ```\n\n### 练习 7-2 使用高级正则表达式\n\n在正则表达式中使用反向引用。\n\n使用你的编辑器创建一个名为 `exercise7-2.js`\
    \ 的文件。\n\n将文件保存在 `Lesson 7/Exercises/js` 中。\n\n提示输入电话号码。\n\n使用 `replace()` 移除非数字。\n\
    \n打印输出以查看结果。\n\n使用模式外部的反向引用（`$1`, `$2` 等）和 `replace()` 格式化电话号码，使区号带有括号，区号和前三个数字之间有一个空格，并且在前三个数字和后四个数字之间有一个连字符：`(123)\
    \ 123-1234`。\n\n在 `Lesson7/Exercises/exercise7-2.html` 中引用该文件并进行测试。\n\n可选：在同一文件中创建一个\
    \ HTML 标签验证器。要求输入 HTML 标签并进行验证。请注意，浏览器将根据某些规则将任何标签解释为有效；它不必是标准标签。标签应该以左尖括号（`<`）开头并至少包含一个字母。标签内部的其他字符可以是任何字符（提示）。\n\
    \n## 第 8 ：浏览器对象模型 (BOM)\n\n浏览器对象模型是 BOM 是由 `window` 暴露的所有对象。层级结构的顶端是 `window`。\n\
    \n有用的 window 属性包括 `history`、`location`、`navigator` 和 `screen`。\n\n### history\
    \ 对象\n\n`window.history` 是只读的，包含了浏览器会话历史，当前加载的页面。它有自己的属性和方法可用于访问历史中的其他页面。要测试 `window.history`，你必须访问不同的\
    \ URL。\n\n后或前进，就像按下后退或前进按钮一样：\n\n`history.back()`\n`history.forward()`\n\n移动到历史中的特定点：\n\
    \n`history.go(-1);//相当于后按钮\n`history.go(-2);//后退两步\n`history.go(0);//刷新当前页面\n\
    `history.go(1);//相当于前进按钮\n\n要查看会话历史中有多少页面，请使用只读属性 `history.length`。某些浏览器从 0 开始计算历史长度，另一些则从\
    \ 1 开始。`history.length` 可以存储的最大值为 50。\n\n```javascript\nvar x = history.length;\n\
    document.write(x);\n```\n\n### location 对象\n\n`window.location` 是只读的，但可以向其分配字符串\
    \ URL，从而更改 URL。\n\n`alert(location);//显示当前 URL\n\n// 使用属性重定向到新位置\n`location.href\
    \ = \"http://www.mysite.com\";`\n\n// 使用方法重定向到新位置\n`location.assign(\"http://www.mysite.com\"\
    );`\n\n// 快捷方式\n`location = \"http://www.mysite.com\";`\n\nlocation 对象拥有可以将用户重定向到新页的方法。如上，`location.href`\
    \ 和 `location.assign()` 都可以重定向。`location.assign()` 与 `location.replace()` 的区别在于\
    \ `location.replace()` 会重定向并从浏览器历史中移除当前 URL，因此无法使用后退按钮返回首页。\n\n```javascript\n\
    // 重定向并替换历史中的 URL\nlocation.replace(\"http://www.othersite.com\");\n```\n\n"
- fmt: "\nA variety of strings can be assigned to the `href` property of the `location`\
    \ object, the `assign()` method or the `location` shortcut.\n\n```javascript\n\
    //absolute URL\nlocation.href = \"http://www.othersite.com\";\n\n//relative URL\n\
    location.href = \"about.html\";\n\n//anchor URL\nlocation.href = \"#top\";\n```\n\
    \n`location.reload()` reloads the current page, as if the user had clicked the\
    \ browser's \"reload\" button. The page is reloaded from the cache, but it can\
    \ be set to reload from the server by passing `true`.\n\n```javascript\n//reloads\
    \ page from cache \nlocation.reload();\n\n//reloads page from the server\nlocation.reload(true);\n\
    ```\n\n`location.hash` can get and set the hash portion of a URL.\n\n```javascript\n\
    location = \"http://www.mysite.com\";\n\n//jumps to anchor #top\nlocation.hash\
    \ = \"top\";\n\n//alerts \"#top\"\nalert(location.hash);\n```\n\n`location.host`\
    \ gets or sets the hostname and port number portion of a URL. It can be an IP\
    \ address. If it is used as a setter, it only sets the host portion of the URL\
    \ without changing any other parts.\n\n```javascript\nlocation = \"https://www.mysite.com/about.html#top\"\
    ;\nalert(location.host);//www.mysite.com\n\n//sets URL to\n//https://www.yoursite.com/about.html#top\n\
    location.host = www.yoursite.com\n```\n\nIn contrast, `location.hostname` only\
    \ gets or sets the hostname without the port. \n\nThe read-only `location.origin`\
    \ property returns the protocol, domain name or IP address, and any port number.\n\
    \n```javascript\nlocation = \"https://www.mysite.com/about.html#top\";\n\n//alerts\
    \ https://www.mysite.com/about.html#top\nalert(location.origin);\n```\n\n`location.pathname`\
    \ gets or sets the path portion of the URL.\n\n```javascript\nalert(location.pathname);//about.html\n\
    ```\n\n`location.port` gets or sets the port portion of a URL, and `location.protocol`\
    \ gets or sets the protocol.\n\n`location.search` gets or sets the querystring\
    \ portion of a URL, including the question mark (`?`). Querystrings are used to\
    \ pass parameters to a URL, and JavaScript can get those parameters.\n\n### The\
    \ screen Object\n\n`window.screen` has several read-only properties.\n\n```javascript\n\
    //demo8-1.html\n\n//pixel width of user's screen\ndocument.write(screen.width,\
    \ \"<br>\");\n\n//pixel height of user's screen\ndocument.write(screen.height,\
    \ \"<br>\");\n\n//pixel width of user's screen minus taskbar\ndocument.write(screen.availWidth,\
    \ \"<br>\");\n\n//pixel height of user's screen minus taskbar\ndocument.write(screen.availHeight,\
    \ \"<br>\");\n\n//24 - 32 bit color resolution\ndocument.write(screen.colorDepth,\
    \ \"<br>\");\n\n//same as colorDepth on modern computers\ndocument.write(screen.pixelDepth,\
    \ \"<br>\");\n```\n\n### The console Object\n\nThe `window.console` gives access\
    \ to the browser's debugging console. It has a few methods. We have been using\
    \ the `document.write()` method. It takes a list of arguments separated by a comma,\
    \ or one argument that is concatenated.\n\n`document.write()` automatically puts\
    \ spaces between arguments separated with a comma. If values are concatenated,\
    \ a space must be built into the string. The same is true for `alert()`, since\
    \ it only takes one argument and therefore multiple values must be concatenated.\n\
    \n```javascript\nfname = \"John\";\n\n//\"Hello John\"\n//console log adds space\
    \ between arguments\nconsole.log(\"Hello\", fname);\n\n//must add a space to the\
    \ string\nalert(\"Hello\" + \" \" + fname);\n```\n\n### The window Object's open()\
    \ and close() Methods\n\n`window.open()` opens a popup window – another instance\
    \ of a browser window. The method takes four optional arguments. `close()` closes\
    \ the popup window.\n\nThe first argument is a URL to open as a popup. If you\
    \ do not specify a URL, you can provide content from your main page.\n\n```javascript\n\
    //opens help.html in a new tab\nopen(\"help.html\");\n```\n\nThe second argument\
    \ is a name for the popup. The name is used as a target, for example for links\
    \ to open in the new popup window.\n\n```javascript\n//if target = \"popup\" is\
    \ used in a link,\n//it will open in this window\nopen(\"help.html\", \"popup\"\
    );\n```\n\nThe third argument is a list of specifications. `height` and `width`\
    \ specify the size of the popup, and `left` and `top` specify the position. \n\
    \n```javascript\n//all four arguments are optional\n//200px wide, positioned 300px\
    \ to the right\n//specification list is in one set of quotes\nopen(\"help.html\"\
    , \"\", \"width=200, left=300\");\n```\n\nThe fourth argument is `true` or `false`\
    \ (default) and determines whether the new window replaces the current window\
    \ in the history list. The return value of the `open()` method is a reference\
    \ to the newly created window.\n\n```javascript\n//demo8-2.html\n//doesn't open\
    \ a particular URL\nnewWin = open(\"\", \"\", \"width = 200, height = 200, left\
    \ = 300\");\n\n//uses newWin to put together a page\n//this will write to the\
    \ popup window\nnewWin.document.write(\"hello!\");\n```\n\n### Using BOM Methods\
    \ to Execute Code\n\nJavaScript has two methods of the `window` object that can\
    \ be used to execute code at specified times. \n\n#### setTimeout()/clearTimeout()\n\
    \n`window.setTimeout()` executes code, often a function, after a certain delay.\
    \ It takes the code snippet or reference to a function as its first argument,\
    \ and the delay in milliseconds as a second argument.\n\n```javascript\n//demo8-3.html\n\
    function showAlert(){\nalert(\"Surprise!\");\n}\n\n//pass a reference to the function\n\
    //capture the timeout\n//runs once, after two seconds\ntimeoutId = setTimeout(showAlert,\
    \ 2000);\n```\n\n`setTimeout()` returns the number of the timeout. The first time\
    \ it runs, it returns 1, the second time 2, etc. The number can be captured and\
    \ passed to `clearTimeout()`.\n\n```javascript\nclearTimeout(timeoutId);\n```\n\
    \n#### setInterval()/clearInterval()\n\n`window.setInterval()` executes code repeatedly\
    \ with a delay. It takes the code snippet or reference to a function as its first\
    \ argument, and the delay in milliseconds as a second argument.\n\n```javascript\n\
    //demo8-4.html\nfunction showAlert(){\nalert(\"Surprise!\");\n}\n\n//pass a reference\
    \ to the function\n//capture the interval\n//runs repeatedly, every two seconds\n\
    intervalId = setInterval(showAlert, 50);\n```\n\n`setInterval()` returns the number\
    \ of the interval. The first time it runs, it returns 1, the second time 2, etc.\
    \ The number can be captured and passed to `clearInterval()`.\n\n```javascript\n\
    clearInterval(intervalID);\n```\n\n### Exercise 8-1 Use window methods to create\
    \ animation\n\nUse `setInterval()` to make a page update dynamically.\n\nIn your\
    \ editor, navigate to `8/Exercises`. Open the file `exercise-1.html`. You will\
    \ notice the text `<p id=\"content\"> The Quick Brown Fox Jumps Over the Lazy\
    \ Dog.p>`. When your program is finished, you should no longer see this text.\n\
    \nIn the browser, open the file `exercise-1.html` located in the `8/Solutions`\
    \ folder. This will give you an idea of what the Exercise should look like when\
    \ complete. There is a typewriter effect that prints out letters. `setInterval()`\
    \ makes the letters print out one by one.\n\nIn your editor, open the file `8/Exercises/js/exercise8-1.js`.\n\
    \nMake variables that contain:\n\n1. The words you want to print out.\n2. A counter,\
    \ set to 0 (zero).\n3. A variable representing the HTML element you want to print\
    \ to.\n4. The `setInterval()` function that takes a reference to the function\
    \ you are going to create and one argument, and a speed in milliseconds as a second\
    \ argument. In the Solutions file, the name of the function is `typewriter` and\
    \ the speed is 50. Capture the `setInterval()` as a variable so that you can `clearInterval()`.\n\
    \n```javascript\nvar intervalID = setInterval(functionReference, speedNum);\n\
    //and later\nclearInterval(intervalID);\n```\n\nCreate your function. Inside:\n\
    \nGet the variable of words you want to print and use a string method on it to\
    \ get one character at a time. Print this to the element that should display the\
    \ words. Hint: `str.substr(0, counter)` where `str` is your variable of words\
    \ to print, and `counter` will increment by one in the function.\n\nIncrement\
    \ the counter by one.\n\nIf the `counter` is greater than the length of the words\
    \ string, calling the function.\n\nSave the file to `8/Exercises/exercise8-1.html`\
    \ and test.\n"
