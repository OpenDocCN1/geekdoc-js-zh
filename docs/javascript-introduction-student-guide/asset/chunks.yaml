  trans: "\n\n多种字符串可以赋值给 `location` 对象的 `href` 属性、`assign()` 方法或 `location` 快捷方式。\n\
    \n```javascript\n//绝对 URL\nlocation.href = \"http://www.othersite.com\";\n\n//相对\
    \ URL\nlocation.href = \"about.html\";\n\n//锚点 URL\nlocation.href = \"#top\";\n\
    ```\n\n`location.reload()` 重新加载当前页面，就像用户点击了浏览器的“刷新”按钮。页面从缓存重新加载，但通过传递 `true` 可以设置为从服务器重新加载。\n\
    \n```javascript\n//从缓存重新加载页面\nlocation.reload();\n\n//从服务器重新加载页面\nlocation.reload(true);\n\
    ```\n\n`location.hash` 可以获取和设置 URL 的哈希部分。\n\n```javascript\nlocation = \"http://www.mysite.com\"\
    ;\n\n//跳转到锚点 #top\nlocation.hash = \"top\";\n\n//弹出 \"#top\"\nalert(location.hash);\n\
    ```\n\n`location.host` 获取或设置 URL 的主机名和端口号部分。它可以是一个 IP 地址。如果作为设置器（setter），它只设置\
    \ URL 的主机部分而不改变任何其他部分。\n\n```javascript\nlocation = \"https://www.mysite.com/about.html#top\"\
    ;\nalert(location.host);//www.mysite.com\n\n//设置 URL 为\n//https://www.yoursite.com/about.html#top\n\
    location.host = www.yoursite.com\n```\n\n相比之下，`location.hostname` 仅获取或设置不带端口的主机名。\n\
    \n只读 `location.origin` 属性返回协议、域名或 IP 地址以及任何端口号。\n\n```javascript\nlocation = \"\
    https://www.mysite.com/about.html#top\";\n\n//弹出 https://www.mysite.com/about.html#top\n\
    alert(location.origin);\n```\n\n`location.pathname` 获取或设置 URL 的路径部分。\n\n```javascript\n\
    alert(location.pathname);//about.html\n```\n\n`location.port` 获取或设置 URL 的端口部分，而\
    \ `location.protocol` 获取或设置协议。\n\n`location.search` 获取或设置 URL 的查询字符串部分，包括问号（`?`）。查询字符串用于向\
    \ URL 传递参数，JavaScript 可以获取这些参数。\n\n### screen 对象\n\n`window.screen` 具有几个只读属性。\n\
    \n```javascript\n//demo8-1.html\n\n//用户屏幕的像素宽度\ndocument.write(screen.width, \"\
    <br>\");\n\n//用户屏幕的像素高度\ndocument.write(screen.height, \"<br>\");\n\n//用户屏幕宽度减去任务栏的像素宽度\n\
    document.write(screen.availWidth, \"<br>\");\n\n//用户屏幕高度减去任务栏的像素高度\ndocument.write(screen.availHeight,\
    \ \"<br>\");\n\n//24 - 32 位颜色深度\ndocument.write(screen.colorDepth, \"<br>\");\n\
    \n//现代计算机上与 colorDepth 相同\ndocument.write(screen.pixelDepth, \"<br>\");\n```\n\
    \n### console 对象\n\n`window.console` 提供了访问浏览器调试控制台的。它有几个方法。我们一直在使用 `document.write()`\
    \ 方法。它接受一个由逗号分隔的参数列表，或者一个拼接后的参数。\n\n`document.write()` 会自动在用逗号分隔的参数之间插入空格。如果值是拼接的，则必须在字符串中构建空格。`alert()`\
    \ 也是如此，因为它只接受一个参数，因此多个值必须进行拼接。\n\n```javascript\nfname = \"John\";\n\n//\"Hello\
    \ John\"\n//console log 在参数之间添加空格\nconsole.log(\"Hello\", fname);\n\n//必须在字符串中手动添加空格\n\
    alert(\"Hello\" + \" \" + fname);\n```\n\n### window 对象的 open() 和 close() 方法\n\
    \n`window.open()` 打开一个弹出窗口——另一个浏览器窗口的实例。该方法接受四个可选参数。`close()` 关闭弹出窗口。\n\n第一个参数是作为弹出窗口打开的\
    \ URL。如果你不指定 URL，则可以提供来自主页面的内容。\n\n```javascript\n//在新标签页中打开 help.html\nopen(\"\
    help.html\");\n```\n\n第二个参数是弹出窗口的名称。该名称被用作目标，例如用于链接在新的弹出窗口中打开。\n\n```javascript\n\
    //如果链接中使用了 target = \"popup\"，\n//它将在此窗口中打开\nopen(\"help.html\", \"popup\");\n\
    ```\n\n第三个参数是规格列表。`height` 和 `width` 指定弹出窗口的大小，`left` 和 `top` 指定位置。\n\n```javascript\n\
    //所有四个参数都是可选的\n//宽度 200px，位于右侧 300px 处\n//规格列表位于一组引号\nopen(\"help.html\", \"\"\
    , \"width=200, left=300\");\n```\n\n第四个参数是 `true` 或 `false`（默认值），决定新窗口是否替换历史列表中的当前窗口。`open()`\
    \ 方法的返回值是对新创建窗口的引用。\n\n```javascript\n//demo8-2.html\n//不打开特定的 URL\nnewWin = open(\"\
    \", \"\", \"width = 200, height = 200, left = 300\");\n\n//使用 newWin 组合一个页面\n\
    //这将写入弹出窗口\nnewWin.document.write\n```\n\n### 使用 BOM 方法执行代码\n\nJavaScript 有两个\
    \ `window` 对象的方法可以在指定时间执行代码。\n\n#### setTimeout()/clearTimeout()\n\n`window.setTimeout()`\
    \ 在延迟后执行代码。它接受代码片段或函数引用作为第一个参数，以及毫秒为单位的延迟。\n\n```javascript\n//demo8-3.html\n\
    function showAlert(){\n    alert(\"Surprise!\");\n}\n\n// 在两秒后执行\nvar id = setTimeout(showAlert,\
    \ 2000);\n```\n\n`setTimeout()` 返回超时器的数字。第一次执行时返回 1，第二次返回 2 等。该数字可以被捕获并传递给 `clearTimeout()`。\n\
    \n```javascript\nclearTimeout(id);\n```\n\n#### setInterval()/clearInterval()\n\
    \n`window.setInterval()` 重复执行代码。它接受代码片段或函数引用作为第一个参数，以及毫秒为单位的延迟作为第二个参数。\n\n```javascript\n\
    //demo8-4.html\nfunction showAlert(){\n    alert(\"Surprise!\");\n}\n\n// 每隔 50\
    \ 毫秒执行一次\nvar id = setInterval(showAlert, 50);\n```\n\n`setInterval()` 返回间隔数字。第一次执行时返回\
    \ 1，第二次返回 2 等。该数字可以被捕获并传递给 `clearInterval()`。\n\n```javascript\nclearInterval(id);\n\
    ```\n\n###  8-1 使用 window 方法创建动画\n\n使用 `setInterval()` 动态更新页面。\n\n在编辑器中，导航到 `8/Exercises`。打开\
    \ `exercise-1.html`。你会注意到文本 `<p id=\"content\"> The Quick Brown Fox Jumps Over\
    \ the Lazy Dog.</p>`。当你的程序完成后，你不应该再看到这段文本。\n\n在浏览器中，打开 `8/Solutions` 文件夹下的 `exercise-1.html`。这将让你了解练习完成后的样子。有一个打字机效果会打印字母。`setInterval()`\
    \ 让字母一个一个打印。\n\n在编辑器中，打开 `8/Exercises/js/exercise8-1.js` 文件。\n\n创建包含以下变量：\n\n\
    1. 你想要打印的单词。\n2. 计数器，设置为 0。\n3. 代表要打印的 HTML 元素的变量。\n4. `setInterval()` 函数，它接受你将创建的函数引用作为第一个参数，毫秒为单位的速度作为第二个参数。在解决方案文件中，函数名称是\
    \ `typewriter`，速度为 50。将 `setInterval()` 捕获为变量以便调用 `clearInterval()`。\n\n```javascript\n\
    var intervalID = setInterval(functionReference, speedNum);\n// 之后\nclearInterval(intervalID);\n\
    ```\n\n创建你的函数。内部：\n\n获取你想打印的单词变量，并对其使用字符串方法逐个获取字符。将其打印到应该显示单词的元素中。提示：`str.substr(0,\
    \ counter)`，其中 `str` 是你要打印的单词变量，而 `counter` 将函数中递增。\n\n计数器加 1。\n\n如果 `counter`\
    \ 大于单词字符串的长度，则调用函数。\n\n将文件保存到 `8/Exercises/exercise8-1.html` 并进行测试。\n\n"
- fmt: "\nThe Document Object Model (DOM) is an Application Programming Interface\
    \ (API) for HTML, XML and SVG documents. The DOM stores the document in memory\
    \ as a tree representing node relationships. This defines the way the document\
    \ can be accessed and traversed in order to manipulate the content, structure\
    \ and styling.\n\nIn the DOM, everything on the web page is a `node`. The web\
    \ page itself is a `document node`. Each HTML element is an `element node`. Every\
    \ HTML attribute is an `attribute node`. Text inside HTML elements is a `text\
    \ node`.\n\nNodes have properties, methods and event handlers. The DOM is not\
    \ part of the JavaScript language, but it can be accessed with JavaScript and\
    \ other languages such as Java.\n\nThe document in this case is the web page.\
    \ One HTML document can be rendered in the browser window, or as the HTML source.\
    \ The DOM provides a third, object-oriented way to represent, store and manipulate\
    \ content with a programming or scripting language like JavaScript.\n\n## The\
    \ document Object\n\nAn HTML page is stored as nodes in the DOM, and the document\
    \ object is the root node. It has several frequently used methods for accessing\
    \ elements on the web page. This is the first step in accessing elements in order\
    \ to manipulate the structure, content or styling. These methods are so commonly\
    \ used that DOM libraries such as jQuery have made shortcuts for them. There are\
    \ also methods for re-structuring elements.\n\n`document.write()` writes a string\
    \ of text to the document. `document.write()` can take multiple arguments.\n\n\
    ```javascript\nvar fName = \"John\";\n\n//multiple arguments, including space\n\
    document.write(\"Hello\", \" \", fName);\n\n//two strings a variable concatenated\
    \ into one\ndocument.write(\"Hello\" + \" \" + fName);\n```\n\n## The document\
    \ Object Access Methods\n\n`document.getElementById()` takes a unique ID as an\
    \ argument and returns a reference to the element by ID. The ID name is a case-sensitive\
    \ string. As with all methods, the `getElementById()` method must use the correct\
    \ case. Note that it will not work as `getByID()`.\n\n```javascript\n//case-sensitive\
    \ method and id name\nvar div1 = document.getElementById(\"d1\");\n\n<div id=\"\
    d1\"></</div>\n```\n\n`document.getElementsByName()` returns a live collection\
    \ of nodes matching the name. `name` is an HTML attribute that unlike `id`, does\
    \ not have to be unique.\n\n```javascript\nvar checkboxes = getElementsByName(\"\
    skills\");\n\n<input type=\"checkbox\" name=\"skills\" value=\"HTML\">\n<input\
    \ type=\"checkbox\" name=\"skills\" value=\"DOM\">\n```\n\n`document.getElementsByTagName()`\
    \ returns a live collection of HTML elements matching the tag.\n\n```javascript\n\
    //demo9-1.html\n//returns a collection\nvar allParas = document.getElementsByTagName(\"\
    p\");\n\nvar num = allParas.length;\n\nalert(num + \" paragraphs\");\n```\n\n\
    `document.getElementsByClassName()` returns an HTML collection of nodes matching\
    \ the class.\n\n```javascript\n//elements that have both col and main class\n\
    document.getElementsByClassName(\"col main\");\n```\n\n`getElementsByTagName()`\
    \ and `getElementsByClassName()` can be either called on the document object and\
    \ search the entire document, or on an element, and search descendants of the\
    \ element.\n\n```javascript\n//elements with the class \"content\",\n//descendent\
    \ of element with id \"container\"\nvar el = document.getElementById(\"container\"\
    );\nel.getElementsByClassName(\"content\");\n```\n\n## Using Selectors to Access\
    \ Elements\n\nJavaScript has two methods that take a selector. A selector selects\
    \ elements in the DOM by tag name, class name, id name or attribute. Like `getElementsByTagName()`\
    \ and `getElementsByClassName()`, The methods can be used on the document object\
    \ or an element.\n\n`document.querySelector()` takes a CSS selector and returns\
    \ the first match.\n\n```javascript\n//first paragraph\ndocument.querySelector(\"\
    p\");\n\n//first div that is descendant of p\ndocument.querySelector(\"p div\"\
    );\n\n//first div that is direct child of p\ndocument.querySelector(\"p > div\"\
    );\n\n//div or paragraph, whichever is found first\ndocument.querySelector(\"\
    p, div\");\n\n//first class \"content\"\ndocument.querySelector(\".content\");\n\
    \n//id \"container\"\ndocument.querySelector(\"#container\");\n\n//first form\
    \ field with type attribute \"text\"\ndocument.querySelector(\"input[type = text]\"\
    );\n```\n\n`document.querySelectorAll()` takes a CSS selector and returns a NodeList\
    \ of all matches.\n\n```javascript\n//list of paragraphs\ndocument.querySelectorAll(\"\
    p\");\n\n//divs that are descendants of p\ndocument.querySelectorAll(\"p div\"\
    );\n\n//divs that are a direct child of a p\ndocument.querySelectorAll(\"p > div\"\
    );\n\n//all divs and paragraphs\ndocument.querySelectorAll(\"p, div\");\n\n//class\
    \ \"content\"\ndocument.querySelectorAll(\".content\");\n\n//id \"container\"\
    \ – there should be only one!\ndocument.querySelectorAll(\"#container\");\n\n\
    //form fields whose type attribute is \"text\"\ndocument.querySelectorAll(\"input[type=text]\"\
    );\n```\n\n## Exercise 9-1 Use DOM and window methods to create animation\n\n\
    Use DOM methods and `setInterval()` to make a page update dynamically.\n\nIn your\
    \ browser, open the file `exercise9-1.html` located in `Lesson 9/Solutions`. You\
    \ will notice that it shows you how many days, hours, minutes and seconds until\
    \ a date in the future. Inside the file, there is code and CSS displaying the\
    \ clock.\n\nIn your editor, open `exercise9-1.js` located in `Lesson 9/Exercises/js`.\
    \ You will see a `getTimeRemaining()` function that calculates the difference\
    \ between today and another date, and divides the milliseconds since Unix epoch\
    \ time into days, hours, minutes and seconds.\n\n1. Add a function called `setClock()`\
    \ that takes a parameter (the Solutions call it later). Inside, set variables\
    \ for the element on the HTML page holding the days (`class=\"days\"`), the element\
    \ on the HTML page holding the hours, the element on the HTML page holding the\
    \ minutes and the element on the HTML page holding the seconds.\n2. Inside the\
    \ `setClock()` function, create a function called `changeClock()` with no parameters.\n\
    3. Inside `changeClock()`:\n    - Run the `getTimeRemaining()` function on the\
    \ parameter passed to the outer function, `setClock()`, and capture it with a\
    \ variable such as `time`. (Remember that `changeClock()` itself has no parameters.)\n\
    \    - Write the days, hours, minutes and seconds variables to their corresponding\
    \ HTML elements. For hours, minutes and seconds, you might want to format it with\
    \ string functions to have a leading zero when it gets down to single digits.\
    \ This will add a zero at the beginning, but also make sure it is only two digits\
    \ total: `('0' + seconds).slice(-2);`\n    - Once the `time` variable (the result\
    \ of the `getTimeRemaining()` function) reaches zero --this means now and the\
    \ other date are the same - stop the clock from counting down.\n    - Close the\
    \ `changeClock()` function.\n4. Outside the `changeClock()` function but inside\
    \ the `setClock()` function:\n    - Call the `changeClock()` function once, to\
    \ get the clock to display initially. You can only call an inner function from\
    \ its parent.\n    - Under that, call the `changeClock()` function with `setInterval()`,\
    \ every second. Create an `intervalID` variable to pass to the `clearInterval()`\
    \ that is back in the `changeClock()` function.\n5. Outside both functions:\n\
    \    - Set a variable to a date in the future.\n    - Call `setClock()` on the\
    \ variable.\n    - Reference the file to `Lesson 9/Exercises/js/exercise9-1.js`.\n\
    \    - Save and test with a date in the past, or without `setInterval()`.\n\n\
    ## Working with DOM Nodes\n\nA Node can be of type element, attribute, comment\
    \ or text. It has several properties and methods.\n\n### Creating Nodes with the\
    \ DOM\n\nThe document object has several methods that let it create comment, element\
    \ or text nodes. The new nodes must be positioned with append and insert node\
    \ methods.\n\n`document.createComment()` takes a string and creates and returns\
    \ a new comment node dynamically.\n\n```javascript\ndocument.createComment(\"\
    this is my comment\")\n```\n\n`document.createElement()` takes a string and creates\
    \ and returns a new element node dynamically. Libraries such as HTML5Shiv and\
    \ Modernizr make use of this method so that HTML5 tags can be recognized in older\
    \ browsers.\n\n```javascript\ndocument.createElement(\"section\")\ndocument.createElement(\"\
    article\")\ndocument.createElement(\"div\")\n```\n"
  raw: 'The Document Object Model (DOM) is an Application Programming Interface (API)
    for HTML, XML and SVG documents. The DOM stores the document in memory as a tree
    representing node relationships. This defines the way the document can be accessed
    and traversed in order to manipulate the content, structure and styling.


    In the DOM, everything on the web page is a node. The web page itself is a document node.
    Each HTML element is an element node. Every HTML attribute is an attribute node.
    Text inside HTML elements is a text node.


    Nodes have properties, methods and event handlers. The DOM is not part of the
    JavaScript language, but it can be accessed with JavaScript and other languages
    such as Java.


    The document in this case is the web page. One HTML document can be rendered in
    the browser window, or as the HTML source. The DOM provides a third, object-oriented
    way to represent, store and manipulate content with a programming or scripting
    language like JavaScript.


    #### The document Object


    An HTML page is stored as nodes in the DOM, and the document object is the root
    node. It has several frequently used methods for accessing elements on the web
    page. This is the first step in accessing elements in order to manipulate the
    structure, content or styling. These methods are so commonly used that DOM libraries
    such as jQuery have made shortcuts for them.  There are also methods for re-structuring
    elements.


    document.write() writes a string of text to the document. document.write() can
    take multiple arguments.


    var fName = "John";


    //multiple arguments, including space


    document.write("Hello", " ", fName);


    //two strings a variable concatenated into one


    document.write("Hello" + " " + fName);


    #### The document Object Access Methods


    document.getElementById() takes a unique ID as an argument and returns a reference
    to the element by ID. The ID name is a case-sensitive string. As with all methods,
    the getElementById() method must use the correct case. Note that it will not work
    as getElementByID().


    //case-sensitive method and id name


    var div1 = document.getElementById("d1");


    <div id="d1"></div>


    document.getElementsByName() returns a live collection of nodes matching the name.
    name is an HTML attribute that unlike id, does not have to be unique.


    var checkboxes = getElementsByName("skills");


    <input type="checkbox" name="skills" value="HTML">


    <input type="checkbox" name="skills" value="DOM">


    document.getElementsByTagName() returns a live collection of HTML elements matching
    the tag.


    //demo9-1.html


    //returns a collection


    var allParas = document.getElementsByTagName("p");


    var num = allParas.length;


    alert(num + " paragraphs");


    document.getElementsByClassName() returns an HTML collection of nodes matching
    the class.


    //elements that have both col and main class


    document.getElementsByClassName("col main");


    getElementsByTagName() and getElementsByClassName() can be either called on the
    document object and search the entire document, or on an element, and search descendants
    of the element.


    //elements with the class "content",


    //descendent of element with id "container"


    var el = document.getElementById("container");


    el.getElementsByClassName("content");


    #### Using Selectors to Access Elements


    JavaScript has two methods that take a selector. A selector selects elements in
    the DOM by tag name, class name, id name or attribute. Like getElementsByTagName()
    and getElementsByClassName(), The methods can be used on the document object or
    an element.


    document.querySelector() takes a CSS selector and returns the first match.


    //first paragraph


    document.querySelector("p");


    //first div that is descendant of p


    document.querySelector("p div");


    //first div that is direct child of p


    document.querySelector("p > div");


    //div or paragraph, whichever is found first


    document.querySelector("p, div");


    //first class "content"


    document.querySelector(".content");


    //id "container"


    document.querySelector("#container");


    //first form field with type attribute "text"


    document.querySelector("input[type = text]");


    document.querySelectorAll() takes a CSS selector and returns a NodeList of all
    matches.


    //list of paragraphs


    document.querySelectorAll("p");


    //divs that are descendants of p


    document.querySelectorAll("p div");


    //divs that are a direct child of a p


    document.querySelectorAll("p > div");


    //all divs and paragraphs


    document.querySelectorAll("p, div");


    //class "content"


    document.querySelectorAll(".content");


    //id "container" – there should be only one!


    document.querySelectorAll("#container");


    //form fields whose type attribute is "text"


    document.querySelectorAll("input[type=text]");


    #### Exercise 9-1 Use DOM and window methods to create animation


    Use DOM methods and setInterval() to make a page update dynamically.


    In your browser, open the file exercise9-1.html located in Lesson 9/Solutions.
    You will notice that it shows you how many days, hours, minutes and seconds until
    a date in the future. Inside the file, there is code and CSS displaying the clock.


    In your editor, open exercise9-1.js located in Lesson 9/Exercises/js. You will
    see a getTimeRemaining() function that calculates the difference between today
    and another date, and divides the milliseconds since Unix epoch time into days,
    hours, minutes and seconds.


    Add a function called setClock() that takes a parameter (the Solutions call it
    later). Inside, set variables for the element on the HTML page holding the days
    (class="days"), the element on the HTML page holding the hours, the element on
    the HTML page holding the minutes and the element on the HTML page holding the
    seconds.


    Inside thesetClock() function, create a function called changeClock() with no
    parameters.


    Inside changeClock():


    Run the getTimeRemaining() function on the parameter passed to the outer function,
    setClock(),and capture it with a variable such as time. (Remember that changeClock()
    itself has no parameters.)


    Write the days, hours, minutes and seconds variables to their corresponding HTML
    elements. For hours, minutes and seconds, you might want to format it with string
    functions to have a leading zero when it gets down to single digits. This will
    add a zero at the beginning, but also make sure it is only two digits total: (''0''
    + seconds).slice(-2);


    Once the time variable (the result of the getTimeRemaining() function) reaches
    zero –-this means now and the other date are the same - stop the clock from counting
    down.


    Close the changeClock() function.


    Outsidethe changeClock() function but inside the setClock() function:


    Call the changeClock() function once, to get the clock to display initially. You
    can only call an inner function from its parent.


    Under that, call the changeClock() function with setInterval(), every second.
    Create an intervalID variable to pass to the clearInterval() that is back in the
    changeClock() function.   


    Outside both functions:


    Set a variable to a date in the future.


    Call setClock() on the variable.


    Reference the file to Lesson 9/Exercises/js/exercise9-1.js.


    Save and test with a date in the past, or without setInterval().


    Working with DOM Nodes


    A Node can be of type element, attribute, comment or text. It has several properties
    and methods.


    #### Creating Nodes with the DOM


    The document object has several methods that let it create comment, element or
    text nodes. The new nodes must be positioned with append and insert node methods.


    document.createComment() takes a string and creates and returns a new comment
    node dynamically.


    document.createComment("this is my comment");


    document.createElement() takes a string and creates and returns a new element
    node dynamically. Libraries such as HTML5Shiv and Modernizr make use of this method
    so that HTML5 tags can be recognized in older browsers.


    document.createElement("section");


    document.createElement("article");


    document.createElement("div");'
