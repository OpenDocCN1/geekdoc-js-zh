    \ by a replacement string. The pattern can be a string or regular expression.\n\
    \n```javascript\n//demo7-5.html\n//looks for all non-digit characters\nvar re\
    \ = /\\D/g;\nvar phNum = \"(123) 456-7890\";\n\n//replace non-digits with space\n\
