  trans: "\n\n文档对象模型（DOM）是用于 HTML、XML 和 SVG 文档的应用程序编程接口（API）。DOM 将文档存储在内存中，并表示为反映节点关系的树结构。这定义了访问和遍历文档的方式，以便操作其内容、结构和样式。\n\
    \n在 DOM 中，网页上的所有内容都是一个 `node`（节点）。网页本身是一个 `document node`（文档节点）。每个 HTML 元素都是 `element\
    \ node`（元素节点）。每个 HTML 属性都是 `attribute node`（属性节点）。HTML 内部的文本是 `text node`（文本节点）。\n\
    \n节点具有属性、方法和事件处理器。DOM 不是 JavaScript 语言的一部分，但可以使用 JavaScript 以及 Java 等语言进行访问。\n\
    \n在这种情况下，文档指的是网页。一个 HTML 文档可以在浏览器窗口中渲染，也可以作为 HTML 源码存在。DOM 提供了第三种面向对象的方式，使用 JavaScript\
    \ 等编程或脚本语言来表示、存储和操作内容。\n\n## document 对象 (Object)\n\nHTML 页面以节点的形式存储在 DOM 中，而文档对象是根节点。它有几个经常使用的方法来访问网页上的元素。这是访问元素以操作结构、内容或样式的第一步。这些方法非常常用，以至于\
    \ jQuery 等 DOM 库已经为它们制作了快捷。此外还有重构元素的方法。\n\n`document.write()` 向文档写入字符串文本。`document.write()`\
    \ 可以接受多个参数。\n\n```javascript\nvar fName = \"John\";\n\n//多个参数，包括空格\ndocument.write(\"\
    Hello\", \" \", fName);\n\n//将两个字符串和一个变量拼接成一个\ndocument.write(\"Hello\" + \" \"\
    \ + fName);\n```\n\n## document 对象访问方法 (Access Methods)\n\n`document.getElementById()`\
    \ 接收唯一 ID 作为参数，并返回按 ID 标识元素的引用。ID 名称是区分大小写的字符串。与所有方法一样，`getElementById()` 方法必须使用正确的大小写。注意它不能写写为\
    \ `getByID()`。\n\n```javascript\n//大小写敏感的方法和 id 名称\nvar div1 = document.getElementById(\"\
    d1\");\n\n<div id=\"d1\"></div>\n```\n\n`document.getElementsByName()` 返回匹配名称的节点动态集合（live\
    \ collection）。`name` 是一个 HTML 属性，与 `id` 不同，它不需要是唯一的。\n\n```javascript\nvar checkboxes\
    \ = getElementsByName(\"skills\");\n\n<input type=\"checkbox\" name=\"skills\"\
    \ value=\"HTML\">\n<input type=\"checkbox\" name=\"skills\" value=\"DOM\">\n```\n\
    \n`document.getElementsByTagName()` 返回匹配标签的 HTML 元素动态集合。\n\n```javascript\n//demo9-1.html\n\
    //返回一个集合\nvar allParas = document.getElementsByTagName(\"p\");\n\nvar num = allParas.length;\n\
    \nalert(num + \" paragraphs\");\n```\n\n`document.getElementsByClassName()` 返回匹配类的\
    \ HTML 节点节点集合。\n\n```javascript\n//同时具有 col 和 main 类的元素\ndocument.getElementsByClassName(\"\
    col main\");\n```\n\n`getElementsByTagName()` 和 `getElementsByClassName()` 既可以在文档对象上调用以搜索整个文档，也可以在元素上调用以搜索该元素的后代。\n\
    \n```javascript\n//类名为 \"content\" 的元素\n// id 为 \"container\" 的元素的后代\nvar el =\
    \ document.getElementById(\"container\");\nel.getElementsByClassName(\"content\"\
    );\n```\n\n## 使用选择器访问元素\n\nJavaScript 有两个接收选择器的方法。选择器通过标签名、类名、id 名称或属性来选择 DOM\
    \ 中的元素。与 `getElementsByTagName()` 和 `getElementsByClassName()` 类似，这些方法可以在文档对象或元素上使用。\n\
    \n`document.querySelector()` 接收一个 CSS 选择器并返回第一个匹配项。\n\n```javascript\n//第一个段落\n\
    document.querySelector(\"p\");\n\n// p 的第一个后代 div\ndocument.querySelector(\"p\
    \ div\");\n\n// p 的直接子 div\ndocument.querySelector(\"p > div\");\n\n// div 或段落，取决于先找到哪个\n\
    document.querySelector(\"p, div\");\n\n//第一个类 \"content\"\ndocument.querySelector(\"\
    .content\");\n\n// id \"container\"\ndocument.querySelector(\"#container\");\n\
    \n// type 为 \"text\" 的第一个表单字段\ndocument.querySelector(\"input[type = text]\");\n\
    ```\n\n`document.querySelectorAll()` 接收一个 CSS 选择器并返回所有匹配项的 NodeList。\n\n```javascript\n\
    //段落列表\ndocument.querySelectorAll(\"p\");\n\n// p 的后代 div\ndocument.querySelectorAll(\"\
    p div\");\n\n// p 的直接子 div\ndocument.querySelectorAll(\"p > div\");\n\n//所有 div\
    \ 和段落\ndocument.querySelectorAll(\"p, div\");\n\n// 类 \"content\"\ndocument.querySelectorAll(\"\
    .content\");\n\n// id \"container\" – 应该只有一个！\ndocument.querySelectorAll(\"#container\"\
    );\n\n// type 属性为 \"text\" 的表单字段\ndocument.querySelectorAll(\"input[type=text]\"\
    );\n```\n\n## 练习 9-1 使用 DOM 和 window 方法创建动画\n\n使用 DOM 方法和 `setInterval()` 让页面动态更新。\n\
