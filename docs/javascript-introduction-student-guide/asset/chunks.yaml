    Create another function that determines the maximum number that was entered. Hint:
    Set the variable for the maximum number to 0 initially, and compare it against
    each number. If a number in the arguments list is higher than that variable, it
    is the new maximum.


    Since all numbers in JavaScript must be above negative Infinity (-Infinity), change
    the initial value of the maximum number variable to that.


    Test the function with hard-coded numbers.


    Lesson 7:  Regular Expressions


    Unit time: 75 minutes


    In this lesson, you will learn about:


    ## Constructing a Regular Expression


    Regular expressions are patterns used to match character combinations in strings.
    Several programming, scripting and markup languages (including XML and HTML5)
    can implement regular expressions, and the syntax is the same. A JavaScript regular
    expression is an object. In JavaScript, a regular expression is very useful for
    validating form data. 


    A regular expression can be constructed one of two ways. A regular expression
    literal is a pattern between forward slashes. The literal regular expression is
    compiled when the script is loaded. The regular expression literal provides better
    performance, if the regular expression is not going to change throughout the script. 
     


    var re = /abc/


    The second way is to use the constructor function of the RegExp object. The constructor
    function provides runtime compilation of a regular expression. Use this if the
    regular expression will be changing, or the pattern is coming from another source,
    for example user input.


    var re = RegExp("abc");


    #### Creating a Pattern


    A pattern, whether a literal or RegExp object, can be as simple as a string of
    literal characters.


    //look for the substring the


    //matches the, theater, soothe


