    ## JavaScript Coding Styles


    Most JavaScript code should be in a separate file with the extension .js, so that
    it can re-used, tested and developed more easily. The same coding conventions
    should be used for all projects to make it easier to read and maintain.


    #### Variable and Statement Coding Styles


    While HTML is case insensitive, most web servers such as Apache and Unix treat
    file names as case sensitive. If the file is called "logo.png" and our DOM script
    tries to access "Logo.png" with a different case, it will fail. The convention
    is to use lowercase in HTML for consistency and readability.'
