    ## The Number Data Type


    We saw some features of the number data type in an earlier lesson. The Number
    object has a few more properties and functions.


    #### Number Properties


    The static property Number.MAX_VALUE represents the largest positive number possible
    in JavaScript. Any number above this is represented as Infinity.


    -Number.MAX_VALUE (with a minus sign before it) is the negative number furthest
    from zero. Any number below it is –Infinity.


    The smallest positive number closest to zero without being zero is Number.MIN_VALUE.
    Any positive number smaller than this is converted to zero. -Number.MIN_VALUE
    is the smallest negative number closest to zero. Any negative number larger than
    this is converted to zero. 


    You must use these properties on the keyword Number, not a variable holding a
    number. 


    //demo4-10.html


    document.write(Number.MAX_VALUE); //correct use


    document.write(Number.MIN_VALUE); //correct use


    x = 10;


    x.MAX_VALUE; //incorrect use, returns undefined


    #### Number Methods


    toPrecision() and toFixed() are methods of the number object.  These were discussed
    in Lesson 1. 


    #### Global Functions Used with Numbers


    As seen in Lesson 1, parseInt() and parseFloat() are global functions that parse
    a string and return a number. JavaScript has global functions that take an argument
    of any data type and test whether it is a number.


    The global function isNaN() tests whether an argument is not a number.


    isNaN("abc"): //true


    isNaN(7): //false


    The global function isFinite() tests whether an argument is finite, and it must
    be a number to be finite.


    isFinite("abc"): //false


    isFinite(7): //true


    But isFinite() is not a true opposite of isNaN().


    isNaN(12/0): //false, it is a number


    isFinite(12/0); //value is Infinity, so false


    The only accurate way to determine whether a value is a number is to reverse the
    logic of isNaN().


    !isNaN(7); //true


    Lesson 5:  Compound Data Types


    Unit time: 75 minutes


    In this lesson, you will learn about:


    3   Arrays of Objects


    4   Using JSON Syntax to Store Data


    ## Arrays


    Numbers, strings and Booleans are primitive data types – a program’s basic building
    blocks. Arrays and objects are composite or compound data types, made up of primitive
    data types and/or other compound data types.


    An array is an enumerated list or collection of data that can hold several values
    under one name. In JavaScript, an array is a special type of object. In an array,
    each piece of data has a corresponding numeric index used to access the value.
    Arrays have one property and several manipulation methods.


    #### Storing Data in Arrays


    An array can be created with the literal syntax using square braces ([]). 


    var fruits = ["banana", "orange", "apple"];


    typeof fruits; //object


    Arrays are dynamic, so elements can be added or removed.


    var fruits = []; //declares the array fruits


    fruits[0] = "banana";


    fruits[1] = "orange";


    fruits[2] = "apple";


    #### Array Properties


    An array’s length property calculates the number of elements at that point.


    document.write(fruits.length); //3


    The length property is obtained by adding one to the highest index, not by counting
    the number of values.


    var fruits = [];


    //non-sequential array with 2 elements


    fruits[0] = "banana";


    fruits[2] = "apple";


    document.write(fruits.length); //3


    A specific element can be accessed with an index number. Index numbers range from
    0 to array length -1.


    fruits[0]; //first element


    fruits[fruits.length-1]; //last element


    #### Looping Over an Array


    Using index numbers, an array can be looped over with the while, do…while or for
    loop. These loops work well if the array is sequential. In the example below,
    if indexes 0, 1 or 2 are missing, undefined is printed in their place. 


    for (var x = 0; x < 3; x++) {


    document.write(fruits[x]);


    }


    If you don’t know the number of elements in an Array, you can use the length property
    to determine the number. 


    for (var x = 0; x < fruits.length; x++) {


    document.write(fruits[x]);


    }


    The length property calculates dynamically, every time it is called. If you are
    sure the array won’t change, it is more efficient to use the length property once,
    rather than each time the loop runs.


    var len = fruits.length;


    for (var x = 0; x < len; x++) {


    document.write(fruits[x]);


    }


    The for…in loops over every element in the array, even if the array is non-sequential.
    The keywords are for and in, with the array name to the right of the in and a
    variable representing the index number to the left.


    for (x in fruits) {


    //x is index number


    document.write(fruits[x]);


    #### }


    #### Exercise 5-1 Holding data in an array


    Use arrays to hold data.


    Using your editor, create a file named exercise5-1.js.


    Save the file in Lesson 5/Exercises/js.


    Make one array that contains the days of the week.


    Optional: make another array that contains the names of the months.


    Use the Date() constructor to get today''s date. Get the month, date, year, and
    day of the week. The date is getDate() and the day of the week is getDay().


    Use the arrays you made to print out the day of the week using words instead of
    numbers for the month and day of the week. If you did not make a month array,
    print the correct month number.


    Add a reference to the file to Lesson 5/Exercises/exercise5-1.html


    Save and test in the browser.


    #### Array Mutator Methods


    JavaScript has a few mutator methods that permanently modify an array. The methods
    return different things, but they all either add to, remove from, or change the
    order of the array.  Below are several methods that you may find useful. Be sure
    to check the actual demo files for the complete code of these examples.


    pop()


    pop() removes the last element from an array and returns it. It does not take
    any arguments.


    //demo5-1.html


    var fruits = ["banana", "orange", "apple"];


    var lastItem = fruits.pop();


    document.write(lastItem); //apple


    document.write(fruits); //banana,orange


    push()


    push() adds one or more elements to the end of the array and returns the length
    of the array. It takes one or more arguments.


    //demo5-2.html


    fruits.push("blueberry");


    fruits.push("cherry", "grape");


    reverse()


    reverse() reverses the order of the elements. It doesn’t take any arguments.


    //demo5-3.html


    //grape,cherry,blueberry,orange,banana


    fruits.reverse();


    shift()


    shift() removes the first element from an array and returns it. It doesn’t take
    any arguments. The index numbers of the existing elements change.


    //demo5-4.html


    var firstItem = fruits.shift()


    document.write(firstItem);//grape


    //cherry,blueberry,orange,banana


    document.write(fruits);


    sort()


    sort() doesn’t need any arguments to sort lexically, but we have an issue when
    we want to sort numerically. Pass a function to the sort() method that compares
    each element as part of a pair and swaps them if they are in the wrong order:


    var fruits = ["Banana", "Orange", "Apple"];


    fruits.sort(); // Apple, Banana, Orange


    //demo5-5.html


    var nums = [100, 1, 15, 20, 10, 200];


    nums.sort(); //1, 10, 100, 15, 20, 200


    //1, 10, 15, 20, 100, 200


    nums.sort(function(a, b){return a - b});


    splice()


    splice() can add and remove elements from an array. The first two arguments are
    required. The first argument is the index to start the splice at, the second argument
    is the number of items to remove.


    //demo5-6.html


    //start index 1, remove next 2


    fruits = ["banana", "orange", "apple", "blueberry", "cherry"];


    var rmItems = fruits.splice(1, 2);


    document.write(rmItems);//orange,apple


    document.write(fruits);//banana,blueberry,cherry


