    ## Custom Error Handling


    JavaScript has try, catch, throw and finally statements that let you customize
    error handling. try takes a block of code to test, catch lets you handle the error,
    throw lets you create custom errors, and finally lets you execute code regardless
    of the result of the try and catch. Combinations of flow control with these four
    statements are: try/catch, try/finally, or try/catch/finally. The throw statement
    that overwrites the built-in error goes in the try block. 


    Let''s say we misspell a method. JavaScript will output an error to the console.
    We can catch the error and redirect it to the page instead of the console. The
    built-in error is available to the catch statement. Whatever variable is passed
    to catch represents the error, in this case error. The error has a message property.


    //demo11-4.html


    try {


    alerts("Welcome guest!");


    }


    catch(error) {


    document.getElementById("demo").innerHTML = error.message;


    }


    We can raise an error or throw an exception and create our own error message.


    //demo11-5.html


    var x = prompt("Enter a number", "");


    try {


    //as many tests and throws here as needed


    if (x == "")


    {


    throw "empty";


    }


    }


    catch(error) {


    alert(error); //now the custom error


    }


    finally {


    //clean-up code happens regardless


    }


    ### Exercise 11-1 Throwing a custom error


    Throw a custom error for a form field.


    In the browser, open exercise11-1.html. Test the form field when it is empty,
    not a number, and a number under 5 or greater than 100.


    In your editor, open Lesson 11/Exercises/js/exercise11-1.js. We are going to throw
    a set of custom errors for the field.


    Create a function called checkAge(). Inside:


    Declare variables message and age.


    Set the message variable from the area on the page with id="message" so we can
    output it.


    Set the age variable from the age form field.


    Use try to set a series of if tests.


    If the age field is empty, throw an error stating that it is empty.


    If the age field is not a number (Hint: isNaN()), throw an error stating that.


    If the age field is below five, throw an error stating that it is too low.


    If the age field is over 100, throw an error stating that it is too high.


    Catch the error (Hint: use catch(err) and then print out err). Write the message
    to the appropriate field, and stop the form from submitting if there is an error.


    On page load, get the form element, and call the checkAge() function when it is
    submitted.


    Add a reference to the file to Lesson 11/Exercises/exercise11-1.html, save and
