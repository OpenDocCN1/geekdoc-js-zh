- fmt: "\nAt the end of the book, you will find a glossary of the definitions of terms\
    \ used in this course. In addition, there is an index provided to allow you to\
    \ quickly find what you are looking for.\n\n## Lesson 1: Introduction to JavaScript\n\
    \nUnit time: 75 minutes\n\nIn this lesson, you will learn about:\n\n1. Versions\
    \ of JavaScript\n2. Scripting Terminology\n3. Language Fundamentals\n4. Built\
    \ in Objects\n5. User Input Methods\n\n### Versions of JavaScript\n\n`JavaScript`\
    \ was created by Brendan Eich at Netscape Navigator in 1995. It was developed\
    \ to interact with HTML pages. It was originally called Mocha, then LiveScript\
    \ before being renamed `JavaScript`.\n\n`JavaScript` is an interpreted scripting\
    \ language, rather than a compiled programming language.\n\n`ECMAScript` is the\
    \ standardized specification of a few similar client-side scripting languages\
    \ including `JavaScript` and Microsoft’s implementation, `JScript`. In 1999, edition\
    \ 3 of `ECMAScript` added regular expressions and `try/catch` statements. In 2009,\
    \ edition 5 added strict mode. `ECMAScript` edition 6 introduces significantly\
    \ new syntax, including Python-like features. `ECMAScript` edition 6 was published\
    \ in June 2015, but is not yet fully supported by browsers. This course will focus\
    \ on edition 5.1.\n\n`JavaScript` has grown more popular in recent years because\
    \ of its contribution to rich internet applications and AJAX. This has led to\
    \ an increase in `JavaScript` libraries such as `jQuery` for Document Object Model\
    \ (`DOM`) scripting and JavaScript Model-View-Controller (`MVC`) frameworks such\
    \ as `AngularJS` and `Backbone.js`. A main use of `JavaScript` is to manipulate\
    \ the `DOM` through user events, providing immediate interaction and giving the\
    \ server a break. `JavaScript` is also used in HTML5 Application Program Interfaces\
    \ (`APIs`).\n\nEach browser has its own engine for interpreting `JavaScript`,\
    \ which occasionally leads to browser differences in how `JavaScript` is interpreted.\
    \ Several `JavaScript` libraries provide an abstraction layer to deal with browser\
    \ differences behind the scenes.\n\n`JavaScript` isn’t only used in web browsers.\
    \ `MongoDB` and `CouchDB` are two databases that use `JavaScript` as their query\
    \ language. `Node.js` is a platform that allows `JavaScript` beyond the browser,\
    \ and it is even used to create dynamic HTTP servers.\n\n#### Creating your first\
    \ JavaScript page\n\n`JavaScript` can be added to an HTML page in two different\
    \ ways. It can be added between `<script>` tags that are inside the HTML page,\
    \ or in a separate file of only `JavaScript`. Most applications will use a separate\
    \ `JavaScript` file. Using a separate file allows the script to be be re-used\
    \ and updated efficiently by developers. It also allows the browser to cache the\
    \ script.\n\n#### Exercise 1-1 Add a script to your page\n\nComplete the exercise\
    \ below to add a script to your page using tags and a separate file.\n\n1. In\
