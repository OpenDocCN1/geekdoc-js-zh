    document.write(str2);//plum > pear > banana > kiwi > lemon


    When the argument is omitted, the array is joined with commas.


    //demo5-13.html


    var fruits = ["plum", "pear", "banana", "kiwi", "lemon"];


    var str1 = fruits.join("|"); //the fruits array is unchanged


