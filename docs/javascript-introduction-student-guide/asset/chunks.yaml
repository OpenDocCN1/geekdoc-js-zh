    在书末，你将找到本课程所用术语的定义表。此外，还提供了一个索引，方便你快速找到所需的内容。


    ## 第 1 节：JavaScript 简介


    课时：75 分钟


    在本节中，你将学习到：


    1. JavaScript 版本

    2. 脚本术语

    3. 语言基础

    4. 内置对象

    5. 用户输入方法


    ### JavaScript 版本


    `JavaScript` 由 Brendan Eich 于 1995 年在 Netscape Navigator 中创建。它的开发是为了与 HTML 页面进行交互。它最初被称为
    Mocha，随后在更名为 `JavaScript` 之前被称为 LiveScript。


    `JavaScript` 是一种解释型脚本语言，而不是编译型编程语言。


    `ECMAScript` 是几种类似的客户端脚本语言的标准化规范，包括 `JavaScript` 和微软的实现版本 `JScript`。1999 年，`ECMAScript`
    的第 3 版增加了正则表达式和 `try/catch` 语句。2009 年，第 5 版增加了严格模式。`ECMAScript` 第 6 版引入了重大的新语法，包括类似
    Python 的特性。`ECMAScript` 第 6 版于 2015 年 6 月发布，但浏览器尚未完全支持。本课程将重点关注第 5.1 版。


    由于对富媒体网络应用和 AJAX 的贡献，`JavaScript` 近年来越来越流行。这导致了 `JavaScript` 库的增加，例如用于文档对象模型 (`DOM`)
    脚本的 `jQuery`，以及 JavaScript 视图控制器 (`MVC`) 框架如 `AngularJS` 和 `Backbone.js`。`JavaScript`
    的主要用途是通过用户事件操作 `DOM`，提供即时交互并减轻服务器的负担。`JavaScript` 也用于 HTML5 应用程序接口 (`APIs`)。


    每个浏览器都有自己的解释 `JavaScript` 的引擎，这有时会导致浏览器在解释 `JavaScript` 的方式上存在差异。一些 `JavaScript`
    库提供了抽象层，在后台处理浏览器差异。


    `JavaScript` 不仅用于 浏览器。`MongoDB` 和 `CouchDB` 是两个使用 `JavaScript` 作为查询语言的数据库。`Node.js`
    是一个允许 `JavaScript` 越浏览器的平台，甚至被用于创建动态 HTTP 服务器。


    #### 创建你的第一个 JavaScript 页面


    `JavaScript` 可以以两种方式添加到 HTML 页面中。它可以添加到 HTML 页面内部的 `<script>` 标签之间，也可以放在一个只包含
    `JavaScript` 的单独文件中。大多数应用程序将使用单独的 `JavaScript` 文件。使用单独的文件允许开发者高效地重复复用和更新脚本。它还允许浏览器缓存脚本。


    #### 练习 1-1 为你的页面添加脚本


    完成下面的练习，使用标签和单独的文件为你的页面添加一个脚本。


    1. 在编辑器中，打开 `Lesson 1/Exercises/exercise1-1.html`。

    2. 在 `<head>` 中添加一组 `<script>` 标签。

    3. 在 `<script>` 标签内部，添加 `document.write("Hello!<br>");`。

    4. 保存 `exercise1-1.html`。

    5. 在浏览器中打开该文件。

    6. 在编辑器中打开 `exercise1-1.html`。

    7. 仅将 `<script>` 标签之间的 `JavaScript` 代码移动到单独的文件。

    8. 将文件保存为 `exercise1-1.js` 并存放在 `Lesson 1/Exercises/js` 文件夹中。

    9. 在 `exercise1-1.html` 文件中，为`<script>` 标签添加 `src` 属性，使用相对路径引用外部的 `exercise1-1.js`
    文件。

    10. 保存 `exercise1-1.html`。

    11. 在浏览器中打开。

    12. 它看起来应该和第 5 步一样。


    ### 脚本术语


    在我们开始之前，我们需要涵盖一些术语以辅助学习过程。


    #### 表达式 (Expression)


    在脚本或编程中，表达式产生一个值。任何以字面量编写的值（如数字或字符串）都是表达式。


    表达式可以给变量赋值，或者仅仅拥有一个值。`JavaScript` 表达式可以求值为数字、字符字符串或真/假。


    下面是一个算术表达式的示例。在没有赋值的情况下，它的求值是 3。


    ```javascript

    1 + 2;

    ```


    #### 变量 (Variable)


    变量捕并持有值。它可以被更新。


    #### 运算符 (Operators)


    运算符分为一元、二元或三元，对应一个、两个或三个操作数。运算符可以是不同的类型，包括算术、字符串、逻辑、赋值和比较。大多数 `JavaScript` 运算符是二元的，要求在运算符的两侧都有一个操作数。


    在这个示例中，赋值运算符 `=` 是二元运算符，加法运算符 `+` 也是。


    ```javascript

    var x = 1 + 2;

    ```


    操作数是表达式中被运算符处理的部分。上面，数字 1 和 2 以及变量 `x` 就是操作数。


    还有一些一元运算符，操作数位于运算符的左侧或右侧。减号 `-` 可以在二元运算中从一个数字减去另一个数字，也可以在一元运算中对一个值取反。


    ```javascript

    var x = -3; //x 是负 3

    ```


    `JavaScript` 有一个三元运算符，在三个操作数之间有两个运算符。它是真/假测试的快捷方式，稍后将进行演示。


    #### 语句 (Statement)


    语句可以由表达式、变量和运算符组成。语句是一个包含表达式的完整指令，由网络浏览器执行。语句应该用分号分隔。


    ```javascript

    var x = 1 + 2; // 语句

    x = 3; // 语句（缺少分号）

    1 + 2; // 不是语句

    ```


    ### 语言基础


    本节将向你介绍 `JavaScript` 语法。


    #### 声明变量


    在 `JavaScript` 中，变量是局部或全局的。局部变量用 `var` 关键字声明。未声明的变量默认是全局的。在函数内部声明的变量是局部的。`JavaScript`
    通常具有关联性。


    下例示例声明了变量 `x`。


    ```javascript

    var x;

    ```


    声明的变量 `x` 稍后可以赋值。


    ```javascript

    x = 1 + 2;

    ```


    可以使用 `var` 关键字在一行内声明并赋值：


    ```javascript

    var y = 10 * 2;

    ```


    JavaScript 有 C 风格的快捷方式：`+=`、`-=`、`*=`、`/=` 和 `%=`。以下是赋值选项。


    // 将字符串 "hello" 赋值给变量

    ```javascript

    var str = "hello";

    ```


    // 将 "world" 连接到变量

    ```javascript

    str += "world";

    ```


    // += 是快捷方式

    ```javascript

    str = "hello";

    str = str + "world";

    ```


    ```javascript

    var x = 5;

    ```

    ```javascript

    x *= 10;

    ```


    //* *= 是快捷方式

    ```javascript

    x = 5;

    x = x * 10;

    ```


    #### 大写敏感


    `JavaScript` 是大小写敏感的。变量、内置对象、关键字、函数和方法必须使用正确的大小写。


    `JavaScript` 的约定是使用驼峰法来命名标识符（变量和函数）。JavaScript 的驼峰法是将多个单词放在一起并将第一个单词以外的所有字母大写：


    ```javascript

    var userName = "";

    function calculateTotalProfits(){}

    ```


    匈命名法也很流行，标识符的名称指示其类型和/或用途。


    ```javascript

    var intAge = 100; // 整数

    var strDept = "IT"; // 字符串

    var boolFullTime = true; // 布尔值

    var arrEmployeeList = []; // 数组

    ```


    注意使用驼峰法不是强制的，匈命名法并没有设置数据类型，它指示预期的数据类型。在 `JavaScript` 中，数据类型会随上下文改变；没有办法强制标识符始终是某种数据类型。


    #### 空格和结束语句


    在 `JavaScript` 中，分号结束一个语句。`JavaScript` 非常灵活，因此缺少分号通常不会引起错误。


    标记（运算符和操作数）之间的空格并不重要。如果语句在标记之间断开，可以延续到下一行，但字符串不能跨行。


