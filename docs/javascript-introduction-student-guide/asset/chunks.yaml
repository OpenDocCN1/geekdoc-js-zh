  trans: "\n\n# JavaScript 标签与分支语句\n\n在 JavaScript 中，`break;` 和 `continue;` 可以作为分支语句。它们可以带标签使用也可以不带标签使用。它们决定了程序下一步应该执行哪些代码。标签（label）是任何后面带有冒号的标识符。分支语句\
    \ `break;` 和 `continue;` 可用于循环中转移程序控制流。\n\n## 使用 `break;` 语句\n\n`break;` 语句终止循环（或\
    \ switch），跳转到循环或 switch 之外的下一个语句。\n\n```javascript\n//demo3-5.html\nfor (var x\
    \ = 1; x <= 10; x++) {\n  if (x % 5 == 0) {\n    break; //运行到能被 5 整除为止\n  }\n\
    \  document.write(x);\n}\n```\n\n### 在嵌套循环中，`break;` 终止当前循环。\n\n```javascript\n\
    //demo3-6.html\nvar i = 0;\n//运行 3 次，在数字 4 处跳出\nwhile (i < 3){\n  for (x = 1;\
    \ x <= 10; x++) {\n    if (x % 5 == 0) {\n      break;\n    }\n    document.write(x);\n\
    \  }\n  i++;\n}\n```\n\n`break;` 可以将程序控制权传递给标签。在这个示例中，当 `for` 循环达到数字 4 时，由于开发者创建了\
    \ `outerLoop:` 标签，程序控制权传递到了外部的 `while` 循环。\n\n```javascript\n//demo3-7.html\n\
    var i = 0;\n//运行一次，在数字 4 处跳出\nouterLoop: while (i < 3){\n  for (x = 1; x <= 10;\
    \ x++) {\n    if (x % 5 == 0) {\n      break outerLoop; //标签\n    }\n    document.write(x);\n\
    \  }\n  i++;\n}\n```\n\n### 使用 `continue` 语句\n\n`continue;` 语句终止当前迭代的循环执行，并继续下次迭代。一旦执行了\
    \ `continue;` 语句，其下语句将被跳过。在下方，如果数字不能被 5 整除，则跳转到循环的下次迭代。只有被 5 整除的数字会被打印。\n\n```javascript\n\
    //demo3-8.html\nfor (var x = 0; x <= 10; x++) {\n  if (x % 5 != 0) {\n    continue;\n\
    \  }\n  document.write(x); //如果被 5 整除\n}\n```\n\n也可以用 `continue;` 语句将程序控制权传递给标签。\n\
    \n## 练习 3-3 使用分支语句\n\n使用分支语句来操作程序控制流。\n\n使用你的编辑器创建一个名为 `exercise3-3.js` 的文件。\n\
    \n将文件保存到 `Lesson 3/Exercises/js`。\n\n生成一个 1 到 10 之间的随机数。提示：使用 `Math.random()`。\n\
    \n给用户三次机会猜数字。如果他们猜中了，给他们一条“恭喜”消息，并告诉他们花了多少次猜。\n\n如果用户在三次机会用完之前猜中了，你应该对循环做什么？\n\
    \n给用户提供通过输入“Q”（不区分大小写）来退出猜游戏的机会。\n\n如果他们三次尝试都没有猜中正确数字，打印该随机数。\n\n在 `Lesson 3/Exercises/exercise3-3.html`\
    \ 中添加对 JavaScript 文件的引用并进行测试。\n\n# 第 4 节：基本数据类型\n\n单元时间：75 分钟\n\n在本节中，你将学习：\n\
    1. `String` 数据类型\n2. `Number` 数据类型\n\n## String 数据类型\n\n字符串是由双引号或单引号界定的字符序列，用于文本的表示。字符串字面量是一种基本类型，类似于数值或布尔值。字符串上的一些常用操作包括检查其长度、连接（拼接）、搜索字符或提取子字符串。\n\
    \n```javascript\nvar str = \"hello world\";\n```\n\n在需要时，基本类型会被转换为字符串对象，因此包含字符串字面量的变量可以使用属性和方法。`String()`\
    \ 有利于将另一种数据类型转换为字符串，以便你可以使用属性和方法。`String()` 构造函数创建一个字符串对象。\n\n```javascript\n\
    var x = 100;\nvar str = String(x)\n```\n\n### String 属性\n\n字符串的 `length` 属性返回字符串的长度。\n\
    \n```javascript\n//demo4-1.html\nvar email = \"username@emaildomain.com\";\nvar\
    \ len = email.length;//返回 24\n```\n\n字符串可以是空的，在这种情况下它的长度为 0。\n\n```javascript\n\
    var str = \"\";\nvar strlen = str.length; //返回 0\n```\n\n### String 方法\n\n下面是某些用于操作数据类型的字符串方法的解释。\n\
    \n`charAt()`\n`charAt()` 方法接收一个索引数字并返回该索引处的字符。索引数字是介于 0 且小于字符串长度的整数。如果提供的索引大于字符串长度，则返回一个空字符串。\n\
    \n```javascript\n//demo4-2.html\nvar email = \"username@emaildomain.com\";\nvar\
    \ character = email.charAt(0); //返回 \"u\"\ndocument.write(character)\n```\n\n\
    `indexOf()`\n`indexOf()` 方法接收要搜索的字符（字符）和一个可选的起始索引数字。它返回一个从 0 到字符串长度减 1 的索引数字。如果未找到，则返回\
    \ -1。该方法是**区分大小写**的。\n\n```javascript\n//demo4-3.html\nvar email = \"username@emaildomain.com\"\
    ;\nvar index = email.indexOf(\"u\"); //返回 0\ndocument.write(index)\n```\n\n`lastIndexOf()`\n\
    `lastIndexOf()` 方法返回字符串中字符最后一次出现的索引数字。如果未找到，则返回 -1。该方法是**区分大小写**的。\n\n```javascript\n\
    //demo4-4.html\nvar email = \"username@emaildomain.com\";\nvar index = email.lastIndexOf(\"\
    e\"); //返回 12\ndocument.write(index)\n```\n\n`split()`\n`split()` 方法根据分隔符将字符串拆分为子字符串数组。\n\
    \n```javascript\n//demo4-5.html\nvar strDays = \"Mon, Tues, Fri\";\nvar arrDays\
    \ = strDays.split(\", \"); //[\"Mon\", \"Tues\", \"Fri\"]\ndocument.write(arrDays);\n\
    ```\n\n`slice()` vs. `substring()` vs. `substr()`\n`slice()` 方法提取字符串的一部分。它接收一个起始索引和一个可选的结束索引数字。如果第二个参数省略，则提取到字符串末尾。`substring()`\
    \ 方法也接收起始索引和结束索引，如果起始索引大于结束索引，它会交换这两个参数。`substr()` 方法接收一个起始索引和一个可选的要提取字符个数。如果第二个参数省略，则提取到字符串末尾。\n\
    \n```javascript\n//demo4-6.html\nvar email = \"username@emaildomain.com\";\nvar\
    \ strSlice = email.slice(9, 15); //\"domain\"\nvar strSub = email.substring(9,\
    \ 15); //\"domain\"\nvar strSubstr = email.substr(9, 6); //\"domain\"\n```\n\n\
    `trim()`\n`trim()` 方法返回删除两端空格后的字符串，而不影响原始字符串。\n\n```javascript\n//demo4-7.html\n\
    var user = \"  UserName \";\nvar trimUser = user.trim(); //\"UserName\"\ndocument.write(trimUser);\n\
    ```\n\n`toLowerCase()`\n`toLowerCase()` 方法将字符串转换为小写并返回结果。\n\n```javascript\n//demo4-8.html\n\
    var user = \"UserName\";\nvar lcUser = user.toLowerCase(); //username\ndocument.write(lcUser)\n\
    ```\n\n`toUpperCase()`\n`toUpperCase()` 方法将字符串转换为大写并返回结果。\n\n```javascript\n//demo4-9.html\n\
    var user = \"UserName\";\nvar ucUser = user.toUpperCase(); //USERNAME\ndocument.write(ucUser)\n\
    ```\n\n## 练习 4-1 使用字符串方法\n\n使用字符串方法和逻辑来验证输入的数据。\n\n使用你的编辑器创建一个名为 `exercise4-1.js`\
    \ 的文件。\n\n将文件保存到 `Lesson 4/Exercises/js`。\n\n要求用户输入电子邮件地址，并使用 `if...else/if...else`\
    \ 进行测试。\n\n记住，如果你在搜索字母，它是区分大小写的，但电子邮件地址不区分大小写。如果你要将其与字符串进行测试，将其转换为小写是很有用的。\n\n\
    通过首先使用字符串的 `trim()` 方法去除空格，确保用户的输入不是空的。\n\n对电子邮件地址进行一些数据验证。\n\n如果小于 6 个字符，则不是有效的。测试它至少有\
    \ 6 个字符。\n\n电子邮件地址应该包含：\n- 一个 `@` 符号\n- 不一个 `@` 符号\n\n"
