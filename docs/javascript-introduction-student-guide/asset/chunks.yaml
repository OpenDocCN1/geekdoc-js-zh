    ## Backreferences


    Backreferences can be used inside a pattern or outside a pattern. In either case,
    the backreferences match a substring in a group in the regular expression, delimited
    by parentheses. The backreference matches the actual substring found, not the
    pattern.


    Groups are created with parentheses, and backreferences refer by number to the
    group number by position.


    Inside a pattern, \1 is a backreference to the first parenthesized group, \2 is
    a backreference to the second parenthesized group, and so on.


    //ensures that separation character is repeated


    //matches 123-45-6789


    //matches 123456789


    //doesn''t match 12345-6789


    //doesn’t match 123-45 6789


    /^\d{3}([\-\.\s])?\d{2}\1\d{4}$/;


    Backreferences outside a pattern are created with $1 through $9, and can only
    hold nine references to groups. If more references are needed, use array indexes.
    Backreferences outside a pattern are accessed with RexExp.$1, RegExp.$2 but $1,
    $2 can be used within the replace() method.


    //demo7-7.html


    var reSSN = /^(\d{3})(\d{2})(\d{4})$/;


    var strSSN = "123456789";


    //hardcode hyphens between group 1, 2 and 3


    var cleanSSN = strSSN.replace(reSSN, "$1-$2-$3");


    document.write(cleanSSN);//123-45-6789


    ### Exercise 7-2 Using advanced regular expressions


    Use backreferences in regular expressions.


    Using your editor, create a file named exercise7-2.js.


    Save the file in Lesson 7/Exercises/js.


    Prompt for a phone number.


    Strip out non-digits using replace().


    Print the output to see what you have.


    Use backreferences outside of the pattern ($1, $2 etc.) and replace() to format
    the phone number to have parentheses around the area code, a space between the
    area code and the first three digits, and a hyphen after the first three digits
    and the next four: (123) 123-1234.


    Add a reference to the file to Lesson7/Exercises/exercise7-2.html and test.


    Optional: Create an HTML tag validator in the same file. Ask for an HTML tag and
    validate. Note that the browser will interpret any tag following certain rules
    as valid; it does not have to be a standard tag. The tag should start with a left
    angle brace (<) with at least one letter. The other characters inside the tag
    can be anything (Hint: anything but a close angle bracket >). Use a backreference
    inside the pattern (\1) to make sure the closing tag matches. Use the pipe (|)
    to also allow a self –closing tag that might or might not have a space. You will
    probably need parentheses around the closing tag choices. <a href="index.html">link</a>,
    <input type="text"/> and <input type="text" /> (with space) are examples of valid
    html tags.     


    Lesson 8:  The Browser Object Model


    Unit time: 75 minutes


    In this lesson, you will be learn about:


    ## The Browser Object Model


    The browser object model (BOM) is all objects exposed by a web browser. The top
    level of the hierarchy is the window object. The window object has methods, and
    properties that are also objects. Because window is the parent object of all other
    BOM objects, the keyword window is often left off in scripts.


    Useful window properties include history, location, navigator and screen. These
    will be demonstrated briefly. console is another window property with its own
    methods, such as log().


    The most commonly used window property is document. It has its own properties
    and methods, which will be explored in greater detail in the next lesson.


    Window methods include addEventListener(), which will be discussed in the lesson
    on JavaScript Events. alert(), confirm() and prompt() are three window methods
    that were introduced earlier. Other window methods are open() and close() for
    popup windows, and setTimeout()/clearTimeout() and setInterval()/clearInterval().


    As with the window properties, the keyword window is often left off when its methods
    are used. This only works for window properties and methods. 


    //both do the same thing


    window.prompt("What is your name?", "")


    //shorter


    prompt("What is your name?", "")


    #### The history Object


    window.history is read-only and contains the browser''s session history, pages
    visited in the currently loaded tab. It has its own properties and methods that
    can be used to get to other pages in the session history. To test the window.history,
    you must go to different URLs in the same tab. Remember that the window object
    can be dropped in your code.   


    To move backward or forward, as if the back or forward button was pressed:


    history.back()


    history.forward()


    To move to a specific point in history:


    history.go(-1);//equivalent of back button


    history.go(-2);//go back two


    history.go(0);//refresh current page


    history.go(1);//equivalent of forward button


    To find out how many pages are in the session history, use the read-only history.length
    property. Some browsers start the history length at 0 while others start it at
    1\. The maximum number that can be stored in history.length is 50. 


    var x = history.length;


    document.write(x);


    #### The location Object


    window.location is read-only, but a string URL can be assigned to it, changing
    the URL.


    alert(location);//displays current URL


    //redirects to new location using property


    location.href = "http://www.mysite.com";


    //redirects to new location using method


    location.assign("http://www.mysite.com");


    //shortcut


    location = "http://www.mysite.com";


    The location object has methods that can redirect the user to a new page. As seen
    above, location.href and location.assign() both redirect. The difference between
    location.assign() and location.replace() is that location.replace() redirects
    and removes the current URL from the browser''s history so that it is not possible
    to use the back button to go back to the original page.


    //redirects, replacing current URL in history


    location.replace("http://www.othersite.com");'
