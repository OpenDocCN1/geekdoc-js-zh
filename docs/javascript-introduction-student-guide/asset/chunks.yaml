    ## Using JSON Syntax to Store Data


    JSON stands for JavaScript Object Notation. It was specified by Douglas Crockford
    as an alternative to XML for storing and exchanging data. While the X in AJAX
    stands for XML, it is increasingly being replaced by JSON because of its familiar,
    lightweight syntax. JSON is language-independent. 


    While JSON uses JavaScript syntax, it is text only. No variables are allowed,
    and properties must be quoted. The text-only data format can be read by any programming
    language.


    {


    "employees" : [


    {"firstName": "John", "lastName": "Doe"},


    {"firstName": "Robert", "lastName": "Smith"}


    ]


    }


    Below we will explain the two methods that are used for parsing JSON.


    #### JSON.parse()


    JSON.parse() parses a string containing JSON syntax and returns the value as a
    JavaScript Object.


    //demo5-19.html


    //concatenation to break up string


    var str = ''{ "employees" : ['' +


    ''{"firstName": "John", "lastName": "Doe"},'' +


    ''{"firstName": "Robert", "lastName": "Smith"}'' +


    '']}''


    //convert string to JSON object


    var jObj = JSON.parse(str);


    document.write(jObj);//JSON object


    //access the first name of the second employee - Robert


    document.write(jObj.employees[1].firstName);


    #### JSON.stringify()


    JSON.stringify() takes a JavaScript object or array as an argument and converts
    it to a JSON string.


    var obj = {


    employees : [


    {firstName: "John", lastName: "Doe"},


    {firstName: "Robert", lastName: "Smith"}


    ]


    };


    //convert JavaScript object to JSON string


    var jString = JSON.stringify(obj);


    document.write(jString);//JSON string


    ## Lesson 6:  Functions


    Unit time: 75 minutes


    In this lesson, you will learn about:


    3   Scope


    4   Function Arguments


    ## Declaring and Invoking a Named Function


    A JavaScript function is a procedure containing a set of statements that performs
    a task and can be re-used. The code is defined once and can be used many times.
    The function is declared in the scope in which it is called.


    A function definition (or declaration or statement) is created with the keyword
    function, a name for the function, a list of parameters for the function in parentheses,
    and curly braces around the statements that are to run when the function is called.
    Parameters are initialized to arguments passed in parentheses when the function
    is invoked. 


    function sayHi() {


    document.write("Hi!");


    }


    sayHi();// calls/runs the created function sayHi


    Another example:


    //takes one argument, prints it squared


    function square (n) { // receives 3 and stores it in var n


    document.write(n * n); //writes out 9 to the page


    }


    square(3); // passes 3 to the square() function


    If a function has no parameters, the parentheses are empty. With parameters, a
    function can be run many times with different arguments to produce different results.


    The function can be called above or below the line that defines the function,
    as long as they are in the same scope. When the function is invoked, it takes
    arguments. The function is not executed until it is called. Later we will see
    how to let the user call functions with events. The () operator invokes the function. 


    square(10);//100


    Parameters in a function are names listed in the function definition. Arguments
    are the real values passed to the function. They can be constants or passed with
    variables. Variables pass by value. The original variable has not changed, only
    its value has been passed to the function. 


    x = 10;


    function square (n) { // receives x and stores it in var n


    document.write(n * n); //writes out 100 to the page


    }


    square(x);// passes 10 to the square function


    document.write (x);//x is still 10, changed in func. only


    #### Returning Values


    Returning a value makes the function more flexible. The result can be printed
    or assigned to a variable. The value is returned back to the calling program.


    //demo6-1.html


    function square (n) {


    return n * n;


    }


    var x = 10;


    //do something with return value


    document.write(square(x));//100


    //assign return result to variable


    y = square(x);


    document.write(y);//100


    The return statement makes the function stop executing. That means there can only
    be one return statement executed per function.  Nothing after the return statement
    will be executed. It is common to use more than one return statement in a function,
    with a condition that determines which return statement will be executed.


    If you must return multiple values, return an array or object.


    #### Exercise 6-1 Writing a function


    Create a re-usable piece of code and invoke it.


    Using your editor, create a file called exercise6-1.js.


    Save the file in Lesson 6/Exercises/js.


    You will make a Fahrenheit to Celsius converter. There are two form fields already
    in the HTML file, and some code to make one field change another as the numbers
    are typed. There are also comments with instructions in the code. 


    The formula for Fahrenheit is c = (f - 32) * 5 / 9


    The formula for Celsius to Fahrenheit is f = c * 9 / 5 + 32


    Round the result using Math.round() to get a whole number.


    Use document.getElementById("celsius").value to get and set the value of the Celsius
    form field (the explanation is in a later lesson).


    Use document.getElementById("fahrenheit").value to get and set the value of the
    Fahrenheit form field (the explanation is in a later lesson).


    Optional: The string argument you pass will be case sensitive. Consider making
    it case insensitive by converting the argument toLowerCase() or toUpperCase().


    Call the function twice where indicated by comments in the code, passing either
    "Celsius" or "Fahrenheit."


