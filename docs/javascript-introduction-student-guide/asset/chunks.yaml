    \n## 操作 DOM 节点\n\n节点（Node）可以是元素、属性、注释或文本类型。它具有几个属性和方法。\n\n### 使用 DOM 创建节点\n\n\
    文档对象有几个方法可以让它创建注释、元素或文本节点。新节点必须通过 `append` 和 `insert node` 方法进行定位。\n\n`document.createComment()`\
    \ 接收一个字符串并动态创建且返回一个新的注释节点。\n\n```javascript\ndocument.createComment(\"this is\
