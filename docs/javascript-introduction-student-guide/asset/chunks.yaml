    ## 使用 DOM 操控 CSS


    在 JavaScript 中，你可以为元素设置类（class）或样式属性。`class` 是 HTML 属性，而 `className` 是 JavaScript
    中等效属性，用于设置或获取类。"class" 一词与用于操作 DOM 的编程语言冲突。`className` 引用 CSS 中的一个类。如果 HTML 元素中已经存在
    `class` 属性，它会添加另一个。


    ```css

    //CSS

    .highlight{


    }

    ```


    ```javascript

    divMain.className = "highlight";

    ```


    ```html

    //输出

    <div id = "divMain" class="highlight"></div>

    var cName = divMain.className;

    ```


    `window.getComputedStyle(element)` 是一个只读属性，用于从外部或嵌入的 CSS 表格获取 `element` 参数的计算样式。计算样式是应用到元素上的所有
    CSS 属性值。


    `element.style` 获取或设置 HTML 样式属性的等效项。在 CSS 级联中，它的优先级最高，高于嵌入样式表和外部样式表。设置样式属性不会覆盖分配给元素的其他样式。使用
    `element.setAttribute("style", "properties")` 则会覆盖整个样式属性。


    CSS 中带连字符的样式属性（如 `margin-top`）在 JavaScript 中以驼峰命名法（`camelCase`）编写（如 `marginTop`）。


    ```javascript

    //demo9-5.html

    divMain.style.backgroundColor = "gray";

    divMain.style.color = "red";

    var bg = divMain.style.backgroundColor;


    //覆盖颜色和背景颜色

    divMain.setAttribute("style", "color: navy");

    ```


