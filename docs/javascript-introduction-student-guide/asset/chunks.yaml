    \n分隔符可以多于一个字符。\n\n```javascript\n//demo5-12.html\n\nvar fruits = [\"plum\", \"\
    pear\", \"banana\", \"kiwi\", \"lemon\"];\n\nvar str1 = fruits.join(\"|\"); //fruits\
    \ 数组保持不变\n\ndocument.write(str1);\n\nvar str2 = fruits.join(\" > \");\n\ndocument.write(str2);//plum\
    \ > pear > banana > kiwi > lemon\n```\n\n当省略参数时，数组用逗号连接。\n\n```javascript\n//demo5-13.html\n\
    \nvar fruits = [\"plum\", \"pear\", \"banana\", \"kiwi\", \"lemon\"];\n\nvar str1\
    \ = fruits.join(\"|\"); //fruits 数组保持不变\n\ndocument.write(str1);\n\nvar str2 =\
    \ fruits.join(\" > \");\n\ndocument.write(str2);\n\nvar str3 = fruits.join();//plum,banana,banana,lemon\n\
    ```\n\n如果参数为空（`\"\"`），元素之间将没有字符连接。\n\n```javascript\n//demo5-14.html\n\nvar fruits\
    \ = [\"plum\", \"pear\", \"banana\", \"kiwi\", \"lemon\"];\n\nvar str4 = fruits.join(\"\
    \");\n\ndocument.write(str4);//pearbanana\n```\n\n#### `slice()`\n\n`slice()`\
    \ 正如在字符串部分所示，它返回数组的一部分作为新数组返回。不要将其与变器方法 `splice()` 混淆，后者会移除项、添加项并永久地更改原始数组。`slice()`\
    \ 的第一个参数是开始的索引，提取的数组直到但不包含第二个参数。如果省略第二个参数，则提取到数组的末尾。作为字符串，`slice()` 可以接受负数。\n\n\
    ```javascript\n//demo5-15.html\n\nvar fruits = [\"plum\", \"pear\", \"banana\"\
    , \"kiwi\", \"lemon\"];\n\nvar someFruit = fruits.slice(1,2);\n\ndocument.write(someFruit);\
    \ //pear\n\ndocument.write(fruits);//plum,pear,banana,kiwi,lemon\n```\n\n### 练习\
    \ 5-2: 遍历数组\n\n使用数组、循环、`break` 语句和字符串方法创建一个客户端搜索功能。\n\n1. 使用你的编辑器，创建一个名为 `exercise5-2.js`\
    \ 的文件。\n2. 创建一个城市名称数组。确保其中一些城市是多个单词，例如 New York City。\n3. 提示用户输入要在数组中搜索的城市名称。\n\
    4. 循环遍历城市数组，如果找到了用户输入的城市：\n   - 将变量 `found` 设置为 `true`。\n   - 使用 `break` 跳出循环。\n\
    5. 在循环外部，如果 `found` 变量为 `true`，使用 `document.write()` 打印该城市和全名。\n6. 否则，使用 `document.write()`\
    \ 打印你没有找到用户输入的城市。\n7. 注意，到目前为止，搜索期望输入城市的全名。我们希望让它接受部分单词（只要城市名以这些字母开头），例如用 \"Atl\"\
    \ 代表 \"Atlanta\"。\n8. 在 `Exercises/js/exercise5-2.js` 中，使用 `substring()` 方法测试数组中的城市是否以搜索字符串的字母开头。\n\
    \   - 提示：`if (cities[i].substring(0, searchstring.length) == searchstring)`\n\
    9. 在打印城市名时，你想要打印数组中的全名，因此将你要打印的搜索字符串赋值给数组中的全名。\n   - 提示：`searchstring = cities[i]`\n\
    10. 你可能已经注意到搜索是区分大小写的。我们希望使其不区分大小写。\n11. 我们可以使用 `toUpperCase()` 方法将整个单词转为大写，但如果城市是多个单词怎么办？我们可以通过空格\
    \ `split()` 城市，遍历它，对它使用 `toUpperCase()` 方法，并用空格分隔符 `join()` 重新连接为字符串。\n    - 提示：在循环之前使用\
    \ `array = searchstring.split(\" \");`，在循环之后使用 `searchstring = array.join(\" \"\
    );`。\n12. 我们不希望整个单词全大写，只需要每个单词的首字母。我们将使用字符串方法获取第一个字符并将其转换为大写，与单词的其余部分拼接，并重新赋值给\
    \ `array[i]`。单词的其余部分可以通过 `array[i].slice(1)` 获得。\n    - 提示：`array[i].charAt(0).toUpperCase()`\n\
    13. 实际上，他们可能会输入全大写，所以我们应该将第一个字母以外的所有内容都转换为小写。\n    - 提示：使用 `array[i].slice(1).toLowerCase()`\
    \ 代替简单的 `array[i].slice(1)`。\n14. 保存并在浏览器中测试。\n\n#### 多维数组\n\n多维数组是数组的数组。\n\n\
    ```javascript\nvar people = [\n[\"Bob\", \"Smith\"],\n[\"John\", \"Doe\"]\n]\n\
    ```\n\n二维数组的元素通过两组方括号访问，其中第一组括号是“行”号，第二组括号是“列”号。\n\n```javascript\npeople[0][0];//\"\
    Bob\"\npeople[1][1];//\"Doe\"\n```\n\n多维数组也可以部分创建。\n\n```javascript\nvar people\
    \ = [[]];\npeople[0][0] = \"Bob\";\n```\n\n## 对象 (Objects)\n\n对象在了一个变量中存储多个值。数组和对象的区别在于，数组元素通过数字索引访问，而对象的元素通过字符串键访问。某些语言将此称为关联数组。\n\
    \n#### 在对象中存储数据\n\n可以使用对象字面量语法创建单个对象。\n\n```javascript\nvar person = {\nfirstName:\
    \ \"John\",\nlastName: \"Doe\",\neyeColor: \"green\"\n}\n```\n\n`firstName`、`lastName`\
    \ 和 `eyeColor` 是 `person` 对象的属性。对象的属性不需要引号，除非它们包含非字母数字字符。\n\n#### 在对象中访问数据\n\n\
    访问对象的元素有两种方法：点表示法（dot notation）或括号表示法（bracket notation）。在点表示法中，属性名不需要引号，但在括号表示法中需要。\n\
    \n```javascript\nperson.firstName;//John\nperson[\"lastName\"];//Doe\n```\n\n\
    这两种表示法也可以用于设置对象元素。\n\n```javascript\nperson.eyeColor = \"blue\";\nperson[\"age\"\
    ] = 21;\n```\n\n#### 遍历对象数据\n\n`for...in` 循环用于遍历对象。`while`、`do...while` 和 `for`\
    \ 循环无法用于对象，因为它们没有数字索引。对象名放在关键字 `in` 的右侧，用于键的变量放在左侧。\n\n```javascript\nfor (p in\
    \ person) {\ndocument.write(p + \": \" + person[p])\n}\n```\n\n"
- fmt: "\n### Creating an Object Method\n\nA custom object method can be created with\
    \ a function. The keyword `this` refers to the current object.\n\n```javascript\n\
    //demo5-16.html\nvar person = {\n  firstName: \"John\",\n  lastName: \"Doe\",\n\
    \  fullName: function(){\n    return this.firstName + \" \" + this.lastName\n\
    \  }\n}\ndocument.write(person.fullName());  //John Doe\n```\n\n### Creating an\
    \ Object Constructor\n\nThe previous example created a single object. To create\
    \ a blueprint that can be used to create many objects of one type, use an object\
    \ constructor function. Convention is that the constructor's first letter is uppercase.\n\
    \n```javascript\n//demo5-17.html\nfunction Person (fName, lName) {\n  this.firstName\
    \ = fName;\n  this.lastName = lName;\n}\nvar emp1 = new Person(\"John\", \"Doe\"\
    );\nvar emp2 = new Person(\"Robert\", \"Smith\");\n//use property name\ndocument.write(emp1.firstName);//John\n\
    document.write(emp2[\"firstName\"]);//Robert\ndocument.write(typeof emp1);//object\n\
    ```\n\n## Arrays of Objects\n\nIn addition to arrays of arrays, you can create\
    \ arrays of objects.\n\n```javascript\n//demo5-18.html\n//array of objects\nvar\
    \ employees = [\n  {firstName: \"John\", lastName: \"Doe\"},\n  {firstName: \"\
    Robert\", lastName: \"Smith\"}\n]\ndocument.write(employees[0][\"firstName\"]);//John\n\
    document.write(employees[0].firstName);//John\n//object contains array as value\
    \ of one property\nvar employee1 = {\n  firstName: \"John\",\n  lastName: \"Doe\"\
    ,\n  skills: [\"HTML\", \"CSS\", \"JavaScript\"]\n}\ndocument.write(employee1[\"\
    skills\"][0]);//HTML\ndocument.write(employee1.skills[0]);//HTML\n```\n\n### Exercise\
    \ 5-3 Working with objects\n\nCreate an array of objects and access each property.\n\
    \n1. Using your editor, create a file named `exercise5-3.js`.\n2. Save the file\
    \ in `Lesson 5/Exercises/js`.\n3. Make a named array of objects. The objects should\
    \ have properties like `firstName`, `lastName`, `email` and `phone`.\n4. Loop\
    \ through the array of objects and access all values.\n5. Add a reference to the\
    \ script to `Lesson 5/Exercises/exercise5-3.html`.\n6. Save and test in the browser.\n\
    \n## Using JSON Syntax to Store Data\n\nJSON stands for JavaScript Object Notation.\
    \ It was specified by Douglas Crockford as an alternative to XML for storing and\
    \ exchanging data. While the X in AJAX stands for XML, it is increasingly being\
    \ replaced by JSON because of its familiar, lightweight syntax. JSON is language-independent.\
    \ \n\nWhile JSON uses JavaScript syntax, it is a text only. No variables are allowed,\
    \ and properties must be quoted. The text-only data format can be read by any\
    \ programming language.\n\n```json\n{\n  \"employees\" : [\n    {\"firstName\"\
    : \"John\", \"lastName\": \"Doe\"},\n    {\"firstName\": \"Robert\", \"lastName\"\
    : \"Smith\"}\n  ]\n}\n```\n\nBelow we will explain the two methods that are used\
    \ for parsing JSON.\n\n### JSON.parse()\n\n`JSON.parse()` parses a string containing\
    \ JSON syntax and returns the value as a JavaScript Object.\n\n```javascript\n\
    //demo5-19.html\n//concatenation to break up string\nvar str = '{ \"employees\"\
    \ : [' +\n'{\"firstName\": \"John\", \"lastName\": \"Doe\"},' +\n'{\"firstName\"\
    : \"Robert\", \"lastName\": \"Smith\"}' +\n']}'\n//convert string to JSON object\n\
    var jObj = JSON.parse(str);\ndocument.write(jObj);//JSON object\n//access the\
    \ first name of the second employee - Robert\ndocument.write(jObj.employees[1].firstName);\n\
    ```\n\n### JSON.stringify()\n\n`JSON.stringify()` takes a JavaScript object or\
    \ array as an argument and converts it to a JSON string.\n\n```javascript\nvar\
    \ obj = {\n  employees : [\n    {firstName: \"John\", lastName: \"Doe\"},\n  \
    \  {firstName: \"Robert\", lastName: \"Smith\"}\n  ]\n};\n//convert JavaScript\
    \ object to JSON string\nvar jString = JSON.stringify(obj);\ndocument.write(jString);//JSON\
    \ string\n```\n\n## Lesson 6: Functions\n\nUnit time: 75 minutes\n\nIn this lesson,\
    \ you will learn about:\n1. Scope\n2. Function Arguments\n\n### Declaring and\
    \ Invoking a Named Function\n\nA JavaScript function is a procedure containing\
    \ a set of statements that performs a task and can be re-used. The code is defined\
    \ once and can be used many times. The function is declared in the scope in which\
    \ it is called.\n\nA function definition (or declaration or statement) is created\
    \ with the keyword `function`, a name for the function, a list of parameters for\
    \ the function in parentheses, and curly braces around the statements that are\
    \ to run when the function is called. Parameters are initialized to arguments\
    \ passed in parentheses when the function is invoked. \n\n```javascript\nfunction\
    \ sayHi() {\n  document.write(\"Hi!\");\n}\nsayHi();// calls/runs the created\
    \ function sayHi\n```\n\nAnother example:\n\n```javascript\n//takes one argument,\
    \ prints it squared\nfunction square (n) { // receives 3 and stores it in var\
    \ n\n  document.write(n * n); //writes out 9 to the page\n}\nsquare(3); // passes\
    \ 3 to the square() function\n```\n\nIf a function has no parameters, the parentheses\
    \ are empty. With parameters, a function can be run many times with different\
    \ arguments to produce different results.\n\nThe function can be called above\
    \ or below the line that defines the function, as long as they are in the same\
    \ scope. When the function is invoked, it takes arguments. The function is not\
    \ executed until it is called. Later we will see how to let the user call functions\
    \ with events. The `()` operator invokes the function. \n\n```javascript\nsquare(10);//100\n\
    ```\n\nParameters in a function are names listed in the function definition. Arguments\
    \ are the real values passed to the function. They can be constants or passed\
    \ with variables. Variables pass by value. The original variable has not changed,\
    \ only its value has been passed to the function. \n\n```javascript\nx = 10;\n\
    function square (n) { // receives x and stores it in var n\n  document.write(n\
    \ * n); //writes out 100 to the page\n}\nsquare(x);//passes 10 to the square function\n\
    document.write (x);//x is still 10, changed in func. only\n```\n\n### Returning\
    \ Values\n\nReturning a value makes the function more flexible. The result can\
    \ be printed or assigned to a variable. The value is returned back to the calling\
    \ program.\n\n```javascript\n//demo6-1.html\nfunction square (n) {\n  return n\
    \ * n;\n}\nvar x = 10;\n//do something with return value\ndocument.write(square(x));//100\n\
    //assign return result to variable\ny = square(x);\ndocument.write(y);//100\n\
    ```\n\nThe `return` statement makes the function stop executing. That means there\
    \ can only be one return statement executed per function. Nothing after the return\
    \ statement will be executed. It is common to use more than one return statement\
    \ in a function, with a condition that determines which return statement will\
    \ be executed.\n\nIf you must return multiple values, return an array or object.\n\
    \n### Exercise 6-1 Writing a function\n\nCreate a re-usable piece of code and\
    \ invoke it.\n\n1. Using your editor, create a file named `exercise6-1.js`.\n\
    2. Save the file in `Lesson 6/Exercises/js`.\n3. You will make a Fahrenheit to\
    \ Celsius converter. There are two form fields already in the HTML file, and some\
    \ code to make one field change another as the numbers are typed. There are also\
    \ comments with instructions in the code. \n4. The formula for Fahrenheit is `c\
    \ = (f - 32) * 5 / 9`.\n5. The formula for Celsius to Fahrenheit is `f = c * 9\
    \ / 5 + 32`.\n6. Round the result using `Math.round()` to get a whole number.\n\
    7. Use `document.getElementById(\"celsius\").value` to get and set the value of\
    \ the Celsius form field (the explanation is in a later lesson).\n8. Use `document.getElementById(\"\
    fahrenheit\").value` to get and set the value of the Fahrenheit form field (the\
    \ explanation is in a later lesson).\n9. Optional: The string argument you pass\
    \ will be case sensitive. Consider making it case insensitive by converting the\
    \ argument to `LowerCase()` or `toUpperCase()`.\n10. Call the function twice where\
    \ indicated by comments in the code, passing either \"Celsius\" or \"Fahrenheit\"\
    .\n\nThere is already HTML code and a reference to the script file in `Lesson6/Exercises/exercise6-1.html`.\
    \ The script is pulled in at the bottom of the page so it can use the DOM. We\
    \ will learn more about the DOM in a later lesson.\n\n## Creating an Anonymous\
    \ Function Expression\n"
