    \n冒泡或或，，，，，，，，...。。。。。。。。。。\n\n## 第 11 节：调试与最佳实践\n\n在本节中，你将学习到：\n\n1. JavaScript\
    \ 编码风格\n2. JavaScript 最佳实践\n3. 自定义错误处理\n\n### JavaScript 编码风格\n\n大多数 JavaScript\
    \ 代码应该存放在扩展为 `.js` 的独立文件中，以便更容易进行重用、测试和开发。所有项目都应该使用相同的编码规范，以便于阅读和维护。\n\n#### 变量和语句编码风格\n\
    \n虽然 HTML 不区分大小写，但大多数 Web 服务器（如 Apache 和 Unix）将文件名视为大小写敏感。如果文件名为 \"logo.png\"\
    ，而我们的 DOM 脚本尝试以不同的大小写访问 \"Logo.png\"，它将失败。惯例是在 HTML 中使用小写，以保持一致性和可读性。\n\n"
- fmt: "\nUse `camelCase` for identifier names (variables and functions).\n\n```javascript\n\
    var firstName = \"John\";\nvar lastName = \"Doe\";\nfunction calcTotal(){}\n```\n\
    \nAlthough it isn't required, it is more readable to put spaces around operators\
    \ and after commas.\n\n```javascript\nvar z = x + y;\nvar cities = [\"Atlanta\"\
    , \"Boston\", \"Chicago\"];\n```\n\nAlthough JavaScript does not throw an error\
    \ for a missing semicolon if a new statement starts on the next line, you should\
    \ always put semicolons on the end of each statement.\n\n```javascript\nvar fullName\
    \ = firstName + \" \" + lastName;\n```\n\nWhen assigning an object, the semicolon\
    \ goes at the end of the curly braces. This is different from the curly braces\
    \ in a block statement, which should not have a semicolon after them.\n\n- The\
    \ opening curly braces goes on the same line as the object name.\n- Use a colon\
    \ and space between the property name and value.\n- String values (not property\
    \ names) must have quotes around them.\n- Numeric values should not have quotes.\n\
    - In `JSON`, the property names must also have quotes around them.\n- Comma separate\
    \ property/value pairs, but there is no comma after the last one.\n- The closing\
    \ brace goes on a new line, with no leading spaces.\n\n```javascript\nvar person\
    \ = {\nfirstName: \"Jane\",\nlastName: \"Doe\"\n};\n```\n\nIf a JavaScript statement\
    \ must be broken for readability, it should be done between operators, especially\
    \ a comma if possible.\n\n```javascript\nvar cities = [\"Atlanta\", \"Boston\"\
    ,\n\"Chicago\"];\n```\n\n### Block Coding Styles\n\nThe block statement, where\
    \ several statements can be grouped together with a semicolon, has several conventions.\
    \ The opening curly brace should be at the end of the first line, with a space\
    \ before it. The closing curly braces should be on its own line with no spaces\
    \ before it. The statements inside the block should have semicolons, but the block\
    \ itself should not.\n\n```javascript\n//spaces before parentheses\n//space before\
    \ curly opening brace\nif (hour < 12) {\n  alert(\"Good Morning!\");\n}\nelse\
    \ {\n  alert(\"Good Afternoon!\");\n} //no semicolon here\n```\n\nIt is a general\
    \ convention to use four spaces to indent code blocks. Avoid using tabs, because\
    \ they are not interpreted consistently by different editors. Generally, there\
    \ should not be a space before the parentheses unless it is an anonymous function.\n\
    \n```javascript\nfunction calcTotal(){\n//indenting with four spaces\n  return\
    \ (price * tax) + price;\n}\n\n//put a space before parentheses in an //anonymous\
    \ function\nfunction () {\n  //do this\n}\n```\n\n## JavaScript Best Practices\n\
    \nAlthough JavaScript doesn't require it, always declare variables. Declaring\
    \ a variable inside a function makes it local to the function; this is preferable\
    \ to a global variable.\n\n```javascript\n//bad, undeclared variable\nx = 1;\n\
    //declared variable\nvar x = 1;\n```\n\nVariables should be declared at the top\
    \ of the page, to make it easier to find any variable declarations.\n\n```javascript\n\
    //declares multiple variables in one statement\nvar firstName, lastName, intAge;\n\
    ```\n\nIt is even better to initialize variables when declaring them, and at least\
    \ hint at the intended data type. Use `string`, `numeric`, `array` and `object`\
    \ literals for code efficiency. Note the indentation for readability.\n\n```javascript\n\
    //can still be separated by comma\nvar firstName = \"\",\nfullPrice = 0,\nmyArr\
    \ = [],\nmyObj = {};\n```\n\nJavaScript is loosely typed, so if you want to perform\
    \ type as well as value comparison, use the identity `===` operator rather than\
    \ the comparison `==` operators. The comparison `==` operator tries to convert\
    \ to matching types.\n\n```javascript\n//type conversion makes these true\n0 ==\
    \ \"\"; //true\n1 == true; //true\n//but they are not identical\n0 === \"\"; //false\n\
    1 === true; //false\n```\n\nThe assignment operator is one equal sign. A common\
    \ mistake is to use it instead of the comparison or identity operator.\n\n```javascript\n\
    var x = 1;\n//false, works as expected\nif (x == 2) {}\n//true, assigns 2 to x\
    \ and tests whether x is true\nif (x=2) {}\n```\n\n### Optimizing Code Performance\n\
    \nAvoid making JavaScript select or calculate something repeatedly, if it isn't\
    \ expected to change.\n\nRemember that the `length` property will tell you how\
    \ many elements are in an array, and that JavaScript arrays are dynamic. The number\
    \ of elements could increase or decrease within the code. In this example, JavaScript\
    \ calculates the array length each time the loop runs.\n\n```javascript\nvar arr\
    \ = [];\nfor (i = 0; i < arr.length; i++) {}\n```\n\nIf you know the number of\
    \ elements in an array will remain the same, it is much more efficient to get\
    \ the length once, and use that number in the loop. In this case, we calculate\
    \ the number of elements in the array only once.\n\n```javascript\nvar arr = [];\n\
    var len = arr.length;\nfor (i = 0; i < len; i++) {}\n```\n\nWhile JavaScript's\
    \ ability to work with the HTML `DOM` makes web pages very interactive, accessing\
    \ the `DOM` is a relatively slow and \"expensive\" operation. If you expect to\
    \ access the same DOM object more than once in a script, store it in a variable\
    \ to re-use.\n\n```javascript\n//get once\nvar div = document.getElementById(\"\
    divMain\");\n//use multiple times\ndiv.innerHTML = \"Hi\";\ndiv.style.color =\
    \ \"blue\";\n```\n\nIn the past, there was a convention to put scripts in the\
    \ `head` tag of an HTML page to get them out of the way. Browser code is single-threaded,\
    \ so HTML in the `body` won't load until the scripts have loaded. The user won't\
    \ see anything in the browser during that time. As scripts have become longer\
    \ and it has become popular to use several libraries, it is better to put scripts\
    \ at the bottom of the page. This way the browser loads the HTML first, and the\
    \ user can see the page while the scripts are loading. You should use the `window.onload`\
    \ event to make sure the page has loaded before using any DOM scripting.\n\n```html\n\
    //instead of\n<head>\n<script src=\"longScript.js\"></script>\n</head> \n<body>\n\
    \  content, images\n</body>\n\n//user sees page while script is loading\n<body>\n\
    \  content, images\n  <script src=\"longScript.js\"></script>\n</body>\n```\n\n\
    ### The \"use strict\"; Directive\n\nJavaScript is very flexible, and won't generally\
    \ throw errors for bad syntax. `\"use strict\"` is a literal expression, ignored\
    \ by older versions of JavaScript (for example, `< IE 10>). If the `\"use strict\"\
    ` declaration is at the beginning of a JavaScript file, it has global scope, and\
    \ all code executes in strict mode. While this is normally valid code, strict\
    \ mode would cause an error, as it requires all variables to be declared.\n\n\
    ```javascript\nx = 10;\nperson = {\nfirstName: \"John\",\nlastName: \"Doe\"\n\
    };\n```\n\nThe following forces JavaScript to throw an error for mistyped variables,\
    \ which are undeclared, instead of making them into a new variable. Since a global\
    \ `\"use strict\"` requires variables inside a function to be declared, it effectively\
    \ requires them to be local.\n\n```javascript\n//demo11-1.html\n\"use strict\"\
    ;\nvar x = 10;\nvar person = {\nfirstName: \"John\",\nlastName: \"Doe\"\n};\n\
    for (var i = 0; i < 10; i++) {\n  document.write(i);\n}\nfunction calcTotal(){\n\
    \  x = 20; //ok because x declared above\n  y = 10; //global use strict causes\
    \ error\n  var z = 20; //valid\n}\n```\n\nIf the `\"use strict\"` declaration\
    \ is inside a function, it has local scope and only applies to the code inside.\n\
    \n```javascript\n//demo11-2.html\nx = 10; //not in strict mode, this is valid\n\
    function calcTotal(){\n  \"use strict\"; //in scope of function\n  y = 20; //not\
    \ valid\n  var z = 30; //valid\n}\n```\n\n### The JavaScript debugger; Statement\n\
    \nA browser's error console will show syntax errors, but logical errors are difficult\
    \ to find. One approach is to write to `document.write()`. You can only see the\
    \ result if you go to the browser's JavaScript console.\n\n```javascript\nvar\
    \ x = 10;\nalert(x);\n```\n\nIf there is an error, JavaScript will not run any\
    \ code. You might want to set breakpoints and run a little bit of code at a time.\
    \ Breakpoints force JavaScript to stop executing and allow you to check JavaScript\
    \ values. You can restart the script from within the debugger.\n"
