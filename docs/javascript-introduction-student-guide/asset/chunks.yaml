  trans: "\n\n`Math` 对象用于超出基础算术的计算。属性包括 `PI` (``3.141592653589793`), 方法包括 `round()`、`ceil()`、`floor()`、`random()`、`min()`\
    \ 和 `max()`。\n\n`round()` 将数值舍入到最近的整数。如果小数部分为 `.5` 或更大，它将进位到下一个整数。\n\n`ceil()`\
    \ 将数值向上取整到下一个整数。\n\n`floor()` 始终向下取整。\n\n`random()` 不接受任何参数，返回一个 0 到 1 之间的数字（不包含\
    \ 1）。\n\n`min()` 返回一组数字中的最小值。\n\n`max()` 返回一组数字中的最大值。\n\n```javascript\n//demodemo1-1.html\n\
    \n//document.write 将内容写入网页\n\ndocument.write(Math.ceil(4.2));//5\ndocument.write(Math.floor(4.9));//4\n\
    document.write(Math.round(4.5));//5\n\n// 0 – 1 之间的随机数（不包含 1）\n//刷新页面获取新的随机数\n\
    document.write(Math.random());\n```\n\n## 日期 (Date)\n\nJavaScript 的 `Date()` 对象基于\
    \ Unix 戳：1970 年 1 月 1 日。\n\n`Date()` 是一个构造函数对象，必须使用 `new` 运算符创建日期。`Date()` 构造函数可以为空、接受一个字符串，或接受用逗号分隔的一到七个数字。空的\
    \ `Date()` 构造函数返回当前时间戳。要使用 `Date` 的方法之一，请先创建一个 `Date` 实例。\n\n```javascript\n//demo1-2.html\n\
    \nvar today = new Date();\n\ndocument.write(today);\n```\n\n如果你传递一个数字，`Date()`\
    \ 构造函数将其读取为自 Unix 戳以来的毫秒数。传递二到七个参数将变为年、月、日、小时、分钟、秒、毫秒以创建一个日期。当传递两个或多个参数时，第一个参数将变为年份，而不是自戳以来的毫秒数。\n\
    \n实用的 `Date` 方法包括 `getFullYear()`、`getDate()`、`getMonth()`、`getDay()`、`getHours()`、`getTime()`、`getMinutes()`\
    \ 和 `getSeconds()`。\n\n`getFullYear()` 返回日期的 4 位年份部分。\n\n`getDate()` 返回日期的日期部分——值从\
    \ 1 到 31。\n\n`getMonth()` 返回一个 0 – 11 的索引数字，代表月份，0 代表 1 月。\n\n`getDay()` 返回一个\
    \ 0 – 6 的索引数字，代表星期几，0 代表星期日。\n\n`getTime()` 方法通过自戳以来的毫秒数显示日期。你可以使用此来计算两个或多个日期之间有多少天、几周或几个月。\n\
    \n```javascript\n//demo1-3.html\n\nvar today = new Date();\n\ndocument.write(today.getTime());\n\
    ```\n\nJavaScript 还有 `Date` 方法 `setFullYear()`、`setDate()`、`setMonth()`、`setHours()`、`setMinutes()`\
    \ 和 `setSeconds()`。`setMonth()` 接受从 0 开始的索引数字。\n\n```javascript\n//demo1-4.html\n\
    \nvar birthday = new Date();\n\nbirthday.setMonth(11);\n\ndocument.write(birthday);\n\
    //12 月的时间戳，当前日期/年份\n```\n\n`setTime()` 方法接受自戳以来的毫秒数。对于标点时间之前的日期，它接受负数。\n\n```javascript\n\
    //demo1-5.html\n\nvar prevDate = new Date();\n\nprevDate.setTime(-1000000000000)\n\
    \ndocument.write(prevDate);\n//Sun Apr 24 1938 17:13:20 GMT-0500 (CDT)\n```\n\n\
    ## 用户输入方法 (User input methods)\n\n`window` 对象有三个方法：`alert()`、`confirm()` 和 `prompt()`。后两个可以获取用户输入。因为它们是\
    \ `window` 对象的方法，所以它们不能设置样式；由浏览器决定它们的外。\n\n`alert()` 接受一个参数，因此如果有多个数据，必须在作为参数传递之前对其进行拼接。\n\
    \n`confirm()` 接受一个参数并返回 `Boolean` 布尔值数据类型。\n\n`prompt()` 接受两个参数，一个问题和一个默认答案，并返回一个字符串数据类型。\n\
    \n用户还可以通过填写表单向网页输入数据，或通过点击等用户事件与网页交互。这两个概念将在稍后详细介绍。\n\n```javascript\n//demo1-6.html\n\
    \nalert(\"你好!\");\n\nprompt(\"你多大了？\", \"\");\n\nconfirm(\"你确定吗?\");\n```\n\n\
    ### 练习 1-3 内置的 Date() 对象\n\n通过此练习，你将确定两个日期之间的天数。\n\n使用你的编辑器，创建一个名为 `exercise1-3.js`\
    \ 的文件。\n\n将其保存到 `Lesson 1/Exercises/js` 中。\n\n使用 `new Date()` 获取当前日期。\n\n询问用户他们的下一个生日。\n\
    \n参考 `Lesson 1/Exercises/exercise1-3.js` 看看如何实现。\n\n## 第 2 ：条件 (Conditions)\n\n\
    在本节中，你将学习：\n1. `if` 结构\n2. `else` 结构\n3. `else if` 结构\n4. `switch` 结构\n5. 三元运算符\
    \ `?:`\n\n### if 结构 (The if Construct)\n\n`if` 接受一个参数，因此如果有多个数据，必须在作为参数传递之前对其进行拼接。\n\
    \n`if` 结构条件为真时执行。\n\n```javascript\nif (condition) {\n  statement\n}\n```\n\n\
    ### else 结构 (The else Construct)\n\n当 `if` 条件为假时，执行 `else` 部分。\n\n```javascript\n\
    if (condition) {\n  statement\n} else {\n  statement\n}\n```\n\n### else if 结构\
    \ (The else if Construct)\n\n当之前的 `if` 条件为假时，执行 `else if`。\n\n```javascript\n\
    if (condition) {\n  statement\n} else if (condition) {\n  statement\n}\n```\n\n\
    ### 测试多个条件 (Testing Multiple Conditions)\n\n当需要更多选择时，可以添加任意数量的 `else if` 结构。`else\
    \ if` 只有在之前的 `if` 或 `else if` 为假时才执行。`else` 在所有之前的条件都不为真时执行。\n\n```javascript\n\
    if (condition) {\n  statement;\n} else if (condition) {\n  statement;\n} else\
    \ {\n  statement;\n}\n```\n\n### 三元运算符 (The ternary operator)\n\n三元运算符可以是 `if-else`\
    \ 的简写形式。\n\n```javascript\nresult = condition ? expression1 : expression2;\n```\n\
    \n### switch 结构 (The switch Construct)\n\n当有多个可能的值需要进行比较时，可以使用 `switch`。\n\n```javascript\n\
    switch (expression) {\n  case value1:\n    statement;\n    break;\n  case value2:\n\
    \    statement;\n    break;\n  default:\n    statement;\n}\n```\n\n### 练习 2-1\
    \ 使用 if 结构 (Exercise 2-1 Using the if construct)\n\n此练习将使用 `if` 结构对输入进行验证。\n\n\
    使用你的编辑器，创建一个名为 `exercise2-1.js` 的文件。\n\n将其保存到 `Lesson 2/Exercises/js` 中。\n\n询问用户工作时长和工资。提示：使用两次\
    \ `prompt()`。\n\n假设员工工作 1-80 小时，工资在 1 到 100 美元之间，如果用户输入的数字超出范围，则说明输入误了。使用 `if`\
    \ 测试用户是否输入了正确范围，如果不是则再次询问。\n\n询问用户他们是否为全职员工。提示：使用 `confirm()`。它返回 `true` 或 `false`。\n\
    \n计算他们本周赚了多少。如果他们不是全职且工作超过了 40 小时，则加班部分支付一倍半工资。\n\n使用 `document.write(variable);`\
    \ 打印到页面。\n\n将 JavaScript 文件引用到 `Lesson 2/Exercises/exercise2-1.html` 并测试。\n\n"
- fmt: "\nThe `switch` construct is used to select among several blocks of code to\
    \ be executed. Unlike an `if/else if` construct, the `switch` expression (this\
    \ can be a variable) is evaluated only once.\n\nThe value of the expression in\
    \ the `switch` construct is compared against values for each `case`. Each `case`\
    \ value ends with a colon. If the value matches a `case`, a block of code associated\
    \ with the `case` is executed. The `default` statement is not required, but is\
    \ used to specify code to run if there is no match. It is similar to `else`.\n\
    \nThe keyword `break;` is used to break out of a `switch` block. It is used when\
    \ a `case` match is found and there is no more need for testing. `break;` is not\
    \ needed for the last statement in a `switch`.\n\n```\nswitch (expression) {\n\
    \  case value1:\n    statement;\n    break;\n  case value2:\n    statement if\
    \ previous case false;\n    break;\n  default:\n    statement if previous case\
    \ false;\n    //break; not necessary at the end\n}\n```\n\nWithout `break`, different\
    \ cases will \"fall through\" and execute the same code. Sometimes this can be\
    \ used to your advantage.\n\n```\nswitch (expression) {\n  case value1:\n  case\
    \ value2:\n    statement to run for both cases;\n    break;\n  default:\n    statement\
    \ to run if previous false;\n}\n```\n\n```javascript\nvar day = \"Monday\";\n\
    switch (day) {\n  case \"Saturday\":\n  case \"Sunday\":\n    msg = \"It’s a weekend!\"\
    ;\n    break;\n  default:\n    msg = \"It’s a weekday.\";\n}\n```\n\n### Exercise\
    \ 2-2 Using the switch\n\nIn this exercise, you will use a `switch` construct.\n\
    \n- Using your editor, create a file called `exercise2-2.js`.\n- Save the file\
    \ in `Lesson 2/Exercises/js`.\n- Ask the user for a letter of the alphabet.\n\
    - Use a `switch` to determine whether the letter is a consonant or vowel.\n- Use\
    \ `document.write()` to print out whether it is a consonant or vowel.\n- Add a\
    \ reference to the JavaScript file to `Lesson 2/Exercises/exercise2-2.html` and\
    \ test.\n\n### The Conditional (Ternary) Operator\n\nThe conditional operator\
    \ `(?:?)` is the only operator in JavaScript that takes three operands (ternary).\
    \ It is used as a shortcut for the `if/else` construct. The first operand must\
    \ evaluate to true or false. The expressions have values of any type.\n\n`condition\
    \ ? expression1 : expression2;`\n\nIf `condition` is true, the ternary operator\
    \ returns `expression1`, the value after the `?`. Otherwise it returns `expression2`,\
    \ the value after the `:`. The return result can be output, assigned to a variable\
    \ or printed out.\n\n```javascript\nvar result = condition ? expression1 : expression2;\n\
    document.write(condition ? expression1 : expression2);\n```\n\nTo execute more\
    \ than one operation, separate with a comma.\n\n`condition ? operation1, operation2\
    \ : operation3, operation4;`\n\n```javascript\nvar numOfApples = 4;\nvar apples\
    \ = numOfApples == 1 ? //condition\n  \"There is \" + numOfApples + \" apple \"\
    \ : //op. if true\n  \"There are \" + numOfApples + \" apples \"; //op. if false\n\
    document.write(apples);\n```\n\n### Exercise 2-3 Using the ternary operator\n\n\
    Use the ternary operator as an `if/else` shortcut.\n\n- Using your editor, create\
    \ a file called `exercise2-3.js`.\n- Save the file in `Lesson 2/Exercises/js`.\n\
    - Ask the user for a price without a dollar sign.\n- If the price is over $100,\
    \ a 10% discount will be applied.\n- Use the ternary operator to determine whether\
    \ the discount is applied or not.\n- Use `document.write()` to print out the total\
    \ price, whether the discount is applied or not.\n- Add a reference to the JavaScript\
    \ file to `Lesson 2/Exercises/exercise2-3.html` and test.\n\n# Lesson 3: JavaScript\
    \ Loops\n\n**Unit time:** 75 minutes\n\nIn this lesson, you will learn about:\n\
    1. JavaScript Loops\n2. JavaScript Labels and Branch Statements\n\n## JavaScript\
    \ Loops\n\nJavaScript has three C-style loops, while `do…while` and `for`. Additionally,\
    \ JavaScript has a `for…in` loop that iterates over the enumerable properties\
    \ of an object.\n\nLoops are used to test for a particular condition as many times\
    \ as needed, or repeat code a certain number of times. They are frequently used\
    \ to iterate over an array or object, or validate form elements.\n\n### The while\
    \ Loop\n\nThe `while` loop is a pretest loop, testing a condition before the loop\
    \ runs. The block of code in a `while` loop is executed as long as the condition\
    \ is true. When the conditional expression returns false, the loop stops.\n\n\
    ```javascript\nwhile (condition) {\n  statements to run if condition is true;\n\
    }\n```\n\nAs with the `if` construct, curly braces can be left off if there is\
    \ only one statement, but it is better to use them.\n\nIf the conditional expression\
    \ never becomes false, the loop can never end, resulting in an infinite loop.\n\
    \n//demo3-1.html\n```javascript\nvar x = 0;\nwhile (x < 10) {\n  document.write(x);\n\
    \  document.write(\"<br>\");\n  x++; //increment by 1 to end at 10\n}\n```\n\n\
    When the condition is false to start with, the `while` loop doesn’t run at all.\n\
    \n```javascript\nvar x = 10;\nwhile (x < 10) {\n  document.write(x);\n  x++;\n\
    }\n```\n\n### Exercise 3-1 Using a while loop\n\nImprove your code with `while`\
    \ loops.\n\n- Using your editor, create a file named `exercise3-1.js`.\n- Save\
    \ the file in `Lesson 3/Exercises/js`.\n- Assume employees work 1-80 hours, with\
    \ an hourly wage from 1 – 100 dollars and that if the user enters a number outside\
    \ of the range, it has been mistyped.\n- Use a `while` to test that the user entered\
    \ the correct range, and ask them again if they did not use the correct range.\n\
    - Calculate and print their gross pay.\n- Which one is better, an `if` or a `while`\
    \ and why?\n- Add a reference to the JavaScript file to `Lesson 3/Exercises/exercise3-1.html`\
    \ and test.\n\n### The do…while Loop\n\nThe `do…while` loop is similar to the\
    \ `while` loop, except that it is a post-test loop that tests a condition after\
    \ the loop runs. The block of code in a `do…while` loop is always executed at\
    \ least once. Once the conditional expression returns false after the first run,\
    \ the loop stops.\n\n```javascript\ndo {\n  statements to run if condition is\
    \ true;\n} while (condition)\n```\n\nAs with the `if` and `while` constructs,\
    \ curly braces can be left off if there is only one statement.\n\nLike the `while`\
    \ loop, if the conditional expression never becomes false, the loop is infinite.\n\
    \n//demo3-2.html\n```javascript\nvar x = 0;\ndo {\n  document.write(x);\n  x++;\
    \ //after first run, increment by 1 to reach 10\n} while (x < 10);\n```\n\nThe\
    \ `do…while` loop runs at least once.\n\n//demo3-3.html\n```javascript\nvar x\
    \ = 10;\n//runs at once, before testing\ndo {\n  document.write(x);\n  x++;\n\
    } while (x < 10);\n```\n\n### Exercise 3-2 Using a do…while loop\n\nImprove your\
    \ code with `do…while` loops.\n\n- Open `exercise3-1.js`.\n- Save the file as\
    \ `exercise3-2.js` in `Lesson 3/Exercises/js`.\n- Replace the `while` with `do…while`.\n\
    - How is the code different from the `while` loop?\n- Add a reference to the JavaScript\
    \ file to `Lesson 3/Exercises/exercise3-2.html` and test.\n\n### The for Loop\n\
    \nThe `for` loop is most similar to the `while` loop. If a condition is initially\
    \ true, it runs a block of statements until the condition is false. The `for`\
    \ loop has three parts in parentheses, separated by two semicolons. The first\
    \ part is a declaration of a counter variable. The second part is the conditional\
    \ expression determining whether the loop should run. The last one resets the\
    \ initial variable, usually incrementing or decrementing the counter. There is\
    \ no semicolon after the last part of a `for` loop.\n\n```javascript\nfor (initialize;\
    \ condition; increment/decrement) {\n  statements;\n}\n```\n\nThe curly braces\
    \ can also be left off the `for` loop if there is only one statement.\n\nLike\
    \ the other C-style loops, neglecting to alter the initial variable results in\
    \ an infinite loop.\n\n//demo3-4.html\n```javascript\nfor (var x = 0; x < 10;\
    \ x++) {\n  document.write(x)\n}\n```\n\nSince it is more compact than the `while`\
    \ or `do…while` loop, the `for` loop is popular for enumerated arrays.\n\n###\
    \ The for…in Loop\n\nThe `for…in` loop is used to iterate through an array or\
    \ object and will be explored in more detail in the lesson about “Compound Data\
    \ Types”. The keywords are `for` and `in`. Below, `property` is a variable representing\
    \ the property of an object, and `object` is the name of the object or array.\n\
    \nThe `for…in` loop does not use a numbered counter.\n\n```javascript\nfor (property\
    \ in object) {\n  document.write(property + object[property]);\n}\n```\n\nAs with\
    \ the other constructs, the curly braces can be left off if there is only one\
    \ statement.\n"
  raw: 'The switch construct is used to select among several blocks of code to be
    executed. Unlike an if/else if construct, the switch expression (this can be a
    variable) is evaluated only once.


    The value of the expression in the switch construct is compared against values
    for each case. Each case value ends with a colon. If the value matches a case,
    a block of code associated with the case is executed. The default statement is
    not required, but is used to specify code to run if there is no match. It is similar
    to else.


    The keyword break; is used to break out of a switch block. It is used when a case
    match is found and there is no more need for testing. break; is not needed for
    the last statement in a switch.


    switch (expression) {


    case value1:


    statement;


    break;


    case value2:


    statement if previous case false;


    break;


    default:


    statement if previous case false;


    //break; not necessary at the end


    }


    Without break, different cases will "fall through" and execute the same code.
    Sometimes this can be used to your advantage.       


    switch (expression) {


    case value1:


    case value2:


    statement to run for both cases;


    break;


    default:


    statement to run if previous false;


    }


    var day = "Monday";


    switch (day) {


    case "Saturday":


    case "Sunday":


    msg = "It’s a weekend!";


    break;


    default:


    msg = "It’s a weekday.";


    }


    #### Exercise 2-2 Using the switch


    In this exercise, you will use a switch construct.


    Using your editor, create a file called exercise2-2.js.


    Save the file in Lesson 2/Exercises/js.


    Ask the user for a letter of the alphabet. 


    Use a switch to determine whether the letter is a consonant or vowel.


    Use document.write() to print out whether it is a consonant or vowel.


    Add a reference to the JavaScript file to Lesson 2/Exercises/exercise2-2.html
    and test.


    #### The Conditional (Ternary) Operator


    The conditional operator (?:) is the only operator in JavaScript that takes three
    operands (ternary). It is used as a shortcut for the if/else construct. The first
    operand must evaluate to true or false. The expressions have values of any type.


    condition ? expression1 : expression2;


    If condition is true, the ternary operator returns expression1, the value after
    the ?. Otherwise it returns expression2, the value after the :. The return result
    can be output, assigned to a variable or printed out.


    var result = condition ? expression1 : expression2;


    document.write(condition ? expression1 : expression2);


    To execute more than one operation, separate with a comma.


    condition ? operation1, operation2 : operation3, operation4;


    var numOfApples = 4;


    var apples = numOfApples == 1 ? //condition


    "There is " + numOfApples + " apple " : //op. if true


    "There are " + numOfApples + " apples ";//op. if false


    document.write(apples);


    #### Exercise 2-3 Using the ternary operator


    Use the ternary operator as an if/else shortcut.


    Using your editor, create a file called exercise2-3.js


    Save the file in Lesson 2/Exercises/js.


    Ask the user for a price without a dollar sign.


    If the price is over $100, a 10% discount will be applied.   


    Use the ternary operator to determine whether the discount is applied or not.


    Use document.write() to print out the total price, whether the discount is applied
    or not.


    Add a reference to the JavaScript file to Lesson 2/Exercises/exercise2-3.html
    and test.


    Lesson 3:  JavaScript Loops


    Unit time: 75 minutes


    In this lesson, you will learn about:


    1   JavaScript Loops


    2   JavaScript Labels and Branch Statements


    ## JavaScript Loops


    JavaScript has three C-style loops, while, do…while and for. Additionally, JavaScript
    has a for…in loop that iterates over the enumerable properties of an object.


    Loops are used to test for a particular condition as many times as needed, or
    repeat code a certain number of times. They are frequently used to iterate over
    an array or object, or validate form elements.


    #### The while Loop


    The while loop is a pretest loop, testing a condition before the loop runs. The
    block of code in a while loop is executed as long as the condition is true. When
    the conditional expression returns false, the loop stops.


    while (condition) {


    statements to run if condition is true;


    }


    As with the if construct, curly braces can be left off if there is only one statement,
    but it is better to use them.


    If the conditional expression never becomes false, the loop can never end, resulting
    in an infinite loop.


    //demo3-1.html


    var x = 0;


    while (x < 10) {


    document.write(x);


    document.write("<br>")


    x++; //increment by 1 to end at 10


    }


    When the condition is false to start with, the while loop doesn’t run at all. 


    var x = 10;


    while (x < 10) {


    document.write(x);


    x++;


    }


    #### Exercise 3-1 Using a while loop


    Improve your code with while loops.


    Using your editor, create a file named exercise3-1.js


    Save the file in Lesson 3/Exercises/js.


    Assume employees work 1-80 hours, with an hourly wage from 1 – 100 dollars and
    that if the user enters a number outside of the range, it has been mistyped. Use
    a while to test that the user entered the correct range, and ask them again if
    they did not use the correct range.


    Calculate and print their gross pay.


    Which one is better, an if or a while and why?


    Add a reference to the JavaScript file to Lesson 3/Exercises/exercise3-1.html
    and test.


    #### The do…while Loop


    The do…while loop is similar to the while loop, except that it is a post-test
    loop that tests a condition after the loop runs. The block of code in a do…while
    loop is always executed at least once. Once the conditional expression returns
    false after the first run, the loop stops.


    do {


    statements to run if condition is true;


    } while (condition)


    As with the if and while constructs, curly braces can be left off if there is
    only one statement.


    Like the while loop, if the conditional expression never becomes false, the loop
    is infinite.


    //demo3-2.html


    var x = 0;


    do {


    document.write(x);


    x++; //after first run, increment by 1 to reach 10


    } while (x < 10);


    The do…while loop always runs at least once.


    //demo3-3.html


    var x = 10;


    //runs at once, before testing


    do {


    document.write(x);


    x++;


    } while (x < 10);


    #### Exercise 3-2 Using a do…while loop


    Improve your code with do…while loops.


    Open exercise3-1.js


    Save the fileas exercise3-2.js in Lesson 3/Exercises/js.


    Replace the while with a do…while.


    How is the code different from the while loop?


    Add a reference to the JavaScript file to Lesson 3/Exercises/exercise3-2.html
    and test.


    #### The for Loop


    The for loop is most similar to the while loop. If a condition is initially true,
    it runs a block of statements until the condition is false. The for loop has three
    parts in parentheses, separated by two semicolons. The first part is a declaration
    of a counter variable. The second part is the conditional expression determining
    whether the loop should run. The last one resets the initial variable, usually
    incrementing or decrementing the counter. There is no semicolon after the last
    part of a for loop.     


    for (initialize; condition; increment/decrement) {


    statements;


    }


    The curly braces can also be left off the for loop if there is only one statement.


    Like the other C-style loops, neglecting to alter the initial variable results
    in an infinite loop.


    //demo3-4.html


    for (var x = 0; x < 10; x++) {


    document.write(x)


    }


    Since it is more compact than the while or do…while loop, the for loop is popular
    for enumerated arrays.


    #### The for…in Loop


    The for…in loop is used to iterate through an array or object and will be explored
    in more detail in the lesson about “Compound Data Types”. The keywords are for
    and in. Below, property is a variable representing the property of an object,
    and object is the name of the object or array.


    The for…in loop does not use a numbered counter.


    for (property in object) {


    document.write(property + object[property]);


    }


    As with the other constructs, the curly braces can be left off if there is only
    one statement.'
