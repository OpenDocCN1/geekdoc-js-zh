    ## Lesson 10: Event Handling


    Unit time: 75 minutes


    In this lesson, you will learn about:


    ### The event Object


    The `event` object represents any DOM event. Categories include mouse events,
    keyboard events, clipboard events, window events and form events. While events
    start "on-" in HTML, the "on-" is often dropped within JavaScript.


    There are a few ways to register an event handler. This is an old way that should
    not be used because it is obsolete.


    ```html

    <form id = "frm" onsubmit="validator()">

    ```


    A better way is to register the event within JavaScript, once the DOM is loaded.
    This can be done with traditional event registration, which works in all browsers,
    or `addEventListener()` which is more flexible. We will explore them in more detail
    on the next pages.


    ## Event Handling


    Interactive web pages are created by having the user run code, usually functions,
    through events.


    ### Traditional Event Registration


    We want to assign the function itself to `onsubmit`. We can pass a reference to
    the function by dropping the parentheses:


    ```javascript

    function validate(){

    //code

    }


    frm = document.getElementById("frm");

    frm.onsubmit = validate;

    ```


    Or we can assign an anonymous function expression to the event handler:


    ```javascript

    frm.onsubmit = function (){

    //code

    };

    ```


    Additional assignments to `onsubmit` would overwrite any existing event handlers.


    ### Registering With addEventListener()


    The `addEventListener()` method registers the listener on the target it gets called
    on. The target can be an element, the document or the window.


    `addEventListener()` takes the event (drop the "on-" prefix) as its first argument,
    and a callback function as its second argument. The callback function is a reference
    to a function to be run on the event. To pass parameters to the callback function,
    the second argument should be an anonymous function expression.


    ```html

    //demo10-1.html

    <table id="tbl1">

    table

    <tr>

    <td id="td1">table column</td

    </tr>

    </table>


    var tbl1 = document.getElementById("tbl1");

    var td1 = document.getElementById("td1");


    function outerMsg(){

    alert("you clicked on the table!");

    }


    function innerMsg(){

    alert("you clicked on the column!");

    }


    //clicking table runs table event

    tbl1.addEventListener("click", outerMsg);


    //clicking td bubbles

    //runs td then parent table event

    td1.addEventListener("click", innerMsg);

    ```


    This method allows for multiple handlers for one event.


    ```html

    //demo10-2.html

    td1.addEventListener("click", innerMsg);

    td1.addEventListener("click", otherMsg);

    ```


    `addEventListener()` has a third optional Boolean argument. `true` indicates that
    the user wants the events to occur in the capturing rather than the bubbling phase.
    Bubbling, the default, states that if there is an event on parent and child, the
    child event happens then the parent event. Capturing states that the parent event
    happens, then the child event.


    ```javascript

    //clicking td captures

    //runs table then child event

    tbl1.addEventListener("click", outerMsg, true);

    td1.addEventListener("click", innerMsg);

    ```


    The default value of the third argument is false, but sometimes it is passed explicitly
    for older browsers.


    ```javascript

    tbl1.addEventListener("click", callback, false);

    tbl1.addEventListener("click", function(){

    //code

    }, false);

    ```


    Within the handler, `this` references the element on which the event was fired.


    ```javascript

    //demo10-3.html

    //this is the object calling the function

    function changeColor(){

    this.style.backgroundColor = "navy";

    }


    td1.addEventListener("click", changeColor)


    //using this in an anonymous function

    td1.addEventListener("click", function(){

    this.style.backgroundColor = "navy";

    });

    ```


    ### Removing the Event Listener


    You might want to stop an event from happening once it has occurred a certain
    number of times. `removeEventListener()` will remove an event handler that has
    been attached with `addEventListener()`. It has the same arguments, but the function
    must not be anonymous.


    ## Types of Events


    ### Mouse Events


    Mouse events include `click`, `dblclick`, `mousedown` and `mouseup`. The `click`
    event is a combination of `mousedown` and `mouseup` events. Other mouse events
    are `mousemove` (when the mouse moves while over an element) and `mouseover/mouseout`.
    `mouseenter/mouseleave` are similar to `mouseover/mouseout` but do not bubble
    up through the DOM.


    ```javascript

    tbl1.addEventListener("mouseout", function(){

    alert("table");

    });

    //moving the mouse out of the td runs both

    td1.addEventListener("mouseout", function(){

    alert("column");

    });


    tbl1.addEventListener("mouseleave", function(){

    alert("table");

    });

    //moving the mouse out of the td runs only td

    td1.addEventListener("mouseleave", function(){

    alert("column");

    });

    ```


    ### Keyboard Events


    Keyboard events include `keyup`, `keypress` and `keydown`. `keydown` happens when
    the user first presses a key and `keyup` when the user lets go of a key. The `keypress`
    event happens when a key is pressed that results in a character value.

