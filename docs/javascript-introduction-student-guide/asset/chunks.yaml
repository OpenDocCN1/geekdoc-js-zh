  trans: "\n\n`@` 符号出现在第一个或最后一个字符以外的位置\n\n不包含空格\n\n为无效的电子邮件地址创建一个错误消息。\n\n如果电子邮件地址有效，使用\
    \ `document.write()` 打印该消息。提取域名名并将其与消息一起打印。\n\n在 `Lesson 4/Exercises/exercise4-1.html`\
    \ 中添加对 JavaScript 文件的引用，并进行 `test`。对于电子邮件验证器，使用一个无效的电子邮件地址进行测试，以确保你能获取错误信息。\n\n\
    # 数字数据类型\n\n我们在之前的课程中看到了数字数据类型的一些特性。`Number` 对象还具有更多属性和函数。\n\n## Number 属性\n\n\
    静态属性 `Number.MAX_VALUE` 代表 JavaScript 中最大的正数。任何大于此值的数字都表示为 `Infinity`。\n\n- `-Number.MAX_VALUE`（前面带有负号）是离\
    \ 0 最远的负数。任何小于此值的数字都是 `–Infinity`。\n\n最接近 0 但不是 0 的最小正数是 `Number.MIN_VALUE`。任何比此小的正数都会转换为\
    \ 0。`-Number.MIN_VALUE` 是最接近 0 的最小负数。任何比此大的负数都会转换为 0。\n\n你必须在关键字 `Number` 上使用这些属性，而不是持有数字的变量。\n\
    \n```javascript\n//demo4-10.html\n\ndocument.write(Number.MAX_VALUE); // 正确用法\n\
    \ndocument.write(Number.MIN_VALUE); // 正确用法\n\nx = 10;\n\nx.MAX_VALUE; // 错误用法，返回\
    \ undefined\n```\n\n## Number 方法\n\n`toPrecision()` 和 `toFixed()` 是数字对象的方法。这些在第\
    \ 1 中讨论过。\n\n## 与数字使用的全局函数\n\n如第 1 节所示，`parseInt()` 和 `parseFloat()` 是解析字符串并返回数字的全局函数。JavaScript\
    \ 拥有接受任何数据类型参数并测试其是否为数字的全局函数。\n\n全局函数 `isNaN()` 测试参数是否不是数字。\n\n```javascript\n\
    isNaN(\"abc\"): //true\nisNaN(7): //false\n```\n\n全局函数 `isFinite()` 测试参数是否为有限值，且它必须是数字才是有限的。\n\
    \n```javascript\nisFinite(\"abc\"): //false\nisFinite(7): //true\n```\n\n但 `isFinite()`\
    \ 并不是 `isNaN()` 的真正反面。\n\n```javascript\nisNaN(12/0): //false，它是一个数字\nisFinite(12/0);\
    \ //值为 Infinity，所以为 false\n```\n\n确定一个值是否为数字的唯一准确方法是反转 `isNaN()` 的逻辑。\n\n```javascript\n\
    !isNaN(7); //true\n```\n\n#  第 5 节：复合数据类型\n\n单元时间：75 分钟\n\n在本节中，你将学习到：\n1. 对象数组\n\
    2. 使用 JSON 语法存储数据\n\n## 数组\n\n数字、字符串和 `Booleans` 是原始数据类型——程序的基础构建块。数组和对象是复合或组合数据类型，由原始数据类型和/或其它复合数据类型组成。\n\
    \n数组是一个枚举列表或数据集合，可以在一个名称下保存多个值。在 JavaScript 中，数组是一种特殊的对象类型。在数组中，每条数据都有一个对应的数字索引，用于访问该值。数组有一个属性和几个操作方法。\n\
    \n## 在数组中存储数据\n\n可以使用字面量语法使用方括号 (`[]`) 创建数组。\n\n```javascript\nvar fruits = [\"\
    banana\", \"orange\", \"apple\"];\n\ntypeof fruits; //object\n```\n\n数组是动态的，因此可以添加或删除元素。\n\
    \n```javascript\nvar fruits = []; // 声明数组 fruits\nfruits[0] = \"banana\";\nfruits[1]\
    \ = \"orange\";\nfruits[2] = \"apple\";\n```\n\n## 数组属性\n\n数组的 `length` 属性计算该点的元素数量。\n\
    \n```javascript\ndocument.write(fruits.length); //3\n```\n\n`length` 属性是通过最高索引加\
    \ 1 得到的，而不是通过计算值的数量。\n\n```javascript\nvar fruits = [];\n// 具有 2 个元素的非连续数组\nfruits[0]\
    \ = \"banana\";\nfruits[2] = \"apple\";\ndocument.write(fruits.length); //3\n\
    ```\n\n可以使用索引数字访问特定元素。索引数字范围从 0 到 `array length - 1`。\n\n```javascript\nfruits[0];\
    \ // 第一个元素\nfruits[fruits.length-1]; // 最后元素\n```\n\n## 遍历数组\n\n使用索引数字可以使用 `while`、`do…while`\
    \ 或 `for` 循环遍历数组。如果数组是连续的，这些循环运行良好。在下面的示例中，如果索引 0, 1 或 2 缺失，则会在相应位置打印 `undefined`。\n\
    \n```javascript\nfor (var x = 0; x < 3; x++) {\n  document.write(fruits[x]);\n\
    }\n```\n\n如果你不知道数组元素的数量，可以使用 `length` 属性确定数量。\n\n```javascript\nfor (var x = 0;\
    \ x < fruits.length; x++) {\n  document.write(fruits[x]);\n}\n```\n\n`length`\
    \ 属性在每次被调用时都会动态计算。如果你确定数组不会改变，那么使用一次 `length` 属性比每次循环运行时都使用一次更有效。\n\n```javascript\n\
    var len = fruits.length;\nfor (var x = 0; x < len; x++) {\n  document.write(fruits[x]);\n\
    }\n```\n\n`for...in` 遍历数组中的每一个元素。如果数组是非连续的，`splice` 方法可以修改数组。`x` 是索引。\n\n```javascript\n\
    for (x in fruits) {\n  // 是索引\n  document.write(fruits[x]);\n}\n```\n\n## 练习 5-1\n\
    \n使用数组持有数据。\n使用 `array-1.js` 创建一个包含几的数组。可选：创建一个包含月份的数组。Lesson 5/Exercises/。\n\n\
    ## 数组变异方法\n\nJavaScript 有一些永久修改数组的方法。这些方法会添加、删除或更改数组的顺序。\n\n### `pop()`\n`pop()`\
    \ 从数组中移除最后一个元素并返回它。它不需要任何参数。\n\n```javascript\n//demo5-1.html\nvar fruits = [\"\
    banana\", \"orange\", \"apple\"];\nvar lastItem = fruits.pop();\ndocument.write(lastItem);\
    \ //apple\ndocument.write(fruits); //banana,orange\n```\n\n### `push()`\n`push()`\
    \ 向数组末尾添加一个或多个元素并返回数组长度。它接受一个或多个参数。\n\n```javascript\n//demo5-2.html\nfruits.push(\"\
    blueberry\");\nfruits.push(\"cherry\", \"grape\");\n```\n\n### `reverse()`\n`reverse()`\
    \ 反转元素的顺序。它不需要任何参数。\n\n### `shift()`\n`shift()` 从数组中移除第一个元素并返回它。它不需要任何参数。现有元素的索引值会改变。\n\
    \n```javascript\n//demo5-4.html\nvar firstItem = fruits.shift();\ndocument.write(firstItem);\
    \ //grape (- 注意：逻辑取决于之前的 push/reverse)\n```\n\n### `sort()`\n`sort()` 不需要参数即可按字母顺序排序，但当我们想要按数值排序时就会出现问题。向\
    \ `sort()` 方法传递一个函数，比较作为对的每个元素，如果它们的顺序错误则交换它们。\n\n```javascript\n//demo5-5.html\n\
    var fruits = [\"Banana\", \"Orange\", \"Apple\"];\nfruits.sort(); // Apple, Banana,\
    \ Orange\n\nvar nums = [100, 1, 15, 20, 10, 200];\nnums.sort(); //1, 10, 100,\
    \ 15, 20, 200\nnums.sort(function(a, b){return a - b});\n```\n\n### `splice()`\n\
    `splice()` 可以在数组中添加和删除元素。两个参数是必须的。第一个参数是开始 splice 的索引，第二个参数是要删除的元素数量。\n\n```javascript\n\
    //demo5-6.html\n//从索引 1 开始，删除接下来 2 个\nfruits = [\"banana\", \"orange\", \"apple\"\
    , \"blueberry\", \"cherry\"];\nvar rmItems = fruits.splice(1, 2);\ndocument.write(rmItems);\
    \ //orange,apple\ndocument.write(fruits); //banana,blueberry,cherry\n```\n\n"
- fmt: "\n```javascript\n//second argument higher than remaining number\n//of elements\
    \ – removes rest of elements\n\nvar fruits = [\"banana\", \"orange\", \"blueberry\"\
    , \"cherry\"];\n\nfruits.sort();\n\ndocument.write(fruits + \"<br>\");\n\nfruits.splice(1,\
    \ fruits.length);\n\ndocument.write(fruits);//banana\n```\n\nThe third optional\
    \ argument is a list of one or more items to be inserted into the array at the\
    \ first argument index number.\n\n```javascript\n//demo5-8.html\n//start at index\
    \ 1, add 2 elements, remove\n//next 2 elements\n\nvar fruits = [\"banana\", \"\
    orange\", \"apple\", \"blueberry\", \"cherry\"];\n\nvar rmItems = fruits.splice(1,\
    \ 2);\n\nfruits.splice(1, 0, \"kiwi\", \"lemon\"); // remove zero, add two\n\n\
    document.write(fruits); //banana, kiwi, lemon, blueberry, cherry\n```\n\n### `unshift()`\n\
    \n`unshift()` adds one or more elements to the front of an array and returns the\
    \ new length of the array. As with `shift()`, the index numbers of the existing\
    \ elements change.\n\n```javascript\n//demo5-9.html\n\nvar fruits = [\"banana\"\
    , \"orange\", \"apple\"];\n\nvar addItems = fruits.unshift(\"plum\", \"pear\"\
    );\n\ndocument.write(addItems);//5\n\ndocument.write(fruits); //plum, pear, banana,\
    \ orange, apple\n```\n\n### Array Accessor Methods\n\nAccessor methods do not\
    \ modify the array. They return a representation of the original array. Below\
    \ are some of the common accessor methods used for arrays.\n\n#### `concat()`\n\
    \n`concat()` returns a new array consisting of the array on which it is called\
    \ and the arrays or values provided as arguments.\n\n```javascript\n//demo5-10.html\n\
    \nvar fruits = [\"plum\", \"pear\", \"banana\", \"kiwi\", \"lemon\"];\n\nvar alpha\
    \ = [\"a\", \"b\", \"c\"];\n\nvar nums = [2, 3];\n\nvar concatArr = alpha.concat(fruits,\
    \ nums);\n\ndocument.write(alpha);//[\"a\", \"b\", \"c\"];\n\ndocument.write(concatArr);\
    \ //a,b,c,plum,pear, banana,kiwi,lemon,2,3\n```\n\n#### `join()`\n\n`join()` takes\
    \ a delimiter or separator as an optional argument and returns all elements of\
    \ an array joined as a string. Contrast with the string method `split()`, which\
    \ splits a string into an array by a delimiter/ separator.\n\n```javascript\n\
    //demo5-11.html\n\nfruits = [\"plum\", \"pear\", \"banana\", \"kiwi\", \"lemon\"\
    ];\n\nvar str1 = fruits.join(\"|\"); //the fruits array is unchanged\n\ndocument.write(str1)//plum|pear|banana|kiwi|lemon\n\
    ```\n\nThe delimiter can be more than one character.\n\n```javascript\n//demo5-12.html\n\
    \nvar fruits = [\"plum\", \"pear\", \"banana\", \"kiwi\", \"lemon\"];\n\nvar str1\
    \ = fruits.join(\"|\"); //the fruits array is unchanged\n\ndocument.write(str1);\n\
    \nvar str2 = fruits.join(\" > \");\n\ndocument.write(str2);//plum > pear > banana\
    \ > kiwi > lemon\n```\n\nWhen the argument is omitted, the array is joined with\
    \ commas.\n\n```javascript\n//demo5-13.html\n\nvar fruits = [\"plum\", \"pear\"\
    , \"banana\", \"kiwi\", \"lemon\"];\n\nvar str1 = fruits.join(\"|\"); //the fruits\
    \ array is unchanged\n\ndocument.write(str1);\n\nvar str2 = fruits.join(\" > \"\
    );\n\ndocument.write(str2);\n\nvar str3 = fruits.join();//plum,banana,banana,lemon\n\
    ```\n\nIf the argument is empty (`\"\"`), the elements are joined with no characters\
    \ between them.\n\n```javascript\n//demo5-14.html\n\nvar fruits = [\"plum\", \"\
    pear\", \"banana\", \"kiwi\", \"lemon\"];\n\nvar str4 = fruits.join(\"\");\n\n\
    document.write(str4);//pearbanana\n```\n\n#### `slice()`\n\n`slice()`, as seen\
    \ in the string section, returns a portion of an array as a new array. Don't confuse\
    \ it with mutator method `splice()`, which removes items, adds items, and permanently\
    \ changes the original array. The first argument in `slice()` is the index at\
    \ which to start and an array is extracted up to not including the second argument.\
    \ If the second argument is left off, it is extracted to the end of the array.\
    \ As strings, `slice()` can take negative numbers.\n\n```javascript\n//demo5-15.html\n\
    \nvar fruits = [\"plum\", \"pear\", \"banana\", \"kiwi\", \"lemon\"];\n\nvar someFruit\
    \ = fruits.slice(1,2);\n\ndocument.write(someFruit); //pear\n\ndocument.write(fruits);//plum,pear,banana,kiwi,lemon\n\
    ```\n\n### Exercise 5-2: Searching through an array\n\nUse an array, a loop, `break`\
    \ statement and string methods to create client side search.\n\n1. Using your\
    \ editor, create a file named `exercise5-2.js`.\n2. Make an array of city names.\
    \ Make sure some of them are multiple words, like New York City.\n3. Prompt the\
    \ user for the name of a city to search for in the array.\n4. Loop through the\
    \ cities array and if you find the city they typed:\n   - Set a variable `found`\
    \ to `true`.\n   - `break` out of the loop.\n5. Outside the loop, if `found` variable\
    \ is `true`, use `document.write()` to print the city and the name.\n6. Otherwise,\
    \ use `document.write()` to print you did not find the city they typed.\n7. Notice\
    \ that so far, the search expects the full name of the city to be typed in. We\
    \ want to make it accept partial words (as long as the city name starts with the\
    \ letters) like \"Atl\" for Atlanta.\n8. In `Exercises/js/exercise5-2.js`, use\
    \ the `substring()` method to test if the city in the array starts with the search\
    \ string's letters.\n   - Hint: `if (cities[i].substring(0, searchstring.length)\
    \ == searchstring)`\n9. When printing out the city name, you want to print the\
    \ full name from the array, so assign the searched string that you are going to\
    \ print out to the full name from the array.\n   - Hint: `searchstring = cities[i]`\n\
    10. You might have noticed that the search is case sensitive. We want to make\
    \ case insensitive.\n11. We can use the `toUpperCase()` method to make the whole\
    \ word uppercase, but what if the city is multiple words? We can `split()` the\
    \ city by the space, loop through it, use the `toUpperCase()` method on it and\
    \ `join()` it back as a string with a space delimiter.\n    - Hint: `array = searchstring.split(\"\
    \ \");` before the loop, and `searchstring = array.join(\" \");` after the loop.\n\
    12. We don’t want the whole word uppercase, just the first letter of each word.\
    \ We will use string methods to get the first character and make that uppercase,\
    \ concatenate it with the rest of the word, and reassign to `array[i]`. The rest\
    \ of the word can be grabbed with `array[i].slice(1)`.\n    - Hint: `array[i].charAt(0).toUpperCase()`\n\
    13. Actually, they might type in everything uppercase, so we should convert everything\
    \ but the first letter to lowercase.\n    - Hint: Use `array[i].slice(1).toLowerCase()`\
    \ instead of just `array[i].slice(1)`.\n14. Save, and test in the browser.\n\n\
    #### Multidimensional Arrays\n\nA multidimensional array is an array of arrays.\n\
    \n```javascript\nvar people = [\n[\"Bob\", \"Smith\"],\n[\"John\", \"Doe\"]\n\
    ]\n```\n\nA two-dimension array's elements are accessed with two sets of square\
    \ braces where the first set is the \"row\" number and the second is the \"column\"\
    \ number.\n\n```javascript\npeople[0][0];//\"Bob\"\npeople[1][1];//\"Doe\"\n```\n\
    \nA multidimensional array can also be created piece by piece.\n\n```javascript\n\
    var people = [[]];\npeople[0][0] = \"Bob\";\n```\n\n## Objects\n\nAn object stores\
    \ multiple values in one variable. The difference between an array and object\
    \ is that while an array's elements are accessed with numeric indexes, an object's\
    \ elements are accessed with string keys. Some languages call this an associative\
    \ array.\n\n#### Storing Data in an Object\n\nA single object can be created with\
    \ object literal syntax.\n\n```javascript\nvar person = {\nfirstName: \"John\"\
    ,\nlastName: \"Doe\",\neyeColor: \"green\"\n}\n```\n\n`firstName`, `lastName`\
    \ and `eyeColor` are properties of the `person` object. Object properties do not\
    \ need quotes around them unless they include non-alphanumeric characters.\n\n\
    #### Accessing Data in an Object\n\nThere are two ways to access an object's elements,\
    \ dot notation or bracket notation. In dot notation, the property name does not\
    \ have quotes, but in bracket notation it does.\n\n```javascript\nperson.firstName;//John\n\
    person[\"lastName\"];//Doe\n```\n\nThese two notations can also be used to set\
    \ object elements.\n\n```javascript\nperson.eyeColor = \"blue\";\nperson[\"age\"\
    ] = 21;\n```\n\n#### Looping Through Data in an Object\n\nThe `for...in` loop\
    \ is used to loop through objects. The `while`, `do...while` and `for` loop don't\
    \ work with objects since they don't have numeric indexes. The object name goes\
    \ to the right of the keyword `in` and a variable for the key goes to the left.\n\
    \n```javascript\nfor (p in person) {\ndocument.write(p + \": \" + person[p])\n\
    }\n```\n"
