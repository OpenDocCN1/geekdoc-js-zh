  trans: "\n\n在这个示例中，我们想在字符输入后捕获它。为了测试目的，我们不希望表单自动补全：\n\n```html\n//demo10-4.html\n\
    <form autocomplete=\"off\">\n  <input type=\"text\" id=\"fName\">\n</form>\n```\n\
    \nHello <span id=\"sp1\"></</span>Hello <span id=\"sp1\"></span>\n\n```javascript\n\
    sp1 = document.getElementById('sp1');\nfName = document.getElementById('fName');\n\
    \nfunction showChar(){\n  sp1.textContent = fName.value\n}\n\nfName.addEventListener(\"\
    keyup\", showChar);\n```\n\n`keydown` 和 `keyup` 都代表按键，而 `keypress` 只代表输入的字符。键盘事件对象还会为\
    \ `altKey`、`ctrlKey` 和 `shiftKey`返回 `Boolean` 类型值。\n\n```javascript\n//demo10-5.html\n\
    fld.addEventListener(\"keydown\", function(){\n  //如果按下 shift 键为 true\n  //如果按下其他键为\
    \ false\n  alert(event.shiftKey);\n})\n```\n\n### 剪贴板事件 (Clipboard Events)\n\n\
    某些浏览器支持剪贴板事件 `cut`、`copy` 和 `paste`。这对于禁用某些字段的剪切、复制或粘贴非常有用，例如确认邮箱地址。\n\n```html\n\
    //demo10-6.html\n<form id=\"frm\">\n  Confirm email: <input type=\"text\" id=\"\
    email\">\n</form>\n```\n\n```javascript\nfunction disable(){\n  alert(\"禁止剪、复制或粘贴\"\
    );\n  event.preventDefault();\n}\n\nemail = document.getElementById('email');\n\
    email.addEventListener(\"cut\", disable);\nemail.addEventListener(\"copy\", disable);\n\
    email.addEventListener(\"paste\", disable);\n```\n\n### 窗口事件 (Window Events)\n\
    \n`window` 对象拥有 `load` 和 `unload` 事件。在处理 DOM 时，`load` 事件非常重要，因为我们希望在访问元素之前确保 DOM\
    \ 已经加载。之前的示例通过将 `<script>` 标签置于我们正在访问的 HTML 内容下方解决了这个问题。\n\n```javascript\n//demo10-7.html\n\
    window.addEventListener(\"load\", function(){\n  //一旦我们确定它已//加载，就获取 div 元素\n \
    \ divMain = document.getElementById(\"divMain\");\n});\n```\n\n### 表单事件 (Form\
    \ Events)\n\n表单事件是在表单字段上发生的事件，适用于调用表单验证方法。有几个特定的表单特定事件：\n\n`focus` 和 `blur` 意味着用户进入或离开字段。当\
    \ `blur` 事件发生时，可以在该字段上运行验证代码。\n\n```javascript\n//没有必要使用 preventDefault\nfName.addEventListener(\"\
    blur\", function(){\n  if(fName == \"\"){\n    alert(\"姓名字段为空\");\n  }\n})\n```\n\
    \n`change` 事件在字段（如下拉菜单）的值发生变化时触发。`select` 事件在用户选择字段中的文本时发生。`reset` 在点击重置按钮时发生，而\
    \ `submit` 在表单提交时发生。当用户点击提交按钮时可以提交表单，但 `submit` 是 `form` 对象上的事件，而不是按钮上的事件。\n\n\
    ```javascript\n//preventDefault 阻止表单提交\nfunction validate(){\n  if(fName == \"\
    \"){\n    alert(\"姓名字段为空\");\n    event.preventDefault();\n  }\n}\n\n//frm 是表单\n\
    frm.addEventListener(\"submit\", validate);\n```\n\n表单经常使用其他事件，例如用于复选框、单选按钮或其他按钮的\
    \ `click`。\n\n```javascript\n//sbm 是提交按钮\nsbm.addEventListener(\"click\", validate);\n\
    ```\n\n由于表单会获取用户输入，`cut`、`copy` 和 `paste` 事件也可能被用于表单字段。\n\n## 事件方法 (Event Methods)\n\
    \n`event` 对象具有用于停止冒泡或默认行为的方法，这在事件处理中非常有用。\n\n### stopPropagation() (停止传播)\n\n\
    DOM 元素通常是嵌套的，因此当 `click` 等事件发生在子元素上时，它也会同时发生在其父元素上。事件会从子标签开始冒泡，按照嵌套顺序触发其父元素。\n\
    \n点击子元素 `tr` 或 `td` 会触发表格事件。正如你可能记得的，`td` 或 `tr` 也有一个事件处理器，它也会运行。\n\n```html\n\
    <table id=\"tbl1\">\n  table\n  <tr>\n    <td id=\"td1\">table column</td>\n \
    \ </tr>\n</table>\n```\n\n```javascript\nvar tbl1 = document.getElementById(\"\
    tbl1\");\nvar td1 = document.getElementById(\"td1\");\n\n//当表格被点击时\ntbl1.addEventListener(\"\
    click\", function(){alert(\"table\")})\n\n//当 td 被点击时，两个事件都会发生\ntd1.addEventListener(\"\
    click\", function(){alert(\"td\")})\n```\n\n`event` 对象有一个 `stopPropagation()`\
    \ 方法，用于取消冒泡阶段，这样如果用户点击了 `td` 且 `td` 关联了事件，则只有该事件会执行。必须直接点击表格，其表格事件才会运行。如果 `td`\
    \ 没有关联事件，则无论是否使用 `stopPropagation()`，表格事件都会运行。\n\n```javascript\ntbl1.addEventListener(\"\
    click\", function(){\n  //点击表格时触发事件\n  alert(\"table\");\n});\n\ntd1.addEventListener(\"\
    click\", function(){\n  alert(\"td\");\n  //不冒泡到父元素\n  // 只有在点击 td 时，才会发生 td 事件\n\
    \  event.stopPropagation();\n});\n```\n\n`event.stopImmediatePropagation()` 会停止在该元素上以及父元素上发生的其他事件执行。\n\
    \n### preventDefault() (阻止默认行为)\n\n`event` 对象具有用于停止冒泡或默认行为的方法，这在事件处理中非常有用。\n\n\
    `event.stopImmediatePropagation()` 会停止在该元素上以及父元素上发生的其他事件执行。\n\n`preventDefault()`\
