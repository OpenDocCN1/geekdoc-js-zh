    Using your editor, create a file named exercise5-3.js.


    Save the file in Lesson 5/Exercises/js.


    Make a named array of objects. The objects should have properties like firstName,
    lastName, email and phone.


    Loop through the array of objects and access all values.


    Add a reference to the script to Lesson 5/Exercises/exercise5-3.html.


