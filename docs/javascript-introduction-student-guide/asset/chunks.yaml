    \ file to `Lesson 4/Exercises/exercise4-1.html` and `test`. For the email validator,\
    \ test with an invalid email address to make sure you get the errors.\n\n# The\
    \ Number Data Type\n\nWe saw some features of the number data type in an earlier\
    \ lesson. The `Number` object has a few more properties and functions.\n\n## Number\
    \ Properties\n\nThe static property `Number.MAX_VALUE` represents the largest\
    \ positive number possible in JavaScript. Any number above this is represented\
    \ as `Infinity`.\n\n- `-Number.MAX_VALUE` (with a minus sign before it) is the\
    \ negative number furthest from zero. Any number below it is `–Infinity`.\n\n\
    The smallest positive number closest to zero without being zero is `Number.MIN_VALUE`.\
    \ Any positive number smaller than this is converted to zero. `-Number.MIN_VALUE`\
    \ is the smallest negative number closest to zero. Any negative number larger\
    \ than this is converted to zero.\n\nYou must use these properties on the keyword\
    \ `Number`, not a variable holding a number.\n\n```javascript\n//demo4-10.html\n\
    \ndocument.write(Number.MAX_VALUE); //correct use\n\ndocument.write(Number.MIN_VALUE);\
    \ //correct use\n\nx = 10;\n\nx.MAX_VALUE; //incorrect use, returns undefined\n\
    ```\n\n## Number Methods\n\n`toPrecision()` and `toFixed()` are methods of the\
    \ number object. These were discussed in Lesson 1.\n\n## Global Functions Used\
    \ with Numbers\n\nAs seen in Lesson 1, `parseInt()` and `parseFloat()` are global\
    \ functions that parse a string and return a number. JavaScript has global functions\
    \ that take an argument of any data type and test whether it is a number.\n\n\
    The global function `isNaN()` tests whether an argument is not a number.\n\n```javascript\n\
    isNaN(\"abc\"): //true\nisNaN(7): //false\n```\n\nThe global function `isFinite()`\
    \ tests whether an argument is finite, and it must be a number to be finite.\n\
    \n```javascript\nisFinite(\"abc\"): //false\nisFinite(7): //true\n```\n\nBut `isFinite()`\
    \ is not a true opposite of `isNaN()`.\n\n```javascript\nisNaN(12/0): //false,\
    \ it is a number\nisFinite(12/0); //value is Infinity, so false\n```\n\nThe only\
    \ accurate way to determine whether a value is a number is to reverse the logic\
    \ of `isNaN()`.\n\n```javascript\n!isNaN(7); //true\n```\n\n# Lesson 5: Compound\
    \ Data Types\n\nUnit time: 75 minutes\n\nIn this lesson, you will learn about:\n\
    1. Arrays of Objects\n2. Using JSON Syntax to Store Data\n\n## Arrays\n\nNumbers,\
    \ strings and `Booleans` are primitive data types – a program’s basic building\
    \ blocks. Arrays and objects are composite or compound data types, made up of\
    \ primitive data types and/or other compound data types.\n\nAn array is an enumerated\
    \ list or collection of data that can hold several values under one name. In JavaScript,\
    \ an array is a special type of object. In an array, each piece of data has a\
    \ corresponding numeric index used to access the value. Arrays have one property\
    \ and several manipulation methods.\n\n## Storing Data in Arrays\n\nAn array can\
    \ be created with the literal syntax using square braces (`[]`).\n\n```javascript\n\
    var fruits = [\"banana\", \"orange\", \"apple\"];\n\ntypeof fruits; //object\n\
    ```\n\nArrays are dynamic, so elements can be added or removed.\n\n```javascript\n\
    var fruits = []; //declares the array fruits\nfruits[0] = \"banana\";\nfruits[1]\
    \ = \"orange\";\nfruits[2] = \"apple\";\n```\n\n## Array Properties\n\nAn array’s\
    \ `length` property calculates the number of elements at that point.\n\n```javascript\n\
    document.write(fruits.length); //3\n```\n\nThe `length` property is obtained by\
    \ adding one to the highest index, not by counting the number of values.\n\n```javascript\n\
    var fruits = [];\n//non-sequential array with 2 elements\nfruits[0] = \"banana\"\
    ;\nfruits[2] = \"apple\";\ndocument.write(fruits.length); //3\n```\n\nA specific\
    \ element can be accessed with an index number. Index numbers range from 0 to\
    \ `array length - 1`.\n\n```javascript\nfruits[0]; //first element\nfruits[fruits.length-1];\
    \ //last element\n```\n\n## Looping Over an Array\n\nUsing index numbers, an array\
    \ can be looped over with the `while`, `do…while` or `for` loop. These loops work\
    \ well if the array is sequential. In the example below, if indexes 0, 1 or 2\
    \ are missing, `undefined` is printed in their place.\n\n```javascript\nfor (var\
    \ x = 0; x < 3; x++) {\n  document.write(fruits[x]);\n}\n```\n\nIf you don’t know\
    \ the number of elements in an Array, you can use the `length` property to determine\
    \ the number.\n\n```javascript\nfor (var x = 0; x < fruits.length; x++) {\n  document.write(fruits[x]);\n\
    }\n```\n\nThe `length` property calculates dynamically, every time it is called.\
    \ If you are sure the array won’t change, it is more efficient to use the `length`\
    \ property once, rather than each time the loop runs.\n\n```javascript\nvar len\
    \ = fruits.length;\nfor (var x = 0; x < len; x++) {\n  document.write(fruits[x]);\n\
    }\n```\n\nThe `for...in` loops over every element in the array, even if the array\
    \ is non-sequential. The keywords are `for` and `in`, with the array name to the\
    \ right of the `in` and a variable representing the index number to the left.\n\
    \n```javascript\nfor (x in fruits) {\n  //x is index number\n  document.write(fruits[x]);\n\
    }\n```\n\n## Exercise 5-1 Holding data in array\n\nUse arrays to hold data.\n\
    Using `array-1.js`, create an array that contains days.\nOptional: make another\
    \ array that contains months. In `Lesson 5/Exercises/js`.\n\n## Array Mutator\
    \ Methods\n\nJavaScript has a few mutator methods that permanently modify an array.\
    \ The methods return different things, but they all add to, remove from, or change\
    \ the order of the array. Below are several.\n\n### `pop()`\n`pop()` removes the\
    \ last element from an array and returns it. It does not take any arguments.\n\
    \n```javascript\n//demo5-1.html\nvar fruits = [\"banana\", \"orange\", \"apple\"\
    ];\nvar lastItem = fruits.pop();\ndocument.write(lastItem); //apple\ndocument.write(fruits);\
    \ //banana,orange\n```\n\n### `push()`\n`push()` adds one or more elements to\
    \ the end of the array and returns the length of the array. It takes one or more\
    \ arguments.\n\n```javascript\n//demo5-2.html\nfruits.push(\"blueberry\");\nfruits.push(\"\
    cherry\", \"grape\");\n```\n\n### `reverse()`\n`reverse()` reverses the order\
    \ of the elements. It doesn’t take any arguments.\n\n### `shift()`\n`shift()`\
    \ removes the first element from an array and returns it. It doesn’t take any\
    \ arguments. The index numbers of the existing elements change.\n\n```javascript\n\
    //demo5-4.html\nvar firstItem = fruits.shift();\ndocument.write(firstItem); //grape\
    \ (- Note: logic depends on previous push/reverse in context)\n```\n\n### `sort()`\n\
    `sort()` doesn’t need any arguments to sort lexically, but we have an issue when\
    \ we want to sort numerically. Pass a function to the `sort()` method that compares\
    \ each element as part of a pair and swaps them if they are in the wrong order.\n\
    \n```javascript\n//demo5-5.html\nvar fruits = [\"Banana\", \"Orange\", \"Apple\"\
    ];\nfruits.sort(); // Apple, Banana, Orange\n\nvar nums = [100, 1, 15, 20, 10,\
    \ 200];\nnums.sort(); //1, 10, 100, 15, 20, 200\nnums.sort(function(a, b){return\
    \ a - b});\n```\n\n### `splice()`\n`splice()` can add and remove elements from\
    \ an array. The first two arguments are required. The first argument is the index\
    \ to start the splice at, the second argument is the number of items to remove.\n\
    \n```javascript\n//demo5-6.html\n//start index 1, remove next 2\nfruits = [\"\
    banana\", \"orange\", \"apple\", \"blueberry\", \"cherry\"];\nvar rmItems = fruits.splice(1,\
    \ 2);\ndocument.write(rmItems); //orange,apple\ndocument.write(fruits); //banana,blueberry,cherry\n\
    ```\n"
