    ## Manipulating CSS with the DOM


    Within JavaScript, you can set classes or the style attribute for elements. `class`
    is an HTML attribute, `className` is the JavaScript equivalent property to set
    or get a class. The word "class" conflicts with programming languages that are
    used to manipulated the DOM. The `className` references a class from CSS. If a
    class attribute already exists in the HTML element, this adds another one.


    ```css

    //CSS

    .highlight{


    }

    ```


    ```javascript

    divMain.className = "highlight";

    ```


    ```html

    //yields

    <div id = "divMain" class="highlight"></</div>

    var cName = divMain.className;

    ```


    `window.getComputedStyle(element)` is a read-only property that gets the computed
    style of the `element` argument from an external or embedded CSS stylesheet. The
    computed style is all CSS property values applied to an element


    `element.style` gets or sets the equivalent of the HTML''s style attribute. This
    has the highest priority, over embedded stylsheets and external stylesheets, in
    the CSS cascade. Setting the style property does not overwrite other styles assigned
    to the element. Using `element.setAttribute("style", "properties")`, overwrites
    the whole style attribute.


    style properties that are hyphenated in CSS (`margin-top`) are written as `camelCase`
    in JavaScript (`marginTop`).


    ```javascript

    //demo9-5.html

    divMain.style.backgroundColor = "gray";

    divMain.style.color = "red";

    var bg = divMain.style.backgroundColor;


    //overwrites color and background color

    divMain.setAttribute("style", "color: navy");

    ```


