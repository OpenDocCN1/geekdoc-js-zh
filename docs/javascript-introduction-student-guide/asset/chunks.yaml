    //both events happen when td is clicked on


    td1.addEventListener("click", function(){alert("td")})


    The event object has a stopPropagation() method to cancel the bubbling phase,
    so that if the user clicks on the td, and the td has an event associated with
    it, only that event will execute. The table would have to be clicked on directly
    for its event to run. If the td does not have an event associated with it, the
    table event runs regardless of whether stopPropagation() is used. 


    tbl1.addEventListener("click", function(){


    //event if table clicked


    alert("table");


    });


    td1.addEventListener("click", function(){


    alert("td");


    //don''t bubble to parent


    //only td event happens if td is clicked


    event.stopPropagation();


    });


    event.stopImmediatePropagation() stops other events from executing on that element
    as well as on the parent.


    #### preventDefault()


    The event object has a method that stops the default behavior of the element.
    It can stop form submission if the form is not valid, or stop a link from going
    to another page if it should load content through AJAX instead.


