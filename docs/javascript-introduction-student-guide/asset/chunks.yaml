    \ \"<br>\");\n\n//original format\ndocument.write(phNum, \"<br>\");\n\n//strip\
    \ out non-digits\ncleanedPhone = phNum.replace(re, \"\");\n//1234567890\ndocument.write(cleanedPhone,\
    \ \"<br>\");\n```\n\n### String Method `split()`\n\n`split()` is a string method\
    \ seen earlier that uses a string literal or regular expression to break a string\
    \ into an array of substrings.\n\n```javascript\n//demo7-6.html\n//global modifier\
    \ g not necessary\n//looks for non-digit characters\nvar re = /\\D/;\nvar phNum\
    \ = \"(123) 456-7890\";\nvar cleanedPhone = phNum.split(re);\n\nfor (i in cleanedPhone)\
    \ {\n    document.write(cleanedPhone[i], \"<br>\");\n}\n```\n\n`split()` takes\
    \ a separator character as an argument and an optional second argument, the number\
    \ of splits to return. The default behavior is to split the string into all possible\
    \ substrings.\n\n```javascript\nvar cleanedPhone = phNum.split(re, 2);\n```\n\n\
    ### Exercise 7-1 Using regular expressions\n\nUse regular expressions to qualify\
    \ data using quantifiers.\n\nUsing your editor, create a file named `exercise7-1.js`.\n\
    \nSave the file in `Lesson 7/Exercises/js`.\n\nAsk the user for a U.S. zip code\
    \ or Canadian postal code.\n\nUsing one pattern:\n\nThe U.S. zip code can be five\
    \ numbers, nine numbers or five numbers, a hyphen or space and four more digits.\
    \ It can't be five digits with a hyphen or space without the extra four digits.\
    \ It can't be more than ten characters total, and it should not allow any characters\
    \ other than numbers, hyphen or space.\n\nThe Canadian postal code has the pattern\
    \ letter number letter space number letter number. The space is optional. The\
    \ letters are case-insensitive. Optional: The postal code can't start with the\
    \ upper or lower case letters `d, f, i, o, q, u, w` or `z`.\n\nUse a regular expression\
    \ method or string method to validate the zip and postal code.\n\nAdd a reference\
    \ to the file in `Lesson7/Exercises/exercise7-1.html` and test.\n\n## Backreferences\n\
    \nBackreferences can be used inside a pattern or outside a pattern. In either\
    \ case, the backreferences match a substring in a group in the regular expression,\
    \ delimited by parentheses. The backreference matches the actual substring found,\
    \ not the pattern.\n\nGroups are created with parentheses, and backreferences\
    \ refer by number to the group number by position.\n\nInside a pattern, `\\1`\
    \ is a backreference to the first parenthesized group, `\\2` is a backreference\
    \ to the second parenthesized group, and so on.\n\n```javascript\n//ensures that\
    \ separation character is repeated\n//matches 123-45-6789\n//matches 123456789\n\
    //doesn't match 12345-6789\n//doesn’t match 123-45 6789\n/^\\d{3}([\\-\\.\\s])?\\\
    d{2}\\1\\d{4}$/;\n```\n\nBackreferences outside a pattern are created with `$1`\
    \ through `$9`, and can only hold nine references to groups. If more references\
    \ are needed, use array indexes. Backreferences outside a pattern are accessed\
    \ with `RexExp.$1`, `RegExp.$2` but `$1`, `$2` can be used within the `replace()`\
    \ method.\n\n```javascript\n//demo7-7.html\nvar reSSN = /^(\\d{3})(\\d{2})(\\\
    d{4})$/;\nvar strSSN = \"123456789\";\n//hardcode hyphens between group 1, 2 and\
    \ 3\nvar cleanSSN = strSSN.replace(reSSN, \"$1-$2-$3\");\ndocument.write(cleanSSN);//123-45-6789\n\
    ```\n\n### Exercise 7-2 Using advanced regular expressions\n\nUse backreferences\
    \ in regular expressions.\n\nUsing your editor, create a file named `exercise7-2.js`.\n\
    \nSave the file in `Lesson 7/Exercises/js`.\n\nPrompt for a phone number.\n\n\
    Strip out non-digits using `replace()`.\n\nPrint the output to see what you have.\n\
    \nUse backreferences outside of the pattern (`$1`, `$2` etc.) and `replace()`\
    \ to format the phone number to have parentheses around the area code, a space\
    \ between the area code and the first three digits, and a hyphen after the first\
    \ three digits and the next four: `(123) 123-1234`.\n\nAdd a reference to the\
    \ file to `Lesson7/Exercises/exercise7-2.html` and test.\n\nOptional: Create an\
    \ HTML tag validator in the same file. Ask for an HTML tag and validate. Note\
    \ that the browser will interpret any tag following certain rules as valid; it\
    \ does not have to be a standard tag. The tag should start with a left angle brace\
    \ (`<`) with at least one letter. The other characters inside the tag can be anything\
    \ (Hint: anything but a close angle bracket `>`). Use a backreference inside the\
    \ pattern (`\\1`) to make sure the closing tag matches. Use the pipe (`|`) to\
    \ also allow a self – class.\n\n## Unit 8: The Browser Object Model\n\nThe browser\
    \ object model (BOM) is all objects exposed by `window`. The top level of the\
    \ hierarchy is `window`.\n\nUseful window properties include `history`, `location`,\
    \ `navigator` and `screen`.\n\n### The history Object\n\n`window.history` is read-only\
    \ and contains the browser's session history, pages visited in the currently loaded.\
    \ It has its own properties and methods that can be used to get to other pages\
    \ in the session history. To test `window.history`, you must go to different URLs.\n\
    \nTo move backward or forward, as if the back or forward button was pressed:\n\
    \n`history.back()`\n`history.forward()`\n\nTo move to a specific point in history:\n\
    \n`history.go(-1);//equivalent of back button\n`history.go(-2);//go back two\n\
    `history.go(0);//refresh current page\n`history.go(1);//equivalent of forward\
    \ button\n\nTo find out how many pages are in the session history, use the read-only\
    \ `history.length` property. Some browsers start the history length at 0 while\
    \ others start it at 1 The maximum number that can be stored in `history.length`\
    \ is 50.\n\n```javascript\nvar x = history.length;\ndocument.write(x);\n```\n\n\
    ### The location Object\n\n`window.location` is read-only, but a string URL can\
    \ be assigned to it, changing the URL.\n\n`alert(location);//displays current\
    \ URL\n\n//redirects to new location using property\n`location.href = \"http://www.mysite.com\"\
    ;`\n\n//redirects to new location using method\n`location.assign(\"http://www.mysite.com\"\
    );`\n\n//shortcut\n`location = \"http://www.mysite.com\";`\n\nThe location object\
    \ has methods that can redirect the user to a new page. As seen above, `location.href`\
    \ and `location.assign()` both redirect. The difference between `location.assign()`\
    \ and `location.replace()` is that `location.replace()` redirects and removes\
    \ the current URL from the browser's history so that it is not possible to use\
    \ the back button to go back to the original page.\n\n```javascript\n//redirects,\
    \ replacing current URL in history\nlocation.replace(\"http://www.othersite.com\"\
    );\n```\n"
