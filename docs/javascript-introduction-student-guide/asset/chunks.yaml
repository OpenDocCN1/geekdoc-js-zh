    //24 - 32 bit color resolution


    document.write(screen.colorDepth, "<br>");


    //same as colorDepth on modern computers


    document.write(screen.pixelDepth, "<br>");


    #### The console Object


    The window.console gives access to the browser''s debugging console. It has a
    few methods. We have been using the document.write() method. It takes a list of
    arguments separated by a comma, or one argument that is concatenated.


    document.write() automatically puts spaces between arguments separated with a
    comma. If values are concatenated, a space must be built into the string. The
    same is true for alert(), since it only takes one argument and therefore multiple
    values must be concatenated.


    fname = "John";


    //"Hello John"


    //console log adds space between arguments


    console.log("Hello", fname);


    //must add a space to the string


    alert("Hello" + " " + fname);


    #### The window Object''s open() and close()Methods


    window.open() opens a popup window – another instance of a browser window. The
    method takes four optional arguments. close() closes the popup window.


    The first argument is a URL to open as a popup. If you do not specify a URL, you
    can provide content from your main page.


    //opens help.html in a new tab


    open("help.html");


    The second argument is a name for the popup. The name is used as a target, for
    example for links to open in the new popup window.


    //if target = "popup" is used in a link,


    //it will open in this window


    open("help.html", "popup");


    The third argument is a list of specifications. height and width specify the size
    of the popup, and left and top specify the position. 


    //all four arguments are optional


    //200px wide, positioned 300px to the right


    //specification list is in one set of quotes


    open("help.html", "", "width=200, left=300");


    The fourth argument is true or false (default) and determines whether the new
    window replaces the current window in the history list.


    The return value of the open() method is a reference to the newly created window.


