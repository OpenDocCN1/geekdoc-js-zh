  trans: "\n匿名函数或函数表达式的语法与具名函数语句相似。某些编程语言将其称为 lambda。它包含 `function` 关键字、一个参数列表和一个代码块，但没有函数名。该表达式可以存储在变量中。由于变量存储了函数表达式，因此可以通过该变量来调用函数。\n\
    \n```javascript\nvar square = function (n) {\n  document.write(n * n);\n}\n\n\
    square (10); //100\n```\n\n调用具名函数或匿名函数看起来可能相似，但浏览器将它们加载到执行上下文的方式存在差异。具名函数声明在任何代码执行之前加载，因此调用函数的代码行可以出现在函数声明行的上方。匿名函数表达式则在\
    \ JavaScript 执行到该行代码时加载。匿名函数必须在定义它的代码行之后被调用。\n\n## 作用域 (Scope)\n\nJavaScript 函数本身有作用域，它们的变量也有作用域。\n\
    \n### 局部变量与全局变量\n\n作用域指的是你可以访问的变量和函数。JavaScript 有变量作用域，分为局部和全局。\n\n#### 局部变量\n\
    在函数内部声明的变量是该函数的局部变量。JavaScript 变量使用 `var` 关键字声明，因此使用 `var` 声明的变量局部于其作用域，而不使用 `var`\
    \ 关键字创建的变量是全局的。函数内部声明的局部变量只能在函数内部访问。\n\n```javascript\nfunction square (n) {\n\
    \  var total = n * n;\n}\n\nsquare(10);\ndocument.write(total);//undefined\n```\n\
    \n局部变量在函数开始时创建，函数结束时从内存中删除。由于作用域的存在，相同的变量可以在不同的作用域（例如不同的函数）中使用。这很重要，因为作用域通过确保变量不会与其他函数冲突，从而使函数可以复用。\n\
    \n```javascript\nfunction square (n) {\n  var total = n * n;\n  //局部变量仅在\n  //函数内部可用\n\
    \  document.write(total);\n}\n\nsquare(10);//100\n```\n\n#### 全局变量\n未使用 `var`\
    \ 关键字设置的变量是全局变量，即使定义在函数内部也是如此。全局变量可以在函数可以使用。在函数外部创建的变量是全局，无论是否使用 `var` 声明。网页上的任何脚本或函数都可以访问全局变量。当网页关闭时，全局变量将从内存中删除。\n\
    \n```javascript\n//定义在函数外部时为全局\nvar x = 10;\nfunction square (n) {\n  //全局变量与其他变量冲突\n\
    \  total = n * n;\n}\n\nsquare(x);\ndocument.write(total);//100\n```\n\n#### 函数作用域\n\
    JavaScript 还有函数作用域。函数可以嵌套，内部函数只能在其父函数内部调用。\n\n```javascript\nfunction outer ()\
    \ {\n  document.write(\"outer function\");\n  function inner () {\n    document.write(\"\
    inner function\");\n  }\n  //父函数必须调用内部函数\n  inner();\n}\n\n// 也必须调用外部函数\nouter();\n\
    ```\n\n## 函数参数 (Function Arguments)\n\n函数没有为参数或参数指定数据类型，也不检查传递的参数数量。\n\n### 设置默认参数\n\
    如果调用函数时缺少参数，它们将被设置为 `undefined`。可以对参数的存在性进行测试，并在缺失时将其设置为默认值。如果在调用函数时传递了这些参数，则默认值将被覆盖。能够将参数设置为默认值允许你创建可选参数。\n\
    \n通常，你必须将 `undefined` 作为可选参数传递设置默认值。\n\n```javascript\n//demo6-2.html\nfunction\
    \ fullName (fName, mName, lName) {\n  if (!mName) {\n    document.write(fName,\
    \ \" \", lName);\n  } else {\n    document.write(fName, \" \", mName, \" \", lName);\n\
    \  }\n}\n\nfullName(\"John\", undefined, \"Public\"); //John Public\n```\n\n如果可选参数是最后一个，则可以省略它。\n\
    \n```javascript\n//demo6-3.html\nfunction fullName (fName, lName, mName) {\n \
    \ if (!mName) {\n    document.write(fName, \" \", lName);\n  } else {\n    document.write(fName,\
    \ \" \", mName, \" \",  lName);\n  }\n}\n\nfullName(\"John\", \"Public\");//John\
    \ Public\n//中间名是最后一个参数\nfullName(\"John\", \"Public\", \"Q\");//John Q Public\n\
    ```\n\n#### 练习 6-2 创建一个带有可选参数的函数\n为函数中的可选参数设置默认值。\n\n使用你的编辑器，创建一个名为 `exercise6-2.js`\
    \ 的文件。\n\n将文件保存到 `/Lesson 6/Exercises/js`。\n\n创建一个接受三个参数的函数：名字、中间名和姓氏。中间名是可选的，如果他们没有提供中间名，你将其显示为\
    \ \"NMN\"（意为没有中间名）。\n\n使用硬编码参数测试该函数。\n\n在 `/Lesson 6/Exercises/exercise6-2.html`\
    \ 中引用该文件并测试。\n\n### arguments 和 this 属性\n当函数被调用时，它可以访问它自己的参数、它的 `arguments` 对象以及它的\
    \ `this` 属性。`arguments` 是一个类数组对象，包含了调用函数时传递的所有参数。`this` 是指向该函数所属方法的对象的引用。在创建对象或处理事件处理程序时，它非常有用。我们将在后面的课程中看到它的用法。\n\
    \n遍历 `arguments` 对象是使参数可选的另一种方法。事实上，留空参数列表即可使参数可选。\n\n```javascript\n//demo6-4.html\n\
    // 参数列表为空\nfunction sum () {\n  var x;\n  var sum = 0;\n  // arguments 是类数组\n\
    \  var argLen = arguments.length;\n  for (x = 0; x < argLen; x++){\n    sum +=\
    \ arguments[x];\n  }\n  return sum;\n}\n\ndocument.write(sum(23, 4, 100));//127\n\
    ```\n\n#### 练习 6-3 使用 arguments 对象\n创建一个使用 `arguments` 对象计算参数平均值和最大值的函数。\n\n使用你的编辑器，创建一个名为\
    \ `exercise6-3.js` 的文件。\n\n将文件保存到 `/Lesson 6/Exercises/js`。\n\n创建一个接受任意数量数字参数并计算平均值的函数。提示：使用\
    \ `arguments` 属性获取总和。\n\n在 `/Lesson 6/Exercises/exercise6-3.html` 中添加引用并使用硬编码数字测试该函数。\n\
    \n创建另一个确定最大值的函数。提示：初始将最大值变量设置为 0，并与每个数字进行比较。如果参数中的数字大于该变量，它就是新的最大值。\n\n由于 JavaScript\
    \ 中的所有数字都大于 `-Infinity`，将最大值变量的初始值更改为该值。\n\n使用硬编码数字测试该函数。\n\n## 第 7 课：正则表达式 (Regular\
    \ Expressions)\n单元时间：75 分钟\n\n在本节中，你将学习：\n\n### 构建正则表达式\n正则表达式是用于匹配字符串中字符组合的模式。多种编程、脚本和标记语言（包括\
    \ XML 和 HTML5）都可以实现正则表达式，且语法是相同的。JavaScript 正表达式是一个对象。在 JavaScript 中，正则表达式对于验证表单数据非常有用。\n\
    \n可以通过两种方式构建正则表达式。正则表达式字面量是正则表达式之间的模式。字面量正则表达式在脚本加载时编译。如果正则表达式在整个脚本过程中不会更改，字面量正则表达式提供更好的性能。\n\
    \n```javascript\nvar re = /abc/\n```\n\n另一种方法是使用 `RegExp` 对象的构造函数。构造函数提供了正则表达式的运行时编译。如果正则表达式将更改，或者模式来自其他来源（例如用户输入），请使用这种。\n\
    \n```javascript\nvar re = RegExp(\"abc\");\n```\n\n#### 创建模式\n模式无论是常量还是 RegExp\
    \ 对象都可以简单的字面字符字符串。\n\n```javascript\n//查找子字符串 the\n//匹配 the, theater, soothe\n\
    var re = /the/;\n```\n"
- fmt: "\nA regular expression pattern can be made more powerful by putting together\
    \ special metacharacters. Metacharacters are characters with a special meaning.\n\
    \n`/.the/;` //`dot` is wildcard, can be any single character\n\n// matches `!the`,\
    \ or `sthe`, or `%the`, etc.\n\nThe pattern can take quantifiers that further\
    \ modify the metacharacters.\n\n`/.+the/;` //at least one any character before\
    \ the`\n\nBackslashes are used to either escape characters and make them literal,\
    \ or to create metacharacters. \n\n`/\\.html/;` //backslash makes `dot` literal\n\
    \n## Special Characters\n\nA backslash before a special character indicates that\
    \ it is interpreted literally. There are also several special characters created\
    \ within a regular expression by putting a backslash in front of a normal character.\n\
    \n`\\d` represents a digit, and `\\D` represents a non-digit.\n\n//matches `12345-1234`\n\
    \n//matches `12345 1234`\n\n`/\\d\\d\\d\\d\\d\\D\\d\\d\\d\\d/;`\n\n`\\s` represents\
    \ a whitespace character including space, tab and newline. `\\S` represents a\
    \ non-whitespace character. \n\n`\\w` represents numbers, letters and underscore.\
    \ `\\W` represents a non-alphanumeric character. \n\nAs seen before, the `dot`\
    \ is a wildcard for any single character, except the newline character.\n\n##\
    \ Quantifiers\n\nQuantifiers are characters that go after special characters and\
    \ indicate how many times that type of character appears. The quantifier can indicate\
    \ a minimum and/or maximum.\n\n`/\\d{5}/;` //5 digits\n\n`/\\d{5,9}/;` //5 to\
    \ 9 digits\n\n`/\\d{5,}/;` //minimum of 5 digits\n\n`/\\d{,9}/;` //maximum of\
    \ 9 digits\n\nThere are shortcuts for some quantifiers.\n\n*   `+` is short for\
    \ one or more and can be written `{1,}`\n*   `*` is short for zero or more and\
    \ can be written `{0,}`\n*   `?` is short for zero or one and can be written `{0,1}`\n\
    \n`var re = /\\d{5}-?\\d{4}/;` //has 0 or 1 hyphen\n\n## Anchors\n\nAnchors are\
    \ used to indicate the beginning and end of a phrase.\n\n`^` indicates the beginning\
    \ of a phrase.\n\n//starts \"the\", matches \"theater\", \"the\"\n`/^the/;`\n\n\
    `$` is used for end of a phrase.\n\n//ends \"the\", matches \"soothe\", \"the\"\
    \n`/the$/;`\n\n`^` and `$` are used to match an exact phrase or limit how many\
    \ characters a phrase can be\n\n//matches \"the\" and only \"the\"\n`/^the$/`\n\
    \nThe phrase boundaries can help quantifiers.\n\n//matches 5 digits in a row\n\
    \n//could have more than 5 characters\n`/\\d{5}/;`\n\n//only 5 digits, no more,\
    \ no less\n`/^\\d{5}$/;`\n\n## Ranges\n\nSquare braces `[]` are used to create\
    \ a list or range. One of the characters must appear in the string.\n\n`[]` is\
    \ used for a character set or character class. Matches any one character or character\
    \ type in braces.\n\n`/[abc]/;` //matches `a`, `b` or `c`\n\n`/[abc]+/;` //matches\
    \ 1 or more of `a`, `b`, and/or `c`\n\nA range of characters can be specified\
    \ with a hyphen inside braces.\n\n`/[0-9]/;` //digit, same as `\\d`\n\n`/[a-z]/;`\
    \ //case-sensitive, lowercase letter\n\nRanges can also be listed in any order.\n\
    \n`/[a-zA-Z0-9]/;` //letters and numbers\n\n`/[a-zA-Z0-9_]/;` //same as `\\w`\n\
    \nCharacters that have a special meaning must be escaped with backslash if they\
    \ are literal.\n\n//letters, numbers, punctuation\n`/[a-zA-Z0-9!\\?\\.]/;`\n\n\
    The braces can take special escaped characters.\n\n`/[\\w\\s!\\?\\.]/;`\n\nThe\
    \ character set can be negated with `^` inside square brackets, not to be confused\
    \ with the starting string character outside square brackets. One character that\
    \ is not in the list must appear in the string.\n\n//any single character but\
    \ lowercase `a`, `b` or `c`\n`/[^abc]/;`\n\n`/[^0-9]/;` //any non-digit, same\
    \ as `\\D`\n\n`/[^a-zA-Z0-9]/;` //any non-alphanumeric\n\n//starts with non-digit,\
    \ same as `/^\\D/`\n`/^[^0-9]/;`\n\n## Modifiers\n\nModifiers go outside the forward\
    \ slashes. The `i` flag makes the list case-insensitive and the `g` creates a\
    \ global search.\n\n`/[a-z]/i;` //case-insensitive\n\n`/[a-zA-Z]/;`\n\nThe global\
    \ modifier is helpful for search and replace, which we will see later.\n\n`/[a-zA-Z]/g;`\
    \ //globally searches\n\n`/[a-zA-Z]/;` //finds once\n\nModifiers can be nested.\n\
    \n`/[a-z]/ig;` //case-insensitive global search\n\nThe pipe `|` character is used\
    \ as an \"or\" between whole strings to match.\n\n//matches `bet`, `get`, `met`\
    \ or `net`\n\n//does not match `let`\n`/bet|get|met|net/;`\n\n`/[bgmn]et/;;` //same\
    \ matches as above\n\n### Using Parentheses to Match Substrings\n\nParentheses\
    \ create a group. The group can be quantified or used in a backreference. A backreference\
    \ matches the same text as was previously matched in a capturing group, and is\
    \ explained in more detail later.\n\n// s is optional, starts http or https\n\n\
    //forward slashes must be escaped\n`/^https?:\\/\\//;`\n\n//the whole group of\
    \ characters is optional\n`/^(https?:\\/\\/)?/;`\n\n## Applying Regular Expression\
    \ Methods\n\nThere are two regular expression methods that take strings as arguments\
    \ for comparison.\n\n### Regular Expression Method exec()\n\n`exec()` is a regular\
    \ expression method that searches for a match and returns an array or null. \n\
    \n//demo7-1\n`var phNum = \"abc123\";`\n`var re = /\\d{10}/;` //number is exactly\
    \ 10 digits\nif (!re.exec(phNum)){\n\ndocument.write(\"bad number\");\n\n} else\
    \ {\n\ndocument.write(\"good number\");}\n\n### Regular Expression Method test()\n\
    \n`test()` is a regular expression method that tests for a match in a string and\
    \ returns true or false. It is faster than `exec()`.\n\n`var phNum = \"123-456-7890\"\
    ;`\n`var re = /\\d+/g;` //looks for at least one more numbers\nif (re.test(phNum)){\n\
    \ndocument.write(\"good number\");\n\n//it has at least one number so it would\
    \ pass\n\n}else{\n\ndocument.write(\"bad number\"););}\n\n## Using Regular Expressions\
    \ in String Methods\n\nThere are four string methods that take regular expressions\
    \ as arguments for comparison.\n\n### String Method match()\n\n`match()` is a\
    \ string method that searches a string for a match. It returns an array or null.\n\
    \n//demo7-3\n`var phNum = \"(123) 456 - 7890\";`\n\n//one or more digit, global\
    \ search (finds all matches)\n`var re = /\\d+/g;`\nif (arrMatch = phNum.match(re)){\n\
    \n//every match will be put in an array\ndocument.write(\"good phone number<br>\"\
    );\nvar phone = \"area code \" + arrMatch[0] +\n\n\", prefix \" + arrMatch[1]\
    \ +\n\n\", last four digits \" + arrMatch[2];\n\ndocument.write(phone, \"<br>\"\
    );\n\n} else {\n\ndocument.write(\"bad phone number<br>\");\n\n}\n\n### String\
    \ Method search()\n\n`search()` tests for a match in a string and returns the\
    \ zero-based index of the match or -1 if no match is found.\n\n//demo7-4\n`var\
    \ phNum = \"1234567890\";`\n\n//number that is exactly 10 digits\n`var re = /^\\\
    d{10}$/;`\nif (phNum.search(re) != -1){\n\ndocument.write(\"good phone number\"\
    );\n\n} else {\n\ndocument.write(\"bad phone number\");\n\n}\n\n### String Method\
    \ replace()\n"
  raw: 'A regular expression pattern can be made more powerful by putting together
    special metacharacters.  Metacharacters are characters with a special meaning. 


    /.the/; //dot is wildcard, can be any single character


    // matches !the, or sthe, or %the, etc.


    The pattern can take quantifiers that further modify the metacharacters. 


    /.+the/; //at least one any character before the


    Backslashes are used to either escape characters and make them literal, or to
    create metacharacters. 


    /\.html/; //backslash makes dot literal


    Special Characters


    A backslash before a special character indicates that it is interpreted literally.
    There are also several special characters created within a regular expression
    by putting a backslash in front of a normal character.


    \d represents a digit, and \D represents a non-digit.


    //matches 12345-1234


    //matches 12345 1234


    /\d\d\d\d\d\D\d\d\d\d/;


    \s represents a whitespace character including space, tab and newline. \S represents
    a non-whitespace character.


    \w represents numbers, letters and underscore. \W represents a non-alphanumeric
    character. 


    As seen before, the dot is a wildcard for any single character, except the newline
    character.


    Quantifiers


    Quantifiers are characters that go after special characters and indicate how many
    times that type of character appears. The quantifier can indicate a minimum and/or
    maximum.


    /\d{5}/;//5 digits


    /\d{5,9}/;//5 to 9 digits


    /\d{5,}/;//minimum of 5 digits


    /\d{,9}/;//maximum of 9 digits


    There are shortcuts for some quantifiers.


    + is short for one or more and can be written {1,}


    * is short for zero or more and can be written {0,}


    ? is short for zero or one and can be written {0,1}


    var re = /\d{5}-?\d{4}/;//has 0 or 1 hyphen


    Anchors


    Anchors are used to indicate the beginning and end of a phrase.


    ^ indicates the beginning of a phrase.


    //starts "the", matches "theater", "the"


    /^the/;


    $ is used for end of a phrase.


    //ends "the", matches "soothe", "the"


    /the$/;


    ^ and $ are used to match an exact phrase or limit how many characters a phrase
    can be


    //matches "the" and only "the"


    /^the$/


    The phrase boundaries can help quantifiers.


    //matches 5 digits in a row


    //could have more than 5 characters


    /\d{5}/;


    //only 5 digits, no more, no less


    /^\d{5}$/;


    Ranges


    Square braces ([]) are used to create a list or range. One of the characters must
    appear in the string.


    [] is used for a character set or character class. Matches any one character or
    character type in braces.


    /[abc]/;//matches a, b or c


    /[abc]+/;//matches 1 or more of a, b, and/or c


    A range of characters can be specified with a hyphen inside braces.


    /[0-9]/;//digit, same as \d


    /[a-z]/;//case-sensitive, lowercase letter


    Ranges can also be listed in any order.


    /[a-zA-Z0-9]/;//letters and numbers


    /[a-zA-Z0-9_]/;//same as \w


    Characters that have a special meaning must be escaped with backslash if they
    are literal.


    //letters, numbers, punctuation


    /[a-zA-Z0-9!\?\.]/;


    The braces can take special escaped characters.


    /[\w\s!\?\.]/;


    The character set can be negated with ^ inside square brackets, not to be confused
    with the starting string character outside square brackets. One character that
    is not in the list must appear in the string.


    //any single character but lowercase a, b or c


    /[^abc]/;


    /[^0-9]/; //any non-digit, same as \D


    /[^a-zA-Z0-9]/; //any non-alphanumeric


    //starts with non-digit, same as /^\D/


    /^[^0-9]/;


    Modifiers


    Modifiers go outside the forward slashes. The i flag makes the list case-insensitive
    and the g creates a global search.


    /[a-z]/i; //case-insensitive


    /[a-zA-Z]/;


    The global modifier is helpful for search and replace, which we will see later.


    /[a-zA-Z]/g; //globally searches


    /[a-zA-Z]/; //finds once


    Modifiers can be nested.


    /[a-z]/ig; //case-insensitive global search


    The pipe (|) character is used as an "or" between whole strings to match.


    //matches bet, get, met or net


    //does not match let


    /bet|get|met|net/;


    /[bgmn]et/; //same matches as above


    #### Using Parentheses to Match Substrings


    Parentheses create a group. The group can be quantified or used in a backreference.
    A backreference matches the same text as was previously matched in a capturing
    group, and is explained in more detail later.


    // s is optional, starts http or https


    //forward slashes must be escaped


    /^https?:\/\//;


    //the whole group of characters is optional


    #### /^(https?:\/\/)?/;


    Applying Regular Expression Methods


    There are two regular expression methods that take strings as arguments for comparison.


    #### Regular Expression Method exec()


    exec() is a regular expression method that searches for a match in a string and
    returns an array or null.


    //demo7-1.html


    var phNum = "abc123";


    var re = /^\d{10}$/; //string with exactly 10 digits


    //use ! to test if returns null


    if (!re.exec(phNum)){


    document.write("bad phone number");


    } else {


    document.write("good phone number");


    }


    If the match succeeds, exec() returns an array and updates properties of the regular
    expression object. Element zero of the returned array contains the entire match.
    Elements 1 and higher contain submatches within the match. The index property
    of the result returns the index of the first match, and the input property returns
    the original string.


    Properties of the regular expression include lastIndex, the point at which to
    start the next match. This is zero unless there is a global flag. ignoreCase and
    global indicate whether the case-insensitive (i) and global (g) flags are set.
    source is the text rendition of the pattern.


    //demo7-2.html


    var re = /quick\s(brown).+(jumps)/ig;


    //looks for the word quick followed by a space then //the word brown followed
    by one or more wild card //characters, followed by jumps.  Case insensitive //global
    search


    var str = "The Quick Brown Fox Jumps Over The Lazy Dog";


    var result = re.exec(str);


    //whole match


    document.write(result[0], "<br>");


    //Parenthesized match


    document.write(result[1], "<br>");


    //Parenthesized match 2


    document.write(result[2], "<br>");


    //Index number of match


    document.write(result.index, "<br>");


    //Original string


    document.write(result.input, "<br>");


    // Start next match, 25 (0 if global flag not used)


    document.write(re.lastIndex, "<br>");


    //Case-insensitive?


    document.write(re.ignoreCase, "<br>");


    //Global search?


    document.write(re.global, "<br>");


    //Pattern


    document.write(re.source, "<br>");


    #### Regular Expression Method test()


    test() is a regular expression method that tests for a match in a string and returns
    true or false. It is faster than exec().


    var phNum = "123-456-7890";


    var re = /\d+/g;//looks for at least one or more numbers


    if (re.test(phNum)){


    document.write("good phone number");


    //it has at least one number so it would pass


    }else{


    document.write("bad phone number");


    }


    Using Regular Expressions in String Methods


    There are four string methods that take regular expressions as arguments for comparison.


    #### String Method match()


    match() is a string method that searches a string for a match. It returns an array
    or null.


    //demo7-3.html


    var phNum = "(123) 456 - 7890";


    //one or more digit, global search (finds all matches)


    var re = /\d+/g;


    if (arrMatch = phNum.match(re)){


    //every match will be put in an array


    document.write("good phone number<br>");


    var phone = "area code " + arrMatch[0] +


    ", prefix " + arrMatch[1] +


    ", last four digits " + arrMatch[2];


    document.write(phone, "<br>");


    } else {


    document.write("bad phone number<br>");


    }


    #### String Method search()


    search() tests for a match in a string and returns the zero-based index of the
    match or -1 if no match is found.


    //demo7-4.html


    var phNum = "1234567890";


    //number that is exactly 10 digits


    var re = /^\d{10}$/;


    if (phNum.search(re) != -1){


    document.write("good phone number");


    } else {


    document.write ("bad phone number");


    }


