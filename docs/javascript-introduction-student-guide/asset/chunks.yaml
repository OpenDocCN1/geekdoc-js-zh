- fmt: "\nJavaScript uses two C-style comments, the single-line and multi-line block.\
    \ Comments can be used for debugging or to document code. Single-line comments\
    \ are two slashes (`//`) and comment out until the end of the line. Multi-line\
    \ comments are between `/* */`. A best practice is to use multi-line comments\
    \ only for author and license information. \n\n### Data Types\n\nJavaScript has\
    \ primary/primitive data type, `number`, `string` and `Boolean`. It has two special\
    \ types, `null` and `undefined`. It has two composite types, `array` and `object`,\
    \ that can be made up of primitive values or other composite values. There are\
    \ special types of objects such as `functions`, `RegExp` and `Date()`. Since JavaScript\
    \ has dynamic types, a variable can be of different types through a script. The\
    \ `typeof` operator can help determine a value’s data type.\n\n```\nvar x = 10;\
    \ //x is a number\nalert(typeof x);\n\nvar y = x + 20; //30, adds because of type\n\
    alert(typeof y);\n\nvar x = \"User\"; //x is a string\nalert(typeof x);\n\nvar\
    \ y = x + 1; //User1, concatenates because of type\nalert(typeof y);\n```\n\n\
    ### Numeric Variables\n\nIn JavaScript, numeric values can be integers (whole\
    \ numbers) or floats. Large numbers can be created with `\"e\"` followed by the\
    \ exponent of the number. \n\n```\n10e2 //10 times 10 to the power of 2 is 1000\n\
    ```\n\nInteger calculations are precise up to the number 9 quadrillion. Calculations\
    \ with floats are not always precise, so they should be treated as an approximation.\n\
    \nThe `toPrecision()` method formats a number to a specified length.  It takes\
    \ a number of significant digits as its argument and can be used to obtain a more\
    \ user-friendly number. The argument is the total number of digits before and\
    \ after the decimal.\n\n`toFixed()` takes a number and converts it to the specified\
    \ number of digits after the decimal place. \n\n### Arithmetic Operators\n\nThe\
    \ arithmetic operators are multiplication (`*`) division (`/`), addition (`+`)\
    \ and subtraction (`-`). There is also a modulo operator (`%`) that returns the\
    \ remainder. Multiplication, division and modulo take precedence over addition\
    \ and subtraction. As in mathematics, operator precedence can be changed with\
    \ parentheses.\n\n```\nx % y //returns remainder of dividing x by y\n```\n\nThe\
    \ plus sign (`+`) is overloaded so it can be used for addition and string concatenation.\
    \ If any operands are string, the plus sign acts as concatenation.\n\n### Functions\n\
    \nThere are three functions for converting strings to a number type. They can\
    \ be used to ensure addition rather than concatenation. Each is briefly explained.\n\
    \n`parseInt()` will search a string for an integer at the beginning.\n```\nparseInt(\"\
    2\"); //returns 2\nparseInt(\"2.5\"); //returns 2\n```\n\n`parseFloat()` will\
    \ search a string for a float at the beginning.\n```\nparseFloat(\"2.5\"); //returns\
    \ 2.5\nparseFloat(\"4.5%\"); //returns 4.5\n```\n\n`Number()` will attempt to\
    \ convert a value to a number. If it cannot, it returns `NaN` (not a number).\n\
    ```\nNumber(\"2\"); //returns NaN\nNumber(\"\"); //returns 0\n```\n\nWhen `+`\
    \ (plus) appears before a value, it converts a string to a number equivalent to\
    \ `Number()` function.\n```javascript\n+\"100\" //returns 100 as a number\nx =\
    \ -20;\ny = -x //y is negative 20\n```\n\nJavaScript has three special values\
    \ that fall under number type but don’t act like numbers: `Infinity`, `-Infinity`\
    \ (negative) and `NaN` (\"not a number\"). In many languages, division by zero\
    \ leads to error, but in JavaScript it returns `Infinity`, `-Infinity` or `NaN`.\n\
    \n### String Variables\n\nStrings are text or a string of characters. A person’s\
    \ phone number or zip code might contain numbers, but the data type will be string.\
    \ Strings must always be delimited by quotes, but doesn’t matter whether these\
    \ are single or double quotes. Because of JavaScript’s flexibility, a value can\
    \ be turned into string by enclosing it in quotes. A newline can be added to a\
    \ string literally with backslash (`\\`). Characters such as newline or tab will\
    \ display in `alert()`, `prompt()` and `confirm()` but not in `console`.\n\n```javascript\n\
    alert(\"This is one line.\\nThis is another line.\");\nalert(\"These are \\t delimited\"\
    );\n```\n\nThe `+` operator concatenates strings, taking two or more strings and\
    \ making them into one. Strings must always in quotes, but identifiers such as\
    \ variables, object names and array names must not be. The string data type has\
    \ property and several methods that will be explored later.\n\n### Exercise 1-2\
    \ Number and string types\n\nThis exercise will allow you to explore the data\
    \ types you have reviewed. You can complete these using the JavaScript `console`\
    \ as command line.\n\n- Experimenting with plus sign, type `\"3\" + 3`. What was\
    \ returned and why?\n- Add `0.4 + 0.2`. Was the answer what you expected?\n- Try\
    \ `0.4 + 0.2` with the `toPrecision()` method. Set `num = 0.4 + 0.2`, then use\
    \ `num.toPrecision(1)`.\n- Set `num` to `100`. What does `num.toFixed(2)` do?\n\
    - Use the modulo for `4 % 2`, `4 % 3` and `3 % 4`. Is the result what you expected?\
    \ How could you use this?\n- Look at the difference between the `Number()` and\
    \ `parseInt()` functions by passing the string `\"3\"` and then by passing empty\
    \ string `\"\"`.\n- Set `var x = 12 / 0;` and see what `x` returns. What is the\
    \ data type? Hint: use `typeof x`. Now do the same with `0 / 0`.\n- Use `alert()`\
    \ to print \"hello world\" with a newline between the two words. Hint: start with\
    \ `alert(\"hello world\")`.\n\n### Boolean Variables\n\nThe two values of Boolean\
    \ type are `true` and `false`. Note that `\"true\"` or `\"false\"` in quotes are\
    \ strings, not Boolean. The purpose of comparison and logical operators is to\
    \ return a Boolean value.\n\nComparison operators are greater than (`>`), less\
    \ than (`<`), greater than or equal to (`>=`), less than or equal to (`<=`), equal\
    \ to (`==`), not equal (`!=`), strictly identical (`===`) and not strictly identical\
    \ (`!==`).\n\nIn an equal to (`==`) or not equal (`!=`) test, operands are tested\
    \ by value. In an identity test (`===` or `!==`), operands are tested by value\
    \ and type. Be sure to use `==` or `===` for comparison rather than a single equal\
    \ sign as that is for assignment. \n\n```javascript\n4 == \"4\"; //true, same\
    \ value\n4 === \"4\"; //false, not same type\n```\n\nJavaScript has three logical\
    \ operators, and (`&&`), or (`||`) and not (`!`). They are often used with comparison\
    \ operators. All sides must be true for `&&` to return true. Only one side must\
    \ be true for `||` to return true. Use the logical not (`!`) operator to reverse\
    \ logic.\n\nOperator precedence determines in which order operators are evaluated.\
    \ Comparison operators are before logical operators in the order of operations.\
    \ The logical and (`&&`) takes precedence over the logical or (`||`), and the\
    \ logical not (`!`) takes precedence over both. Parentheses are not necessary,\
    \ but can make code easier to read. Comparison and logical operators are often\
    \ used in `if` statements.\n\n`&&` and `||` can be used for short-circuit evaluation.\n\
    \n```javascript\n//assigns \"anonymous\" if fName not defined\n//fName must be\
    \ declared for this to work\nvar fName;\nuser = fName || \"anonymous\"\nfName\
    \ && alert(\"Hi \" + fName);\n```\n"
  raw: 'JavaScript uses two C-style comments, the single-line and multi-line block.
    Comments can be used for debugging or to document code. Single-line comments are
    two slashes (//) and comment out until the end of the line. Multi-line comments
    are between /* */. A best practice is to use multi-line comments only for author
    and license information. 


    #### Data Types


    JavaScript has primary/primitive data type, number, string and Boolean. It has
    two special types, null and undefined. It has two composite types, array and object,
    that can be made up of primitive values or other composite values. There are special
    types of objects such as functions, RegExp and Date(). Since JavaScript has dynamic
    types, a variable can be of different types through a script. The typeof operator
    can help determine a value’s data type.


    var x = 10; //x is a number


    alert(typeof x);


    var y = x + 20; //30, adds because of type


    alert(typeof y);


    var x = "User"; //x is a string


    alert(typeof x);


    var y = x + 1; //User1, concatenates because of type


    alert(typeof y);


    #### Numeric Variables


    In JavaScript, numeric values can be integers (whole numbers) or floats. Large
    numbers can be created with "e" followed by the exponent of the number. 


    10e2 //10 times 10 to the power of 2 is 1000


    Integer calculations are precise up to the number 9 quadrillion. Calculations
    with floats are not always precise, so they should be treated as an approximation.


    The toPrecision() method formats a number to a specified length.  It takes a number
    of significant digits as its argument and can be used to obtain a more user-friendly
    number. The argument is the total number of digits before and after the decimal.


    toFixed() takes a number and converts it to the specified number of digits after
    the decimal place. 


    Arithmetic Operators


    The arithmetic operators are multiplication (*) division (/), addition (+) and
    subtraction (-). There is also a modulo operator (%) that returns the remainder.
    Multiplication, division and modulo take precedence over addition and subtraction.
    As in mathematics, operator precedence can be changed with parentheses.


    x % y //returns remainder of dividing x by y


    The plus sign (+) is overloaded so it can be used for addition and string concatenation.
    If any of the operands are a string, the plus sign acts as concatenation.


    Functions


    There are three functions for converting strings to a number data type.  They
    can be used to ensure addition rather than concatenation. Each is briefly explained
    below. 


    parseInt() will search a string for an integer at the beginning,


    parseInt("2 apples"); //returns 2


    parseInt("2.5 apples"); //returns 2


    parseFloat() will search a string for a float at the beginning.


    parseFloat("2.5 apples"); //returns 2.5


    parseFloat("4.5%"); //returns 4.5


    parseFloat("$2"); //returns NaN


    Number() will attempt to  convert a value  to a number.  If it cannot, it returns
    NaN (not a number).


    Number("2 apples"); //returns NaN


    Number(""); //returns 0


    When the + (plus) appears before a value, it converts a string to a number equivalent
    to the Number() function. The – operator negates a value.


    +"100" //returns 100 as a number


    x = -20 //x is negative 20


    y = -x //y is negative x, 20


    JavaScript has three special values that fall under the number data type but don’t
    act like other numbers: Infinity, -Infinity (negative Infinity) and NaN ("not
    a number"). In many languages, division by zero leads to an error, but in JavaScript
    it returns Infinity, –Infinity or NaN.


    #### String Variables


    Strings are text or a string of characters. A string may contain numbers. A person’s
    phone number or zip code might contain numbers, but the data type will be a string.
    Strings must always be delimited by quotes, but it doesn’t matter whether these
    are single or double quotes until they are nested. Because of JavaScript’s flexibility,
    a value can be turned into a string by enclosing it in quotes. 


    A newline can’t be added to a string literally with the return key. Characters
    such as newline or tab can be created using the C-style backslash (\). The backslash
    must be used inside quotes. The newline and tab will display in alert(), prompt()
    and confirm() but not in the browser or console.


    alert("This is one line.\nThis is another line.");


    alert("These are \t tab delimited");


    The + operator concatenates strings, taking two or more strings and making them
    into one string. Strings must always be in quotes, but identifiers such as variables,
    object names and array names must not be.


    The string data type has a property and several methods that will be explored
    later.


    #### Exercise 1-2 Number and string data types


    This exercise will allow you to explore the data types you have just reviewed. 
    You can complete these using the JavaScript console as a command line.


    Experimenting with the plus sign, type "3" + 3\. What was returned and why?


    Add 0.4 + 0.2\. Was the answer what you expected?


    Try 0.4 + 0.2 with the toPrecision() method. Set num = 0.4 + 0.2, then use num.toPrecision(1).


    Set num to 100\. What does num.toFixed(2) do?


    Use the modulo for 4 % 2, 4 % 3 and 3 % 4\. Is the result what you expected? How
    could you use this?


    Look at the difference between the Number() and parseInt() functions by passing
    the string "3 apples" and then by passing empty string "".


    Set var x = 12 / 0; and see what x returns. What is the data type? Hint: use typeof
    x. Now do the same with 0 / 0.


    Use alert() to print "hello world" with a newline in between the two words. Hint:
    start with alert("hello world").


    #### Boolean Variables


    The two values of Boolean type are true and false. Note that "true" or "false"
    in quotes are strings, not Boolean. The purpose of comparison and logical operators
    is to return a Boolean value.


    Comparison operators are greater than (>), less than (<), greater than or equal
    to (>=), less than or equal to (<=), equal to (==), not equal to (!=), strictly
    identical to (===) and not strictly identical to (!==).


    In an equal to (==) or not equal to (!=) test, operands are tested by value. In
    an identity test (=== or !==), operands are tested by value and type. Be sure
    to use == or === for comparison rather than a single equal sign as that is for
    assignment.   


    4 == "4"; //true, same value


    4 === "4"; //false, not same type


    JavaScript has three logical operators, and (&&), or (||) and not (!). They are
    often used with comparison operators. All sides must be true for && to return
    true. Only one side must be true for || to return true. Use the logical not (!)
    operator to reverse logic.


    Operator precedence determines in which order operators are evaluated. Comparison
    operators are before logical operators in the order of operations. The logical
    and (&&) takes precedence over the logical or (||), and the logical not (!) takes
    precedence over both. Parentheses are not necessary, but can make code easier
    to read. Comparison and logical operators are often used in if statements.


    && and || can be used for short-circuit evaluation.


    //assigns "anonymous" if fName not defined


    //fName must be declared for this to work


    var fName;


    user = fName || "anonymous"


    fName && alert("Hi " + fName);


    #### Other Basic Data Types


    The other two primitive data types in addition t o string, number and Boolean
    are undefined and null.


    undefined describes any variable that has been declared but not assigned a value


    var x;


    typeof x; //undefined


    In contrast to undefined, null is an assignment value. It is a literal representing
    an empty value.


    var y = null;


    ## Built-in Objects


    Object is a complex data type.  Objects can hold different types of data such
    as strings, numbers, and even methods that have certain functionalities. For example,
    JavaScript has a few built-in objects including Array, Math and Date()all of which,
    have predefined uses. Arrays will be covered in more detail later. See below for
    details on the Math and Date() objects. 


    #### Math'
